findings:
  - id: F1
    basis: AC3
    action: CODE_FIX
    location: src/aios_renew/operator.py
    issue: >
      PRIMARY and REPAIR failure wrappers still infer ownership of the current
      invocation's RUN by snapshotting the global runs directory before execution
      and diffing it after the inner repository lock has unwound. Another process
      can create a foreign RUN in that gap, causing the current post-admission
      failure/observation to be suppressed when multiple new files are seen, or a
      pre-RUN failure to claim a foreign RUN when it is the only new file. This is
      the same ownership class already eliminated for REMEDIATION by binding an
      invocation-local run_path.
    expected: >
      Bind the exact RUN path owned by each PRIMARY and REPAIR invocation at RUN
      creation and use only that bound path for post-admission FAILURE and
      RUN_OBSERVATION persistence. Foreign RUN creation must neither suppress nor
      steal the current invocation's terminal operational state. Add deterministic
      regression tests for PRIMARY and REPAIR race interleavings without widening
      TASK-046 semantics or changing canonical contracts.
