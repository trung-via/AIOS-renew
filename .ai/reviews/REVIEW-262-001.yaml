- id: FINDING-262-001
  basis: AC2
  action: CODE_FIX
  location: .github/workflows/aios-terminal-attention.yml and focused H4A2 workflow
    regressions
  issue: The new local-chat wake job is gated on needs.admit-and-notify.result ==
    'success'. That job contains canonical terminal admission plus unrelated downstream
    Issue notification and wake-source artifact/export steps. If exact terminal admission
    succeeds but Issue creation, selector writing, or artifact export fails afterward,
    the job result is failure and the local-chat wake is skipped. TASK-262 r2 requires
    the production wake wiring to originate after successful canonical terminal-attention
    admission; unrelated legacy/observability transport failure must not suppress
    an otherwise admitted local wake.
  expected: Bind local-chat-wake eligibility to the exact successful terminal admission
    outputs/status rather than success of the entire mixed admit-and-notify job, while
    preserving fail-closed behavior when admission itself is absent/failed/ambiguous.
    Keep terminal attention permissions at contents:read plus issues:write, preserve
    the existing Issue/artifact path as independent observability, and add deterministic
    regressions proving post-admission notification/artifact failure cannot suppress
    an admitted local wake while admission failure cannot trigger one.
