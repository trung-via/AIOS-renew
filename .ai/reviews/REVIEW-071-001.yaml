findings:
  - id: F1
    basis: AC1
    action: CODE_FIX
    location: src/aios_renew/operator.py
    issue: >
      Canonical remote namespace validation accepts task-bound RUN identities with a
      numeric suffix of three or more digits, but next_run_id() still parses local and
      reserved RUN ids using exactly three digits. Once canonical history reaches
      RUN-<TASK>-1000, that valid remote reservation is ignored by the allocator. With
      RUN-<TASK>-001 through RUN-<TASK>-1000 present remotely and fresh/empty local
      Runtime state, the recognized maximum remains 999 and next_run_id() returns the
      already-canonical RUN-<TASK>-1000. The same allocator is shared by PRIMARY,
      REMEDIATION, direct-candidate, REPAIR, and recover-primary, so the defect violates
      the task's no-reuse guarantee and can also make collision recovery allocate a
      non-fresh identity.
    expected: >
      Make next_run_id() recognize the complete canonical numeric RUN suffix grammar used
      by remote namespace validation so every valid reserved/local identity, including
      1000 and above, participates in allocation. Add deterministic boundary regressions
      proving a namespace containing 001 through 1000 allocates 1001 rather than reusing
      1000, including coverage sufficient to prove the shared allocator protects normal
      admission and recover-primary. Preserve all existing remote validation, conflict
      detection, Executor/no-Executor, Runtime verification, and publication semantics.
