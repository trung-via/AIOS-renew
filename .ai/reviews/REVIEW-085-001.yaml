findings:
  - id: F1
    basis: AC6
    action: CODE_FIX
    location: src/aios_renew/operator.py::_resolve_repair_admission
    issue: >
      Normal Human-facing `aios preflight-repair <RUN>` leaves `repair` unset so
      `_resolve_repair_admission` must load the canonical remote REPAIR. Although
      preflight creates `_remote_observation_repository` specifically to isolate remote
      reads, the resolver still calls `read_remote_repair(repo, failed_run_id)` with the
      current control repository rather than that isolated observation repository.
      `read_remote_repair` then reads the remote repair blob through `_read_remote_blob`,
      which performs `git fetch --no-tags <remote> <commit_sha>` in the supplied repository.
      Therefore the ordinary no-`--repair` preflight path can write fetched objects and
      FETCH_HEAD-like Git metadata into the current control repository even though AC6
      requires Correction Preflight to be observational-only and not mutate current
      control repository state. The new regression avoids this real Human-facing path by
      supplying an in-memory repair mapping and snapshots only `.git/aios`, so canonical
      verification can pass without detecting the control-Git mutation.
    expected: >
      Preserve the existing execution path and canonical REPAIR semantics, but make the
      ordinary no-`--repair` Correction Preflight resolve the canonical remote REPAIR
      without writing remote-read side effects into the current control repository. Add a
      focused regression that exercises the normal remote-authored REPAIR path with
      `repair` omitted and proves the relevant control Git state as well as `.git/aios`,
      HEAD, index, and worktree remain unchanged while READY/BLOCKED semantics stay exact.
      Do not add retry, fallback, reroute, Executor invocation, verification, correction
      state, or any new authority.
