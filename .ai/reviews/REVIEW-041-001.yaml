findings:
  - id: F1
    basis: AC8
    action: CODE_FIX
    location: src/aios_renew/operator.py::_accepted_candidate_summary
    issue: >
      Direct Candidate Acceptance is not idempotent for the contract-defined
      key of canonical REVIEW, finding, and unchanged candidate SHA when a
      repeated request supplies a different Executor identity. The existing
      accepted direct-candidate RUN is found, but _accepted_candidate_summary
      raises "candidate was already accepted for a different Executor identity"
      instead of returning that already accepted canonical outcome. TASK-041 AC8
      and its hard idempotency constraint do not include Executor identity in the
      idempotency key. The v0.1.4 document also narrows idempotency by adding the
      selected Executor to the repeated-request identity.
    expected: >
      Once a canonical direct-candidate outcome exists for the same REVIEW,
      finding, and candidate SHA, any repeated acceptance request for that
      unchanged candidate returns the existing accepted outcome without invoking
      an Executor or rerunning affected verification. Preserve the Executor
      identity recorded by the original accepted RUN; do not rewrite it from the
      repeated request. Align the v0.1.4 documentation with that contract.
