findings:
  - id: FINDING-255-001
    basis: AC3
    action: CODE_FIX
    location: src/aios_renew/brain_wake_bridge.py:consume_handoff and tests/test_brain_wake_bridge.py
    issue: >-
      The bridge treats every completed configured source workflow as if a wake-source
      artifact were expected. The existing Issue-triggered ingress/PRIMARY/REPAIR
      workflows are repository-wide triggers with title-gated jobs, so one logical
      Issue event also creates non-target workflow runs whose jobs conclude skipped
      and intentionally produce no source pointer. consume_handoff enters the source
      handoff path for those skipped runs, fails to find the artifact, and projects
      WAKE_SOURCE_HANDOFF_FAILURE. Therefore ordinary non-target bookkeeping can wake
      Brain even though no semantic decision is required. This topology is already
      visible in the TASK-255 deliveries themselves: sibling source workflows for a
      [AIOS BRAIN WAKEUP] Issue complete as skipped.
    expected: >-
      Deterministically distinguish non-target skipped source-workflow completions from
      target source completions before requiring a pointer. Non-target skipped runs
      must remain NO_WAKE, while a target source run that should have exported a
      selector but has a missing, malformed or substituted handoff must still produce
      only WAKE_SOURCE_HANDOFF_FAILURE. Add regressions reproducing the sibling-skipped
      workflow_run topology so one ordinary Issue event cannot generate false Brain
      attention.
