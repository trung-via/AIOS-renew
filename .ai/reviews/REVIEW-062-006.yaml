findings:
  - id: F1
    basis: AC1
    action: CODE_FIX
    location: src/aios_renew/operator.py::main/_preflight_primary_sync/run_task
    issue: >
      The repair correctly restores the two native fast-forward failure regressions and
      the remediation now avoids a second upstream integration attempt by calling
      run_task(..., synchronize=False) after Human-facing preflight. However, preflight
      releases RepositoryLock before run_task reacquires it for TASK loading and RUN
      admission, and no immutable preflight SHA/state token is carried across that gap.
      An intervening local HEAD, branch, index, or worktree mutation can therefore be
      admitted silently: _run_task_impl skips synchronization/precondition checks when
      synchronize=False, loads the TASK from whatever state is present, and binds that
      current HEAD as base_sha. This violates TASK-062 revision-2's hard constraint that
      fetch/integration and admission state checks prevent an intervening local mutation
      or ref race from silently changing the RUN base SHA. The added race regression
      covers only a remote upstream advance, which is intentionally ignored after the
      one integration attempt; it does not cover a local repository mutation between
      preflight and admission.
    expected: >
      Close F1 by making the Human-facing preflight/admission handoff deterministically
      bind to the exact repository state established by preflight without introducing a
      second fetch/integration attempt. Before TASK loading/RUN creation, admission must
      prove the attached branch, clean index/worktree, and HEAD still match the preflight
      state (or preserve equivalent atomic authority under one lock). Any intervening
      local mutation/ref change must fail closed with no RUN and no Executor invocation.
      Add a deterministic actual-main-path regression that injects such a local mutation
      between preflight and admission and proves fail-closed behavior. Preserve the
      already-correct TASK-only restart behavior, exactly-one native integration attempt,
      no retry/fallback/recovery mutation, correction-flow isolation, and Runtime-owned
      verification.
