findings:
- id: FINDING-179-001
  basis: AC7
  action: CODE_FIX
  location: src/aios_renew/brain_audit.py::_normal / _PRIVATE_PARTS
  issue: Candidate/audit privacy filtering is implemented as substring matching over
    arbitrary semantic mapping keys. Because _PRIVATE_PARTS includes tokens such as
    provider, model, session, prompt, chat and conversation, legitimate Brain-owned
    semantic fields such as provider_contract, model_policy, prompt_schema or chat_memory_dependency
    are rejected as if they were out-of-band private metadata. TASK-179 requires rejection
    of prohibited protocol metadata/identity and nested audit/private material, not
    semantic vocabulary that merely contains those words. The current heuristic therefore
    narrows valid ARCHITECTURE/TASK_AUTHORING semantic content and makes the supposedly
    provider-neutral protocol unable to represent some valid provider/portability
    architecture decisions.
  expected: Replace substring-based semantic-key rejection with a closed exact normalized
    reserved metadata/envelope-key policy (and retain the explicit machine-local path/private-value
    protections that are actually required). Exact prohibited metadata keys such as
    provider/model/session identity and nested audit-envelope keys must still fail
    closed, but ordinary semantic keys that merely contain those tokens must remain
    representable. Add regression coverage proving exact forbidden metadata is rejected
    while representative semantic keys such as provider_contract, model_policy, prompt_schema
    and chat_memory_dependency are accepted and remain fingerprint-bound. Do not weaken
    byte, depth, strict-JSON, nested-envelope, credential, raw-log or machine-local
    protections.
