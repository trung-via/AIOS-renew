    docs/AIOS-LEAN-VP-L1-REVIEW-AUTHORITY.md
  issue: The test positive fixture starts with contract content already committed
    at RUN base but nonetheless lists contract in RESULT.changed_files. The reader
    demands both contract and mapping paths in changed_files even though the published
    eligibility documentation expressly permits an unchanged contract from an immutable
    ancestor; this rejects a legitimate mapping-only delta and does not test the stated
    allowance.
  expected: Preserve exact authenticated contract blob/source identity and authorized
