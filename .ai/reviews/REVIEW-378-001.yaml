  location: src/aios_renew/review_transport.py::_l1_mapping_review_lineage
  issue: The eligibility reader requires run.head_sha == selected.reviewed_sha even
    though Runtime's canonical immutable ACTIVE run.json uses head_sha=null. Independently
    read canonical RUN-376-001, RUN-377-002 and RUN-378-001 all carry head_sha=null
    while their RESULT.head_sha carries the verified candidate. Genuine existing PRIMARY
    mapping-review RUN lineage is therefore rejected despite valid source, result
    and review identities; the fixture supplies a noncanonical populated RUN head_sha.
  expected: Accept the existing canonical ACTIVE RUN record with head_sha=null, authenticate
    base/task/run from its immutable bytes, and cross-bind the reviewed candidate
    SHA to the canonical RESULT/EVIDENCE, exact review ref, Reviewer PASS and Publisher
    ancestry. Reject forged/moved candidates. Add a focused positive fixture matching
    actual Runtime artifact RUN/RESULT representation and a negative candidate-swap
    case.
- id: F2
