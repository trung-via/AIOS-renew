findings:
- id: F1
  basis: AC4
  action: CODE_FIX
  location: src/aios_renew/caa_reasoner.py:40-89, 240-313; tests/test_caa_reasoner.py:333-373
  issue: The B1 provider can select only one of eight prewritten mechanism names and
    citation IDs; every hypothesis, experiment, falsifier and expected effect is inserted
    by fixed _MECHANISMS code rather than being inferred from the selected subject
    and episode evidence. The independent response validator checks lexical feature-family
    overlap and observed RESULT/FAILURE, not a source-specific causal relationship
    or a new conditional hypothesis. The paired fixture preselects those same mechanism
    names with synthetic answers. This supports bounded template selection, but does
    not establish the TASK-required intelligent cross-module causal comparison beyond
    a checklist-like mechanism catalog; a 'pretrained-model' semantic response is
    not substantively evaluated.
  expected: Within TASK-410's original permitted files and source/privacy constraints,
    demonstrate at least one genuinely context-dependent, source-grounded cross-module
    causal analogy or discriminating alternative that cannot be produced merely by
    choosing a hard-coded advice card. Preserve independently validated exact citations,
    falsifier, uncertainty, bounded output, optional zero/one provider call and no
    autonomous action; add a negative case where the same lexical concept has an inapplicable
    causal relationship. Executor owns the HOW; do not expand to live CAA-03 hooks,
    training or new store.
- id: F2
  basis: AC5
  action: CODE_FIX
  location: src/aios_renew/caa_reasoner.py:289-308; src/aios_renew/caa_experience.py:108-120;
    tests/test_caa_reasoner.py
  issue: The rendered 'decisive_differences' asserts DIFFERENT_SCOPED_CONSUMERS whenever
    the historical TASK scope_digest is unequal to candidate scope_digest. These digests
    bind inspect/modify path collections, not authenticated consumer identities or
    dependency relationships. Two different path lists can affect the same consumer
    and identical path lists can hide distinct consumption semantics, so the alleged
    decisive consumer difference is not entailed by the cited source. Marking it INFERRED
    does not supply a discriminating basis. This violates evidence-grounded applicability/decisive-difference
    requirements.
  expected: Derive consumer-difference statements only from authenticated consumer/dependency
    evidence; otherwise use truthful 'scope differs; consumer relationship UNKNOWN'
    with corresponding uncertainty. Prove with an adversarial test where scopes differ
    but consumers are the same, and with a case of distinct consumers that share path
    scope. Keep exact source-bound evidence, omission/abstention behavior, and original
    authority boundaries.
