findings:
  - id: F1
    basis: AC6
    action: CODE_FIX
    location: src/aios_renew/antigravity_minimax_adapter.py::AntigravityMinimaxAdapter._normalize_output
    issue: >
      Native agym stdout is allowed to bypass the required agym.result.v1 envelope. After
      parsing terminal JSON, _normalize_output accepts any mapping containing result and
      evidence as a ResultPackage even when schema_version is absent. A zero-exit agym
      process can therefore return a bare structural ResultPackage and be treated as
      successful without proving the envelope status, envelope exit_code, State Guard,
      admitted workspace, or transport HEAD observations required by TASK-091. This is a
      fail-open path for missing/wrong transport schema and violates the explicit AC6 and
      hard fail-closed transport contract.
    expected: >
      Require native agym transport output to pass through exactly one valid
      agym.result.v1 envelope before its response ResultPackage can be accepted. Missing
      envelope schema, a bare result/evidence package, or any other non-envelope native
      terminal JSON must fail closed before canonical package normalization. Preserve any
      injectable test seam only if it cannot weaken the production native-output contract,
      and add a focused regression proving a zero-exit bare ResultPackage is rejected while
      valid envelope success remains accepted.
