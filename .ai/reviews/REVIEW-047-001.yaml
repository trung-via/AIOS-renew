findings:
  - id: F1
    basis: AC3
    action: CODE_FIX
    location: src/aios_renew/operator.py::run_remediation
    issue: >
      Pre-RUN versus post-RUN ownership is inferred by taking a repository-global
      snapshot of runtime RUN filenames before _run_remediation_impl and then
      comparing the directory again after an exception. That inference is not
      bound to the current remediation attempt. If another process creates a RUN
      after this call takes its initial snapshot but before this call fails
      admission (for example while the other process holds RepositoryLock), the
      foreign RUN appears in `created`. The wrapper can then call
      _persist_and_transport_failure against that unrelated active RUN instead of
      emitting ADMISSION_FAILURE for the current rejected remediation. Conversely,
      another RUN created immediately after this remediation's own post-RUN failure
      can make `created` contain more than one item and suppress terminal failure
      persistence altogether. This makes admission observability race-dependent
      and can corrupt RUN failure lineage even though the current remediation never
      invoked an Executor.
    expected: >
      Bind failure ownership explicitly to the current remediation attempt rather
      than inferring it from repository-global RUN-directory differences. Before a
      RUN is created, any failure from this remediation must remain an
      ADMISSION_FAILURE regardless of concurrent RUN creation. After this
      remediation creates its own RUN, only that exact RUN may be sent through the
      existing RUN-keyed FAILURE path. Add a deterministic concurrency/race
      regression proving a foreign RUN cannot be claimed or suppress the current
      admission diagnostic, without adding retries or another Executor call.
