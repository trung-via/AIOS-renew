findings:
- id: FINDING-157-001
  basis: AC3
  action: CODE_FIX
  location: src/aios_renew/verification_contract.py::_is_bp_v4_probe_family and tests/test_verification_contract.py
  issue: The malformed-probe family guard is a case-insensitive substring search for
    bp_v4_parallel_probe.py anywhere in the command. That rejects unrelated opaque
    commands which merely mention the probe filename/path as data or text, even though
    AC3 and the hard constraint require unrelated unsupported commands to retain existing
    conservative opaque behavior. For example, an opaque python -c or echo command
    containing the filename is treated as a malformed BP-V4 probe despite not attempting
    to invoke the repository-owned probe.
  expected: Narrow the malformed-family guard to commands that actually attempt to
    invoke the repository-owned BP-V4 probe launcher/path while continuing to fail
    closed for malformed forms of that invocation, including malformed quoting after
    the exact invocation prefix. Add deterministic regressions showing unrelated opaque
    commands that merely mention the probe filename/path remain opaque/valid, while
    malformed real probe invocations remain rejected. Do not widen scope, alter the
    valid probe grammar, worker bounds, Runtime, probe execution semantics, or other
    BP-V4 authority.
