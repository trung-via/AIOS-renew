findings:
  - id: FINDING-162-003-A
    basis: AC1
    action: CODE_FIX
    location: src/aios_renew/execution_profile.py and tests/test_execution_profile.py
    issue: >-
      The execution-profile v1 contracts are still permissive rather than strict.
      parse_execution_profile_policy accepts unknown top-level and per-executor fields
      and uses yaml.safe_load, so duplicate YAML keys are silently collapsed instead
      of failing closed. parse_execution_profile likewise accepts unknown fields and
      accepts arbitrary non-empty model_source/effort_source labels even though the
      canonical contract defines REPOSITORY_DEFAULT and EXPLICIT attribution. This
      leaves multiple noncanonical document shapes able to deserialize as the same
      operational profile and does not satisfy the strict single-policy/single-profile
      contract required by AC1.
    expected: >-
      Enforce one exact v1 field shape for policy and persisted profile documents,
      reject duplicate YAML keys and unknown fields deterministically, restrict source
      attribution to the canonical allowed values, and add focused regressions for
      duplicate keys, extra fields, and invalid source labels. Preserve opaque model
      identifiers, current TASK-061 defaults, historical terminals with no profile,
      and all TASK-163 boundaries.
  - id: FINDING-162-003-B
    basis: AC3
    action: CODE_FIX
    location: src/aios_renew/operator.py::_bind_and_persist_execution_profile; src/aios_renew/execution_profile.py; tests/test_operator.py
    issue: >-
      A pre-existing profile sidecar for the same RUN and Executor is parsed and reused
      after checking only run_id/executor. parse_execution_profile checks
      reasoning_effort only as a non-empty string, so a persisted sidecar containing
      an effort that is not supported by the repository-owned policy can bypass the
      resolver and reach native command construction. The current invalid-effort tests
      cover only fresh resolution, not the persisted/restart path. This violates AC3
      and the hard requirement that invalid effort fail before native invocation.
    expected: >-
      Before reusing an existing managed profile, deterministically validate its effort
      against the repository-owned capability policy while preserving its exact bound
      model/effort values; a change to repository defaults alone must not alter an
      already-bound profile. Add a regression with a same-RUN/same-Executor persisted
      sidecar containing an unsupported effort and prove the native runner count stays
      zero. Do not add model allowlists, fallback, routing, or TASK-163 selection
      surfaces.
