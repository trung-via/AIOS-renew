findings:
  - id: FINDING-185-001
    action: CODE_FIX
    location: src/aios_renew/review_material.py::_tree/_view and tests/test_review_material.py
    issue: >
      The Git material constructor enumerates each commit with
      "git ls-tree -rz -t --full-tree <commit>" but omits recursive traversal (-r).
      Therefore a normal changed file below a directory is not materialized. Instead the
      changed top-level directory appears as a tree entry with a changed tree OID, _view
      cannot find any child path in the non-recursive mapping, and construction fails as
      UNSUPPORTED_MATERIAL ("empty changed tree"). The focused tests use only top-level
      files, so Runtime verification does not exercise the repository-relative nested-path
      case that TASK-185 must support. This would prevent BP6-P1B from packaging ordinary
      AIOS changes such as src/aios_renew/*.py and tests/*.py for a repository-blind Reviewer.
    expected: >
      Enumerate exact bound commit trees recursively, while preserving the existing
      local-object-only/no-fetch, no-rename-heuristic and deterministic path semantics.
      Only changed regular blob paths should become ADD/MODIFY/DELETE records; directory
      tree entries are structural and must not themselves be treated as review material.
      Add focused regressions with nested repository paths for MODIFY plus ADD/DELETE
      (including a nested rename normalized as DELETE+ADD) and prove the package/revalidator
      still satisfy all existing bounds, source-table closure and worktree/config
      independence. Keep the correction inside TASK-185 scope and do not alter P1A or any
      lifecycle/provider/Reviewer authority.
    basis: AC3
