findings:
  - id: F1
    basis: AC1
    action: CODE_FIX
    location: src/aios_renew/operator.py::main/_preflight_primary_sync/_run_task_impl
    issue: >
      TASK-062 revision 2 requires one Human-facing pre-admission synchronization
      boundary with exactly one native fast-forward-only integration attempt when local
      main is behind. The candidate performs synchronization in main() through
      _preflight_primary_sync(), then _run_task_impl() independently calls
      _synchronize_primary_branch() again under a second lock. If upstream advances in
      the interval, the same Human-facing launch can perform a second integration
      attempt before admission. The current regression proving one merge calls run_task()
      directly and therefore does not exercise the actual main()->preflight->run_task
      path. The same split boundary also leaves TASK-only synchronization changes
      outside the restart predicate: _is_kernel_source() recognizes pyproject.toml/src
      changes but not .ai/tasks state, so a TASK-only advance does not establish the
      revision-2 requirement that control transfer occur exactly once before TASK load
      and admission when TASK state changes.
    expected: >
      Establish one authoritative Human-facing synchronization/admission boundary for a
      PRIMARY launch. A launch that begins behind upstream may perform at most one native
      fast-forward-only integration attempt; no second sync/integration window may occur
      between successful preflight and admission. If that synchronization changes kernel
      source or canonical TASK state, control must transfer exactly once to synchronized
      code before TASK loading/admission. Add deterministic regressions through the
      actual Human-facing main() path for an upstream race between preflight and
      admission and for TASK-only upstream advancement. Preserve no-retry/no-fallback,
      correction-flow isolation, exactly-one Executor invocation, and existing Runtime
      verification semantics.
