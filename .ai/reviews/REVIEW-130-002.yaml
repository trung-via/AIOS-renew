findings:
  - id: FINDING-130-001
    basis: AC10
    action: CODE_FIX
    location: tests/test_operator.py
    issue: >-
      TASK-130 requires deterministic regression coverage proving that authorized-TASK
      revision/content/provenance mismatch fails at the pre-RUN admission boundary with
      Admission Failure v2, executor_invoked=false, zero canonical RUNs, and zero coding
      Executor calls. The candidate tests the core helper
      _admit_authorized_task_identity directly for same-blob newer-main success and
      revision/content/non-ancestor rejection, but it does not exercise run_task/wakeup
      admission for those mismatch cases. Existing generic pre-Executor tests occur after
      RUN admission and therefore do not establish the TASK-130 zero-RUN requirement.
      Runtime verification passing 360 tests consequently proves the implemented tests
      pass, not that this explicit regression obligation is covered.
    expected: >-
      Add bounded deterministic regression coverage through the PRIMARY admission boundary
      (preferably a parameterized run_task-level test using the v2 task_revision,
      task_blob_sha, and task_commit_sha selectors) for revision drift, current TASK content
      drift, and non-ancestor/unavailable provenance as appropriate. Assert the native
      Executor runner is never called, no RUN is allocated, and the resulting bounded
      Admission Failure v2 records executor_invoked=false with phase TASK_ADMISSION and
      reason_code AUTHORIZED_TASK_IDENTITY_MISMATCH. Preserve the existing production
      implementation and existing helper-level tests unless a test-only adjustment is
      required.
