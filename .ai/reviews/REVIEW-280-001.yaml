- id: F-280-001
  basis: AC1
  action: CODE_FIX
  location: ".github/workflows/aios-auto-publish.yml \u2014 jobs.local-chat-wake.permissions"
  issue: 'The new publisher direct handoff calls ./.github/workflows/aios-local-chat-wake.yml
    with the caller job limited to contents: read. The called reusable workflow contains
    jobs that request actions: read. GitHub reusable-workflow permissions may only
    be maintained or reduced across the call chain, not elevated. The repository''s
    existing terminal-attention caller uses the same contents-only call shape and
    the current live RUN-280 terminal-attention carrier is observed as Startup failure,
    providing a concrete same-shape production counterexample. Therefore the candidate
    does not yet prove that an eligible publication event can enter the reusable local
    wake boundary from the publisher run.'
  expected: 'Keep the direct selector-only reusable handoff and minimum-sufficient
    permissions, but make the caller/callee permission chain valid without actions:write
    or new authority. Within TASK-280 scope, grant only the read permission actually
    required by the called workflow (including actions: read where required) or an
    equivalent least-privilege correction that does not modify local wake semantics.
    Add deterministic workflow-contract coverage for the permission ceiling so this
    cannot regress.'
