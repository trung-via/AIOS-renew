findings:
  - id: F1
    basis: AC7
    action: CODE_FIX
    location: src/aios_renew/operator.py::_canonical_task_path / load_task
    issue: >
      TASK-088 correctly adds the missing-local-TASK pre-resolution sync, but the candidate
      also changes the global TASK loading contract by importing `TASK_ID_PATTERN` from
      dispatch reconciliation and requiring every task id to match `^TASK-[A-Za-z0-9_-]+$`.
      That restriction is not part of the frozen TASK schema or the pre-TASK-088 `load_task`
      behavior: canonical TASK parsing accepts a non-empty string task_id, while the prior
      repository-path guard rejected only empty/path-like ids before loading the exact local
      file. Because `load_task` is shared by direct run, remediation, repair, state and other
      low-level paths, this new prefix rule can reject previously valid safe task identities
      and therefore changes existing command semantics outside the narrow missing-local-TASK
      `continue` boundary. The new regression even classifies `NOT-A-TASK` as invalid solely
      because it lacks the `TASK-` prefix, demonstrating the unintended contract narrowing.
    expected: >
      Preserve the pre-existing canonical TASK identity domain and low-level command
      compatibility. Pre-resolution synchronization may validate only what is necessary to
      prove the requested id maps safely to the exact `.ai/tasks/<id>.yaml` path; it must not
      introduce a new global `TASK-` prefix authority or reuse dispatch-specific identifier
      policy as canonical TASK-schema policy. Keep malformed/path-like ids fail-closed before
      network mutation, while safe non-`TASK-` identifiers remain loadable/continuable under
      the same rules as before TASK-088. Add focused regressions covering a safe non-`TASK-`
      local task and a safe non-`TASK-` task that exists only upstream, without weakening the
      new stale-checkout synchronization behavior.
