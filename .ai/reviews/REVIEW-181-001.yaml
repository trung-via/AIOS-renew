findings:
- id: FINDING-181-001
  basis: AC5
  action: CODE_FIX
  location: src/aios_renew/brain_return_contract.py::select_return_contract and tests/test_brain_return_contract.py::packet
  issue: select_return_contract accepts a partial mapping that contains only the protocol
    marker plus the five return-contract metadata fields. It does not require the
    supplied mapping to be a complete strict-equivalent AIOS_DECISION_PACKET v1 and
    does not verify packet_fingerprint. The focused tests intentionally construct
    such partial mappings. Therefore a fabricated or truncated mapping can select
    a return contract as if it were the exact Decision Packet required by TASK-181,
    weakening the exact-subject/substitution boundary that BP5-P2B is supposed to
    rely on.
  expected: Keep the fix inside TASK-181 scope. Selection must accept either a real
    DecisionPacket object or a strict-equivalent full Decision Packet v1 mapping whose
    closed field set and packet_fingerprint are internally consistent before any return-contract
    metadata cross-binding occurs. Add regression tests proving that partial mappings,
    extra fields, stale/mismatched packet fingerprints and metadata substitution fail
    closed while an exact full mapping and DecisionPacket object select the same return
    contract/ref. Do not add repository discovery, provider logic, lifecycle authority
    or a second TASK/REMEDIATION/REPAIR candidate validator.
