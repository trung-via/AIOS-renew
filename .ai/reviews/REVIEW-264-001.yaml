    unrelated review refs were not part of FAILURE preservation identity. This violates
    the hard constraint and AC2 requirement that the existing H1R FAILURE-preservation
    path remain behaviorally unchanged.
  expected: Separate supported-family candidate discovery/ambiguity detection from
    the immutable proof set used by the selected family. Preserve the existing FAILURE
    proof identity and drift behavior exactly while still rejecting a competing reviewed
    preservation ref for the same local HEAD. Recheck only evidence relevant to the
    selected preservation family plus the bounded local-HEAD ambiguity condition,
    rather than binding unrelated review refs repository-wide. Add deterministic regression
    proving an unrelated review ref may move without changing the old FAILURE reconciliation
    result, while a new competing review ref at the exact local HEAD still fails closed.
    Do not weaken reviewed-Result identity, mutation-edge reproof, or any existing
    H1R safety gate.
