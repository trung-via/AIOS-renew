findings:
  - id: FINDING-140-004
    basis: AC3
    action: CODE_FIX
    location: .agents/aios_antigravity_pretool_guard.py and tests/test_antigravity_adapter.py
    issue: >
      The FINDING-140-001 remediation narrows several named git operations but the active
      git policy is still not a true allow-list. Commands that are neither matched by
      _GIT_ALLOW_RE nor by _GIT_NOT_ADMITTED_RE fall through the generic final allow
      decision. For example unlisted git commands such as "git clone ..." remain allowed.
      The allowed "git branch" surface also accepts destructive forms such as
      "git branch -D <name>", and the candidate regression explicitly allows
      "git commit --amend --no-edit", which is history-changing rather than the bounded
      implementation/terminalization commit operation authorized by TASK-140 r2.
      In addition, only the prefix form "git diff --check ..." is recognized as
      Runtime-owned verification; an equivalent form such as "git diff HEAD --check"
      can match the bounded diff regex and be allowed. Windows/path-prefixed git commands
      can likewise bypass both git regexes and fall through to allow. Therefore AC3's
      requirement to permit only the bounded git implementation/terminalization surface
      while not admitting destructive/history-changing/network operations is not yet met.
    expected: >
      Make active-AIOS git handling fail closed as a category: normalize/detect the git
      invocation, allow only the explicitly authorized bounded forms, and deny every other
      git operation. Restrict branch to inspection-only forms and commit to the normal
      bounded commit needed for terminalization rather than history rewriting. Detect
      git diff --check independent of harmless argument ordering (including
      "git diff HEAD --check") and deny it with AIOS_RUNTIME_OWNS_VERIFICATION.
      Cover path-prefixed/Windows git invocations so destructive or unknown git commands
      cannot bypass classification. Add regressions proving unknown git, branch deletion,
      commit --amend, reordered diff --check, and path-prefixed destructive git are denied,
      while the required bounded git terminalization forms remain allowed.
