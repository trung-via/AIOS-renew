findings:
  - id: F101-003
    basis: AC4
    action: CODE_FIX
    location: src/aios_renew/performance_observation.py
    issue: >
      The performance surface canonically validates run.json before classifying coverage,
      but it does not fully bind the transported terminal document to that validated RUN.
      RESULT terminals are accepted when they merely contain result/evidence keys, and
      FAILURE terminals are accepted after checking only kind and run_id. A terminal whose
      TASK revision, Executor, base SHA, failed-head/candidate identity, or RESULT package
      identity conflicts with the validated RUN can therefore be treated as a legitimate
      terminal (and, when observation.json is absent, as an ordinary coverage gap) instead
      of failing closed. This violates the revision-2 requirement that transported RUN and
      terminal identity be canonically validated before coverage classification.
    expected: >
      Reuse the existing canonical RESULT/FAILURE validation boundary, or an equivalently
      strict existing binding helper, so each transported terminal is validated against the
      exact canonical RUN before observation presence is classified. Conflicting or malformed
      RESULT/FAILURE identity must fail closed even when observation.json is absent. Keep the
      fix narrow to terminal validation and focused regression coverage; do not change the
      aggregation formulas, snapshot authority, TASK-103 correction semantics, or unrelated
      operator behavior.
