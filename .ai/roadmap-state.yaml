sequencing_rule:
  generic_continuation: >-
    Absent a newer explicit Human priority, continue only the unique NEXT item in the
    active Brain Portability track. PLANNED and parallel work do not compete with NEXT.
  human_override: >-
    A newer explicit Human track or priority change outranks this pointer prospectively
    and must be canonicalized before later generic continuation relies on it.
  task_gate: >-
    A NEXT milestone with a task_id is not executable until that exact TASK revision is
    canonically authored and Brain Sync reconciles it against current engineering lineage.
authority:
  purpose: Human/Brain planning state only
  engineering_truth: >-
    Exact canonical Git state and immutable TASK, RUN, RESULT, FAILURE, REVIEW,
    REMEDIATION, and REPAIR lineage remain the sole engineering-state truth.
  completion: >-
    Implementation milestone DONE requires exact supporting reviewed/published evidence;
    this roadmap state never makes a TASK or RUN complete and cannot override conflicting lineage.
  advancement: >-
    Updates are explicit Human/Brain roadmap-authority changes grounded in canonical evidence;
    execution, review, publication, workflows, Brain providers, and Runtime do not advance
    roadmap semantics automatically.
