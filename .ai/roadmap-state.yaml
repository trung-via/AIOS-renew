sequencing_rule:
  generic_continuation: >-
    Absent an explicit new Human priority, "continue roadmap" means continue the
    unique NEXT item in the active track; parallel work does not compete with it.
  human_override: >-
    An explicit Human track or priority change outranks the pointer and must be
    canonicalized in this bookmark before later generic continuation relies on it.
authority:
  purpose: Human/Brain planning state only
  engineering_truth: >-
    Exact canonical Git state and immutable TASK, RUN, RESULT, FAILURE, REVIEW,
    REMEDIATION, and REPAIR lineage are the sole engineering-state truth.
  completion: >-
    DONE requires an exact supporting task and published SHA; this roadmap state
    never makes a TASK or RUN complete and cannot override conflicting lineage.
  advancement: >-
    Updates are Human/Brain roadmap-authority changes grounded in canonical evidence;
    execution, review, publication, and workflow events do not advance this state
    automatically.
