      flow: TASK_AUTHORING
      sections: [cross_authority_context, canonical_shape, terminal_lifecycle]
      shape_ids: [PRIMARY_RESULT, FAILURE, REVIEWED_RESULT, REMEDIATION_RESULT, REPAIR_RESULT]
      path_ids:
        - PRIMARY_PASS_TO_PUBLICATION
        - CHANGES_REQUIRED_REMEDIATION_PASS_TO_PUBLICATION
        - FAILURE_REPAIR_PASS_TO_PUBLICATION
