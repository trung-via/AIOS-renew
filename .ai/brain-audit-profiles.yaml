  - id: roa-1-r2
    version: 2
    applicable_flows: [REPAIR_AUTHORING]
    checks:
      - id: EXACT_FAILURE_BOUNDARY
        check: >-
          Bind the exact failed RUN, failed head, TASK revision and immutable FAILURE
          source in the current Decision Packet. Distinguish the observed failure
          boundary from symptoms, withheld detail and Executor claims. Missing or stale
          decisive failure material is a bounded blocker, never a guessed correction.
      - id: EVIDENCE_DISCRIMINATING_CAUSE
        check: >-
          Use only current packet-bound canonical observations to discriminate the
          material cause from plausible alternatives. Mark each judgment OBSERVED,
          INFERRED or UNKNOWN with bounded basis and exact source references. Inference
          needs discriminating evidence and a falsifying challenge; missing decisive
          evidence or causal support requires UNKNOWN and a blocker. Never invent
          Runtime evidence or treat a diagnostic, claim or audit as PASS.
      - id: MATERIAL_REPAIR_LEVER
        check: >-
          Explain how the smallest authorized repair or completion lever changes the
          identified failure boundary. Brain alone chooses CODE_FIX, NO_CHANGE,
          CONTINUE_IMPLEMENTATION or FINALIZE_CANDIDATE from lawful current facts;
          structural eligibility is not a strategy selector. Preserve TASK scope,
          constraints, correction lineage and the admitted Executor. New Human intent,
          unrelated work or unsupported causal leverage blocks the candidate.
      - id: FALSIFYING_CHALLENGE
        check: >-
          State a concrete counterexample or discriminating observation that would
          falsify the causal diagnosis or proposed lever, and explain its disposition
          on this final candidate. Challenge forged or absent evidence, stale sources,
          non-interference and false completion. Do this inside the single focused
          procedure, without a mandatory universal eight-lens or second-stage audit.
      - id: LAWFUL_READINESS
        check: >-
          Check current source and authorization, exact return contract and external
          identity, bounded scope and original constraints before exposing one final
          candidate. Missing authority or material uncertainty yields NO_DECISION and
          UNKNOWN. Runtime retains admission, execution, verification, evidence and
          CAS; Reviewer and Publisher retain their independent authority. One final
          closure is a local semantic outcome, not execution approval or lifecycle
          truth. No dual normative V1 audit, implicit fallback, automatic retry,
          production profile activation, publication or roadmap advancement.
    procedure:
      name: REPAIR_OUTCOME_AUDIT
      check_outcomes: [CLEAR, BLOCKER]
      knowledge_states: [OBSERVED, INFERRED, UNKNOWN]
      final_outcomes: [CANDIDATE, NO_DECISION]
      final_closure: true
    bounds:
      check_bytes: 2048
      candidate_bytes: 131072
      basis_bytes: 4096
      evidence_refs_per_check: 4
      closure_summary_bytes: 4096
      outcome_bytes: 196608
      max_depth: 32
  - id: moa-1
    version: 1
    applicable_flows: [REMEDIATION_AUTHORING]
    passes:
      - id: CONSTRUCT
        checks:
          - id: EXACT_REVIEW_FINDING
            check: >-
              Bind the current canonical source RUN, TASK revision, REVIEW id and
              CHANGES_REQUIRED verdict, reviewed SHA and exactly outstanding finding
              id, basis, action, location, issue and expected outcome. Compare supplied
              canonical source material with the packet and immutable correction refs.
              A hash binds content, never authenticates it. Missing, conflicting,
              duplicate, stale or cross-review sources require UNKNOWN and a blocker.
          - id: FINDING_CAUSE_AND_MINIMUM_DELTA
            check: >-
              Explain the evidence-supported cause and smallest supporting correction
              for the exact finding. Mark OBSERVED, INFERRED or UNKNOWN and cite bound
              sources; a plausible shared cause without discriminating support blocks.
              Use only authorized finding identities. A CORRECTION_FRONTIER permits
              bounded cross-finding analysis, never selection by order, score, guessed
              priority, similarity or proposed fix. It cannot expose a draft or final
              REMEDIATION; await a separate exact selected canonical subject.
          - id: ORIGINAL_TASK_AUTHORITY
            check: >-
              Preserve original modification_scope, hard constraints and verification
              policy/commands, source-family predecessor and available prior correction
              provenance. Bind the return contract, profile and current Brain context.
              Missing authority stays UNKNOWN. EVIDENCE_ONLY cannot authorize code edits.
              A semantic draft confers no mutation, execution, Human A3, Reviewer PASS,
              finding resolution, Runtime verification or publication authority.
      - id: ADVERSARIAL_AUDIT_AND_RECONCILE
        checks:
          - id: SOURCE_AND_CURRENTNESS_CHALLENGE
            check: >-
              Independently rederive source identity from the same bound material.
              State and reject or reconcile a concrete wrong, stale, swapped, duplicate
              or cross-review finding counterexample, including reviewed SHA/action
              mismatch and moved/revoked authority. Missing evidence requires UNKNOWN.
          - id: FINDING_CLOSURE_CHALLENGE
            check: >-
              Challenge whether the final proposed delta addresses precisely the finding's
              issue and expected outcome under its required CODE_FIX or EVIDENCE_ONLY
              action. State a concrete falsifier; reject misapplied EVIDENCE_ONLY and
              false or mixed PASS. Close this semantic challenge on the final candidate,
              without claiming canonical finding closure or independent Reviewer PASS.
          - id: NON_INTERFERENCE_CHALLENGE
            check: >-
              Challenge unsupported shared cause, unrelated edits, unauthorized findings,
              scope widening and corrected-one-but-broke-another. Cite discriminating
              sources and a concrete counterexample. Reconcile only the minimum legal
              delta; original constraints, predecessor and permitted affected verification
              must survive. Unresolved support or non-interference blocks the proposal.
          - id: SINGLE_AUDIT_AND_AUTHORITY_CHALLENGE
            check: >-
              Challenge forged profile/digest, mixed stages, duplicate or ROA/MOA/V1 dual
              normative audits, stale context, changed original verification/predecessor
              and absent exact target authority. A frontier always blocks final authoring.
              End this second pass in one CANDIDATE or NO_DECISION closure. No hidden
              third audit, default activation, retry, selector, ingress gate, execution,
              Human A3 approval, Runtime proof, publication or roadmap advancement.
    procedure:
      name: REMEDIATION_OUTCOME_AUDIT
      stages: [CONSTRUCT, ADVERSARIAL_AUDIT_AND_RECONCILE]
      check_outcomes: [CLEAR, BLOCKER]
      knowledge_states: [OBSERVED, INFERRED, UNKNOWN]
      challenge_dispositions: [REJECTED_WITH_BOUNDED_BASIS, ADDRESSED_BY_RECONCILIATION, BLOCKER]
      final_outcomes: [CANDIDATE, NO_DECISION]
      final_closure: true
    bounds:
      check_bytes: 2048
      candidate_bytes: 131072
      basis_bytes: 2048
      evidence_refs_per_check: 4
      finding_refs_per_check: 16
      closure_summary_bytes: 2048
      outcome_bytes: 196608
      source_context_bytes: 65536
      max_depth: 32
  - id: aoa-1
    version: 1
    applicable_flows: [ARCHITECTURE]
    passes:
      - id: CONSTRUCT
        checks:
          - id: HUMAN_OUTCOME_AND_NECESSITY
            check: >-
              Bind the exact Human objective, constraints and current canonical snapshot. State the
              useful outcome and the invariant that requires change. An all-positive checklist cannot
              establish build necessity. Missing, ambiguous or unauthenticated decisive input is
              UNKNOWN/BLOCKER; content hashes bind supplied sources without authenticating them.
          - id: COUNTERFACTUAL_ALTERNATIVES
            check: >-
              Compare A no-build/reuse, B minimum lawful delta and C new mechanism against the same
              outcome and hard floors. State feasibility, counterfactual necessity, positive/negative
              externalities and bounded scope. Do not impose a winner. No-build and deferral are valid;
              C needs a requirement simpler choices cannot satisfy, never mere novelty or preference.
          - id: EPISODE_COST_AND_EXTERNALITIES
            check: >-
              Compare full verified-work episodes: elapsed time, tokens, Human effort, coordination
              and verification, including adoption, operation, migration, security, maintenance,
              retries, review, publication and recovery. Separate OBSERVED, INFERRED and UNKNOWN with
              exact bound evidence, assumptions and horizon. No invented estimates, ROI or measured
              superiority; unmeasured quantities stay null/UNKNOWN. Challenge overlapping cost totals.
          - id: DISCRIMINATING_INFORMATION
            check: >-
              Identify evidence capable of changing the recommendation, the counterfactual decision
              if known and value of acquiring it relative to episode cost. Reuse valid bounded evidence.
              Material missing information forces UNKNOWN/BLOCKER and NO_DECISION, never an automatic
              preferred option. Information gathering and reasoned deferral are legitimate outcomes.
          - id: THREATS_AUTHORITY_AND_REVERSIBILITY
            check: >-
              Trace threats, omitted consumers, risk ownership, reversibility and exit conditions for
              each alternative under supplied planning scope and explicit Human risk acceptance.
              Unresolved authority or irreversible material risk blocks. Brain plans WHAT/WHY; Human
              approves intent and risk. No implementation, TASK allocation or lifecycle success follows.
      - id: ADVERSARIAL_AUDIT_AND_RECONCILE
        checks:
          - id: NO_BUILD_FALSIFIER
            check: >-
              Actively attempt to falsify B and C necessity using A reuse/no-build and existing valid
              mechanisms/evidence. Demand a concrete Human-approved invariant that A cannot satisfy.
              Reject dominated build choices with grounded counterexamples, never preference for work.
          - id: MINIMAL_DELTA_CHALLENGER
            check: >-
              Challenge C using B minimum lawful delta. Find a requirement B cannot meet; attack hidden
              prerequisites and future dependencies. Demand discriminating evidence that could reverse
              the recommendation. A new mechanism is not necessary merely because its checklist clears.
          - id: OMITTED_CONSUMERS_AND_ALTERNATIVES
            check: >-
              Seek omitted alternatives, affected consumers and positive/negative externalities beyond
              the declared set. Test whether the same useful outcome survives caller/transport/Runtime
              paths, migration and recovery. Missing material context stays UNKNOWN; no scope expansion.
          - id: HIDDEN_COST_AND_INVENTED_METRICS
            check: >-
              Attack undercounted fixed, Human, time, token, coordination and verification costs across
              the entire episode. Falsify invented metrics, unpaired measurements and assumed reuse.
              Cite exact supplied measurements or retain UNKNOWN; no cost score or empirical value oracle.
          - id: RISK_OWNERSHIP_AND_IRREVERSIBILITY
            check: >-
              Challenge threat assumptions, irreversible commitments, risk ownership, missing Human
              acceptance and reversibility claims for all choices. Risk cannot be accepted by a model.
              Keep first-pass BLOCKER/UNKNOWN until explicit grounded lawful reconciliation; an all-CLEAR
              second pass cannot erase it. Recheck the complete comparison after each bounded change.
          - id: SOURCE_AUTHORITY_AND_CLOSURE
            check: >-
              Attack stale/swapped packet, source, return and profile lineage, private content, mixed
              stages, extra normative audits and premature implementation/publication claims. Close once
              as CANDIDATE or NO_DECISION, naming the alternative or deferral and next Human decision.
              Runtime verifies, Reviewer judges, Publisher publishes. No live AOA cutover or V3 fallback.
    procedure:
      name: ARCHITECTURE_OUTCOME_AUDIT
      stages: [CONSTRUCT, ADVERSARIAL_AUDIT_AND_RECONCILE]
      check_outcomes: [CLEAR, BLOCKER]
