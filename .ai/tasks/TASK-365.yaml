task_id: TASK-365
revision: 1
goal: Repair the REPAIR automatic-Executor selection/delivery asymmetry with REMEDIATION
  by supporting one explicit, exact-subject Human-opted-in automatic reuse of an authenticated
  existing failed-RUN coding Executor/profile through the current GitHub/self-host
  REPAIR flow, while keeping manual Executor choices highest priority, Runtime preflight
  authority, executorless repair paths and all original lifecycle boundaries intact.
problem: 'Canonical main REPAIR transport currently permits github-actions[bot] workflow_dispatch
  only with executor empty and deterministic repair-<RUN>-<SHA> identity; self-host
  preparation explicitly rejects automation carrying a coding Executor. Runtime separately
  requires an explicit coding Executor when correction preflight executor_required=true.
  REMEDIATION does not exhibit this exact symptom because its Human A3 path carries
  an explicit bound Executor/profile. Historically TASK-315 fixed executorless FINALIZE_CANDIDATE
  reachability, not this Human-opted-in automatic coding profile reuse. Recent REPAIR
  Issue #2033 reports downstream workflow failure while #2037 reached SELF_HOST_COMPLETED
  with explicit Codex; these receipts alone do NOT prove the cause of any particular
  REPAIR failure. Distinguish the intended bot safety guard from wrongly rejected
  genuinely Human-authorized automatic profile reuse, and correct only the verified
  failing boundary without silently authorizing bots to select an Executor.'
assumptions:
- Fresh Brain Sync resolved canonical main e773588078c6646d6df9fae416a402103969ea64
  and exact current source paths in .github/workflows/aios-self-hosted-repair-wakeup.yml,
  src/aios_renew/github_issue_repair_wakeup.py, src/aios_renew/operator.py and src/aios_renew/repair_dispatch.py.
  Runtime must compare expected main SHA and current TASK identity and reject later
  drift independently.
- Current Human request explicitly prioritizes an independent REPAIR Executor-auto
  handling fix ahead of R2.1/R3 continuation. This is prospective TASK authoring,
  not an authorization to execute an unrelated REPAIR, launch this TASK, or mutate
  roadmap state.
- Auto means explicit per-REPAIR Human delegation to reuse a single previously authenticated
  coding Executor/profile from the exact failed-RUN lineage, not autonomous selection
  of any provider/model, repository-default Executor or policy-driven optimizer. If
  Human does not authorize AUTO for that correction or authentic source profile is
  absent/invalid, it is not eligible.
- Human explicit executor/model/effort for one exact REPAIR always takes precedence.
  REPAIR already supports manually specified coding Executor, and legitimate executorless
  NO_CHANGE/eligible FINALIZE_CANDIDATE must not be forced to invent a profile.
- Production prospective Brain semantic TASK_AUTHORING audit uses exactly aios-adaptive-brain-audit-v1
  version 1 digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718;
  Brain performed CONSTRUCT then ADVERSARIAL_AUDIT_AND_RECONCILE over the eight ordered
  lenses and one closure. R2.1 ROA/MOA are isolated conformance, not a default audit
  policy cutover.
- Historical bot workflow_dispatch exclusion and immutable repair dispatch journal
  must be preserved for unapproved automation. Any requested delegated mode must be
  authenticated at the pre-RUN boundary against Human actor/source, exact canonical
  RUN/REPAIR and selection, not inferred from GitHub runner identity.
- This TASK is Executor-neutral. No coding Executor/model/effort has been delegated
  by Human for implementation of TASK-365; choice is separate from authoring.
