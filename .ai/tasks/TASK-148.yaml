task_id: TASK-148
revision: 1

goal: >
  Harden the existing TASK-058 historical-subject Runtime boundary so canonical
  verification executes unchanged inside an isolated historical repository whose
  Git metadata has ordinary repository-local .git directory semantics. A historical
  REPAIR or primary recovery must therefore support exact TASK verification commands
  that legitimately use relative .git/... paths without rewriting those commands,
  while preserving current-control authority, exact failed/candidate SHA binding,
  isolation, cleanup, and all existing repair/recovery semantics.

problem: >
  Downstream python_complete_agent, pinned exactly to reviewed/source-published
  AIOS-renew 1a68db9acb6989dfa81bf875503db62e54a4bed6, exposed a deterministic
  historical verification defect while recovering TASK-207 revision 7. Canonical
  RUN-207-009 is a REPAIR continuation of RUN-207-008 at exact candidate
  39277166d69ea788ae9eaa4626707e7412a5f114. Executor completion succeeded far
  enough for Runtime-owned verification to start, but verification failed with
  172 passed / 53 errors. The repeated cause was FileNotFoundError while pytest
  attempted to create the exact TASK-authorized
  --basetemp=.git/aios/pytest-task207-r7 path inside the isolated historical subject:
  C:/Users/TRUNG/AppData/Local/Temp/aios-historical-repair-.../.git/aios/....
  TASK-058 currently constructs that subject with git worktree add --detach, so
  workspace/.git is a linked-worktree pointer file rather than a directory and
  cannot contain .git/aios. The TASK verification command is valid in an ordinary
  repository checkout and must execute exactly as authored; Runtime must not rewrite
  or special-case downstream pytest arguments merely to accommodate an incidental
  historical-workspace representation.

  This is a regression/hardening gap inside TASK-058 historical subject ownership,
  with TASK-146 verification guarantees also relevant because Runtime must preserve
  exact command order/cwd/evidence semantics. It is not a Python Agent product defect
  and not a reason to rerun TASK-207 from the beginning.

assumptions:
  - Canonical AIOS-renew main at authoring is e00da88f64b0e2074f0e512fa7e54008fa61352c.
  - TASK-147 revision 1 is canonically authored on that main but unrelated to this blocker; TASK-148 must not implement, modify, review, repair, or advance TASK-147.
  - TASK-058 revision 2 remains the semantic authority for isolated historical REPAIR subject workspaces and current-control/historical-subject separation.
  - TASK-064 remains authority for reusable verification-only NO_CHANGE continuation and must not be reimplemented here.
  - TASK-146 remains authority for Windows Runtime verification temp isolation and exact verification command/cwd/evidence semantics.
  - Current Runtime helper _create_historical_workspace uses git worktree add --detach and _remove_historical_workspace uses git worktree remove.
  - A linked Git worktree exposes workspace/.git as a file pointing to the common Git dir; therefore an exact verification path rooted at workspace/.git/... cannot be created.
  - Downstream RUN-207-009 is phase VERIFICATION, dirty=false, repairable=true, transportable=true, changed_files=[], failed_head_sha=39277166d69ea788ae9eaa4626707e7412a5f114, and its verification failure is environmental/workspace-structural rather than a demonstrated implementation defect.
  - Downstream pin migration and continuation of RUN-207-009 are separate downstream work after this upstream fix is independently reviewed and source-published.
  - Mutable future AIOS-renew main is not downstream authority until an explicit downstream exact-pin migration occurs.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-064.yaml
    - .ai/tasks/TASK-146.yaml
    - .ai/tasks/TASK-147.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/verification.py
    - src/aios_renew/review_transport.py
    - tests/test_operator.py
    - tests/test_verification.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - tests/test_verification.py

non_goals:
  - Modify downstream python_complete_agent source, TASK-207, RUN-207-009 artifacts, REPAIR lineage, workflow bindings, or dependency pin.
  - Rewrite or sanitize canonical TASK verification commands, replace relative .git paths, strip --basetemp, inject task/run-specific command exceptions, or weaken exact-command verification.
  - Change TASK-064 NO_CHANGE eligibility/reuse semantics, verification ownership, evidence schemas, RESULT/FAILURE semantics, repair action meanings, Executor selection, retry/fallback/reroute, or publication/review authority.
  - Change TASK-146 Windows TEMP/TMP/TMPDIR isolation or move volatile test temp roots back under repository ancestry.
  - Build a generic clone manager, generic worktree manager, snapshot service, scheduler, broker, planner, or branch orchestration subsystem.
  - Use network access to construct historical subjects.
  - Mutate, reset, detach, stash, commit, or otherwise change the current control checkout merely to create a historical subject.
  - Implement or advance TASK-147 or the Brain Portability roadmap.
  - Add downstream-specific identifiers, paths, TASK ids, RUN ids, candidate SHAs, or pytest-only production special cases.

constraints:
  hard:
    - >
      Preserve TASK-058 authority: current control repository remains authoritative for
      Runtime provenance, canonical remote resolution, mutation lock/state root, repair
      authorization, RUN allocation, terminal state, and transport. The historical
      subject remains only the exact Git subject of execution and verification.
    - >
      Historical subject creation must begin from the exact authorized historical
      commit and expose ordinary repository-local Git metadata semantics sufficient
      for an unchanged canonical command to create/read paths beneath subject/.git/.
      The fix must not rewrite verification commands or substitute current-main files.
    - >
      Subject construction must be local/offline and object-exact. Reuse of the
      current repository object store is allowed only as a subordinate storage
      mechanism; missing objects, wrong HEAD, dirty subject, or control-checkout
      mutation must fail closed before Executor/verification authority proceeds.
    - >
      The subject must remain isolated from the attached control checkout. Its branch,
      index, worktree, commits, and repository-local .git state must not mutate control
      HEAD/index/worktree or create a second semantic authority.
    - >
      Cleanup must be deterministic for both success and failure and must not depend
      on git worktree registration if the chosen historical-subject representation no
      longer uses linked worktrees. Cleanup failure must not silently corrupt control
      repository worktree metadata.
    - >
      Preserve exact historical TASK loading from the subject, exact failed/candidate
      SHA checks, clean-worktree checks, scope/mutation gates, Runtime-owned
      verification, raw evidence, strict UTF-8, stop-on-first-failure, and transport
      semantics.
    - >
      Preserve TASK-146 verification behavior: commands execute exactly once, in
      authored order, with cwd equal to the historical subject repository and Windows
      TEMP/TMP/TMPDIR isolated outside Git ancestry. Raw Runtime evidence continues to
      use the control Runtime state root as already designed.
    - >
      Add a production-shaped Windows regression equivalent to the downstream
      RUN-207-009 topology: create a historical subject, prove subject/.git is usable
      as a directory namespace, execute an unchanged verification command whose
      --basetemp or equivalent writes beneath .git/aios, and observe successful
      Runtime verification without touching control HEAD/index/worktree.
    - >
      Preserve historical REPAIR and recover-primary compatibility, including fresh
      local Runtime state and exact remote lineage. Existing historical subject tests
      must remain green without weakening their isolation assertions.
    - >
      No behavior may depend on concrete downstream paths, Windows username, TASK-207,
      RUN-207-009, or candidate 39277166; those values are evidence only.

acceptance:
  - id: AC1
    condition: >
      A Runtime-created historical subject at an exact historical SHA provides
      repository-local .git directory semantics compatible with unchanged canonical
      verification paths beneath .git/... while current control checkout remains unchanged.
  - id: AC2
    condition: >
      Historical REPAIR can complete Runtime verification for a production-shaped
      command using --basetemp=.git/aios/... without command rewriting, linked-worktree
      FileNotFoundError, or downstream-specific exception.
  - id: AC3
    condition: >
      Historical recover-primary uses the same corrected subject boundary and retains
      exact candidate/TASK/verification semantics without mutating current control state.
  - id: AC4
    condition: >
      Historical subject creation and cleanup are deterministic, offline, object-exact,
      and fail closed for missing/wrong HEAD, dirty subject, or control mutation, with
      no stale linked-worktree registration or leaked temporary repository on normal completion.
  - id: AC5
    condition: >
      TASK-064 verification-only continuation and TASK-146 Windows verification
      isolation/evidence behavior remain unchanged, including exact command order/cwd
      and isolated TEMP/TMP/TMPDIR.
  - id: AC6
    condition: >
      Focused historical-repair/recovery and verification regressions, complete operator
      and verification suites, full pytest suite, and git diff --check pass with zero
      unresolved items and changes limited to authorized scope.

verification:
  required:
    - python -m pytest -q tests/test_operator.py -k "historical and (repair or recovery or workspace or verification)"
    - python -m pytest -q tests/test_verification.py
    - python -m pytest -q tests/test_operator.py
    - python -m pytest -q
    - git diff --check
