task_id: TASK-148
revision: 2

goal: >
  Re-admit the TASK-148 historical-subject Runtime hardening on the current
  canonical AIOS-renew main after RUN-148-001 was made non-repairable by an
  unrelated canonical-main advance during its PRIMARY execution. Preserve the
  original TASK-148 semantic authority from revision 1: historical REPAIR and
  primary recovery must execute unchanged canonical verification commands inside
  an isolated exact historical repository whose local .git is a usable directory
  namespace, while current-control authority, exact SHA binding, isolation,
  cleanup, Runtime verification ownership, and evidence semantics remain unchanged.

problem: >
  TASK-148 revision 1 was canonically authored at
  3edeb3cc430eb2c9e506d148bbf11834986380d3 and admitted as RUN-148-001.
  During that PRIMARY, independent TASK-147 revision 2 authoring advanced the
  shared control checkout to 407fd0a419a03a181d1836da4d4a7cd61aa0d3ae.
  RUN-148-001 therefore terminalized at EXECUTION with candidate dirty=true,
  descends_from_base=true, outside_task_scope containing .ai/tasks/TASK-147.yaml,
  repairable=false, transportable=false, and Antigravity terminal prose indicating
  one background task. RUN-148-001 is immutable failed history and cannot be
  repaired or reused as candidate authority.

  TASK-147 revision 2 subsequently completed successfully as RUN-147-004,
  REVIEW-147-004 PASS, source candidate
  f0e1f203ca7a34f4fbb67c2dac2dd451e7d9c9e2, with focused tests, complete
  operator suite, full 1226-test suite, and git diff --check all passing; that
  source is published and remains an ancestor of current main.

  TASK-140 revision 5 also completed after TASK-147, with final reviewed/published
  source at current canonical main
  5240d90c2cbcde43d69d1beeba4acb93acaabc1e. Those later control-plane changes are
  unrelated to TASK-148 and must be preserved exactly.

  The original downstream blocker remains unresolved. python_complete_agent
  RUN-207-009 failed during Runtime verification because TASK-058 historical
  recovery uses git worktree add --detach, making subject/.git a pointer file.
  The exact downstream verification command
  --basetemp=.git/aios/pytest-task207-r7 then cannot create its path beneath
  subject/.git, causing 53 FileNotFoundError setup errors after 172 tests passed.
  Revision 2 must solve that generic historical-subject representation defect on
  current AIOS main without rewriting downstream verification commands or creating
  a second authority.

assumptions:
  - Canonical AIOS-renew main at revision-2 authoring is 5240d90c2cbcde43d69d1beeba4acb93acaabc1e.
  - TASK-147 revision 2 is DONE via RUN-147-004 / REVIEW-147-004 PASS and source f0e1f203ca7a34f4fbb67c2dac2dd451e7d9c9e2 is published.
  - TASK-140 revision 5 is DONE on current main and its hook/Antigravity guard changes must remain unchanged.
  - RUN-148-001 is canonical non-repairable/non-transportable failed revision-1 history and must not be repaired, recovered, cherry-picked, or used as implementation authority.
  - TASK-058 revision 2 remains sole semantic authority for historical subject construction and current-control/historical-subject separation.
  - TASK-064 remains authority for verification-only NO_CHANGE reuse and is not reimplemented here.
  - TASK-146 remains authority for Windows verification TEMP/TMP/TMPDIR isolation and exact command/cwd/evidence semantics.
  - Current _create_historical_workspace still uses git worktree add --detach and current _remove_historical_workspace removes that linked worktree.
  - A linked worktree exposes subject/.git as a file rather than a directory, which is incompatible with otherwise-valid exact verification commands that use relative .git/... paths.
  - Downstream python_complete_agent remains separately pinned to older exact AIOS source until an explicit reviewed downstream migration occurs.
  - No other AIOS task or canonical-main mutation may execute concurrently with TASK-148 revision-2 PRIMARY/verification.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-064.yaml
    - .ai/tasks/TASK-140.yaml
    - .ai/tasks/TASK-146.yaml
    - .ai/tasks/TASK-147.yaml
    - .ai/tasks/TASK-148.yaml
    - refs/heads/aios/failure-artifacts/RUN-148-001
    - refs/heads/aios/artifacts/RUN-147-004
    - refs/heads/aios/review-decision/RUN-147-004
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/verification.py
    - src/aios_renew/review_transport.py
    - tests/test_operator.py
    - tests/test_verification.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - tests/test_verification.py

non_goals:
  - Repair, retry, recover, publish, or otherwise revive RUN-148-001.
  - Modify TASK-147, RUN-147-004, TASK-140 revision 5, its guard/hooks/adapter files, or their reviewed/published semantics.
  - Modify downstream python_complete_agent source, TASK-207, RUN-207-009 artifacts, REPAIR lineage, workflows, or dependency pin.
  - Rewrite/sanitize canonical verification commands, replace relative .git paths, strip --basetemp, or add downstream/TASK-specific verification exceptions.
  - Change TASK-064 NO_CHANGE semantics, TASK-146 Windows temp isolation, verification/evidence schemas, RESULT/FAILURE semantics, correction actions, Executor selection, retry/fallback/reroute, Reviewer, or Publisher authority.
  - Use network access to construct historical subjects.
  - Mutate/reset/detach/stash/commit the current control checkout merely to create a historical subject.
  - Build a generic clone/worktree/snapshot manager, scheduler, planner, router, broker, or second historical-recovery authority.
  - Advance the Brain Portability roadmap or unrelated AIOS work as part of this task.

constraints:
  hard:
    - >
      Preserve TASK-058 authority. Current control repository remains authoritative
      for Runtime provenance, canonical remote resolution, lock/state root, repair
      authorization, RUN allocation, terminal state and transport. Historical subject
      remains only the exact Git execution/verification subject.
    - >
      Construct the historical subject from the exact authorized historical commit
      using local/offline Git objects while exposing an ordinary repository-local
      .git directory namespace. Missing objects, wrong HEAD, dirty subject, or any
      control-checkout mutation must fail closed before Executor/verification proceeds.
    - >
      Do not rewrite verification commands to compensate for workspace representation.
      An unchanged canonical command using .git/aios/... must work from cwd equal to
      the historical subject repository.
    - >
      Subject branch/index/worktree/repository-local metadata must be isolated from the
      attached control checkout and may not alter control HEAD/index/worktree or create
      competing semantic authority.
    - >
      Cleanup must be deterministic on success and failure. If the corrected subject is
      no longer a linked worktree, cleanup must not depend on git worktree registration
      and must not leave stale worktree metadata or leaked temporary repositories.
    - >
      Preserve exact historical TASK loading, failed/candidate SHA validation,
      clean-worktree and mutation-scope gates, Runtime-owned verification, raw evidence,
      strict UTF-8, stop-on-first-failure, terminal transport, and current-control
      immutability checks.
    - >
      Preserve TASK-146 behavior exactly: verification executes once in authored order,
      cwd is the subject repo, Windows TEMP/TMP/TMPDIR remains isolated outside Git
      ancestry, and raw evidence remains in control Runtime state.
    - >
      Add production-shaped regression coverage proving a historical subject can use
      subject/.git/aios as a real directory namespace and an unchanged command equivalent
      to --basetemp=.git/aios/... succeeds without touching control state.
    - >
      Historical REPAIR and recover-primary must use the same corrected subject boundary,
      including fresh local Runtime state and exact remote lineage.
    - >
      Preserve current TASK-147 and TASK-140 behavior through complete regression coverage.
      Do not modify their production files merely to satisfy TASK-148 tests.
    - >
      Execute revision 2 serially. While its PRIMARY or Runtime verification is active,
      no AUTHOR_TASK, PRIMARY, FIX, REPAIR, remediation, publication-source mutation, or
      other canonical-main-changing operation may run in this AIOS-renew checkout.
    - >
      No production behavior may depend on concrete downstream paths, Windows username,
      TASK-207, RUN-207-009, candidate 39277166, RUN-148-001, or other evidence identifiers.

acceptance:
  - id: AC1
    condition: >
      Runtime historical subject at an exact historical SHA provides repository-local
      .git directory semantics compatible with unchanged paths beneath .git/... while
      current control checkout remains unchanged.
  - id: AC2
    condition: >
      Production-shaped historical REPAIR verification using a relative
      .git/aios basetemp path completes without linked-worktree FileNotFoundError or
      command rewriting.
  - id: AC3
    condition: >
      Historical recover-primary uses the same corrected subject boundary and preserves
      exact candidate/TASK/verification semantics without mutating control state.
  - id: AC4
    condition: >
      Historical subject creation and cleanup are deterministic, offline, object-exact,
      fail closed on invalid state, and leave no stale linked-worktree registration or
      temporary repository on normal completion.
  - id: AC5
    condition: >
      TASK-064 verification-only continuation, TASK-146 Windows verification isolation,
      TASK-147 evidence-continuity behavior, and TASK-140 revision-5 current behavior
      remain compatible and unchanged.
  - id: AC6
    condition: >
      Focused historical repair/recovery tests, complete verification suite, complete
      operator suite, full pytest suite, and git diff --check pass with zero unresolved
      items and source changes limited to the three authorized files.

verification:
  required:
    - python -m pytest -q tests/test_operator.py -k "historical and (repair or recovery or workspace or verification)"
    - python -m pytest -q tests/test_verification.py
    - python -m pytest -q tests/test_operator.py
    - python -m pytest -q
    - git diff --check
