task_id: TASK-177
revision: 1

goal: >
  Establish the BP-3 Brain Context Foundation as a deterministic, read-only cognitive-support
  layer above the existing Brain Sync and Unified State contracts. Provide one transient
  AIOS_BRAIN_WORK_CONTEXT projection, one thin semantic Flow Resolver, and repository-owned
  Flow Cards so a fresh Brain or Reviewer can identify the applicable semantic reasoning flow
  and the bounded context contract it needs without chat memory, while preserving all existing
  Human/Brain/Reviewer/Runtime/Publisher authority boundaries and without creating a second
  lifecycle truth, Planner, router, memory store, or Decision Packet compiler.

problem: >
  TASK-121 provides a deterministic AIOS_BRAIN_SYNC_SNAPSHOT and existing Unified State owns
  exact lifecycle reduction, but a fresh semantic provider still has to remember how to compose
  those facts into a bounded current-work view and which semantic reasoning contract applies.
  The Human-approved Brain Portability architecture defines Work Context v1, a thin Flow
  Resolver, and repository-owned Flow Cards as the next layer, but no repository implementation
  currently exists for those three BP-3 capabilities. Without this layer, provider continuity
  still depends on remembered procedure; over-expanding it would instead create the Planner,
  generic lifecycle router, duplicated next_action authority, or persistent memory explicitly
  prohibited by the architecture.

assumptions:
  - >
    Canonical main at TASK-177 authoring is
    f892d056fb4840551d1f8a22ae65987d084f3b21. That planning commit closes BP-V4 using
    RUN-176-001 / REVIEW-176-001 and makes bp-3-brain-context-foundation the unique roadmap NEXT.
  - >
    TASK-121 revision 2 remains authoritative for AIOS_BRAIN_SYNC_SNAPSHOT semantics:
    deterministic observation, fail-closed roadmap selection, reuse of Unified State, and zero
    RUN/Executor/verification/state mutation.
  - >
    Unified State remains the sole deterministic lifecycle reducer and its current closed
    next_action set is EXECUTE_PRIMARY, WAIT, SEMANTIC_REVIEW, AUTHOR_REMEDIATION,
    EXECUTE_REMEDIATION, AUTHOR_REPAIR, EXECUTE_REPAIR, RETRY_TRANSPORT, RECOVER_PRIMARY,
    PUBLICATION, DONE, and NONE.
  - >
    The Human-approved BP-0 architecture remains authoritative for Work Context, Flow Resolver,
    and Flow Card boundaries. BP-4 Decision Packet compilation and BP-5/BP-6 provider protocols
    are later milestones and are not part of this TASK.
  - >
    A unique roadmap NEXT that is not yet canonically authored is planning state requiring
    TASK_AUTHORING semantic work; it is not a Runtime lifecycle action and must not fabricate a
    TASK, RUN, or engineering completion state.
  - >
    Existing operational next actions remain owned by their current authorities. The Flow
    Resolver may explain that no semantic reasoning flow applies, but must not execute, dispatch,
    retry, publish, select an Executor, or otherwise route those operations.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-121.yaml
    - src/aios_renew/brain_sync.py
    - src/aios_renew/unified_state.py
    - tests/test_brain_sync.py
    - tests/test_operator_unified_state.py
  modify:
    - .ai/flow-cards.yaml
    - src/aios_renew/brain_context.py
    - tests/test_brain_context.py

non_goals:
  - Add or modify a Planner agent, generic lifecycle router, model router/scoring system, Reviewer
    agent, Publisher, Runtime lifecycle reducer, Unified State semantics, correction frontier,
    publication authority, or Executor selection authority.
  - Add a memory database, conversation store, chat-history reader, persistent learning store,
    orchestration database, broker, daemon, watcher, scheduler, polling loop, or background state.
  - Persist Work Context or Flow Resolution as an independent source of truth, or copy canonical
    RUN, RESULT, FAILURE, REVIEW, REMEDIATION, REPAIR, EVIDENCE, or roadmap truth into a second
    durable lifecycle store.
  - Infer lifecycle progression, semantic verdicts, correction strategy, Executor choice,
    publication action, roadmap advancement, or Human priority from a Flow Card.
  - Implement BP-4 Decision Packet compilation, AIOS_BRAIN_REQUEST/DECISION,
    AIOS_REVIEW_REQUEST/DECISION, provider adapters, provider hot-swap execution, or downstream
    adoption.
  - Parse free-form Human text to guess a lifecycle action, correction, Executor, or semantic
    verdict.
  - Dispatch PRIMARY/REMEDIATION/REPAIR, invoke an Executor, run canonical verification, create a
    RUN, author a review/correction artifact, publish, mutate roadmap state, or change refs as a
    side effect of context composition or flow resolution.
  - Modify frozen Kernel v0.1 semantics or historical artifacts.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      Define one versioned AIOS_BRAIN_WORK_CONTEXT v1 that is transient and request-scoped. It
      must be derived from the current AIOS_BRAIN_SYNC_SNAPSHOT plus only bounded caller-supplied
      current Human input when present, and must preserve canonical repository/main identity,
      roadmap planning facts, exact semantic subject identity when available, selected lifecycle
      projection, blockers, and bounded provenance/invalidation facts without reimplementing
      Unified State.
    - >
      Work Context must not contain chat transcripts, chain-of-thought, model memory, raw logs,
      secrets, credentials, unbounded repository content, duplicated durable lifecycle records,
      or a second authoritative next_action. Caller-supplied Human input is current request
      context only; it is not persisted or recovered from previous conversations. Oversized or
      malformed caller input must fail closed rather than be silently truncated into different
      intent.
    - >
      Define one versioned deterministic read-only Flow Resolution surface with a closed semantic
      flow set: ARCHITECTURE, TASK_AUTHORING, SEMANTIC_REVIEW, REMEDIATION_AUTHORING,
      REPAIR_AUTHORING, and DIAGNOSTIC, plus an explicit no-semantic-flow outcome for states whose
      next step belongs to an existing operational authority.
    - >
      Resolver decisions grounded in lifecycle must reuse Brain Sync / Unified State facts:
      SEMANTIC_REVIEW maps only from next_action SEMANTIC_REVIEW; REMEDIATION_AUTHORING only from
      AUTHOR_REMEDIATION; REPAIR_AUTHORING only from AUTHOR_REPAIR. A unique canonical roadmap
      NEXT blocked only because its TASK is unauthored maps to TASK_AUTHORING. Existing operational
      next actions EXECUTE_PRIMARY, EXECUTE_REMEDIATION, EXECUTE_REPAIR, RETRY_TRANSPORT,
      RECOVER_PRIMARY, PUBLICATION, WAIT, DONE, and NONE must not be converted into Brain or
      Reviewer reasoning flows.
    - >
      ARCHITECTURE and DIAGNOSTIC may be selected only from an explicit structured current-request
      selector supplied by the caller and validated against the closed flow set. The resolver must
      not infer those flows from free-form text, and an explicit selector must not override an
      authoritative lifecycle semantic obligation such as SEMANTIC_REVIEW, AUTHOR_REMEDIATION, or
      AUTHOR_REPAIR.
    - >
      Provide one repository-owned, versioned Flow Card registry containing exactly the six BP-3
      semantic flow identities. Every card must declare bounded entry conditions, required
      context, optional context, forbidden context, allowed decision types, handoff target,
      expected return shape, and invalidation rules. Unknown, duplicate, malformed, missing, or
      authority-inconsistent cards fail closed.
    - >
      Flow Cards are procedural policy only. They must not contain a predetermined semantic
      verdict, automatic correction choice, automatic Executor choice, model/provider-specific
      reasoning instructions, hidden lifecycle progression, executable dispatch commands, or a
      generic execute-anything handoff.
    - >
      The resolved flow must preserve authority identity: semantic review belongs to REVIEWER;
      remediation/repair authoring and TASK/architecture/diagnostic reasoning belong only to the
      applicable Human/Brain boundary. Provider co-location must not merge these authorities.
    - >
      Context composition, card loading/validation, and flow resolution are observation-only:
      run_created=false, executor_invoked=false, verification_invoked=false, state_mutated=false,
      and no repository/ref/roadmap mutation occurs.
    - >
      Output must be compact, stable, deterministic, JSON-serializable, and carry sufficient
      provenance/invalidation identity to force fresh composition when the canonical main,
      semantic subject, roadmap selection, or relevant lifecycle basis changes.
    - >
      Do not modify files outside scope.modify and do not change existing Brain Sync, Unified
      State, Runtime, Human Surface, correction, transport, review, publication, or Executor
      behavior.

acceptance:
  - id: AC1
    condition: >
      A versioned AIOS_BRAIN_WORK_CONTEXT deterministically composes current repository/main,
      roadmap, exact semantic subject/lifecycle projection, blockers, bounded current Human input,
      and provenance/invalidation identity from existing canonical observation surfaces without
      chat memory, persistence, or duplicated lifecycle inference.
  - id: AC2
    condition: >
      The thin Flow Resolver deterministically returns TASK_AUTHORING for the unique unauthored
      roadmap NEXT case; returns SEMANTIC_REVIEW, REMEDIATION_AUTHORING, and REPAIR_AUTHORING only
      for their exact authoritative Unified State actions; and returns an explicit
      no-semantic-flow outcome for operational execution/publication/wait/done/recovery actions
      instead of routing them.
  - id: AC3
    condition: >
      Explicit structured ARCHITECTURE or DIAGNOSTIC requests are supported without free-text
      inference and cannot override a current authoritative lifecycle semantic obligation or a
      canonical blocker that must fail closed.
  - id: AC4
    condition: >
      The repository-owned Flow Card registry contains and validates exactly the six BP-3 cards
      with bounded context/decision/handoff/return/invalidation fields, and rejects malformed,
      missing, duplicate, unknown, or authority-inconsistent card definitions without embedding
      semantic verdicts or execution commands.
  - id: AC5
    condition: >
      A fresh Brain/Reviewer can use only Work Context plus Flow Resolution/Card metadata to know
      whether semantic reasoning is required, which authority owns it, and what bounded context
      contract applies, while canonical lifecycle next_action and engineering truth remain solely
      with Brain Sync/Unified State and existing lineage.
  - id: AC6
    condition: >
      BP-3 introduces no persistent memory, second lifecycle/planning truth, Planner, generic
      lifecycle router, automatic correction/Executor/publication/roadmap authority, Decision
      Packet compiler, provider protocol, or change to frozen Kernel/history; all three new
      surfaces are observably read-only.
  - id: AC7
    condition: >
      Deterministic offline regression tests cover ready operational state, unique unauthored NEXT,
      semantic review, remediation authoring, repair authoring, explicit architecture/diagnostic,
      blocked/ambiguous state, malformed Flow Cards, invalidation identity, and proof of zero
      RUN/Executor/verification/state mutation with existing Brain Sync and Unified State behavior
      unchanged.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_brain_context.py tests/test_brain_sync.py tests/test_operator_unified_state.py
    - git diff --check
