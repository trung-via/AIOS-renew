  two-file observer patch, SHA-256
  6da4594d6a72b459313cc2b9923736609b88aa8783b7ad8111047029ed4c4e12.
  New host checks passed observer and adapter groups but native session reported
  87 PASS and 1 FAIL: genuine C2 returned claim.satisfies containing the invented
  label ('... rest as specified above'), which original Runtime correctly rejected.
  Current runtime only supplies the exact TASK acceptance-ID enum to the native
  output schema when default enrollment is active; consented interactive v3 omits
  the TASK-specific enum. This is a bounded output-schema integration defect;
  the observed failure is not CODEX_LIVE_STOP_SESSION_LOST. Historical raw
  observation copies have a hash mismatch, preventing original frozen-binding
  causal claims. No historical PASS, RUN or evidence is created by this contract.
