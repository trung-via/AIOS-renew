non_goals:
- No general-purpose external candidate importer, new planner/router/database, generic
  retry/failover, new Runtime/verifier, new independent execution authority or implicit
  executor/model selection.
- No rewriting old TASK-428 r1/r2, RUN-428-001, immutable FAILURE, REPAIR-428-001-001,
  earlier historical status, TASK-429, roadmap state or frozen v0.1 kernel artifacts.
  A current r3 RUN must never masquerade as a continuation of the old r2 RUN.
- 'No authorization to merge draft PR #2671 directly to main, promote external host
  pytest to canonical EVIDENCE, synthesize a RUN, substitute candidate verification
  helpers for original trusted source, or let an external commit or GitHub comment
  certify itself.'
- No use of newly implemented acceptance behavior to admit, verify, review, activate
  or publish its own r3 implementation. No pre-PASS publication, no implicit Human
  constitutional change, no general trust floor reduction.
- No full-suite pytest, arbitrary queue capacity increase, removal of original process
  owner/session/close/deadline guards, loss of stdout events, disabling nested source
  proof or skipping the native installed-session test.
constraints:
  hard:
  - Preserve r2 AC1-AC7 behavior of finite, lossless FIFO/backpressure for temporary
    >512 Codex outputDelta bursts, same-session recovery, genuine dead-process/EOF/protocol
    STOP and strict original nested pytest observer/plugin/import isolation. Reuse
    externally authored five-file delta as an untrusted implementation input only;
    the admitted r3 Executor must independently validate and commit any adopted bytes
    within r3 scope.
  - For the exceptional historic r2 candidate intake, original Runtime is sole admission,
    candidate-identity, SHA/commit/tree/lineage/currentness/CAS, verification and
    terminal RESULT/EVIDENCE authority. Authenticate exact r2 TASK bytes/revision,
    original RUN/FAILURE, still-applicable REPAIR authorization SHA 976398ca6954090a110408508b3570d614077897,
    failed/base SHA f3e2980df8c1aa37f24f3355edfe68f8d657e26d, and external candidate
    commit 2b3f1f9b29bd6abfcf1176eae95f9543a04b0d4f/tree 2ca89156bad06cf4bf860db79f667afcb06d6559.
    Only five r2 modification paths are eligible. Reject substitution, drift, competing
    repair, invalid ancestry or source/proof mismatch before canonical RUN.
  - The prospective one-time exception must explicitly distinguish Human-attested
    prior external Executor authorship from an actual previously admitted native Executor.
    Any supported no-invocation admission must be source-authenticated and transparently
    recorded as that distinct provenance, not falsely report native Executor invocation,
    session/checkpoints or lease. No retroactive alteration of an old RUN's evidence
    or historical contract. On a conflicting frozen authority constraint, STOP with
    a bounded blocker rather than laundering this r3 approval into a historical r2
    override.
  - Any exact-subject acceptance feature must be dormant until its r3 implementation
    is independently Runtime-verified, reviewed PASS and published; original running
    Runtime must reside outside mutable candidate subject and source/proof/toolchain
    remain authenticated. No candidate can be its own bootstrap/verifier or issue
    itself an admission permit.
  - Maintain existing original pytest observer source attestation, exact toolchain/12-worker
    profile, candidate/source isolation, deterministic status, permissions and no
    replays; retain independent Reviewer semantic verdict and Publisher exclusive
    exact reviewed candidate publication. A GitHub PR, external script and carrier
    receipt are not engineering truth.
  - One deterministic original Runtime verification pass uses the exact authored focused
    commands in order against the complete r3 committed candidate. Check existing
    three focused tests and the new one-off acceptance positive/negative conformance
    test, without full-suite or duplicate unchanged checks.
  - One future admissible historic r2 intake consumes at most one explicitly authorized
    external commit and is idempotent for the exact canonical lineage; contradictory,
    missing, mismatched, partially persisted or already consumed state rejects safely.
    It must not turn a r2 REPAIR into REMEDIATION or authorize a new semantic REVIEW
    by itself.
acceptance:
- id: AC1
  condition: Original native stdout transport handles a finite >512 outputDelta burst
    with bounded FIFO/backpressure, event ordering and no event loss or false session-lost
    STOP caused only by temporary saturation.
- id: AC2
  condition: The correlated Codex session resumes through consumer backpressure; real
    process exit, EOF, cancellation, close, deadline, oversized/malformed JSONL or
    identity violation retains deterministic fail-closed behavior.
- id: AC3
  condition: Focused native test fixtures reproduce queue saturation/recovery and
    negative transport cases without busy spinning, unbounded growth or duplicate
    turn side effects.
- id: AC4
  condition: A source-authenticated outer original-observer pytest can invoke a nested
    ordinary Runtime checkpoint while preserving the nested subject's own observer/conftest
    and exact observation without inherited-plugin collision.
- id: AC5
  condition: The original -I proof path resolves source-bound tests.* imports while
    keeping original config/observer/transitive helpers and 12-worker/toolchain proof
    isolated from mutable candidate replacements.
- id: AC6
  condition: Wrong-source, stale, malformed, missing or substituted nested observation
    and unexpected pytest exit produce bounded attributable STOP evidence instead
    of an unrelated missing-file failure or false PASS.
- id: AC7
  condition: Focused native observer regressions exercise positive and negative nested
    verification, original proof identity and queue behavior with no weakening of
    original authority.
- id: AC8
  condition: An explicit one-time exceptional REPAIR existing-candidate admission
    capability is available only under original trusted Runtime control and requires
    exact Human-approved historical lineage, currentness, source/commit/tree and five-file
    scope, rejecting unrelated TASKs or candidates before RUN.
- id: AC9
  condition: The exceptional route records prior external authorship as Human-attested
    (not a falsely admitted native Executor), accepts no synthetic checkpoints, and
    preserves Runtime-only verification/RESULT plus independent Reviewer/Publisher
    role separation.
- id: AC10
  condition: Focused isolated original-source tests reject invalid or stale main/repair/task/commit/tree,
    conflicting successor/duplicate request, dirty candidate, wrong changed files,
    mutable original verifier, missing original observer and candidate self-adoption
    with bounded pre-RUN attribution.
- id: AC11
  condition: Existing eligible REPAIR behavior and REMEDIATION-only DIRECT_CANDIDATE
    remain unchanged, and the new exact-case behavior stays unactivated until its
    own reviewed and published implementation, without changing historical r2 RUN/FAILURE/REPAIR
    facts.
- id: AC12
  condition: The r3 Executor can deliver one complete clean scope-bounded commit incorporating
    r2 transport/observer fixes and prospective one-off exception semantics with executable
    focused tests; no later Runtime RESULT, REVIEW PASS or publication is claimed
    as an Executor-authored acceptance fact.
