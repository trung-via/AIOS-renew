acceptance:
- id: AC1
  condition: The original native stdout channel handles temporary bursts greater than
    512 outputDelta events through bounded lossless FIFO/backpressure, with no false
    process/session-lost STOP caused solely by a full queue.
- id: AC2
  condition: The same original correlated native session can complete after its consumer
    resumes, while real process death, close/cancel, deadline, EOF, oversized/malformed
    event and protocol or identity violations still stop deterministically.
- id: AC3
  condition: Focused native transport tests reproduce saturation, ordering, recovery,
    starvation/close and actual invalid-event/session negatives without dropped events,
    infinite waits or duplicate turn side effects.
- id: AC4
  condition: An original-observer-instrumented outer pytest can run a nested ordinary
    Runtime checkpoint that loads only its designated subject-specific observer/conftest
    and emits the exact observation; neither inherited outer plugin nor wrong-source
    proof is accepted.
- id: AC5
  condition: The source-authenticated original -I observer resolves immutable candidate
    tests.* imports while protecting original proof and worker/toolchain/source attestation
    from candidate substitution.
- id: AC6
  condition: Nested malformed/stale/substituted observer, wrong or missing observation
    and unexpected pytest exit fail closed and preserve bounded actionable diagnostic
    provenance rather than masking the primary failure with an unrelated missing-file
    exception.
- id: AC7
  condition: A focused regression reproduces the nested observer conflict and demonstrates
    the corrected positive and negative cases without bypassing worker population,
    original-source boundaries, lease or verification ownership.
- id: AC8
  condition: The complete prospective implementation touches only the five permitted
    files and retains original PRIMARY/REPAIR/REMEDIATION source and lifecycle boundaries;
    all assertions concern executable implementation properties, not later Runtime
    RESULT, Reviewer PASS or publication.
