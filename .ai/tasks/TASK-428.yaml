problem: Canonical TASK-428 r2 RUN-428-001 failed before an implementation candidate
  was committed and REPAIR-428-001-001 authorizes CONTINUE_IMPLEMENTATION on the r2
  lineage. Codex produced a complete external five-file draft at commit 2b3f1f9b29bd6abfcf1176eae95f9543a04b0d4f
  (tree 2ca89156bad06cf4bf860db79f667afcb06d6559), based on f3e2980df8c1aa37f24f3355edfe68f8d657e26d.
  External focused tests reported observer 19 PASS, adapter 84 PASS, native 87 PASS,
  and one real installed-native PASS (181.37s) outside nested Codex sandbox; another
  installed-native test failed inside nested sandbox with 'Could not find home directory'.
  None is canonical Runtime proof. The current Runtime run_repair requires an admitted
  native Executor and has no existing-candidate import for REPAIR; accept_candidate
  applies only to reviewed REMEDIATION, not REPAIR. Blind repair wake risks repeating
  pre-candidate native transport failure; a PowerShell cherry-pick/pytest script cannot
  supply canonical RUN/EVIDENCE. Human on 2026-10-26 explicitly elects TASK-428 r3
  scope expansion and previously approved only a one-time candidate-reception exception,
  never a waiver of source or proof authority.
