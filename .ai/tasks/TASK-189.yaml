task_id: TASK-189
revision: 1

goal: >
  Implement BP6-P4 as a thin Reviewer-specific provider invocation boundary over the
  already-reviewed BP6-P3 AIOS_REVIEW_REQUEST / AIOS_REVIEW_DECISION protocol, with
  exactly one semantic provider invocation per admitted review attempt, bounded
  operational attribution, fail-closed provider/model identity checks, two independent
  non-network conformance adapters, and no retry/fallback/router, lifecycle, ingress,
  remediation or publication authority.

problem: >
  BP6-P3 now provides the exact provider-neutral Reviewer semantic request/decision
  contract and canonical REVIEW reconstruction/validation boundary, but no reviewed
  layer yet owns the deliberately narrow mechanics of invoking one already-selected
  Reviewer provider, extracting one bounded provider-native semantic response,
  separating operational attribution from semantic identity, and stopping after the
  exact one allowed call. If each future Reviewer integration implements these
  mechanics independently, adapters could silently gain hidden-session semantics,
  provider/model routing, retries/fallback, repository discovery, canonical REVIEW
  identity authorship, or lifecycle mutation. P4 must add only a Reviewer-specific
  one-call shell and leave real provider deployment, hot-swap and downstream adoption
  to later milestones.

assumptions:
  - >
    Canonical main 3f15103d83f624b0d9664bbfb0e7a18947c0c6d5 records BP6-P1A,
    BP6-P1B, BP6-P2A, BP6-P2B and BP6-P3 reviewed/published complete and BP6-P4
    as the unique NEXT implementation obligation.
  - >
    TASK-188 r1 completed through RUN-188-001, Runtime evidence RUN-188-001-V001
    with 16 focused tests passing, REVIEW-188-001 PRIMARY PASS and exact
    publication of 71047cd526366130d5f49f2c30418aec940d5791.
  - >
    src/aios_renew/reviewer_provider_protocol.py is the reviewed semantic protocol
    authority for exact Reviewer request construction/revalidation, provider semantic
    response validation, transient REVIEW candidate materialization, canonical
    parse_review round-trip protection and review.validate_review invocation.
  - >
    Human/configuration selects one Reviewer provider implementation and exact
    provider/model identity before an attempt begins. P4 does not infer, rank or choose
    providers/models.
  - >
    BP-7 owns cross-context/provider hot-swap conformance. BP-8 owns a controlled real
    non-default provider proof. BP6-P4 proves only non-network contract conformance.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md
    - docs/AIOS-BRAIN-PROVIDER-PROTOCOL.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-183.yaml
    - .ai/tasks/TASK-188.yaml
    - src/aios_renew/reviewer_provider_protocol.py
    - src/aios_renew/brain_provider.py
    - src/aios_renew/decision_packet.py
    - src/aios_renew/reviewer_procedure.py
    - src/aios_renew/reviewer_return_contract.py
    - src/aios_renew/review_material.py
    - src/aios_renew/review.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/execution_profile.py
    - tests/test_reviewer_provider_protocol.py
    - tests/test_brain_provider.py
