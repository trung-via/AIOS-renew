constraints:
  hard:
    - >
      TASK-244 r2 is a zero-delta read-only PRIMARY with empty scope.inspect and
      scope.modify. The native Executor must not invoke shell, Git, repository
      file-read, search, pytest, diagnostic or other workspace commands/tools.
    - >
      The Executor must construct the structural ResultPackage solely from the
      immutable canonical TASK/RUN context supplied by the admitted native adapter.
      result.head_sha must equal the admitted RUN base SHA, changed_files must be
      empty, unresolved must be empty, root evidence must be empty, and every
      claim.evidence list must be empty.
    - >
      Executor claims may cover only the pre-verification structural handoff and
      authority boundary. They must not claim that Runtime verification ran, that
      any residual passed or failed, that TASK-243 fixed the historical population,
      that the Git-fixture residual remains, or that workers=12 is safe.
    - >
      Runtime independently owns actual HEAD/cleanliness validation, zero-delta
      truth, verification-subject materialization, command execution,
      post-verification subject checks, canonical evidence attachment, terminal
      persistence and transport.
    - >
      Canonical verification contains exactly one Runtime-owned command:
      python scripts/aios_residual_context_attribution_diagnostic.py
    - >
      The existing TASK-241 diagnostic semantics are immutable for this proof. It
      must re-resolve exactly the historical 33 identities; execute exactly one
      cold residual-only workers=12/load/max-worker-restart=0 phase with
      selected-wrapper-equivalent aios-parallel-full-suite-/parallel-12-tmp
      geometry; stop immediately on any residual failure; and only after all 33
      residuals pass execute at most one independent full-suite n12 phase.
    - >
      The diagnostic outer exit code is authoritative for proof integrity.
      Observed pytest failures represented by a valid zero-exit diagnostic are
      evidence, not TASK execution failure. Identity drift, subject mutation,
      privacy/schema failure, instrumentation failure or any other nonzero outer
      diagnostic outcome fails closed.
    - >
      A faithful RESIDUAL_SET_N12_REPRODUCED observation must not trigger an
      automatic fix. Brain must inspect the new typed residual population before
      selecting any successor correction.
    - >
      If Phase A passes and the diagnostic reaches Phase B, a
      FULL_SUITE_PASS_DRIFT, FULL_SUITE_CONTEXT_REPRODUCED or
      FULL_SUITE_POPULATION_DRIFT observation remains evidence only. It does not
      automatically unblock, retry or complete TASK-231.
    - >
      No repository file may change and no push or publication may be performed by
      Executor execution.

