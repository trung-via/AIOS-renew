      The Executor performs no repository, shell, Git, file-read, search, pytest,
      diagnostic or other workspace command/tool invocation and makes no claim
      about a Runtime verification or residual/full-suite outcome.
  - id: AC3
    condition: >
      The structural ResultPackage preserves the exact canonical verification
      contract as Runtime-owned work only: python
      scripts/aios_residual_context_attribution_diagnostic.py, with no
      Executor-created substitute verification/evidence path and no change to the
      existing diagnostic semantics.
  - id: AC4
    condition: >
      The structural handoff preserves all existing authority limits: Runtime owns
      verification/EVIDENCE, Reviewer owns semantic verdict, Human/Brain own
      residual interpretation, correction selection, TASK-231/worker and roadmap
      decisions, Publisher owns publication, and no observed outcome is claimed or
