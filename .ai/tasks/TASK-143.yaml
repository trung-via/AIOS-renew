task_id: TASK-143
revision: 2

goal: >
  Complete the TASK-143 integrated-REMEDIATION lifecycle decoder fix on a fresh canonical
  execution, using the semantically correct design recovered from RUN-143-001 WIP, while
  preventing native Antigravity from launching Runtime-owned verification/background work.

problem: >
  TASK-143 r1 RUN-143-001 failed non-repairably because native Antigravity ended with
  "root agent idle; waiting up to 5s for 1 background task(s)" and no ResultPackage.
  The dirty WIP was preserved separately and is not canonical. Audit of that WIP established
  the correct implementation shape: retain the parsed remediation execution_base object;
  for integrated bases validate cumulative RESULT identity against
  cumulative_tip_run_id/cumulative_tip_candidate_sha, validate remediation run.base_sha
  against integration_candidate_sha, and independently resolve the exact remote integration
  ref/identity; preserve the old equality invariant for non-integrated bases. The WIP also
  added regressions for integrated failure, integrated result + subsequent repair, and invalid
  integration evidence, but it ended with a git diff --check trailing-blank-line defect and
  was never committed. r2 must implement the design cleanly from canonical main, not promote
  or assume the dirty WIP.

assumptions:
  - Canonical main at authoring is bcb7cc8a80a10d2718a37be457563863ed22f00c.
  - RUN-143-001 is a non-repairable historical failure and its dirty WIP has been backed up outside the repository.
  - The WIP audit is design evidence only; no WIP file or patch is canonical input to TASK-143 r2.
  - TASK-142 integration contracts on current main are authoritative and must remain compatible.
  - Runtime, not Executor, owns all verification commands for this task.

scope:
  inspect:
    - src/aios_renew/unified_state.py
    - src/aios_renew/operator.py
    - src/aios_renew/correction_integration.py
    - src/aios_renew/correction_preflight.py
    - tests/test_operator_unified_state.py
    - tests/test_operator_correction_preflight.py
    - refs/heads/aios/failure-artifacts/RUN-140-008
    - refs/heads/aios/integration/14e37a5af0334930e9993a91ace872be0d30c6b0555cae33fc35cbbe36ba603e
  modify:
    - src/aios_renew/unified_state.py
    - tests/test_operator_unified_state.py
    - tests/test_operator_correction_preflight.py

non_goals:
  - Modify TASK-140 guard/adapter/tests or resolve FINDING-140-005 directly.
  - Change integration identity, integration commit construction, or integration publication.
  - Delete/ignore RUN-140-008 or rewrite canonical lifecycle history.
  - Treat the integration merge commit as a synthetic RESULT RUN.
  - Loosen fail-closed validation for non-integrated remediation.
  - Add planner/router/retry/fallback behavior.

constraints:
  hard:
    - >
      Preserve three distinct identities for integrated remediation: semantic predecessor
      RESULT, cumulative operational tip RESULT, and synthetic integration candidate commit.
    - >
      Parse and retain the complete remediation execution_base contract during lifecycle
      decoding. Do not reduce an integrated base to only one run_id/candidate pair.
    - >
      For a non-integrated execution base, preserve the existing invariant: the exact
      execution_base.run_id resolves to one canonical RESULT whose candidate SHA equals the
      remediation RUN base.
    - >
      For an integrated execution base, cumulative_tip_run_id must resolve to exactly one
      canonical RESULT at cumulative_tip_candidate_sha, while remediation RUN base must equal
      integration_candidate_sha. Independently validate the exact remote integration
      ref/candidate/id through the TASK-142 integration validator with remote evidence required.
    - >
      Operational parent remains cumulative_tip_run_id. Semantic predecessor remains the
      reviewed predecessor identity and must never be replaced by the integration candidate.
    - >
      A valid integrated REMEDIATION FAILURE equivalent to RUN-140-008 must reduce to normal
      repairable failure state, not MALFORMED_CANONICAL_STATE.
    - >
      A valid integrated REMEDIATION RESULT and a subsequent REPAIR child must preserve
      correction frontier and DELTA review traversal.
    - >
      Missing/moved remote integration ref, wrong integration candidate/id, wrong cumulative
      tip RUN/SHA, wrong authorized main, wrong parents, and forged execution_base remain
      fail closed.
    - >
      Local/canonical terminal comparison must remain exact for the complete run document and
      must not create an integrated-base bypass.
    - >
      Keep regression additions focused and maintainable. Reuse existing test helpers where
      practical instead of duplicating very large setup blocks.
    - >
      EXECUTOR IMPLEMENTATION-ONLY CONTRACT: native Antigravity MUST NOT run pytest, py.test,
      unittest, tox, nox, coverage, lint, build, git diff --check, sleep/wait/watchers/servers,
      or any TASK verification command. Runtime owns all verification after ResultPackage.
    - >
      If a tool/hook denies a command with AIOS_RUNTIME_OWNS_VERIFICATION or
      AIOS_BACKGROUND_RISK_DENIED, treat the denial as expected policy; do not retry, wrap,
      substitute, or launch an equivalent command.
    - >
      After implementation, only bounded terminalization commands are permitted: git status,
      ordinary git diff inspection, git add for authorized files, one normal git commit,
      git rev-parse HEAD, then builtin finish exactly once. No background/delegated tasks.
    - >
      Commit all authorized implementation changes before finish; finish must report the actual
      final HEAD and a structural ResultPackage covering AC1-AC6. No conversational prose after
      builtin finish.
    - >
      Do not create scratch/helper files, temp repos, patch scripts, or modify files outside scope.
    - >
      git diff --check must pass when Runtime invokes it; do not leave trailing whitespace or
      extra blank lines at EOF.

acceptance:
  - id: AC1
    condition: >
      Integrated REMEDIATION lifecycle decoding validates cumulative RESULT identity separately
      from integration candidate identity and no longer requires cumulative RESULT candidate
      SHA to equal remediation RUN base.
  - id: AC2
    condition: >
      Valid integrated FAILURE topology equivalent to RUN-140-008 reduces to repairable failure
      state instead of MALFORMED_CANONICAL_STATE.
  - id: AC3
    condition: >
      Valid integrated RESULT and subsequent REPAIR lineage preserve operational parent,
      semantic predecessor, correction frontier, and DELTA review semantics.
  - id: AC4
    condition: >
      Non-integrated remediation behavior remains unchanged.
  - id: AC5
    condition: >
      Forged/stale/missing integration evidence and mismatched cumulative tip/main/candidate
      remain fail closed.
  - id: AC6
    condition: >
      Runtime-owned focused Unified State and Correction Preflight verification plus
      git diff --check pass, with production changes limited to authorized scope.

verification:
  required:
    - python -m pytest -q tests/test_operator_unified_state.py
    - python -m pytest -q tests/test_operator_correction_preflight.py
    - git diff --check
