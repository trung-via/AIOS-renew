      The repository policy defines Codex exactly as gpt-6-sol/high with supported
      efforts none/low/medium/high/xhigh/max in canonical order, while Antigravity
      remains gemini-3.8-flash/medium with low/medium/high.
  - id: AC2
    condition: >
      Focused profile regression code represents default Codex resolution to high,
      exact acceptance and source attribution for each of the six canonical Sol
      efforts, explicit rejection of non-Sol minimal/ultra under the canonical Codex
      policy, and preservation of immutable existing-profile semantics.
  - id: AC3
    condition: >
      Operator and PRIMARY/REMEDIATION/REPAIR carrier regression code represents
      omitted Codex effort resolving from the single repository policy to high and
      explicit supported effort remaining exact, without any schema/version or
      production-code change.
  - id: AC4
    condition: >
      Codex adapter regression code represents exact unchanged native command
      transport for all six Sol effort values across PRIMARY, REMEDIATION and REPAIR,
      with no adapter-side effort selection, downgrade, substitution, retry or fallback.
  - id: AC5
    condition: >
      The execution-profile planning document reflects the new Human-approved
      gpt-6-sol/high default and six-level Sol capability while preserving Human
      override precedence, Antigravity policy and all existing authority boundaries.
  - id: AC6
    condition: >
      The implementation delta is confined exactly to the eight authorized
      policy/documentation/test paths; src/aios_renew, workflows, roadmap engineering
      truth and downstream repositories are untouched and zero unresolved items remain.

