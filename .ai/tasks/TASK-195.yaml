task_id: TASK-195
revision: 1

goal: >
  Align AIOS-renew's repository-owned Codex execution-profile policy with the
  current GPT-6 Sol capability contract before BP9 downstream adoption. Keep
  default_model exactly gpt-6-sol, change Codex default_reasoning_effort from
  medium to high, and admit exactly none, low, medium, high, xhigh and max for
  Codex. Preserve Antigravity policy, Human explicit override precedence,
  immutable bound execution profiles, existing carrier/dispatch schemas, native
  adapter mechanics, no-retry/no-fallback semantics, and all lifecycle authorities.

problem: >
  Current canonical .ai/executor-profiles.yaml admits only low/medium/high for
  Codex and defaults gpt-6-sol to medium. Current OpenAI GPT-6 Sol capability
  documentation exposes none/low/medium/high/xhigh/max. Fresh source audit shows
  AIOS execution_profile.py validates effort against only the repository policy,
  while codex_adapter.py transports the exact already-resolved reasoning_effort
  to native Codex without a hard-coded three-level enum. Therefore AIOS is
  artificially restricting supported GPT-6 Sol effort values at policy level.
  The Human has explicitly selected gpt-6-sol/high as the new repository default
  and requires full supported Sol effort coverage before BP9 downstream adoption.

assumptions:
  - >
    Canonical main at authoring is
    9f0ccadadf4be2daef947e496332b967b7abd676 and the unique planning NEXT is
    maintenance-codex-gpt6-sol-effort-policy-alignment-v2 / TASK-195 r1.
  - >
    Canonical current Codex policy is gpt-6-sol/medium with supported efforts
    [low, medium, high]. Antigravity is gemini-3.8-flash/medium with supported
    efforts [low, medium, high].
  - >
    Current GPT-6 Sol provider capability is exactly
    [none, low, medium, high, xhigh, max]. Do not add minimal, ultra, persistent
    or any future/custom token to the canonical Codex policy without separate
    Human/Brain authorization.
  - >
    Codex protocol/client may recognize effort tokens beyond the GPT-6 Sol model
    capability, but model-specific capability is the authority for this policy.
  - >
    Current execution_profile.py already treats supported efforts as
    repository-owned data and validates exact membership. codex_adapter.py already
    transports the exact injected effort as model_reasoning_effort without choosing,
    ranking, downgrading or substituting it. No production Python change is expected.
  - >
    TASK-162/TASK-163 execution-profile foundation, request/dispatch versions and
    immutable profile provenance remain authoritative and must not be redesigned.
  - >
    BP8 is complete and BP9 downstream adoption is intentionally paused until this
    maintenance task is reviewed and published so downstream can adopt one final
    exact reviewed pin rather than an immediately stale policy.

