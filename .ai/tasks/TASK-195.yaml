non_goals:
  - >
    Change any src/aios_renew production Python, adapter architecture, Dispatcher,
    Operator parsing, Human surface, carrier schema/version, durable dispatch
    schema/version, workflow, Runtime, verification, Reviewer or Publisher semantics.
  - >
    Change Antigravity or Antigravity MiniMax defaults, supported efforts, model
    semantics or native command behavior.
  - >
    Add minimal, ultra, persistent or arbitrary Custom effort values to the
    canonical Codex/GPT-6 Sol policy.
  - >
    Add model routing, task-difficulty classification, adaptive effort selection,
    automatic escalation/downgrade, retry, fallback, failover, executor substitution
    or model scoring.
  - >
    Reinterpret or mutate any historical execution-profile sidecar, RUN, RESULT,
    FAILURE, dispatch journal, REVIEW, REMEDIATION or REPAIR.
  - >
    Require a real provider/network smoke as deterministic verification. Provider
    entitlement/availability remains operational, not canonical test truth.
  - >
    Advance BP9, mutate downstream Python Agent, review or publish from Executor work.

constraints:
  hard:
    - >
      .ai/executor-profiles.yaml remains the single repository-owned default/capability
      authority. Codex must be exactly default_model gpt-6-sol,
      default_reasoning_effort high, supported_reasoning_efforts in canonical order
      [none, low, medium, high, xhigh, max].
    - >
      Antigravity policy remains byte-semantically unchanged at
      gemini-3.8-flash/medium with [low, medium, high].
    - >
      Do not add a second effort enum or model capability table in Python source,
      adapters, workflows, tests or docs. Tests may assert the canonical policy but
      must not become runtime policy authority.
    - >
      Human explicit model/effort selection continues to outrank repository defaults.
      Omitted Codex effort now resolves to high for each new authorization; explicit
      none/low/medium/high/xhigh/max must retain EXPLICIT attribution and exact value.
    - >
      Bound/replayed existing authorizations retain their immutable already-resolved
      execution profile even after this default change; no historical identity is
      re-resolved through high.
    - >
      Regression implementation must cover canonical policy parsing, default Codex
      resolution to high, exact acceptance of all six Sol efforts, rejection of at
      least minimal and ultra for canonical Codex policy, and preservation of
      Antigravity's existing three-level policy.
    - >
      Operator regression must establish by construction that an omitted Codex
      effort resolves through repository policy to high while an explicit effort
      remains exact and attributed EXPLICIT.
    - >
      PRIMARY, REMEDIATION and REPAIR GitHub issue admission regressions must use
      the canonical policy and represent omitted Codex effort resolving to high;
      explicit effort cases remain exact. No carrier schema/version changes.
    - >
      Codex adapter regression must exercise all six canonical Sol efforts against
      PRIMARY, REMEDIATION and REPAIR command construction and assert exact
      model_reasoning_effort transport without adapter-side selection or substitution.
    - >
      Update docs/AIOS-EXECUTION-PROFILE-SELECTION.md so the Human-approved current
      target states Codex gpt-6-sol/high, documents all six supported Sol efforts,
      preserves Antigravity medium, and keeps the no-router/no-fallback authority
      boundaries intact.
    - >
      Modify exactly the eight authorized files. No production Python or workflow
      file changes are permitted. Zero unresolved implementation items.

