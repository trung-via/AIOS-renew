    - tests/test_operator.py
    - tests/test_review_transport.py

non_goals:
  - Change Python Agent source, TASK-125, its historical commits, or its current dependency pin in this TASK.
  - Perform the downstream AIOS pin migration required to consume this capability.
  - Repair or rerun downstream RUN-125-009 as part of AIOS-renew implementation.
  - Re-run TASK-125 PRIMARY, create a replacement PRIMARY RUN, or reinterpret the historical failure as a new task.
  - Add an AIOS-specific lineage reconstruction workaround to the downstream repository-owned worker.
  - Require the Human to use raw lower-level AIOS CLI commands as the normal downstream recovery workflow.
  - Change Executor selection, retry, fallback, reroute, failover, timeout, lease, or exactly-one dispatch semantics.
  - Substitute another Executor for the selected Executor or add autonomous recovery policy.
  - Change TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, REPAIR, FAILURE, or RUN_OBSERVATION schemas merely to support historical recovery.
  - Change TASK-057 canonical REPAIR changed_files semantics, REPAIR modification-scope semantics, verification authority, or canonical ResultPackage gates.
  - Cherry-pick, merge, copy, or otherwise inject control-plane/kernel pin migration commits into an historical failed candidate before REPAIR.
  - Build generic branch management, generic worktree orchestration, snapshot management, repository cloning infrastructure, or a new orchestration framework beyond the minimum deterministic historical recovery boundary.
  - Add distributed scheduling or a cross-machine lock service; outer automation and distributed reconciliation remain separate concerns.
  - Change Brain, Reviewer, publication, or Human intent authority.
  - Perform unrelated operator/runtime/transport refactoring, roadmap cleanup, version cleanup, or adapter changes.
  - Push from executor execution.

constraints:
  hard:
    - >
      Historical REPAIR must separate current control/runtime repository context from
      historical subject repository context. Current downstream product main and its
      checked-out HEAD must not be reset, detached, rewritten, or mutated merely to
      continue an historical failed RUN.
    - >
      Runtime must own an isolated historical subject workspace whose initial Git
      HEAD is exactly the canonical failed_head_sha from immutable failed RUN
      lineage. Executor mutation and canonical verification for historical REPAIR
      occur against that subject workspace, not current product main.
    - >
      Current control context remains authoritative for Runtime provenance,
      repository-level mutation admission/lock state, canonical operational state,
      canonical remote resolution, target REPAIR retrieval, continuation RUN identity
      allocation, and terminal transport. The historical subject workspace is only
      the Git subject for Executor mutation and Runtime repository/verification gates;
      historical files or workspace-local metadata must not choose the Runtime,
      canonical remote, state root, or lock domain.
    - >
      The AIOS Runtime executable/provenance used for historical recovery is the
      already-current pinned control-plane Runtime that admitted recovery. Pin,
      launcher, workflow, or other control-plane files present inside the historical
      subject tree are ordinary historical repository content and must not bootstrap,
      downgrade, replace, or otherwise select the Runtime executing recovery.
    - >
      The TASK contract used to execute and verify historical REPAIR must be bound to
      the immutable historical lineage. Runtime must load and validate the exact TASK
      id/revision contract from the historical subject state rather than silently
      substituting a same-named TASK from current product main. A missing or
      mismatching historical TASK contract must fail closed before Executor invocation.
    - >
      The downstream Human-facing worker remains thin. A normal historical REPAIR
      request may identify the failed RUN and already-selected Executor, but the
      worker must not resolve continuation_of chains, discover root_base_sha, infer
      failed_head_sha, enumerate TASK delta, allocate continuation RUN identity,
      create the historical workspace, or reconstruct canonical FAILURE / REPAIR
      lineage.
    - >
      Runtime must deterministically resolve historical lineage from immutable
      canonical repository/transport state. For a multi-hop failed REPAIR chain it
      must follow explicit continuation_of links until the original TASK root is
      reached, validating at every hop RUN identity, TASK id/revision, failed
      candidate SHA, and applicable canonical REPAIR authorization. Missing,
      ambiguous, conflicting, malformed, or non-matching lineage must fail closed;
      Runtime must not guess from ref order, commit messages, local cache, chat, or
      current product state.
    - >
      Historical recovery must not depend on the recovery machine retaining prior
      workspace-local .git/aios state. Immutable canonical remote artifacts must be
      sufficient to re-establish historical continuation context, including legacy
      failure chains created before this TASK where persisted repair execution data
      was not transported as a separate artifact.
    - >
      Before Executor invocation, Runtime must prove the target failed RUN has no
      already-accepted canonical continuation and must allocate a continuation RUN
      identity that does not reuse or conflict with any canonical historical RUN
      identity, even when local runtime state is empty or newly created. Remote state
      is authority for collision/duplicate detection; local next-run numbering alone
      is insufficient for historical recovery.
    - >
      New failed REPAIR transport produced after this TASK must preserve enough
      immutable canonical lineage to make later recovery portable without incidental
      local state. Strengthened transport remains subordinate lineage delivery and
      must not create semantic authority or alter frozen artifact schemas.
    - >
      The repair candidate must descend through normal Git ancestry from the exact
      historical failed_head_sha. No control-plane migration, dependency pin update,
      worker change, Runtime bootstrap change, or unrelated current-main commit may
      be inserted between failed_head_sha and the repair candidate.
    - >
      Runtime must preserve TASK-057 completion semantics after historical admission:
      failed_head_sha-to-final-HEAD committed mutation remains narrow REPAIR
      authority; root_base_sha-to-final-HEAD remains complete original TASK delta
      authority; canonical Result.changed_files is Runtime-derived; TASK scope,
      REPAIR modification_scope, CODE_FIX/NO_CHANGE, clean-worktree, HEAD, ancestry,
      structural ResultPackage, and verification gates remain fail-closed.
    - >
      Kernel/pin migration files outside the original TASK-authorized product delta
      must not enter root_base_sha-to-final-HEAD or failed_head_sha-to-final-HEAD
      changed files. A newer Runtime may be used only out-of-tree as control plane;
      its migration provenance may not become part of the product repair candidate.
    - >
      Exactly one already-selected Executor invocation is permitted for the admitted
      historical REPAIR RUN. The recovery boundary must not create retry, fallback,
      reroute, executor substitution, duplicate dispatch, or hidden PRIMARY execution.
    - >
      Historical recovery must remain within the existing repository mutation
      authority domain. Isolated subject workspace creation must not create an
      independent competing local lease/lock domain that permits another canonical
      mutation of the same downstream repository concurrently.
    - >
      Operational RUN / REPAIR / RESULT / FAILURE / verification / observation state
      created by historical recovery must remain attributable and durable even if
      the isolated subject workspace is disposable. Workspace lifecycle mechanics
      must not become canonical engineering truth or make terminal lineage depend on
      an orphaned temporary directory.
    - >
      The normal current-HEAD REPAIR execution/completion path must remain compatible.
      This TASK must not force every REPAIR through historical recovery when current
      repository HEAD already equals failed_head_sha. The only intentional observable
      extension to existing failure behavior is the portable failed-REPAIR lineage
      transport required by this TASK.
    - >
      Runtime remains deterministic coordination software. It may resolve immutable
      identity, lineage, Git state, workspace isolation, admission, and verification,
      but must not perform Brain planning, semantic review, Executor reasoning, or
      autonomous repair selection.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Historical REPAIR can be admitted from a current control repository whose HEAD
      differs from immutable failed_head_sha without resetting or mutating current
      product main, while the isolated subject workspace begins exactly at that
      failed_head_sha.
  - id: AC2
    condition: >
      A deterministic regression models current control state using a newer Runtime
      while the exact historical failed tree contains an older repository-owned
      worker/kernel pin; recovery executes through the newer already-admitted Runtime
      and the old pin remains unchanged in the historical repair candidate.
  - id: AC3
    condition: >
      Runtime resolves a multi-hop historical failed REPAIR lineage from immutable
      canonical remote artifacts, binds the exact historical TASK contract, derives
      original TASK root and latest failed head deterministically, and rejects any
      missing, ambiguous, conflicting, TASK/SHA-mismatched, or contract-mismatched hop
      before Executor invocation.
  - id: AC4
    condition: >
      With fresh/empty local runtime state, a legacy regression equivalent to
      RUN-125-009 recovers using only immutable canonical remote lineage, allocates a
      non-conflicting continuation RUN identity rather than reusing a historical RUN
      id, and does not require prior workspace-local .git/aios state.
  - id: AC5
    condition: >
      If canonical remote state already contains an accepted continuation for the
      target failed RUN, historical recovery rejects duplicate execution before
      invoking an Executor; local absence of that continuation cannot authorize a
      second REPAIR.
  - id: AC6
    condition: >
      New failed REPAIR transport preserves sufficient immutable RUN / FAILURE /
      REPAIR lineage for future portable continuation, and deterministic regressions
      prove transported lineage matches the admitted execution without changing
      frozen artifact schema or semantic authority.
  - id: AC7
    condition: >
      The selected Executor is invoked exactly once against the isolated historical
      subject workspace, no PRIMARY execution occurs, and no retry, fallback,
      reroute, or executor substitution occurs on success or failure.
  - id: AC8
    condition: >
      A successful repair candidate descends from exact historical failed_head_sha
      and contains only authorized REPAIR correction delta; no current-main
      migration or kernel/pin control-plane commit appears between failed_head_sha
      and final HEAD.
  - id: AC9
    condition: >
      After historical admission, TASK-057 semantics remain intact: Runtime derives
      canonical complete Result.changed_files from original root_base_sha to final
      HEAD, independently enforces failed_head_sha-to-final-HEAD REPAIR mutation
      scope, runs canonical verification once, and binds EVIDENCE to exact final HEAD.
  - id: AC10
    condition: >
      Current product main HEAD/worktree remain unchanged by historical recovery;
      canonical operational state and transport remain control-context-owned; and
      RUN / REPAIR / RESULT or FAILURE / observation state stays durable and
      attributable after isolated subject workspace lifecycle ends.
  - id: AC11
    condition: >
      Historical recovery shares the existing local one-active canonical mutation
      authority for the downstream repository rather than creating a separate local
      mutation domain through workspace isolation.
  - id: AC12
    condition: >
      Existing current-HEAD REPAIR execution/completion behavior and PRIMARY,
      REMEDIATION, Dispatcher, adapter, verification, publication, and review
      semantics remain unchanged except for the explicitly authorized portable
      failed-REPAIR lineage transport extension.
  - id: AC13
    condition: >
      No downstream Python Agent source or dependency pin is changed, no Human-only
      raw AIOS CLI workaround is introduced as normal workflow, and no new
      planner/router/retry/failover/orchestration authority is added.

verification:
  required:
    - python -m pytest tests/test_runtime.py tests/test_operator.py tests/test_review_transport.py -q
    - git diff --check
