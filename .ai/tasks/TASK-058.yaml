task_id: TASK-058
revision: 1

goal: >
  Add a deterministic Runtime-owned historical REPAIR recovery boundary so the
  currently pinned AIOS Runtime can continue one immutable historical failed RUN
  from its exact failed_head_sha without mutating current downstream product main
  or inserting control-plane/kernel migration commits into the original TASK
  lineage. Preserve the normal downstream Human-facing worker surface, keep the
  worker thin, and make Runtime responsible for immutable lineage resolution,
  recovery admission, isolated historical subject execution, and continuation into
  the existing canonical REPAIR completion contract.

problem: >
  Real downstream Python Agent TASK-125 exposed a second recovery-boundary defect
  after TASK-057 corrected REPAIR Result.changed_files authority. Historical
  RUN-125-009 failed at COMPLETION_GATE with failed_head_sha
  bde5ac1e781254920ec7bb6bdb3246e1a758ebb1. Current run_repair requires the
  execution repository HEAD to equal that failed head and reads FAILURE / REPAIR
  continuation state from the same repository-local .git/aios state root. The
  downstream Human-facing worker also bootstraps AIOS from repository-owned pin
  files. Both downstream main d47ed9c048cacd152452cf2a7054c662e1043c82 and
  the historical failed head contain old AIOS-renew pin
  59b31ede597d4a27b848771522672705a021abe4. Checking out the failed head and using
  the normal worker therefore bootstraps the old defective Runtime, while inserting
  a current pin migration into the failed tree destroys exact historical lineage.
  A portable recovery boundary must separate current control/runtime authority from
  the immutable historical product subject, and must not depend on incidental local
  state from the machine or worktree where the old failure occurred.

assumptions:
  - >
    Current canonical AIOS-renew main before TASK-058 authoring is
    0826f139ffd67f474afb5c512f8ce0731bef1835.
  - >
    TASK-057 is semantically reviewed PASS and published at
    0826f139ffd67f474afb5c512f8ce0731bef1835. Its Runtime-owned canonical REPAIR
    changed_files semantics remain authoritative after historical admission.
  - >
    Downstream python_complete_agent current main observed during incident audit is
    d47ed9c048cacd152452cf2a7054c662e1043c82 and its repository-owned worker pin is
    59b31ede597d4a27b848771522672705a021abe4.
  - >
    Downstream RUN-125-009 canonical FAILURE records phase COMPLETION_GATE,
    continuation_of RUN-125-008, and failed_head_sha
    bde5ac1e781254920ec7bb6bdb3246e1a758ebb1. The canonical failure candidate ref
    points to that exact commit.
  - >
    The exact historical failed head bde5ac1e781254920ec7bb6bdb3246e1a758ebb1
    contains the same old repository-owned worker pin
    59b31ede597d4a27b848771522672705a021abe4.
  - >
    RUN-125-008 is itself a REPAIR continuation and its FAILURE records
    continuation_of RUN-125-007. Historical recovery must therefore support an
    immutable multi-hop REPAIR failure chain rather than treating the latest
    FAILURE.base_sha as the original TASK root.
  - >
    Existing failure transport preserves immutable failure candidate and failure
    artifact refs containing RUN and FAILURE data, but failed REPAIR execution
    lineage is not currently guaranteed to be portable to a fresh recovery state.
  - >
    TASK-051 exactly-one Dispatcher authority, TASK-052 Runtime completion
    authority, TASK-055 native adapter thinning, TASK-057 REPAIR changed-files
    authority, frozen schemas, no-retry/no-fallback semantics, and downstream pin
    isolation remain authoritative except for the specific historical REPAIR
    admission/recovery boundary introduced by this TASK.

