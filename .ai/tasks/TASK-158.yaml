non_goals:
  - >
    Change frozen Kernel semantics, Runtime lifecycle reduction, RUN identity,
    TASK parsing authority, verification evidence authority, semantic Reviewer
    authority, Publisher authority, or roadmap advancement semantics.
  - >
    Reset, checkout, merge, rebase, stash, force-update, clean, discard, or
    otherwise realign AIOS_REPO_ROOT from workflow bootstrap code merely to make
    the persistent repository match published main.
  - >
    Move .git/aios Runtime state, correction journals, dispatch journals,
    transport refs, Executor workspaces, or verification subjects into the
    transient Control Source Subject.
  - >
    Replace TASK-062/TASK-102 PRIMARY synchronization/restart behavior or add
    automatic synchronization to direct REMEDIATION, REPAIR, approval,
    transport, recovery, or status semantics.
  - >
    Export a control-source PYTHONPATH or equivalent inherited environment that
    can cause Executor or Runtime verification child processes to import
    production modules from the published control checkout instead of the
    candidate/verification subject they are meant to test.
  - >
    Add a second Runtime, Planner, lifecycle router, workspace manager,
    scheduler, daemon, retry/failover mechanism, Executor fallback, model
    selection, package-install step, persistent control-source database, or
    background updater.
  - >
    Run BP-V4 serial/parallel measurements, select a worker count, enable
    canonical parallel verification, or create performance verdict authority.
  - >
    Treat workflow dispatch, checkout success, control-source preparation, or
    operational receipts as canonical RUN/RESULT/FAILURE/review/publication
    truth.
  - >
    Change downstream repositories or pins.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Every supported self-host workflow that invokes AIOS control behavior for
      PRIMARY, A3 approval, coalesced A3/A6 REMEDIATION intent, direct A6
      REMEDIATION wakeup, REPAIR wakeup, or remote status must execute AIOS
      Python control code from one transient exact Control Source Subject bound
      to the workflow invocation's canonical published main commit, not from the
      PATH-installed editable source of AIOS_REPO_ROOT.
    - >
      The workflow must fail closed before AIOS invocation unless the control
      source can be proven to be an exact clean Git subject for the authorized
      workflow commit on refs/heads/main. The control source path must be
      distinct from AIOS_REPO_ROOT, and any credentials used only to materialize
      read-only source must not be persisted into that checkout or exposed to
      AIOS, the coding Executor, or Runtime verification.
    - >
      Provide one thin repository-owned control entry surface whose only role is
      to load the aios_renew Operator from the exact Control Source Subject and
      enter the existing operator.main command surface. It must not parse
      lifecycle state independently, choose an operation, choose an Executor,
      perform Git integration, own Runtime state, or become a second CLI
      authority.
    - >
      Control-source selection must be process-local. Do not set or export
      PYTHONPATH, editable-install state, PATH rebinding, site-package mutation,
      or another inherited import override that would make child Executor or
      canonical verification processes load production code from the Control
      Source Subject.
    - >
      AIOS_REPO_ROOT remains the repository argument and the owner of existing
      persistent .git/aios state, dispatch/correction journals, transport,
      execution repository semantics, and repository-local lineage. TASK-158
      must not mutate that checkout before invoking the existing AIOS authority
      merely to establish trustworthy control code.
    - >
      Preserve PRIMARY synchronization exactly: trusted initial control code may
      invoke the existing TASK-062/TASK-102 safe fast-forward-only admission and,
      when that deterministic boundary authorizes it, the existing one-time
      restart into synchronized repository code. A local-ahead, diverged, dirty,
      detached, or non-main persistent checkout must never be reset to make
      control-source isolation succeed.
    - >
      Preserve existing REMEDIATION/REPAIR/approval/status selectors, explicit
      Human Executor choice, A3/A6 separation, idempotent delivery identities,
      RepositoryLock behavior, Runtime verification, DELTA review, publication,
      and transport semantics. Control-source isolation changes executable source
      provenance only.
    - >
      Operational Receipt v2 may expose one bounded exact control_sha
      attribution and bounded PRE_AIOS failure reasons for inability to prove
      the control source. That attribution is operational evidence only, must
      remain exact/replayable, and must never imply RUN creation, Executor
      invocation, verification, semantic review, or publication.
    - >
      Existing workflow tests that prohibited all checkout/materialization must
      be revised rather than deleted or weakened: the replacement invariant is
      that materialization is allowed only for the exact transient Control Source
      Subject and is forbidden from becoming a Runtime/execution checkout or
      mutating AIOS_REPO_ROOT.
    - >
      Add deterministic production-shaped regression coverage for the TASK-157
      class of incident: a persistent repository containing clean unreviewed
      candidate source that would visibly poison Operator behavior must not
      become the imported control implementation when the exact published
      control source is used. The test must prove the persistent repository is
      not reset or overwritten by the bootstrap.
    - >
      Direct local/debug use of the installed "aios" CLI remains an explicit
      local Human/operator surface. TASK-158 hardens the supported remote
      self-host steady-state workflows and must not silently redefine every local
      development invocation.
    - >
      Control-source cleanup is subordinate operational work. Cleanup failure
      cannot fabricate or rewrite canonical engineering terminal truth.
    - >
      Do not modify files outside scope.modify and do not push or publish from
      Executor implementation.

acceptance:
  - id: AC1
    condition: >
      PRIMARY, A3 approval, coalesced A3/A6 REMEDIATION intent, direct A6
      REMEDIATION wakeup, REPAIR wakeup, and remote-status self-host workflows
      all execute AIOS control code from an exact transient control source bound
      to the workflow invocation's published main commit rather than from
      editable/PATH source in AIOS_REPO_ROOT.
  - id: AC2
    condition: >
      Deterministic workflow regressions prove the control source is clean,
      exact-SHA-bound, on canonical main, distinct from AIOS_REPO_ROOT, and
      materialized without persistent credentials; missing, wrong, dirty, or
      otherwise unprovable control source fails before AIOS invocation with no
      RUN or Executor claim.
  - id: AC3
    condition: >
      The repository-owned control entry loads the existing Operator from the
      exact control source using process-local import resolution only and adds no
      lifecycle/Executor/Git authority; child process environment does not carry
      a control-source import override into Executor or Runtime verification.
  - id: AC4
    condition: >
      AIOS_REPO_ROOT remains unchanged by control-source preparation and retains
      existing Runtime/transport/execution ownership. A clean persistent
      unreviewed-candidate checkout is neither reset nor used as initial control
      code solely because a self-host delivery begins.
  - id: AC5
    condition: >
      A production-shaped poisoned-candidate regression proves that trusted
      published control behavior executes while poison placed only in persistent
      candidate Operator/control source does not execute, and the candidate
      repository HEAD/worktree remain intact through control bootstrap.
  - id: AC6
    condition: >
      Existing PRIMARY clean-behind fast-forward/restart behavior remains
      compatible when entered from trusted control source, while local-ahead,
      diverged, dirty, detached, or non-main persistent states remain
      non-destructively fail-closed or governed by their existing semantics.
  - id: AC7
    condition: >
      Existing A3, A6, REPAIR, Runtime, Executor, verification-subject, Reviewer,
      Publisher, RepositoryLock, transport, and idempotent dispatch authorities
      are behaviorally unchanged; no second Runtime, Planner, lifecycle router,
      retry/failover, or automatic Executor selection is introduced.
  - id: AC8
    condition: >
      Operational Receipt v2 can bind exact control_sha for supported self-host
      deliveries and can report bounded PRE_AIOS control-source failures while
      preserving run_created=false and executor_invoked=false until stronger
      existing evidence proves otherwise.
  - id: AC9
    condition: >
      No workflow bootstrap installs packages per RUN, persists checkout
      credentials, exports control-source PYTHONPATH/import overrides to child
      execution, or treats the transient control checkout as canonical
      engineering state.
  - id: AC10
    condition: >
      Existing direct local/debug aios CLI behavior remains available, README
      documents the four-subject boundary and steady-state self-host provenance,
      focused verification passes with zero unresolved items, and no file outside
      the authorized scope is modified.

