task_id: TASK-158
revision: 1

goal: >
  Harden every supported AIOS-renew self-host control-plane surface so the AIOS
  control code executed for PRIMARY, REMEDIATION, REPAIR, approval, and remote
  observation comes from one exact trusted published main commit associated with
  the workflow invocation, independently of whatever published, stale, ahead,
  diverged, or unreviewed candidate currently occupies the persistent
  AIOS_REPO_ROOT execution/control repository. Preserve the persistent
  repository as the existing Runtime/transport/execution-state subject, preserve
  all current lifecycle and correction authorities, and prevent an unreviewed
  Executor candidate from becoming executable control-plane authority merely
  because the AIOS package is installed editable from that persistent checkout.

problem: >
  Current self-host workflows execute the host PATH command "aios" while passing
  the persistent AIOS_REPO_ROOT as --repo. The supported host setup uses an
  editable AIOS-renew installation and intentionally performs no workflow
  checkout, so executable Python source can be coupled to the mutable persistent
  checkout. TASK-157 exposed the consequence: during correction continuation a
  not-yet-published candidate could affect later A3/A6 control behavior before
  Reviewer PASS and Publisher publication. Manual realignment to published main
  restored the intended control behavior, but destructive checkout/reset cannot
  become the steady-state solution because the persistent repository also owns
  Runtime state and valid execution lineage. AIOS therefore needs a separate
  transient Control Source Subject: exact published control code may operate on
  the existing persistent repository without changing which repository owns
  Runtime state, execution workspace, verification subject, transport, review,
  or publication.

assumptions:
  - >
    Canonical main at TASK-158 authoring is
    853fb1f5540f68d4133c0c3cb30cbca8b6d48b85, the reviewed and published
    TASK-157 repair candidate.
  - >
    Canonical roadmap state keeps
    bp-v4-parallel-verification-performance-guard as the unique NEXT milestone.
    TASK-158 is a safety prerequisite discovered during BP-V4A execution and
    does not itself perform BP-V4 parallel measurement or complete BP-V4.
  - >
    TASK-102/TASK-062 remain authoritative for PRIMARY clean-main
    fast-forward-only synchronization and the one-time restart boundary. Their
    local-ahead/diverged/dirty fail-closed behavior must not be replaced with an
    outer reset or checkout.
  - >
    TASK-112 remains authoritative for coalesced Human REMEDIATION intent and
    the distinct A3 exact approval and A6 correction-dispatch boundaries.
    Existing direct approval/wakeup debug and fallback surfaces remain valid.
  - >
    Existing REPAIR wakeup/dispatch lineage remains authoritative. TASK-158
    changes only where trusted self-host control code is loaded from, not REPAIR
    semantics, Executor selection, or failed-RUN continuity.
  - >
    TASK-156/BP-V3 remains authoritative for the transient exact Verification
    Subject. Control Source Subject, persistent Runtime/transport repository,
    Execution Subject, and Verification Subject are distinct roles and must not
    be collapsed into one new workspace authority.
  - >
    The frozen Kernel, Runtime, Reviewer, Publisher, transport refs, RepositoryLock,
    and .git/aios state remain authoritative exactly as before. An ephemeral
    control source is subordinate executable material only and never lifecycle
    truth.
  - >
    GitHub Actions workflow identity supplies an exact commit identity and ref
    for the invoked published workflow. A later movement of main must not
    silently change the control source of an already-started workflow invocation.

