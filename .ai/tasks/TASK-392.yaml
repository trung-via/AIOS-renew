task_id: TASK-392
revision: 1
goal: Implement one minimum bounded R2.1 semantic audit hardening slice for TCA TASK_AUTHORING
  and ROA REPAIR_AUTHORING, fixing early source/test/AC/scope satisfiability and claims-only
  completion repair strategy. Preserve both existing audit shapes, historical identities,
  AOA/MOA, Reviewer/Runtime authority and first-party exact policy selection. Prepare
  but do not self-authorize successor default activation.
problem: 'TASK-391 r1 AC12 contradicted published K_i/F_i direct codec import behavior
  and an historical AST import test outside r1 modification scope. RUN-391-005 and
  RUN-391-010 had verification exit 0 but REVIEW-391-001 and REVIEW-391-002 each rejected
  AC12; r2 Human scope expansion was required. RUN-391-002/007/008/009/012/013 and
  RUN-383-002 show repeated COMPLETION_GATE missing acceptance claims, often with
  no candidate changes. Existing TCA/ROA semantic instructions did not reliably prevent
  these failures. Simply editing profile YAML cannot work: canonical approval pins
  old digest, code checks exact IDs, and registry already uses 7 entries/40960 bytes.
  Improve only these two semantic profiles and the indispensable selection/compatibility
  consumers.'
assumptions:
- Explicit current Human priority is one immediate bounded TCA+ROA R2.1 correction
  TASK after TASK-391, not Lean VP automatic roadmap NEXT advancement or a new Executor
  delegation.
- Canonical main at authoring is 50dc508e7c2660c40319fb32b43ec5072ca59ce3; TASK-391
  r2 RUN-391-015 / REVIEW-391-003 PRIMARY PASS is published. TASK-392 remains proposed
  until canonical Runtime AUTHOR_TASK admission, exact identity and CAS.
- Historical exact TCA-1 v1 digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2,
  ROA-1 R2 digest aa6a5b60997849d6a00f9e4174ca7ef20fbc62ed64da645ee938a94f8e2639e4
  must stay intact. Human original R2.1 approval/TASK-368 publication and in-flight
  decisions must never be reissued or silently reinterpreted.
- Candidate prospective successor identities tca-2 and roa-1-r3 are distinct from
  historical profile IDs and must receive computed normalized content digests. AOA/MOA
  and optional Human V1 remain unchanged.
- Source-bound TCA must surface source/test/scope conflicts as UNKNOWN/NO_DECISION
  when unsatisfiable. ROA must choose code/completion levers by cause, not invent
  missing results. Deterministic test proof cannot assert model semantic infallibility.
- Production successor cutover requires a separately authenticated current Human/Brain
  canonical policy decision and reviewed/published implementation; Executor has no
  authority to mutate the Human-owned roadmap or grant activation.
- Authoring requests LEGACY_REPOSITORY_DEFAULT_ROUTE only where current Runtime lawfully
  admits it. Executor/model/effort not assigned or guessed.
