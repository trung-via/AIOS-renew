task_id: TASK-262
revision: 2
goal: Complete H4A2 Local Regular Chat Wake transport after RUN-262-002 proved the
  r1 implementation shape but exposed an invalid cross-generation verification dependency.
  Deliver canonically admitted terminal attention to one exact Human-bound regular
  ChatGPT conversation through a bounded self-hosted local browser adapter, with Human-controlled
  enablement, exact local binding, idempotent one-message delivery, Human-interaction
  protection, ambiguous-send fail-close, zero ChatGPT Work use, no assistant-output
  extraction, and minimum permissions.
problem: TASK-262 r1 first failed before implementation when Codex model refresh timed
  out. Canonical REPAIR then produced RUN-262-002 and failed candidate abe7e3f94d864c84e4933ff08fc4bd20f43944f2.
  Runtime proved the H4A2-focused suite with 65 passing tests, then failed only in
  the extra historical TASK-260 bridge-workflow regression command. One failure asserted
  terminal-attention permissions from before H4A2 and therefore rejected the new actions:write
  permission introduced by the candidate; the other test is a TASK-260-specific changed-files
  guard that diffs from ee76927b3edff179d9363e3fd62c42869db790e3 and allows only TASK-260
  files, so it is structurally incapable of passing on later H4A1/H4A2 main. REPAIR
  cannot lawfully modify that historical test because it is outside TASK-262 r1 scope.
  Revision 2 preserves the Human H4A2 intent, removes the invalid historical verification
  dependency, and tightens the transport wiring so terminal attention can invoke the
  reusable local wake path without acquiring actions:write.
assumptions:
- Canonical main at TASK-262 r2 authoring is d5acc13a7645161df93aca7e40f54d67582bf4dd
  and the roadmap still selects H4A2_LOCAL_REGULAR_CHAT_WAKE_TRANSPORT.
- RUN-262-001 is a canonical EXECUTION failure with zero code delta caused by a Codex
  model-refresh timeout; its history remains immutable.
- RUN-262-002 is the canonical r1 continuation FAILURE at VERIFICATION. Its failed
  head is abe7e3f94d864c84e4933ff08fc4bd20f43944f2, is clean, descends from base,
  changes only r1-authorized files, and is inspect-only historical evidence rather
  than reviewed or publishable source.
- Runtime evidence for RUN-262-002 shows the exact H4A2-focused command passed 65
  tests; the later bridge-workflow command failed two historical assertions unrelated
  to H4A2 implementation correctness.
- tests/test_brain_wake_bridge_workflow.py contains a TASK-260-specific candidate-scope
  assertion bound to base ee76927b3edff179d9363e3fd62c42869db790e3 and TASK-260's
  two-file modify surface; it is not a valid minimum-sufficient verification command
  for TASK-262.
- 'The published Local Regular Chat Wake architecture remains unchanged: H4A2 implements
  deterministic transport only; H4A3 owns live ACK-only exact-chat conformance and
  H4B owns semantic Brain continuation.'
scope:
  inspect:
  - docs/AIOS-LOCAL-REGULAR-CHAT-WAKE-v1.md
  - .github/workflows/aios-terminal-attention.yml
  - .github/workflows/aios-self-hosted-wakeup.yml
  - .ai/brain-terminal-attention-carriers.yaml
  - src/aios_renew/terminal_attention.py
  - src/aios_renew/operator.py
  - tests/test_terminal_attention.py
  - tests/test_terminal_attention_workflow.py
  - tests/test_brain_wake_bridge_workflow.py
  - pyproject.toml
  modify:
  - .github/workflows/aios-local-chat-wake.yml
  - .github/workflows/aios-terminal-attention.yml
  - src/aios_renew/local_chat_wake.py
  - tests/test_local_chat_wake.py
  - tests/test_local_chat_wake_workflow.py
  - tests/test_terminal_attention_workflow.py
  - pyproject.toml
non_goals:
- Modify tests/test_brain_wake_bridge_workflow.py or reinterpret TASK-260/TASK-261
  historical regression scope as current H4A2 authority.
- Perform the H4A3 live ACK-only exact-chat conformance probe, assert a real ChatGPT
  user turn was delivered in production, or enable semantic continuation.
- Implement H4B fresh-Brain resume, semantic review, remediation/repair authoring,
  Runtime verification, publication, or roadmap advancement.
- Store an exact ChatGPT conversation URL, conversation identifier, browser cookies,
  authentication tokens, browser profile data, or conversation content in committed
  repository state.
- Read, parse, summarize, or use assistant output or conversation history to decide
  any lifecycle action.
- Reintroduce ChatGPT Work, workflow_run wake transport, polling, schedules, Issue
  re-triggering, a generic lifecycle router, or an alternate semantic authority.
- Navigate away from an unrelated Human-active ChatGPT page, launch a replacement
  browser profile, or overwrite an existing Human draft.
constraints:
  hard:
  - Production transport wiring must originate only after successful canonical terminal-attention
    admission and hand off to the repository-owned local-chat-wake workflow without
    workflow_run, Work, polling, schedules, or Issue re-triggering.
  - Terminal attention must retain its pre-H4A2 top-level permission set of contents:read
    plus issues:write. H4A2 must not require actions:write on the terminal-attention
    workflow; use a bounded reusable-workflow/job handoff for the local wake path.
  - Automatic production delivery remains controlled by an explicit Human-operated
    noncanonical enable gate and must be disabled or no-op when that gate is absent
    or false.
  - The exact target chat URL, CDP endpoint and persistent transport-state location
    are read only from machine-local operational configuration outside committed repository
    state; committed source may define validation rules and configuration names but
    no actual binding values.
  - The browser adapter attaches only to an already running authenticated Chromium/Chrome-compatible
    session through the configured local endpoint and must not launch a browser, create
    a profile, navigate an unrelated page to the target, or use ChatGPT Work.
  - Delivery requires exactly one already-open page whose normalized URL exactly matches
    one durable https://chatgpt.com/c/<conversation-id> binding, a regular authenticated
    Chat surface, an empty composer, and no active response generation; missing, duplicate,
    wrong-surface, logged-out, draft, busy, or otherwise unprovable state fails closed
    before modifying the composer.
  - The wake payload contains only the local wake marker, deterministic terminal event
    identity, fixed repository identity and fresh_brain_sync_required=true; it carries
    no TASK semantics, logs, verdicts, correction strategy, roadmap successor, Executor/provider
    selection, or lifecycle commands.
  - Operational dedupe remains outside repository engineering state. The adapter persists
    ATTEMPTING before irreversible submit; prior SUBMITTED is a NOOP, while ATTEMPTING
    or ambiguous state blocks automatic resend pending Human intervention.
  - SUBMITTED may be written only after bounded proof of the exact outbound user wake
    turn and composer/send state. The implementation must not extract assistant-authored
    messages or treat browser content as engineering truth.
  - Transport failures/receipts expose only bounded event/status/reason metadata and
    must not persist cookies, page HTML, assistant output, conversation history, or
    the exact bound conversation URL in GitHub artifacts or committed files.
  - Any browser-control dependency is isolated to the local-chat-wake transport surface
    and must attach to an existing browser without downloading or launching a managed
    browser during ordinary delivery.
  - No H4A2 code path may mutate canonical AIOS refs/artifacts, allocate lifecycle
    identities, infer next_action, select semantic flow/correction, or advance roadmap
    state.
acceptance:
- id: AC1
  condition: The candidate provides the bounded local_chat_wake module and repository-owned
    reusable self-hosted workflow with no committed real chat binding or credentials,
    and the production entry accepts only bounded terminal event identity plus fixed
    repository identity.
- id: AC2
  condition: After successful existing terminal admission, terminal attention can
    invoke only the reusable local-chat-wake path through the Human-controlled enable
    gate while retaining contents:read/issues:write permissions and adding no actions:write,
    workflow_run, Work, polling, schedule, or Issue-retrigger wake path.
- id: AC3
  condition: The browser adapter attaches only to an existing configured local browser
    and deterministically fails closed unless exactly one already-open page proves
    the exact bound regular authenticated chat, empty composer, and non-generating
    state; it never navigates an unrelated page or launches a replacement browser/profile.
- id: AC4
  condition: 'The local transport implements bounded operational dedupe with ATTEMPTING-before-submit
    and SUBMITTED-after-proof semantics: duplicate SUBMITTED is a NOOP, ATTEMPTING
    or ambiguous state prevents automatic resend, and persistent metadata remains
    outside canonical repository state.'
- id: AC5
  condition: Wake construction and submission proof are limited to the exact outbound
    user doorbell turn and local composer/send state; implementation/tests contain
    no assistant-output extraction or conversation-history-driven lifecycle logic,
    and operational receipts exclude exact chat URL and private browser/session material.
- id: AC6
  condition: Focused deterministic tests cover valid delivery, duplicate NOOP, malformed/missing
    binding, zero or multiple target pages, logged-out/wrong surface, existing draft,
    active generation, pre-submit failure, ambiguous post-attempt failure, successful
    outbound submission proof, enable-gate behavior, reusable terminal handoff, and
    permission bounds without live ChatGPT access.
- id: AC7
  condition: The r2 delta remains confined to the authorized H4A2 transport/workflow/test/dependency
    surface and does not modify historical bridge tests, implement H4A3/H4B, alter
    Runtime/Reviewer/Publisher/TASK lifecycle semantics, introduce Work or a lifecycle
    router, or automatically advance roadmap state.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_local_chat_wake.py tests/test_local_chat_wake_workflow.py
    tests/test_terminal_attention.py tests/test_terminal_attention_workflow.py
  - git diff --check
