task_id: TASK-163
revision: 1

goal: >
  Implement Execution Profile Human Selection and Default Activation v1 on top of
  the published TASK-162 foundation. Allow the Human to select exact Codex or
  Antigravity model and/or reasoning effort per new execution authorization through
  local Human-facing CLI/continue and versioned PRIMARY, REMEDIATION, and REPAIR
  remote delivery paths; resolve omitted values deterministically from the single
  repository-owned execution-profile policy; bind the exact resolved profile into
  new durable dispatch identity before native execution; preserve immutable per-RUN
  profile provenance and restart/reconciliation behavior; and activate the approved
  defaults Codex gpt-6-sol/medium and Antigravity gemini-3.8-flash/medium without
  creating routing, fallback, sticky profile state, or a second default authority.

problem: >
  TASK-162 published a strict repository-owned execution-profile policy,
  provider-neutral profile validation, exact adapter injection, pre-native immutable
  sidecar persistence, terminal provenance, and future-compatible opaque model
  identifiers. Human and remote delivery surfaces still select only an Executor,
  current policy defaults remain gpt-5.6-sol/high for Codex and
  gemini-3.8-flash/high for Antigravity, and existing PRIMARY/REMEDIATION/REPAIR
  carrier and durable dispatch contracts do not bind model/effort selection.
  Activating new defaults without strengthening those authorization boundaries
  would permit replay under changed defaults and could make Brain memory or a
  carrier an accidental second profile authority. TASK-163 must close that gap
  while preserving frozen TASK/RUN semantics and all existing execution,
  verification, review, publication, and one-active-executor authority boundaries.

assumptions:
  - >
    Canonical main at TASK-163 authoring is
    8c0a1509e21a8f9f6a47ec9fb42a4bb05ed63687 and the unique canonical NEXT
    roadmap item is execution-profile-human-selection-default-activation bound to
    TASK-163.
  - >
    TASK-162 revision 1 is reviewed and published at
    783f4929a97cb33445109593e95bda34132560f7. Its execution-profile foundation,
    strict sidecar contract, immutable persisted-profile reuse, transport
    provenance, opaque model identifiers, and MiniMax isolation are the required
    implementation baseline and must not be redesigned.
  - >
    docs/AIOS-EXECUTION-PROFILE-SELECTION.md is the Human-approved planning
    baseline. Human explicit selection outranks repository defaults; omitted
    values resolve from repository policy; every new PRIMARY, REMEDIATION, or
    REPAIR authorization resolves a fresh profile; restart/reconciliation of the
    same authorization reuses its exact already-bound profile.
  - >
    The current repository-owned policy still contains the TASK-162 compatibility
    defaults gpt-5.6-sol/high for Codex and gemini-3.8-flash/high for Antigravity.
    TASK-163 is the sole activation milestone for gpt-6-sol/medium and
    gemini-3.8-flash/medium.
  - >
    Current new-request contracts are PRIMARY wakeup request v2, REMEDIATION intent
    request v1, and REPAIR wakeup request v1. Current durable PRIMARY dispatch
    journal is profile-unaware v2 and REMEDIATION/REPAIR dispatch journals are
    profile-unaware v1. Historical records must remain readable and immutable.
  - >
    Antigravity MiniMax remains outside Execution Profile management. Existing
    local MiniMax execution without model/effort override must remain supported,
    while model/effort override options must not be silently applied to MiniMax.
  - >
    Runtime owns deterministic resolution/binding, admission, lifecycle reduction,
    verification, and evidence; Human owns explicit Executor/model/effort choice;
    Brain owns TASK semantics only; Executor owns implementation HOW; Reviewer and
    Publisher authorities remain unchanged.

