non_goals:
  - >
    Change canonical TASK schema, frozen RUN schema, RunLease, ExecutorBoundary,
    Unified State lifecycle semantics, sandbox/mutation authority, Runtime
    verification/EVIDENCE, Reviewer verdict semantics, Publisher authority, or
    roadmap advancement.
  - >
    Add automatic model routing, model scoring, task-difficulty classification,
    adaptive effort selection, fallback, retry, failover, Executor substitution,
    speculative execution, or multi-model voting.
  - >
    Add a repository-global allowlist of provider model identifiers or require a
    code branch merely because a compatible provider-native model identifier is new.
  - >
    Store a persistent Human preferred model/effort, create sticky inheritance
    across new authorizations, use conversation/model memory as default authority,
    or make Brain resolve omitted model/effort values.
  - >
    Change Antigravity MiniMax native model semantics or bring MiniMax into the
    Codex/Antigravity Execution Profile policy.
  - >
    Rewrite, migrate, backfill, reinterpret, or invalidate historical carrier
    requests, durable dispatch journals, RUNs, execution-profile sidecars, or
    terminal artifacts.
  - >
    Require live provider availability, account entitlement, or network success as
    canonical deterministic verification. Native provider rejection of an exact
    requested model remains an execution failure and must not trigger fallback.
  - >
    Modify Codex/Antigravity adapter command architecture or Dispatcher routing
    architecture solely to activate new defaults; TASK-162 already established
    exact injected-profile behavior.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Activate exactly one repository-owned default authority by changing
      .ai/executor-profiles.yaml to Codex gpt-6-sol with medium effort and
      Antigravity gemini-3.8-flash with medium effort. Do not duplicate these
      defaults in adapters, carrier modules, workflows, CLI code, or tests as a
      second operational authority.
    - >
      Human-facing local execution surfaces must accept optional exact model and
      effort overrides for profile-managed Codex/Antigravity execution, including
      run, continue, REMEDIATION, and coding REPAIR paths. Human explicit values
      override only the supplied dimension; omitted dimensions resolve from the
      repository policy. Explicit values that equal the current default remain
      attributed as EXPLICIT.
    - >
      Omitted model/effort values must be resolved by deterministic repository code,
      never by Brain memory or carrier hard-coding. Model identifiers remain opaque
      bounded provider-native strings; reasoning effort remains validated against
      the selected Executor capability policy before native invocation.
    - >
      Resolution is per new execution authorization. A new PRIMARY, REMEDIATION, or
      REPAIR authorization must resolve fresh defaults for omitted values and must
      not implicitly inherit the prior RUN profile. Restart, replay, or
      reconciliation of the same authorization must reuse the exact already-bound
      profile and must not re-resolve changed defaults.
    - >
      New versioned remote requests must carry the Human-requested model and effort
      dimensions explicitly as present values or explicit absence/default intent.
      PRIMARY wakeup becomes request version 3, REMEDIATION intent becomes request
      version 2, and REPAIR wakeup becomes request version 2. Newly submitted legacy
      request versions must fail closed; historical legacy artifacts remain readable.
    - >
      Remote carrier admission must deterministically resolve one exact profile from
      the Human request plus the canonical policy before self-host native execution.
      The exact executor, model, reasoning_effort, model_source, and effort_source
      must be propagated through the remote workflow boundary without later
      re-resolution or silent substitution.
    - >
      New durable PRIMARY, REMEDIATION, and REPAIR dispatch record versions must bind
      the exact resolved profile identity in addition to their existing selectors.
      Reuse of one dispatch identity with any changed executor/profile value or source
      attribution must fail closed before native invocation; exact replay must remain
      idempotent. Existing historical journal versions must remain readable and must
      never acquire retroactive profiles.
    - >
      When a RUN is created for a profile-managed execution, the persisted
      TASK-162 execution-profile sidecar must exactly match the profile bound by the
      local authorization or durable remote dispatch. Any mismatch, invalid effort,
      malformed profile selection, or conflicting persisted sidecar must invoke zero
      native Executors.
    - >
      Operational receipts may expose the exact bounded profile selectors needed to
      diagnose remote delivery, but remain subordinate operational observations and
      must never claim RUN creation, native success, Runtime verification, semantic
      review, or publication beyond directly proven boundaries.
    - >
      Human-supplied model/effort options without a valid profile-managed Executor
      must fail closed or return an executor-required Human surface without native
      invocation. Antigravity MiniMax execution without profile overrides remains
      unchanged; model/effort overrides must not be silently ignored or applied to
      MiniMax.
    - >
      Provider-native unavailability or rejection of an exact syntactically valid
      model must remain an ordinary native execution failure. AIOS must not
      downgrade effort, replace the model, swap Executor, retry with another profile,
      or convert provider failure into deterministic validation policy.
    - >
      Preserve TASK-162 future-evolution invariant: for an already-supported
      Executor with unchanged native invocation contract, a later compatible default
      model change must require only repository policy change plus focused
      validation/smoke. It must not require another carrier schema, Dispatcher,
      adapter, frozen RUN, or lifecycle redesign.
    - >
      Do not modify files outside scope.modify and do not push or publish from
      Executor implementation.

acceptance:
  - id: AC1
    condition: >
      Repository policy defaults are exactly Codex gpt-6-sol/medium and Antigravity
      gemini-3.8-flash/medium, and tests prove the policy remains the sole default
      authority with no adapter/carrier/workflow duplicate default constants.
  - id: AC2
    condition: >
      Local run and continue plus canonical REMEDIATION and coding REPAIR surfaces
      accept partial or complete Human model/effort overrides for Codex/Antigravity,
      resolve omitted dimensions deterministically, preserve EXPLICIT versus
      REPOSITORY_DEFAULT attribution, and deliver exact values to native command
      construction.
  - id: AC3
    condition: >
      A new authorization never implicitly inherits the previous RUN profile, while
      replay/restart/reconciliation of the same authorization reuses its exact bound
      profile even after repository defaults change.
  - id: AC4
    condition: >
      PRIMARY remote carrier v3 validates one exact Human request, resolves one exact
      profile from canonical policy, propagates it through self-host delivery, and
      binds it into a new profile-aware durable PRIMARY dispatch identity before RUN
      native execution.
  - id: AC5
    condition: >
      REMEDIATION intent v2 and REPAIR wakeup v2 provide the same exact
      request-resolution, workflow propagation, durable dispatch binding,
      idempotent replay, and changed-profile collision rejection guarantees as
      PRIMARY.
  - id: AC6
    condition: >
      New profile-aware dispatch records and the eventual per-RUN execution-profile
      sidecar agree exactly on executor/model/effort/source attribution; any
      disagreement or invalid profile fails before native invocation.
  - id: AC7
    condition: >
      Historical PRIMARY v1/v2, REMEDIATION v1, and REPAIR v1 durable journals
      remain readable/reconcilable under their historical semantics, while newly
      submitted legacy carrier request versions are rejected rather than silently
      applying current defaults.
  - id: AC8
    condition: >
      Invalid effort, malformed model identifier, missing required Executor/profile
      context, and profile options supplied to MiniMax invoke zero native Executors;
      MiniMax execution without profile options remains behaviorally unchanged.
  - id: AC9
    condition: >
      A syntactically valid explicit alternate/future provider-native model identifier
      can flow end-to-end through local and remote profile binding without source-code
      registration or a global allowlist. Native provider rejection remains a
      no-fallback execution failure.
  - id: AC10
    condition: >
      Remote operational receipts can retain bounded exact profile selectors where
      relevant without becoming lifecycle truth, and existing carrier receipts still
      avoid asserting RUN/verification/review/publication success from workflow
      completion alone.
  - id: AC11
    condition: >
      Frozen TASK/RUN/RunLease/ExecutorBoundary semantics, Dispatcher exactly-one
      selection, sandbox/mutation authority, Runtime verification/EVIDENCE, Reviewer,
      Publisher, and no-retry/no-reroute boundaries remain unchanged.
  - id: AC12
    condition: >
      Focused regression proves that after TASK-163 a compatible future default
      change can be expressed by editing only repository profile policy plus focused
      validation/smoke, with no required adapter, Dispatcher, Human carrier schema,
      durable dispatch schema, or lifecycle redesign.

