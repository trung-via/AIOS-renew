task_id: TASK-191
revision: 1

goal: >
  Establish BP8-P1 as one deterministic, offline, provider-bound real-Reviewer
  proof transport for the Human-selected Antigravity/Gemini 3.8 Flash path,
  capable of carrying one exact existing AIOS_REVIEW_REQUEST v1 through a
  repository-blind read-only native invocation boundary and returning material
  consumable by the already-reviewed Reviewer provider shell, without making
  Gemini a default Reviewer, performing a real external invocation in this TASK,
  or changing Reviewer/lifecycle authority.

problem: >
  BP-6 proves a provider-neutral one-call Reviewer protocol with independent
  non-network adapters, and BP-7 proves fresh-context/provider continuation, but
  AIOS does not yet have a reviewed provider-bound native transport surface that
  can be used for the first controlled real non-default Reviewer proof in BP8-P2.
  Reusing the Antigravity Executor adapter would merge role mechanics and grant
  unnecessary repository/mutation authority, while embedding the complete Reviewer
  request on a Windows command line is unsafe because the canonical request may be
  much larger than practical command-line limits. BP8-P1 therefore needs only a
  narrow, isolated, read-only Gemini Reviewer transport that composes with the
  existing Reviewer protocol and leaves the later real call and canonical evidence
  to BP8-P2.

assumptions:
  - >
    Canonical planning at 9af9713e9c79bcc0b3a71f73ae4d8a7ec2289f66 records
    BP-7 complete, BP-8 as the unique NEXT milestone, and explicit Human/Brain
    selection of the Antigravity native transport with model gemini-3.8-flash as
    the first real Reviewer proof only; this is not a default-provider decision.
  - >
    src/aios_renew/reviewer_provider.py and
    src/aios_renew/reviewer_provider_protocol.py remain the authoritative BP-6
    one-call invocation and semantic request/decision validation surfaces.
  - >
    The existing Reviewer request is bounded to 2097152 UTF-8 bytes and provider
    semantic response to 196608 bytes by the reviewed protocol, while
    JsonReviewerProvider independently bounds the native wrapper to 262144 bytes.
  - >
    Existing Antigravity native execution code is Executor-specific reference
    material only. Its repository access, execution-profile policy, mutation flags,
    ResultPackage semantics and Executor instruction contract must not be imported
    or reused as Reviewer authority.
  - >
    BP8-P2, not this TASK, owns the first real provider invocation and Runtime-owned
    evidence that proves an actual remote Gemini call. TASK-191 verification is
    deterministic and offline with an injected process runner only.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md
    - .ai/roadmap-state.yaml
    - .ai/executor-profiles.yaml
    - src/aios_renew/reviewer_provider.py
    - src/aios_renew/reviewer_provider_protocol.py
    - src/aios_renew/reviewer_procedure.py
    - src/aios_renew/reviewer_return_contract.py
    - src/aios_renew/review_material.py
    - src/aios_renew/antigravity_adapter.py
    - tests/test_reviewer_provider.py
    - tests/test_antigravity_adapter.py
    - pyproject.toml
  modify:
    - src/aios_renew/gemini_reviewer_transport.py
    - src/aios_renew/schemas/gemini_reviewer_semantic_response.json
    - tests/test_gemini_reviewer_transport.py

non_goals:
  - Make Gemini 3.8 Flash, Antigravity, or any provider/model the default Reviewer or preferred Reviewer.
  - Add a provider registry, model scorer, selector, router, retry, fallback, failover, voting, consensus, or automatic provider switch.
  - Modify reviewer_provider.py, reviewer_provider_protocol.py, REVIEW schema, review.validate_review, Decision Packet, Unified State, Runtime, ingress, Publisher, terminal attention, or frozen Kernel semantics.
  - Import or reuse codex_adapter.py, antigravity_adapter.py, execution_profile.py, Executor policy, ResultPackage mechanics, or Executor repository/mutation permissions as Reviewer authority.
  - Perform a real Gemini/Antigravity invocation, require live credentials, access the network, or claim the BP-8 exit gate in TASK-191 verification.
  - Persist provider prompts, raw native responses, reasoning traces, chat/session state, credentials, environment contents, or a provider memory store.
  - Create a generic provider-native transport abstraction intended for arbitrary future providers.
  - Submit a canonical REVIEW, author remediation/repair, publish, mutate roadmap state, or create any lifecycle state from the provider transport.
  - Modify workflows, operator commands, repository defaults, executor profiles, existing tests, or downstream repositories.

constraints:
  hard:
    - >
      Mutation is limited exactly to the three paths in scope.modify. If a correct
      implementation requires changing an existing Reviewer protocol/provider,
      Executor adapter/profile, workflow, Runtime, ingress, publication, roadmap,
      package configuration, or frozen specification, stop with an unresolved item
      rather than widening TASK-191.
    - >
      The production path is proof-specific, not a new default: it is bound to the
      selected Antigravity native transport and model gemini-3.8-flash. No module
      import, registration side effect, global configuration, executor profile, or
      Reviewer protocol may cause this path to be selected implicitly.
    - >
      Reasoning effort is operational input for the later proof and must be supplied
      explicitly by the caller with no TASK-191 default. Invalid or absent effort
      must fail before native process invocation; the transport must not read the
      Executor execution-profile policy to obtain one.
    - >
      The transport must accept the exact strict-JSON request bytes supplied by the
      existing JsonReviewerProvider callable boundary. It may enforce transport byte
      bounds and compute operational digests, but it must not reinterpret, augment,
      truncate, summarize, or independently validate Reviewer semantics.
    - >
      Full Reviewer request bytes must never be embedded in the native command line
      or prompt argument. Each invocation must create one fresh isolated temporary
      workspace outside repository authority, write the exact request bytes there,
      expose only that bounded workspace to the native process, and remove the
      workspace on both success and failure. Repository paths, Git/GitHub handles and
      unrelated filesystem paths must not be exposed to the model.
    - >
      The provider instruction must be transport-minimal: identify the transient
      REVIEWER role, direct the model to consume only the supplied exact
      AIOS_REVIEW_REQUEST and its embedded procedure/return-contract material, forbid
      repository/Git/GitHub discovery and mutation, and require only the semantic
      response shape. It must not add semantic review criteria, acceptance answers,
      verdict preferences, hidden prior context, or provider-specific reasoning
      content beyond what the request already contains.
    - >
      The schema added by this TASK is a native output-shaping schema only. It may
      constrain the outer provider semantic response needed by P3, but must not
      duplicate the REVIEW grammar, acceptance/finding semantics, P2B return-contract
      validator, review.validate_review, or any semantic authority already owned by
      the BP-6 protocol.
    - >
      Native invocation must be read-only and single-shot. It may select only the
      fixed model gemini-3.8-flash plus the explicit caller-supplied effort and
      bounded structured-output/time-limit mechanics. It must not pass
      accept-edits/dangerous mutation permissions, grant repository access, run
      shell/Git operations on behalf of Reviewer, invoke another model, or retry,
      reroute or fall back after any failure.
    - >
      The provider-bound parser must independently and strictly validate the native
      process envelope needed for transport: bounded UTF-8 output, successful native
      status, one mapping structured_output, and a bounded provider-native usage/call
      witness. Duplicate/malformed JSON, nonzero process exit, timeout, missing
      structured output, missing/invalid witness, or over-bound output must fail
      closed as transport/response failure and never fabricate a REVIEW or lifecycle
      state.
    - >
      Successful native material returned to JsonReviewerProvider must contain only
      the semantic_response plus the existing closed operational attribution fields.
      Provider/model attribution must identify the selected Antigravity /
      gemini-3.8-flash proof path. Session/invocation identifiers may be null when
      the native transport does not provide verified values; synthetic identifiers
      must not be invented merely to look attributable.
    - >
      Any provider-native usage/call observation retained after the call must be
      immutable, bounded, transient operational metadata only. It may bind the exact
      request-byte digest, configured provider/model/effort, invocation count and
      bounded native usage/call witness, but must retain no raw request, raw response,
      credential, environment snapshot or reasoning trace and must never label itself
      canonical EVIDENCE. BP8-P2 Runtime-owned evidence remains the only authority for
      the future real-call proof.
    - >
      The transport must neither inspect nor serialize credentials. Authentication
      may be inherited by the native CLI from the Human-controlled environment in
      BP8-P2, but command arguments, temporary files, normalized observations, error
      messages and test fixtures must contain no secret value or environment dump.
    - >
      Focused tests must use only injected deterministic process runners and fresh
      temporary fixtures; they must never launch agy or another external provider.
      Tests must prove maximum-bound request delivery does not grow the command with
      request content, isolated workspace cleanup, exact one-process-call stop
      semantics, read-only capability flags, strict envelope/output bounds, and
      successful composition through the existing JsonReviewerProvider plus P3
      validation.
    - >
      Focused tests must also prove authority isolation: the new transport has no
      dependency on codex_adapter, antigravity_adapter, execution_profile, Runtime,
      authoring ingress or publication modules; no existing Reviewer/provider/default
      file is changed; and provider/model operational attribution cannot alter the
      request or validated decision fingerprint.
    - >
      TASK-191 completion means only that the dedicated offline BP8-P1 path is
      reviewed and ready for a separately authorized BP8-P2 controlled real
      invocation. It must not claim real-provider evidence, Gemini quality,
      provider preference, BP-8 completion, or downstream readiness.

acceptance:
  - id: AC1
    condition: >
      A dedicated Antigravity/Gemini 3.8 Flash Reviewer proof transport exists with
      no implicit registration/default activation: model is proof-bound to
      gemini-3.8-flash, effort is explicit with no default, and existing Reviewer
      provider selection plus executor-profile policy remain unchanged.
  - id: AC2
    condition: >
      One exact JsonReviewerProvider request up to the canonical request bound is
      delivered byte-for-byte through a fresh isolated temporary workspace rather
      than command-line embedding; the native command remains bounded independently
      of request size, exposes no repository path, and the workspace is removed on
      success and every tested failure.
  - id: AC3
    condition: >
      The native Reviewer invocation is demonstrably read-only and single-provider:
      exactly one process call uses only the selected Gemini model, explicit effort,
      bounded structured-output/time mechanics and the isolated request workspace,
      with no Executor mutation flags, repository/Git capability, second provider,
      retry, fallback or reroute.
  - id: AC4
    condition: >
      Valid provider-native structured output is normalized into the exact existing
      JsonReviewerProvider wrapper and then validated by the unchanged BP-6 P3
      protocol into an AIOS_REVIEW_DECISION; the new output schema/parser performs
      transport shaping only and does not duplicate semantic REVIEW validation.
  - id: AC5
    condition: >
      Native nonzero exit, timeout, malformed/duplicate/over-bound output, invalid
      status, missing structured output, invalid provider-native witness and invalid
      P3 semantic response all fail closed after at most one native process call
      using the existing pre-REVIEW failure boundary, without canonical REVIEW,
      RUN failure, remediation, retry or fallback.
  - id: AC6
    condition: >
      Successful calls expose only bounded immutable transient operational
      observation sufficient for later BP8-P2 attribution—request digest,
      Antigravity/gemini-3.8-flash identity, explicit effort, one-call count and
      validated native usage/call witness—while retaining no raw request/response,
      credentials, environment, reasoning/session content and creating no canonical
      EVIDENCE.
  - id: AC7
    condition: >
      Static and behavioral tests prove role/authority isolation: no import/reuse of
      Executor adapters or execution-profile routing, no Runtime/ingress/Publisher
      dependency, no repository mutation/discovery authority, no change to existing
      Reviewer contracts/defaults, and operational attribution does not change
      semantic request/decision fingerprints.
  - id: AC8
    condition: >
      The entire TASK-191 verification is deterministic and offline with injected
      runners only, covers the dedicated BP8-P1 production and schema surfaces, and
      explicitly proves that no real provider invocation or BP-8 completion claim is
      made; the resulting path is ready only for a separately authorized BP8-P2 real
      call.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_gemini_reviewer_transport.py
