task_id: TASK-079
revision: 1

goal: >
  Eliminate the observed native REMEDIATION structural-output contract mismatch by making
  both Codex and Antigravity use a remediation-specific structured-output schema that
  enforces the existing Runtime contract before native output reaches completion: root
  evidence must be empty, result.claims must be empty, and result.unresolved must be empty,
  while result.head_sha and result.changed_files remain structurally declared by the selected
  Executor. Preserve TASK-055 adapter ownership, TASK-052 Runtime completion authority,
  exactly-one selected Executor invocation, fail-closed behavior, and all existing PRIMARY,
  REPAIR, review, remediation, and publication semantics.

problem: >
  Python Agent historical FIX RUN-156-007, executed through the downstream pin at AIOS-renew
  ba0cc66324fc2310812945a351bfc001a41f99f8, produced a clean in-scope committed remediation
  candidate 38e087e6925b1e7bac81c0eddc8b4dbb8992ff25 but failed at COMPLETION_GATE with
  `remediation RESULT claims must be empty`. The current Runtime is enforcing its established
  narrow-remediation contract correctly: remediation structural ResultPackage claims and
  unresolved items are forbidden before affected verification. Both native adapter prompts
  already instruct the Executor to return empty root evidence, result.claims, and
  result.unresolved for REMEDIATION. However both adapters also pass the generic
  `schemas/result_package.json` to their native structured-output mechanism, and that schema
  permits non-empty claims, unresolved, and evidence arrays. Therefore an Executor can satisfy
  the native schema while still producing output that deterministically fails the Runtime
  completion contract. This is an avoidable adapter/native-mechanics mismatch that wastes an
  admitted FIX, Human time, and a later recovery cycle.

assumptions:
  - >
    Current canonical AIOS-renew main at TASK-079 authoring is
    ba0cc66324fc2310812945a351bfc001a41f99f8, the published TASK-078 source candidate.
  - >
    TASK-055 remains the semantic authority for provider-specific Codex/Antigravity native
    command/schema mechanics behind the provider-neutral Dispatcher. TASK-052/Runtime remains
    the sole canonical completion and verification authority.
  - >
    `RuntimeCompletion._require_remediation_result` and
    `_require_remediation_package_contract` intentionally fail closed when remediation
    `result.claims` is non-empty or `result.unresolved` is non-empty. TASK-079 must align native
    structured-output mechanics to this existing contract rather than weaken or normalize away
    those Runtime gates.
  - >
    `CodexAdapter.remediation_prompt_for` and Antigravity REMEDIATION native instructions already
    require empty root evidence, result.claims, and result.unresolved, so prompt semantics do not
    need to be redesigned; schema enforcement is the missing deterministic boundary.
  - >
    `pyproject.toml` already packages `schemas/*.json`, so a new remediation-specific JSON schema
    under `src/aios_renew/schemas/` requires no package-data authority change.
  - >
    The observed downstream RUN-156-007 failure is preserved as evidence. TASK-079 does not repair,
    rerun, publish, or otherwise mutate Python Agent TASK-156.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-052.yaml
    - .ai/tasks/TASK-055.yaml
    - .ai/tasks/TASK-056.yaml
    - .ai/tasks/TASK-078.yaml
    - src/aios_renew/runtime.py
    - src/aios_renew/dispatcher.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/schemas/result_package.json
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_dispatcher.py
    - tests/test_runtime.py
    - pyproject.toml
  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/schemas/remediation_result_package.json
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py

non_goals:
  - Change Runtime remediation completion semantics, acceptance semantics, canonical verification,
    RESULT/EVIDENCE authority, REVIEW, REMEDIATION, REPAIR, publication, or transport lineage.
  - Strip, rewrite, silently ignore, or canonicalize invalid native claims/unresolved/evidence after
    they are produced. Runtime must remain fail-closed if a native harness violates its bound schema.
  - Change PRIMARY or REPAIR ResultPackage schema semantics or require PRIMARY/REPAIR claims to be empty.
  - Change TASK-078 historical FIX subject isolation, TASK-067 finding resolution, TASK-058/TASK-077
    historical REPAIR recovery, or any downstream Python Agent logic.
  - Add retry, fallback, reroute, second native invocation, output-repair model call, parser heuristic,
    model switch, or executor substitution when structured output is invalid.
  - Move provider-specific schema selection into Dispatcher or Operator; it remains adapter-native mechanics.
  - Modify Human-facing commands, worker surfaces, model defaults, deadline semantics, sandbox/mode policy,
    or execution permissions.
  - Repair or rerun Python Agent RUN-156-007 as part of TASK-079 verification.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Add one packaged remediation-specific JSON schema whose required top-level/result fields remain
      structurally compatible with ResultPackage, but which deterministically constrains root `evidence`,
      `result.claims`, and `result.unresolved` to empty arrays. `result.head_sha` remains a non-empty
      string and `result.changed_files` remains an array of non-empty path strings.
    - >
      Codex REMEDIATION must pass the remediation-specific schema to the native `--output-schema`
      mechanism. Codex PRIMARY and REPAIR must continue to use the existing generic ResultPackage schema.
    - >
      Antigravity REMEDIATION must pass the same remediation-specific schema to the native `--json-schema`
      mechanism. Antigravity PRIMARY and REPAIR must continue to use the existing generic ResultPackage schema.
    - >
      Schema selection is provider-specific native command mechanics and therefore remains behind each
      adapter boundary established by TASK-055. Dispatcher must not gain Codex/Antigravity schema-path
      policy or operation-specific native flags.
    - >
      Runtime's existing fail-closed remediation checks remain authoritative and unchanged. Do not strip
      or mutate claims/unresolved/evidence to manufacture conformance after native output is returned.
    - >
      Exactly one selected Executor invocation remains authoritative. Invalid or schema-rejected native
      output is terminal to that admitted invocation with no retry, fallback, reroute, alternate schema,
      second model call, or executor switch.
    - >
      Existing REMEDIATION prompts/instructions must remain semantically consistent with the stricter
      schema: empty root evidence, empty result.claims, empty result.unresolved, final committed HEAD for
      CODE_FIX, no commit for EVIDENCE_ONLY, no push, Runtime-owned affected verification.
    - >
      Tests must prove operation-specific schema selection for both adapters and must inspect the packaged
      remediation schema itself to prove zero-item constraints. They must also prove PRIMARY/REPAIR still
      select the generic schema and that exactly-one/no-retry behavior is unchanged.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      `src/aios_renew/schemas/remediation_result_package.json` is packaged by the existing schema package-data
      rule and deterministically permits only empty root evidence, empty result.claims, and empty
      result.unresolved while retaining required result.head_sha and result.changed_files structure.
  - id: AC2
    condition: >
      CodexAdapter uses the remediation-specific schema for REMEDIATION native structured output, while
      PRIMARY and REPAIR continue to use the existing generic ResultPackage schema without semantic change.
  - id: AC3
    condition: >
      AntigravityAdapter uses the same remediation-specific schema for REMEDIATION native structured output,
      while PRIMARY and REPAIR continue to use the existing generic ResultPackage schema without semantic change.
  - id: AC4
    condition: >
      Adapter prompts/instructions and schema now encode the same pre-verification REMEDIATION contract, so
      the exact RUN-156-007 class of non-empty remediation claims cannot be schema-valid native output.
      Runtime fail-closed checks remain unchanged and no adapter silently strips or rewrites invalid output.
  - id: AC5
    condition: >
      Dispatcher remains provider-neutral and exactly-one invocation, timeout, no-retry/no-fallback/no-reroute,
      native role/no-reentry, sandbox/mode, and executor-selection behavior remain unchanged.
  - id: AC6
    condition: >
      Focused Codex/Antigravity adapter regressions, Dispatcher regressions, Runtime regressions, and
      `git diff --check` all pass on the final candidate without executing any downstream Python Agent task.

verification:
  required:
    - 'python -m pytest tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_dispatcher.py tests/test_runtime.py -q'
    - 'git diff --check'
