task_id: TASK-337
revision: 4
goal: Prospectively restore lawful canonical historical terminal reconciliation and
  AUTHOR_REPAIR eligibility for TASK-336 after the TASK-337 revision-3 self-hosting
  deadlock. Deliver the narrowly scoped, fail-closed reader and regression-fixture
  correction as a new ordinary PRIMARY from canonical main, preserving all revision-3
  FAILED RUNs and original engineering lineage.
problem: TASK-337 r3 RUN-337-004 through RUN-337-007 terminated without reviewed publication.
  Current main still classifies nested V2 FAILURE verification metadata containing
  evidence_id but no full EVIDENCE raw field as a full evidence record. Unified State
  can therefore block with MALFORMED_CANONICAL_STATE, preventing AUTHOR_REPAIR for
  the r3 failed tip (and historical TASK-336 RUN-336-004) before correction ingress.
  The r3 candidate commits d7d15ca514df5e568538f1886daf9d3c1b51c7e1 and 057180502792c6d4a7ead882623fd1b0101f1f63
  are unreviewed implementation references only, not authority or proven results.
  The r3 RUN-337-007 Completion Gate also found missing implementation claims for
  AC3 and AC6. Revision 4 must remove both risks without rewriting or bypassing prior
  lineage.
assumptions:
- Human explicitly approved prospective TASK-337 revision 4 as an ordinary new PRIMARY,
  not a REPAIR of revision 3. The expected canonical authoring base is main e59db7dc98b70f083d0a22b0c982e0e48885dd4f;
  ingress must enforce fresh expected-main CAS and revision continuity.
- Immutable r3 RUN-337-004 through RUN-337-007 FAILURE/REPAIR and r2 reviewed/published
  evidence remain historical and unmodified. Do not treat their candidate implementation
  or Executor claims as Runtime verification evidence.
- The latest observed r3 failed tip is RUN-337-007 with candidate 057180502792c6d4a7ead882623fd1b0101f1f63
  and COMPLETION_GATE failure; a revision-4 PRIMARY starts from current canonical
  main instead of this candidate.
- TASK-336 RUN-336-001 through RUN-336-004 are a distinct immutable historical lineage;
  this TASK only fixes read-only observation/authoring eligibility, not its implementation
  or execution.
- Revision 4 preserves existing LEGACY_REPOSITORY_DEFAULT_ROUTE and the Human-selected
  Codex GPT-6.1 Sol xhigh as external operational delegation; the semantic TASK itself
  is executor-neutral.
scope:
  inspect:
  - docs/AIOS-MANIFESTO.md
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
  - .ai/roadmap-state.yaml
  - .ai/tasks/TASK-336.yaml
  - src/aios_renew/unified_state.py
  - src/aios_renew/verification_contract.py
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/review_transport.py
  - tests/test_operator.py
  - tests/test_authoring_ingress.py
  modify:
  - src/aios_renew/unified_state.py
  - tests/test_operator.py
  - tests/test_authoring_ingress.py
non_goals:
- No execution, authoring, repair or publication of TASK-336; no REPAIR of failed
  TASK-337 revision-3 RUNs; no re-opening or mutation of immutable RUN, RESULT, FAILURE,
  REPAIR, REMEDIATION, REVIEW, EVIDENCE or refs.
- No change to Runtime admission/completion, correction strategy, review/publication
  semantics, private/public writers, GitHub workflow, branch rulesets, credentials,
  verification engine, or downstream repository.
- No auto-retry, manual tampering with canonical history, copying candidate artifacts
  into main outside the admitted Executor, default PASS, skip/xfail, weakening of
  raw evidence checks, or bypass of Unified State.
- No broad full-suite or unneeded equivalent baseline re-execution solely for ceremony;
  no new scheduler, router, reviewer, publisher or evidence authority.
constraints:
  hard:
  - The reader must distinguish a nested V2 FAILURE verification reference from a
    full EVIDENCE object using explicit structural context and validated fields; a
    mere evidence_id is insufficient to classify either representation.
  - Full EVIDENCE still requires authenticated raw/result/identity fields and fails
    closed for missing or malformed fields. Metadata references must preserve exact
    observation, digests, command, source and candidate SHA, correction ancestry and
    no evidence provenance substitution.
  - Preserve only explicitly privacy-allowlisted private/public differences; reject
    fabricated public placeholders, spoofed reference or complete EVIDENCE, malformed
    metadata, changed task/run/head/digest identity and parent/authorization contradictions.
    Do not suppress parsing exceptions globally.
  - Historical TASK-336 four-RUN reproduction must be read-only and must not leak
    private raw paths or force AUTHOR_REPAIR if an independent canonical blocker exists.
  - Windows test fixtures must reproduce exact canonical raw TASK bytes even with
    core.autocrlf and Git checkout conversions, while detecting deliberate CRLF working-tree
    drift without relaxing production authoring gates.
  - Modify only the three explicitly listed source/test files. Commits d7d15ca514df5e568538f1886daf9d3c1b51c7e1
    and 057180502792c6d4a7ead882623fd1b0101f1f63 are non-authoritative references
    to reassess, not a prescribed cherry-pick or completion proof.
  - Provide a complete structural ResultPackage with truthful, specific implementation
    claims covering all acceptance IDs before Runtime verification; do not fabricate
    verification evidence or mark unexecuted tests PASS. Runtime owns minimum-sufficient-v2
    verification and reuse; duplicate/unchanged base replay is forbidden without relevant
    invalidation.
  - A new revision-4 PRIMARY must be based on exact canonical main with fresh TASK
    revision, original legacy return affinity and Human-selected Executor delegation
    held outside TASK. Do not author, run or automatically dispatch an r3 REPAIR.
acceptance:
- id: AC1
  condition: The implementation distinguishes nested reference-only V2 verification
    observations under FAILURE/REPAIR metadata from complete EVIDENCE records, allowing
    valid references without a raw object while validating complete EVIDENCE with
    its required fields.
- id: AC2
  condition: The reader deterministically reconstructs the four historical TASK-336
    terminal identities and private/protected-public comparison, yielding the lawful
    RUN-336-004 AUTHOR_REPAIR eligibility when all independent guards pass, and an
    explicit blocker when they do not.
- id: AC3
  condition: The metadata reader rejects spoofed reference-only objects, incomplete
    full EVIDENCE, corrupted observation digests, mismatched run/task/head/authorization
    identities, malformed correction ancestry and unauthorized privacy differences
    without changing original artifacts.
- id: AC4
  condition: The test fixture for normal TASK-336 historical AUTHOR_REPAIR admission
    preserves exact committed .ai TASK bytes under Windows core.autocrlf settings
    and includes an adversarial CRLF-only raw-byte divergence rejection case.
- id: AC5
  condition: The candidate preserves previous reviewed TASK-337 r2 behavior and existing
    publication-recovery protections, limits its committed implementation delta to
    the three authorized source/test files and leaves immutable prior RUN, FAILURE
    and REPAIR state untouched.
- id: AC6
  condition: The candidate contains executable targeted positive and adversarial terminal_reconciliation
    tests covering the historical TASK-336 reader, normal protected/unprotected authoring,
    missing raw, changed identities and CRLF drift without skips, expected failures
    or weakened validation; each test is selectable by the authored command.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_operator.py tests/test_authoring_ingress.py -k
    terminal_reconciliation
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
