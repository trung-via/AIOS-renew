task_id: TASK-337
revision: 3
goal: >-
  Correct the verified post-r2 historical terminal reconciliation regression
  in TASK-336 lineage: distinguish evidence-id references in nested
  FAILURE/REPAIR metadata from full verification EVIDENCE objects with raw
  locators. Restore bounded, deterministic Unified State observation and
  lawful AUTHOR_REPAIR eligibility for RUN-336-004 without weakening private/
  public integrity, rewriting immutable artifacts, or implementing TASK-336.
problem: >-
  After the reviewed and published TASK-337 r2 candidate
  92c33d8552e41c174be36146f1a6268f52cd62c6, a canonical read-only
  diagnosis of TASK-336 r1 reported four canonical terminals but
  observe_unified_state returned BLOCKED / MALFORMED_CANONICAL_STATE with
  KeyError 'raw' during _decode_remote_lifecycle. In unified_state.py the
  metadata projection invokes full evidence(raw, result) handling on any
  mapping containing an evidence_id, even when that mapping is only a
  historical evidence reference lacking a raw field. Consequently
  AUTHOR_REPAIR for the exact terminal RUN-336-004 was correctly rejected
  before ingress. A fail-closed schema-aware reader correction is required;
  the underlying historical documents must remain immutable.
assumptions:
  - >-
    Human explicitly approved revision 3 as a prospective narrow
    correction to the already reviewed and published revision 2 capability.
    Canonical authoring base is main 92c33d8552e41c174be36146f1a6268f52cd62c6;
    Runtime must independently verify expected-main CAS and existing TASK
    revision continuity before authoring or admitting a fresh PRIMARY.
  - >-
    TASK-337 r2 RUN-337-002, EVIDENCE_ONLY RUN-337-003,
    REVIEW-337-003 DELTA PASS and the published source are immutable
    verified history, not repairable or re-opened RUNs.
  - >-
    TASK-336 r1 remains a distinct unfinished forward recovery. Its
    RUN-336-001 through RUN-336-004 terminal/ref lineage is immutable.
    RUN-336-004 is the observed latest completion-gate FAILURE at candidate
    fc1cd55cb73cbbc13f530156877a14865d869da3; no canonical
    REPAIR authorization has yet been created for that RUN.
  - >-
    Historic large records and nested verification identity references
    can be structurally different from a complete EVIDENCE record.
    A plain evidence_id field cannot authorize access to a nonexistent
    raw locator or weaken digest, identity, SHA and claim bindings.
  - >-
    Return affinity for this revision remains the existing
    LEGACY_REPOSITORY_DEFAULT_ROUTE; previously selected sticky Codex
    GPT-6.1 Sol xhigh is operational delegation, not TASK semantic authority.
scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-336.yaml
    - src/aios_renew/unified_state.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/authoring_ingress.py
    - src/aios_renew/operator.py
    - src/aios_renew/publication.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
  modify:
    - src/aios_renew/unified_state.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
non_goals:
  - >-
    No change to private/public transport writer, review_transport.py,
    publication.py, Runtime admission, correction authoring semantics,
    Reviewer, Publisher, GitHub workflow or security configuration.
  - >-
    No edit, deletion, replacement, padding, replay or rewriting of
    historical TASK/RUN/RESULT/FAILURE/REPAIR/REMEDIATION/REVIEW/EVIDENCE
    documents, refs, raw sidecars or published source history.
  - >-
    No bypass of canonical Unified State, AUTHOR_REPAIR or freshness gates;
    no direct creation of REPAIR-336-004 or RUN for TASK-336; no implementation
    or publication of TASK-336's separate forward recovery.
  - >-
    No new router, scheduler, proof engine, broad V2 test rerun, base replay,
    provider switch, KA01 activation or downstream repository mutation.
constraints:
  hard:
    - >-
      Classify nested metadata evidence-id references by exact structural
      context and required fields, not by the mere presence of evidence_id.
      Require complete, validated raw/result/privacy fields for actual
      EVIDENCE objects where required; malformed or missing full evidence
      objects must still fail closed.
    - >-
      Preserve identity, command, digest, source/candidate SHA, task revision,
      correction parent, authorization, head/base, publication and review
      bindings. Missing required fields, changed private material and
      fabricated public placeholders must not become equivalent.
    - >-
      The metadata projection must preserve unrelated nested structure,
      references and verification provenance; only privacy-allowlisted
      representation differences may be compared after validation.
      Do not suppress KeyError/ValueError globally, default unknown data
      to PASS, or normalize away tampering.
    - >-
      Use bounded read-only reproduction for exact canonical TASK-336
      RUN-336-001 through RUN-336-004, including the historical large
      FAILURE, embedded correction metadata, and safe public transport.
      Do not copy private raw paths/secrets into tests or Git. If the
      actual blocker is additional/independent, report the exact blocker
      rather than force AUTHOR_REPAIR.
    - >-
      Regression coverage must contrast reference-only metadata with
      required full EVIDENCE records and include negative missing-raw,
      spoofed-reference, mismatched identity/SHA/digest, malformed
      correction linkage and public projection cases. Positive tests
      alone are insufficient for security-sensitive reconciliation.
    - >-
      Only the three listed source/test files may change. Existing
      reviewed publication-recovery protections and TASK-337 r2
      behavior must not regress; proof reuse is permitted only when
      exact Runtime validity conditions remain satisfied.
    - >-
      Keep minimum-sufficient-v2 Runtime verification. The new targeted
      regression family names must match the selected test command;
      report collection count and exact relevant nodeids to prevent
      the earlier one-test-only coverage gap. No automatic full suite
      or equivalent base replay.
acceptance:
  - id: AC1
    condition: >-
      Correctly formed nested verification/evidence reference metadata
      without raw remains readable in immutable terminal and correction
      lineage, with no KeyError, while complete EVIDENCE records retain
      their required raw/result checks and fail closed if incomplete.
  - id: AC2
    condition: >-
      Valid private and protected-public representations of historical
      TASK-336 RUN-336-001 through RUN-336-004 reconcile read-only,
      including large FAILURE metadata and repair ancestry, without
      mutation, new writer-size caps, raw disclosure or synthetic records.
  - id: AC3
    condition: >-
      On canonical history that satisfies all independent guards,
      Unified State identifies RUN-336-004 as the exact repairable
      failed tip and yields AUTHOR_REPAIR, enabling normal authoring
      admission without bypass. Any independently invalid condition
      still yields an explicit fail-closed blocker instead.
  - id: AC4
    condition: >-
      Adversarial nested reference/full-evidence cases, changed
      correction binding, missing required raw/result, malformed
      or conflicting public/private representations, and changed
      task/run/head/source/digest identities remain blocked.
  - id: AC5
    condition: >-
      The existing reviewed TASK-337 private/public reconciliation,
      publication-recovery security and authority boundaries remain
      intact. Revision 3 changes only the authorized three files;
      all previous canonical records remain immutable.
  - id: AC6
    condition: >-
      Runtime-owned focused verification explicitly executes the
      new historical metadata, TASK-336 lineage and adversarial
      regression cases (not only a pre-existing publication test),
      reports exact selected nodeids and pass/failure counts, and
      avoids repeating unaffected equivalent tests or base replay
      unless relevant state proves invalidation.
verification:
  policy: minimum-sufficient-v2
  required:
    - python -m pytest -q tests/test_operator.py tests/test_authoring_ingress.py -k "terminal_reconciliation"
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
