task_id: TASK-337
revision: 2
goal: >-
  Restore deterministic, fail-closed reconciliation between private local
  terminal/correction records and the safe public canonical Git projections,
  including exact publication-recovery to semantic-review handoff, without
  changing independent Runtime/Reviewer/Publisher authority or reopening
  any immutable prior RUN.
problem: >-
  TASK-336 forward recovery introduced bounded public redaction in terminal
  Git transport, but unchanged unified_state.py still compares some local
  private RUN/FAILURE/REPAIR documents directly with their public canonical
  counterparts. This produced 'local and canonical terminal state conflict'
  despite successfully resolved remote lifecycle and canonical decoding.
  A publication recovery regression also observed next_action NONE instead
  of SEMANTIC_REVIEW after a newly recovered, unreviewed result. The failure
  mechanisms must be distinguished and corrected without assuming that
  redacted records are identical, nor treating public placeholders as proof.
assumptions:
  - >-
    This Human-authorized revision 2 is authored against canonical AIOS-renew main
    425dabb5fbb9007476dad9eb0d6918162369f42c. Runtime must independently
    recheck expected-main CAS before canonicalizing the revised contract.
  - >-
    TASK-336 r1 is a separate, still-unpublished forward-recovery lineage.
    RUN-336-001 through RUN-336-004 failures and their exact canonical refs
    are immutable evidence, not permission to overwrite or replay a RUN.
  - >-
    RUN-337-001 of revision 1 failed canonical VERIFICATION against candidate
    74ada321ff91027a1b3d7ebce9b7656fd5ec5181, with the publication recovery
    admission regression failing on both the baseline and candidate. Revision 2
    is a prospective, Human-authorized scope amendment, not REPAIR of that RUN.
    Its candidate and FAILURE remain immutable; revision 2 PRIMARY starts from
    current canonical main and must satisfy the entire TASK scope anew.
  - >-
    TASK-336 retains ownership of its separate forward recovery, transport
    serialization and bounded public redaction fixes.
  - >-
    Canonical redaction may intentionally protect workspace, diagnostics and
    raw locators while preserving required identity, SHA, evidence and
    verification bindings. Historic artifact versions may differ in size and
    representation; no raw-path disclosure or historical rewrite is allowed.
  - >-
    LEGACY_REPOSITORY_DEFAULT_ROUTE is the prospective Human-selected return
    affinity; executor and model selection remain outside the TASK contract.
scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-336.yaml
    - src/aios_renew/unified_state.py
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/runtime_provenance_issuer.py
    - src/aios_renew/publication.py
    - src/aios_renew/runtime.py
    - src/aios_renew/correction_preflight.py
    - tests/test_operator.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_runtime.py
  modify:
    - src/aios_renew/unified_state.py
    - src/aios_renew/publication.py
    - tests/test_operator.py
    - tests/test_publication.py
non_goals:
  - >-
    No edit to transport redaction or output-size policies in
    review_transport.py; those TASK-336 obligations remain separately owned.
  - >-
    No alteration or deletion of historical TASK, RUN, FAILURE, RESULT,
    EVIDENCE, REVIEW, REPAIR or REMEDIATION; no main reset, forced Git update,
    canonical ref rewrite, publisher shortcut or synthetic verification PASS.
  - >-
    No new lifecycle router, trust issuer, verifier, proof-reuse engine,
    memory store, Runtime admission, Reviewer or Publisher authority.
  - >-
    No automatic remediation of TASK-336, no direct integration of an unpublished
    TASK-336 candidate into this TASK, and no downstream dependency changes.
  - >-
    No broad regression suite, redundant base replay, self-host workflow
    reconfiguration, protected credential mutation or KA01 activation.
constraints:
  hard:
    - >-
      Compare only the deterministic authorized public projection of relevant
      private fields or an equivalent exact verified binding, while preserving
      canonical Git identities and source verification/evidence semantics.
      Never treat redacted placeholders as independent proof or let absent,
      changed or malicious private data pass because a public field is hidden.
    - >-
      Fail closed on changed RUN/TASK identity, head/base SHA, correction parent,
      repair authorization, publication recovery source, review binding,
      evidence digest/verification binding, extra local terminals or competing
      remote tips. Do not bypass strict checks to make valid fixtures green.
    - >-
      Distinguish legitimate privacy representation changes from true
      canonical mismatch. Retain support for byte-exact historical artifacts
      and bounded legacy records; avoid applying a new public-writer input
      size cap as an unconditional historical reader limit.
    - >-
      Restore exact recovery-result to SEMANTIC_REVIEW classification only
      when its admitted recovered RESULT is actually eligible and unreviewed.
      Prior PASS never substitutes for the new Reviewer verdict; replay, CAS,
      loss of wake, corruption and concurrent-main conflicts stay fail closed.
    - >-
      Scope is strictly the four listed modify files, with publication.py now
      explicitly authorized only for the demonstrated admission-representation
      mismatch and directly necessary fail-closed validation. Any further
      production-file change or higher-authority conflict requires a typed
      blocker and separate Human scope authorization.
    - >-
      Recovered publication admission must distinguish validated private RUN
      metadata from its authenticated public transport projection without
      requiring byte-equality of privacy-redacted workspace fields. Preserve
      exact admitted RUN identity, TASK revision, executor, status, affinity,
      base/head SHA, source/candidate provenance, and canonical admission ref
      and reservation identity. A protected workspace placeholder alone is
      never proof of a legitimate local workspace or RUN identity.
    - >-
      Do not relax publication.py admission guards wholesale or permit
      self-certified equivalence: absent, malformed, contradictory, spoofed,
      replayed or otherwise unbound private/public data must fail closed.
      Keep historical byte-exact validation valid and do not bypass Runtime
      admission, independent Reviewer verdict or Publisher authority.
    - >-
      Minimum-sufficient-v2 applies. Reuse valid source/candidate proof under
      Runtime rules and limit tests to focused correction-path regressions;
      Executor claims do not substitute for Runtime verification.
acceptance:
  - id: AC1
    condition: >-
      A locally persisted terminal whose identity, correction lineage and
      verification/evidence bindings match the exact authenticated canonical
      public representation can reconcile to the same terminal without a
      false private/public conflict; no duplicate or synthetic terminal appears.
  - id: AC2
    condition: >-
      Missing, malformed, contradictory or adversarial local/canonical records,
      including changed RUN/TASK/base/head/correction/review/recovery/evidence
      bindings, remain deterministically blocked instead of being hidden by
      redaction or accepted by field omission.
  - id: AC3
    condition: >-
      Historical unredacted and protected terminal records can both be
      reconciled under their applicable validated representation, without
      rewriting immutable refs, leaking private fields or incorrectly treating
      a public-writer size limit as a universal historical-read limit.
  - id: AC4
    condition: >-
      A valid newly recovered, not-yet-reviewed publication source is classified
      as SEMANTIC_REVIEW for its exact recovered RUN and candidate; a historical
      prior PASS does not count as a verdict for that recovered source.
  - id: AC5
    condition: >-
      Recovery replay, conflicting source or main, invalid lineage, duplicate
      terminal and malformed private/public representations retain their
      existing fail-closed and no-unauthorized-mutation behavior.
  - id: AC6
    condition: >-
      Focused regression cases cover matching and mismatching private/public
      terminals, correction lineage, historic large-artifact behavior,
      legitimate recovered review handoff, authenticated private/public
      admission comparison and negative publication recovery; test assertions
      do not conceal a production defect.
  - id: AC7
    condition: >-
      Publication recovery accepts a genuinely admitted, valid private RUN
      and its matching authenticated redacted public RUN without false
      workspace-inequality rejection, but rejects changed or fabricated
      admission identity, workspace provenance, status, SHA, revision,
      executor, affinity or source binding before creating a recovered RESULT
      or semantic-review eligibility.
verification:
  policy: minimum-sufficient-v2
  required:
    - python -m pytest -q tests/test_operator.py tests/test_publication.py -k "local_public or publication_recovery_admits_once_then_requires_new_exact_review"
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
