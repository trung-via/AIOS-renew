non_goals:
  - Execute, modify, supersede, delete, retry, remediate, repair, or reinterpret RUN-159-004 or any earlier RUN-159 lineage.
  - Modify production code, tests, documentation, workflows, dependency declarations, frozen Kernel, Constitution, Project Contract, or roadmap state.
  - Make Executor claims about actual Runtime measurement outcomes that are unknowable before canonical verification.
  - Select, rank, recommend, persist, or automatically adapt a worker count.
  - Enable parallel execution as the canonical verification default.
  - Use TASK-154, RUN-159-004, or another historical subject as the direct timing comparator for r5 profiles.
  - Install or update pytest, pytest-xdist, the optional measurement extra, or any package during Executor execution, Runtime verification, workflow bootstrap, or probe execution.
  - Add retry/failover, adaptive worker routing, benchmark caches/databases, schedulers, daemons, automatic optimizers, or new lifecycle state.
  - Retry, omit, reorder, duplicate, short-circuit, or add worker profiles after observing intermediate measurement results.
  - Treat faster or slower timing by itself as TASK completion, correctness, review, publication, worker-adoption, or roadmap authority.
  - Weaken, skip, xfail, deselect, rename, broadly mock, or otherwise alter the canonical test population to improve timing.
  - Change Runtime, Reviewer, Publisher, transport, RepositoryLock, self-host authority, Executor selection, or verification-subject authority.
  - Add a VERIFICATION_ONLY lifecycle mode or bypass the existing PRIMARY structural ResultPackage boundary.
  - Capture assertion text, traceback text, captured output, exception messages, environment data, secrets, or arbitrary console payload through failure diagnostics.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-159 r5 is a read-only measurement-preparation PRIMARY with empty
      scope.modify. The Executor must leave final Git HEAD equal to the admitted
      RUN base, leave the worktree clean, return changed_files as empty, and must
      not create any repository commit merely to advance HEAD.
    - >
      Executor structural claims are restricted to pre-verification facts in AC1
      through AC6. Executor-supplied evidence must remain empty. The Executor must
      not claim that the probe ran or passed, collections matched, diagnostics were
      emitted, worker isolation succeeded, timing has any value, or any profile is
      faster, better, selected, recommended, or adoptable.
    - >
      The Executor must not execute canonical measurement, synthesize benchmark or
      diagnostic output, construct canonical verification EVIDENCE, or infer the
      Runtime outcome. Runtime alone executes and records canonical verification.
    - >
      Canonical verification must contain exactly one BP-V4 measurement primitive.
      Do not add a separate pytest full-suite command, duplicate probe,
      collection-only command, git diff command, focused diagnostic rerun, or other
      verification already subsumed by the measurement primitive.
    - >
      The existing minimum-sufficient-v1 verification contract and TASK-157 probe
      grammar remain authoritative. Worker candidates are explicitly and only 2,
      3, and 4 in ascending order; worker 1 is the probe-owned serial control. No
      auto, cpu_count, environment-derived, historical-fastest, adaptive, random,
      or Executor-selected profile is permitted.
    - >
      Runtime must execute the probe on the exact TASK-156 transient verification
      subject bound to the admitted current r5 candidate SHA. The probe owns
      canonical collection observation, actual profile execution, structured
      conformance checks, same-subject mutation detection, bounded failure
      diagnostics, and elapsed timing.
    - >
      Probe semantics remain fail-closed for missing/incompatible optional
      tooling, collection failure or mismatch, malformed or missing worker data,
      shared mutable pytest temp roots, shared process-local Git fixture cache
      roots, non-distinct worker processes, test failure, subject mutation, or
      malformed failure-diagnostic structure. There is no retry, fallback,
      cherry-pick, focused diagnostic rerun, or worker adoption decision.
    - >
      Nonzero profiles may expose only TASK-161 bounded deterministic
      failure-diagnostics identity facts: normalized test node identity, pytest
      phase limited to setup/call/teardown, bounded count/display/truncation
      metadata, and a stable fingerprint when an overlong identity is clipped.
      Diagnostics remain observational evidence and must not include assertion,
      traceback, captured-output, exception, environment, secret, or arbitrary
      repr/console payload.
    - >
      A nonzero profile with no failed runtest report must remain representable by
      its existing pytest exit status and an empty diagnostic identity list.
      Neither the probe nor any other layer may fabricate a test identity.
    - >
      Successful Runtime evidence remains AIOS_BP_V4_MEASUREMENT version 1 with
      exact subject identity, bounded toolchain identity, deterministic collection
      identity, per-profile mode/worker count/elapsed duration/exit status,
      explicit conformance facts, and only the backward-compatible bounded
      failure-diagnostics extension defined by TASK-161 where applicable. Do not
      add selected, recommended, winner, best, score, threshold-verdict, or
      automatic-policy fields.
    - >
      The serial profile produced inside this exact r5 measurement is the sole
      direct timing comparator for workers 2, 3, and 4. Historical timing may be
      preserved as context but must not be used to select a worker or substitute
      for same-subject comparison.
    - >
      Timing is observational only. A slower parallel profile is not a semantic
      TASK failure when correctness/conformance succeeds, and a faster profile
      does not authorize adoption. Human/Brain may interpret timing only after
      canonical Runtime evidence and Reviewer review.
    - >
      Optional bp-v4-measurement dependencies remain one-time host prerequisites
      outside the RUN. Missing or incompatible capability must yield explicit
      canonical verification failure without package installation, host mutation,
      serial fallback, or fabricated measurement evidence.
    - >
      TASK-159 r5 success establishes only trustworthy current-main same-subject
      measurement evidence. Runtime, Reviewer, Publisher, self-host authority,
      RepositoryLock, canonical verification defaults, worker-selection authority,
      and roadmap state remain unchanged.
    - >
      Do not modify any repository file and do not push or publish from Executor execution.

acceptance:
  - id: AC1
    condition: >
      The admitted TASK-159 r5 PRIMARY remains a zero-delta read-only candidate:
      final Git HEAD equals the admitted RUN base, the worktree is clean,
      RESULT.changed_files is empty, and no repository mutation is created for
      measurement preparation.
  - id: AC2
    condition: >
      Bounded inspection confirms the admitted current candidate contains the
      repository-owned BP-V4 measurement contract and probe defining one canonical
      collection, one serial control, explicit workers 2/3/4, exact ordered
      profile execution, same-subject checks, and structured conformance
      observations; Executor introduces no replacement mechanism.
  - id: AC3
    condition: >
      Bounded inspection confirms the current measurement path is fail-closed
      rather than adaptive: it has no package installation, CPU/auto worker
      heuristic, retry/fallback, diagnostic rerun, benchmark-driven reroute, or
      automatic worker selection, and incompatible optional tooling is
      represented as probe failure rather than silent fallback.
  - id: AC4
    condition: >
      TASK-159 r5 contains no worker adoption decision: no worker is selected,
      ranked, recommended, persisted, or made the canonical parallel default, and
      timing remains observational input for later Human/Brain reasoning using
      the same-run serial profile as the direct comparator.
  - id: AC5
    condition: >
      Existing authority boundaries remain unchanged by this zero-delta
      preparation: Runtime owns canonical verification/EVIDENCE, Reviewer owns the
      semantic verdict, Human/Brain own any later worker-adoption authorization,
      Publisher owns publication, and roadmap state is not advanced by execution.
  - id: AC6
    condition: >
      Bounded inspection confirms the admitted current candidate includes the
      reviewed/published TASK-161 failure-diagnostics capability: nonzero profiles
      can expose bounded deterministic node/phase identities with explicit
      count/truncation metadata and stable clipping fingerprints, while no
      assertion/traceback/captured-output payload, fabricated identity,
      retry/fallback semantics, worker-selection semantics, or second evidence
      authority is introduced.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    BP-V4 requires one fresh same-subject full-suite serial control and bounded
    parallel profiles 2/3/4 against the current canonical subject after TASK-161
    changed the measurement instrumentation and canonical test population.
    Historical RUN-159-004 evidence cannot establish current conformance, timing,
    or bounded failure identities for this changed subject.
  required:
    - python scripts/bp_v4_parallel_probe.py --workers 2 3 4
