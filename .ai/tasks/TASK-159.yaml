task_id: TASK-159
revision: 3

goal: >
  Execute BP-V4B Canonical Same-Subject Parallel Measurement as one bounded,
  Runtime-owned verification experiment on the exact admitted candidate while
  preserving AIOS stage and authority boundaries. The selected Executor performs
  only read-only pre-verification inspection and returns a truthful structural
  ResultPackage; Runtime alone executes the existing repository-owned BP-V4 probe
  for one canonical pytest collection, one serial full-suite control, and explicit
  parallel profiles with workers 2, 3, and 4. Produce canonical measurement
  EVIDENCE for later Reviewer and Human/Brain interpretation without source
  mutation, worker selection, parallel-default adoption, or roadmap advancement.

problem: >
  TASK-159 r1 incorrectly placed post-verification outcomes in acceptance and
  RUN-159-001 therefore failed at the pre-verification completion gate. Revision 2
  moved those outcomes out of acceptance but introduced a self-referential AC6:
  it required the structural ResultPackage to claim only AC1-AC5 while Runtime
  simultaneously required every acceptance criterion, including AC6, to be
  claimed before verification. RUN-159-002 therefore failed correctly at
  COMPLETION_GATE with only AC6 missing and verification_seconds=null. Revision 3
  removes that self-reference from acceptance and preserves it as a hard
  pre-verification constraint. No production, Runtime, probe, or lifecycle change
  is required.

assumptions:
  - >
    Canonical main at TASK-159 revision-3 authoring is
    20ef020d8c375f739075ed323316cb9e357e3d05 and contains TASK-159 r2.
  - >
    RUN-159-001 and RUN-159-002 are immutable canonical FAILURE lineage for
    TASK-159 revisions 1 and 2 respectively. Both failed at COMPLETION_GATE with
    clean zero-delta candidates before canonical verification began. Revision 3
    does not repair, erase, reinterpret, or continue either RUN.
  - >
    Canonical roadmap state keeps
    bp-v4-parallel-verification-performance-guard as the unique NEXT milestone.
    TASK-159 r3 performs the BP-V4B real measurement step only and does not itself
    complete BP-V4 or advance roadmap state.
  - >
    TASK-157 remains authoritative for AIOS_BP_V4_MEASUREMENT version 1, explicit
    bounded workers 2, 3, and 4, canonical collection identity, structured worker
    isolation facts, same-subject checks, timing-neutral correctness semantics,
    and the optional bp-v4-measurement dependency surface.
  - >
    TASK-154/BP-V2 historical serial timing is historical context only. The
    serial profile produced inside this same TASK-159 Runtime probe is the direct
    timing control for workers 2, 3, and 4.
  - >
    TASK-156/BP-V3 remains authoritative for exact transient verification-subject
    isolation. Runtime must execute TASK-159 verification inside that exact
    isolated subject and retain canonical EVIDENCE ownership.
  - >
    TASK-158 remains authoritative for trusted self-host control-source
    provenance. TASK-159 r3 does not modify or reinterpret self-host bootstrap,
    PRIMARY synchronization, Runtime, transport, Reviewer, or Publisher behavior.
  - >
    PRIMARY native Executor adapters intentionally omit TASK.verification from the
    Executor prompt, require empty executor-supplied evidence, and instruct the
    Executor not to run canonical verification. Runtime verifies only after the
    structural ResultPackage passes its pre-verification completion gates.
  - >
    The designated Windows x64 aios-renew self-host may already have the
    repository-owned optional bp-v4-measurement extra provisioned outside a RUN.
    If compatible pytest/pytest-xdist capability is absent, Runtime verification
    must fail explicitly; TASK-159 must not install packages or silently fall back.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    verdict; Human/Brain own interpretation of timing evidence and any later
    fixed-worker authorization; Publisher owns publication. No measured timing
    alone changes any of those authorities.

