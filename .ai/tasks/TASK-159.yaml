task_id: TASK-159
revision: 5

goal: >
  Execute BP-V4B Current-Main Same-Subject Parallel Measurement as one fresh,
  bounded, Runtime-owned verification experiment on the exact admitted current
  canonical candidate after TASK-161. The Executor performs read-only
  pre-verification inspection only; Runtime alone executes the repository-owned
  BP-V4 measurement primitive for one canonical collection, one serial full-suite
  control, and explicit bounded parallel profiles with workers 2, 3, and 4.
  Produce current canonical AIOS_BP_V4_MEASUREMENT v1 EVIDENCE, including the
  reviewed bounded failure-diagnostics capability for nonzero profiles where
  failed runtest reports exist, for later Reviewer and Human/Brain interpretation
  without repository mutation, retry semantics, worker selection,
  parallel-default adoption, or roadmap advancement.

problem: >
  TASK-159 r4 produced RUN-159-004 and reached Runtime-owned canonical
  verification on its exact admitted subject. The probe established a consistent
  1655-test collection, unchanged subject identity, and conformant observable
  worker isolation, but serial and workers 2/3/4 all returned pytest exit status
  1. Because the then-current probe suppressed console output and exposed only
  collection, isolation, timing, and exit-status facts, that canonical FAILURE
  could not identify the failing test node(s) and pytest phase(s). TASK-161 was
  therefore authored as maintenance observability hardening, reviewed PASS, and
  published at 3197983bf12ecc27c7fb79733f848808439e6a29. It added bounded,
  deterministic failure identities to the existing probe/plugin and changed the
  current measurement instrumentation and canonical test population. The exact
  RUN-159-004 evidence remains immutable historical truth but is no longer
  minimum-sufficient evidence for the changed current subject. Revision 5
  preserves the BP-V4B measurement intent and performs one fresh same-subject
  measurement against current canonical main; it is not a retry, REMEDIATION, or
  REPAIR of RUN-159-004.

assumptions:
  - >
    Canonical main at TASK-159 revision-5 authoring is
    3197983bf12ecc27c7fb79733f848808439e6a29, the reviewed and published
    TASK-161 source candidate.
  - >
    RUN-159-001 and RUN-159-002 remain immutable COMPLETION_GATE failures.
    RUN-159-003 remains immutable VERIFICATION failure history associated with
    missing optional measurement capability, and REPAIR-159-003 remains immutable
    historical authorization. None is executed or reinterpreted by r5.
  - >
    RUN-159-004 remains immutable VERIFICATION FAILURE for TASK-159 r4 at subject
    372930d457e1ab7b602ea987bc9cfc4d5f596a49. It proves that its exact subject
    reached one complete serial plus workers 2/3/4 matrix with consistent
    collection identity, unchanged subject, and conformant observable worker
    isolation, while every profile returned pytest exit status 1. Its timing and
    failure state are historical evidence only for r5.
  - >
    TASK-161, RUN-161-001, and REVIEW-161-001 PASS are maintenance observability
    lineage only. TASK-161 added bounded deterministic pytest failure diagnostics
    without changing worker authorization, profile order, Runtime evidence
    ownership, Reviewer authority, Publisher authority, or roadmap semantics.
  - >
    Canonical roadmap state still keeps
    bp-v4-parallel-verification-performance-guard as the unique NEXT milestone.
    TASK-159 r5 performs only the BP-V4B current-main measurement step and does
    not itself complete BP-V4 or advance roadmap state.
  - >
    TASK-157 remains authoritative for AIOS_BP_V4_MEASUREMENT version 1, explicit
    bounded workers 2, 3, and 4, canonical collection identity, observable worker
    isolation, same-subject checks, timing-neutral correctness semantics, and the
    optional bp-v4-measurement dependency surface.
  - >
    TASK-154/BP-V2 and RUN-159-004 timing remain historical context only. The
    serial profile produced inside the same r5 Runtime measurement is the sole
    direct timing control for r5 workers 2, 3, and 4.
  - >
    TASK-156/BP-V3 remains authoritative for exact transient
    verification-subject isolation. Runtime must execute r5 verification inside
    the exact isolated admitted candidate subject and retain canonical EVIDENCE
    ownership.
  - >
    PRIMARY native Executor adapters omit TASK.verification from the Executor
    prompt, require empty executor-supplied evidence, and instruct the Executor
    not to run canonical verification. Runtime verifies only after structural
    ResultPackage completion gates pass.
  - >
    The Human has provisioned the repository-owned optional bp-v4-measurement host
    capability outside a RUN. Runtime remains authoritative for proving whether
    the actual self-host environment is compatible; missing or incompatible
    capability must fail explicitly without in-RUN installation or fallback.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    verdict; Human/Brain own timing interpretation and any later fixed-worker
    authorization; Publisher owns publication.

