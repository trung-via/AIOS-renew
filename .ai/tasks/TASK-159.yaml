non_goals:
  - Repair, supersede, delete, or reinterpret RUN-159-001 or RUN-159-002.
  - Modify production code, tests, documentation, workflows, dependency declarations, frozen Kernel, Constitution, Project Contract, or roadmap state.
  - Make Executor claims about actual Runtime measurement outcomes that are unknowable before canonical verification.
  - Select, rank, recommend, persist, or automatically adapt a worker count.
  - Enable parallel execution as the canonical verification default.
  - Treat TASK-154 historical serial timing as the direct comparator for TASK-159 r3 profiles.
  - Install or update pytest, pytest-xdist, the optional measurement extra, or any other package during Executor execution, Runtime verification, workflow bootstrap, or probe execution.
  - Add a scheduler, generic worker router, retry/failover mechanism, benchmark cache, performance database, daemon, background collector, automatic optimizer, or new lifecycle state.
  - Retry, omit, reorder, duplicate, or add worker profiles after observing intermediate measurement results.
  - Treat faster or slower timing by itself as TASK completion, correctness, semantic review, publication, or roadmap authority.
  - Weaken, skip, xfail, deselect, rename, broadly mock, or otherwise alter the canonical test population to improve timing.
  - Change Runtime, Reviewer, Publisher, transport, RepositoryLock, self-host control-source, Executor selection, or verification-subject authority.
  - Add a new VERIFICATION_ONLY lifecycle mode or bypass the existing PRIMARY structural ResultPackage boundary.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-159 r3 is a read-only measurement-preparation PRIMARY with empty
      scope.modify. The Executor must leave final Git HEAD equal to the admitted
      RUN base, leave the worktree clean, return changed_files as empty, and must
      not create a source, test, documentation, workflow, TASK, dependency, or
      benchmark-result commit merely to advance HEAD.
    - >
      Executor structural claims are restricted to the pre-verification facts
      represented by AC1 through AC5. Executor-supplied evidence must remain empty.
      The Executor must not claim that the BP-V4 probe ran or passed, that actual
      collections matched, that any worker actually isolated mutable state, that
      any measured timing has a value, or that any parallel profile is faster,
      better, selected, recommended, or adoptable.
    - >
      The Executor must not execute the canonical measurement command, synthesize
      benchmark output, construct canonical verification EVIDENCE, or infer the
      Runtime outcome. Runtime alone executes and records canonical verification.
    - >
      Canonical verification contains exactly one command:
      python scripts/bp_v4_parallel_probe.py --workers 2 3 4. Do not add a
      separate pytest full-suite command, duplicate probe, collection-only
      command, git diff command, or other verification work already subsumed by
      the existing measurement primitive.
    - >
      The existing minimum-sufficient-v1 verification contract and TASK-157 probe
      grammar remain authoritative. Worker candidates are explicitly and only 2,
      3, and 4 in ascending order, while worker 1 is the probe-owned serial
      control. No auto, cpu_count, environment-derived, historical-fastest,
      adaptive, random, or Executor-selected profile is permitted.
    - >
      Runtime must execute the probe on the exact TASK-156 transient verification
      subject bound to the admitted candidate SHA. The probe, not the Executor,
      owns canonical collection observation, actual profile execution, structured
      conformance checks, same-subject mutation detection, and measured elapsed
      time.
    - >
      Existing probe semantics must remain fail-closed: incompatible or missing
      optional toolchain, collection failure or mismatch, missing/unexpected worker
      data, malformed structured observation, shared mutable pytest temporary
      roots, shared process-local Git fixture cache roots, non-distinct worker
      processes, test failure, or verification-subject mutation invalidates the
      measurement command. There is no retry, fallback, cherry-pick, or worker
      adoption decision inside this TASK.
    - >
      Successful Runtime evidence must remain the existing versioned
      AIOS_BP_V4_MEASUREMENT envelope with exact subject identity when available,
      bounded toolchain identity, deterministic collection identity, per-profile
      mode/worker count/elapsed duration/exit status, and explicit conformance
      facts. TASK-159 r3 does not add selected, recommended, winner, best, score,
      threshold-verdict, or automatic-policy fields.
    - >
      Timing is observational only. A slower parallel profile is not a semantic
      TASK failure when the existing probe's correctness/conformance contract
      succeeds, and a faster profile does not authorize canonical adoption.
      Human/Brain may interpret timing only after canonical Runtime evidence and
      Reviewer review.
    - >
      Optional bp-v4-measurement dependencies are one-time host prerequisites
      outside the RUN. Missing or incompatible capability must yield explicit
      canonical verification failure without package installation, host mutation,
      serial fallback, or fabricated measurement evidence.
    - >
      TASK-159 r3 success establishes only trustworthy same-subject measurement
      evidence. Runtime, Reviewer, Publisher, self-host control-source,
      RepositoryLock, canonical verification defaults, worker-selection authority,
      and roadmap state remain unchanged.
    - >
      Do not modify any repository file and do not push or publish from Executor
      execution.

acceptance:
  - id: AC1
    condition: >
      The admitted TASK-159 r3 PRIMARY remains a zero-delta read-only candidate:
      final Git HEAD equals the admitted RUN base, the worktree is clean,
      RESULT.changed_files is empty, and no repository mutation is created for
      measurement preparation.
  - id: AC2
    condition: >
      Bounded inspection confirms the admitted candidate already contains the
      repository-owned BP-V4 measurement contract and probe that define one
      canonical collection, one serial control, explicit workers 2/3/4, exact
      ordered profile execution, same-subject checks, and structured conformance
      observations; Executor introduces no replacement measurement mechanism.
  - id: AC3
    condition: >
      Bounded inspection confirms the existing measurement path is fail-closed
      rather than adaptive: it has no package installation, CPU/auto worker
      heuristic, retry/fallback, benchmark-driven reroute, or automatic worker
      selection, and incompatible optional tooling is represented as probe failure
      rather than silent fallback.
  - id: AC4
    condition: >
      TASK-159 r3 contains no worker adoption decision: no worker is selected,
      ranked, recommended, persisted, or made the canonical parallel default, and
      timing remains observational input for later Human/Brain reasoning.
  - id: AC5
    condition: >
      Existing authority boundaries remain unchanged by this zero-delta
      preparation: Runtime owns canonical verification/EVIDENCE, Reviewer owns the
      semantic verdict, Human/Brain own any later worker-adoption authorization,
      Publisher owns publication, and roadmap state is not advanced by execution.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    BP-V4 requires one same-subject real full-suite serial control and bounded
    parallel profiles to establish current parallel conformance and timing;
    focused verification cannot establish this evidence.
  required:
    - python scripts/bp_v4_parallel_probe.py --workers 2 3 4
