task_id: TASK-159
revision: 4

goal: >
  Execute BP-V4B Current-Main Same-Subject Parallel Measurement as one bounded,
  Runtime-owned verification experiment on the exact admitted current canonical
  candidate. The Executor performs read-only pre-verification inspection only;
  Runtime alone executes the repository-owned BP-V4 probe for one canonical
  collection, one serial full-suite control, and explicit parallel profiles with
  workers 2, 3, and 4. Produce current canonical AIOS_BP_V4_MEASUREMENT v1
  EVIDENCE for later Reviewer and Human/Brain interpretation without repository
  mutation, worker selection, parallel-default adoption, or roadmap advancement.

problem: >
  TASK-159 r3 fixed the r1/r2 pre-verification acceptance defects and RUN-159-003
  reached Runtime verification correctly, where it failed only because the
  optional bp-v4-measurement host capability was absent. REPAIR-159-003
  subsequently authorized a NO_CHANGE historical re-verification of that exact
  r3 subject. Before that repair could produce measurement evidence, TASK-160 was
  required, reviewed, and published to restore REPAIR transport provenance. That
  maintenance work changed canonical workflow and test content on main, so the
  historical RUN-159-003 subject no longer represents the current canonical test
  population. Executing REPAIR-159-003 now would remain truthful historical
  evidence but would not be minimum-sufficient current evidence for BP-V4. Revision
  4 therefore preserves r3 measurement semantics while re-basing the zero-delta
  measurement preparation onto current canonical main. REPAIR-159-003 remains
  immutable historical authorization and is not executed or reinterpreted by r4.

assumptions:
  - >
    Canonical main at TASK-159 revision-4 authoring is
    9019fe1adc58fb6022765480cd260d6d1162eb66 and includes reviewed/published
    TASK-160 transport provenance correction.
  - >
    RUN-159-001 and RUN-159-002 remain immutable COMPLETION_GATE failures.
    RUN-159-003 remains an immutable VERIFICATION failure at subject
    99f8abd6ce04700503b044c16105ffe8d8bbdc92 caused by missing optional
    bp-v4-measurement capability. REPAIR-159-003 at
    51b4085cee6db06dcc648e1ebdcd0a7feed1ab01 remains immutable historical
    NO_CHANGE authorization and is not executed by this TASK.
  - >
    TASK-160 is maintenance-only engineering lineage. Its publication changed
    current workflow/test content and thereby invalidated RUN-159-003 as the direct
    current measurement subject, but it did not advance the Brain Portability
    roadmap or change BP-V4 semantic authority.
  - >
    Canonical roadmap state still keeps
    bp-v4-parallel-verification-performance-guard as the unique NEXT milestone.
    TASK-159 r4 performs only the BP-V4B real measurement step and does not itself
    complete BP-V4 or advance roadmap state.
  - >
    TASK-157 remains authoritative for AIOS_BP_V4_MEASUREMENT version 1, explicit
    bounded workers 2, 3, and 4, canonical collection identity, worker isolation
    observations, same-subject checks, timing-neutral correctness semantics, and
    the optional bp-v4-measurement dependency surface.
  - >
    TASK-154/BP-V2 serial timing remains historical context only. The serial
    profile produced inside this same r4 Runtime probe is the direct timing control
    for workers 2, 3, and 4.
  - >
    TASK-156/BP-V3 remains authoritative for exact transient verification-subject
    isolation. Runtime must execute r4 verification inside the exact isolated
    admitted candidate subject and retain canonical EVIDENCE ownership.
  - >
    TASK-158 and published TASK-160 remain authoritative for trusted self-host
    control-source and REPAIR transport provenance. r4 changes neither transport
    nor lifecycle semantics.
  - >
    PRIMARY native Executor adapters intentionally omit TASK.verification from the
    Executor prompt, require empty executor-supplied evidence, and instruct the
    Executor not to run canonical verification. Runtime verifies only after the
    structural ResultPackage passes pre-verification completion gates.
  - >
    The Human has provisioned the repository-owned optional bp-v4-measurement
    host capability outside a RUN. Runtime remains authoritative for proving
    whether the actual self-host environment is compatible; missing or
    incompatible capability must fail explicitly without in-RUN installation or
    fallback.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    verdict; Human/Brain own timing interpretation and any later fixed-worker
    authorization; Publisher owns publication.

