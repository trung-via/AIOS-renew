task_id: TASK-159
revision: 6

goal: >
  Execute one fresh BP-V4B current-main same-subject full-suite measurement as
  Runtime-owned canonical verification against the exact admitted current
  candidate after the TASK-163/TASK-164 compatibility corrections and TASK-170
  Windows real-Git fixture path-budget correction. Keep the native Executor as a
  zero-delta, zero-workspace-touch structural handoff only. Produce one current
  AIOS_BP_V4_MEASUREMENT version-1 evidence envelope for later Reviewer and
  Human/Brain interpretation without repository mutation, retry/fallback,
  worker selection, parallel-default adoption, performance-policy mutation, or
  roadmap advancement.

problem: >
  RUN-159-005 is immutable historical VERIFICATION FAILURE on subject
  6a6d8b691ff5a694c065d56fc11e51283c109cf5. Its complete measurement observed
  one 1659-test canonical collection with consistent subject identity and
  observable worker isolation, but serial and workers 2/3/4 all returned nonzero
  pytest status. Subsequent canonical evidence resolved the known failure
  surface instead of blindly repeating that matrix. TASK-163 updated and
  verified the stale approved-remediation workflow regression. TASK-164 updated
  and verified the stale remote-surface regression. Source audit established
  that the remaining historical serial Brain Sync smoke failure was caused by
  the then-current roadmap NEXT milestone lacking an exact TASK id/revision
  binding. TASK-166 through TASK-169 isolated the dominant parallel Git-boundary
  failure family, and TASK-170 corrected the repository-owned Windows real-Git
  fixture path-budget artifact. RUN-170-001 then proved the six representative
  historical failure nodes green under serial, parallel-2, and parallel-4
  without modifying the BP-V4 measurement primitive. Because the canonical
  subject, test population, fixture behavior, workflow regressions, and roadmap
  binding have materially changed, RUN-159-005 remains historical context only
  and cannot establish current full-suite correctness, worker conformance, or
  same-subject timing. One fresh bounded matrix is now minimum-sufficient.

assumptions:
  - >
    Canonical main at TASK-159 revision-6 authoring is
    aea452d0dd57b2052812ec069c8609576d9648d5, the reviewed and published
    TASK-170 source candidate.
  - >
    RUN-159-001 and RUN-159-002 remain immutable COMPLETION_GATE failures.
    RUN-159-003 remains immutable VERIFICATION failure for missing optional
    measurement capability. RUN-159-004 and RUN-159-005 remain immutable
    historical full-matrix VERIFICATION failures on older subjects. Revision 6
    does not retry, repair, remediate, mutate, or reinterpret any of them.
  - >
    RUN-163-009 canonical verification includes a green
    tests/test_remediation_wakeup.py regression on the current transient
    Control Source and execution-profile contract, and RUN-164-002 canonical
    verification includes a green tests/test_remote_surface.py regression.
  - >
    The historical RUN-159-005 Brain Sync live-repository smoke failure was
    caused by its roadmap NEXT milestone lacking the exact current TASK
    id/revision binding required by deterministic Brain Sync selection. Before
    r6 PRIMARY dispatch, roadmap planning must bind the BP-V4 NEXT milestone to
    TASK-159 revision 6 and fresh Brain Sync must select it.
  - >
    TASK-170 is engineering-complete through RUN-170-001,
    REVIEW-170-001 PRIMARY PASS, publication of
    aea452d0dd57b2052812ec069c8609576d9648d5, and Runtime evidence
    RUN-170-001-V001 through RUN-170-001-V003.
  - >
    TASK-157 remains authoritative for AIOS_BP_V4_MEASUREMENT version 1,
    canonical collection identity, exact same-subject checks, explicit bounded
    workers 2, 3, and 4, ordered execution, worker-isolation observations, and
    timing-neutral correctness semantics.
  - >
    TASK-156 remains authoritative for exact transient verification-subject
    isolation. Runtime binds the actual r6 measurement subject to the exact
    admitted RUN base SHA rather than to a historical source SHA.
  - >
    TASK-161 remains authoritative for bounded deterministic failure identities
    on nonzero pytest profiles. TASK-166 through TASK-170 remain diagnostic and
    maintenance lineage only and do not change the TASK-157 measurement
    authority.
  - >
    Historical timing from TASK-154, RUN-159-004, and RUN-159-005 is context
    only. The serial profile inside the exact same r6 Runtime measurement is the
    sole direct timing comparator for workers 2, 3, and 4.
  - >
    Optional bp-v4-measurement tooling is a host prerequisite outside the RUN.
    Runtime remains authoritative for observing actual compatibility during r6;
    missing or incompatible capability must fail explicitly without package
    installation or fallback.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    verdict; Human/Brain own timing interpretation and any later worker,
    adoption, performance-policy, or roadmap decision; Publisher owns
    publication.

scope:
  inspect: []
  modify: []

non_goals:
  - Inspect repository files, Git state, source, tests, documentation, workflows, or dependencies from the native Executor.
  - Execute shell, Git, pytest, xdist, benchmark, diagnostic, package, collection, or measurement workspace commands from the native Executor.
  - Modify repository files, create an implementation commit, install packages, or mutate host configuration.
  - Retry, repair, remediate, supersede, delete, or reinterpret any prior RUN-159 lineage.
  - Re-run focused diagnostics, TASK-170 fixture verification, a second full-suite command, or a separate collection-only command.
  - Change the BP-V4 probe, plugin, measurement schema, failure-diagnostics schema, verification contract, Runtime, Reviewer, Publisher, or lifecycle semantics.
  - Add, remove, reorder, duplicate, short-circuit, dynamically discover, or adapt worker profiles.
  - Use CPU count, auto workers, historical-fastest routing, benchmark cache, retry, fallback, rerun, scheduler, or automatic optimizer.
  - Select, rank, recommend, persist, or adopt a worker count or timing threshold.
  - Enable parallel execution as the canonical verification default.
  - Treat faster or slower timing by itself as TASK success, semantic correctness, worker authorization, publication, or roadmap completion.
  - Weaken, skip, xfail, deselect, rename, or broadly mock the canonical test population.
  - Advance roadmap state from Executor, Runtime, Reviewer, Publisher, or measurement output.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-159 r6 is a zero-delta read-only PRIMARY with empty scope.inspect and
      scope.modify. The native Executor must not invoke repository, shell, Git,
      file-read/search, pytest, xdist, benchmark, diagnostic, package, or
      measurement workspace operations.
    - >
      The Executor constructs its structural ResultPackage solely from immutable
      admitted TASK/RUN context. result.head_sha must equal the admitted RUN base
      SHA, changed_files must be empty, unresolved must be empty, root evidence
      must be empty, and every Executor claim evidence list must be empty.
    - >
      Executor claims may cover only pre-verification structural and authority
      facts. They must not synthesize, predict, infer, or claim Runtime
      collection count/digest, current profile outcomes, failure identities,
      conformance, elapsed timing, measurement success, relative performance,
      worker safety, worker preference, review, publication, or BP-V4 completion.
    - >
      Runtime independently owns exact repository HEAD and clean-state checks,
      TASK scope, verification-subject materialization, measurement invocation,
      post-verification subject validation, canonical EVIDENCE attachment,
      terminal persistence, and transport.
    - >
      Canonical verification consists of exactly the single Runtime-owned
      operation declared in verification.required. No Executor-created
      substitute, focused diagnostic rerun, collection preflight, second
      full-suite command, fixture-only proof, or duplicate verification is
      authorized.
    - >
      The measurement experiment remains exactly one canonical collection, one
      serial control, then explicit workers 2, 3, and 4 exactly once each and in
      authored ascending order. No retry, rerun, fallback, short-circuit,
      result-dependent scheduling, hidden profile, auto/cpu worker,
      randomization, or historical-fastest selection is authorized.
    - >
      The exact admitted r6 verification subject is the authority for collection
      identity, correctness, worker isolation, and timing. Historical collection
      counts, toolchain values, failure identities, and durations are context
      only and must not be hard-coded as current expected values.
    - >
      The serial profile produced inside this exact r6 measurement is the sole
      direct timing comparator for workers 2, 3, and 4. Historical serial timing
      must not substitute for same-run comparison.
    - >
      Probe semantics remain fail-closed for missing/incompatible optional
      tooling, collection failure or mismatch, malformed or missing worker data,
      shared mutable pytest temporary roots, shared process-local Git fixture
      cache roots, non-distinct worker processes, test failure, subject mutation,
      or malformed structured evidence. No automatic correction or worker choice
      follows from such a failure.
    - >
      Nonzero profiles may expose only the existing TASK-161 bounded
      deterministic failure-diagnostics identity facts. No assertion text,
      traceback, captured-output payload, environment dump, secret, arbitrary
      exception payload, semantic root-cause verdict, or fabricated test
      identity is authorized.
    - >
      Timing remains observational. A faster profile does not authorize adoption,
      and a slower profile is not by itself a semantic defect when correctness
      and conformance pass.
    - >
      Do not mutate repository files, install packages, alter host configuration,
      push, publish, change canonical verification defaults, select a worker, or
      advance roadmap state from Executor execution or measurement output.

acceptance:
  - id: AC1
    condition: >
      The Executor returns one complete zero-delta structural ResultPackage bound
      to the admitted RUN base: result.head_sha equals that base,
      changed_files is empty, unresolved is empty, Executor-supplied evidence is
      empty, and no repository mutation or implementation commit is created.
  - id: AC2
    condition: >
      The native Executor invokes no repository, shell, Git, file-read/search,
      pytest, xdist, benchmark, diagnostic, package, or measurement workspace
      operation and makes no claim about current collection, correctness,
      conformance, timing, measurement outcome, or worker preference.
  - id: AC3
    condition: >
      TASK-159 r6 authorizes only one bounded same-subject measurement experiment
      consisting of one canonical collection, one serial control, and explicit
      parallel profiles 2, 3, and 4 exactly once in authored order, with no retry,
      fallback, adaptation, hidden profile, automatic worker discovery,
      installation, or result-dependent scheduling.
  - id: AC4
    condition: >
      Existing authority remains separated: Runtime owns canonical verification
      and EVIDENCE, Reviewer owns semantic verdict, Human/Brain own timing
      interpretation and any later worker/adoption or roadmap decision,
      Publisher owns publication, and TASK-159 r6 creates no parallel default or
      performance-policy authority.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    RUN-170-001 corrected the major Windows real-Git fixture failure family
    observed after RUN-159-005, while later canonical maintenance and exact r6
    roadmap binding resolve its known serial compatibility defects. Historical
    evidence cannot establish current correctness, collection identity, worker
    isolation, or same-subject timing, so one fresh serial plus workers 2/3/4
    matrix is required.
  required:
    - python scripts/bp_v4_parallel_probe.py --workers 2 3 4
