task_id: TASK-345
revision: 3
goal: Restore safe, bounded canonical FAILURE transport, Unified State lifecycle
  readability, and Operator private/public correction admission for large minimum-sufficient-v2
  verification FAILURES, preserving exact RUN-343-002 without modifying failure truth
  or disclosing private diagnostics.
problem: RUN-343-002 is an actual local TASK-343 r1 REPAIR continuation with VERIFICATION
  FAILURE (84 distinct call-phase failures; 8101 observed nodes; 24303 phase reports;
  incomplete/unstable, selected wrapper exit 2). Its unchanged 4491342-byte local
  FAILURE is transportable by candidate contract but blocked by a global 1048576-byte
  public metadata input bound; the public projection remains 4491269 bytes. The separate
  canonical failed-candidate reader also checks a 1 MiB FAILURE limit. The failed
  transport writes RUN-343-002.transport.json inside local failures; Unified State
  mistakes this 69-byte operational sidecar for a RUN terminal and reports MALFORMED_CANONICAL_STATE
  ('persisted terminal has no RUN'). The source repository is public. This is an operational
  and canonicalization blockage, not evidence that the 84 failures passed.
assumptions:
- Human-approved priority is to complete transport recovery first; only after
  its reviewed publication may a separate prospective TASK address Direct Git
  executable plus ordinary 12-worker pytest. This change does not automatically
  alter canonical roadmap NEXT or already-authorized RUN/REPAIR lineage.
  Brain Sync for TASK-345 r2 authoring is main 5a1e065ddd4c005f51afcfefdc5351f43d8e76a1;
  Runtime must recheck exact currentness.
- Existing TASK-343 r1, RUN-343-001 canonical FAILURE (94823a37b1d0a7587683ceabd955f74b22de6050),
  its REPAIR authorization 06e8f3c649cbf523cd1ba998bffe034150c54989, and local RUN-343-002
  artifacts are immutable subjects; no remote failure-artifacts or failure-head ref
  for RUN-343-002 exists at this Brain Sync.
- Canonical verification_contract.py permits a bounded 16 MiB observation object and
  100000 phase reports; the prospective transport writer currently limits any projected
  input to 1 MiB, and prove_remote_failed_candidate independently refuses FAILURE
  blobs above 1 MiB. Generic global budget increases are not acceptable.
- Source repository is public; traceback, environment-specific paths, captured pytest
  outputs, secrets and private verification details cannot be approved for public
  publication merely because payload size is increased.
- TASK-345 r1 is the exact canonical predecessor revision. Its modification scope
  omitted src/aios_renew/operator.py even though Operator's existing direct local/remote
  FAILURE equality check could reject a legal privacy-preserving public projection.
  The r2 expansion adds only the necessary Operator boundary and its focused tests.
- The previously observed local SHA256 for RUN-343-002 is diagnostic provenance,
  not a Brain-issued authority claim; before actual transport Runtime must verify
  unchanged local bytes, exact failed-head Git object and permissible correction lineage.
- Human explicitly chose codex / gpt-6.1-sol / max for a subsequent authorized implementation
  execution. These model selectors are not part of this executor-neutral TASK semantic
  contract; dispatch remains a separate Runtime admission event.
- Human-approved prospective TASK return affinity is LEGACY_REPOSITORY_DEFAULT_ROUTE.
  Historical TASK/REPAIR affinity remains unchanged.
- This prospective TASK-345 r3 retains the precise r2 transport-recovery
  goal, six-file modification boundary, seven acceptance criteria and required
  minimum-sufficient-v2 verification. Canonical authoring base is main
  270a0135304258060e51c18135cd8b494872e6ca. This TASK revision does not authorize
  historical rewriting, replay or retroactive success.
- RUN-345-001 of TASK-345 r2 has immutable canonical EXECUTION FAILURE artifacts
  at 751684468f99c4146807b48d6ac0b965e8c590f1. The model reached capacity
  before completion; its recorded failed candidate is dirty, non-repairable,
  non-transportable and never Runtime-verified. The revision is a new
  prospective implementation authority, not a REPAIR of RUN-345-001.
- The partial local changes from RUN-345-001 were independently preserved
  outside canonical state and in a local stash; they are not canonical
  candidate code, Runtime EVIDENCE, reviewed source or correction authority.
  Future Executor may use them only as untrusted implementation reference
  within task scope, with fresh source admission and Runtime verification.
- Human approved continuing via the existing self-host execution pathway,
  with executor/model/effort selectors supplied at dispatch separately from
  this executor-neutral semantic TASK. AUTHOR_TASK itself must not dispatch
  an Executor or claim completion.
