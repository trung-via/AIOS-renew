non_goals:
- No rewrite, truncate, replace, redaction downgrade, deletion, force-push, replay
  or false reissue of RUN-343-002 private RUN/FAILURE/repair/preverification/observation/raw
  data, nor of historical canonical TASK, RUN, FAILURE, RESULT, REVIEW or REPAIR.
- No marking 84 FAIL as PASS, assuming complete/unstable evidence is reusable, changing
  minimum-sufficient-v2 attribution, baseline or verification policy, changing the
  12-worker selected/default settings, or re-running the existing full suite.
- No blanket increase of all transport artifact limits, publication of private diagnostic
  payload, new private data store, new credential issuer, reviewer/publisher authority,
  lifecycle router, retry/failover, workflow dispatch, or automatic executor selection.
- No modification to verification engine, frozen Kernel, roadmap, GitHub workflows,
  Publisher, admission-selection policy, downstream projects or unrelated TEST fixtures.
  Only the exact Operator private/public correction consistency boundary may change;
  report any other necessary code paths to Human/Brain before editing.
- Do not apply, publish or treat RUN-345-001 backup, stash, incomplete
  edits, partial local tests or provider outputs as authoritative candidate,
  RESULT, verifiable baseline, repair eligibility or admission bypass.
constraints:
  hard:
  - Preserve exact RUN-343-002 local FAILURE bytes and the observed read-only
    sha256 4171c67c1be72db749970ee5df05eb08f498bb38d762fa82ba7e4a4190540db5
    only if revalidated from the original artifact, all 84 failed test identities,
    24303 phase records, nonzero exits and incomplete/unstable proof. A changed or
    missing local artifact blocks transport rather than authorizing reconstruction.
    This TASK changes only prospective code; Executor cannot mutate history.
  - Establish a distinct finite FAILURE-specific public transport size budget sufficient
    to handle an artifact of 4491342 bytes, with a strict upper bound no larger than
    16 MiB per FAILURE object; do not increase ordinary RUN/RESULT/correction/admission
    transport budgets as a side effect. Apply coherent limits to both writer and exact
    canonical FAILURE reader, including historical repair eligibility.
  - GitHub public FAILURE material must exclude unapproved private Runtime diagnostic
    content, credentials, raw paths, unbounded test captured output and arbitrary
    failed test detail. Retain exact authoritative failed RUN/candidate/task/profile/command/exit,
    truthful non-PASS status, report counts and required immutable evidence digest/identity
    bindings. A redacted or digest-only report must never be treated as a complete
    comparable baseline or verifiable PASS without its exact independently valid supporting
    raw proof.
  - Private/public reconciliation, canonical reader, V2 failure binding, Operator
    correction admission and historical repair qualification must recognize only
    exact lawful projection, with no unconditional private-vs-public dict equality.
    Preserve strict equality for two private originals where appropriate. Malformed,
    forged, conflicting, wrong-subject, wrong-hash, stale, over-budget or incomplete
    proof remains fail-closed; no incomplete evidence may become comparable/PASS.
    If safe projection cannot be represented without breaking these conditions,
    Executor must report an exact blocker without leaking diagnostics.
  - Unified State must distinguish exact RUN terminal filenames from operational .transport.json
    sidecars, including a valid sidecar without a matching RUN filename. Real orphaned
    RUN terminal files must still be rejected as malformed; no sidecar may create,
    delete or change canonical lifecycle truth.
  - Test the actual integration of local private FAILURE, deterministic public projection,
    remote canonical FAILURE reader, local/private-public consistency and Unified
    State with a representative >=4491342-byte V2 FAILURE fixture; test old small
    and malformed/historical fixtures for regression. Keep the full raw fixture synthetic
    and generated during focused tests, never committed as sensitive content.
  - Do not presume existence of failed candidate Git objects on public remote. Recovering
    RUN-343-002 after reviewed publication must use existing Runtime transport and
    exact candidate/terminal lineage/currentness checks only, and fail closed if the
    candidate has no valid trusted local source.
  - Only six scope.modify paths are available to implementation. Keep all tests
    Runtime-owned under minimum-sufficient-v2, reuse still-valid evidence, avoid
    redundant full-suite/baseline executions, and preserve Reviewer/Publisher authority.
acceptance:
- id: AC1
  condition: The FAILURE-specific writer and all exact remote FAILURE reader gates
    support one lawful bounded public representation of the 4491342-byte class of
    V2 local FAILURES without globally widening unrelated artifact types or accepting
    out-of-bound input.
- id: AC2
  condition: A deterministic privacy-safe public FAILURE projection for representative
    24303-phase / 84-failure evidence preserves admitted immutable RUN, TASK, failed
    candidate, command/profile/toolchain, outcome and required digest identities while
    excluding private diagnostics, secret fixtures and raw machine-local test detail.
- id: AC3
  condition: Canonical FAILURE reader, local/private-public reducer, Operator correction
    admission and historical repair selectors consistently validate exact lawful
    projected non-PASS FAILURE against unchanged private origin, without fabricating
    completeness, PASS, baseline comparability or reusable verification. Malformed,
    forged, mismatched projections fail closed, while unrelated strict equality remains.
- id: AC4
  condition: Unified State ignores well-formed transport sidecars as RUN terminals
    while continuing to reject genuine terminal-without-RUN, malformed RUN, duplicate/conflicting
    identity and other historical invalid lifecycle states.
- id: AC5
  condition: Previously valid small FAILURE/RESULT and privacy-redacted transport
    behavior remain interoperable; oversized and deeply nested public inputs, raw
    secret/captured-output contamination and reader/writer limit mismatches are rejected
    rather than silently truncated or published.
- id: AC6
  condition: One focused synthetic regression family named failure_transport_recovery
    covers AC1-AC5, including local FAILURE+sidecar, remote public/canonical
    roundtrip and Operator private/public correction admission. No 8101-node full suite,
    mutation of RUN-343-002, or second verification executor.
- id: AC7
  condition: Implementation delta is confined to the six scope.modify paths; no changes
    to frozen Kernel, historical terminals, 12-worker/minimum-sufficient-v2
    verification semantics, review, publication, roadmap or execution authorization.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_review_transport.py tests/test_operator_unified_state.py
    tests/test_operator.py -k failure_transport_recovery
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
