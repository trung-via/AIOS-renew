constraints:
  hard:
  - Human decision prospective supersession is authoritative for ROADMAP ONLY until
    admitted implementation. Rewrite single planning NEXT toward this TASK only under
    allowed .ai/roadmap-state.yaml, retaining original 16-slot plan, earlier dated
    Human decisions and failed TASK-418 immutable lineage as historical fact. Do not
    advance from RESULT/REVIEW/publication automatically or supersede unrelated in-flight
    TASK/authority.
  - Because KA-01 D.1 currently makes G1/G2/G3/G6 conjunctive and D.2/D.3/D.4 contain
    later duties, this SAME TASK must prospectively reconcile the normative v1.3 activation
    policy. Do not merely flip roadmap labels, weaken legacy history, or claim the
    old published spec already permits the new behavior. No additional Lean VP phase
    package is a prerequisite.
  - Operational activation must be real at the supported existing production caller;
    no dormant flag, off-route test helper, fake provider ACK or staging-only return
    may be called activation. Bind effective version/policy/operation to legitimate
    new RUN and original Human-selected Executor/lease; keep one Runtime and existing
    provenance/CAS/effect fences. Human's rejection of separate staging gates is not
    a source authentication or Runtime-verification bypass.
  - Enable only actual supported mechanisms. No positive claim for Codex native feedback
    delivery without an authenticated same-original-live-recipient channel. A previously
    implemented local callback is NOT remote provider delivery. Where production behavior
    is technically unsupported, state exactly what is unavailable and fail closed;
    do not represent a disabled no-op as successful activation of that behavior.
  - Preserve any existing per-RUN original Human delegation, source/profile identity
    and finite resources, applicable operation-specific authorization, progress/lease
    and truthful evidence requirements, and default safe legacy behavior for previously
    admitted/unsupported operations. Do not auto-retry, relaunch an Executor, create
    another RUN or hide incomplete implementation.
  - One and only one implementation TASK delivers contract change, minimum supported
    production enablement, and explicit source-bound observation path. Lifecycle Runtime
    verification, independent semantic Reviewer verdict and Publisher inclusion remain
    their own authorities after Executor completion, not CLAIM_NOW facts. No second
    activation task or discretionary manual cutover after publication; any required
    supported enablement belongs in the same delta.
  - Focused verification only of targeted KA-01 v1.3 activation/stop/legacy behavior
    through the existing Runtime proof runner; no complete test suite, arbitrary benchmark,
    pilot or duplicate unmodified evidence collection.
