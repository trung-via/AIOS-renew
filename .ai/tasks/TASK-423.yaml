    G3/G6 and L4 slots without deleting or relabeling any original TASK/RUN/FAILURE/REVIEW/publication
    record or interfering with current unrelated TASK lineage.
- id: AC2
  condition: KA-01 v1.3 normative contract and its direct operational activation consumers
    consistently support this Human-approved one-TASK prospective activation choice,
    without a future separate G3/G6/L4 staging gate or obsolete preactivation-only
    block for the supported version/operation.
- id: AC3
  condition: An existing ordinary production entrypoint can enable genuine already-implemented
    KA-01 v1.3 features on an independently admitted new supported RUN using its original
    Human-selected version, Executor/profile/lease, authoritative source and operation
    context; it no longer unconditionally rejects the supported pathway as NOT_ACTIVATED
    or produces only ADMITTED_PREACTIVATION.
- id: AC4
  condition: Existing finite authorization and identity checks, Runtime evidence/verification
    ownership, one terminal, safe correction/lease/progress stops, legacy compatibility
    and unsupported-operation STOP remain operative. No fixture response, native transport
    ACK or dormant flag is mistaken for an actual Codex live feedback delivery receipt.
- id: AC5
  condition: Focused source-bound integration and negative tests exercise the actual
    ordinary activation/selection entrypoint and existing supported effects, reject
    stale/forged/mismatched or unsupported contexts, and preserve existing ordinary
    nonopted or historically admitted legacy behavior. No full suite or extra staged
    package is introduced.
- id: AC6
  condition: Implementation source leaves a single reproducible supported activation
    configuration and a bounded truthful state/observation for the current production
    caller, without requiring a follow-on Lean VP activation TASK or implying Reviewer
    PASS, publication, production uptake, L4 measurement success or downstream version
