task_id: TASK-402
revision: 1
goal: 'PTE-01: restore reliable exact terminal-attention return affinity and local
  Chat wake for an admitted EXECUTION FAILURE with dirty/untransportable worktree
  and no committed failed-candidate ref, while preserving all identity, privacy and
  at-most-once controls.'
problem: RUN-401-002 published canonical failure-artifacts cd92896f6d4f11bcf3777ba37cfa014072b3daee,
  without aios/failure/RUN-401-002 candidate ref. Terminal-attention admission and
  Issue succeeded, but local wake failed AFFINITY_UNPROVEN. Canonical brain_attention.resolve_return_affinity.run_affinity
  requires the absent candidate, as does local_chat_wake.CanonicalFreshness.observe;
  two independent paths need source-bound correction. RUN-401-001 wake also had STATE_LOCKED_OR_UNAVAILABLE.
  This TASK covers terminal wake only, not future dirty worktree preservation/recovery.
assumptions:
- Human explicitly approved PTE-01..06 then TASK-401 r3 on 2026-10-22. Current main
  42ee0c9a66b5b2221562a3e82d3a95c2489cca37 has unique PTE-01 NEXT and the bounded
  planning document; TASK/RUN/EXECUTOR still require distinct Runtime admission.
- Observed failure-artifacts SHA and local wake job AFFINITY_UNPROVEN bind the original
  incident; no candidate ref is expected for untransportable FAILURE. This does not
  independently prove full executor exit cause or repair eligibility.
- Source tests show both return-affinity resolver and CanonicalFreshness freshness
  probe dereference missing candidate. Existing terminal_attention admission validates
  artifact without candidate. Direct native callers and tests for RESULT, clean FAILURE,
  ref drift, lane lock and duplicate delivery must remain compatible.
- Active TCA-2 v2 CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE challenged all ACs
  against the bounded source API and historical tests. No nonclaimable proof-phase
  acceptance or required out-of-scope test edit is authorized.
- Current canonical Human standing override for new AIOS-renew TASKs explicitly selects
  LEGACY_REPOSITORY_DEFAULT_ROUTE until live proven origin fix; no origin proof is
  fabricated or attached.
- PTE-02/03/04/05/06, Kernel amendment risk, prospective TASK-401 r3/G3 and KA-01
  G6 remain separate, not activated by PTE-01.
