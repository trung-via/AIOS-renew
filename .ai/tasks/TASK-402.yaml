  - src/aios_renew/brain_attention.py
  - src/aios_renew/local_chat_wake.py
  - tests/test_brain_attention.py
  - tests/test_local_chat_wake.py
  - tests/test_terminal_attention.py
  - tests/test_local_chat_wake_workflow.py
  - tests/test_terminal_attention_workflow.py
non_goals:
- No dirty worktree snapshot/recovery, no reinterpretation of RUN-401-002 or nonrepairable
  failure as repairable, no new REPAIR/REMEDIATION/RESULT.
- No new router, lifecycle reducer, DB, independent verifier, semantic Reviewer, Publisher,
  automatic correction selector or auto dispatch.
- No broader PTE-02..07, Kernel/Constitution/roadmap/G6 activation, no secret/raw
  local diagnostics, unsafe resend or weakened tests.
constraints:
  hard:
  - Authenticate exact canonical RUN/TASK revision/base/head and failure-artifacts
    SHA without trusting a fabricated failed-candidate ref; a missing candidate by
    itself never proves terminal identity or source validity.
  - Keep candidate-present exact ref binding, opposite terminal/competing or stale
    ref rejection, historical RESULT/clean failure/REPAIR lineage, route/generation
    and privacy unchanged.
  - Retain original-lane delivery, durable inbox, lock acquisition, held/ambiguous
    Send safeguards and at-most-once semantics, without setting lifecycle next_action
    in the attention projector.
  - Enforce each actual necessary production/test change against scope.modify. Do
    not edit inspect-only paths; if a decisive consumer needs it, surface authoring
    blocker instead of bypassing scope.
  - Only preserve current Runtime/Reviewer/Publisher authority and existing canonical
    verification policy. No mutation of old failure records, new snapshot, false PASS
    or unauthorized Executor access.
  - Focused minimum-sufficient-v1 tests; no full suite, baseline replay or synthetic
    live wake/publication claim. Executor owns HOW; Runtime verifies evidence and
    source; independent Reviewer/Publisher finish.
acceptance:
- id: AC1
  condition: Exact admitted canonical dirty/nontransportable EXECUTION FAILURE with
    immutable failure-artifacts SHA but no committed aios/failure candidate ref resolves
    its original TASK return affinity through authenticated RUN/TASK/base/head/FAILURE
    lineage; neither a fabricated ref nor an unverified head is accepted.
- id: AC2
  condition: Local Chat wake canonical freshness recognizes that same authentic artifact-only
    FAILURE as UNRESOLVED until exactly authorized successor; it never reports UNKNOWN
    solely because the optional committed candidate ref is absent.
- id: AC3
  condition: 'Absent/present candidate ref rules remain strict: any present ref equals
    the exact failed head; forged, malformed, stale or contradictory FAILURE/run/task/ref
    or unauthorized missing candidate conditions fail closed. Ordinary RESULT and
    clean transportable FAILURE behavior is not relaxed.'
- id: AC4
  condition: Terminal-attention admission and original-lane local wake share exact
    immutable selectors and return-affinity provenance, without creating RUN/ResultPackage,
    correction, Reviewer PASS, Publisher inclusion, route allocation or Executor choice.
- id: AC5
  condition: Duplicate attention, locked machine-local lane, deferred delivery and
    ambiguous Send preserve durable inbox and at-most-once delivery; no duplicate
    Chat Send, lost subject, unsafe retry, cross-origin rebinding or false canonical
    resolution.
- id: AC6
  condition: Exact successor of an artifact-only FAILURE resolves solely under authorized
    canonical repair/supersession identity; missing/moved/competing or unrelated source
    keeps correct unresolved/unknown state rather than auto selecting a repair action.
- id: AC7
  condition: Targeted source API and integration regression fixtures cover the RUN-401-002-shaped
    missing candidate, candidate-present positive case, wrong run/task/head/route,
    divergent ref, opposite terminal, race and duplicate/locked wake, while preserving
    historical AST/API and workflow tests.
- id: AC8
  condition: Implementation stays within the existing attention/freshness/return-affinity
    surface with protected privacy and no changes to Runtime failure eligibility,
    Kernel, roadmap, review/publication authority or second lifecycle state store.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_brain_attention.py tests/test_local_chat_wake.py
  - python -m pytest -q tests/test_terminal_attention.py tests/test_local_chat_wake_workflow.py
    tests/test_terminal_attention_workflow.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
