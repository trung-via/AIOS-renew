task_id: TASK-086
revision: 1

goal: >
  Implement Unified State + Next Action as one deterministic, read-only control-plane
  observation for one current canonical TASK revision. Reduce the exact current Git
  control state, repository-local Runtime facts, immutable remote RUN/RESULT/FAILURE/
  REVIEW/REMEDIATION/REPAIR lineage, Admission Failure v2 context, and TASK-085 Correction
  Preflight readiness into one bounded versioned machine-readable state with exactly one
  semantic next-action classification. The observation must tell a later Human-facing
  surface whether the task should execute PRIMARY, wait, receive semantic review, author
  or execute a REMEDIATION/REPAIR, retry transport, recover an exact PRIMARY terminal
  conflict, proceed to publication authority, be considered published/done, or remain
  blocked. It must not itself execute, mutate, review, author a correction, select or
  recommend an Executor, publish, retry, recover, or change roadmap state.

problem: >
  AIOS now has deterministic primitives for the important individual boundaries:
  Admission Failure v2 records bounded pre-RUN rejection facts; Runtime records admitted
  RUN/RESULT/FAILURE/EVIDENCE; review and correction artifacts preserve semantic lineage;
  recover-primary handles one exact conflicting PRIMARY terminal identity; transport retry
  can re-deliver persisted terminal state without execution; safe publication validates a
  reviewed PASS candidate; and TASK-085 can inspect current REMEDIATION/REPAIR admission
  readiness without creating execution state. The Human or outer automation still has to
  inspect several local files, Git refs, review decisions, failure lineage, and correction
  preflight outcomes to decide what class of work comes next. That interpretation is
  repeatedly reconstructed in chat and is a source of avoidable handoffs and wrong
  operation selection. The missing boundary is not another planner: it is a deterministic
  reducer that presents already-authoritative facts and one legal semantic continuation
  class without acquiring any authority to perform that continuation.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-086 authoring is
    3b5a24e338df8d4d7559f07617459068c4e632fe. Its parent
    36ff663675ac04b94da406536ac523e820b1b21e is the semantically reviewed PASS and
    published TASK-085 source candidate.
  - >
    REVIEW-085-002 is canonical DELTA PASS for RUN-085-002 at exact reviewed SHA
    36ff663675ac04b94da406536ac523e820b1b21e with no findings. TASK-085 Correction
    Preflight is therefore established engineering truth and may be consumed rather than
    reimplemented.
  - >
    `.ai/roadmap-state.yaml` at the authoring base is Human/Brain planning state with
    `correction-preflight` DONE by TASK-085 at published SHA 36ff663675ac04b94da406536ac523e820b1b21e
    and `unified-state-next-action` as the unique NEXT item. TASK-086 does not itself
    advance that bookmark; later advancement requires exact TASK-086 PASS publication and
    a separate Human/Brain planning update.
  - >
    TASK-081 remains authoritative for the exact distinction among pre-RUN
    ADMISSION_FAILURE, admitted RUN FAILURE, and semantic CHANGES_REQUIRED. Admission
    Failure v2 is historical/forensic operational evidence and its mere existence does not
    prove that the same blocker remains true in current state.
  - >
    TASK-085 remains authoritative for current REMEDIATION/REPAIR readiness and its
    read-only isolated remote-observation boundary. Unified State must consume or share
    those deterministic correction admission primitives and must not create an approximate
    second validator.
  - >
    TASK-063 safe publication and TASK-071 recover-primary remain authoritative for
    publication eligibility/integration-required behavior and exact PRIMARY terminal
    conflict recovery. Unified State may classify those already-existing next authority
    boundaries but must not execute or weaken them.
  - >
    TASK-074 A3 remote status/approval and TASK-084 A6 approved remediation wakeup remain
    optional subordinate outer-automation surfaces. They are not the lifecycle authority
    for this TASK and must not become required in order to derive core TASK state.
  - >
    The later `unified-human-surface` roadmap item will consume this machine-readable
    observation. TASK-086 therefore establishes state/action semantics only; it does not
    redesign all Human commands or choose an Executor/model.

