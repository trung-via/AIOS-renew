non_goals:
  - Implement the later Unified Human Surface, replace existing `aios run`, `remediate`,
    `repair`, `transport`, `recover-primary`, status/approval, or wakeup commands, or add a
    generic arbitrary-operation router.
  - Select, infer, rank, score, or recommend Codex versus Antigravity, model name, effort,
    timeout, sandbox, permission mode, or any Executor-native configuration.
  - Execute PRIMARY, REMEDIATION, REPAIR, transport retry, recover-primary, canonical
    verification, semantic review, correction authoring, approval, wakeup, publication, or
    any coding/model process from the state query.
  - Author or edit TASK, REVIEW, finding, REMEDIATION, REPAIR, RESULT, FAILURE,
    ADMISSION_FAILURE, approval, dispatch, correction-dispatch, or roadmap state as a side
    effect of observation.
  - Turn the state reducer into a Planner, policy engine, semantic Reviewer, autonomous
    recovery loop, scheduler, daemon, queue, database, Router, or retry/fallback/reroute
    mechanism.
  - Invent a current blocker from an old Admission Failure v2 artifact, infer a semantic
    review verdict from Runtime PASS, infer a correction when no canonical correction
    artifact exists, or infer publication success merely because an Executor claimed PASS.
  - Reconcile or mutate A2 dispatch records, A3 approval state, A6 correction-dispatch
    state, operator leases/locks, historical workspaces, Git refs, or control branch state
    merely to answer Unified State.
  - Auto-sync or fast-forward the repository. Observation may report current state but must
    not inherit PRIMARY mutation authority from TASK-062.
  - Change Runtime completion, verification ownership, ResultPackage schemas, correction
    eligibility, historical lineage, safe publication semantics, review semantics, or
    downstream dependency pins.
  - Modify `.ai/roadmap-state.yaml` in the implementation candidate.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Expose one bounded read-only Operator observation for an exact current TASK id. The
      TASK must be resolved from the current control repository and the output must bind
      its exact current revision; arbitrary Git refs, arbitrary historical TASK revisions,
      arbitrary run selectors, shell commands, or repository paths are not accepted as a
      way to make the reducer choose a different semantic universe.
    - >
      The observation must have one explicit format/version marker and one allowlisted
      machine-readable shape suitable for the later Unified Human Surface. At minimum it
      must contain TASK id/revision, bounded lifecycle state, the exact authoritative RUN/
      review/failure/correction identities already resolved when relevant, current
      candidate/reviewed/failed SHA facts when relevant, one `next_action`, and one bounded
      blocker classification when state is BLOCKED. It must explicitly report that the
      query created no RUN and invoked no Executor.
    - >
      `next_action` must be exactly one of the following semantic classes:
      `EXECUTE_PRIMARY`, `WAIT`, `SEMANTIC_REVIEW`, `AUTHOR_REMEDIATION`,
      `EXECUTE_REMEDIATION`, `AUTHOR_REPAIR`, `EXECUTE_REPAIR`, `RETRY_TRANSPORT`,
      `RECOVER_PRIMARY`, `PUBLICATION`, `DONE`, or `NONE`. The observation may include the
      exact already-known selector identities needed by that class, but it must not invent
      an Executor/model or make a Human/Brain semantic choice that canonical state has not
      already made.
    - >
      Each next-action class must preserve authority separation: PRIMARY/correction/
      transport/recovery classes only indicate a Human-authorized Runtime operation;
      `SEMANTIC_REVIEW` indicates Reviewer work without predicting PASS/CHANGES_REQUIRED;
      `AUTHOR_REMEDIATION`/`AUTHOR_REPAIR` indicate Brain correction-authoring authority;
      `PUBLICATION` indicates the separate publication boundary; `WAIT`, `DONE`, and
      `NONE` grant no mutation authority. The state query itself performs none of them.
    - >
      State reduction must be lineage-driven, not recency-driven. Never choose a current
      tip merely because a RUN id is numerically/lexicographically largest, a file is most
      recent, or a ref has the newest timestamp. Follow exact TASK revision, RUN terminal
      identity, correction continuation, reviewed_sha/failed_head_sha, and immutable
      continuation relationships. Multiple competing unresolved tips, malformed lineage,
      ambiguous review/correction identity, or contradictory canonical terminal facts must
      fail closed as BLOCKED with `next_action=NONE` rather than being silently ordered.
    - >
      For a current TASK with no admitted lifecycle continuation and no currently observed
      deterministic conflict, the semantic next action is `EXECUTE_PRIMARY`. Historical
      Admission Failure v2 artifacts may be surfaced as bounded forensic context but their
      mere presence must not keep the current task BLOCKED after repository/remote state may
      have changed. No historical admission error string may be parsed into a recovery plan.
    - >
      An admitted RUN without terminal RESULT/FAILURE remains `WAIT`. A persisted local
      terminal RESULT/FAILURE that is otherwise valid but has not reached its canonical
      transport ref must classify `RETRY_TRANSPORT` without re-executing the RUN. A
      canonical PRIMARY terminal RESULT/FAILURE conflict may classify `RECOVER_PRIMARY`
      only when the exact existing TASK-071 recovery contract proves that recovery identity;
      otherwise conflicting terminal state is BLOCKED with `NONE`.
    - >
      Runtime RESULT/EVIDENCE without a canonical semantic review decision for the exact
      current lineage tip must classify `SEMANTIC_REVIEW`. The reducer must never infer a
      review verdict from claims, test success, RESULT shape, Executor prose, or publication
      eligibility.
    - >
      A canonical CHANGES_REQUIRED review must preserve exact finding identity. If no
      canonical REMEDIATION exists for the unresolved review state, classify
      `AUTHOR_REMEDIATION`. If exactly one deterministic current REMEDIATION continuation
      is already authored and TASK-085 preflight is READY, classify `EXECUTE_REMEDIATION`.
      If correction preflight is BLOCKED, surface its bounded phase/reason and classify
      `NONE`. Never pick between multiple competing ready remediation continuations or
      silently merge findings; ambiguous correction choice is BLOCKED for Brain resolution.
    - >
      An admitted RUN FAILURE may classify `AUTHOR_REPAIR` only when existing failure facts
      make the candidate repairable under current REPAIR semantics and no canonical REPAIR
      is authored yet. When the exact canonical REPAIR exists and TASK-085 preflight is
      READY, classify `EXECUTE_REPAIR`; when preflight is BLOCKED, preserve its bounded
      reason and classify `NONE`. A non-repairable failure is BLOCKED with `NONE` and must
      not be converted into PRIMARY rerun, remediation, or speculative recovery.
    - >
      A successful REMEDIATION/REPAIR ResultPackage is still only Runtime PASS: if its
      exact correction tip lacks semantic DELTA review, classify `SEMANTIC_REVIEW`. A PASS
      review decision does not itself mean publication occurred.
    - >
      For a canonical PASS review of the exact current lineage tip, use existing safe
      publication ancestry semantics without publishing: if the reviewed candidate is
      already equal to or an ancestor of current canonical main, classify `DONE`; if the
      candidate is an eligible descendant of current main, classify `PUBLICATION`; if
      candidate and current main diverged and safe publication would require explicit
      integration authority, classify BLOCKED with `NONE` and a bounded
      integration-required reason. Never merge/rebase/cherry-pick to make publication fit.
    - >
      All remote observation performed solely for Unified State must be isolated from the
      current control repository in the same sense established by TASK-085: no fetch/
      ls-remote follow-up may leave new control Git objects/FETCH_HEAD-like metadata, no
      `.git/aios` state is created or rewritten, and HEAD/index/worktree/branch remain
      byte/identity unchanged. Existing already-persisted operational facts may be read but
      not reconciled or rewritten.
    - >
      The state query must create zero RUNs, leases, handoffs, RESULT/FAILURE/EVIDENCE,
      ADMISSION_FAILURE, approval, dispatch, correction-dispatch, remediation/repair, review,
      publication, or roadmap artifacts; invoke zero coding Executors and zero canonical
      verification commands; and perform zero retries, fallbacks, reroutes, cleanup, sync,
      recovery, or publication actions.
    - >
      Output must be bounded and allowlisted. Do not expose raw Executor/model text, source
      content, complete artifact documents, prompts, verification logs, credentials,
      environment dumps, unrestricted Git stdout/stderr, stack traces, timestamps used for
      ordering, or arbitrary filesystem paths. Deterministic reason/state/action codes must
      come from structural boundaries rather than final-error prose parsing.
    - >
      A valid state query that successfully observes a BLOCKED lifecycle state should still
      return a well-formed observation rather than fabricate an execution failure. Invalid
      TASK/repository identity or inability to acquire enough canonical state to form a
      trustworthy observation must fail closed as a query error. Query success and
      engineering readiness are separate concepts.
    - >
      Existing `aios run`, `wakeup`, `remediate`, `repair`, `accept-candidate`, `transport`,
      `recover-primary`, Correction Preflight, A3 status/approval, A6 correction delivery,
      Runtime completion/verification, semantic review, and safe publication behavior must
      remain unchanged except for strictly shared read-only lineage helpers proven
      equivalent by regression. Unified State must not become an implicit prerequisite for
      those existing operations.
    - >
      README must document Unified State as a derived read-only observation, the fixed
      next-action taxonomy, authority ownership of each semantic class, fail-closed
      ambiguity, historical Admission Failure caveat, Correction Preflight consumption,
      and the fact that this TASK does not yet provide the later unified Human command
      grammar or Executor recommendation.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic fresh-current-TASK regression with no admitted continuation returns
      a versioned bounded observation for the exact TASK revision with
      `next_action=EXECUTE_PRIMARY`, while creating no Runtime/canonical state and invoking
      no Executor or verification.
  - id: AC2
    condition: >
      Deterministic admitted-RUN regressions prove an active nonterminal RUN returns
      `WAIT`; an exact valid local terminal state whose canonical transport is absent
      returns `RETRY_TRANSPORT`; and an exact TASK-071-eligible conflicting PRIMARY
      terminal identity returns `RECOVER_PRIMARY`. Malformed or non-recoverable terminal
      conflicts fail closed as BLOCKED/`NONE`. None of these observations mutates or
      reconciles the underlying state.
  - id: AC3
    condition: >
      A Runtime PASS RESULT without semantic review returns `SEMANTIC_REVIEW`, and no
      RESULT claims, successful verification evidence, Executor statement, or publication
      possibility can cause the reducer to synthesize a PASS/CHANGES_REQUIRED verdict.
  - id: AC4
    condition: >
      CHANGES_REQUIRED regressions prove exact unresolved finding identity is preserved:
      missing canonical REMEDIATION returns `AUTHOR_REMEDIATION`; one unambiguous authored
      REMEDIATION with TASK-085 READY returns `EXECUTE_REMEDIATION`; TASK-085 BLOCKED returns
      bounded BLOCKED/`NONE`; and competing correction continuations are never silently
      ordered or merged.
  - id: AC5
    condition: >
      RUN FAILURE regressions prove a repairable failed tip without an authored REPAIR
      returns `AUTHOR_REPAIR`; an exact authored TASK-085-READY REPAIR returns
      `EXECUTE_REPAIR`; TASK-085-BLOCKED or non-repairable failure returns BLOCKED/`NONE`;
      and NO_CHANGE versus CODE_FIX readiness preserves TASK-064/TASK-075/TASK-076 action
      ordering without adding a retry/reroute path.
  - id: AC6
    condition: >
      Successful REMEDIATION and REPAIR tips with no DELTA review both return
      `SEMANTIC_REVIEW`, preserving the rule that Runtime PASS is not semantic PASS and
      that correction lineage is reviewed rather than restarting PRIMARY.
  - id: AC7
    condition: >
      PASS-review publication regressions prove an exact reviewed candidate already
      contained by current main returns `DONE`, an eligible descendant returns
      `PUBLICATION`, and a divergent candidate returns bounded integration-required
      BLOCKED/`NONE`, with zero publication or Git integration mutation.
  - id: AC8
    condition: >
      Historical Admission Failure v2 facts can be reported only as bounded context and do
      not by themselves override current lifecycle state or turn a currently retryable
      fresh TASK into BLOCKED. Current deterministic conflict/blocker facts still fail
      closed without parsing historical error prose into advice.
  - id: AC9
    condition: >
      Equivalent authoritative state yields equivalent semantic output independent of file
      mtimes/ref timestamps or directory iteration order. Multiple competing unresolved
      tips, ambiguous review decisions, malformed lineage, or contradictory canonical facts
      produce deterministic BLOCKED/`NONE` rather than a guessed latest action.
  - id: AC10
    condition: >
      READY, WAIT, REVIEW, correction, recovery, publication, DONE, and BLOCKED observation
      regressions prove no control Git/object metadata, `.git/aios` state, HEAD, index,
      branch, worktree, remote ref, canonical artifact, Executor call, canonical
      verification, retry, reconciliation, recovery, or publication side effect occurs.
  - id: AC11
    condition: >
      Existing Operator/review-transport/Correction-Preflight/recover-primary/transport and
      publication-related focused regressions remain behaviorally compatible, README
      documents the derived-state boundary and fixed action taxonomy, and no unified Human
      grammar, Executor recommendation, planner/router, downstream migration, roadmap-state
      mutation, retry/fallback/reroute, or new authority is introduced.

verification:
  required:
    - python -m pytest tests/test_operator.py tests/test_review_transport.py -q
    - git diff --check
