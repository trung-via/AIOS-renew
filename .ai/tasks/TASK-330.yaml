task_id: TASK-330
revision: 1
goal: 'Deliver VP-03A''s independently testable read-only, canonical-provenance-bound
  evidence applicability foundation: establish when an existing observed proof remains
  VALID, becomes INVALIDATED, or is UNKNOWN for an exact source-to-target candidate/lineage
  with full dependency and reviewed proof mapping context. Preserve the actual source
  evidence subject. Do not activate any new Runtime scheduler, checkpoint state mutation,
  proof reuse authorization, or same-RUN correction.'
problem: Published VP-02 proof/mapping (TASK-326), intra-RUN declaration (TASK-328),
  and Human-ratified KA-01 addendum (TASK-329) specify cross-candidate evidence validity
  but cannot authenticate an actual source/evidence/target/footprint from caller assertions.
  Without a read-only trusted provenance and applicability boundary, matching commands,
  unchanged filenames, self-certified witness digests or stale correction evidence
  could create false PASS or duplicated verification. VP-03 needs a bounded first
  implementation slice separating immutable authentication and three-state factual
  applicability from later checkpoint durability, single scheduler and live continuation.
assumptions:
- Canonical planning transition main for authoring is 84478a59405427ef932740eb26d8ce6292b0fe71.
  AUTHOR_TASK expected-main CAS and later PRIMARY exact TASK SHA binding are mandatory;
  new main movements fail closed.
- TASK-329 r1 RUN-329-001 exact reviewed published source 648a2cdeaa1de7949bab9da707c82dac179abc05
  and REVIEW-329-001 PASS establish KA-01 prospective design only; Runtime activation
  remains NOT_ACTIVATED. Frozen v0.1 and Constitution are unchanged.
- TASK-326 proof-coverage-v1 and TASK-328 intra-run-proof-v1 are published in-memory
  validation foundations and must be reused rather than reinterpreted or reimplemented.
- VP-02 foundation and KA-01 source are published; VP-02 whole-package/VP-01 measurement
  exits are NOT done. Human requested continuation to independently admissible bounded
  VP-03A, not full VP-03 closure, live cutover or VP-01 waiver.
- Existing V1/V2 TASK/RESULT/EVIDENCE/REPAIR contracts and minimum-sufficient-v2 verification
  policy remain active. Historical actual subject/raw metadata are immutable and any
  source-to-target applicability is separate.
- Human has not yet selected an Executor/model/effort for TASK-330. Do not inherit
  TASK-329's Codex gpt-6.1-sol max profile; executor delegation belongs to a later
  explicit Human choice and must not be placed in TASK fields.
- Newly authored AIOS-renew TASK identity uses the currently Human-approved LEGACY_REPOSITORY_DEFAULT_ROUTE;
  this is not origin-affine proof nor a default for downstream repositories.
