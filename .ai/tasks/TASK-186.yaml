task_id: TASK-186
revision: 1

goal: >
  Implement BP6-P2A Reviewer Procedure Profile as one repository-owned, bounded,
  content-addressed, provider-visible semantic-review procedure contract for PRIMARY and
  DELTA review, while preserving Reviewer independence from Brain audit policy and
  preserving review.validate_review as the existing canonical REVIEW validator.

problem: >
  BP6-P1A and BP6-P1B now provide exact semantic review identity and bounded
  implementation material, but a repository-blind Reviewer still lacks a self-sufficient
  repository-owned procedure describing how PRIMARY and DELTA judgment must be performed.
  Reusing the Brain audit profile would merge distinct semantic authorities, while
  embedding ad-hoc procedure prose later in provider adapters or BP6-P3 would create
  duplicate policy. BP6-P2A must therefore define one pure, bounded Reviewer procedure
  registry and parser/selector without creating REVIEW output grammar, provider
  invocation, lifecycle authority, or a second REVIEW validator.

assumptions:
  - >
    Canonical main e048b72abcebbf8918195b8d4ef4e6d12ecf5f0f records BP-6 as the
    unique current planning milestone with BP6-P1A and BP6-P1B reviewed/published DONE
    and BP6-P2A as the unique NEXT phase.
  - >
    docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md defines BP6-P2A as a distinct Reviewer
    procedure profile and explicitly separates it from BP6-P2B return-contract grammar,
    BP6-P3 request/decision materialization, and BP6-P4 provider invocation.
  - >
    Existing Flow Card SEMANTIC_REVIEW metadata is authoritative:
    authority_owner REVIEWER, decision_family_ref review.validate_review,
    handoff_target AUTHORING_INGRESS, expected_return_shape REVIEW_CONTRACT_PROPOSAL.
  - >
    Existing review.validate_review remains the canonical REVIEW validator; P2A provides
    Reviewer cognitive-support procedure only and does not validate or materialize REVIEW
    artifacts.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md
    - .ai/roadmap-state.yaml
    - .ai/flow-cards.yaml
    - .ai/brain-audit-profiles.yaml
    - src/aios_renew/brain_audit.py
    - src/aios_renew/review.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/review_material.py
  modify:
    - .ai/reviewer-procedure-profiles.yaml
    - src/aios_renew/reviewer_procedure.py
    - tests/test_reviewer_procedure.py

non_goals:
  - >
    Define or validate the provider-authored REVIEW semantic body, REVIEW identity,
    finding identity, AIOS_REVIEW_REQUEST, AIOS_REVIEW_DECISION, provider adapters,
    provider invocation, retry/fallback/voting, model routing, hot-swap or real-provider
    behavior; these belong to later BP6-P2B/P3/P4/BP-7/BP-8 phases.
  - >
    Change review.py, review.validate_review, REVIEW schema, Unified State, Decision
    Packet, review material, Flow Cards, Runtime verification/evidence, ingress,
    publication, Brain audit profiles, Brain Provider Protocol or any lifecycle contract.
  - >
    Reuse brain-high-value-v2 as Reviewer authority, create a second Reviewer,
    multi-reviewer/self-reflection loop, persisted reasoning/session state, or require a
    second semantic Reviewer invocation.
  - >
    Produce a REVIEW verdict, acceptance map, finding, remediation/repair authorization,
    provider response, canonical mutation or publication action.
  - >
    Read repository/Git/GitHub/network state from production code. The production module
    is pure over caller-supplied decoded or serialized procedure material.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      Production mutation is limited to scope.modify. If correct implementation requires
      changing REVIEW, Unified State, Decision Packet, review material, Runtime, ingress,
      publication, Flow Cards or provider code, fail closed back to Brain rather than
      widening scope.
    - >
      Add exactly one canonical registry format AIOS_REVIEWER_PROCEDURE_PROFILES version
      1 containing exactly one profile id reviewer-semantic-v1 version 1. The registry is
      the sole source of Reviewer procedure prose; production code may enforce closed
      identifiers/grammar but must not duplicate the procedural check text.
    - >
      The profile metadata must exactly bind selected_flow SEMANTIC_REVIEW,
      authority_owner REVIEWER, decision_family_ref review.validate_review,
      handoff_target AUTHORING_INGRESS and expected_return_shape REVIEW_CONTRACT_PROPOSAL.
    - >
      The profile must carry one_call_semantics=true and exactly two ordered mode records,
      PRIMARY then DELTA. Each mode record is closed to mode and steps; each step is
      closed to id and check, with non-empty bounded UTF-8 check text.
    - >
      PRIMARY step ids are exactly, uniquely and in order:
      CONTRACT_COVERAGE, SEMANTIC_DELTA_INSPECTION, CLAIM_EVIDENCE_CROSSCHECK,
      MATERIAL_DEFECT_SWEEP, VERDICT_CLOSURE.
    - >
      PRIMARY procedure prose must require: every TASK acceptance criterion plus relevant
      hard constraints/non-goals is assessed against the exact candidate; the complete P1B
      semantic implementation view is inspected rather than changed-file names/Executor
      claims alone; RESULT claims are cross-checked against source and Runtime-owned
      bounded evidence summaries; Executor claims do not become proof; material defects
      are sought only within the authorized review subject; closure checks verdict,
      acceptance outcomes and findings for consistency before return.
    - >
      DELTA step ids are exactly, uniquely and in order:
      PRIOR_FINDING_RESOLUTION, LATEST_CORRECTION_INSPECTION,
      PRIOR_CONCLUSION_INVALIDATION, VERDICT_CLOSURE.
    - >
      DELTA procedure prose must require: the exact prior finding/expected outcome is
      judged against the cumulative semantic view; latest_delta_view is inspected when
      present for a material defect introduced by the latest correction; an additional
      acceptance conclusion is revisited only when the correction directly invalidates
      that prior conclusion; the original TASK is not automatically re-reviewed; closure
      checks prior-finding basis and directly affected acceptance outcomes consistently.
    - >
      The profile must include a bounded semantic verdict boundary stating that invalid
      Decision Packet/P1A scope/P1B material, provider transport failure and malformed
      provider output are protocol/material/transport failures and never semantic BLOCKED.
      BLOCKED remains only the existing Reviewer semantic verdict when an otherwise valid
      exact semantic subject itself prevents a bounded PASS/CHANGES_REQUIRED judgment.
      P2A must not change or reinterpret canonical REVIEW lifecycle behavior.
    - >
      The profile must explicitly prohibit second Reviewer invocation, reviewer voting,
      persisted chain-of-thought/session dependence and hidden prior-chat semantic input.
      An internal closure sweep within the same future Reviewer invocation is allowed.
    - >
      Registry effective v1 bounds are exactly:
      raw_registry_bytes=65536, selected_profile_bytes=32768,
      procedure_step_bytes=4096, steps_per_mode=8, max_depth=32. These are fail-closed
      ceilings; no text or structure may be truncated to fit.
    - >
      Expose a pure parser/normalizer for caller-supplied UTF-8 YAML bytes/text, rejecting
      duplicate keys, YAML aliases, unknown/missing fields, unknown/reordered/duplicate
      profile or mode/step identifiers, invalid Unicode, non-JSON semantic values,
      over-depth or over-bound material, and effective-bound substitution.
    - >
      LF/CRLF representation and YAML mapping-field order must normalize to the same
      semantic registry identity; changing any profile metadata, mode, step id/check,
      semantic verdict boundary, one-call rule or effective bound must change the
      content-addressed profile digest.
    - >
      Expose one pure selection operation that accepts an already-authoritative
      review_mode token PRIMARY or DELTA, validates the supplied registry, and returns
      the exact normalized full profile, the exact selected ordered mode procedure,
      effective bounds and a content-addressed reviewer_procedure_ref. Selection must not
      derive review_mode from repository/lifecycle state and must reject any other token.
    - >
      reviewer_procedure_ref must bind reviewer-semantic-v1, profile version 1 and a
      lowercase SHA-256 digest over canonical deterministic JSON of the complete
      normalized full profile plus effective v1 bounds. Provider/model/session identity,
      review_id, reviewed_sha, finding ids and lifecycle state are excluded.
    - >
      The parser/selector performs no filesystem/Git/GitHub/network/provider access, no
      REVIEW validation/materialization, no lifecycle discovery/mutation, no retry or
      fallback, and no persistent cache/session state.

acceptance:
  - id: AC1
    condition: >
      The repository contains exactly one AIOS_REVIEWER_PROCEDURE_PROFILES v1 registry
      with one reviewer-semantic-v1 profile whose metadata exactly matches the canonical
      SEMANTIC_REVIEW Flow Card and whose effective bounds exactly match this TASK.
  - id: AC2
    condition: >
      The normalized profile contains the exact ordered five-step PRIMARY procedure and
      exact ordered four-step DELTA procedure defined by this TASK, with the canonical
      registry as the sole source of procedure prose and no Brain-audit procedure reuse.
  - id: AC3
    condition: >
      PRIMARY procedure semantics require complete TASK acceptance coverage, exact P1B
      semantic-delta inspection, claim/evidence cross-check, bounded material-defect sweep
      and one-call verdict closure without repository rediscovery or Executor-claim truth.
  - id: AC4
    condition: >
      DELTA procedure semantics require exact prior-finding resolution, latest correction
      inspection when present, only evidence-based invalidation of additional prior
      acceptance conclusions, and one-call closure without automatic whole-TASK re-review.
  - id: AC5
    condition: >
      The profile distinguishes semantic BLOCKED from protocol/material/transport failure
      and prohibits second Reviewer invocation, voting, persisted chain-of-thought/session
      dependence and hidden chat-memory inputs without changing the existing REVIEW schema
      or review.validate_review authority.
  - id: AC6
    condition: >
      Pure parsing/normalization/selection enforces closed v1 grammar, exact ordering,
      duplicate/alias/Unicode/JSON/depth/byte bounds and authoritative PRIMARY|DELTA mode
      selection, while equivalent YAML mapping order and LF/CRLF input normalize
      identically.
  - id: AC7
    condition: >
      reviewer_procedure_ref is stable for equivalent complete profile+bounds material and
      changes when any metadata, procedure step/check, semantic verdict boundary,
      one-call rule or bound changes; provider/model/session and canonical REVIEW identity
      fields are absent from the digest contract.
  - id: AC8
    condition: >
      TASK-186 adds only Reviewer cognitive-support procedure material: production code
      has no filesystem/Git/GitHub/network/provider I/O, REVIEW creation/validation,
      lifecycle mutation, provider routing/retry/fallback, second Reviewer or persistent
      semantic state, and BP6-P2B/P3/P4 remain unimplemented.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_reviewer_procedure.py
