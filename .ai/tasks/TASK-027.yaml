task_id: TASK-027
revision: 1

goal: >
  Move PRIMARY task.verification.required and REMEDIATION
  affected_verification execution and canonical verification EVIDENCE
  construction out of Codex/Antigravity executors and into deterministic AIOS
  Runtime for the AIOS-renew v0.1.3 reliability repair.

problem: >
  RUN-095-002 and RUN-097-001 independently failed because executor-produced
  ResultPackage artifacts omitted or mismatched exact required verification
  evidence. AIOS-renew v0.1.2 already explicitly prompts Codex to execute every
  required command and provide exact evidence, so further prompting is not the
  fix. ExecutorBoundary currently validates full ResultPackage evidence
  immediately after adapter execution even though deterministic Runtime must
  own canonical verification execution and evidence construction.

assumptions:
  - Executor implementation output can be structurally validated before Runtime verification.
  - Runtime can execute repository-local verification commands under the existing operator lock.
  - Semantic ChatGPT Review consumes only persisted canonical ResultPackage artifacts.
  - Existing v0.1.2 persisted ResultPackage artifacts remain compatibility inputs.

scope:
  inspect:
    - src/aios_renew/verification.py
    - src/aios_renew/operator.py
    - src/aios_renew/executor.py
    - src/aios_renew/artifacts.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/schemas/result_package.json
    - tests/test_verification.py
    - tests/test_operator.py
    - tests/test_executor.py
    - tests/test_artifacts.py
    - tests/test_codex_adapter.py

  modify:
    - src/aios_renew/verification.py
    - src/aios_renew/operator.py
    - src/aios_renew/executor.py
    - src/aios_renew/artifacts.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/schemas/result_package.json
    - tests/test_verification.py
    - tests/test_operator.py
    - tests/test_executor.py
    - tests/test_artifacts.py
    - tests/test_codex_adapter.py

non_goals:
  - Fix the defect through additional executor prompting alone.
  - Move implementation HOW, commit responsibility, or semantic acceptance judgment into Runtime.
  - Change semantic ChatGPT Review behavior.
  - Add automatic retry, executor rerouting, fallback, or command re-execution.
  - Add a planner, router, watcher, daemon, database, Redis, message broker, or orchestration framework.
  - Change PRIMARY upstream synchronization or REMEDIATION no-sync lineage.
  - Normalize, reorder, deduplicate, or otherwise reinterpret canonical verification commands.
  - Invalidate or rewrite existing v0.1.2 persisted ResultPackage files.

constraints:
  hard:
    - Executor owns implementation HOW and the final permitted implementation commit only.
    - Executor returns structural result only and must not execute TASK or REMEDIATION verification or synthesize canonical verification evidence.
    - Runtime must first validate actual HEAD, clean worktree, exact changed_files and scope, unresolved state, and acceptance completeness.
    - Runtime may execute canonical verification only after every structural and repository-state check passes.
    - PRIMARY Runtime verification uses exactly task.verification.required.
    - REMEDIATION Runtime verification uses exactly affected_verification and never the full TASK verification list.
    - Verification commands execute sequentially in exact original list order, exactly once each, with no retry, reroute, normalization, deduplication, or reordering.
    - On the first nonzero exit Runtime records raw evidence, stops all later verification, fails closed, and persists no canonical RESULT or ResultPackage.
    - Evidence source.command preserves the exact original TASK or REMEDIATION command string.
    - Runtime generates deterministic evidence IDs from RUN id and one-based command order and binds every evidence item to run_id and the final actual HEAD.
    - Raw verification stdout and stderr are stored beneath Git-dir .git/aios operational state outside the product worktree.
    - Verification subprocess handling uses bytes and strict UTF-8 decoding for commands, stdout, and stderr.
    - On PRIMARY PASS Runtime mechanically attaches the complete successful verification evidence ID set to every semantic claim without changing claim.satisfies or claim text.
    - Executor-facing structural result may contain empty package evidence and empty claim evidence references.
    - Persisted canonical ResultPackage must continue to require valid non-empty claim evidence references and all existing TASK, RUN, HEAD, claim, and evidence binding checks.
    - Codex and Antigravity executor instructions explicitly prohibit executor-side canonical verification execution and evidence generation.
    - Preserve PRIMARY upstream synchronization, REMEDIATION no-sync reviewed_sha lineage, RepositoryLock coverage, scope and exact changed-files enforcement, clean final HEAD, CODE_FIX and EVIDENCE_ONLY semantics, and semantic ChatGPT Review unchanged.
    - Existing v0.1.2 persisted ResultPackage files must remain readable and valid.
    - No automatic retry or executor rerouting is permitted.
    - Keep implementation deterministic, minimal, and confined to the permitted scope.

acceptance:
  - id: AC1
    condition: >
      Codex and Antigravity own only implementation HOW and final permitted
      commit creation, return structural result without canonical verification
      evidence, and are explicitly prohibited from executing or synthesizing
      TASK/REMEDIATION verification evidence.

  - id: AC2
    condition: >
      Runtime validates actual HEAD, clean worktree, exact changed_files and
      scope, unresolved state, and complete acceptance claims before starting
      any canonical verification command.

  - id: AC3
    condition: >
      PRIMARY verification executes task.verification.required sequentially in
      exact list order exactly once per command, with no retry, reroute,
      normalization, deduplication, or reordering.

  - id: AC4
    condition: >
      REMEDIATION verification executes affected_verification only, never full
      TASK verification, while CODE_FIX and EVIDENCE_ONLY behavior and
      reviewed_sha lineage remain unchanged.

  - id: AC5
    condition: >
      On first nonzero verification exit Runtime stores the raw evidence,
      stops later commands, fails closed, and persists no canonical RESULT or
      ResultPackage.

  - id: AC6
    condition: >
      Successful Runtime evidence preserves each exact source.command, uses a
      deterministic ID derived from RUN id and command order, binds run_id and
      final actual HEAD, and stores raw output beneath Git-dir .git/aios.

  - id: AC7
    condition: >
      Verification subprocess execution and output capture use bytes with
      strict UTF-8 decoding, and decode failures fail closed without canonical
      result persistence.

  - id: AC8
    condition: >
      On PRIMARY PASS the complete successful Runtime evidence ID set is
      mechanically attached to every semantic claim without modifying claim
      text or claim.satisfies.

  - id: AC9
    condition: >
      Executor-facing structural output accepts empty package evidence and
      empty claim evidence references, while persisted canonical ResultPackage
      validation still requires valid claim evidence and retains every existing
      binding check.

  - id: AC10
    condition: >
      Existing v0.1.2 persisted ResultPackage files remain readable and valid
      without migration or rewriting.

  - id: AC11
    condition: >
      Regression coverage reproduces the RUN-095-002 and RUN-097-001 failure
      class using empty executor verification evidence and proves Runtime-owned
      verification constructs valid canonical evidence and succeeds.

  - id: AC12
    condition: >
      Regression coverage proves pre-verification gate failures execute no
      commands, ordering and exact command preservation are deterministic,
      first-command failure stops later commands, and nonzero or decode failure
      persists no canonical result.

  - id: AC13
    condition: >
      PRIMARY upstream sync, REMEDIATION no-sync lineage, locking, scope,
      changed-files, clean HEAD, semantic Review, and both executor pathways
      retain their existing behavior apart from Runtime-owned verification.

verification:
  required:
    - python -m pytest tests/test_verification.py tests/test_artifacts.py tests/test_executor.py tests/test_codex_adapter.py tests/test_operator.py -q
    - python -m pytest -q
    - git diff --check
    - git status --porcelain
