task_id: TASK-303
revision: 1
goal: Consolidate transient diagnostic scaffolding, duplicate regression coverage,
  and default Brain roadmap hydration, and remove only caller/dependency-proven superseded
  code or workflows, while preserving lifecycle semantics and immutable historical
  evidence.
problem: AIOS-renew has accumulated bounded diagnostic helpers, overlapping regression
  cases, superseded wake-era surfaces, and a roadmap representation whose default
  Brain Sync path still parses and validates broad historical material. The cleanup
  must reduce maintenance and hydration cost without deleting evidence, weakening
  unique regression coverage, creating a second planning/lifecycle truth, or removing
  any surface whose current or queued dependency is not positively disproven.
assumptions:
- Canonical planning baseline for TASK-303 authoring is main f73b9e7448dd11c9857a43a385326d822ad82301;
  TASK-302 remains reviewed and exactly published at 8832e24edb1cd471a8a7f653a622ef5e1776920f.
- H4D remains LIVE_EXIT_GATE_PENDING and H4E remains queued; this cleanup is an explicit
  Human-priority side-track and must return to the unchanged H4D live-exit gate after
  its own lifecycle completes.
- The current default Brain Sync summary is bounded on output but still loads the
  full roadmap and scans historical DONE entries, and its positional last_published_task
  derivation can report an older task when sequence order is not publication order.
- Historical TASK/RUN/RESULT/FAILURE/REVIEW/REMEDIATION/REPAIR refs and published
  Git objects remain authoritative engineering evidence and must not be rewritten,
  deleted, compacted into a substitute store, or required in default Brain hydration
  unless the active decision needs them.
- Some diagnostic scripts, wake code, workflows, and tests may still be referenced
  by queued roadmap work or active carriers; file names, age, or a superseded label
  alone are insufficient deletion proof.
- This TASK originates from an H4C1 post-cutover regular-Chat flow and therefore carries
  the exact Human/Brain-established ORIGIN_AFFINE selector supplied for this conversation.
