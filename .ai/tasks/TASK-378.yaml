  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-KERNEL-KA01-PROSPECTIVE-AMENDMENT.md
    - docs/AIOS-LEAN-VP-INTELLIGENT-INTRA-PRIMARY.md
    - docs/AIOS-LEAN-VP-L1-BASELINE.md
    - docs/AIOS-LEAN-VP-L1-SEMANTIC-PROOF-INTAKE.md
    - docs/AIOS-LEAN-VP-L1-CANONICAL-SOURCE-BINDING.md
    - docs/AIOS-VP02-PROOF-COVERAGE-CONTRACT-v1.md
    - .ai/roadmap-state.yaml
    - .ai/brain-audit-profiles.yaml
    - .ai/tasks/TASK-373.yaml
    - .ai/tasks/TASK-374.yaml
    - .ai/tasks/TASK-376.yaml
