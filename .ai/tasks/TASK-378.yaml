task_id: TASK-378
revision: 1
goal: >-
  Deliver the next bounded Lean VP L1 review-authority eligibility slice after
  TASK-377. Define and validate one explicitly invoked, non-operative binding
  between the source-consistent TASK/semantic proof contract/mapping intake and
  one independently Human-selected exact mapping-review TASK and its
  own authenticated Reviewer/Publisher PASS lineage under existing authority. Never equate Git provenance, a mapping's
  self-declared review_ref, an ordinary RUN REVIEW PASS, or a caller assertion
  with independent semantic mapping approval. Retain explicit NOT_ESTABLISHED
  whenever the requisite approved mapping subject or lineage is unavailable.
problem: >-
  TASK-376 validates exact structural coverage and TASK-377 authenticates
  canonical Git content and currentness, but neither proves that an independent
  Reviewer assessed the actual mapping/obligation semantics or that the specific
  reviewed semantic source was lawfully published. A future production caller
  must not be able to promote a committed but unreviewed mapping to eligibility
  using coherent hashes, ordinary RUN review status, actor labels, or a Git ref
  created outside the existing Reviewer/Publisher authority. Supply a bounded
  reusable eligibility boundary now, without creating a new review authority,
  review publisher, live proof scheduler, TASK version cutover or production opt-in.
assumptions:
  - >-
    Canonical main at authoring is ada97b55868e7df79b47532f11ccca9a0b9e4633.
    TASK-377 r1 exists on main, and the independently recorded
    REVIEW-377-001 declares PASS for RUN-377-002 with reviewed_sha equal to this
    main. This ordinary engineering review does NOT authorize any future
    semantic mapping by itself.
  - >-
    Lean VP remains the unique Human-selected canonical roadmap NEXT and L1 is
    incomplete. TASK-373 is read-only baseline, TASK-374 is KA-01 v1.1
    prospective normative sequence, TASK-376 is non-operative intake, and
    TASK-377 is source-consistency binding. KA-01 remains NOT_ACTIVATED;
    matched VP-01 measurement remains outstanding.
  - >-
    The existing Reviewer/Publisher paths can prove an exact RUN-reviewed
    TASK source. A mapping-specific future positive case additionally requires
    an independently authenticated Human-selected mapping-review TASK identity,
    its immutable acceptance and mapping source association, complete Reviewer
    PASS for that specific TASK/source and Publisher publication. No such live
    mapping-review TASK is assumed to exist now. In its absence the truthful
    outcome is NOT_ESTABLISHED. The binder does not determine semantic adequacy
    from acceptance prose; that remains with Human and independent Reviewer.
  - >-
    This is prospective TASK authoring under tca-1 version 1 with normalized
    digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2.
    Human roadmap continuation does not delegate an Executor, model, effort,
    correction budget or KA-01 production opt-in. New TASK route is the
    currently Human-selected LEGACY_REPOSITORY_DEFAULT_ROUTE.
