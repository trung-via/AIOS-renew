task_id: TASK-351
revision: 1
goal: Fix the observed failure-projection transport incompatibility and deliver end-to-end actionable
  Failure Diagnostic Handoff to authorized Brain and Executor through existing Runtime FAILURE, BP-2,
  terminal attention, and fresh Brain Sync without a second coordinator.
problem: RUN-350-001 timed out during a 60-minute Codex invocation, with 23 uncommitted in-scope worktree
  entries. Runtime retained an immutable local FAILURE containing error.type/message/exit_code/native_diagnostics,
  but public FAILURE projection rejected the diagnostic record with `undeclared public FAILURE diagnostics`;
  canonical failure transport and attention did not complete. Broad diagnostic suppression then made Human
  repeatedly extract logs manually to diagnose the failure.
assumptions:
- 'Canonical main at Brain Sync: 53dc5a25799843b1db53dc29af2c3a9b36fd6f6e; TASK-351 revision 1 is not
  yet canonicalized. Runtime must independently check current main, provenance, schema and CAS.'
- Human explicitly approved priority elevation and consolidation of projection repair plus E2E Failure
  Diagnostic Handoff into this one Task. This request does not itself mutate .ai/roadmap-state.yaml or
  advance planning automatically.
- Sole prospective Brain audit profile is aios-adaptive-brain-audit-v1 version 1 normalized digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718;
  Stage 1 CONSTRUCT and Stage 2 ADVERSARIAL_AUDIT_AND_RECONCILE address all eight ordered lenses; final
  support notes are kept outside this TASK.
- Runtime FAILURE and immutable evidence own the admitted terminal; BP-2 owns typed pre-AIOS operational
  attribution; terminal attention and Brain Sync carry existing identity/context. No additional lifecycle
  authority is authorized.
- RUN-352-002 is a separate immutable TASK-352 r2 VERIFICATION FAILURE whose local public FAILURE
  transport is blocked by the existing _public_command validator rejecting a quoted pytest -k selector;
  its canonical remote FAILURE transport and subsequent REPAIR remain separate lifecycle operations.
  TASK-351 may test that lawful bounded quoted pytest selectors are projected safely without loosening
  privacy checks or editing RUN-352-002, TASK-352, or its failed source.
- The GitHub repository and its workflow/public artifact channels must not be assumed private. Authenticated
  local Executor access and portable safe Brain context differ from public raw log disclosure.
- RUN-350-001 local FAILURE/dispatch record and 23 uncommitted changes remain untouched; TASK-351 cannot
  retroactively make a dirty candidate repairable or declare RESULT/PASS.
- Human explicitly selected Codex gpt-6.1-sol reasoning effort max for TASK-351. Executor admission
  remains Runtime-owned and no profile is inherited from TASK-350 by inference.
