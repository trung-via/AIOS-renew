task_id: TASK-385
revision: 1
goal: 'Deliver exactly Lean VP L2-02: a bounded, explicitly invoked, Runtime-owned
  read-only source-to-exact-target proof applicability contract and observation, consuming
  independently authenticated L2-01 original EVIDENCE provenance and eligible reviewed
  semantic obligation/mapping authority. Produce immutable dimension-by-dimension
  authenticated applicability judgments VALID, INVALIDATED or UNKNOWN without creating
  a new proof, discharging target acceptance, deciding reuse, scheduling verification,
  authorizing continuation, or activating KA-01.'
problem: TASK-384 L2-01 authenticates historical original source subject/raw/provenance
  and preserves missing evidence dimensions, but cannot establish whether that proof
  remains applicable to another exact RUN/candidate/obligation. The prospective KA-01
  C.5 requires independent source-to-target binding and complete condition/dependency
  witnesses; matching hashes, filenames, nodeids, commands, disjoint diffs, inherited
  labels or copied declarations do not establish applicability. Without bounded Runtime
  observation, L2-03/L3 could incorrectly reuse stale, incomplete or semantically
  mismatched proof. This TASK creates only the fail-closed L2-02 decision seam, not
  proof reuse.
