non_goals:
- No L2-03 evidence reuse/target obligation discharge or correction conformance; no
  L3 checkpoint/scheduler/feedback/stop implementation, L4 measurement, G3/G6 safety
  claim or KA-01 production activation.
- No general dependency oracle, generic semantic mapping validator or mapping selector,
  new Reviewer/Publisher, Planner, Executor picker, retry/failover authority, approval
  broker/issuer/registry/DB, second Runtime/verification scheduler or evidence storage
  authority.
- No automatic invocation in V1/V2 execution, task admission, correction workflow,
  Reviewer or Publisher; no new RUN, checkpoint, EVIDENCE, RESULT, REVIEW, REPAIR,
  REMEDIATION, permission or consent token from read-only observation.
- No rehash/rewrite/republish historical EVIDENCE, synthetic PASS, target subject
  relabeling, default VALID on UNKNOWN, file-diff/nodeid-only preservation inference
  or input-provided trust roots/authentication claims.
- No change to frozen Kernel or current V1/V2 schema/parser/verification selection,
  no new verification commands or full-suite ceremony, no roadmap mutation or downstream
  pin change.
constraints:
  hard:
  - Implement one bounded, deterministic, closed-schema, immutable typed L2-02 applicability
    request/observation/witness projection using existing verification_contract.py
    and explicit Runtime-owned read-only verification.py APIs; preserve source L2-01
    contract and all historical evidence formats. Structural parsing/serialization
    and caller-provided digests grant no source authority.
  - Authenticate source by the existing exact L2-01 Runtime observation and immutable
    original TASK/RUN/source candidate/tree/artifacts/EVIDENCE/subject/outcome/raw
    identity/digest. Bind an independently authenticated exact target admitted RUN
    or bounded canonical target locator, committed candidate/tree/lineage and referenced
    obligation/acceptance and semantic contract/mapping source/review authority. A
    caller's copied expected pins, reported source_provenance, reviewed flag or target
    condition values are not trusted proof.
  - Reuse existing L1 proof-contract/mapping/selection and original review/publication
    readers for exact source bindings where applicable; only use their independently
    authenticated exact subject, never treat TASK-381's historical approved mapping
    as generic authority for another TASK. If required reviewed mapping, current source
    or target authority cannot be established, outcome UNKNOWN/BLOCK, no fallback.
  - For each KA-01 C.5 relevant dimension, require immutable independently observed
    source and target footprint/condition evidence, or a separately authenticated
    reviewed semantic declaration of inapplicability bound to exact obligation and
    dimension. Cover code/subject dependencies, test code/population, fixtures/setup/teardown/helpers/shared/generated
    state, interpreter/toolchain/observer, environment/configuration, policy/execution
    profile, worker mode/count/state, concurrency/interference, ordering/repetition,
    collection/completeness/stability/phase outcomes, unit/integration/external boundaries
    and EVIDENCE kind/schema. A hash/diff/path/label similarity or a caller-asserted
    witness never substitutes for full relevant conditions.
  - Produce one stable immutable source-to-target witness binding unchanged original
    subject/RUN/raw/evidence digests and exact target identities/mapping/acceptance
    conditions; per-dimension status/reason/source must be inspection-readable. Return
    VALID only with complete authenticated affirmative/equivalent/inapplicable coverage;
    INVALIDATED only for established relevant divergence after basic identities remain
    authenticated; otherwise UNKNOWN/NOT_ESTABLISHED, never optimistic default. A
    known invalidating change may remain INVALIDATED when unrelated dimensions are
    missing, but disputed source/target authority always blocks with UNKNOWN.
  - Preserve source actual outcome PASS/FAIL/ERROR/UNKNOWN independently from applicability.
    VALID of original FAIL/ERROR is still failed/error proof, never satisfactory acceptance.
    No applicability object may itself discharge an obligation, claim target tests
    ran or assert permission for Runtime/Executor continuation; L2-03 must independently
    decide reuse under approved semantics.
  - Keep all observation operations bounded and read-only, no fetching or writing
    Git objects/refs/state, no running tests, no secondary proof collection, source
    mutation, policy/executor selection or canonical publication. Use current source/ref/currentness
    checks and immutable bindings before result. Missing private raw, stale refs,
    unsupported witness provider or unavailable target footprint must fail closed
    and report precise non-secret reason.
  - Use isolated authentic Git object and original Runtime EVIDENCE fixtures for focused
    positive fully witnessed applicability and adversarial tests; do not mock authority.
    Challenge swapped RUN/EVIDENCE/target SHA, unauthorized/unreviewed mapping, changed
    test/helper/fixture/shared/generated state, changed environment/toolchain/policy/workers/collection/integration,
    omitted dimension, fraudulent inapplicability, stale observation, source FAIL
    preserving FAIL, incomplete V1/unstable V2 and concurrent race. Do not manufacture
    production PASS from fixture results.
  - Preserve existing V1/V2 execution and L1/L2-01 read contracts, same public EVIDENCE/RESULT/REVIEW/transport
    shapes, historical Decoder and Runtime/Reviewer/Publisher boundaries. No new persistent
    authority, external trust service or creation of an independent execution/verification
    policy. Scope is limited to four explicit paths.
  - Document exact source/target identities, reviewed mapping input, dimension-by-dimension
    witness/currentness method, authentic evidence versus structural assertions, VALID/INVALIDATED/UNKNOWN
    precedence, historical missingness, fallback/STOP boundary and L2-03 consumer
    obligations; explicitly label real production proof and G3/G6/L4 as outstanding.
acceptance:
- id: AC1
  condition: An immutable bounded versioned typed L2-02 request, source-to-target
    applicability witness and deterministic strict closed-schema projection/parse
    are implemented in the existing verification contract; no new lifecycle/evidence
    issuance or mutable caller authority is introduced.
- id: AC2
  condition: Explicit Runtime read-only entrypoint independently authenticates one
    exact original L2-01 source and preserves immutable RUN/EVIDENCE/source subject/outcome/raw
    identity/digests, rejecting caller-provided parsed proof, copied raw-path or unsupported
    source as authentication.
- id: AC3
  condition: The observer independently binds the target's exact admitted RUN, committed
    candidate/tree/lineage and trusted currentness, plus contract/mapping/obligation/acceptance
    pins against existing independently reviewed semantic selection; wrong/unreviewed/replayed/cross-TASK
    selectors cannot yield VALID.
- id: AC4
  condition: 'Every KA-01 C.5 distinguishing proof dependency has an explicit ordered
    observed/equivalent/changed/UNKNOWN or authenticated-inapplicable judgment with
    source, target, reason and evidence identity: implementation/test/population/fixtures/helpers/shared/generated
    state; toolchain/interpreter/observer/environment/config; policy/profile/workers/state;
    concurrency/order/repetition/collection/completeness/outcomes; integration/external;
    evidence kind/schema.'
- id: AC5
  condition: 'Validity reduction is deterministic and fail-closed: VALID requires
    exact authenticated current source/target/mapping plus complete relevant affirmative
    or independently authorized inapplicability witnesses, INVALIDATED requires proved
    material divergence, and missing/conflicting authority or partial provenance produces
    UNKNOWN/NOT_ESTABLISHED. SHA/command/nodeid/name/disjoint diff alone never grants
    VALID.'
- id: AC6
  condition: The immutable output preserves original source outcome including FAIL/ERROR/UNKNOWN
    and original subject/raw digest; a VALID-but-failed or incomplete proof never
    becomes satisfactory PASS, and a source proof cannot be relabeled as executed
    on the target.
- id: AC7
  condition: No applicability read or formatter runs verification, selects coverage/mapping,
    discharges an obligation, changes Runtime/policy/Git/lifecycle state, selects
    an Executor or dispatches L2-03/L3; missing or unknown conditions do not authorize
    automatic fresh proof, retry or continuation.
- id: AC8
  condition: Focused positive and negative tests use real immutable Git and Runtime-origin
    fixtures, demonstrating a genuinely fully authenticated VALID case and fail-closed
    changed/INVALIDATED and absent/UNKNOWN cases for each relevant condition family,
    altered/unreviewed contract or target lineage, spoofed inapplicability, source
    FAIL and stale/racy source changes.
- id: AC9
  condition: Current L1 reviewed-selection/source and L2-01 original observer APIs,
    historical minimal V1 and available V2 interpretation, existing verification execution,
    public EVIDENCE/ResultPackage and independent Reviewer/Publisher contracts remain
    behaviorally and structurally unchanged; no new target proof authority is implied.
- id: AC10
  condition: One L2-02 document defines identities/authority, every C.5 dimension
    and its explicit UNKNOWN/inapplicable semantics, precedence of VALID/INVALIDATED/UNKNOWN,
    exact L2-03 consumer preconditions and false-positive threats; G3/G6/L3/L4 and
    measured benefit are clearly outstanding.
- id: AC11
  condition: Cumulative committed implementation changes stay within the four listed
    modify paths, with no generic router/DB/broker/second scheduler, expanded Human
    approval, retrospective state rewrite, roadmap advancement or downstream adoption.
