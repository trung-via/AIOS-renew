- "Human's current explicit '\u0110\xE3 publish, ti\u1EBFp t\u1EE5c' follows this\
  \ exact published L2-01 and the Human-approved prospective 16-slot Lean VP plan\
  \ in GitHub Issue #2168: L2-02 is next, then L2-03. Issue #2168 is a planning carrier,\
