- Fresh canonical authoring main is ccaff05958bd138f7059aa48a80849c1e7efc0ca, which
  equals reviewed/published TASK-384 r1 RUN-384-004 candidate; REVIEW-384-001 PRIMARY
  PASS all AC1-AC10 at review-decision SHA d744ed1edf9cf1878f90e281fab81f3fa9caa9fd;
  artifacts RUN-384-004 SHA cae6bf623b2f79a1cdd90d314060fde58bf23155. Review/RESULT/Publisher
  exact sources remain independently checked by Runtime; their copied identities are
