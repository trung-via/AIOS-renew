goal: Prospectively retire superseded TASK-417 CAA pilot-only execution surfaces,
  source-level callback/ten-TASK cohort gates and historical experimental launch-as-a-prerequisite
  path, retaining exactly one default CAA-03 consultation path for the supported Python
  Brain and one ChatGPT cognitive-adapter path that reads canonical evidence. Preserve
  CAA-01/02/03 intelligence, optional independent CAA-04 capability, historical artifacts,
  Brain's final judgment and all existing AIOS authority boundaries. Make live-vs-Python
  execution distinctions unambiguous and stop claiming a GitHub-only authoring request
