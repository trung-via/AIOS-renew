problem: The Human wants CAA actively used in AIOS Brain work, not a nominal TASK-419
  implementation. TASK-419 r2 placed CAA consult in src/aios_renew/brain_provider.py
  attempt() but the actual ChatGPT Brain authoring route can call GitHub directly
  and never invokes that Python function. Separately, legacy TASK-417 pilot-only functions
  (_consult_pilot, pilot_report, pilot profile and history-cohort controls) remain
  in caa_integration.py/brain_context.py although TASK-419 prospectively superseded
  them. This causes confusion and redundant paths. A private ChatGPT CAA cognitive
  workflow plugin was created, but is not a verified remote execution of caa_reasoner.consult;
  connector or ChatGPT skill use must not be called Python provider evidence.
assumptions:
- At authoring source main is 42f4620b6cae9e7a857cb92a5b9595d7af4ff94c; verify TASK-419
  r2 source and exact current TASK-421 if concurrently active before mutation. Human's
  explicit latest priority is retire useless CAA paths; this request is a distinct
