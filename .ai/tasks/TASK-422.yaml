constraints:
  hard:
  - 'Retire only code genuinely obsolete for current CAA normal entry: pilot-only
    cohort / report / profile-reservation / duplicate consultation route. Prove before
    deletion or de-export that a retained production caller or optional CAA04 does
    not depend on the removed surface; if exact history requires it, keep isolated
    read-only archival decoding but never select it for new decisions.'
  - 'Keep one active Python path: normal first-party Brain attempt automatically consults
    CAA in four flows before semantic decision, without per-use enable flag, TASK-417
    eligibility, pilot callback or fresh redundant provider gate; advisory absent
    remains nonblocking but genuine mandatory canonical source/subject failure remains
    fail-closed.'
  - 'Recognize distinct ChatGPT host boundary in canonical docs: connected GitHub
    plus ChatGPT CAA skill/advisory is a model-side cognitive path and is not proof
    of native Python consult. It may inform the Brain before authoring, but GitHub
    AUTHOR_TASK alone cannot be asserted to have consumed CAA. Do not introduce project-local
    user prompts as a false automatic hook.'
  - Retire TASK-417's old future rollout requirements from prospective documentation,
    preserve the immutable record and optional independent CAA-04 evaluator as an
    opt-in research path. No default 10-TASK cohort, shadow, holdout, quality threshold,
    preregistration or secondary human activation to use ordinary CAA.
  - Record current Human retirement priority as a prospective CAA planning-policy
    delta without falsely marking TASK-421, TASK-419 or RUN as completed, without
    making a second active roadmap NEXT or rewriting earlier roadmap history. Existing
    publication cannot auto-advance planning.
  - Only minimal compatible source/test edits, with source-linked evidence of current
    caller and targeted run; no Executor-authored semantic decision, source policy
    change outside scope, or claims of live ChatGPT provider invocation.
  - If the exact Python backend invocation inside native ChatGPT remains unintegrated,
    return a precise UNINTEGRATED_HOST boundary; never repair the honesty gap by fabricating
    CAA provider calls or adding an unused plugin invocation checklist.
