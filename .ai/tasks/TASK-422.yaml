task_id: TASK-422
revision: 2
goal: 'Correct TASK-422 r1 before execution: make the existing four canonical Flow
  Cards the operative CAA-03 advisory binding for ARCHITECTURE, TASK_AUTHORING, REPAIR_AUTHORING
  and REMEDIATION_AUTHORING. The supported first-party Brain path must consume the
  authenticated selected card and invoke the unchanged CAA-01/02/03 advisor before
  final Brain semantic choice, without separate per-consult activation or extra route.
  In the same implementation retire superseded TASK-417 ten-TASK pilot-only APIs/gates
  and displace the private ChatGPT plugin from any asserted default path. Preserve
  CAA-04 as an optional independent evaluator, historical lineage and Runtime/Reviewer/Publisher
  separation.'
problem: 'Human identified the actual architectural failure from TASK-419 r2: .ai/flow-cards.yaml
  has no CAA stage; brain_context.load_flow_cards accepts a strictly closed ten-field
  schema and fails on unrecognized fields, while brain_provider.attempt currently
  independently hardcodes a four-flow CAA invocation. Adding a private ChatGPT plugin
  created an unnecessary separate cognitive route with no verified automatic attachment
  to this ChatGPT session and no verified Python CAA call. TASK-422 r1 was just canonicalized
  but had not been observed to create a RUN; it repeats the plugin path and does not
  modify Flow Cards. The new Human priority is to revise this existing TASK rather
  than create yet another task or independent activation layer.'
assumptions:
- At revision authoring main is f130c31cba80d4d242bebe5f2a56b8aa5d448f23; Runtime
  independently verifies exact current TASK-422 r1, version/affinity and no incompatible
  admitted RUN or correction before revision admission. Search of available RUN-422
  issues/branches found none, which is not a substitute for Runtime checks.
- Human expressly approves replacing TASK-422 r1's ChatGPT-plugin-centered default
  path with the existing canonical Flow Card route and retiring redundant legacy CAA
  launch gates. TASK-421 r1 Personal-First remains separately admitted; its execution/review/publication
  are not inferred or overwritten.
- Flow Card is deterministic declarative cognitive support, not an independently executing
  ChatGPT extension or lifecycle router. Merely recording CAA in YAML is NOT acceptance;
  a supported Brain consumer must read the new field and actually use it. An unconnected
  ChatGPT plugin and ordinary GitHub AUTHOR_TASK issue cannot prove this.
- Current CAA-02 A1/B1, evidence/causality checks, no-advice and full-history reader
  remain as TASK-419 r2 source. Retained CAA-04 evaluation is optional and must not
  gate everyday CAA activation.
- Canonical source immutability, Human/Brain/Executor/Runtime/Reviewer/Publisher separation
  and minimum-sufficient-v1 policy remain in force.
