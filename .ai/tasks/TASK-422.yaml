  of existing Python CAA, cannot issue engineering truth, and may require user installation.
  No project code can force ChatGPT product host to run Python automatically.
- CAA-04 evaluation is a separate Human-selected optional capability, not a general
  preactivation requirement; preserving its exact evaluator's own source/label integrity
  is not retaining a normal authoring gate.
- This TASK authoring grants no new Runtime, Publisher, Reviewer, execution profile
  or automatic dispatch authority; Runtime must reauthenticate source/main/identity
  and actual path usage.
