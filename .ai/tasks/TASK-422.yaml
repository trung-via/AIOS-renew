non_goals:
- No new flow id, eighth Flow Card, lifecycle router, scheduler, planner, persisted
  semantic state, second provider selector, model billing authority, HTTP service
  or parallel ChatGPT authoring ingress.
- No promise that a repository YAML file, model prompt, unconnected plugin or GitHub
  Issue can by itself force the ChatGPT product host to load or run Python. No false
  live CAA provider-call/ChatGPT host claims.
- No change to CAA-02 A1/B1 algorithms, selected history evidence grammar, no-advice
  behavior, optional CAA-04 evaluation internals, original immutable TASK-417/419/421
  lineages, frozen Kernel or downstream pin.
- No full suite, pilot cohort, shadow, holdout, quality threshold, separate activation
  task or mandatory success metric before ordinary CAA use.
constraints:
  hard:
  - Keep seven existing Flow Card ids, exact owners, decision-family refs, handoff
    targets, invalidation rules, required/forbidden context and FlowResolver semantics.
    Add the smallest bounded, closed, non-executable CAA advisory declaration to ONLY
    the four Brain-owned supported cards. Other three cards must not acquire CAA.
    Schema must reject mismatched/extra/malicious card declarations, not blindly trust
    YAML.
  - Do not stop at a descriptive card annotation. Wire the existing first-party Flow
    Resolution/Decision Packet/Brain attempt consumer, using source-bound selected
    Flow Card evidence to trigger exactly one existing CAA-03 optional consultation
    at the already composed subject/draft boundary before final Brain decision; no
    second independent hardcoded four-flow selector inconsistent with card. Executor
    owns the minimal technical HOW within scope.
  - The exact original source/main, subject, candidate, correction/packet and post-call
    freshness checks still hold. CAA absent/unavailable/no-material-advice cannot
    block ordinary direct authoring; genuine canonical identity/currentness errors
    remain fail-closed. Brain may accept/adapt/reject and owns semantic choice; CAA
    never supplies Runtime ingress authorization.
  - Make the canonical Flow Card the default cognitive policy reference for ChatGPT
    Brain as well, with clear source-linked contract prose explaining that a chat
    host only consumes it when its actual Brain Sync/caller has read it. If native
    ChatGPT cannot invoke repository Python directly, report HOST_UNINTEGRATED; do
    not present an installed private skill, successful GitHub dispatch or card text
    as verified Python calls or automatic host integration.
  - Remove or isolate prospective TASK-417 pilot cohort/profile/reserve/ten-TASK report
    and duplicate callback surfaces after tracing callers including CAA-04. Preserve
    immutable historical decoding where necessary and all canonical historical records.
    Private plugin is not a required/default step for current AIOS Brain decisions.
  - Record this latest explicit Human priority by minimal prospective roadmap/contract
    change without competing NEXT or automatic roadmap advancement; don't alter TASK-421's
    live/unknown execution status.
  - Use focused positive and adversarial tests only; no full suite. AC claims refer
    to completed implementation properties, not later Runtime RESULT, independent
    REVIEW or publication truth.
acceptance:
- id: AC1
  condition: All four supported canonical Brain Flow Cards declare exactly one CAA-03
    advisory stage/binding before semantic decision, with the remaining three cards
    unchanged and no eighth Flow Card; closed parser rejects forged/missing/extra/incorrect
    advisory declarations.
- id: AC2
  condition: The actual first-party selected Flow Card is consumed by the Brain decision
    path to initiate the existing CAA consultation in each of four flows before final
    choice, with no competing hardcoded selector or pilot/opt-in route; a focused
    test observes card-derived invocation and source/subject binding.
- id: AC3
  condition: Optional CAA no-advice/provider-unavailable does not impede valid direct
    Brain decisions, while stale/forged source, wrong card-flow, substituted candidate
    and mismatched correction fail appropriately before unsafe authoring or provider
    call.
- id: AC4
  condition: Obsolete TASK-417 pilot-only cohort, report/profile gate and duplicate
    code paths are retired from active public use or strictly isolated for historical
    decoding; optional CAA-04 evaluator remains usable and no old pilot/evaluation
    gate applies to normal CAA.
- id: AC5
  condition: The project CAA contract/roadmap explicitly names canonical Flow Cards
    as the normal CAA binding, retires the private plugin from the default path, and
    distinguishes demonstrably executed Python provider calls from unintegrated ChatGPT
    host behavior; no fake automatic ChatGPT-native activation claim.
- id: AC6
  condition: Existing TASK-417/419/421 and TASK-422 r1 remain immutable history, one
    prospective revised TASK-422 r2 holds the new Human intent, no new runtime/router/authoring
    authority arises, and focused only flow-card/CAA/provider regression remains compatible.
