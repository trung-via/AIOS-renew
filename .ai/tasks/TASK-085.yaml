non_goals:
  - Author, edit, infer, choose, synthesize, or repair a REVIEW, finding, REMEDIATION,
    REPAIR contract, TASK, or acceptance criterion. This is execution/admission preflight,
    not Brain TASK/correction authoring preflight or semantic review.
  - Implement Unified State + Next Action, unified `$aios run/fix/repair/status` grammar,
    executor recommendation, automatic executor selection, downstream Human-facing worker
    migration, or roadmap-state automatic advancement.
  - Create a RUN, lease, handoff, RESULT, EVIDENCE, FAILURE, ADMISSION_FAILURE, approval,
    correction-dispatch record, repair record, continuation reservation, or any new
    canonical/operational artifact solely because preflight was requested.
  - Invoke Codex, Antigravity, another coding Executor, canonical verification,
    completion, transport, semantic review, remediation/repair execution, publication, or
    recovery from preflight.
  - Turn READY into durable authorization or skip/reduce real admission checks when the
    later execution command is invoked. No cached preflight ticket or trust-on-first-check
    behavior is introduced.
  - Retry Git/remote operations, fall back to local refs, switch remotes, reroute, poll,
    back off, repair missing lineage, clean repository state, auto-sync correction paths,
    steal/release execution leases, or create alternate historical subjects to make a
    blocked correction become ready.
  - Change TASK-067 finding identity semantics, TASK-078 historical REMEDIATION semantics,
    TASK-058/TASK-077 historical REPAIR semantics, TASK-064/TASK-075/TASK-076
    NO_CHANGE/CODE_FIX semantics, Runtime completion gates, changed_files authority,
    verification ownership, Reviewer authority, or safe publication behavior.
  - Change A3 approval or A6 correction-delivery workflows/dispatch semantics, add a new
    remote workflow, scheduler, daemon, queue, database, Planner, Router, autonomous
    Reviewer, or additional model call.
  - Modify `.ai/roadmap-state.yaml` in the implementation candidate. The Human/Brain will
    advance planning state only after exact TASK-085 PASS publication is established.
  - Modify any downstream repository or dependency pin.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Provide explicit non-executing preflight coverage for both current canonical
      correction families: REMEDIATION selected by exact TASK + finding identity and
      REPAIR selected by exact failed RUN + canonical repair contract. The Human-facing
      operator exposure must keep the two correction families explicit rather than add a
      generic arbitrary-operation router.
    - >
      Preflight readiness must be derived from the same deterministic lineage/admission
      boundaries used by actual REMEDIATION and REPAIR execution, or from shared helpers
      factored from those boundaries. Do not implement a parallel approximate validator
      whose READY result can disagree merely because execution uses a different identity,
      lineage, or repository-admission rule.
    - >
      A REMEDIATION preflight must preserve existing authoritative resolution of exact
      TASK id/revision, source RUN, authoritative RESULT, REVIEW, finding, REMEDIATION,
      reviewed_sha, action, modification_scope, affected_verification, and relevant remote
      RUN namespace/conflict state. It must determine the same current-head versus
      historical-subject mode required by TASK-078 and fail closed on the same relevant
      missing, malformed, ambiguous, stale, conflicting, or unavailable historical-source
      conditions that are knowable before RUN creation.
    - >
      A REPAIR preflight must preserve exact failed RUN/TASK revision, FAILURE,
      failed_head_sha, root/historical repair lineage, canonical REPAIR contract, remote
      snapshot and duplicate-continuation semantics, current-control versus historical
      subject requirements, and operation-specific reusable-state admission. Genuine
      NO_CHANGE reuse may perform only the reuse-specific pre-execution validation already
      authorized by TASK-064/TASK-076; CODE_FIX must continue to bypass reuse-only
      candidate equality/completeness checks under TASK-075 and proceed through ordinary
      Executor-backed REPAIR when execution is later requested.
    - >
      Preflight must preserve exact historical subject authority. It must never reset,
      checkout, rebase, merge, cherry-pick, amend, stash, fast-forward, pin-migrate, or
      otherwise mutate the current control worktree to make a historical correction
      appear ready. If disposable historical-subject setup is required to prove admission
      feasibility, it must remain Runtime-owned, bounded, cleanly disposable, and unable
      to modify canonical/control state or mask the preflight outcome.
    - >
      Repository/control checks must remain fail closed and compatible with existing
      correction admission: valid Git repository, clean/unchanged control state where
      required, immutable SHA/TASK availability, canonical remote identity, RUN namespace
      conflicts, and continuation eligibility must not be weakened merely to return READY.
      Correction paths must not inherit PRIMARY-only auto-sync from TASK-062.
    - >
      READY means only that every deterministic prerequisite currently knowable before RUN
      allocation and Executor invocation passed against the exact observed state. It does
      not predict Executor success, future repository/remote stability, candidate
      correctness, completion gates, verification PASS, semantic review, or publication.
      Actual execution remains authoritative and must revalidate admission normally.
    - >
      Preflight itself must create zero RUNs and invoke zero coding Executors. It must run
      zero canonical verification commands, persist zero RESULT/FAILURE/EVIDENCE or
      Admission Failure v2 records, reserve zero continuation identities, and perform zero
      correction/publication/recovery actions. A blocked observation is read-only
      operational information, not an execution attempt or canonical failure category.
    - >
      Expose one bounded versioned programmatic preflight result shape suitable for the
      later Unified State + Next Action task. At minimum it must identify correction
      family, READY/BLOCKED status, exact already-resolved task/revision and source or
      failed RUN identities when known, relevant reviewed_sha or failed_head_sha when
      known, current-versus-historical subject mode when known, and a deterministic
      bounded phase/reason code for BLOCKED. It must explicitly report that no RUN and no
      Executor were created/invoked.
    - >
      Preflight phase/reason classification must come from deterministic admission
      boundaries, not from parsing arbitrary final error prose. Output must be allowlisted
      and bounded: no raw model text, source content, prompts, credentials, environment
      dumps, unrestricted Git stderr/stdout, stack traces, verification logs, or arbitrary
      filesystem paths.
    - >
      The implementation may reuse Admission Failure v2 bounded reason/provenance helpers
      where appropriate, but preflight output must remain a distinct observation kind and
      must never be published under `aios/admission-failure/*` or interpreted as historical
      evidence that an execution attempt occurred.
    - >
      Existing `aios remediate`, `aios repair`, A6 approved-remediation wakeup, direct
      candidate acceptance, PRIMARY, recover-primary, Runtime completion, canonical
      verification, failure transport, semantic DELTA review, and publication behavior
      must remain unchanged except for strictly shared deterministic admission helpers
      proven equivalent by regression. No preflight call may become an implicit prerequisite
      that Humans must run before the existing execution commands.
    - >
      All candidate/completion safeguards after Executor output remain untouched: exact
      ancestry/HEAD/clean-worktree rules, REMEDIATION/TASK scope bounds, REPAIR exact
      failed-head continuity, canonical changed_files authority, required affected or TASK
      verification, RESULT/EVIDENCE construction, and review/publication boundaries. The
      existence of preflight must not convert any post-RUN failure into preflight BLOCKED.
    - >
      README must document Correction Preflight as optional read-only readiness inspection,
      distinguish it from Admission Failure v2 and from actual REMEDIATION/REPAIR execution,
      state that READY is non-authoritative for later execution, and state that it does not
      author corrections, choose Executors, execute, verify, retry, or advance roadmap state.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic current-head REMEDIATION regression proves preflight resolves the
      exact TASK/revision + source RUN + RESULT + CHANGES_REQUIRED REVIEW + finding +
      REMEDIATION + reviewed_sha contract, returns READY with current-subject mode, and
      creates no RUN, Admission Failure, Executor invocation, verification evidence, or
      repository mutation.
  - id: AC2
    condition: >
      A deterministic historical REMEDIATION regression proves preflight preserves
      TASK-078 exact reviewed historical subject identity while leaving the current control
      HEAD/index/worktree unchanged, and a separate malformed/missing/ambiguous/stale or
      unavailable relevant lineage case returns bounded BLOCKED before any execution-side
      state is created.
  - id: AC3
    condition: >
      Deterministic REPAIR regressions cover current-head and historical failed candidates:
      exact failed RUN/TASK/FAILURE/repair/failed_head/root-lineage and duplicate-
      continuation state are resolved under existing semantics, valid state returns READY,
      and missing/conflicting/duplicate/unavailable historical state returns bounded
      BLOCKED with zero RUN/Executor/verification side effects.
  - id: AC4
    condition: >
      Action-order regressions preserve TASK-064/TASK-075/TASK-076 semantics: eligible
      NO_CHANGE preflight applies the existing reusable-candidate validation, malformed
      reusable state fails closed when that reuse is actually requested, and CODE_FIX
      bypasses reuse-only candidate equality/completeness checks rather than being blocked
      by them.
  - id: AC5
    condition: >
      The preflight result is versioned, bounded, deterministic, machine-consumable, and
      exposes only already-known allowlisted identity/readiness facts plus deterministic
      phase/reason classification; equivalent observed state yields equivalent semantic
      output, and no error-string parsing, secrets, raw logs, source payloads, or arbitrary
      paths are exposed.
  - id: AC6
    condition: >
      Preflight is observational only: success and failure cases create no canonical RUN,
      lease, RESULT, FAILURE, EVIDENCE, ADMISSION_FAILURE, repair/remediation/correction-
      dispatch state or remote transport, invoke no coding Executor, run no canonical
      verification, and do not mutate current control repository state.
  - id: AC7
    condition: >
      Existing direct REMEDIATION and REPAIR execution regressions still admit/reject the
      same canonical lineages and preserve exactly-one selected Executor invocation,
      historical subject continuity, completion/changed-files/verification gates, failure
      taxonomy, RESULT/EVIDENCE, and review transport. A prior READY observation grants no
      bypass when state changes before actual execution.
  - id: AC8
    condition: >
      Existing A3/A6 correction delivery, PRIMARY, direct-candidate, recover-primary,
      review, and safe-publication behavior remain unchanged; implementation adds no
      router, executor recommendation, retry/fallback/reroute, correction authoring,
      automatic next-action selection, downstream migration, or roadmap-state mutation.
  - id: AC9
    condition: >
      README documents the optional Correction Preflight boundary and focused Operator/A6
      regressions plus `git diff --check` pass on the final candidate.

verification:
  required:
    - python -m pytest tests/test_operator.py tests/test_remediation_wakeup.py tests/test_correction_dispatch.py -q
    - git diff --check
