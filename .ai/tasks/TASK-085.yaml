task_id: TASK-085
revision: 1

goal: >
  Implement Correction Preflight as one deterministic, non-executing admission-readiness
  boundary for the existing canonical REMEDIATION and REPAIR paths. Before a Human or
  outer automation asks AIOS to execute an already-authored correction, allow AIOS to
  resolve and validate the exact immutable correction lineage, repository/control state,
  current-head versus historical-subject requirements, canonical continuation conflicts,
  and operation-specific reusable-state prerequisites that are knowable before RUN
  creation. Return a bounded machine-readable READY/BLOCKED observation that later
  Unified State + Next Action work can consume, while creating no RUN, invoking no
  Executor, running no canonical verification, authoring no correction, and acquiring no
  new semantic or recovery authority. Preserve the actual REMEDIATION/REPAIR execution
  paths as final admission authority and keep their exact historical lineage, completion,
  verification, failure, review, and publication semantics unchanged.

problem: >
  Admission Failure v2 now records why an execution-capable operation was rejected before
  RUN creation, but the Human still commonly learns that a correction is not admissible
  only after invoking FIX/REMEDIATION or REPAIR. Historical incidents have included
  missing or malformed canonical lineage, stale or ambiguous remediation refs, dirty or
  conflicting control state, unavailable historical subjects, wrong reviewed/failed SHA,
  duplicate continuation state, and malformed reusable-candidate state. Those failures are
  correctly fail-closed, yet they consume Human handoffs and produce avoidable failed
  attempts that could have been identified by the same deterministic admission logic
  before execution was requested. The next Control-plane Closure step therefore needs a
  read-only correction readiness boundary. It must not become a Brain authoring preflight,
  semantic Reviewer, recovery planner, executor router, or cached authorization that can
  bypass real admission. Its purpose is only to answer whether one exact existing
  correction is presently ready to enter the unchanged canonical execution path and, if
  not, expose the first deterministic bounded blocker without creating execution state.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-085 authoring is
    4181f2b4ad2d813148b79fb94a90a652f89a8001, the semantically reviewed PASS and
    published TASK-083 revision-2 candidate.
  - >
    REVIEW-083-001 is canonical PRIMARY PASS for RUN-083-001 and current main contains
    `.ai/roadmap-state.yaml` version 1 with `control-plane-closure` as the active track and
    `correction-preflight` as its unique NEXT item. TASK-085 implements that item but does
    not itself advance the roadmap bookmark; roadmap advancement remains Human/Brain
    planning authority after canonical PASS publication.
  - >
    TASK-081 remains authoritative for Admission Failure v2 and the exact distinction
    between pre-RUN ADMISSION_FAILURE, admitted RUN FAILURE, and semantic
    CHANGES_REQUIRED. A read-only preflight observation is none of those categories and
    must not be persisted or transported as an admission failure merely because readiness
    is BLOCKED.
  - >
    TASK-067 remains authoritative for exact TASK/revision-scoped remote `--finding`
    remediation resolution, and TASK-078 remains authoritative for current-head versus
    historical-subject REMEDIATION execution. Correction Preflight observes those same
    identities and admission prerequisites without redefining finding or remediation
    semantics.
  - >
    TASK-058 revision 2 and TASK-077 remain authoritative for historical REPAIR recovery,
    immutable failed-head/root lineage, remote snapshot semantics, duplicate continuation
    rejection, and isolated subject handling. TASK-064/TASK-075/TASK-076 remain
    authoritative for verification-only NO_CHANGE reuse, CODE_FIX bypass of reuse-only
    validation, and like-for-like reusable-candidate changed-files semantics.
  - >
    TASK-074 A3 approval and TASK-084 integrated A6 approved-remediation wakeup remain
    operational outer-automation layers around the existing remediation path. TASK-085
    must not change approval, correction-dispatch identity, at-most-once delivery, or
    remote workflow behavior.
  - >
    Existing correction execution must still revalidate admission when execution is
    actually requested because repository/remote state may change after a preflight.
    A prior READY observation is informative operational state only and is never a lease,
    reservation, authorization, cache key, or proof that later execution must be admitted.

