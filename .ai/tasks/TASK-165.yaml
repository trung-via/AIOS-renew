task_id: TASK-165
revision: 1

goal: >
  Restore deterministic zero-touch Brain-to-self-host delivery for profile-managed
  PRIMARY, REMEDIATION, and coding REPAIR authorizations by binding GitHub-hosted
  carrier execution-profile resolution to the single repository-owned profile
  policy from the exact canonical carrier source used by that invocation.
  Resolution must be independent of installed-package location and process working
  directory, must occur exactly once before downstream dispatch, and must preserve
  the existing self-host, Runtime, durable-dispatch, Reviewer, Publisher, and
  no-fallback authority boundaries.

problem: >
  A production-shaped TASK-164 PRIMARY wakeup through GitHub Issue #532 failed
  before self-host dispatch because the hosted carrier imported aios_renew from
  the pip-installed package and implicitly resolved .ai/executor-profiles.yaml
  relative to that installed package rather than the canonical repository
  checkout. Source-tree tests masked the defect because pytest imports through
  pythonpath=src, where package-relative lookup accidentally coincides with the
  repository root. Audit confirms the same implicit profile-policy lookup exists
  in PRIMARY request v3, REMEDIATION intent v2, and coding REPAIR wakeup v2.
  Executor-less REPAIR remains profile-free and is not itself affected.

assumptions:
  - >
    Canonical main at TASK-165 authoring is
    babfe5cb09e34435a3305bad402caef4f281b563.
  - >
    TASK-162 and TASK-163 remain the published authority for one repository-owned
    execution-profile policy, per-new-authorization resolution, exact source
    attribution, durable profile identity, and no automatic fallback or reroute.
  - >
    Issue #532 is a pre-AIOS operational failure: downstream self-host dispatch was
    not accepted, no RUN was created, and no Executor was invoked. TASK-165 is
    therefore new maintenance intent, not REPAIR of an engineering RUN.
  - >
    The current execution-profile core API already supports explicit repository or
    policy binding. This task repairs hosted carrier binding and does not require a
    new default authority or execution-profile architecture.
  - >
    TASK-164 r1 remains canonically authored but blocked until this hosted-carrier
    maintenance is reviewed and published. Historical TASK-163 review and
    publication evidence remain immutable and are not reinterpreted.
  - >
    GitHub-hosted carriers must derive policy authority from repository-owned
    trusted carrier context, never from Human/Issue-controlled path data.

