task_id: TASK-076
revision: 1

goal: >
  Correct verification-only NO_CHANGE reusable-candidate validation after an Executor-backed
  CODE_FIX REPAIR itself reaches canonical Runtime verification and fails. Preserve the two
  distinct changed-files authorities already established by TASK-057: canonical REPAIR
  Result.changed_files remains the complete original TASK delta from preserved root_base_sha
  to the exact candidate subject, while FAILURE candidate.changed_files remains the narrow
  per-RUN correction-relative delta applicable to the failed REPAIR attempt. A later eligible
  NO_CHANGE continuation must validate reusable state against like-for-like canonical
  authority rather than rejecting a valid preserved pre-verification candidate because those
  two intentionally different deltas are not equal. Preserve exact failed-head and historical
  continuation lineage, genuine fail-closed reuse validation, thin worker behavior, and the
  existing no-retry/no-reroute execution model.

problem: >
  Cross-project Python Agent TASK-156 exposed a new Runtime boundary defect after TASK-075.
  TASK-075 correctly restored normal CODE_FIX dispatch: REPAIR-156-002 dispatched Codex and
  produced RUN-156-003. RUN-156-003 then failed only during canonical verification, with the
  candidate clean, repairable, and transportable. Its FAILURE candidate.changed_files records
  only the CODE_FIX correction-relative mutation, tests/integration/test_live_real_evidence_canonical_qa.py,
  while its preserved transported pre-verification ResultPackage records the complete original
  TASK delta required by TASK-057: docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md,
  docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md, and
  tests/integration/test_live_real_evidence_canonical_qa.py. Current NO_CHANGE reuse validation
  still treats equality between these two lists as a reusable-candidate invariant. That
  comparison crosses two different canonical bases and can make an otherwise valid
  verification-only continuation inadmissible. The defect is not that either artifact is
  wrong; it is that reuse validation compares authorities with different semantic origins.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-076 authoring is
    d036324f3f9ab74ca3f217ed22e416313da71695 and contains the semantically reviewed PASS
    implementation of TASK-075.
  - >
    Human explicitly authorizes this as new semantic correction work based on downstream
    evidence from Python Agent TASK-156. It is therefore a new TASK, not a FIX or rewrite of
    TASK-075, TASK-064, or TASK-057 lineage.
  - >
    TASK-057 remains authoritative that successful REPAIR Result.changed_files is Runtime-owned
    repository truth describing the complete original TASK delta from preserved root_base_sha
    to the accepted subject HEAD, independently of the narrow correction delta produced by the
    selected Executor.
  - >
    TASK-057 also remains authoritative that narrow REPAIR mutation safety is checked
    separately from failed_head_sha to the final subject HEAD. The narrow correction delta must
    not be promoted into canonical full-TASK Result.changed_files merely to satisfy reuse
    equality.
  - >
    TASK-064 remains authoritative for zero-Executor verification-only continuation: an
    explicitly authorized NO_CHANGE REPAIR may reuse only an exact trustworthy
    pre-verification candidate from a clean repairable phase-VERIFICATION predecessor and must
    execute canonical TASK verification exactly once.
  - >
    TASK-058 revision 2 remains authoritative for exact failed_head_sha historical REPAIR
    admission, current-control Runtime authority, immutable continuation/root lineage,
    isolated historical subject handling, and no retry/fallback/reroute.
  - >
    TASK-075 remains authoritative that CODE_FIX bypasses reuse-only candidate reading,
    equality, completeness, acceptance-coverage, and other validation whose sole purpose is
    Executor elision, and instead proceeds through the normal exactly-one selected Executor
    REPAIR path when otherwise valid.
  - >
    Python Agent RUN-156-003 provides the observed topology needed for this TASK: a CODE_FIX
    REPAIR candidate can validly preserve a root-relative pre-verification ResultPackage while
    its FAILURE candidate.changed_files is correction-relative to the predecessor failed head.
    No downstream source or immutable downstream artifact is modified by this TASK.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-057.yaml
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-064.yaml
    - .ai/tasks/TASK-069.yaml
    - .ai/tasks/TASK-075.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/review_transport.py
    - tests/test_repair_preverification_eligibility.py
    - tests/test_runtime.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_repair_preverification_eligibility.py

non_goals:
  - Change TASK, RUN, RESULT, EVIDENCE, FAILURE, REVIEW, REMEDIATION, REPAIR, or RUN_OBSERVATION schemas or semantic authority.
  - Change TASK-057 canonical full-TASK Result.changed_files authority or narrow failed-head correction mutation authority.
  - Rewrite FAILURE candidate.changed_files into a root-relative full TASK delta merely to make it equal the preserved ResultPackage.
  - Narrow canonical REPAIR Result.changed_files to only the latest CODE_FIX correction delta.
  - Broaden TASK-064 verification-only NO_CHANGE eligibility or allow reuse for CODE_FIX, PRIMARY, REMEDIATION, non-empty-scope REPAIR, non-VERIFICATION predecessor failures, or any other non-qualifying path.
  - Treat changed-files inequality by itself as proof that reusable state is valid, or disable changed-files validation for genuine reuse.
  - Weaken malformed, conflicting, wrong-RUN, wrong-TASK/revision, wrong-subject, incomplete, wrong-head, scope-invalid, acceptance-incomplete, or otherwise untrustworthy reusable-state rejection.
  - Weaken canonical FAILURE identity, exact failed_head_sha, continuation/root lineage, historical admission, REPAIR authorization, duplicate-continuation, repository, completion, verification, or publication gates.
  - Convert invalid NO_CHANGE reuse state into automatic Executor fallback or CODE_FIX selection.
  - Add retry, fallback, reroute, failover, provider probing, automatic REPAIR authoring, extra verification, or a second Executor invocation.
  - Move changed-files reconciliation, reuse eligibility, historical lineage reconstruction, or retry/reroute decisions into repository-provided Human-facing workers, Codex, Antigravity, adapters, or downstream repositories.
  - Modify dispatcher/model-selection policy, worker scripts, downstream Python Agent source, roadmap capability status, outer automation, or publication behavior.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Genuine verification-only NO_CHANGE reuse validation must compare each changed-files
      representation only against canonical authority with the same semantic base. It must not
      require equality between correction-relative FAILURE candidate.changed_files and
      root-relative preserved Result.changed_files when those values truthfully describe
      different deltas of the same continuation lineage.
    - >
      The preserved reusable pre-verification ResultPackage must continue to satisfy TASK-057
      canonical REPAIR Result.changed_files semantics for the exact reusable subject: the full
      deterministic original TASK delta from preserved root_base_sha to that subject HEAD,
      stable and within TASK.scope.modify. Reuse must fail closed if that root-relative package
      authority is malformed, incomplete, wrong-subject, scope-invalid, or otherwise false.
    - >
      FAILURE candidate.changed_files must retain its existing correction-relative failure
      meaning for the failed RUN and must not be rewritten, normalized, expanded, or otherwise
      repurposed as the full-TASK reusable Result authority. Existing canonical FAILURE and
      correction-lineage validation remains independently fail closed.
    - >
      A valid CODE_FIX verification failure may therefore have a narrow FAILURE correction
      delta and a wider preserved root-relative pre-verification Result delta without making a
      later otherwise eligible NO_CHANGE continuation invalid solely because the two sets are
      unequal.
    - >
      Local-versus-transported copies of the same reusable pre-verification candidate must
      still agree byte-for-byte or according to the existing exact reusable-state identity
      contract. This TASK removes only cross-authority equality; it must not permit conflicting
      copies of the same authority.
    - >
      Present-but-malformed, conflicting, wrong-RUN, wrong-TASK/revision, wrong-subject,
      wrong-head, incomplete, acceptance-incomplete, or otherwise invalid genuine reusable
      state must still fail closed before Executor elision and before canonical verification.
      Runtime must not silently fall back to an Executor when reuse was explicitly requested
      and reuse authority is invalid.
    - >
      Exact failed_head_sha, continuation_of, preserved root_base_sha, historical correction
      lineage, TASK identity/revision, and REPAIR authorization must remain unchanged across
      PRIMARY verification failure, NO_CHANGE verification failure, CODE_FIX dispatch and
      verification failure, and the final NO_CHANGE continuation.
    - >
      TASK-075 ordering remains authoritative: CODE_FIX must not read or depend on unused
      reusable-candidate state before entering the ordinary exactly-one selected Executor
      dispatch path. This TASK must not reintroduce any reuse-only CODE_FIX admission
      dependency while correcting the later NO_CHANGE case.
    - >
      An admitted final verification-only NO_CHANGE continuation invokes zero native Executors
      and executes the original TASK canonical verification list exactly once through the
      existing Runtime completion boundary. Success or repeated verification failure retains
      existing RESULT/EVIDENCE or FAILURE semantics respectively.
    - >
      Repository-provided Human-facing worker behavior remains thin and unchanged. The worker
      requests the existing operation but does not compare changed-files authorities, inspect
      reusable sidecars, decide reuse eligibility, reconstruct history, retry, fallback, or
      reroute.
    - >
      The correction must remain executor-neutral and deterministic and must not introduce an
      additional model call, repository-wide probabilistic discovery, hidden verification, or
      a new transport/artifact schema.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic regression proves an eligible NO_CHANGE continuation after a CODE_FIX
      phase-VERIFICATION failure is admitted when the preserved pre-verification ResultPackage
      is valid under full root_base_sha-to-subject TASK changed-files authority even though the
      predecessor FAILURE candidate.changed_files truthfully contains only the narrower
      failed-head-to-subject correction delta.
  - id: AC2
    condition: >
      The same regression proves canonical REPAIR Result.changed_files remains the complete
      stable original TASK delta required by TASK-057 and is not narrowed, rewritten, or
      replaced by the CODE_FIX correction-relative FAILURE delta.
  - id: AC3
    condition: >
      The same regression proves FAILURE candidate.changed_files retains its narrow per-RUN
      correction-relative authority and exact failed-head/correction lineage without being
      expanded or normalized to match the reusable ResultPackage.
  - id: AC4
    condition: >
      Genuine NO_CHANGE reuse still fails closed before canonical verification when the
      preserved pre-verification package itself has an invalid full-TASK changed-files set,
      wrong subject/head, wrong TASK/revision, malformed or conflicting local/transported
      state, incomplete ResultPackage, or incomplete TASK acceptance coverage; no Executor
      fallback, retry, or reroute occurs.
  - id: AC5
    condition: >
      A full deterministic continuation topology models PRIMARY canonical verification
      failure followed by an eligible NO_CHANGE continuation whose canonical verification also
      fails, followed by an authorized CODE_FIX REPAIR that dispatches its selected Executor
      exactly once and itself fails only during canonical verification, followed by a final
      explicitly authorized NO_CHANGE continuation. The final continuation is admissible when
      its preserved pre-verification candidate is valid despite correction-relative versus
      root-relative changed-files inequality.
  - id: AC6
    condition: >
      The AC5 topology preserves exact latest failed_head_sha, continuation_of, original
      root_base_sha, TASK id/revision, historical/correction lineage, and subject identity at
      every step; no candidate is rebased, substituted with current main, or mutated merely to
      enable reuse.
  - id: AC7
    condition: >
      The final eligible NO_CHANGE continuation in AC5 invokes zero native Executors and runs
      the canonical TASK verification list exactly once through existing Runtime completion,
      while the preceding CODE_FIX remains an ordinary exactly-one Executor dispatch and does
      not consume or depend on reusable-candidate state.
  - id: AC8
    condition: >
      Existing valid NO_CHANGE reuse, genuine fail-closed malformed/mismatched reuse cases,
      ordinary CODE_FIX REPAIR, historical REPAIR recovery, current-HEAD REPAIR, Runtime-owned
      verification/EVIDENCE, and no-retry/no-fallback/no-reroute regressions remain
      behaviorally unchanged outside the corrected changed-files authority comparison.
  - id: AC9
    condition: >
      No worker, adapter, dispatcher, downstream repository, roadmap capability status,
      artifact schema, or publication surface changes are required; implementation remains
      limited to the Runtime/Operator reusable-candidate decision boundary and focused
      deterministic regression coverage.

verification:
  required:
    - python -m pytest tests/test_repair_preverification_eligibility.py -q
    - git diff --check
