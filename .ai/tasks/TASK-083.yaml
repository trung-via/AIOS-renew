task_id: TASK-083
revision: 2

goal: >
  Canonicalize one small Brain-readable roadmap sequencing state so the Human phrase
  "continue roadmap" has one deterministic current meaning instead of requiring ChatGPT
  to infer priority from several parallel roadmap tracks or remembered chat context. Bind
  the currently approved Control-plane Closure sequence as the active track, record
  Admission Failure v2 as completed by TASK-081, record Correction Preflight as the next
  item, and record the separately completed A6 approved REVIEW-to-REMEDIATION wakeup as
  parallel DONE work via published TASK-084 rather than as a competing active priority.
  Make BRAIN SYNC explicitly read this sequencing state while preserving the existing
  authority hierarchy: Human intent and canonical engineering lineage remain authoritative,
  and roadmap sequencing state never becomes evidence that implementation work passed.

problem: >
  After TASK-081 passed, the Human established the Control-plane Closure sequence:
  Admission Failure v2 -> Correction Preflight -> Unified State + Next Action -> Unified
  Human Surface -> Downstream Adoption. TASK-083 revision 1 was authored to canonicalize
  that sequencing pointer, but before it was executed the repository advanced through the
  TASK-082 A6 lineage and TASK-084 safely integrated the reviewed A6 behavior onto current
  main. TASK-084 explicitly preserved TASK-083 unchanged and required a later BRAIN SYNC
  to reconcile its now-stale assumptions before execution. Current main therefore contains
  a valid authored TASK-083 revision 1 whose goal is still correct but whose statements
  that TASK-082 has no RUN lineage and A6 is merely AUTHORED_DEFERRED are no longer true.
  At the same time `.ai/roadmap-state.yaml` still does not exist, so the original roadmap
  ambiguity remains. Revision 2 reconciles only those planning facts: A6 is completed
  parallel work through published TASK-084, while Correction Preflight remains the unique
  NEXT item of the Human-approved Control-plane Closure track.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-083 revision 2 authoring is
    93cc833e03c15bd1c57a53093476af671c5f6027, the published TASK-084 source candidate.
  - >
    REVIEW-084-002 is canonical DELTA PASS for exact reviewed SHA
    93cc833e03c15bd1c57a53093476af671c5f6027 with prior_finding_id F1 and no remaining
    findings. TASK-084 therefore completes the integrated A6 product behavior on current
    main; historical TASK-082 candidates remain immutable lineage and were not themselves
    published onto current main.
  - >
    TASK-083 revision 1 was authored but never executed: current canonical RUN-083 review,
    artifact, and failure namespaces contain no RUN-083 lineage. Revising the unexecuted
    TASK contract does not rewrite an admitted RUN or review decision.
  - >
    TASK-081 remains complete at published SHA
    65c1597eb59b06041fba1d749f2dea87e2c00833 and closed Admission Failure v2 while leaving
    Correction Preflight, Unified State + Next Action, Unified Human Surface, and
    Downstream Adoption outside its scope.
  - >
    docs/AIOS-ROADMAP.md already records A6 as completed by TASK-084 upon publication but
    still exposes multiple separately gated tracks and does not provide the intended
    machine-readable current sequencing bookmark.
  - >
    `.ai/roadmap-state.yaml` is absent from current main. Human intent therefore still
    requires this task before generic "continue roadmap" can be resolved from repository
    state alone.
  - >
    Human intent may explicitly change active track or priority at any time. Absent such
    an explicit change, "continue roadmap" must resolve to the canonical unique NEXT item
    of the active sequence rather than to another separately gated or already-completed
    parallel milestone.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - .ai/tasks/TASK-081.yaml
    - .ai/tasks/TASK-082.yaml
    - .ai/tasks/TASK-084.yaml
  modify:
    - .ai/roadmap-state.yaml
    - docs/AIOS-ROADMAP.md
    - docs/CHATGPT_PROJECT_CONTRACT.md

non_goals:
  - Implement Correction Preflight, Unified State + Next Action, Unified Human Surface,
    Downstream Adoption, A4, A5, A7, A9, A10, or any other roadmap capability.
  - Reimplement, revise, rerun, republish, or expand the completed TASK-084/A6 behavior or
    rewrite historical TASK-082 RUN/REVIEW/REMEDIATION lineage.
  - Add or change any Runtime, Operator, Dispatcher, Executor, verification, review,
    remediation, repair, publication, transport, workflow, model, or Git synchronization
    behavior.
  - Make roadmap state a canonical TASK/RUN/RESULT/EVIDENCE/FAILURE/REVIEW/REMEDIATION/
    REPAIR schema or semantic completion authority.
  - Automatically infer that an item is DONE from prose, branch names, chat history, or
    model judgment without exact canonical evidence.
  - Automatically mutate or advance roadmap state after RUN, REVIEW, publication, or
    workflow events. State advancement remains a Human/Brain roadmap-authority update
    grounded in canonical evidence until a separately authorized deterministic mechanism
    exists.
  - Add a generic planner, priority engine, scheduler, queue, database, model router,
    scoring system, polling loop, or autonomous roadmap-selection agent.
  - Rewrite historical roadmap decisions or TASK/RUN lineage to pretend this sequencing
    artifact existed before TASK-083.

constraints:
  hard:
    - >
      Add one machine-readable `.ai/roadmap-state.yaml` with version 1. It must identify
      `control-plane-closure` as the active track and represent exactly this ordered
      sequence: `admission-failure-v2` DONE by TASK-081 at published SHA
      65c1597eb59b06041fba1d749f2dea87e2c00833; `correction-preflight` NEXT;
      `unified-state-next-action` BLOCKED by correction-preflight;
      `unified-human-surface` BLOCKED by unified-state-next-action; and
      `downstream-adoption` BLOCKED by unified-human-surface.
    - >
      The state must separately record `approved-remediation-wakeup` as parallel DONE work
      implemented by TASK-084 at published SHA
      93cc833e03c15bd1c57a53093476af671c5f6027. It may reference TASK-082 only as immutable
      historical semantic lineage; it must not claim either divergent TASK-082 candidate
      was published onto current main and must not place A6 inside the active five-item
      Control-plane Closure sequence.
    - >
      The artifact must state the sequencing rule semantically: absent explicit new Human
      priority, "continue roadmap" means continue the unique NEXT item in the active
      track. A Human-explicit track/priority change outranks that pointer and must be
      canonicalized before later generic continuation relies on it.
    - >
      Roadmap sequencing is Human/Brain planning state only. Exact canonical Git state and
      immutable TASK/RUN/RESULT/FAILURE/REVIEW/REMEDIATION/REPAIR lineage remain the sole
      engineering-state truth. A DONE roadmap item must cite exact supporting task and
      published SHA; roadmap state itself must never make a RUN or TASK complete.
    - >
      docs/AIOS-ROADMAP.md must document the active Control-plane Closure sequence, point
      to `.ai/roadmap-state.yaml` as the current machine-readable bookmark, record A6 as
      completed parallel work via TASK-084, and state the deterministic meaning of generic
      "continue roadmap".
    - >
      docs/CHATGPT_PROJECT_CONTRACT.md Brain Sync Protocol must require reading
      `.ai/roadmap-state.yaml` when present before selecting roadmap work. It must also
      make clear that the state is subordinate to explicit current Human intent and exact
      engineering lineage and cannot override a conflict or fabricate completion.
    - >
      There must be exactly one NEXT item in the active sequence. BLOCKED items must point
      only to an earlier item in that same ordered sequence. Parallel DONE items must not
      silently compete with NEXT when the Human gives only generic continuation intent.
    - >
      Keep this change documentation/state-only. Do not modify Python source, tests,
      workflows, task schemas, frozen kernel documents, TASK-081, TASK-082, or TASK-084.

acceptance:
  - id: AC1
    condition: >
      `.ai/roadmap-state.yaml` exists, parses deterministically, has version 1, one active
      track named control-plane-closure, exactly one NEXT item named correction-preflight,
      and the complete ordered five-item sequence and TASK-081 published-SHA evidence
      required by this TASK.
  - id: AC2
    condition: >
      The state records approved-remediation-wakeup/A6 only as parallel DONE work through
      TASK-084 at published SHA 93cc833e03c15bd1c57a53093476af671c5f6027, does not place
      it in the active sequence, and does not misrepresent either divergent TASK-082
      candidate as published current-main state.
  - id: AC3
    condition: >
      docs/AIOS-ROADMAP.md makes Control-plane Closure the active sequential priority,
      preserves A6 as completed parallel work, and defines generic "continue roadmap" as
      the unique NEXT item unless the Human explicitly changes track/priority.
  - id: AC4
    condition: >
      docs/CHATGPT_PROJECT_CONTRACT.md BRAIN SYNC explicitly reads the roadmap-state
      bookmark when present before selecting roadmap work, while preserving the existing
      authority hierarchy and engineering-truth precedence.
  - id: AC5
    condition: >
      The documented/state semantics prohibit Brain from selecting A4, A5, A7, A9, A10,
      or another feasible parallel milestone in response to generic continuation while
      correction-preflight remains NEXT, but still allow explicit Human intent to change
      active priority prospectively.
  - id: AC6
    condition: >
      The change is documentation/state-only, preserves historical artifacts and completed
      TASK-084/A6 behavior unchanged, and introduces no implementation, Runtime automation,
      model call, retry/reroute, automatic state advancement, or new execution/review/
      publication authority.

verification:
  required:
    - python -c "from pathlib import Path; import yaml; d=yaml.safe_load(Path('.ai/roadmap-state.yaml').read_text(encoding='utf-8')); assert d['version'] == 1; assert d['active_track'] == 'control-plane-closure'; seq=d['sequence']; assert [x['id'] for x in seq] == ['admission-failure-v2','correction-preflight','unified-state-next-action','unified-human-surface','downstream-adoption']; assert sum(x['status'] == 'NEXT' for x in seq) == 1; assert next(x for x in seq if x['status'] == 'NEXT')['id'] == 'correction-preflight'"
    - git diff --check
