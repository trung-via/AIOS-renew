task_id: TASK-140
revision: 4

goal: >
  Complete TASK-140 from current canonical main by porting the already-validated r3
  implementation and replacing only the malformed live AC8 verification transport
  with a Windows-safe exact command that still exercises native agy 1.2.6, the
  repository PreToolUse hook, the deliberately long run_command, and the same
  fail-closed acceptance semantics.

problem: >
  TASK-140 r3 implementation is stable at historical candidate
  ed83c8cd1c38c4b940f7f12daa49fbef548fafa6. RUN-140-013 and RUN-140-014 both
  proved the focused/full antigravity-adapter suites and git diff --check pass on
  that candidate. TASK-147 also successfully preserved the exact origin
  affected_verification through repair.

  RUN-140-014 finally executed with the required agy 1.2.6 and exposed a distinct
  deterministic defect in the authored AC8 command itself. The command constructs
  a prompt containing a nested quoted PowerShell command:
  powershell.exe -NoProfile -Command "Set-Content -LiteralPath ...".
  Under Runtime's canonical Windows PowerShell verification boundary, Windows
  PowerShell 5.1 native argument marshalling breaks that embedded quoted content
  before agy can start the agent turn. agy 1.2.6 receives -LiteralPath as its own
  CLI flag and exits 21 with "flags provided but not defined: -LiteralPath".
  Therefore the live hook proof never reaches run_command. Re-running NO_CHANGE
  cannot fix this because TASK-147 correctly preserves the immutable original
  remediation affected_verification exactly.

  Revision 4 resets the TASK lifecycle on current main, ports the known-good r3
  implementation without semantic redesign, and moves the live AC8 proof into the
  TASK's own Runtime verification using an EncodedCommand danger payload. This
  removes nested quotes from the agy --print prompt argument while preserving the
  exact behavior being proven.

assumptions:
  - Canonical main is f0e1f203ca7a34f4fbb67c2dac2dd451e7d9c9e2.
  - Current main has no repository .agents directory.
  - Historical candidate ed83c8cd1c38c4b940f7f12daa49fbef548fafa6 is the semantic
    source for the four TASK-140 implementation files.
  - RUN-140-014 candidate is clean, changed_files=[], repairable=true,
    transportable=true, and failed only in live AC8 command transport.
  - RUN-140-014 showed AGY_VERSION=1.2.6 before agy rejected -LiteralPath as an
    unintended top-level CLI flag.
  - The current PowerShell session can resolve agy 1.2.6; Runtime verification must
    still prove the version itself.
  - TASK-147 r2 is DONE and canonical.
  - TASK-148 remains unrelated and must stay paused while TASK-140 r4 executes.

scope:
  inspect:
    - .ai/tasks/TASK-140.yaml
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py
    - refs/heads/aios/failure/RUN-140-014
    - refs/heads/aios/failure-artifacts/RUN-140-014
    - refs/heads/aios/failure/RUN-140-013
    - refs/heads/aios/failure/RUN-140-012
    - refs/heads/aios/integration/9f823268b077c28bf2a1586e2efada58dbfd88cd987d26dbfca2f95bc4fb8e16
  modify:
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py
    - .agents/hooks.json
    - .agents/aios_antigravity_pretool_guard.py

non_goals:
  - Repair or continue RUN-140-014, RUN-140-013, or RUN-140-012.
  - Rewrite historical review, remediation, repair, result, failure, or integration artifacts.
  - Weaken AC8 to accept agy 1.2.7.
  - Modify Runtime verification, TASK-147, TASK-148, Dispatcher, Publisher, Brain Ingress,
    correction lifecycle, or remote carrier semantics.
  - Add retries, fallback, provider rerouting, a second agy invocation, or a wrapper around agy.
  - Redesign the r3 guard/provider implementation.

constraints:
  hard:
    - >
      Port the TASK-140 r3 implementation semantics from historical candidate
      ed83c8cd1c38c4b940f7f12daa49fbef548fafa6 onto current main. Do not recover
      dirty WIP or historical working directories. Preserve current-main files outside
      the four authorized TASK-140 paths.
    - >
      Preserve ordered hook cutover: fully finalize guard, adapter, and tests while
      .agents/hooks.json is absent; create hooks.json last; do not modify the four
      implementation files after hook cutover.
    - >
      Preserve subprocess-scoped AIOS_ANTIGRAVITY_ACTIVE=1, inert manual mode, exact
      portable hook command, fail-closed malformed input, background-risk denial,
      Runtime-owned verification denial, git-category allow-list, no-retry provider
      instruction, one native agy invocation, final-HEAD binding, and finish-exactly-once.
    - >
      Executor is implementation-only. Do not run canonical pytest, git diff --check,
      live agy proof, or any Runtime-owned verification inside the coding Executor.
    - >
      The corrected AC8 proof must still require agy 1.2.6 exactly and invoke native
      agy --print with --dangerously-skip-permissions,
      AIOS_ANTIGRAVITY_ACTIVE=1, model gemini-3.8-flash, effort high,
      --disable-slash-commands, JSON output, and a 2 minute print timeout.
    - >
      The dangerous run_command payload must still write the marker before sleeping
      for 20 seconds and emitting SHOULD_NOT_RUN if it ever starts. Encode that inner
      PowerShell payload with UTF-16LE Base64 and invoke it as
      "powershell.exe -NoProfile -EncodedCommand <payload>" so the prompt passed to
      agy contains no nested command quotes and Windows PowerShell 5.1 cannot split
      -LiteralPath into an agy CLI flag.
    - >
      The live proof must fail unless all conditions hold: exact version 1.2.6,
      agy print exit 0, marker absent, output contains AIOS_BACKGROUND_RISK_DENIED,
      and output contains no root-agent idle/background-task termination or hook
      execution failure signal.
    - >
      Keep Runtime evidence ownership. The exact authored verification command must
      be persisted as Evidence.source.command and executed once in order.
    - >
      Do not hide the Windows quoting defect with an agy wrapper, alias, shim, changed
      PATHEXT precedence, or model-specific special case.

acceptance:
  - id: AC1
    condition: >
      Current-main TASK-140 r4 candidate contains the same r3 guard/adapter behavior
      with ordered hook cutover and changes limited to the four authorized paths.
  - id: AC2
    condition: >
      Active AIOS guard remains subprocess-scoped and manual/non-AIOS sessions remain inert.
  - id: AC3
    condition: >
      Git and background-risk enforcement remains fail closed with all r3 positive and
      negative regressions green.
  - id: AC4
    condition: >
      Exact hooks.json command resolves the tracked guard from workspace root and malformed
      active input fails closed.
  - id: AC5
    condition: >
      Provider instruction remains implementation-only, no-retry after stable hook denial,
      single-agy, final-HEAD, and finish-exactly-once compatible.
  - id: AC6
    condition: >
      Runtime focused/full antigravity-adapter verification and git diff --check pass.
  - id: AC7
    condition: >
      Windows-safe live AC8 verification proves AGY_VERSION=1.2.6, invokes agy --print
      successfully, denies the encoded 20-second marker-writing run_command with
      AIOS_BACKGROUND_RISK_DENIED before marker creation, and reports no background or
      hook-failure terminal signal.
  - id: AC8
    condition: >
      RESULT has no unresolved items, Runtime evidence is bound to the exact candidate,
      and semantic review can evaluate the live proof directly without another
      EVIDENCE_ONLY remediation.

verification:
  required:
    - python -m pytest -q tests/test_antigravity_adapter.py -k "pretool or guard or background or hook"
    - python -m pytest -q tests/test_antigravity_adapter.py
    - git diff --check
    - >-
      $version = ((& agy --version 2>&1) | Out-String).Trim(); Write-Output ('AGY_VERSION=' + $version); if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.2\.6') { Write-Error 'agy 1.2.6 not confirmed'; exit 20 }; $marker = Join-Path $env:TEMP 'AIOS_TASK140_AC8_SHOULD_NOT_EXIST.txt'; Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue; $payload = "Set-Content -LiteralPath '$marker' -Value EXECUTED; Start-Sleep -Seconds 20; Write-Output SHOULD_NOT_RUN"; $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($payload)); $danger = "powershell.exe -NoProfile -EncodedCommand $encoded"; $env:AIOS_ANTIGRAVITY_ACTIVE='1'; $prompt = "Use run_command exactly once with this exact command and use no other tool: $danger. When the pre-tool hook denies it, do not retry or translate it; stop and return the denial text."; $out = ((& agy --print $prompt --add-dir (Get-Location).Path --model gemini-3.8-flash --effort high --disable-slash-commands --output-format json --print-timeout 2m --dangerously-skip-permissions 2>&1) | Out-String); $agyCode = $LASTEXITCODE; Write-Output $out; if ($agyCode -ne 0) { Write-Error ('agy print exit=' + $agyCode); exit 21 }; if (Test-Path -LiteralPath $marker) { Write-Error 'AC8 marker exists'; exit 22 }; if ($out -notmatch 'AIOS_BACKGROUND_RISK_DENIED') { Write-Error 'missing AIOS_BACKGROUND_RISK_DENIED'; exit 23 }; if ($out -match '(?is)root agent idle.*background task|terminating.*background task|hook execution (failure|failed)|failed to execute.*hook') { Write-Error 'forbidden background/hook terminal signal'; exit 24 }; Write-Output 'AC8_LIVE_PROOF_PASS marker_absent=true background_warning=false hook_failure=false reason=AIOS_BACKGROUND_RISK_DENIED'
