task_id: TASK-140
revision: 2

goal: >
  Complete the native Antigravity provider-side no-background enforcement on current
  canonical main, using the proven TASK-140 r1 implementation shape but with a bounded
  implementation-only Executor contract that prevents executor-owned verification and
  scratch artifacts from consuming the MiniMax response budget.

problem: >
  RUN-140-001 invoked antigravity-minimax from TASK-140 r1 and performed substantial
  implementation work, but terminated with agym nonzero 4294967295 before producing a
  candidate commit or structural ResultPackage. Unified State is canonically BLOCKED with
  NON_REPAIRABLE_FAILURE, failed_run_id RUN-140-001, so its dirty WIP cannot be continued
  through canonical REPAIR/RECOVER semantics.

  Forensic inspection of RUN-140-001 WIP confirms the core design was largely correct:
  .agents/hooks.json used
  "python ./.agents/aios_antigravity_pretool_guard.py"; the native adapter propagated
  AIOS_ANTIGRAVITY_ACTIVE=1 only in the spawned native agy subprocess; and tests were
  added for active/inactive guard behavior and exact hooks.json execution from workspace
  root. However the Executor also ran pytest and created .tmp pytest repositories plus a
  modify_tests.py helper outside TASK scope. It then failed to terminalize after roughly
  516 seconds. The exact operating-system exit path for 4294967295 is not asserted here;
  the actionable fact is that r1 spent execution time on Runtime-owned verification and
  scratch generation instead of committing and finishing.

  r1 also missed one exact acceptance detail: its production-path hooks.json command
  regression used the verification payload "pytest tests/test_authoring_ingress.py" and
  expected AIOS_RUNTIME_OWNS_VERIFICATION. TASK-140 requires that exact-command regression
  to additionally prove a true background-risk payload such as
  "Start-Sleep -Seconds 20" is denied with AIOS_BACKGROUND_RISK_DENIED.

assumptions:
  - >
    Canonical main at authoring is
    0873bb0c9e3db11958202f7581992c1632bfd4b2, TASK-140 r1 task definition only.
  - >
    RUN-140-001 is terminal FAILURE and Unified State reports
    blocker.code=NON_REPAIRABLE_FAILURE and next_action=NONE.
  - >
    RUN-140-001 dirty WIP is forensic evidence only. It must not be committed manually,
    restored into the new run, or treated as a canonical candidate.
  - >
    Independent proof already established that agy 1.2.6 workspace PreToolUse can deny
    run_command under --print and --dangerously-skip-permissions.
  - >
    Runtime, not the coding Executor, owns all verification listed by the task.

scope:
  inspect:
    - .ai/tasks/TASK-140.yaml
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py
    - .agents/
  modify:
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py
    - .agents/hooks.json
    - .agents/aios_antigravity_pretool_guard.py

non_goals:
  - Repair, recover, reuse, merge, or publish RUN-140-001 dirty WIP.
  - Modify Antigravity-MiniMax/agym implementation.
  - Modify Dispatcher, Unified State, Brain Ingress, Publisher, correction lifecycle, or
    remote carrier allowlists.
  - Modify TASK-136, TASK-138, TASK-139, or TASK-135 artifacts/lineage.
  - Add retry, fallback, reroute, recursive continuation, second provider invocation,
    generic planner/router behavior, or global/user hook configuration.
  - Run canonical verification inside the coding Executor.

constraints:
  hard:
    - >
      EXECUTOR IMPLEMENTATION-ONLY CONTRACT: do not run pytest, py.test, unittest, tox,
      nox, coverage, lint, build, git diff --check, or any test/verification command.
      Do not run the task verification commands. Runtime will run verification after the
      Executor commits and returns ResultPackage.
    - >
      Do not create scratch/helper artifacts such as .tmp/, modify_tests.py, generated
      patch scripts, temporary repositories, ad-hoc test harnesses, or files outside
      scope.modify. Edit only the four authorized paths and commit them.
    - >
      Use repository workspace PreToolUse enforcement with canonical
      .agents/hooks.json command exactly resolving the tracked guard from workspace root,
      e.g. "python ./.agents/aios_antigravity_pretool_guard.py". No machine-specific
      absolute paths.
    - >
      Native Antigravity adapter must set AIOS_ANTIGRAVITY_ACTIVE=1 only in the environment
      passed to its single agy subprocess, preserve all caller environment variables, and
      not mutate global os.environ.
    - >
      Manual/non-AIOS Antigravity sessions must remain inert/allowed by the guard.
    - >
      Active AIOS guard must fail closed on malformed run_command input and deny before
      execution: Runtime-owned verification commands, builds/lints, sleep/wait commands,
      watchers, servers, persistent/background commands, provider re-invocation, and AIOS
      operator re-invocation. Stable reasons must include
      AIOS_RUNTIME_OWNS_VERIFICATION and AIOS_BACKGROUND_RISK_DENIED.
    - >
      Do not disable run_command globally. Permit only the bounded git operations needed
      for implementation/terminalization such as status, diff, add, commit, rev-parse,
      log, show, branch inspection, and ls-files. Do not broaden this allow path to
      destructive/history-changing/network operations such as reset, restore, merge,
      rebase, stash, or fetch unless an existing required test proves one is essential.
    - >
      Preserve TASK-137 terminal semantics: exactly one native agy invocation, no fallback
      or second provider call, actual final HEAD binding, builtin finish exactly once, and
      fail-closed terminal handling.
    - >
      Provider instruction must explicitly tell native Antigravity that a stable hook denial
      for a Runtime-owned verification/background-risk command is expected policy, must not
      be retried, and must not prevent implementation, commit, final-HEAD lookup, and finish.
    - >
      Add a production-path regression that reads the exact command string from canonical
      .agents/hooks.json and executes that exact command from repository workspace root
      with AIOS_ANTIGRAVITY_ACTIVE=1 using
      "Start-Sleep -Seconds 20". It must return process exit 0 and exactly
      decision=deny, reason=AIOS_BACKGROUND_RISK_DENIED.
    - >
      Retain a separate regression for the RUN-136-004 verification class
      "pytest tests/test_authoring_ingress.py" returning
      AIOS_RUNTIME_OWNS_VERIFICATION.
    - >
      Retain regression proving RUN-138-001's old
      "python ./aios_antigravity_pretool_guard.py" path fails from workspace root.
    - >
      The coding Executor must stop after authorized edits, git add/commit, final
      git rev-parse HEAD, and builtin finish. It must not execute the verification section
      itself.

acceptance:
  - id: AC1
    condition: >
      Native AIOS Antigravity execution activates the workspace guard only through the
      subprocess-scoped environment; manual/non-AIOS use remains unaffected.
  - id: AC2
    condition: >
      Active guard denies RUN-136-004 pytest verification with
      AIOS_RUNTIME_OWNS_VERIFICATION and a Start-Sleep background-risk command with
      AIOS_BACKGROUND_RISK_DENIED before execution.
  - id: AC3
    condition: >
      Required bounded git implementation/terminalization commands remain usable while
      dangerous/destructive/background classes are not admitted.
  - id: AC4
    condition: >
      The exact hooks.json command executes the tracked guard successfully from repository
      workspace root, and both the corrected path and old RUN-138-001 path regression are
      covered.
  - id: AC5
    condition: >
      Native adapter remains one agy invocation with TASK-137 finish/final-HEAD/fail-closed
      semantics and no retry/fallback/reroute.
  - id: AC6
    condition: >
      Candidate changes are limited to the four authorized paths; no .tmp, modify_tests.py,
      helper scripts, generated test repositories, or other scratch artifacts exist in the
      candidate.
  - id: AC7
    condition: >
      Runtime-owned focused/full antigravity-adapter verification and git diff --check pass,
      RESULT has no unresolved items, and the coding Executor did not run those verification
      commands itself.
  - id: AC8
    condition: >
      Before PASS review, independent live self-host agy 1.2.6 --print proof with
      --dangerously-skip-permissions denies a deliberately long run_command before its
      marker is created, emits stable AIOS_BACKGROUND_RISK_DENIED, emits no background-task
      or hook-failure terminal warning, and leaves the marker absent.

verification:
  required:
    - python -m pytest -q tests/test_antigravity_adapter.py -k "pretool or guard or background or hook"
    - python -m pytest -q tests/test_antigravity_adapter.py
    - git diff --check
