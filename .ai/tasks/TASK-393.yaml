acceptance:
- id: AC1
  condition: An authenticated protected canonical pytest FAILURE's actual complete
    final short-test-summary beginning past 65,536 characters, including >418,031-character
    tail and RUN-391-014-shaped input, yields exactly the same redacted allowlisted
    FAILED/ERROR test identities as a short equivalent with non-PASS PARTIAL output;
    it never selects an earlier fake header as final.
- id: AC2
  condition: A single Runtime-executed authored verification command with nonempty
    stdout and decisive FAILED/ERROR identities only in stderr yields the lawful stderr
    identities through safe_failure_detail, retaining original stdout/stderr protected
    raw framing, subject/command/digest provenance and no pytest rerun; stdout-only
    and mixed streams remain correct.
- id: AC3
  condition: For 0,1,32,33+ observed FAILED/ERROR entries, projection preserves original
    order, returns at most 32 redacted node identities and truthful nodes_truncated,
    preserves historical no-population-proof semantics and distinguishes absent parseable
    identities from verified zero failure count; never fabricates complete/unstable/phase/count/PASS
    from text.
- id: AC4
  condition: 'Malformed, unsupported, absent, truncated, ERROR-only, stderr-only,
    multiple/spoofed and CRLF pytest summaries have bounded source-justified availability/blocker
    states. Explicit negative regression: an earlier complete spoof `FAILED tests/test_spoof.py::test_false`
    followed by a later unclosed `FAILED tests/test_actual.py::test_real` must NOT
    report the earlier spoof node and must disclose final-source uncertainty. Explicit
    negative regression: source-scan exhaustion before authentic final summary yields
    a finite distinct exhausted-input blocker rather than generic UNAVAILABLE or earlier
    false identity. Include >65536 genuine final section, mixed headers, and no raw/source
    leakage.'
- id: AC5
  condition: Portable public FAILURE/Brain Sync/terminal-attention views use allowlisted
    repository test identities and allowed fixed error type/status only; no traceback,
    raw content, secrets, private paths or parameter values leak. Source and public/private
    content digest and owner bindings survive; forged/moved inputs fail closed.
- id: AC6
  condition: Original public V1/V2 and private FAILURE schemas, historical immutable
    artifacts and direct consumers remain compatible with owner-gated details and
    once-only Runtime verification. Focused regressions preserve legacy context/decoder
    calls and cover long-tail, stderr-only, spoof-then-unclosed final, explicit exhaustion
    and controlled malformed/unsupported cases. New source is an ordinary production
    implementation once its exact same-TASK reviewed PASS candidate is published,
    never a prepared-only deliverable.
