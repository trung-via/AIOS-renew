task_id: TASK-059
revision: 2

goal: >
  Complete the remaining native execution-efficiency hardening after TASK-060 by
  reducing redundant Executor work, making explicit Human interruption of an
  admitted native execution terminal and recoverable instead of orphaned, and
  preserving bounded native diagnostics for timeout/interruption failures. Preserve
  the already-published 60-minute response budget and 65-minute outer watchdog,
  exactly-one dispatch, Runtime-owned canonical verification, and fail-closed lineage.

problem: >
  TASK-060 resolved the self-hosting timeout ceiling and proved that a larger native
  ceiling does not impose a minimum wait. The remaining observed defects are separate:
  native Executor guidance still does not explicitly prevent spending execution time
  on baseline/full/canonical verification or unnecessary repo-wide rediscovery that
  Runtime already makes redundant; Ctrl+C during admitted RUN-058-003 escaped the
  Exception terminalization path and left ACTIVE RUN/REPAIR state that blocked later
  continuation; and current timeout/interruption FAILURE recording preserves too
  little bounded native context to distinguish no-output from partial progress or a
  provider/tool failure. Re-running TASK-059 revision 1 would duplicate TASK-060 work,
  so this revision consumes TASK-060 as established baseline and authorizes only the
  residual hardening.

assumptions:
  - >
    Current canonical AIOS-renew main before TASK-059 revision 2 authoring is
    ce5362e79aeb97a7578b426eccf8ef91d2596379.
  - >
    TASK-060 is semantically reviewed PASS and published at
    ce5362e79aeb97a7578b426eccf8ef91d2596379. Its 60-minute native response budget,
    65-minute outer watchdog, policy-derived timeout messages, and early-return
    behavior are authoritative and must not be reimplemented.
  - >
    RUN-059-001 remains a historical non-repairable EXECUTION failure from revision 1;
    it must not be repaired, rerun, or treated as the implementation candidate for
    this revision.
  - >
    RUN-058-003 demonstrated that KeyboardInterrupt can escape admitted execution
    terminalization and leave stale local RUN/REPAIR state even when repository HEAD
    and worktree contain no committed candidate delta.
  - >
    TASK-058 remains unresolved and is outside this TASK.
  - >
    Existing exactly-one Dispatcher authority, one-active mutation authority,
    Runtime-owned canonical verification, no-retry/no-fallback semantics, and frozen
    artifact authority remain unchanged.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-055.yaml
    - .ai/tasks/TASK-059.yaml
    - .ai/tasks/TASK-060.yaml
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/run_observation.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_operator.py
    - tests/test_runtime.py
    - tests/test_run_observation.py

  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_operator.py
    - tests/test_runtime.py

non_goals:
  - Change the 60-minute response budget or 65-minute outer watchdog established by TASK-060.
  - Implement, redesign, rerun, or repair TASK-058.
  - Repair, reuse, or publish the dirty RUN-059-001 candidate.
  - Change downstream Python Agent source or dependency pins.
  - Add retry, fallback, reroute, failover, executor substitution, speculative execution, or autonomous recovery.
  - Add adaptive/model-scored timeout selection, routing, Planner authority, or model-default selection.
  - Change canonical verification ownership, RESULT/EVIDENCE semantics, review semantics, or publication authority.
  - Treat native diagnostics as canonical verification evidence or semantic completion truth.
  - Add background daemons, message brokers, distributed watchdogs, or external orchestration services.
  - Perform unrelated refactoring, package/version changes, roadmap cleanup, or downstream migration.
  - Push from executor execution.

constraints:
  hard:
    - >
      TASK-060 native execution policy remains unchanged: admitted native response
      budget is 60 minutes maximum, outer process watchdog is 65 minutes, and an
      Executor that returns earlier is processed immediately.
    - >
      Native Executor guidance for Codex and Antigravity must favor direct authorized
      implementation from bounded TASK context. It must make clear that Runtime owns
      canonical verification, that baseline/full/canonical verification should not be
      run merely before implementation or duplicated for ceremony, and that repo-wide
      rediscovery should not be performed when supplied bounded context is sufficient.
      Narrow implementation-local sanity checks remain allowed when materially useful.
    - >
      An explicit Human KeyboardInterrupt delivered after a RUN has been admitted must
      not return control while leaving that admitted attempt ACTIVE and non-terminal.
      PRIMARY, REMEDIATION, and REPAIR paths must deterministically preserve the RUN
      identity and applicable lineage in explicit terminal or explicitly recoverable
      state before returning interruption to the Human.
    - >
      Interruption handling must observe repository truth as it exists at interruption.
      It must not silently delete, reset, stash, commit, or reinterpret Executor work;
      candidate dirty/clean state, ancestry, changed files, and repairability remain
      Runtime-derived facts.
    - >
      Interruption handling must not start a replacement native execution, retry,
      fallback, reroute, change the selected Executor, or convert interruption to PASS.
    - >
      Timeout and explicit-interruption failures must retain bounded native diagnostic
      context when the underlying process API supplies it. Diagnostics must be enough
      to distinguish no captured output from partial stdout/stderr or provider/tool
      failure, while using a deterministic fixed maximum size and never capturing an
      environment dump or other unrelated process state.
    - >
      Bounded native diagnostics remain subordinate operational information. They must
      not satisfy acceptance criteria, replace Runtime verification, authorize
      completion, or alter candidate Git truth.
    - >
      Existing exactly-one dispatch, one-active mutation authority, clean-worktree,
      SHA/diff/scope gates, structural ResultPackage fail-closed handling, transport,
      and no-push behavior remain unchanged.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Codex and Antigravity native execution contracts explicitly preserve Runtime as
      canonical verification owner and discourage redundant baseline/full/canonical
      verification and unnecessary repo-wide rediscovery before direct implementation,
      while allowing narrowly useful implementation-local sanity checks.
  - id: AC2
    condition: >
      Deterministic PRIMARY regression raises KeyboardInterrupt after admission and
      proves the admitted RUN is terminalized or placed in explicit recoverable
      terminal state before control returns, with original RUN identity, selected
      Executor, base SHA, and observed candidate Git truth preserved.
  - id: AC3
    condition: >
      Deterministic REMEDIATION and REPAIR regressions prove the same interruption
      terminalization property while preserving their exact correction lineage and
      leaving no stale accepted correction state that permanently blocks a later
      properly authorized continuation.
  - id: AC4
    condition: >
      Interruption regressions prove no cleanup, commit, retry, fallback, reroute,
      executor substitution, or hidden PRIMARY invocation occurs as a side effect of
      interruption handling.
  - id: AC5
    condition: >
      Timeout and explicit-interruption FAILURE artifacts preserve deterministic,
      size-bounded native diagnostic context when partial stdout/stderr or equivalent
      native output is available, and explicitly distinguish unavailable diagnostic
      output without inventing content.
  - id: AC6
    condition: >
      Diagnostic context remains operational-only: canonical RESULT/EVIDENCE and
      Runtime verification acceptance cannot be satisfied by diagnostic text.
  - id: AC7
    condition: >
      TASK-060 behavior remains unchanged: provider-neutral 60-minute response budget,
      65-minute outer watchdog, immediate early return, and no hidden 15-minute cutoff
      continue to pass deterministic regression coverage.
  - id: AC8
    condition: >
      Normal success, timeout, malformed output, and interruption paths each invoke at
      most one already-selected native Executor and preserve existing Runtime
      verification, completion, transport, and one-active mutation semantics.
  - id: AC9
    condition: >
      No TASK-058 implementation, model-default configuration, downstream migration,
      autonomous recovery authority, or unrelated repository change is introduced.

verification:
  required:
    - python -m pytest tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_operator.py tests/test_runtime.py tests/test_run_observation.py -q
    - git diff --check
