task_id: TASK-073
revision: 1

goal: >
  Integrate the semantically reviewed TASK-068 A2 Durable Dispatch Identity +
  Reconciliation behavior onto the current canonical product main as a fresh
  current-main descendant candidate. Preserve the already-published TASK-071 canonical
  RUN namespace/collision-recovery behavior and TASK-072 publication behavior, while
  establishing fresh Runtime verification and semantic review for the integrated A2
  implementation before publication.

problem: >
  TASK-068 revision 1 produced repaired candidate
  024f0d30131ffdaa141b106d0e927fbc164aa038 under RUN-068-004. Canonical
  REVIEW-068-002 judged the repaired candidate DELTA PASS for the prior F1 and the final
  ResultPackage claims AC1 through AC9 with no unresolved items. That historical
  candidate was never incorporated into product main because later canonical work
  advanced independently.

  TASK-072 has now published the current-control publication boundary to canonical main
  f807df3f5aa05227a22944e0a293858049969210. A canonical replay of RUN-068-004 using that
  publisher resolved the immutable PASS decision and candidate correctly, then returned
  INTEGRATION_REQUIRED with prior_main_sha
  f807df3f5aa05227a22944e0a293858049969210 and reviewed_sha
  024f0d30131ffdaa141b106d0e927fbc164aa038 because the histories diverge from merge base
  4df5ad3076b0c072b39a7fbf692ef5bc3f2b225f. The publisher correctly performed no
  product mutation. Human has authorized the separately reviewed integration candidate
  required by this boundary.

  The A2 behavior must therefore be realized again as a current-main descendant while
  retaining later published Operator and publication behavior. In particular, current
  main contains TASK-071 changes to canonical remote RUN namespace allocation and
  recover-primary semantics that did not exist in the historical TASK-068 branch and
  must not be overwritten or weakened by integration.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-073 authoring is
    f807df3f5aa05227a22944e0a293858049969210 and includes published TASK-071 and
    TASK-072 behavior.
  - >
    TASK-068 revision 1 remains the authoritative semantic source for A2 Durable Dispatch
    Identity + Reconciliation.
  - >
    Canonical RUN-068-004 binds candidate
    024f0d30131ffdaa141b106d0e927fbc164aa038 and fresh historical Runtime evidence of
    35 passing dispatch/wakeup tests plus git diff --check, with RESULT.changed_files
    covering exactly the seven A2 implementation/documentation files.
  - >
    REVIEW-068-002 is the canonical DELTA PASS decision for RUN-068-004, with prior
    finding F1 corrected. The historical PASS establishes semantic intent and evidence
    for that exact historical candidate but does not authorize replacing or moving
    current main backward.
  - >
    Canonical replay of RUN-068-004 under the TASK-072 publisher returned
    INTEGRATION_REQUIRED rather than mutating main, proving that a separate current-main
    integration candidate is required.
  - >
    TASK-066 remains authoritative for A1 wakeup security boundaries and TASK-062 remains
    authoritative for PRIMARY synchronization.
  - >
    TASK-071 remains authoritative for canonical remote RUN namespace reservation,
    four-digit RUN allocation, terminal collision fail-closed behavior, and
    recover-primary.
  - >
    TASK-072 remains authoritative for current-control publication, historical correction
    lineage reconstruction, canonical decision replay, and integration-required
    classification.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-062.yaml
    - .ai/tasks/TASK-066.yaml
    - .ai/tasks/TASK-068.yaml
    - .ai/tasks/TASK-071.yaml
    - .ai/tasks/TASK-072.yaml
    - .github/workflows/aios-self-hosted-wakeup.yml
    - src/aios_renew/dispatch_reconciliation.py
    - src/aios_renew/operator.py
    - tests/test_dispatch_reconciliation.py
    - tests/test_self_hosted_wakeup.py
    - tests/test_operator.py
    - README.md
  modify:
    - .github/workflows/aios-self-hosted-wakeup.yml
    - src/aios_renew/dispatch_reconciliation.py
    - src/aios_renew/operator.py
    - tests/test_dispatch_reconciliation.py
    - tests/test_self_hosted_wakeup.py
    - README.md
    - docs/AIOS-ROADMAP.md

non_goals:
  - Modify, delete, rewrite, force-update, or reinterpret historical RUN-068-001 through RUN-068-004, REVIEW-068-001/002, any TASK-068 remediation/repair artifact, or candidate 024f0d30131ffdaa141b106d0e927fbc164aa038.
  - Move current main backward to the historical TASK-068 candidate or publish that divergent candidate directly.
  - Change TASK-071 canonical RUN namespace allocation, terminal collision detection, four-digit RUN allocation, recover-primary semantics, or their authority boundaries.
  - Change TASK-072 publication semantics, canonical decision replay, historical correction-lineage validation, integration-required classification, or publication authority.
  - Change TASK, RUN, RESULT, EVIDENCE, FAILURE, REVIEW, REMEDIATION, REPAIR, or RUN_OBSERVATION schemas or semantic authority.
  - Recover, retry, reroute, repair, automatically terminalize, or otherwise mutate an incomplete canonical RUN from dispatch reconciliation.
  - Implement A3 remote status/approval, A4 transport extraction, A5 evidence strengthening, A6 review-to-remediation wakeup, A7 autonomous Reviewer shadow mode, A9 zero-touch, or A10 scale.
  - Add a scheduler, polling daemon, queue, broker, database, background AIOS process, second Executor, Planner, Reviewer, router, or model call.
  - Give GitHub Actions or dispatch reconciliation publication or semantic review authority.
  - Change downstream repositories or dependency pins.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      The TASK-073 implementation candidate must descend from canonical TASK-073 base main
      f807df3f5aa05227a22944e0a293858049969210 and may modify only the seven authorized
      A2 files. The historical TASK-068 candidate is immutable semantic/reference input,
      not a replacement product state.
    - >
      Preserve the complete semantically reviewed TASK-068 outcome: one bounded opaque
      non-semantic dispatch_id; durable repository-local dispatch state; exact
      TASK/executor request binding; at-most-once delegation into the existing canonical
      PRIMARY path; deterministic duplicate terminal replay; fail-closed identity
      collision; crash/restart attribution without re-execution; and explicit
      non-executing in-progress/reconciliation-blocked outcomes when ownership cannot be
      proven.
    - >
      Dispatch-to-RUN ownership must remain deterministic at the existing canonical
      PRIMARY admission boundary. A competing direct PRIMARY or distinct dispatch for the
      same TASK/executor must never be attributed to this dispatch merely because it
      appears after a pre-invocation namespace snapshot. If exact ownership cannot be
      proven, reconciliation must not guess or invoke PRIMARY again.
    - >
      Observing an already-active duplicate must be side-effect free with respect to the
      durable ownership state needed by the original invocation. The duplicate must still
      return explicit nonzero IN_PROGRESS, must not invoke PRIMARY/Executor, and must not
      prevent the original invocation from binding its own admitted RUN and completing.
    - >
      Reconciliation remains observational only. It may inspect repository lock and
      canonical RUN/RESULT/FAILURE state but may not synthesize terminal artifacts,
      terminalize ACTIVE RUNs, delete state, release/steal leases, reset Git, rerun
      verification, invoke transport, call a coding Executor, or start correction flows.
    - >
      The A1 workflow must remain workflow_dispatch-only on the dedicated
      [self-hosted, windows, x64, aios-renew] runner with persistent AIOS_REPO_ROOT,
      read-only GitHub permissions, no actions/checkout, no direct Executor call, and no
      workflow-owned repository synchronization or canonical verification. TASK id,
      Executor, and dispatch_id must reach the shell only as data/environment bindings.
    - >
      The normal local `aios run` surface must remain behaviorally valid. The A2 Human-facing
      wakeup surface may own outer dispatch identity/reconciliation only and must delegate
      a NEW dispatch to the existing PRIMARY implementation rather than creating a second
      RUN-admission or execution path.
    - >
      TASK-071 canonical RUN namespace behavior must remain intact on the integrated
      current-main candidate, including remote terminal reservations, four-digit RUN IDs,
      fail-closed success/failure identity conflicts, and recover-primary. Integration must
      not restore historical operator behavior that predates TASK-071.
    - >
      TASK-072 publication behavior must remain unchanged; TASK-073 has no authority to
      modify publication files or publication/replay semantics.
    - >
      Dispatch records remain operational-only local state outside product worktree and
      canonical artifact schemas. They are not semantic acceptance evidence, TASK truth,
      REVIEW proof, or publication authority.
    - >
      README must document stable dispatch-id reuse and crash/no-reexecution semantics.
      The roadmap may mark A2 DONE only as the result of the current-main integration
      lineage becoming semantically reviewed PASS and published; A3/A4/A5/A6/A7/A9/A10
      remain separately gated.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The final candidate is a descendant of TASK-073 base main and changes only the seven
      authorized A2 files while retaining all published TASK-071 and TASK-072 behavior.
  - id: AC2
    condition: >
      The self-hosted wakeup accepts exactly one bounded opaque dispatch_id in addition to
      TASK id and explicit codex/antigravity Executor choice while preserving all A1
      trigger, runner, permission, persistent-repository, no-checkout, credential, and
      shell-data-binding security constraints.
  - id: AC3
    condition: >
      A first-seen dispatch durably binds its dispatch_id/TASK/Executor and required
      reconciliation state before at-most-once delegation into the existing canonical
      PRIMARY path; RUN allocation, synchronization, Executor invocation, verification,
      RESULT/EVIDENCE, failure handling, and transport remain owned by existing
      Operator/Runtime authorities.
  - id: AC4
    condition: >
      Duplicate terminal success/failure delivery is side-effect-free and reuses the exact
      prior dispatch/RUN attribution without another PRIMARY/Executor invocation; request
      mismatch or malformed/path-unsafe dispatch identity fails closed before PRIMARY.
  - id: AC5
    condition: >
      Deterministic race/restart regressions prove exact dispatch-to-RUN ownership when an
      unrelated same-TASK/same-Executor PRIMARY or distinct dispatch appears between the
      pre-invocation snapshot and this dispatch's admission; uncertain ownership remains
      blocked and non-executing rather than guessed.
  - id: AC6
    condition: >
      An active duplicate returns explicit nonzero IN_PROGRESS without mutating durable
      ownership state in a way that prevents the original invocation from binding its own
      admitted RUN and completing; no second PRIMARY/Executor call or ownership rebind
      occurs.
  - id: AC7
    condition: >
      Crash/restart reconciliation can link an exactly owned dispatch to existing terminal
      RESULT or FAILURE without invoking PRIMARY again, while active/incomplete/zero-or-
      multiple-attribution cases return explicit non-executing in-progress or blocked
      outcomes with no retry, fallback, synthetic terminal artifact, or stale-state
      cleanup.
  - id: AC8
    condition: >
      Existing direct `aios run`, TASK-062 synchronization, repository locking,
      one-Executor dispatch, Runtime verification, correction flows, TASK-071 remote RUN
      namespace/recover-primary behavior, review transport, and TASK-072 publication all
      remain behaviorally unchanged.
  - id: AC9
    condition: >
      Dispatch state remains operational-only; README documents stable dispatch-id and
      restart/no-reexecution semantics; roadmap records A2 as DONE through the published
      current-main integration while A3/A4/A5/A6/A7/A9/A10 remain separately gated.

verification:
  required:
    - python -m pytest tests/test_dispatch_reconciliation.py tests/test_self_hosted_wakeup.py tests/test_operator.py -q
    - git diff --check
