task_id: TASK-174
revision: 1

goal: >
  Harden the provider-neutral pre-verification structural-completion contract so
  Brain-authored TASK acceptance remains truthfully claimable before Runtime
  verification, all admitted native Executors distinguish actual Executor-owned
  incompleteness from merely pending Runtime/Reviewer/Publisher work, successful
  structural claims are affirmative implementation assertions rather than
  non-confirmation statements, and FINALIZE_CANDIDATE can truthfully report an
  incomplete exact candidate without weakening existing Runtime completion or the
  established structural semantics of other REPAIR actions.

problem: >
  Two independent current-lineage Codex PRIMARY executions exposed the same
  completion-contract defect. RUN-172-001 and RUN-173-001 both reached clean,
  transportable, in-scope candidates but stopped at COMPLETION_GATE because Codex
  placed pending Runtime verification into result.unresolved. In both TASKs the
  Brain contract simultaneously prohibited the Executor from claiming Runtime
  verification before it ran while at least one acceptance criterion described a
  post-verification outcome such as a suite being green. Runtime correctly requires
  result.unresolved to be empty and complete TASK acceptance coverage before it
  begins canonical verification, so the authored acceptance boundary and Executor
  handoff were semantically misaligned. TASK-154 r3 previously corrected the same
  class of acceptance-boundary mistake locally, but the Brain TASK Authoring
  Contract never made pre-verification claimability a prospective global authoring
  rule. The native PRIMARY instructions also do not define the semantic domain of
  result.unresolved, leaving an Executor free to treat pending Runtime work as
  implementation incompleteness. A further inconsistency exists for
  FINALIZE_CANDIDATE: its native instruction says an incomplete candidate must
  report truthful unresolved work, while the TASK-080 repair_result_package schema
  globally constrains REPAIR result.unresolved to an empty array and requires at
  least one claim. RUN-173-002 then exposed a related claim-quality gap: its
  FINALIZE_CANDIDATE structural ResultPackage used claims such as "could not be
  confirmed" while mapping those claims to acceptance IDs; Runtime structural
  coverage is intentionally identifier-based and later verification passed, so the
  task was reviewable and was correctly reviewed PASS, but successful structural
  completion should not represent uncertainty or non-confirmation as an affirmative
  implementation claim. TASK-174 must align Brain authoring, native instructions,
  and action-specific structured-output mechanics without moving semantic judgment
  into Runtime, weakening fail-closed completion, or reopening TASK-079/TASK-080
  schemas for unrelated correction actions.

assumptions:
  - >
    Canonical main at TASK-174 authoring is
    24886d99ddc29984348f296192675be164c7bd9c, whose parent engineering source
    includes reviewed/published TASK-173 candidate
    34b662d199d7a1a0bdfd332b2fb9c738b1201158 and whose only later change is the
    Human/Brain roadmap advancement selecting TASK-174.
  - >
    TASK-173 is engineering-complete through RUN-173-002, REVIEW-173-002 PRIMARY
    PASS, publication of 34b662d199d7a1a0bdfd332b2fb9c738b1201158, and Runtime
    evidence RUN-173-002-V001 through RUN-173-002-V003.
  - >
    RUN-172-001 and RUN-173-001 remain immutable COMPLETION_GATE failures whose
    exact Executor diagnostics identified pending Runtime verification as
    result.unresolved; neither failure is rewritten or reclassified by this TASK.
  - >
    TASK-154 r3 is the canonical precedent that rewrote verification-dependent
    acceptance into pre-verification implementation properties while keeping
    Runtime verification and Reviewer judgment in their existing authorities.
  - >
    TASK-079 remains authoritative for the remediation-specific native structural
    schema, including empty result.claims, result.unresolved, and root evidence.
  - >
    TASK-080 remains authoritative for the general REPAIR structural schema:
    non-empty claims, empty result.unresolved, empty root evidence, and empty
    claim.evidence. TASK-174 must not relax that schema for CODE_FIX,
    CONTINUE_IMPLEMENTATION, or other existing ordinary REPAIR paths.
  - >
    FINALIZE_CANDIDATE was added after TASK-080 as a distinct read-only,
    Executor-backed REPAIR action. Its current instruction already requires truthful
    unresolved reporting when the exact candidate is incomplete, but all REPAIR
    actions still select repair_result_package.json.
  - >
    Runtime's current completion behavior is authoritative: structural unresolved
    items fail before verification; complete acceptance coverage is required before
    verification; Runtime then owns canonical verification and EVIDENCE. Runtime is
    not a semantic natural-language judge of whether a claim is affirmative.
  - >
    RUN-173-002's Runtime verification and Reviewer PASS establish TASK-173
    correctness. Its non-affirmative structural claim wording is evidence for
    prospective contract hardening only and must not be used to reinterpret that
    completed review.
  - >
    The existing schemas/*.json package-data rule includes a new schema file under
    src/aios_renew/schemas/ without a pyproject.toml mutation.

