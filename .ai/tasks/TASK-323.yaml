task_id: TASK-323
revision: 1
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
goal: Implement a single-use, immutable-lineage-bound Runtime verification exception
  permitting only the next eligible CODE_FIX REPAIR continuation of TASK-110 r4 after
  RUN-110-006 to use the already-supported conventional/legacy verification execution
  path instead of minimum-sufficient-v2, while preserving independently executed authored
  verification, all safety gates, and ordinary V2 policy for every other lifecycle.
problem: RUN-110-006 is a canonical repair FAILURE on failed candidate 6fa66e27424de6856c54d5e7dbefaf065aad7e89
  after correcting seven former publication test failures. Its minimum-sufficient-v2
  verification executed 728 candidate pytest items (726 passed, 2 failed) and incurred
  8712.75 seconds of Runtime verification including attribution/replay overhead, versus
  270.08 seconds of Executor work. The Human explicitly chose to continue repair using
  conventional/legacy Runtime verification rather than V2 while separately auditing
  the V2 architecture. Current Runtime unconditionally selects V2 from TASK-110 r4,
  so a normal AUTHOR_REPAIR request cannot lawfully change the policy. Provide a reviewed,
  one-time, exact-subject exception rather than silently disabling verification or
  weakening general policy.
assumptions:
- Current canonical main for authoring is 8b37db19ba0d9b5435584fbe48fea72fb1ad23be;
  TASK-323 does not already exist and RUN-110-007 is not currently present on the
  observed remote.
- TASK-110 remains revision 4 on canonical main with verification.policy minimum-sufficient-v2
  and authored commands python -m pytest -q tests/test_publication.py tests/test_brain_attention.py
  tests/test_review_transport.py tests/test_authoring_ingress.py and git diff --check;
  that TASK and its evidence stay immutable.
- RUN-110-006 is a canonical VERIFICATION FAILURE continuing RUN-110-005, with failed_head_sha
  6fa66e27424de6856c54d5e7dbefaf065aad7e89; canonical FAILURE artifact is 2099a6727607e441e09b661ffcb8f8129f87ca22
  on the aios/failure-artifacts/RUN-110-006 branch.
- The only two remaining failed identities are tests/test_publication.py::test_concurrent_main_update_is_not_overwritten
  and tests/test_publication.py::test_compatible_concurrent_main_update_fails_exact_sha_lease;
  a repair strategy must independently diagnose these, not predeclare a semantic outcome.
- The Human explicitly authorizes this single scoped legacy-verification exception
  and separately delegates implementation of TASK-323 to Codex GPT-6.1 Sol xhigh.
  TASK-323 does not change the TASK-110 sticky Executor selection or authorize the
  subsequent REPAIR by itself.
- The existing legacy branch of Runtime verification is still available. Using it
  does not imply that previously recorded 726 passing test observations can satisfy
  the changed candidate's canonical verification.
