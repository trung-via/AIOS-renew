non_goals:
- Modify TASK-110 revision 4, reinterpret or erase RUN-110-006, invent a REPAIR authorization,
  run TASK-110 again from TASK base, or promise the next REPAIR will pass.
- Disable minimum-sufficient-v2 globally, introduce a V3 verification engine, edit
  TASK/REPAIR policy from the chat, or permit an env var, CLI flag, Executor claim
  or generic Issue to bypass canonical Runtime verification.
- Omit any verification.required command for TASK-110, invent an evidence PASS, represent
  prior candidate pass results as proof for a modified candidate, or make an authored
  full-suite optional.
- Make publication, review, roadmap mutation, Executor delegation, correction selection,
  risk acceptance, or retry decisions inside the Runtime exception machinery.
- Modify TASK-110 production publication logic or its failing tests as part of TASK-323;
  that remains a subsequent separately authorized REPAIR.
- Add a general-purpose policy-override router, durable model memory, retry loop,
  or migration of other TASKs or downstream dependencies.
constraints:
  hard:
  - TASK-323 itself must retain verification.policy minimum-sufficient-v2, with bounded
    focused verification and no repository-wide full suite.
  - 'One exceptional eligible subject only: CODE_FIX REPAIR of TASK-110 revision 4
    whose canonical predecessor is RUN-110-006 and whose predecessor FAILURE artifact
    and failed candidate match the exact immutable observed identities above. The
    exception must bind the specific next admitted RUN-110-007 and be invalid for
    all other RUN IDs, tasks, revisions, correction actions, operations, or stale/mismatched
    lineage.'
  - Use an explicitly reviewed canonical, repository-owned fixed authorization artifact
    for the one-shot exception; dynamically supplied user, Executor, Issue, environment,
    task comments or handoff strings are not authorization. Runtime must check trusted
    authorization and canonical identity before changing the effective verifier; no
    extra generic override surface may be created.
  - The exception only selects the existing conventional/legacy verification execution
    path for the exact bound repair completion. All authored TASK-110 commands, exact
    candidate checkout, normal exit status, evidence, integrity/completion and CAS/currentness
    boundaries remain enforced by Runtime.
  - A replay, competing dispatch, second RUN or other correction may not reuse the
    waiver. The admitted exact RUN identity plus immutable execution lineage are the
    single-use witness; do not implement a second independently writable lifecycle-state
    store.
  - Preserve TASK-110 code's existing V2 identity outside this narrowly proven exception.
    Evidence must distinguish the effective legacy mode and reason/authorization so
    review can validate that it ran the expected verifier. No zero-cost or presumed
    success of previously passing 726 items.
  - If any required trusted binding or legacy proof surface cannot be implemented
    within authorized modification scope, fail closed and report the specific missing
    authority; do not silently expand scope.
  - After reviewed/published activation of this TASK, any later AUTHOR_REPAIR of RUN-110-006
    remains a distinct Brain semantic action. This TASK does not automatically create,
    dispatch, review or publish that correction.
acceptance:
- id: AC1
  condition: A canonical, strictly parsed one-shot exception contract identifies only
    TASK-110 r4 / RUN-110-006 and its exact immutable FAILURE/candidate subject, and
    binds exactly one successor RUN-110-007 to the legacy verification path.
- id: AC2
  condition: Runtime derives the effective verifier exclusively from the reviewed
    trusted exception plus exact admitted repair lineage; a correct subject selects
    ordinary verification while mismatched, stale, missing or untrusted subjects fail
    closed or retain their authored V2 policy as appropriate.
- id: AC3
  condition: The exceptional completion executes every unchanged TASK-110 r4 verification.required
    command using the existing conventional verifier and captures normal Runtime evidence
    with an auditable exception binding; it neither uses the V2 attribution engine
    nor treats old pass records as current-candidate proof.
- id: AC4
  condition: Single-use semantics are enforced against replay/competing RUNs and no
    other TASK, PRIMARY, REMEDIATION, DIRECT_CANDIDATE, or unrelated REPAIR can inherit
    the legacy exception.
- id: AC5
  condition: All original Runtime admission, repository integrity, candidate SHA,
    scope, verification failure, RESULT, Reviewer, Publisher, and publication-currentness
    boundaries remain unchanged and fail closed.
- id: AC6
  condition: The exact pre-existing RUN-110-006 FAILURE and 726 PASS / 2 FAIL observations
    remain historical evidence; no automatic REPAIR, new TASK-110 authorization, semantic
    verdict, publication or roadmap change is fabricated by this capability.
- id: AC7
  condition: Focused positive and adversarial regression fixtures exercise exact authorization,
    case mismatch, replay, missing/changed artifacts, preserved V2 for unrelated subjects,
    conventional command execution and failure propagation without any repository-wide
    full suite.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_scoped_verification_exception.py
  - git diff --check
