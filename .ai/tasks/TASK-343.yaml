task_id: TASK-343
revision: 1
goal: Make the Human-selected fixed 12-worker pytest execution profile the default
  for every ordinary AIOS-renew test execution, including minimum-sufficient-v2 affected,
  projected, base, candidate, correction, and direct repository pytest entrypoints;
  retain the existing selected 12-worker full-suite behavior and truthful exact-bound
  Runtime evidence.
problem: Canonical TASK-231 already selected workers=12 for the full-suite wrapper,
  but main b21a50e79afa77230db11019a8a05c597e319dbd still sets workers=1 for non-full-suite
  pytest in src/aios_renew/verification.py::_v2_profile. RUN-342-002 executed its
  598-test authored scope with workers=1 and approximately 6025 verification seconds.
  The prior Human-selected 12-worker policy is not consistently applied to the ordinary
  pytest execution surface. Human now explicitly prioritizes an immediate fixed 12-worker
  default, not an additional benchmark or automated worker tuner.
assumptions:
- This is prospective new Human intent, not correction of RUN-342-002; current canonical
  main at task authoring is b21a50e79afa77230db11019a8a05c597e319dbd. TASK-342 RESULT,
  REVIEW and publication remain immutable. Earlier tasks, commands and evidence stay
  historically bound.
- Human chose 12 fixed workers, load distribution and zero worker restart; .ai/verification-profiles.yaml
  currently records that selection from TASK-231 for full-suite and historical workers=4
  data separately. Do not require fresh 4/8/12/16 measurements or manufacture a new
  performance baseline.
- The prospective change applies to normal execution of pytest test items launched
  within AIOS-renew, including Runtime V2 and developer-invoked pytest under repository
  configuration. Collection-only probes do not execute test items; explicit historical
  performance/diagnostic worker matrices retain their authored worker counts and exact
  semantics.
- The Human's current priority preempts older planning bookmarks for this task. New
  TASK authoring does not itself advance the roadmap or create RUN, review or publication.
  Executor implementation requires separate explicit Human delegation; preserve existing
  manually selected Executor mode until automatic selection is fixed.
- Pytest-xdist availability and 12-worker collection/isolation conformance must be
  proven or fail closed; unsupported test commands and non-pytest verification operations
  must not be silently rewritten.
