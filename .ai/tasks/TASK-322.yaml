task_id: TASK-322
revision: 2
goal: Eliminate the correction-authoring bootstrap defect by making AUTHOR_REPAIR
  and AUTHOR_REMEDIATION resolve their semantic subject from exact immutable correction
  lineage rather than from roadmap NEXT selection, while preserving generic Brain
  Sync planning semantics, Unified State authority, audited correction handoff, and
  all fail-closed correction lineage/CAS gates.
problem: 'TASK-322 r1 established the intended EXACT_CORRECTION_SUBJECT_LINEAGE_V1
  architecture, but RUN-322-001 failed Runtime verification because one newly added
  immutable-identity regression fixture for AUTHOR_REPAIR assumed the canonical failure-artifact
  commit had a parent and called git rev-parse <lineage_sha>^. The repairable failed
  candidate 16f10b108e6d4583879696bd266789b139203bf7 therefore cannot be published,
  while canonical main still contains the pre-fix correction-authoring implementation
  that cannot author REPAIR for this same failure when roadmap NEXT is unauthored.
  r2 is the Human-authorized bootstrap recovery: perform a fresh PRIMARY implementation
  of the same root fix from canonical main, using RUN-322-001/candidate only as non-authoritative
  implementation reference, and correct the fixture so immutable identity movement
  is tested without assuming a parent commit.'
assumptions:
- Canonical main at r2 authoring is f1ea3d89c7027756d3afacf18d2bc65f70b4c69f and contains
  TASK-322 r1 contract but not the failed candidate implementation.
- RUN-322-001 is immutable failed history for TASK-322 r1. Its failure artifact is
  57c4ed3b175724521480811e9849a5a5e535f940 and failed candidate is 16f10b108e6d4583879696bd266789b139203bf7.
- RUN-322-001 candidate is clean, descends from r1 base, stays within r1 scope, and
  is repairable/transportable; it may be inspected as implementation evidence/reference
  but must not act as Runtime, authoring authority, control source, or self-authorizing
  correction path.
- The r1 Runtime failure is confined to the new AUTHOR_REPAIR immutable-identity regression
  fixture using git rev-parse <lineage_sha>^ on a fixture commit that may be parentless.
  Production root-fix semantics were not canonically accepted because verification
  did not PASS.
- r2 must re-establish EXACT_CORRECTION_SUBJECT_LINEAGE_V1 from canonical main through
  a fresh PRIMARY candidate and must not depend on publishing, rebasing, or mutating
  RUN-322-001.
- The current roadmap BO-2/3 planning NEXT remains intentionally unauthored and must
  remain planning-only; generic Brain Sync behavior stays unchanged.
- AUTHOR_REPAIR and AUTHOR_REMEDIATION continue to require the currently published
  two-stage audited handoff; BO-7 remains outside scope.
scope:
  inspect:
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - .ai/roadmap-state.yaml
  - .ai/flow-cards.yaml
  - .ai/tasks/TASK-321.yaml
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/brain_sync.py
  - src/aios_renew/brain_context.py
  - src/aios_renew/decision_packet.py
  - src/aios_renew/unified_state.py
  - src/aios_renew/review_transport.py
  - src/aios_renew/correction_preflight.py
  - tests/test_authoring_ingress.py
  - tests/test_brain_sync.py
  - tests/test_brain_context.py
  - tests/test_decision_packet.py
  modify:
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/brain_sync.py
  - src/aios_renew/brain_context.py
  - src/aios_renew/decision_packet.py
  - tests/test_authoring_ingress.py
  - tests/test_brain_sync.py
  - tests/test_brain_context.py
  - tests/test_decision_packet.py
non_goals:
- Mutate, rewrite, publish, rebase, or otherwise convert RUN-322-001 into a successful
  RUN.
- Use failed candidate 16f10b108e6d4583879696bd266789b139203bf7 as a control plane,
  Runtime source, authoring implementation, or self-authorizing correction path.
- Edit roadmap to bind TASK-322 as a workaround or alter generic planning NEXT semantics.
- Implement BO-2/3 CANONICAL_CONTEXT_PIPELINE_V1 or BO-4/5/6/7/8/9/9A/9B/10, TASK-310,
  or H4.
- Remove or weaken audited_handoff, Stage-1/Stage-2 semantic audit, Decision Packet
  freshness, correction scope/CAS validation, Unified State lifecycle ownership, Reviewer,
  Publisher, or Runtime authority.
- Add heuristic TASK discovery, task scans as authority, Planner/router/memory store/vector
  retrieval/reasoning store.
- Broaden AUTHOR_TASK mutation beyond the TASK document.
constraints:
  hard:
  - 'Re-implement and enforce EXACT_CORRECTION_SUBJECT_LINEAGE_V1 from canonical r2
    main: AUTHOR_REPAIR/AUTHOR_REMEDIATION subject identity comes from exact immutable
    correction lineage, never roadmap NEXT.'
  - RUN-322-001 and failed candidate 16f10b108e6d4583879696bd266789b139203bf7 are
    evidence/reference only; all production code in r2 must be produced by the admitted
    r2 Executor from canonical r2 base.
  - For AUTHOR_REPAIR, failed_run_id only selects canonical failure lineage; reconstruct
    and cross-check TASK id/revision, RUN, failed head, executor/base, repairability/transportability,
    canonical TASK document and Unified State.
  - For AUTHOR_REMEDIATION, source_run_id + finding_id only select canonical RESULT/REVIEW/finding
    lineage; reconstruct and cross-check TASK id/revision, reviewed SHA, finding identity,
    outstanding status and Unified State.
  - Roadmap may remain unauthored, unrelated, or planning-ambiguous without retargeting
    an otherwise exact correction subject; invalid engineering lineage still fails
    closed.
  - 'Generic observe_brain_sync remains unchanged for ordinary planning continuation:
    unique unauthored BO-2/3 NEXT remains UNAUTHORED_TASK/TASK_AUTHORING.'
  - Preserve the current audited correction path; do not implement BO-7 direct-final
    correction ingress early.
  - Fix the immutable-identity regression fixture so it creates a distinct commit
    identity with the same semantic tree without assuming lineage_sha has a parent.
    The test must remain capable of proving packet/audit invalidation when immutable
    canonical identity moves.
  - Regression must cover AUTHOR_REPAIR and AUTHOR_REMEDIATION across unauthored,
    unrelated and split-brain planning shapes, plus stale/malformed/moved correction
    lineage failures.
  - Packet composition/subject reconstruction stay observation-only until ordinary
    ingress mutation authority; no hidden mutation, RUN creation, Executor invocation,
    verification or roadmap mutation.
  - AUTHOR_TASK continues to mutate only .ai/tasks/TASK-322.yaml.
  - Executor may modify only scope.modify; fail closed if another production file
    is required.
acceptance:
- id: AC1
  condition: Fresh r2 candidate implements AUTHOR_REPAIR exact subject reconstruction
    from canonical FAILURE/RUN/TASK/Unified State independently of roadmap NEXT and
    passes unauthored, unrelated and split-brain planning regressions.
- id: AC2
  condition: Fresh r2 candidate implements AUTHOR_REMEDIATION exact subject reconstruction
    from canonical RESULT/REVIEW/finding/TASK/Unified State independently of roadmap
    NEXT and passes corresponding planning regressions.
- id: AC3
  condition: Generic Brain Sync still reports the current unauthored BO-2/3 planning
    NEXT as UNAUTHORED_TASK/TASK_AUTHORING; no automatic association with TASK-321
    or TASK-322 occurs.
- id: AC4
  condition: Wrong/stale/moved/malformed correction refs, TASK/revision/head/executor/base
    mismatches, non-repairable failure, resolved/competing findings and Unified State
    mismatch fail closed before mutation.
- id: AC5
  condition: Correction Decision Packets bind exact selected_task, correction_subject
    immutable identities and Unified State next_action while roadmap remains absent/non-authoritative
    for correction packets.
- id: AC6
  condition: Audited_handoff, Stage-1/Stage-2 audit, packet freshness/CAS and family
    validation remain mandatory; BO-7 direct-final ingress is not introduced.
- id: AC7
  condition: The moved-immutable-identity regression no longer assumes the correction
    artifact commit has a parent, and proves that a semantically identical but identity-distinct
    canonical correction ref invalidates the prior audit for both REPAIR and REMEDIATION.
- id: AC8
  condition: RUN-322-001 remains immutable failed history and its candidate is not
    used as control authority or published as r2; r2 is a fresh PRIMARY descendant
    of canonical r2 task base.
- id: AC9
  condition: All mutations remain within scope.modify, AUTHOR_TASK mutation semantics
    remain unchanged, and no new Planner/router/heuristic task discovery/store/authority
    is added.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_authoring_ingress.py tests/test_brain_context.py
    tests/test_decision_packet.py tests/test_brain_sync.py
  - git diff --check
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
