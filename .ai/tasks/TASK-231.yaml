task_id: TASK-231
revision: 2

goal: >
  Adopt the Human-selected fixed 12-worker ordinary canonical full-suite profile
  for AIOS-renew, replacing workers=4 as the selected profile while preserving
  exact-subject and worker-isolation conformance, historical workers=4 evidence,
  no automatic worker selection, and one Runtime-owned canonical full-suite
  verification surface for the selected 12-worker profile.

problem: >
  TASK-231 r1 correctly expressed the Human decision to select workers=12 and
  produced a transportable candidate, but RUN-231-001 failed at COMPLETION_GATE
  before Runtime verification because AC6 required the Executor RESULT to claim a
  future Runtime verification success. Canonical TASK authoring rules require every
  acceptance criterion to be truthfully claimable as an implementation property
  before Runtime verification. This revision preserves the r1 implementation
  semantics and fixes only that authority/order defect: the implementation must
  expose the exact 12-worker selected profile and fail-closed verification surface;
  Runtime alone later executes the authored verification commands and creates
  canonical evidence.

assumptions:
  - >
    Canonical main at r2 authoring is a4cd51f0b112c250f01d6ed7c41f7737a56df1c9. TASK-231 r1 / RUN-231-001 ended in
    canonical FAILURE at COMPLETION_GATE with failed_head_sha
    8ddc02be58f6e67edf9f465fac3924b6894e593e and no Runtime verification evidence
    because verification_seconds was null.
  - >
    The RUN-231-001 failure is a TASK-contract ordering defect, not evidence that
    workers=12 failed correctness or conformance. The r1 candidate is not published
    and remains subordinate to the new exact TASK revision.
  - >
    Human explicitly selects workers=12 for the ordinary canonical full-suite
    profile on the supported Windows x64 self-host class. This is a Human planning
    decision, not Runtime/Executor/Reviewer inference.
  - >
    Human exploratory timing is planning evidence only. It explains the Human
    selection but is not canonical Runtime verification, EVIDENCE, review truth or
    a performance baseline.
  - >
    TASK-230's 4/8/12/16 measurement family remains available for future explicit
    rebaseline use but is not required for this Human-selected adoption.
  - >
    TASK-176 and RUN-159-008 remain immutable historical workers=4 evidence and must
    not be represented as workers=12 verification evidence.
  - >
    Runtime owns verification execution and EVIDENCE; Reviewer owns semantic
    verdict; Human owns worker selection; Publisher owns publication.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-157.yaml
    - .ai/tasks/TASK-159.yaml
    - .ai/tasks/TASK-161.yaml
    - .ai/tasks/TASK-176.yaml
    - .ai/tasks/TASK-230.yaml
    - .ai/tasks/TASK-231.yaml
    - .ai/verification-profiles.yaml
    - scripts/aios_parallel_full_suite.py
    - scripts/bp_v4_parallel_rebaseline.py
    - src/aios_renew/parallel_verification.py
    - src/aios_renew/verification_profile.py
    - src/aios_renew/verification_contract.py
    - tests/test_verification_profile.py
    - tests/test_parallel_verification.py
    - tests/test_verification_contract.py
  modify:
    - .ai/verification-profiles.yaml
    - scripts/aios_parallel_full_suite.py
    - src/aios_renew/verification_profile.py
    - tests/test_verification_profile.py
    - tests/test_parallel_verification.py

non_goals:
  - >
    Run or require the 4/8/12/16 rebaseline matrix as part of TASK-231.
  - >
    Select, rank, recommend or reconsider the worker count. workers=12 is the
    explicit Human decision for this TASK revision.
  - >
    Modify historical TASK-157/TASK-159/TASK-176 evidence, RUN-159-008,
    TASK-230 measurement grammar, BP-V4 v1 grammar or prior terminal artifacts.
  - >
    Represent Human exploratory benchmarks, RUN-231-001, TASK-230 or RUN-159-008 as
    canonical workers=12 Runtime verification evidence.
  - >
    Add CPU-derived auto workers, adaptive tuning, retry, fallback to another worker
    count or serial, scheduler selection, result-dependent routing or a performance
    database.
  - >
    Add/select a direct Git executable, modify PATH, Git/Defender/host
    configuration, or verification-subject lifecycle.
  - >
    Change Runtime lifecycle, RepositoryLock, Unified State, Reviewer, Publisher,
    transport, frozen Kernel, Research Assurance or downstream-adoption semantics.
  - >
    Require the Executor RESULT to claim Runtime verification success, canonical
    evidence creation, Reviewer verdict, publication or roadmap advancement.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      The selected ordinary canonical full-suite policy must identify exactly
      workers=12, distribution=load and max_worker_restart=0; workers=4 must no
      longer be the selected profile.
    - >
      The repository-owned selected wrapper must expose exactly one canonical
      collection followed by exactly one fixed parallel-12 full-suite execution
      through the existing parallel-verification primitive, with no alternate
      worker, retry or fallback path.
    - >
      Preserve exact-subject cleanliness and post-collection/post-profile subject
      stability checks, deterministic collection identity, worker collection
      agreement, isolated pytest temporary roots, isolated process-local Git fixture
      cache roots, distinct worker process identities and bounded failure
      diagnostics. No conformance gate may be weakened for workers=12.
    - >
      The profile policy must record workers=12 as a HUMAN-selected policy decision
      associated with TASK-231 and must not bind any fabricated Runtime run/evidence
      identity as selection provenance.
    - >
      Preserve RUN-159-008 workers=4 data as explicitly historical context only.
      Until a later explicit canonical workers=12 baseline exists, the selected
      workers=12 profile must have no comparable performance baseline and its soft
      performance guard must report NOT_COMPARABLE rather than WITHIN or ATTENTION.
    - >
      The selected full-suite command surface remains exactly
      'python scripts/aios_parallel_full_suite.py'; TASK-230 rebaseline and
      historical BP-V4 measurement command families remain behaviorally unchanged.
    - >
      A nonzero selected-wrapper execution or any collection/subject/worker
      conformance defect must surface as failure to Runtime. The implementation must
      contain no automatic retry, alternate worker, fallback, skip, xfail,
      suppression, timeout inflation or automatic remediation path.
    - >
      No file outside scope.modify may change.

acceptance:
  - id: AC1
    condition: >
      Repository policy identifies workers=12, distribution=load and
      max_worker_restart=0 as the Human-selected ordinary canonical full-suite
      profile and no longer identifies workers=4 as selected.
  - id: AC2
    condition: >
      The selected wrapper is structurally fixed to one canonical collection and one
      parallel-12 full-suite profile, preserving all existing exact-subject and
      worker-isolation conformance checks with no retry, fallback or alternate
      profile.
  - id: AC3
    condition: >
      Selection provenance records Human authority and TASK-231 identity without
      representing exploratory benchmarks, TASK-230, RUN-159-008 or RUN-231-001 as
      canonical workers=12 verification evidence.
  - id: AC4
    condition: >
      Historical RUN-159-008 workers=4 performance data remains immutable historical
      context and the selected workers=12 performance guard is NOT_COMPARABLE until
      a future explicit canonical workers=12 baseline is bound.
  - id: AC5
    condition: >
      Existing BP-V4 v1, TASK-230 rebaseline family, selected command grammar,
      Runtime/Reviewer/Publisher authority and no-auto-selection semantics remain
      compatible.
  - id: AC6
    condition: >
      The completed implementation exposes a fail-closed workers=12 selected-wrapper
      verification surface whose success requires zero pytest exit status and all
      collection, subject and worker conformance facts to pass, with no code path
      that converts a failed 12-worker execution into success or another profile.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    TASK-231 changes the repository-selected full-suite worker profile itself.
    One exact-subject execution of the selected wrapper at the Human-chosen
    workers=12 is the minimum-sufficient Runtime proof of current full-suite
    correctness, collection identity and worker isolation; a 4/8/12/16 matrix
    would duplicate the already-made Human selection.
  required:
    - python scripts/aios_parallel_full_suite.py
    - git diff --check
