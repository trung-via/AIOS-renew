task_id: TASK-109
revision: 2

goal: >
  Reconcile and close AIOS-renew Downstream Adoption only after the downstream
  repository trung-via/python_complete_agent has completed an explicit reviewed
  migration from its current exact AIOS pin to the exact reviewed and
  source-published AIOS-renew source f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e.
  Preserve downstream isolation: the actual Python Agent pin migration belongs to
  a separate downstream TASK, while this upstream TASK records the completed
  cross-repository adoption evidence and then closes Control-plane Closure with a
  deterministic downstream handoff.

problem: >
  TASK-109 revision 1 would close downstream-adoption based on Python Agent's
  existing TASK-192/TASK-198 baseline and exact pin
  a3b723b49cd65677f548c5694a52a6fc006a9e2a. The Human has now explicitly changed
  priority: before AIOS-renew closes downstream-adoption, Python Agent must migrate
  to the latest exact reviewed and source-published AIOS-renew source currently on
  main. AIOS-renew current main is
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, the reviewed TASK-113 source. Python
  Agent remains pinned to a3b723b49cd65677f548c5694a52a6fc006a9e2a, so revision
  1's completion premise is no longer sufficient. The previous TASK-109 wakeup
  failed in the self-hosted workflow preflight before AIOS execution because the
  runner service could not execute its temporary PowerShell script under the host
  execution policy; no RUN-109 RESULT or FAILURE exists. Therefore this is new
  Human intent requiring TASK revision, not REPAIR or REMEDIATION.

