non_goals:
  - >
    Modify trung-via/python_complete_agent, its dependency files, worker surfaces,
    Brain ingress carrier, roadmap, adoption registry, source, tests, workflows, or
    publication state from this upstream TASK.
  - >
    Pin Python Agent to mutable refs such as main, a branch, or a tag. The migration
    target is the immutable exact SHA
    f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e only.
  - >
    Claim downstream migration is complete merely because upstream main contains a
    capability. Completion requires separate canonical downstream TASK-201 lineage.
  - >
    Automatically port or activate AIOS-renew repository-specific GitHub Issue
    carriers, self-hosted wakeups, terminal-attention workflow, remediation-intent
    workflow, or other outer-automation surfaces in Python Agent. Any downstream
    repository-specific carrier adoption remains separately explicit.
  - >
    Change frozen Kernel semantics, Runtime authority, Executor behavior, semantic
    review, publication, correction semantics, or any A-Series authority.
  - >
    Promote A4, A5, A7, A9, A10, or another separately gated AIOS milestone to NEXT
    after closure merely to keep an upstream NEXT item.
  - >
    Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Downstream isolation is mandatory. TASK-109 may record and reconcile exact
      downstream migration evidence but may never mutate Python Agent or treat
      mutable AIOS-renew main as downstream runtime authority.
    - >
      The required downstream target is exactly
      f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e. A later upstream main movement does
      not silently change this TASK's migration target; changing the target requires
      fresh Human/Brain reconciliation.
    - >
      Do not mark downstream-adoption DONE unless canonical Python Agent TASK-201 has
      semantic PASS and reviewed-source publication and a fresh downstream BRAIN SYNC
      proves the sole active AIOS pin equals the exact target SHA above.
    - >
      When the completion gate is satisfied, preserve every prior DONE
      Control-plane Closure item and provenance unchanged, mark downstream-adoption
      DONE, record repository trung-via/python_complete_agent, migration task
      TASK-201, and exact adopted pin
      f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e as bounded cross-repository
      provenance, and mark active_track_status COMPLETE with zero NEXT items.
    - >
      Do not copy a downstream roadmap NEXT identifier into AIOS-renew as durable
      authority. After closure, one completion_handoff must require fresh BRAIN SYNC
      of Python Agent current main, exact pin, roadmap/adoption state, governance,
      and relevant immutable lineage before following its own canonical priority.
    - >
      Python Agent's current Governance Foundation commitment remains downstream-owned.
      This migration must not be described as completing, cancelling, or superseding
      CHATGPT_PROJECT_CONTRACT_RECONCILIATION.
    - >
      AIOS TASK-106 through TASK-113 availability must not be equated with automatic
      activation of repository-specific outer automation downstream. TASK-201 owns
      the exact downstream adoption classification; TASK-109 only records the final
      migration fact required to close the upstream adoption milestone.
    - >
      Preserve roadmap authority: roadmap state is Human/Brain planning state, not
      Runtime or engineering truth, and never auto-advances from execution, workflow,
      review, publication, or downstream activity.
    - >
      The delta is planning/documentation only and confined to the three authorized
      upstream files. No Python source, tests, workflows, carrier policy, frozen
      governance/kernel artifact, or downstream file may change.
    - Do not push from Executor implementation execution.

acceptance:
