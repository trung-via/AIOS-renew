    condition: >
      After canonical TASK-201 completion is independently proven, .ai/roadmap-state.yaml
      marks downstream-adoption DONE and records trung-via/python_complete_agent,
      migration task TASK-201, and exact adopted AIOS pin
      f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e while preserving all earlier DONE
      provenance unchanged.
  - id: AC2
    condition: >
      Control-plane Closure is explicitly COMPLETE with zero NEXT items only after
      the migration completion gate; no optional AIOS milestone is promoted to NEXT.
  - id: AC3
    condition: >
      docs/AIOS-ROADMAP.md reflects that Downstream Adoption now requires the explicit
      Python Agent migration to exact f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e and
      that upstream repository-specific outer automation is not automatically active
      downstream.
  - id: AC4
    condition: >
      docs/CHATGPT_PROJECT_CONTRACT.md distinguishes mutable upstream main from the
      exact downstream pin, preserves downstream isolation, and requires fresh
      downstream BRAIN SYNC after the completed-track handoff.
  - id: AC5
    condition: >
      Python Agent Governance Foundation and CHATGPT_PROJECT_CONTRACT_RECONCILIATION
      are neither completed nor superseded by this upstream reconciliation.
  - id: AC6
    condition: >
      No downstream repository file or runtime/source implementation is modified by
      TASK-109; required deterministic verification passes, the delta stays within
      the three authorized files, and RESULT contains zero unresolved items.

verification:
  required:
    - >-
      python -c "from pathlib import Path; import yaml; d=yaml.safe_load(Path('.ai/roadmap-state.yaml').read_text(encoding='utf-8')); seq=d['sequence']; x=next(i for i in seq if i['id']=='downstream-adoption'); assert x['status']=='DONE'; assert sum(i['status']=='NEXT' for i in seq)==0; assert d.get('active_track_status')=='COMPLETE'; p=x['completed_by']; assert p['downstream_repository']=='trung-via/python_complete_agent'; assert p['migration_task_id']=='TASK-201'; assert p['downstream_aios_pin']=='f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e'"
    - git diff --check
