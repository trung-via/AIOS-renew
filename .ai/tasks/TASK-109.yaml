    f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e. REVIEW-113-001 is PRIMARY PASS with
    AC1-AC8 PASS and no findings, and this exact reviewed source is published main.
  - >
    Canonical Python Agent main observed during BRAIN SYNC is
    759bbeeb67e8761d21d6b8e9fe8d23b6e734a05d. Its sole active AIOS dependency is
    still a3b723b49cd65677f548c5694a52a6fc006a9e2a under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    The target AIOS source f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e descends
    from the current downstream pin a3b723b49cd65677f548c5694a52a6fc006a9e2a;
    canonical comparison is ahead by 23 commits and behind by 0.
  - >
    Python Agent Governance Foundation remains active and its current canonical NEXT
    is CHATGPT_PROJECT_CONTRACT_RECONCILIATION. The Human explicitly inserts this
    AIOS pin migration ahead of that generic continuation without marking the
    governance milestone complete, cancelled, or superseded.
  - >
    The actual downstream migration will be owned by a separate canonical Python
    Agent TASK-201. TASK-109 does not authorize cross-repository mutation and must
    not be executed to completion until TASK-201 has semantic PASS, source
    publication, and the downstream exact pin is proven to equal
    f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e.
  - >
    TASK-109 revision 1 has no admitted RUN lineage. GitHub Actions workflow run
    34771015150 failed during host preflight before the AIOS wakeup command, and
    canonical RUN-109 RESULT/FAILURE namespaces are empty.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
