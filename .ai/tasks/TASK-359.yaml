task_id: TASK-359
revision: 1
goal: >-
  Reconcile the remaining material native FAILURE transport invariants from reviewed
  but divergent TASK-349 into current published source, without overwriting TASK-358
  diagnostics or retroactively publishing the historical TASK-349 candidate.
problem: >-
  TASK-349 r1 / RUN-349-001 / REVIEW-349-001 PRIMARY PASS produced source
  cb155241dc554864ba193a07fcf36a65d55fb260, divergent from current main.
  Automatic publication recovery cannot integrate its overlapping review_transport.py
  and test_review_transport.py paths. TASK-358 already covers nullable typed native
  exit diagnostics, private projection, historical compatibility and bounded context.
  One still-unreconciled phase-binding invariant remains: canonical main currently
  validates error.exit_code type but does not visibly prohibit a native error.exit_code
  on VERIFICATION or COMPLETION_GATE FAILURE across its private and public validators,
  whereas TASK-349 explicitly restricted native status to EXECUTION. This narrowly
  scoped prospective integration must prove and close that gap without replaying
  old candidate changes or altering historical legitimate evidence.
assumptions:
  - >-
    Authoring base is canonical main ff4749551540591abdf9ec44eea32b36e55082b3
    with TASK-358 source published at 36cf9a97090f315cfe574decd0614a4046947d8b.
    Runtime independently enforces currentness, fresh exact identity and expected-main
    CAS before authoring or later admission.
  - >-
    Historical TASK-349 r1 source cb155241dc554864ba193a07fcf36a65d55fb260,
    RUN-349-001 RESULT artifact a4dc99fc971637356409b267c17796afdbcb74bf
    and REVIEW-349-001 PASS decision 2f484634db1262c7251f4bf0fac857307398f325
    are immutable provenance, not verification or semantic PASS for a new candidate.
    Historical TASK-349 contract exists in that reviewed source, not on current main.
    Its exact old source must never be forcibly merged or represented as included.
  - >-
    TASK-347 was retired by Human planning decision, and TASK-358 remains the
    authoritative reviewed/published replacement for the broader FAILURE diagnostic
    functionality. Only confirmed remaining TASK-349 phase/type/role conformance
    gaps authorize implementation in this TASK.
  - >-
    Human authorizes a new prospective bounded integration. Executor selection,
    RUN creation, Runtime evidence, independent review and publication are separate
    authority boundaries; TASK authoring does not choose an Executor or dispatch.
scope:
  inspect:
    - src/aios_renew/review_transport.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/runtime.py
    - src/aios_renew/operator.py
    - tests/test_review_transport.py
    - tests/test_operator_unified_state.py
    - docs/AIOS-PUBLICATION-END-TO-END-FLOW-v1.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-358.yaml
  modify:
    - src/aios_renew/review_transport.py
    - src/aios_renew/unified_state.py
    - tests/test_review_transport.py
    - tests/test_operator_unified_state.py
non_goals:
  - No cherry-pick, rebase, force-push, semantic merge or re-publication of
    TASK-349's divergent historical candidate.
  - No unauthorized restoration or rewriting of .ai/tasks/TASK-349.yaml,
    existing TASK contracts, REVIEW decisions or historical RUN/RESULT/FAILURE evidence.
  - No redesign of AIOS_PUBLIC_FAILURE_V2, private Runtime evidence, Brain Sync,
    diagnostic categories, native adapter budgets, Executor delegation or publication.
  - No new database, lifecycle router, Reviewer, Publisher, auto-correction/retry,
    new private-log transfer channel or verification-policy cutover.
  - No blanket rejection of historically legitimate private/public FAILURE records,
    verification command exit_code, or unchanged V2 incomplete observations.
constraints:
  hard:
    - >-
      Differentiate error.exit_code native process status from error.verification
      command exit_code. New native error.exit_code is legal only on admitted
      EXECUTION-phase FAILURE, when absent it remains absent, when unknown it
      remains null, and when known it is a strict Python integer (never bool).
      Conflicting phase/type/role combinations must fail closed with truthful
      bounded error semantics at the relevant private/public boundary.
    - >-
      Validate source and public projection roles independently. Forged already
      public, re-redacted private diagnostics, unsafe nested error fields, tampered
      projection digests and mismatched source/subject identities must never become
      admissible merely due to redaction. Preserve original private byte identity.
    - >-
      Retain lawful historical original formats, intact typed safe diagnostic
      categories, quoted pytest selectors, private capture redaction, actual
      verification outcome identity and current exact source binding. Do not
      reclassify any historical RUN as PASS or invalidate valid V2 evidence only
      due to the new prospective V1 task.
    - >-
      First establish a demonstrable positive and negative conformance difference
      using only synthetic fixtures. If canonical source already satisfies every
      scoped invariant, produce an explicit no-change finding rather than making
      a cosmetic change. If a wider contract, additional file or authority change
      is needed, stop with a bounded typed blocker, not a silent scope expansion.
    - >-
      Keep implementation changes within scope.modify and the smallest necessary
      subset. Verify a synthetic real-Git native execution FAILURE transport/
      canonical-reader roundtrip and both malformed and legitimate historical
      counterparts without private local logs or historical re-execution.
    - >-
      Runtime owns minimum-sufficient-v1 verification, exact ordered authored
      commands and canonical evidence. No implicit full suite, duplicated proof,
      old REVIEW reuse as new PASS, or direct push outside Publisher.
acceptance:
  - id: AC1
    condition: >-
      Synthetic EXECUTION FAILURE with native error.exit_code absent, null or a
      strict integer retains exact typed identity and private original bytes
      through lawful new public projection, public re-projection and canonical read.
  - id: AC2
    condition: >-
      Synthetic non-EXECUTION FAILURE cannot smuggle an EXECUTION-only native
      error.exit_code into newly admitted private or public transport, including
      tampered legacy/native projection, while valid VERIFICATION command
      outcome exit_code remains independently readable and authoritative.
  - id: AC3
    condition: >-
      Valid positive and adversarial synthetic fixtures distinguish absent/null
      from bool, float, string, list, map, forged phase, nested private fields,
      unsafe origin, duplicate keys, tampered digests and wrong subject across
      applicable readers and public projector without declassifying captured output.
  - id: AC4
    condition: >-
      The existing real-Git synthetic native EXECUTION FAILURE transport and
      canonical reader path retains exact RUN/TASK/failed-head/candidate identity
      and non-PASS status, while historically legitimate small/V1/V2 FAILURE and
      incomplete observations retain their established lawful read semantics.
  - id: AC5
    condition: >-
      The integration preserves TASK-358's public diagnostic categories,
      origin-bound private source, safe quoted selectors, local Executor read
      boundaries and all unrelated existing transport behavior with focused
      positive and negative regression fixtures.
  - id: AC6
    condition: >-
      Source modifications remain inside exact scope.modify and introduce no
      duplicate authority, transport pipeline, old TASK-349 candidate replay,
      policy change, retroactive terminal mutation or direct publication.
verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_review_transport.py tests/test_operator_unified_state.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
