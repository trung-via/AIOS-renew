task_id: TASK-282
revision: 1
goal: Repair H4A5 durable local-wake eventual-delivery liveness by isolating canonical
  freshness observation budgets per exact attention subject, avoiding redundant retrieval
  of already-proven immutable evidence within one observation, and giving a durably
  admitted retry-safe event a bounded local recheck opportunity without depending
  on GitHub scheduled-workflow timing, while preserving the existing thirty-second
  freshness safety envelope and H4A4 lane semantics.
problem: After TASK-281 reviewed publication, Human-authorized bounded replay of RUN-280-002
  succeeded in publisher workflow 37083846294 and produced exact PUBLICATION_SUCCESS_REQUIRING_HUMAN_BRAIN_PLANNING
  evidence in artifact 11260375137. The direct Publisher handoff and legacy workflow_run
  fallback reconstructed the same deterministic event identity, but both returned
  DEFERRED/CANONICAL_UNKNOWN after approximately the existing thirty-second canonical
  observation budget. CanonicalFreshness currently owns one deadline for the projection
  object used across a whole lane pass, so earlier subjects can consume observation
  time needed by later subjects. GitSources also repeats network fetches for immutable
  SHAs within the same observation. Separately, the durable recovery path relies on
  GitHub schedule */5 for later autonomous drain opportunities; live schedule runs
  37053912495 and 37075944497 proved the recheck implementation works when invoked,
  but no new scheduled run appeared after workflow 37083846294 despite waiting beyond
  one configured interval. H4A5 therefore still lacks a bounded production path from
  durable pre-submit deferral to another local freshness attempt independent of best-effort
  cron.
assumptions:
- Canonical main at authoring is c5f71db05aa9a19b93597db9e7fd029ca1d5da0d.
- TASK-280 direct Publisher-to-local-wake handoff and TASK-281 integrated no-op publication
  replay semantics are reviewed and published and are not reopened by this TASK.
- Publisher workflow 37083846294 completed successfully, exported publication attention
  artifact 11260375137, and its direct and workflow_run fallback paths produced the
  same publication-success event identity.
- The direct and fallback local-wake receipts for that exact event were DEFERRED with
  reason CANONICAL_UNKNOWN; neither receipt proves a ChatGPT user turn.
- Existing scheduled local-wake runs 37053912495 and 37075944497 prove the bounded
  recheck command itself can execute, but GitHub schedule cadence is not treated as
  a correctness SLA.
- Existing publication-success subjects already handled manually by Human/Brain are
  not automatically canonically superseded by chat activity. Any planning reconciliation
  needed to close those old subjects remains a separate Human/Brain planning mutation,
  not transport inference.
