task_id: TASK-403
revision: 1
goal: 'PTE-02: deliver one minimal, authenticated, portable, bounded Post-TASK canonical
  state read for a TASK or exact wake selector, reusing existing Brain Sync and Unified
  State without another lifecycle truth source.'
problem: "PTE-01 TASK-402 r2 is now Runtime-verified, reviewed and Publisher-included\
  \ at main 03b1a493d75051681563ef5bc19eb702da36aaa9. The Human explicitly selected\
  \ PTE-02 next from the approved PTE-01\u219206 plan. Existing observe_unified_state(task_id)\
  \ and observe_brain_sync(task_id) reconstruct canonical lifecycle, and operator\
  \ 'state' offers a local read-only call; but observe_brain_sync(run_id/wake) currently\
  \ returns diagnostic-only OBSERVATION with next_action NONE, the ordinary rendered\
  \ state does not consistently expose the exact artifact locator or one next source,\
  \ and caller-portable bounded Post-TASK view is not demonstrated across direct CLI/provider-neutral\
  \ consumers. Closing this presentation/binding gap must not duplicate the canonical\
  \ reducer, infer semantic REVIEW PASS from RESULT, or drag PTE-03 native log diagnosis\
  \ into PTE-02."
assumptions:
- Human's current explicit intent on 2026-10-22 is to proceed to PTE-02 after separately
  published TASK-402 / RUN-402-003 / REVIEW-402-003. Current published main is 03b1a493d75051681563ef5bc19eb702da36aaa9;
  reviewer decision ref RUN-402-003 is 71c7d25ea36f30ce0121682bba1f775209d043aa. Current
  roadmap planning-only bookmark still states PTE_01_ONLY; this explicit prospective
  PTE-02 selection does not pretend Runtime advanced roadmap. Separately canonicalize
  a Human/Brain planning bookmark before any later generic continuation relies on
  PTE-02; Executor must not edit roadmap.
- Exact PTE-02 WHAT and acceptance boundary are in docs/AIOS-PTE-POST-TASK-DIRTY-RECOVERY-ROADMAP-v1.md,
  canonical active planning track post-task-dirty-recovery-pte-20261022. PTE-03 native
  diagnosis, PTE-04 snapshot, PTE-05 lawfulness, PTE-06 recovery, TASK-401 r3 and
  paused Lean VP are not activated.
- "Source observations: brain_sync.observe_brain_sync(task_id=...) embeds observe_unified_state;\
  \ observe_brain_sync(run_id=...) currently returns EXACT_DIAGNOSTIC_SUBJECT/OBSERVATION\
  \ with next_action NONE; Unified State provides TASK, RUN, candidate, review, next_action/authority/blocker,\
  \ separates RESULT\u2192REVIEW, REVIEW PASS\u2192PUBLICATION and inclusion\u2192\
  DONE; operator.py exposes 'state TASK_ID' CLI; brain_context.compose_brain_work_context\
  \ serializes a provider-neutral snapshot. Existing terminal/review/publication Git\
  \ locators in brain_attention, review_transport and publication own evidence binding.\
  \ Reuse these rather than creating alternate lifecycle reduction."
- "Active TASK_AUTHORING Brain audit is canonical TCA-2 v2 (digest 75f7644caf478f39b50279475b81583df6f894e519951199575873de9dd6a17d).\
  \ CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE challenge exact source API/consumer/legacy\
  \ tests, claimable AC1\u2013AC9, and the possibility of passing tests while returning\
