non_goals:
- No new lifecycle reducer, Planner, DB, scheduler, generic router, alternate Git
  canonical state, autonomous correction selector, Reviewer, Publisher or runtime
  verification owner.
- No PTE-03 source-bound native log fetch or protected private diagnostics; ordinary
  successful RESULT read never crawls raw stdout, stderr or workflow logs.
- No rewriting RUN-401-001/002, TASK-402 terminal/REVIEW/publication, or PTE-01 transport/admission/wake
  semantics. No mutation of inspect-only brain_attention, unified_state, terminal_attention,
  review_transport, publication or workflows.
- No roadmap auto-advancement, future PTE package activation, Lean VP L3-06/G3/G6/L4
  completion, KA-01/G6 consent, Executor dispatch or changes to downstream pins.
- No synthesizing ACTIVE from carrier/wakeup acceptance, no RESULT-as-REVIEW-PASS,
  no review metadata generated by Brain and no fabricated publication proof. No weakening
  tests/AST/API guards.
constraints:
  hard:
  - Use observe_brain_sync, observe_unified_state and existing exact Git terminal/review/publication
    locators as the sole truth owners. Any new Post-TASK surface is a bounded read-only
    view with one authenticated snapshot and no independent lifecycle-state machine.
    Where the existing API already satisfies an AC, reuse it unchanged.
  - Keep original public direct-call APIs of brain_sync, brain_context and operator
    state intact. Preserve existing provider-neutral Work Context, Flow Cards and
    Decision Packet consumers, import/AST guards and current test expectations. Extend
    public behavior only additively where necessary; preserve selector provenance
    and cross-revision/task binding.
  - New read may accept explicit authenticated TASK identity or bounded admitted wake
    selectors only. Prove exact TASK/RUN/artifact/review ref currentness at read;
    reject spoofed, stale, moved, duplicate, opposite terminal, cross-task/cross-origin,
    arbitrary URL/path and ambiguous selector. Do not use user-supplied source SHA
    as an authenticated fact.
  - Bound the portable Post-TASK payload and locators (including source identity and
    error codes), redact sensitive local paths, tokens, raw captures or workflow private
    output. Preserve UNKNOWN/UNAVAILABLE/BLOCKED as appropriate; never hallucinate
    an artifact, reviewer decision, publication inclusion or exact next source.
  - Report one exact current TASK revision, attributed RUN (when verified), terminal
    ACTIVE/RESULT/FAILURE or explicit unresolved, next_action, authority, blocker,
    candidate/failure/artifact identities, REVIEW and Publisher inclusion only with
    actual canonical proof, and one next exact safe data locator only when the projection
    is insufficient. No ordinary RESULT raw-log crawl.
  - Prove a real read-only caller across the existing Operator CLI and provider-neutral
    work-context or equivalent maintained caller, including detached/read-only repo
    execution; not merely a mocked local helper. Execution/wakeup transport remains
    subordinate; do not add a second Chat delivery path.
  - All changes constrained to the seven files in scope.modify. If a required contract
    or legacy regression forces a change to an inspect-only file, stop with a bounded
    blocker rather than silently broadening scope. No test skip/xfail/deletion, no
    root lock and no destructive Git operation.
  - "Use minimum-sufficient-v1 with the two exact required verification commands;\
    \ no full suite. Executor reports a clean committed candidate, truthful complete\
    \ claims covering AC1\u2013AC9 and unresolved blockers instead of an invented\
    \ PASS. Runtime alone validates/creates RESULT/EVIDENCE, Reviewer judges, Publisher\
    \ publishes. No automatic roadmap advancement."
acceptance:
- id: AC1
  condition: Given a canonical authenticated TASK selector, Post-TASK state returns
    a single bounded versioned projection bound to the exact current TASK revision
    and canonical main with existing Unified State lifecycle_state, attributed RUN,
    next_action, authority and blocker; no second reducer or guessed status. Explicit
    fresh TASK before a RUN is distinguishable from an admitted RUN.
- id: AC2
  condition: Given an exact authenticated RESULT or FAILURE wake selector, the view
    independently binds RUN/TASK/revision/terminal SHA and correctly joins the existing
    TASK Unified State; invalid, opposite-terminal, mismatched RUN/TASK/head/affinity,
    missing candidate where required, stale or conflicting refs fail closed with typed
    UNKNOWN/BLOCKED rather than attributing a foreign RUN or fabricating a canonical
    terminal.
- id: AC3
  condition: The projection distinguishes ACTIVE, RESULT, FAILURE, REVIEW pending,
    REVIEW PASS and actual Publisher inclusion according to existing canonical lineage.
    Runtime RESULT with no independent REVIEW remains SEMANTIC_REVIEW and is never
    reported as Reviewer PASS; a PASS decision not included in main is never marked
    DONE/published.
- id: AC4
  condition: The bounded view provides exact source-bound candidate SHA, terminal
    artifact SHA and review-decision/published source SHA where established; absent/unproven
    data are explicit null/UNKNOWN with stable reason. It uses canonical exact ref
    readers/ancestry and does not infer publication from action workflow/carrier success.
- id: AC5
  condition: When the current state is insufficient, return at most one exact authorized
    next safe source/ref needed for the current Brain decision, with reason and identity.
    Ordinary RESULT or DONE requires no private raw-log crawl. FAILURE retains a source-bound
    handoff to existing bounded diagnostic/detail readers, and no protected raw path
    is exported.
- id: AC6
  condition: Provider-neutral serialized Post-TASK output is bounded and redacted,
    has one request-scoped source/currentness witness, and resists stale snapshots,
    moved refs, substitution, untrusted URLs/paths, oversized response or privacy
    leaks. Unknown or unavailable Git sources produce honest typed blockers without
    fallback truth or repeated unconstrained scans.
- id: AC7
  condition: An actual maintained Operator read-only CLI/caller emits the projection
    for exact TASK and supported wake inputs; a detached/read-only repository and
    provider-neutral Brain Work Context consumption remain compatible. End-to-end
    caller/codec tests use real Git ref fixtures or subprocess entrypoint, not only
    mock helper invocation, and preserve existing state command output.
- id: AC8
  condition: "Regression fixtures cover authentic TASK-402-style RESULT\u2192REVIEW\u2192\
    publication and RUN-401-002-shaped artifact-only dirty FAILURE, active/no-result,\
    \ forged source/other TASK, competing/moved ref, stale wake, incomplete review\
    \ and misleading carrier acceptance, without changing PTE-01 behavior or historic\
    \ canonical data."
- id: AC9
  condition: 'Post-TASK read and caller integration are strictly observational: no
    new TASK/RUN/REPAIR/REMEDIATION/REVIEW/PUBLISH, mutation, restart, autonomous
    strategy, Flow Router, extra state store, token/raw-log leakage or roadmap auto
    NEXT. Existing Unified State, task APIs, CLI and negative AST/import tests remain
    compatible, and already-satisfied behaviors are not needlessly reimplemented.'
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_brain_sync.py tests/test_brain_context.py tests/test_operator_human_surface.py
  - python -m pytest -q tests/test_operator.py tests/test_terminal_attention.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
