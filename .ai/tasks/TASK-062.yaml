task_id: TASK-062
revision: 1

goal: >
  Remove the repeated Human `git pull --ff-only origin main` handoff before PRIMARY
  execution by making the Human-facing `aios run` path safely synchronize a clean local
  `main` to its configured upstream `main` before TASK loading and RUN admission. The
  admitted RUN must bind to the synchronized repository state and must never continue
  under stale pre-sync kernel code.

problem: >
  After Brain publishes a TASK or reviewed implementation, the Human currently has to
  manually fast-forward the local AIOS-renew checkout before starting the next PRIMARY
  RUN. This is repetitive coordination work with no semantic value. Simply inserting a
  pull inside an already-loaded operator is not sufficient, because a fast-forward can
  update the kernel source itself while the current Python process still holds stale
  imported code. The Human-facing launch path therefore needs a deterministic,
  fail-closed pre-admission synchronization boundary that removes the manual pull while
  preserving exact SHA binding and one-active-execution authority.

assumptions:
  - >
    Current canonical AIOS-renew main before TASK-062 authoring is
    d6d8945e4b6ce7422cf6422fa3b3b87340925638.
  - >
    TASK-061 is semantically reviewed PASS and published at
    d6d8945e4b6ce7422cf6422fa3b3b87340925638.
  - >
    Human explicitly authorizes automatic safe fast-forward synchronization before a
    new PRIMARY `aios run` so that a separate manual pull command is unnecessary.
  - >
    Human separately authorizes automatic publication after semantic PASS; durable
    repo-native PASS publication is intentionally deferred to a separate TASK because
    it owns a different post-review mutation authority.
  - >
    Existing exactly-one Executor authority, Runtime-owned verification, 60-minute
    native response budget, 65-minute watchdog, deterministic executor model defaults,
    no-retry/no-fallback semantics, correction lineage, and frozen artifact authority
    remain unchanged.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-059.yaml
    - .ai/tasks/TASK-061.yaml
    - src/aios_renew/operator.py
    - tests/test_operator.py

  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py

non_goals:
  - Implement automatic post-review publication or mutate remote `main`.
  - Change REVIEW semantics, semantic review authority, or publication eligibility rules.
  - Auto-sync REMEDIATION, REPAIR, direct-candidate acceptance, or any correction flow whose required HEAD is not current main.
  - Infer or change the selected Executor when the Human-facing command reaches canonical operator admission.
  - Add automatic merge, rebase, reset, stash, checkout recovery, conflict resolution, retry, fallback, reroute, or force-update behavior.
  - Add background polling, daemons, schedulers, GitHub Actions, or external orchestration services.
  - Change downstream repositories, downstream dependency pins, or user-global Git configuration.
  - Change TASK-058 or the remote remediation finding-id collision defect.
  - Perform unrelated refactoring or cleanup.
  - Push from executor execution.

constraints:
  hard:
    - >
      Automatic synchronization applies only to a new PRIMARY `aios run` and must
      complete before TASK loading, RUN creation, base SHA binding, or native Executor
      invocation. No network synchronization may mutate repository state after the RUN
      has been admitted.
    - >
      Automatic synchronization may advance the local checkout only when the worktree
      is clean, the current branch is `main`, a unique configured upstream for that
      branch resolves to upstream `main`, and the upstream commit is either equal to or
      a descendant of local HEAD. If any condition is false, admission must fail closed
      before a RUN exists and before an Executor is invoked.
    - >
      When upstream `main` is ahead, synchronization must be fast-forward-only. AIOS
      must never merge, rebase, reset, stash, discard, overwrite, force-update, or
      otherwise reinterpret local repository work in order to synchronize.
    - >
      If synchronization advances kernel source or TASK state, the invocation that
      proceeds to admission must execute the synchronized kernel code and load the TASK
      from the synchronized checkout. Continuing a PRIMARY RUN with stale pre-sync
      imported code is forbidden; if safe continuation under synchronized code cannot
      be established, fail closed before RUN admission.
    - >
      Synchronization must respect one-active-mutation authority. It must not mutate the
      checkout while another AIOS operation owns the repository, and the base SHA bound
      at admission must still equal the successfully synchronized main state; any race
      or intervening state change must fail closed.
    - >
      A local `main` that is ahead of or diverged from upstream, a detached/non-main
      checkout, dirty worktree, missing/ambiguous upstream, fetch failure, or unsafe
      reload/restart condition must remain untouched except for non-mutating fetch
      metadata and must produce an explicit admission error with no RUN and no native
      invocation.
    - >
      Existing PRIMARY execution semantics after successful admission remain unchanged,
      including exact one Executor invocation, Runtime verification, RESULT/FAILURE
      handling, TASK-059 interruption behavior, TASK-060 timing policy, TASK-061 model
      defaults, transport, and no-push behavior.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic regression with clean local `main` strictly behind its configured
      upstream proves Human-facing PRIMARY launch fast-forwards before TASK loading and
      admission, and the resulting RUN base SHA equals the synchronized upstream main SHA.
  - id: AC2
    condition: >
      A deterministic regression with local `main` already equal to upstream proves the
      preflight is a no-op on committed repository state and PRIMARY admission proceeds normally.
  - id: AC3
    condition: >
      Deterministic regressions for dirty worktree, local-ahead, diverged, detached or
      non-main checkout, missing/ambiguous upstream, and fetch/synchronization failure
      prove fail-closed behavior with no RUN creation and no Executor invocation.
  - id: AC4
    condition: >
      A regression where synchronization advances source/TASK state proves admission
      cannot continue under stale pre-sync kernel state and the TASK consumed by the RUN
      is the synchronized canonical TASK.
  - id: AC5
    condition: >
      REMEDIATION, REPAIR, and direct-candidate/correction paths retain their existing
      exact-HEAD lineage behavior and do not auto-fast-forward to upstream main.
  - id: AC6
    condition: >
      Synchronization regressions prove no merge, rebase, reset, stash, force update,
      automatic conflict resolution, retry, fallback, or remote-main mutation is introduced.
  - id: AC7
    condition: >
      Existing PRIMARY admission, exactly-one dispatch, Runtime verification, 60/65
      timing, interruption terminalization, deterministic model defaults, transport,
      and failure semantics continue to pass affected operator regression coverage.

verification:
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check
