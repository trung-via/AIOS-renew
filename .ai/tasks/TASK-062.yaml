task_id: TASK-062
revision: 2

goal: >
  Remove the repeated Human manual fast-forward handoff before a new PRIMARY run by
  making the Human-facing AIOS launch synchronize a safe local main to its configured
  upstream main before TASK loading and RUN admission, while delegating repository
  integration to one native Git fast-forward-only operation instead of reimplementing
  Git ref/index/worktree transactions inside AIOS.

problem: >
  TASK-062 revision 1 attempted to provide safe pre-admission synchronization with a
  hand-built read-tree/update-ref transaction plus rollback. The admitted lineage
  reached REVIEW-062-004 BLOCKED because the contract simultaneously required exact
  restoration after restoration itself failed and prohibited retry/fallback/recovery;
  later candidate logic introduced restoration retries and therefore violated AC6 while
  still being unable to guarantee exact pre-sync state after unrecoverable lower-level
  failure. The Human goal remains valid: remove the manual pull step without creating
  retry loops or letting a PRIMARY RUN admit under stale or uncertain repository state.

assumptions:
  - >
    Canonical main at revision-2 authoring is
    49ee38b94d7100367d3e50d9c3ac101b07440bf0 and contains the TASK-062 revision-1
    contract but no published TASK-062 implementation.
  - >
    RUN-062-005 candidate 994a7c63ad76763f371c528ddff19f69b24ac6f8 is not published;
    REVIEW-062-004 is canonical BLOCKED with AC3 and AC6 failed.
  - >
    Human explicitly approved revising TASK-062 rather than continuing the blocked
    revision-1 remediation loop.
  - >
    Native Git is the deterministic repository authority for fast-forward-only branch
    integration. AIOS must validate and observe that operation, not recreate its
    internal transaction or promise recovery from arbitrary filesystem/ref corruption.
  - >
    Existing exactly-one Executor authority, Runtime-owned verification, TASK-059
    interruption semantics, TASK-060 timing policy, TASK-061 deterministic model
    defaults, correction lineage, transport, and frozen artifact authority remain
    unchanged.
  - >
    Automatic post-review publication remains deferred to a separate TASK.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-059.yaml
    - .ai/tasks/TASK-061.yaml
    - .ai/tasks/TASK-062.yaml
    - src/aios_renew/operator.py
    - tests/test_operator.py

  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py

non_goals:
  - Implement automatic post-review publication or mutate remote main.
  - Auto-sync REMEDIATION, REPAIR, direct-candidate acceptance, or any correction flow whose required HEAD is not current main.
  - Implement a custom read-tree/update-ref synchronization transaction or custom rollback protocol.
  - Add automatic retry of fetch, fast-forward integration, restoration, Executor execution, fallback, reroute, or force-update behavior.
  - Add automatic merge commits, rebase, reset, stash, checkout recovery, conflict resolution, or destructive cleanup.
  - Infer or change the selected Executor.
  - Add background polling, daemons, schedulers, GitHub Actions, or external orchestration services.
  - Change TASK-058, remote remediation finding-id resolution, downstream repositories, downstream pins, or user-global Git configuration.
  - Perform unrelated refactoring or cleanup.
  - Push from Executor execution.

constraints:
  hard:
    - >
      Synchronization applies only to a new PRIMARY Human-facing launch and must finish
      before TASK loading, RUN creation, base-SHA binding, or native Executor invocation.
      No network or branch synchronization may mutate repository state after admission.
    - >
      Before any integrating mutation, AIOS must deterministically require a clean
      worktree, attached local branch main, exactly one configured upstream resolving to
      upstream main, and ancestry that is either equal or local-behind-upstream. Dirty,
      detached, non-main, missing/ambiguous upstream, local-ahead, or diverged states
      must fail before RUN creation and before Executor invocation.
    - >
      When local main is behind, AIOS may perform exactly one native Git
      fast-forward-only integration attempt under the repository mutation lock. AIOS
      must not implement the integration with direct ref/index/worktree plumbing and
      must not retry the integration if it fails.
    - >
      Successful synchronization is established only when the native Git operation
      succeeds and postconditions prove HEAD equals the resolved upstream commit, main
      remains attached, and the worktree/index are clean. The base SHA admitted to the
      RUN must equal that synchronized HEAD.
    - >
      If the native fast-forward operation does not complete successfully, no RUN may
      be created and no Executor may be invoked. AIOS may inspect repository state but
      must not automatically restore, reset, retry, force-update, stash, merge, rebase,
      or otherwise reinterpret the checkout. If the exact safe pre-sync state is no
      longer established after the failed native operation, surface an explicit
      repository-integrity BLOCKED admission diagnostic and stop further mutation.
    - >
      If successful synchronization changes kernel source or TASK state, the invocation
      that proceeds toward admission must transfer control exactly once to synchronized
      kernel code before TASK loading/admission. Stale pre-sync imported code may not
      create a RUN. Guard against process-reentry loops; this control transfer is not an
      Executor retry or a second canonical execution.
    - >
      Synchronization must respect one-active-mutation authority. Fetch/integration and
      admission state checks must be protected so an intervening local mutation or ref
      race cannot silently change the base SHA selected for the RUN.
    - >
      Existing PRIMARY semantics after successful admission remain unchanged, including
      exactly one Executor invocation, Runtime verification/evidence, 60/65 timing,
      interruption terminalization, TASK-061 deterministic model defaults, transport,
      and no-push behavior.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic regression with clean local main strictly behind its unique
      configured upstream main proves the Human-facing PRIMARY launch performs one
      native fast-forward-only synchronization before TASK loading/admission and binds
      the resulting synchronized upstream SHA as RUN base_sha.
  - id: AC2
    condition: >
      A deterministic regression with local main already equal to upstream proves the
      synchronization preflight makes no committed/worktree change and PRIMARY
      admission proceeds normally.
  - id: AC3
    condition: >
      Deterministic regressions for dirty worktree, local-ahead, diverged, detached,
      non-main, missing/ambiguous upstream, and fetch/precondition failure prove no
      integrating mutation, no RUN creation, and no Executor invocation.
  - id: AC4
    condition: >
      Deterministic regressions for native fast-forward failure prove there is exactly
      one integration attempt, no retry/fallback/recovery mutation, no RUN creation, and
      no Executor invocation; unchanged safe state produces an admission error, while
      any post-failure state that cannot be proven safe produces an explicit
      repository-integrity BLOCKED diagnostic.
  - id: AC5
    condition: >
      A regression where successful synchronization advances kernel source and TASK
      state proves stale pre-sync code cannot admit a RUN and control transfers once to
      synchronized code that loads the synchronized canonical TASK and binds its SHA.
  - id: AC6
    condition: >
      REMEDIATION, REPAIR, and direct-candidate/correction paths retain their existing
      exact-HEAD lineage behavior and do not auto-fast-forward to upstream main.
  - id: AC7
    condition: >
      Synchronization regressions prove AIOS introduces no hand-built read-tree/update-ref
      transaction, rollback loop, automatic retry, fallback, merge commit, rebase, reset,
      stash, force update, automatic conflict resolution, or remote-main mutation.
  - id: AC8
    condition: >
      Existing PRIMARY admission, exactly-one dispatch, Runtime verification, 60/65
      timing, interruption terminalization, TASK-061 deterministic executor model
      defaults including Antigravity gemini-3.8-flash/high, transport, and failure
      semantics continue to pass affected operator regression coverage.

verification:
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check
