task_id: TASK-188
revision: 1

goal: >
  Implement BP6-P3 as one pure, bounded, provider-neutral
  AIOS_REVIEW_REQUEST v1 / AIOS_REVIEW_DECISION v1 protocol that binds the
  exact SEMANTIC_REVIEW Decision Packet plus the reviewed P1A/P1B/P2A/P2B
  packages, keeps REVIEW and finding identities outside provider authorship,
  deterministically reconstructs one transient canonical REVIEW candidate,
  validates it through existing review.validate_review, and leaves provider
  invocation and canonicalization to BP6-P4 and existing SUBMIT_REVIEW ingress.

problem: >
  BP6-P1A supplies exact semantic review scope, BP6-P1B supplies complete
  bounded implementation material, BP6-P2A supplies the Reviewer judgment
  procedure and BP6-P2B supplies the identity-free provider semantic return
  grammar. AIOS still lacks one deterministic semantic envelope that binds
  those exact inputs into a self-sufficient repository-blind Reviewer request
  and transforms one bounded provider semantic response into a validated
  transient REVIEW decision. Without P3, each Reviewer adapter would need to
  invent request identity, DELTA prior-review context, canonical review/finding
  identity binding, REVIEW reconstruction or validation handoff. P3 must
  centralize only those deterministic protocol mechanics without becoming a
  second Reviewer, lifecycle reducer, provider router, ingress or Publisher.

assumptions:
  - >
    Canonical main 06b019b2e03a01dadeb5522383c5340c154ac199 records BP-6
    Reviewer Provider Protocol as current, BP6-P1A/P1B/P2A/P2B
    reviewed/published complete through TASK-184/TASK-185/TASK-186/TASK-187,
    and BP6-P3 as the unique NEXT implementation obligation.
  - >
    TASK-187 r1 completed through RUN-187-001, Runtime evidence
    RUN-187-001-V001 with 54 focused tests passing, REVIEW-187-001 PRIMARY
    PASS and exact publication of
    860e8d86a4fef08671a487e8e670804b8dc41ed9.
  - >
    Existing Decision Packet SEMANTIC_REVIEW projection remains authoritative
    for the current bounded review subject and already contains the canonical
    Task contract, current RESULT projection, Executor claims and bounded
    Runtime evidence summaries.
  - >
    Existing observe_semantic_review_scope is authoritative for P1A lifecycle
    scope identity; validate_review_material_package is authoritative for P1B
    material package integrity; select_reviewer_procedure is authoritative for
    P2A procedure/profile selection; parse_reviewer_semantic_body is
    authoritative for P2B provider semantic-body grammar.
  - >
    Existing Task/Result/Review contracts and review.validate_review remain
    canonical validators. Existing SUBMIT_REVIEW ingress alone may
    canonicalize the transient REVIEW candidate produced by P3.
  - >
    BP6-P4 owns Reviewer provider invocation, operational attribution and
    non-network adapter conformance. BP-7 owns hot-swap proof and BP-8 owns a
    controlled real non-default provider proof.

