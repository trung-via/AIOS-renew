task_id: TASK-313
revision: 2
goal: Simplify AUTHOR_TASK canonical mutation so Runtime admits the final TASK contract
  directly without serialized Brain audit handoff plumbing, while preserving all canonical
  validation, provenance, CAS, replay, and mutation-safety guarantees.
problem: 'TASK-313 r2 preserves the complete BO-1 AUTHOR_TASK direct-final-contract
  semantics of r1 and changes only the Brain-owned verification envelope. TASK-313
  r1 remained bound to minimum-sufficient-v1 plus the selected repository-wide full
  suite even after MINIMUM_SUFFICIENT_VERIFICATION_V2 and TASK-319 were reviewed and
  published. RUN-313-006 therefore re-entered the obsolete full-suite path and failed
  in verification infrastructure before producing useful BO-1 evidence. The Human
  explicitly retires that r1 verification requirement for continuation: do not repair
  or re-prove the obsolete V1/full-suite path merely to finish BO-1. Re-author the
  same TASK semantics under focused minimum-sufficient-v2 verification.'
assumptions:
- Canonical main at TASK-313 revision-2 authoring is 4cfc5899c503fad767f908ab8c0b4d52c85fb483;
  BO-1 remains the unique Human/Brain planning NEXT.
- 'Human decision 2026-10-08: TASK-313 r1 verification is historical and must not
  be repaired or re-proven as a prerequisite for r2; r2 uses focused minimum-sufficient-v2.'
- TASK-313 r1 and RUN-313-001 through RUN-313-006 remain immutable historical lineage.
  Revision 2 does not rewrite, delete, relabel or reinterpret those RUNs.
- TASK-314 r1 / RUN-314-002 / REVIEW-314-002 PASS remains a closed reviewed and published
  structural-package capability. Its valid evidence is reused as historical capability
  truth and is not a TASK-313 r2 verification prerequisite that must be re-proven.
- TASK-316 r5 and TASK-319 established the current minimum-sufficient-v2 verification
  baseline/hardening; Runtime remains authoritative for deriving, executing, attributing
  and binding verification inside the authored r2 envelope.
- Human selected Codex GPT-6.1 Sol xhigh for the entire TASK-313 lifecycle; that delegation
  persists through TASK-313 revisions unless Human changes it.
- TASK-313 remains the bounded transition TASK that may use the currently published
  legacy audited AUTHOR_TASK ingress while implementing its retirement; the final
  published BO-1 behavior still has one direct-final-contract AUTHOR_TASK path.
- Brain two-stage semantic audit remains mandatory as CONSTRUCT then ADVERSARIAL_AUDIT_AND_RECONCILE,
  but audit support material is not canonical engineering truth or a second mutation
  authority.
scope:
  inspect:
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
  - docs/AIOS-BRAIN-RUNTIME-SEMANTIC-HANDOFF-HARDENING-v1.md
  - docs/AIOS-BRAIN-SEMANTIC-AUDIT-PROTOCOL.md
  - docs/AIOS-BRAIN-OPTIMIZATION-ROADMAP-v1.md
  - .ai/brain-return-contracts.yaml
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/origin_authoring_proof.py
  - src/aios_renew/github_issue_ingress.py
  - tests/test_authoring_ingress.py
  - tests/test_github_issue_ingress.py
  - tests/test_github_issue_ingress_workflow.py
  - tests/test_origin_bootstrap.py
  modify:
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
  - docs/AIOS-BRAIN-RUNTIME-SEMANTIC-HANDOFF-HARDENING-v1.md
  - src/aios_renew/authoring_ingress.py
  - tests/test_authoring_ingress.py
  - tests/test_github_issue_ingress.py
  - tests/test_github_issue_ingress_workflow.py
  - tests/test_origin_bootstrap.py
non_goals:
- Reduce or remove the Brain two-stage semantic audit procedure itself.
- Change AUTHOR_REMEDIATION or AUTHOR_REPAIR audited-handoff requirements; BO-7 owns
  that separate audit.
- Implement BO-2 through BO-9, TASK-310, H4 rendezvous/continuation behavior, Reviewer
  changes, Publisher changes, or provider-payload optimization.
- Weaken TASK schema/revision validation, verification policy, return-affinity preservation,
  expected-main CAS, origin-authoring provenance, carrier/envelope binding, replay/idempotence,
  unrelated-delta rejection, or mutation conflict fail-close.
- Create a Planner, generic lifecycle router, automatic correction selector, retry/failover
  authority, second semantic state store, or direct TASK-file mutation bypass.
- Advance roadmap phase status or claim BO-1 closure, Runtime verification, semantic
  Review PASS, or publication from Executor output.
- Repair, preserve, or re-prove minimum-sufficient-v1 or the TASK-313 r1 repository-wide
  full-suite requirement solely to obtain BO-1 completion.
- Use TASK-314 r1 as a fresh r2 proof obligation; its reviewed/published capability
  remains historical evidence unless relevant state invalidates it.
- Claim repository-wide full-suite greenness from TASK-313 r2 focused minimum-sufficient-v2
  verification.
constraints:
  hard:
  - After the candidate is published, AUTHOR_TASK canonical mutation must not require,
    reconstruct, validate, fingerprint, or freshness-recheck AIOS_AUDITED_AUTHORING_HANDOFF,
    Decision Packet, Stage-1/Stage-2 material, acceptance_phase_ledger, or TASK_AUTHORING
    audit-support sections.
  - 'AUTHOR_TASK must have one unambiguous production ingress path: a supplied audited_handoff
    is rejected rather than silently accepted or ignored.'
  - AUTHOR_TASK must continue to validate the final TASK payload directly, including
    exact identity/revision continuity, minimum-sufficient verification policy, authored
    return-affinity rules, expected-main currentness, and unrelated-delta constraints.
  - New revision-1 ORIGIN_AFFINE TASKs must still require independently admitted origin_authoring_proof
    with existing exact carrier-attempt, TASK id, expected-main, route/generation,
    envelope-digest, HMAC, freshness, replay and same-attempt-idempotence semantics;
    legacy and revisions retain their existing separation.
  - Final canonical publication must remain guarded by expected-old-main compare-and-swap
    and must fail closed on concurrent mutation or any direct validation/provenance
    conflict.
  - AUTHOR_REMEDIATION and AUTHOR_REPAIR retain their current audited handoff, canonical
    reconstruction, correction-lineage and freshness validation in this TASK.
  - 'Normative documentation must converge on one rule: two-stage Brain audit remains
    semantic authoring discipline, while AUTHOR_TASK Runtime mutation authority validates
    the final TASK contract and canonical/provenance bindings directly; historical
    H1/H3 statements are marked superseded for AUTHOR_TASK only, not silently rewritten
    as historical fact.'
  - Executor changes only scope.modify and leaves BO-2+, TASK-310/H4, roadmap progression,
    Reviewer verdict and Publisher publication to their owning authorities.
  - TASK-313 r2 verification must not author python scripts/aios_parallel_full_suite.py
    as a mandatory guard. Runtime may deterministically derive or reuse evidence only
    inside the focused minimum-sufficient-v2 envelope below.
  - Removing the r1 full-suite requirement changes verification cost/selection only;
    it must not weaken BO-1 production semantics, acceptance criteria, scope, provenance,
    CAS, replay, correction separation, Reviewer or Publisher boundaries.
  - Historical TASK-314 evidence is reused until relevant state invalidates it; do
    not rerun TASK-314 or require its 692-test proof as a TASK-313 r2 completion condition.
acceptance:
- id: AC1
  condition: AUTHOR_TASK canonicalization succeeds for a valid new or revised TASK
    envelope without audited_handoff and reaches mutation using only direct final
    TASK validation plus existing canonical/provenance guards.
- id: AC2
  condition: AUTHOR_TASK rejects a supplied audited_handoff so the post-transition
    Runtime exposes one direct-final-contract production mutation path instead of
    a legacy dual path.
- id: AC3
  condition: AUTHOR_TASK no longer calls or depends on Decision Packet composition,
    Stage-1/Stage-2 validation, audit fingerprints, acceptance_phase_ledger validation,
    or audited authoring freshness reconstruction.
- id: AC4
  condition: 'Direct TASK safeguards remain effective: malformed contract, identity/revision
    conflict, non-minimum verification policy, affinity violation, stale expected
    main, unrelated delta, and concurrent main mutation continue to fail closed.'
- id: AC5
  condition: ORIGIN_AFFINE new-TASK provenance remains independently admitted and
    bound to exact carrier attempt, TASK id, expected main, route/generation and envelope
    digest, with legacy/revision separation and replay protections unchanged.
- id: AC6
  condition: AUTHOR_REMEDIATION and AUTHOR_REPAIR continue to require and freshness-check
    their existing audited handoffs; BO-1 introduces no correction-authoring simplification.
- id: AC7
  condition: Project Contract, Brain TASK Authoring Contract and semantic-handoff
    hardening documentation state a consistent post-BO-1 AUTHOR_TASK rule and preserve
    two-stage Brain audit as cognitive/semantic discipline rather than Runtime mutation
    authority.
- id: AC8
  condition: Focused regression tests cover handoff-free AUTHOR_TASK success, AUTHOR_TASK
    handoff rejection, preserved direct safety/provenance failures, and unchanged
    REMEDIATION/REPAIR audited-handoff enforcement.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_authoring_ingress.py tests/test_github_issue_ingress.py
    tests/test_github_issue_ingress_workflow.py tests/test_origin_bootstrap.py
  - git diff --check
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
