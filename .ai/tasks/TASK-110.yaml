    or deterministically reconstruct the exact same cumulative source before applying
    the r3 delta. Previously completed r2 changes are evidence, not work to redo.

    '
  - 'The new shared reservation/serialization primitive is deterministic coordination
    only. It may guard publication-critical ordering and exact identities but may
    not choose semantic successor work, Executor, model, effort, risk acceptance,
    review verdict, correction strategy or roadmap NEXT.

