task_id: TASK-110
revision: 2
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE

goal: >
  Upgrade the canonical Review-to-Publication continuation into one flat deterministic
  publication flow that normally publishes the exact reviewed source without Brain
  recovery work, closes the publication/main-advance race before later canonical-main
  mutation can strand an eligible reviewed candidate, and provides one bounded
  deterministic recovery classification for already-diverged publication attempts.
  Preserve Runtime, Reviewer and Publisher as distinct authorities and preserve the
  Project Contract rule that semantic PASS authorizes publication of the exact reviewed
  source candidate only.

problem: >
  RUN-321-003 produced exact candidate
  1278440199805edfea4979e65a75fff38ad1171b and REVIEW-321-003 is canonical PRIMARY PASS
  with AC1-AC9 PASS. Before that exact candidate was published, canonical main advanced
  through TASK-322 and is now 3944d717af68a8ca97048a4e7472c8c46a5dadc4, so the existing
  Publisher correctly classifies publication as INTEGRATION_REQUIRED. The safe failure
  exposes a control-plane gap: normal publication continuation does not reserve/serialize
  the exact publication opportunity against later main-changing continuation, and the
  recovery classification leaves Brain to rediscover how to recover each divergence.
  Force, reset, ad-hoc cherry-pick, or treating an unreviewed merge commit as equivalent
  to the reviewed source would violate publication authority.

assumptions:
  - Canonical main at revision-2 authoring is 3944d717af68a8ca97048a4e7472c8c46a5dadc4.
  - TASK-321 revision 1 remains the current BO-2/BO-3 implementation subject until its publication closure is canonically resolved.
  - RUN-321-003 is the canonical successful RESULT and REVIEW-321-003 is PASS for exact reviewed SHA 1278440199805edfea4979e65a75fff38ad1171b.
  - REVIEW-321-003 does not authorize publication of a different integration SHA.
  - TASK-110 revision 1 remains authority for automatic review-to-Publisher continuation; this revision extends that same boundary rather than creating a second Publisher.
  - Existing correction_integration mechanics are correction-lineage authority and must not be reused as publication authority.
  - Runtime verification, Reviewer verdict and Publisher publication remain distinct authorities even if transport is flat and unattended.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-SELF-HOST-END-TO-END-FLOW-v1.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-110.yaml
    - .ai/tasks/TASK-321.yaml
    - .ai/tasks/TASK-322.yaml
    - src/aios_renew/publication.py
    - src/aios_renew/correction_integration.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/runtime.py
    - src/aios_renew/brain_attention.py
    - .github/workflows/aios-auto-publish.yml
    - tests/test_publication.py
    - tests/test_brain_attention.py
  modify:
    - src/aios_renew/publication.py
    - src/aios_renew/brain_attention.py
    - .github/workflows/aios-auto-publish.yml
    - tests/test_publication.py
    - tests/test_brain_attention.py

non_goals:
  - Publish, reset, force, cherry-pick, rebase or otherwise manually mutate main to rescue RUN-321-003.
  - Treat REVIEW-321-003 as semantic approval of any SHA other than 1278440199805edfea4979e65a75fff38ad1171b.
  - Create a second Publisher, Reviewer, Planner, lifecycle router, retry daemon, correction selector or roadmap authority.
  - Reuse correction_integration authority as publication authority or convert PRIMARY PASS into REPAIR/REMEDIATION lineage.
  - Let Runtime make a semantic review verdict, choose conflict resolution, choose an Executor, or infer risk acceptance.
  - Re-run TASK-321 implementation merely because publication raced with later main movement.
  - Automatically advance BO-2/BO-3 roadmap semantics from transport/publication observations.
  - Require repository-wide full-suite verification merely to close this bounded publication-control change.

constraints:
  hard:
    - >
      Normal REVIEW PASS continuation must remain flat: canonical review decision to
      Publisher to exact-source publication outcome without Brain polling or Human
      workflow replay.
    - >
      Preserve Project Contract section 12 exactly: semantic PASS authorizes publication
      of the reviewed source candidate only. No deterministic merge, tree equivalence,
      clean conflict-free composition or ancestry observation may upgrade a different SHA
      into reviewed-source authority.
    - >
      Close the race prospectively by deterministically serializing or leasing the
      publication-critical main mutation boundary so an eligible exact reviewed source
      cannot be stranded merely because unrelated later canonical-main work advances
      before its publication attempt completes. The mechanism transports existing
      authority only and may not select roadmap work or semantic successors.
    - >
      Re-check the exact canonical main binding immediately before mutation. CAS failure,
      concurrent movement or stale lease must never force publication; bounded
      deterministic re-observation may continue only while exact reviewed-source
      publication remains lawful.
    - >
      If a publication attempt is already diverged, classify it deterministically.
      Do not ask Brain to rediscover a Git repair strategy. A conflict-free mechanical
      integration candidate, if the implementation exposes one as recovery material,
      is a new source candidate and cannot reach main until Runtime verification and a
      fresh semantic Reviewer PASS establish eligibility for that exact SHA.
    - >
      Any recovery requiring semantic conflict resolution, scope/risk judgment or a new
      implementation choice must fail closed with one typed attention state containing
      exact reviewed SHA, sampled main SHA and deterministic cause. Runtime must not
      choose the semantic resolution.
    - >
      Publication integration/recovery is executorless unless a separately authorized
      implementation/correction TASK requires an Executor. Existing sticky Executor
      delegation must not be injected into a mechanical Publisher continuation.
    - >
      Existing already-published/idempotent replay and fast-forward publication behavior
      must remain valid. Review-decision metadata remains non-product source.
    - >
      TASK-321 is the live regression fixture for the already-diverged shape. Its
      RUN-321-003 verification and REVIEW-321-003 verdict remain immutable evidence and
      must not be rewritten or falsely reused as review of another SHA.
    - >
      Attention/doorbell may report terminal publication success or typed actionable
      recovery/conflict only. Intermediate INTEGRATION_REQUIRED classification must not
      cause Brain to search for an ad-hoc publication procedure when deterministic
      continuation is still possible.
    - >
      Executor may modify only scope.modify. If the required solution needs Kernel
      lifecycle semantics, Reviewer authority, correction_integration authority or files
      outside scope.modify, fail closed for Brain scope reconciliation instead of
      widening authority.

acceptance:
  - id: AC1
    condition: >
      Existing exact reviewed-source fast-forward and idempotent publication paths remain
      correct and use one canonical Publisher boundary.
  - id: AC2
    condition: >
      A production-shaped race proves later main-changing continuation cannot strand an
      eligible reviewed source between canonical PASS and its exact Publisher attempt;
      stale/CAS movement fails closed without force.
  - id: AC3
    condition: >
      A REVIEW PASS candidate that is already contained/published is deterministically
      recognized as successful/no-op without duplicate mutation.
  - id: AC4
    condition: >
      An already-diverged case equivalent to RUN-321-003 is deterministically classified
      without manual Git instructions; no different SHA is treated as covered by the old
      review, and any newly materialized recovery candidate is explicitly ineligible for
      publication until Runtime verification plus fresh Reviewer PASS for that exact SHA.
  - id: AC5
    condition: >
      Merge conflict, ambiguous ancestry, concurrent main movement, stale review binding,
      malformed lineage and recovery-scope escape all fail closed with typed bounded
      evidence and no main mutation.
  - id: AC6
    condition: >
      Publication continuation does not select Executor/model/effort, correction strategy,
      roadmap NEXT, semantic review verdict or risk acceptance and does not create a
      second lifecycle router or Publisher.
  - id: AC7
    condition: >
      Publication attention exposes only exact canonical identities and terminal/actionable
      outcomes; ordinary deterministic continuation does not wake Brain merely to choose
      a Git recovery procedure.
  - id: AC8
    condition: >
      Regression coverage proves REVIEW-321-003 remains authority only for
      1278440199805edfea4979e65a75fff38ad1171b and current main
      3944d717af68a8ca97048a4e7472c8c46a5dadc4 is never reset/forced to that historical
      candidate.
  - id: AC9
    condition: >
      Source changes remain within scope.modify and preserve Runtime verification,
      Reviewer semantic authority, Publisher exact-source authority, TASK-110 continuation,
      correction lineage authority and Human/Brain roadmap authority.

verification:
  policy: minimum-sufficient-v2
  required:
    - python -m pytest -q tests/test_publication.py tests/test_brain_attention.py
    - git diff --check
