  - 'Reservation must cover the interval necessary to prevent a canonical PASS that
    is eligible for exact-source publication from being overtaken by a competing canonical-main
    mutation. Every main mutation path within TASK-110 publication authority that
    can race this interval must honor the same deterministic boundary.

    '
  - 'Review/PASS authority remains Reviewer-owned. Transport may acquire/release a
    reservation around durable decision publication/continuation, but it may not synthesize
    or reinterpret PASS.

    '
  - 'Publisher remains the sole authority to mutate main for reviewed-source publication
    and must retain exact reviewed SHA, ancestry, CAS/force-with-lease, stale-main
    and idempotency checks.

    '
  - 'Project Contract section 12 remains exact: a PASS authorizes only its reviewed
    source candidate. Any mechanically composed recovery SHA remains a new source
    requiring Runtime verification and fresh Reviewer PASS before publication.

    '
  - 'Shared-boundary contention, stale ownership, malformed identity, concurrent main
    movement or unavailable required writer coverage must fail closed with bounded
    deterministic evidence. No force or blind retry loop.

    '
  - 'Do not wake Brain merely to invent Git procedure while deterministic continuation
    is still lawful. Wake only terminal success or typed actionable semantic/scope
    conflict.

    '
  - 'Executor may modify only scope.modify. If AC2 truly requires another production
    entry point outside this reconciled scope, fail closed and name that exact entry
    point; do not silently widen scope.

    '
