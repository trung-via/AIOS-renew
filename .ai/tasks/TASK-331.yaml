task_id: TASK-331
revision: 1
goal: "Deliver VP-03B's bounded, offline, read-only immutable checkpoint-lineage and\
  \ crash/replay conformance foundation for prospective same-RUN PRIMARY C1\u2192\
  C2 proof tracking. Validate authoritative checkpoint identity, history, predecessor\
  \ order, sticky delegation, resource accounting and exact per-proof applicability\
  \ using the already-published VP-02 and VP-03A validators. Return factual consistency/replay\
  \ BLOCK observations only; keep prospective KA-01 continuation NOT_ACTIVATED and\
  \ do not create production checkpoint persistence, another scheduler or lifecycle\
  \ truth."
problem: "Published TASK-330 VP-03A authenticates original Git-backed evidence and\
  \ source-to-target applicability but does not prove a chain of multiple immutable\
  \ preterminal checkpoints survives duplicate receipt, interruption or conflicting\
  \ replay without reusing a source as target evidence. TASK-328 offers only a single\
  \ offline checkpoint declaration and synthetic counters. KA-01 prospective design\
  \ and VP-03 need a separate bound proof of exact ordered C1/K1\u2192C2/K2 lineage,\
  \ independent source applicability and crash-safe idempotence before future VP-04\
  \ single-scheduler integration. No historical RUN/RESULT status may be rewritten\
  \ or promoted."
assumptions:
- Fresh canonical planning main for AUTHOR_TASK is 4694227a955af229d4d5a04b79723ac50abb897e;
  TASK and future PRIMARY require exact current CAS/task blob binding.
- Human approved continuing the VP roadmap after TASK-330 exact publication. Canonical
  TASK-330 r1 RUN-330-002 DELTA REVIEW-330-002 PASS on reviewed main source 1be1608aeeac27c046452072fc28614f1be09a4a;
  source RUN-330-001 REVIEW CHANGES_REQUIRED R1 and remediation authorization fecf9d9c6a12efc7431c73962b9fa9bad3fcb535
  are preserved. Its 75 passing focused tests are Runtime evidence, not future VP-03B
  verification.
- Kernel v0.1 and Constitution remain unchanged. Human-ratified published KA-01 v1
  is a prospective normative specification NOT_ACTIVATED. VP-01 measurement remains
  DEFERRED_BY_HUMAN; VP-02 package has pending exits; VP-03 whole exit and VP-04/05
  integration/cutover are not established.
- Reuse published TASK-326 proof-coverage mapping, TASK-328 intra-run declaration,
  TASK-330 read-only Git-authenticated applicability, existing `Run` ACTIVE with head_sha=null,
  the current TASK/RESULT/EVIDENCE decoders and their BR1..BR6 gates rather than reimplementing
  or weakening any provenance/semantic contract.
- An opaque SHA/digest, caller-generated checkpoint JSON, evidence identity, profile
  label or apparent C1 PASS never establishes authenticated authority. Any independent
  trust catalog/root or ledger must be supplied by a trusted existing canonical boundary;
  no caller enrollment of new authority.
- Human has not selected executor/model/effort for TASK-331. The Codex gpt-6.1-sol
  max instruction was sticky only for TASK-330 and cannot be silently inherited as
  new TASK-331 authority. These operational fields are not TASK schema fields.
- Legacy repository default return affinity is the currently approved planning route;
  no origin-scoped proof or downstream adoption is inferred.
