non_goals:
- Do not create or write an authoritative checkpoint journal, RUN/RESULT/FAILURE/REVIEW/REPAIR/REMEDIATION,
  local persistent history, memory DB, new status, new Git transport/ref, versioned
  task parser change, policy activation or second lifecycle truth.
- Do not integrate with current Runtime production calls, evidence discharge/reuse
  decisions, verification scheduler, executor adapter, cloud/self-host runner, feedback
  delivery, retry/failover, Publisher, Reviewer or V2 command-driven orchestration.
- Do not automatically retry candidate proofs, select a correction strategy, authorize
  Executor continuation, regenerate/evaluate source proof as target execution, rerun
  identical proofs at terminalization, reproduce failure, materialize base or broaden
  scope.
- Do not trust request-selected catalog roots, unauthenticated source logs or caller-provided
  `VALID` statuses; do not infer dependency completeness from filenames, nodeids,
  unchanged command, a commit hash alone or synthetic shadow fixtures.
- Do not expand the frozen Kernel/KA-01 ratification, waive VP-01, mark VP-02/VP-03
  DONE, claim VP-04 scheduler or VP-07 conformance, or change downstream versions/roadmap
  planning.
- Do not override Human sticky Executor authorization/lease/finite resource bounds,
  redefine Brain proof semantics or move Reviewer judgments into deterministic validation.
constraints:
  hard:
  - Supply a prospective versioned bounded read-only checkpoint lineage contract and
    factual evaluator, reusing TASK-328's `Checkpoint`, `Binding`, `Delegation` and
    semantic mapping invariants and TASK-330's authenticated proof applicability boundary
    wherever applicable. No second independently interpreted proof validity engine
    or self-certified authority root.
  - Accept an exact finite sequence of immutable source-pinned candidate/checkpoint/feedback
    identities from a separately trusted canonical-source boundary. Authenticate actual
    contents, Git ancestry and existing canonical RUN/TASK/base/delegation/opt-in
    authority identity rather than trusting user-selected refs, bare hashes or mutable
    main. Missing trust-root provenance is UNKNOWN/BLOCK.
  - Enforce ordinal K1..Kn strictly monotonic and hash-linked; K1 has no predecessor,
    each successor binds the previous sealed content digest/ordinal; every candidate
    is distinct, committed, clean under independently attested facts and descendant
    of the preceding candidate, with no reused base or candidate SHA, forks, gap,
    rollback or multiple competing current tips. Currentness must fail closed if moved;
    do not invent a repository lock/lease or attempt to guarantee atomicity by SHA
    alone.
  - Bind each checkpoint to exactly one admitted ACTIVE prospective PRIMARY RUN/TASK
    revision, fixed base, reviewed semantic proof contract/mapping, identical Human
    delegation/Executor/model/effort/live lease identity and generation, authorized
    scope, budget and immutable source EVIDENCE provenance. A change, uncertainty,
    missing authorization or terminal status yields factual BLOCK; historical V1/V2
    records cannot be accepted as live KA-01 checkpoint approval.
  - Account corrections, wall time, test items and applicable token/resources monotonically
    and with explicit finite Human bound/reservation facts, including crash/replay.
    Partial or missing accounting, negative/overflow/underflow, expired/lost lease,
    changed risk or semantic choice and unverified progress are fail-closed. Budget
    checking must not permit skipping any required proof and must never independently
    authorize continuation.
  - "Evaluate C_i\u2192C_j per-proof VALID/INVALIDATED/UNKNOWN through the existing\
    \ VP-03A authenticated immutable-source applicability interface. Preserve original\
    \ source RUN/EVIDENCE/subject/outcome, use a separate exact applicability witness\
    \ for each target; fail or unknown must not discharge an acceptance. Independent\
    \ integration/concurrency/ordering/worker and comparison obligations remain distinct.\
    \ No automatic source-result relabeling or new target execution EVIDENCE."
  - Define deterministic read-only exact duplicate re-observation (`SAME_FACT`), conflicting
    duplicate/ordinal and fork (`BLOCK`), and partial/torn tail, missing predecessor,
    divergent replay, uncertain currentness or crash (`UNKNOWN`/BLOCK). Never consume
    the same feedback twice, reset spent budgets, append an inferred checkpoint or
    generate terminal RUN/FAILURE from absent/partial transport. Any actual durable
    CAS/atomic append integration remains later separately authorized work.
  - Negative conformance must use bounded disposable real Git repository objects and
    immutable checkpoint snapshots (including genuine admitted RUN ACTIVE head_sha=null),
    changed candidate ancestry, missing/conflicting source evidence, lost/changed
    delegation/lease, checkpoint gaps/forks/replay, partial write recovery, budget
    reset/overrun, changed fixture/helper/profile/worker/integration and upstream
    applicability UNKNOWN/INVALIDATED. Demonstrate read-only behavior and bounded
    test execution; no external network.
  - Results and documentation explicitly mark all authorization, mutation, terminalization,
    evidence reuse/acceptance discharge and scheduler flags FALSE/NOT_ACTIVATED; existing
    Runtime remains sole coordination/canonical evidence/terminal owner. No new production
    watcher/worker/orchestration.
  - Modify only the three listed paths; favor deterministic small offline focused
    tests with minimal fixture/worktree recreation. Verification remains existing
    policy minimum-sufficient-v2 and only the authored focused test command is required.
acceptance:
- id: AC1
  condition: A bounded versioned offline immutable checkpoint-lineage API exists,
    with strict source/record identities, exact TASK/PRIMARY RUN/base/contract/delegation
    bindings and independently authenticated provenance preconditions; no caller-declared
    checkpoint VALID grants authority.
- id: AC2
  condition: It deterministically verifies K1..Kn monotonic ordinal/content-hash/parent
    and candidate Git ancestry, unique distinct in-scope C1..Cn, no history fork/gap/reused
    base, and immutable source-to-target subject separation.
- id: AC3
  condition: It enforces fixed Human authority, sticky Executor/profile/model/effort,
    unexpired lease, exact scope and monotonic finite accounting; stale/changed/missing
    risk or limits return factual BLOCK/UNKNOWN rather than continuation permission.
- id: AC4
  condition: Replay/crash checking distinguishes exact same sealed checkpoint from
    conflicting duplicate, missing/torn tail and moved head, without consuming feedback
    twice, resetting budgets or writing another checkpoint/terminal artifact.
- id: AC5
  condition: Checkpoint per-proof applicability reuses the published VP-03A authenticated
    VALID/INVALIDATED/UNKNOWN evaluator and immutable original EVIDENCE/RESULT, preserves
    actual original FAIL, and does not collapse distinct integration/concurrency/ordering
    or comparison obligations.
- id: AC6
  condition: "Focused disposable real Git negative tests cover canonical ACTIVE RUN\
    \ with head_sha null, C1\u2192C2, fork/gap/duplicate/replay, mismatched lineage,\
    \ partial crash, budget/lease drift, missing/forged evidence and changed fixture/helper/profile/worker/integration;\
    \ no self-certified VALID or double execution."
- id: AC7
  condition: Documentation explains trusted catalog/issuer limits, read-only status
    versus future Runtime durable checkpoint CAS, exact terminal/REPAIR/REMEDIATION
    boundaries, no duplicate scheduler, all KA-01 opt-in gates and deferred VP-01/V2/VP-07
    conformance obligations.
- id: AC8
  condition: The candidate modifies exactly the new module, focused tests and versioned
    VP-03B document; no existing kernel/runtime/scheduler/artifact/workflow/task parser
    mutation or actual checkpoint/proof/RUN persistence occurs.
