task_id: TASK-089
revision: 1

goal: >
  Add one deterministic Executor-backed REPAIR continuation for an admitted failed RUN
  whose original TASK implementation is still unfinished and requires repository mutation,
  but where no product/code defect has been established. Extend the existing REPAIR action
  vocabulary with `CONTINUE_IMPLEMENTATION` so a Human/Brain-authorized continuation can
  resume from the exact failed_head_sha after an external/Human prerequisite becomes
  available, while preserving immutable failed-run/root lineage, exactly one selected
  Executor, Runtime-owned completion/verification, thin workers, and the existing
  no-retry/no-reroute model.

problem: >
  Cross-project Python Agent TASK-182 exposed a real continuation gap. RUN-182-001 is an
  admitted PRIMARY failure at COMPLETION_GATE on a clean, repairable, transportable
  candidate whose failed_head_sha equals the original TASK-182 base and whose changed_files
  is empty. The Executor intentionally failed closed during the required implementation-time
  Shopee live capture because the first bounded query produced no cards and no empty-result
  marker; it returned unresolved work, created no implementation commit, and Runtime
  correctly terminalized the RUN. The missing prerequisite was Human completion of Shopee
  CAPTCHA, which has now occurred and the authenticated browser session is ready. Existing
  REPAIR semantics cannot represent the legal next action without lying: verification-only
  NO_CHANGE is ineligible because the predecessor failed before a reusable completed
  candidate existed and remaining TASK work requires mutation, while CODE_FIX semantically
  asserts correction of an established defect that does not exist. Starting a fresh PRIMARY
  would discard the immutable failed lineage and duplicate already-established execution
  history. AIOS therefore needs one explicit mutation-authorizing continuation action inside
  the existing REPAIR family rather than a new retry path or a misclassified fix.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-089 authoring is
    883974be6ec5922ae57021b50a48c84a0014dbfa. REVIEW-088-002 is canonical DELTA PASS for
    that exact SHA with no findings, so the published Unified Human Surface and TASK-088
    pre-resolution hardening are established current behavior.
  - >
    `.ai/roadmap-state.yaml` still records `downstream-adoption` as the unique NEXT item.
    TASK-089 is observed-evidence hardening required by that downstream adoption work; it
    does not by itself mark the roadmap item DONE or advance planning state.
  - >
    Canonical downstream Python Agent main and TASK-182 failed_head_sha are both exactly
    fa6aa4a6b686530c951dcb7aadb22e26655504fc, and its authoritative AIOS pin is exactly
    883974be6ec5922ae57021b50a48c84a0014dbfa, equal to current AIOS-renew main at this
    authoring checkpoint.
  - >
    Canonical downstream failure transport for RUN-182-001 binds TASK-182 revision 1,
    executor codex, base_sha and failed_head_sha
    fa6aa4a6b686530c951dcb7aadb22e26655504fc, phase COMPLETION_GATE, candidate
    changed_files=[], dirty=false, descends_from_base=true, repairable=true,
    transportable=true, outside_task_scope=[], and the bounded unresolved diagnostic that
    live Shopee capture failed closed before any implementation commit.
  - >
    Human reports that the Shopee CAPTCHA prerequisite has now been satisfied. That report
    is a new reason to authorize one continuation attempt, not canonical Runtime evidence
    that an external session will remain valid. Runtime must not probe CAPTCHA, browser
    authentication, credentials, cookies, provider state, network state, or arbitrary
    external prerequisites in order to infer or authorize this action.
  - >
    TASK-057 remains authoritative for canonical REPAIR Result.changed_files as the complete
    original TASK delta from preserved root_base_sha to final HEAD and for independent
    failed_head_sha-to-final-HEAD narrow mutation enforcement.
  - >
    TASK-058 revision 2 and TASK-077 remain authoritative for current-control versus
    historical REPAIR, exact failed_head_sha subject recovery, immutable correction/root
    lineage reconstruction, duplicate-continuation rejection, fresh-local-state recovery,
    isolated historical subjects, and bounded remote observation with no retry/fallback/
    reroute.
  - >
    TASK-064 remains authoritative only for explicitly authorized verification-only
    NO_CHANGE reuse after a clean candidate has already passed all pre-verification
    completion gates and then failed at canonical VERIFICATION. TASK-075/TASK-076 remain
    authoritative for CODE_FIX bypass of reuse-only state and like-for-like genuine
    NO_CHANGE reusable-candidate validation.
  - >
    TASK-085, TASK-086, TASK-087, and TASK-088 remain authoritative for Correction
    Preflight, Unified State + Next Action, Unified Human Surface, and bounded stale-local
    TASK pre-resolution synchronization. This TASK extends those surfaces only enough to
    represent and execute the new REPAIR action without creating a second lifecycle model.

