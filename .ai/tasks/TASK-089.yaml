non_goals:
  - Modify Python Agent source, TASK-182, RUN-182-001 immutable artifacts, its AIOS pin,
    browser profile, cookies, CAPTCHA state, or downstream roadmap in this TASK.
  - Execute, repair, continue, review, publish, or otherwise resolve downstream TASK-182 as
    part of AIOS-renew implementation.
  - Reclassify RUN-182-001 as CODE_FIX, CHANGES_REQUIRED, Admission Failure, verification-only
    NO_CHANGE, a fresh PRIMARY, or an automatic retry.
  - Broaden verification-only NO_CHANGE eligibility to EXECUTION or COMPLETION_GATE failures,
    synthesize a reusable candidate where none exists, or allow NO_CHANGE to mutate Git.
  - Weaken CODE_FIX semantics or use CONTINUE_IMPLEMENTATION as an alias for a known defect.
    A known product/code defect remains CODE_FIX; a completed unchanged candidate that only
    needs another justified verification remains NO_CHANGE.
  - Add a new correction family, new RUN/FAILURE/RESULT/EVIDENCE ref family, scheduler,
    daemon, queue, retry loop, automatic prerequisite watcher, browser probe, planner,
    executor router, fallback, reroute, failover, or autonomous repair authoring.
  - Let Runtime infer semantic repair action by parsing Executor diagnostics, arbitrary error
    prose, filenames, timestamps, external state, or model output. Brain/Human authorization
    remains the source of correction semantics.
  - Change TASK-057 root-relative changed_files authority, TASK-058/TASK-077 historical
    lineage semantics, TASK-075/TASK-076 reusable-state authority ordering, verification
    ownership, semantic review authority, or safe publication behavior.
  - Change repository-provided downstream workers so they reconstruct lineage, choose an
    action, inspect CAPTCHA/session state, select an Executor, retry, or reroute.
  - Auto-advance `.ai/roadmap-state.yaml` or claim downstream adoption complete.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Extend the existing bounded REPAIR action vocabulary with exactly one new semantic
      action named `CONTINUE_IMPLEMENTATION`. Keep the existing top-level REPAIR artifact
      shape and existing REPAIR operation/refs; do not introduce a parallel RESUME command,
      new correction artifact family, or a fresh PRIMARY lineage.
    - >
      `CONTINUE_IMPLEMENTATION` means only: the exact admitted failed RUN remains the
      predecessor; original TASK implementation is not complete; no product/code defect is
      being asserted as the reason for continuation; remaining authorized TASK work requires
      repository mutation; and Human/Brain has a new reason to attempt continuation after an
      external/Human prerequisite or equivalent non-defect blocker changed. Brain authors
      this semantic choice. Runtime validates structural admission but must not infer these
      semantic facts from error text or probe the prerequisite.
    - >
      The new action is permitted only for an exact repairable admitted predecessor that
      failed before canonical verification, including EXECUTION or COMPLETION_GATE. It must
      not be used to bypass TASK-064 on a completed phase-VERIFICATION candidate; a
      verification predecessor remains governed by existing NO_CHANGE/CODE_FIX semantics.
    - >
      Admission must preserve the exact failed RUN/TASK revision, FAILURE,
      failed_head_sha, root_base_sha, continuation_of lineage, correction ref/SHA,
      duplicate-continuation protection, current-versus-historical subject identity, and
      all repository safety gates already required by ordinary REPAIR. A continuation may
      never substitute current main, a nearby RUN, a later candidate, or a freshly
      allocated PRIMARY base for the failed subject.
    - >
      `CONTINUE_IMPLEMENTATION` must require a non-empty explicit modification_scope that is
      valid under the existing original TASK scope/correction-scope rules. It grants
      mutation capability only inside the ordinary REPAIR execution boundary; it grants no
      authority outside the TASK or correction scope and no authority to modify control
      plane, dependency pins, workers, or unrelated files unless those paths were already
      authorized by the original TASK and the authored REPAIR.
    - >
      An admitted CONTINUE_IMPLEMENTATION REPAIR requires exactly one explicit Human-selected
      coding Executor and invokes that Executor exactly once through the existing REPAIR
      dispatcher. Native execution policy must treat this action as mutation-authorizing,
      without changing Executor selection, model defaults, timeout/watchdog policy, lease
      semantics, or adapter responsibilities.
    - >
      Reusable pre-verification candidate state is irrelevant to
      CONTINUE_IMPLEMENTATION. The action must bypass decoding, equality, completeness,
      acceptance-coverage, and other validation whose only authority is Executor elision,
      exactly as an ordinary mutation-requiring path must not depend on unused reuse state.
      Malformed/stale/conflicting reusable state alone must not block an otherwise valid
      CONTINUE_IMPLEMENTATION admission; genuine NO_CHANGE reuse remains fail closed under
      TASK-064/TASK-076.
    - >
      Completion for CONTINUE_IMPLEMENTATION must prove actual mutation: final HEAD must be a
      normal descendant of the exact failed_head_sha, must advance beyond that failed head,
      and the failed-head-to-final committed delta must be non-empty and wholly inside the
      authored REPAIR modification_scope. An unchanged result or empty commit is not silently
      accepted as NO_CHANGE and must fail the existing completion boundary truthfully.
    - >
      TASK-057 canonical REPAIR result authority remains unchanged. Runtime derives the
      final Result.changed_files from preserved original root_base_sha to final HEAD,
      independently enforces the narrow failed_head_sha-to-final mutation scope, requires
      complete original TASK acceptance coverage, and binds canonical EVIDENCE to exact
      final HEAD. The new action must not redefine changed-files bases or let Executor
      declarations override Git truth.
    - >
      After repository/completion gates pass, Runtime executes the original TASK canonical
      verification list exactly once through the existing completion boundary. The new
      action does not run a second prerequisite check, live capture, verification probe, or
      model call before/after the selected Executor. If the prerequisite is unavailable
      again or implementation remains unresolved, terminalize the new admitted continuation
      as an ordinary FAILURE; do not retry, reroute, fall back to PRIMARY, or automatically
      author another REPAIR.
    - >
      Correction Preflight must understand the new action as ordinary Executor-backed,
      mutation-authorizing REPAIR and report `executor_required=true` when all prior
      deterministic admission facts are READY. Preflight remains read-only and does not
      inspect external prerequisite state or acquire execution authority.
    - >
      Unified State must continue to derive `AUTHOR_REPAIR` when a repairable failed tip has
      no canonical REPAIR and `EXECUTE_REPAIR` when exactly one canonical
      CONTINUE_IMPLEMENTATION REPAIR exists and existing preflight is READY. No new
      next_action enum is needed; the lifecycle family remains REPAIR.
    - >
      Unified Human Surface must treat an EXECUTE_REPAIR whose exact action is
      CONTINUE_IMPLEMENTATION as Executor-required, preserve the exact failed RUN and repair
      selector SHA observed by Unified State, delegate at most one existing REPAIR operation,
      and stop after it returns or fails. It must not convert this action into `aios run`,
      chain another continuation, or infer/default an Executor.
    - >
      Existing CODE_FIX and NO_CHANGE behavior must remain semantically and operationally
      unchanged. CODE_FIX continues to mean mutation to correct an established defect and
      remains Executor-backed. Eligible NO_CHANGE remains the only verification-only
      zero-Executor reuse path and remains zero-mutation. Non-qualifying NO_CHANGE retains
      its existing behavior and cannot gain mutation authority from this TASK.
    - >
      Repository-provided workers remain thin. They may surface the existing Human-facing
      `continue`/repair operation and explicit Executor, but do not decide that a failure is
      CONTINUE_IMPLEMENTATION, reconstruct failed lineage, inspect external prerequisites,
      choose scope, retry, or reroute.
    - >
      README must document the three REPAIR semantic actions and their separation:
      CODE_FIX for an established defect, NO_CHANGE for unchanged continuation under its
      existing rules, and CONTINUE_IMPLEMENTATION for unfinished pre-verification work after
      a new external/Human reason permits another mutation-authorized attempt. It must state
      explicitly that this is one separately authorized continuation, not automatic retry,
      and that `aios continue` still delegates only one lifecycle operation per invocation.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic RUN-182-equivalent regression starts from a PRIMARY
      COMPLETION_GATE FAILURE with clean repairable/transportable candidate,
      failed_head_sha equal to the unchanged original base, changed_files=[], and no
      reusable completed candidate; an authored CONTINUE_IMPLEMENTATION REPAIR is admitted
      against that exact failed RUN rather than requiring CODE_FIX, NO_CHANGE, or a fresh
      PRIMARY.
  - id: AC2
    condition: >
      The AC1 continuation requires one explicit selected Executor, invokes it exactly once
      with mutation capability, permits a committed delta only inside the authored repair
      scope, and preserves exact failed_run_id, failed_head_sha, TASK revision,
      continuation_of, and original root_base_sha throughout execution.
  - id: AC3
    condition: >
      Successful CONTINUE_IMPLEMENTATION completion requires final HEAD advancement and a
      non-empty failed-head-relative committed delta; an unchanged/empty result fails closed
      at completion and is never reclassified as NO_CHANGE.
  - id: AC4
    condition: >
      The successful AC1 topology produces canonical REPAIR Result.changed_files from the
      original root_base_sha to final HEAD, complete TASK acceptance coverage, exact final
      HEAD evidence, and exactly one canonical TASK verification pass through the existing
      Runtime boundary, with no new changed-files or evidence authority.
  - id: AC5
    condition: >
      Deterministic regressions prove CONTINUE_IMPLEMENTATION bypasses malformed, absent, or
      conflicting reusable-candidate state whose only purpose would be Executor elision,
      while all canonical FAILURE/TASK/failed-head/root-lineage/repair-selector/repository/
      duplicate-continuation gates remain independently fail closed.
  - id: AC6
    condition: >
      A historical-subject regression proves CONTINUE_IMPLEMENTATION can use the existing
      TASK-058/TASK-077 recovery boundary from exact failed_head_sha while current control
      main differs, without mutating current control HEAD/index/worktree, bootstrapping the
      historical worker pin, inserting migration commits, or changing root lineage.
  - id: AC7
    condition: >
      Phase/action regressions reject CONTINUE_IMPLEMENTATION as a shortcut for an ordinary
      phase-VERIFICATION predecessor, preserve valid verification-only NO_CHANGE behavior,
      preserve ordinary CODE_FIX behavior for established defects, and do not broaden either
      existing action's authority.
  - id: AC8
    condition: >
      Correction Preflight returns READY/BLOCKED under the existing deterministic REPAIR
      admission model and reports executor_required=true for a ready
      CONTINUE_IMPLEMENTATION; Unified State reduces the exact authored correction to
      EXECUTE_REPAIR; Unified Human Surface requires explicit Executor and delegates exactly
      one REPAIR operation with the observed selector identity.
  - id: AC9
    condition: >
      If the selected Executor again reports unresolved work, external state is unavailable,
      execution fails, completion rejects the candidate, or canonical verification fails,
      Runtime records one ordinary continuation FAILURE with truthful phase/candidate facts
      and performs no automatic retry, fallback, reroute, PRIMARY restart, action conversion,
      or second Executor invocation.
  - id: AC10
    condition: >
      Existing focused regressions for CODE_FIX ordering, genuine NO_CHANGE reuse and
      changed-files validation, historical REPAIR, Correction Preflight, Unified State,
      Unified Human Surface, direct PRIMARY/REMEDIATION/REPAIR execution, failure taxonomy,
      and one-operation-per-invocation behavior remain green; README documents the new
      semantic boundary and `git diff --check` passes.

