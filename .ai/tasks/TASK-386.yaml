- Human's standing new AIOS-renew TASK route remains explicit LEGACY_REPOSITORY_DEFAULT_ROUTE.
  No Executor/model/effort, finite correction budget or downstream pin is selected
  by this TASK; any execution still requires separate Human delegation.
