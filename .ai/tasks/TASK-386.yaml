task_id: TASK-386
revision: 1
goal: Publish one prospective, explicitly versioned KA-01 normative successor that
  extends bounded Runtime-canonical preterminal proof feedback and same-RUN correction
  eligibility from PRIMARY-only to individually Human-opted-in ACTIVE PRIMARY, REPAIR
  and REMEDIATION. Share one Runtime-owned scheduler, preserve exact operation-specific
  correction authorization and frozen history; establish normative eligibility for
  later L2-03/L3 engineering without activating any production loop.
problem: KA-01 v1.1 C.1 explicitly excludes REPAIR and REMEDIATION from the bounded
  checkpoint-feedback continuation authorized for PRIMARY. Human on 2026-10-19 approved
  the Lean VP intra-RUN scope expansion after exact TASK-385 L2-02 publication. Without
  one separately reviewed/published normative successor, L2-03/L3 could conflate correction-run
  lineage and original TASK authority, silently give Runtime new retry authority,
  or assume document planning activates a new execution contract. The smallest lawful
  next delta is a versioned KA-01 specification-only amendment, not a second proof
  scheduler or premature implementation.
assumptions:
- Canonical source base at authoring is fde6f5a90ba416c03c8ae100ad69cdf53e062935,
  consisting of Human/Brain roadmap reconciliation commit 41afd08c3b4dfa91531798b54dabae6c3873abba
  and Lean VP planning-document reconciliation commit fde6f5a90ba416c03c8ae100ad69cdf53e062935.
  Runtime independently authenticates actual current-main and identity/CAS; these
  prose SHA values are not self-attestation.
- TASK-385 r1 RUN-385-001 produced immutable EVIDENCE RUN-385-001-V001 exit 0 and
  REVIEW-385-001 PRIMARY PASS AC1-AC11, decision SHA 5266b9ea20d8205ae3ef47988e6c5d70a1c625d9,
  exact reviewed/published candidate aaab7a87c63fd40b592dee817fdbfada759a2085. This
  only establishes L2-02 applicability observation, not L2-03 reuse, G3 eligibility
  or G6 activation.
- 'Human explicitly accepted the AOA-1 minimum lawful design delta: one shared Runtime
  proof authority for prospective Human-opted-in PRIMARY, REPAIR and REMEDIATION,
  with operation-specific immutable authorizations and same current-RUN leased Executor.
  The 2026-10-19 canonical Human/Brain roadmap record controls priority; GitHub planning
  Issues #2168 and #2208 are supporting context only.'
- Current KA-01 document identifies prospective v1.1 and forbids REPAIR/REMEDIATION
  by analogy. This TASK authors its separately versioned prospective v1.2 successor
  only; versioned normative edits do not retroactively change historical v1.0/v1.1,
