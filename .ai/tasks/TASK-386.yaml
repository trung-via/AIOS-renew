- Current canonical TASK_AUTHORING audit identity is tca-1 v1 digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2.
  Brain applied the TCA-1 CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE checks with
