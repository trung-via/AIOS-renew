non_goals:
- No reimplementation of TASK-358, no broad rewrite of Runtime verification, no reintroduction
  of minimum-sufficient-v2, no full suite, and no historical RUN or FAILURE rewriting.
- No second lifecycle/failure state store, new database, always-on service, generic
  monitor/poller, workflow router, semantic Planner, automatic correction selector,
  retry/failover, or model/Executor choice.
- No broad access from a chat model/provider to the self-host Windows machine, raw
  private Runtime captures, unbounded GitHub job logs, credentials, local filesystem
  or arbitrary Issue content. Existing exact admitted-Executor private local-read
  authority stays unchanged.
- No new workflow writer, autonomous review/publish/dispatch, Human approval impersonation,
  altered manual/AUTO/executorless REPAIR eligibility, or mutation of correction-preflight/Unified
  State lifecycle truth.
- No assumption that a transported Issue/dispatch/workflow receipt means a RUN exists,
  passed verification, received REVIEW PASS or was published. No synthetic historical
  backfill claiming missing raw evidence.
- No TASK-370 candidate cherry-pick, historical REPAIR replay, downstream repository
  adoption, Kernel amendment, roadmap mutation or Task-371 publication redo.
constraints:
  hard:
  - Exactly bind any originating Issue/dispatch ID, repository/actor identity, correction
    SHA, failed/source RUN and real GitHub workflow run_attempt/job/step using authenticated
    GitHub-owned event and API context. Reject spoofed, moved, mismatched, ambiguous
    and cross-attempt sources rather than heuristically matching timestamps, titles
    or log text.
  - Correlation covers first-party AUTHOR_REPAIR ingress (including the TASK-371 executorless
    route) and separately Human-authorized manual/AUTO wakeup carriers. Queued/running/missing/expired
    attempts expose their truthful operational state. Failed step must not be replaced
    by transient DISPATCH_ACCEPTED, AIOS_INVOKED or SELF_HOST_COMPLETED receipts.
  - Only Runtime/authorized existing self-host control-plane reads protected exact
    local failure/verification/native/completion diagnostics. Any added portable diagnostic
    is a bounded allowlisted structural projection generated at an already lawful
    boundary and linked to immutable RUN/subject/evidence/private-source digest. Brain
    receives only that safe projection, never unrestricted raw output or a filesystem
    locator capability.
  - For verification, expose where safely derivable the ordered failed command, bounded
    sanitized failed test identities (parameter payloads withheld), error-class category,
    count, evidence/digest and detail availability. Preserve raw-output privacy and
    distinguish incomplete/unstable, absent, withheld and unsupported historical observations.
    Do not infer individual tests from exit code 1.
  - For completion and native execution, expose only authenticated bounded structural
    cause facts such as missing acceptance claim IDs or invalid ResultPackage/final-message
    shape, process exit/timeout/output category, captured/truncated availability and
    responsible phase. Do not leak full model responses, stdout/stderr, traces, secrets,
    private paths or model reasoning.
  - Reuse existing Operational Receipt v2, Brain Attention, canonical FAILURE context,
    Unified State/Brain Sync and provider-neutral bounded Work Context consumers.
    New safe details are diagnostic observations and do not create EVIDENCE, semantic
    correction strategy, review judgment or lifecycle authority.
  - Historical lawful V1/V2/public/private FAILURE formats and old operational receipts
    remain exact and readable when available; no mandatory re-execution for missing
    diagnostic details and no false degradation to PASS. New incompatible or forged
    fields and wrong SHA/digest/permission are rejected fail-closed.
  - Use existing least-privilege GitHub Issue/Actions read and currently authorized
    receipt surfaces, with deterministic idempotence and bounded privacy-safe output;
    any new permission/credential/declassification need must be surfaced as a blocker,
    not silently added.
  - Tests must exercise real workflow-shaped attempts and legitimate operational states,
    verification/native/completion canonical fixtures and adversarial cases, including
    wrong Issue/job/attempt, stale source, duplicate, forged receipt, secret-bearing
    pytest parameters, missing/expired private evidence, invalid JSON and no-RUN operational
    failures.
  - No acceptance item may claim Runtime verification success, canonical EVIDENCE,
    REVIEW PASS, publication or live remote workflow success before these separately
    occur. Executor only claims observed implementation properties; Runtime verifies
    original minimum-sufficient-v1 commands, and independent Reviewer/Publisher retain
    exact authority.
acceptance:
- id: AC1
  condition: The existing REPAIR ingress and Human manual/AUTO wakeup consumers expose
    a deterministic, source-authenticated link from an exact originating Issue or
    delivery ID to the actual GitHub workflow_run_id and run_attempt, preserving failed_run_id,
    repair_sha, original actor and dispatch identity. A missing/ambiguous/cross-attempt
    mapping does not produce a claimed match.
- id: AC2
  condition: For each authenticated correlated workflow attempt, the read-only observation
    exposes the corresponding GitHub job/step identities and bounded queued/running/completed/failure
    status when available, including a failure that occurs before AIOS RUN admission.
    It distinguishes no-run operational failure from a real Runtime-attributed RUN
    and from mere dispatch acceptance.
- id: AC3
  condition: Bounded operational receipt/attention and original-Issue readers preserve
    and surface the strongest attributable terminal operational outcome instead of
    only a transient AIOS_INVOKED/DISPATCH_ACCEPTED marker; failed known correction-preflight
    or workflow steps carry an authenticated bounded cause code or explicit UNKNOWN
    without exposing raw logs.
- id: AC4
  condition: For a source-bound Runtime VERIFICATION FAILURE with available protected
    observations, the existing safe diagnostic path exposes the exact failing authored
    command, a bounded sanitized failed-node view and error-type categories sufficient
    to distinguish tests/fixtures/implementation hypotheses, while withholding parametrization
    content, tracebacks, raw stdout/stderr and unsafe source text. Where detail is
    unavailable or incomplete, the projection states so explicitly.
- id: AC5
  condition: For exact COMPLETION_GATE or native EXECUTION FAILURE, the same source-bound
    safe diagnostic surface distinguishes validly observed missing/invalid ResultPackage
    claim/structure, final-response shape and native exit/interruption/output categories,
    or marks unobserved sub-causes UNKNOWN. It does not infer canonical completion
    from a task_complete marker, candidate cleanliness or an independent pytest run.
- id: AC6
  condition: Existing exact-subject Brain Sync, Unified State, Attention and bounded
    provider-neutral diagnostic/Work Context readers can compose and validate both
    canonical FAILURE facts and associated safe operational/diagnostic detail without
    a Human-supplied URL, block or private path whenever those sources are accessible;
    a wrong/moved/synthetic source is rejected and absent access is an actionable
    typed blocker.
- id: AC7
  condition: Privacy and authority checks prevent raw private Runtime capture, protected
    host paths, secrets, unbounded GitHub log contents, arbitrary user-submitted URLs
    and cross-RUN/cross-subject diagnostic bytes from entering portable Brain context;
    the already admitted same-RUN Executor local private-read capability and Runtime
    verification ownership remain unchanged.
- id: AC8
  condition: The existing carrier and REPAIR behavior preserves one idempotent authorized
    manual/AUTO/executorless route, correct provenance, duplicate delivery and correction-SHA
    conflict handling; source correlation and diagnostics do not dispatch, retry,
    choose an Executor, create RUN/FAILURE, select REPAIR action, review, publish
    or advance planning.
- id: AC9
  condition: Focused first-party regression fixtures cover the observed pre-RUN missing-Executor
    workflow shape (run 39026366429/job 117378039859), TASK-358-style multi-command
    verification, TASK-360-style verification timing/availability, TASK-370 completion/native
    failures and TASK-371 malformed-fixture pytest failure, plus adversarial substitutions
    and protected/expired input states, exercising production consumers rather than
    an isolated demonstration-only helper.
