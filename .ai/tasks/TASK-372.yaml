task_id: TASK-372
revision: 1
goal: Complete the human-approved post-TASK-371 Brain Self-Service Failure Diagnosis
  capability by combining TASK-370 Gap 2 REPAIR workflow/attempt/job/step correlation
  with minimum safe failure-detail availability missing after TASK-358. From an exact
  TASK/RUN or originating Issue/dispatch selector, a fresh read-only Brain consumer
  must be able to discover trustworthy actionable diagnostics or explicit UNKNOWN/UNAVAILABLE
  without asking Human to copy GitHub workflow URLs, PowerShell blocks, traceback
  or logs when the information is lawfully available. Reuse Runtime-owned FAILURE/EVIDENCE,
  operational receipts, Brain Attention, Unified State and Brain Sync without changing
  their authorities.
problem: TASK-371 r1 RUN-371-002 REVIEW-371-002 PASS has been published into main,
  fixing TASK-370 Gap 1 only. The independently deferred Gap 2 still leaves GitHub
  Issue/repair delivery correlation to actual workflow run ID/attempt/job/step incomplete;
  historical GitHub Actions run 39026366429 job 117378039859 failed before RUN on
  a missing coding Executor while its originating Issue could show dispatch acceptance
  without the attributable job failure. Across the latest 15 TASK identities 357-371,
  canonical FAILURE often publishes only the verification command and exit code, or
  coarse COMPLETION_GATE/NATIVE_EXIT category, while exact failing pytest nodes, bounded
  structural ResultPackage causes, or last-response shape need protected local evidence
  or manual Human diagnostics. TASK-358 deliberately retains raw diagnostics locally
  and grants only the exact admitted Executor private read; its safe public projection
  and workflow correlation are not yet sufficient for self-service Brain diagnosis.
  Fix the missing observation/lookup boundaries, not Runtime's authoritative error
  decisions.
assumptions:
- Human now explicitly prioritizes this independent consolidated follow-up after TASK-371
  publication; this current Human instruction is a prospective override for this exact
  TASK only, not an automatic roadmap NEXT mutation. A later generic continuation
  must reconcile and canonicalize Human/Brain planning state separately.
- Fresh canonical main at authoring is 8a931b19640cfcd838ad6d3b626480dc0e55ee68, which
  equals the exact reviewed source in REVIEW-371-002 PRIMARY PASS; TASK-372 is absent.
  Runtime independently validates expected-main CAS, final TASK schema, source and
  actor authority on ingress.
- TASK-358 safe FAILURE context, exact private Runtime diagnostic digest/locator access
  for an admitted same-RUN Executor, BP-2 Operational Receipt v2, Brain Attention
  and Brain Sync are already published; do not create a second failure authority,
  private-log transport or monitoring database.
- TASK-370 r1 RUN-370-001 through RUN-370-004 and corresponding immutable failures/repairs
  remain historical. TASK-371 fixed Gap 1 and must not be replayed, reverted, reclassified
  or conflated with this Gap 2 and diagnostic-reader work.
- 'Observed sample: GitHub Actions workflow run 39026366429, job 117378039859, step
  ''Deliver one immutable REPAIR intent'', logged ''coding REPAIR requires an explicit
  Executor'', with run_created=false. This workflow failure is not a canonical RUN
  or FAILURE.'
- Current production source permits authenticated GitHub read-only job/log lookup
  once an actual workflow/job identity is known. Backend/source availability and permission
  failures must remain explicitly UNKNOWN/UNAVAILABLE, not silently inferred.
- Default prospective TASK_AUTHORING semantic audit is TCA-1 version 1 selected by
  the current canonical R2.1 policy; this TASK authoring does not delegate an Executor/model/effort,
  admit a RUN, issue a Reviewer verdict, or authorize publication.
