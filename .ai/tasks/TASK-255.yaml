task_id: TASK-255
revision: 3
goal: >-
  Complete the repository-owned GitHub -> ChatGPT Brain wake return path after live
  post-publication conformance proved that the r2 central bridge can project and post
  INGRESS_REJECTED correctly but a wake comment authored by github-actions[bot] is not
  delivered to the ChatGPT Work event trigger, while an otherwise equivalent
  user-attributed PR comment is autonomously ACKed. Preserve the r2 source-pointer /
  projector semantics and replace only the final Wake Bus trigger emission with a
  bounded secretless PR-head commit-update transport on the dedicated PR #1200 branch,
  leaving final ChatGPT Work conformance to a separate post-publication probe.

problem: >-
  TASK-255 r2 is implemented and published on canonical main at
  524b7eacb13d51867135f4589b19cb3c3d95d258. Live P1 created Issue #1215, failed
  ingress receipt comment 5921442341, bridge run 36790617018 and wake comment
  5921447869 with event_id
  github-v1-1bc20ed173c240e093272dc5be034cec9eb50b3f9d11ad851bafb9dde8244e6a.
  The GitHub bridge path passed, but that wake was authored by github-actions[bot] and
  received no ChatGPT Work ACK after many hours. P1b then posted an equivalent
  qualifying wake on PR #1200 as user actor trung-via with event_id
  wake-p1b-actor-discrimination-20261001-001; Work autonomously ACKed it after
  185 seconds in comment 5921598459 and reported the exact fresh canonical main SHA
  524b7eacb13d51867135f4589b19cb3c3d95d258.

  The repository therefore has strong empirical evidence that the remaining break is
  the last-mile PR-comment actor/delivery path, not source handoff or deterministic
  projection. Current public Work documentation also lists PR commit updates as an
  eligible event-trigger class. This revision deliberately does not add a PAT, GitHub
  App credential, external relay, polling or API Brain service. Instead it gives the
  central bridge a narrowly bounded contents:write capability only for the existing
  dedicated Wake Bus PR head branch and one operational marker path so a new wake can
  create a PR commit-update event. Because commit-update delivery from GITHUB_TOKEN is
  not yet proven to wake Work, the implementation is a bounded transport candidate
  whose real success may only be established by a separate post-publication conformance
  probe. If that probe fails, the repository must return to Human/Brain architecture
  review; no credential-bearing fallback is authorized by this TASK.

assumptions:
  - >-
    Canonical main at TASK-255 r3 authoring is
    524b7eacb13d51867135f4589b19cb3c3d95d258, the reviewed and published RUN-255-003
    remediation candidate for TASK-255 r2.
  - >-
    PR #1200 remains the dedicated operational Wake Bus. Its head branch is
    aios-brain-wake-bus-v1 in trung-via/AIOS-renew. The PR, branch and marker are
    transport only and are never canonical TASK/RUN/RESULT/FAILURE/REVIEW/publication
    or roadmap truth.
  - >-
    The r2 workflow_run source-pointer transport, source-object reacquisition, exact
    source provenance checks, attention-family mapping, deterministic event_id
    generation, NO_WAKE behavior and handoff-failure semantics are already reviewed
    and published and remain the semantic baseline for this revision.
  - >-
    Live P1/P1b actor-discrimination evidence is operational conformance evidence, not
    lifecycle truth: github-actions[bot] wake comment 5921447869 was not ACKed;
    user-attributed wake comment 5921558759 was ACKed by 5921598459 after 185 seconds
    with fresh main SHA 524b7eacb13d51867135f4589b19cb3c3d95d258.
  - >-
    ChatGPT Work configuration is outside Executor production-code authority. The
    existing comment-trigger automation may remain present during implementation; a
    commit-update-triggered Work task must be provisioned or adjusted separately by an
    authorized Human/ChatGPT product surface before real r3 conformance is claimed.

scope:
  inspect:
    - docs/AIOS-GITHUB-CHATGPT-BRAIN-WAKE-AUTOMATION-AUDIT-v1.md
    - .ai/brain-audit-profiles.yaml
    - .ai/tasks/TASK-255.yaml
    - .github/workflows/aios-brain-wake-bridge.yml
    - src/aios_renew/brain_wake_bridge.py
    - tests/test_brain_wake_bridge.py
    - tests/test_brain_wake_bridge_workflow.py
  modify:
    - .ai/brain-wake-carriers.yaml
    - .github/workflows/aios-brain-wake-bridge.yml
    - src/aios_renew/brain_wake_bridge.py
    - tests/test_brain_wake_bridge.py
    - tests/test_brain_wake_bridge_workflow.py

non_goals:
  - >-
    Change any existing source workflow, source-pointer artifact, source receipt
    grammar, attention-family mapping, Runtime/Reviewer/Publisher/Unified State
    behavior, lifecycle schema or roadmap semantics.
  - >-
    Add or use a PAT, GitHub App installation credential, GitHub App user access
    token, OAuth token, external relay, Slack/email relay, OpenAI API service, polling
    loop, timer or persistent queue/database.
  - >-
    Treat the Wake Bus PR, wake ledger comment, marker file, branch commit, GitHub
    workflow status or Work ACK as canonical engineering truth or semantic
    authorization.
  - >-
    Merge, rebase for product delivery, or repurpose PR #1200; modify canonical main
    directly from the wake bridge; or write arbitrary files on the Wake Bus branch.
  - >-
    Make the Executor configure ChatGPT Work, claim autonomous Work invocation, claim
    real end-to-end conformance, advance TASK-254, or select a credential-bearing
    fallback if commit-update delivery fails.
  - >-
    Create a Planner, semantic router, retry/failover policy, correction selector,
    Reviewer, Publisher or lifecycle state store in the wake transport.

constraints:
  hard:
    - >-
      Preserve the r2 central projector and all source admission/projection behavior.
      R3 may change only the final delivery mechanism used after a WAKE projection;
      NO_WAKE must perform no Wake Bus branch mutation.
    - >-
      Bind delivery to repository trung-via/AIOS-renew, PR #1200, exact head
      repository trung-via/AIOS-renew, exact head branch aios-brain-wake-bus-v1, and
      one repository-owned operational marker path configured in
      .ai/brain-wake-carriers.yaml. Reacquire and validate the live PR/head identity
      immediately before any write. Fail closed on closed/replaced/forked/substituted
      PR or branch identity.
    - >-
      The marker content must be exact, versioned and bounded and contain only the
      deterministic event_id, attention_family, repository, bounded source selectors
      and fresh_brain_sync_required=true. It must not contain next_action, semantic
      recommendation, lifecycle verdict, roadmap state, model output or credentials.
    - >-
      Use only GITHUB_TOKEN. Add contents:write only to the bridge ring delivery job
      and retain the minimum read/write permissions otherwise required. Do not broaden
      permissions on source workflows.
    - >-
      Use one global Wake Bus delivery concurrency boundary, not per-event
      concurrency, so partial delivery for one event cannot race a later event into
      the same marker branch.
    - >-
      Retain a bounded non-trigger ledger on PR #1200 using a marker distinct from
      [AIOS BRAIN WAKE]. For each event_id there may be at most one ledger comment,
      whose exact state is PENDING or EMITTED. The ledger is operational transport
      evidence only. An EMITTED event is a deterministic NOOP on replay.
    - >-
      A PENDING event must be recoverable without semantic choice: reconcile the exact
      current marker content on the bound Wake Bus branch. If it already names that
      event_id, complete the ledger to EMITTED without creating another marker commit;
      otherwise write the exact marker once and then complete the same ledger entry. A
      new unrelated event must not overtake an unresolved PENDING event. Ambiguous,
      duplicated or contradictory ledger state fails closed rather than fabricating
      completion.
    - >-
      The marker branch update must affect only the configured marker path and must
      not modify canonical main, source code, TASK/RUN/REVIEW/publication refs or any
      other Wake Bus branch path. The bridge must not force-merge or publish PR #1200.
    - >-
      Every successful new marker write must produce an ordinary PR head commit update
      suitable for a later ChatGPT Work commit-update trigger. Executor tests may
      verify deterministic repository/workflow behavior only; they must not treat
      GitHub or Work delivery as Runtime verification or semantic review.
    - >-
      Preserve exact r2 event_id and payload semantics. Replays, source workflow reruns
      and bridge reruns must not create a second marker commit once the corresponding
      ledger is EMITTED.
    - >-
      If the bridge cannot create or reconcile the bounded marker update, the workflow
      must fail with bounded operational evidence. It must not silently fall back to
      github-actions[bot] wake comments, credentials, another branch, another PR,
      polling or a semantic retry.
    - >-
      No file outside scope.modify may change. Executor returns one clean candidate
      with zero unresolved items and makes no Reviewer, publication, roadmap or real
      ChatGPT Work conformance claim.

acceptance:
  - id: AC1
    condition: >-
      All r2 source-pointer, source-reacquisition, provenance, attention-family,
      handoff-failure and NO_WAKE semantics remain intact; r3 changes only the final
      WAKE delivery path.
  - id: AC2
    condition: >-
      A WAKE projection validates the exact live PR #1200 head identity and writes only
      one bounded marker path on aios-brain-wake-bus-v1 using GITHUB_TOKEN, while
      NO_WAKE causes no branch mutation.
  - id: AC3
    condition: >-
      The marker payload is exact and bounded, carries only event
      identity/family/repository/selectors/fresh-sync requirement, and cannot encode
      semantic continuation or lifecycle truth.
  - id: AC4
    condition: >-
      Global delivery serialization plus the PENDING/EMITTED ledger makes exact replay
      idempotent and gives deterministic recovery for the write-versus-ledger
      partial-failure window without allowing a later event to overtake unresolved
      delivery.
  - id: AC5
    condition: >-
      Closed/substituted/forked PR identity, wrong head branch, unauthorized marker
      path, ambiguous ledger, marker mismatch or write failure fails closed and cannot
      mutate main or fabricate canonical lifecycle state.
  - id: AC6
    condition: >-
      Bridge permissions are minimum sufficient: contents:write exists only on the
      ring delivery job for the bounded Wake Bus branch update; no source workflow
      permission expands and no credential or external relay is introduced.
  - id: AC7
    condition: >-
      Focused regression covers new delivery, NO_WAKE, exact replay, PENDING recovery
      both before and after marker write, unrelated-event blocking, ambiguous ledger,
      PR/head substitution, marker-path confinement and preservation of r2 projection
      behavior.
  - id: AC8
    condition: >-
      The candidate makes no claim that ChatGPT Work commit-update delivery succeeds.
      Real autonomous Work wake/ACK is a separate post-publication conformance gate;
      failure there returns to Human/Brain architecture review with no automatic
      credential fallback.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_brain_wake_bridge.py tests/test_brain_wake_bridge_workflow.py
    - git diff --check
