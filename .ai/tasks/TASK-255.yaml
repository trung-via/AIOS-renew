task_id: TASK-255
revision: 4
goal: >-
  Close the live post-publication read-after-write consistency defect in the
  secretless PR-head Wake Bus transport without changing the selected r3 architecture.
  Preserve exact pre-write PR/head admission, marker/ledger identity and no-retry
  semantics, but make one ordinary successful marker write complete in the same bridge
  attempt when GitHub's pull-request head SHA temporarily lags the branch ref that has
  already advanced to the exact marker commit.

problem: >-
  TASK-255 r3 was reviewed, published, and then exercised live by Issue #1220. The
  source ingress correctly rejected the bounded conformance probe and source handoff
  projected INGRESS_REJECTED. Bridge workflow run 36806928682 attempt 1 created the
  exact PENDING ledger comment 5923638532 and successfully committed marker event
  github-v1-f89372ce2240f2d3d17f7c4c69312045d0c75d0fa3d95516484ea11cbe3c2c01
  to the dedicated Wake Bus branch at commit
  70e5b34021c0735728798e1c88cffecd8df7ba2e, but then failed with
  "live PR and branch head disagree". The branch ref had already advanced while the
  pulls/1200 representation still exposed the previous head SHA. After GitHub's PR
  representation converged, a manual rerun of only the failed ring job completed
  successfully, changed the same ledger from PENDING to EMITTED, and created no second
  marker commit. This proves the r3 PENDING recovery path works and localizes the live
  defect to an immediate post-write PR-head/ref equality assumption, not projector,
  event identity, branch write permission, marker confinement, or recovery semantics.

assumptions:
  - >-
    Canonical main at r4 authoring is
    b1c9a6ed77eb3bd90d00a73d0a906f1b9ad3752f, the exact reviewed/published
    TASK-255 r3 candidate.
  - >-
    PR #1200 is still open and bound to repository trung-via/AIOS-renew, head branch
    aios-brain-wake-bus-v1 and base main. The live r3 marker commit is
    70e5b34021c0735728798e1c88cffecd8df7ba2e and its exact ledger comment
    5923638532 is EMITTED after deterministic manual recovery.
  - >-
    GitHub's branch ref and contents-write response can expose the newly written commit
    before the pull-request representation's head.sha converges. This is treated only
    as a bounded operational read-after-write lag observed in the live probe, never as
    permission to accept arbitrary PR/head disagreement.
  - >-
    Real ChatGPT Work commit-update invocation remains a separate post-publication
    conformance gate. R4 does not configure Work and cannot claim that gate passes.

scope:
  inspect:
    - .ai/tasks/TASK-255.yaml
    - .ai/brain-wake-carriers.yaml
    - .github/workflows/aios-brain-wake-bridge.yml
    - src/aios_renew/brain_wake_bridge.py
    - tests/test_brain_wake_bridge.py
    - tests/test_brain_wake_bridge_workflow.py
  modify:
    - src/aios_renew/brain_wake_bridge.py
    - tests/test_brain_wake_bridge.py
    - tests/test_brain_wake_bridge_workflow.py

non_goals:
  - >-
    Change source-pointer projection, attention-family mapping, event_id derivation,
    marker or ledger grammar, marker path, Wake Bus branch, PR number, permissions,
    credentials, source workflows, Runtime/Reviewer/Publisher behavior, lifecycle
    schemas or roadmap semantics.
  - >-
    Add sleep, polling, retry loops, automatic workflow reruns, token refresh,
    credential fallback, PAT/App tokens, another branch/PR, comment-trigger fallback
    or external relay.
  - >-
    Weaken pre-write exact PR/head/ref validation or allow an arbitrary stale,
    substituted or third-party PR head SHA after the write.
  - >-
    Treat the contents-write response, branch ref, PR object, marker or ledger as
    canonical engineering truth. They remain bounded operational transport evidence.
  - >-
    Configure ChatGPT Work, claim autonomous Work invocation, advance TASK-254, or
    close real wake conformance.

constraints:
  hard:
    - >-
      Preserve exact r3 pre-write validation: immediately before creating a PENDING
      ledger and immediately before writing the marker, PR #1200 must be open,
      unmerged, same PR/repository identity, exact head repository/branch, base main,
      and its advertised head SHA must equal the exact live Wake Bus branch ref.
    - >-
      After a successful marker contents write, bind one immutable write transition:
      pre_write_head_sha -> write_response_commit_sha. The exact branch ref must equal
      write_response_commit_sha before completion can proceed.
    - >-
      During only that post-write transition, the PR representation may advertise
      either pre_write_head_sha or write_response_commit_sha while all PR identity,
      repository, head branch and base branch fields remain exact. Any third SHA,
      changed PR identity, fork/substitution, closed/merged PR, wrong branch, or branch
      ref other than write_response_commit_sha fails closed.
    - >-
      Confirm the marker from the exact write_response_commit_sha, not from a mutable
      branch alias, and require exact canonical marker bytes/digest/event_id before the
      ledger may become EMITTED.
    - >-
      Immediately before PATCHing PENDING -> EMITTED, reacquire PR identity and exact
      branch ref under the same bounded post-write rule. The branch ref must still be
      write_response_commit_sha. No later unrelated branch movement may be accepted as
      successful delivery.
    - >-
      If the marker already exists for the exact PENDING event on a later recovery
      invocation, retain existing r3 recovery behavior: no second marker commit and
      completion is allowed only after current PR and branch ref have converged to the
      exact existing marker commit under normal exact validation.
    - >-
      Do not add waiting, polling or automatic transport retry to mask eventual
      consistency. The correction must remove the invalid immediate equality
      assumption by using exact write-transition evidence and bounded identity checks.
    - >-
      Preserve one global Wake Bus concurrency group, exact PENDING/EMITTED ledger,
      one marker path, GITHUB_TOKEN-only delivery, and all r3 fail-closed write-target
      confinement.
    - >-
      No file outside scope.modify may change. Executor returns one clean candidate
      with zero unresolved items and makes no Reviewer/publication/roadmap/real-Work
      conformance claim.

acceptance:
  - id: AC1
    condition: >-
      Existing r3 projection, marker, ledger, permission, confinement, replay and
      recovery semantics remain unchanged except for bounded post-write PR-head lag
      reconciliation.
  - id: AC2
    condition: >-
      A live-equivalent first delivery where contents PUT advances the exact branch ref
      to the returned commit while PR head.sha temporarily remains the exact pre-write
      SHA completes EMITTED in one bridge attempt with exactly one marker commit.
  - id: AC3
    condition: >-
      The same post-write path also succeeds when PR head.sha already equals the new
      commit, and marker confirmation is read from the exact new commit SHA.
  - id: AC4
    condition: >-
      A third/unrelated PR head SHA, changed PR/repository/branch identity, branch ref
      mismatch, marker mismatch, or branch movement after write fails closed before
      EMITTED.
  - id: AC5
    condition: >-
      Pre-write PR head/ref equality remains exact and cannot use the post-write lag
      allowance.
  - id: AC6
    condition: >-
      Existing PENDING recovery after an interrupted successful write still completes
      the same ledger without creating a second marker commit.
  - id: AC7
    condition: >-
      Focused regression includes the exact live failure shape from bridge run
      36806928682 attempt 1 plus adversarial third-SHA and post-write branch-movement
      cases.
  - id: AC8
    condition: >-
      No retry/poll/sleep, credential, permission, workflow-source, marker-schema or
      Work-configuration change is introduced; real Work commit-update wake remains a
      separate post-publication conformance gate.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_brain_wake_bridge.py tests/test_brain_wake_bridge_workflow.py
    - git diff --check
