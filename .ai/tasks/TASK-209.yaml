task_id: TASK-209
revision: 1

goal: >
  Activate the reviewed and published TASK-208 corrected source-REPAIR bootstrap consumer
  through the existing single production _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA allowlist
  slot, binding that slot only to exact SHA
  ce56528487e1f521d0c458dc4e48575620d87a42, without changing source-REPAIR,
  migration, REPAIR, Runtime, Reviewer, Publisher, roadmap or downstream semantics.

problem: >
  TASK-208 completed through RUN-208-001 FAILURE, REPAIR-208-001, RUN-208-002 RESULT,
  REVIEW-208-002 PASS and exact publication at
  ce56528487e1f521d0c458dc4e48575620d87a42. That published generation corrects the
  TASK-206/TASK-207 two-stage source-REPAIR consumer boundary: staging requires one exact
  activated target, while the already-bound target consumes its exact transport without
  reading its own activation slot. Production activation is intentionally closed at
  _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA = None. BP-9 downstream recovery therefore requires
  one separate post-publication activation TASK before any exact downstream REPAIR
  transport may be attempted.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is exactly
    ce56528487e1f521d0c458dc4e48575620d87a42.
  - >
    TASK-208 r1 canonical lineage is RUN-208-001 FAILURE, REPAIR-208-001,
    RUN-208-002 RESULT, REVIEW-208-002 PRIMARY PASS and Publisher publication of exact
    ce56528487e1f521d0c458dc4e48575620d87a42.
  - >
    The published TASK-208 consumer keeps _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA = None and
    therefore rejects production source-REPAIR staging until this successor activation.
  - >
    TASK-208 already proves that target-side --accept-transport consumption does not read
    the staging activation slot and remains guarded by exact transport, stored-intent,
    clean checkout, exact target HEAD, running-source and failed-bootstrap lineage proofs.
  - >
    Existing _SOURCE_BOOTSTRAP_TARGET_SHA remains exact
    31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 and existing _BOOTSTRAP_TARGET_SHA remains
    exact 83115b26df85a7ad6643f317833e18b18586bdbe.
  - >
    BP-9 downstream adoption remains the unique Human/Brain roadmap NEXT. This TASK is only
    the bounded upstream activation prerequisite and does not mutate or advance downstream
    state or roadmap planning state.

