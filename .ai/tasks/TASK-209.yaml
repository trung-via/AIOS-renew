  - >
    Activate mutable main, a branch/ref, TASK-206 target
    37437be4e43d07d5c818022cb20d19d9c347da7c, failed TASK-206 candidate
    1669ef080f82862d5e7d4f607eb0d3b592011872, the eventual TASK-209 candidate SHA,
