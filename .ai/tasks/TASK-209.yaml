constraints:
  hard:
    - >
      The sole production behavior change is replacing the existing literal
      _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA = None with exact literal
      ce56528487e1f521d0c458dc4e48575620d87a42. No list/set of targets, fallback,
      mutable lookup, environment/config override, network discovery, current-main
      derivation or self-derived candidate SHA is permitted.
    - >
      Preserve source-REPAIR staging guard semantics: production staging is admitted only
      when intent.target_generation_sha equals exact
      ce56528487e1f521d0c458dc4e48575620d87a42. Any other target must reject before target
      staging, target invocation, REPAIR Runtime admission or continuation RUN creation.
    - >
      Preserve TASK-208 target-side semantics byte-for-byte in production: when
      --accept-transport is supplied, consumption must remain independent of
      _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA and must still require exact transport-path
      equality, immutable stored-intent equality, clean target checkout identity, exact
      target HEAD, exact running-source proof and failed-bootstrap lineage validation
      before existing run_repair_wakeup() delegation.
    - >
      Preserve completed failed source-bootstrap history as immutable input and preserve
      exact failed RUN, control/pin identity, legacy generation attestation, separate
      transport namespace, idempotency, conflict rejection and no synthetic engineering
      terminal before REPAIR Runtime admission.
    - >
      Preserve _SOURCE_BOOTSTRAP_TARGET_SHA =
      31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 and _BOOTSTRAP_TARGET_SHA =
      83115b26df85a7ad6643f317833e18b18586bdbe exactly.
    - >
      Update deterministic tests so repository production state itself proves exactly one
      source-REPAIR activation equal to the published TASK-208 SHA; production defaults
      reject fixture, TASK-206, failed TASK-206, source-PRIMARY, TASK-209/self/current and
      future targets before staging; and fixture activation remains explicitly test-only
      where needed to exercise transport behavior.
    - >
      Existing TASK-208 fresh-interpreter target-consumption regression and negative
      transport/path/intent/source/HEAD proofs must not be weakened. Test updates may adapt
      only production activation expectations and local fixture injection required by the
      new exact activation.
    - >
      No production code beyond the existing source-REPAIR activation literal may change.
      Tests may update exact production expectations and focused rejection coverage only.
    - >
      Executor returns one clean candidate with zero unresolved implementation items and
      does not review, publish, execute downstream recovery, authorize downstream REPAIR,
      mutate roadmap state or perform any later BP-9 action.

acceptance:
  - id: AC1
    condition: >
      src/aios_renew/operator.py contains exactly one production
      _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA and its value is the literal exact SHA
      ce56528487e1f521d0c458dc4e48575620d87a42.
  - id: AC2
    condition: >
      With production defaults, a source-REPAIR bootstrap intent naming any target other
      than ce56528487e1f521d0c458dc4e48575620d87a42 is rejected before target staging,
      target invocation, REPAIR admission or continuation RUN creation, including the
      TASK-209 candidate/current source itself.
  - id: AC3
    condition: >
      TASK-208 two-stage semantics remain intact: target-side bound transport consumption
      is independent of the activation slot and still fails closed on wrong path, stored
      intent, running source or target HEAD before REPAIR delegation or engineering RUN
      creation.
  - id: AC4
    condition: >
      Source-bootstrap/migration semantics, historical bootstrap activations, exact failed
      lineage protections, Runtime verification/evidence ownership, Reviewer/Publisher
      authority, documentation and roadmap state remain unchanged.
  - id: AC5
    condition: >
      No downstream repository/pin/TASK/RUN/REPAIR or migration state is mutated or
      executed, no RUN-255-003 recovery or BP-9 completion is claimed, and activation
      introduces no new routing/retry/fallback/failover or lifecycle authority.

