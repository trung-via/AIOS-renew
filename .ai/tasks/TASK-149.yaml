task_id: TASK-149
revision: 1
goal: Implement BP-2 Operational Attribution v2 so the existing PRIMARY, REMEDIATION,
  and REPAIR remote/self-host handoffs expose one bounded machine-readable operational
  explanation of the highest boundary actually proven, preserve exact typed lower-layer
  causes through the Unified Human Surface, and reduce to an exact canonical terminal
  pointer once RESULT or FAILURE truth exists. Close pre-AIOS/self-host dark zones
  without creating a second lifecycle state system, changing existing dispatch ownership,
  or moving engineering truth away from Runtime and canonical lineage.
problem: 'Current outer execution surfaces have an attribution gap between GitHub
  carrier acceptance and AIOS canonical lifecycle state. The self-hosted PRIMARY,
  REMEDIATION, and REPAIR workflows can fail before invoking AIOS because the persistent
  repository is missing or invalid, the bounded AIOS command is unavailable, or bounded
  selectors fail workflow preflight; these failures are visible only as workflow/log
  outcomes and create no canonical RUN or FAILURE, which is correct but leaves no
  typed operational receipt. Existing carrier receipts also use dispatch/acceptance
  language across different observable boundaries: PRIMARY createWorkflowDispatch
  proves only that GitHub accepted a dispatch request, while reusable REMEDIATION/REPAIR
  workflow completion observes a later boundary. After AIOS is invoked, the repository
  already has authoritative typed Admission Failure v2 / correction-preflight causes
  and durable dispatch-to-RUN binding, but human_surface.py currently collapses delegated
  failures to DELEGATED_OPERATION_FAILED. TASK-149 must join these existing facts
  into bounded observability without duplicating lifecycle truth or inventing semantic
  authority.'
assumptions:
- Canonical AIOS-renew main at TASK-149 authoring is 5fe91f48998798fc49c4738e1d6dd57faee68ed8.
  The Human/Brain roadmap marks bp-2-operational-attribution-v2 as the unique NEXT
  milestone and reserves TASK-149 revision 1.
- docs/AIOS-BRAIN-PORTABILITY.md is the Human-approved planning authority. Its Operational
  Receipt v2 contract requires attributable carrier/runner/AIOS/admission/RUN/terminal
  boundaries, typed pre-AIOS reasons, terminal pointers instead of copied lifecycle
  truth, and preservation of typed lower-layer causes through Human-facing projection.
- TASK-130 / BP-1 is reviewed and published. PRIMARY remote authorization remains
  the exact six-selector v2 contract dispatch_id/task_id/task_revision/task_blob_sha/task_commit_sha/executor;
  TASK-149 must not add, remove, weaken, or reinterpret those authorization selectors.
- Admission Failure v2 and Correction Preflight already own the stable AIOS-side admission
  phase/reason taxonomy, including PRIMARY synchronization, TASK admission, canonical
  lineage, repository admission, historical/reusable state, remote transport, integration,
  and RUN namespace reasons. BP-2 reuses those exact typed causes rather than defining
  a competing post-AIOS taxonomy.
- Existing PRIMARY, correction, and REPAIR dispatch journals are operational-only
  durable ownership/reconciliation state and already provide exact dispatch-to-RUN
  binding. TASK-149 may project their facts but does not replace or reinterpret their
  ownership, collision, replay, at-most-once, or crash-reconciliation semantics.
- TASK-112's coalesced remediation-intent path is the steady-state remote REMEDIATION
  carrier, while the existing approved-remediation-wakeup surface remains a valid
  fallback/debug delivery path. Both must remain authority-compatible.
- TASK-113 terminal attention remains the established subordinate reverse attention
  mechanism after an exact canonical RESULT or FAILURE terminal exists. TASK-149 does
  not create another terminal notifier, poller, completion outbox, or terminal store.
- Frozen Kernel v0.1 remains FROZEN. Human owns intent and Executor choice, Brain
  owns TASK semantics, Runtime/canonical lineage own engineering lifecycle truth and
  verification evidence, Reviewer owns semantic verdict, Publisher owns publication,
  and carriers/receipts remain subordinate transport/observability.
