task_id: TASK-192
revision: 2

goal: >
  Preserve the TASK-192 r1 pytest parameter-id hardening objective while correcting
  only its pre-verification completion-contract boundary so an Executor claims
  implementation properties before Runtime verification and Runtime alone establishes
  the serial, xdist, collect-only, and PYTEST_CURRENT_TEST execution evidence.

problem: >
  RUN-192-001 is an admitted PRIMARY FAILURE at COMPLETION_GATE on candidate
  50d6482ab09741ee155bd827fdf9553d633ee14e. The candidate is clean, transportable,
  repairable, descends from the admitted base, changes exactly tests/conftest.py and
  tests/test_pytest_parameter_id_guard.py, and has no outside-scope mutation.
  Verification did not run. The failure reason was that RESULT could not satisfy AC3
  and AC5 because r1 expressed future Runtime-owned verification outcomes as acceptance
  criteria: that the oversized test actually reaches its body on the Windows self-host,
  that PYTEST_CURRENT_TEST is bounded during execution, and that serial/xdist/full
  collect-only commands pass. The repository TASK authoring contract requires every
  acceptance criterion to be truthfully claimable by the Executor as a concrete
  implementation property before Runtime verification. Revision 2 therefore preserves
  the implementation intent, scope, safety caps and exact verification commands, reuses
  the compatible RUN-192-001 candidate rather than restarting, and rewrites only the
  acceptance boundary so Runtime verification and Reviewer judgment retain their
  authorities.

assumptions:
  - >
    Canonical main at r2 authoring is
    ad64f8872e547878e2ec8cfe0a672141f02438e3 and roadmap planning binds the unique
    NEXT maintenance item to TASK-192 revision 2.
  - >
    RUN-192-001 remains immutable FAILURE truth: phase COMPLETION_GATE, failed head
    50d6482ab09741ee155bd827fdf9553d633ee14e, changed_files exactly
    tests/conftest.py and tests/test_pytest_parameter_id_guard.py, dirty=false,
    descends_from_base=true, outside_task_scope=[], repairable=true,
    transportable=true, verification_seconds=null.
  - >
    Because RUN-192-001 never reached Runtime verification, no canonical claim is made
    that its implementation is correct or that any TASK-192 verification command
    passes. Its in-scope candidate is reusable implementation work only.
  - >
    RUN-189-001 and RUN-191-001 remain the canonical evidence for the repeated Windows
    pytest node-id / PYTEST_CURRENT_TEST overflow family. Existing local explicit-id
    fixes in TASK-189 and TASK-191 remain valid defense-in-depth and are not removed.
  - >
    Current pyproject.toml supports pytest >=8.2,<9 and pytest-xdist >=3.6,<4 for the
    active verification profiles. tests/conftest.py remains the suite-wide pytest
    harness surface.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns the semantic
    verdict; Publisher owns publication. Executor claims only pre-verification
    implementation properties.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-189.yaml
    - .ai/tasks/TASK-191.yaml
    - .ai/tasks/TASK-192.yaml
    - pyproject.toml
    - tests/conftest.py
    - tests/test_reviewer_provider.py
    - tests/test_gemini_reviewer_transport.py
  modify:
    - tests/conftest.py
    - tests/test_pytest_parameter_id_guard.py

non_goals:
  - Modify any src/aios_renew production module, Runtime, Operator, verifier, Reviewer,
    Publisher, ingress, workflow, carrier, executor adapter/profile, frozen Kernel, or
    downstream repository.
  - Repair or reinterpret RUN-192-001 under revision 1; r1 remains immutable historical
    FAILURE and r2 is the corrected semantic contract.
  - Change, patch, raise, bypass, or emulate the Windows environment-variable limit.
  - Change pytest or pytest-xdist versions, pytest.ini configuration, plugin autoload,
    worker count policy, or canonical parallel-verification policy.
  - Rewrite or mutate collected item.nodeid values after collection.
  - Hash, repr, serialize, traverse, or otherwise inspect arbitrary parameter objects
    merely to manufacture ids; non-string/non-bytes values remain on pytest's existing
    identity path.
  - Rewrite existing explicit ids across the suite, skip/xfail/deselect/rename/remove
    tests, or weaken coverage to avoid long ids.
  - Add retry, fallback, alternate test execution, automatic correction selection, or
    any lifecycle/semantic authority.
  - Require a full test-suite execution when focused tests plus full collect-only
    evidence are sufficient.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve and reuse compatible RUN-192-001 candidate work rather than redoing the
      maintenance from scratch. HOW of reuse belongs to Executor; if current canonical
      state makes the candidate incompatible, report unresolved rather than discarding
      useful work silently.
    - >
      Mutation remains limited exactly to tests/conftest.py and
      tests/test_pytest_parameter_id_guard.py. If correct prevention requires any
      production, workflow, pyproject, Runtime, or existing-test modification, stop
      unresolved rather than widening scope.
    - >
      Implement suite-wide auto-id bounding through the public
      pytest_make_parametrize_id hook. It may return a custom id only for oversized
      str or bytes parameter values; ordinary values and all other object types must
      return None so pytest retains its existing identity behavior.
    - >
      Auto-id compaction must be deterministic and xdist-safe. Use SHA-256, never
      Python hash(), randomness, process identity, clock state, object id, provider
      state, or environment-dependent input. Distinct oversized values of the same
      type and length must remain distinguishable by digest.
    - >
      Preserve ordinary ids: str/bytes values whose direct length is at most 512
      characters/bytes must not be replaced by the custom hook. Values above that
      threshold may be represented only by a compact bounded identifier containing
      type, original length, and deterministic SHA-256 digest; the raw oversized value
      must not appear in the generated id.
    - >
      Add a second fail-closed collection guard over the final collected item.nodeid.
      A nodeid longer than 8192 characters must stop collection before test setup/call
      rather than reaching PYTEST_CURRENT_TEST. The guard must not rewrite nodeids,
      reorder items, deselect tests, or mutate semantic collection state.
    - >
      Overlong-nodeid diagnostics must themselves be bounded and must not echo the full
      raw nodeid or oversized parameter value. They may report a bounded locator plus
      nodeid length and SHA-256 digest sufficient to diagnose the source without
      recreating the oversized context.
    - >
      The hook must not call repr(), str(), pickle, JSON serialization, recursive
      traversal, or user-defined methods on arbitrary non-str/non-bytes parameter
      objects.
    - >
      The guard must be cross-platform and always active, not conditional on Windows,
      because deterministic collection identity should be identical on Windows and
      non-Windows workers.
    - >
      The regression surface must include a directly parametrized >262144-byte bytes
      value without explicit ids and assertions that, when Runtime executes it, the
      test body observes a bounded generated nodeid and PYTEST_CURRENT_TEST value.
      Include an oversized string case, repeated-call determinism, distinct same-length
      digest separation, normal short-value pass-through, and arbitrary-object
      pass-through without repr/str.
    - >
      The regression surface must exercise the collected-nodeid guard directly and
      assert that an over-8192 explicit/custom nodeid fails closed with bounded
      diagnostics while a below-limit nodeid passes without mutation. Do not place an
      intentionally overlong explicit id into normal collection in a way that makes
      the required suite inherently un-runnable.
    - >
      Preserve all current TASK-189 and TASK-191 local explicit-id corrections.
    - >
      Executor RESULT claims may cover only pre-verification implementation properties.
      It must not claim that Runtime verification passed, that the large parameter
      actually executed successfully on the host, that PYTEST_CURRENT_TEST was observed
      bounded during canonical verification, that xdist/full collection passed, that
      Reviewer will PASS, that publication occurred, or that the maintenance is
      engineering-complete.
    - >
      Runtime verification remains minimum-sufficient and unchanged from r1: focused
      serial, focused two-worker xdist, full repository collect-only, then diff check.
      A full executable suite remains unnecessary because production/runtime semantics
      are unchanged.

acceptance:
  - id: AC1
    condition: >
      The implementation contains one deterministic pytest_make_parametrize_id hook
      that leaves ordinary and non-str/non-bytes values on pytest's existing path and
      compacts only oversized str/bytes values into bounded type/length/SHA-256 ids
      without raw oversized content.
  - id: AC2
    condition: >
      The implementation contains one suite-wide fail-closed collection guard for final
      nodeids longer than 8192 characters, with bounded non-raw diagnostics and no
      nodeid rewriting, item reordering, deselection, or semantic collection mutation.
  - id: AC3
    condition: >
      The regression implementation includes a directly auto-parametrized >262144-byte
      bytes case with no explicit id and asserts inside the test body that the generated
      nodeid and PYTEST_CURRENT_TEST are bounded, so Runtime can establish the original
      RUN-189-001/RUN-191-001 failure family is prevented by executing the authored
      focused verification.
  - id: AC4
    condition: >
      The regression implementation covers deterministic repeated ids, distinct
      same-length oversized values, oversized string handling, short-value pass-through,
      arbitrary-object pass-through without invoking representation methods, and
      bounded fail-closed handling of an explicit/custom overlong nodeid.
  - id: AC5
    condition: >
      The implementation is deterministic across serial and xdist collection by
      construction: generated ids depend only on parameter type, direct length and
      SHA-256 content; the collection guard is order-preserving and mutation-free for
      valid items; no random, clock, process-local, worker-order, platform-branch, or
      shared mutable cross-worker state participates in identity.
  - id: AC6
    condition: >
      The delta remains confined to the two authorized test-harness files, preserves
      existing TASK-189/TASK-191 local explicit-id fixes, changes no production or
      lifecycle authority, adds no retry/fallback/router behavior, and reports zero
      unresolved implementation items.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_pytest_parameter_id_guard.py
    - python -m pytest -q -n 2 tests/test_pytest_parameter_id_guard.py
    - python -m pytest --collect-only -q
    - git diff --check
