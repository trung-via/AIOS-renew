task_id: TASK-264
revision: 1
goal: Extend the published H1R PRIMARY pre-RUN reconciliation path so a diverged local
  main can be safely restored when its entire local-only history is preserved by one
  exact canonical reviewed PASS Result candidate, without weakening any existing reconciliation
  safety gate or acquiring Reviewer/Publisher authority.
problem: TASK-263 could not create a RUN because PRIMARY synchronization rejected
  the diverged control checkout with 'diverged main has missing or ambiguous canonical
  preservation'. TASK-257's H1R contract requires every local-only commit to remain
  reachable through validated immutable canonical AIOS transport lineage, but the
  current implementation recognizes only refs/heads/aios/failure/* plus failure-artifacts
  and proves them with prove_remote_failed_candidate. A successful reviewed candidate
  such as RUN-262-004 is instead preserved by refs/heads/aios/review/RUN-262-004 with
  canonical RESULT/artifacts and REVIEW decision, so the Runtime fails closed even
  though the history is canonically retained. This blocks TASK-263 before RUN creation
  and exposes an H1R implementation gap rather than a TASK-263 implementation failure.
assumptions:
- Canonical main at TASK-264 authoring is 4dc97b7cb06da28587385d6e3724c2693381ad28;
  roadmap selects TASK-264 as the unique H1R blocker before returning to TASK-263.
- TASK-257 / SAFE_LOCAL_MAIN_RECONCILIATION_V1 is already reviewed and published at
  1489ecb2b0684f184b2523cf998f80e6a3a72720; its contract requires complete canonical
  preservation of local-only history and does not semantically limit preservation
  to FAILURE lineage.
- RUN-262-004 has canonical reviewed candidate 766f4805f08fd95c621f8bd081fee55afdc44f86,
  artifacts 7ae594092fa4e7f56cde0ab5d54b0ec80055afe8 and review decision 1458674ecd381a4c54a3f5ad1b994af8cf22088d;
  REVIEW-262-002 is DELTA PASS. Reviewed preservation is not publication.
- TASK-263 dispatch task263-r1-codex61-high-20261001-001 terminated at PRIMARY_SYNCHRONIZATION
  as ADMISSION_REJECTED with run_created=false and executor_invoked=false; no TASK-263
  REPAIR is authorized by that operational failure.
scope:
  inspect:
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - .ai/tasks/TASK-257.yaml
  - .ai/roadmap-state.yaml
  - src/aios_renew/operator.py
  - src/aios_renew/review_transport.py
  - src/aios_renew/publication.py
  - src/aios_renew/authoring_ingress.py
  - tests/test_operator.py
  modify:
  - src/aios_renew/operator.py
  - tests/test_operator.py
non_goals:
- Modify TASK-263 Publisher compatibility semantics, TASK-262 source, RUN-262-004
  artifacts/review, or replay publication inside TASK-264.
- Treat a review ref, artifacts ref, review-decision ref, arbitrary branch, tag, local
  preservation branch, or mere commit reachability by itself as sufficient preservation
  proof.
- Turn reviewed status into publication status, publish source, choose a semantic
  verdict, create a REVIEW, or bypass Publisher authority.
- Broaden automatic destructive reconciliation beyond PRIMARY pre-RUN synchronization,
  attached clean main, the exact configured upstream main, or the already-published
  H1R reset/restart safety boundary.
- Create a generic preservation plugin/router, scan arbitrary refs/remotes, fabricate
  FAILURE/REPAIR/RUN lineage, or perform workflow-level Git reset/rebase/merge/cherry-pick/stash/clean
  recovery.
- Implement the queued Cross-Authority Context & Canonical-Shape Conformance hardening;
  that remains sequenced after TASK-263 and RUN-262-004 publication recovery.
constraints:
  hard:
  - Keep the existing H1R FAILURE-preservation path behaviorally unchanged, including
    its canonical failure/failure-artifacts proof, drift checks, complete local-only
    reachability proof, worktree/index/submodule/ignored-path checks, exact-target
    reset, postconditions and restart-generation safety.
  - Add one closed reviewed-Result preservation class for PRIMARY divergence only.
    A qualifying candidate must be the exact local HEAD and be uniquely identified
    by canonical review transport with matching canonical RUN/ResultPackage artifacts
    and canonical review decision; a review ref alone is insufficient.
  - Reviewed-result preservation must validate the exact canonical task/run/result/review
    identity and candidate SHA using existing artifact/review semantics; the canonical
    review decision must be the unique exact decision for that RUN, bind reviewed_sha
    to local HEAD, and have verdict PASS. Missing, malformed, conflicting, moved,
    ambiguous, cross-task, non-PASS or substituted transport must fail closed rather
    than falling back to another preservation class.
  - All local-only commits that would become unreachable from local main after reset
    must remain reachable from the exact validated reviewed candidate preservation
    identity, and that identity plus canonical target/upstream/worktree safety must
    be rechecked at the destructive mutation edge.
  - The reviewed candidate is preservation evidence only. H1R must not infer publication,
    completion, roadmap advancement, publication eligibility or a semantic verdict
    from preservation, and must not mutate any review/artifact/publication ref.
  - 'Preservation-family selection must be deterministic and closed: exactly one valid
    supported preservation proof may authorize reconciliation; zero, multiple, conflicting
    or mixed ambiguous proofs fail closed without resetting or creating a RUN.'
  - No Executor, workflow or transport layer may choose or perform the reset. Runtime
    remains the sole reconciliation mutation authority and continuation may occur
    only after exact H1R postconditions succeed.
  - The observed RUN-262-004-shaped regression must prove reviewed PASS Result preservation
    can recover a diverged local main while negative regressions prove an unreviewed
    candidate, non-PASS/mismatched review decision, missing/substituted artifacts,
    ambiguous preservation and moved proof remain non-destructive.
acceptance:
- id: AC1
  condition: PRIMARY pre-RUN synchronization can reconcile a clean attached-main divergence
    when the exact local HEAD is uniquely preserved as a canonically reviewed PASS
    Result candidate with matching canonical RUN/ResultPackage artifacts and review
    decision, while establishing the same exact target and clean postconditions as
    existing H1R.
- id: AC2
  condition: The existing canonical FAILURE preservation path and all H1R worktree,
    upstream, common-lineage, mutation-edge, ignored-content, submodule, target-drift,
    postcondition and restart-generation protections remain behaviorally unchanged.
- id: AC3
  condition: A review ref alone, missing or malformed ResultPackage/artifacts, mismatched
    candidate or TASK/RUN identity, non-PASS or substituted review decision, conflicting
    terminal lineage, ambiguous qualifying RUN identity, or proof movement cannot
    authorize reset and creates no RUN or Executor invocation.
- id: AC4
  condition: Every local-only commit made unreachable from local main by a reviewed-result
    reconciliation is proven reachable from the exact canonical preservation candidate
    before reset and is re-proven together with preservation identity immediately
    before the destructive mutation.
- id: AC5
  condition: 'Reviewed-result preservation remains evidence of reachability only:
    reconciliation does not publish the candidate, alter review/publication refs,
    infer lifecycle completion or semantic verdict, fabricate FAILURE/REPAIR/RUN state,
    or advance roadmap semantics.'
- id: AC6
  condition: Focused regressions reproduce the RUN-262-004 reviewed-Result preservation
    shape and cover the adversarial missing, malformed, substituted, ambiguous, moved
    and non-PASS cases while preserving existing failure-preservation regressions.
- id: AC7
  condition: The implementation changes only src/aios_renew/operator.py and tests/test_operator.py
    and introduces no workflow-level Git recovery, generic lifecycle router, new semantic
    authority, persistent reconciliation state or automatic retry/failover mechanism.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_operator.py -k "reconciliation or primary_sync
    or synchronization_failure or wakeup_preflight"
  - git diff --check
