non_goals:
  - >
    Add or modify Unified State, Correction Frontier, Brain Sync, Flow Resolver, Flow Cards,
    Runtime completion policy, Reviewer, Publisher, authoring ingress, review transport,
    correction dispatch, remote approval authority, execution-profile policy, provider adapters,
    provider protocols, or frozen Kernel semantics.
  - >
    Add a seventh semantic flow, FINDING_SELECTION flow, correction Planner, generic context
    selector, generic lifecycle/correction router, second correction frontier, second lifecycle
    truth, autonomous correction choice, retry/failover authority, model router, memory database,
    conversation store, orchestration database, broker, daemon, scheduler, watcher, or polling
    loop.
  - >
    Make deterministic support choose which outstanding finding Brain should address, rank
    findings, merge multiple findings into one remediation, or author a REMEDIATION automatically.
  - >
    Use correction-dispatch journals, workflow receipts, carrier state, local Runtime journals or
    current mutable refs as replacement semantic truth for exact correction authorization
    provenance.
  - >
    Rewrite historical REMEDIATION RUN artifacts to pretend they carried an authorization identity
    that was not persisted at admission, or infer a missing historical authorization SHA from
    content equivalence, latest refs, chat history, or provider memory.
  - >
    Add Git/GitHub/network discovery to Decision Packet compilation, persist Decision Packets as
    canonical truth, invoke a provider/Executor, create a RUN, run canonical verification, publish,
    advance roadmap semantics, or mutate refs from the compiler.
  - >
    Re-declare REVIEW/REMEDIATION/REPAIR semantic enums or duplicate canonical validators where an
    existing contract/validator can be reused.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      AIOS_DECISION_PACKET v1 remains one deterministic, read-only, provider-neutral envelope for
      exactly one selected semantic decision and supports exactly the existing six BP-3 flows:
      ARCHITECTURE, TASK_AUTHORING, SEMANTIC_REVIEW, REMEDIATION_AUTHORING,
      REPAIR_AUTHORING and DIAGNOSTIC. NONE, unknown flows, unknown payload kinds and packet
      nesting fail closed.
    - >
      REMEDIATION_AUTHORING is one flow with a closed typed subject union, not a new lifecycle
      state. A UNIQUE_FINDING subject binds one exact source RUN, REVIEW, finding and reviewed SHA.
      A CORRECTION_FRONTIER subject represents the valid state in which no unique finding is
      selected and binds the exact current correction execution base plus the complete bounded
      outstanding finding set exposed by canonical Unified State.
    - >
      For CORRECTION_FRONTIER, the compiler must require an exact set match against Unified State
      outstanding_findings after deterministic normalization. Missing, extra, duplicate,
      substituted or identity-mismatched findings fail closed. Ordering alone must not grant
      semantic priority or change which findings are represented.
    - >
      Each frontier finding projected for Brain must carry enough bounded semantic REVIEW material
      to reason about that finding without chat or direct GitHub access: exact source RUN,
      REVIEW id, reviewed SHA, finding id, acceptance basis, action, bounded location, issue and
      expected outcome. The compiler must not rank, filter, choose, merge or recommend among these
      findings.
    - >
      Minimum Necessary Context applies to correction authoring. Do not replicate RESULT,
      EVIDENCE, repository source or full review history per frontier item when the exact canonical
      finding contract and bounded lineage facts are sufficient. Additional bounded evidence
      material is allowed only where the selected semantic decision actually requires it.
    - >
      Newly admitted canonical REMEDIATION RUN documents must retain the exact immutable canonical
      remediation authorization commit SHA used at admission, under one stable lineage field such
      as remediation_authorization_sha. The field is provenance only: it does not create approval,
      mutation, review, publication, routing or lifecycle authority.
    - >
      The same exact authorization-retention rule applies to both approved native REMEDIATION and
      direct-candidate acceptance paths. If the exact canonical remediation authorization identity
      cannot be established before a new REMEDIATION RUN is admitted, fail closed before creating
      that RUN rather than emitting lineage with guessed or partial provenance.
    - >
      Historical REMEDIATION RUN artifacts without the new authorization field remain immutable
      and readable by existing lifecycle/publication surfaces. Decision Packet compilation that
      specifically requires exact prior-correction provenance must fail closed when supplied
      historical material lacks that provenance; it must not reconstruct or infer the missing SHA.
    - >
      SEMANTIC_REVIEW prior-correction lineage must bind exact immutable correction authorization
      identity. REMEDIATION lineage binds the retained remediation authorization SHA to the exact
      correction RUN and supplied remediation/review/predecessor identities; REPAIR lineage binds
      the existing repair_authorization_sha to the exact failed/correction RUN authorization.
      Structurally valid but different authorization content/SHA or mixed RUN/review/finding/head
      lineage fails closed.
    - >
      Decision Packet provenance and packet_fingerprint bind Work Context invalidation, selected
      flow, typed subject, all projected semantic content and every applicable immutable material
      identity. Any semantic or authorization-provenance change changes packet identity, while
      checkout root, remote alias, host, line endings, current time, UUID, provider/model/session
      identity and other machine-local representation do not.
    - >
      Keep canonical facts, bounded observations, Executor claims, prior semantic decisions and
      current Human input in distinct information classes. RESULT claims remain Executor claims;
      REVIEW/REMEDIATION/REPAIR remain prior semantic decisions; Human text cannot overwrite
      canonical subject/provenance/authority. The compiler creates no verdict, hypothesis,
      correction choice, Executor choice, lifecycle action, publication action or roadmap
      decision.
    - >
      Preserve BP-3 side-flow semantics exactly: blocker, pending canonical semantic obligation,
      pending authority owner and requires_fresh_context_for_continuation remain visible and
      unchanged. A side-flow packet cannot imply that a pending correction/review obligation was
      resolved.
    - >
      Preserve Decision Packet v1 boundedness and portability: rendered packet at most 131072
      UTF-8 bytes; Human input at most 16384 bytes; any included free-text excerpt/delta field at
      most 65536 bytes; invalid Unicode, NaN/non-JSON values and over-bound input/output fail
      closed without truncation. Exclude machine-local root/workspace/remote details, raw evidence
      paths/logs, secrets, chat history, chain-of-thought, timestamps and provider/session
      metadata.
    - >
      Revision 2 is prospective. Existing TASK-178 r1 RUN/REVIEW/REMEDIATION refs remain immutable
      historical evidence and must not be executed as authority for revision 2. New PRIMARY
      authorization for TASK-178 r2 must bind revision 2 under existing exact-intent admission.
    - >
      Do not modify files outside scope.modify. If satisfying this contract requires changing
      Unified State, Correction Frontier, Flow Resolver, transport/publication contracts,
      correction dispatch/approval authority, provider surfaces or frozen Kernel semantics, fail
      closed back to Brain rather than widening scope.

acceptance:
  - id: AC1
    condition: >
      AIOS_DECISION_PACKET v1 is a deterministic, bounded, JSON-serializable, provider-neutral
      envelope compiled from an exact valid Work Context, matching Flow Resolution and typed
      caller-supplied canonical decision material, with stable normalized rendering and packet
      fingerprint for equivalent semantic input.
  - id: AC2
    condition: >
      Exactly the six BP-3 semantic flows remain supported through closed typed payload contracts,
      with no new Planner/router/selector flow or lifecycle authority; NONE, unknown flow/payload,
      packet nesting and malformed or unrelated material fail closed.
  - id: AC3
    condition: >
      REMEDIATION_AUTHORING supports both UNIQUE_FINDING and CORRECTION_FRONTIER typed subjects.
      UNIQUE_FINDING binds one exact source RUN/REVIEW/finding/reviewed SHA, while
      CORRECTION_FRONTIER represents a valid unselected multi-finding state without deterministic
      finding selection.
  - id: AC4
    condition: >
      A CORRECTION_FRONTIER packet contains the complete exact normalized Unified State
      outstanding-finding set and bounded semantic finding contracts needed by a fresh Brain;
      missing, extra, duplicate, substituted or cross-lineage findings are rejected and ordering
      does not create priority.
  - id: AC5
    condition: >
      Every newly admitted canonical REMEDIATION RUN on both approved native execution and
      direct-candidate acceptance retains the exact immutable canonical remediation authorization
      SHA used for admission, while historical RUN artifacts remain unchanged and readable.
  - id: AC6
    condition: >
      Prior correction material used by SEMANTIC_REVIEW is cross-bound to its exact immutable
      remediation or repair authorization identity and exact RUN/review/finding/failed-head
      lineage; valid-but-different authorization content/SHA and mixed lineage are rejected before
      a packet is emitted.
  - id: AC7
    condition: >
      Canonical facts, observations, Executor claims, prior semantic decisions and Human input
      remain distinct, existing semantic validators are reused where applicable, and the compiler
      produces no finding choice, verdict, hypothesis, correction strategy, Executor choice,
      lifecycle/publication action or roadmap decision.
  - id: AC8
    condition: >
      Existing BP-3 invalidation, blocker/pending-obligation preservation, deterministic
      fingerprint invalidation, portability/privacy exclusions and Decision Packet v1 byte bounds
      remain enforced for all six flows including both REMEDIATION_AUTHORING subject shapes.
  - id: AC9
    condition: >
      The implementation is additive above existing authorities: Unified State, Correction
      Frontier, Flow Resolver, Reviewer, Publisher, correction dispatch/approval and transport
      remain authoritative and unchanged; no second truth or routing authority is introduced, and
      TASK-178 r1 lineage remains immutable historical evidence rather than execution authority for
      revision 2.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_decision_packet.py tests/test_brain_context.py
    - python -m pytest -q tests/test_operator.py -k direct_candidate_and_approved_remediation_persist_predecessor_identity_ac2
    - git diff --check
