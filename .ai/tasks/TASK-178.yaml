task_id: TASK-178
revision: 2

goal: >
  Complete BP-4 Decision Packet Compiler with a deterministic, bounded, provider-neutral
  AIOS_DECISION_PACKET v1 that remains a pure cognitive-support projection while correctly
  representing both unique correction findings and an unselected bounded correction frontier,
  and strengthen newly admitted REMEDIATION lineage so exact canonical correction authorization
  identity can be carried into later Decision Packets without relying on chat memory, provider
  GitHub access, or operational dispatch journals.

problem: >
  TASK-178 r1 established the intended six-flow Decision Packet architecture but semantic review
  exposed two contract-level gaps. First, REMEDIATION_AUTHORING cannot be represented when Unified
  State intentionally exposes multiple outstanding findings without selecting one; requiring an
  exact finding before the packet exists would either make a valid Brain flow uncompilable or move
  finding selection into deterministic support. Second, later semantic review of a correction
  needs the immutable canonical remediation/repair authorization identity, but newly admitted
  REMEDIATION RUN lineage does not currently retain the exact remediation authorization SHA even
  though Runtime already knows it at admission. BP-4 must support these cases without becoming a
  Planner, correction router, second frontier, second lifecycle truth, or provider-specific
  discovery layer.

assumptions:
  - >
    TASK-178 r1, RUN-178-001, REVIEW-178-001 CHANGES_REQUIRED and the already-authored
    REMEDIATION for FINDING-178-001 remain immutable historical lineage. No r1 remediation RUN was
    admitted. Revision 2 supersedes the semantic TASK contract prospectively and must not rewrite,
    delete, execute, or reinterpret that historical lineage.
  - >
    BP-3 remains authoritative for AIOS_BRAIN_WORK_CONTEXT v1, Flow Resolution, the exact six
    semantic flow identities, blocker preservation, pending-obligation preservation and authority
    ownership. Revision 2 does not add a new flow.
  - >
    Unified State and Correction Frontier remain the sole deterministic lifecycle/frontier
    reducers. In a valid multi-finding AUTHOR_REMEDIATION state, they may intentionally leave one
    exact finding selector unset while exposing the full bounded outstanding_finding set so Brain
    retains semantic selection authority.
  - >
    Runtime already resolves exact canonical approved remediation identity before an approved
    REMEDIATION execution. The missing requirement is prospective retention of that immutable
    identity in newly admitted canonical REMEDIATION RUN lineage, not creation of a new approval,
    transport, dispatch, or lifecycle authority.
  - >
    Existing REPAIR lineage already retains repair_authorization_sha. Decision Packet correction
    provenance should use the existing immutable authorization identities of each correction
    family rather than infer identity from equivalent content or a mutable current ref.
  - >
    transport_post_pass carries persisted RUN bytes into canonical artifacts. No new transport
    artifact family is required solely to retain REMEDIATION authorization identity.

