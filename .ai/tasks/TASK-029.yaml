task_id: TASK-029
revision: 1

goal: >
  Repair the narrow Antigravity ResultPackage string-ingestion boundary so an
  otherwise-valid structural JSON result prefixed by a single UTF-8 BOM is
  accepted during remediation handoff, while preserving executor isolation,
  existing structural/canonical validation, Runtime verification authority,
  and fail-closed behavior.

problem: >
  At the v0.1.3 candidate baseline, AntigravityAdapter._normalize passes string
  output directly to json.loads. An Antigravity structural remediation result
  beginning with U+FEFF therefore fails before structural validation with
  "Unexpected UTF-8 BOM". This is an Antigravity adapter transport/decoding
  defect, not a semantic TASK or REMEDIATION defect. The candidate is otherwise
  frozen; this TASK is the sole narrow freeze exception for this defect.

assumptions:
  - The observed Antigravity payload is otherwise valid structural JSON once the leading UTF-8 BOM marker is handled.
  - The defect belongs to Antigravity adapter string ingestion; Codex and shared operator behavior require no change.
  - Existing validate_structural_result, validate_result, and validate_evidence behavior remains authoritative and unchanged.
  - The current semantic remediation lineage is not advanced, rewritten, or executed by this kernel repair.

scope:
  inspect:
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py

  modify:
    - src/aios_renew/antigravity_adapter.py
    - tests/test_antigravity_adapter.py

non_goals:
  - Change Codex adapter behavior.
  - Change shared operator behavior or executor routing.
  - Change structural or canonical ResultPackage schemas or validation rules.
  - Change TASK, REVIEW, or REMEDIATION lineage or artifacts for the semantic task that exposed this defect.
  - Run or remediate that semantic task as part of this kernel repair.
  - Add retry, reroute, fallback, automatic recovery, or publication behavior.
  - Add broad encoding repair, arbitrary character stripping, or permissive JSON recovery.
  - Tag or publish AIOS-renew v0.1.3.

constraints:
  hard:
    - This freeze exception authorizes modifications only to the two files listed in scope.modify.
    - Keep the repair inside the Antigravity adapter boundary; do not modify Codex or operator code.
    - Only a leading U+FEFF encoding marker may become ignorable transport syntax; do not remove or reinterpret any other invalid input.
    - After the narrow boundary handling, existing JSON parsing and structural/canonical validators must remain the decision authority.
    - Malformed JSON must remain fail-closed with AntigravityOutputError.
    - Structurally invalid and canonically invalid ResultPackages must remain fail-closed exactly as before.
    - Preserve singleton satisfies compatibility normalization exactly.
    - Preserve mapping/dict output behavior exactly.
    - Preserve empty structural evidence behavior and canonical claim-evidence requirements exactly.
    - Preserve Runtime-owned canonical verification and EVIDENCE construction.
    - Preserve PRIMARY and REMEDIATION Git binding, scope enforcement, staging, repository revalidation, and one-active-executor behavior.
    - Do not execute, rerun, revise, or publish the semantic TASK/REMEDIATION that exposed this defect.
    - If PRIMARY and REMEDIATION share the same Antigravity string normalization path, any behavior change outside remediation must be limited strictly to the same leading-BOM tolerance; all non-BOM behavior must remain unchanged.

acceptance:
  - id: AC1
    condition: >
      An otherwise-valid Antigravity structural ResultPackage supplied as a
      JSON string with one leading U+FEFF is accepted by the remediation
      adapter path and normalizes to the same ResultPackage as the equivalent
      non-BOM string.

  - id: AC2
    condition: >
      Existing valid non-BOM Antigravity string output and mapping output
      normalize exactly as before.

  - id: AC3
    condition: >
      Malformed JSON, including malformed JSON after an optional leading
      U+FEFF, still raises AntigravityOutputError and remains fail-closed.

  - id: AC4
    condition: >
      Structural schema violations still fail structural validation, and
      canonical output still enforces the existing claim-evidence requirements.

  - id: AC5
    condition: >
      Singleton string satisfies compatibility, empty structural evidence, and
      all other TASK-028 Antigravity adapter behavior remain unchanged.

  - id: AC6
    condition: >
      Codex adapter code, shared operator code, Runtime verification semantics,
      and Git/remediation lineage semantics are untouched.

  - id: AC7
    condition: >
      Focused regression tests explicitly cover BOM-prefixed structural
      remediation output, equivalent non-BOM behavior, and fail-closed invalid
      input.

  - id: AC8
    condition: >
      The implementation delta contains no files outside
      src/aios_renew/antigravity_adapter.py and tests/test_antigravity_adapter.py.

verification:
  required:
    - python -m pytest tests/test_antigravity_adapter.py -q
    - git diff --check
    - git status --porcelain
