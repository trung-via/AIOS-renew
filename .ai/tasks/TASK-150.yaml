task_id: TASK-150
revision: 1

goal: >
  Implement BP-V1 Verification Contract Hardening as one prospective,
  repository-owned deterministic minimum-sufficient verification contract so newly
  authored TASK revisions and their REMEDIATION contracts cannot silently require
  known redundant proof on the same unchanged subject, REPAIR can deterministically
  normalize overlap created only by combining already-authorized verification sources,
  and justified full-suite use is explicit without moving semantic judgment or
  canonical verification truth out of Runtime.

problem: >
  Canonical policy already says verification is progressive, minimum-sufficient, and
  full-suite execution is justified rather than ritual. Current implementation does not
  enforce that policy. TASK parsing rejects only exact duplicate command strings;
  REMEDIATION affected_verification has no equivalent duplicate/subsumption contract;
  and repair_completion_policy combines TASK verification with origin remediation
  verification using dict.fromkeys, which removes exact strings only. Historical evidence
  demonstrates material redundant cost on unchanged candidate state: RUN-145-002 ran a
  focused Unified State subset, then the containing file suite, then a 1207-test full
  suite taking 1343.67 seconds; RUN-144-006 ran focused suites and a 378-test combined
  suite before a 1222-test full suite, with the combined suite taking 1192.47 seconds
  and the full suite 1578.39 seconds. BP-V1 must close this contract gap prospectively
  without reinterpreting historical lineage, introducing heuristic test selection, or
  absorbing BP-V2/BP-V3/BP-V4 performance work.

assumptions:
  - Canonical main at TASK authoring is 476d1ef2eb6d9822f1f764a22fd08c1ed872ea4b.
  - BP-V1 Verification Contract Hardening is the unique canonical NEXT roadmap milestone.
  - >
    TASK-150 is the bootstrap change and is authored under the currently published legacy
    TASK verification schema; it does not require the prospective v1 marker that it introduces.
  - >
    After TASK-150 is reviewed and published, current-main Authoring Ingress is the
    prospective enforcement point for new TASK identities and new TASK revisions.
  - >
    Historical canonical TASK, REVIEW, REMEDIATION, REPAIR, RUN, RESULT, FAILURE and
    EVIDENCE artifacts remain immutable and must remain readable and usable.
  - >
    src/aios_renew/verification.py already has the correct narrow responsibility:
    execute the final authorized command list once in order, bind Runtime evidence, and
    fail closed on execution/evidence errors.
  - >
    Known verification coverage may be inferred only from a deliberately small,
    repository-owned deterministic grammar; unsupported or ambiguous commands remain opaque.
  - >
    BP-V2 owns intrinsic full-suite harness acceleration, BP-V3 owns verification workspace
    isolation, and BP-V4 owns parallel verification/performance guards.

