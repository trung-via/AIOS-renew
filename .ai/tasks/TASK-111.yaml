task_id: TASK-111
revision: 1

goal: >
  Close the observed Failure-to-REPAIR continuation transport gap by adding one dedicated,
  Brain-callable, bounded remote REPAIR wakeup path that starts only from an already
  canonical AUTHOR_REPAIR authorization, preserves REPAIR as a semantic authority distinct
  from PRIMARY and REMEDIATION, and delegates exactly once into the existing Runtime
  run_repair authority with durable crash-safe attribution.

problem: >
  TASK-108 live execution produced two canonical failures, RUN-108-001 and RUN-108-002.
  Brain correctly reviewed each exact FAILURE and canonicalized REPAIR authorizations
  REPAIR-108-001 and REPAIR-108-002 with action CODE_FIX, but current main exposes no remote
  REPAIR wakeup. Unified State then reports EXECUTE_REPAIR and the Human-facing surface can
  delegate locally into run_repair, so the Human had to run a local aios continue command
  for each correction. Existing A6 approved REMEDIATION transport cannot fill this gap:
  its contract is correction_dispatch_id + source_run_id + finding_id + executor and it
  delegates only to approved-remediation-wakeup. PRIMARY transport also cannot be reused
  because A2 identity and admission semantics are PRIMARY-specific. Reusing either carrier
  would collapse frozen correction authority boundaries. Add a separate bounded REPAIR
  delivery transport instead.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-111 authoring is
    e717ac6c4ca163f1cc8006fb7b7a1db5ebb9c2e7, which canonically authors TASK-110 r1 but
    does not yet implement it. TASK-110 is the separate Review-to-Publication transport gap
    and must remain semantically independent from this TASK.
  - >
    TASK-108 canonical lineage contains failure refs for RUN-108-001 and RUN-108-002 and
    repair refs for both failed runs. The two observed manual REPAIR continuations are the
    concrete evidence for this transport gap.
  - >
    The existing Unified Human Surface already distinguishes EXECUTE_REPAIR from
    EXECUTE_REMEDIATION and delegates EXECUTE_REPAIR to run_repair using exact
    failed_run_id, canonical correction_document, and required_repair_sha. This existing
    Runtime/Operator REPAIR authority remains authoritative.
  - >
    TASK-082/TASK-084 A6 remediation work established an important crash-safety lesson:
    outer correction delivery may not attribute a later metadata-matching RUN merely from
    a pre-invocation namespace snapshot; exact RUN ownership must be durably bound at the
    canonical admission boundary before execution can later be reconciled.
  - >
    TASK-108 live probe on 2026-09-13 replayed exact PRIMARY dispatch identity
    brain-task108-codex-20260913-001 and returned the existing terminal RUN-108-001 with
    replayed true and no new RUN. That proves the desired outer idempotency property but
    does not grant PRIMARY dispatch semantics authority over REPAIR.

