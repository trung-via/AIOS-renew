non_goals:
  - >
    Reuse, widen, or add a generic operation selector to PRIMARY A1/A2 carriers,
    TASK-108 PRIMARY wakeup, A3/A6 REMEDIATION transport, TASK-112 remediation-intent
    carrier, Brain authoring ingress, or Publisher workflows.
  - >
    Treat REPAIR and REMEDIATION as aliases; infer a REVIEW finding from FAILURE;
    convert REPAIR to REMEDIATION; or let one dispatch identity cross correction
    families.
  - >
    Author REPAIR automatically from FAILURE, choose a REPAIR action, infer correction
    scope, automatically choose/default/reroute an Executor, retry a failed REPAIR RUN,
    or add fix-until-PASS/autonomous correction loops.
  - >
    Circumvent, evade, weaken, or work around OpenAI/ChatGPT host safety checks. A host
    safety block before GitHub receives the request is transport evidence only.
  - >
    Implement GAP-C Runtime-terminal-to-Brain signaling, polling, notifications,
    completion outboxes, autonomous review, or any reverse handoff mechanism.
  - >
    Change REPAIR semantic actions, Runtime verification, review authority, publication
    authority, frozen Kernel/governance semantics, downstream pins, or TASK-109 roadmap
    reconciliation.
  - >
    Add a generic lifecycle router, queue, scheduler, poller, service daemon, database,
    PAT/service-account dependency, fallback Executor, or alternate publication authority.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Define one dedicated versioned REPAIR wakeup request family, policy, parser,
      GitHub-hosted admission workflow, and fixed self-hosted REPAIR target. Its exact
      title/marker and state namespace must be distinct from PRIMARY, REMEDIATION intent,
      and Brain authoring ingress; no generic operation selector is permitted.
    - >
      One immutable REPAIR delivery intent binds exactly repair_dispatch_id,
      failed_run_id, exact current canonical REPAIR authorization SHA, and the Executor
      selector required by the canonical REPAIR action. Task identity, repair action,
      scope, failed head, verification commands, repository path, model, workflow/ref,
      shell command, publication data, and arbitrary Git refs are never trusted from the
      carrier request.
    - >
      CODE_FIX and CONTINUE_IMPLEMENTATION require one explicit supported coding
      Executor selected by the Human. That single selection is the Human execution intent
      for the immutable REPAIR delivery and must not be requested again solely because a
      carrier was unavailable or the identical delivery is replayed. NO_CHANGE must not
      require, infer, or fabricate a coding Executor.
    - >
      The self-hosted target independently resolves the exact canonical FAILURE and
      REPAIR authorization and requires the requested REPAIR SHA to be current. Unified
      State/correction preflight must still authorize EXECUTE_REPAIR for the failed RUN;
      stale, missing, malformed, ambiguous, conflicting, or unauthorized correction state
      fails closed before a new REPAIR RUN executes.
    - >
      Outer REPAIR dispatch state is operational-only and separate from PRIMARY A2 and
      REMEDIATION A6 state. Identical replay preserves the original immutable selectors,
      exact admitted RUN identity, Executor where applicable, and terminal outcome;
      reuse of repair_dispatch_id with conflicting failed_run_id, repair SHA, or Executor
      binding fails closed.
    - >
      Crash safety requires exact durable ownership at canonical REPAIR RUN admission.
      Before Executor execution can proceed, the outer dispatch must be bound to the exact
      admitted continuation RUN. An unbound dispatch must never claim a later
      metadata-matching RUN. Only its exact already-bound RUN may be reconciled from
      canonical RESULT/FAILURE without re-execution; uncertain state cannot launch a
      second invocation.
    - >
      Successful delivery delegates into existing run_repair authority rather than
      duplicating repair admission, Executor invocation, canonical verification,
      RESULT/FAILURE persistence, or correction semantics in carrier/dispatch code.
      Existing direct aios continue/direct repair surfaces remain valid local/debug
      mechanisms.
    - >
      GitHub-Issue admission runs on a GitHub-hosted runner, validates exact repository,
      authorized actor, opened event, exact title, body size, versioned request shape and
      selector grammar, treats body as inert data, and passes only sanitized bounded
      selectors to one fixed repository-owned self-hosted workflow on main.
    - >
      Carrier success means delivery to the fixed REPAIR workflow completed successfully,
      not merely that the reusable job was non-skipped. A failed, cancelled, or skipped
      dispatch is REJECTED/not accepted, must not close the Issue as successful, and must
      preserve a failing carrier outcome. Receipt text must never assert REPAIR RUN,
      verification, semantic review, or publication success.
    - >
      A host-side transport block before GitHub receives an Issue creates no GitHub or
      AIOS authority/state and is classified only as outer transport unavailable unless
      evidence proves another category. The same immutable Human/Brain REPAIR intent may
      be redelivered through manual workflow_dispatch or the bounded local operator
      surface without a second Human Executor-selection decision. No implementation may
      attempt to bypass the host safety gate.
    - >
      Existing PRIMARY A2 dispatch, TASK-108 PRIMARY Issue carrier, A3/A6/TASK-112
      REMEDIATION paths, Unified Human Surface direct EXECUTE_REPAIR, Runtime
      verification, semantic review, and safe Publisher remain behaviorally compatible
      and authority-separated.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      An authorized dedicated REPAIR wakeup for canonical CODE_FIX or
      CONTINUE_IMPLEMENTATION state reaches exactly one fixed self-hosted REPAIR target
      and delegates exactly once into existing run_repair using the one Human-selected
      supported Executor.
  - id: AC2
    condition: >
      A canonical NO_CHANGE REPAIR uses the same dedicated family without accepting or
      fabricating coding-Executor authority and preserves existing NO_CHANGE
      verification/evidence-reuse semantics.
  - id: AC3
    condition: >
      Wrong repo/actor/title/event/format, malformed selectors, stale or mismatched REPAIR
      SHA, missing required Executor, forbidden Executor on NO_CHANGE, non-EXECUTE_REPAIR
      state, or conflicting repair_dispatch_id reuse fails closed before new REPAIR
      execution.
  - id: AC4
    condition: >
      Exact duplicate delivery across Issue, workflow_dispatch, and bounded local fallback
      is at-most-once: terminal replay returns the original bound RUN/outcome and performs
      no new Executor invocation; active/uncertain replay cannot start a second RUN.
  - id: AC5
    condition: >
      Crash/restart regressions prove an unbound outer repair dispatch cannot claim a later
      metadata-matching RUN, while an exact RUN durably bound at canonical REPAIR admission
      can reconcile existing RESULT/FAILURE without re-execution.
  - id: AC6
    condition: >
      Carrier receipt reports accepted only when both admission and the fixed REPAIR
      dispatch complete successfully; failure/cancel/skip remains rejected, does not close
      the Issue as successful, and never fabricates RUN/verification/review/publication
      success.
  - id: AC7
    condition: >
      Host safety blocking before GitHub admission leaves repository and local AIOS state
      unchanged, and the same immutable intent can be delivered through another supported
      bounded carrier without renewed Human Executor selection and without any safety-gate
      bypass mechanism.
  - id: AC8
    condition: >
      PRIMARY, REMEDIATION/TASK-112, direct aios continue EXECUTE_REPAIR, Runtime
      verification, semantic review, and safe publication remain behaviorally compatible
      and authority-separated; no GAP-C reverse-handoff authority is introduced.
  - id: AC9
    condition: >
      Required focused verification and git diff --check pass, every modified file is in
      TASK-111 revision-2 scope, and RESULT contains zero unresolved items.

