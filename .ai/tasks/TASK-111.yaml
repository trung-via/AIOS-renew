non_goals:
  - Reuse, widen, or add an operation selector to the TASK-108 PRIMARY Issue carrier, A1/A2
    PRIMARY dispatch, or A6 approved REMEDIATION wakeup.
  - Treat REPAIR and REMEDIATION as aliases, infer a REVIEW finding for a FAILURE, convert a
    REPAIR into REMEDIATION, or let one dispatch identity cross correction families.
  - Author REPAIR automatically from FAILURE, choose a REPAIR action, choose a coding
    Executor when Human choice is required, or infer correction scope from diagnostics.
  - Change REPAIR semantic actions, repair admission/preverification, Runtime verification,
    Reviewer authority, publication authority, or frozen FAILURE/REPAIR meanings.
  - Add a generic lifecycle router, queue, scheduler, poller, automatic retry/reroute,
    fallback Executor, database, service daemon, PAT dependency, or alternate correction
    lifecycle.
  - Change TASK-110 Review-to-Publication transport, downstream pins, or TASK-109 roadmap
    reconciliation in this TASK.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Define one dedicated versioned REPAIR wakeup request family and repository-owned
      carrier policy. Its GitHub Issue title marker, parser, workflow, and self-hosted target
      must be distinct from PRIMARY and general Brain authoring ingress. The request must not
      contain a generic operation selector.
    - >
      One request must bind a stable repair_dispatch_id, exact failed_run_id, exact canonical
      REPAIR authorization SHA, and only the Executor choice required by that REPAIR action.
      Task identity, repair action, modification scope, failed head, and execution meaning
      must be resolved from canonical FAILURE/REPAIR state rather than trusted from Issue
      content.
    - >
      Carrier admission must be GitHub-hosted, validate exact repository/actor/title/event
      framing under repository-owned policy, treat Issue body as inert data, and dispatch one
      fixed self-hosted REPAIR workflow on main with only sanitized bounded selectors. Issue
      receipt may report dispatch acceptance but must explicitly not claim RUN success,
      verification success, review PASS, or publication.
    - >
      The self-hosted REPAIR wakeup must independently resolve exact canonical FAILURE and
      REPAIR authorization, require current canonical correction identity to match the
      requested REPAIR SHA, and fail closed if Unified State/correction preflight no longer
      authorizes EXECUTE_REPAIR for that failed run.
    - >
      CODE_FIX and CONTINUE_IMPLEMENTATION require one explicit supported coding Executor.
      NO_CHANGE must preserve its existing non-coding semantics and must not create coding
      authority merely because the transport supports executor-bearing REPAIR actions.
    - >
      Outer REPAIR dispatch state must be separate from PRIMARY A2 dispatch state and A6
      correction-dispatch state. The same repair_dispatch_id replay with identical binding
      must never execute run_repair twice; reuse with conflicting failed_run_id, repair SHA,
      or Executor binding must fail closed as an immutable collision.
    - >
      Crash safety must use exact durable ownership at canonical REPAIR RUN admission. Before
      Executor execution can proceed, the outer repair dispatch must be bound to the exact
      admitted continuation RUN. A re-delivery with no such exact durable binding must not
      claim a later metadata-matching REPAIR RUN merely because it appeared after a namespace
      snapshot. Only the exact already-bound RUN may be reconciled from existing terminal
      RESULT/FAILURE without re-execution.
    - >
      Successful remote delivery must delegate into the existing run_repair authority rather
      than duplicate repair admission, Executor invocation, verification, result/failure
      persistence, or transport logic in carrier code. Existing direct aios continue and
      direct repair paths remain valid local/debug surfaces.
    - >
      Terminal replay must preserve the original RUN identity and outcome; nonterminal
      replay must either report the exact bound operation as in progress/blocked or reconcile
      from canonical state without launching a second RUN. Transport status is operational
      observability only, never canonical engineering truth.
    - >
      Tests must prove distinct carrier framing, malicious body inertness, exact selector
      validation, explicit Executor rules, collision rejection, terminal replay, crash
      reconciliation with exact admission binding, no-reexecution, and absence of calls into
      PRIMARY/A6 dispatch functions.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      An authorized Brain REPAIR wakeup Issue for a canonical CODE_FIX or
      CONTINUE_IMPLEMENTATION REPAIR reaches exactly one fixed self-hosted REPAIR wakeup and
      delegates exactly once into existing run_repair with the Human-selected Executor.
  - id: AC2
    condition: >
      A canonical NO_CHANGE REPAIR can use the same dedicated family without fabricating a
      coding Executor requirement, while existing NO_CHANGE Runtime verification/reuse
      semantics remain unchanged.
  - id: AC3
    condition: >
      Wrong repo/actor/title/format, malformed selectors, stale or mismatched repair SHA,
      missing required Executor, conflicting repair_dispatch_id reuse, non-EXECUTE_REPAIR
      state, or unauthorized correction fails closed before a new REPAIR RUN is executed.
  - id: AC4
    condition: >
      Exact duplicate delivery is at-most-once: after terminal completion it returns the
      original bound RUN/outcome with replay attribution and creates no additional RUN; while
      active it cannot launch a second invocation.
  - id: AC5
    condition: >
      Crash/restart regression proves an unbound repair dispatch cannot claim a later
      metadata-matching RUN, while an exact RUN durably bound at canonical REPAIR admission
      can be reconciled from its existing RESULT/FAILURE without re-execution.
  - id: AC6
    condition: >
      PRIMARY A2 dispatch, TASK-108 PRIMARY Issue wakeup, A6 approved REMEDIATION wakeup,
      direct aios continue EXECUTE_REPAIR behavior, Runtime verification, semantic review,
      and safe publication remain behaviorally compatible and authority-separated.
  - id: AC7
    condition: >
      Required focused verification and git diff --check pass with no modified file outside
      TASK-111 scope and RESULT contains zero unresolved items.

verification:
  required:
