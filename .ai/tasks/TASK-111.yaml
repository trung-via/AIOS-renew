task_id: TASK-111
revision: 2

goal: >
  Close GAP-B by adding one dedicated, Brain-callable, bounded remote REPAIR wakeup
  path that starts only from an already-canonical AUTHOR_REPAIR authorization, keeps
  FAILURE/REPAIR authority distinct from PRIMARY and REMEDIATION, and delegates at
  most once into the existing Runtime run_repair authority with exact durable RUN
  attribution. For coding REPAIR actions, one explicit Human Executor choice is the
  complete Human execution intent and may be redelivered through another supported
  carrier without asking the Human to select or approve the same correction again.

problem: >
  TASK-108 proved the Failure-to-REPAIR continuation gap: exact canonical FAILURE and
  AUTHOR_REPAIR state can exist while remote continuation still requires a Human to
  invoke the local Human-facing surface. TASK-111 revision 1 correctly separated a
  dedicated REPAIR delivery family from PRIMARY and REMEDIATION, but its assumptions
  predate published TASK-110 and TASK-112. Current main has now live-proven automatic
  Review-to-Publication dispatch and published Human approval-coalescing/transport
  semantics. It has also observed that ChatGPT GitHub mutation calls can be blocked by
  an outer OpenAI host safety gate before GitHub receives any request. GAP-B therefore
  needs the original dedicated REPAIR dispatch authority plus the newer transport
  invariants: host-side delivery failure creates no AIOS state, identical immutable
  intent can use a bounded fallback carrier without renewed Human intent, carrier
  acceptance requires actual successful dispatch, and transport receipts never claim
  REPAIR RUN, verification, review, or publication success.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-111 revision-2 authoring is
    e1147eb02e1fe6f6b8fec6340906b0a3476e2186, the semantically reviewed and
    automatically published TASK-112 correction candidate.
  - >
    TASK-110 Review-to-Publication transport is published and live-proven: the
    RUN-112-002 DELTA PASS ingress produced publication_dispatch ACCEPTED and the safe
    Publisher advanced main automatically. Publication remains a separate authority.
  - >
    TASK-112 is published and establishes the applicable transport lesson for bounded
    Human intent: outer host safety blocking before GitHub admission is transport
    unavailability, not canonical AIOS failure; immutable intent may be redelivered
    through another supported carrier; changing a bound selector is new intent.
  - >
    TASK-112 does not grant REPAIR authority. Existing FAILURE, AUTHOR_REPAIR,
    Unified State EXECUTE_REPAIR, correction preflight, run_repair, Runtime
    verification, RESULT/FAILURE persistence, review, and publication semantics remain
    authoritative for REPAIR.
  - >
    TASK-108 canonical lineage contains concrete failed RUN and REPAIR authorization
    evidence demonstrating the original manual REPAIR continuation gap. Historical
    evidence remains immutable and need not be rerun merely to prove the gap again.
  - >
    Current explicit Human priority is to close GAP-B before GAP-C. This TASK does not
    itself revise roadmap planning state or implement Runtime-to-Brain reverse handoff.

