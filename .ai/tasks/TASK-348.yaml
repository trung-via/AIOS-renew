task_id: TASK-348
revision: 1
goal: Enable direct final-contract AUTHOR_REPAIR ingress so an exact canonical REPAIR
  can be authorized without a serialized Adaptive Brain Audit v1 handoff or derived
  Decision Packet material, while retaining Runtime-owned lineage, mutation admission,
  CAS and immutable repair authority. This is a narrowly prioritized BO-7 correction-ingress
  slice.
problem: Canonical src/aios_renew/authoring_ingress.py presently rejects AUTHOR_REPAIR
  without audited_handoff and then reconstructs an exact V1 Decision Packet/profile
  plus two serialized audit stages as mutation admission prerequisites. RUN-347-004
  has immutable canonical COMPLETION_GATE FAILURE, no REPAIR authorization and a clean
  unchanged repairable candidate. Its pending minimal correction cannot be admitted
  without repeated audit serialization. This is a correction-ingress overhead and
  authority-duplication problem, not permission to fabricate RESULT, verification
  or a successful TASK-347 repair.
assumptions:
- At authoring Brain Sync, canonical main is 8cf7c3947ad7245a7df2de6832c675612572054c;
  TASK-348 does not exist. AUTHOR_TASK already uses direct final-contract ingress.
- The Human expressly prioritizes the AUTHOR_REPAIR part of BO-7 ahead of its previous
  queued sequence and selects Codex GPT-6.1 Sol Max for separately admitted implementation.
  That selection is not part of this provider-neutral TASK.
- The active audit policy currently still requires Brain semantic audit v1, and BO-7
  in canonical roadmap preserves two-stage semantic discipline. This TASK removes
  serialized v1 audit material as Runtime mutation authority; it does not itself modify
  Human/Brain planning or declare a blanket semantic-audit waiver.
- RUN-347-004 has a canonical public COMPLETION_GATE FAILURE at artifact 6ddf8dba63fd56bf0604ea4124c2a76de2341a21;
  this TASK must not execute or author a REPAIR for that RUN, and its currentness
  must be proven again by Runtime when later requested.
- Prospective TASK-348 keeps LEGACY_REPOSITORY_DEFAULT_ROUTE. Existing origin-affine
  TASK admission, workflow actor allowlists, explicit Executor selection at dispatch
  and exact-source Publisher remain separate.
scope:
  inspect:
  - docs/AIOS-MANIFESTO.md
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
  - docs/AIOS-BRAIN-OPTIMIZATION-ROADMAP-v1.md
  - docs/AIOS-BRAIN-SEMANTIC-AUDIT-PROTOCOL.md
  - .ai/roadmap-state.yaml
  - .ai/brain-audit-profiles.yaml
  - .ai/tasks/TASK-347.yaml
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/brain_context.py
  - src/aios_renew/brain_audit.py
  - src/aios_renew/correction_preflight.py
  - src/aios_renew/operator.py
  - src/aios_renew/review_transport.py
  - src/aios_renew/github_issue_ingress.py
  - tests/test_authoring_ingress.py
  - tests/test_github_issue_ingress.py
  modify:
  - src/aios_renew/authoring_ingress.py
  - tests/test_authoring_ingress.py
  - tests/test_github_issue_ingress.py
non_goals:
- Do not alter frozen Kernel, human-owned roadmap/policy or protocol documents, canonical
  TASK-347, RUN-347-001 through RUN-347-004, any FAILURE/RESULT/REPAIR/REVIEW ref,
  source publication or downstream pin.
- Do not remove the current Brain semantic audit responsibility, select audit profiles
  or any Executor in Runtime, silently change AUTHOR_REMEDIATION or AUTHOR_TASK paths,
  or introduce a new planner, router, correction scheduler, cache, retry, fallback
  or control-plane state store.
- Do not automatically issue REPAIR-347-004-001, dispatch Codex for TASK-347, claim
  its seven acceptance criteria, reuse unverified staging claims or construct verification
  evidence.
- Do not weaken provenance, actor admission, scope, exact identity, FAILED RUN state,
  CAS, replay, supersession, private/public redaction or reviewer/publisher authority.
constraints:
  hard:
  - AUTHOR_REPAIR direct final-contract mutation must be derived from its final immutable
    REPAIR payload plus exact canonical failed RUN/TASK/FAILURE/head, current authorization,
    scope, correction state and narrow subject-specific semantic staleness/CAS witnesses;
    never trust user-supplied derived support hashes or lifecycle assertions.
  - Remove audited_handoff, Decision Packet fingerprint, two serialized audit stages,
    profile registry selection, derived support sections and recompiled packet equality
    as required AUTHOR_REPAIR mutation authority. Audit material, if present for compatibility,
    must not govern admission and may be rejected explicitly to prevent ambiguity;
    do not downgrade security or introduce a V3 fallback.
  - Retain strict single-owner Runtime authoring of a canonical immutable REPAIR authorization
    with truthful action/scope, failed head and TASK identity; every canonical ref
    mutation must preserve expected-old compare-and-swap, reservation, replay/idempotence,
    supersession continuity and concurrency failure semantics.
  - Direct AUTHOR_REPAIR must fail closed on stale/noncanonical FAILURE, wrong RUN/task/revision/head,
    missing or dirty/nonrepairable subject, unauthorized modification scope, illegal
    action, stale/competing authorization, malformed payload, changed remote identity
    or currentness during mutation; no new RUN is created by authoring.
  - Preserve AUTHOR_REMEDIATION and AUTHOR_TASK existing contracts and all external
    Issue-carrier provenance/actor checks unchanged. Keep explicit Human-selected
    Executor/model/effort outside correction ingress and separate from automatic dispatch.
  - Limit source modification to scope.modify. Existing minimum-sufficient-v2 verification,
    evidence reuse, Reviewer semantic judgment, Publisher exact-source verification
    and privacy bounds remain intact.
  - For this TASK, implementation acceptance consists of concrete inspectable source
    behavior and focused regression test coverage; downstream canonical verification
    and semantic review remain independent and must not be claimed by Executor.
acceptance:
- id: AC1
  condition: A fresh exact canonical AUTHOR_REPAIR final payload is admitted and canonicalized
    through Runtime ingress with no audited_handoff, Decision Packet, Stage-1 or Stage-2
    material supplied.
- id: AC2
  condition: A direct final REPAIR is validated against Runtime-reconstructed exact
    failed RUN, immutable FAILURE, TASK identity, failed head, repairability, action/scope
    and existing canonical authorization without trusting supplied derived support
    facts.
- id: AC3
  condition: A narrow subject-specific freshness/CAS and replay contract preserves
    canonical old-ref mutation, idempotent identical requests and correct immutable
    supersession while rejecting stale or conflicting concurrent mutation.
- id: AC4
  condition: Malformed, forged, resolved, nonrepairable, stale-head, wrong-subject,
    out-of-scope, competing and supersession-conflict REPAIR inputs deterministically
    fail closed before unauthorized ref mutation or RUN creation.
- id: AC5
  condition: Legacy serialized audit/support material does not become an alternative
    admission authority, cause a valid identical final contract to be rejected merely
    for derivable serialization differences, or silently select a retired V3 profile.
- id: AC6
  condition: Existing AUTHOR_REMEDIATION and AUTHOR_TASK ingress, Issue actor/origin
    protection, Reviewer, Publisher, Runtime verification and immutable historical
    correction lineage retain their exact independent behavior.
- id: AC7
  condition: Synthetic focused ingress regression coverage exercises valid no-handoff
    AUTHOR_REPAIR, stale/forged/collision negatives and unaffected neighboring authoring
    flows without changing TASK-347 history or creating a new lifecycle coordinator.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_authoring_ingress.py tests/test_github_issue_ingress.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
