task_id: TASK-254
revision: 3

goal: >
  Complete H1 audited-authoring enforcement while preserving the already-supported
  immutable REPAIR supersession contract: every genuinely new AUTHOR_TASK,
  AUTHOR_REMEDIATION and AUTHOR_REPAIR mutation, including a superseding REPAIR
  authorization created before any continuation RUN is admitted, must require one
  fresh Decision-Packet-bound BP-4A two-stage audited CANDIDATE whose final candidate
  exactly matches the canonicalized semantic family body.

problem: >
  TASK-254 r2 admitted RUN-254-001 and produced a clean, transportable candidate, but
  Runtime correctly failed the RUN at COMPLETION_GATE because the contract was
  internally incomplete. The implementation could audit an initial AUTHOR_REPAIR when
  Unified State projected AUTHOR_REPAIR, but after one REPAIR authorization exists
  Unified State correctly projects EXECUTE_REPAIR. Existing immutable supersession
  semantics still permit Human/Brain to replace an obsolete, not-yet-executed repair
  strategy, yet Flow Resolution and Decision Packet compilation currently require
  AUTHOR_REPAIR for REPAIR_AUTHORING. Therefore a superseding authorization cannot
  obtain the fresh audited handoff required by r2 without changing authorities that r2
  explicitly placed outside scope.

  The exact canonical failure is RUN-254-001 with failure-artifacts commit
  f5c5582b857ad9bb488d50a0ecaed24051ca19c0 and failed candidate
  e5eb94205c7d5f9032f61b5e511361f7325699e4. This is a TASK-contract defect rather
  than an implementation defect repairable inside r2 scope. Revision 3 widens H1 only
  enough to preserve audited immutable REPAIR supersession without turning Unified
  State into a correction selector or lifecycle router.

assumptions:
  - >
    Canonical main at r3 authoring is
    6f9302b2c756da7e735df4b970b28d36121f2777. The planning-only H4 changes after
    RUN-254-001 do not implement or alter H1 runtime behavior.
  - >
    RUN-254-001 is the sole admitted r2 RUN and canonically terminated as FAILURE at
    COMPLETION_GATE. Its FAILURE candidate is clean, descends from its base, remains
    within r2 scope and is marked repairable/transportable; it is evidence of the
    contract gap, not canonical source publication.
  - >
    Existing project governance explicitly permits an authorized REPAIR strategy that
    becomes obsolete before any continuation RUN is admitted to be superseded only by
    an immutable successor authorization bound to the exact current authorization SHA
    and canonical FAILURE identity.
  - >
    Unified State must continue to project EXECUTE_REPAIR while a current authorization
    is executable. A Brain request to reason about supersession is a bounded semantic
    side-flow and must not rewrite or advance canonical lifecycle state.
  - >
    brain-high-value-v2, existing Brain return contracts, family validators, BP-4A,
    Brain Sync, Unified State and Publisher/Runtime/Reviewer boundaries remain
    authoritative and are reused rather than duplicated.

scope:
  inspect:
    - docs/AIOS-BRAIN-RUNTIME-SEMANTIC-HANDOFF-HARDENING-v1.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/brain-audit-profiles.yaml
    - .ai/brain-return-contracts.yaml
    - src/aios_renew/brain_sync.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/publication.py
    - src/aios_renew/brain_audit.py
    - src/aios_renew/brain_provider_protocol.py
    - src/aios_renew/github_issue_ingress.py
  modify:
    - .ai/flow-cards.yaml
    - src/aios_renew/brain_context.py
    - src/aios_renew/decision_packet.py
    - src/aios_renew/authoring_ingress.py
    - tests/test_brain_context.py
    - tests/test_decision_packet.py
    - tests/test_authoring_ingress.py
    - tests/test_github_issue_ingress.py

non_goals:
  - Change frozen TASK, RUN, RESULT, EVIDENCE or REVIEW schemas.
  - Change Unified State lifecycle reduction or make EXECUTE_REPAIR become AUTHOR_REPAIR.
  - Automatically decide that an existing REPAIR strategy is obsolete or automatically
    select a replacement correction strategy.
  - Add a Planner, lifecycle router, retry/failover controller, persistent reasoning
    store, second semantic state database or provider/model/session authority.
  - Implement H2 REPAIR strategy-fact projection, H3 acceptance proof-phase work, H4
    Local Regular Chat Wake, H5 integration closure, VPRC or downstream adoption.
  - Require audited Brain handoff for SUBMIT_REVIEW or merge Reviewer authority into
    Brain authoring.
  - Publish or execute a REPAIR from the Brain authoring path.
  - Treat RUN-254-001 candidate source as reviewed/published product code.
  - Rewrite or delete r2 TASK/RUN/FAILURE history.

constraints:
  hard:
    - >
      Preserve all r2 H1 requirements: exact-current-main canonical input proof,
      deterministic Decision Packet reconstruction, repository-owned
      brain-high-value-v2 Stage 1 -> Stage 2 validation, Stage-2 CANDIDATE requirement,
      existing family/return-contract equality, mutation-edge freshness, exact
      idempotent replay before the audit gate, transient handoff only and unchanged
      SUBMIT_REVIEW authority.
    - >
      Normal initial REPAIR authoring remains selected from canonical Unified State
      AUTHOR_REPAIR exactly as before. Revision 3 must not require an explicit selector
      for the ordinary failed-RUN path.
    - >
      Add one bounded explicit REPAIR_AUTHORING supersession reasoning path only when
      canonical Unified State currently projects EXECUTE_REPAIR for the exact failed
      RUN, a unique current canonical REPAIR authorization exists, and no continuation
      RUN has been admitted from that authorization. The side-flow must not mutate or
      reinterpret Unified State and must leave canonical next_action as EXECUTE_REPAIR.
    - >
      Repository-owned Flow Card/Brain Context policy must distinguish the explicit
      supersession side-flow from ordinary UNIFIED_STATE_AUTHOR_REPAIR selection.
      Explicit REPAIR_AUTHORING in any state not satisfying the supersession conditions
      must fail closed; it must not become a generic semantic-flow override.
    - >
      A supersession Decision Packet must bind the exact failed RUN/FAILURE identity and
      the exact current canonical REPAIR authorization SHA plus its validated semantic
      body as prior semantic material. Brain must be able to see what strategy it is
      replacing. Caller text or transient handoff fields must never substitute for this
      canonical reconstruction.
    - >
      Decision Packet validation must distinguish initial REPAIR authoring from
      supersession without adding correction-selection authority. It may project
      current canonical authorization facts but must not decide whether the strategy is
      obsolete or choose the successor action.
    - >
      AUTHOR_REPAIR ingress must reconstruct and revalidate the same exact current
      authorization/failure identity used by the audited packet and retain existing
      expected_current_repair_sha / failure-artifacts CAS semantics immediately before
      publication. Any stale, competing, already-executed or otherwise changed
      authorization fails closed.
    - >
      Exact replay of the existing current authorization remains non-mutating and does
      not require a new audit. Any semantic change or immutable superseding
      authorization requires a fresh valid Stage-2 CANDIDATE bound to the current
      authorization it replaces.
    - >
      The new side-flow is reasoning-only. It must not dispatch REPAIR, reserve a RUN,
      run verification, publish source, alter roadmap state, or create lifecycle truth.
    - >
      The observed RUN-254-001 failure shape must have a regression proving that an
      otherwise valid superseding AUTHOR_REPAIR can now obtain a fresh audited
      REPAIR_AUTHORING packet without weakening the EXECUTE_REPAIR lifecycle state.
    - >
      No file outside scope.modify may change.

acceptance:
  - id: AC1
    condition: >
      New AUTHOR_TASK, AUTHOR_REMEDIATION and initial AUTHOR_REPAIR mutations retain the
      complete r2 audited-handoff gate, canonical-input binding, semantic equality,
      freshness and exact-replay behavior.
  - id: AC2
    condition: >
      When an exact current REPAIR authorization exists and Unified State is
      EXECUTE_REPAIR with no admitted continuation RUN, an explicit supersession
      REPAIR_AUTHORING request resolves to Brain authority without changing canonical
      next_action or acquiring Runtime execution authority.
  - id: AC3
    condition: >
      The supersession Decision Packet contains the exact canonical failed RUN/FAILURE
      subject and exact current REPAIR authorization identity and semantic body needed
      to reason about replacement; stale, missing, competing, mismatched or already
      executed authorization state is rejected before semantic mutation.
  - id: AC4
    condition: >
      A changed/superseding REPAIR body cannot use replay or a prior audit handoff and
      is canonicalized only after a fresh brain-high-value-v2 Stage-2 CANDIDATE bound
      to the exact current authorization and matching the payload.
  - id: AC5
    condition: >
      Explicit REPAIR_AUTHORING outside the bounded supersession state fails closed,
      while ordinary AUTHOR_REPAIR selection from a newly failed RUN remains driven by
      Unified State rather than an explicit override.
  - id: AC6
    condition: >
      Unified State continues to report EXECUTE_REPAIR for an executable current
      authorization, and no new Planner, lifecycle router, correction selector,
      Reviewer, Runtime or Publisher authority is introduced.
  - id: AC7
    condition: >
      SUBMIT_REVIEW and all frozen artifact families remain unchanged; audit material is
      transient and provider/session independent.
  - id: AC8
    condition: >
      Focused regression reproduces the RUN-254-001 completion-gate blocker and proves
      the audited supersession path is now reachable under the widened r3 scope while
      preserving fail-closed behavior and immutable r2 history.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_brain_context.py tests/test_decision_packet.py tests/test_authoring_ingress.py tests/test_github_issue_ingress.py
    - git diff --check
