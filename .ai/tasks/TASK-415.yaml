task_id: TASK-415
revision: 1
goal: Fix root-cause stale roadmap NEXT after exact PASS-reviewed Publisher publication.
  Automatically expose the unique Human/Brain-preapproved successor as effective NEXT
  in ordinary Brain Sync and existing post-publication attention/wake, without Human
  manual roadmap sync and without giving publication/lifecycle machinery semantic
  roadmap authority. Reconcile published CAA-04 TASK-414 r2 and implement the current
  Human-approved Auto-NEXT fix as the sole new prospective priority.
problem: Canonical main 6a3438a5a379c2bbc638a9f23bfee9b30e81b7fa is TASK-414 r2/RUN-414-007
  exact reviewed source, independently REVIEW-414-007 PRIMARY PASS at 488ecd6c946a9d8a39f309a543af3e984fcd0a80,
  with Runtime artifacts ref refs/heads/aios/artifacts/RUN-414-007 at 71ea75e5329bffd7141fd44049e6ad8daa97bd96;
  reviewed source is on main. Yet .ai/roadmap-state.yaml sequence still says NEXT
  CAA-04/TASK-414 r2 and Brain Sync's _extract_next_candidates selects static next_items,
  raising ROADMAP_LIFECYCLE_CONFLICT for DONE tasks. A stale historical CAA-03 test
  also wrongly asserts mutable HEAD must retain CAA-03 as current NEXT with its old
  six-file diff. Existing post-publication attention does not surface a corrected
  effective-NEXT observation. Simply replacing text cannot solve verified published
  successor projection, missed wake or false future history assertions.
assumptions:
- Human explicitly approved immediate Auto-NEXT fix on 2026-10-24 and directs execution.
  It supersedes CAA-04 live selection prospectively, but cannot rewrite historical
  roadmap decisions or TASK-412/413/414 lineage.
- Existing Human CAA sequence through CAA-04 has separately reviewed/published lineage;
  CAA-05 remains CONDITIONAL_NOT_SELECTED; paused PTE, Lean VP, KA-01 and downstream
  remain unchanged. TASK-413 H1R is unrelated.
- Brain owns new planning semantics, Human owns priority/risk. Executor owns implementation
  HOW. Runtime verifies/creates EVIDENCE, Reviewer judges, Publisher publishes; GitHub
  event is subordinate transport.
- Source/review/RESULT identities in problem are observational and must be reauthenticated
  by the current canonical reader; names, model claims, GitHub carrier acceptance
  or a SHA label alone are insufficient.
- Reuse the existing exact-authority Brain Sync, Unified State, publication attention
  and local-chat wake path; no separate planner/router/database/automatic dispatcher
  is authorized.
