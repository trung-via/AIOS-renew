non_goals:
- Bypass, solve, auto-click, spoof or otherwise evade Cloudflare or any human-verification,
  CAPTCHA, anti-bot, browser-fingerprint or account-security mechanism.
- Add stealth plugins, navigator.webdriver patches, user-agent spoofing, automation-hiding
  feature flags, extensions, proxy/VPN behavior, cookie manipulation or alternate
  authentication paths.
- Change any production Chromium launch switch or configured environment field other
  than removing the exact --enable-automation argument from the existing unattended
  launch command.
- Change listener absence proof, dedicated-profile occupancy proof, browser-owner
  proof, context proof, page creation/navigation, exact-target selection, acquisition
  deadlines or machine-local configuration schema.
- Change H4C1 origin affinity, canonical freshness, binding-generation safety, draft/generation
  guards, exact-event dedupe, durable ambiguity, exact user-turn proof or no-blind-resend
  behavior.
- Perform a live ChatGPT wake inside Executor or Runtime deterministic verification,
  fabricate/replay a carrier, or treat the prior Human diagnostic as H4D live-exit
  proof.
- Modify TASK-303, RUN-303-003, its failure/attention refs, or author TASK-303 revision
  4 as part of this correction.
- Advance H4D, H4E, final H4B or H5 roadmap semantics automatically, or create a new
  planner, router, retry/failover authority, Reviewer, Publisher or Runtime.
constraints:
  hard:
  - The production unattended launch command must preserve its existing explicitly
    configured executable, user-data directory, profile directory, IPv4 loopback remote-debugging
    address/port, --no-first-run, --no-default-browser-check and --no-startup-window
    semantics; the authorized production launch delta is removal of --enable-automation
    only.
  - No replacement switch, JavaScript patch, browser preference, extension or other
    mechanism may be introduced for the purpose of concealing automation or defeating
    human-verification/anti-bot controls.
  - Exact browser ownership must remain proved from the existing executable, user-data
    directory, profile directory, loopback address and port facts without adding --enable-automation
    as an ownership requirement and without weakening any mismatch/race failure.
  - Existing launch environment sanitization, one-attempt acquisition budget, profile/listener
    checks, context/page proof, exact bound-chat navigation and post-acquisition owner
    re-proof remain unchanged in authority and fail-closed behavior.
  - Existing local-chat freshness, affinity, binding-generation, surface, Human-draft,
    active-generation, outbound-dedupe, ambiguity and no-blind-resend gates remain
    regression-equivalent.
  - Focused deterministic regression must prove the configured launch command excludes
    --enable-automation, retains the required existing launch arguments, and remains
    compatible with exact owner proof while malformed/wrong ownership still fails
    closed.
  - Documentation must record that removing the explicit automation opt-in is a bounded
    H4D launch correction motivated by the Human diagnostic but does not claim CAPTCHA
    bypass, anti-bot evasion, Runtime evidence or H4D live-exit closure.
  - No machine-local path, PID, raw conversation URL, account/session material or
    diagnostic transcript may be added to canonical/public artifacts.
  - Executor changes only scope.modify, performs no roadmap/lifecycle mutation or
    live ChatGPT experiment, and does not claim Runtime verification, Reviewer PASS,
    publication or H4D/H4E closure.
