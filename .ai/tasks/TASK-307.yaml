task_id: TASK-307
revision: 1
goal: Remove the explicit Chromium --enable-automation launch opt-in from H4D unattended
  acquisition while preserving the existing exact-environment ownership, bounded launch,
  fail-closed, and delivery semantics, so the next Human/Brain live probe can test
  the same production wake path without that unnecessary automation marker.
problem: Current H4D Environment.command() explicitly adds --enable-automation. The
  latest bounded Human diagnostic used the same dedicated authorized profile and fixed
  loopback CDP endpoint without that switch, reached the exact ChatGPT conversation
  successfully, and observed navigator.webdriver as false; the preceding production
  live attempt using the current command had deferred while a human-verification interstitial
  looped. That diagnostic is planning input rather than Runtime evidence and it also
  used a Human-visible startup path, so this TASK does not claim a proven anti-bot
  root cause. It isolates the production correction to removal of --enable-automation
  only, preserving every other H4D acquisition and safety contract before the unresolved
  RUN-303-003 carrier is retried.
assumptions:
- Canonical main at authoring is f3d82a98bf2cece03ed23038b193b1834410b6e3; TASK-302
  plus TASK-304, TASK-305 and TASK-306 are the reviewed/published H4D acquisition
  baseline.
- Canonical RUN-303-003 remains an unresolved repairable and transportable TASK-303
  revision-3 FAILURE with failure-artifacts SHA 8be8fb3679da4ca17af2f846d653b6e9bb884b5f
  and failed head 9f64f35969ba26b5acc97d1cc9b989919b5a7012; this TASK does not repair
  or supersede that lineage.
- Current Environment.command() adds --enable-automation in addition to the explicit
  user-data directory, profile, loopback CDP address/port, no-first-run, no-default-browser-check
  and no-startup-window launch arguments.
- Current browser-owner proof binds executable, user-data directory, profile directory,
  loopback address and port and does not require --enable-automation for ownership
  identity.
- The Human diagnostic is noncanonical planning input only; Runtime verification,
  Reviewer verdict, publication and the separate H4D live exit observation retain
  their existing authorities.
- After exact reviewed publication of this correction, the existing unresolved origin-affine
  RUN-303-003 attention subject remains the intended real H4D live carrier unless
  canonical freshness says otherwise.
