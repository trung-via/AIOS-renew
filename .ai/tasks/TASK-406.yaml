non_goals:
- Do not rerun, revise, repair, remediate or forge PASS on TASK-405 r1/r2 or historical
  RUN-405-001..005; do not rewrite any existing RESULT, REVIEW, evidence, review-decision
  or Git ref, and do not call the one-time Git merge a Runtime Publisher PASS.
- Do not silently promote an arbitrary Human label, merged commit, SHA digest or GitHub
  receipt into general REVIEW, Publisher, Runtime or audit-policy authority. No generic
  Human override or unrestricted review bypass.
- Do not remove MOA historical bytes, alter old profile IDs/digests, invalidate in-flight
  old exact selections/decisions or historical archived replay; retiring operational
  selection is not erasing canonical past.
- Do not substitute MOA with V1, TCA, ROA, an 'audit-lite', implicit two-stage Brain
  conformance, a synthetic null profile or new default semantic audit for REMEDIATION.
  No hidden provider audit call or new review gateway.
- Do not remove Runtime validation of direct AUTHOR_REMEDIATION, exact finding/source/SHA,
  hard constraints, allowed scopes, evidence, independent semantic REVIEW or Publisher
  gates. Brain still chooses bounded remediation WHAT/WHY; Runtime still verifies.
- Do not change AOA-1/ROA-1 R3 normative defaults, Human individually authenticated
  V1 options on architecture/task, TCA-1/TCA-2 historical replay, or per-attempt policy
  currentness/in-flight binding.
- No new Planner, generic lifecycle router, second Reviewer/Publisher/Runtime, DB,
  policy-memory store, generic retry/failover or automatic remediation selector.
- No publication from AUTHOR_TASK ingress, Executor self-report, workflow receipt,
  or unreviewed activation candidate. Do not advance unrelated PTE/Lean-VP roadmap
  work or require a full-suite run.
constraints:
  hard:
  - One atomic prospective cutover selected ONLY after independently reviewed/published
    TASK-406 candidate is on canonical main and its original approved source plus
    one-time Human TASK-405 exception have exact authenticated lineage. If not all
    conditions hold, fail closed and report blocker; never fallback to tca-2 or moa-1
    for a stale/current moved activation attempt.
  - 'Define a complete active policy mapping with exactly THREE normative flows: ARCHITECTURE=aoa-1
    v1, TASK_AUTHORING=tca-3 v3, REPAIR_AUTHORING=roa-1-r3 v3. REMEDIATION_AUTHORING
    is ABSENT, not null-profile, MOA, V1 or a substitute audit. Use explicit closed
    policy discriminator (e.g. a three-flow state) and closed shape validation; historical
    FOUR_SPECIALIZED and ADAPTIVE_V1 exact replay remain compatible. No flow inferred
    from registry order.'
  - For new REMEDIATION_AUTHORING current first-party interactions, bypass any normative
    audit and model audit request; permit Brain to author the existing final REMEDIATION
    contract directly for current exact source/finding through existing AUTHOR_REMEDIATION
    ingress. Never block remediation solely for lack of audit material, TCA-style
    source context, selection_authenticator, V1 support or MOA stage. A legacy explicit
    MOA historical replay remains exact and must not leak into new default routing.
  - Any current first-party 'attempt' explicitly requesting an audited REMEDIATION
    path under the new three-flow policy must terminate deterministically before invoking
    a provider or select a dedicated existing non-audited direct semantic path only
    where already legitimately supported. Do NOT invent a new generalized execution
    router or silently use V1/MOA; direct Brain-authoring ingress must remain usable.
  - Add a one-time exact-TASK-405 Human-risk-acceptance provenance record and source
    authenticator. Verify the merge sha/parents/tree, original RUN-405-004 artifact
    and 2 pass EVIDENCE, SHA-bound review ref and both non-PASS review decisions,
    same twelve exact Git blob contents in published integrated main, TASK-405 r1
    reviewed source versus main r2 identity distinction, original claim C2 mismatch
    (98304 vs true 65536), and explicit Human acceptance. Do not re-label old review/publish
    outcomes. Reject wrong SHA, tree, parent, blobs, evidence, decision, foreign main
    or missing approval.
  - New activation record should explicitly supersede human_r21_tca_roa_successor_activation
    with exact normalized predecessor approval digest and preserve older approvals
    unchanged; its profile mapping excludes REMEDIATION and records MOA retirement
    for new attempts. The record is not activated by authorship or registry membership;
    authenticate TASK-406 own PASS reviewed source and published-on-main as the activation
    boundary.
  - Keep old historically valid four-profile approvals/policies and exact serialized
    request/decision replay. A current attempt admitted before activation remains
    pinned, cannot silently switch profile during continuation; stale currentness
    fails closed. Neither historical MOA conformance helpers nor MOA registry bytes
    count as current/default permission.
  - Existing TASK_AUTHORING and ARCHITECTURE calls keep exact source-context, two-stage
    audit selection and Human V1 authentication. TCA-3 default must resolve its exact
    canonical id/version/content digest from the ten-profile 65536-byte registry;
    no secondary auditor or artificial stage.
  - REPAIR_AUTHORING keeps ROA-1 R3 and canonical repair contract and execution/verification,
    not merged with unaudited remediation. Read-only V1 support continues only where
    independently Human-authorized and currently normatively applicable, never auto-opted
    into REMEDIATION.
  - Perform focused regression including first-party direct native callers, pure policy
    normalization and request/decision codecs, canonical Git-based permission/authenticator,
    historical V1/four-profile replay, zero provider invocations for retired MOA current
    default, genuine direct AUTHOR_REMEDIATION compatibility, false success/forged
    Human exception negatives, and fail-closed in-flight policy movement. Preserve
    published API and legacy AST/import tests; scope includes the actual affected
    tests.
  - Implement with minimum sufficient verification; no full suite or unrelated tests.
    Preserve one Executor HOW and Runtime/Reviewer/Publisher roles, with truthful
    complete per-AC RESULT claims, original source SHA, no unresolved acceptance.
acceptance:
