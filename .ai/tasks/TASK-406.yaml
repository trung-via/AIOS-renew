  condition: Current independent policy normalizer recognizes exactly one authenticated
    complete prospective three-flow policy, AOA-1/TCA-3/ROA-1 R3, with REMEDIATION_AUTHORING
    absent and no default/implicit substitution. Reject incomplete, mixed, extra,
    null-profile, stale, rehashed or forged policy and preserve historical FOUR_SPECIALIZED/ADAPTIVE_V1
    exact decode.
- id: AC2
  condition: New/current Brain first-party TASK_AUTHORING selects exact tca-3 v3 normalized
    digest with two focused stages, while ARCHITECTURE remains aoa-1 and REPAIR_AUTHORING
    remains roa-1-r3. No registry-membership-only activation or silent model/V1 substitution,
    no extra audits; unchanged historical profiles and replay remain valid.
- id: AC3
  condition: New/current REMEDIATION_AUTHORING does not select, require, execute or
    fall back to MOA-1 or ANY automatic normative/default audit, produces zero MOA/provider
