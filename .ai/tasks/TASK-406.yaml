    and Runtime/Reviewer gate. Historical archived MOA artifacts remain decipherable
    but never auto-selected.
- id: AC4
  condition: Canonical approved three-flow activation is uniquely selected only after
    exact independent TASK-406 REVIEW PASS and Publisher inclusion, with a separately
    authenticated current Human approval superseding 2026-10-21 predecessor. Reject
    absent/conflicting/duplicate approval, false PASS, forged 'active' label, and
    source not on main without fallback.
- id: AC5
  condition: The only permitted TASK-405 original-source exception is exact Human-authorized
