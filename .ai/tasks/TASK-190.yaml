task_id: TASK-190
revision: 1

goal: >
  Prove BP-7 Cross-context / Hot-swap Conformance as one deterministic,
  test-only ten-scenario matrix over the already-reviewed AIOS canonical
  coordination and provider-neutral boundaries, showing that a fresh
  Brain/Reviewer provider can continue from canonical state without previous
  chat/session memory and without introducing a hot-swap router, retry/failover
  authority, persistent reasoning state, or any production semantic change.

problem: >
  BP-1 through BP-6 now provide exact TASK admission, typed pre-AIOS
  attribution, Brain Sync / Work Context / Flow Resolution, Decision Packets,
  canonical lifecycle reduction, correction/repair/recovery semantics, and
  separate Brain and Reviewer provider-neutral protocols. Those primitives
  have focused tests, but AIOS does not yet have one integrated conformance
  proof that they compose correctly when the model/provider or context is
  replaced at authoring, result-review, correction, repair, recovery, and
  publication boundaries. Without that proof, future provider replacement
  could accidentally rely on Python object continuity, hidden chat/session
  state, stale Human intent, provider identity, or blind re-execution even
  though the individual contracts are correct.

assumptions:
  - >
    Canonical main 062a72a87902d4d012f17bf070e2b35a828b18bd records
    BP-6 Reviewer Provider Protocol complete with its exit gate satisfied and
    BP-7 Cross-context / Hot-swap Conformance as the unique NEXT milestone.
  - >
    TASK-189 completed through RUN-189-003, RUN-189-003-V001,
    REVIEW-189-001 PRIMARY PASS and exact publication of
    0ef36225108a463efd9e54566190826125d363dc before the planning commits that
    opened BP-7.
  - >
    docs/AIOS-BRAIN-PORTABILITY.md defines the canonical ten-scenario BP-7
    baseline and distinguishes pre-handoff Brain/Reviewer provider failure
    from post-canonical candidate recovery.
  - >
    Existing production semantics are presumed sufficient for the first BP-7
    proof. If the conformance suite exposes a real missing deterministic
    witness, this TASK must fail closed and report the gap for a separately
    scoped successor TASK rather than changing production code.
  - >
    BP-8, not BP-7, owns real non-default external-provider invocation.
    BP-7 uses deterministic non-network provider adapters and local repository
    fixtures only.

