- Commit private chat URLs, turn-key values, raw conversation text, assistant content,
  credentials, cookies, browser profile data, CDP endpoints, state paths, or provider/session
  identity.
constraints:
  hard:
  - The normal H4A3 positive path must continue to require a genuine matching local
    SUBMITTED / EXACT_USER_TURN_PROVEN receipt; TASK-277 may add only an exact-case
    alternative and must not weaken the default rule.
  - The alternative closure path is bound only to workflow 36984172510 attempt 1 and
    event terminal:RESULT:RUN-268-001:1f3d0dac34c7cff6d768d580f31513df08ebb253; it
    is not reusable for another workflow, attempt, event, repository or future ambiguous
    submission.
  - The alternative path must preserve the historical BLOCKED / LOCAL_FAILURE receipt
    and must not call the later Human SUBMITTED state, duplicate NOOP, or any planning
    note a historical transport receipt.
  - 'The alternative path must require the complete bounded evidence chain together:
    exact terminal admission PASS; the canonical planning record that workflow #354
    attempt 1 clicked Send before outbound proof failed; preservation of the original
    BLOCKED / LOCAL_FAILURE receipt; reviewed TASK-276 bounded resolver proof of exactly
    one matching outbound user turn; the Human section-4.2 ATTEMPTING-to-SUBMITTED
    reconciliation after all published safeguards with no replay, Send or assistant-output
    read; duplicate delivery of the same exact admitted identity returning NOOP /
    ALREADY_SUBMITTED; and the post-duplicate Human read-only proof showing the same
    exact bounded turn remains EXACT, the target page is unique and the composer is
    empty.'
  - No single constituent fact, current SUBMITTED state, Human visual observation,
    assistant response, duplicate receipt alone, or partial subset of the evidence
    chain may substitute for the complete alternative path. Missing, conflicting or
    ambiguous evidence leaves H4A3 open.
  - Satisfying the alternative path means only that Human/Brain may assess H4A3 planning
    conformance without fabricating the historical receipt. It creates no Runtime
    EVIDENCE, no lifecycle success, no Reviewer or Publisher authority, and no automatic
    roadmap mutation.
  - The document must preserve ACK-only semantics, assistant-output exclusion, reviewed
    TASK-266 negative-case reuse, and the rule that contrary live evidence requiring
    production change is handled through a separately authorized correction.
  - Executor implementation is documentation-only and may modify exactly docs/AIOS-H4A3-ACK-ONLY-EXACT-CHAT-CONFORMANCE-v1.md.
    Executor must not perform live browser actions, mutate machine-local wake state,
    publish, or mutate roadmap state.
