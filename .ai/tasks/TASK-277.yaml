non_goals:
- Modify local-chat-wake production code, terminal-attention or local-wake workflows,
  tests, Runtime, Reviewer, Publisher, TASK schema, lifecycle semantics, or machine-local
  operational state.
- 'Rewrite, relabel, suppress, or fabricate workflow #354 attempt 1 as having returned
  SUBMITTED / EXACT_USER_TURN_PROVEN.'
- Perform another RUN-268 replay, click Send, create another outbound user turn, inspect
  assistant output, or rerun destructive live negative cases.
- Create a generic post-send reconciliation, ambiguous-submission recovery, resend,
  retry, durable queue, multi-project lane, or other H4A4 policy.
- Automatically close H4A3, advance TASK-270/H4A4/H4A5/H4B, or treat TASK-277 execution,
