task_id: TASK-277
revision: 1
goal: 'Amend only the H4A3 ACK-only exact-chat conformance document so the exact workflow
  #354 attempt-1 post-send proof-loss case may satisfy Human/Brain planning conformance
  through one bounded evidence-equivalent closure path, while preserving the historical
  BLOCKED / LOCAL_FAILURE receipt, the normal SUBMITTED-receipt rule for all ordinary
  cases, ACK-only authority, and zero production-transport change.'
problem: 'The published H4A3 positive procedure requires a matching local SUBMITTED
  / EXACT_USER_TURN_PROVEN receipt. Workflow 36984172510 attempt 1 admitted the exact
  RUN-268 RESULT and automatic Send occurred, but the transport returned BLOCKED /
  LOCAL_FAILURE because its then-published post-send outbound-turn selector could
  not discover the already-created user turn. TASK-276 subsequently supplied the reviewed
  bounded resolver, and Human post-send reconciliation plus duplicate NOOP plus a
  post-duplicate exact-turn probe now establish the intended one-turn deduplicated
  transport effect. Section 4.2 correctly preserves #354''s historical failure receipt
  and forbids treating reconciliation as that receipt, leaving a documentation-level
  conformance gap that must be closed without fabrication, another Send, or generalized
  recovery.'
assumptions:
- Canonical planning records workflow 36984172510 (#354) attempt 1 as exact RUN-268-001
  RESULT admission PASS, automatic Send functionally observed, and historical local
  wake BLOCKED / LOCAL_FAILURE.
- TASK-276 is reviewed and published at 53e75c22451457048adc21821788d54d5d43e0c1 and
  supplies the reviewed bounded outbound-user-turn resolver used by later Human proof.
- 'Human post-send reconciliation for #354 passed: the exact event moved from ATTEMPTING
  to SUBMITTED only after bounded proof, with no Send click, replay, assistant-output
  read, or other-event mutation.'
- Duplicate delivery of the same exact admitted event returned NOOP / ALREADY_SUBMITTED,
  and the subsequent Human read-only probe still resolved the exact bounded user turn
  as EXACT with one unique target page and an empty composer.
- 'The historical #354 BLOCKED / LOCAL_FAILURE receipt is immutable operational history
  and must remain distinct from the later Human reconciliation and duplicate observation.'
scope:
