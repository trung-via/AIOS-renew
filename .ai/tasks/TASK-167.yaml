task_id: TASK-167
revision: 1

goal: >
  Execute the reviewed and published BP-V4 focused parallel diagnostic primitive
  as one fresh, bounded, Runtime-owned observation experiment on the exact admitted
  current canonical subject. The Executor performs read-only pre-verification
  inspection only; Runtime alone executes the repository-owned diagnostic primitive
  against the fixed six historical representative node identities using its exact
  serial, parallel-2, and parallel-4 profiles. Produce canonical
  AIOS_BP_V4_PARALLEL_DIAGNOSTIC version-1 EVIDENCE for later Reviewer and
  Human/Brain interpretation without repository mutation, retry semantics,
  correction selection, worker selection, full-suite measurement, or roadmap
  advancement.

problem: >
  RUN-159-005 established historical BP-V4 evidence in which the then-current
  full-suite serial profile reported 3 failures while parallel workers 2, 3, and 4
  reported 33, 33, and 38 failures respectively. That measurement proved collection
  consistency, unchanged subject identity, distinct worker processes, isolated
  pytest temporary roots, and isolated Git fixture cache roots, but its bounded
  failure diagnostics did not reveal sufficient cause facts for the parallel-only
  families. TASK-166 therefore established, reviewed, repaired, and published a
  separate purpose-built diagnostic primitive that observes exactly six
  representative Git-heavy historical failure families under one serial control
  and fixed parallel workers 2 and 4 while preserving bounded cause facts and
  authority separation. The primitive is now reviewed source on canonical main.
  TASK-167 uses that reviewed primitive once against current canonical state before
  any new TASK-159 full-suite revision or correction decision.

assumptions:
  - >
    Canonical main at TASK-167 revision-1 authoring is
    efa9610fc74c6f96bb22ae46d6c0b329dc622639.
  - >
    TASK-166 r1 is engineering-complete through RUN-166-003,
    REVIEW-166-003 DELTA PASS, and publication of source candidate
    94a16a9e67f494d71960e6a45032ba73912be61c. Its published diagnostic
    primitive is the only diagnostic mechanism TASK-167 may execute.
  - >
    Canonical roadmap planning has completed the TASK-166 diagnostic-primitive
    prerequisite and marks maintenance-bp-v4-focused-diagnostic-execution as the
    unique NEXT planning item. BP-V4 remains blocked until Human/Brain interprets
    the resulting canonical evidence and explicitly chooses the next planning step.
  - >
    Historical RUN-159-005 remains immutable evidence only. TASK-167 does not
    retry, repair, remediate, supersede, or reinterpret that RUN.
  - >
    Five of the six representative target files and the shared Git fixture/support
    harnesses remain byte-identical to RUN-159-005 historical subject; the sixth
    representative function retains the same body. Current-main diagnosis is
    therefore materially relevant while still being a fresh observation on a
    different canonical subject.
  - >
    TASK-157 remains authoritative for the separate AIOS_BP_V4_MEASUREMENT
    full-suite measurement contract. TASK-167 does not execute or modify that
    contract and does not authorize TASK-159 revision 6.
  - >
    TASK-156 remains authoritative for exact transient Runtime verification
    subjects. Runtime must execute TASK-167 verification inside the exact isolated
    admitted candidate subject and retain canonical EVIDENCE ownership.
  - >
    PRIMARY native Executor adapters intentionally omit TASK.verification from the
    Executor prompt, require empty executor-supplied evidence, and instruct the
    Executor not to run canonical verification. Runtime verifies only after the
    structural ResultPackage passes pre-verification completion gates.
  - >
    Existing reviewed evidence for current Brain Sync, remediation-wakeup, and
    remote-surface compatibility remains reusable because TASK-166 did not modify
    those surfaces; TASK-167 therefore does not repeat ceremonial readiness tests.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns the semantic
    verdict; Human/Brain own root-cause interpretation, correction strategy, and
    any later worker-adoption authorization; Publisher owns publication.

