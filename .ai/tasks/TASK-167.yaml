task_id: TASK-167
revision: 2

goal: >
  Execute the reviewed and published BP-V4 focused parallel diagnostic primitive
  once as Runtime-owned canonical verification on the exact admitted current
  subject, while keeping Executor work strictly zero-delta and pre-verification.
  Produce trustworthy focused diagnostic evidence for later Human/Brain
  interpretation without changing repository state, selecting a worker, choosing a
  correction, running the full BP-V4 matrix, or advancing roadmap semantics.

problem: >
  TASK-167 revision 1 encoded a self-contradictory completion contract. Runtime
  deterministically requires every TASK acceptance criterion to be covered by the
  Executor structural ResultPackage before canonical verification begins, then
  mechanically attaches Runtime verification evidence afterward. Revision 1 AC4
  instead required already-produced canonical Runtime diagnostic evidence while its
  hard constraints correctly forbade the Executor from executing the diagnostic or
  claiming Runtime-only outcomes. RUN-167-001 therefore failed at COMPLETION_GATE
  with unresolved pre-verification inspection, and RUN-167-002 failed again at
  COMPLETION_GATE because the structural ResultPackage did not cover AC1, AC2, AC4,
  AC5, and AC6. Neither RUN entered VERIFICATION, so neither produced BP-V4
  diagnostic evidence. Revision 2 preserves the same Human intent and exact
  verification command but rewrites acceptance criteria as truthful
  pre-verification structural claims that Runtime can deterministically gate before
  it alone executes the diagnostic. No Runtime or diagnostic implementation change
  is warranted.

assumptions:
  - >
    Canonical main at TASK-167 revision-2 authoring is
    8b7d066d4d13f6d0aa834959af4ceb967ead7f40.
  - >
    TASK-166 r1 is engineering-complete through RUN-166-003,
    REVIEW-166-003 DELTA PASS, and publication of source candidate
    94a16a9e67f494d71960e6a45032ba73912be61c. The published diagnostic
    primitive remains unchanged and is the only diagnostic mechanism authorized.
  - >
    RUN-167-001 and RUN-167-002 are immutable revision-1 COMPLETION_GATE
    failures. Both are zero-delta, clean, repairable and transportable; neither
    invoked canonical verification and neither is BP-V4 diagnostic evidence.
  - >
    RUN-167-002 failure artifact
    6c05a8b32a9dc202986b45afa65ada1ecac16867 records that revision-1
    acceptance coverage was missing for AC1, AC2, AC4, AC5, and AC6.
  - >
    RuntimeCompletion is authoritative for deterministic completion ordering:
    structural Executor output and complete TASK acceptance coverage are checked
    before Runtime verification, and Runtime evidence is attached only after
    successful verification.
  - >
    TASK-157 remains authoritative for the separate full-suite
    AIOS_BP_V4_MEASUREMENT contract. This TASK does not execute or revise that
    measurement contract and does not authorize TASK-159 revision 6.
  - >
    Canonical roadmap planning keeps focused diagnostic execution as the unique
    NEXT prerequisite while BP-V4 remains blocked pending Human/Brain
    interpretation of the resulting canonical evidence.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    review; Human/Brain own root-cause interpretation, correction strategy,
    worker-adoption decisions, and roadmap planning; Publisher owns publication.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-156.yaml
    - .ai/tasks/TASK-157.yaml
    - .ai/tasks/TASK-159.yaml
    - .ai/tasks/TASK-161.yaml
    - .ai/tasks/TASK-164.yaml
    - .ai/tasks/TASK-166.yaml
    - scripts/bp_v4_parallel_probe.py
    - scripts/bp_v4_parallel_diagnostic.py
    - tests/bp_v4_probe_plugin.py
    - tests/bp_v4_diagnostic_plugin.py
    - tests/test_bp_v4_parallel_diagnostic.py
    - tests/test_correction_integration.py
    - tests/test_operator.py
    - tests/test_operator_correction_preflight.py
    - tests/test_operator_unified_state.py
    - tests/test_publication.py
    - tests/test_authoring_ingress.py
    - tests/git_fixture_support.py
    - tests/operator_test_support.py
    - tests/conftest.py
    - src/aios_renew/runtime.py
    - src/aios_renew/verification.py
    - src/aios_renew/artifacts.py
  modify: []

non_goals:
  - Modify any repository file or create a commit.
  - Repair or replay RUN-167-001 or RUN-167-002.
  - Modify Runtime completion ordering, ResultPackage semantics, or evidence ownership.
  - Modify scripts/bp_v4_parallel_diagnostic.py or any TASK-166 diagnostic behavior.
  - Execute the full BP-V4 measurement probe or author/execute TASK-159 revision 6.
  - Let the Executor execute the diagnostic or equivalent pytest/xdist commands.
  - Fix any target-test failure observed later by Runtime inside this TASK.
  - Add worker 3, dynamic node/worker selection, retry, fallback, rerun, or adaptive scheduling.
  - Select, rank, recommend, persist, or adopt a worker count or performance threshold.
  - Treat focused diagnostic completion as full-suite parallel conformance or BP-V4 completion.
  - Add lifecycle, Planner, Reviewer, Publisher, evidence-store, or routing authority.
  - Advance roadmap state from Executor, Runtime, Reviewer, or Publisher.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-167 r2 is a zero-delta read-only PRIMARY with empty scope.modify.
      Executor final HEAD must equal the admitted RUN base, worktree must remain
      clean, RESULT.changed_files must be empty, and no commit may be created.
    - >
      Executor structural output must contain no evidence and must cover every
      acceptance criterion using only truthful pre-verification facts obtainable
      by bounded read-only inspection. It must not claim that Runtime verification
      already ran or that any diagnostic target passed, failed, reproduced a
      historical failure, established a root cause, or demonstrated parallel safety.
    - >
      Executor must not run python scripts/bp_v4_parallel_diagnostic.py or any
      equivalent pytest/xdist diagnostic command. Canonical verification contains
      exactly one Runtime-owned command: python scripts/bp_v4_parallel_diagnostic.py.
    - >
      The admitted candidate must contain the exact reviewed and published TASK-166
      diagnostic primitive. No replacement, wrapper, copied implementation, or
      Executor-generated evidence path is authorized.
    - >
      The reviewed primitive remains fixed to exactly six representative nodes and
      exactly serial, parallel-2, and parallel-4 profiles. No target/profile
      expansion, retry, fallback, or dynamic selection is authorized.
    - >
      Runtime may treat inner pytest nonzero outcomes as observations when the
      diagnostic outer process completes its validated experiment successfully.
      Missing tooling, malformed collection, worker/root isolation defects, subject
      mutation, malformed structured output, sanitization failure, or diagnostic
      internal failure must remain fail-closed through a nonzero outer outcome.
    - >
      Runtime verification evidence is authoritative only after the structural
      completion gate succeeds. Reviewer and Human/Brain must interpret that
      evidence afterward; neither Executor structural claims nor a zero outer exit
      alone may become semantic root-cause, worker-selection, or BP-V4 completion
      authority.
    - >
      A clean focused diagnostic across all profiles is not full-suite parallel
      conformance and does not authorize any worker count or production default.
    - >
      Do not modify any repository file and do not push or publish from Executor execution.

acceptance:
  - id: AC1
    condition: >
      Pre-verification repository state is structurally zero-delta: final HEAD equals
      the admitted RUN base, the worktree is clean, RESULT.changed_files is empty,
      and no repository mutation was created.
  - id: AC2
    condition: >
      Bounded read-only inspection confirms the admitted candidate contains the exact
      published TASK-166 diagnostic primitive with its fixed six-node target set,
      fixed serial/parallel-2/parallel-4 profile order, and existing fail-closed
      diagnostic integrity checks.
  - id: AC3
    condition: >
      Executor structural output contains no evidence, does not execute or claim an
      outcome from the diagnostic, and leaves the canonical verification contract as
      exactly one Runtime-owned command: python scripts/bp_v4_parallel_diagnostic.py.
  - id: AC4
    condition: >
      The inspected diagnostic primitive's source contract remains observational:
      successful outer completion emits AIOS_BP_V4_PARALLEL_DIAGNOSTIC version 1
      facts for the fixed experiment, while diagnostic-integrity defects fail closed;
      it contains no root-cause, correction, worker-selection, ranking, or adoption authority.
  - id: AC5
    condition: >
      The TASK completion contract preserves the semantic limit that focused
      diagnostic execution, including a clean result, is not full-suite BP-V4
      conformance and does not itself authorize a worker, correction, or roadmap advancement.
  - id: AC6
    condition: >
      Existing authority boundaries remain unchanged: Runtime owns canonical
      verification/EVIDENCE, Reviewer owns semantic verdict, Human/Brain own later
      interpretation/correction/worker/roadmap decisions, and Publisher owns publication.

verification:
  policy: minimum-sufficient-v1
  required:
    - python scripts/bp_v4_parallel_diagnostic.py
