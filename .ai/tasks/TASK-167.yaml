    - src/aios_renew/verification_contract.py
    - src/aios_renew/runtime.py
    - src/aios_renew/artifacts.py
  modify: []

non_goals:
  - Modify any repository file, including the diagnostic primitive, the six target tests, Git fixtures, production code, Runtime, workflows, governance, or roadmap state.
  - Execute the full BP-V4 measurement probe or author/execute TASK-159 revision 6.
  - Add worker 3 to the focused diagnostic, change target population, add dynamic node or worker selection, or bypass the reviewed TASK-166 primitive.
  - Run a separate readiness pytest, collection-only command, manual xdist command, git diff command, or duplicated diagnostic command.
  - Let the Executor execute the diagnostic, synthesize diagnostic output, construct canonical EVIDENCE, or claim any Runtime-only outcome.
  - Fix any failure observed by the diagnostic inside TASK-167.
  - Enable core.longpaths, shorten fixture roots, add locks, xdist grouping, serialization, skip/xfail, broad mocking, retry, fallback, rerun, or adaptive scheduling.
  - Select, rank, recommend, persist, or adopt a worker count or performance threshold.
  - Treat focused diagnostic success as full-suite parallel conformance or BP-V4 completion.
  - Let the diagnostic tool classify semantic root cause, choose a correction, or advance roadmap semantics.
  - Add a new evidence store, database, lifecycle state, planner, router, reviewer, publisher, or verification authority.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-167 r1 is a zero-delta read-only PRIMARY with empty scope.modify. The
      Executor must leave final Git HEAD equal to the admitted RUN base, leave the
      worktree clean, return changed_files as empty, and create no commit merely
      to complete diagnostic preparation.
    - >
      Executor structural claims are restricted to pre-verification facts. Executor
      evidence must remain empty. The Executor must not run
      python scripts/bp_v4_parallel_diagnostic.py, must not run equivalent pytest/
      xdist commands, and must not claim whether any target passes, fails, reproduces
      a historical failure, identifies a cause, or demonstrates parallel safety.
    - >
      Canonical verification contains exactly one command:
      python scripts/bp_v4_parallel_diagnostic.py.
      No additional pytest, collection, Git-integrity, readiness, full-suite,
      measurement, or duplicated diagnostic command is authorized.
    - >
      Runtime must execute the diagnostic on the exact TASK-156 isolated verification
      subject bound to the admitted TASK-167 candidate SHA. The reviewed TASK-166
      primitive owns exact six-target collection checks, exact ordered serial /
      parallel-2 / parallel-4 execution, worker/process/root observations, bounded
      typed cause facts, deterministic comparison sets, and subject-mutation checks.
    - >
      Inner pytest nonzero status is observational data rather than diagnostic
      mechanism failure. Runtime verification may PASS when the diagnostic outer
      process returns zero after faithfully completing all fixed profiles even if
      one or more inner serial or parallel profiles report failed target tests.
      Such PASS means only that the diagnostic experiment completed faithfully.
    - >
      Missing/incompatible tooling, malformed fixed collection, missing or unexpected
      workers, duplicate execution, shared or malformed mutable-root observations,
      subject mutation, malformed structured observations, sanitization failure, or
      diagnostic-internal failure must remain fail-closed through a nonzero outer
      diagnostic outcome.
    - >
      Successful Runtime evidence must remain the reviewed
      AIOS_BP_V4_PARALLEL_DIAGNOSTIC version-1 envelope with the exact current
      subject identity, fixed six target identities, exact serial/2/4 profiles,
      bounded failure/cause facts, and deterministic comparison sets. Do not add
      root_cause, recommended_fix, selected_worker, best, winner, score, adopt,
      safe_to_enable, threshold verdicts, or equivalent semantic-decision fields.
    - >
      A clean focused diagnostic across all three profiles does not establish
      full-suite parallel conformance. A clean worker-2 profile does not authorize
      worker 2. A worker-4-only failure may strengthen a concurrency-pressure
      hypothesis but does not itself establish a semantic root cause.
    - >
      TASK-167 success establishes only trustworthy focused current-main diagnostic
      evidence. Human/Brain must explicitly interpret canonical evidence after
      review before authoring any correction or deciding whether a fresh TASK-159
      revision is warranted. Execution, Runtime, Reviewer, or Publisher must not
      advance roadmap semantics automatically.
    - >
      Do not modify any repository file and do not push or publish from Executor execution.

acceptance:
  - id: AC1
    condition: >
      The admitted TASK-167 PRIMARY remains a zero-delta read-only candidate: final
      Git HEAD equals the admitted RUN base, the worktree is clean,
      RESULT.changed_files is empty, and no repository mutation is created for
      diagnostic preparation.
  - id: AC2
    condition: >
      Bounded inspection confirms the admitted candidate contains the exact reviewed
      and published TASK-166 diagnostic primitive with its fixed six-node target
      population, fixed serial/parallel-2/parallel-4 profile order, fail-closed
      integrity checks, and no Executor-created replacement mechanism.
  - id: AC3
    condition: >
      Executor does not execute or claim outcomes from the diagnostic. Runtime alone
      executes the one canonical diagnostic command and owns resulting EVIDENCE.
  - id: AC4
    condition: >
      Canonical Runtime evidence is one AIOS_BP_V4_PARALLEL_DIAGNOSTIC version-1
      observation bound to the exact TASK-167 subject and containing the exact six
      targets, exact fixed profiles, bounded typed failure/cause facts, and
      deterministic comparison sets. Inner pytest failures remain valid observations
      when diagnostic integrity succeeds.
  - id: AC5
    condition: >
      TASK-167 completion semantics are limited to faithful diagnostic observation:
      no Runtime, Executor, Reviewer, or diagnostic-tool result is treated as
      full-suite BP-V4 conformance, parallel-default safety, worker selection,
      semantic root-cause verdict, or automatic correction authorization.
  - id: AC6
    condition: >
      Existing authority boundaries remain unchanged: Runtime owns canonical
      verification/EVIDENCE, Reviewer owns semantic verdict, Human/Brain own later
      root-cause/correction/worker decisions, Publisher owns publication, and
      execution/review/publication do not advance roadmap semantics automatically.

verification:
  policy: minimum-sufficient-v1
  required:
    - python scripts/bp_v4_parallel_diagnostic.py
