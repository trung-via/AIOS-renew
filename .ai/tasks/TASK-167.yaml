task_id: TASK-167
revision: 3

goal: >
  Execute the reviewed and published BP-V4 focused parallel diagnostic primitive
  exactly once as Runtime-owned canonical verification on the admitted current
  subject. Keep the native Executor as a zero-delta structural handoff only, with
  no repository command, inspection, test, search, or mutation required from the
  Executor before Runtime verification.

problem: >
  TASK-167 revision 2 corrected the earlier acceptance/evidence ordering defect,
  but it still unnecessarily required the native Executor to perform bounded
  repository inspection before returning its structural ResultPackage. RUN-167-003
  reproduced the same executor-internal local command-runner timeout previously
  observed in RUN-167-001: read-only workspace commands timed out before starting,
  so the Executor truthfully returned unresolved items and Runtime stopped at
  COMPLETION_GATE. The self-host workflow and AIOS admission path were healthy, the
  RUN was admitted, the candidate remained zero-delta and clean, and Runtime
  verification was never invoked. For this evidence-only experiment the repository
  inspection requirement is redundant: canonical TASK identity is SHA-bound,
  TASK-166's diagnostic primitive is already reviewed and published, and Runtime
  independently checks actual HEAD, worktree cleanliness, changed-files truth, and
  then executes the exact canonical verification command. Revision 3 therefore
  removes the unnecessary Executor-shell dependency while preserving every
  authority boundary and the exact diagnostic experiment.

assumptions:
  - >
    Canonical main at TASK-167 revision-3 authoring is
    11bb012c0ebc8bf7691cb0ae83b4ca5cfcd93a8f.
  - >
    TASK-166 r1 is engineering-complete through RUN-166-003,
    REVIEW-166-003 DELTA PASS, and publication of source candidate
    94a16a9e67f494d71960e6a45032ba73912be61c. The published diagnostic
    primitive remains the only diagnostic mechanism authorized here.
  - >
    RUN-167-001 and RUN-167-002 are immutable revision-1 COMPLETION_GATE
    failures. RUN-167-003 is an immutable revision-2 COMPLETION_GATE failure whose
    candidate is zero-delta, clean, repairable, and transportable.
  - >
    RUN-167-003 failure artifact
    b3049f992f827dea575e94871e42b11b5f5a825b records executor-internal
    read-only command-runner timeouts before repository inspection; canonical
    verification was not invoked.
  - >
    Runtime deterministically validates RESULT.head_sha against actual Git HEAD,
    rejects a dirty worktree, canonicalizes/validates changed-files truth, enforces
    TASK scope, requires complete structural acceptance coverage, materializes the
    exact verification subject, executes canonical verification, and attaches
    Runtime-owned evidence.
  - >
    Because this TASK authorizes no mutation and its implementation work is only a
    structural handoff, no native Executor repository command is necessary to
    establish a safe Runtime verification subject.
  - >
    TASK-157 remains authoritative for the separate full-suite
    AIOS_BP_V4_MEASUREMENT contract. This TASK does not execute or revise that
    contract and does not authorize TASK-159 revision 6.
  - >
    Canonical roadmap planning keeps focused diagnostic execution as the unique
    NEXT prerequisite while BP-V4 remains blocked pending later Human/Brain
    interpretation of canonical evidence.
  - >
    Runtime owns canonical verification/EVIDENCE; Reviewer owns semantic review;
    Human/Brain own root-cause interpretation, correction strategy, worker
    adoption, and roadmap planning; Publisher owns publication.

scope:
  inspect: []
  modify: []

non_goals:
  - Execute any repository, shell, Git, file-read, search, pytest, xdist, or diagnostic command in the native Executor.
  - Modify any repository file or create a commit.
  - Repair or replay RUN-167-001, RUN-167-002, or RUN-167-003.
  - Modify Runtime completion ordering, ResultPackage semantics, verification ownership, or evidence attachment.
  - Modify scripts/bp_v4_parallel_diagnostic.py or any TASK-166 diagnostic behavior.
  - Execute the full BP-V4 measurement probe or author/execute TASK-159 revision 6.
  - Fix any target-test failure observed later by Runtime inside this TASK.
  - Add worker 3, dynamic node/worker selection, retry, fallback, rerun, or adaptive scheduling.
  - Select, rank, recommend, persist, or adopt a worker count or performance threshold.
  - Treat focused diagnostic completion as full-suite parallel conformance or BP-V4 completion.
  - Add lifecycle, Planner, Reviewer, Publisher, evidence-store, or routing authority.
  - Advance roadmap state from Executor, Runtime, Reviewer, or Publisher.
  - Push or publish from Executor execution.

constraints:
  hard:
    - >
      TASK-167 r3 is a zero-delta read-only PRIMARY with empty scope.inspect and
      scope.modify. The native Executor must not invoke shell, Git, repository
      file-read, search, test, diagnostic, or other workspace commands/tools.
    - >
      The Executor must construct the structural ResultPackage solely from the
      immutable canonical TASK/RUN context supplied by the admitted native adapter.
      result.head_sha must be the admitted RUN base SHA, changed_files must be empty,
      unresolved must be empty, root evidence must be empty, and every
      claim.evidence list must be empty.
    - >
      Executor claims may cover only this pre-verification structural handoff and
      authority boundary. They must not claim that Runtime verification ran, that
      any target passed or failed, that historical failure reproduced, that a root
      cause was established, or that any worker is safe or preferred.
    - >
      Runtime independently owns and checks actual repository HEAD, cleanliness,
      changed-files truth, TASK scope, verification-subject materialization, command
      execution, post-verification repository state, canonical evidence attachment,
      terminal persistence, and transport.
    - >
      Canonical verification contains exactly one Runtime-owned command:
      python scripts/bp_v4_parallel_diagnostic.py.
    - >
      The exact reviewed TASK-166 diagnostic primitive remains fixed to six
      representative nodes and serial, parallel-2, and parallel-4 profiles. This
      TASK neither replaces nor modifies that primitive.
    - >
      Runtime may treat inner pytest nonzero outcomes as observations when the
      diagnostic outer process completes its validated experiment successfully.
      Missing tooling, malformed collection, worker/root isolation defects, subject
      mutation, malformed structured output, sanitization failure, or diagnostic
      internal failure remain fail-closed through a nonzero outer outcome.
    - >
      Focused diagnostic evidence, even if clean, is not full-suite BP-V4
      conformance and does not itself authorize a worker, correction, production
      default, or roadmap advancement.
    - >
      Do not modify any repository file and do not push or publish from Executor execution.

acceptance:
  - id: AC1
    condition: >
      The Executor returns a complete zero-delta structural ResultPackage from the
      supplied admitted context only: result.head_sha equals the admitted RUN base
      SHA, changed_files is empty, unresolved is empty, root evidence is empty, and
      every claim evidence list is empty.
  - id: AC2
    condition: >
      The Executor performs no repository or shell command/tool invocation and makes
      no claim about a Runtime verification or diagnostic outcome.
  - id: AC3
    condition: >
      The structural ResultPackage preserves the exact canonical verification
      contract as Runtime-owned work only, with no Executor-created substitute
      verification or evidence path.
  - id: AC4
    condition: >
      The structural handoff preserves existing authority limits: later focused
      diagnostic evidence is observational only; Runtime owns verification/EVIDENCE,
      Reviewer owns semantic verdict, Human/Brain own interpretation, correction,
      worker and roadmap decisions, and Publisher owns publication.

verification:
  policy: minimum-sufficient-v1
  required:
    - python scripts/bp_v4_parallel_diagnostic.py
