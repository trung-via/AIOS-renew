non_goals:
- No production KA-01 v1.3 Runtime admission/budget enforcement, G3/G6 activation
  or per-RUN opt-in within this normative TASK; subsequent engineering and exact Human
  activation remain distinct.
- No frozen Kernel edit, historic v1.0/v1.1/v1.2 reinterpretation, old TASK/RUN/RESULT/FAILURE/REVIEW
  mutation, already admitted run retarget, model/executor selection, downstream pin
  or automatic roadmap advancement.
- No second scheduler, planner, lifecycle router, agent, DB, implied correction strategy,
  unsupported failover or mandatory broad full suite; no relaxation of proof on budget
  exhaustion.
constraints:
  hard:
  - Amend KA-01 as a separately identifiable prospective version 1.3 on v1.2 while
    retaining immutable historical versions, normative publication gates and NOT_ACTIVATED
    status. Only future eligible versioned Human-opted-in admitted ACTIVE PRIMARY/REPAIR/REMEDIATION
    RUNs may later use the profile.
  - Define exactly max_corrections=2, max_checkpoints=3, cumulative RUN wall=240 minutes
    and cumulative Runtime verification=180 minutes INCLUDED within that wall, optional
    max_tokens=null meaning no KA-01-specific token ceiling; retain external provider/account
    limits.
  - Human can override each parameter individually by exact TASK id/revision and applicable
    operation(s) using separately authenticated operational delegation, not operative
    semantic TASK fields. Missing fields use published defaults; a previous TASK revision/RUN/operation
    never creates inherited consent or lease.
  - Actual future Runtime admission must authenticate exact version/policy/profile,
    current G6 Human per-RUN opt-in, operation-specific source authority, chosen live
    Executor lease and concrete effective limits, freezing all bounds in each RUN.
    Neither default selection nor normative publication grants G6.
  - Require corrections integer >= 0, checkpoints integer >= 1, positive finite run/verification
    bounds with verification <= run, optional positive token cap if present, transitions
    <= min(corrections,checkpoints-1), monotone spent/reserved accounting, safe STOP
    on exhaustion/UNKNOWN, no duplicate debit/reset/reentry and no suppressed mandatory
    proof.
  - 'ROADMAP ATOMICITY: change both canonical next_items and sequence status from
    old Lean VP ID to exactly one new lean-vp-intra-v13-budget-defaults-successor;
    retain dated historical planning and every prior task/run, 16 original delivery
    slots and previously superseded VP-03..07 legacy paths. Do not leave a competing
    NEXT or old current planning_document.'
  - Add docs/AIOS-LEAN-VP-INTRA-V13-ROADMAP.md as one authoritative successor planning
    pointer, mark old docs/AIOS-LEAN-VP-INTELLIGENT-INTRA-PRIMARY.md live NEXT claim
    superseded (history preserved), record reviewed TASK-391 L3-04 completion and
    distinct published TASK-393/394 side tracks, keep next KA-01 v1.3 then L3-05->L3-06->G6->L4.
  - Provide focused positive and adversarial source-level tests in permitted tests/test_brain_sync.py
    for single NEXT resolution versus stale next_items/dual NEXT conflict, retaining
    current Brain Sync API and fail-closed behavior.
  - All modifications stay within the five exact listed paths. Runtime verifies under
    minimum-sufficient-v1; Reviewer and Publisher independently gate eligible publication.
    No production activate, roadmap auto-advance or measurement claim.
