  - docs/AIOS-LEAN-VP-L1-CANONICAL-SOURCE-BINDING.md
  - docs/AIOS-LEAN-VP-L1-REVIEW-AUTHORITY.md
  - .ai/roadmap-state.yaml
  - .ai/brain-audit-profiles.yaml
  - .ai/tasks/TASK-378.yaml
  - .ai/tasks/TASK-379.yaml
  - src/aios_renew/task.py
  - src/aios_renew/review.py
  - src/aios_renew/publication.py
  - src/aios_renew/proof_coverage_contract.py
  - src/aios_renew/correction_frontier.py
