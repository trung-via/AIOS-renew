task_id: TASK-380
revision: 1
goal: 'Complete the next bounded Lean VP L1 authority slice: authenticate an exact
  Human-selected, distinct mapping-review TASK and semantic source association through
  the existing GitHub Human/Runtime ingress boundary, then allow TASK-378''s read-only
  eligibility reader to consume this independently authenticated selection while retaining
  the existing exact canonical Reviewer PASS and Publisher publication requirements.
  KA-01 remains NOT_ACTIVATED.'
problem: TASK-376 structurally validates semantic proof intake, TASK-377 authenticates
  Git sources and TASK-378 validates an independently selected mapping-review lineage,
  but its real private Human-selection source intentionally returns None. Neither
  an ordinary engineering REVIEW PASS, a caller-supplied review TASK selector nor
  a mapping-declared ref can prove a Human's separately authorized mapping-review
  choice. Provide this missing minimal authority association without creating a second
  Reviewer, Publisher, scheduler, approval registry or lifecycle source.
assumptions:
- Fresh canonical main SHA 3287c568a5c5702e657cc7167a8e2581545627d9 contains exact
  TASK-378 RUN-378-004 REVIEW-378-004 DELTA PASS and separately published TASK-379
  RUN-379-002 REVIEW-379-001 PRIMARY PASS; their lineages are not reopened.
- Human explicitly approved authoring this Lean VP L1 TASK-380 after roadmap continuation.
  No Executor, model, effort, per-RUN KA-01 opt-in or production cutover is delegated
  by that approval.
- Exact selected TASK_AUTHORING audit is tca-1 v1 normalized digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2;
  Brain used CONSTRUCT then ADVERSARIAL_AUDIT_AND_RECONCILE with final closure, keeping
  authoring cognitive support outside mutation truth.
- Reuse current allowlisted Human GitHub Issue ingress, existing Runtime-owned canonical
  CAS, immutable TASK/RUN/RESULT/EVIDENCE/REVIEW, existing independent Reviewer/Publisher
  and TASK-378 non-operative read-only API; a transport receipt alone cannot establish
  authority.
- An authenticated Human selection is necessary but never sufficient for semantic
  adequacy or independent Reviewer/PUBLISHER PASS. A real selected mapping-review
  TASK may not yet exist, so NOT_ESTABLISHED is the truthful outcome in its absence.
- Use standing Human-selected LEGACY_REPOSITORY_DEFAULT_ROUTE and minimum-sufficient-v1
  verification, preserving historical V1/V2 decoding.
scope:
  inspect:
  - docs/AIOS-MANIFESTO.md
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
