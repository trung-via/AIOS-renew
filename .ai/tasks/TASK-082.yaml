task_id: TASK-082
revision: 1

goal: >
  Implement the separately gated A6 approved REVIEW-to-REMEDIATION wakeup as a
  subordinate outer-automation boundary. After A3 has already recorded exact Human
  approval for one immutable canonical REMEDIATION lineage, allow an authorized remote
  Human/Brain to submit one bounded correction-delivery identity plus one explicit
  Executor choice and have AIOS durably attribute that delivery, validate the exact
  still-current approval/remediation identity, and delegate at most once into the existing
  canonical REMEDIATION execution path. Re-delivery of the same request must never create
  another correction RUN or invoke another coding Executor. Preserve TASK-081 admission
  diagnostics, existing narrow correction semantics, Runtime verification, semantic DELTA
  review, publication authority, and A1/A2/A3 boundaries.

problem: >
  A1/A2 provide durable remote PRIMARY wakeup and at-most-once delivery attribution, while
  A3 provides bounded remote status plus exact SHA-bound Human approval for a canonical
  REMEDIATION. The remaining A6 gap is execution handoff: after ChatGPT has authored a
  valid REVIEW/REMEDIATION and the Human has approved that exact immutable correction,
  the Human still has to operate the local terminal and invoke `aios remediate` manually.
  Repeating that manual handoff also has no outer correction-delivery identity comparable
  to A2, so a remote delivery/rerun layer could not safely distinguish re-delivery from a
  new correction request. TASK-081 now makes pre-RUN rejection observable and attributable,
  and A3 already validates the exact approved correction lineage. A6 should therefore add
  only a thin, idempotent approved-remediation wakeup around the existing REMEDIATION path;
  it must not become an autonomous Reviewer, correction author, Executor router, retry
  engine, or second remediation implementation.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-082 authoring is
    65c1597eb59b06041fba1d749f2dea87e2c00833, the semantically reviewed PASS and
    published TASK-081 source candidate.
  - >
    REVIEW-081-003 is canonical DELTA PASS for exact reviewed SHA
    65c1597eb59b06041fba1d749f2dea87e2c00833 and there is no active TASK-081 finding or
    failed continuation that TASK-082 must continue.
  - >
    TASK-068 semantics, as integrated and hardened through TASK-073, remain authoritative
    for PRIMARY-only durable dispatch identity and crash/re-delivery reconciliation. A6
    may use that design as a safety precedent but must not reinterpret A2 PRIMARY dispatch
    records as correction authority.
  - >
    TASK-074 remains authoritative for A3: remote approval is operational Human authority
    bound to one exact canonical source RUN, TASK/revision, REVIEW, finding, action,
    reviewed_sha, remediation ref and remediation commit SHA. Approval itself is not a
    semantic verdict, RESULT/EVIDENCE, publication proof, or correction implementation.
  - >
    TASK-078 remains authoritative for current-head versus historical-subject REMEDIATION
    execution. A6 delegates to that existing canonical path and must not recreate its
    historical workspace or lineage logic.
  - >
    TASK-081 remains authoritative for Admission Failure v2 and exact failure taxonomy.
    Rejections occurring before a canonical REMEDIATION RUN is created remain pre-RUN
    operational rejection; once a REMEDIATION RUN exists, later failure remains RUN-keyed
    state only.
  - >
    A4 transport extraction and A5 evidence strengthening remain separately gated because
    no replacement-parity or measured evidence gap currently requires them before A6.

