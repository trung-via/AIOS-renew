task_id: TASK-185
revision: 1

goal: >
  Implement BP6-P1B Bounded Reviewer Material Package as one deterministic,
  content-addressed cognitive-support contract that consumes an exact
  AIOS_SEMANTIC_REVIEW_SCOPE v1 identity and materializes the complete bounded textual
  implementation material required by a repository-blind Reviewer, without rediscovering
  lifecycle truth or acquiring Reviewer, Runtime, provider, or mutation authority.

problem: >
  BP6-P1A now identifies the exact semantic review base, latest correction base and
  reviewed head, but a provider-neutral Reviewer still cannot inspect the implementation
  delta without repository access. A new bounded package must materialize the exact
  ADD/MODIFY/DELETE source and diff material for those already-bound SHAs, preserve the
  two-view semantics required by repaired PRIMARY and repair-of-remediation DELTA review,
  remain deterministic under working-tree/Git-config differences, and fail closed rather
  than silently omit, truncate, normalize or substitute unsupported material.

assumptions:
  - >
    Canonical main 2ea44fadc8fe7678e1301ab045ec17d5af753d2b records BP-6 as
    the unique current planning milestone with BP6-P1A DONE through TASK-184 /
    RUN-184-001 / REVIEW-184-001 and BP6-P1B as the unique NEXT phase.
  - >
    src/aios_renew/unified_state.py::observe_semantic_review_scope is the reviewed
    BP6-P1A authority for AIOS_SEMANTIC_REVIEW_SCOPE v1 identity. TASK-185 consumes
    that exact scope and does not re-derive lifecycle mode, origin, prior finding,
    next_action or candidate selection.
  - >
    docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md defines the reviewed planning boundary,
    package shape, bounds, failure classes and no-fetch/local-object-only semantics for
    BP6-P1B.
  - >
    BP6-P2 owns Reviewer procedure/return-contract material, BP6-P3 owns
    AIOS_REVIEW_REQUEST/DECISION, BP6-P4 owns Reviewer provider invocation, BP-7 owns
    cross-provider/context hot-swap proof and BP-8 owns real-provider proof.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-REVIEWER-PROVIDER-PROTOCOL.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-184.yaml
    - src/aios_renew/unified_state.py
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - tests/test_operator_unified_state.py
  modify:
    - src/aios_renew/review_material.py
    - tests/test_review_material.py

non_goals:
  - >
    Change AIOS_SEMANTIC_REVIEW_SCOPE v1, Unified State serialization/reduction,
    Decision Packet, REVIEW schema, review.validate_review, Runtime verification,
    authoring ingress, publication, Flow Cards, Brain provider protocol or any existing
    lifecycle contract.
  - >
    Discover current TASK/RUN/RESULT/REVIEW state, inspect canonical refs to infer
    lifecycle truth, choose PRIMARY versus DELTA, select semantic origins or prior
    findings, or create any second lifecycle reducer.
  - >
    Fetch from any Git remote, call GitHub/network services, synchronize branches,
    select a different candidate, update refs, modify the worktree/index, create commits,
    run verification, author REVIEW/REMEDIATION/REPAIR, publish, or mutate canonical state.
  - >
    Define Reviewer procedure or REVIEW return-contract material, provider request/
    decision envelopes, provider/model selection, invocation, retry, fallback, voting,
    session memory, routing or real-provider behavior.
  - >
    Support binary/NUL material, invalid UTF-8, symlinks, gitlinks/submodules, non-regular
    Git object types, or unbounded repository/source packaging in v1.
  - >
    Consume BP6-P2/P3/P4, BP-7, BP-8 or downstream adoption.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      Production mutation is limited to scope.modify. If the required outcome needs a
      change to Unified State, REVIEW, Runtime, ingress, publication, Decision Packet,
      provider code or another production file, fail closed back to Brain rather than
      widening scope.
    - >
      Expose one Git-backed constructor from caller-supplied AIOS_SEMANTIC_REVIEW_SCOPE v1
      material and one pure serialized-package revalidator. The constructor may validate
      the supplied P1A scope's exact closed fields/fingerprint but may not derive or alter
      lifecycle semantics. The revalidator must require no repository, Git, network,
      lifecycle discovery or provider access.
    - >
      AIOS_REVIEW_MATERIAL_PACKAGE v1 is cognitive-support material only. Its exact closed
      top-level fields are format, version, kind, review_scope_fingerprint, review_mode,
      semantic_base_sha, latest_delta_base_sha, reviewed_head_sha, semantic_view,
      latest_delta_view, sources and package_fingerprint.
    - >
      semantic_view is always present with exact closed fields base_sha, head_sha and
      changes, and must bind semantic_base_sha -> reviewed_head_sha. latest_delta_view
      has the same closed shape and is null if and only if latest_delta_base_sha equals
      semantic_base_sha; otherwise it must bind latest_delta_base_sha ->
      reviewed_head_sha. No duplicate second view is admitted when the two bases match.
    - >
      Every view contains at most 64 change records, deterministically ordered
      lexicographically by exact UTF-8 path bytes. Rename detection is off: a rename is
      represented as DELETE of the old path plus ADD of the new path. Allowed v1 statuses
      are exactly ADD, MODIFY and DELETE; unsupported object/type transitions fail closed.
    - >
      Each change record is closed to path, status, base_mode, head_mode,
      base_content_sha256, head_content_sha256, review_source_ref and unified_diff.
      Supported regular Git blob modes are exactly 100644 and 100755. ADD requires null
      base mode/hash and non-null supported head mode/hash; DELETE requires the converse;
      MODIFY requires both supported modes/hashes. An executable-bit-only 100644/100755
      change is a valid MODIFY even when content hashes and textual diff are identical.
    - >
      review_source_ref is non-null for every admitted change. ADD/MODIFY reference the
      complete reviewed-head text; DELETE references the complete base text. Empty files
      are valid source records and use the SHA-256 of zero UTF-8 bytes.
    - >
      The shared sources list is closed to source_ref, content_sha256, byte_length and
      text. source_ref deterministically equals "sha256:" followed by the lowercase
      64-hex SHA-256 of the exact UTF-8 source bytes. sources must equal exactly the set
      of review_source_ref values used by all admitted changes across both views, with
      each unique source stored once and no unreferenced payload.
    - >
      A repeated content hash must resolve to byte-identical text; any same-ref/hash with
      different bytes fails as MATERIAL_INCONSISTENT. Every source byte_length and
      content_sha256 must match its exact encoded text.
    - >
      Construction reads only exact local commit/tree/blob objects selected by the
      supplied scope. It performs no fetch or remote/ref discovery. Missing bound
      commits/trees/blobs fail as GIT_MATERIAL_UNAVAILABLE. Dirty/untracked worktree
      content, user Git config, external diff drivers, textconv, color and rename
      heuristics must not alter the normalized package.
    - >
      Every examined base/head regular blob needed for source or diff construction is
      bounded to at most 262144 bytes before full admission. Text must decode as strict
      UTF-8, contain no NUL, and preserve exact decoded characters without CRLF/LF
      normalization, Unicode normalization, replacement decoding, trimming or silent
      rewriting. Terminal-newline-only changes remain observable and alter package
      identity.
    - >
      Paths are strict UTF-8 repository-relative Git paths using "/" only, with no
      absolute path, backslash, empty segment, "." or ".." segment, NUL or control
      character. Duplicate paths within one view fail closed.
    - >
      unified_diff is deterministic textual change material for exactly that path and
      exact bound base/head blobs, independent of working-tree content and repository
      diff/textconv configuration. Aggregate UTF-8 bytes of unified_diff across one view
      must not exceed 262144. File-mode semantics remain independently bound by the mode
      fields even when a mode-only MODIFY has no textual body change.
    - >
      The canonical normalized complete package, including JSON escaping and excluding
      only package_fingerprint itself for fingerprint calculation, must not exceed
      1048576 UTF-8 bytes. Bounds are rejection ceilings only; no source, diff, record or
      package may be silently truncated, summarized or omitted.
    - >
      package_fingerprint is lowercase SHA-256 of canonical deterministic JSON over the
      complete normalized closed package excluding only package_fingerprint. Equivalent
      semantic/material input produces the same package fingerprint; changing any scope
      binding, view/base/head, path/status/mode, source text/hash/ref, diff, membership or
      ordering changes the fingerprint.
    - >
      The pure revalidator must fail closed on unknown/missing fields, invalid scope/view
      cross-bindings, invalid source refs/hashes/lengths, duplicate or unsorted paths,
      hidden/unreferenced sources, malformed status/mode matrices, invalid bounds or
      package fingerprint mismatch. It does not need Git to re-prove diff semantics.
    - >
      Expose one bounded material-error family with stable reason codes at least
      REVIEW_SCOPE_INVALID, GIT_MATERIAL_UNAVAILABLE, UNSUPPORTED_MATERIAL,
      MATERIAL_BOUND_EXCEEDED and MATERIAL_INCONSISTENT. These are pre-Reviewer
      cognitive-support failures only and must never fabricate BLOCKED,
      CHANGES_REQUIRED, REVIEW, FAILURE, REMEDIATION, REPAIR or publication state.
    - >
      The module performs no provider invocation, semantic REVIEW judgment, Runtime
      verification, lifecycle mutation, retry/fallback, provider selection, repository
      dump beyond the exact changed material, or persistent session/cache state.

acceptance:
  - id: AC1
    condition: >
      The repository contains one bounded review_material module exposing a Git-backed
      constructor and a pure serialized-package revalidator for the exact closed
      AIOS_REVIEW_MATERIAL_PACKAGE v1 contract, without modifying or duplicating P1A
      lifecycle authority.
  - id: AC2
    condition: >
      Direct PRIMARY or DELTA scope with equal semantic/latest bases produces one exact
      semantic view and null latest_delta_view, while repaired PRIMARY and
      repair-of-remediation scope with distinct bases produce both correctly cross-bound
      views without duplicate material semantics.
  - id: AC3
    condition: >
      ADD, MODIFY and DELETE records bind exact supported modes, content hashes, complete
      relevant source refs and deterministic per-path textual diffs; executable-bit-only
      MODIFY is preserved, and rename is deterministically represented as DELETE plus ADD
      with rename heuristics disabled.
  - id: AC4
    condition: >
      The shared source table is exactly the referenced source set across both views,
      stores duplicate content once, preserves exact strict-UTF-8 text including newline
      distinctions, validates byte length/hash/ref consistency, and admits no hidden or
      unrelated repository payload.
  - id: AC5
    condition: >
      Construction depends only on exact already-local bound Git objects: missing objects
      fail as GIT_MATERIAL_UNAVAILABLE, while dirty/untracked worktree content and
      user-configured external diff/textconv/color/rename behavior cannot change an
      otherwise equivalent package.
  - id: AC6
    condition: >
      Invalid/tampered P1A scope, malformed paths, invalid UTF-8, NUL/binary content,
      unsupported modes/types, duplicate/unsorted records, source inconsistency and each
      configured blob/view/package bound fail closed with the appropriate stable material
      error rather than omission, truncation or semantic REVIEW output.
  - id: AC7
    condition: >
      Source SHA-256 values and package_fingerprint are stable for equivalent exact
      material and change under every bound semantic/material mutation, while
      provider/model/session, chat memory, raw verification logs and unrelated repository
      state are absent from the fingerprinted package.
  - id: AC8
    condition: >
      The pure revalidator validates the complete serialized contract, bounds,
      cross-references, hashes and package fingerprint without Git/network access, and no
      successful or failing path invokes providers, review.validate_review, Runtime,
      ingress, Publisher, lifecycle mutation, retry/fallback or automatic correction.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_review_material.py
