task_id: TASK-104
revision: 1

goal: >
  Introduce one bounded, transport-neutral Brain control-plane ingress that accepts
  Brain/Reviewer-authored TASK, REVIEW, REMEDIATION, and REPAIR semantic artifacts,
  validates them against existing canonical contracts and exact repository lineage,
  and lets deterministic Runtime-owned Git mutation canonicalize them without requiring
  the Brain host to have direct generic GitHub write capability.

problem: >
  AIOS-renew currently has strong Runtime-to-repository transport for RUN/RESULT/EVIDENCE
  and correction/publication refs, but the reverse control-plane direction still depends
  on the Brain host directly mutating GitHub. Current observed usage proved that a Brain can
  read canonical Git state while create-branch/create-file style mutations may be blocked by
  the model-host platform before GitHub or AIOS receives the request. The same coupling also
  contributed to REVIEW metadata being committed onto implementation main before being
  removed, even though review-decision metadata belongs on separate canonical control-plane
  lineage. AIOS therefore lacks a generic Brain-to-Repo authoring ingress: semantic authority
  exists, but trusted deterministic delivery into canonical repository state does not.

assumptions:
  - Canonical main at TASK authoring is f4a2a4ff24840a0052fe8bf75fc2edcec4272ec1; Runtime still resolves and binds exact then-current state at execution/admission and this TASK does not predeclare an execution SHA.
  - TASK-101 revision 2 remains the authored Performance Closure P5 contract and is paused by explicit Human priority until this generic control-plane ingress is published.
  - Existing TASK, REVIEW, REMEDIATION, REPAIR, correction-frontier, publication, and Git transport validators remain authoritative wherever they already define semantics.
  - Existing Runtime publication from canonical PASS review-decision lineage remains the implementation-publication authority; Brain ingress does not directly publish implementation main.
  - External carriers are replaceable delivery mechanisms; the first repository-provided surface may be local/file/stdin based as long as the semantic ingress contract is carrier-neutral.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-087.yaml
    - .ai/tasks/TASK-099.yaml
    - .ai/tasks/TASK-101.yaml
    - src/aios_renew/task.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/publication.py
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - tests/test_task.py
    - tests/test_review.py
    - tests/test_review_transport.py
    - tests/test_publication.py
    - tests/test_operator.py
    - README.md
  modify:
    - src/aios_renew/authoring_ingress.py
    - src/aios_renew/operator.py
    - tests/test_authoring_ingress.py
    - tests/test_operator.py
    - README.md

non_goals:
  - Add or depend on a ChatGPT-specific, Gemini-specific, Claude-specific, GitHub-connector-specific, browser-specific, or model-host-specific mutation protocol.
  - Expose arbitrary repository path writes, arbitrary Git refs, arbitrary Git commands, arbitrary shell execution, generic commit creation, or generic branch mutation to Brain payloads.
  - Let Runtime reinterpret, rewrite, improve, summarize, expand, select, or otherwise acquire semantic authority over Brain/Reviewer-authored TASK, REVIEW, REMEDIATION, or REPAIR content.
  - Let Brain ingress directly push implementation candidates to main, bypass semantic PASS review, bypass publication gates, or treat a REVIEW decision commit as product implementation.
  - Change Executor selection, execution, verification ownership, RESULT/EVIDENCE semantics, correction-frontier authority, publication eligibility, retry/reroute/fallback, or Unified State lifecycle reduction.
  - Add HTTP servers, webhooks, message brokers, queues, databases, schedulers, background polling, long-lived daemons, authentication products, or remote secret management in this revision.
  - Migrate or rewrite historical TASK/REVIEW/REMEDIATION/REPAIR artifacts or existing canonical refs.
  - Implement downstream-project migration; downstream repositories retain their exact pinned AIOS dependency until separately migrated.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Define exactly one versioned semantic ingress envelope with an allowlisted operation
      family for AUTHOR_TASK, SUBMIT_REVIEW, AUTHOR_REMEDIATION, and AUTHOR_REPAIR. The
      envelope carries semantic subject identity and payload plus exact expected canonical
      state required for concurrency safety; it must not accept caller-selected destination
      paths, Git refs, shell commands, or Git commands.
    - >
      For every operation, Runtime derives the only permitted canonical destination from
      validated semantic identity. Unexpected operation names, aliases, extra authority
      fields, malformed identity, malformed payload, or destination-like fields fail closed.
    - >
      AUTHOR_TASK must reuse the existing TASK parser/validation and Brain authoring
      constraints, derive the exact .ai/tasks/TASK-<id>.yaml destination, enforce exact
      revision/identity continuity and an expected-main compare-and-swap boundary, and allow
      no unrelated committed delta in the canonical TASK mutation.
    - >
      SUBMIT_REVIEW must resolve the exact canonical RUN/candidate/RESULT lineage, reuse the
      existing REVIEW parser/validator, require REVIEW.reviewed_sha to bind the exact reviewed
      candidate, and derive the canonical review-decision destination. A review-decision
      commit must be metadata-only, must not mutate implementation main, and must preserve
      existing publication semantics so only a validated PASS decision may subsequently
      authorize publication through the publication boundary.
    - >
      AUTHOR_REMEDIATION must resolve one exact canonical CHANGES_REQUIRED REVIEW finding,
      reuse existing REMEDIATION validation and correction-lineage authority, derive the
      existing canonical remediation ref/path identity, and reject stale, missing,
      conflicting, already-resolved, ambiguous, or mismatched finding state before mutation.
    - >
      AUTHOR_REPAIR must bind one exact failed RUN and its existing repair eligibility,
      reuse the established REPAIR authorization validation boundary, derive the canonical
      repair destination, and reject non-repairable, stale, conflicting, ambiguous, or
      mismatched failed lineage before mutation.
    - >
      Ingress mutations are optimistic-concurrency controlled. Every operation validates its
      exact expected canonical predecessor immediately before mutation; if main, candidate,
      decision, finding, failure, or applicable control state changed since Brain authored
      the envelope, the operation fails closed with no automatic merge, rebase, retry,
      fallback, normalization, or semantic reinterpretation.
    - >
      Identical replay of an already-canonicalized semantic operation is idempotent and
      returns the same canonical identity without a duplicate semantic mutation. Reuse of the
      same semantic identity with different payload bytes or incompatible expected state is a
      conflict and fails closed rather than overwriting or moving canonical history.
    - >
      Git credentials, remote resolution, object acquisition, commit/ref creation, ref update,
      compare-and-swap, and postcondition verification remain deterministic Runtime-owned
      mechanics. The semantic author never supplies credentials or gains generic Git mutation
      authority through the ingress.
    - >
      The first Human-facing carrier must be repository-provided, bounded, non-interactive,
      and usable with an envelope from a local file or standard input so a Brain can hand off
      exact semantic bytes without direct GitHub mutation capability. Carrier parsing must be
      separate from semantic validation/mutation so later external carriers can reuse the
      same ingress contract unchanged.
    - >
      Failures before a canonical ingress mutation are authoring/control-plane admission
      failures only. They must not create an engineering RUN, invoke a coding Executor, run
      canonical implementation verification, synthesize RESULT/EVIDENCE, or alter publication
      truth.
    - >
      Existing Runtime transport, Unified State, correction preflight, semantic review,
      publication, and historical artifact interpretation remain behaviorally compatible.
      No second lifecycle reducer, Reviewer, publication authority, correction frontier, or
      generic repository writer is introduced.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      One versioned ingress envelope and one repository-provided Human-facing ingest surface
      support exactly AUTHOR_TASK, SUBMIT_REVIEW, AUTHOR_REMEDIATION, and AUTHOR_REPAIR from
      file/stdin delivery, while rejecting unknown operations, extra authority fields, raw
      destination paths/refs, and command-like mutation requests.
  - id: AC2
    condition: >
      AUTHOR_TASK deterministically canonicalizes a valid new/revised TASK through the
      existing TASK contract with exact expected-main and revision continuity, and stale,
      malformed, conflicting, duplicate-different, or unrelated-delta attempts fail closed.
  - id: AC3
    condition: >
      SUBMIT_REVIEW binds one exact canonical RUN candidate and validates the REVIEW through
      existing semantics, creates only the derived metadata decision lineage, and proves that
      REVIEW metadata cannot become implementation-main content through this ingress.
  - id: AC4
    condition: >
      A CHANGES_REQUIRED review ingested through the new boundary becomes observable through
      the existing canonical review-decision/Unified State path without creating a RUN,
      invoking an Executor, or triggering implementation publication.
  - id: AC5
    condition: >
      A valid PASS review ingested through the same boundary remains publication-compatible:
      the existing publication implementation independently validates the canonical decision
      and candidate before any main advance; ingress itself never directly publishes main.
  - id: AC6
    condition: >
      AUTHOR_REMEDIATION binds one exact outstanding finding and AUTHOR_REPAIR binds one exact
      eligible failed RUN using existing validators and derived destinations; stale,
      ambiguous, resolved, non-repairable, mismatched, or conflicting lineage is rejected
      before mutation.
  - id: AC7
    condition: >
      Exact replay of each already-canonicalized operation is idempotent, while same-identity
      different-content or changed-predecessor replay fails closed and cannot overwrite or
      move established canonical control-plane history.
  - id: AC8
    condition: >
      Deterministic tests prove all four ingress families derive their own destinations,
      preserve existing authority separation, and create no arbitrary path/ref/shell/Git
      mutation capability for the Brain payload.
  - id: AC9
    condition: >
      Existing review transport, correction preflight, Unified State, publication, and normal
      execution regressions remain green; no new planner, retry, reroute, lifecycle reducer,
      semantic authority transfer, or implementation-publication bypass is introduced.
  - id: AC10
    condition: >
      README documents the Brain-to-Repo handoff model, the initial file/stdin carrier, exact
      fail-closed/idempotency behavior, and how later ChatGPT/Gemini/Claude or other external
      carriers can reuse the same semantic ingress without gaining generic repository write
      authority.

verification:
  required:
    - python -m pytest tests/test_authoring_ingress.py tests/test_task.py tests/test_review.py tests/test_review_transport.py tests/test_publication.py -q
    - python -m pytest tests/test_operator.py -k "ingress or review or remediation or repair or publication" -q
    - git diff --check
