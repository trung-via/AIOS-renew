non_goals:
- No production opt-in or admission of KA-01 v1.2 policy, G3/G6 completion, hot-path
  cutover, alteration of current minimum-sufficient-v1/V2 execution/decoder/scheduling,
  full VP04/VP05 retirement, alternate Runtime or second scheduler. This bounded scheduler
  core does not yet execute approved proof.
- No K_i/F_i storage, feedback delivery, native Executor continuation, checkpoint
  journal, terminal RESULT/FAILURE writing, correction dispatch/retry/failover, model/profile
  selection, live lease acquisition, cross-RUN extension or replay authority; those
  are later L3 slices and existing Runtime owners.
- No automatic derivation of semantic obligations, dependency impact or approved mappings
  from file diffs/nodeids/commands/model scoring; no omission or weakening of required
  independent broad/integration/parallel/repetition/concurrency/ordering proof.
- No promotion of an L2-03 REUSE_ELIGIBLE label, SHA pin, externally parsed witness
  or review carrier receipt to canonical proof. No fabricated target execution, original
  source subject rewriting, raw/evidence replacement or arbitrary broad base replay.
- No automatic positive REPAIR/REMEDIATION reuse/operation authorization while native
  correction lineage remains unestablished; their operation-specific authorization
  cannot be inherited from PRIMARY or historical Human approval.
- No changes to historical TASK/RUN/RESULT/FAILURE/REVIEW/REPAIR/REMEDIATION, reviewed
  KA-01 v1.2 or frozen Kernel, roadmap, publication, downstream pin, Runner/GitHub
  transport, Reviewer/Publisher or current Human delegation.
constraints:
  hard:
  - Expose a single explicit nondefault Runtime-owned deterministic typed scheduler-plan
    API that produces an immutable versioned closed-schema read-only result. Bind
    the exact current canonical TASK/revision/base, admitted ACTIVE RUN identity/operation,
    committed candidate SHA/tree, independently selected REVIEWed semantic contract/mapping
    and full mandatory obligation population. Strict bounds, canonical encoding and
    stale/ref-race rechecks apply; source-provided/serialized plan cannot reauthenticate
    itself.
  - First candidate C1 must be plan-able from exact authenticated reviewed mandatory
    obligations even with NO prior source EVIDENCE; it must NOT be marked satisfied/reused
    merely because no prior proof exists. A later C_i may reuse only independently
    authenticated eligible actual source proof. No premise that a prior L2-03 witness
    always exists for first-run scheduling.
  - 'For every independently required reviewed obligation, account by stable identity/revision/claim/acceptance/conditions/provenance
    and one explicit conservative state: verified-source REUSE_ELIGIBLE, original
    candidate proof OUTSTANDING_PLANNED (not execution permission), or BLOCKED/UNKNOWN.
    No absent mandatory row, unknown acceptance, caller-added proof, synthetic source
    PASS or fallback scope. Preserve an auditable, closed, deterministic proof-to-obligation/acceptance
    coverage projection.'
  - Deduplicate only actual equivalent proof execution when complete reviewed claim
    plus all distinguishing condition/phase/population/test/fixture/helper/state/toolchain/environment/profile/worker/collection/concurrency/order/integration/repetition/evidence
    schema are soundly equivalent. One proof may cover several approved obligations
    only when the existing reviewed mapping explicitly binds them. No duplicate runtime
    execution units for the same full proof identity, no split/accidental collapse
    of distinct or broad proof, no unreviewed test-subset consolidation.
  - Consume published L2-01/L2-02/L2-03 source/currentness through independently rechecked
    Runtime authority as appropriate; a parsed witness, valid-looking hash, `VALID`
    applicability, raw exit 0 or a clean test claim is insufficient to schedule reuse.
    REUSE_ELIGIBLE must preserve original source RUN/subject/EVIDENCE/raw and prove
    satisfaction, mapping, exact target conditions/currentness. An INVALIDATED proof
    cannot be reused; UNKNOWN, unstable, incomplete, disputed or stale input BLOCKS
    rather than silently becoming PASS.
  - Keep candidate-first ordering as a declared proof plan; no automatic baseline
    collection/materialization or base replay by a FAIL or no source. An independently
    mandatory baseline comparison must be explicitly retained; any planned replay
    must require all BR-1..BR-6 affirmative reviewed basis, exact comparability and
    bounded budget; missing gate yields blocked comparison with no test command/effect.
    A candidate failure cannot erase a distinct mandatory comparison obligation.
  - Candidate checkpoint planning and future terminal planning must share the identical
    authenticated plan owner/coverage identity and source-to-target equality rule;
    an eligible fresh equivalent final checkpoint is eligible for future terminal
    reuse without equivalent duplicate execution. L3-01 only expresses this invariant
    and conservative plan/consumer gate; terminalization, checkpoint sealing and actual
    proof execution remain outside this TASK.
  - 'Scope of positive scheduling must not conflate operation authorities: only independently
    authenticated PRIMARY may reach a positive native path currently supported by
    L2/selection authority. REPAIR requires exact predecessor admitted failed RUN,
    immutable FAILURE and current AUTHOR_REPAIR action/scope/original/affected verification;
    REMEDIATION requires CHANGES_REQUIRED REVIEW/selected still-outstanding finding(s),
    current correction authorization/action/scope, affected verification and DELTA-review
    continuity. Missing native operation-specific attestation returns BLOCKED/NOT_ESTABLISHED,
    not generic primary execution eligibility.'
  - Plan decisions are not a second lifecycle truth, Review verdict, permit-to-execute
    token, code strategy, automation trigger or TASK mutation. The currently admitted
    Runtime later remains solely responsible for executing any scheduled proof, checkpoint
    effects, EVIDENCE and terminalization. L3-01 itself performs NO proof execution,
    authorized modification, model inference or durable writes, and cannot change
    production verification behavior by default.
  - Native isolated real-Git/canonical-shaped test fixtures must prove at least one
    valid reviewed PRIMARY C1 plan (without prior source), authenticated source eligible
    reuse, invalidated & unknown conditions, distinct mandatory integration/concurrency/ordering,
    overlapping reviewed equivalent proof, no equivalent duplicate planned unit, stale/swapped
    review or target, forbidden base replay, correction without current authority,
    and checkpoint-vs-terminal double-execution prevention as a non-effectful plan;
    use real validators, not affirmative mocks.
  - Keep all four modified paths exact and leave existing L2 contracts and legacy
    minimum-sufficient-v1/V2 behavior unchanged; document future L3 execution/checkpoint/feedback/lease/consent
    gates and explicit NOT_ACTIVATED status. Do not alter external proof contract
    semantics, Kernel, GitHub workflow, roadmap or downstream.
acceptance:
- id: AC1
  condition: A single explicit versioned typed scheduler-core request and result provide
    bounded canonical closed-schema plan structure for exact TASK/revision/RUN/operation/base/candidate/subject
    and current reviewed proof mapping/obligation identities; malformed, replayed,
    extra, swapped and oversized structures cannot grant an authorized plan.
- id: AC2
  condition: Scheduler independently authenticates the exact current admitted ACTIVE
    canonical candidate and selected complete reviewed semantic mapping/obligations
    rather than treating caller pins or structural validation as review authority;
    stale, moving or inconsistent input returns blocked without granting proof permission.
- id: AC3
  condition: For a first committed candidate with no prior source evidence, the plan
    correctly preserves every reviewed mandatory obligation as unsatisfied/outstanding
    with exact required coverage; lack of source does not invent REUSE_ELIGIBLE, PASS,
    prior execution or a separate scheduler.
- id: AC4
  condition: For a later candidate with exact still-applicable genuinely satisfactory
    original proof, the scheduler yields source-preserving read-only eligible reuse
    only after independent L2-03 authentication, preserving original subject/EVIDENCE/raw
    and target currentness; a parsed VALID/eligibility witness alone cannot discharge
    the target.
- id: AC5
  condition: Every distinct mandatory obligation and full reviewed semantic coverage
    survives deterministic mapping into at most one matching equivalent planned proof
    unit, with complete per-obligation assignment; no narrow/different worker/order/integration/repetition/fixture
    proof may silently replace a separate required proof or acceptance.
- id: AC6
  condition: Identical fully reviewed equivalent obligation execution is consolidated
    without duplicate planned execution while legitimately distinct full-condition
    proofs remain distinct and outstanding. Executor claims, common nodeids, command
    text or disjoint diffs never establish equivalence.
- id: AC7
  condition: INVALIDATED, incomplete/unstable, raw failure/error, unknown, missing/stale/cross-source/ref-conflicting
    evidence and altered reviewed conditions cannot grant source reuse or acceptance
    PASS; unknown/unsupported operation or authority blocks with a bounded attributable
    reason.
- id: AC8
  condition: The candidate-first plan retains independently authorized baseline comparison
    obligations but never proposes base materialization, collection or execution unless
    every BR-1..BR-6 reviewed necessity/comparability/cost gate is affirmatively established;
    FAIL alone never authorizes reproduction or broad fallback.
- id: AC9
  condition: The same deterministic scheduler core emits checkpoint and terminal consumer
    projections with proof identity/conditions and explicit reuse/no-equivalent-duplicate
    invariant; they assert neither a sealed checkpoint nor an actual execution, and
    cannot trigger duplicate proof through distinct competing schedulers.
- id: AC10
  condition: Operation-specific REPAIR/REMEDIATION requests lacking fully independently
    authenticated predecessor FAIL/REVIEW, unique current correction authorization/action/scope/findings
    and affected verification/DELTA continuity fail closed; no PRIMARY authority inference,
    model selection, correction or workflow delivery is introduced.
- id: AC11
  condition: Real Git and canonical-shaped native authority/fixture conformance covers
    first-candidate and subsequent reuse, exact mapping, completeness, equivalence
    versus distinct proof, changed/unknown proof, BR denial, stale/superseded/correction
    attempts and checkpoint/terminal planning; genuine validators are exercised rather
    than affirmative auth mocks.
- id: AC12
  condition: All changes stay inside four authorized paths, add no proof execution/lifecycle
    mutation/hot-path scheduling/second owner, preserve unchanged L2 and legacy V1/V2
    behavior, and document future L3 core integration and KA-01 G3/G6 remaining NOT_ACTIVATED
    gates.
