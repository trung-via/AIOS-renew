task_id: TASK-388
revision: 1
goal: 'Deliver exactly Lean VP L3-01: one deterministic Runtime-owned prospective
  proof-scheduling CORE for an authenticated, exact, admitted ACTIVE candidate, using
  a complete independently reviewed semantic obligation/mapping population and existing
  L2 source/applicability/reuse facts. Produce a strictly typed, bounded candidate-first
  plan with each required obligation either grouped under one soundly equivalent proof,
  genuinely eligible source-proof reuse, independently authorized distinct outstanding
  proof, or BLOCKED/UNKNOWN; support checkpoint and terminal consumers through this
  same plan identity without executing proof, sealing K/F, or activating KA-01. Retain
  fail-closed PRIMARY/REPAIR/REMEDIATION distinctions.'
problem: Published Lean VP L2-01..L2-03 can authenticate original raw/evidence, judge
  condition applicability and conservatively identify source-proof reuse eligibility,
  but do not supply a complete prospective scheduling plan across reviewed mandatory
  obligations for candidate-first, future checkpoints and finalization. Today historical
  minimum-sufficient-v1/V2 remain the only operational verification paths. Without
  the first bounded single-owner scheduling core, a future L3 consumer might execute
  equivalent tests twice, treat one narrow PASS as full coverage, skip an integration/ordering/worker
  purpose, schedule base replay on raw FAIL, or rely on untrusted calls to L2 read-only
  APIs as execution permission.
assumptions:
- "Exact Human/Brain '\u0110\xE3 publish, ti\u1EBFp t\u1EE5c' selects the next original\
  \ Lean VP L3-01 slot under the uniquely active Lean VP high-level NEXT; canonical\
  \ planning reconciliation commit ab33d23e4b529449f6c427e4439707c46057254a supersedes\
  \ the previous L2-03 slice bookmark prospectively. This authoring decision does\
  \ not infer Executor delegation or production activation."
- "TASK-387 r1 RUN-387-001 failed verification, exact REPAIR authorization REPAIR-387-001\
  \ SHA a34d16c99291587bab608fb61e14dd2ac88d9913 admitted successor RUN-387-002. Runtime\
  \ EVIDENCE RUN-387-002-V001 exit 0; independent REVIEW-387-001 PRIMARY PASS AC1\u2013\
  AC12, review-decision SHA ed1c47e3f77c8e8e2104308baa6794f04545ed79; exact candidate\
  \ f2b79b6f10ffddaa2729941cc3004a8b60d9d8de was published and equals main immediately\
  \ before planning reconciliation. Engineering truth remains exact Runtime lineage."
- Published KA-01 prospective amendment v1.2 covers separately opted-in ACTIVE PRIMARY,
  REPAIR and REMEDIATION under exact unique operation authority, live leased same
  Executor, finite Human guardrails and one Runtime-owned scheduler. Its activation
  flag remains NOT_ACTIVATED; D.1 G3/G6 are outstanding. No production checkpoint/correction
  consent is granted by L3-01.
- Published L2-01 original source observation, L2-02 source-to-target applicability,
  and L2-03 observe_proof_reuse are explicitly read-only, authenticated and never
  target execution authority. L2-03 has a supported positive PRIMARY reuse path; correction-operation
  positive reuse is deliberately NOT_ESTABLISHED/BLOCKED until independent native
  correction lineage becomes available. A first committed candidate may have no preceding
  source proof and still needs authorized original candidate proof planning.
- Canonical L1 reviewed semantic coverage/mapping and selection authority exists in
  the existing proof_coverage_contract/review_transport paths. It must be authenticated
  for each exact TASK/RUN/candidate and may not be selected from structural digests,
  legacy fixture labels or caller-supplied mapping validity. Existing proof equivalence
