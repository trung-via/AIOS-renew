task_id: TASK-112
revision: 1

goal: >
  Implement GAP-D / A9 Phase 1 as one bounded Human remediation-intent surface that
  coalesces the already-existing A3 exact Human approval and A6 approved REMEDIATION
  wakeup into one attributable Human interaction for one already-authored canonical
  REMEDIATION. Preserve A3 approval and A6 correction dispatch as distinct deterministic
  authority/state boundaries, preserve explicit Executor choice for coding remediation,
  and make identical delivery replay across supported carriers side-effect free so a
  transport failure or courier retry never requires a second semantic Human approval.

problem: >
  Current REMEDIATION continuation requires two Human delivery actions for one correction
  intent: first A3 records exact SHA-bound approval with remote-approve, then A6 separately
  receives correction_dispatch_id plus source RUN, finding, and Executor to wake the
  approved correction. TASK-110 live remediation exposed this friction directly: Human
  approval of F1 and Antigravity intent still required separate local commands before
  RUN-110-002 could execute. A second transport incident then showed ChatGPT GitHub
  create_issue can be blocked by OpenAI host safety checks before GitHub, with no GitHub
  403/OAuth/repository error and no AIOS invocation. Transport availability therefore
  cannot be treated as semantic approval authority. AIOS needs a low-risk zero-touch lane
  where one explicit Human correction intent can durably record the exact current A3
  approval and continue through existing A6 exactly once, while the same immutable intent
  can be replayed through an alternate bounded carrier without asking the Human to approve
  the same correction again.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-112 authoring is
    b129ff0d9e1bc7d5f3a3599917e0e77a58ebd9ba, the semantically reviewed and published
    TASK-110 correction candidate. TASK-110 implementation/publication is PASS; its live
    Brain-host GAP-A replay probe remains WAITING because ChatGPT create_issue was blocked
    before GitHub received the carrier event.
  - >
    TASK-074 remains authoritative for A3: approval is Human authorization bound to one
    exact source RUN/TASK revision/REVIEW/finding/action/reviewed_sha/remediation ref and
    remediation commit SHA, is idempotent for the same immutable lineage, becomes stale
    when that remediation SHA changes, and performs no execution.
  - >
    TASK-084 remains authoritative for A6: one exact current A3 approval plus stable
    correction_dispatch_id, source_run_id, finding_id, and explicit codex/antigravity
    Executor can delegate at most once into the existing canonical REMEDIATION path.
    A6 correction-dispatch state is operational-only and preserves exact RUN attribution,
    collision rejection, crash safety, Runtime verification, DELTA review, and publication
    separation.
  - >
    The explicit Human sentence or UI action that approves one exact current remediation
    and selects one Executor is sufficient Human intent for both existing deterministic
    steps. Coalescing the interaction must not erase either underlying authority boundary
    or infer approval when no explicit Human event exists.
  - >
    TASK-111 revision 1 is authored but unexecuted. It addresses the separate FAILURE-to-
    REPAIR wakeup family and must remain waiting during TASK-112. After TASK-112 publication
    Brain must re-sync TASK-111 before execution because shared Human/transport assumptions
    may need revision; TASK-112 grants no REPAIR authority.

