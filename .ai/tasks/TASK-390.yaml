task_id: TASK-390
revision: 1
goal: 'Deliver only Lean VP L3-03: an explicitly invoked, bounded, prospective Runtime-owned
  F_i factual-feedback preparation for the exact latest immutable L3-02 K_i of one
  admitted ACTIVE RUN. Independently authenticate the complete stable native current-candidate
  failed proof and original reviewed obligations, bind a single immutable factual
  feedback record to its exact TASK/RUN/candidate/checkpoint/evidence and operation-specific
  authority, and make exact duplicate preparation idempotent. Keep delivery, actual
  live same-Executor lease/continuation, policy consent, budgets, dispatch, correction
  strategy, terminal decisions and production activation outside this slice. No new
  scheduler, workflow router, lifecycle or storage owner.'
problem: Published TASK-389 L3-02 seals actual native proof into immutable monotonic
  K_i and supports same-RUN terminal proof reuse, but has no Runtime-authenticated
  factual F_i producer. Historical pure intra_run_proof_contract Feedback declarations
  are parser data, not native authority. Without one bounded F_i producer, future
  L3-04 delivery/continuation could misread raw pytest nonzero or unknown/ERROR as
  actionable candidate FAIL, trust caller-generated instructions/log text, lose the
  original failed evidence/semantic scope, duplicate effects after replay, or inherit
  PRIMARY-shaped permission for REPAIR/REMEDIATION. This task prepares a trustworthy
  inert factual handoff, not an execution/continuation permit.
assumptions:
- Human expressly requested continued Lean VP roadmap after confirmed TASK-389 publication
  and a bounded audit of the next eight original slots. Canonical planning-only reconciliation
  on main at b56e0560ce6def843b1b6624c2a98012a7ff7e30 chooses L3_03_BOUNDED_FACTUAL_CHECKPOINT_FEEDBACK
  as the subordinate NEXT of the sole Lean VP high-level commitment, without automatic
  Executor delegation or G3/G6 activation.
- Published TASK-389 r1 RUN-389-005 canonical verification EVIDENCE RUN-389-005-V001
  exit 0, independent REVIEW-389-002 PRIMARY PASS AC1-AC12 decision a506d2de5293c4eedc91bda480a2fb90c21974d3
  and exact reviewed source e25f5091505e812324579f0d17ad1566319dc1e9 included on main
  before planning reconciliation. The later local-chat-wake transport job failed but
  the independent Publisher job succeeded; this does not change engineering publication
  truth.
- Published L3-01 plan_candidate_proofs authenticates reviewed semantic mapping but
  has no execution permission. L3-02 RuntimeCompletion.seal_checkpoint, _authenticate_checkpoint,
  terminal_reuse and existing Runtime effect/record owner authenticate actual native
  proof and one terminal; L3-02's positive native checkpoint path is PRIMARY-only.
  Reuse those authority boundaries; a copied K_i blob, parser-valid declaration, raw
  exit status or executor claim cannot authorize F_i.
- Published separate TASK-386 prospective KA-01 v1.2 covers future separately opted-in
  ACTIVE PRIMARY, REPAIR and REMEDIATION, each requiring original operation authorization,
  same leased current-RUN Executor and finite Human consent; v1.2 remains NOT_ACTIVATED,
  with G3 focused integrated safety proof and G6 exact per-RUN opt-in outstanding.
  For any correction operation whose native authority is not independently authenticated
  in this slice, F_i preparation must remain BLOCKED, not silently infer PRIMARY rights.
- 'The original 16 Lean VP slots are retained: L3-03 makes trustworthy factual preparation,
  L3-04 owns real delivery/current-RUN lease/consumption and continuation guards,
  L3-05 owns production consent/finite budgets/rollback, L3-06 owns G3 integrated
  focused safety proof, and G6 then L4 stay distinct. Neither this TASK nor its acceptance
  criteria assert completion of downstream slices or whole-episode speedups.'
- Exactly one admitted Executor owns HOW only after separate Human model/effort delegation.
  Human standing route for new AIOS-renew TASKs remains LEGACY_REPOSITORY_DEFAULT_ROUTE
  unless separately changed; this route does not count as origin-affine conformance.
- Canonical selected TASK_AUTHORING audit is tca-1 version 1 digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2.
  Brain completed its CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE passes on this
  exact Task/consumers and reconciled false PASS, prompt-injection, unauthorized correction
  and PROOF_LATER acceptance risks. All twelve final implementation ACs are CLAIM_NOW;
  Runtime verification, independent review, publication, G3 and G6 are explicitly
  PROOF_LATER external boundaries.
- New TASK uses minimum-sufficient-v1 targeted verification. No full suite, new service,
  database, generic retry, unapproved correction or new lifecycle authority is requested.
