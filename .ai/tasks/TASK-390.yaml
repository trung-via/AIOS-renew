non_goals:
- No G3 or G6 production activation, future RUN opt-in, new proof scheduler, new canonical
  proof execution, mandatory legacy verification changes, terminal-transport mutation,
  live hot-path cutover, or reinterpretation of frozen Kernel or immutable V1/V2 historical
  TASK/RUN/EVIDENCE/RESULT/FAILURE.
- No dispatch/wakeup/retry, live delivery acknowledgment, Executor reentry or C_(i+1)
  mutation; L3-04 owns actual same-RUN leased Executor continuation and feedback consumption,
  L3-05 owns finite admission budgets/Human consent/withdrawal. A prepared F_i is
  not a permission slip.
- No new Reviewer, Publisher, Runtime, storage authority, generic lifecycle router,
  proof policy, model-selected HOW, semantic correction strategy or automatic repair/remediation.
  F_i contains no patch plan, test modification request, runnable command or untrusted
  raw log instructions.
- No affirmative REPAIR or REMEDIATION F_i through PRIMARY-shaped evidence or merely
  claimed predecessor/finding/authorization; correction-specific native source and
  currentness must independently validate or BLOCK.
- No assertion that raw nonzero, FAILED collection/fixture, unstable/flaky proof,
  partial mandatory mapping, UNKNOWN or ERROR is a decisive code failure. No optional
  broad base replay or test weakening for convenience.
- No unrelated workflow, roadmap, task authoring, transport/Pubisher or downstream
  pin edits, no synthetic speedup/production AC-01..AC-36 conformance or implicit
  multi-RUN enrollment.
constraints:
  hard:
  - Keep F_i preparation an explicit nondefault operation of the SAME existing RuntimeCompletion
    owner; authenticate current admitted ACTIVE TASK/RUN/operation/base, latest exact
    K_i content/digest/history/current candidate, complete reviewed semantic obligations
    and original actual native EVIDENCE/raw/observer facts by independently reusing
    the L3-02 authority checks. An untrusted parsed checkpoint, copied digest or caller
    outcome does not grant production or feedback authority.
  - Only complete, stable, decisive native FAIL for an approved current candidate
    proof can supply a positive candidate-failure feedback item. Full original mapped
    obligation/acceptance population must remain visible, including unaffected PASS
    and outstanding FAIL/ERROR/UNKNOWN; no partial selected-green, raw exit-only inference
    or comparison/base failure can generate an actionable code-failure diagnosis.
    ERROR/UNKNOWN/unstable/partial/conflicting observations have safe bounded non-actionable
    outcomes without authorizing continuation.
  - Use a closed, bounded, deterministic factual F_i record with exact TASK revision/RUN,
    operation/authorization identity, committed candidate SHA/tree, checkpoint ordinal/predecessor/current
    digest, original individual proof/obligation/acceptance identities, typed outcome/completeness/stability,
    evidence ID/source subject/raw digest/locator, and only authenticated resource/currentness
    facts actually known. Keep original raw subjects intact. Absence of live lease
    or Human budget remains explicitly NOT_ESTABLISHED, never copied or inferred.
  - Any field exposed outside Runtime may carry only typed facts and minimal authorized
    references; no raw log content or instruction/prompt injection, implementation
    suggestion, command text, patch, executor/model choice, funding/delegation or
    feedback-implied semantic judgment. Enforce size/count/depth and privacy bounds;
    caller-provided extra fields, hashes, pseudo-permissions, log directions and mixed
    stages fail closed.
  - 'The F_i producer must bind only the latest K_i and the current RUN''s originally
    admitted Executor identity as immutable destination context, not a newly selected
    Executor. Actual same-live-lease authentication, single-consumption ACK and dispatch
    are still outstanding L3-04/L3-05: no returned message may assert SENT, DELIVERED,
    CONSUMED, CONTINUATION_ELIGIBLE or permit C2.'
  - Durable subordinate F_i preparation must use existing per-RUN Runtime protected
    storage/fence and strict exclusive immutable write, currentness and replay rules;
    exact duplicate returns identical original bytes and identity without another
    resource effect, while altered same-ID/ordinal/content, gaps, stale K_i, unknown
    interrupted writes, terminalization/competing writer and changed evidence fail
    closed. No second persistent state index, mutable ledger or deletion/recovery
    trick.
  - Positive REPAIR/REMEDIATION feedback requires independently verified operation-specific
    predecessor FAILURE/REVIEW, unique current AUTHOR_REPAIR/AUTHOR_REMEDIATION scope/action/finding(s),
    correct original and affected proof, review continuity and sticky own-run source;
    if this native support is not within the bounded L3-03 implementation, explicitly
    BLOCK those positive cases for future lawful L3 integration. Original PRIMARY
    data cannot be inherited.
  - Verification must use real Git/native RUN-checkpoint-proof observations and exercise
    determinism, exact replay, unauthenticated/tampered/partial/unstable/ERROR proof,
    changed raw/observer/semantic mapping, wrong Executor/RUN/operation, stale currentness,
    terminal reentry, concurrent/collision/ambiguous writes and absent correction
    authority. Mocking a validator's affirmative answer must not be the only positive
    basis.
  - Keep KA-01 v1.2 NOT_ACTIVATED, historical minimum-sufficient-v1 and v2 current
    paths unchanged, Review/Publisher/roadmap separate and original L3-02 K_i and
    terminal proof boundaries intact. No change to work outside exactly authorized
    four modify paths.
acceptance:
- id: AC1
  condition: An explicitly invoked prospective Runtime factual-feedback request/result
    has a strict versioned closed bounded schema and is owned only by the current
    existing RuntimeCompletion for the exact admitted ACTIVE RUN and latest K_i; parsed
    projections or caller-supplied PASS/FAIL are not accepted as authority.
- id: AC2
  condition: The producer freshly authenticates current native TASK/RUN/base/operation,
    committed candidate SHA/tree, latest ordinal/K_i predecessor history, L3-01 reviewed
    complete proof mapping, and original L3-02 evidence/raw/observation; stale, substituted
    or unavailable roots reject before a feedback effect.
- id: AC3
  condition: Positive PRIMARY feedback is generated only from an authenticated decisive
    complete stable native candidate proof FAIL with matching original mandatory obligation/acceptance
    population; raw pytest nonzero, narrow failing nodeid, noncandidate/base comparison,
    incomplete, unstable or contradictory observations cannot authorize an actionable
    failed-proof feedback.
- id: AC4
  condition: Feedback faithfully preserves per-obligation factual PASS/FAIL/ERROR/UNKNOWN
    visibility, original proof/evidence/source subject/raw digest identity, exact
    affected/outstanding acceptance, and distinguishable stable versus unresolved
    outcomes; no missing mandatory integration, worker, ordering or repetition obligation
    can be relabeled satisfactory.
- id: AC5
  condition: The returned F_i is factual, typed, bounded and privacy-safe, with no
    raw log instructions, patch proposal, implementation strategy, code-edit instruction,
    test weakening, added command, auto repair selection or self-declared evidence/consent
    accepted into its schema.
- id: AC6
  condition: Feedback identity binds exact TASK/revision/RUN/operation/candidate/checkpoint
    digest, current admitted Executor identity as destination context and existing
    source authorization without asserting a live lease; its inspection fields explicitly
    deny dispatch, delivery, ACK consumption, C2 admission and production activation.
- id: AC7
  condition: Exactly identical preparation/replay of the current F_i reconciles the
    original persisted immutable subordinate record with no new proof execution, appended
    effect, ordinal, duplicated resource debit or changed bytes; collision, duplicate
    identity with altered content and stale K_i fail closed.
- id: AC8
  condition: Before any F_i effect, Runtime checks no terminal RESULT/FAILURE, no
    conflicting checkpoint/terminal effect, no unresolved fence and no competing writer;
    crash/partial write, unreadable retained state or later terminalization never
    resurrects a RUN, replace a previous feedback or silently authorize another attempt.
- id: AC9
  condition: REPAIR and REMEDIATION F_i cannot be positively prepared from PRIMARY-shaped
    witnesses or caller-labeled failure/finding/authorization. Without independently
    authenticated native correction predecessor, current authorization/scope/finding
    and affected verification, each yields explicit bounded BLOCKED/NOT_ESTABLISHED.
- id: AC10
  condition: No prepared feedback grants continuation permission or selects Executor/HOW,
    correction strategy, policy, verification scope, new Human risk/budget acceptance
    or another RUN; current admitted completion/terminal ownership and exact original
    scope remain unchanged.
- id: AC11
  condition: Focused real-Git and native checkpoint/evidence tests cover positive
    stable PRIMARY FAIL, unchanged happy-case PASS (no actionable failed-proof feedback),
    duplicate and changed feedback, corrupted raw/proof/observer, ERROR/UNKNOWN/flaky,
    forged/cross-run/correction authority, terminal competition and crash/unknown
    effect, without affirmative authority mocks.
- id: AC12
  condition: All implementation changes stay within the four approved modify paths,
    preserve L3-01/L3-02 native proof and legacy V1/V2 verification behavior, document
    the unactivated F_i seam and explicit L3-04/L3-05/L3-06/G3/G6/L4 obligations,
    and add no generic scheduler/router/DB/Reviewer/Publisher or workflow mutation.
