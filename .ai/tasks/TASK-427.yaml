    original module from control-process/import-identity mismatch using the actual
    pinned self-host control entry and protected-scope TASK-431 admission path; it
    preserves immutable negative TASK-426 trace and exposes only safe bounded diagnostic
    reasons.
- id: AC2
  condition: The corrected first-party control/bootstrap path authentically establishes
    the complete required original module population and stable source/spec/process
    binding through protected pre-RUN admission, without loading the editable subject
    or arbitrary user-site content as original code.
- id: AC3
  condition: At least one realistic positive regression drives the actual control-entry
    path through the complete original protected PRIMARY admission preconditions for
    a TASK-431-shaped source, showing it no longer fails with KA01_V13_KERNEL_UPGRADE_ORIGINAL_RUNTIME_UNAVAILABLE
