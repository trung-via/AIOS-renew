task_id: TASK-427
revision: 1
goal: Provide an authenticated, reusable KA01 v1.3 Kernel self-upgrade execution path
  that lets an authorized coding TASK change Runtime/proof-consumer implementation
  files without the present unconditional pre-Executor NATIVE_BOUND_PROOF_CONSUMER_MUTATION_UNSUPPORTED
  stop, while keeping verification and proof independent of the candidate being modified.
  Make the capability usable by the already selected existing AIOS execution workflow
  without another unrelated activation package, so TASK-426 can resume under its own
  immutable lineage after eligible publication.
problem: At exact canonical main ebe3c4e930732f5ec001681f3b27a6fadb7864cf, TASK-426
  r1 requires modifying src/aios_renew/runtime.py, operator.py, ka01_admission.py
  and related native proof consumers. RUN-426-001 terminal FAILURE 5dc493b72ee4fd3a6e29f1e355c019536a7a1e34
  and REPAIR RUN-426-002 terminal FAILURE 12fd23186d3dcf427e0f601ced698351a52daacd
  both stop at COMPLETION_GATE before Codex invocation or verification. Live execute-repair
  traceback identifies RuntimeCompletion._preflight_interactive_policy rejecting DEFAULT_IMPLEMENTATION_PATHS
  intersection with the authorized mutation scope using KA01_V13_NATIVE_BOUND_PROOF_CONSUMER_MUTATION_UNSUPPORTED.
  The existing task/repair self-host paths unconditionally enter KA01 default, so
  a new Kernel-upgrade TASK dispatched unchanged would fail the same preflight. Human
  selects one narrowly scoped TASK to resolve this bootstrap conflict and Codex GPT-6.1
  Sol Max for execution, not a repeat repair or an unsafe global verifier bypass.
assumptions:
- Exactly observed main is ebe3c4e930732f5ec001681f3b27a6fadb7864cf; Runtime must
  reauthenticate current main and exact TASK on authoring and execution. TASK-427
  is a new prospective Human-selected priority, not retroactive repair, PASS, or review
  of RUN-426-001/002.
- The original self-host wake path currently has no authenticated user-visible selector
  for a safe KA01 exception. A normal default wake for this TASK cannot be counted
  as proof of executability. Admission/bootstrapping must be independently resolved
  before starting coding.
- Existing historical explicit KA01 version-2/3 AdmissionRequest requires independent
  original Human selection/consent and is not a general-purpose exception, nor inferred
  from this TASK. Executor and Runtime determine lawful supported operation from authenticated
  canonical state; do not invent credentials.
- All changes to verifier or observer-dependent files must be verified against trusted
  original source under original Runtime ownership. Work on the verifier cannot certify
  itself merely because test output is positive.
- User approved one task and selected Codex gpt-6.1-sol max. Runtime retains exact
  execution profile and task/lease/currentness authority, independent review and publication.
