non_goals:
- No unconditional disable/remove of the protected proof-consumer guard, no reliance
  on edited candidate verifier code to authenticate its own proof.
- No new generic lifecycle router, alternate Planner, second Runtime or verifier,
  database, separate publishing authority or side-channel executor selection.
- No rewriting TASK-426, its two terminal FAILURE artifacts or historical TASK-423/424/425
  and typed admission semantics.
- No automatic retry of any terminal RUN, new repair without Human authorization,
  extra pilot/shadow/full-suite requirement, or downstream adoption.
constraints:
  hard:
  - Preserve frozen Kernel, Constitution, Human/Brain/Executor/Runtime/Reviewer/Publisher
    separation; prospective KA01 policy change only after exact verified Reviewed
    PASS publication.
  - First determine and use a lawful bootstrap that actually reaches the Executor
    despite currently installed preflight; a normal default TASK wake is known blocked.
    No claimed success from an ingress, workflow dispatch, or transport receipt.
  - Use original independently authenticated canonical source for Runtime-owned verification
    and native proof consumers. Bind task/operation, current main/source, scope, lease,
    selected profile and candidate SHA; reject forged, moved, unauthorized or self-attesting
    evidence.
  - Preserve original KA01 default three-flow behavior and 2 correction / 3 checkpoint
    / 240m RUN / 180m cumulative verification defaults for supported non-upgrade cases,
    with historical policy decoding unchanged.
  - Bounded safety rejection remains on missing/malformed/stale/conflicting original
    authority, candidate code substitution or source/observer mismatch; failure must
    remain a typed cause rather than silent legacy fallthrough.
  - Return the exact eligible published implementation to the existing task flow;
    TASK-426 may only resume via its own new lawful REPAIR authorization based on
    canonical failed RUN, not inherited from TASK-427.
  - Minimum-sufficient Runtime verification only; do not add full suite or repeated
    unchanged proof merely to exercise workflow.
acceptance:
- id: AC1
  condition: KA01 distinguishes an authentically admitted Kernel/proof-consumer upgrade
    from ordinary coding scope, avoiding the unconditional filename-only preflight
    denial for the authorized upgrade while retaining negative denial for unauthorized
    proof-consumer mutation.
- id: AC2
  condition: The supported self-host PRIMARY entry for this class authenticates an
    executable bootstrap path before Executor invocation and does not just create
    terminal failure due to reentering the known KA01 default preflight; missing bootstrap
    evidence produces a precise pre-RUN refusal rather than an avoidable new FAILED
    RUN.
- id: AC3
  condition: All upgrade candidate verification, observer/toolchain and source proof
    derive from original trusted Runtime/control implementation and authenticated
    pre-candidate identities, never from edited candidate proof consumers or Executor-declared
    PASS.
- id: AC4
  condition: Authorized upgrade runs retain exact original TASK, SHA, profile, lease,
    mutation scope and bounded resource/terminal authority, with no provider replacement
    or unadmitted continuation.
- id: AC5
  condition: Existing ordinary PRIMARY, REPAIR, REMEDIATION native same-RUN Verify/Fix/Verify
    paths and historical KA01 modes preserve their prior authorization, stop criteria
    and bounded correction semantics.
- id: AC6
  condition: New focused regression cases reproduce the TASK-426 protected scope conflict,
    exercise lawful upgraded admission/implementation, and deny forged/wrong-source/cross-RUN/unauthorized
    verifier mutation before any false canonical PASS.
- id: AC7
  condition: Prospective KA01 contract and roadmap identify the new authorized upgrade
    behavior and preserve all earlier TASK-426 FAILURE, original preflight constraints
    for unaffected work and Human-only roadmap movement, with no unrelated activation
    or pilot package.
- id: AC8
  condition: The authoring/dispatch/wake and source-binding consumer regression cases
    demonstrate that a rejected bootstrap reports the exact blocker and that a lawful
    upgrade implementation can return to standard Runtime completion/review/publication
    eligibility without secondary verification owner.
