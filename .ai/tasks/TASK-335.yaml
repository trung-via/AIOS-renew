task_id: TASK-335
revision: 1
goal: Deliver a bounded prospective VP-03D owner-bound provenance bridge anchored
  in the existing admitted Runtime/operator path and separately authenticated SUBMIT_REVIEW
  ingress path. Establish immutable task/run/execution-profile/continuation and review-decision
  origin facts at the actual owner boundaries, and pass their read-only provenance
  to downstream Runtime/VP-03D as subordinate, in-process and/or already-authorized
  operational observations. Missing origin, authenticated ingress actor, terminal/source
  identity or independent currentness must be clearly UNKNOWN/BLOCK. Do not mint new
  source authority, alter the immutable canonical Kernel contracts, create public
  raw exports or activate proof reuse. This prerequisite will unblock a separately
  authorized bounded repair of failed TASK-334 only after independent Runtime verification,
  semantic review and exact publication.
problem: Canonical RUN-334-001 ended with FAILURE because TASK-334's five-file scope
  could capture only CONDITIONAL_CONTENT_ONLY metadata. `RuntimeCompletion` receives
  publicly constructible Task/Run/Path values without the protected admitted owner,
  approved profile and continuation authorization; the independent SUBMIT_REVIEW ingress
  decision is similarly not exposed to prospective provenance consumers as an owner-origin
  event. Git refs, REVIEW bytes, local constructor/fixture values and configured remotes
  are not independent provenance. Existing `operator.py`, authorized GitHub Issue
  ingress, and `authoring_ingress.py` already enforce the relevant distinct boundaries
  but did not expose a bounded, owner-origin bridge.
assumptions:
- Fresh canonical planning main after approved priority revision is ddd48e2f587ce81c7a1b66fdb64750eb2e707dcd;
  VP-03 is unique effective NEXT and TASK-335 r1 is the authorized bounded owner-provenance
  prerequisite. AUTHOR_TASK and PRIMARY retain fresh CAS/TASK-blob/currentness rules.
- RUN-334-001 canonical FAILURE from artifact commit 7179c1eb16bbb2b97d1ddbe389ec41925c4ceb3d,
  failed candidate 321227b18fe67eff43547ee620d9d7b3ac50e3ec; existing RUN-333-001
  failure artifact commit 53230d3eeac098a9350ce99669877b51623006e4 and candidate af16ec63c8700b9f7411434d338f044300392b86.
  Both immutable, no REPAIR/RESULT/PASS was authorized or fabricated.
- New TASK-335 Executor/model/effort is UNASSIGNED. Previous explicit Codex gpt-6.1-sol
  xhigh selections are sticky to TASK-333/TASK-334 alone. Human must separately select
  TASK-335 Executor before PRIMARY. TASK contract is independent of Executor identity.
- Current `operator.py` is the primary/repair/remediation/direct-candidate owner and
  owns relevant task admission, RUN reservation, execution profile, lease/continuation
  and runtime handoff; existing `github_issue_ingress.py` and `authoring_ingress.py`
  enforce authorized carrier-origin and SUBMIT_REVIEW lineage. Normal direct/local
  ingress paths may lack authenticated external-origin provenance and must not gain
  a false credential.
- Canonical repository is public. Protected raw verification bytes and secrets cannot
  be sent to public GitHub refs. TASK-334's safe metadata capture remains only on
  immutable failed candidate, not main; TASK-335 must not import it as active code
  or publish that failed candidate.
- Existing Runtime/Reviewer/Publisher own distinct state transitions. VP-01 DEFERRED_NOT_WAIVED;
  VP-02/VP-03 exit not established; KA-01 NOT_ACTIVATED, VP-04/VP-05/VP-07 and production
  proof reuse not authorized. Current authored verification policy remains minimum-sufficient-v2.
