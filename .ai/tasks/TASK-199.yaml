task_id: TASK-199
revision: 2

goal: >
  Implement the generic source-control legacy-bootstrap protocol needed by BP-9 while
  keeping its production activation closed until a later exact reviewed target SHA is
  known. The new protocol must let a future exact admission source transfer one durable
  authority edge to an exact migration-capable target that already contains the protocol,
  and let that target execute one exact authorized downstream migration TASK from the
  unchanged source-control commit through the existing PRIMARY Runtime. Do not activate
  Python Agent migration in this TASK.

problem: >
  Revision 1 correctly identified the pre-existing target-control paradox in TASK-198,
  but second-pass Brain audit found a bootstrapping flaw: the currently fixed bootstrap
  target 83115b26df85a7ad6643f317833e18b18586bdbe predates this new source-control
  protocol and therefore cannot consume a new handoff shape. Updating only the admission
  side would create a protocol the exact target cannot understand. A safe bootstrap
  requires two stages: this TASK publishes the generic consumer-capable protocol with
  production activation disabled; a separate successor, authored only after this exact
  source is reviewed and published, may bind that published SHA as the one allowed target.
  This preserves target non-self-authorization and avoids self-referential SHA policy.

assumptions:
  - >
    Canonical AIOS-renew main at r2 authoring is
    61130727e0693eac968dc1fb057096d185152620, containing only TASK-199 r1 authoring
    on top of exact published TASK-198 source.
  - >
    TASK-197 and TASK-198 remain reviewed/source-published history and their existing
    migrate-primary / bootstrap-primary behavior must remain compatible.
  - >
    The exact SHA produced by this TASK cannot be known until independent review and
    publication, so this TASK cannot truthfully authorize itself as the production
    source-control-bootstrap target.
  - >
    BP-9 downstream adoption remains the roadmap NEXT. Python Agent TASK-255 r4 is
    authored but unexecuted and must not be invoked while this prerequisite remains open.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-197.yaml
    - .ai/tasks/TASK-198.yaml
    - .ai/tasks/TASK-199.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/task.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - docs/AIOS-BRAIN-PORTABILITY.md

non_goals:
  - >
    Activate any downstream migration, modify Python Agent, change a downstream pin,
    execute TASK-255, or advance roadmap planning.
  - >
    Change the existing TASK-198 fixed target-control bootstrap target
    83115b26df85a7ad6643f317833e18b18586bdbe or reinterpret its historical semantics.
  - >
    Author the later activation SHA inside this TASK, infer it from mutable main/latest,
    or let the new target source authorize itself.
  - >
    Create a second Runtime, lifecycle reducer, migration daemon, Planner, Reviewer,
    Publisher, retry/fallback/failover authority, provider selector or downstream-specific
    migration implementation.
  - >
    Rewrite frozen Kernel artifacts or historical lineage.

constraints:
  hard:
    - >
      Add a distinct versioned source-control legacy-bootstrap intent/handoff shape;
      do not weaken or overload TASK-197 migration intent v1. It must bind exact legacy
      installed generation, exact prospective target generation/source URL, repository,
      exact clean attached source-control SHA, exact source pin blob naming the legacy
      generation, exact TASK id/revision/blob/authorization commit and selected Executor.
    - >
      Add target-side consumption/execution support in the same published operator source
      so a later exact target carrying this code can validate the durable handoff and invoke
      existing run_task exactly once with synchronize=False against the exact source-control
      SHA and TASK identity.
    - >
      Production admission for this new source-control shape must remain CLOSED in this
      TASK. Use one explicit fail-closed activation datum/allowlist slot whose default
      state authorizes no source-control-bootstrap target. Tests may inject/monkeypatch
      an exact target solely to exercise deterministic protocol semantics.
    - >
      The existing TASK-198 bootstrap-primary target-control path and fixed
      _BOOTSTRAP_TARGET_SHA behavior remain unchanged and fully regression-tested.
    - >
      A later activation source must be able to bind exactly one reviewed/published target
      SHA that already contains this r2 consumer capability. The target consumer must not
      itself decide whether its own SHA is approved; it only validates that the exact durable
      handoff names its running source.
    - >
      Legacy identity remains independently attested through the actually imported installed
      distribution in an isolated interpreter. Synchronized/target source cannot attest the
      legacy generation.
    - >
      Before a future authority edge, validate clean attached main, unambiguous upstream,
      exact source-control SHA, exact source pin blob and unchanged exact TASK artifact.
      No future target-control or target-pin commit is required for this new shape.
    - >
      After a valid edge, only the exact target source named by the handoff may consume it.
      It reuses canonical PRIMARY run_task, verification, RESULT/FAILURE, transport and
      lifecycle reduction; bootstrap code creates no duplicate RUN or verification path.
    - >
      Re-entry/interruption/replay must reconcile at most one matching RUN; active RUN means
      no reinvocation, terminal state closes the handoff, and completed/stale/mismatched/
      ambiguous state fails closed without a second Executor call.
    - >
      Pre-edge rejection/failure creates no RUN/FAILURE and no Executor invocation.
    - >
      Preserve repository neutrality, Windows path-budget/read-only cleanup protections and
      existing TASK-197/TASK-198 handoff compatibility.
    - >
      Production mutation is limited to operator.py. If another production module or frozen
      Kernel change is required, stop unresolved.
    - >
      Documentation must explicitly state that this TASK publishes capability only and that
      a separate post-publication activation TASK is mandatory before BP-9 can consume it.
    - >
      Executor returns one clean candidate with zero unresolved implementation items and does
      not review, publish, activate the protocol, mutate roadmap state or execute downstream work.

acceptance:
  - id: AC1
    condition: >
      A versioned source-control legacy-bootstrap handoff can be deterministically staged and
      consumed in tests without any pre-existing target-control/pin commit, while binding exact
      legacy/source-control/pin/TASK/Executor/target identities.
  - id: AC2
    condition: >
      Target-side code validates the exact durable handoff and exact running target source,
      then delegates one exact TASK execution to existing run_task with no second Runtime.
  - id: AC3
    condition: >
      Production admission for the new shape is provably disabled by default; current source
      cannot self-authorize and the historical 83115b26 TASK-198 target-control bootstrap path
      remains unchanged.
  - id: AC4
    condition: >
      Active, terminal, interrupted, replayed, stale and mismatched states reconcile or fail
      closed with at most one RUN and one Executor invocation.
  - id: AC5
    condition: >
      Pre-edge failures invoke no Executor and create no fabricated engineering lifecycle state.
  - id: AC6
    condition: >
      Ordinary migrate-primary and existing bootstrap-primary regression behavior remains green,
      including Windows path budget and cleanup.
  - id: AC7
    condition: >
      Tests cover source-control identity/pin/TASK binding, target-source mismatch, closed
      production activation, injected exact activation, dirty/detached/upstream ambiguity,
      replay/reentry and no-duplicate execution.
  - id: AC8
    condition: >
      Brain Portability documentation records the required two-stage bootstrap: capability
      publication first, exact reviewed-SHA activation second, then explicit BP-9 downstream
      adoption; no downstream is claimed migrated by this TASK.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check