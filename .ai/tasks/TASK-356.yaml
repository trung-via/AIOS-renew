task_id: TASK-356
revision: 1
goal: "Restore existing minimum-sufficient-v1 direct authored-command verification as the sole prospective default for new TASK identities/revisions, retiring V2 candidate-only/baseline-attribution/collection gating from new work without weakening Runtime raw nonzero failure semantics or altering historical V2 artifacts."
problem: "The current default minimum-sufficient-v2 adds candidate/base collection, phase attribution and V2-specific early/final gates to ordinary focused verification. During TASK-355 r4 and r5 efforts, these produced repeated blocking and private FAILURE transport difficulties. Human explicitly prioritizes removing the prospective V2 gate and requires TASK-356 to use only minimum-sufficient targeted tests with no full-suite command. The repository already implements minimum-sufficient-v1 direct execution and accepts legacy V1 schema, so a new verification engine or policy is unnecessary."
assumptions:
- "Fresh canonical main 6e208053bc8aaed26f30a6b89ca61f3fae6b73cb, TASK-355 r5 at that main, and no existing TASK-356. Runtime must recheck the canonical main identity and exact expected-main CAS at ingress."
- "Human explicitly approved a new TASK-356 for prospective V2 gate retirement, requires minimal targeted tests and expressly forbids a full-suite verification command in this TASK. This current priority prospectively preempts ordinary roadmap bookmark sequencing without granting automatic roadmap mutation."
- "The current authoring policy CURRENT_VERIFICATION_POLICY is minimum-sufficient-v2; therefore this bootstrap TASK-356 itself uses minimum-sufficient-v2 under the still-published Runtime. Switching new TASK default to existing minimum-sufficient-v1 takes effect only after TASK-356 Runtime RESULT, independent Reviewer PASS and Publisher publication."
- "Existing minimum-sufficient-v1 already executes only TASK verification.required commands in authored order via Runtime execute_verification and requires raw exit_code 0 for success; failure, interruption, invalid command and missing evidence cannot be reported as PASS."
- "Historical TASK/RUN verification policies and exact minimum-sufficient-v2 records remain readable and preserve original decisions and immutable raw evidence. Switching the prospective default does not reinterpret or reopen any prior V2 failure."
- "TASK-355 r5 remains minimum-sufficient-v2 and must not be silently converted, rerun or published. A later explicit TASK-355 revision plus separately admitted PRIMARY is necessary if Human elects to use the V1 default for that objective."
- "Brain semantic audit profile is aios-adaptive-brain-audit-v1 version 1 digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718, distinct from Runtime minimum-sufficient-v1/V2 verification policy."
- "Native Executor selection and model/effort are not set by this TASK; a separately admitted Executor owns implementation and HOW. No automatic dispatch, correction, publication or downstream pin adoption follows from authoring."
