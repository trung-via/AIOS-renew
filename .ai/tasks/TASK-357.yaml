task_id: TASK-357
revision: 2
goal: >-
  Establish one provider-neutral 180-minute coding Executor response budget and finite
  185-minute process watchdog across admitted PRIMARY, REMEDIATION and REPAIR as well as
  directly constructed native adapters, eliminating competing adapter-local 60/65-minute
  defaults while preserving Runtime verification and correction authority.
problem: >-
  Published main still has 60/65-minute defaults in Dispatcher and separate native
  adapters. A dispatcher-only increase would leave direct adapter construction on
  the old budgets, conflicting with a single-default requirement. This prospective
  TASK revision must remove the competing defaults and verify both direct and admitted
  paths without creating a new execution authority, router or retry policy.
assumptions:
  - >-
    This is prospective TASK-357 revision 2 against canonical published main at
    AUTHOR_TASK admission. Runtime checks currentness, scope, provenance and CAS.
    Historical TASK-357 r1 RUN/FAILURE/RESULT artifacts remain immutable; no previous
    unreviewed candidate is a new execution base or proof for this revision.
  - >-
    Human owns acceptance of the longer possible stall exposure and chooses the
    Executor separately. This TASK does not select a model or create a RUN.
  - >-
    Existing NativeExecutionPolicy and Codex, Antigravity and Antigravity-Minimax
    adapters remain the single native execution mechanism. No execution can use the
    newly authored default as published policy until exact reviewed publication.
scope:
  inspect:
    - src/aios_renew/dispatcher.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/antigravity_minimax_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/execution_profile.py
    - tests/test_dispatcher.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_antigravity_minimax_adapter.py
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
  modify:
    - src/aios_renew/dispatcher.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/antigravity_minimax_adapter.py
    - src/aios_renew/native_execution_policy.py
    - tests/test_dispatcher.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_antigravity_minimax_adapter.py
non_goals:
  - No public FAILURE diagnostic projection, Brain Sync, transport or private-evidence redesign.
  - No new Kernel semantics, planner, controller, watchdog service, retry/failover selector or mutation authority.
  - No per-TASK or per-provider deadline exceptions, ambient overrides or unbounded waiting.
  - No source substitution from unreviewed TASK-357 r1 RUN candidates or rewriting
    their historical evidence.
  - No rewriting historical RUN, FAILURE, RESULT, EVIDENCE, REVIEW or publication states.
constraints:
  hard:
    - >-
      Preserve the existing provider-neutral NativeExecutionPolicy interface as
      the single default budget authority. Any optional cycle-free shared policy
      module must not introduce a second policy source or break existing imports.
      Preserve the response budget versus process-watchdog distinction.
    - >-
      Keep precisely one admitted Executor call; early successful returns complete
      immediately, timeout remains terminal, and unknown native exit codes remain
      unknown instead of fabricated success or failure. Direct construction without
      an explicit mutation grant must remain non-mutating; preserve explicit
      injected synthetic policies used by tests.
    - >-
      Do not change Runtime verification requirements, review/publication boundaries,
      native lease ownership, sandbox policy, source mutation rights or failure provenance.
    - >-
      Use deterministic synthetic native runners to test deadlines and timeout
      propagation. Do not sleep 180 minutes or repeat unchanged whole-suite tests.
acceptance:
  - id: AC1
    condition: >-
      One provider-neutral default supplies a 180-minute response budget and finite
      185-minute process watchdog to Dispatcher and all three native adapters,
      including direct adapter construction without an injected execution policy.
      No adapter-local 60/65-minute default or task/provider-specific override
      remains; direct construction does not implicitly authorize mutation.
  - id: AC2
    condition: >-
      PRIMARY, REMEDIATION and REPAIR invocation construction exposes the same
      policy values through Codex, Antigravity and Antigravity-Minimax adapters
      without changing their permitted authority or model selection.
  - id: AC3
    condition: >-
      Native timeout handling still terminates one admitted invocation with a
      truthful timeout and original captured diagnostics; absent native exit
      status is represented as unknown rather than fabricated.
  - id: AC4
    condition: >-
      Native responses received before the deadline return normally without
      artificial waiting, automatic retry, executor substitution or follow-on
      dispatch.
  - id: AC5
    condition: >-
      Deterministic synthetic regressions cover the 180/185 default in both
      directly constructed and Runtime-injected Codex, Antigravity and Minimax
      adapters, authorized versus read-only permission behavior, PRIMARY /
      REMEDIATION / REPAIR propagation, early completion, timeout/error diagnostics,
      and preservation of explicit injected synthetic test policies.
verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_dispatcher.py tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_antigravity_minimax_adapter.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE