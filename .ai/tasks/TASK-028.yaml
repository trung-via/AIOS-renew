task_id: TASK-028
revision: 1

goal: >
  Restore strict executor-adapter isolation for the AIOS-renew v0.1.3
  candidate and document the v0.1.3 architecture amendment without changing
  the frozen v0.1 historical specification.

problem: >
  TASK-027 introduced Antigravity-specific structural normalization into
  src/aios_renew/operator.py through _StructuralAntigravityAdapter and
  _normalize_structural_satisfies. AIOS-renew Law 15 requires
  executor-specific operational differences to live only in thin executor
  adapters. The frozen v0.1 specification still describes Executor-owned
  canonical verification and evidence, while the v0.1.3 candidate correctly
  moved canonical verification and evidence authority into deterministic
  Runtime.

assumptions:
  - TASK-027 Runtime-owned verification behavior is the v0.1.3 candidate baseline.
  - Antigravity-specific structural normalization can move into its thin adapter without changing the shared structural contract.
  - The frozen v0.1 specification is retained as an immutable historical architecture record.
  - Existing v0.1.2 canonical persisted ResultPackage artifacts remain compatibility inputs.

scope:
  inspect:
    - src/aios_renew/operator.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/artifacts.py
    - tests/test_operator.py
    - tests/test_antigravity_adapter.py
    - tests/test_antigravity_smoke.py
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md

  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/antigravity_adapter.py
    - tests/test_operator.py
    - tests/test_antigravity_adapter.py
    - tests/test_antigravity_smoke.py
    - docs/AIOS-RENEW-v0.1.3-ARCHITECTURE-AMENDMENT.md

non_goals:
  - Change Runtime verification authority or deterministic verification behavior.
  - Change executor-facing Minimum Necessary Context exclusions.
  - Change Antigravity structural staging outside canonical results.
  - Change Git binding, scope enforcement, post-verification repository checks, or remediation lineage.
  - Add retry, rerouting, fallback, automatic recovery, or publication behavior.
  - Add another planner, verifier agent, reviewer, router, or execution layer.
  - Modify docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md.
  - Invalidate, migrate, or rewrite existing v0.1.2 canonical ResultPackage artifacts.
  - Tag or publish AIOS-renew v0.1.3.

constraints:
  hard:
    - operator.py remains executor-neutral deterministic coordination.
    - Remove _StructuralAntigravityAdapter and _normalize_structural_satisfies from operator.py.
    - Antigravity-specific structural ResultPackage normalization belongs in antigravity_adapter.py only.
    - Codex and Antigravity continue returning the same structural contract to Runtime.
    - Preserve Runtime-owned canonical verification execution and EVIDENCE construction exactly.
    - Preserve exclusion of canonical TASK and REMEDIATION verification strings from executor-facing input.
    - Preserve Antigravity structural staging outside canonical .git/aios/results.
    - Preserve deterministic evidence IDs, exact command behavior, raw output handling, and evidence binding.
    - Preserve post-verification HEAD and clean-worktree revalidation for PRIMARY and REMEDIATION.
    - Preserve no retry, no reroute, and no fallback behavior.
    - Preserve REMEDIATION execution of affected_verification only.
    - Preserve compatibility with existing v0.1.2 canonical persisted ResultPackages.
    - Preserve PRIMARY upstream synchronization, one-active-executor locking, scope and changed-files enforcement, and REMEDIATION no-sync reviewed_sha lineage.
    - Do not modify docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md because it remains the frozen historical v0.1 contract.
    - The v0.1.3 architecture amendment must state that Brain owns WHAT.
    - The v0.1.3 architecture amendment must state that exactly one Executor owns HOW and the final implementation commit.
    - The v0.1.3 architecture amendment must state that an Executor may perform implementation-local self-checks but does not receive or execute canonical TASK or REMEDIATION verification commands.
    - The v0.1.3 architecture amendment must state that deterministic Runtime owns canonical verification execution and EVIDENCE construction.
    - The Runtime verifier is deterministic software and is not a semantic Verifier Agent.
    - Executor authors semantic claims and Runtime mechanically captures or generates canonical evidence.
    - ChatGPT Reviewer alone judges semantic adequacy of claims against TASK or delta and evidence.
    - The amendment must state that remediation runs affected verification only.
    - The amendment must state that v0.1.3 preserves Minimum Necessary Context, One Active Executor, Immutable State Binding, No Redundant Work, Deterministic Coordination Before AI Reasoning, and all other core AIOS-renew laws.
    - Keep the relocation minimal and do not broaden architecture.

acceptance:
  - id: AC1
    condition: >
      operator.py contains no Antigravity-specific structural subclass or
      Antigravity-specific result normalization helper.

  - id: AC2
    condition: >
      Antigravity structural normalization resides only in
      antigravity_adapter.py.

  - id: AC3
    condition: >
      PRIMARY and REMEDIATION Antigravity paths still accept empty structural
      evidence and empty claim-evidence references and preserve TASK-027
      staging behavior.

  - id: AC4
    condition: >
      Canonical persisted ResultPackage validation remains unchanged and
      existing v0.1.2 packages remain valid.

  - id: AC5
    condition: >
      No canonical verification command reaches Codex or Antigravity.

  - id: AC6
    condition: >
      No Runtime verification, Git binding, scope, staging, remediation,
      retry, or publication semantics change.

  - id: AC7
    condition: >
      Targeted regression tests prove behavior before and after relocation is
      equivalent.

  - id: AC8
    condition: >
      The new v0.1.3 amendment accurately documents Runtime-owned
      deterministic verification without redefining Runtime as a semantic
      verifier or changing Brain, Executor, or Reviewer authority.

  - id: AC9
    condition: >
      The frozen v0.1 specification is untouched.

verification:
  required:
    - python -m pytest tests/test_antigravity_adapter.py tests/test_antigravity_smoke.py tests/test_operator.py -q
    - git diff --check
    - git status --porcelain
