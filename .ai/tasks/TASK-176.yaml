task_id: TASK-176
revision: 1

goal: >
  Activate the Human/Brain-selected BP-V4 four-worker canonical full-suite verification
  profile for AIOS-renew on the supported self-host class, using the same bounded
  collection, worker-isolation, exact-subject, and deterministic failure-observation
  semantics proven by RUN-159-008. Add a repository-owned soft performance-regression
  attention surface bound to the approved RUN-159-008 baseline without making timing a
  correctness gate, creating automatic worker selection, rewriting Runtime commands,
  adding retry/fallback, or changing lifecycle/Reviewer/Publisher authority.

problem: >
  RUN-159-008 / REVIEW-159-008 established the first green exact-subject BP-V4 matrix:
  canonical collection 1825 with digest
  2e40a04acedcf9869e3961718337744761ee0a29f55258d2313b0a50d5fd66bb,
  serial 1594.934653 seconds, workers 2 at 1393.273135 seconds, workers 3 at
  1218.304415 seconds, and workers 4 at 1097.184058 seconds. All parallel profiles
  preserved canonical collection identity, exact subject identity, temporary-root
  isolation, process-local Git fixture cache-root isolation, distinct worker processes,
  and correctness. Human/Brain planning has therefore selected workers=4 and a soft
  attention threshold of 1346.059356 seconds, representing loss of more than one half
  of the measured p4 gain over the same-run serial baseline.

  The current repository intentionally has no canonical parallel full-suite default:
  the BP-V4 probe is a bounded measurement primitive, pytest-xdist is still documented
  as a one-time measurement extra, ordinary Runtime executes exact TASK-authored
  commands without rewriting, and RUN_OBSERVATION soft budgets apply to Executor time
  rather than verification time. The selected profile must therefore be activated as
  an explicit repository-owned verification capability and exact authorable command,
  not as global pytest addopts, Runtime inference, CPU-count heuristics, or a reuse of
  Executor soft-budget semantics.

assumptions:
  - >
    Canonical main at TASK-176 authoring is
    8e6e9b8f603f574dce48f7f147349c2d24edeeea. The canonical roadmap records
    RUN-159-008 / REVIEW-159-008 as the measurement basis and the explicit Human/Brain
    selection of workers=4 with soft attention threshold 1346.059356 seconds.
  - >
    RUN-159-008-V001 is authoritative measurement evidence for the supported
    self-host class observed as Windows AMD64, CPython 3.14.7, pytest 8.4.2, and
    pytest-xdist 3.8.0. Historical measurement evidence remains immutable.
  - >
    TASK-157 remains authoritative for the bounded BP-V4 measurement primitive and
    collection/parallel conformance semantics. TASK-161 remains authoritative for
    bounded deterministic identity-only failure diagnostics.
  - >
    TASK-150 remains authoritative for minimum-sufficient verification and
    full-suite-reason semantics. TASK-156 remains authoritative for exact Runtime
    verification-subject isolation.
  - >
    Runtime already executes the exact verification command list authored by the TASK
    and owns canonical EVIDENCE. TASK-176 does not authorize Runtime to choose, rewrite,
    inject, or substitute verification commands.
  - >
    RUN_OBSERVATION soft_budget currently classifies native Executor elapsed time by
    operation. It is not a verification performance budget and must remain unchanged.
  - >
    Performance attention is operational/planning information only. Runtime correctness
    still derives from the authored verification command exit status and conformance
    gates; Reviewer owns semantic verdict; Human/Brain own worker/policy/rebaseline/
    roadmap decisions; Publisher owns publication.
  - >
    Exact baseline comparability for the initial soft guard requires the selected
    profile plus the baseline canonical collection identity and toolchain/platform
    identity. A changed collection or toolchain is not automatically a regression.

