task_id: TASK-094
revision: 1

goal: >
  Begin Performance Closure P2 by extracting the existing Correction Preflight authority
  from the oversized Human-facing Operator implementation into one narrow production module,
  while preserving the exact public Operator surface and all current correction readiness,
  fail-closed, lineage, and read-only semantics.

problem: >
  TASK-093 established independently runnable Correction Preflight, Unified State, and
  Unified Human Surface test groups, but the production Correction Preflight implementation
  still resides inside src/aios_renew/operator.py, which remains roughly 230 KB and mixes
  multiple authority boundaries in one Executor context. The next useful decomposition is
  therefore to isolate the already-defined Correction Preflight boundary without creating
  another admission authority, changing behavior, or widening into the rest of Operator.

assumptions:
  - >
    Canonical main before TASK-094 authoring includes published TASK-093 candidate
    c6218fa97aa6a190fb68d253e8e4c35f1d321549, whose Runtime verification passed all
    remaining Operator tests plus the three new correction groups and review transport.
  - >
    tests/test_operator_correction_preflight.py is now the stable semantic regression surface
    for Correction Preflight; tests/test_operator_unified_state.py and
    tests/test_operator_human_surface.py remain downstream integration authority and must
    continue to work through the existing Operator-facing API.
  - >
    Correction Preflight is observational readiness authority only. It does not own RUN
    creation, Executor invocation, Runtime verification, semantic review, publication, or
    mutation/reconciliation of canonical repository state.
  - >
    Performance Closure P1 redundancy-admission hardening is deliberately not folded into
    this extraction because retroactive parser changes could invalidate historical TASK or
    REMEDIATION artifacts. That problem requires a separate prospective-safe design.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-085.yaml
    - .ai/tasks/TASK-086.yaml
    - .ai/tasks/TASK-093.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - tests/test_operator_correction_preflight.py
    - tests/test_operator_unified_state.py
    - tests/test_operator_human_surface.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/correction_preflight.py
    - tests/test_operator_correction_preflight.py

non_goals:
  - Change any Correction Preflight result schema, status, phase, reason code, selector,
    subject-mode, action, executor-required, or readiness semantics.
  - Change Unified State, Unified Human Surface, correction dispatch, Runtime completion,
    verification/evidence execution, REVIEW/REMEDIATION/REPAIR contracts, publication,
    Executor adapters, Dispatcher, or repository admission behavior.
  - Extract Unified State, Human Surface, primary execution, correction execution, transport,
    publication, locking, CLI parsing, or other Operator domains in this TASK.
  - Add a second preflight implementation, second lifecycle reducer, planner, router,
    automatic test selector, retry, fallback, reroute, or parallel execution.
  - Add REPAIR affected-verification, evidence reuse across SHAs, verification caching, or
    prospective verification-redundancy admission rules.
  - Modify or reinterpret frozen Kernel v0.1 artifacts.
  - Address the external Antigravity-MiniMax structural-output behavior observed during the
    failed TASK-093 attempts; that evidence belongs to the external backend hardening track.
  - Delete, skip, xfail, weaken, or duplicate tests merely to simplify extraction.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve one authoritative Correction Preflight implementation. After extraction,
      Operator remains the Human-facing facade and may delegate/re-export this boundary, but
      must not retain a second copy or divergent implementation of the extracted semantics.
    - >
      Existing public imports and calls through aios_renew.operator must remain compatible,
      including CorrectionPreflightResult, preflight_remediation, and preflight_repair.
      Existing CLI and Unified State callers must not need a new Human-facing command or a
      lower-level module-specific workflow.
    - >
      The extracted module remains observational and read-only: READY and BLOCKED evaluation
      must not create a RUN, invoke an Executor, run verification, mutate canonical runtime
      state, reconcile repository state, switch the Human worktree, or publish anything.
    - >
      Preserve exact current and historical subject handling, canonical remote/local lineage
      resolution, REMEDIATION and REPAIR action binding, NO_CHANGE reuse admission behavior,
      CONTINUE_IMPLEMENTATION readiness semantics, executor-required semantics, duplicate
      continuation blocking, and all existing fail-closed outcomes.
    - >
      Do not move semantic authority merely to reduce source size. Review transport remains
      transport authority; Runtime remains deterministic completion/verification authority;
      Review/Task parsers remain contract authority; Operator remains the public facade.
    - >
      tests/test_operator_unified_state.py, tests/test_operator_human_surface.py, and
      tests/test_operator.py are regression consumers only for this TASK and are not in
      modification scope. Their ability to pass unchanged is part of the compatibility proof.
    - >
      The extraction must materially reduce Correction Preflight implementation context in
      src/aios_renew/operator.py rather than copy it into a new file while leaving the old
      implementation in place.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      CorrectionPreflightResult, preflight_remediation, preflight_repair, and the internal
      implementation necessary solely for Correction Preflight are owned by one dedicated
      src/aios_renew/correction_preflight.py boundary, while the existing
      aios_renew.operator public surface remains source-compatible for current callers.
  - id: AC2
    condition: >
      Correction Preflight remains read-only and preserves READY/BLOCKED behavior for
      REMEDIATION and REPAIR across current and historical subjects, canonical remote/local
      lineage, malformed/ambiguous state, duplicate continuation, scope/action binding, and
      executor-required decisions.
  - id: AC3
    condition: >
      NO_CHANGE reusable-state admission, CODE_FIX ordinary repair readiness, and
      CONTINUE_IMPLEMENTATION readiness retain their established ordering and fail-closed
      semantics, with no reuse-specific validation leaking into mutation-authorizing repair
      actions.
  - id: AC4
    condition: >
      Unified State and existing Operator callers continue to consume the exact authoritative
      Correction Preflight result through the unchanged Operator-facing interface; no second
      reducer, preflight authority, or alternate Human workflow is introduced.
  - id: AC5
    condition: >
      src/aios_renew/operator.py is materially smaller in the Correction Preflight domain and
      does not retain a duplicate implementation, while the dedicated module owns no Runtime
      execution, verification, semantic review, publication, retry/reroute, or unrelated
      Operator authority.
  - id: AC6
    condition: >
      The delta is limited to the three authorized files, frozen Kernel artifacts and all
      canonical schemas remain unchanged, and no tests are deleted, skipped, xfailed,
      duplicated, or semantically weakened.
  - id: AC7
    condition: >
      The focused Correction Preflight suite plus unchanged Unified State, Human Surface, and
      remaining Operator regressions pass together under one canonical verification command.

verification:
  required:
    - python -m pytest tests/test_operator_correction_preflight.py tests/test_operator_unified_state.py tests/test_operator_human_surface.py tests/test_operator.py -q
