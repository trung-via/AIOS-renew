task_id: TASK-090
revision: 1

goal: >
  Close the deterministic safe-publication compatibility gap introduced by the published
  TASK-089 REPAIR action `CONTINUE_IMPLEMENTATION`, so a semantically reviewed PASS candidate
  produced through that existing REPAIR action can be validated and published by the existing
  safe publisher without weakening publication lineage, ancestry, scope, review, or race
  protections.

problem: >
  TASK-089 is published on canonical main and the Runtime/Operator now admit and complete
  `CONTINUE_IMPLEMENTATION` as a third REPAIR semantic action. The separate publication
  authority still validates REPAIR authorization against only `CODE_FIX` and `NO_CHANGE`, and
  its repair-mutation branch treats every non-CODE_FIX action as NO_CHANGE. Therefore a valid
  CONTINUE_IMPLEMENTATION RUN can reach Runtime PASS and semantic REVIEW PASS yet fail closed
  during safe publication solely because the publisher's REPAIR vocabulary and mutation
  validation are stale. This is an end-to-end compatibility defect at the publication
  boundary, not a reason to redesign TASK-089 or create a new lifecycle.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-090 authoring is
    bb57147eac92475789d7809ed445d56535d5a009, the published TASK-089 source candidate.
  - >
    REVIEW-089-002 is the canonical PRIMARY PASS review for
    bb57147eac92475789d7809ed445d56535d5a009 with AC1 through AC10 PASS and no findings.
  - >
    TASK-089 remains authoritative for the meaning and Runtime/Operator semantics of
    `CONTINUE_IMPLEMENTATION`: exact admitted failed predecessor, phase EXECUTION or
    COMPLETION_GATE, clean repairable/transportable candidate, non-empty authored repair
    scope, explicit one Executor, failed-head descendant mutation, non-empty failed-head
    delta, original root-relative Result.changed_files, one canonical verification pass,
    and no automatic retry/reroute/action conversion.
  - >
    TASK-063 revision 3 remains authoritative for safe publication: publication consumes
    canonical PASS state only, publishes the exact reviewed source candidate rather than
    review metadata, requires deterministic lineage and fast-forward/race safety, invokes no
    Executor or verification, and fails closed on malformed or conflicting state.
  - >
    `.ai/roadmap-state.yaml` still identifies downstream adoption as the active-track work.
    Human has explicitly authorized this observed-evidence publisher hardening as a required
    prerequisite before resuming downstream adoption.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-ROADMAP.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-063.yaml
    - .ai/tasks/TASK-089.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/review.py
    - src/aios_renew/publication.py
    - tests/test_publication.py
  modify:
    - src/aios_renew/publication.py
    - tests/test_publication.py

non_goals:
  - Change the semantic meaning, admission authority, execution behavior, completion rules,
    Human Surface behavior, or verification ownership established by TASK-089.
  - Add another REPAIR action, correction family, publication path, retry path, resume command,
    or alternate lifecycle.
  - Change CODE_FIX or NO_CHANGE semantics, including verification-only NO_CHANGE reuse.
  - Modify Operator, Runtime, Dispatcher, Executor adapters, review transport, REVIEW parsing,
    workflow triggers, model selection, timeout, lease, or downstream repositories.
  - Re-run Runtime verification, invoke an Executor, call a model, or generate semantic REVIEW
    during publication.
  - Relax canonical repair authorization identity, failed RUN/TASK binding, failed-head/root
    lineage, modification scope, result/evidence binding, review binding, fast-forward ancestry,
    exact-main compare-and-swap race protection, or review-metadata isolation.
  - Infer an external prerequisite or the semantic reason for CONTINUE_IMPLEMENTATION from
    FAILURE diagnostics, error prose, timestamps, filenames, browser/session state, or model
    output. Publication validates canonical authored state only.
  - Advance downstream repositories, migrate dependency pins, or claim downstream adoption
    complete in this TASK.
  - Perform unrelated publication refactoring or cleanup.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Safe publication must recognize exactly the three already-published REPAIR actions:
      `CODE_FIX`, `NO_CHANGE`, and `CONTINUE_IMPLEMENTATION`. This TASK adds no fourth action
      and creates no new semantic authority.
    - >
      For CONTINUE_IMPLEMENTATION, publication must independently fail closed unless the
      canonical predecessor FAILURE is bound to the exact failed RUN/TASK/failed_head_sha,
      is repairable, has phase EXECUTION or COMPLETION_GATE, and its candidate facts satisfy
      the published TASK-089 clean transportable pre-verification boundary. Publication must
      not infer why continuation was authorized.
    - >
      The canonical embedded REPAIR authorization and canonical remote repair authorization
      must remain byte-semantically identical under the existing field contract, with a
      non-empty CONTINUE_IMPLEMENTATION modification_scope inside existing correction
      authority and no introduced TASK constraints.
    - >
      A published CONTINUE_IMPLEMENTATION candidate must be a normal descendant of the exact
      failed_head_sha, must advance beyond that failed head, and must contain a non-empty
      failed-head-relative committed delta wholly inside the authored REPAIR modification
      scope. Publication must never treat it as NO_CHANGE.
    - >
      Existing root_base_sha-to-final Result.changed_files validation, TASK scope validation,
      complete Result/Evidence binding, semantic REVIEW validation, recursive historical
      REPAIR lineage reconstruction, and safe-main publication rules remain unchanged.
    - >
      CODE_FIX and NO_CHANGE publication behavior must remain unchanged. CODE_FIX continues
      to require a non-empty authorized mutation; NO_CHANGE continues to require unchanged
      HEAD and zero mutation.
    - >
      Recursive REPAIR publication lineage must accept a valid CONTINUE_IMPLEMENTATION link
      wherever the existing repair-chain contract permits it, while malformed action/phase/
      candidate/scope/ancestry/mutation facts fail closed before main mutation.
    - >
      Publication remains deterministic coordination only: no Executor invocation, no
      Runtime verification rerun, no semantic model/reviewer call, no retry/fallback/reroute,
      and no alternate candidate synthesis.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic publication regression constructs a valid pre-verification failed
      PRIMARY lineage followed by an authorized CONTINUE_IMPLEMENTATION REPAIR, Runtime-style
      successful artifacts, and a canonical PRIMARY PASS review; safe publication accepts the
      lineage and advances main to exactly the reviewed source candidate, never to review
      metadata.
  - id: AC2
    condition: >
      The AC1 regression proves publication preserves exact failed_run_id, TASK revision,
      failed_head_sha, root_base_sha, canonical repair authorization identity, final RESULT
      head, review reviewed_sha, and root-relative Result.changed_files authority.
  - id: AC3
    condition: >
      Deterministic negative regressions reject CONTINUE_IMPLEMENTATION when predecessor phase
      is VERIFICATION, candidate transportability/clean-descendant facts violate TASK-089,
      modification_scope is empty or exceeds correction authority, canonical authorization
      conflicts, or final HEAD is unchanged, divergent from failed_head_sha, empty-delta, or
      mutated outside repair scope; remote main remains unchanged in every rejected case.
  - id: AC4
    condition: >
      Recursive/historical REPAIR coverage proves a valid CONTINUE_IMPLEMENTATION link can be
      reconstructed through the existing safe-publication lineage model without replacing the
      failed subject with current main, losing root lineage, or importing review metadata into
      product main.
  - id: AC5
    condition: >
      Existing CODE_FIX and NO_CHANGE publication regressions remain green and deterministic,
      including malformed-lineage, missing authorization, review/result binding, divergent
      main, concurrent-main race, and idempotent publication protections.
  - id: AC6
    condition: >
      Publication performs no Runtime verification, Executor invocation, retry, fallback,
      reroute, semantic review generation, or external-prerequisite probe while processing a
      CONTINUE_IMPLEMENTATION lineage.
  - id: AC7
    condition: >
      The focused publication test suite passes and `git diff --check` passes with no modified
      file outside the TASK scope.

verification:
  required:
    - python -m pytest tests/test_publication.py -q
    - git diff --check
