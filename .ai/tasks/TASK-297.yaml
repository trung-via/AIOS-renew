task_id: TASK-297
revision: 1
goal: Correct H4C0 PAGE_SCOPED_AIOS_SEND_ORIGIN_BOOTSTRAP_V1 for the exact production
  regular-Chat literal-paste DOM wrapper and ensure asynchronous post-input reconciliation
  is proved only at the bounded readiness gate before any submit intent, without weakening
  draft-byte exactness, page-scoped origin proof, scoped Send safety, no-blind-resend,
  or H4C0/H4C1 authority boundaries.
problem: 'After TASK-296 r1 passed Runtime verification, REVIEW-296-001, and exact
  publication, the first fresh H4C0 A1 live observation still terminated pre-submit
  as UNPROVED/INSERT_BLOCKED. Read-only structural diagnostics on the exact visible
  regular-Chat composer established one visible composer, one enclosing form, one
  visible enabled scoped Send control, five attribute-free P blocks, and the production
  child grammar: non-empty blocks are SPAN elements with exactly one attribute data-prompt-literal-paste=""
  and exactly one #text child; the empty separator block is BR class="ProseMirror-trailingBreak".
  The published TASK-296 exactText predicate admits direct text children and the trailing
  BR but rejects the observed literal-paste SPAN wrapper. The same source also requires
  exactText synchronously at the end of insert() even though the bounded ready() phase
  is the contractually intended place to wait for asynchronous editor reconciliation.
  This second observation created no canonical RUN/FAILURE and no submit attempt;
  it is bounded Human/Brain live-conformance evidence for one prospective correction.'
assumptions:
- Canonical main at TASK-297 authoring is 6acf5886d02eb0705a70c00d48c29131d3ff7370.
- 'TASK-296 r1 is canonically complete: RUN-296-001 Runtime PASS, REVIEW-296-001 PASS,
  exact published source SHA 7037ce457471c230536749cf8e591e21720c0782, and roadmap
  reconciliation after publication.'
- H4C0 remains open and H4C1 remains blocked. The bounded two-chat live observation
  resumed after TASK-296 publication but A1 again failed closed before submit with
  UNPROVED/INSERT_BLOCKED.
- 'The post-TASK-296 live observation proved one visible composer, one enclosing form,
  one visible enabled scoped Send, five attribute-free P root blocks, four non-empty
  P > SPAN[data-prompt-literal-paste=""] > #text branches, and one empty P > BR.ProseMirror-trailingBreak
  branch.'
- The production wrapper evidence is structural only. Raw conversation URL/UUID, route
  handle, endpoint, registry contents, raw draft text, transcript, assistant output,
  and raw DOM payload are not task inputs and must not enter canonical artifacts.
- The correction may change only origin-bootstrap post-insertion representation proof
  and insert-to-ready ordering. It does not alter the Human gesture, challenge ownership,
  durable binding, route identity, generation, scoped Send selection, or no-blind-resend
  state machine.
- Runtime verification, Reviewer PASS, and publication of TASK-297 still do not close
  H4C0 or authorize H4C1; Human/Brain must rerun and explicitly evaluate the bounded
  two-chat live procedure afterward.
