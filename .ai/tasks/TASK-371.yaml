constraints:
  hard:
  - Only canonical Runtime preflight plus exact Unified State/current correction authorization
    may establish executor_required; if either observation is unavailable, stale,
    invalid, inconsistent, or cannot authenticate same RUN/REPAIR SHA, do not schedule
    the bot executorless wakeup. Do not derive authority from REPAIR action text,
    bot identity or chat.
  - Existing first-party .github/workflows/aios-brain-ingress.yml must not unconditionally
    issue workflow_dispatch executor:'' for each AUTHOR_REPAIR. A single bounded route
    may automatically dispatch executorless only when trusted preflight proves executor_required=false
    for a current eligible NO_CHANGE or reusable FINALIZE_CANDIDATE; otherwise return
    Human wakeup required without dispatch.
  - For CODE_FIX and CONTINUE_IMPLEMENTATION and non-reusable FINALIZE_CANDIDATE,
    Human manual or exact-subject Human opt-in AUTO remains the only existing authorized
    coding route. No bot-triggered empty-executor attempt may be interpreted as Human
    authorization. Preserve explicit Human executor/model/effort priority and provenance
    through existing independent carriers.
  - Expose on the original AUTHOR_REPAIR Issue one bounded Human action/reason tied
    to exact failed_run_id, repair_sha and repair_dispatch_id through its existing
    Issue receipt writer when coding is required or currentness unavailable. It must
    not imply a GitHub workflow job failed or create a fake RUN/FAILURE. Do not implement
    Gap 2 workflow/job/step lookup.
  - Preserve idempotent original Issue admission, same-dispatch and correction-SHA
    conflict protection, GitHub actor/root/ref provenance, journal/CAS source currentness,
    private diagnostic redaction, least privilege and separate Runtime/Reviewer/Publisher
    authorities.
  - Use current main and allowed modification scope only; candidate 38286fb3 and its
    465-pass local test observations can be read as untrusted bounded implementation
    references, not imported as accepted or Runtime-verified source.
  - Execution claims must affirm concrete observed implementation behavior for every
    acceptance ID before Runtime verification. Keep canonical verification exclusively
    in verification.required; claims/evidence are not Reviewer PASS or publication.
acceptance:
- id: AC1
  condition: The canonical incident-#168-shaped regression demonstrates that published
    TASK-365 Human AUTO behavior is distinct from the omitted unconditional executorless
    ingress workflow caller, and reproduces the pre-RUN missing-Executor boundary
    without fabricating a RUN or declaring TASK-365 defective.
- id: AC2
  condition: For a newly canonicalized coding-required AUTHOR_REPAIR, the first-party
    ingress workflow does not schedule a bot executorless self-host wakeup. The exact
    original Issue receipt exposes a bounded HUMAN_WAKEUP_REQUIRED action/reason bound
    to failed_run_id, current repair_sha and repair_dispatch_id, with no claim of
    RUN or Executor invocation.
- id: AC3
  condition: Only a current Runtime-backed preflight plus consistent Unified State
    attestation of executor_required=false can authorize exactly one automatic executorless
    route for eligible NO_CHANGE or preserved-ResultPackage FINALIZE_CANDIDATE; the
    workflow is actually gated on this authenticated route, not on a nonempty repair
    SHA or action-name guess. Missing, contradictory, stale, malformed or conflicting
    attestation fails closed without dispatch.
- id: AC4
  condition: Existing authenticated Human manual Codex and exact-subject Human opt-in
    AUTO REPAIR wakeups remain unaffected, carrying exact Human-selected or lawfully
    reused executor/model/effort/provenance and preserving manual priority. A bot
    cannot mint coding authority, override explicit Human selection or alter the existing
    immutable dispatch-id/journal conflict and replay behavior.
- id: AC5
  condition: "The minimal ingress/repair integration and adversarial regression cases\
    \ establish positive coding-required \u2192 Human action, truly executorless \u2192\
    \ one valid route, and Human manual/AUTO continuity, plus negative missing-currentness,\
    \ conflicting SHA/identity, stale/moved proof, forged bot selection, and repeated\
    \ delivery. These tests exercise production routing surfaces and do not substitute\
    \ a fabricated post-verification PASS."
- id: AC6
  condition: The implementation is limited to authorized ingress-consumer, bounded
    existing Issue status and focused tests/docs, preserves GitHub credentials/actor/source/permission
    isolation and existing Runtime/Reviewer/Publisher authority, introduces no new
    state/writer/lifecycle router, and does not add Gap 2 workflow run/job/step/diagnostic
    discovery.
