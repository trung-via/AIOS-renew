- TASK_AUTHORING semantics use the Human-approved R2.1 TCA-1 v1 semantic profile pinned
  on canonical main; any Runtime/Reviewer/Publisher outcomes stay with their own authority.
  Human has not delegated a coding Executor/model for implementation of TASK-371;
  TASK authoring alone does not invoke one.
