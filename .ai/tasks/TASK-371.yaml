task_id: TASK-371
revision: 1
goal: 'Close only TASK-370 Gap 1: make the first-party AUTHOR_REPAIR GitHub Issue
  ingress consumer avoid doomed bot-triggered executorless coding REPAIR dispatch
  while preserving canonical Runtime correction-preflight executor_required authority,
  exact Human manual/AUTO delegation and truly eligible executorless REPAIR delivery.
  Publish a bounded actionable Human-wakeup-needed observation on the existing originating
  Issue when no safe executorless route can be proved. Gap 2 workflow/job failure
  observability is separate and not a prerequisite.'
problem: Published TASK-365 Human exact-subject AUTO/manual selection is correct,
  but canonical main 8113b50ac88e571c452c7a1838cf40f459203699 still runs .github/workflows/aios-brain-ingress.yml
  'Dispatch safe REPAIR wakeup once' on every AUTHOR_REPAIR with executor empty. TASK-369
  incident GitHub Actions run 39026366429 job 117378039859 reported 'coding REPAIR
  requires an explicit Executor', a pre-RUN operational failure. Historical combined
  TASK-370 r1 candidate 38286fb3390a825d8fc5d135cf14f4b1f49faf75 demonstrates possible
  solutions but is unreviewed/unpublished and its RUN-370-004 FAILED at COMPLETION_GATE
  with claims=[] despite 465 independent targeted pytest passes. The present task
  must fix the existing consumer from current main with AC that are affirmable implementation
  properties before Runtime verification, not replay or assume publication of combined
  TASK-370.
assumptions:
- 'Human explicitly prioritizes sequential split: TASK A Gap 1 before independent
  TASK B Gap 2, and requires TASK B only after TASK A has canonical RESULT, independent
  REVIEW PASS and Publisher publication. This prospective priority does not itself
  mark the previous planning bookmark or TASK-370 completed.'
- Canonical main at authoring is 8113b50ac88e571c452c7a1838cf40f459203699; TASK-371
  did not exist. Runtime independently checks current expected-main SHA, actor and
  TASK authoring authority at ingress.
- TASK-370 revision 1 and RUN-370-001 through RUN-370-004 FAILURE/correction lineage
  remain immutable, with latest FAILURE RUN-370-004 COMPLETION_GATE at head 38286fb3390a825d8fc5d135cf14f4b1f49faf75.
  This separate prospective TASK must start on canonical main, not import unreviewed
  candidate commits as canonical evidence.
- Published TASK-314/315 implement conditional FINALIZE_CANDIDATE structural-package
  reuse and correction-preflight executor_required; published TASK-365 implements
  Human manual/exact-subject AUTO selection. Reuse these without a second decision
  engine.
- Actual self-host GitHub transport can lack protected currentness or reused-package
  state. Such unknown observations require a bounded Human-wakeup-needed route rather
  than an optimistic executorless dispatch. Carrier admission/dispatch is not RUN
