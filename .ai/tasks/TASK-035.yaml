task_id: TASK-035
revision: 2

goal: >
  Make PRIMARY execution fail closed when a mutation-bearing TASK completes with
  no implementation delta, while preserving valid no-change PRIMARY execution
  for explicitly read-only TASKs whose scope.modify is empty.

problem: >
  Observed Python Agent RUNs for TASK-104 repeatedly returned Runtime PASS with
  head_sha equal to base_sha even though TASK-104 had a non-empty scope.modify.
  TASK-035 revision 1 demonstrated the intended guard but its candidate was
  BLOCKED because the then-current Windows verification wrapper reported a
  failing pytest process as exit_code 0. TASK-036 repaired and published that
  verification boundary. Revision 2 now re-runs the same narrow no-op mutation
  repair on the corrected Runtime and must preserve existing structural and
  completion gate semantics while preventing a structurally complete mutation
  TASK from reaching canonical verification without an implementation delta.

assumptions:
  - The current canonical AIOS-renew baseline is 203da01226eeb4749e754c6293a9afb58d233247.
  - TASK-036 has corrected Windows native verification exit-code propagation.
  - scope.modify is already the hard mutation authority in the Brain TASK Authoring Contract.
  - A TASK with scope.modify empty may legitimately complete with head_sha equal to base_sha.
  - TASK-032 is an existing canonical example of a valid read-only PRIMARY TASK with scope.modify empty.
  - RUN-035-001 and candidate b5da7493b1a093781cb4f22d0c41b63ef7a37801 are historical blocked evidence only and must not be transplanted or published.

scope:
  inspect:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-032.yaml
    - .ai/tasks/TASK-036.yaml

  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py

non_goals:
  - Change TASK, RUN, RESULT, EVIDENCE, REVIEW, or REMEDIATION schemas.
  - Add a requires_change field or any new TASK field.
  - Change Codex or Antigravity adapter semantics.
  - Change canonical verification ownership or EVIDENCE construction.
  - Change Windows or POSIX verification implementation repaired by TASK-036.
  - Change remediation/FIX behavior.
  - Change publication, push, branch, tag, or remote-reference behavior.
  - Change primary synchronization behavior.
  - Reject legitimate read-only PRIMARY TASKs whose scope.modify is empty.
  - Add retry, reroute, fallback, planner, reviewer, transport, or orchestration layers.
  - Modify legacy AIOS Bridge code or semantics.

constraints:
  hard:
    - Use the existing canonical scope.modify contract as the only deterministic distinction between read-only and mutation-bearing PRIMARY TASKs.
    - A structurally complete PRIMARY TASK with non-empty scope.modify must fail closed when final Git HEAD equals its bound base_sha.
    - A PRIMARY TASK with empty scope.modify must remain eligible to complete with final Git HEAD equal to base_sha when all other existing requirements are satisfied.
    - Preserve existing RESULT.head_sha binding, worktree cleanliness, changed-files scope validation, unresolved-item rejection, and acceptance-coverage validation.
    - Existing structural or completion failures must not be replaced by the new no-op mutation error when those failures already make the RESULT incomplete.
    - After structural and completion gates succeed, a mutation-bearing no-op must be rejected before canonical verification is executed.
    - Verification-focused tests that need to reach Runtime verification must establish a valid pre-verification state by using either a read-only TASK or a valid committed in-scope mutation; they must not rely on an invalid mutation-bearing no-op fixture.
    - A mutation-bearing PRIMARY TASK with a valid committed in-scope delta must continue into the unchanged canonical verification path.
    - The new guard must apply identically to Codex and Antigravity through the shared Runtime path.
    - Do not infer required mutation from goal text, acceptance wording, claims, executor identity, or model reasoning.
    - Preserve TASK-032-style read-only conformance semantics.
    - Keep the repair narrow to PRIMARY completion behavior and deterministic regression coverage in tests/test_operator.py.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      PRIMARY execution deterministically rejects a structurally complete TASK
      whose scope.modify is non-empty when final Git HEAD is unchanged from the
      bound base_sha, even when changed_files and unresolved are empty and claims
      cover every acceptance criterion.

  - id: AC2
    condition: >
      PRIMARY execution continues to permit an unchanged final Git HEAD for a
      TASK whose scope.modify is empty when all other existing structural,
      completion, repository-state, and verification requirements are satisfied.

  - id: AC3
    condition: >
      A mutation-bearing PRIMARY TASK with a valid committed in-scope delta
      continues through the existing canonical verification path without being
      rejected by the new no-op guard.

  - id: AC4
    condition: >
      Existing structural and completion failures, including unresolved items
      and missing acceptance coverage, retain their established fail-closed
      outcomes rather than being masked by the new no-op mutation guard.

  - id: AC5
    condition: >
      A structurally complete mutation-bearing no-op is rejected before any
      canonical verification command is executed.

  - id: AC6
    condition: >
      Deterministic regression tests prove valid read-only no-change completion,
      rejected mutation-bearing no-change completion for both Codex and
      Antigravity, accepted mutation-bearing completion with a valid delta, and
      preserved access to verification-specific behavior from valid
      pre-verification states.

  - id: AC7
    condition: >
      No TASK schema, adapter, verification implementation or ownership,
      remediation, publication, synchronization, or legacy Bridge semantics are
      changed by this repair.

verification:
  required:
    - 'python -m pytest tests/test_operator.py -q'
