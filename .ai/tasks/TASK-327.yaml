non_goals:
- Treat a successful merge-tree calculation, unchanged blobs, workflow acceptance
  or Executor assertion as permission for publication, semantic REVIEW PASS or evidence
  validity.
- Rewrite, delete, replace or reinterpret historical TASK/RUN/RESULT/FAILURE/EVIDENCE/REVIEW/REMEDIATION/REPAIR
  artifacts or silently modify REVIEW-326-001 or its source candidate.
- Introduce a new Planner, second verification scheduler, generic lifecycle reducer/router,
  permanent event database, Reviewer, Publisher or autonomous review verdict.
- Modify frozen Kernel v0.1, extend frozen artifact schemas, or silently grant new
  publication/integration semantic authority; any otherwise unavoidable amendment
  is an explicit Human blocker requiring separate approval.
- Fast-forward/force-push/cherry-pick/rebase main from Brain/Executor or restore TASK-315
  exceptional one-time manual publication as a permanent default.
- Reexecute implementation or launch baseline/full-suite pytest automatically merely
  because main SHA moved; proof reuse requires independent current validity and distinct
  integration obligations remain mandatory.
- Modify future VP-03/VP-04/VP-07 verification policy architecture or retroactively
  finish deferred VP-01 baseline.
- Retire existing live ingress/publisher/attention workflows, trust-boundary checks,
  constitutional and specialized protocol documents, H4 live conformance or historical
  evidence by broad deletion.
- Auto-advance roadmap, change Executor delegation, wake another Chat destination,
  implement H4/H5, or change downstream project pins.
constraints:
  hard:
  - 'Normal exact reviewed candidate publication remains Publisher-owned: bind canonical
    PASS, exact eligible source and RESULT/EVIDENCE, current main ancestry, expected
    main and CAS, reservation, and post-push inclusion. Review decision commits remain
    metadata.'
  - For divergent main, classify exact outcomes PUBLISHABLE, ALREADY_INCLUDED, CLEAN_RECOVERY_ELIGIBLE,
    CONFLICT_OR_UNKNOWN, STALE_BINDING and COMPETING_SOURCE without a generic blind
    retry. Only safe, uniquely bounded, content-addressed no-conflict integration
    may enter source recovery; disallow scope escape, unsupported tree mode, ambiguous
    merge bases, overlapping material changes, main drift, changed TASK/affinity or
    unresolved competing PASS.
  - A clean recovery must preserve the old reviewed source as immutable provenance
    and exactly preserve unrelated canonical main deltas, including the Human legacy-route
    planning commit. It must create a distinguishable new source candidate bound to
    current main, original PASS and the exact allowed changed-file and blob identities;
    it must not publish or claim that candidate is reviewed.
  - A mechanically generated candidate after PASS may proceed only through an admitted
    Runtime-governed recovery/continuation with exact traceable identity under currently
    legal frozen RUN/RESULT/EVIDENCE semantics. No fabricated RUN, FAILURE, remediation
    finding or prior REVIEW substitution. If frozen semantics cannot represent the
    needed transition, return explicit HUMAN_KERNEL_AMENDMENT_REQUIRED without mutation.
  - Runtime alone establishes actual candidate evidence validity; never manufacture
    PASS from equality of a filename, command, pytest nodeid, disjoint diff, passing
    previous RUN or ordinary Git merge. Explicit reuse requires compatible source
    contents, test/fixture/helper/environment/profile/policy/toolchain and independent
    obligations with immutable provenance; INVALIDATED requires only affected verification,
    UNKNOWN blocks or requires bounded authorized proof. Do not implement a competing
    general V2/VP proof scheduler.
  - Reviewer independently judges the exact recovered candidate and its source/obligation
    delta; a fresh SHA cannot inherit old PASS as its verdict. Review handoff pauses
    at its normal semantic authority boundary, then successful exact ingress triggers
    Publisher without manual replay loops.
  - Admission, approval, creation of recovery candidate, review dispatch, publication
    CAS and terminal/wake statuses must remain separate, durable, idempotent and provenance-bound;
    reject same-origin duplicate, stale main, changed reservation, ambiguous predecessor
    and any automatic repeated candidate construction.
  - Workflow dispatch is transport only; never treat queued, admitted, runner started,
    carrier accepted, recovery proposal or review-request wake as canonical RUN/verification/review/publication
    truth.
  - Keep one current generic operational entrypoint SELF_HOST_END_TO_END_FLOW_V1 and
    exactly one publication-specific normative flow leaf. The publication leaf documents
    PASS -> ingress -> decision -> Publisher -> outcome -> safe Runtime recovery ->
    EVIDENCE -> Reviewer -> Publisher -> postcondition/attention with exact authority,
    negative branches and canonical locators. Project Contract publication navigation,
    self-host section 7 and README must redirect to that leaf without establishing
    conflicting instructions.
  - 'Perform claim/section-scoped cleanup in the same reviewed implementation candidate
    as the new flow and recovery activation: RETAIN_NORMATIVE independent Constitution/frozen
    Kernel/TASK/Reviewer/Publisher/VP/H4, REPLACE_WITH_POINTER competing generic publication
    procedures, HISTORICAL_ONLY dated procedures, IMPLEMENTATION_LEAF active code.
    Do not remove historical audit/evidence or decommission active safety gates.'
  - Source candidate implementation may change only listed scope.modify paths, should
    not add a new runtime gate on normal fast-forward publication, and must retain
    the existing Git reservation/expected-old-main semantics at mutation edges.
  - The normal recoverable incident is exactly TASK-326 r1 with existing RESULT/REVIEW;
    its standing original review remains immutable. New automatic recovery becomes
    eligible only after THIS TASK itself is Runtime-verified, reviewed and source-published;
    TASK-326 recovery/publication is a separate later canonical operation, never falsely
    counted as TASK-327 acceptance.
acceptance:
- id: AC1
  condition: The implementation exposes one bounded publisher outcome classification
    with exact canonical candidate/review/main/reservation lineage and a no-additional-work
    fast-forward/already-included path; failure/operational receipts never impersonate
    published state.
- id: AC2
  condition: For a uniquely clean divergent main, the implementation defines an idempotent
    current-main-bound source-only recovery identity and candidate with exact original
    reviewed source/blob provenance and preserved unrelated main content; invalid
    overlap, stale currentness, scope escape or ambiguous ancestry cannot materialize
    or publish it.
- id: AC3
  condition: The recovered-source continuation is admitted and represented only by
    legally authoritative existing Runtime lifecycle/result surfaces, with an explicit
    no-RUN/pre-AIOS failure distinction; it never generates a fake finding, rewrites
    prior PASS or extends frozen Kernel schemas.
- id: AC4
  condition: A recovered candidate has a bounded Runtime-owned evidence validity/affected-proof
    decision recording original evidence provenance and reused-versus-executed proof
    without parallel scheduling; unchanged conditions do not mandate duplicate proof,
    while invalid/unknown or distinct integration obligations cannot be falsely marked
    PASS.
- id: AC5
  condition: The recovery-to-Reviewer boundary deterministically selects exactly the
    candidate needing a new semantic verdict, preserves prior PASS as provenance only,
    and requires a canonical PASS for the new exact SHA before Publisher is eligible.
- id: AC6
  condition: The durable publication workflow supports initial review ingress, safe
    divergent-source continuation, resumed exact review and final CAS publication
    with monotonic exact identity, dedupe and publication outcome classification,
    without Brain manual multi-step Git intervention in the normal eligible case.
- id: AC7
  condition: Counterexamples for concurrent main movement, stale/competing PASS source,
    missing EVIDENCE, duplicate dispatch, lost review wake, malformed integration,
    conflict, changed profile and changed relevant test/fixture/helper remain fail-closed
    and cannot mutate canonical main.
- id: AC8
  condition: One publication-specific current normative navigation leaf and same-candidate
    section-scoped cleanup make the publication lane discoverable from the already
    canonical SELF_HOST_END_TO_END_FLOW_V1, Project Contract and README, without rival
    generic flow, orphaned current instructions or deletion of specialized/historical
    authority.
- id: AC9
  condition: Focused real-Git and synthetic regression fixtures cover both original
    RUN-326-001 clean planning-only divergence and disallowed material divergence,
    plus ordinary fast-forward, already-included, post-review recovery, currentness
    and no-repeat evidence behaviors. Tests do not require external credentials, live
    wake or uncontrolled full suite.
- id: AC10
  condition: The implementation preserves current primary/remediation/repair publication
    and correction integration contracts, exact review/RESULT binding, transport-only
    workflows, frozen Kernel semantics, and correct separation between TASK-327 publication
    and any later independent TASK-326 resolution.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_publication.py
  - python -m pytest -q tests/test_correction_integration.py
