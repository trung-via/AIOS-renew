task_id: TASK-327
revision: 1
goal: Implement one durable, authority-preserving PUBLICATION_END_TO_END_FLOW_V1 for
  all AIOS-renew reviewed source candidates, including deterministic recovery of clean
  main divergence after semantic PASS without a separate per-incident implementation
  TASK, and atomically consolidate active publication navigation into one specialized
  entrypoint under SELF_HOST_END_TO_END_FLOW_V1. Preserve the frozen Kernel, exact
  review/source binding and historical lineage.
problem: RUN-326-001 has canonical RESULT and 148 focused-test passes; REVIEW-326-001
  is PRIMARY PASS with all seven acceptance criteria satisfied. Publication failed
  because Human-approved legacy-route planning advanced main to 1ead2b69f8c3ab68bee76e37414f013c2449de78
  after candidate 9b2ec4afbedc4ef342b3ea198c59abbb48938f74 forked from 528a1f6ae0a49f352ac7aa2fbf17920f418dd9db.
  Current Publisher classifies this clean divergence as FRESH_EXACT_REVIEW_REQUIRED
  and exposes only an ineligible recovery tree. Existing correction integration applies
  to open REMEDIATION findings, not an already PASS-reviewed PRIMARY. Brain must rediscover
  historical TASK-068/070/072, TASK-287/288, TASK-293/295 and TASK-315 exceptions
  and disconnected Publisher docs. Human now prioritizes a standing production solution,
  not another exceptional Git push, new recovery TASK per incident, unverified merge
  or additional verification scheduler.
assumptions:
- Fresh canonical main for authoring is dfa72166f96c980cdf1aff3cdf5bf254621c9773,
  a Human/Brain planning-only preemption following legacy-route planning main 1ead2b69f8c3ab68bee76e37414f013c2449de78.
  Bind AUTHOR_TASK expected main and normal CAS.
- RUN-326-001 immutable RESULT artifact SHA 5b5af1e276c9a1bb7aa0031952e1390fe607fc9c,
  reviewed candidate 9b2ec4afbedc4ef342b3ea198c59abbb48938f74 and REVIEW-326-001 decision
  b526cfdded14d74985af42fc4a14b7b54045b260 remain authoritative and unpublished; no
  modification or replay of historical artifacts.
- TASK-315 content-addressed correction integration and its exceptional one-time Human-authorized
  fast-forward/Publisher ALREADY_INCLUDED are historical precedents, not a standing
  publication bypass.
- TASK-070/072, TASK-287/288 and TASK-293/295 are independently reviewed source-preserving
  integration precedents and do not authorize reusing a prior verdict for a different
  SHA.
- The current canonical SELF_HOST_END_TO_END_FLOW_V1 is already the one generic Brain
  operational navigation entrypoint; this TASK owns a publication-specific leaf and
  section-level redirects, not another generic self-host authority.
- Current transitional verification policy for a newly authored TASK is minimum-sufficient-v2.
  VP-01 measurement is deferred, VP-02 implementation TASK-326 is REVIEW PASS but
  not published; no VP policy cutover is authorized.
- Human has prospectively approved LEGACY_REPOSITORY_DEFAULT_ROUTE for newly authored
  AIOS-renew TASKs, as recorded on canonical main. This TASK uses that explicit base
  affinity; it does not reinterpret existing origin-affine lineage.
- A new TASK requires a fresh explicit Human Executor/model/effort delegation; prior
  TASK-326 delegation cannot be inferred for TASK-327.
