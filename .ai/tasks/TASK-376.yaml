task_id: TASK-376
revision: 1
goal: 'Implement the next bounded Lean VP L1 engineering slice: a strictly versioned
  non-operative semantic TASK proof-intake validation seam inside the existing canonical
  TASK and VP-02 proof-contract modules. Explicitly bind full TASK acceptance to independently
  pinned proof-contract/mapping declarations without reinterpreting them as commands,
  and preserve all active V1/V2 behavior. This is preparation for independently authorized
  future L2/L3 Runtime core, not KA-01 production activation.'
problem: 'TASK-373 published read-only L1 baseline/readiness, TASK-374 published KA-01
  v1.1 acyclic activation, and TASK-326/TASK-328 already provide offline proof contract
  and intra-RUN foundations. Canonical TASK parsing still admits only V1/V2 command-driven
  verification: placing semantic proof IDs in verification.required could send noncommands
  to a command runner. The missing L1 seam is an explicit version-aware, bounded TASK-to-reviewed-proof
  declaration intake that reuses the existing VP-02 validator without changing production
  admission, scheduling, evidence or human authority.'
assumptions:
- Canonical main at authoring is ac06a509b4b984b17b0275a345c1d72de11bcf96, the reviewed/published
  TASK-374 candidate, with TASK-373 already published as L1 readiness only. The unique
  canonical roadmap NEXT remains Lean VP; TASK-375 is a separate published GitHub
  Actions infrastructure slice, not a Lean VP completion or replay.
- KA-01 v1.1 B.2/D.1 requires future explicitly versioned TASK semantic proof obligations,
  reviewed deterministic mapping and complete acceptance with independent Human per-RUN
  activation after actual L1-L3 engineering. TASK-376 is preactivation and by itself
  cannot establish G3, G6, measured VP-01, full L1, L2 or L3.
- Existing src/aios_renew/task.py parse_task/validate_task admits exact V1/V2 verification
  commands and rejects extra TASK fields. src/aios_renew/proof_coverage_contract.py
  already validates proof-coverage-v1, proof-mapping-v1 and complete explicit mapping
  using caller-supplied immutable pins; its labels/digests alone never authenticate
  original Git/review sources.
- Future authentic reviewed contract/mapping sources and an admitted future-version
  policy do not yet exist for a real TASK; tests must use explicitly synthetic fixtures.
  This work must expose the trusted caller/currentness boundary rather than self-certify
  authority or register a new active policy.
- Prospective TASK_AUTHORING semantic audit uses canonical tca-1 v1 digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2.
  The current Human instruction selects roadmap continuation only, not Executor/model/effort,
  deployment opt-in or finite runtime budgets. Authored return affinity is LEGACY_REPOSITORY_DEFAULT_ROUTE.
