non_goals:
- No current production TASK policy change, new admission route, scheduler, preterminal
  checkpoint, feedback loop, Runtime verification modification or KA-01 activation.
  Existing parse_task/validate_task and V1/V2 command behavior remain exactly unchanged.
- No second TASK parser file, duplicate semantic proof validator, issuer/service/credential,
  remote read, evidence DB, generic router, independent proof scheduler, additional
  Reviewer/Publisher or automatic correction.
- No treating raw client-supplied provenance, reviewer labels, self-declared digest
  or validated declaration as authenticated source, reviewed semantic adequacy, actual
  evidence validity, Runtime verification PASS or production eligibility.
- No mutation of frozen Kernel v0.1, historic TASK/RESULT/FAILURE/REVIEW/REPAIR, existing
  TASK-326/328 semantic contract, roadmap, Human authority decisions or downstream
  dependency pins.
- No measured speedup, VP-01 closure, VP-06/VP-07 conformance, live future-version
  tasks or full suite.
constraints:
  hard:
  - Reuse the existing canonical TASK parser module and VP-02 proof-contract/mapping
    validator. Introduce only an explicit non-operative versioned semantic intake
    API; ordinary parse_task/validate_task must retain V1/V2 acceptance, rejection,
    command semantics and historical replay exactly. Neither new policy nor future
    semantic reference may be implicitly selected, routed into verification.required,
    or registered as a live policy.
  - The future intake takes exact independently supplied TASK id/revision/complete
    acceptance IDs, an explicit closed schema/version identity, proof contract and
    independently pinned mapping identity. Compose existing proof-coverage-v1/proof-mapping-v1
    validation for all obligation and evidence-condition distinctions without a duplicate
    semantic-mapping algorithm or heuristically guessed proof descriptions.
  - Pure bounded deterministic read-only output must distinguish a complete structural
    declaration from independently authenticated Git/author/reviewer provenance, semantic
    proof adequacy, actual applicability, Runtime PASS and production eligibility.
    Caller-owned trusted source/currentness/authentication checks are necessary later
    and cannot be replaced by a self-certified boolean, string, hash or review label.
  - Reject unsupported/mixed versions, extra/duplicate/missing fields, wrong TASK/revision/acceptance,
    stale/different candidate SHA or pins, incomplete/conflicting mapping, command-shaped
    semantic substitution, unbounded/ambiguous data and improper consolidation of
    different fixtures, workers, profile, integration, ordering or toolchain conditions.
  - No new production policy registration, Runtime/verification caller, proof-run
    invocation, file/network/subprocess/Git lookup, clock access, persistent cache
    or metadata state. Preserve historical Task shape, current authoring minimum-sufficient-v1
    behavior, return-affinity semantics and the separate Runtime/Reviewer/Publisher
    boundaries.
  - Provide a short bounded L1 proof-intake document naming exactly the declared source
    inputs/outputs, required authenticated caller/pin/authority context, remaining
    production version admission/authentication and L2/L3 gaps, L1/VP-01 measured
    unknown, and explicit KA-01 NOT_ACTIVATED/G3/G6 boundaries. Do not claim this
    task completes all L1 or authorizes any future RUN.
  - Use only one minimum-sufficient-v1 direct focused verification command covering
    current TASK and VP-02 contract tests; do not rerun full suite or change unrelated
    tests. Restrict modifications to the five listed paths.
acceptance:
- id: AC1
  condition: The existing TASK and VP-02 modules expose an explicit strictly versioned
    future semantic proof-intake validation API that remains non-operative and cannot
    alter normal parse_task/validate_task acceptance, rejection, active V1/V2 policy
    selection or command execution semantics.
- id: AC2
  condition: For caller-supplied exact TASK id/revision and complete acceptance IDs,
    the intake requires a separately pinned proof contract and reviewed-mapping identity
    and validates complete one-to-one declared obligations through existing proof-coverage-v1/proof-mapping-v1
    semantics, preserving distinct full proof conditions and provenance.
- id: AC3
  condition: The intake returns a bounded deterministic typed declaration/readiness
    result with immutable source/pin identities that never equates structural coverage
    to authenticated source/review authority, evidence validity, semantic adequacy,
    canonical verification PASS or permission to activate or execute a new policy.
- id: AC4
  condition: Malformed, duplicate, missing, extra, stale, wrong-TASK/cross-source,
    swapped-pin, incompatible-version, ambiguous-mapping and command-shaped semantic
    substitution inputs fail closed, including superficially matching population but
    different worker, fixture, integration or ordering conditions.
- id: AC5
  condition: Historical TASK V1/V2 corpus, ordinary command-verification parsing,
    current verification policy/error behavior, return affinity and existing VP-02
    public validation API remain behaviorally compatible, and current Runtime admission/execution
    cannot be changed through the new non-operative path.
- id: AC6
  condition: Focused deterministic regression tests cover a valid synthetic future
    declaration, stable equivalent declaration order, supported and unsupported versions,
    hostile/stale/partial source and mapping substitutions, missing independently
    supplied pins and boundary traps against filesystem, Git, network, process and
    proof execution side effects.
- id: AC7
  condition: A L1 proof-intake document clearly separates this actual bounded validation
    capability from still-unavailable authenticated canonical source integration,
    approved future production version admission, remaining L1/VP-01, L2, L3 and KA-01
    G3/G6 obligations, with no claimed production activation, test savings or automatic
    roadmap advancement.
- id: AC8
  condition: Only the five authorized paths are changed, and no new Runtime proof
    scheduler, lifecycle authority, persistent ledger, historical mutation or roadmap/downstream
    change is introduced.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_task.py tests/test_proof_coverage_contract.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
