task_id: TASK-103
revision: 2

goal: >
  Make prospective cumulative remediation independent of TASK revision while preserving
  exact correction lineage, using a fresh revision-2 lifecycle after the immutable
  non-repairable revision-1 execution failure.

problem: >
  Current remediation admission uses TASK revision as a gate for cumulative execution-base
  resolution, which can make a revision-1 sibling correction start from an older reviewed
  candidate instead of the current correction tip. TASK-103 revision 1 did not reach an
  implementation candidate: RUN-103-001 was admitted on the authored base and failed during
  Executor execution when Antigravity quota was exhausted; Runtime recorded no committed
  changed files and classified the failed candidate non-repairable. Revision 2 preserves that
  failure as historical evidence and establishes a fresh current TASK lifecycle for the same
  generic hardening outcome without rewriting, repairing, or reclassifying RUN-103-001.

assumptions:
  - Canonical main at revision-2 authoring is 7d0bbcbce4b1bfeaa47634f9069a8ae9ac44930c.
  - TASK-099 revision 2 defines the published cumulative correction contract.
  - TASK-103 revision-1 RUN-103-001 is an immutable admitted RUN FAILURE caused by Executor quota exhaustion; its failed HEAD equals its base SHA, its committed changed-files set is empty, and it does not establish revision-2 completion.
  - TASK-101 remains blocked and is not modified by this task.
  - Runtime resolves and binds the exact current revision and canonical execution base at admission; this TASK does not predeclare a future execution SHA.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/tasks/TASK-099.yaml
    - .ai/tasks/TASK-101.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/correction_preflight.py
    - tests/test_operator.py
    - tests/test_operator_correction_preflight.py
    - tests/test_operator_unified_state.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - tests/test_operator_correction_preflight.py
    - tests/test_operator_unified_state.py

non_goals:
  - Rewrite, delete, relabel, retry, repair, recover, or declare successful TASK-103 revision-1 RUN-103-001 or its FAILURE artifact.
  - Modify TASK-101 implementation or historical artifacts.
  - Change review, correction-frontier, publication, Executor-selection, verification-ownership, retry, routing, or integration authority.
  - Backfill historical remediation artifacts with prospective cumulative metadata.
  - Add a planner, autonomous correction loop, automatic merge, rebase, reroute, or fallback.

constraints:
  hard:
    - TASK-103 revision-1 lineage remains immutable historical evidence and cannot be reused as revision-2 implementation completion or verification evidence.
    - Prospective cumulative remediation must be selected from canonical correction lineage and outstanding-frontier state, never from TASK revision number.
    - Original semantic predecessor identity and cumulative execution-base identity must remain distinct; cumulative continuation must not overwrite the selected finding's original source RUN, REVIEW, finding id, or reviewed SHA.
    - A later sibling correction must start from the exact canonical cumulative correction tip so every already reviewed correction remains an ancestor of the new candidate.
    - Invalid, missing, ambiguous, stale, non-descendant, or integration-required cumulative state must fail closed before RUN creation or Executor invocation and must not fall back to the older reviewed candidate.
    - Existing historical remediation artifacts without cumulative execution-base metadata remain readable under their established legacy interpretation; absence of prospective metadata must not be guessed into cumulative meaning.
    - Correction Preflight, Unified State, and execution must agree on the same cumulative execution base for prospective remediation regardless of TASK revision.
    - >
      Existing authority boundaries remain unchanged: Brain authors semantics, exactly one
      Executor owns implementation, Runtime owns admission and verification, and Reviewer
      owns semantic judgment.
    - No new planner, selector, frontier authority, lifecycle reducer, retry, reroute, fallback, merge, or rebase behavior is introduced.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-103 revision-1 RUN-103-001 remains immutable historical failure evidence and only
      revision-2 admitted RUN/RESULT/EVIDENCE may establish implementation completion for
      this revision.
  - id: AC2
    condition: >
      A current TASK revision-1 fixture with an outstanding sibling after a reviewed
      correction resolves that sibling from the exact cumulative correction tip while
      retaining its original semantic predecessor identity.
  - id: AC3
    condition: >
      The admitted prospective remediation RUN binds Run.base_sha and its persisted
      execution-base identity to the cumulative tip, and the resulting candidate preserves
      every prior reviewed correction as an ancestor.
  - id: AC4
    condition: >
      A first correction whose cumulative tip is still its semantic source candidate remains
      behaviorally compatible with the existing prospective remediation path.
  - id: AC5
    condition: >
      Invalid, ambiguous, missing, non-descendant, stale, or integration-required cumulative
      state fails closed before Executor invocation without falling back to the older
      reviewed candidate.
  - id: AC6
    condition: >
      Historical remediation artifacts without cumulative metadata retain their established
      interpretation without rewrite, backfill, or revision-number heuristics.
  - id: AC7
    condition: >
      Correction Preflight, Unified State, and execution report or consume the same exact
      cumulative execution base for equivalent prospective lineage regardless of TASK
      revision.
  - id: AC8
    condition: >
      Existing correction, review, publication, verification, Executor-selection, and
      integration authority remain unchanged, and the implementation delta stays within the
      authorized files with focused regression coverage and no weakened, skipped, or deleted
      relevant tests.

verification:
  required:
    - python -m pytest tests/test_operator_correction_preflight.py tests/test_operator_unified_state.py -q
    - python -m pytest tests/test_operator.py -k "remediation" -q
