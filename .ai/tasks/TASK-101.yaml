task_id: TASK-101
revision: 3

goal: >
  Complete Performance Closure P5 from the current canonical main after publication
  of TASK-104 with one bounded read-only Human-facing surface that aggregates canonical
  transported RUN_OBSERVATION facts for explicitly selected TASKs, while preserving
  the newly published Brain Authoring Ingress and existing authority boundaries.

problem: >
  TASK-101 revision 2 produced PRIMARY candidate
  27ae986e1d4fac876c538c7a41d8bf2cd50d4623 under RUN-101-004 and passed Runtime
  verification, but semantic review found F101-003: transported RESULT/FAILURE terminal
  identity was not fully bound to the validated RUN before coverage classification.
  A remediation artifact was authored but no remediation RUN was executed. The Human
  then explicitly prioritized TASK-104, which is now semantically reviewed PASS and
  published at cdd230fedbb332f4e13a81a9607fea23976de36d. The revision-2 candidate and
  current main diverge from merge base 78969996f2ac8bdf1dbf54f1c9b352d2b5cee3ca,
  so continuing the revision-2 correction would create work that cannot be safely
  fast-forward published. Revision 3 therefore establishes one fresh current-main P5
  lifecycle while retaining revision-1/revision-2 lineage as immutable historical
  evidence and carrying the F101-003 semantic requirement into the fresh contract.

assumptions:
  - Canonical main at revision-3 authoring is cdd230fedbb332f4e13a81a9607fea23976de36d.
  - TASK-104 revision 1 is semantically reviewed PASS and published at that exact main.
  - Brain Authoring Ingress behavior introduced by TASK-104 is canonical behavior that
    shared Operator and review-transport changes must preserve.
  - TASK-101 revision-1 and revision-2 RUN, RESULT, REVIEW, REMEDIATION and candidate
    refs remain immutable historical evidence and do not establish revision-3 completion.
  - RUN-101-004 reviewed candidate is 27ae986e1d4fac876c538c7a41d8bf2cd50d4623,
    REVIEW-101-004 is CHANGES_REQUIRED with F101-003, and its authored remediation has
    no admitted remediation RUN.
  - The revision-2 candidate diverges from current main and must not be automatically
    merged, rebased, cherry-picked, or published as revision-3 implementation.
  - TASK-046 owns RUN_OBSERVATION semantics and TASK-100 owns soft_budget semantics.
  - Missing historical observation sidecars remain valid absence and are never inferred.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/tasks/TASK-046.yaml
    - .ai/tasks/TASK-100.yaml
    - .ai/tasks/TASK-103.yaml
    - .ai/tasks/TASK-104.yaml
    - .ai/tasks/TASK-101.yaml
    - src/aios_renew/run_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/authoring_ingress.py
    - tests/test_run_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
  modify:
    - src/aios_renew/performance_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_performance_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py

non_goals:
  - Rewrite, delete, relabel, merge, rebase, repair, recover, publish, or otherwise
    mutate TASK-101 revision-1 or revision-2 lineage, including F101-003 remediation.
  - Treat revision-1 or revision-2 verification, RESULT, REVIEW, or remediation metadata
    as revision-3 completion evidence.
  - Merge, rebase, or cherry-pick the revision-2 candidate by Runtime authority.
  - Change TASK-104 Brain Authoring Ingress semantics or its four-operation authority.
  - Change TASK-103 cumulative-remediation semantics or correction-frontier authority.
  - Change RUN_OBSERVATION production, persistence, transport, Dispatcher budgets,
    Runtime verification, or terminal truth.
  - Add a database, daemon, background collector, scheduler, dashboard server, planner,
    router, retry, fallback, Executor scoring, or autonomous policy.
  - Infer semantic PASS, missing telemetry, model identity, quota, monetary cost,
    or timeout cause.
  - Define recency from timestamps, RUN numbering, ref order, commit order, or
    filesystem order.
  - Reconstruct correction depth or create a second lifecycle reducer.
  - Rewrite or backfill historical artifacts.
  - Modify frozen Kernel v0.1 artifacts.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Revision-3 implementation must start from the exact canonical current main admitted
      by Runtime. Historical revision-1/revision-2 candidates may inform semantics but
      must not be merged, rebased, cherry-picked by Runtime authority, or treated as
      revision-3 implementation state.
    - >
      Expose `aios performance <TASK_ID> [<TASK_ID> ...]` with optional `--repo`; accept
      1-32 unique exact TASK identities and fail closed on malformed or duplicate selectors.
    - >
      Read only configured canonical upstream `aios/artifacts/<RUN>` and
      `aios/failure-artifacts/<RUN>` namespaces for selected TASKs; local Runtime state
      and ordering metadata must not select or substitute telemetry.
    - >
      Bound one snapshot to at most 256 distinct terminal RUN identities; overflow or
      competing RESULT/FAILURE identity for one RUN fails closed without truncation.
    - >
      Validate transported run.json and its terminal family through canonical validation
      semantics before observation coverage is classified. Unsupported Executor, malformed
      RUN identity, conflicting terminal family, or mismatched canonical lineage fails closed.
    - >
      RESULT and FAILURE terminal identity must be bound to the exact validated RUN before
      observation presence is classified. Conflicts in TASK identity/revision, Executor,
      base SHA, RESULT head/package identity, failed-head identity, candidate identity,
      or other canonical terminal bindings must fail closed even when observation.json
      is absent.
    - >
      When observation.json exists, validate it with the existing RUN_OBSERVATION contract
      and require exact RUN id, TASK id/revision, Executor, base SHA and terminal-kind binding.
      Missing observation.json is an explicit coverage gap; malformed or conflicting
      telemetry fails closed.
    - >
      Emit deterministic JSON format AIOS_PERFORMANCE_OBSERVATION version 1 with sorted
      TASK selectors, coverage, counts by operation/terminal kind/Executor/TASK revision/
      available soft-budget status, duration summaries, failure_rate, verification_share,
      and trusted token-usage sample coverage and totals.
    - >
      Duration p50/p95 use nearest-rank over exact non-null values: sort ascending and select
      one-based rank ceil(p*n/100); no interpolation or pre-rounding; empty samples return null.
    - >
      failure_rate is FAILURE observations divided by valid observations.
      verification_share is summed non-null verification_seconds divided by summed
      admitted_run_seconds across valid observations, treating unavailable verification
      duration as zero; return null when there are no valid observations or admitted time
      sums to zero. Token and soft-budget totals count only observations where those complete
      fields are present and report sample counts.
    - >
      Invocation is observational only: no RUN creation, Executor call, verification,
      Runtime write, Git ref/worktree/index mutation, publication, roadmap mutation,
      Unified State action change, or Brain Authoring Ingress authority change.
    - >
      Reuse the existing canonical Git transport/query boundary rather than introducing
      a second independent remote-state authority.
    - >
      Existing Human-facing Operator behavior outside the new performance surface remains
      unchanged, including `aios ingress`, recover-primary behavior, and TASK-103
      revision-neutral cumulative-remediation behavior.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Revision-1 and revision-2 TASK-101 lineage remains immutable historical evidence,
      and only a fresh revision-3 RUN admitted from current canonical main can establish
      revision-3 implementation completion.
  - id: AC2
    condition: >
      `aios performance` returns stable AIOS_PERFORMANCE_OBSERVATION v1 for 1-32 exact
      unique TASK selectors.
  - id: AC3
    condition: >
      Canonical remote terminal refs alone define the bounded snapshot; overflow,
      competing terminals, heuristic recency and local-state substitution are rejected.
  - id: AC4
    condition: >
      Transported RUN and RESULT/FAILURE terminal identity are canonically bound before
      coverage classification; present observations are exactly bound to RUN/TASK/
      Executor/base SHA/terminal kind, missing observations are explicit coverage gaps,
      and malformed or conflicting terminal lineage fails closed even when telemetry
      is absent.
  - id: AC5
    condition: >
      Coverage and counts by operation, terminal kind, Executor, TASK revision and
      available soft-budget status are deterministic and never fabricate historical
      classification.
  - id: AC6
    condition: >
      p50/p95, failure_rate and verification_share follow the exact defined formulas
      and empty samples return null.
  - id: AC7
    condition: >
      Token totals use only complete trusted token_usage groups with explicit sample
      coverage and no inferred or provider-specific usage.
  - id: AC8
    condition: >
      The surface is read-only and semantically inert with no execution, verification,
      publication, roadmap or lifecycle authority change; TASK-104 ingress behavior,
      recover-primary behavior and TASK-103 correction semantics remain unchanged.
  - id: AC9
    condition: >
      Delta stays within authorized files with focused regression coverage; no relevant
      tests are deleted, skipped, xfailed, duplicated or weakened.

verification:
  required:
    - python -m pytest tests/test_performance_observation.py tests/test_review_transport.py tests/test_authoring_ingress.py -q
    - python -m pytest tests/test_operator.py -k "performance or recover_primary or ingress" -q