task_id: TASK-101
revision: 2

goal: >
  Complete Performance Closure P5 with one bounded read-only Human-facing surface that
  aggregates canonical transported RUN_OBSERVATION facts for explicitly selected TASKs,
  from the current canonical main after publication of TASK-103.

problem: >
  TASK-046 and TASK-100 record per-RUN operational telemetry, but reproducing performance
  still requires manual inspection of individual terminal artifact refs. TASK-101 revision 1
  implemented and semantically reviewed the intended P5 surface, but its correction lineage
  could not be published safely: review metadata left one original F101-002 frontier identity
  outstanding, and the subsequent generic TASK-103 hardening advanced canonical main onto a
  branch that now diverges from the revision-1 cumulative correction tip. P3 correctly treats
  that state as integration-required and forbids automatic merge or rebase. Revision 2
  therefore establishes one fresh current-main P5 lifecycle without rewriting or publishing
  revision-1 lineage and preserves the validated semantic lessons learned from that lineage.

assumptions:
  - Canonical main at revision-2 authoring is 3b7d1aa3035e7cf2794867b788bc8197e2c9f29f.
  - TASK-103 revision 2 is semantically reviewed PASS and published at the current main.
  - TASK-101 revision-1 RUN, RESULT, REVIEW, REMEDIATION and candidate refs remain immutable historical evidence and do not establish revision-2 completion.
  - TASK-101 revision-1 cumulative tip 575a3d7f0060b5a74dba1b44059097355a7d8a64 diverges from current main and must not be auto-merged, rebased, or published as revision-2 implementation.
  - TASK-046 owns RUN_OBSERVATION semantics and TASK-100 owns soft_budget semantics.
  - Missing historical observation sidecars remain valid absence and are never inferred.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/tasks/TASK-046.yaml
    - .ai/tasks/TASK-100.yaml
    - .ai/tasks/TASK-103.yaml
    - src/aios_renew/run_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - tests/test_run_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/performance_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_performance_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py

non_goals:
  - Rewrite, delete, relabel, merge, rebase, repair, recover, publish, or otherwise mutate TASK-101 revision-1 lineage.
  - Treat revision-1 verification or semantic PASS metadata as revision-2 completion evidence.
  - Change TASK-103 cumulative-remediation semantics or correction-frontier authority.
  - Change RUN_OBSERVATION production, persistence, transport, Dispatcher budgets, Runtime verification, or terminal truth.
  - Add a database, daemon, background collector, scheduler, dashboard server, planner, router, retry, fallback, Executor scoring, or autonomous policy.
  - Infer semantic PASS, missing telemetry, model identity, quota, monetary cost, or timeout cause.
  - Define recency from timestamps, RUN numbering, ref order, commit order, or filesystem order.
  - Reconstruct correction depth or create a second lifecycle reducer.
  - Rewrite or backfill historical artifacts.
  - Modify frozen Kernel v0.1 artifacts.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-101 revision-1 lineage remains immutable historical evidence; only a revision-2
      admitted RUN with revision-2 RESULT and EVIDENCE may establish implementation
      completion for this revision.
    - >
      Revision-2 implementation must start from canonical current main and must not merge,
      rebase, cherry-pick by Runtime authority, or otherwise reinterpret the diverged
      revision-1 cumulative correction tip as the current execution base.
    - >
      Expose `aios performance <TASK_ID> [<TASK_ID> ...]` with optional `--repo`; accept
      1-32 unique exact TASK identities and fail closed on malformed or duplicate selectors.
    - >
      Read only configured canonical upstream `aios/artifacts/<RUN>` and
      `aios/failure-artifacts/<RUN>` namespaces for selected TASKs; local Runtime state and
      ordering metadata must not select or substitute telemetry.
    - >
      Bound one snapshot to at most 256 distinct terminal RUN identities; overflow or
      competing RESULT/FAILURE identity for one RUN fails closed without truncation.
    - >
      Validate transported run.json and terminal family through the existing canonical RUN
      validation semantics before observation coverage is classified. Unsupported Executor,
      missing or empty required RUN fields, malformed remediation wrappers, and conflicting
      terminal identity must fail closed even when observation.json is absent.
    - >
      When observation.json exists, validate it with the existing RUN_OBSERVATION contract
      and require exact RUN id, TASK id/revision, Executor, base SHA and terminal-kind
      binding. Missing observation.json is an explicit coverage gap; malformed or conflicting
      telemetry fails closed.
    - >
      Emit deterministic JSON format AIOS_PERFORMANCE_OBSERVATION version 1 with sorted TASK
      selectors, coverage, counts by operation/terminal kind/Executor/TASK revision/available
      soft-budget status, duration summaries, failure_rate, verification_share, and trusted
      token-usage sample coverage and totals.
    - >
      Duration p50/p95 use nearest-rank over exact non-null values: sort ascending and select
      one-based rank ceil(p*n/100); no interpolation or pre-rounding; empty samples return
      null.
    - >
      failure_rate is FAILURE observations divided by valid observations.
      verification_share is summed non-null verification_seconds divided by summed
      admitted_run_seconds across valid observations, treating unavailable verification
      duration as zero; return null when there are no valid observations or admitted time
      sums to zero. Token and soft-budget totals count only observations where those complete
      fields are present and report sample counts.
    - >
      Invocation is observational only: no RUN creation, Executor call, verification,
      Runtime write, Git ref/worktree/index mutation, publication, roadmap mutation, or
      Unified State/Human Surface action change.
    - >
      Reuse the existing canonical Git transport/query boundary rather than introducing a
      second independent remote-state authority.
    - >
      Existing Human-facing operator behavior outside the new performance surface remains
      unchanged, including recover-primary rendering, and TASK-103 revision-neutral
      cumulative-remediation behavior must not regress.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-101 revision-1 lineage remains immutable historical evidence, and only the
      revision-2 current-main RUN/RESULT/EVIDENCE lineage is used to establish completion.
  - id: AC2
    condition: >
      `aios performance` returns stable AIOS_PERFORMANCE_OBSERVATION v1 for 1-32 exact unique
      TASK selectors.
  - id: AC3
    condition: >
      Canonical remote terminal refs alone define the bounded snapshot; overflow, competing
      terminals, heuristic recency and local-state substitution are rejected.
  - id: AC4
    condition: >
      Transported RUN and terminal identity are canonically validated before coverage is
      classified; present observations are exactly bound to RUN/TASK/Executor/base SHA/
      terminal kind, missing observations are explicit coverage gaps, and malformed lineage
      or telemetry fails closed.
  - id: AC5
    condition: >
      Coverage and counts by operation, terminal kind, Executor, TASK revision and available
      soft-budget status are deterministic and never fabricate historical classification.
  - id: AC6
    condition: >
      p50/p95, failure_rate and verification_share follow the exact defined formulas and
      empty samples return null.
  - id: AC7
    condition: >
      Token totals use only complete trusted token_usage groups with explicit sample coverage
      and no inferred or provider-specific usage.
  - id: AC8
    condition: >
      The surface is read-only and semantically inert with no execution, verification,
      publication, roadmap or lifecycle authority change, while pre-existing Human-facing
      operator behavior and TASK-103 correction semantics remain unchanged.
  - id: AC9
    condition: >
      Delta stays within authorized files with focused regression coverage; no relevant tests
      are deleted, skipped, xfailed, duplicated or weakened.

verification:
  required:
    - python -m pytest tests/test_performance_observation.py tests/test_review_transport.py -q
    - python -m pytest tests/test_operator.py -k "performance or recover_primary" -q
