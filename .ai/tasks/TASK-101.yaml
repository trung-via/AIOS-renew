task_id: TASK-101
revision: 4

goal: >
  Complete Performance Closure P5 from the exact post-TASK-105 canonical main with one
  bounded read-only Human-facing surface that aggregates canonical transported
  RUN_OBSERVATION facts for explicitly selected TASK identities, while preserving the
  recovered Brain Authoring Ingress structural semantics and all existing authority
  boundaries.

problem: >
  TASK-101 revision 2 produced candidate 27ae986e1d4fac876c538c7a41d8bf2cd50d4623
  and passed Runtime verification. PRIMARY REVIEW-101-004 passed AC1-AC3 and AC5-AC9
  but found F101-003 under AC4: transported RESULT/FAILURE terminal identity was not
  fully bound to the exact validated RUN before observation coverage classification.
  Revision 3 carried that requirement into a fresh post-TASK-104 lifecycle. Its
  continuation RUN-101-006 preserved clean transportable candidate
  208242eb3e7cd329c05e05da3a1ea17eaf3cdb96, but execution terminated at the
  COMPLETION_GATE because the antigravity-minimax executor emitted an invalid
  write_journal tool call before canonical completion and verification. TASK-105 was
  then authored and published to recover the TASK-104 control-plane regression, and
  canonical main subsequently advanced again through roadmap reconciliation. Revision 3
  therefore cannot be directly repaired or published from its old base. Revision 4
  establishes one fresh current-main P5 lifecycle, preserves all prior lineage as
  immutable evidence, carries F101-003 forward explicitly, and may reuse still-valid
  semantic and implementation knowledge without treating any historical candidate as
  current implementation state or completion evidence.

assumptions:
  - Canonical main at revision-4 authoring is dba66f5a94049f6222a7d9c8ae4b6af7d1fa3473.
  - TASK-105 revision 1 is semantically reviewed PASS and published at
    3c39371632a07efceecb5ff5aa83892aeaca3579; the subsequent roadmap-only commit
    dba66f5a94049f6222a7d9c8ae4b6af7d1fa3473 selects TASK-101 revision 4 as NEXT.
  - TASK-105 restored REVIEW, REMEDIATION, and REPAIR predecessor-tree preservation,
    exact metadata-only delta validation, and fail-closed structural checks before
    control-plane ref publication. Those recovered ingress semantics are current
    canonical behavior and must not regress.
  - REVIEW-101-004 binds reviewed candidate
    27ae986e1d4fac876c538c7a41d8bf2cd50d4623 and records AC1-AC3 and AC5-AC9 PASS with
    only F101-003 outstanding under AC4.
  - RUN-101-006 is a revision-3 FAILURE from base
    4a97af4e465811b762c6c55fb5ef2a49fd0446ff. Its failed head
    208242eb3e7cd329c05e05da3a1ea17eaf3cdb96 is clean, transportable, repairable, and
    within TASK scope, but it has no authority to establish revision-4 completion.
  - Historical TASK-101 candidates and implementations may inform local Executor
    reasoning but are not current repository state, reusable RESULT/EVIDENCE for
    revision 4, or authorization for Git integration.
  - TASK-046 owns RUN_OBSERVATION semantics and TASK-100 owns soft_budget semantics.
  - Missing historical observation sidecars remain valid absence and are never inferred.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-046.yaml
    - .ai/tasks/TASK-100.yaml
    - .ai/tasks/TASK-103.yaml
    - .ai/tasks/TASK-104.yaml
    - .ai/tasks/TASK-105.yaml
    - .ai/tasks/TASK-101.yaml
    - src/aios_renew/run_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - src/aios_renew/authoring_ingress.py
    - tests/test_run_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
  modify:
    - src/aios_renew/performance_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_performance_observation.py
    - tests/test_review_transport.py
    - tests/test_operator.py

non_goals:
  - Rewrite, delete, relabel, repair, recover, publish, merge, rebase, cherry-pick, or
    otherwise mutate TASK-101 revision-1, revision-2, or revision-3 lineage.
  - Treat RUN-101-006, candidate 208242eb3e7cd329c05e05da3a1ea17eaf3cdb96, or any
    historical TASK-101 RESULT, verification, REVIEW, REMEDIATION, REPAIR, or candidate
    as revision-4 completion evidence.
  - Change TASK-105 Brain Authoring Ingress structural semantics, its four-operation
    authority, publication authority, or historical malformed incident refs.
  - Change TASK-103 cumulative-remediation semantics or correction-frontier authority.
  - Change RUN_OBSERVATION production, persistence, transport, Dispatcher budgets,
    Runtime verification, or terminal truth.
  - Add a database, daemon, background collector, scheduler, dashboard server, planner,
    router, retry, fallback, Executor scoring, or autonomous policy.
  - Infer semantic PASS, missing telemetry, model identity, quota, monetary cost, or
    timeout cause.
  - Define recency from timestamps, RUN numbering, ref order, commit order, or
    filesystem order.
  - Reconstruct correction depth or create a second lifecycle reducer.
  - Rewrite or backfill historical artifacts.
  - Modify frozen Kernel v0.1 artifacts.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Revision-4 implementation must start from the exact canonical current main admitted
      by Runtime. Historical TASK-101 candidates may inform reasoning but must not be
      merged, rebased, cherry-picked, applied as current implementation state, or treated
      as revision-4 RESULT/EVIDENCE.
    - >
      Expose `aios performance <TASK_ID> [<TASK_ID> ...]` with optional `--repo`; accept
      1-32 unique exact bare canonical TASK identities and fail closed on malformed or
      duplicate selectors. Caller-provided revision selector syntax such as TASK-ID:REVISION
      or TASK-ID@REVISION is not part of this Human-facing surface; TASK revision is derived
      only from validated canonical RUN lineage.
    - >
      Read only configured canonical upstream `aios/artifacts/<RUN>` and
      `aios/failure-artifacts/<RUN>` namespaces for selected TASKs; local Runtime state
      and ordering metadata must not select or substitute telemetry.
    - >
      Bound one snapshot to at most 256 distinct terminal RUN identities; overflow or
      competing RESULT/FAILURE identity for one RUN fails closed without truncation.
    - >
      Validate transported run.json and its terminal family through canonical validation
      semantics before observation coverage is classified. Unsupported Executor, malformed
      RUN identity, conflicting terminal family, or mismatched canonical lineage fails closed.
    - >
      Carry F101-003 explicitly: RESULT and FAILURE terminal identity must be bound to the
      exact validated RUN before observation presence is classified. Conflicts in TASK
      identity/revision, Executor, base SHA, RESULT head/package identity, failed-head
      identity, candidate identity, or any other canonical terminal binding must fail
      closed even when observation.json is absent.
    - >
      When observation.json exists, validate it with the existing RUN_OBSERVATION contract
      and require exact RUN id, TASK id/revision, Executor, base SHA and terminal-kind
      binding. Missing observation.json is an explicit coverage gap; malformed or
      conflicting telemetry fails closed.
    - >
      Emit deterministic JSON format AIOS_PERFORMANCE_OBSERVATION version 1 with sorted
      TASK selectors, coverage, counts by operation/terminal kind/Executor/TASK revision/
      available soft-budget status, duration summaries, failure_rate, verification_share,
      and trusted token-usage sample coverage and totals.
    - >
      Duration p50/p95 use nearest-rank over exact non-null values: sort ascending and
      select one-based rank ceil(p*n/100); no interpolation or pre-rounding; empty samples
      return null.
    - >
      failure_rate is FAILURE observations divided by valid observations.
      verification_share is summed non-null verification_seconds divided by summed
      admitted_run_seconds across valid observations, treating unavailable verification
      duration as zero; return null when there are no valid observations or admitted time
      sums to zero. Token and soft-budget totals count only observations where those
      complete fields are present and report sample counts.
    - >
      Invocation is observational only: no RUN creation, Executor call, verification,
      Runtime write, Git ref/worktree/index mutation, publication, roadmap mutation,
      Unified State action change, or Brain Authoring Ingress authority change.
    - >
      Reuse the existing canonical Git transport/query boundary rather than introducing
      a second independent remote-state authority.
    - >
      Existing Human-facing Operator behavior outside the new performance surface remains
      unchanged, including recovered TASK-105 `aios ingress` behavior, recover-primary
      behavior, and TASK-103 revision-neutral cumulative-remediation behavior.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-101 revisions 1-3 remain immutable historical evidence, and only a fresh
      revision-4 RUN admitted from current post-TASK-105 main with revision-4
      RESULT/EVIDENCE can establish implementation completion.
  - id: AC2
    condition: >
      `aios performance` returns stable AIOS_PERFORMANCE_OBSERVATION v1 for 1-32 exact
      unique bare TASK identities, rejects malformed/duplicate/revision-qualified
      selectors, and derives TASK revision only from validated canonical RUN lineage.
  - id: AC3
    condition: >
      Canonical remote terminal refs alone define the bounded snapshot; overflow,
      competing terminals, heuristic recency and local-state substitution are rejected.
  - id: AC4
    condition: >
      Transported RUN and RESULT/FAILURE terminal identity are canonically bound before
      coverage classification; present observations are exactly bound to RUN/TASK/
      Executor/base SHA/terminal kind, missing observations are explicit coverage gaps,
      and malformed or conflicting terminal lineage fails closed even when telemetry
      is absent.
  - id: AC5
    condition: >
      Coverage and counts by operation, terminal kind, Executor, TASK revision and
      available soft-budget status are deterministic and never fabricate historical
      classification.
  - id: AC6
    condition: >
      p50/p95, failure_rate and verification_share follow the exact defined formulas and
      empty samples return null.
  - id: AC7
    condition: >
      Token totals use only complete trusted token_usage groups with explicit sample
      coverage and no inferred or provider-specific usage.
  - id: AC8
    condition: >
      The surface is read-only and semantically inert with no execution, verification,
      publication, roadmap or lifecycle authority change; TASK-105 ingress structural
      behavior, recover-primary behavior, and TASK-103 correction semantics remain
      unchanged.
  - id: AC9
    condition: >
      Delta stays within authorized files with focused regression coverage; no relevant
      tests are deleted, skipped, xfailed, duplicated or weakened.

verification:
  required:
    - python -m pytest tests/test_performance_observation.py tests/test_review_transport.py tests/test_authoring_ingress.py -q
    - python -m pytest tests/test_operator.py -k "performance or recover_primary or ingress" -q
