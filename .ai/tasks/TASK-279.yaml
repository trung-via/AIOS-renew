task_id: TASK-279
revision: 1
goal: Implement H4A5 complete Brain-attention-family coverage by generalizing the
  reviewed H4A4 local wake intake from terminal RESULT/FAILURE events to one bounded
  selector-only attention contract covering every approved attention family, while
  preserving durable lane semantics and keeping all semantic routing authority with
  fresh Brain Sync/Human/Brain.
problem: After TASK-278, durable local wake delivery, lane isolation, pre-send freshness,
  ambiguity holds and generation-safe bindings are published, but the production event
  grammar is still terminal RESULT|FAILURE only. Important conditions such as ingress
  rejection, dispatch rejection, pre-AIOS operational failure, review follow-up, correction-authoring
  rejection, publication failure/success requiring planning, and canonical staleness
  can therefore require Human/Brain attention without entering the same durable exact-chat
  wake path. H4A5 must close that coverage gap with deterministic family identities
  and exact source selectors, while preventing ordinary progress signals or transport
  metadata from becoming semantic next-action authority.
assumptions:
- TASK-278 reviewed publication at a874675fca0f761f1fa6719e5ef7d79c5f003692 established
  the H4A4 durable wake/lane contract and its exact browser/privacy guards.
- Canonical roadmap selects H4A5 as the unique NEXT and Human binds TASK-279 revision
  1 with Codex GPT-6.1 Sol xhigh for the entire task lifecycle.
- Existing Operational Receipt v2 artifacts are subordinate operational evidence and
  may identify dispatch/pre-AIOS boundaries, but they are not canonical RUN/FAILURE
  truth.
- Canonical terminal RESULT/FAILURE attention remains a valid existing family source
  and must be preserved without semantic regression.
- H4B regular-Chat Brain resume remains a later milestone; TASK-279 ends at complete,
  durable, selector-only attention delivery coverage.
