task_id: TASK-074
revision: 1

goal: >
  Implement A3 Remote Status / Approval Surface as a subordinate outer-automation
  capability for AIOS-renew. Allow an authorized remote Human/Brain to inspect one
  existing A2 dispatch through a bounded read-only status surface and to record Human
  approval for one exact already-authored canonical REMEDIATION lineage, while adding no
  execution, review, verification, retry, correction, reconciliation, or publication
  authority. Preserve A1/A2 wakeup semantics, TASK-071 RUN namespace/recovery behavior,
  TASK-072 publication behavior, and the frozen Kernel authority boundaries.

problem: >
  A1 and A2 now let an authorized remote Human/Brain wake one canonical PRIMARY on the
  designated persistent self-hosted runner with durable dispatch identity and at-most-once
  attribution. After dispatch, however, the Human still lacks a bounded repository-native
  remote surface for reading useful execution state without remote desktop/log inspection.
  Likewise, when semantic review has already produced one canonical CHANGES_REQUIRED
  finding and exact REMEDIATION branch, Human approval still has to be carried manually
  outside the repository-native outer automation. The roadmap reserves these gaps for A3.
  A3 must expose observation and record exact Human authorization only; it must not
  reconcile dispatch state by mutation, execute a correction, select an Executor, create
  review/remediation semantics, or become an A6 review-to-remediation wakeup mechanism.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-074 authoring is
    7c0bd5066dbb07ee6d2c3398721c1a54ecd9bec6 and contains published TASK-073 A2
    integration plus TASK-071 and TASK-072 behavior.
  - >
    TASK-066 remains authoritative for the self-hosted GitHub Actions security boundary:
    workflow_dispatch only, dedicated [self-hosted, windows, x64, aios-renew] runner,
    persistent AIOS_REPO_ROOT, read-only GitHub permissions, no actions/checkout, no
    workflow-owned synchronization/verification, and no newly injected repository
    credential.
  - >
    TASK-068 semantics as integrated by TASK-073 remain authoritative for dispatch
    identity, repository-local .git/aios dispatch state, at-most-once PRIMARY delegation,
    duplicate replay, and observational crash attribution. A3 may read this state but
    must not mutate or reconcile it merely to answer status.
  - >
    TASK-071 remains authoritative for canonical remote RUN namespace/collision behavior
    and recover-primary; TASK-072 remains authoritative for current-control publication
    and integration-required classification. A3 has no authority to alter either.
  - >
    Canonical REVIEW and REMEDIATION artifacts already exist before A3 approval is
    recorded. A3 approval is Human authorization bound to an exact immutable correction
    lineage; it is not a semantic REVIEW verdict, implementation evidence, or execution
    event.
  - >
    Repository-local .git/aios state on the persistent runner is suitable for bounded
    operational authorization/observation records, but such records are subordinate to
    canonical TASK/RUN/RESULT/FAILURE/REVIEW/REMEDIATION/REPAIR truth and are not product
    worktree artifacts.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-066.yaml
    - .ai/tasks/TASK-068.yaml
    - .ai/tasks/TASK-071.yaml
    - .ai/tasks/TASK-072.yaml
    - .ai/tasks/TASK-073.yaml
    - .github/workflows/aios-self-hosted-wakeup.yml
    - src/aios_renew/dispatch_reconciliation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_dispatch_reconciliation.py
    - tests/test_operator.py
    - README.md
  modify:
    - .github/workflows/aios-remote-status.yml
    - .github/workflows/aios-remote-approval.yml
    - src/aios_renew/remote_surface.py
    - src/aios_renew/dispatch_reconciliation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_remote_surface.py
    - tests/test_dispatch_reconciliation.py
    - tests/test_operator.py
    - README.md
    - docs/AIOS-ROADMAP.md

non_goals:
  - Change TASK, RUN, RESULT, EVIDENCE, FAILURE, REVIEW, REMEDIATION, REPAIR, or RUN_OBSERVATION schemas or semantic authority.
  - Implement A4 transport extraction, A5 evidence strengthening, A6 automated review-to-remediation wakeup, A7 autonomous Reviewer shadow mode, A9 zero-touch, or A10 scale.
  - Execute PRIMARY, REMEDIATION, REPAIR, direct-candidate acceptance, recover-primary, transport retry, canonical verification, publication, or a coding Executor from either A3 workflow or approval/status command.
  - Add an approve-and-run operation, select or infer an Executor as part of approval, author REVIEW/REMEDIATION, modify a finding, or turn approval into semantic PASS.
  - Mutate dispatch records, reconcile STARTED/IN_PROGRESS dispatch state, synthesize terminal state, acquire/release execution leases, retry/reroute an execution, or repair incomplete RUNs merely to answer status.
  - Expose raw Executor logs, raw verification logs, prompts, environment variables, credentials, filesystem secrets, repository credentials, or arbitrary repository paths through remote status.
  - Add a dashboard server, REST service, polling daemon, scheduler, queue, message broker, database, background AIOS process, bot-comment command surface, or additional model call.
  - Accept arbitrary Git ref, SHA, shell command, repository path, model, verification command, workflow file, or operation type from workflow-dispatch input.
  - Change the existing A1 wakeup workflow, TASK-071 recovery behavior, TASK-072 publisher, downstream repositories, or downstream dependency pins.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      A3 must expose two distinct repository-native workflow_dispatch surfaces: one for
      read-only dispatch status and one for exact Human remediation approval. They must
      remain separate from the existing A1 wakeup workflow and from one another; no
      generic operation/router input may select arbitrary remote actions.
    - >
      Both A3 workflows must preserve the A1 host/security boundary: only the designated
      [self-hosted, windows, x64, aios-renew] runner, persistent AIOS_REPO_ROOT from
      repository configuration, read-only GitHub contents permission, no actions/checkout,
      no fresh workflow-owned worktree, no dynamic runner, no GitHub-hosted fallback, and
      no newly injected GitHub write credential into AIOS or any Executor process.
    - >
      The remote status workflow accepts exactly one semantic input: bounded dispatch_id.
      The status surface must read and validate the existing A2 dispatch record and may
      observe already-existing local canonical RUN/RESULT/FAILURE/Operator-lock facts only
      to report bounded operational state. It must not write the dispatch journal, invoke
      A2 reconciliation mutation, execute transport, or change any canonical/local
      execution state.
    - >
      Status output must be an allowlisted bounded summary sufficient for remote Human
      decisions, including dispatch identity/request binding, stored dispatch status,
      attributable RUN id when present, and observed RUN terminal/incomplete/conflict
      classification when deterministically knowable. It must not emit raw logs, prompts,
      credentials, environment values, arbitrary file contents, or implementation paths.
    - >
      The remote approval workflow accepts exactly source RUN id plus finding id as Human
      correction selectors. Executor, TASK id/revision, REVIEW id, reviewed SHA, action,
      REMEDIATION path/ref/SHA, repository path, and command are not workflow inputs; they
      must be derived and validated from exact canonical lineage or fixed repository
      configuration. GitHub actor attribution must reach the approval boundary as data,
      not shell source.
    - >
      Approval must resolve the exact canonical remote remediation ref corresponding to
      the requested source RUN and finding before persisting authorization. The resolved
      source RUN/TASK revision, RESULT head, REVIEW verdict/finding, REMEDIATION identity,
      reviewed_sha, action, and exact remediation ref commit SHA must form one
      self-consistent lineage. An unrelated same-name finding in another TASK/RUN must
      have no effect; the matching lineage must fail closed if missing, malformed,
      conflicting, stale, or ambiguous.
    - >
      A persisted approval must live only under repository-local .git/aios operational
      state and bind at minimum source_run_id, TASK id/revision, REVIEW id, finding id,
      action, reviewed_sha, exact canonical remediation ref identity and commit SHA, plus
      attributable Human approver identity from the dispatch event. It is authorization
      evidence for a future separately gated execution boundary, not RESULT/EVIDENCE,
      REVIEW, publication proof, or product state.
    - >
      Approval persistence must be deterministic, path-safe, and replay-safe. Repeating
      approval for the same exact immutable remediation lineage must not create conflicting
      authority. If the canonical remediation ref later points to different content/SHA,
      an older approval must not authorize that changed lineage; new Human approval is
      required for the new exact SHA.
    - >
      Recording approval must invoke zero coding Executors and perform zero canonical
      verification commands. It must not execute, schedule, retry, reroute, publish,
      repair, remediate, recover, or transport anything. A3 ends after durable exact
      authorization is recorded and reported.
    - >
      Existing direct aios run/wakeup/remediate/repair/recover-primary/transport and
      publication behavior must remain semantically unchanged. A3 may add bounded
      Human-facing status/approval operator surfaces only; those surfaces must not become
      alternate execution paths or bypass existing admission/review/correction authority.
    - >
      README must document the remote status and approval workflows, exact input meanings,
      security boundaries, approval staleness-on-remediation-SHA-change, and the fact that
      approval alone performs no correction execution. docs/AIOS-ROADMAP.md may mark A3
      DONE only as part of this implementation candidate becoming semantically reviewed
      PASS and published; A4/A5/A6/A7/A9/A10 remain separately gated.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      `.github/workflows/aios-remote-status.yml` is workflow_dispatch-only, accepts only
      dispatch_id, runs only on [self-hosted, windows, x64, aios-renew] with fixed
      AIOS_REPO_ROOT and read-only permissions, performs no checkout, and reaches exactly
      one bounded AIOS status command with workflow input passed as data.
  - id: AC2
    condition: >
      Status regressions prove an existing dispatch can be reported with its exact
      request binding, stored dispatch status, attributed RUN when present, and bounded
      observed RUN state without mutating the dispatch record or any RUN/RESULT/FAILURE
      state and without invoking PRIMARY, Executor, verification, reconciliation write,
      transport, correction, recovery, or publication.
  - id: AC3
    condition: >
      Missing/malformed dispatch identity or malformed local dispatch state fails closed,
      while status output remains allowlisted and contains no raw logs, prompts,
      credentials, environment values, arbitrary repository files, or path disclosure.
  - id: AC4
    condition: >
      `.github/workflows/aios-remote-approval.yml` is workflow_dispatch-only, accepts only
      source RUN id plus finding id, derives approver attribution from the trusted GitHub
      event context, preserves the same dedicated-runner/read-only/no-checkout boundary,
      and invokes exactly one bounded approval command with all event values passed as
      data rather than shell source.
  - id: AC5
    condition: >
      Approval regressions prove the requested source RUN/finding resolves exactly one
      canonical current remediation lineage and validates source TASK revision, RESULT
      head, CHANGES_REQUIRED REVIEW finding, REMEDIATION identity/action/reviewed_sha,
      and exact remediation-ref commit SHA before authorization is persisted. Historical
      same-name findings outside that source lineage are ignored, while malformed,
      missing, conflicting, stale, or ambiguous matching lineage fails closed.
  - id: AC6
    condition: >
      The persisted approval is path-safe repository-local .git/aios state that binds the
      exact immutable remediation SHA plus source RUN/TASK/review/finding/action/reviewed
      SHA and Human approver attribution. Exact repeated approval is idempotent, and an
      approval for an older remediation SHA cannot authorize a changed current ref.
  - id: AC7
    condition: >
      Neither status nor approval invokes a coding Executor, canonical verification,
      PRIMARY, REMEDIATION, REPAIR, recover-primary, transport retry, publication, or any
      automatic retry/fallback/reroute, and approval does not select an Executor or create
      an approve-and-run path.
  - id: AC8
    condition: >
      Existing A1/A2 wakeup behavior, direct aios run, TASK-071 RUN namespace/recovery,
      TASK-072 publication, review/correction semantics, and canonical artifact schemas
      remain behaviorally unchanged under deterministic regression coverage.
  - id: AC9
    condition: >
      README documents bounded remote status, exact Human approval semantics, security
      boundaries, SHA-bound staleness, and no-execution behavior; the roadmap records A3
      as completed by TASK-074 only when this candidate is published and keeps
      A4/A5/A6/A7/A9/A10 separately gated.

verification:
  required:
    - python -m pytest tests/test_remote_surface.py tests/test_dispatch_reconciliation.py tests/test_operator.py -q
    - git diff --check
