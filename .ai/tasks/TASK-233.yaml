task_id: TASK-233
revision: 1

goal: >
  Add one bounded, observational full-suite parallel-contention diagnostic that
  reproduces the RUN-231-003 failure surface without changing production
  semantics or selected worker policy. The diagnostic must run one exact-subject
  full-suite workers=12 observation, retain the complete bounded failure identity
  set and typed/sanitized cause facts, then replay only those exact failed nodeids
  once serially and once at workers=4 so Brain/Human can distinguish intrinsic
  correctness failures, broad parallel sensitivity, and failures that appear only
  in full-suite context before TASK-231 is resumed.

problem: >
  TASK-232 fixed two confirmed test-infrastructure defects and published at
  7f91c19b5a0035b9c1eef3a284e6bd7c0b4364d5. TASK-231 r2 was then rerun as
  RUN-231-003 from current planning main and again failed Runtime verification at
  workers=12 with 36 pytest failures. All selected-wrapper conformance facts
  remained true, but the current selected-wrapper failure diagnostic deliberately
  reports only the deterministic lowest 20 failure identities and discards pytest
  stdout/stderr. Therefore canonical evidence does not expose the complete failure
  population or typed failure causes needed to decide whether the remaining issue
  is intrinsic correctness, general parallel sensitivity, full-suite interaction,
  or host/resource contention. Re-running TASK-231 blindly would duplicate cost
  without resolving this uncertainty.

assumptions:
  - >
    Canonical main at authoring is edd7543b8fbd1f6fd41e02c04cd8f7f395e6f10b.
  - >
    RUN-231-003 is a canonical FAILURE for TASK-231 r2 at phase VERIFICATION with
    failure artifact 694a02c4acb4ab865df7df928e5590af3f5b1203 and failed candidate
    fa9d87df08e0346fff4a13d8dc891d3ed0480104.
  - >
    RUN-231-003 observed workers=12, distribution=load,
    max_worker_restart=0, collection count 2435, pytest elapsed 362.322714s,
    reported failure count 36, and all selected-wrapper conformance facts true.
  - >
    The current selected-wrapper diagnostic limit of 20 identities is an intentional
    bounded transport surface and must not be globally expanded merely for this
    investigation.
  - >
    Human observed Windows Defender activity during an n12 run. That is a
    noncanonical host-level hypothesis only. TASK-233 must neither claim Defender
    causality nor change Defender configuration, exclusions, PATH, host security
    policy, or machine-wide settings.
  - >
    Human selection of workers=12 remains planning state. TASK-233 is diagnostic
    only and cannot adopt, reject, rank, or automatically change the selected worker
    profile.
  - >
    Runtime owns canonical execution/verification evidence. Diagnostic observations
    are engineering evidence about the experiment, not a Reviewer verdict or
    automatic remediation decision.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-231.yaml
    - .ai/tasks/TASK-232.yaml
    - scripts/aios_parallel_full_suite.py
    - scripts/bp_v4_parallel_diagnostic.py
    - src/aios_renew/parallel_verification.py
    - tests/bp_v4_probe_plugin.py
    - tests/bp_v4_diagnostic_plugin.py
    - tests/test_bp_v4_parallel_diagnostic.py
    - tests/test_parallel_verification.py
    - tests/test_git_fixture_isolation.py
    - tests/test_hot_swap_conformance.py
    - tests/test_operator.py
  modify:
    - scripts/aios_full_suite_contention_diagnostic.py
    - tests/aios_full_suite_contention_plugin.py
    - tests/test_aios_full_suite_contention_diagnostic.py

non_goals:
  - >
    Modify production Runtime, Operator, publication/review lifecycle, frozen
    Kernel semantics, selected verification profile, TASK-231 implementation,
    pytest/xdist versions, or worker-count policy.
  - >
    Change scripts/aios_parallel_full_suite.py, src/aios_renew/parallel_verification.py,
    tests/bp_v4_probe_plugin.py, historical BP-V4 diagnostic grammar, or the
    selected-wrapper 20-identity transport bound.
  - >
    Run a workers 4/8/12/16 selection matrix, benchmark worker candidates, select
    or recommend another worker count, or automatically mutate roadmap state.
  - >
    Retry the full suite, fall back from workers=12, suppress/skip/xfail tests,
    inflate timeouts, or automatically repair any observed failure.
  - >
    Disable Microsoft Defender, add Defender exclusions, change antivirus policy,
    alter PATH/Git executable selection, or make any host-wide security/performance
    mutation.
  - >
    Persist raw pytest stdout/stderr, secrets, absolute private paths, complete
    exception messages, credentials, URLs, or unbounded failure payloads.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      Add one fixed no-argument diagnostic command:
      'python scripts/aios_full_suite_contention_diagnostic.py'. It must reject
      positional/options input before test execution.
    - >
      The diagnostic must require a clean exact Git commit and preserve the same
      subject SHA before and after every phase. Any subject mutation fails closed.
    - >
      Phase 1 must perform exactly one canonical collection followed by exactly
      one full-suite workers=12 execution using distribution=load and
      max_worker_restart=0. No second full-suite execution is permitted.
    - >
      The full-suite observer must retain every unique failure identity up to a
      hard maximum of 64 identities. If more than 64 unique failures are observed,
      the diagnostic fails closed as over-bound rather than truncating silently.
    - >
      Failure observations must be structured and bounded: normalized nodeid,
      pytest phase, worker/controller identity where applicable, exception type,
      stable message fingerprint, and only sanitized typed cause fields such as
      errno/winerror, Git diagnostic category, return code, or repository-test
      source locus. Raw exception messages, raw stderr/stdout and unsanitized
      absolute paths are forbidden.
    - >
      If the full-suite workers=12 phase reports zero failures and exits
      successfully, the diagnostic must stop without replay phases and report a
      deterministic FULL_N12_PASS observation. It must not reinterpret that single
      observation as TASK-231 success or worker-policy adoption.
    - >
      If the full-suite workers=12 phase reports one through 64 unique failed
      nodeids, Phase 2 must replay exactly that discovered nodeid set once serially
      and Phase 3 must replay exactly the same nodeid set once at workers=4 with
      distribution=load and max_worker_restart=0. No additional nodeids, retries,
      randomization, fallback profiles or data-dependent correction actions are
      allowed.
    - >
      Each replay phase must use its own isolated pytest temporary root and
      process-local Git fixture cache roots and must verify that the exact requested
      nodeid set was collected/executed once without duplicate or missing identities.
    - >
      The final JSON observation must mechanically expose, without remediation
      recommendation, the exact full-n12 failed nodeid set and the subsets that
      reproduce in serial and workers=4. A deterministic classification may use
      only these names: FULL_N12_PASS, SERIAL_REPRODUCIBLE,
      N4_PARALLEL_REPRODUCIBLE, FULL_SUITE_CONTEXT_DEPENDENT, or MIXED.
    - >
      Classification semantics are observational only:
      FULL_N12_PASS means the one full-n12 phase passed;
      SERIAL_REPRODUCIBLE means every full-n12 failed node also fails in isolated
      serial replay;
      N4_PARALLEL_REPRODUCIBLE means no node fails serially and at least one fails
      in isolated n4 replay;
      FULL_SUITE_CONTEXT_DEPENDENT means all full-n12 failed nodes pass both
      isolated serial and isolated n4 replay;
      MIXED covers all other bounded combinations.
    - >
      The command must exit zero when the diagnostic experiment itself completed
      faithfully, even when observed pytest phases contain test failures; malformed,
      over-bound, inconsistent, incomplete, unsafe or subject-mutating observations
      must exit nonzero.
    - >
      Existing selected-profile and BP-V4 behavior must remain byte-for-byte
      untouched outside the three new files. No file outside scope.modify may
      change.

acceptance:
  - id: AC1
    condition: >
      Repository contains the fixed no-argument full-suite contention diagnostic
      and a dedicated structured pytest observer without modifying existing
      production or selected-verification behavior.
  - id: AC2
    condition: >
      The diagnostic performs at most one full-suite n12 execution and, only after
      bounded failure discovery, exactly one serial and one n4 replay of the same
      failed-nodeid set, with no retry/fallback or worker-selection behavior.
  - id: AC3
    condition: >
      Failure capture is complete up to the hard 64-identity bound, typed,
      deterministic and sanitized, and fails closed for over-bound, malformed,
      unsafe, duplicate or inconsistent observations.
  - id: AC4
    condition: >
      Exact-subject stability, collection/execution identity and per-profile mutable
      root isolation are enforced across collection, full-n12, serial replay and n4
      replay.
  - id: AC5
    condition: >
      The final observation exposes full-n12 failures, serial reproductions, n4
      reproductions and only the allowed mechanical classification without
      attributing cause to Defender, choosing a worker count, or prescribing a
      remediation.
  - id: AC6
    condition: >
      Regression tests cover full-n12 pass, full-suite-context-dependent failure,
      serial-reproducible failure, n4-parallel-reproducible failure, mixed outcome,
      64-bound enforcement, unsafe cause rejection, exact replay identity and
      subject-change failure.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_aios_full_suite_contention_diagnostic.py
    - python scripts/aios_full_suite_contention_diagnostic.py
    - git diff --check
