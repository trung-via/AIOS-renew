task_id: TASK-065
revision: 1

goal: >
  Complete the existing RUN_OBSERVATION token-usage capability so each supported
  native Executor can report exact same-invocation token counters when its native
  machine-readable response exposes them, while preserving the current bounded
  observation schema, canonical ResultPackage semantics, one-Executor authority,
  and execution timing behavior.

problem: >
  TASK-046 revision 2 established optional RUN_OBSERVATION token_usage with the exact
  portable fields input_tokens, cached_input_tokens, and output_tokens, but current
  real RUN observations still record token_usage=null. The Runtime tracker validates
  trusted counters only when they are explicitly supplied from the already-authorized
  native invocation; current native adapters do not bridge provider-owned usage
  metadata into that provider-neutral observation boundary. As a result AIOS can now
  measure Executor time accurately but still cannot measure real Executor token usage,
  preventing evidence-based comparison of time/token efficiency despite current native
  machine-readable interfaces exposing usage metadata. This missing bridge should be
  completed without a second model call, telemetry-specific network request, semantic
  artifact change, routing policy, or measurable increase in normal task latency.

assumptions:
  - >
    Canonical AIOS-renew main immediately before TASK-065 authoring is
    7412f872277243b1d06dd47d68ff28573050a4c6 and contains the semantically reviewed
    and published TASK-064 implementation.
  - >
    Kernel v0.1 remains frozen. TASK-065 is separately authorized operational
    observability hardening backed by real RUN observations with token_usage=null; it
    does not reinterpret frozen TASK/RUN/RESULT/EVIDENCE/REVIEW semantics.
  - >
    TASK-046 revision 2 remains authoritative for RUN_OBSERVATION identity, timing,
    persistence, transport, optional token_usage validation, and subordinate semantic
    authority. Its existing three-field token contract is retained rather than widened.
  - >
    TASK-059 revision 2 remains authoritative for direct native execution and avoidance
    of redundant executor work; TASK-060 and TASK-061 remain authoritative for native
    timing bounds and deterministic model defaults; TASK-064 remains authoritative for
    executor-free eligible NO_CHANGE verification continuations.
  - >
    Current supported native interfaces expose machine-readable token usage as part of
    the same native execution response/event stream. Their provider-specific field names
    and transport mechanics may differ and belong inside thin native adapter boundaries,
    not inside RUN_OBSERVATION semantics.
  - >
    Real canonical RUN-064-002 invoked a native Executor and completed successfully, but
    its RUN_OBSERVATION still records token_usage=null, demonstrating the remaining
    observability gap on current production paths.
  - >
    Executor-native token counters measure the coding Executor invocation only. Runtime
    verification commands and any application/provider API calls performed by those
    verification commands are separate resource domains and must not be merged into the
    RUN_OBSERVATION token_usage group.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-046.yaml
    - .ai/tasks/TASK-059.yaml
    - .ai/tasks/TASK-060.yaml
    - .ai/tasks/TASK-061.yaml
    - .ai/tasks/TASK-064.yaml
    - src/aios_renew/run_observation.py
    - src/aios_renew/dispatcher.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - tests/test_run_observation.py
    - tests/test_dispatcher.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_operator.py
    - README.md

  modify:
    - src/aios_renew/run_observation.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - tests/test_run_observation.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - README.md

non_goals:
  - Change TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, REPAIR, FAILURE, or RUN_OBSERVATION schemas or semantic authority.
  - Add token fields beyond the existing input_tokens, cached_input_tokens, and output_tokens group.
  - Record reasoning tokens, thinking tokens, cache-write tokens, total tokens, quota percentage, context percentage, monetary cost, provider billing totals, model identifiers, pricing, or rate-limit state.
  - Infer missing token usage from elapsed time, text length, pricing tables, session files, local history, logs, prose, heuristics, or model estimates.
  - Perform a second Executor/model invocation, usage endpoint request, session/history query, provider probe, or any telemetry-specific remote call.
  - Change Executor selection, model defaults, reasoning/effort defaults, native timeout/watchdog policy, mutation permissions, one-active-executor lease semantics, retry, fallback, reroute, or failover behavior.
  - Use token observations for automatic scoring, routing, model selection, quota budgeting, retry policy, publication, semantic review, or acceptance decisions.
  - Add a metrics database, analytics daemon, event bus, scheduler, planner, router, background collector, or new remote ref family.
  - Backfill or rewrite historical RUN_OBSERVATION, RESULT, FAILURE, review, or transport artifacts.
  - Count Runtime verification or downstream application/API token consumption as coding-Executor token usage.
  - Change canonical verification commands or run additional verification solely to measure telemetry.
  - Push from executor execution.

constraints:
  hard:
    - >
      Preserve the exact TASK-046 token_usage contract: the only portable counters are
      input_tokens, cached_input_tokens, and output_tokens; they remain an all-or-none
      group of exact non-negative integers with bool rejected and cached_input_tokens not
      exceeding input_tokens.
    - >
      Token usage may become available only from machine-readable metadata emitted by
      the same already-authorized native invocation represented by the RUN. No second
      model turn, provider request, session/history read, heuristic reconstruction, or
      telemetry-specific network operation is permitted.
    - >
      Provider-specific response/event parsing and field mapping must remain inside thin
      native adapter boundaries. RUN_OBSERVATION and other provider-neutral Runtime
      components must consume only the existing portable three-counter contract and must
      not learn provider event names, provider field names, or provider response schemas.
    - >
      Adapter-to-observation handoff must be subordinate operational plumbing only. A
      missing, malformed, partial, conflicting, overflowed, negative, boolean, or
      otherwise untrusted provider usage payload must result in token_usage remaining
      unavailable/null and must not change native execution success/failure, ResultPackage
      parsing, canonical verification, FAILURE taxonomy, or later semantic review.
    - >
      Native structural output and operational telemetry must remain independently
      bounded. Enabling machine-readable usage must not cause provider event metadata to
      enter ResultPackage, EVIDENCE, claims, handoff semantic content, or tracked product
      files; unexpected non-usage telemetry must be ignored unless already required by
      the native execution contract.
    - >
      Each admitted PRIMARY, REMEDIATION, and Executor-backed REPAIR still invokes at
      most one selected native Executor. TASK-065 must add zero model turns, zero retry or
      fallback calls, zero canonical verification commands, and zero mandatory remote
      round trips. Eligible TASK-064 verification-only NO_CHANGE continuations continue
      to invoke zero native Executors and therefore record no token usage.
    - >
      Existing Runtime timing remains authoritative and unchanged. Token extraction is
      local deterministic processing of already-returned native machine-readable data;
      telemetry capture or validation failure is fail-soft and cannot invalidate or
      replace an otherwise authoritative RESULT or FAILURE.
    - >
      A successful native invocation that exposes a complete trusted usage group must
      produce a RUN_OBSERVATION containing the exact mapped counters. If the same native
      invocation exposes usage while later adapter structural parsing or Runtime
      completion fails, any safely captured exact counters may remain observable, but
      their presence must never mask or alter the original failure.
    - >
      Additional provider-native usage dimensions not represented by TASK-046, including
      reasoning/thinking, cache-write, and aggregate-total counters, must be ignored for
      portable RUN_OBSERVATION rather than widening the schema or deriving one portable
      counter from another.
    - >
      Historical observations with token_usage=null or no observation sidecar remain
      canonical compatibility inputs. No migration, rewriting, synthetic fill, or
      retrospective estimation is allowed.
    - >
      README must state that RUN_OBSERVATION token_usage measures only the native coding
      Executor invocation, is optional operational telemetry, and is not equivalent to
      total task cost when Runtime verification or application code performs separate
      model/API calls.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Deterministic adapter regressions for each currently supported native Executor prove
      that a successful same-invocation machine-readable usage payload is mapped to the
      exact existing input_tokens, cached_input_tokens, and output_tokens contract while
      the structural ResultPackage remains unchanged in semantic content and validation.
  - id: AC2
    condition: >
      An admitted RUN using either supported native Executor and trusted same-invocation
      usage finalizes a RUN_OBSERVATION whose token_usage equals the exact native mapped
      counters, with no second native invocation or additional model turn.
  - id: AC3
    condition: >
      Missing usage, partial usage, malformed types, negative/bool counters, invalid cache
      relationships, conflicting usage records, unknown provider events, and unsupported
      extra provider counters all fail soft to unavailable/null telemetry without changing
      the authoritative native execution outcome or canonical ResultPackage.
  - id: AC4
    condition: >
      Regression coverage proves provider-specific usage/event field names are not parsed
      or referenced by run_observation.py and that the provider-neutral observation layer
      accepts only the existing portable TokenUsage contract.
  - id: AC5
    condition: >
      PRIMARY, REMEDIATION, and Executor-backed REPAIR paths retain one selected native
      invocation and their existing timing, mutation, verification, failure, transport,
      and semantic contracts; TASK-064 eligible verification-only NO_CHANGE continuation
      retains executor_invoked=false and token_usage unavailable.
  - id: AC6
    condition: >
      Native failure or later structural/completion failure with trusted usage available
      does not lose or reinterpret the original error; telemetry remains subordinate and
      cannot convert FAILURE to RESULT, suppress diagnostics, trigger retry, or create a
      replacement RUN.
  - id: AC7
    condition: >
      Existing historical RUN_OBSERVATION payloads with token_usage=null validate without
      migration, and observation persistence/transport remain byte-immutable and optional
      exactly as established by TASK-046.
  - id: AC8
    condition: >
      Tests prove token telemetry collection performs no second native process/model call,
      provider usage endpoint request, session/history read, or extra canonical
      verification command; usage extraction is local processing of the already-returned
      native machine-readable response.
  - id: AC9
    condition: >
      Frozen ResultPackage schema, RESULT/EVIDENCE validation, semantic REVIEW authority,
      model defaults, execution timeout/watchdog behavior, publication, and Executor
      selection/routing remain unchanged and contain no token telemetry authority.
  - id: AC10
    condition: >
      README documents the Executor-only token domain, optional/fail-soft semantics,
      historical-null compatibility, and the fact that verification/application API token
      use requires separate instrumentation rather than being merged into RUN_OBSERVATION.

verification:
  required:
    - python -m pytest tests/test_run_observation.py tests/test_codex_adapter.py tests/test_antigravity_adapter.py -q
    - git diff --check
