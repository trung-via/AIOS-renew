non_goals:
  - Complete, verify, review, publish, or otherwise resolve TASK-121 inside TASK-123.
  - Rewrite, delete, force-update, hide, or reinterpret the existing REPAIR-121-004 artifact or
    any other historical REPAIR, FAILURE, RESULT, REVIEW, REMEDIATION, or RUN artifact.
  - Automatically choose a new repair action from failure prose, provider errors, duration,
    token usage, candidate filenames, or model output. Supersession remains explicit
    Brain/Human semantic authority.
  - Permit supersession after a continuation RUN has been admitted, after terminal execution,
    or while correction execution state is ambiguous.
  - Convert REPAIR to REMEDIATION, PRIMARY, retry, reroute, failover, or a new lifecycle family.
  - Weaken failed-run identity, TASK revision, failed_head_sha, candidate, scope, duplicate-run,
    clean-worktree, ancestry, correction-preflight, Executor-selection, verification, review, or
    publication gates.
  - Add a generic mutable pointer service, database, queue, scheduler, watcher, retry loop,
    lifecycle router, or additional reasoning agent.
  - Change downstream repositories or dependency pins.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve every canonical REPAIR authorization as immutable history. Supersession must add
      a new canonical authorization record that binds the exact predecessor authorization SHA;
      it must never move, delete, rewrite, or force-update a historical authorization ref.
    - >
      At any observation point there must be exactly one deterministically resolvable current
      REPAIR authorization for a failed RUN. Legacy failed RUNs with only the existing single
      repair ref must continue to resolve exactly as before. Multiple competing successors,
      broken predecessor chains, revision gaps, or ambiguous current selectors fail closed.
    - >
      AUTHOR_REPAIR may supersede an existing authorization only when the request explicitly
      binds the exact currently resolved authorization SHA, the failed_run_id, TASK revision,
      failed_head_sha, and canonical FAILURE identity; the replacement must remain within the
      same failed RUN and original TASK authority. A stale predecessor SHA fails closed.
    - >
      Supersession is allowed only before any continuation RUN has been admitted for that failed
      RUN and only when canonical state still exposes AUTHOR_REPAIR or EXECUTE_REPAIR for that
      exact failure. Existing continuation, terminal correction execution, unresolved competing
      state, or ambiguous remote observation forbids supersession.
    - >
      Changing the repair action or instructions is explicit Brain/Human correction intent, not
      Runtime inference. Ordinary REPAIR validation still applies to the new authorization,
      including action-specific scope and constraints; supersession cannot widen TASK authority
      or introduce unrelated Human intent.
    - >
      Dedicated REPAIR wakeup and direct canonical observation must bind the exact current
      authorization SHA. Delivery using a superseded predecessor SHA must fail before a new RUN
      or Executor invocation. Duplicate delivery of the same current authorization remains
      idempotent under existing dispatch rules.
    - >
      Unified State, Correction Preflight, and Human-facing continuation must expose only the
      deterministically current authorization while preserving existing next_action values
      AUTHOR_REPAIR and EXECUTE_REPAIR. No new lifecycle family, planner action, or autonomous
      correction choice is introduced.
    - >
      A continuation RUN admitted from a superseding authorization must embed or otherwise bind
      that exact current authorization so later RESULT/FAILURE, review, and publication can
      validate the same immutable correction lineage. A later authorization revision cannot
      retroactively change an already-admitted RUN.
    - >
      Deterministic offline regressions must cover legacy single-authorization compatibility,
      valid one-step supersession, stale predecessor rejection, ambiguous/competing successor
      rejection, refusal after continuation admission, wakeup with superseded SHA rejection,
      idempotent replay of the current authorization, and preservation of historical artifacts.
    - >
      Include a RUN-121-004-equivalent regression proving that an existing legacy
      CONTINUE_IMPLEMENTATION authorization can be immutably superseded by a
      FINALIZE_CANDIDATE authorization before execution, after which the current selector is the
      new authorization and the predecessor remains independently observable.
    - >
      Durable Project Contract guidance must state that obsolete unexecuted REPAIR intent is
      superseded through canonical immutable authorization lineage rather than by rewriting the
      old ref, fabricating a new FAILURE, or executing known-wrong correction semantics merely
      to obtain a newer failure.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Canonical REPAIR authoring supports an explicitly bound superseding authorization for the
      exact same failed RUN while preserving the predecessor authorization immutably and
      retaining backward-compatible resolution for legacy single-authorization RUNs.
  - id: AC2
    condition: >
      Current authorization resolution is deterministic and unique; stale predecessor,
      competing successor, broken chain, ambiguous selector, or revision discontinuity fails
      closed without RUN creation or Executor invocation.
  - id: AC3
    condition: >
      Supersession is rejected once a continuation RUN exists or correction execution state is
      no longer safely pre-execution, and no path rewrites historical REPAIR artifacts.
  - id: AC4
    condition: >
      Unified State, Correction Preflight, dedicated REPAIR dispatch/wakeup, and operator repair
      admission all bind the same exact current authorization SHA and reject a superseded SHA
      before mutation or execution.
  - id: AC5
    condition: >
      A continuation RUN admitted from the superseding authorization preserves exact failed RUN,
      TASK revision, failed_head_sha, action, scope, and authorization identity through ordinary
      RESULT/FAILURE, review, and publication lineage without adding a new lifecycle family.
  - id: AC6
    condition: >
      Existing non-superseded CODE_FIX, CONTINUE_IMPLEMENTATION, NO_CHANGE, and
      FINALIZE_CANDIDATE behavior remains unchanged, including Executor requirements and Runtime
      verification semantics.
  - id: AC7
    condition: >
      A deterministic RUN-121-004-equivalent test preserves legacy
      REPAIR-121-004/CONTINUE_IMPLEMENTATION as historical evidence, authorizes an immutable
      FINALIZE_CANDIDATE successor before any continuation, resolves that successor as current,
      and proves the old selector can no longer dispatch execution.
  - id: AC8
    condition: >
      Focused regression verification and git diff checking pass with zero unresolved items and
      all implementation mutation remains inside the explicitly authorized files.

verification:
  required:
    - python -m pytest -q tests/test_authoring_ingress.py tests/test_operator.py tests/test_operator_unified_state.py tests/test_operator_correction_preflight.py tests/test_repair_dispatch.py tests/test_publication.py
    - git diff --check
