task_id: TASK-123
revision: 1

goal: >
  Add one bounded, immutable REPAIR-authorization supersession contract inside the existing
  REPAIR lifecycle so Brain/Human can replace an obsolete, never-executed repair strategy for
  the exact same failed RUN without rewriting historical authorization, fabricating a new
  FAILURE, or repeating implementation work. Preserve one current deterministic repair selector
  for execution while retaining every predecessor authorization as immutable canonical lineage.

problem: >
  TASK-122 is now semantically reviewed PASS and published at
  b5c200c5359669fb646ab985ee2991ec303c368f, adding FINALIZE_CANDIDATE for exact clean failed
  candidates whose structural ResultPackage was lost. RUN-121-004 is the concrete production
  case that needs that action: its failed candidate remains clean and transportable at
  c3d822c147e52bb85f2786d03f113fc78b8f8e67 and no RESULT or later RUN exists. However the
  failed RUN already has canonical REPAIR-121-004 at
  24a4729f80d0cc85e435875e32b9d8ecacc1c82f with action CONTINUE_IMPLEMENTATION, authored
  before FINALIZE_CANDIDATE existed. Current AUTHOR_REPAIR accepts only one canonical repair
  ref per failed RUN and rejects any conflicting authorization. Executing the obsolete repair
  would require a fresh committed mutation even though the desired recovery is now explicitly
  zero-mutation, while deleting or rewriting the old authorization would destroy immutable
  lineage. The system therefore needs a bounded way to supersede an unexecuted repair
  authorization without changing the failed RUN or repeating work.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    b5c200c5359669fb646ab985ee2991ec303c368f, the reviewed and published TASK-122 candidate.
  - >
    TASK-122 revision 1 is complete: RUN-122-002 produced candidate
    b5c200c5359669fb646ab985ee2991ec303c368f, semantic REVIEW PASS was canonicalized, and safe
    publication advanced main to that exact reviewed source.
  - >
    TASK-121 revision 2 remains incomplete. Canonical RUN-121-004 FAILURE is pre-verification,
    binds failed_head_sha c3d822c147e52bb85f2786d03f113fc78b8f8e67, and records a clean,
    repairable, transportable candidate with no outside-task-scope files.
  - >
    Canonical REPAIR-121-004 currently resolves to
    24a4729f80d0cc85e435875e32b9d8ecacc1c82f and action CONTINUE_IMPLEMENTATION. No canonical
    RESULT, semantic REVIEW, or continuation RUN exists after RUN-121-004.
  - >
    Existing REPAIR actions and TASK-111 dedicated REPAIR wakeup remain authoritative.
    TASK-122 adds FINALIZE_CANDIDATE but does not itself authorize rewriting or replacing an
    already-canonical repair authorization.
  - >
    Frozen Kernel v0.1 remains FROZEN. Brain/Human owns semantic correction choice; Runtime
    owns deterministic admission and verification; exactly one Executor owns execution HOW;
    Reviewer owns semantic judgment.

