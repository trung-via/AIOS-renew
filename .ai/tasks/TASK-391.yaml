non_goals:
- No production activation, G3/G6 consent, global Runtime policy replacement, default
  Executor hot-path change, automatic F_i routing, automatic retry/correction, C2
  code-mutation authorization, terminal-source reopening, additional RUN or new correction
  task/authorization.
- No new Human approval, budget, model, provider, Executor, profile, risk choice,
  timeout or lease generation derived from F_i/ACK/transport. A process-local lease
  cannot be promoted into a durable authoritative lease across restart.
- No new generic orchestration, lifecycle router, scheduler, independent lease registry/DB/ledger,
  ACK broker/queue, Reviewer or Publisher. No self-host workflow, GitHub Issue carrier,
  dispatch or wakeup rewrite.
- 'No fabricated positive REPAIR/REMEDIATION continuation based on PRIMARY F_i: correction-specific
  exact original authorization and authenticated native proof remain prerequisite.
  No raw log instructions, patch proposals, test weakening, semantic HOW from Runtime.'
- No mandatory broad base rerun or V2 gate, no synthetic live performance improvement/conformance,
  no L3-05 per-RUN consent semantics or L3-06 integrated G3 completion asserted from
  this slice.
- No changes to canonical roadmap, TASK lineage, KA-01 normative source, frozen Kernel,
  downstream pins or paths outside seven authorized modification files.
constraints:
  hard:
  - Keep one explicit prospective nondefault seam co-located with the existing same
    Runtime / Executor invocation owner. It must not call a second provider/adapter,
    dispatch a second workflow, create RUN/FAILURE/RESULT/REPAIR/REMEDIATION, or modify
    default V1/V2 operation. Retain existing frozen lease/Executor authority; only
    one legitimately admitted current RUN and its already selected native adapter
    may observe feedback.
  - Every candidate consumption attempt must fresh-authenticate current ACTIVE TASK/RUN/operation/base/current
    committed candidate, complete native reviewed coverage and original latest immutable
    K_i/F_i content/digest/raw/observer through published Runtime gates; no parse-only
    F_i, caller outcome, pasted SHA, stale first checkpoint, narrow PASS, altered
    proof population or changed mandatory conditions may authorize preparation or
    ACK.
  - Authenticate actual currently held same-RUN Executor via the existing RunLeaseRegistry
    holder identity and same adapter/session invocation, correct original executor/profile/model/effort
    when available, and unaltered scope. Holder absent, stale, released, replaced,
    cross-RUN, mismatched, after-execute, unknown or after-process-crash cannot assert
    LIVE. If such a live proof is not possible under a tested input, report bounded
    BLOCKED; never mint new persistent lease or assume journal ACK proves liveness.
  - Bound all proposed feedback receipt/consumption to exact K_i and F_i identities,
    strict closed typed schema and per-RUN protected owner/fence, single-attempt/single-consumption
    discipline. A local prospective positive adapter receipt must demonstrate real
    existing adapter/lease within the isolated test invocation only; production delivery
    and continuation remain NOT_AUTHORIZED pending L3-05/L3-06/G3/G6.
  - 'Duplicate delivery/ACK and replay are deterministic and effect-idempotent: authenticate
    current original record, preserve exact bytes/identity, never re-invoke Executor
    or spend twice. Conflicting repeated ACK, stale K_i/F_i, ambiguous interrupted
    callback/write, unknown receipt status, competing writer and cross-generation
    event STOP without deleting/repairing the original intent or creating a second
    state owner.'
  - 'Recheck stop conditions before feedback exposure and before any acknowledged
    C2 candidate acceptance: complete stable decisive native candidate FAIL and all
    required mapping, unchanged TASK/operation/scope/risk/semantics, current owned
    lease, monotone new committed descendant with causal verified progress, exact
    authorized proof/population, no same/old SHA or unrelated/empty delta, no repeated
    feedback, terminal exclusion, known resource accounting. For guard dimensions
    dependent on future Human consent or full token/budget data, emit explicit NOT_ESTABLISHED/BLOCKED
    instead of inferring PASS.'
  - STOP and terminal-exclusion behavior fail closed on ERROR/UNKNOWN/flaky/capture
    corruption, lease loss/crash, revoked/changed authorization, missing finite Human
    consent/budget, conflicting or duplicate delivery, no progress, exhausted resource
    limits, stale candidate/operation/worker/fixture, dirty source, or RESULT/FAILURE/terminal-intent.
    L3-04 need not terminalize a production RUN, but it must prevent reentry; any
    later terminal outcome belongs solely to existing Runtime once-only writer.
  - PRIMARY must stay the only presently supportable positive native F_i source unless
    separately authenticated operation-specific correction proof exists. REPAIR/REMEDIATION
    must not inherit PRIMARY-shaped binding or ACK; no new repair strategy, REMEDIATION
    finding selection or alternate Executor is made by the Runtime.
  - Typed public/result material may contain only authorized factual identities, guarded
    status/reason and necessary bounded source references. Do not surface raw log
    instructions, private paths, secrets, executable patch suggestions, model-selected
    HOW or made-up live lease/budget/progress facts. Strict size/count/depth and source
    authentication apply.
  - Use focused real-Git/native checkpoint and existing ExecutorBoundary/RunLeaseRegistry
    integration tests, testing true holder identity rather than affirmative mocked
    liveness. Include positive isolated same-active-holder feedback receipt plus negative
    wrong/released/stale holder, adapter substitution, original K/F tampering, duplicate/reentry,
    concurrent terminal/fence, crash/unknown, ERROR/UNKNOWN, no-progress, operation
    spoof, missing consent/budgets. Unchanged original F_i and K_i tests remain valid.
  - All changes remain within seven explicit modify paths. Include no default operator/hot-path
    wiring, no new orchestration, hidden metadata or workflow edits; preserve native
    fixed V1/V2 verification and existing direct dispatch/repair/remediation paths.
    Documentation must distinguish local prospective test demonstration from any actual
    production activation and name L3-05, L3-06, G3, G6, L4 obligations.
acceptance:
- id: AC1
  condition: One explicit nondefault, closed bounded prospective API uses the existing
    admitted ACTIVE RUN's Runtime and native ExecutorBoundary; it leaves normal PRIMARY/REPAIR/REMEDIATION
    dispatch, terminal RESULT/FAILURE and historical minimum-sufficient-v1/V2 behavior
    untouched, with no second Executor selection or lifecycle owner.
- id: AC2
  condition: The API freshly authenticates exact TASK/revision/RUN/operation/base/candidate
    SHA/tree, original reviewed mandatory proof mapping and latest fully sealed native
    K_i / immutable factual F_i with original captures; caller-projected feedback,
    stale K_i/F_i, ref drift, missing raw/observer or altered semantics cannot create
    a positive receipt.
- id: AC3
  condition: Original RunLeaseRegistry holder and same adapter instance must demonstrate
    a genuinely current same-RUN live Executor within the single native invocation
    before exposing F_i; expired, absent, released, substituted, cross-RUN, detached
    or crash-reconstructed lease cannot be promoted to LIVE or cause a second invocation.
- id: AC4
  condition: One local prospective feedback receipt/acknowledgment is uniquely bound
    to authenticated current K_i/F_i, admitted Executor and protected Runtime identity;
    only actual in-invocation adapter confirmation may be acknowledged. Returned status
    and F_i authority never claim production delivery, auto C2 or Human opt-in.
- id: AC5
  condition: Exact duplicate/replay reconciles original immutable receipt without
    reexecuting native proof, sending feedback again, reinvoking an adapter, or double
    debiting; conflicting duplicate, changed source, interrupted receipt/fence/ambiguous
    effect or stale holder BLOCKS without replacement or automatic retry.
- id: AC6
  condition: Continuation/STOP assessment refuses C2 if exact current lease, original
    authorization, full stable decisive candidate FAIL, causal in-scope new committed
    descendant, progress or intact original proof conditions is absent; same/old SHA,
    dirty or out-of-scope candidate, inconclusive error or fabricated progress cannot
    become continuation eligibility.
- id: AC7
  condition: Risk/semantic drift, missing Human finite opt-in/budget/token accounting,
    exhausted limits, lost lease, uncertain session or operation-specific authorization
    yield explicit non-actionable STOP/NOT_ESTABLISHED; no activation, consent, policy,
    budget or Executor is selected or minted by the prospective core.
- id: AC8
  condition: Once any RESULT, FAILURE, terminal intent, competing Runtime mutation
    or revoked source is observed, further F_i receipt/ACK/C2 and replay produce no
    new authority or second terminal. Unknown crash/callback state retains its immutable
    evidence and fails closed.
- id: AC9
  condition: REPAIR and REMEDIATION remain blocked from PRIMARY F_i positive consumption;
    without independently authenticated exact original FAILURE/REVIEW, correction
    action/finding/scope and current-run sticky holder, no substitute user/caller
    source can create correction continuation.
- id: AC10
  condition: Bounded serialized inspection outputs are deterministic and privacy-safe,
    with no executable instructions/log injection, patches, raw secrets, runtime-selected
    HOW, new command, fabricated progress/lease/consent or unbounded data; malformed
    and inconsistent input fails closed.
- id: AC11
  condition: Focused real-Git/native K_i/F_i and actual RunLeaseRegistry/ExecutorBoundary
    tests exercise isolated positive same-holder acknowledgment, unchanged full mandatory
    proof coverage, exact replay, wrong/released holder, replacement adapter, stale/source-collision,
    concurrent terminal, crash ambiguity, missing budget/consent, no progress and
    correction spoof without using affirmative mocks as the only proof.
- id: AC12
  condition: Diff remains confined to the seven permitted paths, preserves L3-01/02/03
    and original historical V1/V2 behavior, and documents L3-04 as preactivation only;
    real rollout/finite consent are L3-05, integrated G3 proof is L3-06, G6 exact
    Human per-RUN activation and postactivation L4 measurement remain separate.
