task_id: TASK-070
revision: 1

goal: >
  Harden the safe publication boundary for semantically reviewed historical correction
  candidates. Make publication use current canonical control-plane authority while
  treating the immutable review decision and reviewed candidate as data, reconstruct
  successful REPAIR lineage sufficiently to validate the correct PRIMARY or DELTA review
  semantics, and classify a reviewed candidate that cannot fast-forward current main as
  an explicit integration-required state without mutating main. Provide a deterministic
  repository-native replay surface for an already canonical review decision so a newer
  published publisher can re-evaluate an older immutable decision without recreating
  review, rerunning verification, or re-executing implementation.

problem: >
  TASK-068 exposed two independent publication-boundary defects after its final historical
  REPAIR candidate was semantically DELTA-reviewed PASS. RUN-068-004 produced reviewed
  candidate 024f0d30131ffdaa141b106d0e927fbc164aa038 with canonical verification PASS,
  and REVIEW-068-002 bound that candidate to prior finding F1. Auto-publication workflow
  run 34043941033 nevertheless failed before main mutation with `DELTA prior_finding_id
  requires a prior REVIEW` because publication treats the successful REPAIR RUN as a
  plain successful RUN and does not reconstruct that its failed predecessor RUN-068-003
  was a REMEDIATION carrying REVIEW-068-001/F1. The successful REPAIR transport already
  preserves repair.json, and the failed predecessor artifact preserves its REMEDIATION
  execution context, so the missing semantic binding can be reconstructed from immutable
  canonical remote state without changing frozen artifact schemas.

  The same incident also proves that event-bound publication code is coupled to the
  historical review-decision tree: the workflow checks out the review-decision event SHA,
  so a later safe-publisher fix on current main cannot be used to re-evaluate that older
  immutable reviewed candidate. This is the publication analogue of the current-control
  versus historical-subject separation already established for historical REPAIR.

  Finally, current canonical main is now
  1dcc7d13282d8b92b7482031b38a04faccaeec2c after TASK-069 publication, while the reviewed
  TASK-068 candidate and current main diverge from merge base
  4df5ad3076b0c072b39a7fbf692ef5bc3f2b225f. TASK-063 intentionally forbids automatic
  merge, rebase, or synthesized replacement candidates. The publisher must therefore
  report this as a distinct integration-required condition and leave integration to a
  separately authorized semantic contract rather than collapsing it into a generic
  publication failure or attempting to combine branches autonomously.

assumptions:
  - >
    Canonical AIOS-renew main immediately before TASK-070 authoring is
    1dcc7d13282d8b92b7482031b38a04faccaeec2c, with TASK-069 semantically reviewed PASS
    and published.
  - >
    TASK-063 revision 3 remains authoritative for safe publication: only an exact
    canonical PASS-reviewed source may advance main; review-decision metadata is never
    product implementation; exact expected-old-SHA lease protects the final fast-forward
    mutation; publication performs no Executor, canonical verification, or semantic
    review work.
  - >
    TASK-058 revision 2 establishes the valid architectural precedent that current
    control-plane authority may operate on immutable historical subject state without
    inserting current-control migration commits into that historical subject lineage.
  - >
    TASK-068 revision 1 implementation candidate 024f0d30131ffdaa141b106d0e927fbc164aa038
    has a canonical DELTA PASS decision REVIEW-068-002 with prior_finding_id F1. Its
    successful RUN-068-004 artifact includes repair.json binding REPAIR-068-003 to failed
    RUN-068-003 and exact failed_head_sha 0936632a6dab0ec1e24ab24b97ee0176b5b24d7a.
  - >
    Canonical failure-artifact state for RUN-068-003 preserves kind=REMEDIATION execution
    context including REVIEW-068-001, finding F1, reviewed_sha
    a78b7ffece805228e0262c2b03099d050bf386fa, and the exact remediation RUN identity.
  - >
    REVIEW-068-002 and its reviewed candidate remain immutable engineering facts even
    though publication is currently blocked. Re-evaluating publication must not recreate
    or reinterpret that semantic decision.
  - >
    A divergent reviewed candidate is not automatically safe to combine with later main
    even if Git could mechanically merge it. Integration can change relevant state and
    therefore requires a separate Human/Brain-authorized semantic contract and fresh
    evidence/review appropriate to the integrated candidate.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-063.yaml
    - .ai/tasks/TASK-068.yaml
    - .ai/tasks/TASK-069.yaml
    - src/aios_renew/publication.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - tests/test_publication.py
    - .github/workflows/aios-auto-publish.yml

  modify:
    - src/aios_renew/publication.py
    - tests/test_publication.py
    - .github/workflows/aios-auto-publish.yml

non_goals:
  - Integrate, merge, rebase, cherry-pick, synthesize, or publish TASK-068 onto current main in this TASK.
  - Create a replacement TASK-068 candidate or modify historical RUN-068-004, REVIEW-068-002, REPAIR-068-003, RUN-068-003, or any immutable historical artifact/ref content.
  - Change TASK, RUN, RESULT, EVIDENCE, FAILURE, REVIEW, REMEDIATION, REPAIR, or RUN_OBSERVATION schemas or semantic authority.
  - Change semantic REVIEW generation, DELTA/PRIMARY judgment, finding ownership, remediation/repair authorization, or Reviewer authority.
  - Add an Executor, model call, canonical verification execution, retry, fallback, reroute, automatic remediation, automatic repair, or autonomous integration to publication.
  - Treat Git conflict-freedom as semantic integration proof.
  - Weaken TASK-063 exact reviewed-SHA binding, fast-forward ancestry requirement, expected-old-SHA lease, or no-review-metadata-on-main rule.
  - Add general branch management, queueing, scheduling, polling, broker, database, or background orchestration.
  - Mark TASK-068/A2 DONE in the roadmap before its integrated product state is separately reviewed and published.
  - Change downstream repositories or dependency pins.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Publication control code must be obtained from the exact canonical current main
      state observed for that publication attempt, not from the reviewed candidate or
      review-decision tree. The immutable review-decision SHA, reviewed candidate SHA,
      successful source artifacts, and historical correction artifacts are subject data
      validated by that current control plane; they must not choose the executable
      publication implementation merely because they are historical Git trees.
    - >
      Existing automatic push-triggered publication remains supported. The event's
      review-decision ref/SHA must still be bound exactly to the canonical remote
      aios/review-decision/<RUN_ID> state before publication authority is exercised, even
      though executable publisher code comes from current canonical main.
    - >
      Add one explicit repository-native replay trigger for an already-existing canonical
      review decision. Replay may accept only enough identity to resolve the canonical
      review-decision RUN/ref; it must not accept an arbitrary candidate SHA, arbitrary
      review document, shell command, repository path, or alternate publication target.
      Replay must read the exact current canonical decision ref and then execute the same
      publication validation/mutation boundary as automatic delivery. It may not create,
      edit, or reinterpret REVIEW metadata.
    - >
      A successful REPAIR source must not be validated as an ordinary PRIMARY source
      merely because its transported run.json is structurally a plain RUN. When canonical
      successful artifacts contain persisted REPAIR execution lineage, publication must
      validate the REPAIR binding to the exact failed RUN/failure/failed_head/task and use
      canonical predecessor artifacts to determine the semantic review lineage required
      for that repaired candidate.
    - >
      When the repaired predecessor is a failed REMEDIATION, publication must prove the
      embedded prior REVIEW/finding/remediation identity from immutable canonical
      predecessor artifacts before accepting a DELTA review and prior_finding_id. Missing,
      malformed, mismatched, conflicting, wrong-TASK/revision, wrong-failed-head,
      wrong-reviewed-SHA, unauthorized, or ambiguous REPAIR/predecessor lineage must fail
      closed before any main mutation.
    - >
      REPAIR before any semantic finding must remain compatible with ordinary PRIMARY
      review semantics when canonical lineage proves no prior finding is applicable.
      Publication must not fabricate a prior finding or require DELTA merely because the
      successful source operation was REPAIR.
    - >
      After review/source lineage is valid, publication state classification must remain
      deterministic. If current main equals the reviewed SHA, return idempotent already-
      published success. If current main is an ancestor of the reviewed SHA, retain the
      existing exact-SHA-lease fast-forward publication path. If the reviewed SHA is
      already an ancestor of current main, return a side-effect-free already-included
      outcome rather than moving main backward. If neither side is ancestor of the other,
      return an explicit integration-required blocked outcome and perform no main mutation.
    - >
      Integration-required is not publication success and must remain observably distinct
      from malformed/invalid-lineage failure. It must report at least source RUN,
      reviewed SHA, current/prior main SHA, and an explicit outcome/detail sufficient for
      Human/Brain to author the later integration contract without guessing.
    - >
      Publication and replay must never merge, rebase, cherry-pick, resolve conflicts,
      create a replacement product candidate, rerun canonical verification, invoke an
      Executor/model, or author a TASK/REVIEW. A divergent candidate remains immutable and
      blocked until a separate Human/Brain-authorized integration contract creates and
      verifies a current-main descendant candidate.
    - >
      Existing concurrent-main race protection remains exact. The publisher must bind its
      mutation to the exact prechecked main SHA and fail closed if main changes before
      mutation; replay does not authorize an automatic retry loop or a broader force
      mechanism.
    - >
      Current publication outcome remains attributable and replayable, review metadata
      remains off product main, and no new GitHub credential beyond the existing minimum
      contents write publication authority is introduced.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Deterministic regressions model the canonical RUN-068-004 shape and prove a
      successful REPAIR of failed REMEDIATION reconstructs the exact prior REVIEW/F1
      lineage, validates REVIEW-068-002-style DELTA prior_finding_id binding, and reaches
      publication-state classification instead of failing with missing prior REVIEW.
  - id: AC2
    condition: >
      Deterministic regressions prove successful REPAIR before any semantic finding still
      accepts the appropriate PRIMARY PASS review semantics, while malformed, missing,
      conflicting, wrong-RUN/TASK/revision/failed-head/reviewed-SHA, unauthorized, or
      ambiguous REPAIR/predecessor lineage produces no main mutation.
  - id: AC3
    condition: >
      Automatic review-decision delivery executes publication authority from current
      canonical main while binding the immutable event decision ref/SHA as subject data;
      a historical decision/candidate cannot select an obsolete publisher implementation.
  - id: AC4
    condition: >
      A deterministic replay regression proves an already canonical PASS review decision
      can be re-evaluated by the current published publisher using only canonical RUN/ref
      identity, without changing REVIEW content, implementation candidate, evidence, or
      verification state and without invoking any Executor or model.
  - id: AC5
    condition: >
      Existing equal-main and normal fast-forward publication behavior remains safe and
      idempotent, including exact expected-old-SHA lease race protection and exclusion of
      review metadata from product main. A reviewed SHA already contained in current main
      is recognized as a side-effect-free already-included state.
  - id: AC6
    condition: >
      A deterministic divergent-main regression equivalent to current TASK-068 versus
      TASK-069 history returns explicit integration-required with source RUN, reviewed SHA,
      and prior/current main SHA, performs no push/main mutation, and invokes no merge,
      rebase, cherry-pick, conflict resolver, Executor, model, or canonical verification.
  - id: AC7
    condition: >
      Invalid review verdict/content, RESULT mismatch, canonical ref ambiguity, publication
      race, or malformed historical correction lineage remains distinguishable from
      integration-required and continues to fail closed with no product-main mutation.
  - id: AC8
    condition: >
      Existing PRIMARY and REMEDIATION publication regressions remain passing; TASK-070
      changes only publication control/replay/lineage handling and introduces no change to
      execution, correction, verification, semantic review, or downstream authority.

verification:
  required:
    - python -m pytest tests/test_publication.py -q
    - git diff --check
