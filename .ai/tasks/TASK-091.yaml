    - src/aios_renew/dispatcher.py
    - src/aios_renew/operator.py
    - tests/test_antigravity_minimax_adapter.py
    - tests/test_dispatcher.py
    - tests/test_operator.py

non_goals:
  - Edit, replace, unfreeze, or retroactively reinterpret the frozen Kernel v0.1
    specification or freeze record. Frozen v0.1 remains the historical two-executor
    baseline; this TASK changes current product capability prospectively only.
  - Amend the AIOS Constitution or change Human, Brain, Executor, Runtime, Reviewer, or
    Publisher authority.
  - Change TASK, RUN, RESULT, EVIDENCE, FAILURE, REVIEW, REMEDIATION, REPAIR, or publication
    schemas or semantic authority.
  - Change ExecutorBoundary, Runtime verification ownership, lease ownership, repository
    admission, completion gates, correction lineage, or safe publication semantics.
  - Modify the external `agym` installation, vendor Antigravity SDK/MiniMax proxy code into
    this repository, store or read MiniMax API keys, or make AIOS own provider
    authentication.
  - Replace the existing `antigravity` executor, change Codex/Antigravity commands, or
    reinterpret their output or TASK-092 REPAIR instruction contracts.
  - Add automatic executor selection, model routing, retry, fallback, reroute, failover,
    polling, background execution, or a second dispatcher.
  - Treat `agym.result.v1` status, response prose, model identity, token accounting, or
    `changed_files` diagnostics as canonical completion truth.
  - Add model-specific optimization, quota management, credit accounting,
    `agym doctor/models`, benchmark policy, verification caching, test-selection heuristics,
    Operator decomposition, or the broader Performance Closure work in this TASK.
  - Require a full repository verification rerun merely for ceremony when the focused
    canonical suite below is sufficient to establish this TASK's acceptance contract.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      This is an explicit Human-authorized post-freeze Executor-set extension. The current
      product may admit the new backend only prospectively through this separately reviewed
      TASK; no implementation or documentation may claim that frozen Kernel v0.1 itself
      originally admitted `antigravity-minimax`.
    - >
      The new admitted executor identity is exactly `antigravity-minimax`. It must enter
      through the existing Operator admission, RUN/lease binding, Dispatcher, and Executor
      boundaries; no direct Runtime-to-agym path or alternate lifecycle is permitted.
    - >
      One-active-executor remains invariant. Adding a third supported identity changes the
      selectable backend set only; it does not permit concurrent canonical mutation
      authority, multi-agent voting, automatic routing, fallback, or failover.
    - >
      PRIMARY, REMEDIATION, and REPAIR must all expose the same provider-neutral native
      adapter surface already required by Dispatcher. The selected adapter may be invoked
      at most once for one admitted execution, and native failure is terminal for that
      execution.
    - >
      Provider-specific invocation and envelope parsing must live in one thin
      `antigravity_minimax_adapter` boundary. Operator and Dispatcher may know the executor
      identity and factory only; they must not parse MiniMax/agym response content or own
      provider credentials.
    - >
      Native invocation must use the external `agym` executable in the admitted repository
      workspace, request `--output-format json`, explicitly permit the Executor's authorized
      commit-capable mutation path, and remain bounded by the existing provider-neutral
      native execution watchdog. AIOS must not pass MiniMax credentials or provider URLs on
      the command line.
    - >
      The adapter must preserve the existing direct-native-executor contract: consume the
      exact admitted TASK/RUN or correction handoff, do not launch another AIOS execution,
      do not push, do not perform semantic review, and leave canonical verification/EVIDENCE
      construction to Runtime. Any implementation-local sanity checking performed by the
      external harness remains non-authoritative and must not replace or suppress Runtime
      verification.
    - >
      For REPAIR, the third adapter must preserve the same published action semantics now
      established for existing native adapters: CODE_FIX is established-defect mutation,
      NO_CHANGE remains zero-mutation under its existing eligibility rules, and
      CONTINUE_IMPLEMENTATION resumes unfinished authorized original TASK work from exact
      failed lineage without creating a fresh PRIMARY, retry, reroute, or scope expansion.
    - >
      Successful transport requires one parseable `agym.result.v1` envelope whose process
      exit code, envelope `exit_code`, `status`, and `state_guard` consistently represent
      PASS. The envelope must bind to the admitted workspace and must not report an
      unexpected pre-existing dirty state or State Guard violation.
    - >
      The envelope `response` must be exactly one JSON structural ResultPackage for the
      current operation, with no prose wrapper or markdown fencing. It must be normalized
      through the existing structural Result/Evidence validators and then remain subject to
      the unchanged Runtime/ExecutorBoundary canonical gates. The adapter must never
      synthesize a PASS package from prose or missing fields.
    - >
      Git identity must fail closed: transport HEAD observations must be consistent with the
      admitted starting subject and returned Result head, while canonical final HEAD,
      ancestry/scope, root-relative changed-files, completion, and evidence truth remain
      owned by existing Runtime logic. `agym.changed_files` is diagnostics only and must
      never overwrite Result.changed_files or Runtime-derived repository truth.
    - >
      Missing `agym`, timeout, nonzero process exit, malformed terminal JSON, wrong schema,
      non-PASS status, inconsistent exit code, State Guard failure, workspace/head mismatch,
      missing/non-JSON response, or invalid structural ResultPackage must raise an
      executor-native failure with bounded stdout/stderr diagnostics and no retry, fallback,
      reroute, or alternate executor invocation.
    - >
      Existing `codex` and `antigravity` admission choices, commands, factory behavior,
      tests, ResultPackage normalization, and TASK-092 native REPAIR instruction behavior
      must remain unchanged.
    - >
      Canonical verification for this TASK must be minimum-sufficient and non-duplicative.
      Runtime runs the single focused pytest command in `verification.required` exactly once
      on the final candidate. Do not additionally rerun the full repository suite or repeat
      an included subset against the same unchanged candidate merely for ceremony. Runtime's
      existing repository/scope/completion gates remain authoritative and are not restated
      as separate TASK verification commands.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Operator Human-facing and wakeup/correction admission surfaces accept exactly the new
      `antigravity-minimax` executor wherever a coding Executor is already accepted, while
      invalid executor identities still fail closed and existing Codex/Antigravity behavior
      is unchanged.
  - id: AC2
    condition: >
      Dispatcher resolves `antigravity-minimax` through the existing native adapter registry
      for PRIMARY, REMEDIATION, and REPAIR, preserves selected-executor/RUN identity, and
      invokes at most one adapter with no fallback or second dispatch on construction,
      native, or output failure.
  - id: AC3
    condition: >
      Adapter command-contract tests prove the external `agym` transport is invoked in the
      exact admitted repository with machine-readable JSON output, authorized
      commit-capable execution, and the existing bounded native watchdog, without putting
      MiniMax credentials/provider URLs in AIOS command arguments.
  - id: AC4
    condition: >
      Deterministic success fixtures for PRIMARY, REMEDIATION, and all currently published
      REPAIR actions provide a valid `agym.result.v1` PASS envelope whose response is one
      structural operation-appropriate ResultPackage; the adapter returns that package
      through existing validators and Runtime gates without treating agym prose/metadata as
      canonical evidence or weakening TASK-092 CONTINUE_IMPLEMENTATION semantics.
  - id: AC5
    condition: >
      Success coverage proves transport workspace/HEAD observations are bound consistently
      to the admitted execution and returned Result head, while agym `changed_files`
      diagnostics neither replace nor alter Result.changed_files or Runtime-derived
      repository truth.
  - id: AC6
    condition: >
      Negative coverage fails closed for missing executable, watchdog timeout, nonzero
      process exit, malformed JSON, wrong schema, PASS/exit-code disagreement, dirty
      refusal, State Guard violation, workspace/head mismatch, missing or prose-wrapped
      response, and structurally invalid ResultPackage, preserving bounded native
      diagnostics and invoking no alternate Executor.
  - id: AC7
    condition: >
      Existing Codex and Antigravity adapter/dispatcher/operator regressions remain green,
      including TASK-092 three-action REPAIR instruction behavior, with no command, output,
      retry, authority, verification, lease, or publication semantic change.
  - id: AC8
    condition: >
      The implementation is a prospective third-backend extension only: frozen Kernel v0.1
      artifacts remain byte-unchanged, one-active-executor and all canonical authority
      boundaries remain intact, and no router, retry/fallback/reroute, second lifecycle, or
      alternate verification/evidence authority is introduced.
  - id: AC9
    condition: >
      The single focused canonical regression suite covers the new adapter, Dispatcher,
      Human-facing Operator admission, and existing Codex/Antigravity adapter compatibility
      and passes on the final candidate without a second full-suite rerun against unchanged
      relevant state.

verification:
  required:
    - python -m pytest tests/test_antigravity_minimax_adapter.py tests/test_dispatcher.py tests/test_operator.py tests/test_antigravity_adapter.py tests/test_codex_adapter.py -q
