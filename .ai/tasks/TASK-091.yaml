task_id: TASK-091
revision: 2

goal: >
  Add `antigravity-minimax` as a third admitted native Executor backend as an explicit
  Human-authorized post-freeze extension of the current AIOS-renew product, without
  rewriting the frozen Kernel v0.1 baseline. Place the already-proven external `agym`
  transport behind the existing AIOS Executor/Dispatcher boundary so PRIMARY,
  REMEDIATION, and REPAIR use the same canonical TASK/RUN, ResultPackage, Runtime
  verification, review, lineage, lease, and publication semantics as Codex and
  Antigravity, with no second execution architecture, router, retry, or authority shift.

problem: >
  Canonical AIOS-renew currently admits only `codex` and `antigravity`, while the frozen
  Kernel v0.1 specification and freeze record explicitly describe that two-executor
  baseline. The freeze record also permits future kernel features or changes only through
  separate tasks backed by observed evidence. TASK-091 revision 1 correctly proposed a
  thin third adapter around the proven external `agym` transport, but it did not inspect
  the freeze record or state explicitly that admitting a third Executor is a prospective
  post-freeze product extension rather than a reinterpretation of frozen v0.1. It also
  required a focused pytest suite followed by the full repository suite on the same
  candidate plus `git diff --check`, causing avoidable duplicate canonical verification
  contrary to the Manifesto/Constitution reuse and minimum-sufficient-work principles.

  Since revision 1 was authored, TASK-092 has been semantically reviewed PASS and
  published, hardening the Codex and Antigravity native REPAIR instruction boundary for
  `CONTINUE_IMPLEMENTATION`. The third adapter must preserve those current native-contract
  semantics rather than integrate against the older pre-TASK-092 baseline. Human has now
  explicitly authorized both the third-Executor priority and this governance/efficiency
  revision before TASK-091 execution.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-091 revision-2 authoring is
    410f0a87c86f3fef56802d23dc0b8cf22bb2c9f7.
  - >
    REVIEW-092-001 is canonical PRIMARY PASS for exact reviewed SHA
    e72135cd5c5a1dec0d8374d9bb8994da5e458feb with AC1 through AC8 PASS and no findings;
    TASK-092 native CONTINUE_IMPLEMENTATION instruction hardening is therefore established
    current product behavior that TASK-091 must preserve.
  - >
    `.ai/roadmap-state.yaml` records TASK-092 DONE at published SHA
    e72135cd5c5a1dec0d8374d9bb8994da5e458feb and `antigravity-minimax-executor-adoption`
    / TASK-091 as the unique NEXT item before downstream adoption.
  - >
    Frozen Kernel v0.1 at baseline 73747ec74e8669dbd0746ccf614558b6ee3d28aa remains an
    immutable historical minimum contract whose native executor baseline names Codex and
    Antigravity. The freeze record expressly allows later kernel features/changes when
    separately authorized and backed by observed evidence. TASK-091 revision 2 is that
    explicit prospective extension; it does not edit history or claim v0.1 originally
    admitted a third Executor.
  - >
    Human has explicitly authorized extending the current product's supported Executor set
    with the proven Antigravity+MiniMax transport while preserving one-active-executor and
    all existing authority boundaries.
  - >
    The existing `ExecutorBoundary` and `Dispatcher` are authoritative for exactly-one
    selected native execution; Runtime remains canonical verification and evidence owner;
    Reviewer and publication authorities remain unchanged.
  - >
    A local external command named `agym` is installed outside this repository. Its proven
    v0.3 contract emits one `agym.result.v1` JSON envelope, uses exit code 0 only for
    transport PASS, fails closed on dirty-workspace/state-guard violations and timeouts,
    and leaves MiniMax credentials/provider plumbing outside AIOS-renew.
  - >
    `agym` transport metadata is operational evidence only. Its `response` field may be
    consumed only if it is exactly one structural AIOS ResultPackage JSON object; model
    prose and agym's own `changed_files` observation are never canonical repository truth.
  - >
    Existing Codex and Antigravity native behavior, including TASK-092's three-action
    REPAIR instruction semantics, is regression authority and must remain unchanged.

