non_goals:
  - >
    Modify downstream Python Agent, TASK-256, RUN-256-001, its FAILURE artifact, any
    downstream REPAIR authorization, dependency pin, workflow, runner state, publication
    state or product semantics.
  - >
    Retry or restart TASK-256 PRIMARY, fabricate a RESULT, create a parallel RUN, or
    reinterpret RUN-256-001 as a pre-AIOS operational failure.
  - >
    Change Codex/Antigravity default models, supported efforts, source attribution,
    execution-profile schema/version, request schema/version, durable PRIMARY journal
    version, frozen TASK/RUN semantics or adapter/Dispatcher exactly-one selection.
  - >
    Re-resolve an existing durable authorization from current defaults, mutate or upgrade
    historical v1/v2 journals, backfill profiles, or reinterpret historical RUN profile
    provenance.
  - >
    Change correction_dispatch or repair_dispatch repository-policy semantics, TASK-210
    source-REPAIR failed-candidate policy semantics, source-bootstrap/migration behavior,
    correction selection, Runtime verification, Reviewer or Publisher authority.
  - >
    Change _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA, _SOURCE_BOOTSTRAP_TARGET_SHA or
    _BOOTSTRAP_TARGET_SHA. The eventual TASK-212 candidate SHA is unknown at authoring and
    must be activated only by a separate post-publication successor if Human continues the
    downstream recovery.
  - >
    Infer a governed repository from state_root/.git layout, cwd, environment variables,
    installed package location, mutable main or network discovery.
  - >
    Add retry/fallback/failover, model routing, repository routing, Planner, Reviewer,
    Publisher or another lifecycle authority.

constraints:
  hard:
    - >
      Every profile-aware PRIMARY v3 durable-dispatch operation that validates a stored
      execution-profile identity must receive explicit governed repository context (or an
      exact policy object derived from that repository) from its existing caller boundary.
      It must never use canonical_policy_path() package-root fallback when a governed
      repository exists.
    - >
      Do not infer repository identity from state_root. Runtime state may live under Git
      worktree/admin paths whose filesystem ancestry is not repository authority. Operator
      and remote surfaces already possess the exact repo root and must pass it explicitly.
    - >
      First-seen profile-aware PRIMARY authorization must validate its supplied exact
      resolved profile against the exact governed repository policy before durable journal
      creation or PRIMARY invocation. Missing/malformed policy, unsupported effort or
      invalid profile must fail closed with zero native Executor invocation and no new
      profile-aware dispatch authority.
    - >
      Reading an existing v3 journal must validate its exact stored profile identity
      against the same governed repository policy without resolving or substituting
      repository defaults. Exact replay/restart/reconciliation must reuse the stored
      model/effort/source values; changed profile selectors remain an immutable-binding
      collision.
    - >
      bind_dispatch_run must validate the v3 journal under the governed repository policy
      and then require the persisted per-RUN execution-profile sidecar to match the exact
      journal identity before recording RUN ownership. Any mismatch fails closed.
    - >
      existing_dispatch_profile and inspect_dispatch/remote_status must use explicit
      repository context for v3 records. Status inspection remains observational only:
      no reconciliation, journal rewrite, default resolution, RUN creation or native
      invocation.
    - >
      Historical PRIMARY v1/v2 records remain readable/reconcilable without requiring
      .ai/executor-profiles.yaml, without profile backfill, and without comparison against
      current defaults. Newly created profile-aware authorization remains v3.
    - >
      Deterministic regression must reproduce the observed installed-package topology:
      package-root fallback has no .ai/executor-profiles.yaml; an external governed repo
      contains a valid policy; a v3 PRIMARY authorization can create/bind/replay/inspect
      using only that repo policy and the exact bound profile. The test must fail if the
      implementation silently consults package-root policy.
    - >
      Negative regression must cover missing/malformed governed-repo policy, unsupported
      effort, changed bound profile identity and mismatched persisted RUN sidecar, with
      no unauthorized Executor invocation or dispatch/RUN ownership mutation.
    - >
      Preserve correction_dispatch and repair_dispatch behavior, including source-REPAIR's
      exact failed-candidate policy context from TASK-210. Do not generalize that special
      source-REPAIR evidence path into PRIMARY.
    - >
      Preserve production source-REPAIR activation exactly at
      062031ab91118ecf784944e8dd7e3d76b0553c74, source-PRIMARY activation exactly at
      31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 and legacy bootstrap target exactly at
      83115b26df85a7ad6643f317833e18b18586bdbe.
    - >
      Documentation must record RUN-256-001 as the real downstream evidence exposing this
      PRIMARY portability defect and state the prospective recovery order without claiming
      future completion: TASK-212 review/publication -> separate exact source-REPAIR
      activation successor -> continuation of RUN-256-001 under its existing TASK-256
      lineage -> downstream exact-pin migration to a reviewed generation containing this
      fix -> fresh TASK-207 revision-9 conformance.
    - >
      Runtime owns verification. Executor returns one clean candidate with zero unresolved
      implementation items and does not mutate roadmap/downstream state, activate a future
      source-REPAIR target, perform recovery, review or publish.

acceptance:
  - id: AC1
    condition: >
      PRIMARY v3 durable journal validation is bound to the exact governed repository
      policy and no profile-aware read/bind/replay/status path falls back to installed
      package-root .ai policy.
  - id: AC2
    condition: >
      The installed-package/external-repository regression corresponding to RUN-256-001
      succeeds when the external repository contains a valid policy supporting the exact
      bound Codex gpt-6-sol/high profile, without requiring package-root .ai material.
  - id: AC3
    condition: >
      Missing/malformed governed-repository policy, unsupported effort or invalid profile
      fails closed before a new profile-aware PRIMARY journal/native invocation, while
      immutable profile collisions and sidecar mismatches cannot acquire or rewrite RUN
      ownership.
  - id: AC4
    condition: >
      Exact v3 replay/restart/reconciliation reuses the already-bound profile identity and
      does not resolve changed defaults; at-most-once invocation, collision rejection and
      canonical RUN attribution remain unchanged.
  - id: AC5
    condition: >
      Historical PRIMARY v1/v2 durable journals remain readable/reconcilable under their
      historical semantics without repository profile policy, retroactive profile
      provenance or journal rewrite.
  - id: AC6
    condition: >
      remote_status/inspect_dispatch remains read-only and can inspect a valid external-repo
      v3 dispatch using explicit repository context; REMEDIATION/REPAIR dispatch semantics
      and all activation constants remain unchanged.
  - id: AC7
    condition: >
      Focused deterministic tests and documentation capture the real downstream failure,
      the corrected authority boundary and the future recovery choreography, with no
      downstream mutation, roadmap advancement, review or publication claim.

