task_id: TASK-212
revision: 1

goal: >
  Correct the PRIMARY durable-dispatch execution-profile validation boundary exposed by
  Python Agent RUN-256-001: profile-aware PRIMARY dispatch records must validate against
  the exact governed repository's .ai/executor-profiles.yaml, never fall back to the
  installed AIOS package root when repository context exists. Preserve exact bound-profile
  replay/reconciliation, historical v1/v2 journal compatibility, at-most-once PRIMARY
  ownership, Runtime/Reviewer/Publisher authority, and all REMEDIATION/REPAIR semantics.
  Perform no downstream recovery, pin migration, source-REPAIR activation or roadmap
  advancement.

problem: >
  Python Agent TASK-256 r1 was authorized at downstream main
  2a773fd11636223b71f0b224523e0cef7915c07a with exact repository policy
  .ai/executor-profiles.yaml and resolved Codex profile gpt-6-sol/high. Its first
  post-sync PRIMARY attempt created canonical RUN-256-001, persisted the exact execution
  profile sidecar, then failed at COMPLETION_GATE before native Executor implementation.
  The canonical failure artifact commit is e0e721aad9959880de464705a225e87c9c19820d;
  failed_head_sha equals the base, changed_files is empty, dirty=false,
  descends_from_base=true, repairable=true and transportable=true. The error path was
  execution-profile policy lookup under the transient installed worker runtime:
  ...worker-runtime/Lib/.ai/executor-profiles.yaml. Audit of current AIOS-renew main
  confirms src/aios_renew/dispatch_reconciliation.py still calls
  validate_profile_identity() from _read_record() without supplying repository or policy
  context. For a source-installed AIOS checkout this is masked by the package tree's own
  .ai policy; for an installed package governing an external repository it resolves the
  wrong policy root. PRIMARY v3 durable record read/bind/replay/status therefore has a
  portability defect even though operator authorization already resolved the exact
  repository-owned profile correctly. REMEDIATION and REPAIR dispatch paths already carry
  explicit repository policy context and must not be redesigned by this task.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is exactly
    050fc92751989ebf5bc7503a3046d1bc107ce331.
  - >
    TASK-210 r1 completed through RUN-210-001 / REVIEW-210-001 PASS and exact publication
    062031ab91118ecf784944e8dd7e3d76b0553c74; TASK-211 r1 completed through
    RUN-211-001 / REVIEW-211-001 PASS and exact publication
    050fc92751989ebf5bc7503a3046d1bc107ce331.
  - >
    Current production _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA is the exact TASK-210 consumer
    062031ab91118ecf784944e8dd7e3d76b0553c74. This task does not change that activation
    and does not claim it can recover RUN-256-001.
  - >
    Python Agent RUN-256-001 is canonical FAILURE for TASK-256 revision 1. Failure artifact
    commit e0e721aad9959880de464705a225e87c9c19820d records phase COMPLETION_GATE,
    failed_head_sha/base_sha 2a773fd11636223b71f0b224523e0cef7915c07a, no changed files,
    clean/descendant/repairable/transportable candidate state, and exact profile
    codex/gpt-6-sol/high with REPOSITORY_DEFAULT attribution.
  - >
    Canonical Python Agent main contains .ai/executor-profiles.yaml blob
    6f0507f2bd15597fba4a2340f1508061bc7bee06. The observed failure is therefore not a
    missing downstream policy after sync; it is wrong policy-root resolution inside the
    installed AIOS package.
  - >
    TASK-163 established that new profile-aware durable dispatches bind one exact resolved
    profile and that restart/replay/reconciliation of the same authorization reuses that
    profile rather than resolving changed defaults. TASK-195 changed repository defaults
    without changing that invariant.
  - >
    Historical PRIMARY v1/v2 dispatch journals are profile-unaware and remain readable
    under their historical semantics without retroactive execution-profile authority.
  - >
    BP-9 downstream adoption remains the Human/Brain planning NEXT. TASK-212 is a bounded
    upstream maintenance prerequisite discovered by real downstream execution and does not
    itself mutate roadmap state or any downstream repository.

