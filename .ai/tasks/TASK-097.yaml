task_id: TASK-097
revision: 1

goal: >
  Establish P3A prospective exact predecessor identity for every newly admitted
  REMEDIATION RUN so correction and publication lineage can bind the exact source
  RUN, REVIEW, finding, and reviewed SHA without reconstructing predecessor truth
  from candidate equality, finding search, or historical ordering.

problem: >
  Current REMEDIATION admission already resolves the exact source lineage, but the
  persisted REMEDIATION RUN stores only the selected review/finding/remediation
  execution payload and omits the exact source RUN identity. Publication therefore
  reconstructs a narrow prior review from embedded finding data instead of consuming
  one persisted predecessor identity. This is insufficient groundwork for P3
  multi-finding correction continuity and leaves a latent publication correctness
  gap when a valid PRIMARY review contains sibling findings.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-097 authoring is
    e1b9b8517dc8d9f4d5fefdb70688595fec3d7d1a.
  - >
    TASK-096 is semantically reviewed PASS and published at
    e37817bce8335e6a158e9aedcae6f90867751c02; P2 Operator decomposition is complete.
  - >
    Human explicitly authorized the P3 correction-lineage post-freeze evolution
    before this TASK was authored.
  - >
    docs/P3-DESIGN-NOTE.md defines the accepted P3 sequence: P3A exact predecessor
    identity, then P3B outstanding-finding frontier, then P3C Unified State exposure.
  - >
    Historical REMEDIATION RUN artifacts created before TASK-097 are immutable and
    may legitimately lack the new predecessor metadata.
  - >
    REVIEW and REMEDIATION semantic documents remain authoritative and unchanged in
    P3A; the new predecessor identity is Runtime-owned operational lineage metadata.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-063.yaml
    - .ai/tasks/TASK-081.yaml
    - .ai/tasks/TASK-085.yaml
    - .ai/tasks/TASK-086.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/publication.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/unified_state.py
    - tests/test_operator.py
    - tests/test_operator_unified_state.py
    - tests/test_publication.py
    - tests/test_review.py
  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/publication.py
    - tests/test_operator.py
    - tests/test_operator_unified_state.py
    - tests/test_publication.py

non_goals:
  - Implement the P3B unresolved/outstanding finding frontier.
  - Change Unified State next-action taxonomy or Human Surface behavior.
  - Auto-select, rank, merge, batch, or order sibling findings.
  - Change REVIEW or REMEDIATION YAML schemas or Brain correction-authoring semantics.
  - Change Runtime verification, Executor dispatch, REPAIR, publication authority,
    review verdict authority, or downstream dependency pins.
  - Rewrite, migrate, backfill, or mutate historical RUN/RESULT/REVIEW/REMEDIATION artifacts.
  - Add retry, fallback, reroute, planner, reviewer agent, or autonomous correction loop.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Every newly admitted REMEDIATION RUN must persist one bounded Runtime-owned
      predecessor identity containing exactly the canonical source RUN id, source
      REVIEW id, selected finding id, and reviewed SHA resolved by admission. This
      metadata is lineage truth, not Executor input, and must not be copied into model
      prompts, RESULT claims, or Brain-authored REMEDIATION content.
    - >
      The persisted predecessor source RUN must come from the same deterministic
      canonical lineage resolution that authorizes the REMEDIATION. A caller-supplied
      source selector may constrain that resolution but must never become truth merely
      because it was supplied. Ambiguous, missing, or mismatching source identity must
      fail closed before a new RUN is admitted.
    - >
      All prospective REMEDIATION admission paths that create a RUN, including ordinary
      remediation execution, approved-remediation delegation, and direct-candidate
      acceptance, must persist the same exact predecessor identity without requiring
      Human/Brain duplication of repository truth.
    - >
      For predecessor-bearing REMEDIATION lineage, publication/canonical lineage
      validation must bind the persisted source RUN, REVIEW, finding, and reviewed SHA
      to the exact canonical predecessor artifacts. A mismatch or inconsistent
      predecessor identity must fail closed; the system must not fall back to candidate
      equality, finding-id search, run-number ordering, timestamps, or synthetic
      prior-review reconstruction for that prospective lineage.
    - >
      Historical REMEDIATION RUN artifacts that predate TASK-097 and contain no
      predecessor identity remain readable and reviewable under the established legacy
      validation path. Their absence of prospective metadata is not retroactively an
      error, and no historical artifact may be modified to add it.
    - >
      Existing valid single-finding correction semantics remain behaviorally equivalent.
      A new predecessor-bearing REMEDIATION with one source finding can still receive
      DELTA review and publication through the existing authority boundaries after the
      exact predecessor identity is validated.
    - >
      P3A must not pretend to solve sibling-finding completion. If a new
      predecessor-bearing lineage originates from a source REVIEW containing more than
      one finding, publication must fail closed rather than treating one selected
      finding's DELTA PASS as proof that sibling findings are resolved. P3B will define
      the deterministic outstanding-finding frontier prospectively.
    - >
      Unified State must remain able to observe both historical legacy REMEDIATION RUNs
      and new predecessor-bearing REMEDIATION RUNs without changing its next-action
      taxonomy, selecting a finding, or acquiring correction authority.
    - >
      Failure taxonomy, exact SHA binding, one-active-mutation authority, correction
      preflight, REMEDIATION scope enforcement, Runtime verification ownership, semantic
      review authority, and safe-publication race protections must not be weakened.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A newly admitted ordinary REMEDIATION RUN persists one exact bounded predecessor
      identity that binds source RUN id, source REVIEW id, selected finding id, and
      reviewed SHA to the same canonical lineage used for admission.
  - id: AC2
    condition: >
      Approved-remediation execution and direct-candidate acceptance persist the same
      predecessor identity shape and derive it from canonical resolution rather than
      caller assertion or heuristic search.
  - id: AC3
    condition: >
      Deterministic mismatch regressions prove inconsistent source RUN, REVIEW, finding,
      or reviewed SHA in a predecessor-bearing lineage fails closed during canonical
      publication/lineage validation with no fallback reconstruction or publication.
  - id: AC4
    condition: >
      Historical REMEDIATION lineage without the new predecessor metadata remains
      readable and preserves its established single-finding validation/publication
      behavior without artifact migration or mutation.
  - id: AC5
    condition: >
      A new valid single-finding predecessor-bearing REMEDIATION lineage preserves the
      existing DELTA review and safe-publication behavior after exact predecessor
      validation.
  - id: AC6
    condition: >
      A new predecessor-bearing lineage whose exact source REVIEW contains multiple
      findings cannot publish on the basis of one selected finding's DELTA PASS and
      fails closed without auto-selecting, ordering, merging, or renaming siblings.
  - id: AC7
    condition: >
      Unified State regressions prove both legacy and predecessor-bearing REMEDIATION
      RUNs remain observable with unchanged next-action taxonomy and no new mutation or
      finding-selection authority.
  - id: AC8
    condition: >
      The implementation changes no REVIEW/REMEDIATION semantic schema, Executor prompt
      contract, ResultPackage schema, REPAIR semantics, retry/reroute behavior, or
      historical artifact contents.

verification:
  required:
    - python -m pytest tests/test_operator.py tests/test_operator_unified_state.py tests/test_publication.py -q
