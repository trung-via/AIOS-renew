task_id: TASK-366
revision: 1
goal: Implement R2.1/R3 TCA-1 Task Contract Audit as one bounded, provider-neutral,
  two-focused-pass semantic conformance procedure for the existing TASK_AUTHORING
  flow, protecting Human intent, independently claimable acceptance, satisfiability,
  false-completion resistance and cross-authority consumers. Support explicit Human
  V1-option interoperability in isolated conformance without activating TCA or retiring
  production Adaptive V1; preserve direct AUTHOR_TASK and historical profile identities.
problem: R2.1/R1 ROA-1 R2 and R2 MOA-1 have separately reviewed/published isolated
  semantic support, but TASK_AUTHORING still lacks its target task-specific outcome
  audit. Mandatory universal V1 eight-lens reasoning is broader than necessary for
  ordinary task authoring, while an implementation that merely appends a profile could
  let unclaimable PROOF_LATER acceptance, missing intended consumers, scope contradictions,
  false Executor PASS or unauthorized V1-option substitution escape closure. The existing
  BO-1 direct AUTHOR_TASK contract must remain unchanged; this R3 must add only exact
  bounded TCA semantic conformance, not a new policy selector or mutation gate.
assumptions:
- Brain Sync on canonical main 9f70b6b1dabad4234794db74c4d7c1f43f9a4a60 confirms TASK-365
  r1 reviewed source published on main, distinct from R2.1 roadmap. R2.1/R1 TASK-363
  source dc61cf739528047667438001953bdeaa9f6e6af and R2 TASK-364 corrected source
  e773588078c6646d6df9fae416a402103969ea64 are published ancestors; latest ROA and
  MOA are isolated support, not default.
- Approved planning authority is docs/AIOS-FOUR-SPECIALIZED-AUDITS-R2.1.md on current
  main; current unique program NEXT is R3 TCA-1, then R4 AOA-1 and bounded R5 closure
  if actually necessary. Lean VP remains after finished R2.1 and explicit Human/Brain
  reconciliation.
- Current production prospective semantic audit remains exactly aios-adaptive-brain-audit-v1
  v1 digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718, stages
  CONSTRUCT plus ADVERSARIAL_AUDIT_AND_RECONCILE and all eight required lenses. TCA
  cannot silently select itself, turn V1 into a dual mandatory pass, or alter historical
  profile bindings before separately authorized reviewed/published cutover.
- The Human has approved all remaining R2.1 implementation TASKs prospectively and
  selected Codex gpt-6.1-sol with reasoning effort max for their individual PRIMARY
  delegations, subject to exact TASK/Runtime admission, sequential review and publication.
  This TASK semantic contract is Executor-neutral.
- AUTHOR_TASK already has one direct final contract with no serialized audited_handoff
  requirement. The Brain TASK Authoring Contract requires each final acceptance criterion
  to be claimable by an Executor before Runtime verification; the transitory CLAIM_NOW/PROOF_LATER
  ledger is only Brain cognitive support.
- R3 implements isolated conformance and Human-option compatibility tests for TASK_AUTHORING;
  prospective default profile policy, Human opt-in activation, and retirement of mandatory
  V1 are reserved for R5 after R4 and lawful eligibility.
