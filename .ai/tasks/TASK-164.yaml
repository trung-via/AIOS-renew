task_id: TASK-164
revision: 2

goal: >
  Restore current remote-surface regression compatibility with the already
  published Trusted Control Source contract and current profile-aware PRIMARY
  dispatch contract. Replace stale assumptions that remote status, approval, and
  approved-remediation workflows invoke a PATH-installed aios command, and
  modernize only the synthetic remote-status dispatch fixture needed by this same
  regression file so it constructs a valid current first-seen PRIMARY
  authorization. Preserve production behavior, Control Source authority,
  execution-profile authority, and all lifecycle boundaries.

problem: >
  TASK-164 r1 correctly identified the stale remote-workflow invocation
  assertions, and RUN-164-001 produced a clean one-file candidate that replaced
  them with executable trusted-control-entry checks. Runtime verification then
  failed before exercising that target assertion because
  test_status_reports_allowlisted_dispatch_and_run_facts_without_mutation still
  constructs a first-seen PRIMARY dispatch using pre-TASK-163 semantics: it
  supplies exact TASK identity but no resolved execution profile, no matching
  per-RUN profile sidecar, and still expects the older durable dispatch record
  version. Current dispatch_reconciliation intentionally requires a complete
  resolved profile for a new authorization and validates the admitted RUN profile.
  Because TASK-164 r1 explicitly prohibited broadening regression cleanup beyond
  the initially identified stale assumption, this additional compatibility work
  is authorized as TASK-164 revision 2 rather than as REPAIR of RUN-164-001.

assumptions:
  - >
    Canonical main at TASK-164 r2 authoring is
    35ed7424f02dac06e0e4b6d806f20030533ac9e6.
  - >
    RUN-164-001 is immutable historical VERIFICATION failure evidence for
    TASK-164 r1. Its failed candidate
    faca4a5a0d338f6e25e40355898e48d8c39dba89 is clean, transportable, changes
    only tests/test_remote_surface.py, and demonstrates the intended
    remote-workflow regression shape, but r2 is new TASK semantics and does not
    reinterpret that failed RUN as a repair continuation.
  - >
    TASK-158 remains authoritative for Trusted Control Source identity,
    materialization, exact-SHA binding, persistent-repository isolation, and
    control-entry mechanics.
  - >
    TASK-163 and TASK-165 remain authoritative for profile-aware new
    authorizations, durable execution-profile identity, repository default policy,
    exact propagation, and no fallback. TASK-164 r2 does not change or duplicate
    those authorities.
  - >
    Canonical roadmap identifies TASK-164 as the unique NEXT maintenance
    prerequisite before BP-V4 resumes.
  - >
    If satisfying these regressions requires any production change, TASK-164 r2
    must fail rather than widening mutation scope.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-158.yaml
    - .ai/tasks/TASK-163.yaml
    - .ai/tasks/TASK-164.yaml
    - .github/workflows/aios-remote-status.yml
    - .github/workflows/aios-remote-approval.yml
    - .github/workflows/aios-approved-remediation-wakeup.yml
    - scripts/aios_control_entry.py
    - src/aios_renew/dispatch_reconciliation.py
    - src/aios_renew/execution_profile.py
    - tests/test_remote_surface.py
    - tests/test_control_source_isolation.py
    - tests/test_dispatch_reconciliation.py
  modify:
    - tests/test_remote_surface.py

non_goals:
  - Modify any GitHub workflow, scripts/aios_control_entry.py, Operator, Runtime, dispatch, execution-profile implementation or policy, transport, Reviewer, Publisher, or other production source.
  - Reimplement, broaden, or replace TASK-158 Trusted Control Source semantics.
  - Change TASK-163/TASK-165 profile resolution, defaults, source attribution, durable dispatch schema, replay semantics, fallback policy, or native invocation behavior.
  - Use current repository default model or effort constants as synthetic test authority.
  - Duplicate the detailed exact-SHA/materialization/isolation contract already owned by tests/test_control_source_isolation.py.
  - Repair, retry, reinterpret, or mutate RUN-164-001 or RUN-159-005 lineage.
  - Execute the BP-V4 serial/parallel measurement matrix, select a worker count, or advance roadmap state from Executor execution.
  - Skip, xfail, delete, or weaken either the remote-workflow regression or remote-status read-only behavior merely to obtain green verification.
  - Push or publish from Executor implementation.

constraints:
  hard:
    - >
      Preserve and implement the r1 remote-workflow outcome: each of the three
      workflows remains proven as a workflow_dispatch, self-hosted,
      contents-read, no-push/no-pull-request/no-actions-checkout surface, and each
      contains exactly one executable delegation of its intended bounded operation
      through scripts/aios_control_entry.py.
    - >
      The executable-delegation regression must distinguish executable run
      statements from comments, descriptions, names, concurrency groups, and other
      non-executable metadata, and must reject executable direct installed-CLI
      equivalents for remote-status, remote-approve, and
      approved-remediation-wakeup.
    - >
      Preserve the exact Human approver-attribution assertion for the approval
      workflow.
    - >
      Modernize only the synthetic dispatch setup used by
      test_status_reports_allowlisted_dispatch_and_run_facts_without_mutation so a
      first-seen PRIMARY authorization provides one explicit bounded synthetic
      ResolvedExecutionProfile, the admitted synthetic RUN persists a matching
      run-bound execution-profile sidecar before dispatch binding, and the test
      expects the current profile-aware durable dispatch record shape.
    - >
      Synthetic profile data must be local test data with opaque non-production
      model values and explicit source attribution. Do not load repository
      defaults merely to make the fixture pass and do not duplicate current
      Codex/Antigravity default model or effort values as a second authority.
    - >
      The authorization profile and admitted RUN profile may differ only in run
      identity; executor, model, reasoning effort, model source, and effort source
      must match exactly as required by the current dispatch contract.
    - >
      Preserve the original semantic purpose of the remote-status test: after a
      valid dispatch/result fixture exists, remote_status exposes only allowlisted
      status/run facts, excludes workspace detail, and performs no mutation of
      persisted state.
    - >
      Do not copy broad TASK-163 or dispatch-reconciliation coverage into this
      file. Add only the minimum fixture assertions necessary to prove this test is
      aligned with the current profile-aware authorization it depends on.
    - >
      Keep every repository mutation inside tests/test_remote_surface.py. If any
      production change appears necessary, stop and return the conflict to Brain.

acceptance:
  - id: AC1
    condition: >
      The remote-workflow regression no longer requires PATH-installed aios
      invocation and instead recognizes the current trusted transient-control-entry
      delivery contract using executable-statement-aware checks.
  - id: AC2
    condition: >
      The remote-status workflow has exactly one bounded executable delegation of
      remote-status through the trusted control entry and no executable direct
      installed-CLI equivalent.
  - id: AC3
    condition: >
      The remote-approval workflow has exactly one bounded executable delegation of
      remote-approve through the trusted control entry, retains exact Human
      approver attribution, and has no executable direct installed-CLI equivalent.
  - id: AC4
    condition: >
      The approved-remediation workflow has exactly one bounded executable
      delegation of approved-remediation-wakeup through the trusted control entry
      and no executable direct installed-CLI equivalent, without duplicating
      profile-forwarding authority owned by dedicated regressions.
  - id: AC5
    condition: >
      The synthetic dispatch used by the remote-status read-only test is a valid
      current first-seen profile-aware PRIMARY authorization with matching
      authorization and admitted-RUN execution-profile identity and current durable
      dispatch record semantics.
  - id: AC6
    condition: >
      The remote-status read-only regression still proves stored SUCCEEDED status,
      RESULT_AVAILABLE observation, bounded rendered facts, and byte-for-byte
      preservation of persisted state after observation.
  - id: AC7
    condition: >
      Existing manual/self-hosted/GitHub-read-permission/no-push/no-PR/no-checkout
      invariants remain covered, detailed Control Source mechanics remain owned by
      tests/test_control_source_isolation.py, and no production, Runtime,
      lifecycle, profile-policy, Reviewer, Publisher, measurement, or roadmap
      behavior changes.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_remote_surface.py tests/test_control_source_isolation.py
    - git diff --check
