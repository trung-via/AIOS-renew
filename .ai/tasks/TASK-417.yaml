task_id: TASK-417
revision: 1
goal: Activate the already-published CAA-03 four-flow advisory immediately as a Human-authorized,
  bounded, optional non-decisive pilot for the next ten distinct future canonical
  TASK identities, preserving Brain's independent semantic verdict and all existing
  Human/Executor/Runtime/Reviewer/Publisher boundaries. Observe those ten prospective
  tasks before any independent threshold/holdout decision and before any consideration
  of CAA-05.
problem: CAA-01..04 are source-published capabilities but consult_flow defaults disabled,
  CAA-04 EvaluationSession defaults disabled and enforces exact preregistration for
  decisive evaluation/shadow. The Human now authorizes CAA advisory use immediately
  and explicitly postpones threshold evaluation and any CAA-05 consideration until
  observing ten following TASKs. Merely changing roadmap words or claiming that CAA-04
  quality gates are met would falsely activate an unproven production consumer, self-scoring
  or extra workflow authority. An optional bounded caller/Brain-facing activation
  and factual non-decisive observation boundary is needed without imposing audits,
  replacing final direct authoring or bypassing provider-cost/source authorization.
assumptions:
- Current explicit Human priority 2026-10-24 authorizes prospective controlled CAA
  advisory activation and ten-TASK exploratory observation, not training, automatic
  provider selection, unrestricted paid calls, or declaration that quality thresholds
  have been reached.
- Canonical main at source capture is 5117cb2943e993132909dc1368f483e019674809, including
  published TASK-416 PTE Information-Only v2; exact CAA-01..04 published lineages
  remain source-authenticated by the existing reader.
- Human's prior explicit CAA-program Executor preference was Codex GPT-6.1 Sol Max;
  this TASK's authoring does not itself create/delegate RUN or independently select
  an Executor.
- CAA-03 consult_flow is an existing optional provider-neutral one-call advisory with
  enabled=False default and explicit enabled=True per eligible caller subject. CAA-04
  decisive evaluation requires a separate exact Human preregistration and trusted
  plan/provider cost cap; this plan does not implicitly create those.
- After TASK-415 published and TASK-416 published, no unrelated CAA-05 or other successor
  is preapproved by older roadmap. This current Human activation may prospectively
  select this bounded program action but cannot rewrite TASK-415/416 prior selection
  or immutable lineages.
- Provider and spending permission must be established independently at actual invocation;
  no hardcoded paid provider/model, invented spend authorization or caller echo can
  establish it.
