constraints:
  hard:
    - >
      The sole production Python behavior change is replacing
      _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA: str | None = None with the exact literal
      _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA: str | None =
      "8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29". No list/set, mutable lookup,
      environment/config override, current-main derivation, network discovery, fallback
      or self-derived activation is permitted.
    - >
      Production staging through bootstrap_source_successor_primary with transport_path
      absent must accept only intent.target_generation_sha equal to exact
      8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29. Every other target must fail before target
      clone/staging, installed-generation attestation, target invocation or fresh
      successor RUN admission.
    - >
      Bound target consumption through --accept-transport must remain independent of the
      target source's own activation constant. The exact published TASK-218 target
      8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29 contains
      _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA = None and must still consume an already
      bound exact transport after source/path/intent/lineage validation. Do not move or
      duplicate the staging activation guard into target-side consumption.
    - >
      Preserve TASK-218 exact successor semantics byte-for-byte outside the activation
      literal: completed failed source-bootstrap edge selection, immutable historical
      handoff/RUN/FAILURE, same TASK id, strictly newer pre-authored revision, clean
      fast-forward current control, unchanged legacy pin, same Executor, exact target
      source, short deterministic filesystem locator with full durable identity,
      target-side revalidation, fresh PRIMARY Runtime delegation, exact replay and
      at-most-one successor RUN/Executor invocation.
    - >
      Preserve _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA =
      44eee353eda376c9db8cd88d97184d3122651bf5, _SOURCE_UPGRADE_TARGET_SHA =
      44eee353eda376c9db8cd88d97184d3122651bf5, _SOURCE_BOOTSTRAP_TARGET_SHA =
      31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 and _BOOTSTRAP_TARGET_SHA =
      83115b26df85a7ad6643f317833e18b18586bdbe exactly.
    - >
      Update deterministic tests so production state proves exactly one
      _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA literal equal to
      8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29; representative non-activated targets,
      including 44eee353..., 31fd2482..., fixture/current/future values, reject before
      staging; and fixture activation remains explicitly test-only where needed to
      exercise transport behavior.
    - >
      Add a regression proving the staging/target activation split: staging under an
      explicitly activated control source may bind and launch the exact target, while a
      fresh target interpreter whose production _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA is
      None can consume the exact --accept-transport path and reach the existing successor
      PRIMARY delegation after all target-side validations. Wrong path, altered stored
      intent, wrong source/HEAD and conflicting identities must still fail before RUN.
    - >
      Documentation may prospectively authorize one explicit Human-selected local
      PowerShell/shell invocation as the subordinate transport carrier for the
      demonstrated Python Agent post-terminal TASK-259 successor continuation. The shell
      may only construct/write the exact version-1
      AIOS_SOURCE_BOOTSTRAP_SUCCESSOR_INTENT, select/materialize the exact published
      TASK-219 activation/control source, locate the existing worker Python, and invoke
      scripts/aios_control_entry.py with bootstrap-source-successor-primary. It owns no
      eligibility, target selection, TASK revision selection, RUN allocation, profile,
      verification, review, publication or roadmap semantics.
    - >
      The Human-local successor carrier is explicit, one-time and non-automatic. Runtime,
      Executor, workflow, provider and retry logic cannot select it. It is not a reusable
      automation surface, generic bootstrap permission or extension of TASK-217's
      source-upgrade carrier. Reusable automated successor transport would require a
      separately reviewed repository-owned carrier.
    - >
      The real downstream successor intent must be authored only after a fresh downstream
      Brain Sync and canonical TASK-259 revision 2 exist. It must bind exact RUN-259-001,
      TASK-259 prior revision 1 and successor revision 2, exact then-current downstream
      control/TASK blob/authoring commit, unchanged legacy pin/source generation
