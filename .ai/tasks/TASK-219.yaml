    Canonical AIOS-renew main at TASK-219 authoring is exactly
    8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29.
  - >
    TASK-218 r1 canonical successful lineage is RUN-218-003 RESULT,
    REVIEW-218-001 PRIMARY PASS and Publisher publication of exact
    8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29. RUN-218-001 and RUN-218-002
    remain immutable historical FAILURES/correction lineage.
  - >
    Current production _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA is exactly None. Current
    _SOURCE_REPAIR_BOOTSTRAP_TARGET_SHA remains exact
    44eee353eda376c9db8cd88d97184d3122651bf5, _SOURCE_UPGRADE_TARGET_SHA remains exact
    44eee353eda376c9db8cd88d97184d3122651bf5, _SOURCE_BOOTSTRAP_TARGET_SHA remains exact
    31fd2482cd87d97fd818e05eb5b4dcec69ffeee6, and _BOOTSTRAP_TARGET_SHA remains exact
    83115b26df85a7ad6643f317833e18b18586bdbe.
  - >
    TASK-218 intentionally checks production activation only on the staging side when
    transport_path is absent. The exact bound target consumes --accept-transport after
    verifying its durable intent/source identity and must not require its own
    _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA to match, because the target is the earlier
    published TASK-218 source whose activation slot remains None.
  - >
    Current Python Agent canonical main remains
    95f47b9a5832835b9a4265c892b813e492270cf8 with active AIOS-renew pin
    31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 and canonical failed
    RUN-259-001 for TASK-259 revision 1. TASK-259 revision 2 does not yet exist and this
    task must not author or execute it.
  - >
    TASK-217 permits an explicit Human-local subordinate carrier only for the earlier
    bootstrap-source-upgrade-primary circular-bootstrap case. TASK-219 must not silently
    generalize that rule; any local successor carrier authority must be stated separately
    and narrowly for bootstrap-source-successor-primary.
  - >
    BP-9 downstream adoption remains the Human/Brain planning NEXT. TASK-219 is only the
    exact activation/transport prerequisite and does not mutate downstream state or claim
    BP-9 completion.

