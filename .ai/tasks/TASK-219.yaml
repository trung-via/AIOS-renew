task_id: TASK-219
revision: 1

goal: >
  Activate the exact reviewed and published TASK-218 post-terminal source-bootstrap
  successor consumer by binding the single production
  _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA allowlist slot to exact generation
  8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29, and document one explicit Human-local
  subordinate carrier for the demonstrated Python Agent TASK-259 successor-revision
  continuation. Preserve the TASK-218 successor contract, target-side consumption,
  Runtime PRIMARY authority, all other activation families, downstream state, Reviewer,
  Publisher and frozen-Kernel boundaries unchanged.

problem: >
  TASK-218 revision 1 introduced the bounded post-terminal same-TASK strictly-newer
  revision PRIMARY capability required after Python Agent RUN-259-001 exposed a TASK-259
  r1 authoring contradiction that cannot be repaired within r1 scope. TASK-218 completed
  through RUN-218-003 RESULT, REVIEW-218-001 PRIMARY PASS and exact publication at
  8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29. Its production successor consumer remains
  intentionally closed because _SOURCE_BOOTSTRAP_SUCCESSOR_TARGET_SHA is None. A separate
  post-publication activation is therefore required before any real downstream successor
  staging. Python Agent also has no repository-owned workflow for this new successor
  command, while TASK-217's Human-local exception is intentionally scoped only to
  bootstrap-source-upgrade-primary. The remaining bounded work is to activate exactly the
  published TASK-218 source and prospectively authorize one explicit Human-selected local
  shell as transport for this demonstrated successor continuation, without granting the
  shell lifecycle semantics or generic bootstrap authority.

assumptions:
