      8a8e4331bf3dd3b70c6900b016a2200e9d3ffc29 and Executor codex. TASK-219 must not
      invent or hard-code future r2 control/blob identities.
    - >
      A local pre-AIOS carrier/staging failure remains operational only and fabricates no
      RUN, FAILURE, RESULT, verification, REVIEW, publication or roadmap completion. Once
      the exact target admits a successor RUN, canonical Runtime artifacts become
      engineering truth.
    - >
      No production Python outside the single activation literal may change. Tests may
      update exact production expectations and add focused staging/target split/rejection
      coverage only. Documentation changes only AIOS-BRAIN-PORTABILITY.md.
    - >
      Executor returns one clean candidate with zero unresolved implementation items and
      does not author/execute downstream successor work, review, publish, mutate roadmap
      state or claim BP-9 completion.

