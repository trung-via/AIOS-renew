task_id: TASK-419
revision: 1
goal: Replace the TASK-417 opt-in ten-task CAA pilot with a flow-triggered, always-attempted,
  evidence-aware CAA advisory in all four existing Brain-owned flows, using search
  across the complete authenticated canonical AIOS engineering history rather than
  the eight-task reader window. CAA proactively provides source-grounded improvement
  proposals or explicitly provisional evidence-acquisition hypotheses before Brain
  independently makes the final semantic decision. No new lifecycle or provider/spend
  authority.
problem: 'Current published TASK-417 pilot sets roadmap enabled=true but brain_provider.consult_advisory(enabled=False)
  is an uncalled optional helper; ordinary Brain authoring can bypass it silently.
  TASK-418 r2 and REPAIR-418-002/003/004 were authored without CAA advice. CAA-01
  MAX_TASKS=MAX_EPISODES=8 and 128 refs cap constrain per-query evidence reach; caller-supplied
  provider/profile/atomic spend reservation and exact first-ten-new-TASK cohort often
  yield UNAVAILABLE or zero proposals, including before a new TASK exists. Human 2026-10-25
  expressly supersedes that default: always initiate CAA for ARCHITECTURE, TASK_AUTHORING,
  REPAIR_AUTHORING, REMEDIATION_AUTHORING; remove pilot/cohort/per-call Human activation
  dependencies and search all canonical history. Preserve source integrity/privacy,
  Human spending authority and Brain final decision. The complete-history source is
  canonical Git and exact lineage, never model memory.'
assumptions:
- 'Fresh canonical main and authoritative root at authoring: c729ace821510116886b51958fb24149f6b72163
  (task TASK-418 r2); TASK-417 r1 source on main from reviewed/published RUN-417-002.
  TASK-418 RUN-418-001..004, authorized REPAIR branches and carrier issues retain
  exact independent lifecycle truth; this new Human priority prospectively supersedes
  only the Lean VP planning NEXT, not an in-flight RUN, old TASK contract or its repair/verification
  authority.'
- Current .ai/roadmap-state.yaml human_caa_ten_task_advisory_20261024 record is historically
  approved but prospective 10-TASK/optional mode is now replaced by explicit 2026-10-25
  Human decision. Original TASK-417 must not be modified or retrospectively reinterpreted;
  CAA-04 independently registered evaluation and CAA-05 conditional training remain
  unselected, not prerequisites for ordinary CAA recommendations.
- 'Sources verified read-only: src/aios_renew/brain_context.py resolve_flow and DecisionPacket
  composition; brain_provider.py attempt and consult_advisory; caa_integration.py
  consult_flow/_consult_pilot; caa_reasoner.py consult A1/B1; caa_experience.py authenticated
  ExperienceCut and MAX_TASKS=MAX_EPISODES=8. Flow Card ownership and existing Task/Repair/Remediation
  ingress must remain unchanged.'
- The selected active Brain host/invocation and the ChatGPT conversation UI are not
  automatically the same as the Python first-party library. Test and document the
  actual supported host call boundary; if this repo cannot control an external chat
  host, do not invent automatic activation evidence on that host.
- CAA reasoning is advisory and source-aware. A useful source-grounded change cannot
  be guaranteed when canonical evidence is missing or contradicts the draft; a distinct
  provisional hypothesis/evidence-acquisition recommendation may still be returned,
  but never asserted as OBSERVED. No new external billable provider call is authorized
  by this decision.
