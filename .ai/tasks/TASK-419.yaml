non_goals:
- No new or changed CAA-02 A1/B1 algorithm, ranking logic, model prompt, advice schema,
  expected advice count, obligatory fallback hypothesis, quality grading, suggestion
  selection rules, causal inference or abstention policy; preserve CAA-02 and CAA-04
  implementation source unchanged.
- No new Planner, Flow Card, generic execution/lifecycle router, provider/model chooser,
  billable external service, persistent independent truth store, automatic repair/dispatch/review/publish,
  new audit, training/CAA-05 or frozen Kernel change.
- No rewrite of historic TASK-417/TASK-419 r1/RUN/FAILURE/REVIEW/publication identity;
  no interruption, replacement or automatic completion of concurrently active TASK-418
  repair; no automatic downstream pin update, KA-01 activation or full test suite.
constraints:
  hard:
  - Prospectively record the Human-approved narrow CAA access/default decision as
    the unique relevant planning commitment; retire the prior optional ten-TASK pilot
    only for future CAA eligibility, preserving prior Human decisions and immutable
    TASK-417 engineering history. Do not infer lifecycle completion or automatic roadmap
    progression from authoring.
  - Connect the EXISTING CAA-03 consultation at the current supported first-party
    Brain decision boundary after canonical Brain Sync/flow and relevant subject/draft
    composition, before the final Brain semantic decision, for each of four named
    flows. Call should occur by default under the flow, not rely on manual Brain recollection,
    enabled=True or per-case Human activation. Brain remains free to accept/adapt/reject,
    and CAA output is neither an ingress authorization nor normative audit prerequisite.
  - Remove pilot admission checks (ten TASK count/identity, pre-existing TASK exclusion,
    per-call opt-in flag) and additional TASK-417 provider/profile/reserve_call gates
    from normal consultation access. Do not introduce substitute gates with different
    names. Continue to use the existing CAA-02 provider-neutral mechanism exactly
    as published; do not mandate or fabricate a model call or additional proposal
    under unsupported evidence. Genuine source/subject authentication remains authoritative.
  - Expand CAA historical-search reach to all authenticated available canonical engineering
    history, not just eight TASKs or episodes per consultation. Reuse the existing
    CAA-01 validator/provenance source path, preserve snapshots and privacy, and allow
    internal incremental/batched retrieval where necessary; selection of concise relevant
    evidence for advisory must not silently exclude the remainder of searchable history.
    No independent mutable truth database or source-inventing fallback.
  - Keep CAA-02 implementation and its A1/B1 semantics, original suggestion count
    limits as already published, relevance/evidence/citation/uncertainty rules, no-advice/abstain
    outcomes, and CAA-04 independent evaluation untouched. Do not force 1-3 recommendations
    or any provisional recommendation where existing CAA returns none; no rewriting
    of what CAA thinks or how it makes suggestions.
  - Authentic original Brain/Runtime/Reviewer/Publisher boundaries, exact historical
    correction lineage, currentness and no private raw outputs survive. CAA failure
    cannot become a new authoring admission gate; source authentication failure still
    follows existing fail-closed policy.
  - Only claim default-on operation for a host invocation path that is genuinely integrated
    and demonstrated; a Python-only integration must not be claimed as automatic operation
    within an uncontrolled remote chat host. Explicitly disclose any unintegrated
    host boundary as evidence gap, not as fabricated success.
  - Minimum-sufficient focused verification only; no full suite, ceremonial recheck
    or unrelated implementation changes.
acceptance:
- id: AC1
  condition: The Human-approved replacement of the TASK-417 opt-in ten-TASK CAA access
    policy is recorded prospectively with one coherent roadmap NEXT, while TASK-417,
    TASK-419 r1 and all prior lineage remain exact immutable history.
- id: AC2
  condition: In the actual supported first-party Brain decision invocation path, each
    of ARCHITECTURE, TASK_AUTHORING, REPAIR_AUTHORING and REMEDIATION_AUTHORING automatically
    initiates the existing CAA-03 advisory before Brain's final decision without manual
    opt-in or enabled=True, while Brain remains free to accept, adapt or reject.
- id: AC3
  condition: CAA consultation eligibility no longer depends on TASK-417 ten-TASK cohort,
    TASK first-authoring date or identity, Human per-consult activation, or separate
    TASK-417 provider/profile/reserve_call gates. An unauthored TASK, an independent
    ARCHITECTURE decision and a REPAIR of an older TASK can reach the ordinary CAA
    consult path.
- id: AC4
  condition: CAA historical retrieval can search the full available authenticated
    canonical TASK/revision/RUN/terminal/correction/review/publication corpus without
    an eight-TASK/eight-episode ceiling. A test demonstrates a relevant episode past
    the previous window is discoverable with its original authenticated lineage and
    temporal integrity.
- id: AC5
  condition: CAA-02 B1/A1 reasoning semantics, existing bounded suggestion grammar/count,
    evidence validators, uncertainty and abstention/no-material-advice behavior are
    unchanged. No forced hypothetical/synthetic advice or new model-call contract,
    provider selector or promise of a proposal is introduced; focused regressions
    compare old and new advisory contracts.
- id: AC6
  condition: Genuine source/currentness/subject/candidate integrity and privacy controls
    remain effective; advisory does not decide final TASK/REPAIR/REMEDIATION strategy,
    issue lifecycle authorization, verify, review, publish or block otherwise valid
    direct authoring merely because CAA advice is absent.
- id: AC7
  condition: Focused integration tests exercise actual four-flow auto-invocation and
    full-history search while preserving CAA-02/CAA-04 behavior and original Human-on-demand
    TCA/ROA/MOA and soft AOA policy; no false assertion that unrelated ChatGPT/host
    sessions auto-execute Python code.
