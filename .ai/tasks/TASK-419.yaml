task_id: TASK-419
revision: 2
goal: Correct the existing CAA integration so that CAA consultation is initiated automatically
  in each of four existing Brain-owned decision flows, remove the optional ten-TASK
  pilot and special activation/eligibility/provider gates that suppress ordinary consultation,
  and enable historical retrieval across the complete available authenticated canonical
  AIOS engineering history rather than an eight-TASK/episode search window. Preserve
  the existing CAA-01/02/03/04 advice/reasoning behavior and Brain final semantic
  authority; change nothing beyond activation/access and necessary compatibility.
problem: 'TASK-419 r1 at canonical main 603d920ea74af486945cbc9dc4c4362b99b3c3c7 was
  prematurely authored before Human approval and overprescribed CAA outcomes: mandatory
  1-3 material suggestions, forced provisional hypothesis without evidence, native
  Brain/provider usage constraints, and cost assertions. Human 2026-10-25 explicitly
  approved a strictly narrower correction: default-on CAA in ARCHITECTURE, TASK_AUTHORING,
  REPAIR_AUTHORING and REMEDIATION_AUTHORING; remove prior Human-per-call activation,
  TASK-417 ten-TASK cohort and canonical TASK identity eligibility, separate provider/profile/reserve_call
  prerequisites as blockers to the default CAA consult, and the eight-TASK/episode
  historical search ceiling; preserve ALL existing CAA mechanics and advisory semantics.
  TASK-417 opt-in API is currently easily bypassed; ordinary Brain decisions, including
  TASK-418 repairs, did not obtain CAA advisory. This r2 supersedes unexecuted r1
  semantics prospectively, not the historical r1 identity. No RUN-419, PRIMARY wake
  or implementation artifact was found on the canonical 603d... snapshot.'
assumptions:
- At revision authoring canonical main is 603d920ea74af486945cbc9dc4c4362b99b3c3c7
  with exact TASK-419 r1 and published TASK-417 code. Runtime must reauthenticate
  current main, original TASK root/revision, absence of an incompatible admitted RUN,
  and revision authorization before mutation or execution.
- Human's explicit latest consent is to execute the narrow correction only, not to
  redesign CAA-02, prescribe suggestion count/format, change retrieval ranking/causal
  grammar, select CAA-05, alter independent CAA-04 evaluation, activate a new model,
  or add policy gates.
- CAA code currently includes brain_provider.consult_advisory(enabled=False), caa_integration
  consult_flow/_consult_pilot, CAA-01 capture_experience_cut/reconstruct_episodes
  with MAX_TASKS=MAX_EPISODES=8; current roadmap preserves ten-TASK pilot selection
  as Human planning history. These are evidence about pre-change access, not evidence
  that any CAA advice was used.
- Existing CAA-02 A1/B1 behavior, provider invocation semantics, evidence/citation/uncertainty
  validation and legitimate abstention outcomes remain valid. Removing separate CAA-417
  profile/reserve gates is not permission to fabricate a live model call or modify
  CAA-02 outputs. Existing Brain provider resources may be reused through their established
  lawful transport without a new selector.
- Provenance is canonical Git/immutable engineering lineage, not chat summaries; candidate/subject
  freshness, privacy, exact correction and Runtime identity checks still apply. CAA
  remains advisory; Reviewer and Publisher maintain distinct authority. Actual ChatGPT
  or other external host invocations are not assumed to be controlled by this repository's
  Python modules.
