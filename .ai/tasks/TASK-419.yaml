non_goals:
- No changes to frozen Kernel, no new Planner/Flow Card/second Brain/router/lifecycle
  controller, independent model memory, writable DB or canonical truth store; no auto
  TASK/REPAIR selection, executor assignment, dispatch, Runtime verification, semantic
  Reviewer verdict, Publisher publication or automatic roadmap advancement.
- No requirement to use CAA suggestions, CAA-issued approval/audit PASS, no CAA gate
  or serialized advisory prerequisite for Runtime ingress. Human-on-demand TCA/ROA/MOA
  and soft AOA remain independent.
- No claim of full-history coverage from top-k retrieval, a first page, an unchecked
  index or a failed traversal. No silent eight-TASK cap under a different constant;
  no loading the entire corpus into a single provider prompt.
- No secret/raw/private source to model, fabricated citations, fabricated technical
  root cause, hindsight over pre-author history, forced confidence or guessed effect.
  No unapproved additional external paid model calls/provider chooser or cross-provider
  fallback.
- No automatic CAA-04 decisive quality PASS/holdout, training/CAA-05, historical record
  rewrite, PTE workflow constraint, Lean VP G3/G6/C2 activation, downstream pin changes
  or full test suite.
constraints:
  hard:
  - Prospectively canonicalize one new dated Human/Brain CAA default-on planning record
    selecting this CAA integration slice as the sole NEXT; supersede only the prospective
    Lean VP TASK-418 r2 planning bookmark, which remains in-flight historical exact
    engineering lineage, and supersede TASK-417 optional/cohort activation prospectively
    while retaining its immutable TASK/RUN/REVIEW/publication evidence.
  - For each eligible Brain-owned ARCHITECTURE, TASK_AUTHORING, REPAIR_AUTHORING and
    REMEDIATION_AUTHORING decision, the existing supported first-party Brain flow
    must automatically attempt one CAA consultation after canonical Brain Sync/flow/subject/candidate
    composition and before final Brain judgment, without human re-activation, explicit
    per-call enabled=True, caller remembering a helper or an audit selection. No mandatory
    extra model round trip or CAA-created second flow/router; Brain explicitly independently
    accepts, adapts or rejects the advice.
  - Retire the ten-task admission cohort, TASK identity requirement for an unauthored
    TASK/ARCHITECTURE subject, CAA-04 activation prerequisite and extra provider/profile/reserve_call
    requirements as blockers to ordinary CAA advice. Reuse source-bound current Brain
    cognitive capacity and existing deterministic retrieval/reasoner for best-effort
    advice without acquiring a new paid external provider. Any additional paid external
    model invocation still requires valid authorization; absence of such authorization
    cannot suppress the ordinary native Brain/structured advisory path.
  - Remove the fixed eight-TASK/eight-episode candidate search ceiling for CAA advisory
    and build one read-only authenticated full-history traversal/index over all available
    canonical TASK revisions and matching RUN/RESULT/FAILURE/REPAIR/REMEDIATION/REVIEW/publication
    refs at a fixed source snapshot, with complete coverage/provenance representation.
    Streaming/chunking and an integrity-checked rebuildable derived cache are allowed
    only as performance mechanisms, never a new truth source. Select a relevance-ranked
    finite working set from the *entire* searched corpus for Brain/model context;
    no first-eight or first-page bias. Always distinguish full coverage from partial/error;
    never claim full historical search when sources unavailable. Protect bounded memory/context/latency
    via work batching and reuse without a fixed historical coverage exclusion.
  - 'CAA returns a usable, source-bound advisory before final decision on every safely
    authenticated supported flow: 1-3 material recommendations with evidence when
    possible; when no historical support/provider is available, at least one clearly
    PROVISIONAL diagnostic/falsifier/evidence-acquisition recommendation derived from
    available authenticated subject facts, never invented OBSERVED facts. No blanket
    early NO_MATERIAL_ADVICE or UNAVAILABLE merely because old pilot membership, per-call
    flag, provider or 8-TASK ceiling fails. When authentic source identity/subject/currentness
    cannot be proved, the existing original Brain authority guard still fails closed;
    an ungrounded proposal cannot authorize mutation.'
  - Retain strict correction identity/SHA/subject source and historical temporal isolation,
    no source substitution, hidden raw diagnostic, private path, credential or untrusted
    instruction forwarding; model recommendations are hypotheses not canonical evidence.
    Human risk and spend authority are unchanged, and Executor HOW, Runtime verification,
    Reviewer verdict and Publisher inclusion are untouched.
  - Use the existing first-party Brain caller/transport; if this repository cannot
    force an external ChatGPT session or another unmanaged host to call the CAA API,
    report an explicit host-integration limitation and do not claim platform-global
    activation from Python tests. The supported host path must be demonstrably exercised,
    not only isolated consult_flow unit tests.
  - Do not rerun old canonical verification or expand full suite; use a single focused
    minimum-sufficient-v1 verification on the changed full-history reader, four-flow
    automatic consultation, evidence/partial-source behavior, original direct-authoring/authority
    and preserved unrelated paths.
acceptance:
- id: AC1
  condition: Exactly one prospective canonical planning NEXT selects default-on CAA
    flow integration from explicit 2026-10-25 Human decision; old TASK-417 pilot/cohort
    and TASK-418 Lean VP selection become preserved historical planning only, with
    every immutable engineering lineage and no retroactive automatic transition.
- id: AC2
  condition: On the first-party supported Brain entrypoint, each of ARCHITECTURE,
    TASK_AUTHORING, REPAIR_AUTHORING and REMEDIATION_AUTHORING automatically performs
    a source-bound CAA advisory attempt before Brain final semantic authoring, without
    optional enable flag or user prompt; direct Brain judgment remains independent.
    Show an integration-level test of that entrypoint, not just a manually called
    consultation helper.
- id: AC3
  condition: CAA retrieval searches the complete enumerable authenticated canonical
    AIOS engineering history across all TASK identities, revisions and available terminal/review/correction
    lineage at a pinned snapshot, without an eight-TASK/episode ceiling; positive
    tests place a decisive matching episode past the eighth task and prove its discoverability
    with correct provenance and full-coverage accounting.
- id: AC4
  condition: An unauthored TASK and a standalone ARCHITECTURE flow receive best-effort
    CAA proposals without pilot/cohort/task-identity gating; repeat REPAIR/REMEDIATION
    of an older TASK remains eligible; no 10-task closure, extra Human activation,
    separate live provider/profile/reserve gate or discretionary helper invocation
    blocks default advisory.
- id: AC5
  condition: "For source-valid ordinary flows, CAA emits 1\u20133 materially specific\
    \ proposals when cited evidence exists and at least one honest PROVISIONAL evidence-acquisition/falsifier\
    \ proposal when no relevant history or additional provider exists, marking evidence\
    \ status and uncertainty without claiming unsupported past outcomes. Canonical\
    \ source-authentication failures never become fake grounded advice or mutation\
    \ permission."
- id: AC6
  condition: CAA provenance/citation and source snapshot checks reject forged/changed
    subject, candidate, main, temporal leakage, private sources and injected commands;
    full-history snapshots do not silently mix future lineage or provide a second
    state store. Search resource pressure is transparently reported as partial instead
    of falsely asserting complete coverage or dropping already grounded best-effort
    advice.
- id: AC7
  condition: Brain can expressly accept, modify or reject CAA advice; absent/invalid
    material advice does not become a new Runtime gate, CAA review verdict, automatic
    retry, dispatch or acceptance claim. Existing TCA/ROA/MOA on-demand and soft AOA,
    Executor, Runtime, Reviewer, Publisher authority remain unchanged.
- id: AC8
  condition: No added billable external provider call occurs without existing authorization.
    Default CAA path can produce useful structured/native Brain advice without trusted
    external CAA provider. Tests prove no redundant external invocation and no misleading
    live-provider success from fixture-only simulation.
- id: AC9
  condition: Focused regression checks exercise actual supported first-party host
    call boundary, all four flows, entire-history indexing/relevance, source movement,
    null history, privacy/partial-coverage outcomes and noninterference with direct
    authoring; do not claim automatic operation on unintegrated ChatGPT/other external
    hosts.
