acceptance:
- id: AC1
  condition: Implement exact independently bound prospective v1.3 semantic TASK/contract/mapping
    source intake with full reviewed acceptance and distinguishing proof coverage
    under separately authenticated Human selection; no legacy parse_task/ingress or
    V1/V2 command-policy reinterpretation. Reject stale, false, conflicting, omitted,
    cross-source, unapproved or synthetic proof declarations.
- id: AC2
  condition: One controlled preactivation G3 admission authenticates the original
    current ACTIVE RUN and immutable operation-specific PRIMARY, AUTHOR_REPAIR and
    CHANGES_REQUIRED REMEDIATION authorizations; original failed predecessor/action/scope/origin
    affected verification and selected outstanding findings/affected proof/DELTA review
    cannot be forged or inherited from another RUN.
- id: AC3
  condition: Existing Dispatcher/ExecutorBoundary/RuntimeCompletion integrates current-RUN
    real sticky live native invocation/lease/profile/model/effort for PRIMARY, REPAIR
    and REMEDIATION under real admitted operation context, with no second Executor
    dispatch; positive supported native path works offline and wrong/lost/reconstructed/unsupported
    native frame stops.
- id: AC4
  condition: Exactly one Runtime-owned proof scheduler binds the complete semantic
    obligation population and real native checkpoint/terminal evidence, preserves
    distinct integration/concurrency/order/repetition conditions, reuses genuinely
    VALID original L2-03 source proof with original outcome/subject, and denies UNKNOWN/INVALIDATED
    fake PASS or base replay absent all BR-1..BR-6. G3 exact versioned source-to-target
    reuse must be accepted by original canonical EVIDENCE validators across changed
    Git tree without relaxing V1/V2 equal-binding requirements, preserving original
    source run/subject/outcome/raw digests; Runtime/Publisher accept only authenticated
    current target witness under closed schema. Positive and explicit stale/changed-source
    counterexamples are required.
- id: AC5
  condition: "Actual committed K1 \u2192 decisive F1 \u2192 same current-RUN scoped\
    \ Executor correction \u2192 distinct causally progressing committed K2 and terminal\
    \ reuse operates where authorized for each operation. Enforce exact predecessor/ordinal/digest/one-time\
    \ consumption, bounded factual feedback without fix strategy, untouched original\
    \ action/findings, and never rerun equivalent final proof."
- id: AC6
  condition: Versioned C.8 immutable original per-RUN limits and authenticated independent
    overrides, defaults corrections=2/checkpoints=3/wall=240m/Runtime verification=180m
    within wall/max_tokens=null, resource debit/reservation/settlement, withdrawal
    and STOP enforce through every operation/effect/crash/cleanup. Unknown accounting,
    prior consent, changed limits or duplicate charge cannot mint capacity.
- id: AC7
  condition: Crash/parallel/replayed carrier, checkpoint, feedback and terminal paths
    preserve immutable records; cross-RUN, changed currentness, stale lease, callback
    after invocation, conflicting ordinal, ACK-as-live, double terminal or terminal
    reopening fail closed and cannot produce extra native work.
- id: AC8
  condition: Production run_task/run_repair/run_remediation and KA-01 remain NOT_ACTIVATED
    without separately authenticated future Human G6 version/operation/policy/profile
    and each future RUN's own consent. G3 real offline tests use existing lawful engineering
    TASK Runtime; no preview fixture or defaults grant live activation.
- id: AC9
  condition: New actual G3 integrated positive and adversarial tests exercise supported
    live native source and all three operation authorities, preserve legacy L1/L2/L3
    API, AST/import and negative correction tests, and retain focused Runtime-owned
    12-worker native verification; no full suite, synthetic PASS, weakened tests or
    omitted obligations. In particular include positive changed-tree L2-03 proof reuse
    and adversarial V1/V2 and G3 canonical artifact/attribution/publication parsing
    compatibility tests in tests/test_artifacts.py, tests/test_verification_contract.py
    and tests/test_publication.py; target RUN proof identity must remain authentic
    and no synthetic target PASS.
- id: AC10
  condition: "Committed result changes only scope.modify and includes bounded integrated\
    \ G3 implementation/coverage document stating supported and blocked/UNKNOWN surfaces.\
    \ Executor gives honest full AC1\u2013AC10 claims; neither RESULT nor tests auto-decide\
    \ Reviewer verdict, Publisher publication, roadmap NEXT, G6 or L4."
