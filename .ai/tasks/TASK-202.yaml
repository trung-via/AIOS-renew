task_id: TASK-202
revision: 4

goal: >
  Preserve the TASK-202 r3 source-bootstrap mixed-RUN and transactional recovery
  semantics unchanged while correcting the TASK completion contract so Executor-owned
  acceptance claims do not pre-assert Runtime-owned verification truth. The implementation
  must still satisfy the same recovery, authority, activation, generation-exact and
  historical-compatibility requirements; deterministic verification remains solely a
  Runtime responsibility after completion-gate admission.

problem: >
  RUN-202-001 executed TASK-202 r3 with Codex gpt-6-sol/high and produced clean candidate
  c4511881c2d1f6f7b9f7c51e2a105276dc51106a within the exact three-path modification
  scope, but Runtime failed at COMPLETION_GATE before verification with
  "RESULT does not satisfy acceptance criteria: AC8". TASK-202 r3 AC8 incorrectly
  combined Executor-claimable semantic preservation with the statements that
  tests/test_operator.py and git diff --check pass. The lifecycle requires complete
  acceptance coverage before Runtime invokes verification, while canonical authority
  assigns verification truth to Runtime rather than Executor. This creates a circular
  gate: Executor must claim a Runtime result that has not yet occurred before Runtime is
  permitted to produce that result. RUN-202-001 remains immutable FAILURE evidence and
  must not be reinterpreted as PASS.

assumptions:
  - >
    Canonical AIOS-renew main at r4 authoring is
    40466c71028821b2a317cc12b8f2895e20d5c1ff and contains canonical TASK-202 r3.
  - >
    Canonical RUN-202-001 is FAILURE at phase COMPLETION_GATE with failed candidate
    c4511881c2d1f6f7b9f7c51e2a105276dc51106a, exact error
    "RESULT does not satisfy acceptance criteria: AC8", executor Codex,
    model gpt-6-sol, reasoning effort high, and verification_seconds=null.
  - >
    RUN-202-001 candidate metadata reports exactly
    docs/AIOS-BRAIN-PORTABILITY.md, src/aios_renew/operator.py and
    tests/test_operator.py changed, descends_from_base=true, dirty=false,
    outside_task_scope=[], repairable=true and transportable=true.
    These facts are diagnostic lineage only; r4 does not declare that candidate verified,
    reviewed, publishable or reusable.
  - >
    TASK-202 r3 architecture remains the intended Brain semantics: mixed simple and
    canonical REMEDIATION RUN history support, one bounded transactional recovery/
    supersession for consumed pre-RUN source-bootstrap v2 edges, same TASK id with an
    explicitly Brain-authored same/newer revision on clean fast-forward current main,
    separate exact target activation, at-most-one RUN/Executor and generation-exact
    completed steady state.
  - >
    TASK-199/TASK-201 historical authority, TASK-198 bootstrap-primary behavior and BP-9
    planning state remain as stated by r3.
  - >
    Verification authority belongs to AIOS Runtime. Executor claims may assert implemented
    semantics and evidence about its committed result, but may not become verification
    truth for required verification commands.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-199.yaml
    - .ai/tasks/TASK-201.yaml
    - .ai/tasks/TASK-202.yaml
    - src/aios_renew/operator.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - docs/AIOS-BRAIN-PORTABILITY.md

non_goals:
  - >
    Change the recovery architecture, target activation model, downstream choreography,
    source-bootstrap v2 identity model or modification scope established by TASK-202 r3.
  - >
    Modify Python Agent, author TASK-255 r6, execute downstream recovery, delete/rewrite
    historical RUN/migration evidence, mutate roadmap state or claim BP-9 complete.
  - >
    Repair, amend or reinterpret RUN-202-001. It remains canonical FAILURE lineage.
  - >
    Treat Executor claims, Executor-run tests, prose assertions or candidate existence as
    Runtime verification truth.
  - >
    Move verification before completion-gate structural admission, weaken required
    verification, or bypass existing Runtime verification/evidence publication.
  - >
    Add generic retry/fallback/failover, Planner/router, automatic revision selection,
    second lifecycle authority, Reviewer or Publisher behavior.

constraints:
  hard:
    - >
      Preserve every TASK-202 r3 mixed-RUN, supersession, transactional commit-point,
      same-TASK successor revision, fast-forward, exact legacy pin, activation,
      idempotency, concurrency, at-most-one RUN/Executor and generation-exact steady-state
      semantic requirement unless this r4 contract explicitly changes completion/
      verification ownership.
    - >
      Migration RUN inspection must accept both canonical simple Run documents and
      kind=REMEDIATION documents by extracting only execution.run for migration identity;
      malformed/unknown/ambiguous/conflicting RUN state remains fail-closed.
    - >
      Recovery remains limited to one consumed, uncompleted source-bootstrap-v2 edge
      with no bound RUN, immutable old evidence, additive exact supersession evidence and
      one separately activated replacement target.
    - >
      Recovery may retain the exact old TASK revision or a strictly newer explicitly
      Brain-authored revision of the same TASK id only on clean attached fast-forward
      current main with byte/blob-identical legacy pin and unchanged source generation,
      repository and Executor authority. Runtime never chooses a successor revision.
    - >
      Before the serialized supersession commit point, the old edge remains active.
      After commit, old/replacement evidence must be complete and mutually bound.
      Partial/orphaned/duplicate/cyclic/concurrent-conflicting evidence fails closed.
    - >
      Recovery itself creates no RUN and invokes no Executor. Only the exact replacement
      target may consume the replacement handoff and admit the replacement TASK through
      ordinary run_task(... synchronize=False ...), yielding at most one bound RUN and
      one Executor invocation.
    - >
      Preserve two-stage activation. TASK-202 r4 may publish recovery capability but may
      not activate its own candidate or mutable main as _SOURCE_BOOTSTRAP_TARGET_SHA.
    - >
      Preserve generation-exact steady state and BP-9 choreography: the first downstream
      adoption candidate after recovered source-bootstrap must pin to the exact activated
      bootstrap consumer target; movement to a newer activation/latest generation is a
      later separate ordinary migrate-primary operation.
    - >
      Acceptance criteria must contain only properties that can be semantically claimed
      from the committed implementation/result before Runtime verification. No acceptance
      criterion may require or imply that a required Runtime verification command has
      already passed.
    - >
      Required deterministic verification remains declared only under verification.required
      and is executed/owned by Runtime after completion-gate admission. Executor may
      provide implementation evidence related to tests but its claim must not substitute
      for Runtime evidence or PASS/FAIL.
    - >
      Preserve TASK-198/bootstrap-primary behavior, source-bootstrap v2 field meanings,
      frozen Kernel boundaries, Runtime verification/RESULT/FAILURE authority,
      Reviewer/Publisher authority and roadmap state.
    - >
      Verification is deterministic/offline and must cover the r3 semantic matrix:
      mixed simple+REMEDIATION RUN history, same-revision exact recovery, higher-revision
      fast-forward recovery, stale/non-fast-forward/different-TASK/different-Executor/
      pin-change rejection, interruption before supersession commit, exact replay,
      conflicting concurrency and generation-exact completed steady state.

acceptance:
  - id: AC1
    condition: >
      Valid mixed simple+REMEDIATION RUN history no longer blocks migration
      reconciliation, while malformed/unknown/ambiguous/conflicting RUN state remains
      fail-closed.
  - id: AC2
    condition: >
      One consumed uncompleted v2 edge with no bound RUN can be transactionally
      superseded without modifying old evidence and only toward the separately activated
      exact target.
  - id: AC3
    condition: >
      Recovery supports either the exact originally bound TASK revision or the same TASK
      id at a strictly newer exact Brain-authored revision on clean fast-forward current
      main; it cannot select/route a revision itself or cross TASK/Executor/repository/
      pin/source authority boundaries.
  - id: AC4
    condition: >
      Before supersession commit the old edge remains active; after commit replacement
      evidence is complete and mutually bound. Partial/orphaned/concurrent/cyclic or
      conflicting recovery cannot create an authority gap, deactivate the old edge or
      grant two successors.
  - id: AC5
    condition: >
      Exact recovery replay is idempotent; edges with a bound RUN/completed marker and
      stale/dirty/non-fast-forward/pin-changed/non-legacy states reject before new
      RUN/Executor creation.
  - id: AC6
    condition: >
      The replacement target retains existing consumed/terminal reconciliation and admits
      at most one exact Runtime RUN/Executor invocation for the replacement TASK.
  - id: AC7
    condition: >
      Completed steady state remains generation-exact and documented BP-9 choreography
      requires the first downstream adoption pin to equal the exact bootstrap consumer
      target; later upstream movement uses separate migrate-primary.
  - id: AC8
    condition: >
      The committed implementation preserves historical TASK-198/bootstrap-primary
      behavior, two-stage source-bootstrap activation, Runtime verification and terminal
      authority, frozen Kernel boundaries, roadmap planning state and the exact allowed
      three-path TASK modification scope, with zero Executor-reported unresolved items.
      AC8 does not assert or require Runtime verification PASS before the completion gate.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check