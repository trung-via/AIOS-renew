task_id: TASK-202
revision: 1

goal: >
  Harden the reviewed source-control legacy-bootstrap protocol so it can operate over
  repositories with canonical mixed PRIMARY/REPAIR and REMEDIATION RUN history, and add
  one bounded Runtime-owned recovery path for an already-consumed version-2
  source-bootstrap handoff that failed before any bound RUN was created. Preserve all
  historical handoff/RUN evidence, exact target activation, single-Executor/single-RUN
  authority, and the invariant that a completed bootstrap leaves the installed
  generation at the exact handoff target.

problem: >
  TASK-199/TASK-201 source-bootstrap is production-activated for exact target
  ff29666d50eaf9276ab62d944018f2bbeb91f073. Real BP-9 downstream use against
  trung-via/python_complete_agent exposed two previously untested boundaries. First,
  _migration_run_terminal currently parses every local .git/aios/runs/*.json with the
  simple _run_from_data schema, while AIOS itself canonically persists REMEDIATION RUNs
  as kind=REMEDIATION documents whose actual Run is execution.run. A repository with
  valid remediation history therefore fails with 'invalid migration RUN record' even
  when no RUN artifact is malformed. Second, that failure occurred after the exact v2
  handoff was durably staged and consumed but before a bound TASK-255 r5 RUN existed,
  leaving an immutable consumed/uncompleted authority edge. Current code has no
  canonical primitive to supersede such a pre-RUN edge; deleting or rewriting it by
  hand would destroy authority lineage. A later target also cannot simply be selected
  by mutable main because TASK-199 requires separate exact activation and target-source
  ownership.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    bbc8f09f38ac4d150060c6fcc851b6da2140e5a0.
  - >
    TASK-199 / RUN-199-001 / REVIEW-199-001 is reviewed/published at exact
    ff29666d50eaf9276ab62d944018f2bbeb91f073 and introduced source-control
    legacy-bootstrap v2.
  - >
    TASK-201 / RUN-201-001 / REVIEW-201-001 is reviewed/published at exact
    bbc8f09f38ac4d150060c6fcc851b6da2140e5a0 and activates only target
    ff29666d50eaf9276ab62d944018f2bbeb91f073.
  - >
    Canonical AIOS Runtime RUN storage includes both simple top-level Run documents and
    kind=REMEDIATION documents whose canonical Run is nested at execution.run.
  - >
    The observed Python Agent diagnostic contains 99 structurally readable local RUN
    records: 85 simple and 14 canonical REMEDIATION records, with zero malformed records.
    Its failed source-bootstrap handoff is version 2, staged and consumed, not completed,
    binds legacy edd7d8d92d54900c56442bbfcddb8648ec4d2e09 to target
    ff29666d50eaf9276ab62d944018f2bbeb91f073 for TASK-255 r5/codex at exact downstream
    source control 73c1f97a093aadc4945ffd43d98592acef6d7826, and has no bound r5 RUN.
    These downstream facts are diagnostic basis only; this TASK must implement reusable
    upstream semantics rather than hard-code that repository or fingerprint.
  - >
    BP-9 remains roadmap NEXT. This TASK is a bounded upstream prerequisite and must not
    advance roadmap state or mutate any downstream repository.
  - >
    A separate successor activation TASK is required after TASK-202 review/publication
    before its exact reviewed consumer SHA may be used as a replacement source-bootstrap
    target. TASK-202 must not self-authorize its eventual candidate.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-199.yaml
    - .ai/tasks/TASK-201.yaml
    - src/aios_renew/operator.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - tests/test_operator.py
    - docs/AIOS-BRAIN-PORTABILITY.md

non_goals:
  - >
    Modify Python Agent or any downstream repository, delete/rewrite downstream RUN or
    migration files, execute a real downstream recovery, or claim BP-9 adoption complete.
  - >
    Change frozen Kernel semantics, TASK/RUN identity, Runtime verification authority,
    Reviewer, Publisher, Executor ownership, ordinary PRIMARY semantics, or the historical
    TASK-198 bootstrap-primary target/behavior except where shared read-only helpers must
    understand existing canonical RUN document shapes.
  - >
    Treat a consumed handoff with an existing bound RUN, terminal RESULT/FAILURE, completed
    marker, malformed identity, ambiguous siblings, or mismatched repository/TASK as
    recoverable.
  - >
    Permit recovery to mutable main/latest, a caller-selected arbitrary target, a target
    not separately activated through _SOURCE_BOOTSTRAP_TARGET_SHA, or a different TASK,
    Executor, source generation, repository, source-control SHA, pin blob, TASK blob,
    TASK authorization commit, or target URL.
  - >
    Loosen the steady-state invariant that ordinary post-bootstrap operation requires the
    actually installed generation to equal the final non-superseded completed handoff
    target. Downstream adoption must pin the bootstrap candidate to that exact consumer
    target before any later ordinary migrate-primary step.
  - >
    Add a generic migration router, retry/fallback/failover loop, automatic correction
    selector, cleanup daemon, second lifecycle store, Planner, Reviewer, Publisher, or
    provider-selection authority.
  - >
    Mutate roadmap planning state or activate the eventual TASK-202 candidate SHA.

constraints:
  hard:
    - >
      _migration_run_terminal (or one bounded helper it delegates to) must accept every
      canonical RUN document shape that current Runtime itself writes into state.runs:
      simple top-level Run documents and kind=REMEDIATION documents whose Run is
      execution.run. It must not reinterpret REMEDIATION semantics or require remote
      review/remediation resolution merely to identify its nested Run.
    - >
      Historical RUNs unrelated to the current migration TASK must remain inert. Only an
      exact Run matching the handoff control SHA, TASK id/revision, Executor and resolved
      repository workspace may become the migration RUN. Existing source-bootstrap
      mismatched-history protections must remain fail-closed.
    - >
      Truly malformed JSON, unknown/unsupported RUN document shape, missing required
      nested Run identity, filename/run_id inconsistency if filename identity is checked,
      conflicting terminal artifacts, or ambiguous matching RUNs must still fail closed.
      Valid REMEDIATION documents may never be classified as malformed merely because
      their Run is nested.
    - >
      Add one explicit bounded recovery/supersession operation for source-bootstrap v2.
      Recovery may proceed only when exactly one authoritative prior v2 handoff is
      selected and fully revalidated, its consumed marker equals its fingerprint, it has
      no completed marker, _migration_run_terminal proves no bound RUN for that handoff,
      and there is no conflicting active migration state.
    - >
      Recovery must preserve the original marker, consumed marker, bound intent and
      transport evidence unchanged. Supersession is additive durable evidence that binds
      the exact old fingerprint to exactly one replacement intent/fingerprint. No rm,
      rename-as-history, overwrite, silent marker mutation, or history compaction is
      allowed.
    - >
      A recovery replacement must preserve source_generation_sha, target_url, repository,
      source_control_sha, pin_path, source_pin_blob_sha, task_id, task_revision,
      task_blob_sha, task_commit_sha and executor exactly from the old bound v2 intent.
      Only target_generation_sha may change, and the replacement target must equal the
      single exact _SOURCE_BOOTSTRAP_TARGET_SHA active in the running reviewed source and
      must differ from the superseded target.
    - >
      Recovery must independently recheck the same clean attached source-control,
      unchanged legacy pin/TASK authorization and installed legacy-generation witness
      required by a fresh source bootstrap before it can stage replacement transport.
      A stale/dirty/detached repository, changed pin/TASK, non-legacy installed
      generation, or unavailable exact target fails before any replacement handoff is
      granted.
    - >
      Superseded pre-RUN edges must remain queryable historical evidence but must not be
      counted as active links by _require_no_active_migration once a valid exact
      supersession exists. Incomplete, cyclic, multiply-superseded, mismatched or
      ambiguous supersession evidence must fail closed. An edge with a bound RUN or
      completed marker can never be superseded by this recovery path.
    - >
      Recovery itself creates no RUN and invokes no Executor. It may only authorize and
      launch the exact replacement target source; the replacement target still owns
      consumed-handoff validation and ordinary run_task(... synchronize=False ...)
      admission. Exactly one bound RUN/Executor invocation remains the lifecycle outcome.
    - >
      Preserve the separate two-stage activation model. TASK-202 implementation may
      publish recovery/compatibility capability but must not replace
      _SOURCE_BOOTSTRAP_TARGET_SHA with its own candidate or mutable main. A separate
      post-publication activation TASK must name the exact reviewed/published TASK-202
      consumer SHA before real recovery can target it.
    - >
      Preserve ordinary completed-handoff steady-state semantics: the final active
      installed generation must equal the final non-superseded handoff target. Add
      regression/documentation making clear that a downstream candidate produced under
      source bootstrap must pin to the exact bootstrap consumer target; later movement to
      a newer activation/latest SHA belongs to a separate ordinary migrate-primary step.
    - >
      Existing TASK-198 bootstrap-primary behavior, legacy _BOOTSTRAP_TARGET_SHA, TASK-199
      intent/handoff version-2 identity fields, Runtime verification, RESULT/FAILURE
      terminal ownership and carrier authority remain unchanged except for the bounded
      compatibility/recovery semantics above.
    - >
      Verification must be deterministic/offline and must model mixed historical RUN
      namespaces and consumed-but-no-RUN recovery without network access, real downstream
      mutation or real Executor invocation.

acceptance:
  - id: AC1
    condition: >
      Mixed valid local RUN history containing both simple and canonical REMEDIATION
      documents no longer blocks source-bootstrap reconciliation; unrelated remediation
      history is ignored for migration matching while exact matching/mismatched migration
      RUN protections remain intact.
  - id: AC2
    condition: >
      Malformed/unknown RUN documents, malformed nested remediation Run identity,
      ambiguous matches and conflicting terminal state still fail closed with no new RUN
      or Executor invocation.
  - id: AC3
    condition: >
      One consumed, uncompleted source-bootstrap v2 edge with no bound RUN can be
      superseded only through explicit exact recovery: original evidence stays immutable,
      one additive durable supersession binds old and replacement fingerprints, and only
      separately activated exact target authority may receive the replacement handoff.
  - id: AC4
    condition: >
      Recovery rejects any prior edge with a bound RUN/completed marker, any changed
      repository/pin/TASK/Executor/source identity, non-legacy installed generation,
      arbitrary/unactivated target, duplicate/cyclic/ambiguous supersession, or conflicting
      migration history before RUN/Executor creation.
  - id: AC5
    condition: >
      A valid superseded edge is historical rather than active for migration gating, while
      the replacement edge retains the existing consumed/terminal/idempotent reconciliation
      semantics and still permits at most one matching Runtime RUN and one Executor
      invocation.
  - id: AC6
    condition: >
      Completed steady state remains generation-exact: ordinary no-migration admission is
      valid only when installed generation equals the final non-superseded target.
      Documentation/tests state that downstream source-bootstrap adoption first pins to
      that exact consumer target; any later newer pin uses ordinary migrate-primary.
  - id: AC7
    condition: >
      Historical bootstrap-primary/TASK-198 behavior, source-bootstrap v2 identity,
      activation separation, Runtime verification/terminal authority and roadmap state are
      preserved, and focused tests plus git diff --check pass with zero unresolved items.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check