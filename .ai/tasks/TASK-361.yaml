non_goals:
  - "No frozen Kernel or Constitution change, no change to Human priority, semantic Reviewer verdict, Publisher eligibility, Runtime verification or correction-strategy authority."
  - "No new planner, lifecycle router, recovery daemon, database, automatic retry/failover, Executor picker, semantic correction selector or separate operational E2E route."
  - "No automatic AIOS_REPO_ROOT update, checkout cutover, local journal copy, historical dispatch replay, remote ref push, force reset, stash, clean, merge, cherry-pick or rebase."
  - "No general unreviewed candidate eligibility, forged/malformed review acceptance or weakening of trust, immutable provenance or negative cases; no auto-REMEDIATION of RUN-359-002."
  - "No implementation of TASK-360 BO-7 itself, no historical task rewrite, no downstream adoption, no global verification policy change."
constraints:
  hard:
    - "Restrict proof-backed automatic Git reconciliation to Runtime lock inside existing PRIMARY pre-RUN. Preserve equal/behind-FF, FAILURE and reviewed-PASS cases and existing fail-closed ahead-only, dirty and ambiguous upstream safety gates."
    - "Qualify structurally valid CHANGES_REQUIRED or BLOCKED canonical reviewed RESULT solely as history-preservation proof when unique exact candidate ref equals local HEAD, with full TASK/revision/RUN/RESULT/EVIDENCE/byte-exact REVIEW decision and applicable predecessor lineage. Never infer Reviewer PASS, correction authorization, publication eligibility or roadmap progression."
    - "Reuse existing review structural and semantic validation; CHANGES_REQUIRED must have valid failed acceptance and precise findings. Reject missing/malformed BLOCKED, unreviewed candidates, decision/artifact substitution, mixed proof classes, aliases, conflicts and any untransported local-only commit."
    - "Reprove canonical main and immutable preservation refs, complete ancestry, local HEAD, branch/upstream, tracked/untracked/assume-unchanged cleanliness, ignored collisions and submodule protections at mutation edge; keep existing lock/CAS and safe generation restart. Admit only existing single exact-target reset after all proofs and verify clean attached-main postconditions."
    - "Keep exact authorized TASK/blob and Human-selected executor/model/effort/dispatch identity through existing workflow, transient control source, persistent repo preflight and durable dispatch. Do not invent a new dispatch or rearm a local terminal FAILED/SUCCEEDED record, even when a fresh clone lacks its journal."
    - "Safe case flows through existing Runtime admission; unsafe case emits bounded typed pre-RUN admission/operational receipt with run_created=false and executor_invoked=false, never fabricating RUN/FAILURE/REPAIR/REMEDIATION. No raw secret/private diagnostics in public receipt."
    - "Include a synthetic real-Git positive reproduction of RUN-359-002 CHANGES_REQUIRED diverged candidate followed by newer TASK-360 main, and negative malformed/stale refs, changed decision/target, extra ancestry, concurrency, dirty state and dispatch redelivery E2E regressions. Unit simulation never claims live self-host success."
    - "Modify only exact scope.modify paths. If a material extra production boundary is required, stop and report a typed blocker for Human rescoping; do not silently widen authority or introduce workflow routing."
    - "Keep existing .git/aios state ownership and history immutable. An independent clean checkout is not a substitute for terminal dispatch evidence and cannot be auto-selected. Preserve current workflow and normative operational navigation without a competing owner."
    - "Runtime alone runs exact minimum-sufficient-v1 verification commands; no default full suite, no test-success inference from Executor assertion, no reinterpretation of historical V1/V2 artifacts."
acceptance:
  - id: AC1
    condition: "Same-head, stale-behind fast-forward, canonical FAILURE and reviewed-PASS H1R behave exactly as before under the existing locked mutation/restart boundary."
  - id: AC2
    condition: "A fully bound reviewed CHANGES_REQUIRED candidate matching clean diverged local HEAD supports preservation-only H1R reconciliation to exact current main, leaving original decision/findings and all remote refs unchanged."
  - id: AC3
    condition: "A reviewed BLOCKED candidate qualifies only with independent complete structural/semantic RESULT/REVIEW and canonical preservation proof; deficient BLOCKED or unreviewed candidates remain ineligible."
  - id: AC4
    condition: "Malformed, missing, stale, conflicting, aliased, wrong-TASK/RUN/revision/sha, invalid findings, forged decision/evidence, mixed families, unpreserved ancestry and extra local commits fail closed without reset, remote mutation, RUN or Executor."
  - id: AC5
    condition: "Dirty tracked/untracked/assume-unchanged, ignored collision, submodule, detached/wrong branch, ahead-only, missing/ambiguous upstream or remote unavailable retain nondestructive rejection or preexisting safe behavior."
  - id: AC6
    condition: "Pre-reset remote main/proof/ref movement, local HEAD/upstream drift, lock/race or unsafe code generation restart is blocked, allowing only exactly reproved main reset with clean attached-main postconditions."
  - id: AC7
    condition: "Existing workflow and self-host wakeup/dispatch bindings can pass exact TASK blob, executor/model/effort and durable dispatch identity through transient control, persistent H1R and normal Runtime RUN admission for a qualified non-PASS preservation case without a new execution route."
  - id: AC8
    condition: "Negative E2E pre-RUN case emits bounded privacy-safe operational/admission refusal with run_created=false, executor_invoked=false and no fabricated FAILURE/REPAIR/REMEDIATION; workflow transport progress is not RUN or verification success."
  - id: AC9
    condition: "An existing terminal FAILED-without-RUN and SUCCEEDED-with-RUN dispatch re-delivery is non-executing/idempotent on original journal; a separate clean checkout cannot silently rearm delivery, migrate journal or update AIOS_REPO_ROOT."
  - id: AC10
    condition: "Existing normative self-host navigation distinguishes automatically recoverable proof-backed cases, typed blocked cases, local journal limitations and separate independent Reviewer/REMEDIATION/REPAIR/Publisher boundaries, with no additional authoritative runbook."
verification:
  policy: minimum-sufficient-v1
  required:
    - "python -m pytest -q tests/test_operator.py -k \"primary_reviewed_result or primary_reconciliation\""
    - "python -m pytest -q tests/test_dispatch_reconciliation.py tests/test_self_hosted_wakeup.py"
