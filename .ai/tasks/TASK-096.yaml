task_id: TASK-096
revision: 1

goal: >
  Extract the existing Unified Human Surface from src/aios_renew/operator.py into one
  dedicated production module while preserving the exact public Operator API and behavior.

problem: >
  TASK-094 and TASK-095 extracted Correction Preflight and Unified State. Unified Human
  Surface remains inside operator.py even though its focused regression surface already
  exists. This P2 slice isolates that established TASK-087 boundary without changing
  lifecycle or execution semantics.

assumptions:
  - Canonical main is 445813d0028cc22d322dc5940fcab283e1a1b6e1.
  - REVIEW-095-001 is PASS with no findings.
  - TASK-087 remains authoritative for Unified Human Surface semantics.
  - TASK-095 remains authoritative for Unified State semantics.

scope:
  inspect:
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - .ai/tasks/TASK-087.yaml
    - .ai/tasks/TASK-095.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - tests/test_operator_human_surface.py
    - tests/test_operator_unified_state.py
    - tests/test_operator_correction_preflight.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/human_surface.py
    - tests/test_operator_human_surface.py

non_goals:
  - Change Unified Human Surface or Unified State semantics.
  - Change CLI grammar or behavior of existing commands.
  - Change Runtime, Review, REPAIR, publication, Dispatcher, Executor adapters, or failure semantics.
  - Add routing, retries, fallback, autonomous loops, or Executor recommendation/defaulting.
  - Modify frozen Kernel artifacts.
  - Push from Executor implementation execution.

constraints:
  hard:
    - Preserve exactly one authoritative Unified Human Surface implementation.
    - Preserve source-compatible operator.HumanSurfaceResult and operator.continue_task.
    - Preserve one-operation-per-invocation delegation and exact selector revalidation.
    - Preserve explicit Human Executor choice and zero-Executor eligible NO_CHANGE REPAIR.
    - Preserve PRIMARY synchronization/restart re-entry through Unified State.
    - Preserve existing failure taxonomy without duplicate Human-surface failure authority.
    - Non-delegated Reviewer, Brain, Publisher, WAIT, DONE, and BLOCKED outcomes remain mutation-free.
    - The extraction must materially reduce Human Surface implementation context in operator.py.
    - Code location may move but architectural authority must not move or duplicate.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: HumanSurfaceResult, continue_task, and Human-Surface-only helpers live in one dedicated human_surface.py boundary while operator preserves the same public objects.
  - id: AC2
    condition: PRIMARY, REMEDIATION, REPAIR, transport retry, and primary recovery preserve exact one-operation delegation behavior and selectors.
  - id: AC3
    condition: Reviewer, Brain, Publisher, WAIT, DONE, and BLOCKED outcomes preserve bounded non-mutating behavior.
  - id: AC4
    condition: Explicit Executor requirements and zero-Executor eligible NO_CHANGE behavior remain unchanged with no Executor recommendation/defaulting.
  - id: AC5
    condition: Human Surface consumes TASK-095 Unified State without introducing a second reducer or admission authority.
  - id: AC6
    condition: Existing direct Operator commands and failure taxonomy remain behaviorally compatible.
  - id: AC7
    condition: operator.py is materially smaller in the Human Surface domain and retains no duplicate implementation.
  - id: AC8
    condition: Delta is limited to the three authorized files and no tests are deleted, skipped, xfailed, duplicated, or weakened.
  - id: AC9
    condition: Focused Human Surface, Unified State, Correction Preflight, and Operator regressions pass under one canonical verification command.

verification:
  required:
    - python -m pytest tests/test_operator_human_surface.py tests/test_operator_unified_state.py tests/test_operator_correction_preflight.py tests/test_operator.py -q
