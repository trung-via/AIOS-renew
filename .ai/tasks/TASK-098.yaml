task_id: TASK-098
revision: 1

goal: >
  Establish P3B deterministic outstanding-finding frontier semantics for prospective
  predecessor-bearing correction lineage, and require publication PASS plus an empty
  frontier before main may advance.

problem: >
  TASK-097/P3A persists exact predecessor identity, but publication still uses a
  temporary blanket rejection for multi-finding predecessor reviews. AIOS needs one
  reusable pure frontier authority that preserves known unresolved findings across
  narrow DELTA corrections without rediscovery, renaming, ranking, or batching.

assumptions:
  - Canonical main at authoring is 9cb95eb6553131800ff2cb89728147614de2b79d.
  - TASK-097/P3A is semantically PASS and published at that SHA.
  - Human has authorized the P3 post-freeze correction-lineage evolution.
  - Historical no-predecessor correction artifacts remain immutable and use legacy behavior.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/P3-DESIGN-NOTE.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-097.yaml
    - src/aios_renew/review.py
    - src/aios_renew/publication.py
    - src/aios_renew/operator.py
    - src/aios_renew/unified_state.py
    - tests/test_review.py
    - tests/test_publication.py
  modify:
    - src/aios_renew/correction_frontier.py
    - src/aios_renew/publication.py
    - tests/test_correction_frontier.py
    - tests/test_publication.py

non_goals:
  - Change REVIEW or REMEDIATION schemas.
  - Change P3A predecessor shape or historical legacy behavior.
  - Change Unified State or Human Surface; that belongs to P3C.
  - Select, rank, batch, or automatically continue an outstanding finding.
  - Change Executor, verification, REPAIR, retry, reroute, or downstream behavior.
  - Rewrite historical artifacts.

constraints:
  hard:
    - >
      Exactly one reusable deterministic frontier authority must own prospective
      outstanding-finding derivation. It is pure/read-only and owns no review,
      publication, verification, or repository-mutation authority.
    - >
      PRIMARY CHANGES_REQUIRED initializes the frontier with every finding as exact
      semantic lineage state; identity must not depend on timestamps, run ordering,
      candidate equality, or finding-id search alone.
    - >
      DELTA advancement is valid only when prior_finding_id and the P3A predecessor
      identity bind exactly one currently outstanding finding; missing, ambiguous,
      mismatching, or already-resolved selection fails closed.
    - >
      DELTA PASS removes only its selected finding. DELTA CHANGES_REQUIRED replaces
      only that selected finding with the DELTA review findings while preserving
      unrelated siblings. DELTA BLOCKED must not silently resolve outstanding state.
    - >
      Frontier representation is deterministic but must not encode selection priority.
    - >
      Prospective predecessor-bearing publication requires semantic PASS and an empty
      derived frontier. Any known outstanding finding blocks main mutation.
    - >
      Replace TASK-097's blanket multi-finding rejection with frontier-based validation:
      multi-finding lineage may be inspected and carried, but cannot publish while its
      frontier is non-empty.
    - >
      Single-finding predecessor publication and historical no-predecessor publication
      remain behaviorally compatible.
    - >
      Exact SHA binding, P3A predecessor validation, semantic Reviewer authority,
      correction scope, failure taxonomy, and publication race protection remain intact.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A pure frontier surface represents all PRIMARY findings as exact outstanding state
      without selection authority.
  - id: AC2
    condition: >
      DELTA PASS removes only the exact selected outstanding finding and preserves siblings;
      invalid or already-resolved selection fails closed.
  - id: AC3
    condition: >
      DELTA CHANGES_REQUIRED replaces only its selected finding with its own findings while
      preserving siblings, and DELTA BLOCKED does not silently resolve the frontier.
  - id: AC4
    condition: >
      Prospective publication consumes the frontier authority and refuses main mutation on
      semantic PASS when any outstanding finding remains.
  - id: AC5
    condition: >
      Multi-finding predecessor lineage is no longer rejected merely for multiplicity;
      tests prove one selected finding can resolve while siblings remain outstanding and
      publication stays blocked.
  - id: AC6
    condition: >
      Single-finding predecessor publication still succeeds after DELTA PASS and historical
      no-predecessor publication keeps its established behavior.
  - id: AC7
    condition: >
      No REVIEW/REMEDIATION schema, P3A predecessor shape, Unified State/Human Surface,
      Executor, verification, REPAIR, retry, or reroute contract changes.

verification:
  required:
    - python -m pytest tests/test_correction_frontier.py tests/test_publication.py -k "frontier or predecessor" -q
