non_goals:
- No L2-02 source-to-target applicability witness or VALID/INVALIDATED determination,
  L2-03 evidence reuse or correction, L3 scheduler, checkpoints/feedback, future semantic
  TASK admission, G3 core-safety certification, G6 opt-in, or L4 measurement.
- No new evidence issuer, broker, registry/DB, verifier agent, generic lifecycle router,
  Planner/Reviewer/Publisher, new transport carrier, rehash/rewrite/republish historical
  RUN/RESULT/EVIDENCE, or modification to frozen Kernel/lifecycle object schema.
- No automatic evidence collection during ordinary V1/V2 RUNs, no retroactive metadata
  backfill, no change to admitted verification execution/order/policy, no synthetic
  successful source attestation, no duplicated full-suite or unnecessary test probes.
- No TASK/roadmap mutation outside Runtime ingress and Human/Brain planning process;
  no downstream Python Agent adoption or version pin changes.
constraints:
  hard:
  - Implement one bounded, explicit-call, immutable original-evidence provenance contract
    within existing verification_contract.py and its Runtime-owned read-only source-validation
    integration in verification.py. Strict version/schema/length/type/identity bounds,
    canonical order/encoding or digest rules must be independently recomputable. New
    metadata is not a new independent lifecycle truth or a new EVIDENCE type.
  - Authenticate original RUN/TASK identity, immutable source candidate Git SHA and
    tree as observed on canonical source lineage, actual EVIDENCE id/source subject/command/result
    and original local raw capture bytes+hash from the Runtime-controlled exact RUN
    evidence location. Do not take proof of origin from a user-supplied raw path or
    self-declared digest. Validate local artifact versus exact expected source and
    failure/ref conflicts via existing Runtime semantics; no invented public raw file.
  - Separate independent authentication of available source facts from absent facts.
    Bind only genuinely observed recorded toolchain/interpreter, environment/configuration,
    execution policy/profile, worker mode/count, proof collection/population and distinguishing
    proof conditions. If a historical V1 capture does not record any dimension, express
    UNKNOWN/NOT_OBSERVED with provenance and explanation; current host values, filenames
    or labels cannot fill missing historical data.
  - Preserve evidence outcome and original subject for PASS, FAIL, ERROR and UNKNOWN;
    outcome completeness/stability must reflect actual source records. A good hash
    or verified provenance never turns a failed proof into PASS, implies semantic
    mapping adequacy, or makes cross-target evidence applicable. Do not expose a VALID
    cross-candidate flag in L2-01.
  - Make an explicit, stable consumer-readable typed projection for L2-02 containing
    authenticated original identities, hashes and per-dimension observed vs unknown
    provenance, not an opaque yes/no or entirely caller-provided assertion. Untrusted
    source or unverifiable/mismatched/partial provenance fails closed with UNKNOWN/NOT_ESTABLISHED;
    no permissive defaults or ability to override source by injecting an arbitrary
    path, claimed proof context or alternative trust root.
  - All introduced read paths are bounded read-only operations against exact authorized
    local Runtime/canonical Git sources, reject symlinks/path traversal/oversize/hash
    mismatch/unknown RUN or EVIDENCE, and neither execute tests nor mutate Git, Runtime
    state, worktree, registry or existing records. Treat public redacted raw references
    as unavailable, not raw evidence.
  - Adversarial tests use actual Git object identities and bounded original raw bytes
    in isolated controlled fixtures. Include forged source SHA/RUN/EVIDENCE, mismatched
    original raw digest/bytes, swapped task/command/subject, missing old V1 metadata,
    unknown toolchain or environment, attempted evidence outcome promotion, stale/competing
    source refs, invalid or extra schema keys, path injection/symlink, size abuse
    and no side effects. No mock that fabricates authority.
  - Preserve all existing historical minimum-sufficient-v1 and admitted V2 verification
    behavior and the exact EVIDENCE/ResultPackage/public transport shapes; no changed
    scheduling, policy selection, performer, Reviewer or Publisher ownership. Preserve
    existing tests and only add the narrow focused regressions required.
  - Document the status of each provenance dimension, clear diagnostic boundaries,
    explicit L2-02 consumer contract and the distinction between authenticated source
    evidence versus applicability to a new target; no claim that L1 selection, L2-01
    or a fixture is production proof or KA-01 eligibility.
  - Only four authorized files may change. Use minimum-sufficient-v1 focused tests,
    reuse existing legitimate evidence and no broad test suite ceremony.
acceptance:
- id: AC1
  condition: A versioned bounded immutable typed L2-01 original-proof provenance record
    and deterministic strict validation/serialization exist inside existing verification
    contract, without new lifecycle or evidence issuance; each field has a unique
    defined identity/source and fail-closed validation.
- id: AC2
  condition: An explicitly invoked Runtime-owned read-only observation authenticates
    exact source TASK/RUN/candidate/tree/EVIDENCE id/subject/command/outcome and recomputes
    original raw digest from immutable Runtime-controlled raw capture, rejecting a
    substituted caller raw path or supplied matching-looking labels.
- id: AC3
  condition: Every relevant source provenance dimension (policy/profile/toolchain/interpreter,
    environment/config, worker topology, original proof conditions/collection/population
    and evidence kind/schema) records exact authenticated observed content or explicit
    UNKNOWN/NOT_OBSERVED; no absent V1 data is filled with current machine values
    or inferred preservation.
- id: AC4
  condition: A provenance observation never asserts source-to-target VALID/INVALIDATED,
    target proof PASS, semantic mapping adequacy or production eligibility; original
    FAIL/ERROR/UNKNOWN stay preserved, and missing evidence cannot be promoted to
    satisfactory proof.
- id: AC5
  condition: Focused positive and adversarial tests reject forged/wrong/stale/competing
    source identities, mismatched or inaccessible raw bytes/digests, replayed/swapped
    EVIDENCE or RUN, malformed schema, symlink/path traversal, excess size and conflicting
    or partial context with explicit UNKNOWN/BLOCK results.
- id: AC6
  condition: A stable immutable projection contains exact verified source and raw
    digests plus dimension-by-dimension observed/unknown provenance and reason, suitable
    as L2-02 input without acquiring a target candidate, target proof validity or
    a new authority; source lineage and missingness can be independently inspected.
- id: AC7
  condition: New observation and formatter are explicitly called and read-only, do
    not run verification commands, write local/remote Git or Runtime state, publish
    or create lifecycle artifacts, select an Executor, revise a mapping, or issue
    any permission/consent token.
- id: AC8
  condition: Existing V1/V2 EVIDENCE/ResultPackage, verification/runtime execution
    and legacy source/selection logic stay behaviorally and structurally unchanged;
    regressions include real historical minimal V1 and available V2 evidence shapes
    with strict UNKNOWN for missing fields.
- id: AC9
  condition: The single L2-01 documentation maps every original evidence dimension
    to its authenticated source or UNKNOWN semantics, enumerates L2-02 applicability
    requirements and false-positive threats, states L2-03/L3/G3/G6/L4 outstanding,
    and never claims execution of future proofs or KA-01 activation.
- id: AC10
  condition: Exactly four authorized files are changed; no evidence broker/issuer/DB,
    second scheduler or verification owner, generic Runtime extension/router, historical
    artifact mutation, roadmap advancement or scope expansion is introduced.
