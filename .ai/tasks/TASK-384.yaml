task_id: TASK-384
revision: 1
goal: Deliver Lean VP L2-01 original proof EVIDENCE identity/provenance as a bounded,
  Runtime-owned, read-only typed attestation of exactly one original historical/local
  verification observation. Bind its immutable TASK/RUN/source candidate, actual original
  evidence identity/outcome/raw digest and all independently observed provenance/conditions,
  reporting genuinely missing information as UNKNOWN. Make a strict stable consumer
  contract for subsequent L2-02 applicability, without claiming any cross-candidate
  VALID reuse, altering historical evidence, issuing a new proof, or activating KA-01.
problem: The now reviewed/published L1-01/02/03 core establishes independently selected
  semantic mapping plus source/readiness boundaries but not authenticated original
  source EVIDENCE provenance for prospective reusable proof. Existing minimum-sufficient-v1
  EVIDENCE binds an original RUN, command and candidate but public carriers may redact
  private raw capture paths; legacy observations do not always record verifier profile,
  toolchain, environment, exact collection or proof conditions. Accepting caller-provided
  copied labels, stale raw paths, self-declared digests or absent context as authenticated
  provenance would let later L2-02/L3 incorrectly mark proof VALID and violate KA-01
  C.5. The Human-approved finite Lean VP 16-slot plan selects L2-01 original evidence
  provenance as the next bounded outcome, not all L2 or G3.
