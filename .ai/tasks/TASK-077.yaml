task_id: TASK-077
revision: 1

goal: >
  Harden the existing TASK-058 revision-2 historical REPAIR recovery boundary so one
  historical-repair admission resolves the TASK-scoped canonical terminal/candidate ref
  namespace from one deterministic remote ref snapshot instead of issuing a sequence of
  repeated git ls-remote calls whose count grows with correction-chain length, while
  preserving bounded failure provenance when that one remote query fails. Keep TASK-058
  historical lineage semantics, exact failed-head authority, duplicate-continuation
  rejection, fresh-local-state recovery, thin downstream workers, and the existing
  no-retry/no-fallback/no-reroute model unchanged.

problem: >
  Cross-project Python Agent TASK-156 exposed an observed historical-REPAIR transport
  reliability and observability defect after TASK-075/TASK-076 were correctly fixed and
  explicitly adopted downstream. REPAIR RUN-156-003 repeatedly failed before new RUN
  admission with only `historical REPAIR lineage rejected: failed to query canonical refs
  from origin`. Direct host PowerShell, direct Codex-shell git, repository-venv Python
  spawning git, and the exact pinned worker-runtime Python spawning the same task-scoped
  git ls-remote query all succeeded with exit code 0 around the failed attempts. Inspection
  of resolve_remote_repair_recovery shows that historical recovery does not perform one
  remote namespace read: it first discovers terminal RUN ids, then performs additional
  per-failure candidate/artifact ref queries, later re-resolves the terminal namespace,
  and finally performs additional per-RUN terminal-pair queries for duplicate continuation
  detection. Any one nonzero ls-remote result is collapsed by _exact_remote_refs into the
  same generic message, discarding bounded operation/stage and exit provenance. This makes
  the recovery path more exposed to transient remote transport failure than necessary and
  prevents Brain/automation from distinguishing which canonical remote operation failed.
  The defect is in TASK-058 transport mechanics/operational observability, not Python Agent
  product semantics, worker routing, TASK-076 changed-files authority, or canonical lineage.

assumptions:
  - >
    Current canonical AIOS-renew main at authoring is
    3f2770be9752b800e21adfc05d57778dd9818c68, the semantically reviewed PASS source
    candidate for TASK-076.
  - >
    TASK-058 revision 2 remains the sole semantic authority for historical REPAIR
    recovery: current control Runtime authority, immutable remote lineage reconstruction,
    exact failed_head_sha subject recovery, fresh/empty local Runtime support, remote RUN
    namespace reservation, duplicate-continuation rejection, historical TASK binding,
    isolated subject handling, and fail-closed admission remain unchanged.
  - >
    TASK-015 and TASK-059 establish the precedent that useful operational diagnostics
    should be preserved in bounded form without becoming canonical RESULT/EVIDENCE truth;
    they do not own historical remote-lineage resolution.
  - >
    TASK-075 remains authoritative that CODE_FIX bypasses reuse-only pre-verification
    validation and follows ordinary exactly-one Executor dispatch.
  - >
    TASK-076 remains authoritative for like-for-like changed-files validation in genuine
    NO_CHANGE reusable-candidate continuation and is not modified by this TASK.
  - >
    The Python Agent downstream incident produced no RUN-156-004 because the observed
    failures occurred before historical REPAIR admission. Repeated Human reinvocation is
    not a substitute for correcting this Runtime boundary.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - .ai/tasks/TASK-015.yaml
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-059.yaml
    - .ai/tasks/TASK-064.yaml
    - .ai/tasks/TASK-075.yaml
    - .ai/tasks/TASK-076.yaml
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_review_transport.py
    - tests/test_operator.py

  modify:
    - src/aios_renew/review_transport.py
    - tests/test_review_transport.py

non_goals:
  - Change Python Agent source, TASK-156, downstream repair authorization, or downstream dependency pins.
  - Rerun, repair, publish, or otherwise resolve Python Agent RUN-156-003 inside this TASK.
  - Change TASK-058 historical REPAIR semantic authority, artifact schemas, or exact failed-head/root-lineage rules.
  - Add generic Git retry, automatic reconnect, fallback remote, alternate transport, exponential backoff, polling, reroute, or failover.
  - Move historical lineage reconstruction into downstream Human-facing workers, Codex, Antigravity, adapters, or outer automation.
  - Change Executor selection, model defaults, exactly-one dispatch, verification ownership, RESULT/EVIDENCE authority, review semantics, or publication authority.
  - Weaken missing/ambiguous/conflicting/cyclic/wrong-TASK/wrong-revision/wrong-head/duplicate-continuation fail-closed behavior.
  - Treat remote operational diagnostics as semantic evidence or acceptance truth.
  - Redesign all review/remediation/publication transport or perform A4 transport extraction.
  - Add a network daemon, connection pool, credential manager, proxy manager, remote cache service, message broker, or distributed snapshot service.
  - Optimize unrelated git fetch/show operations that are not required to correct the observed repeated ref-query boundary.
  - Change TASK-075 or TASK-076 reusable-candidate behavior.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      resolve_remote_repair_recovery must preserve TASK-058 semantic authority and derive
      all terminal RUN identities, failed candidate refs, terminal-kind conflicts, and
      duplicate-continuation checks needed for one historical REPAIR admission from one
      internally consistent TASK-scoped remote ref snapshot rather than repeatedly
      re-querying the same remote namespace as chain length grows.
    - >
      The snapshot acquisition must use one git ls-remote --refs invocation for the
      historical-repair TASK namespace, with the minimum explicit canonical ref patterns
      required by existing semantics (including failure-artifacts, failure candidate refs,
      and successful artifacts as applicable). Ref order from Git output is not semantic
      authority; parsing and validation must remain deterministic and identity-based.
    - >
      The one snapshot is immutable for that admission attempt. Historical lineage walking,
      target failed-head validation, terminal conflict checks, remote RUN reservations, and
      duplicate-continuation detection must not silently refresh, merge, or replace the
      snapshot mid-admission. A later Human invocation may obtain a later snapshot, but one
      invocation must reason from one canonical observation.
    - >
      Existing byte/content retrieval from exact commit SHAs may continue to use existing
      fetch/show mechanics where needed; this TASK specifically removes redundant remote
      ref discovery calls and must not weaken exact-content validation because a ref snapshot
      was introduced.
    - >
      If the snapshot ls-remote invocation returns nonzero, historical REPAIR must still fail
      closed before RUN admission and before Executor invocation. It must not retry, fallback,
      switch remotes, continue from stale local refs, infer missing refs, or convert the
      failure into a product REPAIR decision.
    - >
      A remote-ref-query failure must preserve deterministic bounded operational provenance
      sufficient to identify that the failed operation was historical-repair snapshot
      acquisition and to expose a bounded exit-status/category signal. Diagnostics must not
      expose credentials, authorization headers, cookies, environment dumps, repository
      payloads, or unbounded raw stderr. A small sanitized diagnostic category such as
      CONNECTIVITY, DNS, AUTH, TLS, TIMEOUT, or UNKNOWN is acceptable; exact naming is
      implementation-owned provided tests bind deterministic behavior.
    - >
      The bounded diagnostic is operational only. It must not become RESULT/EVIDENCE,
      acceptance evidence, review authority, or a reason to retry automatically.
    - >
      A missing canonical ref with a successful ls-remote invocation remains a semantic
      lineage/content failure and must not be misclassified as remote transport
      unavailability. Nonexistent refs and nonzero Git transport failures remain distinct.
    - >
      Existing TASK-058 duplicate-continuation protection must remain exact: if any canonical
      remote terminal RUN already proves a continuation of the target failed RUN, admission
      rejects before allocating or invoking another continuation. Snapshot consolidation must
      not create a race-tolerant best-effort policy or weaken fail-closed conflict detection.
    - >
      Existing fresh/empty local Runtime-state historical recovery must remain valid. The
      implementation may not depend on prior local remote-tracking refs, previous successful
      ls-remote output, or incidental .git/aios state to compensate for remote failure.
    - >
      Current-HEAD REPAIR, PRIMARY, REMEDIATION, ordinary remote RUN namespace resolution,
      TASK-064 verification-only continuation, TASK-075 CODE_FIX dispatch ordering, and
      TASK-076 changed-files reuse semantics must remain behaviorally unchanged unless they
      already call the same ref helper and are covered by an explicitly proven no-regression
      test. Do not broaden the task into a transport rewrite.
    - >
      Repository-provided downstream workers remain thin and unchanged. They request REPAIR
      and surface Runtime output but do not snapshot refs, classify Git transport failures,
      retry Git, reconstruct lineage, or choose recovery policy.
    - >
      No admitted historical REPAIR attempt may invoke more than one selected Executor;
      this TASK does not add any Executor invocation on pre-admission failure and does not
      change no-retry/no-fallback/no-reroute authority.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic regression with a multi-RUN historical correction chain proves
      resolve_remote_repair_recovery performs exactly one task-scoped git ls-remote --refs
      snapshot acquisition for the ref namespace needed by that recovery, independent of
      chain length, while reconstructing the same ordered failed correction lineage and
      remote RUN namespace as before.
  - id: AC2
    condition: >
      The AC1 regression proves target failure-artifact SHA, failed candidate SHA, exact
      failed_head_sha binding, TASK id/revision, continuation_of chain, transported REPAIR
      lineage, and root-lineage inputs remain byte/identity equivalent to the established
      TASK-058 semantics; no ref-order inference or current-main substitution is introduced.
  - id: AC3
    condition: >
      Deterministic regressions prove terminal RESULT/FAILURE conflict detection and
      duplicate-continuation rejection are derived from the same immutable snapshot and
      remain fail closed before RUN allocation or Executor invocation.
  - id: AC4
    condition: >
      A simulated nonzero historical-repair snapshot ls-remote result fails before admission
      with bounded deterministic operational provenance identifying snapshot acquisition plus
      an exit-status/category signal, while making zero additional ls-remote attempts and zero
      Executor invocations.
  - id: AC5
    condition: >
      A successful ls-remote response that simply omits a required failed candidate/artifact
      ref is still rejected as missing/incomplete canonical lineage rather than being reported
      as transport unavailability.
  - id: AC6
    condition: >
      Snapshot parsing rejects malformed, duplicate, ambiguous, wrong-prefix, or otherwise
      invalid canonical ref results deterministically and without retry/fallback/reroute.
  - id: AC7
    condition: >
      Existing TASK-058 historical recovery regressions for fresh local state, cyclic lineage,
      failed-head mismatch, exact historical TASK binding, successful source lineage, and
      duplicate continuation continue to pass with no semantic weakening.
  - id: AC8
    condition: >
      Existing ordinary remote namespace/remediation transport tests continue to pass; no
      downstream worker, adapter, dispatcher, artifact schema, model, verification, review,
      roadmap capability, or publication surface changes are required.
  - id: AC9
    condition: >
      The implementation contains no automatic Git retry, fallback remote, alternate query
      route, hidden executor invocation, or product-level mutation. Reduced remote round trips
      come only from consolidating historical-repair ref observation into one deterministic
      snapshot.

verification:
  required:
    - python -m pytest tests/test_review_transport.py -q
    - git diff --check
