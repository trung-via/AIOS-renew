task_id: TASK-054
revision: 1

goal: >
  Establish one consistent package-version identity for AIOS-renew. The public
  package version surface must reflect the canonical project distribution
  metadata instead of maintaining an independent stale hard-coded version.

problem: >
  Current canonical main contains contradictory version identities. pyproject.toml
  declares project version 0.1.3 and the repository has a v0.1.3 release tag, while
  src/aios_renew/__init__.py independently reports __version__ = "0.1.0" and the
  smoke test explicitly requires that stale value. This makes package identity
  depend on which surface is inspected and weakens reproducible canonical state.

assumptions:
  - >
    Current canonical main baseline before TASK-054 authoring is
    5c146bccea82022e309f477c32a758c2da8ed55f.
  - >
    pyproject.toml project version 0.1.3 is the current distribution-version
    authority; TASK-054 is not a release or version-bump task.
  - >
    The existing v0.1.3 tag is historical release state and must not be moved,
    recreated, or otherwise modified by this TASK.
  - >
    TASK-051, TASK-052, and TASK-053 are semantically reviewed PASS and published;
    their Dispatcher, Runtime, and bounded native execution authority remains
    unchanged.

scope:
  inspect:
    - pyproject.toml
    - src/aios_renew/__init__.py
    - tests/test_smoke.py

  modify:
    - src/aios_renew/__init__.py
    - tests/test_smoke.py

non_goals:
  - Bump the project version or choose a new release number.
  - Create, move, delete, or publish a Git tag or release.
  - Change pyproject.toml project metadata.
  - Change package exports unrelated to version identity.
  - Refactor Operator, Dispatcher, Runtime, adapters, or canonical artifacts.
  - Change frozen Kernel contracts, governance, TASK/RUN/RESULT/EVIDENCE semantics, or publication policy.
  - Perform README, dependency, formatting, packaging-layout, or general repository cleanup.
  - Push from executor execution.

constraints:
  hard:
    - >
      pyproject.toml remains the single canonical distribution-version authority
      for this repository state. The package must not retain a contradictory
      independently maintained literal version value.
    - >
      The public aios_renew.__version__ surface remains available and must resolve
      to the same version as the installed AIOS-renew distribution metadata in the
      supported project environment.
    - >
      TASK-054 must not implicitly perform a release, alter v0.1.3 history, or infer
      a future version from unreleased main commits.
    - >
      Existing public imports and exports unrelated to __version__ remain
      observably unchanged.
    - >
      The smoke test must detect future divergence between the public package
      version surface and distribution metadata rather than locking another
      duplicated literal version in two places.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      In the supported project environment, aios_renew.__version__ equals the
      installed AIOS-renew distribution metadata version.
  - id: AC2
    condition: >
      src/aios_renew/__init__.py no longer contains an independently maintained
      stale package-version literal that can diverge from project metadata.
  - id: AC3
    condition: >
      The smoke test validates version consistency against distribution metadata
      rather than asserting a duplicated fixed version string.
  - id: AC4
    condition: >
      pyproject.toml remains unchanged at version 0.1.3 and no release/tag or
      unrelated package API behavior is changed.

verification:
  required:
    - python -m pytest tests/test_smoke.py -q
    - git diff --check
