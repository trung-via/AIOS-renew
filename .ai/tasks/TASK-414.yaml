non_goals:
- No always-on agent, new database, trained model, provider router, mandatory audit,
  default CAA invocation or new Planner/Runtime/Reviewer/Publisher role.
- No source mutations to existing CAA-01/02/03, Flow Cards, direct-authoring/repair/remediation
  admission, Kernel, remote wakeup, Unified State or other task lifecycle code.
- No automatic Human risk acceptance, provider selection, TASK creation, dispatch,
  correction, publication, Git rollback or production rollout from evaluation output.
- No model self-grading as proof, future-event hindsight leakage, reference-label
  exposure, private raw logs, credentials, provider traces, chain-of-thought or inferred
  production uplift.
- No CAA-05 training, downstream pin changes, PTE or Lean VP continuation, historical
  lineage rewrite or unrelated feature.
constraints:
  hard:
  - Use exact authenticated sealed CAA-01 ExperienceCut/source/as-of and existing
    CAA-02/03 interfaces. The evaluation surface only consumes caller-authorized four-flow
    input; hashes and JSON reports never authenticate their own sources.
  - Keep development fixtures, sealed holdout and shadow subjects distinct; independent
    labels and rubric cannot be passed into advisor input. Reject stale/swapped source,
    subject, policy, candidate, later RUN/REVIEW exposure and changed main.
  - Grade with deterministic source/citation validation plus independent Human-labelled
    semantic rubric; a model judge may only be secondary and calibrated, never the
    issuer of its own accepted quality verdict. Unsupported claims and missing decisive
    data remain UNKNOWN.
  - "Measure source support, causal applicability, strong disanalogies/counterexamples,\
    \ appropriate abstention, safety, cost, latency and \u2014 only when independently\
    \ available \u2014 Human time and full episode outcomes; distinguish observed,\
    \ measured, estimated and UNKNOWN, and report sampling/confounding rather than\
    \ claim causal uplift."
  - Before decisive offline holdout or live shadow, require a trusted pre-registered
    EvaluationPlan with exact population/source, metrics and thresholds, independent
    grader provenance, permissions, allowed provider/effort, cost/time/call ceilings
    and rollback/disable plan; unapproved/missing plan must stop evaluation, not ordinary
    lawful Brain work.
  - 'Implementation safety limits: shadow at most 50 eligible subjects or 7 days,
    whichever first; maximum one selected advisor call per subject; existing CAA-03
    time/source/provider caps also apply. These are ceilings only and grant no automatic
    Human approval to run or spend.'
  - Shadow must be read-only, caller-invoked, explicitly opt-in and finite. Unavailable
    advisor, opt-out, invalid evaluation-only data or exhausted budget cannot block
    otherwise lawful direct TASK/REPAIR/REMEDIATION/ARCHITECTURE work; genuine existing
    canonical auth errors remain blocking.
  - Reports may recommend PROPOSE_ROLLOUT, REEVALUATE, DEFER or STOP, identifying
    evidence and unknowns. Only a separate exact Human authorization can expose advice
    in controlled use. Disabling optional evaluation may not mutate RUN, review, publication
    or Git state.
  - Provide bounded positive and adversarial fixtures for four flows, unsupported
    cause, false citation, future-data/label leak, prompt injection, subject swap,
    corrupt grader, overbudget, timeout, false confidence, provider unavailability
    and opt-out.
  - Record explicit Human CAA-04 selection as only current CAA planning NEXT; preserve
    accepted CAA-03 predecessor, TASK-408 direct authoring and soft AOA, other bookmarks
    and historical lineage. No planning automatic advance from Result, Review or Publish.
  - Only listed five scope.modify paths may change. Executor claims only implementation
    properties; Runtime runs minimum-sufficient-v1 authored verification, independent
    Reviewer judges and Publisher publishes. No full-suite or repeated unchanged verification.
  - 'Verification selection correction: preserve every TASK-414 r1 selected test except
    the single predecessor-source-locked test tests/test_caa_integration.py::test_caa03_selection_preserves_exact_historical_plan_and_only_six_paths,
    excluded using the exact -k ''not test_caa03_selection_preserves_exact_historical_plan_and_only_six_paths''
    filter on the existing three-file command. This historical test remains untouched,
    and it can only be asserted against the authentic TASK-412 source. No blanket
    skip of tests/test_caa_integration.py or tests/test_caa_reasoner.py, no change
    to pytest fixed-worker configuration, no full suite.'
  - 'Inside already-authorized tests/test_caa_evaluation.py, add a successor-safe
    positive and negative regression: CAA-04 is current sole NEXT; immutable CAA-03
    Human selection record and accepted TASK-412/RUN-412-009 lineage retain original
    values and cannot be forged or silently rewritten; other Human selection/bookmark
    records remain unchanged by the prospective selection; five file scope remains
    exact. The regression must not rewrite tests/test_caa_integration.py or perform
    real Human/production activation. Conformance here is source-bound to the original
    CAA-03 published immutable baseline and must not assert CAA-03 is still live NEXT.'
  - Preserve all RUN-414-001 through RUN-414-006 FAILUREs and REPAIR authorizations
    as historical, never relabel or transport a stale pre-verification package into
    a new TASK revision. Use source e08bfec8d683ec6f4ec6c6d39209eb949662513f only
    as an inspected candidate draft if admitted by canonical Runtime; new Executor
    output must bind TASK-414 revision 2 and new admitted RUN/HEAD. No fabricated
    review/PASS/publication. No repeated error-driven repair without a concrete source-bound
    failure.
acceptance:
- id: AC1
  condition: Canonical planning records only prospective Human CAA-04 selection with
    accepted CAA-03 exact lineage and unchanged historical CAA selections, unrelated
    TASKs and conditional CAA-05. Verify CAA-03 remains an immutable historical predecessor
    while CAA-04 is the current sole NEXT, without relying on predecessor-only live
    NEXT assertions.
- id: AC2
  condition: One finite provider-neutral read-only evaluation API accepts exact four-flow
    advisor context with authenticated source/subject/candidate/as-of cut and strictly
    bounded JSON outputs, without workflow or lifecycle mutation.
- id: AC3
  condition: Development, sealed holdout and shadow cases keep rubric/labels separate,
    enforce as-of and source isolation and reject hindsight, stale, forged, missing
    or swapped source.
- id: AC4
  condition: Independent grading differentiates actual material source support, causal
    mechanism transfer, counterexample, abstention and harmful confidence from merely
    syntactically correct citation and rejects CAA self-score authority.
- id: AC5
  condition: A bounded caller-invoked, disabled-by-default shadow evaluator collects
    no workflow-control actions; absent provider, failed optional consultation, Human
    opt-out or budget exhaustion leaves original direct Brain flow unchanged.
- id: AC6
  condition: An exact authenticated pre-registered Human EvaluationPlan binds sampling,
    rubric, thresholds, privacy, provider, max spend/calls/duration and stop conditions
    before decisive holdout/live shadow; hard ceilings 50 subjects, 7 days and one
    advisor call per subject are enforced without implying authorization.
- id: AC7
  condition: Evaluation report separates baseline/advisor and measured/estimated/UNKNOWN
    results, quality/safety/cost/p50-p95 latency/full-episode fields when known, sample
    limitations, missingness and confounders without attributing unsupported production
    uplift.
- id: AC8
  condition: Four-flow adversarial fixtures reject label contamination, source/citation
    swap, future events, injection, causal false analogy, incorrect judge provenance,
    budget violations and unauthenticated Human rollout. A successor-safe historical-record
    preservation regression in tests/test_caa_evaluation.py must prove CAA-03 selected-history
    and accepted lineage are retained exactly; a forged/tampered predecessor identity
    must fail.
- id: AC9
  condition: Human-facing rollout packet has independent evaluator provenance, threshold
    observations, uncertainties, alternatives, disable/stop gates and no action authority;
    production rollout remains a separate explicit Human decision.
- id: AC10
  condition: Only five authorized source paths change; existing CAA-01/02/03, direct
    authoring, Human-on-demand audit, optional AOA and independent Runtime/Reviewer/Publisher
    contracts remain unmodified. An inherited CAA-03 source-locked fixture must remain
    unmodified and is not retargeted to a newer HEAD. The authored verification runs
    the remaining CAA-03/integration/reasoner tests and excludes exactly that one
    obsolete historical source-cut assertion; no tests are globally skipped.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_caa_evaluation.py tests/test_caa_integration.py
    tests/test_caa_reasoner.py -k 'not test_caa03_selection_preserves_exact_historical_plan_and_only_six_paths'
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
