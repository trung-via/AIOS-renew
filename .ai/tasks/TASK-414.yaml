task_id: TASK-414
revision: 2
goal: Implement CAA-04 as a finite independent source-grounded offline holdout evaluator,
  opt-in bounded shadow observer and Human rollout decision report over accepted CAA-03
  four-flow advice. Make optional read-only evaluation callable on exact reviewed
  publication, with no default advisor activation, auto rollout or additional lifecycle
  authority.
problem: Human selected immediate CAA-04 on 2026-10-24. Current canonical main 7995c3048e2ca2c4606bf7bd352b03a0f8b5ffc9
  carries CAA-03 TASK-412 r2/RUN-412-009 with Runtime evidence exit 0, unresolved
  empty, independent PRIMARY REVIEW-412-009 PASS covering AC1..AC10, decision commit
  6c6490fe41333842b5030e6f011cf07f11bf82b3, on that exact included source. CAA-03
  currently lacks independent holdout, a finite shadow evaluation, and evidence sufficient
  for Human rollout selection. CAA-04 must not convert its own evaluation into Runtime/Reviewer/Publisher
  truth. TASK-414 r1 failed through RUN-414-006. A source-bound, noncanonical exact-head
  diagnostic supplied by Human on candidate e08bfec8d683ec6f4ec6c6d39209eb949662513f
  reproduced one AssertionError in tests/test_caa_integration.py::test_caa03_selection_preserves_exact_historical_plan_and_only_six_paths
  when running the three-file authored command. This inherited TASK-412-era historical
  test asserts that the current HEAD still has CAA-03/TASK-412 r2 as sole NEXT and
  exactly the CAA-03 six-file diff since BASE_SHA 74d9a21099f4068645545aca1c53ba317d86bcf0,
  while CAA-04 selection on current candidate legitimately makes CAA-04/TASK-414 r1
  sole NEXT and adds five authorized source files. Isolated CAA-04 tests PASS; CAA-04
  source code has not been proved faulty. Historical source-locked fixture cannot
  truthfully be run as an assertion on later CAA-04 HEAD. Version 2 corrects the verification
  selection defect without modifying CAA-03 source or changing its frozen lineage.
  The prior RUN/FAILURE/REPAIR lineage remains immutable and has no PASS.
assumptions:
- Explicit Human approval selects CAA-04 architecture B and implementation now, not
  unbounded spending, automatic shadow start, fixed quality gate or controlled production
  rollout. Decisive measurements require separately authenticated preregistered Human
  evaluation limits and thresholds before collection.
- Runtime independently reauthenticates the current main and exact accepted TASK-412/RUN-412-009/EVIDENCE/REVIEW-412-009/PUBLISHER
  inclusion; a text claim or hash alone is not authority.
- CAA-01 sealed authenticated cuts, CAA-02 causal consultation and CAA-03 optional
  four-flow consult are existing reusable sources and mechanisms. CAA-04 creates no
  second lifecycle reader, semantic brain, generic router or truth DB.
- Planning changes prospectively select CAA-04 only; CAA-01/02/03, TASK-411/413, all
  RUN/FAILURE/REVIEW/PUBLISH, PTE/Lean VP/KA-01/downstream history is preserved. CAA-05
  stays conditional.
- Canonical prospective Human default LEGACY_REPOSITORY_DEFAULT_ROUTE remains applicable.
  TASK itself neither delegates an Executor nor grants dispatch permission.
- The exact Human-supplied local reproduction (format AIOS_TASK414_NONCANONICAL_TARGETED_DIAGNOSTIC,
  observed SHA e08bfec8d683ec6f4ec6c6d39209eb949662513f, three-file authored pytest
  exit 1 with one matched AssertionError in a CAA-03 source-locked historical test)
  is bounded diagnostic evidence only, not canonical Runtime verification or a conclusive
  claim about any other test. Runtime remains sole canonical verifier.
- CAA-03 historical fixture asserts a six-path diff and active CAA-03 selection only
  at its original TASK-412 source; those expectations are not invariants of a later
  CAA-04 source. Revision 2 does not revise TASK-412, its tests or any historical
  PASS. Reuse current failed candidate implementation e08bfec8d683ec6f4ec6c6d39209eb949662513f
  as read-only inspectable draft input, not as a preauthorized RESULT/PASS; Executor
  must revalidate and produce an independent current-task-revision source-bound candidate.
