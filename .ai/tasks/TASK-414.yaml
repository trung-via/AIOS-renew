  inspect:
  - .ai/roadmap-state.yaml
  - docs/AIOS-CAA-V1-ROADMAP.md
  - docs/AIOS-CAA-03-INTEGRATION-PORTABILITY.md
  - docs/AIOS-CAA-02-INTELLIGENT-REASONER.md
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
  - .ai/tasks/TASK-412.yaml
  - src/aios_renew/caa_experience.py
  - src/aios_renew/caa_reasoner.py
  - src/aios_renew/caa_integration.py
  - tests/test_caa_integration.py
  - tests/test_caa_reasoner.py
  modify:
  - .ai/roadmap-state.yaml
  - docs/AIOS-CAA-V1-ROADMAP.md
  - docs/AIOS-CAA-04-EVALUATION-SHADOW-ROLLOUT.md
