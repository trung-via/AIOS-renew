task_id: TASK-306
revision: 3
goal: Correct and harden the remaining H4D browser-context acquisition boundary so
  the real production Target.getBrowserContexts response shape is accepted without
  weakening fail-closed context ownership, and exercise the full bounded acquisition
  path through exact navigation and pre-submit surface readiness before another live
  retry.
problem: 'After TASK-304 and TASK-305 were reviewed and published, the same real unresolved
  origin-affine H4D carrier advanced through listener absence proof, dedicated-profile
  occupancy proof, browser launch, exact OS owner proof, and one Playwright context,
  then deferred before page creation. Read-only diagnosis proved Target.getBrowserContexts
  returns a dictionary with browserContextIds=[] plus an optional non-empty defaultBrowserContextId.
  Current _prove_context() requires exact dictionary equality with only browserContextIds=[],
  so the valid production shape is rejected as BROWSER_CONTEXT_UNPROVEN. Additional
  read-only checks proved zero non-default contexts, one stable Playwright context
  before/after CDP session detach, bounded new_page bridge availability, acquisition-lock
  cleanup, canonical carrier freshness UNRESOLVED, exact origin-affinity match, and
  clean Playwright shutdown even with an open browser CDP session. The prior live
  retry surfaced LOCAL_FAILURE externally, so expected operational exceptions inside
  the bounded context/page bridge also require deterministic fail-closed classification
  rather than escaping as a generic local failure.


  TASK-306 r2 reached canonical RESULT RUN-306-004 at 84dc07f0dea3839f89db6e660033d5e51a3ecd90;
  Runtime verification and REVIEW-306-004 PASS cover AC1-AC9. Publication then failed
  closed with INTEGRATION_REQUIRED because planning commit 7f062749c1fdbd561de70a9604351e13944b29df
  advanced current main on a sibling branch. Revision 3 authorizes a fresh PRIMARY
  from that current main to materialize the same reviewed source end-state. After
  r3 authoring, the active recovery bookmark must be planning-only repinned from revision
  2 to 3 before PRIMARY admission; no further planning mutation is authorized until
  the r3 publication attempt terminalizes.'
