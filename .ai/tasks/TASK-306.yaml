non_goals:
- Accept arbitrary or future unknown fields from Target.getBrowserContexts, infer
  account/profile identity from defaultBrowserContextId, or use that identifier for
  routing, target selection, lifecycle authority, or persistent state.
- Relax the requirement for exactly one Playwright browser context, zero non-default
  CDP browser contexts, stable context identity across proof, exact configured browser
  ownership, exact target navigation, or post-navigation owner re-proof.
- Change TASK-304 listener-table absence authority, TASK-305 dedicated-profile occupancy
  semantics, executable/user-data/profile/address/port/PID owner proof, or acquisition-lock
  behavior.
- Change H4C1 v3 origin registry, ORIGIN_AFFINE/LEGACY semantics, lane selection,
  canonical freshness, dedupe, draft/generation barriers, exact user-turn proof, or
  no-blind-resend behavior.
- Create a second browser controller, retry loop, alternate endpoint, account/profile
  discovery path, page-selection heuristic, kill/rebind behavior, or repository-default
  fallback.
- Perform a live ChatGPT wake inside Executor verification, fabricate/replay a carrier,
  claim H4D closure from tests/publication, or advance H4E automatically.
- Modify TASK-303 or RUN-303-001 engineering lineage or perform REPAIR-303-001.
- Bypass Publisher ancestry with correction integration, cherry-pick, manual merge,
  force publication, direct main push, TASK-307, or a separate integration task.
- Change the H4D implementation semantics already reviewed PASS in r2 or reuse the
  r2 REVIEW as the r3 verdict.
- Mutate roadmap planning after r3 PRIMARY admission and before its reviewed publication
  attempt.
constraints:
  hard:
  - 'Target.getBrowserContexts proof accepts only two canonical response keysets:
    browserContextIds alone, or browserContextIds plus defaultBrowserContextId. browserContextIds
    must exist, be a list, and be exactly empty.'
  - When defaultBrowserContextId is present it must be a non-empty string and is treated
    as opaque compatibility metadata only; it cannot select, identify, or authorize
    a browser context, account, profile, route, or target.
  - Any unknown extra key, missing browserContextIds, non-list browserContextIds,
    non-empty browserContextIds, malformed/empty defaultBrowserContextId, or otherwise
    unsupported response shape remains BROWSER_CONTEXT_UNPROVEN.
  - Exactly one Playwright browser context must exist before CDP context proof and
    the exact context list must remain stable after session detach. The proof must
    remain bounded by the existing acquisition deadline.
  - Expected operational failures from bounded Playwright/CDP bridge operations used
    for context proof or one-page creation must convert to deterministic fail-closed
    transport reasons inside the acquisition boundary rather than escape as generic
    LOCAL_FAILURE; timeout remains ACQUISITION_TIMED_OUT, while other unproved bridge/context
    operations must not grant retry or permission.
  - The bounded path must still issue at most one new_page request, require the created
    page to begin as about:blank in the same proved context, reject context/target/page
    races, navigate only to the exact bound chat URL, and re-prove exact browser owner
    before exposing the page to delivery editing.
  - Focused regression must exercise a production-shaped launched acquisition end-to-end
    through context proof, one page creation, exact navigation, post-navigation owner
    re-proof, and entry into existing pre-submit surface checks without performing
    a real ChatGPT connection or live Send.
  - Regression must also cover legacy accepted CDP shape, production optional-default-ID
    shape, unknown keys, malformed default ID, non-empty non-default contexts, detach/context
    drift, bridge operational failure, page-creation uncertainty, and existing listener/profile/owner
    race failures.
  - No raw local path, command line, PID, endpoint, defaultBrowserContextId value,
    account/session material, chat URL, or transcript content may enter canonical/public
    artifacts or wake receipts.
  - Executor changes only scope.modify, mutates no roadmap/lifecycle state, performs
    no live H4D experiment, and does not claim Runtime verification, Reviewer PASS,
    publication, H4D closure, or H4E authorization.
  - 'r3 must end with exactly these scope.modify blobs: docs/AIOS-H4-ORIGIN-AFFINE-UNATTENDED-WAKE-v1.md
    8179436c743808298ed6ac1e80583f8d4a99bcd7; src/aios_renew/unattended_chat_wake.py
    98228b777bf600c8cea6bba54072aabe874b8a92; tests/test_unattended_chat_wake.py 9eeb324d4b1755b0701597bd73900303f989d953.'
  - Immediately after r3 authoring and before PRIMARY admission, Human/Brain planning
    may change only the active recovery bookmark task_revision from 2 to 3, preserving
    TASK-303 as PAUSED and the same return_to; that commit must precede the execution
    base.
  - PRIMARY must use the repository self-host wake path with executor codex, model
    gpt-6.1-sol, reasoning effort xhigh, and explicit model/effort selection.
  - Runtime must verify r3 freshly; Reviewer must issue a fresh r3 verdict; Publisher
    alone may publish the exact eligible reviewed source.
acceptance:
- id: AC1
  condition: _prove_context accepts the legacy browserContextIds-only empty-list response
    and the real production response containing exactly browserContextIds=[] plus
    a non-empty string defaultBrowserContextId.
- id: AC2
  condition: _prove_context rejects missing/malformed/non-empty browserContextIds,
    empty or non-string defaultBrowserContextId, and any unknown extra response key
    without inferring context/account/profile identity.
- id: AC3
  condition: The proof still requires exactly one Playwright context and proves the
    same context list remains stable after bounded browser-CDP-session detach.
- id: AC4
  condition: Expected operational failures in bounded context/session/page bridge
    calls fail deterministically inside the acquisition boundary and do not escape
    as generic LOCAL_FAILURE, grant retry, or authorize page creation.
- id: AC5
  condition: At most one page is created; it must be about:blank in the proved context
    before exact navigation, no competing exact target/context may appear, only the
    bound chat URL is navigated, and exact owner proof is repeated before editing
    can begin.
- id: AC6
  condition: A production-shaped inert regression traverses launch/attach, exact owner
    proof, context proof with optional defaultBrowserContextId, one page creation,
    exact navigation, second owner proof, and existing pre-submit surface validation
    while issuing no live network ChatGPT wake or Send.
- id: AC7
  condition: TASK-304 listener proof, TASK-305 profile occupancy proof, v3/origin-affinity,
    canonical freshness, dedupe, draft/generation, at-most-one submission, ambiguity
    and no-blind-resend behavior remain unchanged and regression-green.
- id: AC8
  condition: Documentation records the bounded production-compatible context proof
    and deterministic bridge-failure boundary while preserving machine-local privacy
    and the separate Human/Brain H4D live exit gate.
- id: AC9
  condition: The completed implementation has exactly the three immutable scope.modify
    blobs named in constraints.hard and no Executor modification outside scope.modify.
