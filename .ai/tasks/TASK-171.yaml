task_id: TASK-171
revision: 1

goal: >
  Restore deterministic read-only canonical observation from exact detached
  verification subjects so Brain Sync and the shared Unified State observation
  path can resolve canonical main and canonical remote lifecycle without
  requiring the verification subject to be attached to a local branch.
  Preserve TASK-156 exact verification-subject isolation, TASK-121 Brain Sync
  semantics, existing mutation-capable transport remote selection, fail-closed
  ambiguity handling, and all Runtime/Reviewer/Publisher authority boundaries.

problem: >
  RUN-159-006 is an immutable VERIFICATION FAILURE on exact subject
  9711dd8ee4a4478ca28bb2407987aac982794df7. Its serial profile failed only
  tests/test_brain_sync.py::test_brain_sync_live_repository_smoke, and that same
  node also failed under workers 2, 3, and 4 while canonical collection,
  subject identity, process isolation, temporary-root isolation, and Git-fixture
  cache isolation remained conformant.

  Source audit shows that TASK-156 intentionally materializes canonical
  verification as a clean independently mutable Git checkout with detached HEAD.
  Brain Sync canonical-main observation and the shared read-only remote
  observation substrate still depend on transport-remote resolution derived
  from the currently attached branch. In a detached verification subject that
  branch-specific binding is unavailable.

  The defect has two consequences. Unified State observation can fail before
  lifecycle reduction because its isolated remote observer cannot derive the
  configured transport remote. Separately, Brain Sync canonical-main resolution
  may fall back to a local refs/heads/main or HEAD value after detached remote
  resolution fails; for an implementation candidate ahead of published main,
  that fallback can confuse candidate identity with canonical published-main
  identity.

  TASK-171 therefore hardens only the read-only observation boundary. It must
  not attach or rewrite the verification subject, broaden mutation-capable
  transport remote selection, change lifecycle semantics, or weaken fail-closed
  canonical identity requirements.

assumptions:
  - >
    Canonical main at TASK-171 planning is
    9711dd8ee4a4478ca28bb2407987aac982794df7.
  - >
    RUN-159-006 remains immutable TASK-159 revision-6 VERIFICATION FAILURE and
    is not retried, repaired, rewritten, deleted, or reinterpreted by TASK-171.
  - >
    TASK-121 remains authoritative for AIOS_BRAIN_SYNC_SNAPSHOT version 1,
    deterministic canonical rehydration, planning-versus-engineering-state
    separation, Unified State reuse, and observation-only behavior.
  - >
    TASK-156 remains authoritative for one clean independently mutable exact
    verification subject whose HEAD may intentionally be detached from every
    branch while remaining bound to the admitted candidate SHA.
  - >
    Existing resolve_transport_remote semantics are used by surfaces beyond
    Brain Sync observation, including mutation-capable transport and authoring
    paths. TASK-171 does not authorize widening those paths merely to support a
    detached read-only observer.
  - >
    RUN-159-006 provides no evidence that this Brain Sync failure is caused by
    xdist worker isolation or worker count. The failure exists in the serial
    profile and must be corrected independently of BP-V4 worker policy.
  - >
    Runtime owns canonical verification and evidence; Unified State remains the
    lifecycle reducer; Brain Sync only composes read-only facts; Brain/Human own
    roadmap reasoning; Reviewer owns semantic verdict; Publisher owns
    publication.

