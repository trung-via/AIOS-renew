non_goals:
- No additional lifecycle truth DB/log store, memory/router, generic polling, scheduler,
  auto-REPAIR authoring/strategy, Runtime verifier replacement, Executor change, Reviewer/Publisher
  merge, autonomous retry or Human permission inference.
- No PTE-04 dirty snapshot/preservation, PTE-05 prospective kernel amendment, PTE-06
  dirty recovery or TASK-401 r3 activation; no altering original failed runs, or any
  immutable RESULT/FAILURE.
- No public raw stdout/stderr, environment dump, credential/secret exfiltration, unrestricted
  external log fetch, unbound URL/path or provider-visible raw output.
- No loosening existing safe detail V1-V4/parser negative/AST import/API invariants,
  bypassed tests, xfail/skips, full suite for ceremony, or edits to inspect-only files.
constraints:
  hard:
  - Exactly 12 original ACs claimable as implementation properties; Runtime later
    evaluates required verification/EVIDENCE; Reviewer judges semantics and Publisher
    exact reviewed source. Never fabricate claim or runtime PASS. Use exact TASK contract,
    not assistant paraphrase.
  - Maintain existing verification profile, source digest/identity currentness and
    private capture ownership. Do not re-run old verification merely to retrieve diagnostic
    text. Legacy frozen Kernel and Constitution retain authority; do not amend by
    implication.
  - Keep all changes to scope.modify. Source workflows are permitted only for the
    smallest necessary supported caller bridge; if an inspect-only source must be
    changed, report blocker for prospective Human/Brain authorization rather than
    touch it.
  - Technical snippets are source-validated and bounded with conservative allowlisting
    and field-level removal/typing; regex alone is not proof of no secret, redact
    unknown/unsafe spans while keeping separate safe A fields. Do not blindly echo
    model/tool/user log content into Brain instructions.
  - Where source missing/corrupt/wrong SHA/unauthorized return honest typed blocker
    and next safe source, not a semantic cause. Always distinguish original immutable
    RUN observation from post-hoc diagnostic inference or local fixture.
  - Preserve public V1-V4 document readers and negative imports/AST guards; add a
    versioned safe detail extension when necessary. Plain result vs reviewed/published
    must remain distinct, and all canonical refs reread for currentness.
  - "Minimum-sufficient-v1 verification only using three exact authored commands;\
    \ Executor may perform narrower local checks but Runtime exact commands may not\
    \ be weakened or skipped. 12 workers current repo profile, no full suite. Produce\
    \ clean committed candidate, full truthful AC1\u2013AC12 claim set and exact ResultPackage."
acceptance:
- id: AC1
  condition: Given a real authenticated canonical FAILURE, the maintained source-bound
    diagnostic read covers admitted EXECUTION, VERIFICATION and COMPLETION_GATE, and
    pre-RUN ingress/transport remains an operational-only cause without a fabricated
    RUN or changed lifecycle authority.
- id: AC2
  condition: Every diagnostic is bound to exact TASK/revision, RUN, failed candidate/base
    SHA, terminal artifact SHA, private capture/FAILURE digest and current reader
    authority, or reports a stable typed SOURCE_UNPROVEN blocker; stale/moved/cross-RUN/wrong
    origin/replay are rejected before exposing content.
- id: AC3
  condition: When ordinary pytest safe detail has MALFORMED_SUMMARY, SUMMARY_ABSENT,
    unsupported ANSI/truncated closing section or zero nodes despite failed exit,
    the existing authorized read ladder attempts the exact original protected evidence
    without rerunning verification. Report bounded verified discriminator or typed
    missing/invalid/permission/limit blocker, never invented failed node.
- id: AC4
  condition: When safe detail contains a failed test but error_types UNKNOWN (RUN-403-002
    pattern), the reader returns available safe test node, exception type, repository-relative
    file/line and bounded traceback/assertion actual/expected needed to distinguish
    cause; if unavailable it explicitly says which source is missing or withheld rather
    than treating the test identity as sufficient.
- id: AC5
  condition: Safe non-sensitive structural fields are preserved even when adjacent
    captured material contains private data; technical spans are released only after
    field/segment-level filtering with typed redaction decisions. Unknown/high-risk
    text is withheld as that span, not reclassified as an unqualified safe fact.
- id: AC6
  condition: Credential, API key, private key, cookie, auth header, tokenized URL,
    test parameters, local absolute path, customer/person identifiers, encoded/nested/ANSI
    payload and prompt-injection cases never appear unfiltered in portable Brain/public
    projections; redactions do not allow instruction execution, path traversal or
    source substitution.
- id: AC7
  condition: The implementation reuses the existing self-host Runtime control-plane
    protected reader, canonical public/safe/detail/page contract and GitHub Actions
    read-only source attribution; raw captures remain protected and only a bounded
    safe projection crosses to Brain. No independent DB/log service/alt verifier/reducer
    or new mutation authority.
- id: AC8
  condition: There are finite reader byte/time/call/field/page bounds and stable typed
    availability/cause/provenance/limitations. Legacy public FAILURE safe detail V1-V4,
    paged reader validation, source-currentness and direct-call import/AST/public
    APIs remain compatible; historical FAILED RUNs are never overwritten/backfilled.
- id: AC9
  condition: A real maintained operator/Brain Sync or attention/work-context consumer
    traverses the source-authenticated diagnostic path using real Git fixtures and
    subprocess/entrypoint where appropriate, without requiring Human to run a diagnostic
    script or paste private logs when a lawful source exists; unavailable protected
    source returns an actionable typed blocker.
- id: AC10
  condition: Source-bound regressions reproduce distinct observed RUN-401-002 EXECUTION
    native patch-context symptom, RUN-403-001 MALFORMED_SUMMARY, and RUN-403-002 PARSED
    node with UNKNOWN exception using original canonical fact boundaries or faithful
    labeled isolated fixtures; distinguish production failure from a diagnostic fixture's
    missing Git history or pytest/xdist profile.
- id: AC11
  condition: Positive/negative tests cover admitted exec timeout/auth/quota/invocation/dirty;
    verification assert/fixture/import/config/worker/crash/history/encoding/summary;
    completion missing AC/unresolved/invalid ResultPackage/EVIDENCE/out-of-scope;
    pre-RUN transport and REVIEW/PUBLISH reader-owned cases; future OTHER/UNKNOWN
    keeps exact phase and source witness.
- id: AC12
  condition: All changes remain observational for Brain, keep Runtime verification
    and EVIDENCE, Brain strategy selection, Executor HOW, Reviewer verdict and Publisher
    exact-source inclusion separate; maintain at most one source-bound next diagnostic
    read where necessary and no automatic repair, retry, task/run creation, roadmap
    advancement, full-suite default, or public raw-log leak.
