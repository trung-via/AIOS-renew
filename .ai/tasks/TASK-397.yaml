goal: Implement Lean VP Intra v1.3 L3-05 as the actual prospective Runtime-owned versioned
  admission, operation-specific consent/withdrawal and finite resource-budget enforcement
  boundary for PRIMARY, REPAIR and REMEDIATION. Reuse the published L3-01..04 scheduler/lease/feedback
  foundation and exactly one canonical Runtime execution/verification owner; preserve
  legacy admissions and keep production intra-RUN continuation NOT_ACTIVATED until
  separately reviewed L3-06/G3 and authenticated Human G6.
problem: TASK-396 r1 published the v1.3 KA-01 normative defaults and retired competing
  old Lean VP NEXT, but current L3-04 code has only PRIMARY-positive local receipt,
  explicitly marks finite Human budget/consent NOT_ESTABLISHED, and blocks repair/remediation
  feedback. The current operator invokes existing PRIMARY/REPAIR/REMEDIATION paths
  without authenticated v1.3 per-RUN budget admission or monotone resource-enforcement
  across checkpoints. Defaults in a document alone must not be mistaken for executable
  authority. L3-05 closes admission/consent/resource/withdrawal mechanics before separate
  L3-06 integrated G3 and G6 activation.
