task_id: TASK-301
revision: 1
goal: Implement H4C1 origin-affine return routing so every post-cutover semantic flow
  carries one bounded opaque return-affinity selector from its Human/Brain-established
  origin through canonical TASK/RUN lineage into Brain-attention delivery, and local
  wake resolves that selector only through machine-local origin state into one conversation-scoped
  serialized lane.
problem: 'H4C0 proved PAGE_SCOPED_AIOS_SEND_ORIGIN_BOOTSTRAP_V1 can establish stable
  distinct opaque conversation routes and fail closed. The current production wake
  path remains repository-scoped: canonical TASK/RUN contracts carry no return affinity,
  local_chat_wake resolves one repository binding/state lane, and direct/follow-up/scheduled
  drain can therefore select only the repository-default destination. H4C1 must make
  affinity deterministically reconstructible from canonical lineage without raw chat
  identity, content heuristics, a second router, or a second lifecycle/state authority.'
assumptions:
- Canonical H4C0 is DONE/CLOSED_PASS and H4C1 is the unique reconciled roadmap NEXT
  on main 7835ce58e025b0968e2672558a5b8812eb15244e.
- H4C0 selected contract PAGE_SCOPED_AIOS_SEND_ORIGIN_BOOTSTRAP_V1 emits an opaque
  page-origin-v1:<64 lowercase hex> route handle plus a positive binding generation;
  raw normalized chat URL and loopback endpoint remain machine-local in the origin
  registry.
- An opaque route handle is a selector only. Its presence or value grants no authority
  to allocate TASK/RUN, select next_action, execute, review, publish, transfer ownership,
  or advance roadmap state.
- Current canonical attention event identities remain valid and need not embed the
  route selector. Exact affinity may be reconstructed read-only from their already-bound
  TASK/RUN/review/publication or admitted ingress lineage.
- Current local wake durability, canonical freshness, dedupe, ambiguous-attempt generation
  binding, and no-blind-resend behavior are valid primitives to preserve rather than
  replace.
- TASK-301 itself is a pre-cutover task and therefore may lack the new canonical return_affinity
  field; after exact publication, historical missing affinity is classified only as
  legacy, never synthesized as exact origin affinity.
