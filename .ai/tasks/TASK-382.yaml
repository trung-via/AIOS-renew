  TASK-381 r1 raw canonical source .ai/tasks/TASK-381.yaml has blob 3db2f20f9a42560d0d1b55db522bafb0cca87683.
  RUN-381-002 candidate bf1b3fa121fc7daebaa8257aa81d6546611e06e7 is in main; REVIEW-381-001
  PRIMARY PASS is the ordinary engineering review, not mapping adequacy approval.
- 'Human locked a finite Lean VP plan: 16 remaining deliverable slots L1=3 including
