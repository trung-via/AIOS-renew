  L1-02. The Human decision is recorded as planning carrier GitHub Issue #2168 but
  not yet incorporated into .ai/roadmap-state.yaml; canonical NEXT remains Lean VP
  L1.'
- Human's generic continuation authorizes bounded authoring for this package, not
