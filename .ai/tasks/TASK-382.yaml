task_id: TASK-382
revision: 1
goal: Deliver the fixed Lean VP L1-02 package's first genuine, independently reviewable
  semantic proof-contract and mapping source pair for the exact previously published
  TASK-381 r1 subject and reviewed candidate, with complete acceptance/obligation
  coverage and distinguishing proof conditions, using existing VP-02 validators and
  L1 canonical-source review readers. The mapping remains a prospective declaration
  until an independently authorized Human SELECT_MAPPING_REVIEW event and actual Reviewer/Publisher
  lineage are separately established; KA-01 stays NOT_ACTIVATED.
problem: TASK-376/377/378/380/381 have published structural, Git source, independent
  review and Human-selection consumers, but their positive proof-mapping fixtures
  are synthetic. No real, source-bound and semantically defensible proof contract/mapping
  exists for an actual published implementation TASK that can be carried through the
  existing independent mapping review and separately authenticated Human selection.
  Without this, L1-02's real approved mapping exit cannot be claimed; further readiness
  work would otherwise depend on synthetic success.
