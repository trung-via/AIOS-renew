task_id: TASK-354
revision: 1
goal: Fix the observed failure-projection transport incompatibility and deliver end-to-end actionable
  Failure Diagnostic Handoff to authorized Brain and Executor through existing Runtime FAILURE, BP-2,
  terminal attention, and fresh Brain Sync without a second coordinator.
problem: RUN-350-001 timed out with 23 uncommitted entries and its local private FAILURE
  was rejected by public serialization. RUN-352-002 independently demonstrated a quoted
  pytest -k selector blocked by public FAILURE command filtering. Existing blanket masking
  forces repeated Human log extraction. Implement the approved complete E2E diagnostic
  handoff with bounded focused verification instead of TASK-351's costly full suite.
assumptions:
- Canonical main at Brain Sync is 5b484b97f43a127106fc27efc935d32a72d44858. Runtime must independently verify currentness,
  exact original TASK-351 subject, TASK-354 absence, and expected-main CAS before AUTHOR_TASK.
- Human explicitly authorizes a new TASK-354 as the prospective selected implementation of the
  complete TASK-351 End-to-End Failure Diagnostic Handoff objective. All nine acceptance criteria
  and original 29 permitted modification paths are retained. Human replaces only the full-suite
  proof requirement with five ordered, focused, positive/negative integration regressions.
  TASK-351 and failed pre-RUN dispatch stay immutable; no deletion or roadmap auto-transition.
- Active Brain audit profile is aios-adaptive-brain-audit-v1 version 1 normalized digest
  982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718. Brain performed
  CONSTRUCT, ADVERSARIAL_AUDIT_AND_RECONCILE, all eight mandatory lenses and final closure.
- RUN-350-001 retains local FAILURE and 23 dirty in-scope changes. It is not retroactively
  completed, repairable, or published by this prospective TASK.
- RUN-352-002 retains a separate immutable local VERIFICATION FAILURE; a legitimate quoted
  pytest -k selector triggers unsafe public verification command at public_failure projection.
  Preserve original terminal evidence; safely support bounded legitimate selectors and reject
  malicious quoted text, secrets, local paths and injected shell syntax.
- Runtime FAILURE/EVIDENCE and BP-2 pre-AIOS operational facts, terminal attention, fresh Brain
  Sync, existing work-context and authorized local Executor access are the only carriers/truth.
  GitHub workflow channels are not trusted private raw-log channels.
- The TASK-351 dispatch was rejected at PRIMARY_SYNCHRONIZATION, with run_created=false and
  executor_invoked=false. The configured local main head had diverged and lacked a canonical
  preservation ref. This TASK identity and its verification change cannot bypass Git admission.
  Execution needs an independently authorized lawful current control checkout or reconciliation.
- Human accepts the bounded residual risk that unaffected repository-wide regressions will
  not be covered by this TASK's focused tests. Do not claim measured time saving without data.
- Human previously chose Codex gpt-6.1-sol max for the predecessor intent; profile must still
  be explicitly bound by Runtime at a distinct new admission. AUTHOR_TASK never dispatches.
