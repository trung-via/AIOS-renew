non_goals:
  - >
    Modify any downstream repository, Python Agent TASK-207, downstream AIOS pin,
    downstream workflow, policy file, runner, or repository variable. Downstream migration
    remains a separate explicit reviewed action after this upstream hardening is published.
  - >
    Modify AIOS-renew GitHub workflow YAML, checked-in carrier policy files, Runtime,
    Dispatcher, A1/A2, A3/A6, correction dispatch, repair dispatch, Executor adapters,
    review, publication, terminal RESULT/FAILURE truth, frozen Kernel, or roadmap state.
  - >
    Change PRIMARY, REMEDIATION, REPAIR, or ATTENTION request/body schemas, supported
    Executor set, durable dispatch identity, at-most-once semantics, correction authority,
    terminal-ref grammar, or publication behavior.
  - >
    Make Issue/event data authoritative for repository policy, auto-discover trust from a
    repository event, accept arbitrary workflow/ref/path/command/model/runner fields, or
    weaken exact event-to-policy matching.
  - >
    Introduce a generic lifecycle router, retry/fallback/reroute behavior, autonomous
    Executor choice, autonomous correction, polling, broker, daemon, database, or new
    semantic authority.
  - >
    Generalize canonical carrier-family title markers, terminal main ref, or attention
    signal namespace merely because repository identity becomes portable.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      PRIMARY wakeup, REMEDIATION intent, and REPAIR wakeup policy loaders must accept a
      syntactically valid repository full-name supplied by the repository-owned policy
      instead of requiring literal trung-via/AIOS-renew. Event admission must still
      require the event repository to equal that exact validated policy repository.
    - >
      PRIMARY wakeup, REMEDIATION intent, and REPAIR wakeup authorized_actors must be a
      validated unique non-empty allowlist of syntactically valid GitHub login values
      supplied by policy rather than requiring exactly [trung-via]. Existing sender/
      Issue-author attribution and equality checks must remain fail closed where the
      carrier currently requires them.
    - >
      Each of those three carrier families must retain its exact canonical title marker,
      versioned policy/request format, body-size bound, request selector grammar, and
      sanitized outputs. Portability must not allow policy to change the semantic carrier
      family or inject execution authority.
    - >
      Terminal-attention policy admission must accept a syntactically valid repository
      supplied by its repository-owned policy instead of requiring literal
      trung-via/AIOS-renew, and every push/workflow_dispatch admission must still bind
      exactly to that policy repository. Its canonical main ref refs/heads/main,
      attention signal prefix refs/heads/aios/terminal-attention, strict title marker,
      terminal selector grammar, and RESULT/FAILURE truth boundaries remain unchanged.
    - >
      Malformed repository identities, empty/duplicate/malformed actor allowlists,
      wrong repository events, unauthorized actors, wrong title/action/event framing,
      malformed bodies/selectors, and unknown fields must continue to fail before any
      sanitized dispatch/output or privileged downstream action is produced.
    - >
      Current AIOS-renew checked-in policies must continue to load unchanged. Regression
      tests must additionally prove at least one non-AIOS-renew repository binding,
      including trung-via/python_complete_agent or an equivalent syntactically valid
      downstream repository, is accepted when the event exactly matches its policy and
      rejected when repository/actor framing conflicts.
    - >
      The change is package admission hardening only. No new policy authority, workflow
      permission, dispatch journal, RUN allocation, Executor invocation, correction
      semantics, terminal truth, Reviewer authority, or Publisher authority may be
      introduced or duplicated.
    - >
      TASK-117 publication by itself does not claim Python Agent TASK-207 conformance or
      silently retarget its dependency. After reviewed upstream publication, downstream
      must perform a fresh BRAIN SYNC and an explicit reviewed pin migration before
      resuming the same canonical conformance lineage.

acceptance:
  - id: AC1
    condition: >
      PRIMARY GitHub-Issue wakeup policy/admission accepts a valid non-AIOS-renew
      repository-owned repository and actor allowlist, admits only an exactly matching
      event, and produces the unchanged sanitized dispatch_id/task_id/executor output.
  - id: AC2
    condition: >
      REMEDIATION-intent and REPAIR-wakeup policy/admission each accept valid downstream
      repository/actor bindings while preserving their existing trusted actor framing,
      strict selector schemas, sanitized outputs, and correction-family separation.
  - id: AC3
    condition: >
      Terminal-attention policy/admission accepts a valid downstream repository binding
      and exact matching event while preserving main-ref, attention-ref namespace,
      terminal selector, canonical RESULT/FAILURE truth, and notification-only semantics.
  - id: AC4
    condition: >
      Invalid or conflicting repository/actor policy values and mismatching events fail
      closed before dispatch/notification output; the hardening does not broaden arbitrary
      title, request, workflow, ref, command, model, runner, or credential authority.
  - id: AC5
    condition: >
      Existing AIOS-renew policies and carrier behavior remain compatible, exact request
      formats and family markers remain unchanged, and Brain authoring ingress semantics
      are not duplicated or modified.
  - id: AC6
    condition: >
      All implementation mutation stays within the eight authorized source/test files;
      no workflow, checked-in policy, Runtime, Executor, review/publication, frozen Kernel,
      roadmap, or downstream repository state changes.
  - id: AC7
    condition: >
      Focused deterministic regression verification passes with zero unresolved items and
      proves both current upstream compatibility and downstream repository-binding
      portability for all four affected carrier families.

verification:
  required:
    - python -m pytest tests/test_github_issue_wakeup.py tests/test_github_issue_remediation_intent.py tests/test_github_issue_repair_wakeup.py tests/test_terminal_attention.py tests/test_github_issue_wakeup_workflow.py tests/test_github_issue_remediation_intent_workflow.py tests/test_github_issue_repair_wakeup_workflow.py tests/test_terminal_attention_workflow.py -q