task_id: TASK-117
revision: 1

goal: >
  Repair the observed downstream-portability regression in the standard AIOS outer
  GitHub carrier admission layer by making repository identity, and where applicable
  authorized actor allowlists, come from strictly validated repository-owned carrier
  policy rather than AIOS-renew-specific literals. Apply the hardening consistently to
  PRIMARY wakeup, Human REMEDIATION intent, REPAIR wakeup, and terminal-attention
  admission while preserving each carrier family's protocol constants, fail-closed
  event-to-policy binding, and all existing Runtime/dispatch/Executor authority.

problem: >
  Fresh downstream conformance on trung-via/python_complete_agent exposed a real package
  portability defect. Python Agent main ec3374d905ff55609e6ed6d07915b759fdcf287e
  canonically authored TASK-207 and remains pinned to exact AIOS-renew
  652b00b103dd50e2a550dd0ec0fe4063e69631b7, which is also current upstream main.
  A valid live [AIOS BRAIN WAKEUP] Issue in that downstream repository, using the
  published downstream policy repository trung-via/python_complete_agent and explicit
  Executor antigravity, was rejected before dispatch with
  `carrier repository identity is invalid`; no self-hosted job, Executor invocation, or
  canonical RUN was created. Static inspection of the same current upstream source shows
  the same AIOS-renew repository literal in the REMEDIATION-intent and REPAIR-wakeup
  policy loaders, and terminal-attention admission likewise rejects any repository other
  than trung-via/AIOS-renew. By contrast, the Brain authoring ingress already validates a
  syntactically bounded repository/actor policy generically and successfully authored
  downstream TASK-207. The defect therefore blocks Python Agent TASK-207 live
  conformance AC2, AC3, AC5, and AC6 and conflicts with the reviewed TASK-114/TASK-116
  policy that standard outer control-plane capability is portable downstream through
  explicit reviewed repository-owned bindings.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    652b00b103dd50e2a550dd0ec0fe4063e69631b7, the published current-main integration of
    the downstream portability policy. Frozen Kernel v0.1 remains unchanged.
  - >
    Canonical downstream evidence is Python Agent main
    ec3374d905ff55609e6ed6d07915b759fdcf287e with TASK-207 revision 1 authored through
    live Brain ingress and exact AIOS-renew pin
    652b00b103dd50e2a550dd0ec0fe4063e69631b7.
  - >
    Python Agent live PRIMARY Issue #7 used a valid strict wakeup request and explicit
    antigravity Executor but was rejected at GitHub-hosted carrier policy admission with
    `carrier repository identity is invalid`. This is an admission/transport blocker,
    not a RUN failure; no RUN or Executor state exists for that attempt.
  - >
    The same causal defect is present in current
    src/aios_renew/github_issue_remediation_intent.py,
    src/aios_renew/github_issue_repair_wakeup.py, and
    src/aios_renew/terminal_attention.py. Fixing only PRIMARY would leave the same
    downstream conformance gate blocked at later carrier families.
  - >
    Existing checked-in AIOS-renew carrier policies, exact request/body formats,
    canonical title markers, dispatch identities, terminal-ref grammar, and
    workflow/runtime authority remain valid and must remain behaviorally compatible.
  - >
    Repository identity and authorized actor allowlists are downstream-owned binding
    values. Protocol-family constants such as request format/version, supported
    Executor grammar, exact family title marker, terminal main ref and attention signal
    namespace remain standard AIOS semantics unless separately changed by another TASK.

