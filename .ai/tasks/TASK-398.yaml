task_id: TASK-398
revision: 1
goal: Implement a bounded shared Git Decision Guard optimization for AUTHOR_TASK and Publisher, and canonically
  transcribe the Human 2026-10-22 prospective priority change so G1 precedes remaining Lean VP Intra v1.3 without
  retiring any unfinished Lean VP obligations; preserve exactly one roadmap NEXT and existing Runtime/Reviewer/Publisher
  authority.
problem: 'TASK-397 r1 AUTHOR_TASK Issue #2345 on main 030c1acb582f71f0fdd0342d790aa54d0d9bdd7f stalled during
  GitHub Actions ingress/deliver and was cancelled at its ten-minute job limit; no canonical TASK-397 on main
  was observed. In current publication.py the cumulative review-decision guard, exact source reads, commit-object
  fetches and later rechecks repeat many remote Git operations, with AUTHOR_TASK and Publisher sharing the
  helpers. Historical ingress median was 346 seconds across ten Issues, but exact guard attribution and production
  wall-time savings are UNKNOWN. Human now expressly prioritizes G1 and residual-only G2 before Lean VP and
  authorized a one-time local-direct native Runtime AUTHOR_TASK admission to bypass the blocked transport,
  not Runtime checks.'
assumptions:
- Canonical main observed before authoring is 030c1acb582f71f0fdd0342d790aa54d0d9bdd7f after reviewed/published
  TASK-396 r1; exact main and TASK identity/currentness MUST be independently authenticated again by Runtime
  at admission. No inference that TASK-397 was authored or RUN created.
- Human 2026-10-22 explicitly prioritizes Git Decision Guard and conditional residual Publisher Performance
  ahead of unfinished Lean VP Intra v1.3, without retiring, completing or replacing its L3-05/L3-06/G3/G6/L4
  obligations. Human has approved Codex GPT-6.1 Sol Max separately for the G1 Executor; model selection is
  operational delegation, not part of the executor-neutral TASK payload.
- The native Runtime authoring path accepts explicitly LEGACY_REPOSITORY_DEFAULT_ROUTE authoring without a
  new origin proof; this one-time authorized transport choice creates no new origin issuer, generic bypass
  or future default. Runtime remains responsible for SHA, provenance, reservation, main CAS and canonical evidence.
- Source material on the observed main includes publication.py existing _single_remote_sha, _fetch_object,
  _decision_snapshot, _pending_review_guard and _recheck_binding; authoring_ingress.py _execute_author_task
  uses the same pending guard, reservation, and recheck.
- The single current planning NEXT is lean-vp-intra-v13-budget-defaults-successor in .ai/roadmap-state.yaml
  and the matching roadmap document. The preceding v1.3 plan is the one to pause, not the already-retired older
  Lean VP plan. Earlier October 19 after-Lean-VP draft remains historical and does not create a second current
  NEXT.
- The source/read APIs, historical AST/import/public direct-call behavior and protected test assertions must
  remain intact unless expressly within listed modify scope and semantically justified. No extra test or source
  edits may be silently needed.
- ARCHITECTURE currently selects AOA-1 v1 and TASK_AUTHORING selects TCA-2 v2 from exact canonical roadmap/profile/protocol.
  Two-pass Brain audit is semantic support, not a Runtime mutation prerequisite; this TASK does not contain
  an audited_handoff.
- The planned G1 warm-local 32/128 decision benchmark target is at least 75 percent fewer Git remote subprocess
  calls against an identical pre-change baseline, NOT proven live wall-time improvement. Shared optimization
  benefits cannot be double counted as a later additional G2 gain.
