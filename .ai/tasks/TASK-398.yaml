non_goals:
- No production KA-01 v1.3/G6 activation, no L3-05/L3-06/G3 or L4 completion, no automatic RUN correction,
  and no resubmit/rewrite/fabricate TASK-397 ingress, TASK, RUN, FAILURE, REVIEW or publication state.
- No GitHub workflow timeout/trigger/concurrency changes, origin issuer modification, new persistent ref index/cache/DB,
  new agent, lifecycle router, retry/failover selector, scheduler, Writer, Reviewer or Publisher.
- No change to frozen Kernel, past TASK/RESULT/FAILURE/REVIEW/REPAIR/REMEDIATION lineage, exact origin proof/affinity
  rules, independent Human delegation, downstream pins, or historical planning semantics.
- No decision pruning, incomplete ref observation, skipped competing eligible PASS, silent recovery winner
  selection, stale remote refs, guessed eligibility, CAS/reservation weakening, or synthetic performance/PASS
  evidence.
- No independent Publisher residual implementation during G1; G2 is zero-or-one separate future scoped implementation
  TASK if and only if non-overlapping residual cost is demonstrated.
- No executor-specific implementation prescription, broad mandatory full suite, old v2 test gate, roadmap automatic
  advancement on Runtime/Reviewer/Publisher outcome, or account-token/secret/raw private log export.
constraints:
  hard:
  - At the exact immutable source-bound guard, preserve full authenticated current remote decision enumeration
    and exact reviewed source ref/SHA binding. Missing/malformed/duplicate/truncated/unavailable/over-capacity/ambiguous
    decisions fail closed; historical PASS cannot be filtered by age or RUN order.
  - Maintain a mandatory fresh re-observation of every material decision and source binding before mutation,
    current main and expected-old-main CAS; detect added/removed/moved refs, competing reviewed PASS and reservation
    owner changes even if local objects are warm.
  - Reuse an existing immutable commit object only if exact bound full SHA and commit object type validate;
    fresh remote ref is independently authenticated, and missing/corrupt/wrong-type object triggers a lawful
    fetch/validation or fail-closed blocker. Never use an unauthenticated local ref or persistent decision
    cache as live authority.
  - Preserve currently reachable Publisher normal, idempotent replay, already-included, correction, source
    drift, divergent recovery and competing-PASS paths. Keep typed failures and reservation/main-CAS mechanics;
    focus negative regression on race and incomplete remote data.
  - Before changing shared helpers, capture paired native-Git pre-change measurements. The bounded harness
    must measure remote ls-remote/fetch/push and elapsed time, use identical 0/32/128 decision populations
    and cold/warm conditions, and include at least five paired repetitions per condition; do not call fixture
    results real GitHub production latency.
  - Maintain Windows-safe bounded Git argument/response usage under zero, one, 32, 128, ceiling and over-ceiling
    decision populations; over-capacity, partial or malformed observation must reject rather than silently
    truncate.
  - 'Prospectively canonicalize Human 2026-10-22 priority in one exact coherent roadmap mutation: record sole
    NEXT for git-decision-guard-priority-20261022, queue Publisher residual-only after G1, pause without retiring/completing
    Lean VP Intra v1.3, and retain all older dated planning/engineering lineage. Root next_items, exactly one
    sequence NEXT, root active_track and planning_document must agree and retain a unique canonical planning
    owner. Explicit Human/Brain reconciliation, not Runtime or Publisher outcome alone, controls the subsequent
    NEXT.'
  - Update the previous v1.3 roadmap source to document paused-resumable status and refer to the one new active
    planning document, without reactivating the retired old Lean VP competitor. The new plan must state one
    G1 TASK, conditional zero/one residual Publisher TASK, and explicit Human/Brain return to L3-05 after reconciling
    TASK-397.
  - Preserve the source/test direct API and AST/import restrictions and do not edit any path outside the eight
    exact scope.modify entries. No change to source contracts, workflow YAML, active audit profiles or native
    Runtime verification ownership; conflicts with protected tests/API must be surfaced as BLOCKER rather than
    bypassed.
  - All acceptance conditions must describe Executor-claimable implementation properties. Runtime EVIDENCE,
    independent Reviewer PASS, exact Publisher publication, measured production speedups and post-G1 Human
    roadmap advancement are subsequent separate authority gates.
acceptance:
- id: AC1
  condition: The existing shared guard produces a complete, correctly bound exact remote decision snapshot
    in native-Git fixtures with zero/one/32/128 and capacity cases, and rejects missing, duplicate, ambiguous,
    truncated, invalid and over-capacity observations.
- id: AC2
  condition: Every included decision retains authenticated current exact source ref and full SHA association;
    already present verified commit objects avoid redundant remote fetch, while missing, corrupt or wrong-type
    local objects never authorize success.
- id: AC3
  condition: A new, deleted, swapped or moved decision/source ref after the first snapshot is detected by a
    fresh guard/recheck before any main write, with same-or-stricter typed fail-closed behavior.
- id: AC4
  condition: The pre-existing eligible competing PASS remains a blocker, irrespective of ref ordering or cached
    objects; no auto-winner or ignored historical PASS occurs.
- id: AC5
  condition: Concurrent reserved main/Publisher/Review/AUTHOR_TASK writers and main movement preserve exact
    lease/owner, source binding, expected-old-main CAS and postcondition; rejected paths never mutate main.
- id: AC6
  condition: Normal Publisher, already-published/included, immutable replay, source correction, moved review/artifacts
    binding, and divergent source recovery retain existing public API, returned outcomes, original typed blocker
    classification, and negative regression behavior.
- id: AC7
  condition: Matched native-Git warm-local success fixtures with both 32 and 128 decisions use at most 25 percent
    of baseline Git remote subprocess calls; the benchmark truthfully reports per-category calls, raw elapsed
    time, identical outcomes, and inconclusive timings where applicable.
- id: AC8
  condition: Native-Git tests bound argument/response size and local object integrity for cold/warm and ceiling/over-ceiling
    cases; no decision, source or mandatory fresh recheck is silently skipped for performance.
- id: AC9
  condition: Direct-final AUTHOR_TASK validation, legacy/ORIGIN_AFFINE distinction, current main/transport,
    no audited handoff, immutable revision replay, reservation and publication compatibility remain unchanged
    under focused existing tests.
- id: AC10
  condition: A new focused test module contains reproducible paired baseline/candidate native-Git measurements,
    five or more repetitions per required condition, and adversarial guard regressions; the production source
    API remains usable and no workflow, origin issuer or off-scope file changes occur.
- id: AC11
  condition: After the authorized planning delta, .ai/roadmap-state.yaml has exactly one matching root next_items/sequence
    NEXT/active_track for git-decision-guard-priority-20261022, plus one conditional Publisher residual queue,
    while the former v1.3 NEXT is paused not completed or retired and historical planning records/Task lineage
    remain unchanged.
- id: AC12
  condition: A dedicated current-priority planning document and amended v1.3 plan coherently describe G1 then
    conditional G2 then explicit Human/Brain return to the unfinished L3-05/L3-06/G3/G6/L4, with focused Brain
    Sync regressions proving no dual NEXT, outdated conflicting planning document or erroneous inference from
    TASK-397 transport to canonical engineering state.
