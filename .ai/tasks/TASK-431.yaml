task_id: TASK-431
revision: 1
goal: Implement and enable EGDF v1 (Evidence-Grounded Diagnostic Feedback) as the
  prospective checkpoint-scoped information capability for the already admitted original
  KA01 v1.3 Verify-Fix-Verify flow in PRIMARY, REPAIR and REMEDIATION. Reuse exact
  authenticated PTE-03-grade source facts for useful first failed-proof feedback and
  on-demand safe progressive reads in the same original native session, without an
  aggregate diagnostic ceiling or a second verifier. Supersede the unfinished TASK-426
  implementation intent prospectively while keeping all its historical canonical artifacts
  unchanged and conforming to the actual TASK-427/428/430 source and current general
  progress policy.
problem: Human has expressly abandoned further TASK-426 execution on 2026-10-27 after
  seven terminal r1 FAILURES and a separate TASK-426 r2 self-host wake refusal before
  RUN (KA01_V13_KERNEL_UPGRADE_ORIGINAL_RUNTIME_UNAVAILABLE, run_created=false, executor_invoked=false).
  Reusing the same r2 TASK will not fix a pre-RUN original-source module availability
  failure. The old r2 contract also mandates strict failed-identity-set decrease,
  contradicted by source now on main under TASK-430 r3 general self-repair alignment.
  Canonical TASK-427 r2 and TASK-428 r5 are authored but have no verified RESULT/review;
  TASK-430 r3 was exceptionally adopted as HUMAN_OVERRIDE/NOT_RUNTIME_VERIFIED. New
  EGDF implementation must be designed against real current source and truthful capability/lineage
  state, not claim that all three historical repair packages achieved independent
  PASS. EGDF source, checkpoint-diagnostic implementation and tests are not present
  on canonical main.
assumptions:
- Human's present replacement decision retires TASK-426 as a prospective implementation/work-selection
  target, not as a deletion or relabeling of its r1/r2 contracts, RUN-426-001..007,
  terminal failures, repair/ref history or rejected r2 self-host wake. No TASK-426
  dispatch/retry/resume is authorized by this TASK.
- 'Canonical implementation baseline at authoring: trung-via/AIOS-renew main deb92f7400a067938cd3f6ce3397d5448e2135a4,
  TASK-426 r2 blob e5e5e8a49cb723e7e90301f0aa1620cf5e7b6c06, TASK-427 r2 blob 5532e991432483afd2e3080cbb92d6822a963bcb,
  TASK-428 r5 blob 5ab965add255f9027365add5acd2e3c92ae3eb88, TASK-430 r3 blob 964b49595828ed9642516339c3b14a206822a811.
  All currentness and source must be reauthenticated by Runtime at execution.'
- TASK-427 r2 and TASK-428 r5 remain unproven as independently Runtime-verified and
  reviewed; TASK-430 r3 entered main by exact Human override and is NOT_RUNTIME_VERIFIED.
  New EGDF source may reuse only implementation actually present on verified-current
  main and existing authenticated original observers, not absent/unpublished presumed
  patches.
- Original self-host pre-RUN KA01 Kernel-upgrade source admission requires genuine
  independent original loaded modules. The last TASK-426 r2 wake failed before RUN
  with KA01_V13_KERNEL_UPGRADE_ORIGINAL_RUNTIME_UNAVAILABLE. A new TASK ID or source
  inclusion alone does not fix that gate. Do not dispatch this protected coding TASK
  through a known unchanged failing admission; authenticate original control module
  readiness or surface the exact pre-RUN blocker first. No synthetic RUN or invented
  repair lineage.
- EGDF remains information delivery only. The same admitted Executor chooses how to
  correct within the existing TASK family/scope, same process, session and budgets.
  Runtime owns original observation, verification and terminal evidence; independent
  Reviewer and Publisher retain separate authorities.
- Prior PTE-03 terminal diagnostic sources provide a safe information vocabulary and
  bounded source extraction, not authority to deliver arbitrary private raw data or
  to drive workflow. The new progressive channel's actual availability on the installed
  native transport must be established from source; unsupported features stay UNAVAILABLE
  instead of being invented.
- The enabled progress rule on main from TASK-430 r3 uses candidate-proof-change-v1
  rather than mandatory decrease in the failed-identity population. Retain complete
  stable evidence, new causal scoped candidate, bounded budget and exact progress
  without using failure-count reductions as a universal veto.
