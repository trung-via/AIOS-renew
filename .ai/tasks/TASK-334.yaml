non_goals:
- No modification or publication of failed TASK-333/334 candidate refs or original
  terminal artifacts.
- No second Runtime, Reviewer, Publisher, lifecycle router, scheduler or trust registry.
- No approval or bypass for arbitrary private-key/token access by Executor.
- No Windows Administrator adversarial threat model or administrator anti-tamper.
- No public raw verification logs, secrets, file-system paths or protected REVIEW
  payloads.
- No silent source-to-current-target proof conversion or synthetic terminal/preterminal
  authority.
- No live Stage-2 restrict-creations/updates enforcement, Stage-1 modification or
  bypass change.
- No frozen Kernel or schema amendment, KA-01 cutover, C1/C2 checkpoint activation
  or downstream adoption.
- No full-suite, base replay or unchanged verification repetition without proved invalidation
  or obligation.
constraints:
  hard:
  - Preserve all current TASK/RUN/RESULT/EVIDENCE/REVIEW immutable schemas, admission,
    separate Reviewer verdict and Publisher CAS source authority.
  - Issued terminal-source facts must originate in the existing admitted Runtime/verification
    completion boundary and bind TASK revision/blob, admitted RUN, base, profile,
    candidate/tree, RESULT/EVIDENCE, original raw digest/size and exact terminal artifact.
    Public constructors, fixtures, arbitrary remotes and Git content alone cannot
    authenticate issuance.
  - Independent SUBMIT_REVIEW origin must be verifiably authenticated by its existing
    ingress-owner path, bind exact decision/ref/candidate/artifacts and never infer
    semantic verdict from GitHub App identity.
  - Protected raw stays local at its existing authorized Runtime location. Public
    GitHub may carry only bounded safe digest/size/identity metadata. Lack of authorized
    independent raw read keeps RAW_UNAVAILABLE/UNKNOWN.
  - Runtime Writer and Control Writer have separate GitHub App private keys. Runtime
    Writer token is minted only for trung-via/AIOS-renew with minimum necessary permissions;
    broker shall not leak token or private key to Codex. A dedicated Windows service
    identity is the approved isolation design; Windows Administrator remains a trusted
    Human recovery authority.
  - An untrusted request from the .\TRUNG runner is not sufficient IPC authority.
    Broker enforces a narrowly bound Runtime-owned operation, authenticated approved
    caller boundary, exact ref/old-new SHA/CAS and non-replay, without becoming lifecycle
    authority.
  - The shared refs/heads/aios/publication-reservation/main lease/CAS path remains
    coherent across AUTHOR_TASK, SUBMIT_REVIEW, Publisher and publication recovery.
    Do not assign it blindly to only one writer.
  - Stage 1 ruleset 24824106 stays unchanged, no bypass. Stage 2 separately evaluates
    restrict-creations and restrict-updates on Runtime/Control namespaces; activation
    requires positive/negative live writer smoke plus separate Human authority, not
    completion of this TASK alone.
  - Historical source provenance cannot be retroactively minted. Positive source/currentness
    claims require independent proof; absent/torn, stale, forged or swapped inputs
    stay UNKNOWN/BLOCK.
  - Reuse reviewed/published TASK-335 on main. Treat failed TASK-333/334 source only
    as exact-SHA inspectable material; do not merge or publish failed candidates wholesale.
  - Verification under minimum-sufficient-v2 remains focused on newly affected obligations
    and actually invalidated evidence. Keep distinct mandatory integration proof;
    no automatic baseline replay or double-execution of unchanged items.
  - Broker service deployment, live private key, GitHub installation credentials and
    production smoke are separate protected operational setup, never TASK payload
    or canonical public artifact. Missing live credentials keeps live-smoke unproven
    and enforcement off.
acceptance:
- id: AC1
  condition: Actual Runtime owner origin and admitted terminal issuance are independently
    bound to exact TASK/RUN/profile/candidate/RESULT/EVIDENCE and immutable raw metadata.
- id: AC2
  condition: Read-only consumer correlates independently authenticated REVIEW ingress
    with exact terminal source, without confusing recorded verdict with provenance
    of semantic Reviewer judgment.
- id: AC3
  condition: Runtime Writer broker implementation enforces protected operation, ref
    and CAS identity; Executor receives neither PEM nor installation token, and unauthorized
    writer mutations are rejected.
- id: AC4
  condition: Raw content is not exported to public GitHub; availability is honest
    and authorized comparisons bind immutable source digest/size.
- id: AC5
  condition: Ref creation/update, publication reservation/recovery, replay and failure
    paths preserve Runtime/Control ownership and existing CAS/lifecycle semantics.
- id: AC6
  condition: Focused adversarial tests cover fake Runtime/Reviewer source, wrong writer,
    mismatched RUN/blob/SHA, swapped raw/decision, stale refs, replay, unauthenticated
    IPC and missing credential/permission without production-ref mutations.
- id: AC7
  condition: Stage 2 design enumerates creation/update namespace coverage and leaves
    enforcement disabled pending separate credential and positive/negative live smoke
    evidence; no ruleset is activated by implementation.
- id: AC8
  condition: Frozen Kernel compatibility, legacy decode, no authority expansion and
    evidence reuse until invalidated are preserved; out-of-scope or unsupported source
    claims remain typed UNKNOWN/BLOCK, not asserted PASS.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_runtime_provenance_issuer.py tests/test_runtime_provenance_owner.py
    tests/test_runtime_writer_broker.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
