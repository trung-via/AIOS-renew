task_id: TASK-334
revision: 1
goal: Establish an independently grounded, bounded Runtime-owned terminal provenance
  issuance and safe raw-EVIDENCE binding at the existing Runtime completion/transport
  boundary for prospective admitted RUNs, so the paused VP-03D TASK-333 can later
  consume real trusted source facts rather than a self-certified repository. Emit
  immutable source facts rooted in actual Runtime admission/verification, preserve
  independently authored REVIEW identity/currentness as a separate downstream observation,
  and make any absent raw/source/reviewer information explicitly UNKNOWN/BLOCK. Do
  not activate proof reuse, verification-policy replacement, KA-01 continuation or
  any new authority.
problem: Canonical RUN-333-001 terminated FAILURE with a clean in-scope candidate
  because TASK-333's constrained read-only module could not establish an independent
  real Runtime/Reviewer terminal issuer or canonical raw source. Current Runtime locally
  persists canonical RUN/RESULT/EVIDENCE and raw verification; existing transport
  publishes RUN/RESULT/operational metadata but not a complete provenance-bound raw
  source usable under independent trust/currentness. A Git SHA, authenticated-looking
  fixture, configured arbitrary remote or REVIEW-shaped data are not independent issuance.
  A distinct prospective Runtime source/transport contract is required before TASK-333
  AC2 and positive AC4 can be addressed.
assumptions:
- Human explicitly approved a separate source-issuance contract instead of retrying
  code-only REPAIR. Fresh roadmap main 0b37e18b74f7b550288b04b85ec21cae4a9ee461 selects
  TASK-334 as the unique VP-03D prerequisite and retains TASK-333's failed lineage
  without remediation, publication or changed acceptance.
- TASK-333 r1 RUN-333-001 FAILURE artifact on aios/failure-artifacts/RUN-333-001 commit
  53230d3eeac098a9350ce99669877b51623006e4; failed candidate af16ec63c8700b9f7411434d338f044300392b86,
  COMPLETION_GATE unresolved legitimate issuer/source, verification not run. Preserve
  those identities; no implicit new RUN/REPAIR.
- Human's Codex gpt-6.1-sol xhigh delegation remains sticky to TASK-333 only. TASK-334
  Executor/model/effort not selected and require new Human assignment before any PRIMARY,
  though AUTHOR_TASK may be canonicalized separately.
- GitHub repository trung-via/AIOS-renew is PUBLIC. Raw verification logs may contain
  sensitive information and cannot be emitted to public source/artifact refs without
  explicit separate privacy authorization. Publish only bounded non-sensitive immutable
  identity, cryptographic digest and availability/validation facts; retain protected
  raw at Runtime-local authorized boundary.
- Existing Runtime completion/transport and independent REVIEW ingress/currentness
  must retain their own canonical roles. The issuer is not a new cryptographic trust
  root or reclassification of Git objects; its limited authenticity is the existing
  admitted Runtime observation and protected transport/admission configuration.
- Existing minimum-sufficient-v2 remains active for this TASK. VP-01 deferred-not-waived,
  VP-02/VP-03 full exit open, KA-01 NOT_ACTIVATED and VP-04/05/07 source policy/reuse/cutover
  not authorized. New revision-1 legacy return route is the approved default.
