task_id: TASK-334
revision: 2
goal: Complete one bounded VP-03D end-to-end authenticated Runtime terminal-source
  and independent Reviewer-source contract, using published TASK-335 owner-bound observations
  and only valid in-scope material from failed TASK-333/334 candidates. Include GitHub
  App writer credential isolation and a staged, non-enforcing ref-authority smoke
  contract. Do not promote Git transport, metadata or a successful smoke alone to
  canonical Runtime verification, Reviewer PASS, publication or proof-reuse authority.
problem: RUN-333-001 and RUN-334-001 terminated at COMPLETION_GATE with clean preserved
  failed candidates and no canonical verification run. The first lacked a real Runtime/Reviewer
  source; the second captured conditional content but could not authenticate independently
  admitted Runtime/Reviewer ownership within its five-file scope. TASK-335 added in-process
  owner observations and was reviewed PASS and published, but its issuer_authenticated
  and reviewer_authority fields remain false and raw/currentness are unavailable.
  Runtime's local Git push principal is still unproven; both self-hosted runners use
  .\TRUNG.
