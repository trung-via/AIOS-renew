non_goals:
- No modification to failed TASK-333 source/failed RUN/terminal artifacts, no automatic
  REPAIR, no retrospective backfill or rewriting immutable historical EVIDENCE, REVIEW
  or TASK schemas.
- No private or unredacted raw logs, subprocess output, environment secrets, credentials,
  tokens or external personal data published to the public Git repository; no new
  public endpoint for protected local raw.
- No independent Reviewer verdict created by Runtime; no Reviewer-to-Runtime authority
  merger or assumption that a recorded terminal RESULT is already reviewed or published.
- No added trust registry/issuer enrollment authority, independent signature service,
  second planner/router, retry/failover, verification scheduler, proof authorization
  service, or persistent memory/state database.
- No producer that authenticates arbitrary caller-selected repository/remote, Git
  objects, fake Runtime instance or test fixture by its own assertion; no new permission
  flags permitting acceptance discharge or code continuation.
- No Kernel v0.1 or KA-01 activation, no V2 retirement, no new verification execution
  policy, no live preterminal C1/C2, no automatic feedback/checkpoint/scheduler/publisher
  action or downstream pin change.
- No broad pytest, unchanged expensive upstream suite reruns, base replay or double
  verification without separately proven distinct obligation.
constraints:
  hard:
  - Only existing Runtime's independently admitted execution/completion, approved
    execution profile, exact TASK/RUN/terminal source and deterministic verification/evidence
    process may issue source facts. Issuance must occur at the real owner boundary;
    a caller of a diagnostic, repository fixture or public helper cannot mint a trusted
    equivalent. Issuer legitimacy must not be inferred from Git SHA or self-certified
    fields alone.
  - Bind exact TASK ID/revision/task blob/commit/admitted RUN/base/executor/verification
    subject/candidate/tree, RESULT/EVIDENCE structural identities, proof type, command,
    original outcome and source raw path/size/SHA256 where present, plus issuer context/source
    version and lifecycle phase. Do not relabel original subject or create target
    execution evidence.
  - 'Separate actual Runtime-issued terminal facts from independent Reviewer ingress:
    a postterminal read-only join may project a REVIEW only after current canonical
    review-decision source, exact review candidate/revision/acceptance and authority
    provenance are separately established. Absence of REVIEW must not block source
    issuance, but must block positive reviewed-source conclusions.'
  - Use protected existing transport/artifact namespaces and issuance/read-only observation
    rules, with exactly scoped additive versioned metadata. No canonical RESULT/EVIDENCE/REVIEW
    schema changes and no competing lifecycle truth, publisher or result terminalization
    path.
  - Public GitHub may receive only explicitly non-sensitive bounded provenance digest/size/identity
    and source availability state, never unredacted raw logs or secret-bearing data.
    Raw content remains at authorized existing Runtime-local storage. A remote read-only
    consumer lacking authorized raw access must receive RAW_UNAVAILABLE/UNKNOWN, not
    an invented authenticated raw match.
  - Any positive authenticated-source observation must be traceable to the existing
    Runtime-controlled local issuer/action and protected canonical transport, with
    bounded immutable currentness checks on fixed allowlisted refs and authenticated
    upstream context; caller-chosen fixture or Git history alone yields CONDITIONAL_CONTENT_ONLY/UNKNOWN.
    No new trust root is manufactured by metadata.
  - Preserve transport idempotent replay/CAS/ref protection, historical decoder continuity,
    existing recovery publication and correction behavior. Conflicting/detached/swapped/stale/torn
    RUN, candidate, EVIDENCE, raw hash, reviewer or main pins must fail closed and
    keep original failure grounds.
  - Do not claim atomic currentness or ABA safety from before/after Git reads, terminal
    provenance as preterminal C1/C2, review as Runtime issuance, RESULT as REVIEW
    PASS, or digest as executable authorization. All activation, continuation, acceptance
    discharge, proof-reuse and scheduler flags stay false with NOT_ACTIVATED.
  - Existing RuntimeVerification and RuntimeCompletion verification ordering and one
    terminal artifact per RUN remain unchanged in effect; an inability to safely create/persist
    the new bounded provenance cannot generate a forged canonical RESULT or mask the
    original verification/transport cause.
  - Changes limited to the five exact scope.modify paths; where an authoritative producer
    cannot be safely realized without changing admission/transport trust policy outside
    scope, preserve a typed implementation blocker and request separate bounded authority
    revision instead of passing with an availability-only shell.
  - New focused tests include real owned Runtime issuance path and forged outsider
    negatives, exact admitted identity, raw safe metadata vs no public raw bytes,
    target/source integrity, independent Reviewer absence/presence, stale/conflicting
    refs, replay/idempotence, preterminal absence, no permissions and preservation
    of legacy transport paths. Tests use safe disposable repos and never send raw
    to live GitHub.
  - Use current policy minimum-sufficient-v2 and precisely bounded target test; Runtime
    solely produces verification EVIDENCE and Reviewer consumes it independently after
    a terminal RESULT.
acceptance:
- id: AC1
  condition: A versioned additive Runtime-source issuance contract and bounded producer
    are implemented at existing admitted Runtime completion/transport authority, with
    a clear independent origin boundary instead of arbitrary repository-derived issuer
    assertions.
- id: AC2
  condition: For a legitimately admitted successful terminal source, emitted read-only
    metadata binds exact TASK/revision/blob, RUN/base/subject/candidate/tree, RESULT/EVIDENCE/original
    raw identity, digest/size and source version without altering canonical evidence
    or inventing acceptance PASS.
- id: AC3
  condition: No raw verification payload or credentials are transported to public
    GitHub; only bounded safe metadata and cryptographic raw digest/availability are
    exposed, with protected local raw and explicit UNKNOWN/BLOCK when source cannot
    be independently retrieved and compared.
- id: AC4
  condition: A separate read-only consumer can correlate an existing independently
    submitted canonical REVIEW/decision to the exact Runtime-issued terminal source
    and current main/ref facts only when such distinct source is truly present; missing/unreviewed/stale/forged
    decisions never become Reviewer PASS.
- id: AC5
  condition: The producer and consumer refuse spoofed Runtime instances, caller-selected
    trust roots/refs, torn/synthetic source records, swapped TASK/RUN/result/evidence
    or raw digests, ambiguous review history and conflicting transport replay; all
    unsupported or unauthorized cases fail closed with typed reasons.
- id: AC6
  condition: Existing primary/remediation/repair terminal lifecycle, verification,
    cleanup, publication and transport ordering remain correct, idempotent and bounded;
    new provenance is subordinate metadata rather than new RUN/RESULT/REVIEW/lifecycle
    truth, and historic unissued sources remain historically UNKNOWN.
- id: AC7
  condition: A focused deterministic test suite covers authentic issuance, safe raw
    digest capture, protected raw nonexport, independent Reviewer delayed arrival,
    exact source/currentness, adversarial forgery, conflict and replay, missing sources,
    legacy compatibility and disabled effect flags without live network or full-suite
    repetition.
- id: AC8
  condition: Versioned documentation identifies the exact Runtime and independent
    Reviewer authority boundaries, public-repository privacy constraint, compatibility
    and future gates (TASK-333 lawful REPAIR, live preterminal, CAS/ABA, VP01/02/03/04/05/07,
    KA-01), and the delta modifies only the five authorized paths.
