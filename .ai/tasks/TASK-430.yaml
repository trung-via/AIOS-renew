task_id: TASK-430
revision: 2
goal: Implement and activate prospective project-wide General Self-Repair Governance
  Alignment v0.3 across the existing Project Contract, KA-01 normative contract and
  their necessary first-party Runtime consumers. Express general failure-state and
  authority predicates, not TASK-specific triggers; keep ordinary evidence ownership
  and exact Human exceptional recovery distinct, and remove the universal numerical
  decrease-of-failed-identities bottleneck for eligible same-RUN corrections without
  weakening mandatory proof. Resolve the newly scoped native Codex installed-original-process/session
  continuity failure only where authenticated diagnosis establishes a first-party
  transport defect; retain live original process, feedback and checkpoint continuity
  without bypassing independent proof.
problem: "The Human-approved project-wide v0.3 audit at canonical main 6320e0b833abad54fe379bbaa405e0f76bbef6e6\
  \ found that subordinate ordinary activation/publication and protected-source KA-01\
  \ wording can be read as vetoing Constitution \xA72.1 self-repair exceptions; pre-RUN\
  \ infrastructure inability, admitted RUN failure and diagnostic insufficiency are\
  \ conflated; current Runtime._interactive_checkpoint insists failed-identity set\
  \ strictly shrink even for a legitimate new in-scope candidate whose test phase/collection\
  \ changes; bounded feedback exposes only failed identities. These rules create recurrent\
  \ self-repair deadlocks. Constitution \xA72.1 already independently authorizes explicit\
  \ exact-source Human exceptions. Do not make any specific historical TASK, RUN,\
  \ SHA, model or incident the governing trigger, and do not duplicate the separately\
  \ authored EGDF checkpoint diagnostic implementation work. After this r1 external\
  \ candidate, a SHA-bound diagnostic preserved all seven changed paths and identified\
  \ 55 filename-too-long test failures (two impacted synthetic fixtures passed under\
  \ a short test root) plus three installed-native Codex cases stopping with CODEX_LIVE_STOP_ORIGINAL_PROCESS_CONNECTION_SESSION_LOST.\
  \ The exact source-versus-provider cause of native loss is not established. Human\
  \ now expressly requests prospective revision 2 to admit bounded correction of the\
  \ existing codex_live_transport.py owner boundary while retaining TASK-428's independent\
  \ source and historical lineage."
assumptions:
- Human explicitly accepted generalized governance draft v0.3 and authorized its implementation
  now; that is project-wide prospective policy direction, NOT separate exact-source
  Human exception/deployment risk acceptance, Executor/model selection, proof of an
  installed bootstrap or permission to fabricate ordinary RUN/REVIEW/PUBLISH.
- "Existing Constitution \xA72.1 remains authoritative without amendment; immutable\
  \ historical TASK/RUN/RESULT/FAILURE/REVIEW and already admitted KA-01 policies\
  \ retain their original exact meaning. Canonical currentness and source/hash bindings\
  \ must be reauthenticated at execution."
- Ordinary protected Runtime/proof-consumer modification may encounter the pre-RUN
  original-source bootstrap gate. If original trusted capability is missing, report
  a typed pre-RUN refusal rather than rerun a known blocked request. Human may later
  independently authorize a precisely scoped external candidate/deployment; this TASK
  does not itself authorize that exception.
- TASK-426 r2 separately owns the EGDF v1 checkpoint diagnostic delivery capability.
  This governance change defines general eligibility/accessibility and avoids a parallel
  diagnostic service, separate verifier or duplicated EGDF implementation. Existing
  native work on TASK-428 and observer TASK-429 remains distinct.
- One admitted Executor owns HOW, with existing Runtime as canonical verifier and
  independent Reviewer/Publisher gates; the task itself is model/provider neutral.
- Human 2026-10-27 explicitly chooses TASK-430 revision 2 to add narrow native Codex
  process/session-loss diagnosis and source correction where proven. The already collected
  external candidate diff SHA-256 5aa1e047089687ab2d2f2cf174851fd2a1247dd6d73f47bbf2def3f2cff14f27
  is continuity input, not a canonical commit, RUN, PASS or unconditional permission
  to publish.
- TASK-428 revision 5 and its unmerged earlier external PR remain separate pending
  implementation/lineage; this r2 owns only a prospectively scoped cause of the observed
  installed-native loss in its own candidate, with no concurrent Executor mutation
  of this r2 worktree and no implicit adoption, replay or overwriting of TASK-428
  source. TASK-429 original-observer isolation ownership remains separate.
- The three native connection-stop test outcomes and the 55 Windows long-path test
  failures are independent categories. A real provider exit, cancellation, network
  failure or unavailable native session may be legitimate STOP, not a correctable
  first-party bug. The Executor must report evidence and precise BLOCKER if a first-party
  source defect cannot be established within scope.
