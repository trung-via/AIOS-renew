non_goals:
- No Constitution amendment, frozen Kernel retroactivity, historical source/lineage
  rewrite or new standing Human override. No specific TASK/RUN/model/SHA/date as a
  normative policy activation predicate; retain such names only in clearly historical
  non-normative sections.
- No new Runtime, Reviewer, Publisher, rescue controller, Planner, database, lifecycle
  router, hidden failover, automated External Executor dispatch or automatic re-admission/retry
  after STOP.
- No independent EGDF v1, second verifier, diagnostic data store, TASK-426 checkpoint
  capability, TASK-428 FIFO/schema/native output-policy import, or TASK-429 unrelated
  nested observer feature. Protected original observer and proof authenticity stay
  binding, although the existing authorized verifier's Python invocation/coherence
  boundary may be corrected within its new exact scope. No automatic adoption of TASK-428
  candidate/lineage.
- No default-on policy to bypass original family admission, original-source runtime/proof
  identity, actual selected executor/lease, authenticated source/hash, Git CAS, authorized
  scope, original trust and finite budgets.
- No fabricated PASS from external/local tests, false Reviewer PASS, ordinary Publisher
  eligibility, bypass on mere Human phrase 'fix it', automatic roadmap progression
  or downstream adoption.
- No full pytest suite or shadow/pilot/evaluation gating added to activation.
- No blanket reconnect, model/provider failover, new native session to replace a lost
  admitted one, fabricated process liveness, suppression of real EOF/deadline/close/crash,
  test skip/xfail, altered assertions, weakened original proof or programmatic retry
  until PASS. Windows temporary-directory shortening remains test invocation hygiene,
  not a production transport feature.
- No manipulation of expected or observed toolchain fields after execution; no replacement
  of originally bound identity with untrusted observations; no removal of strict executable,
  installed-distribution, worker/collection, original-source or source-digest checks.
  No fixture-only PATH hack masquerading as a verified production fix, arbitrary Python
  HOME/PATH override or global verifier replacement.
constraints:
  hard:
  - "Implement v0.3 project-wide normative clauses in Project Contract \xA72, \xA7\
    7, \xA78, \xA711-12 and KA-01 C.3, C.4, D.1.1/D.1.2/D.1.3/D.4 consistently; keep\
    \ Constitution \xA72.1 unchanged. Distinguish normal verified delivery from exact\
    \ per-candidate Human exception. Preserve ordinary Reviewer and Publisher separation."
  - Use general functional/failure-state predicates. Clearly separate pre-RUN refusal
    (run_created=false, no RUN/FAILURE/REPAIR), admitted RUN STOP/terminal, and Reviewer
    CHANGES_REQUIRED. Do not auto retry unchanged blockers or translate carrier/dispatch
    into canonical execution.
  - For newly admitted eligible KA-01 default same-RUN coding episodes, a genuinely
    new committed clean scoped descendant with source-authenticated complete stable
    proof must not be rejected solely because failed-identity cardinality/set is not
    a strict subset after a causal test-phase/collection change. Keep a bounded verifiable
    factual progress basis using existing authenticated candidate/proof/source material,
    not an unimplementable deterministic semantic root-cause judge. Identical/empty/unrelated
    deltas, forged/incomplete/unstable evidence, unknown continuation authority, lease
    loss and exhausted budget still STOP; final proof must satisfy all authorized
    requirements.
  - Preserve the eligible FAIL prerequisite for correction. ERROR/UNKNOWN/UNAVAILABLE
    are diagnostic outcomes, not continuation permission/PASS. Feedback and future
    authorized progressive evidence reads preserve exact scope/session/lease/checkpoint/currentness,
    privacy/secret filtering and untrusted-log boundary; no arbitrary aggregate diagnostic
    ceiling may be interpreted as a governance limit. Avoid duplicate EGDF implementation
    in this task.
  - Changing KA-01 normative bytes must update the canonical source/digest consumer
    in first-party KA-01 admission coherently, keeping historical version pins and
    already admitted modes decodable. Do not make the current document unsourceable
    to installed original Runtime without a truthful bootstrap/activation boundary.
    Original proof validators and running control must remain outside the editable
    candidate while being verified.
  - Keep original limits 2 corrections, 3 checkpoints, 240-minute RUN wall, 180-minute
    cumulative verification within RUN, null token cap, exact separate Human per-field
    overrides; no automatic limit reset or new RUN to gain budget. Exact Human extraordinary
    deployment outside an admitted RUN must not fake KA-01 accounting.
  - Implementation and ordinary production activation form one deliverable under the
    existing eligible original Runtime verification, independent review and Publisher
    gates; an unavailable current bootstrap remains a reported BLOCKER, not permission
    to self-verify or a reason to create an additional activation task.
  - Executor claims implementation properties only. Runtime performs only the authored
    focused commands once, tracks raw evidence and exact source identity. Tests include
    positive and adversarial cases for non-monotonic test failures, malformed/stale
    proof, unchanged candidate, separate pre-admission refusal and Human exceptional
    labels (without automating bypass), normative SHA drift and historical compatibility.
  - Where a first-party native transport defect is independently established, correct
    only the existing transport boundary within authorized files. Preserve lossless
    bounded FIFO, original process/thread and session identity, lease, feedback, deadline
    and STOP. Keep TASK-428's FIFO/schema and TASK-429's unrelated observer implementation
    separate; do not relax proof ownership or change proof helpers outside the exact
    new allowlist.
  - Where a first-party defect is established, correct only the existing native transport
    session/process boundary within authorized files. Preserve lossless bounded FIFO/backpressure,
    original process/thread ownership, actual live session, deadline, feedback receipt,
    immutable source/lease/executor binding, legacy v3/default compatibility and terminal
    STOP rules. Do not duplicate TASK-428's pending FIFO/schema repair or modify verifier/observer
    proof helpers outside scope.
  - Use a short, independently isolated Windows pytest/temp root when diagnosing known
    MAX_PATH fixture failures; preserve recorded 55 external failures as external
    evidence rather than relabel them PASS. Reuse already grounded narrow passing
    evidence unless changed source invalidates it. Never use a path workaround to
    mask genuine native process death.
  - Add source-focused positive and negative transport regressions for the established
    mechanism in tests/test_codex_adapter.py and, if pertinent, existing installed-native
    tests. Exercise provider EOF, broken pipe, reader backpressure, deadline, real
    process death and wrong session/owner without manufacturing model compliance or
    fake checkpoint success. Author minimum-sufficient verification of impacted code
    plus the two previously required groups; live failure remains a BLOCKER if it
    persists.
  - The verifier's toolchain before the candidate checkpoint and original pytest observation
    must be grounded in the same truthful interpreter/distribution-inventory semantics
    for the invoked command. Reconcile ordinary interactive (including bare python/PATH)
    and protected original-source -I startup without hiding environmental drift. If
    the actual Python environment changes between sampling and execution, validation
    continues to fail closed; no post-execution rebinding or synthesized equivalence
    is permitted.
  - Preserve the actual authenticated original observer and candidate isolation, -I
    original protected source, per-subject original helper identities, worker population
    and exact authored commands. A genuine expected C1 pytest exit=1 can produce factual
    F1 only after the observation's complete stable phases, subject, toolchain and
    collection prove valid; do not equate failure with PASS or falsify C1/F1/C2.
  - No modifications to src/aios_renew/parallel_verification.py, src/aios_renew/verification_contract.py,
    tests/bp_v4_probe_plugin.py, tests/conftest.py, tests/test_ka01_original_observer_isolation.py,
    .ai/tasks/TASK-430.yaml, or any other path beyond the ten explicit modify paths.
    Existing tests/test_ka01_v13_intra_run_native.py and tests/test_ka01_v13_activation.py
    may carry new scoped regression; the existing original-observer isolation suite
    is required as an unchanged consumer test.
  - Regression must cover equivalent interpreter/package inventory in a controlled
    ordinary launcher and protected original-source launcher, and negative drift or
    substitution (e.g., PATH points at a different Python or installed distributions
    differ) refusing authenticated proof. Preserve no_user_site/non-isolated and isolated
    -I behavior; do not retrofit skip/xfail or assert a live provider completed F1/C2
    from deterministic fixtures.
acceptance:
- id: AC1
  condition: "Project Contract contains prospective, general, consistent ordinary-versus-exception\
    \ clauses aligned with Constitution \xA72.1, without TASK-specific applicability\
    \ or blanket gate bypass."
- id: AC2
  condition: Project Contract distinguishes pre-RUN refusal, terminal admitted RUN
    failure and independent semantic REVIEW findings and specifies read-only authenticated
    diagnostic visibility without promoting untrusted evidence to instruction authority.
- id: AC3
  condition: KA-01 C.3/C.4 and prospective default-mode sections explicitly preserve
    complete stable FAIL eligibility, source/session/lease/scope/budget and truthful
    terminal protection while removing the unconditional strict numerical/set decrease
    of failed identities as the sole progress test.
- id: AC4
  condition: First-party original Runtime continuation/checkpoint logic implements
    the revised bounded factual candidate-progress condition for newly admitted eligible
    default-mode corrections and rejects unchanged, out-of-scope, forged, incomplete
    or stale changes without semantic repair selection or extra verification.
- id: AC5
  condition: "The functional protected-source self-upgrade contract describes ordinary\
    \ independent original-source proof versus source-scoped Human extraordinary recovery\
    \ as general rules, with task-specific historical notes explicitly non-normative;\
    \ ordinary STOP does not veto Constitution \xA72.1."
- id: AC6
  condition: The current KA-01 normative-byte digest/source authentication and historical
    admission decoders are coherent with revised policy text; source drift, false
    original-module identity, unverified self-adoption and invalid CAS retain fail-closed
    behavior.
- id: AC7
  condition: Focused regression cases cover stable complete FAIL with changed test
    population/non-monotone failed set and lawful new in-scope candidate, alongside
    negative identity, unchanged candidate, partial/ERROR/UNKNOWN, budget, source
    and multi-operation cases.
- id: AC8
  condition: Feedback/diagnostic policy permits bounded authenticated progressive
    factual inspection when available without aggregate arbitrary ceiling or additional
    verifier, and explicitly leaves separately authored EGDF capability inactive until
    separately lawfully implemented, with no unauthorized new mechanism.
- id: AC9
  condition: The complete task deliverable stays confined to exactly ten declared
    governance/KA-01/Runtime/verifier/native-transport/test modify paths; preserves
    TASK-428/TASK-429 independent histories, existing verifier authority and scope-gated
    source isolation; contains no invented RUN/PASS/REVIEW/PUBLISH/exception claim.
- id: AC10
  condition: Native Codex transport remains lossless and bound to authentic original
    process, thread, connection and session under expected liveness; an independently
    demonstrated transport defect is corrected only when established, while true provider/environment
    failure continues to STOP. No assertion that a provider/environment issue has
    been fixed merely because initialization passed.
- id: AC11
  condition: Existing and scoped Codex native regressions preserve positive process/session
    continuity and negative liveness, identity, EOF, deadline, cancellation and malformed
    output rules, without skips, synthetic live success, cross-TASK patch import or
    concealed failure.
- id: AC12
  condition: For ordinary and protected original-source interactive checkpoint verification,
    the first-party verifier binds an interpreter and installed-distribution inventory
    equivalent to the real pytest execution toolchain when conditions are unchanged;
    it does not silently invoke a different PATH interpreter from the pre-bound original,
    and independently rejects interpreter or distribution drift with a truthful invalid/unavailable
    observation.
- id: AC13
  condition: Focused deterministic regression in the authorized test files establishes
    faithful Python interpreter/package identity for ordinary and protected original-source
    checkpoint execution and fail-closed negative mismatch, while retaining exact
    original observer, committed candidate, scoped source, workers, collection, complete
    C1 FAIL and subsequent factual F1/C2 eligibility; no missing native PASS is inferred.
