task_id: TASK-122
revision: 1

goal: >
  Close the native terminal-response loss gap for admitted AIOS execution by adding one
  bounded REPAIR action, FINALIZE_CANDIDATE, that lets exactly one selected Executor inspect
  an exact clean failed candidate without repository mutation and return the missing
  structural ResultPackage so Runtime can perform its existing completion gates and canonical
  verification. Preserve bounded native failure diagnostics for ordinary provider/CLI errors
  so Brain can distinguish implementation failure from completion-signal loss using canonical
  evidence rather than chat memory or repeated execution.

problem: >
  TASK-121 exposed a generic reliability gap after useful implementation already existed.
  RUN-121-003 and RUN-121-004 both failed during native Antigravity execution with provider
  503 capacity errors while the exact TASK-121 implementation candidate remained clean,
  transportable, in-scope, and committed at c3d822c147e52bb85f2786d03f113fc78b8f8e67.
  RUN-121-004 executed for about 517 seconds and consumed substantial model tokens but Runtime
  received no structural ResultPackage and therefore never entered canonical verification.
  Existing REPAIR semantics cannot represent the truthful recovery: NO_CHANGE is a zero-
  Executor reusable-candidate path that requires an already-captured pre-verification package,
  while CONTINUE_IMPLEMENTATION requires a new committed mutation and must fail on an unchanged
  failed head. Re-running CONTINUE_IMPLEMENTATION would therefore either demand fake mutation or
  repeat expensive work even when the candidate is already complete. Runtime also persists
  native stdout/stderr diagnostics only for timeout/interrupt paths, so ordinary provider
  errors such as 503 lose bounded forensic context that may show how far the Executor reached.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    10ba4d24129ce456f228b910fe1b8d72252799cc and its repository tree is equivalent to
    TASK-121 revision-2 authoring state at 950c8766d883f2f318e18ce683103f8c74bc01fb.
  - >
    TASK-121 revision 2 is canonically authored but not complete or published. Its current
    implementation candidate is c3d822c147e52bb85f2786d03f113fc78b8f8e67.
  - >
    Canonical RUN-121-004 FAILURE binds TASK-121 revision 2, executor antigravity,
    base_sha and failed_head_sha c3d822c147e52bb85f2786d03f113fc78b8f8e67,
    phase EXECUTION, continuation_of RUN-121-003, candidate changed_files=[], dirty=false,
    descends_from_base=true, outside_task_scope=[], repairable=true, transportable=true,
    and AntigravityExecutionError with provider UNAVAILABLE 503.
  - >
    RUN-121-004 observation records one admitted REPAIR Executor invocation of roughly
    517 seconds, no Runtime verification, terminal FAILURE, and non-zero token usage.
  - >
    TASK-057, TASK-058 revision 2, TASK-064, TASK-075, TASK-076, TASK-077, TASK-089,
    TASK-092, TASK-111, and current correction/publication contracts remain authoritative
    unless this TASK explicitly narrows or extends the REPAIR action vocabulary below.
  - >
    Frozen Kernel v0.1 remains FROZEN. Brain owns semantic correction choice, Executor owns
    implementation/completion claims, Runtime owns deterministic completion and verification,
    and Reviewer owns semantic judgment.

