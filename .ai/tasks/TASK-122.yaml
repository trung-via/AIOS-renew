non_goals:
  - Complete, review, publish, or otherwise resolve TASK-121 inside TASK-122 implementation.
  - Reclassify RUN-121-003 or RUN-121-004 as PASS, verification success, semantic review, or
    publication success without a canonical ResultPackage and Runtime verification.
  - Make Runtime infer FINALIZE_CANDIDATE from provider error prose, duration, token usage,
    filenames, model output, or external state; Brain/Human authors the semantic repair action.
  - Turn FINALIZE_CANDIDATE into automatic retry, provider failover, reroute, fallback, fresh
    PRIMARY, CONTINUE_IMPLEMENTATION alias, CODE_FIX alias, or NO_CHANGE alias.
  - Allow FINALIZE_CANDIDATE to modify repository files, create implementation commits, widen
    TASK/REPAIR scope, change dependency pins, or resume unfinished implementation work.
  - Weaken CONTINUE_IMPLEMENTATION's existing requirement for a real failed-head-relative
    mutation, weaken CODE_FIX semantics, or broaden existing reusable NO_CHANGE eligibility.
  - Let Executor run canonical TASK verification or construct canonical EVIDENCE; Runtime
    remains the sole canonical verification/evidence owner.
  - Add schedulers, queues, watchers, retry loops, generic lifecycle routers, extra agents, or
    autonomous correction authoring.
  - Change downstream repositories or assume any downstream repository uses current AIOS-renew.
  - Capture unbounded native logs, handoff payloads, credentials, cookies, tokens, or secrets.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Extend the existing REPAIR action vocabulary with exactly one action named
      FINALIZE_CANDIDATE. It remains inside the existing REPAIR lineage, refs, correction
      preflight, Unified State next_action EXECUTE_REPAIR, Human Surface, dispatcher, Runtime,
      review, and publication model; do not create a new lifecycle family or next_action enum.
    - >
      FINALIZE_CANDIDATE means only: an exact admitted pre-verification failed RUN has a clean,
      committed, repairable, transportable candidate that Brain/Human judges may already
      contain the complete authorized TASK implementation, but Runtime lacks the Executor's
      structural ResultPackage because native completion signaling failed. The action is a
      semantic authorization, not an inference made from error text.
    - >
      Admission must preserve the exact failed RUN, TASK revision, failed_head_sha,
      root_base_sha, continuation_of lineage, repair selector SHA, duplicate-continuation
      protection, current-versus-historical subject identity, original TASK scope, and all
      ordinary repository safety gates. It must not substitute current main, a nearby RUN,
      another candidate, or a fresh PRIMARY base.
    - >
      FINALIZE_CANDIDATE requires exactly one explicit selected coding-capable Executor but
      grants authorizes_mutation=false. The Executor may inspect the supplied exact candidate
      and bounded TASK/repair context only far enough to produce one structural ResultPackage;
      it must not edit files, commit, push, rerun implementation, or invoke another AIOS
      operation.
    - >
      The final repository HEAD for FINALIZE_CANDIDATE must equal the exact failed_head_sha,
      the worktree must remain clean, and the action must fail closed if the Executor or any
      local step mutates repository state. Runtime must still derive and validate canonical
      TASK changed_files from the original root_base_sha to that unchanged candidate and must
      require complete acceptance coverage before verification.
    - >
      A structurally complete FINALIZE_CANDIDATE package proceeds through the existing Runtime
      completion boundary and original TASK verification list exactly once. Runtime constructs
      canonical EVIDENCE bound to the unchanged candidate SHA and produces ordinary RESULT or
      FAILURE artifacts. No verification reuse is claimed merely because the candidate is
      unchanged unless existing evidence-reuse rules independently authorize it.
    - >
      If the selected Executor determines the candidate is incomplete, returns unresolved
      work, cannot cover all TASK acceptance criteria, returns invalid structural output, or
      encounters another native/provider failure, terminalize that admitted REPAIR normally.
      Do not retry, reroute, fall back, silently convert the action, or fabricate completion.
    - >
      Existing actions remain distinct: CODE_FIX is Executor-backed mutation for an established
      defect; CONTINUE_IMPLEMENTATION is Executor-backed mutation for unfinished original TASK
      work; NO_CHANGE remains the existing zero-Executor reusable-candidate continuation;
      FINALIZE_CANDIDATE is Executor-backed zero-mutation recovery of a missing structural
      completion signal. Tests and documentation must make these distinctions explicit.
    - >
      Correction Preflight and Unified Human Surface must report FINALIZE_CANDIDATE as
      executor_required=true and preserve exact correction selectors. Unified State continues
      to use AUTHOR_REPAIR/EXECUTE_REPAIR and must not gain a new semantic planner role.
    - >
      Codex and Antigravity REPAIR native instructions must express semantically equivalent
      FINALIZE_CANDIDATE behavior: inspect exact candidate, produce structural ResultPackage,
      no repository mutation, no canonical verification/EVIDENCE, no fresh PRIMARY, no retry,
      no reroute, and no recursive AIOS launch.
    - >
      Native execution FAILURE persistence must retain bounded stdout/stderr diagnostics when
      available for ordinary Codex/Antigravity execution errors, including non-timeout
      provider/CLI failures. Diagnostics must record availability and truncation deterministically,
      remain bounded by the existing diagnostic limit or a no-larger equivalent bound, and must
      not include newly captured handoff payloads or credentials.
    - >
      FINALIZE_CANDIDATE authoring, dispatch, completion, review, and publication must remain
      compatible with current Brain Ingress and safe-publication continuation. Publication may
      occur only after ordinary semantic PASS of the candidate produced by this recovery path.
    - >
      Deterministic offline regressions must prove the RUN-121-004-equivalent topology without
      network/model dependency: exact unchanged failed candidate, one Executor invocation,
      zero mutation, structural package recovery, one Runtime verification pass, canonical
      evidence binding, and no retry/reroute.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The canonical REPAIR contract accepts exactly one new action FINALIZE_CANDIDATE for an
      exact clean repairable pre-verification failed candidate and preserves all failed RUN,
      TASK revision, failed_head_sha, root_base_sha, continuation, correction selector, scope,
      duplicate-continuation, and repository-safety bindings.
  - id: AC2
    condition: >
      FINALIZE_CANDIDATE requires one explicit Executor, invokes it at most once with mutation
      disabled, supplies the exact failed candidate, and fails closed on any HEAD/worktree
      mutation; final HEAD remains exactly failed_head_sha.
  - id: AC3
    condition: >
      A valid Executor structural ResultPackage from FINALIZE_CANDIDATE is checked for complete
      TASK acceptance coverage and root-base-relative changed-files truth, then reaches the
      existing Runtime verification boundary exactly once and produces canonical EVIDENCE bound
      to the unchanged candidate SHA.
  - id: AC4
    condition: >
      An incomplete, unresolved, invalid-output, mutated, or provider-failed
      FINALIZE_CANDIDATE terminalizes as ordinary FAILURE with no retry, reroute, fallback,
      fresh PRIMARY, action conversion, or fabricated completion.
  - id: AC5
    condition: >
      Existing CODE_FIX, CONTINUE_IMPLEMENTATION, and NO_CHANGE semantics remain unchanged and
      deterministic regressions prove FINALIZE_CANDIDATE is neither mutation-authorizing nor
      reusable-package Executor elision.
  - id: AC6
    condition: >
      Correction Preflight, Unified State, Unified Human Surface, dedicated REPAIR dispatch,
      Brain Ingress repair authorization, and publication validation all preserve the new action
      through the existing REPAIR family with executor_required=true and no new next_action or
      lifecycle family.
  - id: AC7
    condition: >
      Codex and Antigravity native REPAIR adapter regressions prove semantically equivalent
      FINALIZE_CANDIDATE instructions and one structural-output invocation with no canonical
      verification, EVIDENCE construction, mutation, retry, reroute, or recursive AIOS launch.
  - id: AC8
    condition: >
      Runtime FAILURE regressions prove bounded stdout/stderr diagnostics are preserved when
      available for ordinary native provider/CLI errors such as 503, with deterministic
      unavailable/empty/captured/truncated states and without unbounded payload capture.
  - id: AC9
    condition: >
      A deterministic RUN-121-004-equivalent end-to-end operator regression starts from an exact
      unchanged clean failed candidate with no reusable pre-verification package, executes one
      FINALIZE_CANDIDATE Executor handoff, recovers a complete structural ResultPackage without
      repository mutation, performs canonical verification once, and reaches an ordinary
      reviewable RESULT.
  - id: AC10
    condition: >
      Focused regression verification and git diff checking pass with zero unresolved items and
      no production mutation outside the explicitly authorized files.

