task_id: TASK-162
revision: 1

goal: >
  Implement Execution Profile Foundation v1 as an additive, executor-neutral
  operational layer that centralizes the current deterministic Codex and
  Antigravity model/effort defaults in one repository-owned policy, resolves and
  validates exact immutable execution profiles, binds and persists the exact
  profile before every profile-managed native PRIMARY, REMEDIATION, or REPAIR
  invocation, transports that provenance with canonical terminal artifacts, and
  injects the exact resolved values into the selected native adapter. Preserve
  current production defaults and Human/remote selection behavior until TASK-163,
  while making future compatible default-model changes require policy change plus
  focused validation/smoke rather than adapter, Dispatcher, RUN, carrier, or
  lifecycle redesign.

problem: >
  TASK-061 made native model selection deterministic by hard-coding
  gpt-5.6-sol/high in the Codex adapter and gemini-3.8-flash/high in the
  Antigravity adapter. That solved ambient-machine drift but made adapters own
  default-selection policy, left canonical RUN identity unable to attribute the
  exact native model/effort actually requested, and would force repeated source
  redesign as compatible model generations evolve. The Human has now authorized
  the execution-profile-selection-v1 side-track: TASK-162 must build the
  deterministic profile/provenance foundation without yet exposing Human
  per-execution overrides or activating the new GPT-6 Sol Medium / Gemini 3.8
  Flash Medium defaults. Exact profile provenance must survive terminal transport,
  not exist only on one self-host filesystem, while frozen TASK/RUN semantics and
  all execution, verification, review, and publication authorities remain intact.

assumptions:
  - >
    Canonical main at TASK-162 authoring is
    620fc014edb746bc3f394595d556242db9327bfc and the unique canonical NEXT
    roadmap item is execution-profile-foundation-v1 bound to TASK-162 revision 1.
  - >
    docs/AIOS-EXECUTION-PROFILE-SELECTION.md is the Human-approved planning
    baseline for this temporary side-track. TASK-163 owns Human-facing exact
    model/effort selection, versioned carrier/dispatch binding, and activation of
    Codex gpt-6-sol/medium plus Antigravity gemini-3.8-flash/medium defaults.
  - >
    TASK-061 historical lineage remains immutable and defines the production
    compatibility baseline entering this TASK: Codex gpt-5.6-sol/high and
    Antigravity gemini-3.8-flash/high, with unavailable native models failing
    through the existing no-retry/no-fallback execution path.
  - >
    Canonical RUN v0.1 stores Executor identity but intentionally does not store
    model/effort metadata. Additive subordinate operational provenance is therefore
    required rather than changing frozen RUN, RunLease, or ExecutorBoundary schemas.
  - >
    Existing terminal transport already publishes immutable RUN, RESULT/FAILURE,
    optional REPAIR lineage, and observation facts under canonical artifact refs.
    Execution-profile provenance can remain a separate optional transport artifact
    so historical terminals without it remain valid and readable.
  - >
    Antigravity MiniMax is a distinct supported Executor and is outside this
    profile-foundation change. Its MiniMax-M3 selection semantics remain unchanged.
  - >
    Runtime owns canonical verification and EVIDENCE; Reviewer owns semantic
    verdict; Publisher owns publication; Human owns explicit provider/model
    selection authority. This TASK creates no new routing or semantic authority.

