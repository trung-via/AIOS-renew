non_goals:
  - >
    Activate gpt-6-sol/medium or any other new production default; TASK-162 must
    preserve the TASK-061 gpt-5.6-sol/high and gemini-3.8-flash/high defaults.
  - >
    Add Human-facing --model/--effort arguments, change aios run/continue/remediate/
    repair syntax, or modify GitHub PRIMARY, REMEDIATION, REPAIR carrier/workflow
    request schemas or dispatch journals. Those changes belong to TASK-163.
  - >
    Add automatic model routing, model scoring, task-difficulty classification,
    adaptive effort selection, fallback, retry, failover, executor substitution,
    or speculative/multi-model execution.
  - >
    Globally allowlist provider model identifiers or require source-code changes
    merely because a compatible future model identifier is new.
  - >
    Change Antigravity MiniMax model selection, adoption, native command behavior,
    or profile semantics.
  - >
    Change canonical TASK schema, frozen RUN schema, RunLease, ExecutorBoundary,
    mutation/sandbox authority, Runtime verification, RESULT/EVIDENCE truth,
    Reviewer verdict semantics, Publisher authority, or roadmap advancement.
  - >
    Reinterpret, backfill, migrate, or invalidate historical TASK/RUN/RESULT/
    FAILURE/REVIEW/REMEDIATION/REPAIR or transport artifacts that predate execution
    profiles.
  - >
    Require a real network/provider smoke or account entitlement as canonical
    TASK-162 verification; TASK-163 owns real end-to-end activation proof.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Establish exactly one repository-owned execution-profile policy authority for
      the managed Codex and Antigravity defaults. Adapter-owned duplicated default
      model/effort policy is forbidden. The policy must preserve gpt-5.6-sol/high
      for Codex and gemini-3.8-flash/high for Antigravity throughout TASK-162.
    - >
      Model identifiers are opaque provider-native identifiers subject only to
      bounded deterministic syntax/size validation. Do not introduce a repository-
      global model allowlist. A syntactically valid synthetic future model identifier
      must be able to flow through profile validation and exact native command
      construction without adding that identifier to source code.
    - >
      Reasoning/effort capability validation must be deterministic and
      repository-owned for each managed Executor. Invalid effort values must fail
      before native invocation. Capability validation must not score, rank, choose,
      downgrade, or substitute a model or effort.
    - >
      A resolved execution profile must bind at minimum exact run_id, executor,
      model, reasoning_effort, and deterministic source attribution for model and
      effort. The profile must be immutable once bound to one admitted native
      execution authorization.
    - >
      For canonical Operator paths using Codex or Antigravity, resolve/validate the
      profile before native invocation, persist an immutable profile sidecar only
      after exact RUN identity exists, and guarantee that the sidecar is durably
      present before the native runner is entered. Failure to validate or persist
      the profile must invoke zero native Executors.
    - >
      Re-persisting an identical bound profile for the same RUN may be idempotent;
      conflicting executor/model/effort/source content for an existing RUN profile
      must fail closed before invocation. A later repository default change must
      never alter an already-bound RUN profile.
    - >
      Dispatcher selection remains exactly-one and executor-neutral. For managed
      Executors it must require consistency among selected Executor, RUN.executor,
      and profile.executor, then inject the exact bound profile into the native
      adapter. It must not inspect TASK difficulty, cost, benchmark history, or
      choose another profile.
    - >
      Codex and Antigravity PRIMARY, REMEDIATION, and REPAIR command construction
      must consume the same exact bound profile values. Preserve all existing
      schema-output, timeout, sandbox/mutation, direct-execution instruction,
      structural ResultPackage, and no-retry/no-fallback semantics.
    - >
      Direct repository smoke utilities may be adjusted only as needed to consume
      the single repository-owned default policy rather than relying on adapter-
      owned defaults. They must remain isolated utility surfaces and must not become
      a second profile authority or canonical TASK-162 network verification path.
    - >
      Profile provenance must survive both RESULT and FAILURE terminal transport as
      a separate immutable execution-profile artifact associated with the exact RUN.
      Existing transport idempotency/conflict checks must include the profile when
      one is expected. Historical terminal artifacts without a profile remain valid
      and must not be reinterpreted or rejected.
    - >
      Do not fabricate an execution profile for pre-RUN admission failures,
      direct-candidate acceptance, reusable-package paths, verification-only
      recovery, or any flow that does not actually authorize a new managed native
      Executor invocation. If a native invocation begins and later fails, its exact
      persisted profile provenance must remain available.
    - >
      Future compatible default-model evolution is a required architectural
      invariant: when an already-supported Executor keeps the same native model/
      effort invocation contract, changing its default model must require only
      repository-owned profile-policy change plus focused validation/smoke, not
      adapter, Dispatcher, frozen RUN, carrier, or lifecycle redesign.
    - >
      Do not modify files outside scope.modify and do not push or publish from
      Executor implementation.

acceptance:
  - id: AC1
    condition: >
      One strict repository-owned execution-profile policy and one provider-neutral
      profile contract/resolver exist for Codex and Antigravity, preserve the exact
      TASK-061 defaults, reject malformed policy/profile data, and create no model
      router or semantic authority.
  - id: AC2
    condition: >
      Codex and Antigravity adapters no longer own duplicated default-selection
      policy; exact injected profile model/effort values reach PRIMARY,
      REMEDIATION, and REPAIR native command arguments while existing timeout,
      sandbox/mutation, schema, prompt, and ResultPackage behavior remains unchanged.
  - id: AC3
    condition: >
      Focused regression coverage proves a bounded synthetic future model identifier
      and valid alternate effort can reach exact native command construction without
      adding the model identifier to a global allowlist or changing adapter/
      Dispatcher architecture, while invalid effort fails before native invocation.
  - id: AC4
    condition: >
      Every new canonical Codex/Antigravity native invocation through PRIMARY,
      REMEDIATION, and REPAIR has one exact immutable execution-profile sidecar
      durably persisted before native runner entry; executor/profile mismatch or a
      conflicting pre-existing sidecar invokes zero native Executors.
  - id: AC5
    condition: >
      Identical profile persistence is deterministic/idempotent, a later default
      policy change cannot alter an already-bound RUN profile, and native execution
      failure leaves the exact attempted profile provenance available.
  - id: AC6
    condition: >
      Successful and failed managed RUN terminal artifact refs include the exact
      execution-profile provenance with idempotent content checks, while historical
      terminal artifacts lacking that optional artifact remain readable and valid.
  - id: AC7
    condition: >
      No-native-invocation paths create no misleading execution-profile artifact,
      and Antigravity MiniMax behavior remains unchanged.
  - id: AC8
    condition: >
      TASK-162 leaves Human-facing CLI/continue and PRIMARY/REMEDIATION/REPAIR
      carrier/dispatch selection semantics unchanged and leaves production defaults
      at Codex gpt-5.6-sol/high and Antigravity gemini-3.8-flash/high; TASK-163
      remains the sole activation milestone for new defaults and explicit Human
      overrides.
  - id: AC9
    condition: >
      Frozen TASK/RUN/RunLease/ExecutorBoundary semantics, sandbox/mutation
      authority, Runtime verification/EVIDENCE, Reviewer, Publisher, roadmap, and
      no-retry/no-fallback boundaries remain unchanged, and a future compatible
      default-model update can be expressed as profile-policy change plus focused
      validation/smoke without redesigning those boundaries.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_execution_profile.py tests/test_dispatcher.py tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_review_transport.py
    - python -m pytest -q tests/test_operator.py -k execution_profile
    - git diff --check
