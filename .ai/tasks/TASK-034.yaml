task_id: TASK-034
revision: 1

goal: >
  Make Runtime-owned canonical verification deterministic at the Windows
  output-encoding boundary so verification subprocess stdout/stderr are emitted
  as strict UTF-8 bytes without weakening fail-closed evidence semantics.

problem: >
  A real downstream RUN on Windows completed its executor phase but Runtime
  verification captured pytest output containing Windows-1252 bytes. The
  current Runtime stores raw bytes and then correctly requires strict UTF-8,
  so it raised "verification output is not strict UTF-8" before it could expose
  the underlying nonzero verification result. Runtime must control the Windows
  verification process encoding rather than accepting locale-dependent output.

assumptions:
  - AIOS-renew v0.1.3 at commit 6e2fab2cb1fc32e2002d41f3d21e4019a8844e1a is the immutable released baseline for this repair.
  - Strict UTF-8 decoding of captured verification output remains the canonical evidence boundary.
  - Raw verification artifacts must continue to preserve the exact captured bytes before decoding.
  - The observed downstream product test failure is outside this TASK and must not be repaired here.

scope:
  inspect:
    - src/aios_renew/verification.py
    - tests/test_verification.py
    - src/aios_renew/operator.py
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-v0.1.3-ARCHITECTURE-AMENDMENT.md

  modify:
    - src/aios_renew/verification.py
    - tests/test_verification.py

non_goals:
  - Modify any executor adapter, TASK authoring, review, remediation, publication, Git-binding, or artifact schema behavior.
  - Add a fallback decoder for cp1252, cp850, locale encodings, replacement characters, or lossy transcoding.
  - Rewrite or normalize captured raw verification artifacts after execution.
  - Change canonical verification command text, order, retry behavior, or stop-on-first-failure semantics.
  - Repair any Python Agent or TikTok product implementation failure.
  - Change package version, tags, release metadata, frozen specifications, or downstream worker pins in this TASK.

constraints:
  hard:
    - Keep the implementation limited to the Windows verification subprocess/output-encoding boundary and its regression tests.
    - Preserve strict UTF-8 decoding after stdout/stderr capture; truly invalid UTF-8 bytes must still fail closed.
    - Preserve text=False byte capture and write the exact captured stdout/stderr bytes to the raw evidence artifact before decoding.
    - Preserve the caller environment required to start verification commands; deterministic UTF-8 settings must augment rather than discard the existing environment.
    - On Windows, the effective PowerShell/native-child verification execution environment must emit Unicode stdout/stderr to Runtime as UTF-8 bytes independent of the host locale/code page.
    - Preserve POSIX shell behavior and command invocation semantics unchanged.
    - EvidenceSource.command must remain the original canonical command, not any Windows encoding wrapper used internally by Runtime.
    - Execute each canonical verification command exactly once and preserve fail-fast behavior on the first command failure.
    - Do not modify any file outside scope.modify.
    - Keep the repair executor-neutral and fail closed.

acceptance:
  - id: AC1
    condition: >
      Windows verification execution deterministically configures its subprocess
      boundary so non-ASCII Unicode output from the PowerShell/Python command
      path is captured as valid UTF-8 bytes independent of the Windows locale.

  - id: AC2
    condition: >
      Runtime continues to decode captured stdout/stderr with strict UTF-8 and
      rejects genuinely invalid UTF-8 bytes; no legacy-code-page fallback,
      replacement decoding, or lossy conversion is introduced.

  - id: AC3
    condition: >
      Raw verification evidence still contains the exact captured stdout/stderr
      bytes written before decoding, including when strict UTF-8 validation
      subsequently fails.

  - id: AC4
    condition: >
      Canonical command identity, ordering, exactly-once execution, nonzero
      exit-code evidence, and stop-on-first-failure behavior are unchanged.

  - id: AC5
    condition: >
      POSIX verification shell behavior remains unchanged, while Windows-focused
      regression coverage proves the deterministic UTF-8 configuration without
      requiring changes to executor adapters or canonical TASK commands.

verification:
  required:
    - python -m pytest tests/test_verification.py -q
    - git diff --check
    - git status --porcelain
