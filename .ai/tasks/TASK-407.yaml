non_goals:
- No rewriting, deleting, renaming or rehashing existing ROA-1 R2/R3, AOA-1, TCA-1/2/3,
  historical MOA/V1 profiles, audit requests or immutable TASK/RUN/FAILURE/REVIEW/RESULT
  lineage.
- No ROA R4 live policy cutover in TASK-407, implicit registry-order selection, provider
  self-promotion, MOA reinstatement, remediation audit replacement, second semantic
  reviewer, new database, semantic repair classifier authority, generic lifecycle
  router, retry/failover or Runtime verification ownership.
- No universal pre-REPAIR pytest/full-suite pass and no baseline-equivalent nonzero
  waiver. Bounded diagnostic probes are advisory/noncanonical and require lawful source
  access; Runtime alone verifies the final candidate.
- No lowering canonical privacy, Git/ref integrity, legal modification scope, audit
  return schema, any frozen Kernel contract or Human executor/strategy authority.
- No automatic PTE/Lean VP advancement, downstream adoption, Runtime RUN dispatch,
  Reviewer PASS, Publisher success, profile activation or automatic TASK-408 creation.
constraints:
  hard:
  - Prepare a separate unique versioned ROA successor identity (tentatively roa-1-r4
    v4) in the existing exact portable profile registry; preserve original five ordered
    checks EXACT_FAILURE_BOUNDARY, EVIDENCE_DISCRIMINATING_CAUSE, MATERIAL_REPAIR_LEVER,
    FALSIFYING_CHALLENGE, LAWFUL_READINESS and one REPAIR_OUTCOME_AUDIT closure. One
    CANDIDATE/NO_DECISION, no extra stage or dual audit.
  - First check binds exact RUN/HEAD/TASK revision/FAILURE and reconstructs every
    authored verification.required command into ordered PASS/FAIL/NOT_RUN/UNKNOWN,
    distinguishing original Runtime evidence from private diagnostic. Execution, completion,
    worktree, pre-RUN transport and verification categories must remain distinct,
    never guessed.
  - Cause check binds baseline vs failed candidate vs prospective changed paths, authentic
    current source, bounded test/fixture/API/AST/consumer excerpts where material.
    Differentiate missing claims, unresolved items, native exit, code regression,
    historical fixture drift and unknown; status UNKNOWN blocks unsupported correction.
    Same test node after a fix requires fresh exact cause, not stale traceback.
  - Lever check chooses one minimum lawful semantic strategy CODE_FIX, NO_CHANGE,
    CONTINUE_IMPLEMENTATION, FINALIZE_CANDIDATE, covering all *currently evidenced*
    blockers in the exact authorized TASK scope and distinguishing implementation
    obligations from completion-shape obligations. Do not choose or schedule repairs
    automatically or infer scope from inspection authority.
  - Falsifying check must articulate a counterexample for each evidenced blocker,
    expected correction effect, next unobserved required verification command, baseline
    recheck when decision-relevant and whether additional exposed failure would invalidate
    the candidate. Minimum sufficient probes only where informative, authorized and
    not redundant with valid evidence.
  - Readiness check reconciles original AC1..ACn with truthful ResultPackage claims,
    evidence and unresolved, exact failed/head/candidate source and correction lineage,
    clean/dirty currentness, sticky admitted Executor and original verification policy,
    then returns one bounded closure. Missing decisive evidence/authority => UNKNOWN/BLOCKER/NO_DECISION,
    not unsupported CODE_FIX or fabricated PASS.
  - Registry and provider/protocol conformance must recognize the exact unique ROA
    R4 identity/digest only for isolated ROA_CONFORMANCE/support until later authorized
    cutover; maintain R3 default without fallback or mixing; preserve closed shapes,
    digest binding, currentness between calls, both native response modes and historical
    replay.
  - Record this Human-approved planning priority prospectively at the top of .ai/roadmap-state.yaml
    with unique planning owner ROA_R4_RETROSPECTIVE_SUCCESSOR, exact source main,
    selected STEP1 TASK407 and STEP2 conditional authenticated activation. Preserve
    previous TCA3, PTE and Lean VP records intact as historical; do not make plan
    engineering truth.
  - Preserve current profile registry cap 65536 UTF-8 bytes and current finite profile
    identity policy unless a strictly necessary bounded compatibility change is independently
    evidenced and within original Human risk authority; if this cap makes support
    impossible, report a bounded blocker, not bypass.
  - Executor reports clean committed descendant, exact truthful complete AC1..AC11
    ResultPackage and evidence, unresolved only if truthful. Runtime alone verifies
    original minimum-sufficient-v1 commands, Reviewer owns semantic PASS, Publisher
    exact source inclusion; any future R4 activation still requires distinct authenticated
    canonical authorization.
acceptance:
- id: AC1
  condition: A separate exact recognized ROA-1 R4 v4 REPAIR_AUTHORING profile candidate
    is expressible in the bounded registry, with unique normalized digest, original
    five check IDs and one closure, preserving all historical profile bytes and versions.
- id: AC2
  condition: The prospective R4 failure-boundary check tracks exact immutable RUN/TASK/HEAD/FAILURE
    and ordered verification.required outcomes PASS/FAIL/NOT_RUN/UNKNOWN without mistaking
    pre-RUN transport, Runtime proof, private probes, worktree dirt or missing evidence
    for verified PASS.
- id: AC3
  condition: The candidate discriminating-cause check distinguishes code/test regression,
    baseline/fixture incompatibility, native exit, completion missing claims, completion
    unresolved, final response/ResultPackage errors and unknown using bounded source-backed
    evidence, with no inference of a new root from a repeated node.
- id: AC4
  condition: The repair lever check can present one lawful evidence-supported known-blocker
    frontier, select the smallest eligible existing lever, map modification_scope
    to original TASK scope and preserve all unresolved/unknown material blockers instead
    of forced CODE_FIX or a generic automatic correction selector.
- id: AC5
  condition: The falsification and readiness checks require a concrete correction
    counterexample, identified unobserved verification commands, preserved AC1..ACn
    and truthful complete claims/evidence/unresolved/identity, while retaining Runtime,
    Reviewer, Publisher and Executor authority separation.
- id: AC6
  condition: ROA-1 R4 supports bounded isolated semantic construct/validate/provider
    response conformance with exact identity/content, one closure, appropriate source
    fingerprints and provider mapping/JSON transports; nonconforming or missing evidence
    rejects without silent profile downgrade or rehash.
- id: AC7
  condition: All currently active production policy selection remains AOA-1/TCA-3/ROA-1
    R3 with no remediation audit, and prospective R4 presence cannot activate itself,
    alter direct final AUTHOR_TASK/REPAIR/REMEDIATION ingress, or break exact historical
    audit replay.
- id: AC8
  condition: Focused positive and negative conformance tests encode canonical retrospective
    discriminators RUN-372, 383, 384, 391, 393, 398, 401 and 403, including RUN-403-003
    same node but new cause UNKNOWN, first-V001-fail/V002-NOT_RUN, missing-claims-only
    versus genuinely unresolved code, stale and forbidden-scope fixtures.
- id: AC9
  condition: The Human-approved prospective priority is transcribed as one planning-only
    record in canonical roadmap state naming TASK-407 implementation and conditional
    separate activation step, preserving the TCA-3 published result and older PTE/Lean
    VP plans as historical without automatic NEXT transitions.
- id: AC10
  condition: Documentation and existing Brain/provider public consumers consistently
    distinguish R4 prepared from R3 live, preserve five-check ROA closure, registry
    capacity, bounded privacy and exact Human V1 option without adding an independent
    lifecycle truth store or verifier.
- id: AC11
  condition: The completed implementation preserves existing exact source/API/AST
    and historical regressions within authorized scope, satisfies original verification
    contract/12-worker policy without mandatory full suite or claim-first PASS, and
    enables complete truthful ResultPackage AC1..AC11 claims before Runtime verification.
