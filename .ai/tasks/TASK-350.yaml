non_goals:
- No incident-by-incident patch catalog, override/bypass transport switch, second
  semantic policy router, memory/consent database, new planner or independent lifecycle/review/publication
  authority.
- No invented Human consent from bot identity, provider choice, issue body claim,
  historic RUN defaults or user session heuristics. No automatic Executor/model selection
  or replacement.
- No retroactive change to frozen Kernel, TASK/RUN/RESULT/FAILURE/REVIEW/REPAIR evidence,
  historical audit profile bytes/digests or downstream dependency pins; no fabricated
  PASS, publication or verification.
- No use of future systemwide policy change to bypass current valid authentication,
  origin proof, subject/currentness checks, immutable lineage, CAS, independent review
  or publisher gates.
- No automatic roadmap mutation, task continuation, retry/fallback, repair selection,
  source push, Executor dispatch or claims of live activation solely from a TASK,
  carrier acceptance or test output.
constraints:
  hard:
  - 'Add the exact prospective constitutional rule HUMAN_DIRECTIVE_PRECEDENCE: an
    authenticated explicit current Human directive within Human-owned authority governs
    its exact scope over older incompatible generic defaults, agent preferences and
    transport behavior. Newer competent scoped Human intent prospectively supersedes
    conflicting older intent only on overlapping dimensions. Explicit negative directives
    prohibit silent fallback.'
  - Human owns intent, policy change, delegation, risks and priority, not proof fabrication.
    Existing Runtime deterministic admission/verification/evidence, Reviewer semantic
    verdict and Publisher exact reviewed source remain independent. Prospective Kernel/version
    change cannot reinterpret historical immutable artifacts.
  - One closed-world inventory of every live path that carries, consumes, forwards,
    stores, restores or rejects Human decisions; classify each affected authority
    edge, its trusted source, scope, precedence and currentness. Implement consistent
    behavior across existing active manual and automated carriers; do not define completion
    by a finite list of incidents.
  - For authenticated and equivalent canonical Human decisions, manual or automatic
    transport must preserve exact chosen and prohibited values. Bot/workflow may convey
    prior Human authority, never mint, drop, reinterpret or override it. Unapproved
    inferred or repository-default fallback contradicting Human choice is forbidden.
  - Honor lawful explicit Human prospective audit-procedure choices at the affected
    Brain/authoring interfaces, without silently executing a forbidden default, spoofing
    DIAGNOSTIC, reminting older profile packages or weakening independently required
    audit/Reviewer/trust rules.
  - Carry an exact already-authorized Human Executor/model/effort/other supported
    parameter selection through applicable Task/PRIMARY/coding correction delivery
    when executor_required=true. Preserve executorless where canonically required;
    an admitted immutable delivery keeps its bound generation until lawful prospective
    supersession.
  - Authentication, exact subject/scope binding, currentness, proof of Human source,
    expected-main CAS, replay/idempotence and one admitted Executor remain mandatory.
    Untrusted/bot-generated claims cannot self-authorize a policy exception. Ambiguous/missing
    authorization fails only the affected mutation with an accurate actionable blocker.
  - A still-valid canonical decision must survive provider/chat replacement, workflow
    handoffs and restart without repeated Human consent. Use existing canonical authority
    surfaces; do not create a generic persistent policy oracle, planner, router or
    memory store.
  - Where existing code cannot lawfully apply Human direction, expose the exact blocking
    independent rule or deployment gap; never silently substitute another method or
    report success. Preserve truthful stage-specific transport, Runtime, review and
    publication receipts.
  - Modification authority is limited to scope.modify. Any essential additional file
    or new trust/Kernel authority must be surfaced to Human/Brain for new exact authorization
    rather than silent widening. Executor owns HOW and does not author roadmap policy
    itself.
  - Acceptance describes implementation properties claimable before Runtime verification.
    Preserve minimum-sufficient-v2 evidence reuse, no ceremonial base/full suite repeats
    and exact original authoritative test obligations.
acceptance:
- id: AC1
  condition: Published governance source defines unambiguous prospective Human directive
    precedence and prospective scoped supersession for both positive and negative
    directives, preserving independently verified engineering truth.
- id: AC2
  condition: Every in-scope supported active Human-decision consumer carries the same
    valid current Human choices across manual and automated boundaries without old
    defaults, inferred model choices or bot preferences substituting them.
- id: AC3
  condition: Human authority is authenticated and bound to exact subject, scope, precedence
    and effective generation using existing legitimate sources, with no bot/agent
    self-certification, wrong-subject replay or stale substitution.
- id: AC4
  condition: An authorized explicit Human audit-method policy change is respected
    in applicable prospective semantic flows without hidden profile fallback or reinterpretation
    of frozen historical audit packages.
- id: AC5
  condition: All applicable current Human-chosen Executor/model/effort and supported
    execution options remain exact across entrusted manual/auto delivery and correction,
    while executorless and immutable already-admitted selections stay unchanged.
- id: AC6
  condition: A genuine unsupported, stale or independently prohibited request yields
    an exact actionable blocker and no silent default substitution, duplicate approval
    ceremony or false carrier/success claim.
- id: AC7
  condition: Existing Runtime admission, TASK/RUN/REVIEW/REPAIR/REMEDIATION lineage,
    evidence, origin authenticity, security/privacy, publication, CAS and idempotence
    retain unchanged authority and reject forged or cross-subject inputs.
- id: AC8
  condition: The implementation produces a closed-world repository-based inventory
    of currently reachable Human-directive consumers, identifies each authoritative/transport/validation
    edge and reconciles every in-scope path rather than relying on issue-specific
    reproductions.
- id: AC9
  condition: Focused contract/property and composed live-path-shape synthetic tests
    cover directive precedence, explicit prohibition, transport parity, prospective
    supersession, continuity, absent/stale/forged authority and truthful negative
    outcomes across affected consumers.
- id: AC10
  condition: Final implementation changes only scope.modify, introduces no second
    policy/semantic/lifecycle owner, new generic store/router, model-driven Executor
    fallback, retroactive state rewrite or unauthorized publication.
verification:
  policy: minimum-sufficient-v2
  full_suite_reason: Cross-cutting governance, authoring, provider and manual/automated
    dispatch fidelity affects multiple integration boundaries. One selected repository-wide
    twelve-worker full suite after targeted regression work is justified; Runtime
    must avoid duplicated equivalent suites and reuse valid evidence.
  required:
  - python scripts/aios_parallel_full_suite.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
