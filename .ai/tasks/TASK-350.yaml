task_id: TASK-350
revision: 1
goal: 'Implement prospective HUMAN_DIRECTIVE_PRECEDENCE as a systemwide constitutional
  and operational invariant: authenticated explicit Human directives within Human-owned
  authority control all applicable AIOS handoffs ahead of incompatible defaults or
  automatic-policy choices, while preserving independent canonical proof and role
  authority.'
problem: AIOS recognizes Human authority but live audit, provider, ingress, dispatch,
  and profile consumers can still drop or reject a Human choice due only to an older
  default or a transport convention. Human explicitly approved one systemic authority-fidelity
  correction on 2026-10-14, rather than a collection of incident-specific exceptions.
assumptions:
- At authoring Brain Sync canonical main is c1cc051134284c62d902f051eb70dc8b918a9e6f;
  TASK-350 is new. Runtime must recheck current main, exact identity, revision and
  CAS independently.
- Human expressly prioritizes this prospective systemwide policy and implementation
  ahead of older planning bookmarks. This TASK does not automatically advance or edit
  roadmap semantics.
- Current canonical audit policy selects aios-adaptive-brain-audit-v1, version 1,
  digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718. Brain applied
  CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE with all eight lenses and final closure
  to this design; future policy changes do not retroactively waive this authoring.
- Human approval of the governance change is explicit; Human Executor/model/effort
  delegation for this new TASK has not yet been provided. Task authoring must not
  infer or choose it.
- Canonical TASK-349 / RUN-349-001 review and publication lineage is an independent
  subject. No older RUN/REVIEW/FAILURE/PASS is modified or inferred by this new work.
- Human-approved prospective return affinity is LEGACY_REPOSITORY_DEFAULT_ROUTE, not
  a fallback from failed ORIGIN_AFFINE proof.
- The complete acceptance contract appears in this TASK. Executor must not depend
  on chat memory or a noncanonical draft for essential requirements.
