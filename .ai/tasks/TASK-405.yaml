    digest, keeping exactly two ordered focused stages, the five original construct
    checks, six original adversarial checks and one closure without any additional
    semantic authority.
- id: AC2
  condition: All existing TCA-1/TCA-2 and other registered historical profiles remain
    recognized, byte-exact and replay-compatible; the tenth profile is accepted under
    a finite explicit safe count/byte bound while unknown, duplicate, rehashed, reordered
    and out-of-bound material still fails closed. The explicit parser bound is exactly
    65,536 UTF-8 bytes with up to ten recognized profiles; final Executor claim must
    agree byte-for-byte in numeric value.
- id: AC3
  condition: The TCA-3 source/API scope checks cover bounded transitive direct-call
    consumers, Git framing/object-fetch and legacy test doubles/AST guards; the TASK-391
    r1 impossible inspect-only AST edit blocks, and TASK-403 prior-newline vs new
