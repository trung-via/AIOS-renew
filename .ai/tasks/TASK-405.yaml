non_goals:
- No immediate self-activation of TCA-3 from profile registry, unreviewed TASK candidate,
  Executor RESULT or roadmap record; no premature retirement of TCA-2 before independent
  publication and authenticated cutover.
- No deletion, rewriting, silent rehash or incompatible decoding of historical TCA-1/TCA-2,
  V1/V2/V3 or in-flight audit bindings; no downgrade, provider-specific prompt or
  model pin in audit content.
- No new Planner/Flow Resolver, test-execution stage, automatically chosen repair
  strategy, generic lifecycle router, second Reviewer/Publisher/Runtime or persistent
  case/reasoning/telemetry DB.
- No mutation of existing TASK-370..404 RUN/FAILURE/RESULT/REVIEW, no automatic PTE-04/05/06,
  TASK-401 r3, G6 or Lean VP progression.
- No outside-scope edits, tests skipped/xfail/weakened, full-suite ceremony, speculative
  baseline PASS, or publication inferred from GitHub workflow receipts.
constraints:
  hard:
  - Preserve exact Brain/Executor/Runtime/Reviewer/Publisher/Human authority; final
    TASK acceptance remains CLAIM_NOW; Runtime alone performs canonical verification;
    source/excerpt digest alone cannot authenticate source.
  - Implement a distinct normalized tca-3 version 3 content digest with exact authored
    profile text and validator, not in-place mutation of tca-2 v2. Retain two ordered
    passes, five + six checks, and one final closure. Existing strict source and return
    bounds remain applicable.
  - Registry already contains nine recognized identities; adding the tenth requires
    a narrowly bounded explicit registry size/byte-cap adjustment and regression proof
    for all existing nine identities and historical exact behavior, not pruning needed
    history.
  - 'Add only materially new bounded source checks: transitive API/caller/test-double/Git
    framing and object-fetch compatibility; each required verification command''s
    known baseline status distinguished from unrun; truthful complete AC claimability
    and final package; baseline/source-version and exact inspect/modify feasibility.
    Do not demand full suite or runtime PASS as a Brain precondition.'
  - Supply at least the ten existing retrospective conformance counterexamples including
    TASK-391 r1 AC12, RUN-403-001/002/003 differentiation, missing-claim completion,
    mixed verification command results, dirty/pre-RUN boundary, positive control TASKs
    and source-bound stress. No false CANDIDATE on grounded blockers and no ungrounded
    NO_DECISION on intact controls.
  - Write only the exact Human-authorized prospective planning priority record for
    TCA-3 implementation-then-activation, preserving PTE-03 as paused/resumable, and
    record TCA-3 ACTIVE status as prohibited until a separate post-publication authenticated
    decision. Do not grant implementation-based roadmap auto-next.
  - Production audit selection continues to resolve only canonical active TCA-2 until
    the later exact reviewed publication and activation task; candidate tca-3 is isolated/prepared,
    not selected by registry order. Subsequent approved cutover must retire TCA-2
    prospectively while preserving historical replay.
  - All changes in scope.modify; if compatibility requires another file, surface a
    bounded conflict for new Human/Brain scope authorization. Clean committed candidate
    and truthful complete AC1..AC10 claims; no invented PASS.
  - Minimum-sufficient-v1 exact ordered two-command verification only, with no implicit
    full suite. Implementation Executor must not perform Runtime-owned verification
    or choose a different model; Runtime alone owns the authored commands.
acceptance:
- id: AC1
  condition: A distinct profile tca-3 version 3 is present with its own correct normalized
    digest, keeping exactly two ordered focused stages, the five original construct
    checks, six original adversarial checks and one closure without any additional
    semantic authority.
- id: AC2
  condition: All existing TCA-1/TCA-2 and other registered historical profiles remain
    recognized, byte-exact and replay-compatible; the tenth profile is accepted under
    a finite explicit safe count/byte bound while unknown, duplicate, rehashed, reordered
    and out-of-bound material still fails closed.
- id: AC3
  condition: The TCA-3 source/API scope checks cover bounded transitive direct-call
    consumers, Git framing/object-fetch and legacy test doubles/AST guards; the TASK-391
    r1 impossible inspect-only AST edit blocks, and TASK-403 prior-newline vs new
    object-fetch failure are distinguished without treating a test node as a complete
    cause.
- id: AC4
  condition: For every material acceptance and required verification command, the
    authored audit can distinguish implementation CLAIM_NOW from proof-later, and
    independently flag PASS/FAIL/NOT_RUN/UNKNOWN baseline observations without inventing
    verified outcomes, skipped verification or an implicit full suite.
- id: AC5
  condition: The TCA-3 counterexamples detect missing final truthful acceptance claims,
    unresolved obligations, bad final ResultPackage/API assumptions and missing required
    modification authority, while leaving those actual Runtime gates with Runtime
    and not inventing Executor claims or reviewer results.
- id: AC6
  condition: Exactly ten retrospective adversarial/conformance classes are covered
    including TASK-391/383/384/398/403, mixed verification commands 372/399, dirty/native/pre-RUN
    393/401, successful-control TASKs, and bounded missing-source stress; negative
    cases cannot return an unjustified CANDIDATE and valid controls are not needlessly
    blocked.
- id: AC7
  condition: Direct provider-neutral audit caller/codec/context binding rejects stale/swapped
    main, source excerpts, profile digest and selection, while correctly retaining
    current TCA-2 as normative for new authoring until exact separate activation;
    unchanged legacy callers and historical audits remain compatible.
- id: AC8
  condition: The canonical roadmap records only the explicitly selected Human 2026-10-23
    priority and future two-step TCA-3 cutover, supersedes the previous selected PTE
    slice prospectively, leaves PTE resumable and all actual lifecycle states independent,
    and does not assert TCA-3 ACTIVE or TCA-2 retired yet.
- id: AC9
  condition: 'The supported prospective activation contract is documented: after Runtime
    verification, independent Reviewer PASS and exact Publisher inclusion of this
    implementation, a separate authorized activation task authenticates reviewed source
    and pins exact id/version/digest before TCA-3 becomes default and TCA-2 prospectively
    retired, with AOA/MOA/ROA and Human V1 option unchanged.'
- id: AC10
  condition: All modifications remain within scope.modify, existing policy and public
    API negative tests preserve fail-closed behavior, no new mutation gate/DB/router/third
    audit is introduced, and the Executor can truthfully claim all ten concrete outcomes
    before Runtime verification.
