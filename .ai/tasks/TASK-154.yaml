task_id: TASK-154
revision: 3

goal: >
  Complete the same bounded BP-V2 serial-harness saturation pass defined by TASK-154 r2,
  while correcting the r2 completion-contract boundary so Executor claims cover only
  pre-verification implementation properties, Runtime owns canonical verification/timing,
  and Reviewer alone owns the post-verification saturation judgment.

problem: >
  RUN-154-007 executed TASK-154 r2 with Codex and produced a clean, transportable,
  in-scope candidate at 062baea55a25a83d9abfb897dd7909d091efd0ca, changing exactly
  the nine authorized test-harness files. Runtime stopped before verification at
  COMPLETION_GATE because the Executor RESULT did not claim AC6 and AC7. That omission
  was semantically correct: r2 AC6 required future Runtime-owned verification/timing and
  r2 AC7 required a future Reviewer-owned saturation judgment. Runtime's existing
  completion contract requires every TASK acceptance criterion to be structurally claimed
  before verification begins, so r2 accidentally asked the Executor to claim facts and
  authority it did not yet own. r3 preserves the r2 optimization intent and candidate
  semantics, removes only that acceptance-boundary defect, and must not turn the incident
  into a production Runtime/Operator change.

assumptions:
  - Canonical main at TASK-154 r3 authoring is 7ff6905fbd9dd2034c0b7a60c67b8fd446615d2d.
  - >
    TASK-154 r2 remains immutable historical intent and RUN-154-007 remains immutable
    canonical FAILURE truth: phase COMPLETION_GATE, failed head
    062baea55a25a83d9abfb897dd7909d091efd0ca, dirty=false,
    descends_from_base=true, outside_task_scope=[], repairable=true,
    transportable=true.
  - >
    RUN-154-007 verification_seconds is null; therefore no canonical r2 collect-only,
    full-suite, or diff-check evidence exists and no test failure has been established
    for that candidate.
  - >
    The RUN-154-007 candidate changed exactly tests/conftest.py,
    tests/git_fixture_support.py, tests/operator_test_support.py,
    tests/test_authoring_ingress.py, tests/test_git_fixture_isolation.py,
    tests/test_operator.py, tests/test_operator_unified_state.py,
    tests/test_publication.py, and tests/test_review_transport.py.
  - >
    RUN-152-003 remains the canonical before baseline on the standard Windows x64
    aios-renew self-host class: 1581 collected tests and 1581 passed in 2340.29 seconds
    on 0e40a6dfdae610dca0144200eaf38bd0a43696a7.
  - >
    RUN-154-006 remains the canonical green r1 reference point: 1582 collected,
    1582 passed in 1728.84 seconds, git diff --check PASS, subject
    332c3ce111c0e275df2c573f89f4df620c785fb8.
  - >
    Human-approved planning already defines BP-V2 completion by bounded saturation
    review rather than a mandatory 1170.145 second threshold. r3 does not alter that
    planning decision.
  - >
    Runtime owns canonical verification and timing evidence. Reviewer owns the semantic
    saturation verdict. Executor owns implementation HOW and may claim only implementation
    properties that exist before Runtime verification.

scope:
  inspect:
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-154.yaml
    - refs/heads/aios/artifacts/RUN-152-003
    - refs/heads/aios/artifacts/RUN-154-006
    - refs/heads/aios/review-decision/RUN-154-006
    - refs/heads/aios/failure-artifacts/RUN-154-007
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - tests/git_fixture_support.py
    - tests/operator_test_support.py
    - tests/test_operator.py
    - tests/test_operator_unified_state.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_git_fixture_isolation.py
    - tests/conftest.py
    - pyproject.toml
  modify:
    - tests/git_fixture_support.py
    - tests/operator_test_support.py
    - tests/test_operator.py
    - tests/test_operator_unified_state.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_git_fixture_isolation.py
    - tests/conftest.py

non_goals:
  - Modify any src/aios_renew production module, Runtime, Operator, verification engine, Reviewer, Publisher, workflow, carrier, frozen Kernel, or lifecycle authority to accommodate the r2 contract mistake.
  - Repair RUN-154-007 under TASK-154 r2 or fabricate verification evidence for that failed RUN.
  - Reinterpret RUN-154-007 as a RESULT, PASS, reviewed candidate, or BP-V2 completion.
  - Redesign the r2 optimization strategy unless exact current-main compatibility requires a bounded adjustment inside the same nine-file authority.
  - Implement BP-V3 verification-workspace isolation or BP-V4 parallel execution.
  - Add pytest-xdist, parallel workers, asynchronous scheduling, persistent caches, telemetry services, shared mutable fixture state, broad Git mocks, PATH interception, or global subprocess monkeypatching.
  - Remove, rename, skip, xfail, deselect, weaken, or timeout-inflate tests for timing.
  - Treat 1170.145 seconds or any other fixed wall-time number as a mandatory completion target.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Start from current canonical main. Preserve TASK-155 publication-lineage behavior
      and the Human/Brain BP-V2 saturation planning amendment already on main.
    - >
      Treat 062baea55a25a83d9abfb897dd7909d091efd0ca as reusable failed-candidate evidence.
      Preserve/reuse its compatible nine-file implementation delta rather than redoing
      the optimization from scratch. HOW of reuse belongs to Executor; do not reset or
      overwrite newer canonical main state.
    - >
      Preserve the r2 semantic split: setup-only Git state construction may use
      deterministic fixture helpers; Git ancestry, merge-base, dirty/index behavior,
      repository configuration behavior when under test, remotes, refs,
      non-fast-forward/divergence, races, publication, transport, malformed lineage,
      and other Git-boundary semantics must continue to cross ordinary real Git.
    - >
      If a call site cannot be shown to be setup-only without changing what the test
      proves, leave it on real Git.
    - >
      Preserve independent writable worktree/index, local refs, remote refs,
      repository-local config, clean/dirty state, locks, object write paths, and
      .git/aios Runtime state for every sandbox. Shared reuse is limited to immutable
      baseline/object material already conformance-proven.
    - >
      Preserve RUN-154-006 immutable-object create-only/idempotent behavior and real-Git
      follow-up commit conformance. Do not reintroduce session-wide Git config suppression.
    - >
      Do not intentionally remove or rename any RUN-152-003 baseline node, the
      RUN-154-006 conformance regression, or current-main TASK-155 regressions.
    - >
      Executor RESULT must not claim Runtime verification completion, measured suite
      timing, semantic saturation, Reviewer PASS, publication, or BP-V2 completion.
      Those authorities occur only after structural completion.
    - >
      Runtime must execute the r3 verification contract once after structural completion.
      Reviewer must then compare canonical evidence with 2340.29 seconds and
      1728.84 seconds and decide saturation without a fixed pass/fail timing threshold.
    - >
      Do not modify files outside scope.modify and do not push from Executor implementation.

acceptance:
  - id: AC1
    condition: >
      The implementation delta changes only the nine authorized test-harness files and
      changes no production source, workflow, Runtime, verification, review, publication,
      carrier, roadmap, planning, or lifecycle semantics.
  - id: AC2
    condition: >
      The implementation preserves the compatible RUN-154-007 / RUN-154-006 reusable
      immutable Git baseline/object construction, writable-state isolation,
      create-only/idempotent object behavior, real-Git follow-up conformance, and
      current-main TASK-155 compatibility.
  - id: AC3
    condition: >
      High-frequency setup-only Git state construction in test_operator.py and
      test_operator_unified_state.py is selectively reduced through deterministic fixture
      helpers only where semantic equivalence is explicit; ambiguous sites remain real Git.
  - id: AC4
    condition: >
      Tests whose subject includes ancestry, refs, remotes, config semantics, dirty/index
      behavior, publication, transport, races, divergence, malformed lineage, or failure
      behavior continue to exercise production-shaped real Git boundaries.
  - id: AC5
    condition: >
      The implementation introduces no optimization-motivated skip, xfail, deselection,
      test removal/rename, timeout inflation, broad Git mock, persistent shared mutable
      fixture state, parallel execution, or production semantic shortcut.
  - id: AC6
    condition: >
      The implementation introduces no new semantic authority, automatic optimization
      selector, planner/router, retry/failover behavior, Reviewer decision, publication
      claim, or BP-V2 completion claim.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    BP-V2 r3 corrects only the r2 pre-verification acceptance-boundary defect while
    preserving the bounded saturation candidate. Canonical Runtime therefore needs one
    same-class collect-only/full-serial-suite/diff-check evidence set to establish exact
    test population, correctness, production-shaped behavior, and final elapsed time.
    After that evidence exists, Reviewer—not Executor or Runtime—decides whether the
    serial optimization surface is saturated.
  required:
    - python -m pytest --collect-only -q
    - python -m pytest -q
    - git diff --check
