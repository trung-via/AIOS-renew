task_id: TASK-154
revision: 1

goal: >
  Accelerate the intrinsic serial full-suite Git test harness for BP-V2 by reusing
  equivalent immutable Git baseline material while preserving every baseline test node,
  isolated writable Git/Runtime state per test, and production-shaped real-Git boundary
  semantics, so the canonical Windows self-host serial suite can meet the BP-V2
  before/after performance exit gate without parallel execution or coverage reduction.

problem: >
  The canonical BP-V2 before baseline is RUN-152-003 on the standard Windows x64
  aios-renew self-host class. Runtime collected 1581 tests and passed all 1581 in
  2340.29 seconds on subject 0e40a6dfdae610dca0144200eaf38bd0a43696a7.
  Historical profiling and current harness audit show the dominant intrinsic cost is
  repeated construction of equivalent real-Git repositories and bare remotes across
  control-plane tests. tests/operator_test_support.py make_repo performs Git init,
  configuration, baseline commit, bare-upstream creation, remote binding and initial
  push for each sandbox; test_operator.py alone invokes that helper approximately
  187 times, while review transport and unified-state tests also reuse it, and
  authoring/publication suites maintain additional equivalent local constructors.
  BP-V2 requires at least 50 percent serial full-suite wall-time reduction without
  shrinking canonical coverage, weakening real-Git semantics, or introducing
  parallelism. The exact threshold from RUN-152-003 is therefore 1170.145 seconds.

assumptions:
  - Canonical main at TASK-154 authoring is 17f1ba8b86028f937867937bdee06049215b749d.
  - BP-V2 Full-Suite Harness Acceleration is the unique canonical NEXT roadmap milestone.
  - >
    RUN-152-003 / REVIEW-152-003 is the canonical green before baseline:
    subject and published SHA 0e40a6dfdae610dca0144200eaf38bd0a43696a7,
    collection evidence RUN-152-003-V001 with 1581 collected tests, full-suite evidence
    RUN-152-003-V002 with 1581 passed in 2340.29 seconds, and standard self-host class
    [self-hosted, windows, x64, aios-renew].
  - >
    tests/test_git_fixture_isolation.py is the published conformance guard proving that
    separately materialized sandboxes must not share writable worktree/index state,
    local refs, writable remote refs, repository-local configuration, clean/dirty state,
    or .git/aios Runtime/lock state; it intentionally permits reuse of immutable Git
    objects or immutable baseline material.
  - >
    Production-shaped Git boundary tests remain authoritative where ancestry, refs,
    remotes, transport, publication, races, divergence, malformed lineage, or other
    Git behavior is part of the semantic subject.
  - >
    Runtime owns canonical verification and timing evidence. Executor structural RESULT
    claims must remain limited to implementation properties that are knowable before
    Runtime executes the full suite.

scope:
  inspect:
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-152.yaml
    - refs/heads/aios/artifacts/RUN-152-003
    - refs/heads/aios/review-decision/RUN-152-003
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - tests/operator_test_support.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_operator_unified_state.py
    - tests/test_git_fixture_isolation.py
    - tests/conftest.py
    - pyproject.toml
  modify:
    - tests/git_fixture_support.py
    - tests/operator_test_support.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_git_fixture_isolation.py
    - tests/conftest.py

non_goals:
  - Modify any src/aios_renew production module, frozen Kernel semantics, Runtime, Operator, verification engine, EVIDENCE schema, Reviewer, Publisher, carrier, workflow, or lifecycle authority.
  - Modify pytest scheduling, add pytest-xdist, parallel workers, worker-count heuristics, async test execution, or any BP-V4 behavior.
  - Change verification workspace/control-checkout isolation or implement BP-V3 behavior.
  - Add persistent cross-run test-result caches, benchmark databases, telemetry services, daemons, second evidence stores, or lifecycle/planning state.
  - Skip, xfail, deselect, rename away, delete, or otherwise remove any of the 1581 baseline node IDs.
  - Replace Git ancestry, refs, remotes, publication, transport, race, divergence, or fail-closed boundary semantics with broad mocks.
  - Share writable worktrees, indexes, refs, remotes, repository-local configuration, locks, .git/aios state, or other mutable repository state across tests.
  - Force bespoke Git topologies through a generic baseline abstraction when their topology is itself under test.
  - Increase timeouts or weaken assertions to obtain a passing or faster suite.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Introduce test-only reusable Git baseline construction/materialization semantics that
      eliminate repeated creation of equivalent immutable baseline history where safe.
      The exact implementation mechanism is Executor-owned, but reuse must be limited to
      immutable baseline material and must not create shared writable engineering state.
    - >
      Every materialized test sandbox must retain independent writable worktree and index,
      local refs/branches, repository-local Git configuration, writable bare remote and
      remote refs where a remote is required, clean/dirty state, locks, and .git/aios
      Runtime state. Mutation of one sandbox must not be observable as mutable state in
      another sandbox.
    - >
      Immutable Git objects or equivalent immutable baseline material may be shared or
      reused only when the writable-state isolation contract above remains true.
    - >
      Existing production-shaped Git boundary tests must continue to exercise real local Git
      repositories and real local bare remotes whenever Git behavior is part of the semantic
      subject. Bespoke divergence, race, forged-lineage, publication, transport, and remote
      namespace topologies must remain real and semantically equivalent.
    - >
      Equivalent constructors in the authorized harness scope may adopt the reusable
      baseline facility only where their baseline semantics are actually equivalent.
      Do not collapse intentionally different repository histories or topology shapes into
      one generic fixture merely for speed.
    - >
      The acceleration facility must be ephemeral test-harness support only. It must not
      become canonical lifecycle truth, roadmap state, a persistent model memory/cache, or
      a new coordination authority, and must not persist reusable mutable state across
      pytest invocations.
    - >
      Preserve every exact node ID present in canonical baseline evidence
      RUN-152-003-V001. Additional tests are allowed; removal, rename, silent deselection,
      skip, or xfail of any baseline node is forbidden.
    - >
      Do not add parallel execution, result caching, timeout inflation, broad Git mocks,
      coverage reduction, or production semantic changes.
    - >
      Canonical Runtime verification must run collect-only and the serial full suite on the
      accelerated candidate. Reviewer must compare the resulting collected node set against
      RUN-152-003-V001 and confirm that all 1581 baseline node IDs remain present.
    - >
      BP-V2 performance success may be accepted only from canonical Runtime evidence on the
      same standard self-host class [self-hosted, windows, x64, aios-renew], with a green
      serial full suite on one subject SHA and pytest elapsed time no greater than
      1170.145 seconds, representing at least 50 percent reduction from 2340.29 seconds.
      If the suite is semantically green but exceeds that threshold, do not claim BP-V2
      performance success; Reviewer must surface the remaining performance gap for a
      subsequent bounded optimization decision.
    - >
      Do not modify files outside scope.modify and do not push from Executor implementation.

acceptance:
  - id: AC1
    condition: >
      The candidate changes only authorized test-harness files and changes no production
      source, workflow, Runtime, verification, review, publication, carrier, or lifecycle
      semantics.
  - id: AC2
    condition: >
      Equivalent Git baseline construction is reusable within the test process/session so
      tests no longer rebuild the same immutable baseline history through the full original
      initialization sequence for every equivalent sandbox.
  - id: AC3
    condition: >
      Every materialized sandbox preserves independent writable worktree/index, local refs,
      repository-local config, writable remote refs, clean/dirty state, locks, and .git/aios
      Runtime state, and the isolation guard continues to prove cross-sandbox independence.
  - id: AC4
    condition: >
      Tests whose semantics depend on Git ancestry, refs, remotes, publication, transport,
      races, divergence, or malformed lineage continue to use production-shaped real Git
      boundaries; intentionally distinct topologies are not flattened into an equivalent
      baseline abstraction.
  - id: AC5
    condition: >
      Baseline reuse is ephemeral test-only support and introduces no persistent cross-run
      result cache, lifecycle state, planner/router authority, parallel execution, timeout
      inflation, broad Git mocking, skip, xfail, or deselection behavior.
  - id: AC6
    condition: >
      The implementation preserves the baseline test identities by construction and does not
      remove, rename, skip, xfail, or deselect existing tests in order to improve timing.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    Compare the accelerated serial harness against canonical BP-V2 baseline RUN-152-003 on
    the supported Windows self-host class while proving the baseline test population and
    production-shaped real-Git semantics remain intact.
  required:
    - python -m pytest --collect-only -q
    - python -m pytest -q
    - git diff --check
