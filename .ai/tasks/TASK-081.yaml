task_id: TASK-081
revision: 1

goal: >
  Generalize the existing TASK-047 REMEDIATION-only pre-RUN admission diagnostic into
  one bounded, operation-neutral Admission Failure v2 boundary for every current
  execution-capable Human-facing AIOS path that can be rejected before canonical RUN
  creation: PRIMARY (including TASK-062 synchronization and A2 wakeup preflight),
  REMEDIATION, REPAIR, direct-candidate acceptance, and PRIMARY collision recovery.
  Preserve the constitutional distinction between admission failure and RUN failure:
  rejected admission creates no synthetic RUN and invokes no Executor. Make each new
  diagnostic machine-readable and forensically attributable by binding stable bounded
  phase/reason information and the exact immutable remote/repository facts already
  observed before failure, so later Brain/automation can explain the historical failure
  without inferring from mutable current refs or parsing free-form terminal text.

problem: >
  Cross-project audit of AIOS-renew and Python Agent failure history exposed a remaining
  control-plane blind spot. TASK-047 correctly transports bounded ADMISSION_FAILURE
  diagnostics for REMEDIATION after repository/TASK resolution, but explicitly excluded
  PRIMARY, REPAIR, direct-candidate acceptance, and other Operator surfaces. Current
  PRIMARY synchronization under TASK-062 can reject dirty, detached, ahead, diverged,
  missing/ambiguous-upstream, fetch, fast-forward, stale-kernel, or RUN-namespace state
  before a RUN exists. TASK-077 records that downstream historical REPAIR attempts can
  fail during remote lineage/snapshot admission with no RUN at all. TASK-071 recovery
  admission and TASK-078 historical REMEDIATION subject admission likewise have valid
  fail-closed pre-RUN boundaries. Those failures can currently exist only as terminal/UI
  text unless they happen to pass through TASK-047's REMEDIATION wrapper. In addition,
  historical admission diagnostics such as the observed Python Agent TASK-166/F1R1 case
  record an error string but not the exact remediation-ref commit/snapshot identity seen
  when the failure occurred; if that remote ref later changes, forensic review cannot
  prove what immutable state the resolver actually observed. This is an observability and
  attribution defect, not authority to weaken admission, retry Git/model operations, or
  create repairable fake RUNs.

assumptions:
  - >
    Current canonical AIOS-renew main at TASK-081 authoring is
    32ace104c5cfaa1b7affbaa40157872b1f85147f, the semantically reviewed PASS and
    published TASK-080 source candidate.
  - >
    REVIEW-080-001 is canonical PRIMARY PASS for exact reviewed SHA
    32ace104c5cfaa1b7affbaa40157872b1f85147f with no findings; there is no active
    TASK-080 correction lineage that TASK-081 must continue.
  - >
    TASK-047 remains authoritative precedent for admission failure semantics:
    pre-RUN rejection is Runtime/Operator operational state, creates zero RUNs, records
    executor_invoked=false, uses bounded allowlisted content, and best-effort immutable
    content-addressed transport whose failure never masks the original admission error.
  - >
    TASK-062 revision 2 remains authoritative for PRIMARY-only safe auto-sync before
    TASK loading/admission. REMEDIATION, REPAIR, direct-candidate, and historical subject
    flows must not be auto-fast-forwarded merely to make them admissible.
  - >
    TASK-067, TASK-071, TASK-077, and TASK-078 remain authoritative for exact TASK-bound
    remediation resolution, canonical remote RUN namespace/collision recovery,
    historical REPAIR snapshot semantics, and historical REMEDIATION subject isolation
    respectively. TASK-081 observes their pre-RUN rejection boundaries but does not
    redefine those semantics.
  - >
    Existing refs/heads/aios/admission-failure/* artifacts are immutable historical v1
    operational facts and need no migration, rewrite, deletion, or reinterpretation.
  - >
    A repository that cannot be resolved as a Git repository provides no trustworthy
    repository-local AIOS state root or canonical transport destination; such a failure
    may remain terminal-only rather than fabricating repository identity.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-ROADMAP.md
    - .ai/tasks/TASK-047.yaml
    - .ai/tasks/TASK-062.yaml
    - .ai/tasks/TASK-067.yaml
    - .ai/tasks/TASK-071.yaml
    - .ai/tasks/TASK-077.yaml
    - .ai/tasks/TASK-078.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - tests/test_operator.py
    - tests/test_review_transport.py
    - README.md
  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - tests/test_operator.py
    - tests/test_review_transport.py
    - README.md

non_goals:
  - Change or unfreeze TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, REPAIR, or
    RUN_OBSERVATION schemas or semantic authority.
  - Create a RUN, lease, handoff, ResultPackage, RESULT, EVIDENCE, FAILURE, or synthetic
    repair lineage for an operation rejected before canonical RUN admission.
  - Change any admission decision, lineage eligibility, historical subject, PRIMARY
    synchronization, RUN namespace, reusable-candidate, verification, completion,
    review, correction, or publication semantic rule merely to make an operation pass.
  - Implement unified `$aios run/fix/repair/status` grammar, state-machine STATUS/next-
    legal-action guidance, executor recommendation, correction-artifact authoring
    preflight, A4/A6 automation, or downstream Python Agent worker migration in this TASK.
  - Automatically retry Git fetch/ls-remote/fast-forward, model invocation, historical
    workspace creation, transport, admission, or any failed operation; add fallback,
    reroute, alternate remote, alternate Executor, polling, backoff, or autonomous repair.
  - Parse arbitrary free-form error prose with a model or heuristic NLP classifier to
    infer semantic root cause, repair advice, or next action.
  - Persist or transport secrets, credentials, environment dumps, unbounded stdout/stderr,
    complete Git status, source code, complete TASK/REVIEW/REMEDIATION/REPAIR documents,
    model transcripts, stack traces, or arbitrary UI text.
  - Rewrite, delete, normalize, or migrate historical admission-failure refs or any other
    immutable canonical artifact/ref.
  - Make admission-diagnostic persistence/transport a prerequisite whose failure can mask
    or replace the original admission exception.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve the Project Contract failure taxonomy exactly: ADMISSION_FAILURE means no
      canonical RUN exists for that rejected attempt and no Executor was invoked. Once a
      RUN has been created, later execution/completion/verification failure must continue
      exclusively through the existing RUN-keyed FAILURE path and must not also emit an
      ADMISSION_FAILURE for the same attempt.
    - >
      Generalize TASK-047 admission diagnostics to the current execution-capable Operator
      families PRIMARY, REMEDIATION, REPAIR, direct-candidate acceptance, and
      recover-primary. The normal Human-facing PRIMARY `run` path and A2 `wakeup` path
      must include failures in TASK-062 synchronization/preflight before RUN creation;
      A2 dispatch reconciliation remains separate operational authority and must not be
      redesigned by this TASK.
    - >
      Admission Failure v2 must use one bounded allowlisted operational structure with an
      explicit format/version marker, kind=ADMISSION_FAILURE, a bounded operation identity,
      executor_invoked=false, a bounded deterministic admission phase, a stable
      machine-readable reason code, and the original bounded error type/message. Include
      requested executor only when the operation selected one; do not invent an Executor
      identity for recover-primary or another zero-Executor boundary.
    - >
      Reason codes and phases must be assigned from deterministic Runtime/Operator/transport
      boundaries, not by parsing the final error string. The bounded taxonomy must at least
      distinguish the observed classes needed by future automation: PRIMARY synchronization
      rejection, TASK/contract rejection, remote transport unavailability, canonical
      lineage missing/ambiguous/invalid, repository admission rejection, RUN namespace
      conflict, historical-subject admission rejection, and reusable-state admission
      rejection. Exact enum spelling is implementation-owned provided it is documented,
      stable, deterministic, and directly regression-tested.
    - >
      A diagnostic must record only facts actually known at the failure boundary. Preserve
      the requested TASK id, failed/source RUN id, finding id, dispatch id, exact TASK
      revision, review id, reviewed_sha, failed_head_sha, current/control HEAD, or similar
      bounded identities when already authoritatively resolved. If TASK parsing has not
      succeeded, do not fabricate a revision or represent the requested id as a resolved
      canonical TASK.
    - >
      When remote lineage/ref discovery has successfully observed an immutable canonical
      ref commit SHA or one immutable task-scoped ref snapshot before the later admission
      rejection, preserve enough bounded observed identity in the diagnostic to identify
      that exact observation (for example the relevant canonical ref name + observed
      commit SHA, or a deterministic digest/identity of the immutable ref snapshot plus
      bounded operation metadata). A later mutation of the remote branch/ref must not make
      the historical diagnostic depend on whatever the ref contains at review time.
    - >
      When the remote query itself fails before any canonical ref/snapshot was observed,
      record bounded operational provenance sufficient to distinguish transport
      unavailability from a successful query that proved required lineage missing or
      malformed. Preserve existing TASK-077 no-retry/no-fallback semantics and do not
      expose credentials or unbounded raw stderr.
    - >
      After a Git repository has been validly resolved, a pre-RUN rejection should
      best-effort persist one content-addressed local diagnostic under repository-local Git
      runtime state and, when canonical transport is usable, publish the byte-exact content
      immutably under refs/heads/aios/admission-failure/. Byte-identical diagnostics remain
      idempotent; materially different observed state must produce a different identity and
      must never overwrite an earlier diagnostic.
    - >
      Diagnostic persistence and publication remain subordinate side effects. Failure to
      create local diagnostic state or publish the admission-failure ref must preserve the
      original exception as primary, create no RUN, invoke no Executor, and cause no retry,
      fallback, reroute, cleanup mutation, or alternate diagnostic transport.
    - >
      Successful PRIMARY, wakeup, REMEDIATION, REPAIR, direct-candidate, and recover-primary
      behavior must remain unchanged. TASK-081 adds no successful-path model calls,
      verification, evidence, semantic reasoning, remote queries solely for analytics, or
      duplicated lineage discovery; diagnostic facts should be captured from admission work
      already required or from bounded deterministic metadata exposed by that work.
    - >
      Existing TASK-047 v1 admission-failure refs remain readable immutable history.
      New v2 diagnostics must not rewrite or reinterpret them, and transport namespace
      compatibility must preserve idempotent content-addressed publication.
    - >
      README must document the distinction among pre-RUN ADMISSION_FAILURE, admitted RUN
      FAILURE, and semantic CHANGES_REQUIRED, list the operations covered by v2, explain
      executor_invoked=false, and state that admission diagnostics are operational forensic
      facts rather than semantic evidence or automatic recovery instructions.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Deterministic PRIMARY regressions prove dirty/detached/non-main/ahead/diverged or
      upstream/preflight rejection, including at least one TASK-062 synchronization error,
      creates no RUN and invokes no Executor while best-effort producing Admission Failure
      v2 with operation/phase/reason/requested-task facts; ordinary already-synchronized and
      behind-then-successfully-fast-forwarded PRIMARY paths remain unchanged.
  - id: AC2
    condition: >
      A2 wakeup preflight rejection before PRIMARY RUN admission exposes the same v2
      admission semantics and may include the already-known dispatch_id, while existing
      durable dispatch identity/reconciliation behavior remains unchanged and no duplicate
      PRIMARY execution is introduced.
  - id: AC3
    condition: >
      Existing REMEDIATION pre-RUN cases covered by TASK-047 continue to produce bounded
      immutable diagnostics under the generalized v2 path, including remote-lineage,
      contract, repository, and historical-subject admission failures, with zero RUN/
      Executor when admission did not complete and no regression to successful FIX.
  - id: AC4
    condition: >
      Historical and current-head REPAIR regressions prove failures during failed-RUN
      resolution, remote snapshot/lineage reconstruction, repair contract/reusable-state,
      historical-subject setup, repository admission, or canonical RUN reservation before
      RUN creation produce v2 diagnostics with failed_run_id and exact known lineage facts,
      invoke zero Executors, and preserve TASK-058/TASK-064/TASK-075/TASK-077 semantics.
  - id: AC5
    condition: >
      Direct-candidate and recover-primary pre-RUN rejection regressions produce the same
      bounded v2 diagnostic semantics without changing their existing zero-Executor or
      recovery/correction authority; once either path creates a RUN, later failure remains
      an ordinary RUN-keyed FAILURE only.
  - id: AC6
    condition: >
      A regression equivalent to the historical TASK-166/F1R1 forensic gap proves that
      when remediation resolution has observed a specific canonical remediation ref
      commit before a later rejection, the diagnostic binds that exact observed ref
      identity. Mutating the test remote ref afterward cannot change what historical state
      the diagnostic proves was observed at failure time.
  - id: AC7
    condition: >
      Separate regressions prove a nonzero remote query/transport failure is categorized
      as operational transport unavailability with bounded provenance, while a successful
      remote query that lacks required lineage is categorized as missing/incomplete
      canonical state; neither path retries, falls back, invokes an Executor, or fabricates
      a RUN.
  - id: AC8
    condition: >
      V2 diagnostics contain only allowlisted bounded facts, do not fabricate unresolved
      identities, never contain secrets/unbounded logs/source/model prose, and are
      byte-content-addressed: an identical repeated rejection reuses one identity while a
      changed observed ref/SHA or other material bounded fact yields a distinct immutable
      diagnostic without overwriting history.
  - id: AC9
    condition: >
      A failure in local diagnostic persistence or admission-diagnostic transport never
      masks the original admission exception and causes zero retries, zero Executor calls,
      zero synthetic RUNs, and zero alternate recovery behavior.
  - id: AC10
    condition: >
      Regression coverage proves the failure-category boundary remains exact across all
      covered operations: pre-RUN rejection emits only ADMISSION_FAILURE; post-admission
      execution/completion/verification failure emits only RUN-keyed FAILURE; Runtime PASS
      followed by semantic defect remains REVIEW CHANGES_REQUIRED. No category is converted
      into another for convenience.
  - id: AC11
    condition: >
      Existing focused Operator and review-transport regressions pass, README documents
      Admission Failure v2 and its non-semantic authority, and implementation adds no model
      call, retry/fallback/reroute, executor recommendation, STATUS state machine, unified
      Human command grammar, downstream migration, or publication behavior.

verification:
  required:
    - python -m pytest tests/test_operator.py tests/test_review_transport.py -q
    - git diff --check
