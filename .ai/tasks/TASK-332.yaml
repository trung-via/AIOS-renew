non_goals:
- Do not build a second canonical source issuer, persistent trust registry, key service,
  certificate authority, root acceptance API or caller-chosen trust anchor. If an
  independently reviewed Runtime source cannot be established, return UNKNOWN/BLOCK
  and document the missing integration gate; do not synthesize it.
- Do not change existing production Runtime, TASK/RUN/RESULT/EVIDENCE/FAILURE/REVIEW
  decoders, checkpoint scheduler, workflow, Git carrier, self-host runner, Publisher,
  Reviewer or historical artifacts.
- Do not create authoritative checkpoint persistence, feedback consumption, proof
  execution, target EVIDENCE, acceptance discharge, re-entry/REPAIR, Runtime continuation,
  automatic source evidence retargeting or terminalization.
- Do not infer semantic dependency coverage from filenames, matching SHA alone, nodeids,
  test commands, fixtures or caller-approved VALID labels; do not create a second
  proof validity or semantic mapping engine.
- Do not activate KA-01, replace V2, start VP-04 production integration, waive VP-01,
  close VP-02/VP-03, change roadmap automatically or retarget downstream pins.
- Do not run baseline comparison/reproduction, broad full-suite, duplicate already
  valid TASK-331 tests or live Executor feedback; no network or destructive Git operation.
constraints:
  hard:
  - Offer an exact versioned, bounded read-only handoff contract and strictly decoded
    facts; untrusted request cannot set or override repository identity, catalog source,
    trusted issuer, expected main, Human/Runtime/Reviewer authority, acceptance verdict
    or validity label.
  - Provenance must originate at an independently established existing canonical Runtime/source
    observation boundary with exact source/issuer legitimacy and currentness, not
    from requester-supplied Git history, SHA, path, dynamically registered callback,
    arbitrary duck-typed source or self-certified permission. If no production-grade
    trusted producer is present, the only lawful result is factual UNKNOWN/BLOCK and
    explicit residual, even if an offline fixture is internally consistent.
  - Reuse VP-03A evaluate_applicability and VP-03B evaluate_lineage for factual evidence
    and checkpoint checks, and VP-02 mapping/coverage contracts for semantic completeness.
    Do not duplicate validity/scheduling logic. Preserve VALID/INVALIDATED/UNKNOWN
    by exact immutable source-to-target witness, without relabeling original RESULT/EVIDENCE
    subject or manufacturing target execution.
  - Authenticate exact TASK revision/blob and admitted RUN/base, candidate committed
    tree, original source EVIDENCE/RESULT/raw and applicable current target, reviewed
    proof obligation/mapping, lease/Human delegation and finite accounting where pertinent.
    Missing or mismatched issuer, mapping, evidence, currentness, source review or
    target coverage must fail closed, not be represented as PASS.
  - No silent proof obligation collapse. Keep integration, concurrency, worker, ordering,
    profile, fixture/helper, environment/toolchain, comparison and repetition obligations
    distinct; original FAIL remains FAIL even if source-to-target factual applicability
    is VALID.
  - Replay, duplicate receipt, torn/moved main, changed head/lease, conflicting catalog
    pins, forged commit history and stale/tampered checkpoint must not consume feedback,
    reserve budget, execute any proof, create a second checkpoint or confer new authority.
    Distinguish factual CONSISTENT from authorization.
  - Human/Brain semantic choice and Reviewer verdict remain external. The new module
    must be read-only and inactive, with every continuation, evidence-reuse/discharge,
    execution, scheduler, terminal, mutation, publisher and activation flag false;
    no new lifecycle state.
  - Use bounded deterministic offline real-Git conformance only; share minimal fixtures,
    avoid re-running TASK-331's expensive complete focused suite or any equivalent
    proof for ceremony. The existing Runtime alone owns this TASK's required focused
    verification command.
  - Restrict all implementation changes to exactly the three new paths in scope.modify;
    if the necessary trusted producer requires editing existing Runtime, document
    that separate future authorization as a BLOCKER rather than expanding this TASK
    or shipping a fake production issuer.
acceptance:
- id: AC1
  condition: A bounded versioned read-only canonical proof handoff API and document
    exist, with strict decoded source identity, trusted-issuer/currentness preconditions,
    no caller-selected trust root or self-attested VALID permission, and explicit
    factual UNKNOWN/BLOCK for absent independent issuer.
- id: AC2
  condition: The handoff binds source TASK/RUN/base and admitted status, original
    committed candidate/evidence/raw subjects, exact source and target proof/mapping/lineage
    identities, and separately observed currentness without creating new authority
    or interpreting arbitrary Git objects as canonical approval.
- id: AC3
  condition: It consumes the published VP-03A/VP-03B validators and existing VP-02
    mapping only, preserves each original source observation and verdict, and exposes
    per-target VALID/INVALIDATED/UNKNOWN with immutable applicability witness rather
    than synthetic target EVIDENCE or aggregate acceptance PASS.
- id: AC4
  condition: The fact projection retains distinct mandatory integration, concurrency,
    ordering, worker, profile, environment, fixture/helper, comparison and repetition
    obligations; incomplete or conflicting mapping/footprints never discharge a target
    obligation.
- id: AC5
  condition: A conflicting, missing, stale, duplicate, replayed or torn issuer/checkpoint
    handoff deterministically returns factual BLOCK/UNKNOWN without repeating proof,
    consuming feedback twice, resetting costs, mutating history or granting continuation.
- id: AC6
  condition: Focused bounded disposable real-Git tests exercise independent trust-root
    absence, fake coherent repository, forged issuer/catalog, exact source binding,
    stale main, swapped TASK/RUN/evidence, mixed valid/invalidated/unknown proof,
    original FAIL preservation, mapping/condition drift and replay/crash negatives;
    tests do not issue network, live execution or checkpoint writes.
- id: AC7
  condition: Every exposed authorization/activation/reuse/discharge/verification/continuation/terminalization/persistence
    flag remains false with NOT_ACTIVATED; documentation names the external issuer/producer
    limitations and future VP-04/VP-05/VP-07 Runtime/CAS/conformance gates without
    claiming readiness.
- id: AC8
  condition: The committed delta contains only the new bounded handoff module, focused
    test module and versioned documentation; existing production Runtime, Kernel,
    workflows, contracts, canonical history and downstream pins remain untouched.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_proof_authority_handoff.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
