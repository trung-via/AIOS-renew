task_id: TASK-332
revision: 1
goal: Deliver VP-03C's bounded, read-only canonical provenance handoff foundation
  connecting published VP-02/VP-03A/VP-03B factual proof and checkpoint validators
  to an independently established canonical Runtime source boundary. Preserve exact
  source evidence, TASK/RUN and proof identity, map target applicability as VALID/INVALIDATED/UNKNOWN
  only, and surface factual BLOCK/UNKNOWN when trusted issuer/currentness/coverage
  is missing. The output remains NOT_ACTIVATED and grants no verification, acceptance
  discharge, executor continuation or lifecycle mutation.
problem: Published TASK-330 and TASK-331 authenticate records and ordered checkpoint
  lineage only relative to a trusted catalog supplied outside their APIs. A caller
  can manufacture self-consistent Git objects and dependency-inject an invented authority;
  Git SHA/replay proof alone does not authenticate its issuer or Runtime admission/review
  authority. Before VP-04 can lawfully use the foundations, VP-03 must demonstrate
  a bounded read-only handoff that consumes only independently pinned canonical Runtime
  source provenance, prevents self-selected catalog authority, retains original EVIDENCE
  subjects, and fails closed instead of promoting synthetic offline records to live
  authority.
assumptions:
- Canonical main reconciled to 533655907fc4e39c76a128557d387d24eb116bbe after Human/Brain
  VP-03 NEXT planning transition. TASK-332 is the approved bounded next slice within
  VP-03 and its AUTHOR_TASK/PRIMARY must independently enforce fresh expected-main/CAS.
- TASK-331 r1 RUN-331-001 REVIEW-331-001 PASS, exact reviewed source 5d7a372b32d482f926b5dab8bfa7fa24484622ad
  included in canonical main. Runtime's 106 focused passes are historical evidence
  for TASK-331, not verification of TASK-332.
- TASK-330 VP-03A and TASK-331 VP-03B expose read-only content authentication and
  checkpoint applicability under an externally trusted canonical-source catalog. Their
  constructors do not authenticate catalog issuer or Human/Runtime/Reviewer legitimacy;
  an absent real issuer cannot be treated as VALID.
- The Human explicitly selected Codex GPT-6.1 Sol xhigh for TASK-332 through its entire
  lifecycle including CODE_FIX REPAIR and REMEDIATION; delegation is operational and
  does not appear in this executor-neutral TASK semantic payload.
- KA-01 prospective design remains NOT_ACTIVATED; VP-01 remains DEFERRED_NOT_WAIVED;
  VP-02 and whole VP-03 exits remain gated; current minimum-sufficient-v2 is still
  the active policy. No automatic promotion to VP-04.
- New AIOS-renew revision-1 TASK authoring retains Human-approved LEGACY_REPOSITORY_DEFAULT_ROUTE;
  downstream adoption and preexisting return affinities remain unchanged.
