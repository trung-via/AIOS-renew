task_id: TASK-146
revision: 1

goal: >
  Restore a green deterministic full-suite baseline under Runtime-owned verification on Windows
  without weakening repository safety checks, so blocked tasks such as TASK-145 can be verified
  against canonical current behavior rather than failing on verification-environment artifacts
  and stale assertions.

problem: >
  TASK-145 RUN-145-001 produced a clean transportable candidate
  80f54e767b2a86e59f9b4b135430d229ed10059e and passed both focused Unified State commands:
  14 passed / 28 deselected and 42 passed. The final Runtime-owned full suite failed with
  28 unrelated failures (1173 passed). The dominant deterministic cause is Windows verification
  TEMP/TMP/TMPDIR isolation under .git/aios/verification/.../temporary. Pytest tmp_path therefore
  creates test workspaces inside the canonical repository ancestry. Smoke helpers intentionally
  reject such workspaces, and Git commands from a nominal "non-git" tmp directory discover the
  enclosing canonical .git, producing false-positive repository detection. Additional failures are
  stale tests relative to already-canonical behavior: Brain Sync still expects the completed
  control-plane-closure track although .ai/roadmap-state.yaml now declares active_track
  brain-portability; Brain Ingress workflow tests still assume one dispatch and pre-REPAIR receipt
  env although the workflow now has separate safe publication and REPAIR wakeup dispatches; and
  three Antigravity operator assertions still expect the obsolete prompt/read-only command contract
  already identified during TASK-144 verification. These failures are outside TASK-145 r1 scope,
  so repairing RUN-145-001 cannot make its required full suite green.

assumptions:
  - Canonical main is b42b226ee078318b763f5e9079ab6c8e8977d32d.
  - RUN-145-001 failure artifact is 91299d9ccba8edb2155d0915f918b548941c0062.
  - RUN-145-001 focused Unified State verification is green and its changed_files are exactly
    src/aios_renew/unified_state.py and tests/test_operator_unified_state.py.
  - TASK-145 remains paused at AUTHOR_REPAIR; do not author or execute its repair until this blocker is published.
  - Runtime must continue to own canonical verification and raw evidence storage.
  - Smoke workspace guards that reject canonical-repository descendants are safety behavior and must not be weakened.

scope:
  inspect:
    - src/aios_renew/verification.py
    - tests/test_verification.py
    - scripts/antigravity_smoke.py
    - scripts/codex_smoke.py
    - tests/test_antigravity_smoke.py
    - tests/test_codex_smoke.py
    - .ai/roadmap-state.yaml
    - src/aios_renew/brain_sync.py
    - tests/test_brain_sync.py
    - .github/workflows/aios-brain-ingress.yml
    - tests/test_github_issue_ingress_workflow.py
    - src/aios_renew/antigravity_adapter.py
    - tests/test_operator.py
    - .github/workflows/aios-self-hosted-wakeup.yml
    - tests/test_self_hosted_wakeup.py
    - refs/heads/aios/failure-artifacts/RUN-145-001
  modify:
    - src/aios_renew/verification.py
    - tests/test_verification.py
    - tests/test_brain_sync.py
    - tests/test_github_issue_ingress_workflow.py
    - tests/test_operator.py

non_goals:
  - Modify TASK-145 candidate, TASK-145 Unified State implementation, or RUN-145-001 artifacts.
  - Modify TASK-144 or TASK-140 lineage/artifacts.
  - Relax smoke workspace isolation so nested workspaces inside the canonical repository become allowed.
  - Remove Runtime ownership of verification or raw evidence.
  - Change Brain roadmap semantics, Brain Ingress production workflow behavior, Antigravity production behavior,
    or self-hosted wakeup production behavior merely to satisfy stale tests.
  - Ignore or whitelist failing full-suite tests.
  - Introduce task/run-specific exceptions.

constraints:
  hard:
    - >
      On Windows, Runtime verification must set TEMP/TMP/TMPDIR to one per-execution isolated directory
      that is outside the verified repository ancestry and outside its .git directory. Raw verification
      evidence may remain under canonical Runtime state, but volatile test temporary files must not inherit
      the repository's Git ancestry.
    - >
      The isolated Windows temp directory must be created before commands execute, shared by all commands
      in one verification execution, not mutate the parent process environment, and be cleaned deterministically
      after verification completes or fails. Failure to create or clean the isolation boundary must fail closed.
    - >
      Preserve exact command order, cwd=subject repository, strict UTF-8 capture, exit-code semantics,
      raw evidence generation, stop-on-first-failure, and all existing verification evidence contracts.
    - >
      Do not weaken scripts/antigravity_smoke.py or scripts/codex_smoke.py protections that require smoke
      workspaces to be outside the canonical repository. Their tests should pass because Runtime temp placement
      is corrected, not because the guards are removed.
    - >
      The self-hosted wakeup non-git-root regression must again test a directory with no enclosing Git ancestry;
      do not weaken the production preflight check.
    - >
      Update the Brain Sync live-repository smoke so it is grounded in the current repository-owned roadmap
      contract rather than the obsolete literal control-plane-closure state. Preserve assertions that the
      observation is read-only and structurally consistent with the current active track/next-item semantics.
    - >
      Update Brain Ingress workflow tests to the already-canonical two-dispatch design: one safe publication
      workflow dispatch when publication_run_id is present and one separate safe REPAIR wakeup dispatch when
      repair_sha is present. Validate the bounded receipt environment and success closure semantics for both
      dispatch channels; do not reduce safety assertions or allow issue prose to become dispatch authority.
    - >
      Update the three stale Antigravity assertions identified by the RUN-145-001 full-suite failure to the
      current canonical contract only: the structural finish instruction must preserve exactly-once terminal
      finish/no conversational terminal prose semantics without requiring the obsolete literal "only response";
      read-only native Antigravity execution intentionally omits --mode and does not use
      --dangerously-skip-permissions; FINALIZE_CANDIDATE read-only Antigravity uses the same no-mutation policy.
      Do not change Antigravity production behavior.
    - >
      Do not modify tests/test_antigravity_smoke.py, tests/test_codex_smoke.py, or tests/test_self_hosted_wakeup.py
      unless the corrected Runtime temp boundary exposes a separate deterministic defect that cannot be fixed
      within the authorized production verification layer.
    - >
      Full-suite success must be achieved by fixing deterministic causes and aligning stale assertions to
      canonical behavior, never by skipping, xfail, filtering, retrying, or weakening tests.

acceptance:
  - id: AC1
    condition: >
      Windows Runtime verification temporary roots are outside canonical Git ancestry, isolated per execution,
      shared across that execution's commands, and deterministically cleaned without affecting raw evidence.
  - id: AC2
    condition: >
      Antigravity and Codex smoke suites pass under Runtime-owned verification without weakening their
      outside-canonical-workspace guard, and the self-hosted non-git-root preflight regression behaves correctly.
  - id: AC3
    condition: >
      Brain Sync live-repository smoke reflects the current repository-owned brain-portability roadmap
      deterministically without hardcoding obsolete completed-track state.
  - id: AC4
    condition: >
      Brain Ingress workflow tests prove both safe dispatch channels and bounded receipt/close behavior against
      the current canonical workflow, with no direct semantic authority from issue prose.
  - id: AC5
    condition: >
      The three stale Antigravity operator assertions are aligned to the current no-mutation/structural-finish
      contract with production behavior unchanged.
  - id: AC6
    condition: >
      Focused verification-layer tests, smoke/workflow/operator regressions, the complete pytest suite,
      and git diff --check pass with zero unresolved items.

verification:
  required:
    - python -m pytest -q tests/test_verification.py
    - python -m pytest -q tests/test_antigravity_smoke.py tests/test_codex_smoke.py tests/test_self_hosted_wakeup.py
    - python -m pytest -q tests/test_brain_sync.py tests/test_github_issue_ingress_workflow.py
    - python -m pytest -q tests/test_operator.py -k "antigravity_instruction_returns_structural_package_to_runtime or read_only_antigravity_execution_has_no_mutation_capability or finalize_candidate_recovers_structural_package_without_mutation"
    - python -m pytest -q
    - git diff --check
