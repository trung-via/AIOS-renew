non_goals:
- No KA-01 activation, future TASK schema/version change, V1/V2 policy cutover, Runtime
  proof scheduler, preterminal checkpoint, same-RUN feedback, automatic repair, retry,
  fallback, broader verification or full-suite requirement.
- No new telemetry database, canonical lifecycle/proof/evidence store, always-on service,
  agent, workflow router, provider selector, parallel metric pipeline or separate
  Reviewer/Publisher.
- No modification of existing TASK-326/TASK-328 proof validators, V1/V2 historical
  artifacts, canonical RUN/FAILURE/RESULT/REVIEW/EVIDENCE authority, Runtime verification
  internals, planning roadmap, downstream pin or origin routing.
- No claim of measured Lean VP speedup, causal benefit, cost in dollars, full episode
  time or executable proof coverage where canonical source data is absent; future
  live conformance for R2.1 remains an independent observed fact when available.
- No independent transport/checkout/review/publication timing inference from Git commit
  timestamps, operational receipts, or EXECUTOR claims; no private traces, paths,
  logs, model responses or unauthorized records in a portable baseline.
constraints:
  hard:
  - Use the existing authenticated read-only RemotePerformanceSnapshot / bound canonical
    terminal RUN_OBSERVATION path as the sole truth source for new baseline readiness.
    New projection must not independently retrieve, persist, mutate or create RUN/RESULT/FAILURE/EVIDENCE
    or choose a current task.
  - Expose existing observed durations (admitted RUN, Executor, Runtime verification),
    outcome/task/executor counts, and provider-neutral input/cached/output tokens
    only together with exact sample coverage and missingness. Distinguish absence
    from observed zero; reject conflicting, stale, forged or cross-RUN terminal bindings
    before computing baseline metrics.
  - Represent other required whole-episode dimensions (collection/unique/duplicate
    test items, Git/fixture/worker startup, checkpoint/applicability, transport/Human/review/publication
    time and costs) as typed UNKNOWN/UNAVAILABLE/PARTIAL when not authenticated from
    these sources. No filename/command/nodeid heuristics for equivalence, fabricated
    dollar costs, arithmetic estimates presented as measurements, or UNKNOWN-to-PASS
    conversion.
  - Reuse the published PerformanceObservation v1 API/projection unmodified for historical
    consumers; additive bounded read-only L1 view may compose the existing validated
    summary/terminal snapshot, but may not create a second canonical metric source,
    duplicate raw terminal transport access or weaken existing integrity validation.
  - "Create a bounded and reviewable Lean VP L1 baseline gap/readiness document with\
    \ exact source/task sampling method, disclosed coverage denominators, OBSERVED\
    \ versus UNKNOWN metric inventory, inherited TASK-326/TASK-328 proof contract\
    \ compatibility, and separate L2/L3/KA-01 prerequisites. Do not state that L1,\
    \ VP-01, KA-01 G1\u2013G6 or the whole Lean program has passed merely from documentation\
    \ or focused tests."
  - Target only the three listed modify paths. Keep the output privacy-safe, strict,
    deterministic and provider-neutral with adversarial tests for missing observation,
    partial timing/tokens, forged source, inconsistent sample coverage, historical
    v1 compatibility, zero/nonzero values and duplicate/moved identifiers.
  - Human owns future risk/opt-in/Executor selection, Brain owns semantic proof intent,
    one admitted Executor owns implementation HOW, Runtime owns verification and evidence,
    Reviewer semantic PASS/changes and Publisher exact reviewed-source publication.
    New baseline cannot become a scheduling, semantic mapping, or lifecycle decision
    authority.
acceptance:
- id: AC1
  condition: A deterministic bounded read-only L1 baseline readiness projection accepts
    only the already authenticated canonical terminal-performance snapshot and exact
    TASK selector set, and exposes a stable source/provenance binding without a second
    observation or persistent authority.
- id: AC2
  condition: The projection surfaces the already observed RUN/Executor/verification
    durations, per-family result counts and input/cached/output-token samples with
    explicit per-metric coverage denominators; missing and partial data cannot appear
    as measured zero.
- id: AC3
  condition: The projection enumerates critical whole-episode and proof-work dimensions
    that existing authenticated inputs cannot establish, assigning explicit UNKNOWN/UNAVAILABLE/PARTIAL
    rather than manufactured exact times, costs, node counts, equivalence or comparative
    speedup.
- id: AC4
  condition: Historical PERFORMANCE_OBSERVATION v1 decoding, shape, canonical terminal/source
    integrity checks, unsupported/older observation semantics and Runtime-owned RUN_OBSERVATION
    transport remain byte/behavior compatible under the additive view.
- id: AC5
  condition: A concise L1 baseline/readiness document identifies actual available
    observation samples and coverage limitations, preserves VP-01 as an outstanding
    measurement dependency, reuses TASK-326/TASK-328 proof foundations, and specifies
    independently verifiable entry gaps before L2/L3 or any KA-01 opt-in.
- id: AC6
  condition: Focused regression fixtures cover legitimate complete/partial/missing
    inputs, zero versus missing values, stale/cross-RUN/fake terminal identities,
    conflicting counters, boundedness/privacy and no mutation/verification/provider
    invocation from the L1 projection.
- id: AC7
  condition: The implementation and source delta stay within the three authorized
    files, introduce no production verification/admission/feedback/correction behavior,
    preserve one Runtime proof authority and leave all historical tasks, R2.1 live-proof
    state, KA-01 activation and roadmap planning unchanged.
