task_id: TASK-373
revision: 1
goal: Deliver the first bounded Lean VP L1 baseline and proof-contract readiness slice.
  Reuse existing canonical RUN_OBSERVATION / PERFORMANCE_OBSERVATION and already-reviewed
  TASK-326 proof-coverage and TASK-328 offline intra-RUN foundations to expose a trustworthy,
  read-only, source-bound baseline readiness view for future matched Lean VP episode
  measurements. Distinguish OBSERVED, PARTIAL and UNKNOWN measurement dimensions and
  preserve every unmet VP-01 dependency; supply an actionable L2/L3 input gap inventory
  without activating KA-01, changing production verification, or adding a new telemetry
  store.
problem: 'Human closed R2.1 in canonical planning on 2026-10-18 with real-provider
  live conformance explicitly deferred to later lawful TASK episodes and selected
  Lean VP as sole NEXT. Existing first-party performance_observation.py already binds
  terminal RUN_OBSERVATION and aggregates elapsed RUN/Executor/verification time,
  executor operation counts, token and cached-token coverage. That is not yet an auditable
  full-episode comparative Lean VP baseline: phase-missingness, review/publication/handoff
  and Git/pytest startup intervals, actual executed/unique/equivalent test item counts
  and evidence applicability are not all observable from this data. TASK-326 and TASK-328
  separately cover offline semantic proof/feedback contracts; reimplementing those
  or claiming speculative speedups would be wasteful. Begin with the minimum truthful
  baseline/readiness projection and bounded gap documentation rather than introducing
  a new Runtime proof scheduler.'
assumptions:
- Fresh authoritative main at TASK authoring is d5fbb3153bf553e67d7da91f3ba034a6c7502939,
  containing the exact Human/Brain R2.1 closure and Lean VP NEXT, while TASK-373 does
  not yet exist. Runtime must independently enforce expected-main/CAS and TASK shape/affinity.
- R2.1 published TASK-363/364/366/367/368/369 remains historical engineering truth.
  Its deferred independent live conformance is UNKNOWN, not PASS, and no R2.1 reimplementation
  or retrospective status rewrite is within TASK-373.
- Existing src/aios_renew/run_observation.py provides exact RUN operational duration/token
  observation with partial/missingness; src/aios_renew/performance_observation.py
  authenticates terminal sources and produces read-only bounded aggregate summaries.
  Reuse their production consumers without a parallel collector, metric database or
  raw private access.
- Published TASK-326 proof_coverage_contract.py and TASK-328 intra_run_proof_contract.py
  are bounded offline foundations. KA-01 prospective design remains NOT_ACTIVATED
  and G1-G6, VP-01 measurements and separate Human versioned opt-in are not discharged
  by this TASK.
- Prospective TASK_AUTHORING semantic profile is the canonical tca-1 v1 exact digest
  1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2. This TASK's audit
  outcome is Brain semantic support, not an authoring, execution, review, or publication
  authority.
- The standing Human return-affinity choice on this repository is LEGACY_REPOSITORY_DEFAULT_ROUTE
  until a distinct authorized cutover; no Executor/model/effort or KA-01 opt-in is
  selected by this TASK.
- 'Previous Issue #2114 is a historical pre-job carrier failure bound to an older
  expected main; TASK-375 / REVIEW-375-001 has subsequently published its scoped workflow
  correction at d5fbb3153bf553e67d7da91f3ba034a6c7502939. This fresh Issue is a new
  carrier attempt, not a retry/replay or reclassification of that failure; GitHub
  scheduling and Runtime canonicalization are independently observed after submission.'
