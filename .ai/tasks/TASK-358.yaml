task_id: TASK-358
revision: 1
goal: >-
  Deliver useful, bounded and trustworthy end-to-end FAILURE diagnostics through
  existing Runtime terminal records, BP-2 operational receipts, terminal attention,
  Unified State, fresh Brain Sync and authorized Executor-local private reading,
  with no new lifecycle authority or separate diagnostic service.
problem: >-
  The published failure diagnostic path can reject otherwise lawful execution
  FAILURE projection and may mask useful safe causes, leaving Humans to manually
  extract private logs. A normal dirty candidate, native timeout with unknown
  exit code, lawful quoted pytest selector and legitimately incomplete historical
  observation need correct bounded diagnostics, exact identity binding and safe
  transport. The implementation must be established from published canonical
  source and independently verifiable synthetic cases, not unreviewed past candidates.
assumptions:
  - >-
    This is a new independent TASK revision 1 against canonical published main
    current at AUTHOR_TASK admission. Runtime must recheck expected-main CAS,
    identity, exact scope and source clean admission. No previous candidate, patch,
    bundle, staged RESULT, private worktree or failed RUN becomes implementation
    base, canonical proof or correction authorization.
  - >-
    Existing Runtime FAILURE and evidence remain engineering truth; BP-2 handles
    pre-AIOS operational failure; existing attention/Brain Sync/provider channels
    may expose safe diagnostic facts, but never raw private capture.
  - >-
    Existing terminal lineage, including legitimately incomplete historical V2
    observations, remains immutable and non-PASS unless originally proven.
  - >-
    This TASK is independent of any separate execution-budget change and does
    not require a particular native response timeout to establish its outcomes.
