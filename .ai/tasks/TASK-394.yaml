task_id: TASK-394
revision: 1
goal: 'Deliver P1 Scalable Evidence Retrieval over existing authoritative Runtime
  verification FAILURE: allow an ordinary Brain Sync/attention reader to discover
  and request subsequent bounded, authenticated, privacy-safe failed-test pages for
  difficult runs with many observed errors without copying raw logs into provider
  context or creating an independent evidence store.'
problem: The current safe_failure_detail and FAILURE_CONTEXT carry no more than 32
  failures and expose no authenticated next-page selector. Large pytest populations
  leave Brain unable to inspect errors beyond first page, including when Human cannot
  run local scripts; a higher one-shot limit would amplify secrets/size, while original
  4096 failure_count validation and incomplete text semantics risk misleading conclusions.
  Extend existing source-bound projection/retrieval minimally, after P0.
assumptions:
- Human's current 2026-10-21 priority approves P0 then P1 after TASK-392 published,
  not Lean VP automatic roadmap NEXT advancement. Task 394 is prospective now; EXECUTION
  OF TASK-394 IS BLOCKED until TASK-393 has a canonical Runtime RESULT, independent
  REVIEW PASS and exact Publisher publication. Task-394 authoring does not assert
  P0 implementation, prove it, or allow automatic dispatch.
- Canonical main bound to authoring SHA 547233f4d23305c4765dbbb692660e60890a9f23 contains
  authoritatively authored TASK-393 r1 P0 with 6 acceptance criteria and V1 verification.
  The TASK-393 authoring ingress receipt was CANONICALIZED; no RESULT/REVIEW/PUBLICATION
  for Task393 has been observed and cannot be presumed. Re-read exact predecessor's
  finally published source before admitted Task394 execution and repair any lawful
  new source/scope conflict with explicit Human/Brain authoring, never silently broaden.
- TASK-392 r1 / RUN-392-001 / REVIEW-392-001 was published at prior main 86e9a3287b1a5b336275a28c173cf835e9c2366d.
  R2.1 historical TCA-1 v1 remains the currently approved/default TASK_AUTHORING profile;
  TCA-2 and ROA successor registry entries introduced by TASK-392 are not activated
  merely by publication.
- Existing public FAILURE safe_detail exposes only first 32 error node identities;
  no complete safe pagination in authenticated Git-only Brain Sync. Existing self-host
  local reader can add bounded projection for UNAVAILABLE but cannot satisfy portable
  cross-page retrieval alone. New work must reuse exact Runtime FAILURE/source/transport
  and Brain attention path, not invent independent lifecycle evidence.
- Current canonical MAX_CANONICAL_FAILURES is 10000, while safe_detail validator's
  failure_count ceiling is 4096; source-derived full population and display/status
  must remain distinct. Historical pre-P0 failures lack prospective manifest and must
  not be reconstructed by guess or mutated.
- Human has not provided a new Executor/model/effort approval specific to TASK-394;
  task authoring and publication dependency do not grant execution delegation.
