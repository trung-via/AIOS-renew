task_id: TASK-087
revision: 1

goal: >
  Implement Unified Human Surface as one thin deterministic Human-facing front door over
  the published TASK-086 Unified State + Next Action reducer. A Human should be able to
  invoke one stable TASK-oriented command, have AIOS derive the exact current lifecycle
  action, and either delegate at most one already-authoritative Runtime operation or return
  a bounded handoff to the authority that must act next. The surface must reduce manual
  selection among PRIMARY, REMEDIATION, REPAIR, transport retry, and PRIMARY recovery
  commands without becoming a Planner, semantic Reviewer, correction author, publisher,
  Executor selector, retry loop, or new source of lifecycle truth.

problem: >
  TASK-086 now deterministically reduces one current canonical TASK revision to exactly one
  next_action, but the Human must still translate that machine state into different low-level
  operator commands. This translation is repetitive and error-prone: the Human may choose
  run when a repair is required, rerun work whose terminal state only needs transport, or
  manually reconstruct source RUN/finding/failed RUN selectors already present in Unified
  State. The missing boundary is a small Human-facing adapter that consumes the established
  state reducer and delegates the exact existing operation once. It must not infer semantic
  work that TASK-086 intentionally leaves to Brain, Reviewer, or Publisher, and it must not
  hide Executor selection or introduce automatic continuation loops.

assumptions:
  - >
    Canonical AIOS-renew main immediately before TASK-087 authoring is
    8fb96ee2ff661f4b410ef257d025cca2bd0d57ee. Its parent planning lineage contains the
    semantically reviewed and published TASK-086 source candidate
    e56abece22509dc6e7f4d3b641c9d5600798ec67.
  - >
    REVIEW-086-006 is canonical DELTA PASS for RUN-086-006 at exact reviewed SHA
    e56abece22509dc6e7f4d3b641c9d5600798ec67 with no findings. Unified State + Next Action
    is therefore established engineering truth and TASK-087 consumes it rather than
    recreating lifecycle reduction.
  - >
    `.ai/roadmap-state.yaml` records `unified-state-next-action` DONE by TASK-086 at
    published SHA e56abece22509dc6e7f4d3b641c9d5600798ec67 and
    `unified-human-surface` as the unique NEXT item. TASK-087 does not advance that bookmark;
    later advancement requires TASK-087 semantic PASS publication and a separate Human/Brain
    planning-state update.
  - >
    Existing `aios run`, `remediate`, `repair`, `transport`, and `recover-primary` remain
    canonical operational boundaries. TASK-087 adds a front door over those boundaries; it
    does not replace or weaken their admission, synchronization, verification, failure,
    correction, transport, or recovery semantics.
  - >
    Human invocation of the unified front door is execution authorization only for an
    already-derived Runtime-owned action. Brain still owns correction authoring, Reviewer
    owns semantic review, Publisher owns publication, and Human retains explicit Executor
    choice whenever a coding Executor is required.
  - >
    Executor recommendation/model ranking is not established canonical authority. The
    current frozen/roadmap state defers automatic routing/model scoring, so this TASK may
    report that an Executor is required and the allowed Executor identities but must not
    recommend, rank, infer, default, or select one.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-ROADMAP.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-062.yaml
    - .ai/tasks/TASK-063.yaml
    - .ai/tasks/TASK-067.yaml
    - .ai/tasks/TASK-071.yaml
    - .ai/tasks/TASK-081.yaml
    - .ai/tasks/TASK-083.yaml
    - .ai/tasks/TASK-085.yaml
    - .ai/tasks/TASK-086.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/publication.py
