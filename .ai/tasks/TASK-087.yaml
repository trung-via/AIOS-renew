non_goals:
  - Reimplement, fork, approximate, or broaden TASK-086 lifecycle reduction or its fixed
    next_action taxonomy.
  - Add a Planner, semantic policy engine, autonomous agent loop, scheduler, daemon, queue,
    generic arbitrary-operation router, multi-agent supervisor, or new canonical state
    machine.
  - Author or modify TASK, REVIEW, finding, REMEDIATION, REPAIR, RESULT, FAILURE, EVIDENCE,
    Admission Failure, approval, dispatch, correction-dispatch, publication, or roadmap
    artifacts merely because the front door observes that their authority is next.
  - Perform semantic review, predict review verdicts, author REMEDIATION/REPAIR, integrate a
    divergent candidate, or publish from the unified Human surface.
  - Recommend, rank, score, infer, default, or automatically select Codex versus Antigravity,
    a model name, effort level, timeout, sandbox, permission mode, or fallback Executor.
  - Retry, reroute, fail over, poll, wait-and-resume, recursively continue, or execute more
    than one lifecycle operation from one Human invocation.
  - Replace or remove existing low-level `aios run`, `remediate`, `repair`, `transport`,
    `recover-primary`, `state`, preflight, wakeup, approval, correction-wakeup, or
    accept-candidate commands.
  - Make A3 Human approval or A6 correction-dispatch state mandatory for direct local Human
    correction execution; those remain optional outer-automation surfaces.
  - Add or modify GitHub Actions workflows, downstream repository pins, Python Agent code,
    `.ai/roadmap-state.yaml`, or `docs/AIOS-ROADMAP.md` as implementation work.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Expose one stable TASK-oriented CLI front door named `aios continue <TASK_ID>` with an
      optional explicit `--executor {codex,antigravity}` and existing `--repo` targeting
      semantics. The command must resolve the TASK from the current control repository and
      call the existing TASK-086 Unified State reducer exactly as the lifecycle authority for
      deciding the current next_action; it must not maintain a second action-selection table
      based on raw RUN/ref/file recency or error prose.
    - >
      One invocation may delegate at most one canonical operation. The only executable
      mappings are: `EXECUTE_PRIMARY` -> existing PRIMARY execution semantics;
      `EXECUTE_REMEDIATION` -> existing exact canonical REMEDIATION semantics;
      `EXECUTE_REPAIR` -> existing exact canonical REPAIR semantics; `RETRY_TRANSPORT` ->
      existing terminal transport retry; and `RECOVER_PRIMARY` -> existing exact PRIMARY
      recovery. After that delegated operation returns or fails, the front door must stop. It
      must not re-observe and chain the next lifecycle action automatically.
    - >
      `SEMANTIC_REVIEW` must return a bounded Reviewer handoff, `AUTHOR_REMEDIATION` and
      `AUTHOR_REPAIR` must return bounded Brain handoffs, and `PUBLICATION` must return a
      bounded Publisher handoff. These states invoke no Runtime mutation, model, semantic
      review, correction authoring, Git integration, or publication. `WAIT` and `DONE` return
      bounded no-action outcomes. Unified State `NONE`/BLOCKED returns the exact bounded
      blocker already derived by TASK-086 and performs no fallback operation.
    - >
      A coding Executor is required only when the selected operation is PRIMARY,
      REMEDIATION, or CODE_FIX/ordinary Executor-backed REPAIR. If such an operation requires
      an Executor and `--executor` is absent, return a bounded `EXECUTOR_REQUIRED` outcome
      before RUN admission and invoke zero Executors. The surface may expose the fixed allowed
      identities `codex` and `antigravity`, but it must not choose, recommend, rank, default,
      remember, or infer one. A supplied Executor argument on a state that does not require a
      coding Executor has no authority and must never cause an Executor invocation.
    - >
      TASK-064 verification-only eligible NO_CHANGE REPAIR retains its existing zero-Executor
      behavior. Supplying `--executor` for the unified command must not force a coding call on
      that path, while omission of `--executor` must not block a deterministically
      Executor-elided NO_CHANGE continuation when the existing REPAIR admission contract
      proves that no Executor will be invoked. Do not duplicate or weaken reusable-candidate
      eligibility checks in the Human surface.
    - >
      The state observation is informative, not cached admission authority. Every delegated
      operation must pass through its existing canonical admission/revalidation boundary.
      Exact selector identities already surfaced by TASK-086 must be preserved: remediation
      execution must remain bound to source RUN, finding and observed remediation commit SHA;
      repair execution must fail closed before RUN creation if the canonical repair selector
      no longer matches the exact repair commit SHA observed by Unified State. A ref move or
      lineage change between observation and admission is a new state, never permission to
      execute different correction content.
    - >
      `EXECUTE_PRIMARY` must preserve TASK-062 pre-admission synchronization and restart
      semantics. If synchronization requires process restart, the restarted request must
      re-enter the same unified Human command and derive current state again rather than
      bypassing Unified State or blindly entering PRIMARY with the pre-sync decision.
    - >
      Transport retry and PRIMARY recovery must preserve their exact RUN selectors and
      existing deterministic validation. The front door must not convert transport gaps into
      re-execution, convert recovery conflicts into a fresh PRIMARY, choose another RUN by
      numeric/lexicographic recency, or create a repair/remediation as a substitute.
    - >
      Provide one versioned allowlisted machine-readable Human-surface result format, e.g.
      `AIOS_HUMAN_SURFACE` version 1, for both delegated and non-delegated outcomes. It must at
      minimum bind TASK id/revision, the TASK-086 observed next_action, a bounded disposition,
      the authority owner, the delegated operation when any, exact already-known selector
      identities needed to explain the action, whether an Executor was required/supplied, and
      the resulting RUN/head identity when an existing delegated summary provides one. Do not
      include raw prompts, Executor text, logs, credentials, environment dumps, arbitrary
      paths, unrestricted Git output, or full artifact contents.
    - >
      The allowlisted disposition set must distinguish at least `DELEGATED`,
      `EXECUTOR_REQUIRED`, `EXTERNAL_AUTHORITY_REQUIRED`, `NO_ACTION`, and `BLOCKED`. The
      authority field must be bounded to Runtime, Brain, Reviewer, Publisher, Human, or None
      semantics and must not imply that this surface acquires another role's authority.
    - >
      Failure taxonomy remains unchanged. If a delegated canonical operation rejects before
      RUN admission, its existing Admission Failure v2 behavior remains authoritative; if an
      admitted RUN fails, its ordinary RUN FAILURE remains authoritative. The Human surface
      must not create a second failure artifact, translate a RUN failure into an Admission
      Failure, synthesize RESULT/EVIDENCE, or retry after either category.
    - >
      Unified State observation itself remains read-only exactly as established by TASK-086.
      Before a delegated operation begins, the Human surface creates no RUN, lease, handoff,
      RESULT, FAILURE, EVIDENCE, correction, review, publication, roadmap, dispatch, or
      correction-dispatch artifact. Non-delegated outcomes create none of those artifacts and
      invoke zero canonical verification commands.
    - >
      Existing low-level commands retain their current syntax and behavior. The new front
      door is a thin optional Human convenience layer, not a prerequisite for direct operator
      usage, A1/A3/A6 workflows, Runtime completion, review transport, safe publication, or
      downstream consumers.
    - >
      README must document the one-command Human flow, exact mapping to existing authorities,
      when `--executor` is required, the explicit absence of Executor recommendation/default,
      the one-operation-per-invocation rule, fail-closed selector movement, and examples of
      Reviewer/Brain/Publisher/no-action handoffs. Documentation must make clear that
      `aios state` remains the read-only inspection surface and that TASK-087 does not yet
      perform downstream migration or autonomous Brain/Reviewer work.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A fresh TASK whose Unified State is `EXECUTE_PRIMARY` proves `aios continue TASK-X
      --executor <explicit>` delegates exactly one ordinary PRIMARY operation with the same
      admission, one-Executor, Runtime verification, RESULT/EVIDENCE and failure semantics as
      direct `aios run`, and emits one bounded versioned Human-surface result.
  - id: AC2
    condition: >
      Deterministic correction regressions prove `EXECUTE_REMEDIATION` delegates exactly the
      source RUN/finding/remediation SHA selected by Unified State and `EXECUTE_REPAIR`
      delegates exactly the failed RUN/repair selector selected by Unified State. A moved or
      changed correction selector between observation and admission fails closed before a new
      RUN rather than executing changed content.
  - id: AC3
    condition: >
      `RETRY_TRANSPORT` delegates only existing terminal transport and `RECOVER_PRIMARY`
      delegates only exact existing PRIMARY recovery, with zero coding Executor selection or
      invocation and no conversion into fresh execution/correction behavior.
  - id: AC4
    condition: >
      `SEMANTIC_REVIEW`, `AUTHOR_REMEDIATION`, `AUTHOR_REPAIR`, and `PUBLICATION` return
      versioned `EXTERNAL_AUTHORITY_REQUIRED` outcomes identifying the correct Reviewer,
      Brain, or Publisher authority and exact bounded lineage identities, while creating no
      RUN/artifact mutation, model call, verification, correction, review, integration, or
      publication side effect.
  - id: AC5
    condition: >
      `WAIT` and `DONE` return `NO_ACTION`, and BLOCKED/`NONE` returns `BLOCKED` with the
      TASK-086 bounded blocker, without invoking an Executor or any mutating lifecycle
      operation even when `--executor` was supplied.
  - id: AC6
    condition: >
      Executor-required regressions prove PRIMARY, REMEDIATION, and Executor-backed REPAIR
      cannot begin without an explicit Human `--executor`; the missing choice returns
      `EXECUTOR_REQUIRED` with zero RUN/Executor. No path recommends, ranks, defaults, or
      silently reuses an Executor. An eligible TASK-064 NO_CHANGE verification-only REPAIR
      remains able to proceed with zero Executor and does not gain a spurious coding call.
  - id: AC7
    condition: >
      A PRIMARY synchronization regression proves the unified command preserves TASK-062
      safe sync/restart behavior and re-enters Unified State after restart, so a state change
      discovered by synchronization cannot be executed under a stale pre-sync action.
  - id: AC8
    condition: >
      One-operation-per-invocation regressions prove a successful delegated PRIMARY,
      REMEDIATION, REPAIR, transport, or recovery stops after that operation; the surface does
      not automatically review, author corrections, publish, retry, reroute, poll, or execute
      the newly derived next action.
  - id: AC9
    condition: >
      Delegated pre-RUN rejection and admitted RUN failure regressions preserve the existing
      Admission Failure v2 versus RUN FAILURE distinction and canonical artifacts exactly,
      with no duplicate Human-surface failure authority or automatic second attempt.
  - id: AC10
    condition: >
      Existing direct `aios state`, `run`, `remediate`, `repair`, `transport`,
      `recover-primary`, preflight, wakeup, approval, correction-wakeup, and accept-candidate
      focused regressions remain behaviorally compatible; the new surface is optional and
      changes none of their authority boundaries.
  - id: AC11
    condition: >
      README and CLI regressions establish the stable `aios continue <TASK_ID>` grammar,
      bounded `AIOS_HUMAN_SURFACE` versioned output, authority/disposition semantics, explicit
      Human Executor choice, exact selector fail-closed behavior, and the absence of planner,
      reviewer, correction-authoring, publisher, retry/fallback/reroute, downstream migration,
      workflow, or roadmap mutation authority.

verification:
  required:
    - python -m pytest tests/test_operator.py -q
    - git diff --check
