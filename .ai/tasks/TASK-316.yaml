task_id: TASK-316
revision: 3
goal: Restore a trustworthy verification baseline required to resume BO-1 by repairing
  stale regression fixtures and test-harness assumptions exposed by RUN-313-005, and
  by restoring the published historical FINALIZE_CANDIDATE absent-reuse Executor fallback
  invariant, without changing BO-1 semantics.
problem: 'RUN-313-005 reached Runtime verification on the unchanged TASK-313 candidate
  dd287d11eeaed3ba4bccabcd992fcb1b831bc0a3 and the selected full suite reported 62
  failures. Bounded read-only diagnostics on that exact candidate show representative
  failures caused by baseline/test-contract drift rather than a demonstrated BO-1
  production regression: an AUTHOR_REMEDIATION control omits the still-required audited
  handoff; Brain provider/protocol fixtures serialize an obsolete Stage-2 shape instead
  of the current brain-high-value-v3 closed contract; the Brain Sync live smoke assumes
  a .git directory and is not linked-worktree aware; and wake-bridge regression tests
  hard-code historical artifact-count, event_id, and TASK-260 diff-to-HEAD assumptions.
  Separately, current-main diagnostics reproduce a historical FINALIZE_CANDIDATE preflight
  that is BLOCKED at REUSABLE_STATE_ADMISSION when reusable state is genuinely absent,
  contradicting the published TASK-314/TASK-315 invariant that absence uses the coding-Executor
  fallback while present invalid state fails closed. Until these baseline defects
  are corrected, TASK-313 full-suite verification cannot reliably discriminate BO-1
  regressions from pre-existing verification debt. RUN-316-001 then failed canonically
  at COMPLETION_GATE on candidate 43f9bdd022cee5752447e5fb3b1e05da351d59b5 because
  the required v3 provider/protocol baseline repair needs src/aios_renew/brain_provider_protocol.py,
  which revision 1 allowed only for inspection. Revision 2 corrects only that mutation-authority
  omission; it does not reinterpret the failure as an implementation defect or widen
  the baseline-recovery objective. Revision 3 changes only the verification contract
  from minimum-sufficient-v1 to minimum-sufficient-v2 and re-executes the same bounded
  baseline-recovery semantics from current canonical main; it does not widen scope
  or reinterpret RUN-316-002 as a correction authorization.'
assumptions:
- Canonical main at TASK-316 revision-3 authoring is f147f9fa463b3c512fa1a29f2517a198a2aa3342.
- RUN-313-005 is the current canonical TASK-313 verification failure and its failed
  candidate remains dd287d11eeaed3ba4bccabcd992fcb1b831bc0a3; TASK-316 does not rewrite,
  repair, supersede, or execute that lineage.
- TASK-314 and TASK-315 established the published invariant that an eligible same-head
  structural package may elide the coding Executor, genuine absence falls back to
  executor_required=true, and present malformed, stale, conflicting or otherwise invalid
  reusable state fails closed.
- Human-provided diagnostic runs motivate this bounded recovery but are not canonical
  verification evidence; Runtime verification remains authoritative.
- TASK-316 is a prerequisite baseline-recovery task. BO-1/TASK-313 resumes only after
  ordinary Runtime verification, semantic Review PASS and exact publication of the
  eligible TASK-316 candidate.
- RUN-316-001 canonically failed at COMPLETION_GATE because src/aios_renew/brain_provider_protocol.py
  is required to reconcile the current brain-high-value-v3 Stage-2 protocol contract
  but was outside revision-1 scope.modify; revision 2 changes only that scope authority.
- RUN-316-002 remains immutable historical verification evidence from revision 2.
  Revision 3 does not authorize a broad REPAIR of that historical 51-failure population;
  it re-executes the bounded TASK-316 objective from current canonical main under
  minimum-sufficient-v2 so Runtime can produce complete current attribution evidence.
scope:
  inspect:
  - .ai/tasks/TASK-313.yaml
  - .ai/tasks/TASK-314.yaml
  - .ai/tasks/TASK-315.yaml
  - src/aios_renew/operator.py
  - src/aios_renew/correction_preflight.py
  - src/aios_renew/authoring_ingress.py
  - src/aios_renew/brain_audit.py
  - src/aios_renew/brain_provider.py
  - src/aios_renew/brain_provider_protocol.py
  - src/aios_renew/brain_wake_bridge.py
  - .github/workflows/aios-brain-ingress.yml
  - .github/workflows/aios-brain-wakeup.yml
  - .github/workflows/aios-brain-repair-wakeup.yml
  - .github/workflows/aios-terminal-attention.yml
  - tests/test_operator_correction_preflight.py
  - tests/test_authoring_ingress.py
  - tests/test_aios_ingress_metadata_identity_diagnostic.py
  - tests/test_brain_provider.py
  - tests/test_brain_provider_protocol.py
  - tests/test_brain_sync.py
  - tests/git_fixture_support.py
  - tests/test_brain_wake_bridge_workflow.py
  modify:
  - src/aios_renew/operator.py
  - src/aios_renew/correction_preflight.py
  - tests/test_operator_correction_preflight.py
  - tests/test_authoring_ingress.py
  - tests/test_aios_ingress_metadata_identity_diagnostic.py
  - src/aios_renew/brain_provider_protocol.py
  - tests/test_brain_provider.py
  - tests/test_brain_provider_protocol.py
  - tests/test_brain_sync.py
  - tests/git_fixture_support.py
  - tests/test_brain_wake_bridge_workflow.py
non_goals:
- Change the AUTHOR_TASK behavior or implementation being developed by TASK-313, or
  alter its candidate, RUN, FAILURE, REPAIR, Review or publication lineage.
- Remove AUTHOR_REMEDIATION or AUTHOR_REPAIR audited-handoff requirements; BO-7 owns
  that later simplification.
- Weaken the brain-high-value-v3 Stage-2 closed semantic contract, provider protocol
  validation, correction reusable-state admission, or wake transport authority merely
  to make stale tests pass.
- Change the four production wake workflows named in scope.inspect to satisfy obsolete
  artifact-count, event_id, or historical TASK-260 assertions.
- Delete tests, add skip/xfail markers, suppress failures, or replace semantic assertions
  with tautologies solely to obtain a green suite.
- Implement BO-2 through BO-9, BO-7, TASK-310, H4 behavior, a new Planner, retry/failover
  router, Reviewer, Publisher, or lifecycle authority.
- Advance BO-1 roadmap completion, claim TASK-313 success, or reuse TASK-316 verification/review/publication
  as evidence for TASK-313.
constraints:
  hard:
  - Baseline tests must be reconciled to current reviewed/published contracts; production
    authority or safety semantics must not be weakened to preserve obsolete fixture
    expectations.
  - AUTHOR_REMEDIATION diagnostic coverage must model the currently required audited
    handoff and must not obtain PASS by bypassing or removing that gate.
  - Brain provider/protocol test support must emit the exact current brain-high-value-v3
    TASK_AUTHORING Stage-2 closed shape and retain negative tamper/fail-closed coverage
    rather than loosening production validation.
  - Shared Git fixture support must correctly resolve both ordinary repositories and
    linked worktrees without machine-specific paths or assumptions that .git/HEAD
    exists beneath the worktree root.
  - Wake-bridge tests must verify current semantic boundaries:bounded exact source
    selectors remain distinguishable from other workflow artifacts, and transport
    metadata does not become independent planning, lifecycle, review or publication
    authority. Historical exact artifact-count and TASK-260 diff-to-current-HEAD assumptions
    must not be treated as permanent architecture.
  - Historical FINALIZE_CANDIDATE with genuine absence of eligible reusable pre-verification
    state must remain READY with executor_required=true and no RUN or Executor invocation
    during preflight. Eligible reusable state may produce executor_required=false,
    while present malformed, stale, conflicting, incomplete or otherwise invalid state
    remains fail closed.
  - No modified regression may be deleted, skipped, xfailed or made vacuous merely
    to make verification green; preserved tests must continue to exercise the current
    invariant they represent.
  - If verification exposes an unrelated defect that cannot be corrected within scope.modify
    without new Human/Brain semantics, leave it unresolved and fail closed rather
    than widening mutation authority.
  - Executor changes only scope.modify and does not mutate roadmap planning, TASK-313
    artifacts, Reviewer verdicts or Publisher state.
acceptance:
- id: AC1
  condition: 'Historical FINALIZE_CANDIDATE preflight distinguishes ABSENT reusable
    state from PRESENT invalid state: absence preserves the explicit coding-Executor
    fallback with executor_required=true, eligible reuse may set it false, and invalid
    present state remains BLOCKED before RUN creation.'
- id: AC2
  condition: The AUTHOR_REMEDIATION diagnostic control represents the current correction
    authoring contract, including its audited-handoff requirement, without weakening
    production ingress semantics.
- id: AC3
  condition: Brain provider and provider-protocol regression fixtures represent the
    exact brain-high-value-v3 TASK_AUTHORING Stage-2 closed contract and continue
    to exercise stale, tampered and invalid-response fail-closed behavior.
- id: AC4
  condition: Shared Git fixture resolution works for both a normal .git directory
    and a linked-worktree .git indirection, so Brain Sync smoke coverage does not
    depend on a worktree-root .git/HEAD path.
- id: AC5
  condition: Wake-bridge regression coverage is bound to current transport semantics
    instead of historical artifact-count, forbidden-event_id or TASK-260 diff-to-current-HEAD
    assumptions, while preserving the rule that source transport metadata grants no
    semantic or lifecycle authority.
- id: AC6
  condition: 'The repaired baseline retains meaningful negative coverage: no affected
    test is deleted, skipped, xfailed, made tautological, or satisfied by weakening
    the production contract it is meant to protect.'
- id: AC7
  condition: Candidate changes remain within scope.modify and leave TASK-313 canonical
    candidate/correction lineage, BO-1 semantics, production wake workflows, Reviewer
    authority and Publisher authority unchanged.
verification:
  policy: minimum-sufficient-v2
  required:
  - python scripts/aios_parallel_full_suite.py
  - git diff --check
  full_suite_reason: TASK-316 repairs cross-cutting verification baseline contracts
    spanning correction preflight, authoring fixtures, Brain audit/provider fixtures,
    Git linked-worktree support and wake-bridge regressions; the selected full suite
    is required to prove the baseline is trustworthy before BO-1 resumes.
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
