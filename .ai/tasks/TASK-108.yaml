task_id: TASK-108
revision: 1

goal: >
  Add one bounded Brain-callable PRIMARY wakeup carrier for AIOS-renew so that,
  after the Human explicitly chooses the coding Executor, an authorized Brain may
  open one small GitHub Issue that causes repository-owned GitHub-hosted automation
  to dispatch the already-existing A1 self-hosted PRIMARY wakeup with the existing
  A2 durable dispatch identity. Remove the recurring Human requirement to open the
  Actions UI and click Run workflow, while preserving A1/A2 as the sole execution
  wakeup/idempotency authorities and preventing raw Issue content or GitHub write
  credentials from reaching the privileged self-hosted runner or coding Executor.

problem: >
  TASK-066 established the A1 workflow_dispatch-only self-hosted wakeup and TASK-068,
  as integrated by TASK-073, established A2 durable dispatch identity and
  at-most-once/no-reexecution semantics. TASK-107 removed the recurring local
  PowerShell/file courier for Brain-authored TASK/REVIEW/correction artifacts, but
  PRIMARY wakeup still requires a Human to open GitHub Actions and manually dispatch
  the A1 workflow because the current Brain GitHub connector does not expose initial
  workflow_dispatch. Add a repository-owned, narrowly authenticated Issue carrier
  that admits one small execution request on a GitHub-hosted runner, sanitizes it to
  dispatch_id/task_id/executor, and invokes the fixed existing A1 workflow without
  exposing an issue-triggered path directly to the privileged self-hosted runner.

assumptions:
  - >
    Canonical AIOS-renew main at TASK-108 authoring is
    1c5edecdcce9c432dfd38ba55ef5f29c8721afc4, the reviewed and published TASK-107
    source candidate.
  - >
    TASK-066 remains authoritative for A1: the actual PRIMARY execution wakeup is
    workflow_dispatch-only, targets the dedicated [self-hosted, windows, x64, aios-renew]
    runner, uses persistent AIOS_REPO_ROOT, and invokes one `aios wakeup` command.
  - >
    TASK-068 semantics as integrated by TASK-073 remain authoritative for A2 durable
    dispatch identity, exact TASK/executor binding, duplicate terminal replay,
    identity-collision rejection, and crash/restart attribution without re-execution.
  - >
    TASK-074 A3 status/approval, TASK-084 A6 approved-remediation wakeup, and TASK-107
    authoring ingress are distinct authorities and remain separate.
  - >
    The Human must explicitly choose `codex` or `antigravity` before a Brain wakeup
    request is authored. The carrier may transport but never infer/default/reroute it.
  - >
    A model-host platform may independently block a Brain GitHub Issue write before
    GitHub receives it. TASK-108 cannot bypass such an external safety gate; manual
    A1 workflow_dispatch remains an emergency fallback.
  - >
    Current Human intent explicitly prioritizes this narrow wakeup transport closure
    before returning to the generic Downstream Adoption NEXT item. The roadmap bookmark
    is planning state and is not modified here.
  - >
    Downstream repositories remain governed by their exact pinned AIOS revision and
    receive no TASK-108 behavior without a separate reviewed adoption.

