    - tests/test_github_issue_wakeup.py
    - tests/test_github_issue_wakeup_workflow.py
    - README.md

non_goals:
  - Change the existing A1 workflow, A2 reconciliation, `aios wakeup`, Runtime admission,
    RUN allocation, canonical verification, Executor adapters, correction, review, or publication.
  - Let an Issue event execute directly on the self-hosted runner or invoke AIOS/Codex/Antigravity there.
  - Add a generic workflow/operation router or accept arbitrary workflow/ref/path/command/model/runner/credential fields.
  - Implement status polling, completion notification, review, correction, retry, recovery, publication, A4/A5/A7/A9/A10.
  - Add a scheduler, daemon, webhook server, queue, broker, database, alternate runner, fallback executor, or reroute.
  - Circumvent or encode around model-host safety checks or guarantee Brain Issue creation.
  - Modify `.ai/roadmap-state.yaml`, frozen governance/kernel artifacts, or downstream repositories/pins.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Define a versioned repository policy for this Issue carrier, binding exact repository
      `trung-via/AIOS-renew`, authorized actor allowlist initially only `trung-via`,
      one exact Issue title marker, and bounded request size.
    - >
      The carrier workflow triggers only on newly opened Issues with the exact marker and
      runs admission/dispatch only on a GitHub-hosted runner. Raw Issue events must never
      schedule directly onto the self-hosted AIOS runner.
    - >
      Before Actions dispatch, validate event action, repository full name, Issue number,
      Issue author/allowlist, exact title, UTF-8 body, non-empty body, and size.
    - >
      The request body is strict versioned data with exactly `format`, `version`,
      `dispatch_id`, `task_id`, `executor`. Unknown/missing fields fail closed.
      dispatch_id uses A2 grammar; task_id uses TASK grammar; executor is exactly codex or antigravity.
    - >
      After admission, dispatch exactly one fixed `.github/workflows/aios-self-hosted-wakeup.yml`
      invocation on fixed ref `main`, passing only validated dispatch_id/task_id/executor.
      Raw body, metadata, arbitrary refs/workflows/paths/commands/credentials are not forwarded.
    - >
      A2 remains the sole durable at-most-once identity/reconciliation authority; the new
      carrier adds no second dispatch journal, RUN authority, retry, or recovery semantics.
    - >
      Minimum explicit permissions are `contents: read`, `actions: write`, `issues: write`.
      The actions-write token remains confined to the GitHub-hosted admission job and is
      never exposed to self-hosted AIOS or a coding Executor.
    - >
      Any checkout is fixed canonical main, never event-controlled, and the admission job
      mutates no source, Runtime state, or persistent AIOS_REPO_ROOT checkout.
    - >
      Carrier delivery is one-shot: no polling, wait-for-completion, retry, fallback,
      reroute, second Issue, status reconciliation, or synthetic execution-success claim.
    - >
      A bounded receipt may state carrier rejection or GitHub acceptance of the fixed A1
      dispatch. Dispatch acceptance is not RUN/verification/review/publication success.
    - >
      TASK-107 authoring ingress, A3, A6, A1/A2, and direct AIOS commands remain unchanged;
      no generic remote operation selector is introduced.
    - >
      Tests prove fail-closed admission before Actions dispatch, strict field validation,
      inert malicious shell/Git strings, fixed target workflow/ref, sanitized three-field
      forwarding, minimum permissions, no self-hosted Issue job, no direct AIOS/Executor call,
      no polling/retry, and bounded receipts.
    - >
      README documents: Human explicit Executor -> Brain small Issue -> GitHub-hosted
      admission -> fixed A1 workflow_dispatch -> A2 -> self-hosted AIOS -> selected Executor;
      manual A1 fallback; dispatch-acceptance distinction; external model-host safety limitation;
      and exact-pin downstream isolation.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      An authorized valid wakeup Issue causes exactly one dispatch of the existing A1
      workflow on main with only validated dispatch_id/task_id/executor, while Issue admission
      runs only on a GitHub-hosted runner.
  - id: AC2
    condition: >
      Wrong repository/actor/action/title, malformed/empty/oversized body, missing/unknown
      fields, invalid identities, or unsupported Executor fails before workflow dispatch and
      cannot reach the self-hosted runner or create a RUN.
  - id: AC3
    condition: >
      Raw Issue data and the actions-write token never cross into self-hosted AIOS/Executor;
      only the three sanitized A1 inputs cross the boundary under minimum permissions.
  - id: AC4
    condition: >
      Request data cannot select workflow/ref/path/command/runner/model/reasoning/verification/
      credential authority, and malicious shell/Git-like strings remain inert and rejected.
  - id: AC5
    condition: >
      Existing A1/A2 behavior remains authoritative and unchanged; repeated dispatch identity
      is governed by A2 no-reexecution/collision rules rather than a second PRIMARY path.
  - id: AC6
    condition: >
      Carrier processing is one-shot with no polling/retry/fallback/reroute/status/review/
      correction/verification/publication, and receipts distinguish dispatch acceptance from execution outcome.
  - id: AC7
    condition: >
      TASK-107 authoring, A3, A6, direct AIOS commands, Runtime verification, Reviewer, and
      publisher authorities remain unchanged; no generic remote operation router appears.
  - id: AC8
    condition: >
      README documents explicit Executor choice, GitHub-hosted admission security, A1/A2
      delegation, manual fallback, external platform safety limitation, downstream isolation,
      and does not claim A9 or universal zero-touch completion.
  - id: AC9
    condition: >
      Delta is confined to the six authorized files, required deterministic verification
      and `git diff --check` pass, and RESULT has zero unresolved items.

verification:
  required:
    - python -m pytest tests/test_github_issue_wakeup.py tests/test_github_issue_wakeup_workflow.py tests/test_self_hosted_wakeup.py tests/test_dispatch_reconciliation.py -q
    - git diff --check
