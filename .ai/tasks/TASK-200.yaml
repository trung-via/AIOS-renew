task_id: TASK-200
revision: 1

goal: >
  Eliminate non-target GitHub Issue carrier fan-out noise before BP-9 downstream
  adoption by making the remediation-intent carrier skip cleanly for issue titles
  outside its own family, while preserving fail-closed behavior for genuine
  remediation-intent requests and leaving canonical lifecycle semantics unchanged.

problem: >
  Fresh observation during TASK-199 showed that opening a valid
  [AIOS BRAIN WAKEUP] or [AIOS BRAIN INGRESS] issue also activates the
  remediation-intent workflow. Its admit job is correctly title-gated, but its
  receipt job uses unconditional if: always(). When admit/dispatch are skipped for
  a non-target issue, receipt still runs, posts a misleading REJECTED comment, and
  the workflow ends red through Preserve rejected carrier outcome. This is
  operational fan-out noise, not engineering lifecycle truth. It directly recreates
  the cross-context failure mode already recorded by TASK-121 and the Project
  Contract: a fresh Brain can mistake non-target REJECTED receipts/red Actions for
  the state of the addressed TASK. Audit of the current PRIMARY wakeup, Brain
  Ingress, remediation-intent and REPAIR wakeup issue carriers shows the defect is
  localized to the remediation-intent receipt path; the other three already keep
  non-target events inside title-gated jobs.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    ff29666d50eaf9276ab62d944018f2bbeb91f073, the reviewed and published
    TASK-199 capability candidate.
  - >
    TASK-121 and docs/CHATGPT_PROJECT_CONTRACT.md already establish that
    non-target carrier REJECTED receipts are transport fan-out noise and must not
    become lifecycle truth. This TASK hardens the transport surface to reduce that
    noise; it does not create a new semantic rule.
  - >
    BP-9 downstream adoption remains the Human/Brain roadmap NEXT. This is a
    bounded maintenance prerequisite with return_to BP-9 and must complete before
    the TASK-199 activation successor and downstream migration are attempted.
  - >
    The currently audited issue-opened carrier workflows are
    aios-brain-wakeup.yml, aios-brain-ingress.yml,
    aios-brain-remediation-intent.yml and aios-brain-repair-wakeup.yml.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-121.yaml
    - .github/workflows/aios-brain-wakeup.yml
    - .github/workflows/aios-brain-ingress.yml
    - .github/workflows/aios-brain-remediation-intent.yml
    - .github/workflows/aios-brain-repair-wakeup.yml
    - tests/test_github_issue_remediation_intent.py
  modify:
    - .github/workflows/aios-brain-remediation-intent.yml
    - tests/test_github_issue_remediation_intent.py

non_goals:
  - >
    Change Runtime, Unified State, TASK/RUN/RESULT/FAILURE/REVIEW semantics,
    publication, correction selection, Executor selection, or any frozen Kernel
    behavior.
  - >
    Add a generic event router, central carrier broker, retry/fallback/failover,
    polling, daemon, scheduler, or a second lifecycle/transport authority.
  - >
    Change PRIMARY wakeup, Brain Ingress or REPAIR wakeup behavior that is already
    correctly title-gated.
  - >
    Suppress a genuine target-family rejection. A malformed or failed
    [AIOS REMEDIATION INTENT] delivery must remain observable and fail closed.
  - >
    Modify downstream repositories, activate TASK-199, change any downstream pin,
    execute TASK-255, or advance roadmap planning state.

constraints:
  hard:
    - >
      Make the smallest workflow-level correction so every job capable of posting
      remediation-intent receipts or producing a rejected remediation carrier
      outcome is reachable only when
      github.event.issue.title == '[AIOS REMEDIATION INTENT]'.
    - >
      A non-target issue-opened event must cause the remediation-intent workflow to
      skip cleanly: no admission, no reusable dispatch, no comment, no synthetic
      OPERATIONAL_RECEIPT, and no red failure generated by this carrier.
    - >
      A target [AIOS REMEDIATION INTENT] event must preserve current semantics:
      successful admission/dispatch may post the bounded success receipt and close
      the issue; malformed admission or downstream dispatch failure must still post
      the bounded REJECTED/failed receipt and preserve a failing workflow outcome.
    - >
      Preserve exact profile resolution, trusted-actor admission, correction
      dispatch identity, A3/A6 boundaries and all existing reusable self-host
      workflow inputs. Do not reinterpret carrier success as RUN, verification,
      review or publication success.
    - >
      Add deterministic regression coverage that inspects the repository-owned
      workflow and proves the non-target job guard cannot regress while preserving
      the target-family failure path. Tests must not require GitHub/network.
    - >
      PRIMARY wakeup, Brain Ingress and REPAIR wakeup workflow files must remain
      byte-for-byte unchanged in the implementation candidate.
    - >
      Executor returns one clean candidate with zero unresolved implementation
      items and does not review, publish, activate TASK-199, mutate roadmap state,
      or perform downstream work.

acceptance:
  - id: AC1
    condition: >
      For any opened Issue whose title is not [AIOS REMEDIATION INTENT], every
      remediation-intent job that could emit a receipt, dispatch work, or produce a
      carrier failure is structurally gated out, so that carrier produces no comment,
      no dispatch and no false-red outcome.
  - id: AC2
    condition: >
      For an actual [AIOS REMEDIATION INTENT] issue, valid delivery behavior and
      bounded receipt semantics remain unchanged, including exact execution-profile
      attribution and reusable remediation dispatch inputs.
  - id: AC3
    condition: >
      Genuine target-family admission or downstream-dispatch failure still fails
      closed and remains visible as a rejected carrier outcome; the fix does not
      turn real failures green or hide them.
  - id: AC4
    condition: >
      Regression coverage deterministically proves the remediation receipt/failure
      path is title-gated and that PRIMARY wakeup, Brain Ingress and REPAIR wakeup
      already retain their existing non-target isolation semantics without
      production changes.
  - id: AC5
    condition: >
      No Runtime, lifecycle, Reviewer, Publisher, correction, Executor, roadmap,
      frozen Kernel, downstream or retry/fallback/router semantics change.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_github_issue_remediation_intent.py
    - git diff --check