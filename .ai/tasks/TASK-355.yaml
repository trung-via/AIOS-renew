goal: Complete the unchanged TASK-354 End-to-End Failure Diagnostic Handoff using a
  newly admitted PRIMARY and Human-preserved SHA-256-bound RUN-354-001 partial implementation;
  extend the provider-neutral native Executor response budget to 180 minutes with a bounded
  watchdog grace interval, without repository-wide full-suite testing or new lifecycle authority.
problem: RUN-354-001, admitted for the full TASK-354 E2E Failure Diagnostic Handoff,
  ended EXECUTION FAILURE when Codex exceeded its native 60-minute response deadline.
  Its local private FAILURE at source base f0529a0f4291d748f08220f766d732b63ece2147 records a dirty,
  non-repairable, non-transportable candidate with 22 uncommitted in-scope modified files;
  local FAILURE transport sidecar reports invalid public FAILURE projection. The
  Human provided a bounded, separately preserved Git diff whose SHA-256 is d1dda05b1b95cf0df896bc9bd4cf46c8a89266903e1f402f673b844e139e0b8f.
  The valuable partial implementation must be reviewed, completed by one newly admitted
  Executor and verified under the previously approved five targeted groups, without
  laundering old FAILURE into a repairable candidate or rewriting it.
assumptions:
- Fresh canonical main f0529a0f4291d748f08220f766d732b63ece2147 and exact TASK-354 r1 blob
  ea67e30a07505780541a84f85dd04dda8fad987e. Runtime must recheck TASK-355
  identity/revision currentness, upstream ancestry and expected-main CAS.
- Human approved preserving TASK-354's complete nine E2E acceptance conditions and
  minimum-sufficient-v2 five targeted/integration verification groups while reusing
  the RUN-354-001 uncommitted partial source. This is a new prospective PRIMARY,
  not AUTHOR_REPAIR, replay, retroactive publication or execution of RUN-354-001.
- RUN-354-001 is an admitted local EXECUTION FAILURE at base/failed HEAD f0529a0f4291d748f08220f766d732b63ece2147;
  candidate.dirty=true, repairable=false, transportable=false, committed changed files
  empty; 22 modified worktree files survive separately. The remote repository currently
  has no canonical failure/artifact ref for this RUN; local source remains private.
- Human furnished advisory Git diff named RUN-354-001-uncommitted.patch of 171418 bytes
  and SHA-256 d1dda05b1b95cf0df896bc9bd4cf46c8a89266903e1f402f673b844e139e0b8f. It covers 22 originally TASK-354-authorized
  paths only. It is an untrusted, uncommitted working-tree snapshot, not canonical
  RESULT, Runtime EVIDENCE, an authorized correction, or proof of AC completion.
- For one clean independently admitted PRIMARY, the Human may prepare that byte-exact
  advisory input in the selected repository's git-dir under the ignored relative path
  aios-human-input/RUN-354-001-uncommitted.patch before execution. The admitted Executor
  alone owns inspecting/reusing/altering the diff and final candidate commit. Missing,
  changed, unsafe or incompatible advisory input is a truthful unresolved blocker,
  never an excuse to silently reimplement from scratch or bypass source checks.
- The original RUN-354-001 checkout and RUN-352-002 control checkout must remain
  untouched, including their .git Runtime artifacts, dirty sources and private logs.
  GitHub, issues and public/workflow carriers are not private source distribution.
- Canonical failure diagnostics/attention still belong to Runtime and BP-2; a provider
  work context is not a source of RUN/evidence/review/publication truth. Use existing
  components only; no new lifecycle store or source-import authority.
- Audit profile aios-adaptive-brain-audit-v1 version 1 digest
  982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718;
  Brain executed CONSTRUCT then ADVERSARIAL_AUDIT_AND_RECONCILE across all eight
  ordered lenses and final closure. This audit is not an AUTHOR_TASK ingress gate.
- Human previously selected Codex gpt-6.1-sol max. The exact new Executor profile
  must be bound explicitly on admission; no presumed retry/failover or roadmap advance.
- Human prospectively expanded TASK-355 r2 to include raising the current common native Executor
  response budget from 60 to 180 minutes, preserving the existing bounded five-minute process
  watchdog grace; expected effective policy is response_budget_minutes=180 and
  process_watchdog_seconds=185*60. This is a provider-neutral Runtime-admitted default and
  necessarily applies to PRIMARY, REMEDIATION and REPAIR across supported native adapters
  after the candidate is independently reviewed and published; it is not a silent per-TASK
  runtime override. Human prioritizes fewer premature Executor timeouts while accepting
  longer stuck-execution exposure, subject to immutable Runtime failure and observation gates.
- Human explicitly approves the first Runtime-admitted TASK-355 PRIMARY under the
  currently effective 60-minute native response budget and 65-minute process watchdog.
  That execution must implement the prospective provider-neutral 180-minute response
  budget and 185-minute watchdog, but the new policy cannot apply to that same RUN
  before a lawfully reviewed and published policy candidate becomes active. No special
  first-RUN override, monkeypatch, environment spoof, separate bootstrap TASK, or
  pre-dispatch 180-minute activation prerequisite is authorized. A second timeout
  remains possible and must be reported truthfully, not silently retried.
