task_id: TASK-196
revision: 2

goal: >
  Restore portable repository-owned execution-profile validation for durable
  REMEDIATION and REPAIR dispatch records when AIOS-renew is installed as an
  immutable dependency and operates on an external governed repository.

problem: >
  TASK-196 r1 RUN-196-001 failed closed at Completion Gate with zero changed
  files because the r1 contract required explicit governed-repository context
  through the durable dispatch API boundary while forbidding modification of
  operator.py. Canonical operator call sites resolve repo_root explicitly but
  currently pass only state_root into existing-profile, selector-collision,
  replay and execute dispatch APIs. Therefore the repository context cannot be
  propagated truthfully within r1 scope. The original portability defect also
  remains: v2 durable REMEDIATION and REPAIR records validate profile identity
  without repository/policy context and can fall back to AIOS package/source
  layout. Revision 2 widens only the proven missing call-chain boundary.

assumptions:
  - >
    TASK-196 r1 is canonical at 4de2fd01e05ba4cbe3c22b54c0a98d2a97b212a0
    and RUN-196-001 is a canonical failed PRIMARY with no implementation delta.
  - >
    RUN-196-001 Executor diagnostics establish that operator.py is the missing
    production call-chain boundary: it already resolves repo_root but durable
    dispatch calls receive state_root without governed repository context.
  - >
    The homologous defect family applies to correction_dispatch REMEDIATION and
    repair_dispatch REPAIR v2 durable records.
  - >
    This revision changes TASK scope because r1 was impossible as authored; it
    is not a REPAIR of RUN-196-001 and does not rewrite that failed lineage.
  - >
    BP-9 downstream adoption remains blocked until this upstream portability
    defect is reviewed and published.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-EXECUTION-PROFILE-SELECTION.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-195.yaml
    - .ai/tasks/TASK-196.yaml
    - src/aios_renew/execution_profile.py
    - src/aios_renew/operator.py
    - src/aios_renew/correction_dispatch.py
    - src/aios_renew/repair_dispatch.py
    - tests/test_execution_profile.py
    - tests/test_correction_dispatch.py
    - tests/test_repair_dispatch.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/correction_dispatch.py
    - src/aios_renew/repair_dispatch.py
    - tests/test_correction_dispatch.py
    - tests/test_repair_dispatch.py
    - tests/test_operator.py

non_goals:
  - >
    Change execution-profile defaults, supported efforts, model/Executor
    selection, provider adapters, TASK-195 semantics or downstream configuration.
  - >
    Package/copy repository policy into AIOS or infer governed repository from
    cwd, package parents, state_root naming, environment variables or globals.
  - >
    Change frozen Kernel semantics, lifecycle states, RUN allocation,
    verification authority, Reviewer, Publisher, Brain, roadmap, carriers,
    workflow authorization, or downstream TASK-255 lineage.
  - >
    Add retry, fallback, failover, routing, automatic correction selection,
    duplicate execution, or another lifecycle authority.
  - >
    Rewrite RUN-196-001 or downstream RUN-255-001, REPAIR-255-001 or RUN-255-002.
  - >
    Perform BP-9 downstream migration or publish/adopt a downstream pin.

constraints:
  hard:
    - >
      operator.py must propagate its already-resolved exact repo_root explicitly
      through every durable REMEDIATION and REPAIR API path that may read or
      validate a v2 profile binding, including existing-profile lookup,
      selector-collision checks, replay/reconciliation and dispatch execution.
    - >
      correction_dispatch.py and repair_dispatch.py must validate v2 durable
      profile identities using the explicitly supplied governed repository
      policy. No package/source-tree fallback is permitted on these durable paths.
    - >
      Repository context is authority context, not identity reconstruction:
      dispatch modules must not derive repo from state_root, cwd, environment,
      package layout or mutable global state.
    - >
      Preserve exact immutable bound model, reasoning effort, model_source and
      effort_source. Reading an existing durable record validates support but
      never re-resolves defaults or rewrites profile provenance.
    - >
      Preserve historical v1 compatibility and all at-most-once, selector
      collision, replay, active-lock, RUN attribution and reconciliation semantics.
    - >
      Apply one symmetric invariant to both correction families; do not fix
      REPAIR while leaving REMEDIATION dependent on incidental package layout.
    - >
      Missing, malformed or unsupported governed-repository policy/profile must
      fail closed before correction Executor invocation and must not fall back to
      another policy source.
    - >
      Do not modify execution_profile.py. Its generic explicit repo/policy
      validation surface is already sufficient; this TASK repairs context
      propagation at callers and durable dispatch boundaries.
    - >
      Production mutation is limited to operator.py, correction_dispatch.py and
      repair_dispatch.py. If another production module is required, stop unresolved.
    - >
      Regression tests must use an external temporary governed repository whose
      .ai/executor-profiles.yaml differs from the AIOS source checkout policy and
      must prove both acceptance and fail-closed rejection for REMEDIATION and REPAIR.
    - >
      Tests must exercise existing durable v2 record reads after write, including
      replay/reconciliation/collision paths reached through operator-facing flows,
      matching the RUN-255-002 failure class.
    - >
      Tests remain deterministic and non-network. No test may make source-tree
      .ai policy the expected downstream authority.

acceptance:
  - id: AC1
    condition: >
      All operator-facing durable REPAIR v2 paths explicitly carry the resolved
      governed repository into profile validation, and existing records replay or
      reconcile independently of AIOS installation/source-tree location.
  - id: AC2
    condition: >
      All operator-facing durable REMEDIATION v2 paths satisfy the same explicit
      repository-context invariant with no homologous package-layout dependency.
  - id: AC3
    condition: >
      A profile supported only by the external governed repository is accepted on
      existing-record paths, while a profile unsupported there fails closed even
      if an incidental AIOS source-tree policy would accept it.
  - id: AC4
    condition: >
      Exact durable model/effort/source provenance remains immutable and no
      existing record is silently rebound to current defaults.
  - id: AC5
    condition: >
      Historical v1 records and current at-most-once, collision, active-delivery,
      RUN-attribution and reconciliation behavior remain non-regressed for both
      correction families.
  - id: AC6
    condition: >
      Deterministic operator-level and dispatch-level regressions reproduce the
      external-repository installed-package boundary for both correction families.
  - id: AC7
    condition: >
      The implementation changes only the six authorized files, introduces no
      new lifecycle/semantic authority, fallback/router/retry behavior or
      unresolved items.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_execution_profile.py tests/test_correction_dispatch.py tests/test_repair_dispatch.py tests/test_operator.py
    - git diff --check
