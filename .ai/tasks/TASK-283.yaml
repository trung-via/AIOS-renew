task_id: TASK-283
revision: 1
goal: Repair H4A5 canonical freshness correctness and bounded liveness within the
  existing safety budgets by aligning remediation-successor reconstruction with the
  canonical REMEDIATION schema and reducing the read-only Git proof graph without
  weakening exact lineage, mutable-ref race detection, or fail-closed semantics.
problem: The Human-authorized final live proof for RUN-282-001 used the TASK-282-published
  local-wake workflow and executed its bounded follow-up drain, yet all eleven observed
  receipts remained DEFERRED/CANONICAL_UNKNOWN. Fresh audit isolated two deterministic
  correctness defects and one bounded-liveness defect. First, publication-success
  freshness strict-parses canonical roadmap-state.yaml; the roadmap contained a duplicate
  previous_state key in unrelated historical planning data, causing strict parsing
  to fail before bookmark evaluation. Human/Brain has repaired that planning-state
  defect at canonical main 85ec017e8ac6cde0db75396789dc7f15271fe249. Second, REVIEW
  and AUTHOR_REMEDIATION freshness require correction.source_run_id even though canonical
  REMEDIATION documents do not contain that field; source RUN identity is represented
  by the exact remediation ref/subject and the document carries finding_id, action
  and reviewed_sha. Third, a valid publication-success observation still performs
  five mutable-ref snapshots and four exact-SHA fetch invocations serially, leaving
  the preserved thirty-second observation envelope vulnerable to ordinary remote latency.
  Increasing timeout would not repair either deterministic defect and is not authorized.
assumptions:
- Canonical main at TASK authoring is 85ec017e8ac6cde0db75396789dc7f15271fe249.
- The duplicate roadmap previous_state key was a Human/Brain planning-state defect
  and has already been repaired without changing lifecycle or engineering-state truth.
- TASK-282 remains reviewed and published; its per-subject observation window and
  in-job bounded follow-up drain are retained and are not reopened by this TASK.
- Canonical REMEDIATION schema remains the schema implemented by review.Remediation/parse_remediation
  and authoring ingress; it does not contain source_run_id.
- RUN-282-001 final live proof remains failed conformance evidence only; no additional
  publication replay or live browser wake is authorized during Executor implementation.
- The thirty-second subject observation, fifteen-second Git-operation and ten-second
  API-operation ceilings remain the intended safety envelope.
scope:
  inspect:
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - .ai/roadmap-state.yaml
  - .ai/tasks/TASK-280.yaml
  - .ai/tasks/TASK-281.yaml
  - .ai/tasks/TASK-282.yaml
  - docs/AIOS-H4A5-COMPLETE-ATTENTION-COVERAGE-CONFORMANCE-v1.md
  - src/aios_renew/brain_attention.py
  - src/aios_renew/local_chat_wake.py
  - src/aios_renew/review.py
  - src/aios_renew/authoring_ingress.py
  - tests/test_brain_attention.py
  - tests/test_local_chat_wake.py
  - tests/test_authoring_ingress.py
  modify:
  - src/aios_renew/brain_attention.py
  - tests/test_brain_attention.py
  - docs/AIOS-H4A5-COMPLETE-ATTENTION-COVERAGE-CONFORMANCE-v1.md
non_goals:
- Increase the thirty-second canonical observation budget, fifteen-second Git-operation
  ceiling or ten-second API-operation ceiling.
- Change canonical REMEDIATION authoring schema to add source_run_id or any duplicate
  provenance field merely to satisfy the current freshness reader.
- Change attention event schemas, event identity, lane FIFO/one-flight semantics,
  local browser behavior, workflow triggers, Publisher behavior, Reviewer behavior
  or Runtime lifecycle reduction.
- Treat chat activity, elapsed time, workflow success or the planning-state repair
  itself as proof that an unresolved attention subject is canonically resolved.
- Create persistent canonical-evidence caches, background services, new retry controllers,
  polling, workflow self-dispatch, repository_dispatch, credentials or new semantic
  authority.
- Modify roadmap planning state from Executor code, close H4A5, authorize H4B or perform
  a downstream adoption.
- Perform another RUN-282-001 replay or any live user-turn probe during implementation
  or deterministic verification.
constraints:
  hard:
  - For REVIEW_CHANGES_REQUIRED_OR_BLOCKED and AUTHOR_REMEDIATION freshness, source
    RUN identity must be proven from the exact remediation ref/subject grammar plus
    the canonical review identity; the REMEDIATION document itself must be validated
    only against fields its canonical schema actually owns, including finding_id,
    action and reviewed_sha.
  - A remediation ref, finding id, reviewed SHA, action or canonical review mismatch
    must fail closed to UNKNOWN; no correction strategy or replacement successor may
    be selected by freshness.
  - Each generic freshness observation must take one coherent initial snapshot of
    every mutable Git ref needed for that family and one coherent final snapshot of
    the same ref set. The final snapshot must exactly equal the initial snapshot before
    RESOLVED or UNRESOLVED may be returned.
  - Only immutable object SHAs proven by the initial mutable-ref snapshot may be reused
    or acquired together within that observation. No mutable ref value or fetched-object
    cache may survive into another observation.
  - The implementation must reduce serial network-bearing Git work rather than relax
    deadlines. Publication-success and a one-finding REVIEW/AUTHOR_REMEDIATION observation
    must be expressible with at most two remote-ref snapshot operations plus one bounded
    immutable-object acquisition phase; local blob, tree and ancestry checks do not
    count as remote operations.
  - Strict duplicate-key parsing remains fail closed. The repository's current roadmap-state.yaml
    must parse successfully under the same unique-key semantics used by publication-success
    freshness, while a synthetic duplicate-key roadmap remains UNKNOWN.
  - Production-shaped freshness regressions must use the canonical REMEDIATION schema
    or the repository parser/authoring shape; tests must not invent source_run_id
    inside a REMEDIATION document.
  - Existing TASK-282 per-subject thirty-second observation initialization and bounded
    local follow-up behavior remain unchanged.
  - The local wake lane receives only RESOLVED, UNRESOLVED or UNKNOWN from freshness
    and gains no semantic routing, correction, review, publication or roadmap authority.
  - Executor changes only the three authorized files. Runtime owns canonical verification,
    Reviewer owns semantic verdict, Publisher owns publication, and Human/Brain owns
    roadmap reconciliation and H4A5 live closure.
acceptance:
- id: AC1
  condition: Production-shaped regression coverage demonstrates that an exact CHANGES_REQUIRED
    review with its canonical remediation ref/document resolves the reviewed finding
    without requiring a non-canonical source_run_id document field, while exact ref
    subject, finding_id, action and reviewed_sha bindings are enforced.
- id: AC2
  condition: AUTHOR_REMEDIATION freshness recognizes the same canonical remediation
    schema and exact ref/subject binding; mismatched source subject, finding, action,
    reviewed SHA, review lineage or moved refs fail closed to UNKNOWN.
- id: AC3
  condition: Publication-success freshness strict-parses the repaired repository roadmap
    and returns the correct planning state for exact bookmarks; a duplicate-key roadmap
    fixture remains fail-closed UNKNOWN and cannot be silently last-key-wins parsed.
- id: AC4
  condition: Deterministic call-accounting regressions demonstrate that a valid publication-success
    observation and a valid one-finding REVIEW/AUTHOR_REMEDIATION observation require
    no more than two network-bearing mutable-ref snapshots plus one immutable-object
    acquisition phase, with no duplicate exact-SHA fetch phase.
- id: AC5
  condition: Adversarial regressions prove that ref movement between initial and final
    snapshots, conflicting terminal/review refs, substituted immutable documents,
    missing objects and malformed YAML all remain UNKNOWN even after proof-graph reduction.
- id: AC6
  condition: The existing 30-second subject, 15-second Git-operation and 10-second
    API-operation ceilings are unchanged, and deterministic fake-clock/call-budget
    coverage exercises the reduced valid proof path without real sleeps or timeout
    inflation.
- id: AC7
  condition: Generic attention identity, publication classification, canonical REMEDIATION
    schema, H4A4/H4A5 lane behavior, browser/privacy guards and Human/Brain/Runtime/Reviewer/Publisher
    authority boundaries remain unchanged.
- id: AC8
  condition: The H4A5 conformance document records the post-TASK-282 live failure,
    the repaired roadmap duplicate-key planning defect, the canonical remediation
    schema drift and reduced-proof-graph requirement, and explicitly leaves any new
    live proof and H4A5/H4B closure to separate Human authorization after reviewed
    publication.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_brain_attention.py tests/test_local_chat_wake.py
  - git diff --check
