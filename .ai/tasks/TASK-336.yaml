task_id: TASK-336
revision: 1
goal: >-
  Forward-recover AIOS-renew production source to the reviewed pre-VP03/TASK330
  operational behavior at exact baseline 84478a59405427ef932740eb26d8ce6292b0fe71, retiring the additional
  VP03A/B/C/D evidence-attestation/protected-writer architecture and all of its
  runtime-integrated hooks. Preserve current canonical history, independent
  Runtime verification/Reviewer/Publisher responsibilities, existing Git CAS,
  and minimal safe public transport redaction. This TASK is recovery only, not
  a new evidence validity engine or intra-PRIMARY correction implementation.
problem: >-
  After TASK-330 through TASK-335 and TASK-334 r2 publication, VP03 introduced
  read-only proof catalog/checkpoint/handoff plus owner-bound provenance, independent
  source issuance and GitHub App Writer Broker. The new protected Windows broker
  is not deployed and the VP03 paths have not established production verification
  savings. The extra service and authentication requirements create implementation
  and operations cost contrary to the AIOS Manifesto's sufficient-evidence,
  no-redundant-work North Star. Human explicitly superseded VP03 protect design
  and selected a forward recovery, retaining existing KA01 prospective and
  VP-02 foundations. Do not turn this recovery into VP04 or VP05.
assumptions:
- Canonical main at authoring is aa7e0c1379a49d925c33ee2d264aa8d13d146afb; Runtime must revalidate current main
  and TASK blob/admission before any execution. No stale main or force update.
- Exact pre-VP03 behavior reference is 84478a59405427ef932740eb26d8ce6292b0fe71, the canonical commit immediately
  before TASK-330 r1 authoring; the current main is its descendant and has
  historical TASK/RUN/REVIEW lineage that must remain immutable.
- Human on 2026-10-10 approved recovery and selected Codex GPT-6.1 Sol xhigh
  for the entire TASK-336 lifecycle, including lawful REPAIR/REMEDIATION.
  Executor/model/effort are Human operational delegation, not TASK authority fields.
- Canonical roadmap at aa7e0c1379a49d925c33ee2d264aa8d13d146afb has VP03_FORWARD_RECOVERY as unique NEXT,
  VP03A/B/C/D planning superseded and legacy TASK-334 r1 bookmark historical.
- Published TASK-334 r2 source e951bd3fd896bdd5ad4082f8bc9b35a26b23f1f4
  is reviewed historical engineering truth, not evidence that the Windows broker
  or independent live writer identity was activated.
- Public repository transport requires bounded safe original-raw redaction.
  Recovering original source byte-for-byte is not acceptable if it re-exposes
  local paths, raw logs or secrets; preserve only a minimal in-process safe
  representation under existing transport authority.
- TASK-333 failure remains immutable; no automatic repair, re-entry or
  proof-source minting. V2 remains current verification policy; KA01 is
  Human-ratified prospective but NOT_ACTIVATED.
