non_goals:
- Reset main, force-push, delete or rewrite historical canonical refs,
  history, TASK records, FAILURE, REVIEW, REVIEW decision or RUN artifacts.
- Install or operate a Windows Writer Broker, new Runtime Writer/Control Writer
  App credentials, TLS service, provenance journal, additional currentness
  attestation system or Stage 2 enforcement.
- Change Github Stage 1 ruleset 24824106, its bypass settings, Stage 2 rulesets,
  GitHub secrets, Actions variables, runner accounts or workflow files.
- Retire existing admission/CAS/security or leak raw verification material
  merely to match the old transport byte-for-byte.
- Activate KA01 intra-RUN correction, change frozen Kernel, create checkpoint
  persistence, new proof engine/scheduler, automatic repair routing or another
  Reviewer/Publisher/Runtime.
- Rewrite the current roadmap, author VP03 Lean/VP04/VP05, publish source on
  behalf of Publisher, update downstream dependency pins or retest all history.
constraints:
  hard:
  - Perform forward recovery in the new TASK-336 candidate from current
    canonical main, never by checkout/reset/force-update of main or historical
    artifacts; reference pre-VP03 SHA only as a source for file behavior comparison.
  - Restore six existing source integration files toward their pre-VP03 behavior
    without removing independent canonical Runtime admission, versioned legacy
    decoding, verification, RESULT/FAILURE production, SUBMIT_REVIEW authority,
    Publisher exact-source CAS or correction flows.
  - Retire VP03-exclusive six modules, six focused test files and six associated
    versioned docs; only the published pre-VP03 TASK/RUN/REVIEW Git history keeps
    their historical content. No remaining import path may demand those modules.
  - Public transport must still use minimal deterministic safe projections,
    preserving canonical field/schema relations and immutable source evidence
    identity while never exposing protected original raw bytes, local path
    locators, secrets or unbounded diagnostics.
  - Retain the previous canonical identity/lease/currentness/expected-old
    CAS checks; no credential escalation or opaque broker fallback. Empty or
    stale protected client config must not route Git operations into retired code.
  - Historical code and artifacts remain inspectable using exact Git SHAs;
    immutable TASK-330..335 and TASK-334 r2 completion, RUN-333 failure, and
    existing REVIEW/REPAIR/REMEDIATION lineage stay unchanged.
  - Keep all existing public workflow entrypoints, Runner transport and
    minimum-sufficient-v2 Runtime verification policy functional. Do not
    introduce a second scheduler or require new environment/provisioning.
  - Limit production conformance testing to the identified affected surfaces,
    using the canonical Runtime test requirement and necessary narrow
    compatibility coverage; no full suite, automatic broad base replay or
    needless unchanged-proof rerun.
  - If a necessary safety fix requires a file outside scope or contradicts
    a frozen/higher authority contract, stop with a typed scoped blocker and
    request separate Human/Brain semantic authorization rather than broadening.
acceptance:
- id: AC1
  condition: >-
    Existing production Runtime/ingress/operator/review-transport/publication modules no longer depend on VP-03A/B/C/D issuer, broker, provenance-owner or handoff code; retain the pre-TASK330 operational lifecycle semantics except the explicit bounded public-redaction safeguard.
- id: AC2
  condition: >-
    VP-03-only source modules, focused tests and versioned VP-03 documents introduced after the baseline are absent from the prospective production tree, with no dangling imports/callers or exposed dead policy hooks.
- id: AC3
  condition: >-
    Terminal RESULT/FAILURE/REPAIR/REMEDIATION public Git transport retains canonical schemas, original proof/source identities and safe bounded public views without publishing sensitive original raw bytes, local workspace/verification raw locators or secret-bearing diagnostics.
- id: AC4
  condition: >-
    Runtime PRIMARY completion and terminal RESULT/FAILURE enforce exact admitted TASK/RUN/candidate, canonical verification/evidence and single terminal semantics without a new attestation service or checkpoint authority.
- id: AC5
  condition: >-
    Existing AUTHOR_TASK, SUBMIT_REVIEW, AUTHOR_REPAIR and AUTHOR_REMEDIATION ingress retain their canonical identity, expected-main/CAS and correction lineage ownership without a broker requirement or a new privilege fallback.
- id: AC6
  condition: >-
    Publisher and publication recovery retain exactly reviewed source binding, shared reservation/CAS, legitimate replay and fail-closed conflict behavior, without an issuer/broker dependency or writer-role expansion.
- id: AC7
  condition: >-
    Legacy immutable TASK/RUN/RESULT/EVIDENCE/FAILURE/REVIEW/REMEDIATION/REPAIR artifacts and pre-VP03 refs remain readable, with no canonical history rewriting, replay of failed TASK-333, or retrospective alteration of TASK-334 PASS.
- id: AC8
  condition: >-
    Existing minimum-sufficient-v2 execution policy and Frozen Kernel/KA-01 prospective NOT_ACTIVATED boundary remain unchanged, with no added scheduler, proof-reuse authority or intra-PRIMARY correction capability.
- id: AC9
  condition: >-
    Focused regression cases cover normal and conflicting admission, PRIMARY RESULT/FAILURE, correction pathways, safe public serialization, reviewer ingress, CAS publication and recovery, including negative rejection, while keeping existing self-host and hosted workflow entrypoints compatible.
- id: AC10
  condition: >-
    Candidate modification is confined to the exact listed restore/retirement/regression files, with no change to workflows, roadmaps, existing TASK artifacts, GitHub rulesets, secrets, installation credentials or downstream repositories.
