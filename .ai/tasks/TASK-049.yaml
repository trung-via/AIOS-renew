task_id: TASK-049
revision: 1

goal: >
  Harden the native Executor execution boundary so that once AIOS Runtime has
  admitted and dispatched one PRIMARY, REMEDIATION, or REPAIR execution, the
  selected native Executor performs the supplied authorized implementation work
  directly and does not re-enter Human-facing worker/operator/AIOS dispatch
  surfaces from inside that already-admitted execution. Preserve one-Executor
  authority, frozen kernel contracts, Runtime verification/EVIDENCE ownership,
  narrow correction semantics, and Codex/Antigravity semantic parity.

problem: >
  A real downstream Python Agent execution exposed an execution-control defect.
  Python Agent is pinned to AIOS-renew
  59b31ede597d4a27b848771522672705a021abe4. TASK-125 RUN-125-005 produced a
  verified implementation candidate and semantic review then authorized one
  narrow CODE_FIX finding F1. RUN-125-006 failed because the remediation Executor
  returned without advancing HEAD. Canonical REPAIR-125-006 correctly continued
  only that failed correction, but admitted RUN-125-007 again returned without
  advancing HEAD and preserved the Executor diagnostic that the canonical REPAIR
  launcher had already been accepted and invoked exactly once. The observed
  behavior is consistent with the native Codex execution context treating the
  repository-owned Human-facing worker/launcher as an implementation mechanism
  after Runtime had already dispatched the Executor, rather than directly editing
  and committing the authorized delta. Runtime correctly rejected the no-op at
  the existing CODE_FIX completion gate. Current AIOS-renew main retains the same
  native Codex repair/remediation guidance at this boundary, so advancing the
  downstream dependency pin alone would not remove the defect.

assumptions:
  - >
    Current canonical AIOS-renew main baseline before TASK-049 authoring is
    8ccaaf335ed09c40b2eba2c31867c2fee1c52036.
  - >
    Frozen Kernel v0.1 TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, and
    REPAIR semantics remain authoritative and unchanged.
  - >
    TASK-038 revision 2 remains the authority for shared executor-neutral
    implementation discipline and for keeping deterministic tests focused on
    observable authority/boundary behavior rather than exact natural-language
    prompt wording.
  - >
    TASK-045 remains the authority for CODE_FIX mutation truth: successful
    REMEDIATION/REPAIR CODE_FIX requires a real non-empty authorized committed
    correction delta and must not accept an unchanged or empty-commit HEAD.
  - >
    TASK-048 is an independently authored remote remediation-lineage discovery
    hardening task. Its finding-id namespace problem is unrelated to this native
    Executor re-entry defect and must not be redesigned or absorbed here.
  - >
    The downstream Python Agent evidence is diagnostic evidence motivating this
    upstream hardening task; Python Agent remains governed by its exact pinned
    AIOS dependency until a separate downstream migration explicitly updates it.
  - >
    The Human-facing repository worker surfaces and native Executor invocation
    are intentionally different roles: the former authorizes/dispatches exactly
    one execution, while the latter performs the already-authorized HOW.

scope:
  inspect:
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-038.yaml
    - .ai/tasks/TASK-045.yaml
    - .ai/tasks/TASK-048.yaml
    - src/aios_renew/executor.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/operator.py
    - tests/test_executor.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_antigravity_smoke.py
    - tests/test_operator.py

  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/operator.py
    - tests/test_codex_adapter.py
    - tests/test_antigravity_smoke.py
    - tests/test_operator.py

non_goals:
  - Change or unfreeze TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, or REPAIR schemas or semantics.
  - Change TASK-048 remote remediation discovery, finding-id namespace resolution, or Direct Candidate Acceptance semantics.
  - Weaken, bypass, special-case, or remove TASK-045 CODE_FIX HEAD-advancement and non-empty committed-delta gates.
  - Treat an unchanged HEAD as successful merely because the native Executor returned structurally valid output.
  - Restart PRIMARY after a failed FIX/REPAIR or reinterpret a failed admitted RUN as a fresh TASK execution.
  - Add retry, reroute, fallback, automatic remediation, automatic repair, planner, supervisor, watcher, queue, database, or another execution layer.
  - Add another Executor invocation to recover from re-entry, no-op, invalid output, timeout, or completion failure.
  - Let Runtime implement product/domain changes, perform semantic review, infer the intended code fix, or become an Executor.
  - Change Human-facing repository-owned worker command semantics or require downstream repositories to expose a new operator command.
  - Change downstream Python Agent files, dependency pins, TASK-125 artifacts, or historical RUN/FAILURE/REVIEW/REMEDIATION/REPAIR refs.
  - Make Codex and Antigravity use different semantic execution rules merely because the observed incident occurred under Codex.
  - Prevent Executors from using ordinary repository tools, Git, editors, test helpers, or implementation-local sanity checks that are already permitted by TASK-038.
  - Ban all subprocess execution inside an Executor; only re-entry into AIOS Human/operator dispatch authority is out of bounds.
  - Assert exact natural-language prompt sentences, helper names, source spelling, or implementation layout as the semantic proof of this task.
  - Change canonical verification commands, Runtime EVIDENCE construction, post-PASS review transport, publication, or review authority.
  - Push from executor execution.

constraints:
  hard:
    - >
      Every native PRIMARY, REMEDIATION, and REPAIR execution must receive an
      unambiguous execution-context boundary establishing that the native process
      is already the one Human-selected Executor inside an admitted AIOS execution
      and owns only the direct implementation HOW for the supplied canonical input.
    - >
      Inside that native execution context, repository-owned Human-facing worker
      surfaces and AIOS operator/dispatch entry points must be explicitly outside
      the Executor's implementation authority. The Executor must not invoke
      $aios-worker, /aios-renew-worker, aios run, aios remediate, aios repair, or an
      equivalent Human/operator launcher in order to perform the supplied work.
    - >
      The boundary must distinguish role/authority, not merely add advisory prose.
      Implementation may use a bounded structured execution-role marker, existing
      handoff structure, or another deterministic internal mechanism, but must not
      create a new kernel artifact family or downstream-visible operator protocol.
    - >
      Codex and Antigravity must preserve equivalent semantic role boundaries for
      PRIMARY, REMEDIATION, and REPAIR even when their native invocation mechanics
      differ. No executor-specific fallback or weaker path is permitted.
    - >
      The outer Human-facing worker/operator remains responsible for exactly one
      dispatch after Human authorization. Native execution must not become a second
      dispatcher and must not recursively authorize, admit, or launch another AIOS
      execution.
    - >
      A re-entry attempt, no-op result, invalid structural package, native failure,
      or unchanged CODE_FIX HEAD must remain fail-closed through existing Runtime
      completion/failure behavior. Do not convert these cases into success and do
      not retry or reroute automatically.
    - >
      Existing CODE_FIX REMEDIATION and REPAIR gates remain unchanged in meaning:
      authorized mutation must produce a non-empty committed correction delta in
      scope, bind result.head_sha to the actual committed HEAD, and then pass only
      the existing Runtime-owned verification path.
    - >
      EVIDENCE_ONLY and REPAIR NO_CHANGE retain their existing zero-mutation
      semantics. TASK-049 must not force a commit where the canonical action
      explicitly authorizes no mutation.
    - >
      Runtime verification and canonical EVIDENCE remain withheld from native
      Executor authority exactly as before. TASK-038 minimum implementation-local
      sanity checks remain permitted and do not become canonical verification.
    - >
      Regression coverage must exercise the actual native request/handoff boundary
      for Codex and Antigravity across PRIMARY, REMEDIATION, and REPAIR as relevant,
      proving the native role is distinguishable from the Human/operator role and
      that existing one-dispatch, mutation, structural-output, verification, and
      failure semantics remain intact.
    - >
      Deterministic tests must prove structured/observable boundary behavior and
      invocation authority. They must not require one exact English sentence,
      inspect source text for forbidden words, or lock the implementation to a
      particular helper/function layout solely to establish semantic guidance.
    - >
      The fix must be confined to AIOS-renew. Do not modify downstream Python Agent
      to compensate for the kernel defect; downstream pin migration and continuation
      of TASK-125 occur only after this upstream correction is reviewed and published.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Codex PRIMARY native execution is deterministically identified as the already-
      selected native Executor role and is instructed/structured to implement the
      supplied TASK directly without entering any Human-facing worker or AIOS
      operator dispatch path; existing TASK/RUN, structural ResultPackage, commit,
      push-free, and Runtime-verification boundaries remain unchanged.
  - id: AC2
    condition: >
      Codex REMEDIATION and REPAIR native executions receive the same already-
      admitted Executor-role boundary and directly execute only their supplied
      remediation/repair authority; neither path treats $aios-worker, AIOS operator
      commands, or an equivalent launcher as the mechanism for performing the fix.
  - id: AC3
    condition: >
      Antigravity PRIMARY, REMEDIATION, and REPAIR handoffs preserve semantic parity
      with Codex: the native worker is already the selected Executor, performs the
      authorized HOW directly, and does not re-enter Human/operator dispatch even
      though Antigravity transport mechanics differ.
  - id: AC4
    condition: >
      Existing one-Human-authorization/one-native-Executor invocation semantics are
      preserved. Regression tests prove no added retry, reroute, fallback, recursive
      dispatch, or second native invocation is introduced by TASK-049.
  - id: AC5
    condition: >
      Existing TASK-045 mutation-truth behavior remains authoritative: a CODE_FIX
      REMEDIATION or REPAIR that does not advance HEAD with a non-empty authorized
      committed delta still fails closed, while EVIDENCE_ONLY and NO_CHANGE retain
      their existing zero-mutation behavior.
  - id: AC6
    condition: >
      Runtime continues to own canonical verification and EVIDENCE for PRIMARY,
      REMEDIATION, and REPAIR. Native Executors receive no new canonical verification
      authority and no verification command is duplicated merely to enforce the
      re-entry boundary.
  - id: AC7
    condition: >
      TASK-048 remote remediation-lineage behavior, Direct Candidate Acceptance,
      review/remediation discovery, finding identity, and admission diagnostics are
      unchanged by TASK-049.
  - id: AC8
    condition: >
      Deterministic tests cover native execution-role separation without asserting
      exact natural-language prompt wording or implementation spelling, and existing
      Codex/Antigravity structural output and failure behavior remains green.
  - id: AC9
    condition: >
      No frozen kernel schema, downstream worker protocol, downstream dependency pin,
      historical artifact, review authority, publication rule, or product/domain
      repository semantics are changed.
  - id: AC10
    condition: >
      The final implementation is a narrow AIOS-renew execution-boundary hardening
      sufficient to prevent the RUN-125-007 class of native-executor/operator-role
      confusion without creating another orchestration layer or weakening fail-closed
      completion semantics.

verification:
  required:
    - python -m pytest tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_antigravity_smoke.py tests/test_operator.py -q
    - git diff --check
