non_goals:
- No removal/weakening of the Publisher full-frontier closure gate; no automatic selection,
  prioritization, retry or grouping of findings, and no model-authorized Human intent/Executor.
- No second router, Reviewer, Publisher, database, scheduling service, Git transport
  or independent review authorization; do not modify roadmap state or Kernel v0.1.
- No historical data rewrite, replay, reinterpretation or replacement of single-finding
  RUN/RESULT/REVIEW/REMEDIATION/REPAIR/failure lineage. No downstream adoption/pin
  change.
- No multi-TASK, multi-source-REVIEW or mixed CODE_FIX/EVIDENCE_ONLY batch in v1;
  EVIDENCE_ONLY remains accepted only through the existing single-finding path.
- No full-suite tests, unsupported promised token/time saving, implicit future policy
  activation or production implementation by Brain.
constraints:
  hard:
  - "Authenticate one exact Human-selected nonempty 2\u201332 distinct finding set\
    \ against one immutable canonical CHANGES_REQUIRED REVIEW/TASK/revision/reviewed\
    \ SHA, each original finding's identity, basis, action, location, issue and expected\
    \ result; source RESULT/EVIDENCE and ref movement must be verified and rechecked.\
    \ No automatic group selection."
  - Use strictly discriminated prospective batch schemas/identities under the existing
    ingress/Runtime owners. No coercive batch-to-single fallback, unrecognized aliases,
    undocumented migration or legacy decoding behavior changes. Retain historical
    canonical refs and immutable bytes.
  - Batch legal scope is only the combined exact authorized per-finding modification
    paths within original TASK.scope.modify. Retain exact original TASK hard constraints
    and minimum-sufficient-v1 policy/authorized verification commands. Ambiguous or
    conflicting sources are blockers; no policy broadening.
  - One batch approval/dispatch/Run/Result/Evidence/Review must bind the identical
    selected finding set, source candidate, immutable authority and lawful cumulative
    execution base. One admitted Executor, candidate and verification execution. Transport,
    runner and carrier receipts cannot claim RUN creation or verified PASS.
  - Reviewer alone returns per-finding verdicts and new material defects; deterministic
    Runtime validates identity/source/shape and derives frontier but cannot promote
    successful tests or Executor assertions to semantic PASS. Missing, duplicated,
    foreign, partial or contradictory verdicts remain outstanding or fail closed.
  - Only independently PASS findings close in the canonical correction frontier; partial
    failures, BLOCKED, unrelated findings and newly discovered defects remain attributed
    and outstanding. Publisher must re-derive and require an empty full frontier before
    publishing.
  - Reject stale/ref-swapped/forged/oversized inputs, mixed sibling corrections, overlapping
    active batch and single authority, invalid ancestry, conflicting idempotent replay
    and unauthorized modifications. No second automatic publisher, workflow retry
    engine or generic lifecycle router.
  - All changes are confined to the 24 explicit TASK.scope.modify paths. Reuse exact
    valid evidence; only TASK verification.required runs as canonical minimum-sufficient-v1
    test, without full suite. New discovered modification needs fresh Human/Brain
    authority.
acceptance:
- id: AC1
  condition: "One strict versioned 2\u201332 finding CODE_FIX batch contract binds\
    \ a Human-explicit distinct set to one exact CHANGES_REQUIRED source REVIEW/TASK/revision\
    \ and reviewed SHA; mixed/cross-source/duplicate/implicit finding selection fails,\
    \ while single-finding decoding is unchanged."
- id: AC2
  condition: Existing Runtime AUTHOR_REMEDIATION owner accepts a properly authenticated
    exact batch authorization with lawful combined scope/constraints/verification
    and immutable deterministic replay; stale, duplicate, overlapping or substituted
    source/ref/subjects fail before canonical mutation.
- id: AC3
  condition: Existing Human remediation intent, GitHub carrier, approved self-host
    dispatch and preflight handle one bound batch selector/profile without broadening
    Human authority; pre-AIOS operational failures do not fabricate engineering RUN/FAILURE.
- id: AC4
  condition: Runtime admits and invokes exactly one Executor for one batch correction
    RUN on the latest lawful cumulative candidate, preserving original source identities
    and immutable batch authorization and refusing competing continuation or wrong
    execution base.
- id: AC5
  condition: Batch RESULT/EVIDENCE binds one real committed delta, exact authorized
    scope, result candidate and successful minimum-sufficient verification episode
    to the one RUN; missing, mismatched or nonzero evidence fails canonical verification.
- id: AC6
  condition: One versioned multi-finding DELTA REVIEW supports an exact independent
    Reviewer outcome for every batch finding and records new material defects and
    partial resolution; existing PRIMARY and single-finding DELTA contracts remain
    valid without reinterpretation.
- id: AC7
  condition: CorrectionFrontier and Unified State deterministically close only Reviewer-PASS
    findings and retain every unresolved, blocked, foreign and newly discovered finding
    with exact ancestry, rejecting conflicts and missing outcomes.
- id: AC8
  condition: Publisher validates the exact reviewed batch candidate and complete frontier
    before publication, permitting an empty frontier and blocking partially resolved
    or outstanding findings, without changing historical publish/replay authority.
- id: AC9
  condition: Affected review material and Reviewer return, ingress, correction transports
    and Runtime consumers either accept the authenticated versioned batch or reject
    it explicitly; no batch can be silently read as one legacy finding.
- id: AC10
  condition: Focused synthetic end-to-end tests demonstrate two-finding one-RUN success,
    partial verdict/outstanding retention, duplicate/mixed/stale/foreign selectors,
    forged EVIDENCE, conflicting correction, publisher block and unchanged historical
    one-finding flow.
- id: AC11
  condition: Versioned documentation describes exact Human selection, single-Executor
    batch workflow, per-finding semantic review, partial/recovery behavior, publication
    gate, and unknown real-world time/token savings.
- id: AC12
  condition: Only the 24 listed modify paths change, with no new authority, second
    router, frozen Kernel edit, roadmap mutation, auto-selection or full-suite requirement.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_batch_remediation.py tests/test_correction_frontier.py
    tests/test_review.py tests/test_github_issue_remediation_intent.py tests/test_correction_dispatch.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
