task_id: TASK-379
revision: 1
goal: 'Provide a versioned prospective end-to-end Batch REMEDIATION and Multi-Finding
  DELTA REVIEW in the existing Runtime: one Human-explicit authorized group of outstanding
  CODE_FIX findings from one exact REVIEW, one admitted Executor, one cumulative RUN
  and candidate, one minimum-sufficient verification episode, and one independently
  authored review with per-finding outcomes. Preserve all historical and single-finding
  behavior.'
problem: The current AUTHOR_REMEDIATION, Human issue/dispatch, RUN, RESULT, DELTA
  REVIEW and CorrectionFrontier contracts encode one finding_id. TASK-378 had to execute
  separate RUNs for F1/F2 with overlapping code/tests; per-finding serial execution
  wastes execution and Human coordination. Do not solve that by weakening Runtime's
  publication gate.
assumptions:
- Canonical main at authoring b3f1349206d9161e9a34f83f33fcd8a9d6526bd6; TASK-378 reviewed
  source equals main with REVIEW-378-004 DELTA PASS. This new task does not reopen
  or replay its historical lineage.
- Explicit Human intent is prospective multi-finding repair-in-one-run; not automatic
  roadmap advancement or delegation of an Executor/model/effort for this new TASK.
  Current Lean VP planning bookmark is unchanged.
- Constitution permits correction of explicitly authorized findings or causal finding
  groups. Kernel v0.1 remains frozen; the new batch contract must be a versioned extension
  with unchanged legacy decoder/behavior.
- "Bounded first batch version: 2\u201332 distinct findings from one exact canonical\
  \ CHANGES_REQUIRED REVIEW, all CODE_FIX, same TASK identity/revision, exact reviewed\
  \ SHA; mixed action, cross-source, EVIDENCE_ONLY batch and automated grouping are\
  \ out of scope."
- Active Task semantic audit is tca-1 v1 digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2;
  final AUTHOR_TASK ingress does not consume audit-support payload.
- Use currently lawful LEGACY_REPOSITORY_DEFAULT_ROUTE; Human approval of this design
  does not imply Runtime admission, Executor selection, independent Reviewer PASS
  or Publisher eligibility.
