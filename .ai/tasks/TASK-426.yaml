non_goals:
- No new planner, lifecycle router, verifier, diagnostic agent, database, network
  listener, independent background helper, fallback Executor or automatic REPAIR/REMEDIATION.
- No removing existing authenticated provenance, anti-replay/session/lease/identity
  checks; no weakening source sanitization or relying on raw untrusted provider/log
  contents.
- No artificial aggregate ceiling on safely releasable checkpoint facts; finite frame/read/resource
  limits and real capture exhaustion remain legitimate.
- No retrospective TASK-425 or TASK-426 r1 RUN changes, no public PTE-03 terminal
  schema replacement, no downstream adoption or automatic roadmap advancement.
- No full pytest suite, invented measurement, synthetic installed-native PASS, duplicate
  canonical verification, or post-verification Reviewer/Publisher claims by Executor.
constraints:
  hard:
  - EGDF v1 must use existing Runtime-owned authenticated checkpoint verification
    captures and safe technical extraction/filtering shared with PTE-03, independently
    of any terminal FAILURE. Bind TASK revision, RUN, operation/family authority,
    candidate SHA, checkpoint/source/feedback digests, selected original session and
    current lease; selectors/cursors alone confer no authority.
  - On eligible stable complete FAIL, first live feedback retains original proof/AC
    identifiers and immutable receipt while providing source-proven failure node/phase,
    exception family, relative frame/line, safe assertion and bounded technical signals
    when available. Distinguish AVAILABLE, DELIVERED, WITHHELD, UNAVAILABLE and NOT_YET_DELIVERED;
    never fabricate a cause or correction eligibility.
  - All safely releasable authenticated checkpoint evidence must be potentially accessible
    through bounded authenticated progressive/demand reads to the same original native
    Executor connection/process/thread/turn lineage under actual time/transport limits;
    no 24KiB/64KiB/1MiB aggregate ceiling, fixed record/page/node/assertion count
    or total token quota. Do not silently truncate or claim completeness if captured
    evidence is absent/expired.
  - Authenticate each additional read against current committed source, original authority/session/checkpoint/lease
    and protected evidence, reject forged/stale/cross-RUN/cross-operation/cross-candidate
    cursors. Never expose secrets, private machine paths, raw logs or injected instructions
    to the provider; no data-directed code execution or unrestricted file reads.
  - Preserve KA01 original 2 corrections, 3 checkpoints, 240-minute RUN and 180-minute
    verifier budgets, strict decrease of failed identities and single canonical RESULT/FAILURE.
    A diagnostic read creates no verification, checkpoint, correction, lease, new
    RUN, review or publication.
  - Integrate identical EGDF semantics at the original PRIMARY, REPAIR and REMEDIATION
    entrypoints with their exact scopes and provenance; unsupported channel/provider
    or incomplete verification stops truthfully. Retain original PTE-03 compatibility
    and terminal/result consumers.
  - Executor may choose incremental source commits and implementation order; final
    ACs assert code and focused tests authored, not Runtime test PASS, Reviewer PASS,
    publication or measured performance. Runtime runs only the authored two focused
    verification commands, not the full suite.
acceptance:
- id: AC1
  condition: Prospective EGDF v1 contract, KA01 integration documentation and Human
    planning update are implemented consistently for r2; historical TASK-425, PTE-03
    terminal readers and r1 lineage remain unchanged, with no new pilot or later activation
    task.
- id: AC2
  condition: Original Runtime source contains a checkpoint-scoped authenticated technical-diagnostic
    derivation path that reuses PTE-03-grade safe parsing, works before terminal FAILURE,
    and binds all original task/RUN/operation/candidate/checkpoint/source identities
    without invoking another verifier.
- id: AC3
  condition: Native eligible-FAIL first feedback includes authentic safe failure test/phase/type/frame/assertion/signals
    when present, explicit unavailable/redacted states, and unchanged source/AC/proof/receipt
    bindings; unknown or incomplete observations cannot authorize correction.
- id: AC4
  condition: A supported same-original-native-session selective/progressive read path
    provides authenticated access beyond old total 24/64KiB and node/assertion/page
    limits without re-verification or new issuer/process/RUN. Absence of actual channel/source/time
    capacity fails closed and is reported without inventing capability.
- id: AC5
  condition: Source-currentness/session/lease/cursor anti-replay, cross-RUN/operation/candidate
    rejection, provenance of released facts and PTE-03-level secret/PII/path/prompt-injection
    filtering are implemented without raw provider exposure.
- id: AC6
  condition: EGDF hooks are integrated into original PRIMARY, REPAIR and REMEDIATION
    flows, retaining existing KA01 budgets/eligibility, one terminal, unsupported-provider
    behavior, RESULT/Reviewer/Publisher consumers and PTE-03 historical decoding.
- id: AC7
  condition: Runtime observations and feedback accounting preserve authenticated availability/delivery/withholding/unavailability,
    exact source witnesses and real read/resource costs without converting parser
    findings into semantic judgment or measured improvement.
- id: AC8
  condition: Focused source tests cover cumulative releasable data >24KiB/>64KiB,
    >8 failed nodes/frames, >4 safe assertions, first delivery and same-live-session
    additional read, all three flow bindings, forged/stale selectors, malformed summary,
    protected secrets/injected instructions, absent/truncated source, no duplicate
    pytest and old native/PTE-03 compatibility. Existing installed-native positive
    is not replaced by mocks/skip/xfail. Executor only claims test implementation;
    Runtime separately establishes test outcomes.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_egdf_intra_run.py tests/test_ka01_default_three_flow.py
  - python -m pytest -q tests/test_pte03_diagnostic_access.py tests/test_ka01_v13_intra_run_native.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
