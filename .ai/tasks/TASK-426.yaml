non_goals:
- No second planner, Runtime, verifier, diagnosis agent, generic lifecycle router,
  network listener, background process, persistent database, replacement of PTE-03
  public FAILURE projection or new third-party service.
- No automatic authoring of REPAIR/REMEDIATION, selecting/changing sticky Executor,
  modifying source outside the exact scope, altering Reviewer semantic judgment, publication
  eligibility or downstream repository pin.
- No hard-coded aggregate diagnostic cap masquerading as a safety measure (24 KiB,
  64 KiB, 1 MiB, static eight nodes/frames, four assertions, fixed page count, arbitrary
  total token or byte quota). Do not globally remove legitimate per-frame transport,
  read authentication, finite resource or raw-capture integrity checks.
- No fabricated test identity, root-cause verdict, assertion, source line or proof
  when source unavailable; no raw log/path/secret/PII exposure, no runtime interpretation
  of log instructions, no transferring arbitrary untrusted commands to live model
  as executable instructions.
- No correction permission for ERROR/UNKNOWN/incomplete/unstable observations; no
  changes to strict-decreasing-native-failure-identities correction criterion unless
  separately Human-authorized, no new automatic retry when exhausted, no second RUN
  on intermediate FAIL.
- No mandatory ROI study, pilot/shadow, post-task activation follow-up, broad pytest
  full suite, provider-specific claims for unsupported native recipient channels or
  retroactive updates to earlier TASK/RUN lineages.
constraints:
  hard:
  - Prospectively amend KA-01 C.4 / TASK-425 integration and Human-owned roadmap planning
    to authorize authenticated technical diagnostic facts attached to eligible native
    feedback for newly admitted coding RUNs in all 3 original operations. Preserve
    old mode decoders, published TASK-424/425 and all predecessor failures. Source
    of truth remains original Runtime complete verification/evidence.
  - Build on existing authenticated checkpoint captures and PTE-03 technical extractor/strict
    field-level source-proven sanitization. A fresh checkpoint-scoped identity/read
    interface cannot require a terminal private FAILURE digest. Bind original TASK/revision/RUN/operation/admitted
    policy/family authority/candidate SHA/checkpoint digest/native raw evidence digest/selected
    session and current lease; authority derived from original admission, never from
    a cursor alone.
  - Send directly available high-value diagnostic facts on first eligible feedback
    including observed full failure population presence/completeness, safely-proven
    test node identity (with parameter handling), exception family, repository-relative
    path and line, safe assertion operands, setup/call/teardown phase, technical signals
    (including malformed summary/environment/config/worker) and explicit redaction/unavailable
    reasons. Preserve original acceptance IDs, proof hash and feedback receipt; do
    not replace identity verification with diagnosis.
  - 'NO ARTIFICIAL TOTAL CEILING: All safely derivable technical evidence already
    present and authenticated for the checkpoint must be potentially retrievable;
    no static aggregate byte/token limit, total record/failure-node/frame/assertion
    count, page count or inherited 24-KiB PTE-03 / 64-KiB KA-01 envelope limit may
    prevent this. Technical framing, per-read bounds, timeout and original RUN wall/budget
    are finite, but must support authenticated continuation/cursors or equivalent
    selective demand retrieval instead of truncating/discarding cumulative available
    data. If original capture is absent/truncated or resources really expire, report
    truthfully missing/unavailable vs not-yet-delivered; do not promise unlimited
    input material.'
  - 'The receipt and native transport stay original-session/connection/thread/process-bound.
    If feedback diagnostic exceeds a native message, use a genuine verified incremental
    read facility or existing original channel ability: first small factual message
    plus safe cursor/locator; the same admitted Executor can retrieve more without
    a fresh RUN/model process, new independent service or extra verification command.
    Executor may select read detail/granularity; each read is read-only and source/currentness
    authenticated, with no data-driven command execution or arbitrary filesystem traversal.'
  - 'Filter untrusted bytes before provider exposure: reuse/extend PTE-03 closed technical
    extraction only from authenticated source and proven test blobs, preserve source-relative
    file/line and safe assertion validation; no raw transcript/secret/user path, dynamic
    unproven operands, encoded secret or injected instructions as prompt authority.
    Private protected source bytes stay original Runtime-owned; public PTE-03 schema/limitations
    and historical readers do not leak or change meaning.'
  - Diagnostic read itself creates no checkpoint, correction, lease, FAILURE, review,
    publication, second verification or budget credit; it consumes actual RUN time/resources.
    Original KA01 2 corrections / 3 checkpoints / 240m RUN wall / 180m cumulative
    verifier defaults, strict improving failed identities, canonical final checkpoint
    proof and one terminal remain untouched. If eligibility UNKNOWN/unstable, a safe
    STOP diagnostic may inform rightful authority but not give Executor correction
    permission.
  - PRIMARY feedback covers original TASK AC, REPAIR inherits exact failed/root baseline
    and authorized mutation scope/complete cumulative proof, REMEDIATION inherits
    REVIEW finding/reviewed SHA/narrow affected proof. In all three operations, candidate
    and source reauthentication, session identity, clean committed source, versioned
    source/feedback/cursor digest and stale/replay defenses remain effective. No automatic
    family transition or false terminal.
  - Extend existing original Runtime observations to distinguish AVAILABLE vs WITHHELD
    vs UNAVAILABLE vs NOT_YET_DELIVERED, number of documented/read facts without fake
    completeness, source witnesses and real read costs. Reviewer/Publisher consume
    unchanged terminal/result shapes; advisory diagnostic does not decide semantic
    fix.
  - Focused tests must prove >24 KiB safely releasable aggregate, >64 KiB across reads,
    >8 distinct failed nodes and frames and >4 safe assertions, dynamic source read
    demand from SAME native Codex session using real original installed app-server
    when available, ordinary PRIMARY/REPAIR/REMEDIATION entries, re-read stable history,
    no second pytest invocation due to pagination, malformed summary fallback, source
    poisoning/redaction, forged/cross-RUN/session cursor, stale SHA, unavailable source/observer,
    exhaustion honest accounting and old PTE-03 contract compatibility. Do not skip/xfail
    existing genuine native integration; if installed provider unavailable, truthfully
    STOP instead of synthetic positive proof.
  - Minimum sufficient verification only; no full suite and no unverifiable completion-phase
    claims in Executor AC. A new revised public PTE projection is NOT a required output.
    Audit closure is Brain semantic judgment; Runtime and Reviewer own independent
    truth.
acceptance:
- id: AC1
  condition: An approved prospective EGDF v1 contract and Human priority update explicitly
    authorize diagnostic enrichment on top of published TASK-425 default three-flow
    while keeping old PTE-03 public views and historic RUN/policy semantics unchanged,
    with no later pilot or activation task.
- id: AC2
  condition: Original Runtime can derive checkpoint-scoped diagnostic from authenticated
    native verification records before FAILURE terminal, reuse shared PTE-03-grade
    technical extraction/filtering, and cross-bind original RUN/TASK/operation/candidate/checkpoint/source
    raw digests without a second verifier or a terminal FAILURE prerequisite.
- id: AC3
  condition: For eligible FAIL the original live Codex Executor receives source-backed
    failed test identity, phase, type of exception, relative frame, safe assertion
    and technical signals when present, with explicit unavailable/withheld semantics,
    original proof/acceptance data and immutable same-session feedback receipt; no
    Root Cause claim from parser.
- id: AC4
  condition: No arbitrary aggregate 24-KiB/64-KiB/1-MiB or 8-node/frame/4-assertion/page-count
    limit blocks access to all safely derivable authenticated checkpoint diagnostic.
    Per-message/read bounds are handled by authenticated continuation or selective
    read; tests cover aggregate datasets exceeding old hard limits and truthful source/resource
    exhaustion.
- id: AC5
  condition: Same admitted Codex original native live session can read additional
    authenticated checkpoint diagnostic on demand and then commit corrected descendant
    C2 without another Executor/process/thread, RUN, canonical verification or trust
    issuer. Wrong/replayed/cross-session/cross-operation/cross-candidate selectors
    and changed sources fail closed.
- id: AC6
  condition: Existing PTE-03 privacy and authenticity constraints are preserved including
    secret/PII/injected-instruction/redacted-location/encoded payload cases, committed-source
    proof for released nodes/frames/assertions, no raw source log/path in portable
    or provider requests; unavailable facts cannot be upgraded to PASS.
- id: AC7
  condition: Both first-feedback and subsequent reads integrate with ordinary PRIMARY,
    REPAIR and REMEDIATION run modes under existing original authorization, scope/lineage
    and source binding, preserving unsupported provider STOP and executorless/no-change
    logic.
- id: AC8
  condition: All KA01 correction eligibility, strict decrease of failed identities,
    2 corrections, 3 checkpoints, 240m RUN/180m verification defaults, sole terminal
    RESULT/FAILURE, evidence reuse, historical typed modes, Reviewer and Publisher
    boundaries remain unchanged; diagnostic reads incur time/resource only.
- id: AC9
  condition: Focused production/native positive test and adversarial test coverage
    demonstrate 3-flow diagnostic continuity, >24KiB and >64KiB cumulative read, >8
    failures, >4 assertions, malformed summary, secret/prompt injection rejection,
    cursor replay/foreign SHA, no duplicate verification, read exhaustion and old
    PTE-03 compatibility. Preserve existing TASK-425 installed-native positive without
    fake or skip.
- id: AC10
  condition: Runtime observation and result handoff truthfully distinguish available,
    delivered, withheld and unavailable diagnostic with exact source identities and
    actual read accounting; no invented measured improvement, no new lifecycle/ref,
    no downstream adoption claim.
