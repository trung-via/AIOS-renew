task_id: TASK-426
revision: 2
goal: 'Implement and activate EGDF v1 prospectively in the existing KA01-v1.3 Verify-Fix-Verify
  mechanism: deliver authentic PTE-03-grade checkpoint failure facts and on-demand
  additional safe facts to the same admitted native Executor across PRIMARY, REPAIR
  and REMEDIATION, without an arbitrary aggregate diagnostic ceiling, second verification,
  new RUN, or new authority.'
problem: TASK-426 r1 has seven terminal failed RUNs (001..007), none yielding a committed
  implementation candidate or Runtime verification. RUNs 003/005/006/007 reported
  native original-session lost; RUN 004 completed a turn without source progress.
  Canonical failures do not isolate a definitive transport root cause. Independent
  V1..V4 Codex probes succeeded with short/read-only/tool activity and a small isolated
  mutating commit, but these are noncanonical diagnostics and do not prove the full
  TASK workload works. R1 mixes repeated constraints, broad implementation requirements,
  native proof claims and verification outcomes; r2 reconciles the contract to testable
  Executor-owned implementation outcomes while preserving the Human-approved EGDF
  objective and security/evidence floors.
assumptions:
- Revision 1 and all RUN-426-001..007 FAILURE/REPAIR lineage remain immutable. This
  r2 contract, if admitted, starts a separately authorized PRIMARY and never reinterprets
  or resumes an r1 RUN. Current source is canonical main 5316dbd7236b0066aa8f0e1c2b00d5b2dd9ff179;
  actual admission must independently check main currentness.
- The failed native connection cause remains UNKNOWN; task complexity and prompt/schema
  interaction are hypotheses, not verified root causes. V4 PASS is an isolated noncanonical
  439-byte mutating probe, not production verification.
- The published KA01-v1.3, original TASK-425 history and PTE-03 historical terminal
  reader retain their previously reviewed meaning. EGDF is a prospective checkpoint-scoped
  extension, not retrospective source rewrites.
- Current Codex native app-server has authenticated first-party session continuity;
  additional diagnostic reads may use only an actual supported same-session channel.
  If unavailable, it is a truthful BLOCKER, never grounds for an invented capability,
  hidden service, second Executor or fake pass.
- The allowed inspect/modify paths are permissions, not a checklist of files to read
  or edit; the admitted Executor chooses minimum sufficient implementation sequence
  and commits. Runtime, Reviewer and Publisher retain independent authority.
