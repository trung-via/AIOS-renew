task_id: TASK-426
revision: 1
goal: "Implement and activate Evidence-Grounded Diagnostic Feedback (EGDF) v1 in the\
  \ existing KA01-v1.3-default-three-flow-v1 Verify \u2192 Fix \u2192 Verify mechanism,\
  \ so the same admitted Executor in PRIMARY, REPAIR and REMEDIATION receives actionable\
  \ authenticated PTE-03-grade checkpoint diagnosis (failed test identity, exception,\
  \ source frame, safe assertion, structural/environment signals) and can progressively\
  \ retrieve ALL lawfully releasable evidence from that checkpoint without an arbitrary\
  \ aggregate 24-KiB, 64-KiB, failure-node/frame/assertion or page-count ceiling,\
  \ without rerunning verification or spawning a new RUN. Preserve original Runtime\
  \ verification authority and live-session correction semantics."
problem: Canonical main fa51017f9ce9486ad041e214f1375aa03e9031c3 is the exact REVIEW-425-001
  PASS source of TASK-425 r1 / RUN-425-005 RESULT, after immutable four-failure REPAIR
  lineage. Its default-on three-flow KA-01 uses a Runtime-native factual feedback
  path where _prepare_interactive_feedback() sends hashes and PASS/FAIL identities
  but deliberately excludes pytest nodeids, exceptions, relative frames, assertion
  values, and technical causes. _execute_interactive_primary() supplies only that
  envelope to the same live Codex session. Existing PTE-03 source-authenticated technical
  extraction and field-level filtering in review_transport.filter_failure_technical_spans()
  can identify these useful facts, even on MALFORMED_SUMMARY, but the terminal diagnostic
  reader requires a private FAILURE and current reader projects at most 24 KiB, eight
  nodes/frames and four assertions; the current KA01 envelope has a separate 65536-byte
  ceiling and Codex transport has per-message limits. Human explicitly approves prospective
  EGDF architecture after Adaptive Brain Audit V1 and expressly rejects moving 24-KiB
  into another arbitrary total-size cap; the desired information should be usable
  inside the same RUN before any terminal FAILURE. The PTE-03 historical after-terminal
  public/private readers remain their own information-only authority.
assumptions:
- 'Exact original reviewed source of TASK-425 is fa51017f9ce9486ad041e214f1375aa03e9031c3,
  with Runtime proofs RUN-425-005-V001/V002 exit_code 0, REVIEW-425-001 PASS AC1..AC9
  and main pointing to the reviewed source. The new scope is prospective: no retroactive
  RUN repair or reclassification of RUN-425-001..004 and no reopening TASK-425.'
- Human approval is for one integrated EGDF implementation and supported activation,
  not blanket TASK/REPAIR/REMEDIATION dispatch authority or selection of a new Executor.
  Human has not explicitly re-delegated a model for TASK-426; Executor selection is
  a separate legal wake/admission binding.
- 'Adaptive Brain Audit V1 exact canonical main registry and active planning profile:
  id aios-adaptive-brain-audit-v1, version 1, digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718.
  CONSTRUCT considered retain-hash-only (insufficient), bounded reusable extractor+progressive
  reading (selected), and separate diagnostic agent/store (unnecessary). ADVERSARIAL_AUDIT_AND_RECONCILE
  challenged eight lenses, including source auth, no fake FAIL eligibility, per-message
  vs total bounds, historic terminal compatibility, privacy and third-service creation;
  final reconciled architecture is a CANDIDATE, not Runtime or Reviewer PASS.'
- Existing PTE-03 terminal reader and historical safe-detail schemas retain exact
  decoding and preexisting public size/shape; EGDF adds a separate checkpoint-scoped
  private read/projection path reusing proven extraction/sanitization semantics rather
  than reusing terminal FAILURE identity. Historic PTE-03 limits are not inherited
  as EGDF aggregate limits.
- 'Physical transport and original RUN resource envelopes are finite: per-message
  parsing, timeout, verified provenance checks and source capture may have legitimate
  finite technical bounds. Such local bounds are not an artificial total cap. Authenticated
  incremental/paged retrieval must remain possible until all accessible releasable
  diagnostic data for the exact captured checkpoint can be retrieved or real source/time/transport/authorization
  limits are honestly reported. No assurance of unbounded bytes from uncaptured or
  untrusted sources.'
- Canonical checkpoint FAIL eligibility retains original exact complete stable and
  source-bound verification requirements, with at most 2 corrections and 3 checkpoints
  under 240-minute RUN wall/180-minute cumulative verification; EGDF cannot convert
  setup/collection/teardown/unknown/incomplete failures into correction authorization.
- Codex app-server original session is validated in the supported TASK-425 installed-native
  path. Antigravity/Minimax do not gain new unsupported native live-session proof
  through EGDF. Source bytes and GitHub operational carrier are not authority; original
  Runtime protected checkpoint captures and their digests are.
