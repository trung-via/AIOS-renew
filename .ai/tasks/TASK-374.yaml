non_goals:
- No production code, policy switch, activation marker, MAIN roadmap advancement,
  task dispatch, new Runtime test-runner, extra qualification stage, shadow scheduler,
  automatic correction router, or Executor delegation.
- No deletion or mislabeling of historical KA-01 v1.0 ratification, TASK-329 publication,
  existing V1/V2 proofs, immutable TASK/RUN/REVIEW/RESULT/FAILURE/EVIDENCE, or already
  admitted tasks.
- No broad removal of deterministically enforceable per-RUN consent, exact same Executor/lease,
  bounded resources, semantic proof completeness, valid applicability, one canonical
  terminal, or Runtime/Reviewer/Publisher authority.
- No fictitious completion of future L1/L2/L3, no claim that new KA-01 machinery is
  implemented, no falsely observed VP-06 benefit or AC-01..AC-36 conformance, no inference
  that legacy or downstream tasks opt in.
- No redefinition of pre-AIOS transport errors as RUNs, no model choosing correction
  HOW, and no unreviewed proof weakening to manufacture green tests.
constraints:
  hard:
  - Publish a prospective, explicitly versioned KA-01 activation amendment with exact
    2026-10-18 Human intent. The previously published v1.0 version and earlier normative
    gates remain historically explainable; neither silently change already-admitted
    work nor claim this new normative version activated merely from a documentation
    edit.
  - 'Reconcile KA-01 D.1 G3 to require minimum actually implemented, independently
    Runtime-verified, semantically reviewed and published eligible L1 proof-contract/readiness
    plus L2/L3 production core: authenticated source/provenance/applicability, exactly
    one Runtime scheduler, verified same-Executor/lease/resources/scope/progress/terminal
    guard, reviewed rollback/opt-in and focused real negative safety tests feasible
    before activation. Explicitly distinguish these preactivation core safety checks
    from real production-episode VP-06/VP-07 conformance. Do not treat TASK-373 L1
    readiness as completed VP-01 or full L1 exit, and eliminate full VP-06/VP-07 as
    activation prerequisites.'
  - Reconcile D.1 G4 and G5 so real whole-episode measurement VP-06 and complete VP-07
    AC-01..AC-36 conformance are mandatory observable L4 post-activation obligations,
    not falsely labeled PASS or an implicit blocker preventing the very real episodes
    needed for measurement. Unknown measurement and new unsafe failures must remain
    reported and follow authenticated STOP/rollback/repair as appropriate.
  - "Reconcile D.1 G6 with the existing explicit 2026-10-18 Human policy/risk decision:\
    \ production usage only once the exact L1\u2013L3 eligible implementation is canonically\
    \ verified, independently reviewed, published, and an actual versioned per-RUN\
    \ finite Human opt-in/delegation is authenticated at admission. Human priority\
    \ approval alone is never executable feature readiness; no automatic blanket migration\
    \ to new policy."
  - "Clarify KA-01 C.3(1): a prospective opted-in production RUN may use same-RUN\
    \ continuation only after eligible activation; implementing and verifying L3 through\
    \ the existing admitted Runtime does not require that production continuation\
    \ mechanism to be previously ACTIVE. Avoid any G5\u2192G6\u2192G5 cycle without\
    \ inventing a second Runtime."
  - "Maintain every deterministic invariant of C.1\u2013C.6 and D.4: exact TASK/RUN/candidate/contract\
    \ mapping, original consent, same live lease/Executor, full semantic coverage,\
    \ typed factual feedback, bounded progress/costs, no duplicate checkpoints/proof/terminal,\
    \ UNKNOWN fail-closed, historical replay and explicit prospective rollback. Preserve\
    \ the distinction between a core safety regression and long-horizon post-activation\
    \ conformance."
  - "Update Lean VP L1\u2013L4 and gate/success wording consistently: L1 now has published\
    \ TASK-373 baseline-readiness slice but outstanding VP-01/matched-episode measurements;\
    \ L2 authenticated applicability; L3 real implementation and focused independent\
    \ core safety verification before activation; L4 empirical real production episode\
    \ conformance/measurement from subsequent lawful TASKs. State that canonical roadmap\
    \ remains Lean VP NEXT and cannot be advanced automatically by publication."
  - Scope modification to the two listed documents, keep current production behavior
    unchanged, leave historic v1.0 and original task/review/publication lineage identifiable,
    and do not insert an artificial qualification pipeline as a substitute for removing
    the cyclic prerequisites.
acceptance:
- id: AC1
  condition: The KA-01 document explicitly identifies a distinct prospective amended
    activation version, the exact Human 2026-10-18 change and superseded v1.0 activation
    sequencing, without changing frozen Kernel v0.1 or reclassifying historic artifacts.
- id: AC2
  condition: 'KA-01 D.1 defines an acyclic activation dependency: previously lawful
    G1/G2 and new versioned normative eligibility, actual reviewed/published L1 core
    readiness plus L2/L3 implementation with focused independent core-safety negative
    proof, and authenticated exact Human/versioned per-RUN opt-in. Real VP-06/VP-07
    production episodes, full AC-01..AC-36 and postactivation measurements are not
    prerequisites; a readiness slice alone is insufficient.'
- id: AC3
  condition: KA-01 D.1/D.2/D.3 preserve VP-01/VP-06 measurements, VP-07 real positive/negative
    AC-01..AC-36 conformance and correction of revealed safety defects as explicit
    unproved L4 postactivation commitments rather than reporting them completed or
    deleting them.
- id: AC4
  condition: KA-01 C.3(1) unambiguously separates lawful offline/Runtime verification
    of L3's implementation from the later per-RUN production continuation permission,
    eliminating the circular activation requirement without granting preimplementation
    RUN mutation.
- id: AC5
  condition: The amended KA-01 retains all exact Human/Brain/Executor/Runtime/Reviewer/Publisher
    separations, same-Executor/lease and scope/budget guards, authorized full semantic
    proof, fail-closed unknown, one terminal, versioned opt-in, historical compatibility
    and prospective rollback.
- id: AC6
  condition: The Lean VP architecture document consistently recognizes TASK-373 as
    published L1 readiness only (VP-01 still outstanding), locates future production
    activation after eligible reviewed/published L2/L3 core safety engineering, and
    assigns L4 real production-episode conformance and measurement without parallel
    Runtime, automatic PASS, or TASK/roadmap advancement.
- id: AC7
  condition: The final source candidate changes only the two named architecture/specification
    documents, neither asserts KA-01 production already ACTIVE nor mutates any Runtime
    code or past canonical TASK/RUN/RESULT/REVIEW/FAILURE source.
