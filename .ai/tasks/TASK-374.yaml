task_id: TASK-374
revision: 1
goal: "Revise the prospective KA-01 normative activation sequence to remove the circular\
  \ G3/G4/G5/G6 pre-production dependencies, allowing bounded Human-authorized production\
  \ opt-in after the real, reviewed/published L1\u2013L3 Runtime implementation exists,\
  \ while moving VP-06/VP-07 full-episode measurement and AC-01..AC-36 progressive\
  \ conformance to L4 after activation. Preserve Kernel/Runtime safety, proof completeness\
  \ and historical authority."
problem: "The currently published KA-01 v1.0 section C.3 requires activation before\
  \ preterminal same-RUN continuation, while D.1 G3 requires VP-03..VP-07 implemented\
  \ and G5 requires real same-RUN VP-07 conformance before G6 permits activation.\
  \ Human explicitly changes the program on 2026-10-18: remove only circular readiness\
  \ conditions, execute L1\u2192L2\u2192L3, enable production after L3, and use subsequent\
  \ real production tasks for L4 conformance/measurement. A separate qualification\
  \ layer or fake ACTIVE flag before implementation would be unnecessary and unsound;\
  \ revise the actual normative dependency boundary, not the authority/identity guards."
assumptions:
- 'Fresh canonical main at this new authoring is 6e8cba6d96f3f5044672b687bef4c63e4c641151,
  exactly the TASK-373 r1 RUN-373-001 reviewed and published candidate; TASK-374 does
  not yet exist. Prior Issue #2115 was an unsuccessful pre-job GitHub carrier at old
  expected main 46c6a787be1b3079de01289fd5fb8a3eb7d829c6, with no canonical TASK/RUN.
  This is a distinct new ingress attempt, not a replay. Runtime must independently
  validate exact TASK identity, current expected-main CAS, authoring source and legacy
  affinity.'
- TASK-373 r1 / RUN-373-001 / REVIEW-373-001 PRIMARY PASS was published as 6e8cba6d96f3f5044672b687bef4c63e4c641151.
  It delivered only a bounded read-only L1 baseline/readiness projection, not completion
  of measured VP-01, the entire L1 program, L2/L3 implementation, L4 conformance,
  or KA-01 activation. The normative amendment must preserve this exact distinction
  and historical L1 documentation.
- Human 2026-10-18 explicitly approves removing the activation prerequisite that requires
  L4/VP-06/VP-07 real conformance before activation. Human does NOT authorize fabricated
  evidence, deleting Runtime deterministic safety, admitting a nonimplemented same-RUN
  loop or publishing an unreviewed kernel change.
- KA-01 v1.0, separately ratified and published through TASK-329 / REVIEW-329-001,
  remains an immutable historical normative version. This TASK prospectively revises
  the exact document's effective version and must distinguish future v1.1 activation
  semantics from earlier 1.0 and already-admitted history.
- TASK-326 proof coverage and TASK-328 intra-RUN feedback are offline foundations,
  not an implemented production scheduler. L1 measurement and L2 applicability remain
  distinct bounded work, L3 must implement and prove basic safety before production;
  L4 is an unproven subsequent measurement/conformance program.
- The canonical Lean VP NEXT remains unchanged by this TASK. The exact standing return-affinity
  for new AIOS-renew TASKs is LEGACY_REPOSITORY_DEFAULT_ROUTE; the revised TASK does
  not choose Executor, model, profile, operating budgets or approval for a particular
  future RUN.
- The TASK_AUTHORING audit profile is canonical tca-1 version 1 with content digest
  1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2. That audit is
  Brain-owned support only; Runtime remains authoring/verification authority, independent
  Reviewer judges, Publisher publishes.
scope:
