task_id: TASK-315
revision: 1
goal: Complete BO-1R across the durable REPAIR wakeup/dispatch boundary by making
  Executor/profile admission follow canonical correction preflight executor_required,
  so an eligible same-head FINALIZE_CANDIDATE continuation can reuse preserved structural
  state and reach Runtime verification without invoking a coding Executor while non-reusable
  corrections retain the existing explicit-Executor path.
problem: 'TASK-314 published the same-head structural ResultPackage preservation rule
  and its core repair admission correctly reports executor_required=false when FINALIZE_CANDIDATE
  has an eligible preserved package; _run_repair_impl likewise supports that state
  by reusing the package and skipping execution-profile binding plus coding-Executor
  dispatch. Production resumption of TASK-313 exposed a missed durable-boundary integration:
  automatic REPAIR wakeup with no Executor stops before RUN creation because run_repair_wakeup
  and repair_dispatch still hard-code FINALIZE_CANDIDATE as a coding action requiring
  an Executor, while a Human wakeup carrying Codex stops with ''canonical coding REPAIR
  authority is inconsistent'' because canonical preflight correctly says no Executor
  is required. Both bounded operational receipts report run_created=false and executor_invoked=false,
  so no canonical TASK-313 FAILURE was created. The durable wakeup/dispatch layer
  must consume the canonical preflight requirement rather than re-derive Executor
  authority from the action label.'
assumptions:
- Canonical main at authoring is e2b83a779404d2b62d4998a09c1312b7a3a11b01; TASK-314
  is reviewed/published at 6671a2724b5b1b7fe03ac66468e79ef209bf876d and TASK-313 remains
  the BO-1 implementation identity.
- The current TASK-313 correction subject remains RUN-313-004 with canonical REPAIR-313-004-001
  at 2414a649b28b2bcb3f5545295a83388ab0596041, action FINALIZE_CANDIDATE, exact failed
  head dd287d11eeaed3ba4bccabcd992fcb1b831bc0a3, and no RUN-313-005 continuation.
- Canonical correction preflight for that authorization is READY with an eligible
  preserved same-head package and therefore executor_required=false; this deterministic
  fact is Runtime-owned and is not a new Brain correction-strategy decision.
- The two observed wakeup failures are pre-RUN operational failures only; neither
  may fabricate a RUN, FAILURE, verification result, review verdict, publication fact,
  or roadmap completion state.
- TASK-313 remains paused only because the published BO-1R behavior is unreachable
  through the durable REPAIR wakeup/dispatch boundary; this TASK is a narrow BO-1R
  integration hotfix and does not replace or expand TASK-313.
scope:
  inspect:
  - .ai/tasks/TASK-314.yaml
  - .ai/tasks/TASK-313.yaml
  - src/aios_renew/operator.py
  - src/aios_renew/repair_dispatch.py
  - src/aios_renew/correction_preflight.py
  - src/aios_renew/github_issue_repair_wakeup.py
  - .github/workflows/aios-self-hosted-repair-wakeup.yml
  - tests/test_operator.py
  - tests/test_repair_dispatch.py
  - tests/test_operator_correction_preflight.py
  - tests/test_github_issue_repair_wakeup.py
  - tests/test_github_issue_repair_wakeup_workflow.py
  modify:
  - src/aios_renew/operator.py
  - src/aios_renew/repair_dispatch.py
  - tests/test_operator.py
  - tests/test_repair_dispatch.py
  - tests/test_operator_correction_preflight.py
non_goals:
- Change how Brain selects FINALIZE_CANDIDATE, NO_CHANGE, CODE_FIX or CONTINUE_IMPLEMENTATION,
  or add automatic correction selection, retry, failover or routing authority.
- Change same-head preserved-package discovery, eligibility, nearest-lineage traversal,
  head-change stopping rules, acceptance-coverage requirements or structural evidence
  rules implemented by TASK-314.
- Modify, supersede, re-authorize, execute or rewrite REPAIR-313-004-001 or any TASK-313
  RUN/FAILURE/REPAIR artifact inside this TASK.
- Implement BO-1 AUTHOR_TASK ingress simplification, BO-2 through BO-9, BO-7 correction-authoring
  simplification, BO-4 sticky execution-profile policy, TASK-310 or H4 behavior.
- Permit CODE_FIX or CONTINUE_IMPLEMENTATION to execute without a coding Executor,
  or let a non-reusable FINALIZE_CANDIDATE silently proceed without its required Executor/profile.
- Turn an inherited failed-RUN Executor label on an executor-elided continuation into
  an execution-profile claim or evidence that a coding Executor was invoked.
- Change Reviewer, Publisher, Runtime verification ownership, canonical RESULT/FAILURE
  schemas, or roadmap state automatically.
constraints:
  hard:
  - After Brain has already selected and canonicalized the REPAIR strategy, canonical
    correction preflight executor_required is the deterministic authority for whether
    the durable wakeup/dispatch invocation requires a coding Executor; transport must
    not re-derive that requirement solely from the REPAIR action string.
  - For READY FINALIZE_CANDIDATE with executor_required=false, durable wakeup/dispatch
    must admit an executorless and profileless request, create the ordinary continuation
    RUN, preserve exact TASK/failed-RUN/repair-SHA/action lineage, reuse only the
    Runtime-admitted preserved package, and invoke no coding Executor or native mutation
    dispatcher.
  - For executor_required=true, the existing explicit supported Executor plus bound
    model/effort profile requirement remains fail closed; missing or inconsistent
    Executor/profile input must not create a RUN.
  - Supplying a coding Executor/profile when canonical preflight says executor_required=false
    must fail closed before RUN creation rather than fabricating an Executor invocation
    or overriding Runtime reuse eligibility.
  - Durable repair-dispatch state must represent executorless FINALIZE_CANDIDATE distinctly
    and validly without misclassifying it as NO_CHANGE; replay, selector collision,
    RUN binding, terminal attribution and profile integrity remain exact and idempotent.
  - CODE_FIX and CONTINUE_IMPLEMENTATION remain Executor-required; NO_CHANGE remains
    executorless under its existing reusable verification contract; only FINALIZE_CANDIDATE
    may be either Executor-required or executor-elided according to canonical preflight.
  - An executor-elided FINALIZE_CANDIDATE may inherit the failed RUN's Executor label
    only where the frozen RUN schema requires lineage compatibility; no execution
    profile may be persisted and executor_invoked must remain false.
  - Preserved structural state is not verification evidence. The continuation must
    still execute the TASK's configured Runtime verification for the exact candidate,
    attach only fresh Runtime evidence, then proceed through ordinary semantic Review
    and exact Publisher boundaries.
  - Executor changes only scope.modify and does not execute/re-authorize TASK-313,
    advance BO-1/BO-1R roadmap semantics, issue a review verdict or publish source.
acceptance:
- id: AC1
  condition: run_repair_wakeup and the durable REPAIR dispatch boundary consume the
    canonical preflight Executor requirement so an eligible reusable FINALIZE_CANDIDATE
    with executor_required=false is accepted without Executor/profile while a non-reusable
    FINALIZE_CANDIDATE still requires them.
- id: AC2
  condition: The executor-elided FINALIZE_CANDIDATE path creates and durably binds
    an ordinary continuation RUN to the exact failed_run_id, repair authorization
    SHA, TASK and action, reuses the already-admitted structural package, persists
    no execution profile and invokes no coding Executor/native mutation dispatcher.
- id: AC3
  condition: Durable dispatch records, replay/collision checks, RUN attribution and
    terminal reconciliation support executorless FINALIZE_CANDIDATE without weakening
    exact selector/profile binding or conflating it with NO_CHANGE.
- id: AC4
  condition: CODE_FIX and CONTINUE_IMPLEMENTATION remain Executor-required; NO_CHANGE
    remains executorless; FINALIZE_CANDIDATE with no eligible preserved package remains
    on the existing explicit Executor/profile fallback path, and inconsistent supplied
    Executor versus canonical executor_required fails before RUN creation.
- id: AC5
  condition: Fresh Runtime verification remains mandatory after executor-elided structural
    reuse and no prior verification evidence, semantic review verdict or publication
    fact is reused or fabricated.
- id: AC6
  condition: 'Regression coverage reproduces both observed TASK-313 delivery shapes:
    automatic executorless wakeup succeeds through durable admission when preflight
    says executor_required=false, while an explicitly supplied Executor for that same
    executor-elided state is rejected without RUN creation; negative tests also cover
    non-reusable FINALIZE, CODE_FIX, CONTINUE_IMPLEMENTATION and NO_CHANGE isolation.'
- id: AC7
  condition: Candidate changes are limited to scope.modify, introduce no new semantic/lifecycle/router/retry
    authority, and leave TASK-313 canonical correction artifacts and BO-1/BO-7/H4
    planning state untouched.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_repair_dispatch.py tests/test_operator.py tests/test_operator_correction_preflight.py
  - git diff --check
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
