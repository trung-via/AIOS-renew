task_id: TASK-099
revision: 2

goal: >
  Complete P3C by exposing bounded exact outstanding-finding state through the
  canonical Human-facing surface and by separating each finding's immutable P3A
  semantic predecessor from the exact cumulative candidate used as the next
  REMEDIATION execution base, so serial sibling corrections preserve prior reviewed
  corrections without Runtime selecting findings or weakening publication safety.

problem: >
  Revision 1 proved that P3B correctly preserves sibling findings, but it also exposed
  a contract deadlock. REVIEW-099-001 reported F1 and F2; RUN-099-002 resolved F1 and
  publication correctly retained F2. The remaining F2 cannot safely use the existing
  REMEDIATION path because Run.base_sha and the historical workspace are still forced
  to REMEDIATION.reviewed_sha, so correcting an older sibling would execute from the
  original reviewed candidate and can discard the already reviewed F1 delta. Creating
  a separate P3C2 task while revision 1 remains open would also advance main onto a
  sibling branch and manufacture an integration problem. P3C2 is new intent relative
  to revision 1, which explicitly excluded cumulative execution-base semantics, so
  revision 2 establishes one prospective contract rather than disguising the change as
  another revision-1 FIX.

assumptions:
  - Runtime resolves and binds the exact canonical main/base SHA at revision-2 admission; TASK does not predeclare an execution SHA.
  - P3A/TASK-097 and P3B/TASK-098 are semantically PASS and published.
  - TASK-099 revision-1 lineage RUN-099-001 -> RUN-099-002 and REVIEW-099-001/002 remains immutable historical evidence and does not establish revision-2 completion.
  - Human explicitly authorized P3 correction-lineage evolution including P3C2.
  - Remote lifecycle acquisition already filters engineering state by exact TASK revision while reserving the shared RUN namespace across revisions.
  - A cumulative execution base is operational state; it must never replace or rewrite the original P3A semantic predecessor identity of the selected finding.

