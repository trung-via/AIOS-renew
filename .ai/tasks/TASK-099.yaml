    - tests/test_operator_correction_preflight.py
    - tests/test_operator_human_surface.py
    - tests/test_operator_unified_state.py
    - tests/test_publication.py

non_goals:
  - Rewrite, delete, relabel, or declare resolved any TASK-099 revision-1 RUN, REVIEW, finding, remediation, result, or evidence artifact.
  - Auto-select, rank, prioritize, batch, or silently sequence one outstanding finding.
  - Auto-merge, rebase, cherry-pick, or otherwise integrate a diverged current main with a correction candidate; divergence must fail closed for separately authorized integration.
  - Change P3A's four-field semantic predecessor identity or P3B's finding-frontier meaning.
  - Change REVIEW or REMEDIATION authoring authority, Executor selection, canonical verification ownership, REPAIR, retry, reroute, or fallback semantics.
  - Introduce a planner, second lifecycle reducer, second frontier authority, or autonomous correction loop.

constraints:
  hard:
    - >
      P3A predecessor identity remains the semantic identity of the selected finding:
      source RUN id, REVIEW id, finding id, and original reviewed SHA. Cumulative
      continuation must never overwrite those four facts with a newer execution tip.
    - >
      Prospective REMEDIATION RUNs must persist a distinct bounded Runtime-owned exact
      execution-base identity. The execution base must bind the canonical candidate on
      which the Executor actually starts; Run.base_sha must equal that candidate SHA.
    - >
      The execution base for an outstanding sibling must be derived from exact canonical
      correction lineage and P3B frontier state, never from RUN numbering, timestamps,
      list order, finding-id search alone, current checkout coincidence, or a model
      heuristic. The selected semantic finding must still be outstanding at that tip.
    - >
      A cumulative execution base must contain every already reviewed correction in the
      exact lineage and must descend from the selected finding's original reviewed SHA.
      If the candidate is missing, ambiguous, inconsistent, non-descendant, or no longer
      contains the required correction tip, admission and publication must fail closed.
    - >
      Current canonical main must be an ancestor of or equal to the chosen cumulative
      execution base before mutation is admitted. If main and the correction tip have
      diverged, Runtime must report bounded integration-required state and must not
      automatically merge, rebase, replay, or mutate either lineage.
    - >
      CODE_FIX repository delta, Result.changed_files, modification-scope enforcement,
      and affected verification for a prospective cumulative REMEDIATION must be measured
      against its exact execution base, not against the older semantic reviewed SHA.
      Semantic REVIEW/REMEDIATION validation remains bound to the original predecessor.
    - >
      Publication must independently validate both identities: the original P3A semantic
      predecessor and the prospective cumulative execution base. It may publish only the
      exact reviewed candidate when the P3B frontier is empty and current main ancestry is
      safe; malformed or unprovable cumulative lineage fails closed.
    - >
      Legacy REMEDIATION RUNs that predate cumulative execution-base metadata remain
      readable under their already-established equality rule. Historical artifacts are
      immutable and absence of new metadata must never be guessed into cumulative meaning.
    - >
      Unified State and Correction Preflight must consume the same authoritative cumulative
      base facts used by execution/publication. Human Surface may expose those bounded facts
      but must not acquire finding-selection or mutation authority.
    - >
      Outstanding-finding observation is deterministically bounded. It must never silently
      truncate, hide, or prioritize findings; an over-bound canonical frontier fails closed
      with bounded structural state. Every emitted item retains exact source RUN, REVIEW,
      finding, and reviewed-SHA identity.
    - >
      Unexpected, alias, conflicting, or malformed prospective predecessor data must pass
      through the existing canonical P3A validator and fail closed consistently across
      Unified State, execution, preflight, and publication.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Unified State and Human Surface expose a deterministic fixed-bounded collection of
      exact outstanding-finding identities; multi-finding state yields Brain-owned
      AUTHOR_REMEDIATION with no implicit finding selector, and over-bound state fails closed
      without truncation or priority inference.
  - id: AC2
    condition: >
      Prospective predecessor-bearing lineage is validated by the canonical P3A four-field
      grammar everywhere it is consumed; malformed, alias, extra, or conflicting identity
      forms cannot be interpreted differently by Unified State and publication.
  - id: AC3
    condition: >
      A PRIMARY CHANGES_REQUIRED frontier and a DELTA PASS with unresolved siblings preserve
      all exact outstanding identities, while an empty frontier alone may proceed toward
      publication/DONE.
  - id: AC4
    condition: >
      For a first correction whose canonical tip is its semantic source candidate, the new
      execution-base contract preserves existing REMEDIATION behavior and exact selectors.
  - id: AC5
    condition: >
      For a later sibling whose semantic predecessor is older than the current correction
      tip, admission deterministically binds a distinct exact cumulative execution base,
      persists both identities without conflation, and starts the Executor from that base so
      previously reviewed sibling corrections remain ancestors of the new candidate.
  - id: AC6
    condition: >
      Prospective cumulative CODE_FIX completion and scope validation use the exact execution
      base for changed-files and affected-verification authority while the finding and
      REMEDIATION contract remain bound to the original reviewed SHA.
  - id: AC7
    condition: >
      Correction Preflight and Unified State report the same cumulative base readiness as
      execution; ambiguous, missing, non-descendant, or main-diverged bases fail closed before
      Executor invocation, with no automatic integration.
  - id: AC8
    condition: >
      Publication validates semantic predecessor, cumulative execution base, final candidate
      ancestry, DELTA lineage, and P3B frontier independently and refuses publication while
      any sibling remains outstanding or current main is not safely contained.
  - id: AC9
    condition: >
      Historical REMEDIATION artifacts without the new execution-base metadata retain their
      established interpretation, and TASK-099 revision-1 lineage remains immutable and
      excluded from revision-2 lifecycle completion.
  - id: AC10
    condition: >
      No finding auto-selection, retry, reroute, fallback, hidden planner, automatic merge,
      REVIEW/REMEDIATION authority transfer, or verification-ownership change is introduced.

verification:
  required:
    - python -m pytest tests/test_operator_correction_preflight.py tests/test_operator_unified_state.py tests/test_operator_human_surface.py -q
    - python -m pytest tests/test_publication.py -k "predecessor or frontier or remediation or cumulative" -q
    - python -m pytest tests/test_operator.py -k "remediation" -q
