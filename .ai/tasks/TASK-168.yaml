task_id: TASK-168
revision: 2

goal: >
  Complete the BP-V4 focused diagnostic cause-observability enhancement without
  changing the fixed six-target serial/parallel experiment, production semantics,
  Runtime verification authority, or worker-selection authority. Reuse the useful
  clean in-scope work from failed RUN-168-001 where compatible, close the bounded
  known-CorrectionIntegrationError classification gaps found by Brain audit, and
  leave canonical verification entirely to Runtime.

problem: >
  RUN-168-001 produced a clean transportable candidate
  289c6e6ceff4094e326bc286b7db19b1de1afded changing exactly the three authorized
  diagnostic files, but failed at COMPLETION_GATE before Runtime verification
  because the Executor incorrectly treated pending Runtime-owned verification as an
  unresolved item. A deeper Brain audit found a second contract issue: TASK-168 r1
  AC6 required the focused contract suite to pass even though Runtime performs that
  canonical verification only after structural completion, repeating the
  pre-verification/verification ordering contradiction previously exposed by
  TASK-167. The candidate itself is materially useful and in-scope, but its
  CorrectionIntegrationError prefix mapping is also incomplete: several known
  repository-owned messages from correction_integration.py still collapse to
  integration_boundary=other instead of an existing bounded semantic family.
  Revision 2 removes the acceptance-order contradiction and requires complete
  bounded coverage of known current Correction Integration message families before
  a fresh Runtime verification.

assumptions:
  - >
    Canonical main at TASK-168 revision-2 authoring is
    96e78aa497b1aa145e64de9bb3e175bf86ca2434.
  - >
    RUN-168-001 is an immutable TASK-168 r1 COMPLETION_GATE failure with failure
    artifact c086db93620a37f1cae3b09d2d8d638b6290db05 and clean failed candidate
    289c6e6ceff4094e326bc286b7db19b1de1afded. Its changed_files are exactly
    scripts/bp_v4_parallel_diagnostic.py, tests/bp_v4_diagnostic_plugin.py, and
    tests/test_bp_v4_parallel_diagnostic.py; outside_task_scope is empty,
    dirty is false, descends_from_base is true, repairable is true, and
    transportable is true.
  - >
    RUN-168-001 never entered Runtime verification; verification_seconds is null.
    No test PASS/FAIL claim may be derived from that RUN.
  - >
    Brain semantic audit of candidate 289c6e6... found the fixed targets/profiles,
    fail-closed validator design, transient-root normalization, bounded Git labels,
    and sanitized source-locus direction consistent with TASK-168 intent.
  - >
    The same audit found known production CorrectionIntegrationError messages not
    explicitly mapped by the candidate, including TASK identity/revision mismatch,
    canonical lifecycle main missing/mismatch, invalid operational tip, missing
    cumulative/main commit, and invalid merge-tree output. Known repository-owned
    messages should not be treated as unknown generic text when they can be mapped
    safely to a small existing or minimally extended fixed taxonomy.
  - >
    TASK-166 remains authoritative for focused diagnostic architecture and
    RUN-167-004 remains authoritative evidence that all six current representative
    nodes failed in all three profiles on its exact subject.
  - >
    Runtime owns canonical verification/EVIDENCE; Reviewer owns semantic verdict;
    Human/Brain own later interpretation and correction strategy.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-BRAIN-PORTABILITY.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-166.yaml
    - .ai/tasks/TASK-167.yaml
    - .ai/tasks/TASK-168.yaml
    - src/aios_renew/correction_integration.py
    - scripts/bp_v4_parallel_diagnostic.py
    - tests/bp_v4_diagnostic_plugin.py
    - tests/test_bp_v4_parallel_diagnostic.py
  modify:
    - tests/bp_v4_diagnostic_plugin.py
    - scripts/bp_v4_parallel_diagnostic.py
    - tests/test_bp_v4_parallel_diagnostic.py

non_goals:
  - Repair or replay RUN-168-001 under its contradictory revision-1 acceptance contract.
  - Modify production Correction Integration, Runtime, verification, Git fixtures, test semantics, workflows, publication, dispatch, or roadmap state from Executor execution.
  - Change the six fixed diagnostic node identities, profile order, or worker counts.
  - Add worker 3, dynamic selection, retry, fallback, rerun, grouping, adaptive scheduling, or full-suite measurement.
  - Fix any of the six currently failing representative tests.
  - Persist raw exception messages, raw traceback, locals, assertion values, arbitrary stdout/stderr, credentials, URLs, tokens, environment, or unrecognized private paths.
  - Add semantic root-cause, correction, ranking, worker-safety, adoption, or roadmap-decision authority to the diagnostic.
  - Let the Executor run or claim the outcome of canonical Runtime verification.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve AIOS_BP_V4_PARALLEL_DIAGNOSTIC version 1, exact TARGETS, exact
      serial -> parallel-2 -> parallel-4 PROFILES, collection identity,
      execution-completeness checks, subject-integrity checks, worker/process/root
      isolation checks, and the rule that inner pytest exit 1 is observational while
      diagnostic-integrity defects fail closed.
    - >
      Reuse the clean RUN-168-001 candidate semantics where they already satisfy this
      revision; do not discard or redesign useful bounded implementation merely
      because the predecessor failed before verification.
    - >
      CorrectionIntegrationError observability must remain a small fixed taxonomy.
      Every currently known repository-owned raise/message family in
      src/aios_renew/correction_integration.py must map deterministically to a
      validator-approved bounded category rather than generic other, except truly
      unknown/unrecognized future text. Closely related known messages should share
      categories rather than create one category per string.
    - >
      Git-derived wrapped detail may persist only fixed labels such as
      repository-error, ref-lock, path-error, or other plus normalized SHA-256
      identity. Windows filename/path-too-long, create/open/path-not-found families
      required by the focused diagnosis must be recognized without raw prose.
    - >
      Source locus remains at most one sanitized <subject>/tests/... path plus
      positive line number, must correspond to the fixed target file, and must not
      contain traceback frames, locals, assertion expression/value text, or any
      external/private path.
    - >
      Cause fingerprints and wrapped Git identities normalize registered transient
      subject/diagnostic/basetemp/home prefixes before hashing. Equivalent logical
      failures differing only in those roots remain stable.
    - >
      Validator must reject raw-message/raw-stderr fields, malformed or unbounded
      fingerprints, unknown cause fields, unsafe/malformed loci, and semantic
      decision fields. Generic future CorrectionIntegrationError text may collapse
      to the fixed other category without copying its text.
    - >
      Contract tests must use the real production CorrectionIntegrationError type
      for at least one classification regression and cover representative messages
      from every bounded known category, including the previously unmapped known
      message families identified by this audit.
    - >
      Pending Runtime-owned verification is not an Executor unresolved item once
      implementation and structural claims are complete. Executor evidence remains
      empty before Runtime verification and Executor must not claim that the
      canonical verification command passed.
    - >
      Modification remains limited to the three diagnostic files. If satisfying
      bounded observability requires production exception-schema mutation, fail
      closed for fresh Brain review instead of widening scope.

acceptance:
  - id: AC1
    condition: >
      The implementation preserves the exact six fixed targets, exact
      serial/parallel-2/parallel-4 profile order, collection identity, complete target
      execution, subject integrity, and worker/process/mutable-root isolation semantics.
  - id: AC2
    condition: >
      Every currently known CorrectionIntegrationError message family in the
      inspected production source maps to one of a small validator-approved bounded
      categories; truly unknown future text alone collapses to other, and no raw
      wrapped message or arbitrary Git output is persisted.
  - id: AC3
    condition: >
      Git/path observations and normalized identities remain bounded, safe and stable
      across recognized transient roots, including relevant Windows path-too-long and
      create/open/path-not-found families.
  - id: AC4
    condition: >
      Fixed-target failures may expose at most one validator-approved sanitized
      repo-owned source locus matching that target file with a positive line number;
      no traceback, locals, assertion values, or private/external path is persisted.
  - id: AC5
    condition: >
      The cause validator fails closed on raw or unknown fields, unsafe or malformed
      loci, malformed/unbounded identities, and semantic decision fields, while
      accepting only the exact bounded schema authorized by this TASK.
  - id: AC6
    condition: >
      The resulting candidate changes only the three authorized diagnostic files,
      contains deterministic contract coverage for AC1-AC5, returns a structurally
      complete RESULT with zero unresolved items and no Executor-supplied evidence,
      and leaves the single canonical contract-suite command for Runtime-owned
      verification after completion gate.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_bp_v4_parallel_diagnostic.py
