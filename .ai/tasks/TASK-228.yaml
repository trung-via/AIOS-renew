task_id: TASK-228
revision: 1

goal: >
  Close RA-7 Real Project Proof & Closure by proving the already-reviewed RA-1 through RA-6
  Research Assurance architecture against one Brain-prebound controlled real-project corpus
  containing stable/immutable, mutable/time-sensitive and adversarial/prompt-injection-bearing
  project sources. The proof must be deterministic and offline at Runtime verification time,
  preserve exact Research Record reuse/invalidation lineage and fresh ARCHITECTURE handoff
  boundaries, and introduce no production capability or authority.

problem: >
  RA-1 through RA-6 now provide the complete bounded Research Brief, acquisition airlock,
  Research Record/reuse semantics, two-pass audit, provider/adapter portability and explicit
  RESEARCH flow integration, but RA-7 still needs a real-project closure proof. A weak proof
  could call live web/provider services during pytest and become non-reproducible, let the
  Executor choose both the corpus and expected semantics, use synthetic fixtures unrelated to
  canonical project material, refresh the whole record when only one basis changed, treat
  prompt-like source text as instructions, leak retained excerpts into ARCHITECTURE handoff,
  or accidentally create new research lifecycle/router/memory authority. RA-7 must instead
  replay exact Brain-prebound project-source bytes through the existing public contracts and
  leave semantic adequacy to Reviewer judgment.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    33ee5c9e7286475586db4ddc1f4937cf68731663. RA-6 closed through TASK-227 revision 1,
    RUN-227-001 / F-227-001 / remediation RUN-227-002 and REVIEW-227-002 DELTA PASS;
    exact reviewed/published RA-6 source is dd78b6cb54674e0a564ecbe1215d7918d81f6a1e.
  - >
    .ai/roadmap-state.yaml on authoring main records RA-7 as the unique NEXT and its
    architecture audit as PASS_WITH_MANDATORY_PROOF_BOUNDARIES against
    42247614faefe04342b5c23755c552cc7afc5d16.
  - >
    The Brain-prebound proof corpus is fixed before Executor admission and consists exactly of:
    STABLE_CONSTITUTION = docs/AIOS-CONSTITUTION.md at repository commit
    42247614faefe04342b5c23755c552cc7afc5d16, Git blob
    a4e33646c6ec7573cadeb2b10379b1606eac9322;
    MUTABLE_ROADMAP_PRE_RA6_CLOSURE = .ai/roadmap-state.yaml at repository commit
    dd78b6cb54674e0a564ecbe1215d7918d81f6a1e, Git blob
    3ec4e92d204bc66f0537dbe804071adc0154df30;
    MUTABLE_ROADMAP_POST_RA6_CLOSURE = .ai/roadmap-state.yaml at repository commit
    42247614faefe04342b5c23755c552cc7afc5d16, Git blob
    c55a4ef0f88e1b256e34925f1fe110052b5eb4d0;
    ADVERSARIAL_PROMPT_LIKE_PROJECT_SOURCE = tests/test_research_provider_protocol.py at
    repository commit 42247614faefe04342b5c23755c552cc7afc5d16, Git blob
    9536758685a750bbfea4366902ea0588ab34b57e.
  - >
    The proof snapshots are bounded immutable test evidence copied byte-for-byte from those
    exact project blobs. They are not a second canonical repository truth, latest-source
    resolver, Research Record store or persistence mechanism.
  - >
    Existing RA-1 through RA-6 production modules are reviewed and behaviorally frozen for
    this proof. RA-7 may exercise only their public exported construction/validation/
    projection/invocation surfaces and must fail closed if production changes appear necessary.

