task_id: TASK-333
revision: 1
goal: Deliver VP-03D's read-only canonical Runtime provenance issuer/consumer bridge
  for real admitted terminal TASK/RUN/RESULT/EVIDENCE/REVIEW artifacts and exact main/currentness,
  replacing caller-invented trust roots with independently established existing Runtime-owned
  source facts. Integrate only an authenticated factual source path with VP-03C's
  strict read-only handoff; fail closed for unavailable independent issuer or preterminal
  checkpoint source. Keep KA-01 and all evidence-discharge, verification/continuation
  and scheduler authorities NOT_ACTIVATED.
problem: Published VP-03A/B authenticate committed proof/checkpoint content only relative
  to a catalog; VP-03C TASK-332 correctly returns INDEPENDENT_CANONICAL_RUNTIME_ISSUER_UNAVAILABLE
  because an attacker can inject a coherent self-certified Git repository. No real
  Runtime-owned source producer supplies independently grounded TASK/RUN/evidence/review/currentness
  facts. VP-03D must close the trusted terminal provenance observation boundary without
  fabricating prospective preterminal checkpoints, granting new permission or building
  a second scheduler.
assumptions:
- Fresh canonical main is 97184cf204365e8b2fab7deeb27f6ffd7ec2867b after Human/Brain
  planning recorded TASK-333 as unique VP-03D NEXT and Human explicitly delegated
  Codex GPT-6.1 Sol xhigh through the entire same-TASK lifecycle, including REPAIR/REMEDIATION.
  TASK must stay executor-neutral.
- Last published TASK-332 r1 RUN-332-001 REVIEW-332-001 PASS exact source 49629a560e27e4b8618dfc65f118993686ebbbed;
  Runtime evidence 50 focused passes. TASK-330/331/332 outputs remain immutable, not
  TASK-333 verification.
- Current existing Runtime/operator canonical source and remote lifecycle observation
  are lower-level facts, not a new issuer registry. Git SHA, mock Runtime-looking
  object or caller-selected local repository cannot independently authenticate its
  own legitimacy.
- Terminal RESULT/REVIEW artifacts do not establish preterminal C1/C2 source or Human
  lease/consent. VP-01 remains DEFERRED_NOT_WAIVED, VP-02 and VP-03 exit NOT_ESTABLISHED,
  KA-01 NOT_ACTIVATED, VP-04 queued and V2 verification policy active.
- New revision-1 AIOS-renew return route uses the Human-approved LEGACY_REPOSITORY_DEFAULT_ROUTE;
  canonical AUTHOR_TASK and future PRIMARY must use exact current expected-main/TASK-blob
  bindings.
