non_goals:
- NO second trust registry, signer/key issuer, persistent lifecycle store, generic
  router/planner, scheduler, review publisher or verification engine.
- NO change to existing Runtime execution/verification, TASK/RUN/RESULT/EVIDENCE/REVIEW
  schemas, admission, canonical terminal writes, workflow/transport, or Executor code
  path; only a bounded non-mutating observation/issuer entrypoint may be attached.
- NO synthetic preterminal checkpoints, lease/Human consent, reviewed source or target
  evidence; no terminal result promoted into ACTIVE same-RUN checkpoint authority.
- NO caller-selected repository/catalog/producer/callback authority, no self-attested
  validity or acceptance PASS, no evidence reuse or discharge, no feedback consumption,
  new verification policy, automatic correction or KA-01 activation.
- NO full suite, legacy focused suites or base replay solely for ceremony; no roadmap
  auto-progression or downstream pin changes.
constraints:
  hard:
  - Existing Runtime alone owns independent canonical provenance issuance. No untrusted
    caller may choose trusted repository/remote/ref/catalog/issuer, pass a Runtime-looking
    instance, register an arbitrary producer or override currentness; fail closed
    if the existing authentic source cannot be independently proven.
  - Exact authenticated terminal source binding must include canonical TASK revision/blob/commit,
    admitted RUN ID/base, committed candidate SHA/tree, source RESULT/EVIDENCE/raw
    subject, independently submitted REVIEW and exact reviewed source, and separately
    established current canonical main/publication state. Preserve real source outcome,
    including FAIL.
  - Use existing Runtime/transport decoders plus VP-03A/B/C typed proof validation;
    distinguish authenticated source bytes, legitimate Runtime admission/Reviewer
    issuer, semantic proof adequacy and actual target execution. Neither Git presence
    nor review-looking objects nor fixture records alone grant authority.
  - Preserve complete versioned immutable source-to-target mapping, dependency/condition
    and replay identity. Incomplete, conflicting, forged, stale, detached, swapped,
    duplicated or torn sources/currentness produce explicit UNKNOWN/BLOCK rather than
    PASS or unsupported source attestation.
  - 'Any positive terminal provenance is restricted to real independently authenticated
    terminal facts. No live preterminal producer exists: C1/C2 checkpoint/currentness/lease
    and atomic CAS/ABA consumption stay UNKNOWN and must be called out as gates. Do
    not project terminal RESULT into an interim RUN status.'
  - Read-only source acquisition may observe authoritative refs before and after,
    but cannot substitute non-atomic ref checks for durable CAS or create a new trust
    root. Avoid Git subprocess network for tests; no source writes and no execution
    from this bridge.
  - Integration to VP-03C can consume only independently Runtime-issued read-only
    observations, never a public caller-provided fixture_authority as a production
    source. All issuer-dependent activation/authorization/continuation/mutation/checkpoint/feedback/acceptance/evidence-reuse/verification/scheduler/publisher/terminalization
    flags remain false under NOT_ACTIVATED.
  - Restrict edits to five exact authorized files; `RuntimeCompletion.complete` and
    current minimum-sufficient-v2 execution remain behaviorally unchanged, no schema/Kernel/history/workflow
    or pin modifications.
  - Maintain targeted negative tests for forged coherent Git repo, swapped admission/RESULT/evidence/raw/review,
    mismatched source/main/currentness, absent real issuer, duplicate/replay/crash,
    missing preterminal/lease, policy/condition changes and no-effect invariants.
    Reuse existing valid upstream tests, do not duplicate expensive suites.
  - Runtime owns the sole authored focused verification requirement; future production
    issuer enrollment, checkpoint CAS/lease, proof reuse/discharge and VP04/05/07
    cutover require distinct authorized gates.
acceptance:
- id: AC1
  condition: Provide a documented versioned read-only Runtime canonical provenance
    issuer/consumer bridge using existing trusted Runtime source boundaries, with
    no caller-enrollable trust root, alternate authority registry or new lifecycle
    state.
- id: AC2
  condition: When an independently authenticated existing terminal source exists,
    the bridge constructs immutable exact TASK/RUN/base and terminal RESULT/EVIDENCE/raw,
    candidate/tree, reviewed-source and independent REVIEW facts with separately observed
    main/publication currentness; no fabricated source is needed.
- id: AC3
  condition: An unavailable, forged, incomplete, stale or ambiguous independent Runtime/Reviewer
    source produces typed UNKNOWN/BLOCK, including coherent attacker-controlled Git
    history or a spoofed Runtime-looking constructor, without asserting authenticated
    producer rights.
- id: AC4
  condition: The VP-03C read-only canonical handoff can consume only a legitimate
    existing Runtime-owned issuer observation and retain VP-03A/B original proof/mapping/checkpoint
    witness facts without creating target execution EVIDENCE, semantic verdict, or
    acceptance PASS.
- id: AC5
  condition: Terminal source truth remains terminal, original PASS/FAIL subjects remain
    unchanged, nonexistent live preterminal C1/C2/lease/currentness/CAS stays unavailable,
    and every activation, correction, verification, reuse/discharge, feedback, checkpoint,
    publisher and mutation authority remains false with NOT_ACTIVATED.
- id: AC6
  condition: Focused deterministic adversarial tests cover issuer availability, fake
    trusted repos, wrong TASK/RUN/base/candidate/tree/evidence/raw/REVIEW, stale or
    ambiguous main, replay/torn/duplicate, absent preterminal authority and unchanged
    repository/effects; no live Runtime execution or network calls.
- id: AC7
  condition: Documentation explicitly distinguishes real independently sourced terminal
    provenance from conditionally authenticated fixture content, and lists external
    source issuance, CAS/lease, VP01/02/03 exit, KA-01 and VP04/05/07 gates still
    blocking production evidence reuse.
- id: AC8
  condition: Candidate changes only five scope.modify paths, preserves current Runtime
    verification/lifecycle contract, frozen Kernel, existing workflows/transport,
    immutable historical artifacts, publication authority and downstream isolation.
    New focused verification is the only required TASK command.
verification:
  policy: minimum-sufficient-v2
  required:
  - python -m pytest -q tests/test_runtime_provenance_bridge.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
