task_id: TASK-152
revision: 2

goal: >
  Establish the canonical BP-V2 pre-optimization serial full-suite baseline and one
  executable Git-fixture isolation contract without accelerating the harness yet, so the
  later acceleration task can be judged against exact before evidence on the supported
  Windows self-host class while preserving canonical test population and real-Git semantics.

problem: >
  TASK-152 r1 RUN-152-001 produced a transportable, repairable candidate
  db2b759ede12729a4c030b945f266799671fb29c that changed exactly
  tests/test_git_fixture_isolation.py, but the RUN failed at COMPLETION_GATE before Runtime
  verification with "RESULT does not satisfy acceptance criteria: AC4, AC5, AC6".
  The failure is in TASK-152 r1 contract design, not in demonstrated implementation behavior:
  AC4 and AC5 required canonical Runtime verification evidence and AC6 required self-host
  operational provenance, yet PRIMARY completion requires the Executor structural RESULT to
  claim every acceptance criterion before Runtime verification executes. Revision 2 preserves
  the same Human/Brain intent and implementation scope but moves Runtime/self-host proof back
  to hard constraints and review evidence where that authority belongs, leaving acceptance
  criteria limited to properties the Executor can truthfully claim at completion.

assumptions:
  - Canonical main at revision-2 authoring is 20f67fab2cbdf3bfc87e3d4c059eeb266385bc17.
  - BP-V2 Full-Suite Harness Acceleration remains the unique canonical NEXT roadmap milestone.
  - >
    RUN-152-001 is an immutable canonical FAILURE at COMPLETION_GATE with failed_head_sha
    db2b759ede12729a4c030b945f266799671fb29c, changed_files exactly
    [tests/test_git_fixture_isolation.py], outside_task_scope empty, dirty false,
    descends_from_base true, transportable true, and repairable true.
  - >
    RUN-152-001 created no canonical verification evidence because completion failed before
    Runtime verification. Its candidate is implementation evidence only and must not be
    published directly or reinterpreted as a successful baseline RUN.
  - >
    The r1 candidate demonstrates a suitable implementation shape for the isolation guard:
    real Git sandboxes, independent worktree/index/refs/remotes/local config/dirty state and
    .git/aios state, while explicitly making no assertion that immutable Git object databases
    must differ.
  - >
    New TASKs/revisions use verification policy minimum-sufficient-v1. Runtime owns canonical
    verification and EVIDENCE; operational workflow metadata may support environment provenance
    but is not lifecycle or verification truth.

scope:
  inspect:
    - .ai/tasks/TASK-152.yaml
    - refs/heads/aios/failure/RUN-152-001
    - refs/heads/aios/failure-artifacts/RUN-152-001
    - docs/AIOS-BRAIN-PORTABILITY.md
    - docs/AIOS-PERFORMANCE-CLOSURE.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/roadmap-state.yaml
    - .github/workflows/aios-self-hosted-wakeup.yml
    - src/aios_renew/runtime.py
    - src/aios_renew/verification.py
    - src/aios_renew/artifacts.py
    - tests/operator_test_support.py
    - tests/test_operator.py
    - tests/test_authoring_ingress.py
    - tests/test_publication.py
    - tests/test_review_transport.py
    - tests/test_operator_unified_state.py
    - tests/test_git_fixture_isolation.py
  modify:
    - tests/test_git_fixture_isolation.py

non_goals:
  - Repair RUN-152-001 or fabricate verification evidence for it.
  - Publish or cherry-pick the failed r1 candidate directly.
  - Modify tests/operator_test_support.py or accelerate make_repo, setup_test_repo, make_lineage, or any existing fixture/helper.
  - Introduce reusable immutable Git baseline implementation; that belongs to the subsequent BP-V2 acceleration task.
  - Modify any src/aios_renew production module, Runtime verification semantics, EVIDENCE schema, Operator, Publisher, or lifecycle authority.
  - Add pytest-xdist, parallel workers, worker-count selection, async test execution, or other BP-V4 behavior.
  - Change verification workspace isolation or control-checkout movement semantics; that belongs to BP-V3.
  - Add pytest result caching, skip, xfail, deselection, timeout inflation, broad Git mocks, or reduced canonical test population.
  - Claim BP-V2 performance success or the 50 percent exit gate from TASK-152.
  - Create a performance database, benchmark daemon, telemetry service, second evidence store, Planner, or routing authority.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Port the validated semantic shape of the r1 isolation guard onto the revision-2
      candidate from current canonical main. The candidate must change exactly
      tests/test_git_fixture_isolation.py.
    - >
      The isolation test must use the existing real-Git test harness to construct at least
      two independent sandboxes and prove that mutation of sandbox A is not observable as
      mutable state in sandbox B.
    - >
      The contract must cover independent worktree/index state, local refs or branches,
      writable remote refs, repository-local Git configuration, clean/dirty state, and
      .git/aios Runtime state or locks where applicable.
    - >
      Do not require separate immutable Git object databases. The contract must permit a
      later implementation to reuse immutable Git objects or immutable baseline material,
      provided every test retains isolated writable worktree, index, refs, remotes/config,
      locks, and Runtime state.
    - >
      Keep all Git-boundary assertions production-shaped with real local Git repositories
      and local bare remotes. Do not replace ancestry, ref, remote, dirty-state, lock, or
      transport semantics with broad mocks.
    - >
      TASK-152 itself must not reduce Git subprocess count or optimize fixture construction.
      Its purpose is to establish the before state and the conformance guard only.
    - >
      Canonical Runtime verification must execute the exact revision-2 verification commands
      after Executor completion. The collect-only output defines the pre-optimization node
      population and the full-suite output defines the pre-optimization serial pass-count and
      pytest elapsed-time baseline for BP-V2 planning.
    - >
      The baseline is valid for BP-V2 planning only when revision-2 PRIMARY executes through
      the standard self-host workflow targeting [self-hosted, windows, x64, aios-renew].
      Workflow/receipt metadata is supporting operational provenance only; Runtime
      RESULT/EVIDENCE remains verification truth.
    - >
      Reviewer must confirm from canonical RUN-152 revision-2 evidence that collection and
      full-suite commands succeeded on the same candidate and that operational provenance
      corresponds to the standard Windows x64 aios-renew self-host path before accepting the
      baseline for later BP-V2 comparison.
    - >
      A later acceleration TASK must preserve every baseline collected node; additional tests
      are allowed, removal or silent deselection is not.
    - >
      Do not interpret historical RUN-144/RUN-145 timing or failed RUN-152-001 as the official
      BP-V2 before baseline.
    - >
      Do not modify files outside scope.modify and do not push from Executor implementation.

acceptance:
  - id: AC1
    condition: >
      The candidate changes exactly tests/test_git_fixture_isolation.py and leaves all
      existing production modules, test helpers, existing test modules, pytest configuration,
      and workflows unchanged.
  - id: AC2
    condition: >
      The new real-Git conformance test proves two independently created test sandboxes do
      not share writable worktree/index state, local refs or branches, writable remote refs,
      repository-local Git config, clean/dirty state, or .git/aios Runtime/lock state.
  - id: AC3
    condition: >
      The isolation contract intentionally does not require separate immutable Git object
      databases and therefore remains compatible with a later immutable-baseline optimization.
  - id: AC4
    condition: >
      The test remains production-shaped: it uses real local Git repositories and bare
      remotes and introduces no broad Git mocks, skips, xfails, deselection rules, result
      caches, timeout inflation, or parallel execution.
  - id: AC5
    condition: >
      TASK-152 revision 2 introduces no harness acceleration, production/runtime semantic
      change, performance-success claim, or authority change; it only establishes the
      executable isolation guard whose successful canonical verification will serve as the
      before baseline.

verification:
  policy: minimum-sufficient-v1
  full_suite_reason: >
    Establish the canonical pre-optimization serial full-suite timing and exact collected
    test population required for the BP-V2 before/after exit gate on the supported Windows
    self-host class after correcting the revision-1 completion-contract defect.
  required:
    - python -m pytest --collect-only -q
    - python -m pytest -q
    - git diff --check
