task_id: TASK-239
revision: 2

goal: >
  Correct the production Authoring Ingress commit-blob readback boundary proven by
  TASK-238 so exact metadata committed in a fresh-clone topology is read back as the
  exact blob bytes, without weakening metadata validation, changing fixture behavior,
  or broadening lifecycle authority.

problem: >
  TASK-239 r1 preserved the correct production objective but encoded one acceptance
  criterion as a future Runtime verification outcome. RUN-239-001, RUN-239-002 and
  RUN-239-003 therefore stopped at COMPLETION_GATE before Runtime verification; none
  is evidence that the implementation failed its authored tests. Revision 2 preserves
  the r1 implementation semantics while making every acceptance criterion truthfully
  claimable as an implementation property before Runtime verification, matching the
  authority/order correction pattern already established by TASK-231 r2.

assumptions:
  - >
    Canonical main at r2 authoring is 1f43d0701813005c8b029f2756615778cf6a546e. TASK-239 r1 is not published.
  - >
    RUN-239-001, RUN-239-002 and RUN-239-003 are canonical pre-verification
    COMPLETION_GATE failures with verification_seconds null. They must not be
    represented as Runtime verification evidence.
  - >
    The clean r1 failed candidate at
    3d38a681b0d9c59307cfe40f8067ec27653761a8 changed only
    src/aios_renew/authoring_ingress.py and tests/test_authoring_ingress.py and is
    implementation evidence/reference only; revision 2 does not publish or bless it.
  - >
    RUN-238-002 resolved the original mismatch boundary to
    FRESH_CLONE_ONLY_MISMATCH_RESOLVED_BOUNDARY with fresh clone classified
    PRODUCTION_READBACK_MISMATCH while expected/tree/native Git object identities
    were exact.
  - >
    TASK-237 already resolved the separate source-REPAIR CLONE/PATH_OR_FILENAME
    failures.
  - >
    The independent parallel-only Git fixture failure from RUN-233 remains deferred
    until this stable production readback correction is reviewed and published.
  - >
    Runtime owns verification execution and EVIDENCE; Reviewer owns semantic verdict;
    Publisher owns publication; Executor owns implementation HOW only.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-238.yaml
    - .ai/tasks/TASK-239.yaml
    - src/aios_renew/authoring_ingress.py
    - tests/test_authoring_ingress.py
    - tests/test_hot_swap_conformance.py
    - scripts/aios_ingress_metadata_identity_diagnostic.py
    - tests/test_aios_ingress_metadata_identity_diagnostic.py
  modify:
    - src/aios_renew/authoring_ingress.py
    - tests/test_authoring_ingress.py
    - tests/test_hot_swap_conformance.py

non_goals:
  - >
    Treat any RUN-239 r1 completion-gate failure as proof that the production
    implementation or required tests failed.
  - >
    Require the Executor RESULT to claim Runtime verification success, canonical
    evidence creation, Reviewer verdict, publication, or roadmap advancement.
  - >
    Change metadata payload bytes, normalize line endings/BOM, weaken byte-exact
    _validate_metadata_commit semantics, skip validation, or reinterpret TASK-238
    diagnostic evidence.
  - >
    Change Git fixture support, hot-swap semantics, remediation/review authority,
    Runtime/Reviewer/Publisher behavior, remote selection, workflow/carrier behavior,
    worker policy, or roadmap state from Executor execution.
  - >
    Correct or diagnose the separate parallel-only Git fixture failure, rerun
    TASK-231, run a full suite, or select a new worker count.
  - >
    Add retries, fallback Git commands selected by heuristics, lifecycle routing, or
    any new semantic authority.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve the contract that production commit-blob readback returns the exact
      bytes stored for one exact commit and repository-relative path, and returns no
      content when that exact object/path cannot be resolved. Do not normalize,
      decode/re-encode, trim, or otherwise transform the blob bytes used by metadata
      validation.
    - >
      The readback implementation must be binary-safe and topology-stable for the
      fresh-clone topology isolated by TASK-238. It must avoid a text-rendering or
      revision/path parsing dependency that can make an existing exact tree/blob
      appear absent.
    - >
      _validate_metadata_commit must continue to enforce exact authorized parent,
      exact changed path, exact 100644 metadata blob, and exact metadata byte
      equality. No structural/content guard may be bypassed or softened.
    - >
      Existing Authoring Ingress callers of the shared commit-blob read boundary must
      retain their present/missing-content contract, including AUTHOR_TASK,
      SUBMIT_REVIEW, AUTHOR_REMEDIATION, and AUTHOR_REPAIR paths.
    - >
      Focused regression coverage must encode the fresh-clone Scenario 2 topology and
      ordinary same-repository exact-byte behavior without changing the scenario's
      fixture semantics merely to make verification pass. A direct readback regression
      may lock the binary-exact/missing-path contract.
    - >
      The Executor may inspect the r1 failed candidate as bounded implementation
      reference but must produce any r2 implementation candidate from the admitted r2
      execution base under ordinary Runtime gates; r1 failure artifacts are not a
      publication or verification shortcut.
    - >
      Modify only the three scope.modify files.
    - >
      Use minimum-sufficient focused verification only. No full suite and no
      workers=12 run are authorized by this task.
    - >
      Executor does not mutate roadmap, review decisions, publication state, fixture
      policy, or worker policy.

acceptance:
  - id: AC1
    condition: >
      The implementation routes exact commit/path metadata readback through a
      binary-safe, topology-stable Git object lookup suitable for the TASK-238
      fresh-clone Scenario 2 topology, without changing that scenario's semantic
      expectations or fixture behavior.
  - id: AC2
    condition: >
      Production commit-blob readback returns exact untransformed bytes for an
      existing exact commit/path in ordinary same-repository and fresh-clone
      topology, and preserves the fail-closed no-content result for missing or
      unresolvable commit/path content.
  - id: AC3
    condition: >
      _validate_metadata_commit retains its exact parent, changed-path, 100644 blob
      mode, blob identity/content and byte-equality guards; the implementation adds no
      normalization, validation skip, bypass, retry, fallback-routing or semantic
      weakening path.
  - id: AC4
    condition: >
      The shared readback correction preserves the existing Authoring Ingress
      present/missing-content contract and rejection semantics for AUTHOR_TASK,
      SUBMIT_REVIEW, AUTHOR_REMEDIATION and AUTHOR_REPAIR, with focused regressions
      covering ordinary AUTHOR_REMEDIATION exact-byte behavior and the new readback
      boundary.
  - id: AC5
    condition: >
      The implementation delta is confined to src/aios_renew/authoring_ingress.py,
      tests/test_authoring_ingress.py and, only if necessary for regression coverage,
      tests/test_hot_swap_conformance.py; it changes no fixture policy, worker policy,
      Runtime, Reviewer, Publisher, workflow, carrier or roadmap semantics.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest -q tests/test_hot_swap_conformance.py::test_scenario_2_fresh_correction_accepts_only_current_finding
    - python -m pytest -q tests/test_authoring_ingress.py -k "author_remediation or read_commit_blob"
    - git diff --check
