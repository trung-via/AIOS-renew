non_goals:
- No resumption, re-admission, REPAIR, remediation, historical mutation, cancellation,
  deletion or retrospective PASS/FAIL reclassification of TASK-343 or RUN-343-001/002;
  no automation that selects an alternative TASK or Executor.
- No new generic Git subprocess router, emulator, raw object writer, global monkeypatch
  of subprocess, privileged host installation, filesystem/Defender/security-policy
  modification, registry, machine PATH rewrite or hardcoded Git executable path.
- No adaptive worker tuning, CPU-based count, automatic retries, hidden 1/4-worker
  fallback, replacement of fixed explicit historic 2/3/4/8/12/16 diagnostic/measurement
  profiles or conversion of collect-only into executed test work.
- No changed verification scope, second canonical test runner, duplicate full-suite
  pass, semantic baseline reclassification, relaxed failure attribution, arbitrary
  evidence reuse, altered subprocess exit truth, or altered underlying TASK-231 selection
  provenance.
- No new lifecycle, Reviewer, Publisher, origin proof, carrier transport, secrets/config
  trust, frozen Kernel or downstream Python Agent adoption change; no future Runtime
  verification outcome claimed by Executor.
- No speculative elapsed-time or token savings asserted as measured; cost/performance
  measurement is read-only observation, not an automatic adoption decision.
constraints:
  hard:
  - Use one Human-selected fixed ordinary pytest execution default of exactly 12 xdist
    workers, load distribution and zero worker restarts across repository CLI and
    minimum-sufficient-v2 Runtime candidate, base, affected, exact projected, correction
    and comparable verification. Preserve exact authored test selections, launchers,
    toolchain identity and command coverage.
  - Collection-only invocations must collect rather than execute test items or spawn
    a 12-worker test run. Explicit worker-pinned historical performance/diagnostic
    cases must retain their authored worker count. Fail closed on ambiguous conflicting
    PYTEST_ADDOPTS, command/worker config, missing xdist or unsupported test launcher
    rather than fabricating worker facts.
  - On supported Windows pytest sessions, select and use a verified direct installed
    Git executable for real Git subprocess calls without an intermediary shell/launcher
    on ordinary exercised test paths. The resolution must be safe, process-scoped,
    deterministic under the supported environment and not disturb external host configuration
    or unrelated binary lookup. On unsupported/missing/ambiguous installation, fail
    clearly without silently selecting an unverified different Git binary.
  - Preserve real Git command argv semantics, stdout/stderr/exit status, Git config,
    hooks, remotes, repository integrity, locks and per-worker writable Git/temp isolation.
    Existing fixture acceleration must not make a mock appear as actual Git or weaken
    Git object/ref/transport correctness.
  - Bind effective pytest workers, profile and relevant toolchain/binary provenance
    truthfully to Runtime observations and evidence. No source/toolchain/profile mismatch
    may be treated as a comparable base/candidate, reusable proof, PRE_EXISTING_BASELINE
    or PASS; preserve complete/unstable/failed identity gates and original selected
    policy provenance.
  - Worker divergence, missing worker reports, process crashes, repository checkout
    mutation, stale evidence, incomplete/overbudget observations, Git executable provenance
    ambiguity and other existing fail-closed paths remain deterministically rejected;
    no suppressions, no skip/xfail, no fallback, no automatic rerun.
  - The existing selected 12-worker full-suite wrapper remains one canonical collection
    followed by one real 12-worker suite execution; ordinary pytest and wrapper defaults
    must not create nested/double worker populations, duplicate authored full-suite
    executions or duplicate verification on unchanged subject. Execute the full selected
    suite no more than once per explicitly planned Runtime verification.
  - All implementation changes must be limited to scope.modify. Discovering essential
    additional files is a Brain/Human scope decision, not permission for the Executor
    to edit outside scope, self-author a TASK or mutate roadmap planning semantics.
  - Preserve Human/Brain planning and risk authority, one admitted Executor implementation
    authority, Runtime-only canonical verification and evidence, Reviewer semantic
    verdict, Publisher exact source, immutable RUN-343 history, no forced ref updates
    and no downstream dependency pin change.
acceptance:
- id: AC1
  condition: Repository and Runtime ordinary executed pytest surfaces express one
    effective Human-fixed 12/load/zero-restart policy, with no independent ordinary
    serial/4-worker default or selector; the existing full-suite selection remains
    fixed at 12.
- id: AC2
  condition: Minimum-sufficient-v2 normal pytest candidate/base/affected/projected/correction
    execution paths retain the original authored scope while starting actual 12-worker
    xdist runs, with true execution profile and subject/toolchain bindings instead
    of a cosmetic 12-worker label.
- id: AC3
  condition: Normal repository pytest CLI uses 12 workers by default; collect-only
    remains collection-only and explicitly worker-pinned historical measurement/diagnostic
    commands preserve their authored semantics without double worker activation.
- id: AC4
  condition: Ordinary Windows pytest Git-process invocations on supported paths select
    a verified installed direct Git binary without intermediary cmd/shell/batch wrapper,
    retain actual Git behavior and return codes, and preserve process-local isolation
    without machine-wide PATH, Git or security configuration mutations.
- id: AC5
  condition: Runtime evidence and existing test harness surfaces retain truthful worker,
    toolchain and repository subject identities; incompatible candidate/base worker
    or Git context, stale proof and incomplete observation cannot be reused, attributed
    as baseline or turned into PASS.
- id: AC6
  condition: The implementation fails closed on missing/mismatched xdist or direct
    Git binary, worker collision or restart, collection divergence, unstable reports,
    conflicting overrides, Git failures and broken repository/fixture isolation, with
    no hidden retry, alternate selector or permissive fallback.
- id: AC7
  condition: Synthetic/targeted regression cases cover ordinary fixed-12 and direct-Git
    positives plus collect-only, explicit diagnostic overrides, actual worker/command
    provenance, Git failure/isolation and malformed/partial profile negatives without
    changing historical diagnostic subjects or introducing another verifier.
- id: AC8
  condition: The implementation preserves the single selected 12-worker full-suite
    wrapper and immutable TASK-343/RUN-343 history, changes only scope.modify, creates
    no duplicated lifecycle/planning authority, and exposes a single authored Runtime
    full-suite verification obligation rather than overlapping commands.
verification:
  policy: minimum-sufficient-v2
  full_suite_reason: Changing ordinary pytest defaults, V2 execution profiles and
    Windows Git fixture-process selection affects all test isolation and collection
    behavior. One exact selected twelve-worker suite is the minimum sufficient whole-repository
    proof; do not duplicate the suite or substitute a narrower command.
  required:
  - python scripts/aios_parallel_full_suite.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
