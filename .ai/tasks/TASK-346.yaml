non_goals:
- No TASK-343 re-execution, no RUN-346-001 REPAIR/replay/re-admission, no historical
  revision or source rewrite, no unreviewed candidate cherry-pick, no retrospective
  PASS or publication.
- No new Git process router/emulator, raw object writer, machine PATH/registry/security
  change, privileged install, global subprocess monkeypatch or hardcoded host-specific
  Git path.
- No adaptive worker sizing, hidden serial/four-worker fallback, automatic rerun,
  skip/xfail suppression, new generic verifier, silent test coverage change, duplicated
  full suite or speculative time savings.
- No change to Kernel, Runtime/Reviewer/Publisher ownership, roadmap state, origin
  proof, Executor delegation, carrier transport, downstream repositories or dependency
  pins.
constraints:
  hard:
  - Ordinary supported repository pytest CLI and Runtime-authored pytest execution
    must actually use exactly 12 xdist workers, load distribution and zero restarts,
    not merely labels; preserve exact authored test subset, command/launcher behavior
    and raw exit status.
  - Collection-only remains non-executing. Explicitly pinned diagnostics/measurements
    retain their counts. The existing selected full-suite wrapper retains one collection
    then one actual fixed 12-worker execution without default-induced nested/double
    populations.
  - Conflicting explicit worker/environment configuration, missing or incompatible
    xdist, worker crash/restart, incomplete or divergent collection/reports fail closed.
    No hidden fallback, retry or mock-as-pass.
  - On supported Windows pytest Git-process paths, select a verified installed direct
    git.exe; invoke real Git as a process without a cmd/batch/shell intermediary;
    preserve argv/config/hooks/remotes/locks/stdout/stderr/exit code and each worker's
    writable repo/temp isolation. Fail explicitly for ambiguous/missing/untrusted
    Git identity; preserve lawful behavior on unsupported hosts.
  - Existing Runtime observations and evidence must bind effective worker/profile/observer/toolchain,
    direct Git executable provenance and exact subject when relevant. Missing, changed,
    stale, partially reported or conflicting proof never discharges existing verification
    or becomes comparable base PASS.
  - Historical V2 decoding and already admitted evidence remain immutable. R2's PRIMARY
    uses only exact ordered V1 commands on an isolated committed candidate with stop-on-raw-nonzero,
    no V2 base attribution, no implicit full suite.
  - Use only the focused verification.required command here; do not repeat unchanged
    base verification or add any full-suite work outside this contract. Preserve TASK-231
    selected full-suite provenance and avoid duplicate execution.
  - Executor may modify only scope.modify and must not push/publish or own canonical
    verification. Extra files/new architecture, risk or trust decisions need new Human/Brain
    scope authority. Runtime owns admission/evidence, Reviewer verdict, Publisher
    exact source, Human roadmap priority.
acceptance:
- id: AC1
  condition: Ordinary repository pytest CLI and relevant Runtime pytest surfaces enforce
    one truthful actual 12/load/zero-restart default without ordinary independent
    serial/four-worker selection or cosmetic labels.
- id: AC2
  condition: V1 authored pytest runs the exact selected test scope with actual 12
    workers; historical V2 candidate/base/affected/projected/correction support retains
    truthful worker/profile binding and original evidence immutable.
- id: AC3
  condition: Collect-only and explicitly worker-pinned diagnostics remain distinct,
    and the selected full-suite wrapper does not create nested worker populations
    or duplicate suite execution.
- id: AC4
  condition: Supported ordinary Windows pytest subprocess Git operations invoke a
    verified direct installed Git binary with real command status/output/config/hooks/remotes/locks
    and separate writable worker state, without host-wide mutations.
- id: AC5
  condition: Applicable Runtime observation and reuse gates reject stale, missing,
    conflicting or changed worker/Git/toolchain/observer/subject bindings rather than
    manufacturing comparable PASS or baseline truth.
- id: AC6
  condition: Missing xdist or Git, conflicting overrides, crashes, incomplete worker
    reports and repository/fixture isolation violations fail visibly without retries,
    permissive fallbacks, or suppression.
- id: AC7
  condition: Focused positive and negative regression coverage exercises supported
    real Windows Git process and actual 12-worker behavior, collection-only, diagnostic
    pins, evidence mismatch, Git failure propagation and cross-worker fixture isolation
    rather than only synthetic claims.
- id: AC8
  condition: Changes are within scope.modify, selected TASK-231 full-suite semantics
    and independent authorities are preserved, and TASK-346 r1, RUN-346 and TASK-343
    historical records are not modified.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_verification.py tests/test_verification_contract.py
    tests/test_parallel_verification.py tests/test_verification_profile.py tests/test_git_fixture_isolation.py
    tests/test_operator.py tests/test_bp_v4_parallel_probe.py tests/test_bp_v4_parallel_rebaseline.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
