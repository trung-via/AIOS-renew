task_id: TASK-346
revision: 2
goal: Implement an actual fixed 12-worker xdist/load/zero-restart default for ordinary
  AIOS-renew pytest and verified direct installed Git executable invocation for supported
  Windows pytest subprocesses, retaining Git correctness, per-worker isolation, historical
  compatibility and Runtime verification authority.
problem: TASK-346 r1 mandated historical minimum-sufficient-v2 and one full suite.
  At current main 7ef9993dfa76e1747bf3c215d95ef387df0331bb, ordinary pytest has no
  12-worker default in pyproject.toml, verification.py::_v2_profile records workers=1
  for ordinary non-full-suite observations, and Windows pytest subprocesses resolve
  git without verified direct-binary selection. The published TASK-356 prospective
  policy instead requires new TASK revisions to author focused minimum-sufficient-v1
  verification. This r2 preserves the combined intended feature while removing an
  obsolete V2/full-suite authoring obligation.
assumptions:
- TASK-346 r1 remains immutable at blob fcebf5bb53fe4dae565e48e00b3b82f4f567ebc0,
  authored by commit 5257fbefb611d9c41a193b83fba50eb15deb67e6. This is an explicit
  prospective revision of the same task, not TASK-343 resumption or historical REPAIR.
- Previously reported RUN-346-001 native timeout and failed candidate 66c0f4bc799ff6459621b2f19afbce98bf2d1877
  were local diagnostic facts, not presumed current remote canonical FAILURE, PASS,
  reviewed or published source. All exact historical local/canonical lineage remains
  as recorded. This r2 does not import, replay, reset or cherry-pick that unreviewed
  candidate.
- Human fixed ordinary xdist workers=12, distribution=load and max_worker_restart=0.
  The selected TASK-231 full suite already uses 12. Explicit historically pinned diagnostic
  and measurement runs retain their precise authored counts.
- TASK-356 has activated minimum-sufficient-v1 for new TASK identities and revisions.
  Old V2 TASK/RUN/EVIDENCE identity, source and original policy remain immutable;
  any prospective historical V2 observation must accurately reflect actual workers
  and Git/toolchain context.
- Existing real-Git fixture layout optimization is not authority to add a generic
  raw object generator, fake Git or a new subprocess router. Speedup must remain UNKNOWN
  until measured on paired comparable workloads.
- Human's named TASK-346 r2 priority is an explicit prospective override of the current
  R2.1 planning bookmark for this named authoring only; it does not advance roadmap
  NEXT, choose an Executor or admit RUN. Return affinity must preserve r1 LEGACY_REPOSITORY_DEFAULT_ROUTE.
