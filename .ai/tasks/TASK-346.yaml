task_id: TASK-346
revision: 1
goal: Prospectively make actual fixed 12-worker xdist execution the default throughout
  ordinary AIOS-renew pytest and minimum-sufficient-v2 test-item runs while selecting
  the direct trusted Git executable for Windows pytest Git subprocesses, reducing
  avoidable process startup without weakening test truth, isolation, Git semantics
  or Runtime authority.
problem: The canonical source at the end of TASK-345, ddcb55c5136b0ad45c11e3cdd90459ebc4010534,
  retains workers=1 for non-full-suite V2 pytest in verification.py::_v2_profile and
  has no equivalent ordinary repository pytest 12-worker default. Windows pytest fixture
  subprocesses commonly invoke a PATH-resolved `git` that need not be the direct installation
  binary. The Human explicitly selected a combined Direct Git executable plus fixed-12-worker
  ordinary pytest successor, superseding further implementation work on TASK-343 without
  rewriting its historical failure records. The prior RUN-343-002 full-n12 failures
  are not proof that current code is green.
assumptions:
- Human now authorizes one new prospective combined TASK, not a TASK-343 revision
  or REPAIR. TASK-343 r1, RUN-343-001, the original local RUN-343-002 and its 84 reported
  failures remain immutable. No additional TASK-343 execution is authorized by this
  TASK; historical archival and recovery truth is unaffected.
- Authoring baseline is the exact source-reviewed and source-published TASK-345 r3
  / RUN-345-003 candidate on canonical main ddcb55c5136b0ad45c11e3cdd90459ebc4010534.
  REVIEW-345-003 PRIMARY PASS has immutable decision SHA d7e968c75f1e0c31d3818b94823d21fdb6e1e9a4;
  publication source identity is checked separately from GitHub workflow conclusion.
- Human selected workers=12, distribution=load, max_worker_restart=0 for ordinary
  executed pytest tests; selected full-suite TASK-231 policy already uses 12. Explicit
  historical diagnostic/measurement configurations and pytest collect-only are not
  ordinary test-item execution.
- The direct Git executable requirement is a Windows ordinary-pytest process-selection
  optimization, not permission to write raw Git object files, change Git command semantics,
  bypass Git or replace Git by an in-memory mock. Exact binary selection must be validated
  for the supported runner; no path, username or machine-specific executable location
  is hardcoded into the TASK.
- Existing process-local Git fixture materialization and GIT_OPTIONAL_LOCKS optimizations
  remain subject to real-Git correctness and isolation. A direct binary may already
  be selected on some hosts; report unchanged/no-op behavior honestly rather than
  fabricate a measured improvement.
- Current 12-worker full-suite and RUN-343 failures contain unresolved environment/collection/worker
  issues. The proposed semantics must preserve fail-closed detection and cannot assume
  a green suite, retrospectively fix 84 failures, retry automatically or weaken evidence
  to claim success.
- Current Human priority prospectively overrides the older .ai/roadmap-state.yaml
  bookmark for this named TASK. AUTHOR_TASK does not edit the planning roadmap or
  automatically advance NEXT; a separately authorized Human/Brain planning-state canonical
  transition is still required before later generic continuation may rely on that
  new bookmark.
- 'Brain performs exclusive aios-adaptive-brain-audit-v1 two-stage semantic audit
  at authoring, but audit support is not serialized into the TASK ingress. Executor/model/effort
  selection is separate and explicit: the Human chose codex / gpt-6.1-sol / max for
  admitted implementation, not as a TASK contract field.'
- The existing Human-approved prospective return route remains LEGACY_REPOSITORY_DEFAULT_ROUTE.
  The old historical affinity, Runtime verification authority, independent Reviewer
  and exact-source Publisher are unchanged.
