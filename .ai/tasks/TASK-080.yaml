task_id: TASK-080
revision: 1

goal: >
  Harden native REPAIR structural output so both Codex and Antigravity use a
  repair-specific ResultPackage schema that encodes the existing structural contract
  required before Runtime canonical completion: root evidence must be empty,
  result.unresolved must be empty, result.claims must be non-empty, and every
  claim.evidence must be empty, while result.head_sha, result.changed_files,
  claim.id, claim.satisfies, and claim.claim remain structurally declared by the
  selected Executor. Preserve Runtime ownership of complete TASK acceptance coverage,
  canonical changed_files, verification, EVIDENCE, historical REPAIR recovery,
  verification-only NO_CHANGE reuse, exactly-one selected Executor invocation, and
  all existing admission, retry/reroute, review, remediation, repair, transport, and
  publication semantics.

problem: >
  Canonical TASK-079 REPAIR continuation RUN-079-002 proved an avoidable native
  structural-output mismatch on current AIOS behavior. The CODE_FIX correction
  candidate 4ee6e68ec1ad8fe92a26fcd3bcf4e12067c69600 was clean, in scope, and contained
  the intended test correction, but completion stopped before canonical verification
  with `RESULT does not satisfy acceptance criteria: AC1, AC2, AC3, AC4, AC5, AC6`
  because the native REPAIR ResultPackage omitted all TASK claims. Existing REPAIR
  prompts already instruct the Executor to return one structural ResultPackage for the
  complete original TASK contract with empty root evidence and empty claim evidence,
  and Runtime correctly remains the final authority for complete TASK acceptance
  coverage. However REPAIR currently uses the generic ResultPackage schema, which
  permits an empty claims array, non-empty unresolved items, root evidence, and claim
  evidence. Therefore an Executor can satisfy native structured-output validation while
  producing a package that deterministic Runtime structural/completion gates will reject.
  TASK-079 fixed the analogous REMEDIATION boundary with a dedicated schema; TASK-080
  applies the same adapter-owned structural hardening to REPAIR without duplicating
  dynamic TASK acceptance semantics inside adapters.

assumptions:
  - >
    Current canonical AIOS-renew main at TASK-080 authoring is
    4ee6e68ec1ad8fe92a26fcd3bcf4e12067c69600, the published TASK-079 source candidate.
  - >
    TASK-055 remains authoritative for provider-specific Codex/Antigravity native
    command and schema mechanics behind the provider-neutral Dispatcher.
  - >
    TASK-057 remains authoritative for Runtime-owned canonical REPAIR changed_files,
    narrow failed-head-to-final-head mutation enforcement, and canonical completion.
  - >
    TASK-058 revision 2 remains authoritative for exact historical failed-head REPAIR
    recovery and isolated subject workspaces; TASK-064 remains authoritative for
    verification-only NO_CHANGE reuse; TASK-075 remains authoritative for ensuring
    CODE_FIX bypasses reuse-only validation and enters ordinary one-Executor REPAIR.
  - >
    TASK-079 remains authoritative for the remediation-specific structural schema.
    PRIMARY continues to use the generic ResultPackage schema and REMEDIATION continues
    to use remediation_result_package.json unless a separately evidenced task changes
    those boundaries.
  - >
    Runtime's existing complete TASK acceptance-coverage check is semantic/dynamic
    authority. TASK-080 must not duplicate that authority by generating a per-TASK
    acceptance schema or by treating adapter schema validation as semantic completion.
  - >
    Python Agent RUN-156-007 and its correction candidate remain preserved downstream.
    This AIOS TASK does not repair, rerun, migrate, review, or publish that downstream
    lineage.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-ROADMAP.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-055.yaml
    - .ai/tasks/TASK-057.yaml
    - .ai/tasks/TASK-058.yaml
    - .ai/tasks/TASK-064.yaml
    - .ai/tasks/TASK-075.yaml
    - .ai/tasks/TASK-079.yaml
    - src/aios_renew/runtime.py
    - src/aios_renew/dispatcher.py
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/schemas/result_package.json
    - src/aios_renew/schemas/remediation_result_package.json
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py
    - tests/test_dispatcher.py
    - tests/test_runtime.py
    - pyproject.toml
  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/antigravity_adapter.py
    - src/aios_renew/schemas/repair_result_package.json
    - tests/test_codex_adapter.py
    - tests/test_antigravity_adapter.py

non_goals:
  - Change Runtime REPAIR completion semantics, full TASK acceptance-coverage rules,
    canonical verification, RESULT/EVIDENCE authority, or changed_files authority.
  - Generate dynamic/per-TASK JSON schemas that duplicate Runtime acceptance semantics.
  - Change PRIMARY or REMEDIATION schema semantics.
  - Change historical REPAIR admission, isolated-subject recovery, failed-head/root-lineage
    reconstruction, duplicate-continuation protection, or remote transport mechanics.
  - Change verification-only NO_CHANGE reuse eligibility, reusable-candidate validation,
    or CODE_FIX bypass ordering from TASK-064/TASK-075.
  - Strip, rewrite, synthesize, silently add, or canonicalize missing claims/unresolved/
    evidence after native output is produced.
  - Convert schema-invalid output into retry, fallback, reroute, second model call,
    alternate schema, executor switch, or automatic repair authoring.
  - Change Human-facing commands, model defaults, native deadlines, sandbox/mode policy,
    mutation permissions, dispatcher selection, worker surfaces, or publication authority.
  - Modify downstream Python Agent source, pin, TASK-156, RUN-156-007, or any downstream
    review/remediation/repair artifacts.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      Add one packaged repair-specific JSON schema under src/aios_renew/schemas/ whose
      required top-level/result/claim fields remain structurally compatible with the
      existing ResultPackage shape. The schema must require result.claims to contain at
      least one claim, constrain result.unresolved to an empty array, constrain root
      evidence to an empty array, and constrain every claim.evidence to an empty array.
      result.head_sha must remain a non-empty string; result.changed_files remains an
      array of non-empty path strings; claim.id and claim.claim remain non-empty strings;
      claim.satisfies remains a non-empty array of non-empty acceptance-id strings.
    - >
      The repair-specific schema is structural only. It must not enumerate current TASK
      acceptance IDs, generate per-TASK contains/allOf coverage rules, or otherwise
      duplicate Runtime's existing requirement that the aggregate claims satisfy every
      acceptance criterion of the complete original TASK.
    - >
      Codex REPAIR must pass repair_result_package.json to native --output-schema.
      Codex PRIMARY must continue using result_package.json and Codex REMEDIATION must
      continue using remediation_result_package.json.
    - >
      Antigravity REPAIR must pass the same repair-specific schema to native
      --json-schema. Antigravity PRIMARY and REMEDIATION must preserve their existing
      generic/remediation schema selection respectively.
    - >
      Operation-specific schema selection remains provider-native adapter mechanics.
      Dispatcher and Operator must not gain Codex/Antigravity schema-path policy,
      provider-specific flags, or a second structural-output authority.
    - >
      Runtime fail-closed gates remain authoritative and unchanged. If REPAIR claims are
      incomplete, satisfy unknown acceptance IDs, contain invalid structural content, or
      otherwise fail complete TASK semantics after native output, Runtime must still
      reject the package normally; adapters must not repair or reinterpret it.
    - >
      Exactly one selected Executor invocation remains authoritative for ordinary
      Executor-backed REPAIR. Schema rejection or invalid native output is terminal to
      that invocation with no retry, fallback, reroute, alternate schema, second model
      call, or executor substitution.
    - >
      Verification-only NO_CHANGE continuations that validly elide Executor invocation
      remain governed by TASK-064 and do not require a native schema call. TASK-080 must
      not alter fast-path eligibility or force an Executor solely to exercise the new
      schema.
    - >
      Existing historical REPAIR, current-head REPAIR, CODE_FIX, ordinary NO_CHANGE,
      PRIMARY, REMEDIATION, timeout, no-reentry, mutation, and transport behavior must
      remain observably unchanged except that native REPAIR structural output is now
      constrained before Runtime completion.
    - >
      Tests must directly validate the packaged repair schema, prove the exact
      RUN-079-002 class of claims=[] is schema-invalid, prove unresolved/root evidence/
      claim evidence cannot be non-empty, and prove Codex and Antigravity choose the
      correct schema independently for PRIMARY, REMEDIATION, and REPAIR.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      src/aios_renew/schemas/repair_result_package.json is included by the existing
      schemas/*.json package-data rule and structurally requires non-empty claims,
      empty unresolved, empty root evidence, and empty per-claim evidence while
      retaining required head_sha, changed_files, claim id/satisfies/claim fields.
  - id: AC2
    condition: >
      CodexAdapter uses the repair-specific schema for REPAIR, remediation-specific
      schema for REMEDIATION, and generic ResultPackage schema for PRIMARY, with no
      change to model, reasoning effort, sandbox, timeout, prompt role, or one-invocation
      behavior.
  - id: AC3
    condition: >
      AntigravityAdapter uses the repair-specific schema for REPAIR,
      remediation-specific schema for REMEDIATION, and generic ResultPackage schema for
      PRIMARY, with no change to model/effort, permissions/mode, timeout, handoff role,
      or one-invocation behavior.
  - id: AC4
    condition: >
      A deterministic regression proves a REPAIR structural payload equivalent to
      RUN-079-002 with result.claims=[] cannot satisfy the native repair schema, and
      separate regressions prove non-empty result.unresolved, root evidence, or
      claim.evidence are likewise schema-invalid before Runtime completion.
  - id: AC5
    condition: >
      Runtime remains the sole authority for complete original TASK acceptance coverage:
      the implementation does not generate per-TASK schemas, enumerate acceptance IDs in
      adapter schema mechanics, synthesize claims, or weaken existing Runtime rejection
      of incomplete/unknown acceptance coverage.
  - id: AC6
    condition: >
      Existing historical/current-head REPAIR, verification-only NO_CHANGE reuse,
      CODE_FIX dispatch, PRIMARY/REMEDIATION behavior, Dispatcher provider neutrality,
      no-retry/no-fallback/no-reroute, and Runtime verification/EVIDENCE semantics remain
      unchanged outside the new native REPAIR structural constraint.
  - id: AC7
    condition: >
      Focused Codex/Antigravity adapter regressions, Dispatcher regressions, Runtime
      regressions, and git diff --check all pass on the final candidate without
      executing or mutating any downstream Python Agent task.

verification:
  required:
    - 'python -m pytest tests/test_codex_adapter.py tests/test_antigravity_adapter.py tests/test_dispatcher.py tests/test_runtime.py -q'
    - 'git diff --check'
