task_id: TASK-113
revision: 1

goal: >
  Close GAP-C Phase 1 by adding a bounded, durable Runtime-terminal-to-Brain-attention
  handoff that reacts only after an already-canonical RESULT or FAILURE terminal artifact
  exists, emits one subordinate operational attention identity, and creates or reuses one
  Brain-facing GitHub Issue containing only immutable terminal selectors. Preserve Runtime
  as terminal-truth authority and Brain/Reviewer as the sole semantic authority: the
  attention mechanism must never review, choose a correction, choose an Executor, publish,
  or claim that GitHub directly invokes a specific ChatGPT conversation.

problem: >
  Current Runtime transport already publishes durable terminal truth as
  refs/heads/aios/artifacts/<RUN> for RESULT and
  refs/heads/aios/failure-artifacts/<RUN> for FAILURE, and Unified State can later resolve
  those refs. GAP-C remains because no outer automation converts a newly published
  terminal identity into a bounded durable attention signal that tells the Human/Brain
  which exact RUN now requires fresh semantic handling. Without that reverse handoff,
  successful execution still depends on the Human noticing terminal state manually before
  Brain performs REVIEW or AUTHOR_REPAIR. The solution must reuse canonical terminal refs
  rather than invent a second terminal database/outbox, must avoid polling/brokers, and
  must not run privileged GitHub workflow code from an unreviewed candidate artifact ref.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    0e2fae287cc733c13c2aebe5a50a269578773517. TASK-111 revision 2 is semantically
    reviewed PASS and published there; dedicated REPAIR wakeup implementation is now on
    main. TASK-112 approval coalescing and TASK-110 review-to-publication automation are
    already published.
  - >
    Runtime terminal refs remain the sole canonical terminal truth. Existing
    review_transport logic and Unified State already bind RESULT/FAILURE identity from
    refs/heads/aios/artifacts/* and refs/heads/aios/failure-artifacts/* respectively.
  - >
    Wakeup, transport, reconciliation, and notifications are subordinate Outer Automation
    concerns. Runtime remains deterministic coordination software and must not acquire
    semantic review or correction-authoring authority.
  - >
    Current explicit Human priority is to close GAP-C before returning to roadmap
    reconciliation/downstream adoption. The machine-readable roadmap bookmark still says
    downstream-adoption NEXT; TASK-113 does not itself rewrite that bookmark or execute
    stale TASK-109 revision 1.
  - >
    ChatGPT/GitHub connector safety availability is not guaranteed. GAP-C Phase 1 therefore
    establishes a durable repository-side Brain-attention artifact, not a claim that the
    repository can synchronously invoke or control a specific ChatGPT conversation.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/AIOS-ROADMAP.md
    - .ai/roadmap-state.yaml
    - .ai/tasks/TASK-107.yaml
    - .ai/tasks/TASK-110.yaml
    - .ai/tasks/TASK-111.yaml
    - .ai/tasks/TASK-112.yaml
    - .github/workflows/aios-brain-ingress.yml
    - .github/workflows/aios-brain-wakeup.yml
    - .github/workflows/aios-brain-repair-wakeup.yml
    - src/aios_renew/review_transport.py
  modify:
    - .ai/brain-terminal-attention-carriers.yaml
    - .github/workflows/aios-terminal-attention.yml
    - src/aios_renew/terminal_attention.py
    - src/aios_renew/review_transport.py
    - tests/test_terminal_attention.py
    - tests/test_terminal_attention_workflow.py
    - tests/test_review_transport.py
    - README.md

non_goals:
  - >
    Create a second RESULT/FAILURE store, terminal database, completion outbox with
    independent engineering truth, generic event bus, message broker, Redis, queue,
    scheduler, polling daemon, or long-running watcher.
  - >
    Invoke OpenAI/ChatGPT APIs, store OpenAI credentials, target a specific ChatGPT
    conversation/session, or claim delivery into ChatGPT itself. A GitHub Issue is a
    durable Brain-attention carrier only.
  - >
    Perform semantic REVIEW, produce PASS/CHANGES_REQUIRED/BLOCKED, author REMEDIATION or
    REPAIR, choose/default/reroute an Executor, grant Human approval, retry execution,
    or publish a candidate from the attention path.
  - >
    Modify canonical RESULT/FAILURE schemas, existing terminal ref names, Unified State
    authority, TASK-110 publication behavior, TASK-111 REPAIR authority, TASK-112
    remediation authority, frozen Kernel/governance artifacts, downstream pins, or
    TASK-109.
  - >
    Run privileged issue-write workflow logic directly from an unreviewed candidate,
    artifact, failure, review, remediation, or repair ref.
  - >
    Treat Issue state, comments, workflow conclusion, attention ref, or carrier delivery
    as semantic truth or completion evidence.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve refs/heads/aios/artifacts/<RUN> and
      refs/heads/aios/failure-artifacts/<RUN> as the sole terminal selection/truth
      namespaces. Attention delivery begins only after the exact canonical terminal ref
      has been successfully published and must independently revalidate that ref before
      emitting any Brain-facing attention.
    - >
      Add a separate operational-only attention-ref namespace whose immutable identity
      binds exactly terminal_kind, run_id, and terminal artifact commit SHA. The
      attention ref is notification/replay state only and must never be interpreted as a
      RESULT, FAILURE, REVIEW, correction, approval, or publication artifact.
    - >
      The attention ref must point to a reviewed published-main commit rather than the
      terminal artifact/candidate commit, so GitHub Actions with issues:write authority
      cannot execute workflow definitions sourced from unreviewed implementation state.
      GitHub-hosted admission must fail closed unless the workflow/ref target is provably
      on the published main lineage applicable to the event.
    - >
      The repository-owned GitHub-hosted attention workflow may be triggered by the
      bounded attention-ref event and by workflow_dispatch for exact replay/fallback. It
      must validate exact repository, event family, signal-ref grammar, terminal_kind,
      run_id, 40-hex artifact SHA, and the corresponding canonical terminal ref/artifact
      binding before creating or reusing an Issue.
    - >
      The Brain-facing Issue uses exact title marker [AIOS TERMINAL ATTENTION] and a
      strict versioned inert body containing only format/version plus run_id,
      terminal_kind (RESULT or FAILURE), and artifact_sha. It must not carry TASK text,
      candidate diff, verdict, correction action, Executor, approval, shell command,
      arbitrary ref, repository path, publication request, or model instruction.
    - >
      Exact replay of the same immutable terminal selector is idempotent across ref-event
      delivery and workflow_dispatch fallback: reuse the same attention Issue and create
      no duplicate semantic signal. A conflicting attempt to bind the same RUN/kind to a
      different artifact SHA, or to both RESULT and FAILURE, fails closed rather than
      silently rebinding attention state.
    - >
      Terminal-attention delivery failure occurs after canonical terminal truth and must
      never reclassify a successful RESULT as RUN failure, convert a FAILURE into a new
      execution failure, or trigger Executor re-execution. Existing transport-retry
      behavior may redeliver the same immutable attention after the terminal ref already
      exists; unchanged canonical verification is not rerun for notification recovery.
    - >
      Attention carrier output must state only notification admission/replay status. It
      must never assert Brain receipt, semantic review, correction creation, verification,
      Human approval, REPAIR/REMEDIATION execution, or publication success.
    - >
      Brain handling of an attention Issue always begins with fresh BRAIN SYNC of the
      exact terminal ref/artifact and relevant lineage. RESULT attention may lead to
      semantic REVIEW; FAILURE attention may lead to inspection and AUTHOR_REPAIR. The
      Issue itself grants neither authority and may be ignored/replayed without changing
      canonical engineering state.
    - >
      Existing PRIMARY, REMEDIATION, REPAIR, Unified State, Runtime verification, Brain
      authoring ingress, review-to-publication, safe Publisher, and direct transport retry
      surfaces remain behaviorally compatible. No generic lifecycle router or autonomous
      reviewer is introduced.
    - >
      README documents the steady-state distinction between terminal truth and attention
      delivery, explains that GitHub Issue attention does not directly invoke ChatGPT,
      and records manual workflow_dispatch as bounded notification replay rather than
      execution retry.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Publishing one exact canonical RESULT or FAILURE terminal ref emits exactly one
      operational attention identity bound to that terminal kind, RUN id, and artifact
      commit SHA without changing the canonical terminal artifact or its authority.
  - id: AC2
    condition: >
      The attention event executes only repository-reviewed published-main workflow code;
      attempts to source privileged issue-write automation from unreviewed/non-main
      lineage fail closed.
  - id: AC3
    condition: >
      GitHub-hosted admission independently validates the exact terminal ref/artifact
      binding and creates or reuses one [AIOS TERMINAL ATTENTION] Issue whose body contains
      only the strict versioned run_id, terminal_kind, and artifact_sha selectors.
  - id: AC4
    condition: >
      Exact duplicate notification delivery is side-effect free across attention-ref and
      workflow_dispatch replay, while conflicting RUN/kind/SHA bindings or competing
      RESULT/FAILURE terminal identities fail closed before a new attention Issue is
      created.
  - id: AC5
    condition: >
      Notification transport failure never changes RESULT/FAILURE truth, never invokes a
      coding Executor, and can be replayed from the already-canonical terminal state
      without rerunning unchanged verification or execution.
  - id: AC6
    condition: >
      Carrier receipts and Issue content make no semantic or execution claims: no verdict,
      correction action, Executor choice, Human approval, Brain receipt, verification,
      or publication success is fabricated by attention delivery.
  - id: AC7
    condition: >
      Existing terminal transport, Unified State, PRIMARY, REMEDIATION, REPAIR, Brain
      ingress, review-to-publication, and safe Publisher behavior remains compatible; no
      polling daemon, broker, OpenAI credential, autonomous Reviewer, TASK-109 execution,
      roadmap rewrite, or downstream migration is introduced.
  - id: AC8
    condition: >
      Required focused verification and git diff --check pass, every modified file is in
      TASK-113 scope, and RESULT contains zero unresolved items.

verification:
  required:
    - python -m pytest tests/test_terminal_attention.py tests/test_terminal_attention_workflow.py tests/test_review_transport.py -q
    - git diff --check
