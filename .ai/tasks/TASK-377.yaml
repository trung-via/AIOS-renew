task_id: TASK-377
revision: 1
goal: Deliver one bounded Lean VP L1 canonical-source binding slice for the published
  non-operative TASK-376 semantic proof-intake. Use the existing configured canonical
  Git transport to authenticate current-main and immutable committed TASK/contract/mapping
  source identities, content bytes and commit/path/blob provenance for an explicitly
  named prospective intake, then compose the existing structural validator without
  admitting or executing a future semantic policy. Never mistake Git source existence
  for Human approval, reviewed mapping adequacy, Runtime verification, applicability
  or KA-01 activation.
problem: TASK-376 provides an explicit future-version semantic proof declaration validator
  whose expected_task, expected_sources, expected_contract and expected_mapping pins
  are caller-supplied. A coherent forged declaration with equally forged pins can
  be structurally complete. L1 still needs a read-only Runtime-owned Git source binding
  bridge so trusted callers can derive and check exact source object identities instead
  of copying untrusted payload fields. Source bytes/currentness alone do not authenticate
  independent Human/Reviewer approval, which remains a separately gated future slice.
  Implement the minimum bridge inside the existing repository-backed transport boundary,
  with no new scheduler, proof engine or live admission.
assumptions:
- Current authoritative main at authoring is c4afa7c10dd6ff232ac502e7f378fcc161f3c0b1,
  the exact reviewed/published TASK-376 r1 candidate. The current effective NEXT is
  Lean VP, within L1 baseline/retirement/proof-contract. TASK-373 provides partial
  read-only baseline only; TASK-374 provides prospective KA-01 v1.1 norm, not activation;
  TASK-376 validates structural intake only.
- KA-01 v1.1 B.2 and D.1 G3 require actual authenticated eligible semantic proof contract/mapping
  and independent review/publication before activation. TASK-377 only authenticates
  bounded Git content provenance/currentness, not a particular mapping's independent
  semantic review or lawful future-version admission; live representative reviewed
  semantic packages are not supplied at this boundary.
- Existing review_transport.py already owns configured canonical Git read-only remote
  resolution, remote ref observation, exact commit/path reads and task source inspection.
  The existing proof_coverage_contract.py and task.py provide pure versioned non-operative
  intake and complete explicit mapping validators. Reuse these owners; do not build
  a standalone source issuer/store or duplicate proof mapping.
- An exact Git SHA, source path or caller-supplied digest is a locator/consistency
  claim until checked against the authenticated configured upstream main and actual
  Git object type/tree/blob content. An ancestor check is provenance, not a review
  approval; stale currentness and wrong remote must fail closed rather than silently
  reading local alternate refs.
- Human's continuation delegates TASK semantic authoring only; no explicit Executor/model/effort,
  production opt-in, resource budget or KA-01 G6 activation. Active TASK_AUTHORING
  profile is tca-1 version 1 normalized digest 1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2.
  Use LEGACY_REPOSITORY_DEFAULT_ROUTE.
