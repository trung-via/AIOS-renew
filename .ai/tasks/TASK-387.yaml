non_goals:
- No activation or implementation of KA-01 v1.2, prospective future TASK schema policy,
  L3 proof scheduler, checkpoint/feedback delivery, same-RUN correction, Runtime terminal
  verification scheduling, delegated Executor delivery, automated repair or remediation.
- No accepted production proof/RESULT/FAILURE/REVIEW/Publisher publication from a
  read-only eligibility witness, no new canonical artifact kind, no direct publication
  of a candidate, and no acceptance discharge or actual new test execution by L2-03
  itself.
- No retroactive transformation of L2-01/L2-02 witnesses, original source subject,
  raw evidence, immutable TASK/RUN/REVIEW/FAILURE or current legacy V1/V2 verification
  behavior.
- No new independent Reviewer, semantic mapping selector, approval source, database,
  routing/agent/scheduler/trust root or fallback/automatic correction policy.
- No inferred Human selection, per-RUN consent, correction action, remediation findings,
  proof obligation change, current Executor/lease validity or G3/G6 production eligibility;
  these remain independent future authority checks.
- No scope expansion to other Lean VP slots, unrelated integration/reconciliation
  behavior, downstream dependency or roadmap state.
constraints:
  hard:
  - Retain L2-02's exact structured, bounded, independently authenticated source-to-target
    observation, original source identity and raw outcome without editing L2-01/L2-02
    prior evidence or allowing parsed/caller-provided witness validity to serve as
    Runtime authority. The new L2-03 decision must refresh exact currentness and necessary
    immutable authority at its own boundary, fail closed on moved/conflicting refs
    or trust roots, and never invent a current target execution.
  - Expose one deterministic, versioned, closed-schema read-only eligibility decision
    with immutable original source RUN/subject/EVIDENCE/raw digest, current target
    RUN/candidate/obligation/acceptance and reviewed mapping/conditions. Separate
    source-proof actual outcome/completeness/stability/satisfaction, applicability
    and operation authorization from the final conservative eligibility outcome; a
    bare VALID or exit 0 is not satisfactory proof.
  - Permit eligibility for reuse of an approved obligation only with complete authenticated
    VALID applicability, genuinely satisfactory stable complete original PASS evidence,
    all required reviewed obligations/conditions and exact eligible target/authorization.
    FAIL/ERROR/UNKNOWN, incomplete/flaky/partial source, missing raw, questionable
    mapping, changed obligation, absent reviewed positive condition, or unauthorized
    correction scope can never discharge target acceptance.
  - INVALIDATED must preserve source provenance and identify only affected, already-reviewed
    mandatory proof as requiring new execution **if** separately authorized; UNKNOWN/unauthenticated/conflicting/stale
    state must BLOCK until already authorized finite resolution or STOP. Neither decision
    can by itself schedule, run or collect proof, widen scope/resources, select an
    Executor or initiate correction.
  - Authentication for PRIMARY must bind original TASK/acceptance/base/immutable scope;
    REPAIR must additionally require exact canonical admitted predecessor failed RUN/FAILURE
    and the current AUTHOR_REPAIR record/action, original/affected verification and
    correction scope; REMEDIATION must require exact CHANGES_REQUIRED REVIEW/source,
    outstanding selected finding or authorized causal group, current AUTHOR_REMEDIATION
    action/scope and affected verification with independent DELTA-review continuity.
    An operation-specific UNKNOWN cannot be upgraded to approval from a caller label,
    matching hash, historical consent or guessed ref; no previous terminal RUN reopens.
  - If existing L2-02 source/target observation does not yet provide authenticated
    correction operation or exact predecessor/finding lineage, extend only the minimum
    existing Runtime-owned L2-03 observation contract necessary for authoritative
    checking, or return conservative BLOCKED/NOT_ESTABLISHED. No structure-only positive
    witness, replayed GitHub issue, local label or fabricated correction is permitted;
    all flows must have focused positive and negative test coverage grounded in actual
    canonical-shaped fixtures.
  - 'Bind the full condition footprint: tests/fixtures/helpers/generated/shared state,
    toolchain/environment/config, verifier/observer, policy/profile/worker topology/state,
    collection/repetition/ordering/concurrency/integration and required original phase
    population. Preserve all independently required semantic proof obligations; a
    narrow green must not supersede broad or distinct proof. Historical missingness
    may not be filled from a digest, diff disjointness or declarative inapplicability
    without exact reviewed authority.'
  - Use existing canonical Git and Runtime EVIDENCE/RESULT/REVIEW and operation-specific
    correction-currentness readers and safety contracts. Bound object/record sizes
    and races. Parser/formatter/structural validation does not authenticate authority.
    Tests exercise native real-Git/canonical artifacts and negative source/ref/actor/admission/currentness
    permutations, without affirmative mocks replacing the actual validator.
  - Keep L2-03 an explicit nondefault observation; its positive outcome is a reusable-proof
    **eligibility for future L3 consumption**, not a terminal proof discharge, permission
    to execute, feedback transition, or policy activation. Preserve the existing L2-02
    observer's read-only behavior; no hidden scheduler or second Runtime proof owner.
  - Modify only the four listed paths; keep the original 16-slot Lean VP plan, reviewed/published
    KA-01 v1.2, legacy behavior, historical source evidence, existing public schemas
    and independent Reviewer/Publisher boundary unchanged. Document what remains for
    L3 and G3/G6.
acceptance:
- id: AC1
  condition: One explicitly invoked typed versioned L2-03 eligibility request/result
    contract identifies exact original source evidence, target admission/candidate,
    reviewed obligation/mapping, operation and original authoritative proof identities;
    strict shape/serialization bounds reject substitution, extras, ambiguous or malformed
    encodings.
- id: AC2
  condition: The L2-03 observer independently rechecks exact L2-01/L2-02 provenance,
    expected current main/refs and reviewed semantic mapping/target identities from
    canonical Runtime/Git inputs rather than granting eligibility from caller-replayed
    or parsed VALID witnesses.
- id: AC3
  condition: An authenticated source with complete stable actual satisfactory PASS,
    original raw and phase identity and exact VALID condition/applicability/semantic-coverage
    witnesses yields only a read-only per-obligation REUSE_ELIGIBLE outcome with original
    subject preserved and target execution explicitly unasserted.
- id: AC4
  condition: A VALID source FAIL, ERROR, UNKNOWN, incomplete/flaky/partial result,
    missing raw or source evidence disputed by separate condition checks can never
    yield REUSE_ELIGIBLE or target acceptance PASS, including when raw exit code equals
    zero but required semantic proof is absent.
- id: AC5
  condition: INVALIDATED returns a bounded affected-proof/outstanding-obligation observation
    without executing or autonomously scheduling new verification; UNKNOWN/unauthenticated,
    conflicting authority or stale currentness returns BLOCKED/NOT_ESTABLISHED, never
    PASS, fresh-execution permission or a retry.
- id: AC6
  condition: PRIMARY reuse eligibility remains bound to original TASK/revision/base,
    immutable acceptance/constraints, authorized proof mapping and scope, rejecting
    candidate/task/source cross-substitution or introduced unrelated obligations.
- id: AC7
  condition: REPAIR conformance requires independently authenticated exact terminal
    predecessor FAILURE and current AUTHOR_REPAIR action/authorization/scope/original-and-affected
    verification, rejects stale/superseded/missing authority or action switching,
    and returns fail-closed when native positive correction lineage cannot be established.
- id: AC8
  condition: REMEDIATION conformance requires independently authenticated CHANGES_REQUIRED
    reviewed source/selected outstanding finding or authorized group, current remediation
    authorization/action/scope and affected verification plus DELTA-review continuity;
    unrelated/closed/new findings and unproven grouping cannot become positive eligibility.
- id: AC9
  condition: All distinguishing original/target proof footprints including test, helper,
    fixture, state, environment, toolchain, profile, worker, ordering, repetition,
    concurrency, integration and semantic contract obligations are preserved; changed
    or missing relevant dimensions invalidate or block rather than remain silently
    reusable.
- id: AC10
  condition: Bounded isolated real-Git and canonical-shaped Runtime fixtures exercise
    real authenticated positive paths where supported, and adversarial negative original/correction
    source/currentness, raw/evidence, reviewed mapping, phase/population, changed
    condition and conflicting-ref cases without replacing authenticators with affirmative
    mocks.
- id: AC11
  condition: The resulting L2-03 API and documented conformance neither executes verification
    nor mutates canonical TASK/RUN/EVIDENCE/RESULT/FAILURE/REVIEW, delivers feedback,
    reassigns Executor, creates a scheduler/router, authorizes terminal repair, or
    activates KA-01/G3/G6.
- id: AC12
  condition: The final committed L2-03 source is confined to the four authorized paths,
    documents its conservative eligibility states and L3 consumer gates, and leaves
    prior L2-01/L2-02 semantics, KA-01 v1.2 publication, legacy minimum-sufficient-v1/V2,
    roadmap and downstream pins unchanged.
