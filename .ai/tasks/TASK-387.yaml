task_id: TASK-387
revision: 1
goal: 'Deliver exactly Lean VP L2-03: a bounded explicitly invoked Runtime-owned read-only
  proof reuse and correction-applicability conformance decision for exact source evidence
  and target proof obligations. Consume freshly authenticated L2-01/L2-02 source-to-target
  applicability and reviewed semantic authority; distinguish eligible satisfactory
  source-proof reuse from INVALIDATED or UNKNOWN, preserve original raw source/outcome,
  and guard PRIMARY, REPAIR and REMEDIATION against unapproved source, action, finding
  or verification-scope inheritance. Supply focused real-Git positive/adversarial
  conformance without implementing the L3 scheduler, preterminal feedback/continuation,
  new proof execution or KA-01 activation.'
problem: Published TASK-385 L2-02 computes VALID/INVALIDATED/UNKNOWN applicability,
  but its witness deliberately says satisfactory=false and reuse=NOT_AUTHORIZED; it
  neither proves original outcome satisfactory for the exact target obligation nor
  checks the authorized correction operation before any proof is discharged. Published
  KA-01 v1.2 now makes future operation-specific PRIMARY/REPAIR/REMEDIATION safety
  mandatory. Without an independently authenticated L2-03 decision seam, callers could
  interpret VALID or raw exit 0 as an authorized PASS, carry proof across changed
  conditions, invent source execution on the target, lose REPAIR/REMEDIATION predecessor/finding
  constraints, or wrongly move L3 scheduling/feedback into L2.
assumptions:
- Canonical base after Human/Brain planning reconciliation is ecc9a451f3dd5f59f002d83bee0b9be8df8c575f;
  the immediate predecessor TASK-386 r1 RUN-386-001 had EVIDENCE RUN-386-001-V001
  exit 0 and independently canonical REVIEW-386-001 PRIMARY PASS 12/12 at review-decision
  SHA 1ec03c493b3f18c766d1ba8bbbebc7cb6e207775; Publisher included the exact reviewed
  candidate fc5ff4c2bd79c8e1a0bddeb72dda1a9f42d35e69 on main. This normative publication
  did not activate KA-01, G3 or G6.
- Published TASK-384 RUN-384-004 provides original source identity/provenance. TASK-385
  RUN-385-001 provided bounded independently authenticated applicability; its VALID
  means only condition applicability, and its satisfactory=false, reuse=NOT_AUTHORIZED,
  target_execution=NOT_ASSERTED projections remain normative until a separately authorized
  downstream consumer decision. None of these prior TASKs implemented L2-03.
- The unique high-level canonical NEXT remains lean-vp-intelligent-intra-primary-after-r21,
  and the Human/Brain planning bookmark now selects the fixed original 16-slot L2-03
  work item after the separate, now published, KA-01 normative TASK outside the 16.
  This TASK is the next bounded delivery slice, not a new architectural program.
- The prospective KA-01 v1.2 contract is restricted to future individually opted-in
  admitted ACTIVE PRIMARY, REPAIR and REMEDIATION under exact immutable correction
  authorization, live current-RUN Executor, lease and finite Human limits. Here L2-03
  is a read-only observation/conformance slice and has no consent to use the production
  loop.
- The existing L2-02 target observation presently expects primary-shaped active RUN
  and exact review/artifacts refs. The L2-03 implementation must not declare correction
  applicability or reuse authenticated by analogy; it must consume existing independently
  authenticated correction lineage and fail closed when positive native correction-currentness
  or necessary source facts are not yet supported. Bounded extension of the existing
  same Runtime observation/contract is permitted only to establish the L2-03 outcome.
- Brain selected TASK_AUTHORING profile tca-1 v1 with canonical normalized digest
  1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2 and performed its
  CONSTRUCT and ADVERSARIAL_AUDIT_AND_RECONCILE semantic checks. No serialized audit
  packet, second audit or audit-derived mutation authority is supplied to AUTHOR_TASK.
- This new TASK has no inferred Executor/model/effort or G6 opt-in; Human delegation
  must be separately explicit. Its standing authoring affinity is LEGACY_REPOSITORY_DEFAULT_ROUTE
  and verification uses published minimum-sufficient-v1.
