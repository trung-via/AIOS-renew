task_id: TASK-227
revision: 1

goal: >
  Integrate RA-6 AIOS Integration & Continuity Conformance as a first-class explicit-only
  RESEARCH cognitive flow by extending Brain Context/Flow Cards, adding a dedicated bounded
  Research Packet and separate ResearchProvider invocation surface over the reviewed RA-1
  through RA-5 contracts, and proving fresh-context, cross-provider, source-substitution,
  Research Record reuse/invalidation and bounded fresh-ARCHITECTURE handoff behavior without
  changing engineering lifecycle authority.

problem: >
  RA-1 through RA-5 now freeze Research Brief/acquisition identities, source provenance,
  immutable Research Record/reuse semantics, the two-pass nine-lens protocol, provider-neutral
  research request/return semantics and explicit acquisition-adapter portability, but core
  AIOS still has no first-class RESEARCH flow or continuity surface. A naive integration could
  overload AIOS_DECISION_PACKET or the existing BrainProvider stack, auto-select research from
  lifecycle/roadmap state, hide pending engineering obligations, depend on chat/session state,
  introduce a provider/tool router or retry loop, resolve a latest Research Record, infer
  freshness, duplicate the research audit, or let research create TASK/roadmap/lifecycle truth.
  RA-6 must integrate the already-reviewed contracts while preserving those authority boundaries.

assumptions:
  - >
    Canonical AIOS-renew main at authoring is
    6cfd0b70e390a42e123bb0fee9e12788ffaefa02. RA-5 closed through TASK-226 revision 1,
    RUN-226-001 / REPAIR-226-001 / RUN-226-002 and REVIEW-226-001 PRIMARY PASS; the exact
    reviewed RA-5 source SHA is 73b4e23227dee9a046c8b2b5a1b06751a61c745a.
  - >
    docs/AIOS-RESEARCH-ASSURANCE.md at planning commit
    781d4d633de457ca759689d05f9b32ffe9069996 and .ai/roadmap-state.yaml at
    6cfd0b70e390a42e123bb0fee9e12788ffaefa02 are the current Human/Brain planning baseline.
    RA-6 is the unique NEXT and its architecture audit is
    PASS_WITH_MANDATORY_INTEGRATION_BOUNDARIES.
  - >
    RA-1 through RA-5 semantic contracts are reviewed foundations for this TASK. RA-6 may
    compose their public exported APIs but must not redesign their identities, audit semantics,
    source-acquisition truth boundary, provider request/return contract or adapter contract.
  - >
    RESEARCH is Brain-owned cognitive support only. Runtime, Unified State, engineering
    Reviewer/Publisher, canonical verification and roadmap advancement retain their existing
    authorities and are not research workflow state.
  - >
    RA-7 owns controlled proof against actual stable, mutable/time-sensitive and
    prompt-injection-bearing external/project sources. RA-6 conformance may use only
    caller-supplied/injected fake provider and acquisition transports.

