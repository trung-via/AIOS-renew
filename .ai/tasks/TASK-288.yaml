task_id: TASK-288
revision: 1
goal: Integrate the semantically reviewed TASK-287 stale-flight liveness hardening
  onto the current canonical main as a fresh current-main descendant, preserving the
  current roadmap/control state and the exact reviewed TASK-287 behavior, then produce
  a newly verified and semantically reviewed candidate eligible for normal safe publication.
problem: 'TASK-287 completed through repair continuation RUN-287-002 at candidate
  0b17f2468500a33d5352d61df91df38b78bb10bd. Runtime verification passed with 472 passed,
  610 skipped, git diff --check passed, unresolved was empty, and REVIEW-287-002 returned
  PRIMARY PASS for AC1-AC6 with no findings. Auto-publication correctly failed closed
  with INTEGRATION_REQUIRED because canonical main independently advanced to 148ba5faf583e87e8de4620ec59380c15d0bf0e1.
  Both lineages share merge base 7e1fd0b826e84265eeb4dd36b552c09c19904831: current
  main differs from that base only in .ai/roadmap-state.yaml, while the reviewed TASK-287
  source differs only in the four TASK-287 authorized implementation/conformance files.
  Publishing the historical reviewed SHA directly would discard current planning state,
  while using a correction-integration ref alone would not create a newly reviewed
  publishable source. A fresh current-main integration TASK is therefore required.'
assumptions:
- Canonical main at TASK-288 authoring is 148ba5faf583e87e8de4620ec59380c15d0bf0e1.
- RUN-287-002 is the canonical successful REPAIR RESULT for TASK-287 and its result
