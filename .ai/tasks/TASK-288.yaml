non_goals:
- Rewrite, delete, supersede, reinterpret, or republish historical TASK-287, RUN-287-001,
  RUN-287-002, REPAIR-287-001, REVIEW-287-002, RESULT, FAILURE, EVIDENCE, repair authorization,
  or publication-attempt lineage.
- Force-publish, force-update main, publish the divergent historical TASK-287 reviewed
  SHA directly, or treat REVIEW-287-002 as the semantic verdict for TASK-288.
- Change TASK-287 semantics, add a new completion heuristic, weaken fail-closed ambiguity
  handling, change DOM selectors, timing/recheck budgets, durable lane schema, exact-target
  barriers, privacy boundaries, or lifecycle/authority ownership.
- Modify .ai/roadmap-state.yaml, TASK documents, workflows, publication/Runtime/Reviewer
  code, frozen Kernel artifacts, downstream repositories, or files outside the four
  authorized mutation targets.
- Use correction-integration staging as a publication shortcut, create a new correction
  finding, rerun historical RUN-287 execution, or add merge/retry/reroute/fallback
  authority.
- Close H4B, claim the future natural unresolved RESULT live proof, or start H5 from
  TASK-288 acceptance.
- Push or publish from Executor implementation execution.
constraints:
  hard:
  - The TASK-288 candidate must descend from the exact TASK-288 current-main authoring
    state. All current-main planning/control state, including .ai/roadmap-state.yaml,
    must remain present and unchanged by Executor mutation.
  - Within the four authorized files, preserve the complete reviewed TASK-287 behavior
    and documentation represented by reviewed SHA 0b17f2468500a33d5352d61df91df38b78bb10bd.
    Because current main has no overlapping changes in those files since merge base
    7e1fd0b826e84265eeb4dd36b552c09c19904831, the integrated file contents must not
    introduce semantic changes beyond the reviewed TASK-287 delta.
  - 'Preserve the permanent stale-flight contract: existing BUSY->IDLE release remains
    valid; seen_busy=false plus IDLE alone never releases; release without observed
    BUSY requires the exact-turn-bound content-free structural completion witness
    on the exact authenticated regular-Chat target while IDLE; every missing/hidden/duplicate/nested/role-ambiguous/intervening-user/surface/generation
    uncertainty holds the flight.'
  - Preserve SUBMITTED dedupe identity and all fresh canonical, binding-generation,
    exact-target, draft/generation and pre-click barriers before any later pending
    send. The integration must not authorize replay or resend of historical wake events.
  - 'Preserve the privacy boundary: no assistant text, assistant HTML/raw content,
    semantic interpretation, chat-history export, account/session/credential data,
    CDP endpoint or local-path data may enter the completion witness.'
  - Historical RUN-287-002 verification and REVIEW-287-002 establish provenance for
    the source delta only. TASK-288 must undergo fresh Runtime verification on the
    current-main descendant and a fresh semantic REVIEW before Publisher may publish
    it.
  - Executor changes only the four authorized files. Runtime owns verification and
    changed-file enforcement; Reviewer owns the new semantic verdict; Publisher owns
    publication; Human/Brain retains H4B live-proof and roadmap closure authority.
acceptance:
- id: AC1
  condition: The final TASK-288 candidate descends from the exact TASK-288 authoring
    main and changes only the four authorized TASK-287 implementation/conformance
    files, preserving current-main .ai/roadmap-state.yaml and every file outside scope.modify.
- id: AC2
  condition: The four integrated files preserve the reviewed RUN-287-002/TASK-287
    semantics represented by reviewed SHA 0b17f2468500a33d5352d61df91df38b78bb10bd
    without adding a new completion heuristic, selector, timing budget, state schema,
    transport, semantic authority, or privacy exposure.
- id: AC3
  condition: Focused stale-flight coverage on the integrated current-main descendant
    proves the missed-BUSY completion witness, exactly-once next-subject behavior,
    fail-closed ambiguous post-submit behavior, existing BUSY->IDLE path, canonical-resolution
    path, fresh barriers, and content-free privacy boundary remain intact.
- id: AC4
  condition: The H4B and local-wake conformance documents on the integrated descendant
    continue to record RUN-285 stale-flight evidence, Human state-only recovery, RUN-286
    canonical NOOP drain, the exact-turn-bound completion contract and fail-closed
    cases, and they still leave H4B UNPROVED pending a future natural real unresolved
    RESULT semantic-resume observation.
- id: AC5
  condition: The integration does not mutate or reinterpret historical TASK-287/RUN/REPAIR/REVIEW/publication
    lineage and does not use REVIEW-287-002 as the verdict for TASK-288; TASK-288
    produces its own canonical RESULT and requires its own semantic REVIEW.
- id: AC6
  condition: Runtime minimum-sufficient verification passes on the fresh current-main
    descendant, git diff checking passes, RESULT contains zero unresolved items, and
    no mutation occurs outside the four authorized files.
