- REVIEW-287-002 at decision SHA 758655253a78158653f3c3ae88f480f0dd79f47d is PRIMARY
  PASS for AC1-AC6 with no findings.
- The failed RUN-287-002 publication is an ancestry/integration boundary, not a semantic
  failure of TASK-287.
- Canonical compare establishes merge base 7e1fd0b826e84265eeb4dd36b552c09c19904831.
  Current main is one commit ahead and changes only .ai/roadmap-state.yaml; reviewed
  TASK-287 is two commits ahead and changes only docs/AIOS-H4B-REGULAR-CHAT-BRAIN-RESUME-CONFORMANCE-v1.md,
  docs/AIOS-LOCAL-REGULAR-CHAT-WAKE-v1.md, src/aios_renew/local_chat_wake.py, and
  tests/test_local_chat_wake.py.
- The historical REVIEW-287-002 remains evidence for the intended TASK-287 semantic
  delta but is not a review verdict for the new TASK-288 integration candidate.
