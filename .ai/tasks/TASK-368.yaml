- Active prospective profile before a separately canonicalized future Human/Brain
  cutover remains aios-adaptive-brain-audit-v1 v1 normalized digest 982ba27964c78e7a7f79f5f268afb32eed27605be90b0642e4001b2edf116718.
  Frozen profile identity mappings for R5 are {"ARCHITECTURE":{"id":"aoa-1","version":1,"digest":"7789fcc53bd6593c8d190e867d14d9fe80060395ae20a0706981d16fec7e617b"},"TASK_AUTHORING":{"id":"tca-1","version":1,"digest":"1fa1d5fd098494eeb5cb97665f40e7556969555aed552dfc7fa28871555884a2"},"REMEDIATION_AUTHORING":{"id":"moa-1","version":1,"digest":"49d1c4c3edefe3d3cefcd66e186b7d7b89738516129957c18415d55760ffe903"},"REPAIR_AUTHORING":{"id":"roa-1-r2","version":2,"digest":"aa6a5b60997849d6a00f9e4174ca7ef20fbc62ed64da645ee938a94f8e2639e4"}}.
  An in-flight subject retains its exact originally selected package and stage lineage.
- Human prospectively approved all R2.1 implementation tasks using individually admitted
