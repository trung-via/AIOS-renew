non_goals:
- No Executor-authored mutation to .ai/roadmap-state.yaml, active planning bookmark,
  Human risk-acceptance record, Constitution or frozen Kernel; no claim of prospective
  selection activation before R5 reviewed publication and separate explicit Human/Brain
  canonical policy reconciliation.
- No new general planner, profile router, score/threshold winner, agent, model auto-selector,
  lifecycle state, database, duplicated profile registry, automatic retry/correction
  selector, new RUN/REVIEW/PUBLISH authority, or modified Flow Resolver semantics.
- No new or regenerated AOA/TCA/MOA/ROA/Adaptive V1/V2/V3 audit profile content, digest,
  historical contract or in-flight result; no obligatory Adaptive V1 plus specialized
  audit for the same prospective subject.
- No reintroduction of serialized audited_handoff, Decision Packet hashes, Brain audit
  fingerprints or proof ledgers into direct-final AUTHOR_TASK / AUTHOR_REPAIR / AUTHOR_REMEDIATION
  mutation prerequisites; no unrelated ingress refactor.
- No new V3 fallback, downgrade or silent V1 compatibility fallback when a future
  activated exact specialized profile is missing; no partial activation by a mere
  conformance_only flag or literal Human string.
- No downstream adoption, VP/BO implementation, measured efficiency or quality superiority
  claim, full suite, verification v2 policy, new production AOA/TCA implementations
  or corrections unrelated to R5.
constraints:
  hard:
  - Implement R5 solely as a bounded extension to the published existing provider-neutral
    Brain attempt/request/decision protocol and exact profile registry semantics.
    Flow selection remains the existing selected_flow; no second Flow Resolver or
    generic runtime semantic selector. One invocation binds exactly one externally
    authenticated prospective policy state, one flow, one complete pinned profile
    package, one work-context/canonical-currentness identity and one return contract;
    provenance strings and hashes supplied by a model cannot authenticate Human policy.
  - A future activated Human/Brain canonical policy must map exactly ARCHITECTURE
    -> aoa-1 v1, TASK_AUTHORING -> tca-1 v1, REMEDIATION_AUTHORING -> moa-1 v1, REPAIR_AUTHORING
    -> roa-1-r2 v2 with the four exact normalized digests listed in assumptions. Reject
    incomplete, conflicting, stale, rehashed or partially activated policy, unknown
    profile, wrong flow, unsupported package or wrong binding; fail closed without
    fallback.
  - Until an explicitly approved and authenticated canonical policy cutover occurs
    after reviewed and published R5, ordinary prospective calls must continue to select
    exact Adaptive V1 v1 as the sole active production profile. Implementation, test
    fixtures, registry order, an Issue dispatch, reviewed/published R5 candidate alone
    or generic Human approval of implementation is not activation authority. When
    a future policy is explicitly active, do not issue unsolicited V1 or double-audit
    one subject.
  - Once the future switch is authorized, the existing ARCHITECTURE AOA, TASK_AUTHORING
    TCA and REMEDIATION MOA each run exactly their pinned two focused passes/one closure,
    while REPAIR ROA runs exactly its pinned one focused procedure. Reuse the published
    semantic source/lineage validation, bounded privacy and frozen currentness checks
    without making isolated testing a hidden live-selection prerequisite.
  - For ARCHITECTURE or TASK_AUTHORING, an explicit individually authenticated Human
    V1_ONLY selection bound before stage one to exact subject, source, canonical currentness,
    return contract and V1 profile substitutes V1 alone for specialized mode. A bare
    selected_by=HUMAN, inferred complexity, repeated model preference or same-subject
    mixing of V1 and specialized must fail closed. Existing isolated Human option
    support is retained. The Human may choose a fresh separately bound decision rather
    than override an in-flight audit.
  - For REMEDIATION_AUTHORING and REPAIR_AUTHORING, the specialized procedure is normative.
    Human-requested deeper V1 analysis is optional, read-only cognitive support with
    no second normative verdict, no corrected payload authority, no mutation gate
    or automatic extra provider call. It cannot replace ROA/MOA without a later separately
    approved normative policy change.
  - "Protect exact historical V1/V2/V3 and R1\u2013R4 content/digests plus in-flight\
    \ first-stage profile and return binding. When the policy changes between stages\
    \ or before final return, an already admitted exact old subject may finish under\
    \ its original bound source if the caller can authenticate the same original policy/currentness\
    \ authority; otherwise stop with a bounded stale/ambiguous blocker, never mix\
    \ modes or silently recompose under the new default."
  - 'Do not change Runtime TASK/RUN/RESULT/FAILURE/REVIEW/REPAIR/REMEDIATION, direct-final
    ingress, Publisher or roadmap-reducer code. Any formerly hardcoded V1 compatibility
    helper that is not on the live direct-final path must remain inert and must not
    become an authority gate. If a truly live mandatory consumer outside scope is
    discovered, do not edit it silently: surface a bounded closure blocker requesting
    separate Human scope authority.'
  - Create focused positive and adversarial regression cases for all four target profiles,
    zero unsolicited V1 after simulated future activation, exact Human opt-in on ARCH/TASK,
    read-only V1 for corrections, pre-cutover old V1 behavior, mixed/stale stages,
    missing/ambiguous/forged source policy, untrusted Human literal, wrong digest/flow,
    privacy, old subjects/replay and direct-final ingress non-interference. Do not
    claim empirical provider quality improvement without comparable episodes.
  - Only seven scope.modify files are authorized; verify using the two exact focused
    minimum-sufficient-v1 commands without broad full-suite runs. Document one unambiguous
    future cutover prerequisite and outstanding separately Human/Brain-owned roadmap
    mutation, not a self-authorized activation.
acceptance:
- id: AC1
  condition: Existing Brain provider/semantic protocol supports one prospective per-flow
    selected audit profile for ARCHITECTURE=AOA-1, TASK_AUTHORING=TCA-1, REMEDIATION_AUTHORING=MOA-1
    and REPAIR_AUTHORING=ROA-1 R2, each with its existing pinned digest and exact
    focused pass count, without an independent selector/router or re-minted profile.
- id: AC2
  condition: Selection for future prospective specialized attempts is bound to externally
    authenticated, complete Human/Brain canonical policy, exact selected flow, main/currentness,
    profile id/version/digest, return contract and subject. Absent, stale, malformed,
    conflicting or partial activation fails closed rather than silently choosing V1/V3
    or relying on registry order.
- id: AC3
  condition: Without authorized prospective cutover, production selection retains
    exact current Adaptive V1 and historical in-flight subjects preserve their original
    pinned profile/stage lineage. No simulated or real candidate switches by Task/Issue/workflow
    status, conformance_only, profile presence or Executor claims alone.
- id: AC4
  condition: Upon an explicitly supplied and authenticated future active policy, the
    four flow-specific supported procedures can each execute as exactly one normative
    audit, with their established bounded source validation, final closure and pre-second-pass/final
    currentness behavior; no unsolicited prospective V1 is invoked or required.
- id: AC5
  condition: Architecture and Task Authoring accept a one-subject explicit externally
    authenticated Human V1_ONLY selection as the sole normative V1 substitute, rejecting
    literal or forged opt-in, mixed stages, dual audits, stale packages and silent
    V3 fallback. Existing TCA/AOA isolated Human option compatibility is preserved.
- id: AC6
  condition: Remediation and Repair maintain MOA/ROA alone as normative even when
    optional V1 cognitive deep support is requested; that support remains read-only,
    source-bound and cannot become a second normative review or new mutation prerequisite.
- id: AC7
  condition: Focused regression coverage demonstrates canonical policy pre-cutover/post-cutover
    test cases for all four flows, missing authority/profile, cutover during in-flight
    execution, privacy and cross-profile substitutions, historical V1/V2/V3 compatibility
    and inert direct-final ingress, with no full-suite requirement.
- id: AC8
  condition: "R5 implementation changes only scope.modify, documents exact future\
    \ Human/Brain planning cutover as an unfulfilled separate authority until actually\
    \ canonicalized, and leaves Runtime/Reviewer/Publisher, direct authoring paths,\
    \ roadmap, Kernel, downstream and preserved R1\u2013R4 profile bytes unchanged."
