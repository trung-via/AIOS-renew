task_id: TASK-368
revision: 1
goal: 'Implement R2.1/R5 bounded prospective audit-profile policy selection and migration
  closure in the existing Brain provider/semantic protocol: after a separately authenticated,
  explicit Human/Brain canonical cutover, select exactly one existing pinned specialized
  procedure for each of ARCHITECTURE, TASK_AUTHORING, REMEDIATION_AUTHORING and REPAIR_AUTHORING.
  Preserve Adaptive V1 as externally Human-opted, one-audit-only architecture/task
  substitute and correction read-only deep cognitive support; preserve existing V1
  production selection until that later lawful planning cutover and all historical/in-flight
  exact profile bindings. Do not invent a new audit router or change Runtime mutation/verification
  authority.'
problem: R2.1/R1 through R4 have reviewed/published ROA-1 R2, MOA-1, TCA-1 and AOA-1
  as strictly isolated conformance. The live Brain provider still routes ordinary
  audited invocations to universal V1 by default, while specialized procedures require
  conformance_only=True and correction-ingress historical helper retains hardcoded
  V1-only checks. Merely renaming a profile in roadmap, or relying on registry order,
  risks either no actual prospective specialized selection or an unauthorized mid-flight
  policy switch and mixed audit lineage. R5 needs the smallest safe adapter-level
  prospective selection boundary and focused conformance; no Executor-run mutation
  may itself approve a Human/Brain planning cutover.
assumptions:
- Brain Sync on canonical main 3c9fb1dfa4f27dc54ff9d73285289e89aa29a04e establishes
  R2.1/R4 TASK-367 r1 / RUN-367-001 / REVIEW-367-001 PRIMARY PASS and the exact reviewed
  source 3c9fb1dfa4f27dc54ff9d73285289e89aa29a04e published at HEAD. R1 TASK-363,
  R2 TASK-364 and R3 TASK-366 published isolated profile support remain exact historical
  antecedents.
- Human-approved docs/AIOS-FOUR-SPECIALIZED-AUDITS-R2.1.md R5 target is four outcome-specific
  default procedures with optional Adaptive V1. Existing .ai/roadmap-state.yaml active
  profile selection still names sole V1. This TASK must not infer prospective activation
  from Human approval of implementation, mere profile registry membership, GitHub
