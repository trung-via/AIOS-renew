task_id: TASK-031
revision: 1

goal: >
  Harden executor publication-boundary parity for the AIOS-renew v0.1.3
  candidate so Codex and Antigravity are both explicitly instructed not to
  push repository changes during PRIMARY or REMEDIATION execution, while
  preserving the existing shared semantic contracts and Runtime authority.

problem: >
  The current Codex PRIMARY prompt explicitly ends implementation at a local
  commit and says not to push. Codex REMEDIATION does not state the no-push
  rule explicitly, and neither Antigravity PRIMARY nor Antigravity REMEDIATION
  currently states it explicitly. This leaves an avoidable operational
  asymmetry at the publication boundary even though both executors otherwise
  implement the same semantic TASK and REMEDIATION contracts.

assumptions:
  - Publication remains outside Executor implementation authority.
  - Codex PRIMARY already has the intended no-push instruction and should remain semantically unchanged.
  - Antigravity PRIMARY and REMEDIATION instructions are constructed in src/aios_renew/operator.py.
  - Codex PRIMARY and REMEDIATION prompts are constructed in src/aios_renew/codex_adapter.py.
  - This task hardens explicit executor instructions and regression coverage; it does not add a new Git transport guard or publication mechanism.

scope:
  inspect:
    - src/aios_renew/operator.py
    - src/aios_renew/codex_adapter.py
    - tests/test_operator.py
    - tests/test_codex_adapter.py
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-v0.1.3-ARCHITECTURE-AMENDMENT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md

  modify:
    - src/aios_renew/operator.py
    - src/aios_renew/codex_adapter.py
    - tests/test_operator.py
    - tests/test_codex_adapter.py

non_goals:
  - Change TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, or ResultPackage schemas.
  - Change AntigravityAdapter normalization, BOM handling, or Codex structural normalization.
  - Change Runtime-owned verification, evidence construction, Git synchronization, repository locking, SHA binding, changed-files enforcement, or review semantics.
  - Add automatic retry, reroute, fallback, polling, watcher, daemon, planner, verifier agent, router, or additional orchestration layer.
  - Add a new publication mechanism, Git hook, network guard, remote mutation detector, or push wrapper.
  - Change executor CLI permissions, Antigravity mode, Codex sandbox defaults, model selection, timeout, or authentication.
  - Perform live executor conformance in this task.
  - Change release metadata or create the v0.1.3 tag.
  - Modify the frozen v0.1 specification or the Brain TASK Authoring Contract.

constraints:
  hard:
    - Keep the change limited to executor-facing publication-boundary wording and focused regression coverage.
    - Both PRIMARY executor paths must end implementation authority at the permitted final local commit and explicitly prohibit push.
    - Both REMEDIATION executor paths must explicitly prohibit push while preserving CODE_FIX local-commit and EVIDENCE_ONLY no-code-commit semantics.
    - Do not expose canonical TASK verification or REMEDIATION affected-verification commands to either executor.
    - Preserve executor-neutral TASK and REMEDIATION semantic inputs.
    - Preserve Runtime ownership of canonical verification and EVIDENCE construction.
    - Preserve existing Antigravity handoff staging and structural ResultPackage behavior.
    - Preserve existing Codex structural ResultPackage behavior.
    - Do not change any executor invocation flag or CLI command shape except executor-facing instruction text carried through the existing interfaces.
    - Do not add duplicated semantic planning, review, verification, or publication work.
    - Keep the implementation minimal and fail closed.

acceptance:
  - id: AC1
    condition: >
      Antigravity PRIMARY instruction explicitly prohibits push while retaining
      the existing requirement to commit the final permitted implementation
      state when repository changes are required.

  - id: AC2
    condition: >
      Antigravity REMEDIATION instruction explicitly prohibits push while
      preserving CODE_FIX local-commit behavior and EVIDENCE_ONLY no-code-commit
      behavior.

  - id: AC3
    condition: >
      Codex REMEDIATION prompt explicitly prohibits push while preserving its
      existing narrow-remediation behavior, and the existing Codex PRIMARY
      no-push rule remains present.

  - id: AC4
    condition: >
      PRIMARY and REMEDIATION executor inputs remain semantically executor-neutral
      and continue excluding Runtime-owned verification commands and canonical
      verification evidence construction.

  - id: AC5
    condition: >
      Focused regression tests assert the no-push publication boundary for all
      four executor-facing surfaces: Codex PRIMARY, Codex REMEDIATION,
      Antigravity PRIMARY, and Antigravity REMEDIATION.

  - id: AC6
    condition: >
      No executor CLI flags, Runtime gates, adapter normalization, canonical
      schemas, Git synchronization, review/remediation lineage, or publication
      mechanism changes.

verification:
  required:
    - python -m pytest tests/test_codex_adapter.py tests/test_operator.py -q
