task_id: TASK-147
revision: 1

goal: >
  Preserve exact Runtime evidence intent when repairing a failed REMEDIATION and make
  Codex REMEDIATION terminal head binding explicit, so an integrated EVIDENCE_ONLY
  remediation can be repaired without losing its review-only live verification.

problem: >
  TASK-140 RUN-140-012 exposed two deterministic control-plane gaps after TASK-144 was
  published. The canonical integrated EVIDENCE_ONLY remediation ran from execution base
  ed83c8cd1c38c4b940f7f12daa49fbef548fafa6, but Codex returned a structural package with
  result.head_sha=c52a1db8d59270628f69c2cc54c3985553e4abca, exactly the historical
  remediation.reviewed_sha. Runtime correctly failed closed at COMPLETION_GATE with
  "RESULT.head_sha mismatch"; failed_head_sha remained ed83c8cd..., changed_files=[],
  dirty=false, repairable=true, transportable=true, and verification_seconds=null, so the
  required live agy proof never ran. The Codex REMEDIATION prompt says EVIDENCE_ONLY must
  not commit and must return a structural ResultPackage, but unlike the native Antigravity
  prompts it does not explicitly require result.head_sha to bind to actual final Git HEAD
  / the admitted run base for zero-mutation execution.

  A second latent gap prevents a correct repair from recovering the evidence intent.
  Generic REPAIR completion currently always runs TASK.verification.required. When the
  failed origin is a REMEDIATION, its exact remediation.affected_verification is not
  preserved into repair completion. For FINDING-140-006 that would mean a
  FINALIZE_CANDIDATE repair could become structurally valid yet still never execute the
  independent live agy 1.2.6 AC8 proof that the EVIDENCE_ONLY remediation was authored to
  collect. This violates evidence continuity even though TASK-144 correctly preserves the
  integrated result base and semantic repair lineage.

assumptions:
  - Canonical main is 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  - TASK-144 revision 2 is DONE and its integrated REMEDIATION repair-result-base semantics are canonical.
  - TASK-140 remains paused at RUN-140-012 / AUTHOR_REPAIR until TASK-147 is published.
  - RUN-140-012 failure artifact commit is 2daf5dd805d99680c2afb50cc149c76a82e6bb98.
  - RUN-140-012 failed_head_sha and integrated execution base are ed83c8cd1c38c4b940f7f12daa49fbef548fafa6.
  - RUN-140-012 staged structural package is zero-mutation but binds head_sha to c52a1db8d59270628f69c2cc54c3985553e4abca.
  - The original canonical EVIDENCE_ONLY remediation contains the exact affected_verification command for the live agy proof.
  - Existing Authoring Ingress and Publisher REPAIR-of-REMEDIATION DELTA semantics remain authoritative.

scope:
  inspect:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/authoring_ingress.py
    - src/aios_renew/publication.py
    - tests/test_operator.py
    - refs/heads/aios/failure-artifacts/RUN-140-012
    - refs/heads/aios/remediation/RUN-140-007-FINDING-140-006
    - refs/heads/aios/integration/9f823268b077c28bf2a1586e2efada58dbfd88cd987d26dbfca2f95bc4fb8e16
  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - tests/test_operator.py

non_goals:
  - Modify TASK-140 implementation, guard, adapter implementation, tests, findings, reviews, or canonical RUN artifacts.
  - Re-run, replace, delete, force-move, or synthesize RUN-140-012.
  - Change TASK-144 result-base, integration validation, Authoring Ingress, or Publisher semantics.
  - Change the meaning of EVIDENCE_ONLY, CODE_FIX, FINALIZE_CANDIDATE, NO_CHANGE, or CONTINUE_IMPLEMENTATION.
  - Remove Runtime ownership of verification or permit Executors to generate canonical verification EVIDENCE.
  - Eliminate the existing Executor invocation requirement for REMEDIATION in Human Surface.
  - Add task/run-specific exceptions, automatic retry, fallback, planner/router behavior, or guessed lineage.

constraints:
  hard:
    - >
      Codex REMEDIATION instructions must explicitly bind result.head_sha to actual final
      Git HEAD. For EVIDENCE_ONLY, because repository mutation is forbidden, that means
      the unchanged admitted run.base_sha / actual HEAD, not remediation.reviewed_sha.
      Preserve empty root evidence, empty result.claims/unresolved, Runtime-owned
      affected verification, and no-commit semantics.
    - >
      Preserve current CODE_FIX REMEDIATION semantics and all provider-neutral structural
      contracts. Do not special-case TASK-140, RUN-140-012, concrete SHAs, or AC8 text.
    - >
      When REPAIR admission originates from a canonical failed REMEDIATION, reconstruct
      the exact canonical RemediationExecution from the immutable failed RUN lineage and
      carry only its validated affected_verification into repair completion. Never infer
      commands from repair instructions, issue prose, staged output, or model assertions.
    - >
      For a REPAIR of a failed REMEDIATION, Runtime must preserve the existing TASK-level
      REPAIR verification contract and additionally execute the origin remediation's
      affected_verification commands. Ordering must be deterministic and duplicate commands
      must not execute twice. Ordinary PRIMARY repairs and repairs without a REMEDIATION
      origin must retain their current verification behavior exactly.
    - >
      The additional remediation evidence commands remain Runtime-owned and must execute
      through the existing deterministic verification boundary with existing cwd,
      environment, UTF-8, raw-evidence, exit-code, stop-on-first-failure, timeout/cleanup,
      and fail-closed semantics. Executor prompts must not expose them as commands to run.
    - >
      Preserve TASK-144 dual-base semantics. result_base_sha for an integrated repaired
      REMEDIATION remains the validated integrated candidate, while mutation authority
      remains anchored to the immediate failed_head_sha. No repaired result may attribute
      integration-carried files as new mutation.
    - >
      FINALIZE_CANDIDATE of a zero-mutation failed EVIDENCE_ONLY remediation must keep HEAD
      exactly at failed_head_sha, create no code commit, return a structurally complete TASK
      ResultPackage, and allow Runtime to execute both normal TASK verification and the exact
      preserved remediation affected verification before terminal RESULT.
    - >
      Fail closed if the origin REMEDIATION lineage is missing, malformed, forged,
      mismatched to TASK/revision/finding/reviewed SHA, or conflicts with the validated
      integrated execution base. Do not silently drop affected verification in those cases.
    - >
      Add a production-shaped regression for integrated EVIDENCE_ONLY REMEDIATION ->
      completion-gate head mismatch -> FINALIZE_CANDIDATE REPAIR. Prove the repaired run
      remains zero-mutation, preserves integrated result base, runs the original affected
      verification exactly once in addition to TASK verification, and persists canonical
      evidence bound to the repaired run/head.
    - >
      Add prompt-level regression proving Codex EVIDENCE_ONLY REMEDIATION cannot reasonably
      bind head_sha to reviewed_sha when run.base_sha differs, and existing Antigravity /
      Codex remediation behavior remains compatible.
    - >
      Existing TASK-144 integrated CODE_FIX REMEDIATION -> failed REPAIR -> continuation
      regressions must remain green. No publication, ingress, correction-frontier, or
      integration safety check may be weakened.

acceptance:
  - id: AC1
    condition: >
      Codex REMEDIATION terminal contract explicitly binds result.head_sha to actual final
      Git HEAD, including zero-mutation EVIDENCE_ONLY on an integrated execution base.
  - id: AC2
    condition: >
      REPAIR admission deterministically recovers the exact canonical origin REMEDIATION
      affected_verification without trusting model or carrier prose.
  - id: AC3
    condition: >
      Repair completion for a failed REMEDIATION executes TASK verification plus the exact
      origin affected verification with deterministic de-duplication, while non-REMEDIATION
      repairs remain unchanged.
  - id: AC4
    condition: >
      A production-shaped integrated EVIDENCE_ONLY failure equivalent to RUN-140-012 can
      be FINALIZE_CANDIDATE repaired with unchanged HEAD/result base and Runtime-owned live
      evidence preserved on the repaired run.
  - id: AC5
    condition: >
      Missing, forged, stale, mismatched, or conflicting origin REMEDIATION evidence fails
      closed and cannot inject, suppress, or substitute verification commands.
  - id: AC6
    condition: >
      TASK-144 integrated CODE_FIX remediation-repair semantics, existing repair actions,
      Authoring Ingress DELTA lineage, and Publisher validation remain compatible.
  - id: AC7
    condition: >
      Focused operator regressions, complete operator tests, full current pytest suite, and
      git diff --check pass with zero unresolved items and changes limited to authorized scope.

verification:
  required:
    - python -m pytest -q tests/test_operator.py -k "evidence_only and (remediation or repair or integrated)"
    - python -m pytest -q tests/test_operator.py -k "repair and remediation"
    - python -m pytest -q tests/test_operator.py
    - python -m pytest -q
    - git diff --check
