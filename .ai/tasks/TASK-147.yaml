task_id: TASK-147
revision: 2

goal: >
  Re-admit the validated TASK-147 implementation on the current canonical main after
  RUN-147-003 was made non-repairable by an unrelated control-checkout HEAD advance
  during Runtime verification, preserving all TASK-147 semantics and the independently
  authored TASK-148 task document.

problem: >
  TASK-147 r1 produced a clean semantic candidate at RUN-147-001 and two narrow
  test-only repairs. RUN-147-002 candidate 924fc7f4c3537eba2ca651eab800324227021e70
  contains the intended production implementation and the Windows verification-argv
  portability correction. Its two focused verification commands passed, while the
  complete operator suite exposed only two new YAML fixture typing defects where an
  all-numeric fake SHA was decoded as an integer. REPAIR-147-002 was then authorized
  to fix only those fixtures.

  During RUN-147-003, Runtime verification ran for about 2306 seconds. While that run
  was active, independent AUTHOR_TASK ingress for TASK-148 advanced canonical main and
  the shared control checkout from e00da88f64b0e2074f0e512fa7e54008fa61352c to
  3edeb3cc430eb2c9e506d148bbf11834986380d3. Runtime correctly failed closed with
  "verification changed Git HEAD"; failed_head_sha became 3edeb3cc..., candidate
  descends_from_base=false, repairable=false, transportable=false. Therefore
  RUN-147-003 cannot be repaired and its local/untransported workspace state must not
  be treated as canonical evidence.

  Revision 2 re-admits the same TASK-147 semantic work on current main. Use the
  canonical RUN-147-002 candidate as implementation evidence, reapply the exact
  outstanding fixture correction independently, and do not recover or depend on
  untransported RUN-147-003 WIP.

assumptions:
  - Canonical main is 3edeb3cc430eb2c9e506d148bbf11834986380d3.
  - The only canonical change from TASK-147 r1 authoring main e00da88f... to current
    main is the added .ai/tasks/TASK-148.yaml task document.
  - TASK-148 has no RUN yet and must remain paused while TASK-147 r2 executes.
  - RUN-147-002 candidate 924fc7f4c3537eba2ca651eab800324227021e70 is clean,
    transportable, and contains the intended TASK-147 production delta plus the
    Windows portability test correction.
  - RUN-147-002 focused TASK-147 verification passed 3/3 and 3/3 before the full
    operator suite exposed only two YAML fixture typing defects.
  - RUN-147-003 is non-repairable and must not be used as a source branch or recovered WIP.
  - TASK-140 remains paused until TASK-147 revision 2 is reviewed and published.

scope:
  inspect:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - src/aios_renew/review.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/authoring_ingress.py
    - src/aios_renew/publication.py
    - tests/test_operator.py
    - .ai/tasks/TASK-148.yaml
    - refs/heads/aios/failure/RUN-147-001
    - refs/heads/aios/failure/RUN-147-002
    - refs/heads/aios/failure-artifacts/RUN-147-003
  modify:
    - src/aios_renew/codex_adapter.py
    - src/aios_renew/operator.py
    - src/aios_renew/runtime.py
    - tests/test_operator.py

non_goals:
  - Rewrite, delete, repair, or synthesize RUN-147-003.
  - Recover untransported RUN-147-003 workspace state.
  - Modify or implement TASK-148, its task document, or downstream python_complete_agent.
  - Modify TASK-140 code, findings, reviews, remediation, or historical artifacts.
  - Change TASK-144 integrated remediation repair semantics.
  - Remove Runtime verification ownership or fail-closed HEAD-change detection.
  - Add task/run-specific exceptions, retries, fallback, or shared-checkout concurrency bypasses.

constraints:
  hard:
    - >
      Port the TASK-147 semantic delta from canonical RUN-147-002 onto current main
      3edeb3cc430eb2c9e506d148bbf11834986380d3. Preserve .ai/tasks/TASK-148.yaml
      exactly and do not reset/cherry-pick in a way that discards current-main content.
    - >
      Preserve Codex REMEDIATION prompt semantics: result.head_sha binds to actual
      final Git HEAD; EVIDENCE_ONLY remains zero-mutation and binds the unchanged
      admitted run.base_sha rather than remediation.reviewed_sha.
    - >
      Preserve exact canonical reconstruction of origin REMEDIATION affected_verification
      for REPAIR and fail closed on missing, malformed, forged, stale, mismatched, or
      conflicting lineage.
    - >
      For a REPAIR originating from REMEDIATION, Runtime must execute the normal TASK
      verification plus the exact origin affected_verification with deterministic
      stable de-duplication. Non-REMEDIATION repairs remain unchanged.
    - >
      Preserve TASK-144 dual-base behavior: integrated result attribution uses the
      validated result base while repair mutation authority stays anchored to the
      immediate failed head.
    - >
      Preserve the Windows-platform-correct production-shaped regression: raw injected
      verification runner argv may be PowerShell-wrapped, while persisted
      Evidence.source.command remains the exact canonical authored command string.
    - >
      Fix the two new YAML fixtures deterministically so reviewed_sha and execution_base
      are parsed as strings, preferably alphabetic hexadecimal fake SHAs such as
      'a' * 40 and 'b' * 40. Do not weaken parse_review typing.
    - >
      Preserve the integrated EVIDENCE_ONLY -> completion-gate head mismatch ->
      FINALIZE_CANDIDATE repair regression, exact evidence run/head binding,
      zero-mutation behavior, verification de-duplication, and no affected_verification
      leakage to Executor payload.
    - >
      Runtime HEAD-drift detection remains strict. Revision 2 must execute serially;
      do not run TASK-148 or another AIOS mutation in the same control checkout while
      TASK-147 Runtime verification is active.

acceptance:
  - id: AC1
    condition: >
      Codex REMEDIATION terminal contract binds result.head_sha to actual final Git HEAD,
      including integrated zero-mutation EVIDENCE_ONLY execution.
  - id: AC2
    condition: >
      REPAIR deterministically recovers exact canonical origin REMEDIATION
      affected_verification without trusting model or carrier prose.
  - id: AC3
    condition: >
      Repair completion runs TASK verification plus exact origin affected verification
      once each after deterministic de-duplication, while ordinary repairs remain unchanged.
  - id: AC4
    condition: >
      Integrated EVIDENCE_ONLY failure can be FINALIZE_CANDIDATE repaired with unchanged
      HEAD/result base and Runtime-owned evidence preserved and correctly bound.
  - id: AC5
    condition: >
      Missing, forged, stale, mismatched, or conflicting origin remediation evidence
      fails closed.
  - id: AC6
    condition: >
      TASK-144 integrated CODE_FIX remediation-repair semantics and current-main TASK-148
      task authoring content remain compatible and unchanged.
  - id: AC7
    condition: >
      All focused TASK-147 tests, complete operator suite, full pytest suite, and
      git diff --check pass with zero unresolved items and changes limited to authorized scope.

verification:
  required:
    - python -m pytest -q tests/test_operator.py -k "evidence_only and (remediation or repair or integrated)"
    - python -m pytest -q tests/test_operator.py -k "repair and remediation"
    - python -m pytest -q tests/test_operator.py
    - python -m pytest -q
    - git diff --check
