task_id: TASK-317
revision: 1
goal: Activate MINIMUM_SUFFICIENT_VERIFICATION_V2 as the single Runtime-owned verification
  architecture that unifies deterministic affected-verification selection, complete
  failure-population preservation, exact base-to-candidate attribution, valid evidence
  reuse, correction-aware narrowing and the existing full-suite integration guard
  without creating a second verification authority.
problem: RUN-316-002 failed during Runtime verification after the selected full suite
  reported 51 failures, but canonical diagnostics retained only 20 failed identities.
  The existing minimum-sufficient-v1 contract mainly normalizes authored command lists
  and Runtime executes those commands without a unified deterministic mechanism for
  preserving the complete failure population, attributing base-versus-candidate failures,
  reusing still-valid verification evidence, or narrowing correction verification
  from exact canonical delta material. This forces Brain to perform manual attribution
  and encourages unnecessary full-suite reruns or overly broad correction scope. The
  verified architecture must remain fail closed, keep raw command results truthful,
  and keep semantic judgment outside Runtime.
assumptions:
- Canonical main at TASK-317 authoring is 875670fec24daafe3f58da64a31c2318ca282545.
- RUN-316-002 remains frozen as motivating verification evidence; no REPAIR-316-002
  is authorized by this TASK.
- minimum-sufficient-v1 remains readable for historical TASK and correction artifacts;
  TASK-317 is a v1 bootstrap TASK and V2 activation is prospective after reviewed
  publication.
- The repository-selected full-suite profile remains an integration safety net when
  the authored verification contract requires it; this TASK does not change Human-selected
  worker policy.
- Runtime may narrow verification only from mechanically provable repository-owned
  material and must fall back to the authored broader verification when narrowing
  cannot be proven.
