task_id: TASK-052
revision: 1

goal: >
  Establish an explicit deterministic Runtime completion boundary for admitted
  AIOS execution and direct-candidate completion. After implementation authority
  has produced a structural candidate state, Runtime must own repository-state
  observation, completion gates, canonical verification, canonical EVIDENCE
  binding, terminal RESULT/FAILURE persistence, bounded operational observation,
  and terminal transport. The Human-facing operator must delegate this Runtime
  responsibility instead of independently reimplementing it across execution
  paths.

problem: >
  TASK-051 successfully separated native Executor dispatch from operator.py, but
  the Human-facing operator still directly performs most deterministic Runtime
  completion work. PRIMARY, REMEDIATION, REPAIR, and Direct Candidate Acceptance
  each contain overlapping responsibility for candidate HEAD/status/diff/scope
  checks, canonical verification, EVIDENCE construction, terminal persistence,
  observation, and transport. Existing helper modules already express Runtime-
  owned primitives, but no explicit coordination boundary owns their lifecycle.
  This leaves operator.py acting as both Human-facing command surface and Runtime
  engine, obscures authority separation, and makes equivalent completion behavior
  harder to preserve without duplication.

assumptions:
  - >
    Current canonical main baseline before TASK-052 authoring is
    2a79b546c68fdc1ce134252006afbd7665bba5f7.
  - >
    TASK-051 is semantically reviewed PASS and published; its thin Dispatcher
    boundary and exactly-one native invocation semantics remain authoritative.
  - >
    TASK-050 Governance Baseline v1.0 remains authoritative.
  - >
    Frozen Kernel v0.1 TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, REPAIR,
    lease, one-active-Executor, and deterministic verification semantics remain
    unchanged.
  - >
    src/aios_renew/verification.py and src/aios_renew/run_observation.py already
    represent deterministic Runtime-owned primitives and should be reused rather
    than duplicated.
  - >
    src/aios_renew/review_transport.py is a subordinate delivery mechanism for
    immutable terminal state; transport mechanics do not gain semantic authority.
  - >
    Direct Candidate Acceptance remains the existing deterministic no-Executor
    CODE_FIX acceptance path and must preserve its current authority and
    idempotence semantics.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-049.yaml
    - .ai/tasks/TASK-051.yaml
    - src/aios_renew/operator.py
    - src/aios_renew/dispatcher.py
    - src/aios_renew/verification.py
    - src/aios_renew/run_observation.py
    - src/aios_renew/review_transport.py
    - src/aios_renew/artifacts.py
    - src/aios_renew/run.py
    - src/aios_renew/review.py
    - tests/test_operator.py
    - tests/test_dispatcher.py
    - tests/test_verification.py
    - tests/test_run_observation.py
    - tests/test_artifacts.py

  modify:
    - src/aios_renew/runtime.py
    - src/aios_renew/operator.py
    - tests/test_runtime.py
    - tests/test_operator.py

non_goals:
  - Refactor the complete operator implementation or redesign all admission logic.
  - Change Human-facing CLI commands, command names, or authorization semantics.
  - Change Executor selection policy or TASK-051 Dispatcher behavior.
  - Change Codex or Antigravity native adapters, native prompts, or harness mechanics.
  - Change frozen TASK, RUN, RESULT, EVIDENCE, REVIEW, REMEDIATION, or REPAIR schemas or semantics.
  - Add intelligent routing, planning, semantic review, model scoring, retry, fallback, reroute, failover, or autonomous recovery.
  - Move Brain or Reviewer semantic judgment into Runtime.
  - Change canonical verification commands or duplicate verification in another layer.
  - Change the meaning of PRIMARY, REMEDIATION, REPAIR, or Direct Candidate Acceptance mutation gates.
  - Change GitHub ref names, publication policy, or post-PASS review authority.
  - Rename or broadly refactor verification.py, run_observation.py, review_transport.py, artifacts.py, or run.py.
  - Perform README, version-authority, export-surface, package, or general repository cleanup.
  - Delete historical TASKs, frozen specifications, smoke harnesses, or canonical evidence.
  - Push from executor execution.

constraints:
  hard:
    - >
      Runtime completion receives already-admitted execution state or an already-
      authorized Direct Candidate completion context. It must not create Human
      intent, TASK semantics, review findings, remediation authority, repair
      authority, or Executor-selection authority.
    - >
      TASK-051 remains the only native dispatch boundary. Runtime may coordinate
      around Dispatcher output but must not invoke a second Executor, retry native
      execution, select a fallback, or duplicate native adapter mechanics.
    - >
      Structural Executor output remains non-canonical until deterministic Runtime
      repository gates and canonical verification succeed. Runtime, not Executor
      or operator, binds canonical verification EVIDENCE to the accepted result.
    - >
      Runtime must preserve operation-specific mutation truth: PRIMARY scope and
      HEAD requirements, REMEDIATION affected-scope semantics, REPAIR CODE_FIX and
      NO_CHANGE semantics, and Direct Candidate committed-delta rules remain
      observably unchanged.
    - >
      Canonical verification commands must execute at most once per admitted
      completion attempt in their existing required order. Operator must not run
      the same canonical verification again after delegating completion to Runtime.
    - >
      Repository HEAD, cleanliness, committed changed-files, scope, descendant,
      post-verification state, structural/canonical ResultPackage validity, and
      other existing deterministic completion gates must remain fail-closed.
    - >
      Existing failure taxonomy must remain intact. Pre-RUN admission failure is
      not a RUN failure; admitted execution/completion/verification failure remains
      a RUN FAILURE; successful RESULT persistence followed by transport failure
      must not be rewritten as an execution failure.
    - >
      RESULT, FAILURE, RUN_OBSERVATION, REPAIR lineage attachment, retry-transport,
      and post-PASS transport remain immutable and attributable to the same RUN and
      subject SHA as before. Operational observation remains subordinate and may
      never replace RESULT or FAILURE truth.
    - >
      Direct Candidate Acceptance must still invoke no Executor. Its existing
      idempotence, reviewed-SHA ancestry, modification-scope, affected-verification,
      and terminal transport behavior must remain unchanged while using the same
      Runtime completion authority where applicable.
    - >
      The Human-facing operator must materially reduce duplicated Runtime
      completion responsibility. Adding runtime.py as a forwarding facade while
      leaving independent verification/evidence/terminalization authority in
      operator.py does not satisfy this TASK.
    - >
      Runtime must remain deterministic coordination software. It must not infer
      whether acceptance criteria are semantically satisfied, rewrite claims,
      create review findings, choose a repair, or perform Reviewer reasoning.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      A distinct Runtime completion boundary exists between admitted candidate
      production and terminal canonical RESULT/FAILURE handling.
  - id: AC2
    condition: >
      PRIMARY completion delegates deterministic repository gates, canonical
      verification, EVIDENCE binding, RESULT persistence, observation, and
      terminal transport to the Runtime boundary without changing observable
      TASK-051 Dispatcher or lease behavior.
  - id: AC3
    condition: >
      REMEDIATION and REPAIR completion use the same Runtime authority while
      preserving their existing operation-specific mutation scope, verification,
      lineage, and fail-closed semantics.
  - id: AC4
    condition: >
      Direct Candidate Acceptance preserves its no-Executor and idempotent
      semantics while canonical verification, EVIDENCE, and terminal completion
      are owned by the Runtime boundary rather than duplicated in operator.py.
  - id: AC5
    condition: >
      Runtime executes each canonical verification command no more than once per
      completion attempt, in the existing required order, and canonical EVIDENCE
      remains bound to the exact accepted subject SHA.
  - id: AC6
    condition: >
      Existing RESULT versus FAILURE classification, failure-phase attribution,
      transport retry behavior, immutable lineage, and subordinate observation
      behavior remain observably unchanged.
  - id: AC7
    condition: >
      operator.py no longer owns a duplicate independent path for canonical
      verification, canonical EVIDENCE construction, or terminal RESULT/FAILURE
      completion after delegation to Runtime.
  - id: AC8
    condition: >
      Runtime has no semantic review, Executor-selection, retry, fallback,
      reroute, publication-decision, or implementation authority.
  - id: AC9
    condition: >
      Deterministic regression tests prove shared Runtime completion behavior for
      PRIMARY, REMEDIATION, REPAIR, and Direct Candidate paths, including success,
      verification failure, completion-gate failure, and transport-after-RESULT
      behavior, without locking one internal function decomposition.
  - id: AC10
    condition: >
      Frozen Kernel contracts, TASK-049 native-role separation, TASK-051 thin
      Dispatcher semantics, Human-facing command behavior, and canonical
      publication/review authority remain unchanged.

verification:
  required:
    - python -m pytest tests/test_runtime.py tests/test_operator.py tests/test_dispatcher.py tests/test_verification.py tests/test_run_observation.py tests/test_artifacts.py -q
    - git diff --check
