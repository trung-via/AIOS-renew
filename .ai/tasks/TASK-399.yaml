task_id: TASK-399
revision: 1
goal: Implement and activate one bounded unresolved-ResultPackage diagnostic handoff
  inside the existing admitted-RUN FAILURE flow, so authorized Brain/Executor consumers
  can use exact source-bound non-PASS facts without exporting private data, changing
  completion semantics or creating a second authority; prospectively canonicalize
  Human's 2026-10-22 immediate priority over conditional post-G1 Publisher residual
  work while preserving unfinished Lean VP.
problem: Canonical RUN-398-004, TASK-398 r1, failed at COMPLETION_GATE with safe_detail.cause=UNRESOLVED_ITEMS,
  but public FAILURE omits unresolved_count and an immutable staging-ResultPackage
  digest and Brain Sync exposes no useful authenticated diagnostic. Runtime already
  stores staging/<RUN>.json and may copy private executor_diagnostics.unresolved into
  private FAILURE; public projection strips it, and missing/malformed staging can
  collapse to None. Human cannot distinguish source unavailable, sensitive withheld,
  incomplete implementation, doc/test inconsistency, contract disagreement and missing
  proof. TASK-393 P0 and TASK-394 P1 cover pytest FAILURE identities/pages, not these
  executor unresolved declarations.
assumptions:
- Canonical main at exact authoring observation is 8fc9ef2784b7781c287d760ec4597ab203052768;
  Runtime must independently reauthenticate main, TASK identity/revision, clean state,
  reservation, provenance and main CAS on ingress, and must not infer publication
  solely from a Git ref.
- Observed immutable RUN-398-004 public FAILURE is under aios/failure-artifacts/RUN-398-004
  at 70fec2ab3f681f51c3bdfa40f51bcba50fa33852; failed head is 2e97623c2ac283e151ffdc41485a90b8df14b19d,
  private_failure_digest is b2e60c61f1d6885802e68c81612355445b290c936754f7eda6faba77b17b0455,
  phase COMPLETION_GATE, cause UNRESOLVED_ITEMS. Exact historical staging byte digest
  is not available in that public terminal and must not be fabricated.
- Current runtime.py _complete stages structural ResultPackage before completion gates
  when policy enables staging; persist_failure obtains a private unresolved list from
  _read_staged_executor_unresolved; review_transport.py safe_failure_detail recognizes
  UNRESOLVED_ITEMS and public projection excludes executor_diagnostics. Check exact
  caller and validator API before edits.
- TASK-393 r3 and TASK-394 r1 are prior source-published P0/P1 safe FAILURE detail
  and paging; reuse their authorized existing transport, self-host owner-gated reads,
  terminal attention and Brain Sync. Do not replace verification paging or raise private
  capture budgets.
- Human explicitly authorizes implementing and activating this scoped new work now
  as priority before conditional Publisher G2, not rewriting TASK-398, retroactively
  repairing RUN-398-004 or retiring outstanding Lean VP L3-05/L3-06/G3/G6/L4. Reconcile
  sole planning NEXT prospectively in the same Task under reviewed publication.
- AOA-1 architecture candidate selects minimal extension B over no-build A and separate
  service C. Prospective TASK_AUTHORING uses TCA-2 v2; this final contract carries
  no audited_handoff. New identity uses LEGACY_REPOSITORY_DEFAULT_ROUTE with no origin_authoring_proof.
- Human has not selected a coding Executor/model/effort for TASK-399 in this authoring
  request. AUTHOR_TASK ingress is not EXECUTOR delegation; future primary admission
  independently requires explicit Human selection and Runtime authority.
