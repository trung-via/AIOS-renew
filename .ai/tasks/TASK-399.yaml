non_goals:
- No new DB, standalone diagnostic service, generic router, automatic repair selector,
  replay/retry/failover controller, second verifier/Reviewer/Publisher, autonomous
  Executor choice or mutation authority.
- No raw unresolved strings, native stdout/stderr, credentials, user/private filesystem
  paths, stack traces, native model responses, or arbitrary free text in public FAILURE,
  portable Brain context, Issue or safe diagnostic output.
- No retroactive update/backfill of RUN-398-004 or any historical private/public FAILURE,
  staging, TASK/RUN/RESULT/REVIEW/REPAIR/REMEDIATION object; unavailable historical
  proof stays unavailable.
- No change to Kernel, KA-01, G3/G6, verification policy, pytest FAILURE pages from
  TASK-393/394, G1 Git guard implementation, conditional G2 execution authorization,
  or downstream adoption pins.
- No broad pytest/full-suite gate, performance benchmark prerequisite, new persistent
  index/cache, or automatic roadmap advancement from lifecycle outcomes.
constraints:
  hard:
  - The original structural ResultPackage may be read only by existing Runtime-owned
    staging/terminal code or authenticated owner-gated self-host control-plane reader.
    Pin exact source bytes with immutable SHA-256 at original terminal write for prospective
    events; bind TASK revision, RUN, expected staged RESULT head SHA, failed candidate
    SHA, canonical private FAILURE digest and stable source/artifact identity. A current
    local staging path alone or user-supplied JSON/hash is never authentication.
  - 'Do not alter the existing incomplete-RESULT rejection: unresolved remains a hard
    COMPLETION_GATE failure, never PASS, despite any diagnostic availability. Preserve
    immutable terminal write and idempotent replay: identical source yields identical
    diagnostic, changed/missing/conflicting source yields typed blocker; do not replace
    original FAILURE.'
  - 'Extend safe_failure_detail/public FAILURE only with versioned backward-compatible
    fixed bounded fields: exact unresolved_count when verified (including zero only
    with genuine source observation), null otherwise; immutable source identity and
    typed availability/blocker. Never fabricate a count, exact staging digest or completeness
    from the legacy RUN-398-004 projected FAILURE.'
  - Existing self-host diagnostic read must validate source size before parsing and
    authenticate original FAILURE/source bindings, with default maximum 16 MiB staged
    input, at most 32 allowlisted semantic anchors per view and maximum 8 KiB portable
    output; larger/malformed/expired/forged/swapped source fails closed with a typed
    non-PASS blocker. Limit CPU/memory, repeat reads and Git fetches; do not silently
    increase existing budgets.
  - Safe anchors may include validated AC ids, in-repository relative doc/test paths,
    allowlisted test identity, opaque item digest and fixed status/type; never forward
    raw unresolved string or arbitrary classification asserted by Executor. Brain
    alone distinguishes implementation gap, doc/test inconsistency, contract conflict
    and evidence deficiency from authenticated facts, retaining UNKNOWN whenever redaction
    prevents discriminating cause.
  - 'Honor authorization: portable Brain Sync/terminal attention receives only public
    allowlisted detail, while full protected source remains in authorized self-host/Executor
    domain. Prevent cross-RUN, stale ref, substituted task/command, source digest
    mismatch, unauthorized reader and paging selector privilege escalation. No command
    execution or correction authorization can follow from read-only selectors.'
  - Preserve public V1/V2 private FAILURE, safe detail V1-V3, legacy direct-call/AST/import
    tests, exact source/metadata owners, existing P0/P1 pagination, privacy, and once-only
    Runtime verification. Scope.inspect grants no edit authority; conflicting protected
    API/tests must be resolved within listed scope.modify or surfaced as blocker,
    never bypassed.
  - The same TASK implementation must reach ordinary production Runtime, safe projection,
    self-host reader, Brain Sync, attention and allowed Executor consumer once its
    own Runtime RESULT, independent Reviewer PASS and exact Publisher publication
    complete. No separate activation TASK or measurement gate; these external proofs
    are not Executor completion claims.
  - Prospectively reconcile one roadmap NEXT for immediate bounded unresolved FAILURE
    handoff, with G1 preserved as historical reviewed/published evidence only where
    independently authenticated, conditional post-G1 G2 deferred pending Human/Brain
    reconciliation, and unfinished Lean VP plan paused-resumable. Preserve past roadmaps/lineage
    and ensure exactly one matching active_track, planning_document, root next_items
    and sequence NEXT. No automatic priority shift on RESULT/REVIEW/PUBLISH.
  - Use minimum-sufficient-v1 focused verification, keep current Executor/Runtime/Reviewer/Publisher
    ownership, return affinity and admission transport intact. Executor edits only
    authorized paths and cannot push/publish.
acceptance:
- id: AC1
  condition: For an admitted structural ResultPackage with unresolved items, original
    prospective terminal FAILURE records one Runtime-derived exact count and SHA-256
    identity of the precisely staged bytes bound to TASK revision, RUN, failed HEAD
    and private FAILURE source; forged, moved or overwritten staging cannot silently
    retain an AVAILABLE diagnosis. Count null/unknown is distinct from proven zero.
- id: AC2
  condition: Public FAILURE and safe_failure_detail have a strictly validated versioned
    backward-compatible non-PASS unresolved summary exposing only fixed cause UNRESOLVED_ITEMS,
    verified count when available, immutable source identity and typed availability/blocker;
    at no point can full unresolved free text/private source escape into public bytes.
- id: AC3
  condition: Existing authorized self-host diagnostic read locates exactly the recorded
    staging ResultPackage, validates run/head/task/structural schema and raw source
    digest under finite byte/CPU and output caps; returns reproducible bounded safe
    anchors or typed SOURCE_MISSING, LEGACY_UNBOUND, SOURCE_MISMATCH, SOURCE_INVALID,
    ACCESS_DENIED or LIMIT_EXHAUSTED blocker without accepting caller-supplied source
    as evidence.
- id: AC4
  condition: For representative unresolved examples referencing missing implementation,
    contradictory docs versus tests, conflicting contract text, and absent evidence,
    the handoff exposes all lawful discriminating AC/test/repository anchors and source
    digests needed for Brain to reason, along with explicit UNKNOWN/withheld limitations
    where source is not safely discriminable; no Runtime semantic verdict or automatic
    repair choice appears.
- id: AC5
  condition: Bounded read-only Brain Sync, failure_context, terminal attention and
    already-authorized Executor readers consume the same canonical source-bound safe
    diagnostic, return no more than 32 anchors and 8 KiB portable output per view,
    and do not create a new RUN, retry, wake, correction, evidence, REVIEW or publication
    authority.
- id: AC6
  condition: Negative regressions reject changed local staging after terminal pin,
    forged/cross-RUN/cross-SHA source, missing/truncated/over-16MiB/malformed source,
    duplicate fields, stale public projection, non-allowlisted paths, secret-bearing
    unresolved strings and unauthorized reads, each with finite non-PASS blocker and
    zero raw leakage.
- id: AC7
  condition: Existing direct public/private FAILURE V1/V2, safe detail V1/V2/V3, TASK-393
    P0 and TASK-394 P1 paging, native Runtime completion and direct API/AST/import
    constraints remain compatible and source-bound. Historical RUN-398-004 stays immutable
    and returns appropriately limited legacy diagnostic without fabricated staged
    digest.
- id: AC8
  condition: New focused end-to-end tests cover terminal staging pin -> FAILURE ->
    public safe detail -> authenticated self-host reader -> Brain Sync/attention and
    Executor permitted view, and assert strict source digest/currentness, cap, privacy,
    idempotence and unchanged complete-RESULT hard rejection. No extra full suite
    is mandatory.
- id: AC9
  condition: Current ordinary production caller paths use the new implementation once
    the exact candidate is source-published under existing Runtime/Reviewer/Publisher
    gates, with no dormant feature flag, separately required cutover Task, implicit
    executor choice, second lifecycle engine or policy change.
- id: AC10
  condition: The same scoped roadmap delta has exactly one current NEXT for immediate
    TASK-399 bounded handoff, leaves conditional Publisher residual G2 not started
    and Lean VP v1.3 paused-resumable, records explicit subsequent Human/Brain reconciliation,
    and preserves all historical G1/TASK-398 and RUN-398-004 identities without rewriting
    them.
