task_id: TASK-375
revision: 1
goal: Restore GitHub Issue ingress by correcting the pre-job GitHub Actions reusable-workflow
  context validation failure introduced in the TASK-372 observation job, and strengthen
  the existing focused workflow regression so the same invalid job-level context cannot
  recur. Do not change Runtime ingress semantics or recovery authority.
problem: 'New Issue ingress carriers for TASK-373 (Issue #2114, Actions run 39091929554)
  and TASK-374 (Issue #2115, Actions run 39093525731) both ended at GitHub workflow
  creation with 0 jobs and no ingress receipt. Canonical main contains jobs.observe-repair-source.env.AIOS_REPAIR_SOURCE_PATH
  using runner.temp, a steps-only GitHub Actions context unavailable at jobs.<job>.env.
  The reusable workflow is referenced from the issue carrier dependency chain; the
  invalid context is a source-grounded candidate explanation for pre-job validation
  failure, although GitHub did not expose a unique parser error. Restore valid workflow
  scheduling through a minimum two-file code/test delta and preserve the Issue transport
  as subordinate to Runtime.'
assumptions:
- Canonical main before TASK authoring is 46c6a787be1b3079de01289fd5fb8a3eb7d829c6;
  Runtime must independently validate actual main, expected SHA, TASK identity, legacy
  authored return affinity, complete verification contract and required mutation reservation/CAS.
- 'This TASK is a Human-approved infrastructure ingress-recovery correction, prospectively
  separate from TASK-373 and TASK-374; neither Issue #2114 nor #2115 created canonical
  TASK or RUN at the time of diagnosis. No old Issue may be silently replayed or relabeled
  as canonical.'
- The problematic jobs.observe-repair-source.env expression appeared in published
  TASK-372 source and is invalid at job-level env. Prior successful Issue workflow
  run 39089965975 had jobs, whereas runs 39091929554/39093525731 had zero jobs; no
  claim is made that this is the only possible workflow validation error.
- The self-host REPAIR execution job remains independent of the read-only observation
  job. Only the two scope.modify files may be changed, and no Executor/model/effort,
  subsequent manual wakeup, Reviewer PASS or publication is delegated by AUTHOR_TASK.
- Brain audit profile is the canonical TCA-1 v1 selected for TASK_AUTHORING from main;
  the exact Human standing prospective affinity choice is LEGACY_REPOSITORY_DEFAULT_ROUTE.
  Local ingestion invokes the existing Runtime carrier-neutral AUTHOR_TASK boundary,
  not an independent mutation path.
scope:
  inspect:
  - docs/AIOS-CONSTITUTION.md
  - docs/CHATGPT_PROJECT_CONTRACT.md
  - docs/AIOS-SELF-HOST-END-TO-END-FLOW-v1.md
  - .ai/roadmap-state.yaml
  - .github/workflows/aios-issue-carrier.yml
  - .github/workflows/aios-brain-ingress.yml
  - .github/workflows/aios-brain-repair-wakeup.yml
  - .github/workflows/aios-self-hosted-repair-wakeup.yml
  - tests/test_github_issue_repair_wakeup_workflow.py
  - tests/test_github_issue_ingress_workflow.py
  - src/aios_renew/github_issue_repair_wakeup.py
  - src/aios_renew/operational_receipt.py
  modify:
  - .github/workflows/aios-self-hosted-repair-wakeup.yml
  - tests/test_github_issue_repair_wakeup_workflow.py
non_goals:
- No direct Git mutation that bypasses Runtime AUTHOR_TASK, no force-push, no new
  TASK carrier/parser/Runtime writer, no new GitHub permission or secret, no production
  lifecycle router and no changes to task/review/publication authority.
- 'No rerun, reissue, redispatch or automatically rebase Issue #2114, Issue #2115
  or any prior RUN/REPAIR. Their transport failures remain historical, with run_created=false;
  subsequent recovery needs fresh canonical source checks.'
- No edits to aios-issue-carrier.yml, aios-brain-ingress.yml, aios-brain-repair-wakeup.yml,
  Python production source, historical TASK/RESULT/FAILURE/REVIEW, roadmap, KA-01,
  downstream or control rulesets.
- No claims of post-publication GitHub Actions scheduling success, Runtime verification
  PASS, Reviewer PASS or Publisher publication before the respective owners produce
  evidence.
constraints:
  hard:
  - Remove the illegal use of runner.temp in jobs.observe-repair-source.env; any runner-dependent
    values must be located at a supported step-level context. Preserve exact attempt-bound
    repair source paths and the existing upload-artifact consumers without changing
    names, execution route or authority.
  - Preserve observer read-only independence from execute-repair, exact GitHub event/source
    identity, if-no-files-found behavior, single-attempt artifacts, failure transparency
    and no new authority for transport observation.
  - Regression coverage must reject an invalid runner.temp expression at job-level
    env for the affected workflow, verify that the observation and artifact steps
    obtain a valid exact path, and preserve existing original REPAIR wakeup validation
    and causal source correlation tests. A YAML parser alone does not validate GitHub
    Actions expression-context legality.
  - Change only the two authorized files. Historical workflow sources and already
    recorded Actions failures must not be rewritten, fabricated, retried or marked
    as canonical RUNs.
  - Use existing minimum-sufficient-v1 direct verification, with only the focused
    workflow test files in authored order. No full suite or new mandatory verifier
    agent is needed; GitHub external workflow validation after later publication is
    separately observed operational proof, not an Executor acceptance claim.
  - Execution HOW belongs to a separately delegated admitted Executor, Runtime owns
    candidate verification/evidence, independent Reviewer decides semantic correctness
    and Publisher alone publishes the exact reviewed source. A local authoring script
    does not grant implementation/publication rights.
acceptance:
- id: AC1
  condition: The GitHub Actions reusable workflow no longer evaluates runner-only
    context at jobs.observe-repair-source.env, and its observer job/step/artifact
    configuration is valid for GitHub workflow compilation and retains the same documented
    source path.
- id: AC2
  condition: The independent read-only observe-repair-source job retains source correlation
    and its two bounded upload-artifact outputs, while execute-repair keeps the original
    self-host labels, provenance, permissions, execution conditions and no new dependency
    on observation.
- id: AC3
  condition: A focused regression test rejects the formerly invalid job-level runner.temp
    expression and asserts the corrected context/path wiring through the actual workflow
    source, without relying on YAML syntactic parsing alone.
- id: AC4
  condition: Focused first-party ingress/repair workflow tests retain existing expected
    behavior and validate reuse of the corrected repair workflow from the canonical
    Issue carrier graph without adding a second ingress path.
- id: AC5
  condition: The implementation changes only the two allowed paths, preserves current
    Runtime/Executor/Reviewer/Publisher authority and leaves historical Issues, TASK/RUN
    lineage, canonical policy, KA-01 and roadmap untouched.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_github_issue_repair_wakeup_workflow.py tests/test_github_issue_ingress_workflow.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
