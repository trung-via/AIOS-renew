task_id: TASK-067
revision: 1

goal: >
  Make remote `--finding` remediation resolution bind candidate lineages to the exact
  current TASK identity and revision before unrelated canonical remediation history can
  influence admission, so local finding identifiers such as F1/F2 remain safely reusable
  across TASKs without historical cross-TASK collisions blocking a valid remediation.
  Preserve fail-closed handling for malformed or ambiguous lineages that actually belong
  to the requested TASK revision, and preserve all existing REMEDIATION, Runtime,
  Executor, verification, and publication authority boundaries.

problem: >
  Real TASK-066 remediation exposed a deterministic operator defect. Running
  `aios remediate TASK-066 --finding F1 --executor antigravity` failed before RUN
  admission with `executor_invoked=false` because remote lineage discovery first queried
  every `aios/remediation/*-F1` ref repository-wide. Historical
  `aios/remediation/RUN-041-002-F1`, which belongs to another TASK and carries an older
  branch layout containing more than one REVIEW document, was structurally rejected
  before the operator could filter it out by TASK identity. Explicit REVIEW/REMEDIATION
  artifact mode could continue TASK-066, proving the requested current lineage itself
  was usable, but the normal Human-facing `--finding` surface remains vulnerable to any
  unrelated historical branch sharing the same local finding id. Finding ids are local
  review identifiers, not a repository-global namespace; deterministic identity binding
  must therefore precede structural rejection of unrelated lineages while still failing
  closed on relevant corruption or ambiguity.

assumptions:
  - >
    Canonical AIOS-renew main immediately before TASK-067 authoring is
    e43964f9898d4293b549650cd2616ed83a143d73, with TASK-066 semantically reviewed PASS
    and published.
  - >
    The observed TASK-066 F1 admission failure occurred at REMOTE_LINEAGE_RESOLUTION
    before any RUN or Executor invocation; it is an admission defect, not a failed RUN
    and not a TASK-066 remediation finding.
  - >
    Historical branch `aios/remediation/RUN-041-002-F1` is immutable canonical history
    for another TASK and must not be deleted, rewritten, normalized, or treated as
    malformed state that the Human must manually clean up.
  - >
    Current `resolve_remote_remediation_lineages()` discovers candidates by finding-id
    suffix before the operator's `_parse_remote_direct_lineage()` can bind source RUN
    TASK identity/revision. The correction may evolve that deterministic transport/
    operator boundary, but must not move semantic REVIEW authority into transport.
  - >
    Existing explicit artifact remediation mode remains a valid canonical surface and
    is not the defect being redesigned.

scope:
  inspect:
    - docs/AIOS-MANIFESTO.md
    - docs/AIOS-CONSTITUTION.md
    - docs/AIOS-RENEW-KERNEL-v0.1-SPEC.md
    - docs/AIOS-RENEW-KERNEL-v0.1-FREEZE.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS-RENEW-BRAIN-TASK-AUTHORING-CONTRACT.md
    - .ai/tasks/TASK-066.yaml
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - src/aios_renew/review.py
    - tests/test_review_transport.py
    - tests/test_operator.py
  modify:
    - src/aios_renew/review_transport.py
    - src/aios_renew/operator.py
    - tests/test_review_transport.py
    - tests/test_operator.py

non_goals:
  - Make finding ids globally unique or change REVIEW/REMEDIATION schemas.
  - Rename, delete, rewrite, migrate, normalize, or otherwise mutate historical remediation/review/artifact branches.
  - Change TASK-066 implementation, review verdict, publication, or already-published main history.
  - Change explicit REVIEW/REMEDIATION artifact mode semantics.
  - Change REPAIR, direct-candidate acceptance, RESULT/EVIDENCE, publication, or auto-publication semantics.
  - Add retry, fallback, first-valid-wins heuristics, branch cleanup, best-effort corruption skipping for relevant lineage, or autonomous recovery.
  - Add a second Executor, Planner, Reviewer, router, model call, network telemetry request, polling service, or background process.
  - Implement A2 durable dispatch reconciliation, A6 automated remediation wakeup, or any other A-Series milestone.
  - Change downstream repositories or dependency pins.
  - Push from Executor implementation execution.

constraints:
  hard:
    - >
      A `--finding <id>` remediation request is resolved within the exact canonical TASK
      identity and current TASK revision supplied to the operator. A finding id is not a
      repository-global identity and must not make unrelated TASK or revision history a
      candidate for that request.
    - >
      Unrelated canonical remediation refs that share the same finding id must not block,
      alter, or make ambiguous a valid current-TASK/current-revision lineage, including
      when the unrelated ref uses an older structural layout that would be invalid under
      the current resolver's relevant-lineage expectations.
    - >
      Fail-closed behavior is preserved after exact identity binding: a malformed,
      incomplete, identity-conflicting, or structurally invalid lineage attributable to
      the requested TASK revision must be rejected before RUN admission, and the coding
      Executor must not be invoked for that rejected request.
    - >
      If more than one contract-valid lineage remains for the exact requested TASK
      revision and finding id, resolution must remain deterministically ambiguous and
      fail closed. The implementation must not choose the first, newest, lexicographic,
      or otherwise heuristic candidate.
    - >
      Exact source RUN, TASK revision, REVIEW, REMEDIATION, authoritative RESULT, and SHA
      validation remain required for the selected lineage. Narrowing discovery scope is
      not authority to weaken canonical validation after a candidate is identified.
    - >
      The normal valid `--finding` path still admits at most one RUN and invokes at most
      the one already-selected coding Executor. Identity resolution must not add a second
      Executor call, retry, fallback, or duplicated verification.
    - >
      Explicit artifact remediation mode, historical REPAIR recovery, direct-candidate
      acceptance, Runtime-owned canonical verification, correction continuity,
      transport, and publication behavior remain unchanged except for any strictly
      necessary shared deterministic identity helper.
    - >
      Historical repository refs and artifacts are read-only inputs to this correction;
      no test or implementation may depend on deleting or rewriting the observed
      RUN-041-002-F1 branch to make TASK-066-style resolution succeed.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      A deterministic regression reproduces the observed cross-TASK collision: a valid
      remediation lineage for one TASK/revision and an unrelated historical remediation
      ref with the same finding id but structurally incompatible review contents coexist;
      resolving the current TASK by `--finding` ignores the unrelated lineage and reaches
      the exact current canonical lineage instead of failing during remote discovery.
  - id: AC2
    condition: >
      Deterministic regression proves a lineage from another revision of the same TASK is
      not a candidate for the current revision merely because it shares the finding id,
      while exact source RUN/TASK revision binding for the selected lineage remains
      validated.
  - id: AC3
    condition: >
      A malformed or incomplete remediation lineage attributable to the requested exact
      TASK revision still fails closed before RUN admission with no Executor invocation;
      unrelated-lineage tolerance cannot become general corruption skipping.
  - id: AC4
    condition: >
      Two contract-valid candidate lineages for the exact requested TASK revision and
      finding id remain an ambiguity error; no ordering or first-valid heuristic selects
      either candidate.
  - id: AC5
    condition: >
      The ordinary successful `aios remediate <TASK> --finding <id>` path preserves one
      admitted RUN, one selected Executor at most once, exact reviewed-SHA repository
      admission, affected verification, canonical ResultPackage handling, and existing
      correction lineage semantics.
  - id: AC6
    condition: >
      Explicit REVIEW/REMEDIATION artifact mode and historical REPAIR resolution retain
      their existing behavior, and no REVIEW/REMEDIATION/TASK schema, publication
      authority, or historical canonical ref is changed.
  - id: AC7
    condition: >
      The implementation remains a bounded deterministic identity-resolution hardening:
      no retry/fallback, remote branch cleanup, model reasoning, extra Executor,
      autonomous recovery, or unrelated A-Series capability is introduced.

verification:
  required:
    - python -m pytest tests/test_review_transport.py tests/test_operator.py -q
    - git diff --check
