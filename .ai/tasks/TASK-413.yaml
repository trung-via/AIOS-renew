non_goals:
- No new lifecycle router, standalone recovery service, DB, model-selected repair/retry/failover,
  GitHub-side mutation or auto-publishing.
- No accepting shared SHA alone, ignoring base/repair/revision/source checks, erasing
  or rewriting historical refs, fabricating RUN/FAILURE, conflating operational receipt
  with Runtime truth or bypassing admission.
- No direct production CAA-04 edit, TASK-414 verification change, automatic resumption
  of a terminal failed dispatch_id or executor/profile re-selection.
- No hidden Git reset --hard, clean/stash/rebase/cherry-pick, untracked/ignored/dirty-file
  overwrite, forced branch movement outside the existing H1R lock and proof.
- No frozen Kernel, Constitution, roadmap/audit policy or independent Reviewer/Publisher
  mutation; no full pytest suite.
constraints:
  hard:
  - Reuse the existing _reconcile_primary_divergence and _prove_primary_failure_group
    on the single Runtime PRIMARY pre-RUN mutation authority. Replace uniform-identity
    equality only with a CLOSED, deterministic, authenticated group-versus-chain proof
    selector, derived from the complete canonical FAILURE/REPAIR lineage and immutable
    refs; no generic router or automatic strategy selector based on heuristic prose.
  - First independently validate every candidate at local HEAD with prove_remote_failed_candidate,
    byte-exact run/failure/task/repair artifact identity, unique per-run digest and
    artifact, exact TASK id/revision/source at its *own root/execution base*, executor/affinity,
    candidate SHA and current transport refs. Never infer predecessor from run numbering;
    parse exact permitted predecessor/continuation/repair bindings using existing
    Runtime validators.
  - Group is eligible if either the TASK-413 r1 same-identity proof remains exact,
    OR all members form one single source-authenticated linear REPAIR continuation
    closure with one proven root, exact failure-to-repair authorizations, no duplicate,
    disconnected, ambiguous, cycle, fork, cross-revision or cross-task links. Intermediate
    execution bases may differ and remain exact; successful source corrections must
    form ordered ancestry, while zero-delta FINALIZE/CONTINUE phases must not require
    fabricated commits.
  - Repair chain proof must bind root TASK revision and original source bytes, immutable
    original failure and per-run repair authorization source SHA, each continuation
    pointer, transition base=head relationship appropriate to that exact correction
    kind, final common failed candidate HEAD and complete local-only Git ancestor
    coverage. Every old local-only commit must be preserved by a canonical exact source
    candidate/terminal artifact; source/base divergence not justified by proven succession
    must fail closed.
  - 'Prove the concrete TASK-414 case: RUN-414-001 at head 6426570c789388ac9bebce428ce1e705fd29b909
    and RUN-414-002..006 at head e08bfec8d683ec6f4ec6c6d39209eb949662513f form one
    committed chain from canonical main c368e54b0c8a50a9c66316d7a3a56cc7be27b5cd,
    not a homogeneous same-head alias. Reconstruct exact validated refs/objects in
    isolated real-Git fixtures without reading live private logs or mutating production;
    allow PRIMARY from exact clean divergent local head to current canonical TASK-414
    r2 main 7e090c91c396fbc67ef12c57a3dcdda2c89e9471 only after same transaction proof.
    Canonical source HEAD and fixture refs must be independently authenticated, never
    copied as fixture PASS claims.'
  - 'Retain legacy positive H1R families TASK-257/264/270/361 and TASK-413 r1 six-compatible-proof
    group. Required negatives: fake/stale missing continuation, invalid authorization
    SHA, wrong rev/source, same HEAD but independent root, fork/cycle/disconnected,
    extra unpreserved local commit, mixed REVIEW/FAILURE, artifact/digest alias, moved
    refs, incorrect root or execution base, changed HEAD, hostile origin/upstream,
    dirty/ignored/case-insensitive collision, submodule, lock, generation restart,
    terminal dispatch replay.'
  - At mutation edge under existing RepositoryLock, reauthenticate canonical origin/main
    SHA, preservation closure refs full membership and values, candidate and all local-only
    commits, TASK source, upstream binding, clean index/worktree/hidden tracked and
    ignored/submodule safety; reread immediately before a single permitted guarded
    exact-target reset. No new Git-reset authority or reliance on HEAD alone. On any
    uncertainty return a source-specific bounded blocker; run_created=false and executor_invoked=false.
  - Maintain existing admitted PRIMARY dispatch identity, exact task blob/commit,
    Human-selected codex gpt-6-sol/max where provided, execution journal, and safe
    restart. Do not replay terminal rejected delivery; a new explicitly admitted dispatch
    after published fix is required.
  - 'Only five original allowed source files may change: src/aios_renew/operator.py,
    tests/test_operator.py, tests/test_dispatch_reconciliation.py, tests/test_self_hosted_wakeup.py,
    docs/AIOS-SELF-HOST-END-TO-END-FLOW-v1.md. No changes to TASK-414 or inherited
