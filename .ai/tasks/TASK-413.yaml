  Human shell, or adding a lifecycle router.'
problem: Human explicitly requested immediate H1R recovery and definitive correction
  on 2026-10-24 after TASK-413 r1 / RUN-413-001 / REVIEW-413-001 PRIMARY PASS had
  not covered a real supported multi-RUN REPAIR continuation. TASK-414 r1 RUN-414-001
  through -006 created immutable FAILURE refs; RUN-414-002..006 all identify the same
  candidate head e08bfec8d683ec6f4ec6c6d39209eb949662513f but with different legitimate
  exact RUN bases, continuation_of pointers and repair authorization proofs. Canonical
  main is 7e090c91c396fbc67ef12c57a3dcdda2c89e9471 (TASK-414 r2) and self-host PRIMARY
  workflow 40090740925 failed before any RUN or Executor, explicitly 'canonical FAILURE
  preservation has conflicting identity or lineage' inside _prove_primary_failure_group;
  the operational receipt says phase PRIMARY_SYNCHRONIZATION and run_created=false/executor_invoked=false.
  TASK-413 r1's strict all-identity-equal grouping incorrectly treats every authentic
  repair-chain predecessor difference as a fork; fixing by simply dropping equality
  would be unsafe. Revision 2 corrects this missing semantic case matrix inside the
  single existing H1R authority, with explicit hard proof of a linear root/continuation
  chain. TASK-414 r2 remains a separately authorized, blocked TASK; no status is inferred
  or changed by this revision.
