    pytest. Executor claims do not prove Runtime verification.'
acceptance:
- id: AC1
  condition: Runtime H1R accepts exactly one authenticated linear multi-RUN REPAIR
    continuation closure with legitimately different per-attempt bases and repair
    provenance, while retaining TASK-413 r1 homogeneous same-head FAILURE grouping
    unchanged.
- id: AC2
  condition: Exact RUN-414-001..006 lineage fixture reproduces the previous 'conflicting
    identity or lineage' refusal and is now safely recovered to expected clean current
    main, preserving every distinct immutable canonical FAILURE, original candidate
    commit and local-only ancestor.
- id: AC3
  condition: Every member has verified current canonical RUN/FAILURE/REPAIR sources,
    original TASK source/revision/affinity, source digest and immutable predecessor
    pointers; same candidate SHA or numbering alone never grants recovery.
- id: AC4
  condition: Conflicting/forked/missing/disconnected/cross-task/revision/cycle/aliased
    or extra-local-only histories each STOP before mutation; no true conflicting lineage
    silently admitted.
- id: AC5
  condition: Original single-FAILURE, compatible six-FAILURE, reviewed PASS, CHANGES_REQUIRED/BLOCKED,
    equal/behind and safety cases remain PASS with no status or authority change.
- id: AC6
  condition: Exact-source remote/currentness and local worktree/H1R mutation-edge
    checks are revalidated under one lock before one guarded reset; no private user
    content or canonical Git history is lost.
- id: AC7
  condition: The same sticky Executor/profile and dispatch selectors are preserved,
    with no RUN before successful reconciliation; rejected or completed dispatch IDs
    remain non-replayable.
- id: AC8
  condition: Pre-RUN diagnostic clearly distinguishes PROVEN_REPAIR_CHAIN_RECOVERABLE
    from proof conflicting/source unavailable/unsafe worktree as bounded operational
    information, without invented Runtime lifecycle terminals.
- id: AC9
  condition: Real-Git targeted tests prove exact RUN-414 positive and adversarial
    lineage negatives, along with existing self-host contract tests, without broad
    suite or fixture assertions that depend on another task's current NEXT state.
- id: AC10
  condition: Only five originally approved modification paths change. Source candidate
    becomes eligible for independent Runtime verification, semantic Reviewer and Publisher;
    no auto pass/publish is claimed.
