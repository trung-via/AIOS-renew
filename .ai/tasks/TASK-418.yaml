non_goals:
- No G3 PASS or G6 production activation, no automatic C2 implementation, dispatch/retry/failover,
  review or publication; no implicit new native Executor, model, session or lease
  after an interruption.
- No full actionable checkpoint diagnostic implementation in this first bounded slice
  and no reuse of terminal-only PTE-03 as if it could read ACTIVE-RUN checkpoint without
  an authenticated reader. PTE remains information-only for Brain.
- No new database, planner, diagnosis agent, lifecycle router, generic event bus,
  semantic verdict or duplicate Runtime verification; no untrusted raw log/prompt/secret
  forwarding to the provider.
- No alteration of frozen Kernel, immutable existing F_i proof identity/digest or
  TASK-417 CAA pilot contract, no changes to downstream pins, and no full test suite.
- No widening correction support to REPAIR/REMEDIATION production in this first slice;
  those operations remain explicit later G3 conformance duties.
constraints:
  hard:
  - 'Canonicalize exact new Human Lean VP priority prospectively in the existing roadmap:
    one NEXT Lean VP L3-06 native feedback foundation TASK-418 r1, keep former CAA
    NEXT as historical/preserved planning, preserve optional CAA ten-task cohort and
    exact lineage without pretending previously published artifacts are undone. Do
    not auto-advance roadmap on execution, verification or publication.'
  - Provide a bounded, versioned, source-bound native Codex feedback receipt path,
    using an admitted original live invocation and matching Runtime RUN/lease/executor/profile/checkpoint/feedback
    digest. A late, stale, duplicate, forged, wrong-thread, wrong-checkpoint or moved-source
    receipt must be rejected or STOP, not be counted as success.
  - The production adapter must not claim that a LocalAdapter fixture, subprocess
    success, file acknowledgement, detached process or newly spawned Codex session
    proves same-live-native Executor delivery. If supported live Codex transport cannot
    be lawfully established, return an explicit bounded unavailability result without
    unsafe mutation or false completion.
  - Keep immutable factual feedback F_i, authenticated current checkpoint and sealed
    original raw/native evidence under existing Runtime ownership; no raw text, traceback,
    paths or instructions may be smuggled into F_i. The later diagnostic sufficiency
    slice must read exactly this source, not create a second truth store.
  - Keep production C2 disabled under KA-01 NOT_ACTIVATED and distinct G6 Human consent.
    Local native receipt or a preactivation probe grants no C2/G3/G6 right. No change
    to the existing one Runtime canonical verifier, effect fence, ledger/lease, correction
    resource budget or terminal authority.
  - Preserve existing one-shot Codex, Antigravity and correction operations as original
    safe fallback/STOP where the native continuation capability is unavailable. No
    cross-provider/session fallback and no automatic retries.
  - Use minimum-sufficient focused verification of adapter receipt, authentic bindings,
    stop/replay/crash/incorrect subjects and legacy no-op behavior; no full suite,
    no changes that weaken proof or acceptance semantics.
acceptance:
- id: AC1
  condition: A source-bound Human/Brain planning record selects Lean VP L3-06 TASK-418
    r1 as the sole prospective NEXT, preserving CAA pilot eligibility/history, PTE
    information-only policy, former TASK-417 and historical immutable lineage, without
    a second NEXT or automatic roadmap advancement.
- id: AC2
  condition: The Codex native adapter exposes a bounded feedback-consumption capability
    that the existing Runtime can bind to a single live admitted original invocation
    for authenticated F_i, with exact current RUN, checkpoint, feedback identity,
    Executor profile and lease checks, and no new Executor selection.
- id: AC3
  condition: A successful native feedback delivery produces a source-correlated receipt
    that is distinguishable from fixture acknowledgement, detached-file markers and
    mere subprocess completion; inability to prove original live native delivery yields
    a bounded unavailable/STOP outcome.
- id: AC4
  condition: Malformed, stale, substituted, replayed, repeated, cross-RUN, cross-checkpoint,
    wrong-thread, moved-lease and interrupted-native feedback attempts fail closed
    without a new proof execution, implicit retry or mutation authority.
- id: AC5
  condition: Existing Runtime sealed checkpoint and immutable F_i schema/evidence
    remain unchanged; no raw logs, traceback, machine-local paths, secrets or implementation
    directives are added to F_i or untrusted portable native inputs.
- id: AC6
  condition: KA-01 production continuation remains NOT_ACTIVATED, with C2 and correction-operation
    admission not authorized by this native receipt. Legacy one-shot Codex and other
    existing native/correction paths preserve their prior safe behavior.
- id: AC7
  condition: Focused adapter/Runtime tests exercise the authentic native-recipient
    path and negative authority/continuity cases without equating mocked LocalAdapter
    success to proven live Codex deployment; source-bound native-probe absence is
    reported explicitly.
verification:
  policy: minimum-sufficient-v1
  required:
  - python -m pytest -q tests/test_lean_vp_l3_native_codex_handoff.py tests/test_lean_vp_l3_same_executor_continuation.py
    tests/test_lean_vp_l3_admission_budget.py tests/test_codex_adapter.py
return_affinity:
  kind: LEGACY_REPOSITORY_DEFAULT_ROUTE
