task_id: TASK-418
revision: 1
goal: 'Establish the smallest preactivation, Runtime-bound native Codex feedback delivery
  and receipt capability for Lean VP Intra v1.3 L3-06: the exact admitted live Codex
  Executor can receive an authenticated F_i from the current checkpoint inside its
  existing native invocation without reselecting, respawning or claiming authorization
  to perform production C2. Preserve separate G3 integrated proof and G6 Human activation.'
problem: Runtime already seals K_i and derives bounded immutable F_i, but CodexAdapter.execute
  is currently a blocking one-shot subprocess with no production same-invocation feedback
  callback; existing positive continuation tests use a local cooperative test adapter.
  Consequently F_i preparation is not evidence of real native Executor receipt, and
  no G3 proof or reliable correction loop can be claimed. Establish the native transport
  boundary first; separately address actionable checkpoint diagnostics and full C2
  correction after this bounded foundation.
assumptions:
- The latest inspected canonical main source is cc531fd1e5bcc7034aabdddf41dfe2268da888a6
  on 2026-10-25; Runtime/ingress independently reauthenticate canonical expected-main
  SHA, TASK identity and source.
- Current explicit Human instruction resumes Lean VP Intra as new prospective work
  priority, superseding only the active CAA TASK-417 planning bookmark for NEXT. TASK-417's
  existing ten-future-TASK optional CAA pilot, TASK-415/416, PTE information-only
  policy and immutable lineage remain unchanged; a new TASK can be a pilot cohort
  member under its existing exact policy when eligible.
- KA-01 v1.3 is HUMAN_RATIFIED_PROSPECTIVE_SPEC and NOT_ACTIVATED. Published L3-04
  and L3-05 provide guarded local feedback/budget foundations; L3-06/G3 and separately
  authenticated G6 remain outstanding.
- Codex adapter currently dispatches a single blocking CLI subprocess via _runner(input=...),
  not a proven session-aware native recipient; tests/test_lean_vp_l3_same_executor_continuation.py
  uses LocalAdapter.confirm_local_feedback, not production Codex.
- Only an admitted live Executor owns HOW. Brain authors this executor-neutral TASK;
  no executor/model/effort or per-RUN G6 authorization is established by this authoring
  or by a workflow Issue.
- The earlier AOA-1 architecture comparison favored minimum lawful reuse of F_i/checkpoint
  evidence and existing Runtime boundaries over a new diagnosis agent/router/database.
  Technical feasibility of native Codex interactive transport is still unproved; a
  source-bound inability result is better than a simulated live success.
