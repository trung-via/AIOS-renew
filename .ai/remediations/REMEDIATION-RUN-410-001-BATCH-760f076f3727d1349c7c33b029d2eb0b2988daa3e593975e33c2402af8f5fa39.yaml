constraints:
- Extend the one active CAA v1 planning record to select only CAA-02 / TASK-410 as
  a new explicit Human/Brain NEXT and record exact CAA-01 reviewed-published predecessor
  as an observed engineering fact, not an automatic roadmap transition. Preserve historical
  priority records, paused bookmarks, four sequential packages, CAA-05 conditional
  state and no automatic next.
- Reuse CAA-01 authenticated sealed ExperienceCut, canonical source/ref/revision identity,
  existing provider-neutral MappingBrainProvider/JsonBrainProvider or equivalent lawful
  callable boundary; exported dictionaries, model output, summaries, issuer labels
  and free-form Git text never authenticate themselves. No second lifecycle reader/truth
  store or independent Git authority.
- Offer sufficient *safe semantic context* for useful mechanism-level reasoning (goal/invariant/acceptance/scope/affected
  consumers/verification only to the extent authenticated and permitted). Derive directly
  from eligible canonical TASK/source, bind citations to exact source pointer/SHA
  and snapshot. Do not leak credentials, protected diagnostic raw text, private paths
  or arbitrary user-provided instructions; unsupported feature remains UNKNOWN instead
  of guessed.
- Reproduce an as-of-bound/retrospective input without future FAILURE, REPAIR, REVIEW
  or publication leakage; history used as an analogy cannot become current normative
  policy. Preserve non-exportability of sealed cuts, fail contained on moved, forged,
  unavailable or inconsistent source. Use bounded source/episode/byte/depth/time and
  provider call/response budgets, no hidden loops/retries/failover.
- Retrieve and compare exact/structured and lexical signals against a model-assisted
  semantic analogy option, selecting relevant positive, negative and disanalogous
  cases where present. Never equate shared test name, success after correction or
  lexical similarity with proven cause. Keep model invocation minimal and optional
  for comparative measurement; no required five-model-call pipeline.
- Each recommended improvement (max 3) has exact evidence pointers supporting source
  facts, explanation of shared mechanism, decisive dissimilarity/applicability, testable
  expected effect, falsifier and calibrated OBSERVED/INFERRED/UNKNOWN distinction.
  Novel advice is hypothetical, not canonical engineering truth. Model citations must
  be validated independently of the model; mere well-formed citations do not prove
  semantic support.
- Support NO_MATERIAL_ADVICE, INSUFFICIENT_GROUNDED_EVIDENCE and UNAVAILABLE as truthful
  bounded non-blocking consultation outcomes, including inaccessible/contradictory/low-value
  sources. Existing genuine canonical auth/currentness/admission requirements remain
  enforceable and cannot be bypassed by advisory degradation.
- Treat malicious instructions embedded in TASK descriptions, source episodes and
  provider responses strictly as untrusted data; CAA output cannot invoke tools, alter
  task scope, select CODE_FIX, choose Executor, perform review/publish, approve Human
  risk or authorize Runtime actions.
- Provide a deterministic read-only evaluation fixture and blind pre-author source-cut
  comparative tests for A1 structured/lexical-only vs B1 causal advisory under controlled
  inputs, with positive/failure/disanalogy/counterexample/abstain/false-source/prompt-injection/stale-policy/future-leakage
  cases. Report observable source grounding and cost/availability when measured, with
  unmeasured outcomes UNKNOWN. No retrospective hindsight or self-rated uplift claim.
- Ensure output is JSON-compatible, bounded and provider-neutral across existing mapping/JSON
  adapters with negative malformed-response cases; do not claim live GPT/Claude/Gemini
  equivalence from simulation. Existing direct authoring, AOA soft default and exact
  Human-on-demand TCA/ROA/MOA policy and CAA-01 protections remain unchanged.
- Only seven enumerated scope.modify paths may change. A committed clean Executor
  candidate must return truthful claimable AC1..AC10 evidence, while Runtime alone
  performs authored minimum-sufficient-v1 verification and independent Reviewer/Publisher
  own their stages. No full suite or source mutation outside approved paths.
action: CODE_FIX
