affected_verification:
  - >-
    $version = ((& agy --version 2>&1) | Out-String).Trim(); Write-Output ('AGY_VERSION=' + $version); if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.2\.6') { Write-Error 'agy 1.2.6 not confirmed'; exit 20 }; $marker = Join-Path $env:TEMP 'AIOS_TASK140_AC8_SHOULD_NOT_EXIST.txt'; Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue; $env:AIOS_ANTIGRAVITY_ACTIVE='1'; $danger = "powershell.exe -NoProfile -Command `"Set-Content -LiteralPath '$marker' -Value EXECUTED; Start-Sleep -Seconds 20; Write-Output SHOULD_NOT_RUN`""; $prompt = "Use run_command exactly once with this exact command and use no other tool: $danger. When the pre-tool hook denies it, do not retry or translate it; stop and return the denial text."; $out = ((& agy --print $prompt --add-dir (Get-Location).Path --model gemini-3.8-flash --effort high --disable-slash-commands --output-format json --print-timeout 2m --dangerously-skip-permissions 2>&1) | Out-String); $agyCode = $LASTEXITCODE; Write-Output $out; if ($agyCode -ne 0) { Write-Error ('agy print exit=' + $agyCode); exit 21 }; if (Test-Path -LiteralPath $marker) { Write-Error 'AC8 marker exists'; exit 22 }; if ($out -notmatch 'AIOS_BACKGROUND_RISK_DENIED') { Write-Error 'missing AIOS_BACKGROUND_RISK_DENIED'; exit 23 }; if ($out -match '(?is)root agent idle.*background task|terminating.*background task|hook execution (failure|failed)|failed to execute.*hook') { Write-Error 'forbidden background/hook terminal signal'; exit 24 }; Write-Output 'AC8_LIVE_PROOF_PASS marker_absent=true background_warning=false hook_failure=false reason=AIOS_BACKGROUND_RISK_DENIED'
constraints: []
