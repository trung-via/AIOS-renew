name: AIOS self-hosted REPAIR wakeup

on:
  workflow_dispatch:
    inputs:
      repair_dispatch_id:
        description: "Stable immutable REPAIR delivery identity"
        required: true
        type: string
      failed_run_id:
        description: "Exact canonical failed RUN"
        required: true
        type: string
      repair_sha:
        description: "Exact current canonical REPAIR authorization SHA"
        required: true
        type: string
      executor:
        description: "Human-selected coding Executor; leave empty for NO_CHANGE"
        required: false
        type: string
  workflow_call:
    inputs:
      repair_dispatch_id:
        required: true
        type: string
      failed_run_id:
        required: true
        type: string
      repair_sha:
        required: true
        type: string
      executor:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: aios-self-hosted-repair-wakeup
  cancel-in-progress: false

jobs:
  execute-repair:
    runs-on: [self-hosted, windows, x64, aios-renew]
    env:
      AIOS_REPO_ROOT: ${{ vars.AIOS_REPO_ROOT }}
      AIOS_REPAIR_DISPATCH_ID: ${{ inputs.repair_dispatch_id }}
      AIOS_FAILED_RUN_ID: ${{ inputs.failed_run_id }}
      AIOS_REPAIR_SHA: ${{ inputs.repair_sha }}
      AIOS_EXECUTOR: ${{ inputs.executor }}
    steps:
      - name: Preflight persistent environment
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-operational-receipt-v2.json
        shell: powershell
        run: |
          function Write-OperationalFailure([string]$Reason) {
            if ([string]::IsNullOrWhiteSpace($env:AIOS_OPERATIONAL_RECEIPT_PATH)) { return }
            if ($env:AIOS_REPAIR_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') { return }
            $selectors = @{}
            if ($env:AIOS_FAILED_RUN_ID -match '^RUN-[A-Za-z0-9_-]+-[0-9]{3,}$') { $selectors.failed_run_id = $env:AIOS_FAILED_RUN_ID }
            if ($env:AIOS_REPAIR_SHA -match '^[0-9a-f]{40}$') { $selectors.repair_sha = $env:AIOS_REPAIR_SHA }
            if ($env:AIOS_EXECUTOR -in @('codex', 'antigravity')) { $selectors.executor = $env:AIOS_EXECUTOR }
            $receipt = [ordered]@{format='AIOS_OPERATIONAL_RECEIPT';version=2;kind='OPERATIONAL_RECEIPT';family='REPAIR';delivery=@{kind='repair_dispatch_id';id=$env:AIOS_REPAIR_DISPATCH_ID};boundary='OPERATIONAL_FAILED';selectors=$selectors;run_created=$false;executor_invoked=$false;cause=@{authority='WORKFLOW';phase='PRE_AIOS';reason_code=$Reason}}
            Set-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Value ($receipt | ConvertTo-Json -Compress -Depth 5) -Encoding utf8
          }
          if ($env:GITHUB_REPOSITORY -ne 'trung-via/AIOS-renew') {
            Write-OperationalFailure 'UNEXPECTED_REPOSITORY_IDENTITY'
            Write-Error "Unexpected repository identity."
            exit 1
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-OperationalFailure 'NONCANONICAL_WORKFLOW_REF'
            Write-Error "REPAIR wakeup must execute from canonical main."
            exit 1
          }
          if ($env:GITHUB_ACTOR -ne 'trung-via') {
            Write-OperationalFailure 'UNAUTHORIZED_DELIVERY_ACTOR'
            Write-Error "Unauthorized REPAIR delivery actor."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:AIOS_REPO_ROOT)) {
            Write-OperationalFailure 'AIOS_REPO_ROOT_NOT_CONFIGURED'
            Write-Error "AIOS_REPO_ROOT repository variable is not configured."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:AIOS_REPO_ROOT -PathType Container)) {
            Write-OperationalFailure 'CONFIGURED_REPOSITORY_UNAVAILABLE'
            Write-Error "The configured persistent repository is unavailable."
            exit 1
          }
          git -C $env:AIOS_REPO_ROOT rev-parse --is-inside-work-tree
          if ($LASTEXITCODE -ne 0) {
            Write-OperationalFailure 'CONFIGURED_REPOSITORY_INVALID'
            Write-Error "The configured persistent repository is invalid."
            exit 1
          }
          if (-not (Get-Command aios -ErrorAction SilentlyContinue)) {
            Write-OperationalFailure 'AIOS_COMMAND_UNAVAILABLE'
            Write-Error "The bounded AIOS command is unavailable."
            exit 1
          }

      - name: Deliver one immutable REPAIR intent
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-operational-receipt-v2.json
          AIOS_REPAIR_DISPATCH_ID: ${{ inputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ inputs.repair_sha }}
          AIOS_EXECUTOR: ${{ inputs.executor }}
        shell: powershell
        run: |
          function Write-OperationalState([string]$Boundary, [string]$Reason) {
            if ([string]::IsNullOrWhiteSpace($env:AIOS_OPERATIONAL_RECEIPT_PATH)) { return }
            if ($env:AIOS_REPAIR_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') { return }
            $selectors = @{}
            if ($env:AIOS_FAILED_RUN_ID -match '^RUN-[A-Za-z0-9_-]+-[0-9]{3,}$') { $selectors.failed_run_id = $env:AIOS_FAILED_RUN_ID }
            if ($env:AIOS_REPAIR_SHA -match '^[0-9a-f]{40}$') { $selectors.repair_sha = $env:AIOS_REPAIR_SHA }
            if ($env:AIOS_EXECUTOR -in @('codex', 'antigravity')) { $selectors.executor = $env:AIOS_EXECUTOR }
            $receipt = [ordered]@{format='AIOS_OPERATIONAL_RECEIPT';version=2;kind='OPERATIONAL_RECEIPT';family='REPAIR';delivery=@{kind='repair_dispatch_id';id=$env:AIOS_REPAIR_DISPATCH_ID};boundary=$Boundary;selectors=$selectors;run_created=$false;executor_invoked=$false}
            if ($Reason) { $receipt.cause = @{authority='WORKFLOW';phase='PRE_AIOS';reason_code=$Reason} }
            Set-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Value ($receipt | ConvertTo-Json -Compress -Depth 5) -Encoding utf8
          }
          if ($env:AIOS_REPAIR_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid REPAIR dispatch identity."
            exit 1
          }
          if ($env:AIOS_FAILED_RUN_ID -notmatch '^RUN-[A-Za-z0-9_-]+-[0-9]{3,}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid failed RUN identity."
            exit 1
          }
          if ($env:AIOS_REPAIR_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid REPAIR authorization SHA."
            exit 1
          }
          if (-not [string]::IsNullOrEmpty($env:AIOS_EXECUTOR) -and $env:AIOS_EXECUTOR -notin @('codex', 'antigravity')) {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Unsupported coding Executor."
            exit 1
          }
          $executorArgs = @()
          if (-not [string]::IsNullOrEmpty($env:AIOS_EXECUTOR)) {
            $executorArgs = @('--executor', $env:AIOS_EXECUTOR)
          }
          Write-OperationalState 'AIOS_INVOKED' ''
          aios repair-wakeup $env:AIOS_REPAIR_DISPATCH_ID $env:AIOS_FAILED_RUN_ID $env:AIOS_REPAIR_SHA @executorArgs --repo $env:AIOS_REPO_ROOT
          $aiosExitCode = $LASTEXITCODE
          if ($aiosExitCode -ne 0) {
            exit $aiosExitCode
          }

      - name: Expose bounded Operational Receipt v2
        if: always()
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-operational-receipt-v2.json
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -PathType Leaf) {
            $receipt = Get-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Raw
            Write-Output "AIOS_OPERATIONAL_RECEIPT_V2=$receipt"
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $receipt -Encoding utf8
            }
          }

      - name: Persist bounded Operational Receipt v2
        if: always()
        uses: actions/upload-artifact@v4
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-operational-receipt-v2.json
        with:
          name: aios-operational-receipt-v2
          path: ${{ env.AIOS_OPERATIONAL_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
