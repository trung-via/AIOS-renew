name: AIOS local regular chat wake transport

on:
  workflow_call:
    inputs:
      event_id:
        description: Bounded admitted terminal doorbell identity
        required: true
        type: string
      repository:
        description: Fixed repository identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aios-local-chat-wake
  cancel-in-progress: false

jobs:
  deliver:
    # No machine access when the Human gate is absent or false.
    if: >-
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true' &&
      github.repository == 'trung-via/AIOS-renew' &&
      inputs.repository == 'trung-via/AIOS-renew'
    runs-on: [self-hosted, windows, x64, aios-renew]
    timeout-minutes: 5
    steps:
      - name: Check out published transport source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install attach-only transport dependency
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check '.[local-chat-wake]'
          exit $LASTEXITCODE
      - name: Deliver bounded local doorbell
        # AIOS_LOCAL_CHAT_WAKE_CONFIG is inherited from the runner machine.
        # Binding, endpoint and persistent state are never GitHub inputs.
        env:
          AIOS_WAKE_EVENT_ID: ${{ inputs.event_id }}
          AIOS_WAKE_REPOSITORY: ${{ inputs.repository }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --event-id $env:AIOS_WAKE_EVENT_ID --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE
