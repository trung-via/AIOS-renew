name: AIOS local regular chat wake transport

on:
  workflow_run:
    workflows:
      - AIOS Issue carrier entry
      - AIOS self-hosted primary wakeup
      - AIOS self-hosted REPAIR wakeup
      - AIOS approved remediation wakeup
      - AIOS auto-publish reviewed candidate
    types: [completed]
  schedule:
    # Optional best-effort recovery; cron cadence is not a liveness guarantee.
    - cron: '*/5 * * * *'
  workflow_call:
    inputs:
      event_id:
        description: Bounded admitted selector-only attention identity
        required: true
        type: string
      repository:
        description: Fixed repository identity
        required: true
        type: string

permissions:
  contents: read

# Machine-local per-lane locks serialize state. GitHub concurrency would replace
# pending source deliveries and can lose events before durable admission.

jobs:
  project:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'trung-via/AIOS-renew' &&
      github.event.workflow_run.head_repository.full_name == 'trung-via/AIOS-renew' &&
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      events: ${{ steps.project.outputs.events }}
      has_events: ${{ steps.project.outputs.has_events }}
    steps:
      - name: Check out published attention projector
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install published projector
        run: python -m pip install --disable-pip-version-check .
      - name: Reconstruct exact bounded source observations
        id: project
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_SOURCE_RUN: ${{ github.event.workflow_run.id }}
          AIOS_SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python -m aios_renew.brain_attention collect
          --run-id "$AIOS_SOURCE_RUN" --attempt "$AIOS_SOURCE_ATTEMPT"
          --output "$GITHUB_OUTPUT"

  deliver-projected:
    needs: project
    if: >-
      needs.project.outputs.has_events == 'true' &&
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true' &&
      github.repository == 'trung-via/AIOS-renew'
    strategy:
      fail-fast: false
      matrix:
        event_id: ${{ fromJSON(needs.project.outputs.events) }}
    runs-on: [self-hosted, windows, x64, aios-renew]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out published transport source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install attach-only transport dependency
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check '.[local-chat-wake]'
          exit $LASTEXITCODE
      - name: Admit into the existing durable project lane
        id: admit
        env:
          AIOS_WAKE_EVENT_ID: ${{ matrix.event_id }}
          AIOS_WAKE_REPOSITORY: ${{ github.repository }}
          AIOS_LOCAL_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --event-id $env:AIOS_WAKE_EVENT_ID --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE
      - name: Bounded follow-up for admitted lane work
        # The exact admitted event selects the same conversation lane.
        # Intake can persist in the inbox even when the lane lock is held or
        # delivery fails. Drain that existing work after either intake outcome.
        if: ${{ !cancelled() && steps.admit.outcome != 'skipped' }}
        env:
          AIOS_WAKE_REPOSITORY: ${{ github.repository }}
          AIOS_WAKE_LANE_EVENT_ID: ${{ matrix.event_id }}
          AIOS_LOCAL_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --drain --rechecks 2 --interval 15 --lane-event-id $env:AIOS_WAKE_LANE_EVENT_ID --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE

  deliver:
    # No machine access when the Human gate is absent or false.
    if: >-
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true' &&
      github.repository == 'trung-via/AIOS-renew' &&
      inputs.repository == 'trung-via/AIOS-renew'
    runs-on: [self-hosted, windows, x64, aios-renew]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out published transport source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install attach-only transport dependency
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check '.[local-chat-wake]'
          exit $LASTEXITCODE
      - name: Deliver bounded local doorbell
        id: admit
        # AIOS_LOCAL_CHAT_WAKE_CONFIG is inherited from the runner machine.
        # Binding, endpoint and persistent state are never GitHub inputs.
        env:
          AIOS_WAKE_EVENT_ID: ${{ inputs.event_id }}
          AIOS_WAKE_REPOSITORY: ${{ inputs.repository }}
          AIOS_LOCAL_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --event-id $env:AIOS_WAKE_EVENT_ID --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE
      - name: Bounded follow-up for admitted lane work
        if: ${{ !cancelled() && steps.admit.outcome != 'skipped' }}
        env:
          AIOS_WAKE_REPOSITORY: ${{ inputs.repository }}
          AIOS_WAKE_LANE_EVENT_ID: ${{ inputs.event_id }}
          AIOS_LOCAL_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --drain --rechecks 2 --interval 15 --lane-event-id $env:AIOS_WAKE_LANE_EVENT_ID --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE
  recheck:
    # Best-effort fallback only: drains previously admitted machine-local subjects.
    if: >-
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true' &&
      github.repository == 'trung-via/AIOS-renew' &&
      github.event_name == 'schedule'
    runs-on: [self-hosted, windows, x64, aios-renew]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out published transport source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install attach-only transport dependency
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check '.[local-chat-wake]'
          exit $LASTEXITCODE
      - name: Recheck admitted lane work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_WAKE_REPOSITORY: ${{ github.repository }}
          AIOS_LOCAL_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
        shell: powershell
        run: |
          python -m aios_renew.local_chat_wake --drain --compact --rechecks 4 --interval 15 --all-lanes --repository $env:AIOS_WAKE_REPOSITORY
          exit $LASTEXITCODE
