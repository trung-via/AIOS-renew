name: AIOS approved remediation intent

on:
  workflow_dispatch:
    inputs:
      correction_dispatch_id:
        description: "Stable approved correction delivery identity"
        required: true
        type: string
      source_run_id:
        description: "Exact canonical source RUN to approve and remediate"
        required: true
        type: string
      finding_id:
        description: "Exact CHANGES_REQUIRED finding identity"
        required: true
        type: string
      executor:
        description: "Explicit coding Executor for this intent"
        required: true
        type: choice
        options:
          - codex
          - antigravity
  workflow_call:
    inputs:
      correction_dispatch_id:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      finding_id:
        required: true
        type: string
      executor:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aios-approved-remediation-intent
  cancel-in-progress: false

jobs:
  approve-and-wake:
    runs-on: [self-hosted, windows, x64, aios-renew]
    env:
      AIOS_REPO_ROOT: ${{ vars.AIOS_REPO_ROOT }}
    steps:
      - name: Preflight persistent environment
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIOS_REPO_ROOT)) {
            Write-Error "AIOS_REPO_ROOT repository variable is not configured."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:AIOS_REPO_ROOT -PathType Container)) {
            Write-Error "The configured persistent repository is unavailable."
            exit 1
          }
          git -C $env:AIOS_REPO_ROOT rev-parse --is-inside-work-tree
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The configured persistent repository is invalid."
            exit 1
          }
          if (-not (Get-Command aios -ErrorAction SilentlyContinue)) {
            Write-Error "The bounded AIOS command is unavailable."
            exit 1
          }

      - name: Record A3 approval and enter A6 once
        env:
          AIOS_CORRECTION_DISPATCH_ID: ${{ inputs.correction_dispatch_id }}
          AIOS_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AIOS_FINDING_ID: ${{ inputs.finding_id }}
          AIOS_EXECUTOR: ${{ inputs.executor }}
          AIOS_APPROVER: ${{ github.actor }}
        shell: powershell
        run: |
          if ($env:AIOS_CORRECTION_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') {
            Write-Error "Invalid correction dispatch identity."
            exit 1
          }
          if ($env:AIOS_SOURCE_RUN_ID -notmatch '^RUN-[A-Za-z0-9_-]+-[0-9]{3,}$') {
            Write-Error "Invalid source RUN identity."
            exit 1
          }
          if ($env:AIOS_FINDING_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') {
            Write-Error "Invalid finding identity."
            exit 1
          }
          if ($env:AIOS_EXECUTOR -notin @('codex', 'antigravity')) {
            Write-Error "Unsupported coding Executor."
            exit 1
          }
          if ($env:AIOS_APPROVER -notmatch '^[A-Za-z0-9][A-Za-z0-9_\-\[\]]{0,99}$') {
            Write-Error "Invalid trusted approver attribution."
            exit 1
          }
          aios approved-remediation-intent $env:AIOS_CORRECTION_DISPATCH_ID $env:AIOS_SOURCE_RUN_ID $env:AIOS_FINDING_ID --executor $env:AIOS_EXECUTOR --approver $env:AIOS_APPROVER --repo $env:AIOS_REPO_ROOT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
