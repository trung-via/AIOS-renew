name: AIOS Brain wake bridge

# GITHUB_TOKEN Issue/comment mutations suppress Actions re-triggering. The exact
# completed source workflow exports selectors; this central bridge reacquires truth.
on:
  workflow_run:
    workflows:
      - AIOS Brain Issue Ingress
      - AIOS Brain PRIMARY Wakeup Carrier
      - AIOS Brain REPAIR wakeup carrier
      - AIOS terminal attention carrier
      - AIOS auto-publish reviewed candidate
      - AIOS self-hosted primary wakeup
      - AIOS self-hosted REPAIR wakeup
      - AIOS approved remediation wakeup
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  project:
    if: github.repository == 'trung-via/AIOS-renew'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projection: ${{ steps.project.outputs.projection }}
      event_id: ${{ steps.project.outputs.event_id }}
    steps:
      - name: Check out trusted bridge code from canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only the transport parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7'

      - name: Reacquire and project the exact completed workflow source
        id: project
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          AIOS_WAKE_PROJECTION: ${{ runner.temp }}/aios-wake-projection.json
        shell: bash
        run: |
          set -euo pipefail
          python -m aios_renew.brain_wake_bridge --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --repository "$GITHUB_REPOSITORY" --policy .ai/brain-wake-carriers.yaml --output "$AIOS_WAKE_PROJECTION"

          python - <<'PY'
          import json, os
          from pathlib import Path
          wake = json.loads(Path(os.environ['AIOS_WAKE_PROJECTION']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('projection=' + json.dumps(wake, separators=(',', ':')) + '\n')
              output.write('event_id=' + wake.get('event_id', '') + '\n')
          PY

  ring:
    needs: project
    if: needs.project.outputs.event_id != ''
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One marker branch: no unrelated event may overtake unresolved PENDING.
    concurrency:
      group: aios-brain-wake-1200
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery code from canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only the transport parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7'

      # Candidate transport only. Autonomous Work wake/ACK requires a separate
      # post-publication probe. Failure returns to Human/Brain architecture review;
      # no credential, comment-trigger or other transport fallback is authorized.
      - name: Deliver the bounded PR head marker through GITHUB_TOKEN
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          AIOS_WAKE_PROJECTION: ${{ needs.project.outputs.projection }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'aios-wake-projection.json').write_text(os.environ['AIOS_WAKE_PROJECTION'], encoding='utf-8')
          PY
          python -m aios_renew.brain_wake_bridge --deliver --projection "$RUNNER_TEMP/aios-wake-projection.json" --repository "$GITHUB_REPOSITORY" --policy .ai/brain-wake-carriers.yaml --output "$RUNNER_TEMP/aios-wake-delivery.json"
