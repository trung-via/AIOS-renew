name: AIOS Brain wake bridge

# GITHUB_TOKEN Issue/comment mutations suppress Actions re-triggering. The exact
# completed source workflow exports selectors; this central bridge reacquires truth.
on:
  workflow_run:
    workflows:
      - AIOS Brain Issue Ingress
      - AIOS Brain PRIMARY Wakeup Carrier
      - AIOS Brain REPAIR wakeup carrier
      - AIOS terminal attention carrier
      - AIOS auto-publish reviewed candidate
      - AIOS self-hosted primary wakeup
      - AIOS self-hosted REPAIR wakeup
      - AIOS approved remediation wakeup
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  project:
    if: github.repository == 'trung-via/AIOS-renew'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projection: ${{ steps.project.outputs.projection }}
      event_id: ${{ steps.project.outputs.event_id }}
    steps:
      - name: Check out trusted bridge code from canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only the transport parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7'

      - name: Reacquire and project the exact completed workflow source
        id: project
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          AIOS_WAKE_PROJECTION: ${{ runner.temp }}/aios-wake-projection.json
        shell: bash
        run: |
          set -euo pipefail
          python -m aios_renew.brain_wake_bridge --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --repository "$GITHUB_REPOSITORY" --policy .ai/brain-wake-carriers.yaml --output "$AIOS_WAKE_PROJECTION"

          python - <<'PY'
          import json, os
          from pathlib import Path
          wake = json.loads(Path(os.environ['AIOS_WAKE_PROJECTION']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('projection=' + json.dumps(wake, separators=(',', ':')) + '\n')
              output.write('event_id=' + wake.get('event_id', '') + '\n')
          PY

  ring:
    needs: project
    if: needs.project.outputs.event_id != ''
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only deliveries of the same deterministic bell share a concurrency group.
    # Rerun/replay or reused terminal Issues therefore cannot race the PR scan.
    concurrency:
      group: aios-brain-wake-1200-${{ needs.project.outputs.event_id }}
      cancel-in-progress: false
    steps:
      - name: Ring the fixed Wake Bus once
        uses: actions/github-script@v7
        env:
          AIOS_WAKE_PROJECTION: ${{ needs.project.outputs.projection }}
        with:
          script: |
            const wake = JSON.parse(process.env.AIOS_WAKE_PROJECTION);
            if (wake.projection === 'NO_WAKE') return;
            if (wake.projection !== 'WAKE' || wake.version !== 1 ||
                wake.repository !== 'trung-via/AIOS-renew' || wake.wake_pr_number !== 1200 ||
                wake.fresh_brain_sync_required !== true || wake.max_comment_bytes !== 2048 ||
                !/^github-v1-[0-9a-f]{64}$/.test(wake.event_id) ||
                typeof wake.body !== 'string' || !wake.body.startsWith('[AIOS BRAIN WAKE]\n') ||
                Buffer.byteLength(wake.body, 'utf8') > wake.max_comment_bytes ||
                wake.body.split('\n').filter(line => line === `event_id: ${wake.event_id}`).length !== 1) {
              throw new Error('Invalid bounded wake projection');
            }
            const target = {owner: 'trung-via', repo: 'AIOS-renew', issue_number: 1200};
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...target, per_page: 100,
            });
            const replay = comments.some(comment => {
              const body = comment.body || '';
              return body.startsWith('[AIOS BRAIN WAKE]\n') &&
                body.split('\n').filter(line => line === `event_id: ${wake.event_id}`).length === 1;
            });
            if (replay) {
              core.info('NOOP: exact wake event_id already exists');
              return;
            }
            await github.rest.issues.createComment({...target, body: wake.body});
