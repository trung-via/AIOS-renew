name: AIOS auto-publish reviewed candidate

on:
  push:
    branches:
      - "aios/review-decision/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: Canonical RUN identity whose existing review decision is replayed
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aios-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current canonical publication control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish or replay exact canonical review decision
        env:
          AIOS_EVENT_NAME: ${{ github.event_name }}
          AIOS_DECISION_REF: ${{ github.ref }}
          AIOS_DECISION_SHA: ${{ github.sha }}
          AIOS_REPLAY_RUN_ID: ${{ inputs.run_id }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          prefix="refs/heads/aios/review-decision/"
          if [[ "$AIOS_EVENT_NAME" == "push" ]]; then
            if [[ "$AIOS_DECISION_REF" != "$prefix"* ]]; then
              echo "Unexpected publication ref: $AIOS_DECISION_REF" >&2
              exit 1
            fi
            run_id="${AIOS_DECISION_REF#"$prefix"}"
            decision_sha="$AIOS_DECISION_SHA"
          else
            run_id="$AIOS_REPLAY_RUN_ID"
            if [[ ! "$run_id" =~ ^RUN-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid replay RUN identity" >&2
              exit 1
            fi
            decision_ref="${prefix}${run_id}"
            mapfile -t decisions < <(git ls-remote --refs origin "$decision_ref")
            if [[ ${#decisions[@]} -ne 1 ]]; then
              echo "Canonical replay decision is missing or ambiguous" >&2
              exit 1
            fi
            read -r decision_sha resolved_ref <<<"${decisions[0]}"
            if [[ "$resolved_ref" != "$decision_ref" || ! "$decision_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Canonical replay decision identity is malformed" >&2
              exit 1
            fi
          fi

          git fetch --no-tags origin refs/heads/main
          control_sha="$(git rev-parse FETCH_HEAD)"
          git checkout --detach "$control_sha"
          python -m aios_renew.publication \
            --repo . \
            --remote origin \
            --run-id "$run_id" \
            --decision-sha "$decision_sha" \
            --control-sha "$control_sha"
