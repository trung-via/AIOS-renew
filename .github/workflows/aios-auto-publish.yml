name: AIOS auto-publish reviewed candidate

on:
  push:
    branches:
      - "aios/review-decision/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: Canonical RUN identity whose existing review decision is published or replayed
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Job serialization supplements the canonical Git reservation shared with
  # durable PASS ingress and TASK authoring; Python owns the exact ref/CAS boundary.
  group: aios-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      event_id: ${{ steps.attention.outputs.event_id }}
    steps:
      - name: Check out current canonical publication control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish or replay exact canonical review decision
        id: publication
        env:
          AIOS_EVENT_NAME: ${{ github.event_name }}
          AIOS_DECISION_REF: ${{ github.ref }}
          AIOS_DECISION_SHA: ${{ github.sha }}
          AIOS_REPLAY_RUN_ID: ${{ inputs.run_id }}
          AIOS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PYTHONPATH: src
          AIOS_PUBLICATION_REPORT: ${{ runner.temp }}/aios-publication-report.json
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
        shell: bash
        run: |
          set -euo pipefail
          prefix="refs/heads/aios/review-decision/"
          if [[ "$AIOS_EVENT_NAME" == "push" ]]; then
            if [[ "$AIOS_DECISION_REF" != "$prefix"* ]]; then
              echo "Unexpected publication ref: $AIOS_DECISION_REF" >&2
              exit 1
            fi
            run_id="${AIOS_DECISION_REF#"$prefix"}"
            decision_sha="$AIOS_DECISION_SHA"
          else
            run_id="$AIOS_REPLAY_RUN_ID"
            if [[ ! "$run_id" =~ ^RUN-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid replay RUN identity" >&2
              exit 1
            fi
            decision_ref="${prefix}${run_id}"
            mapfile -t decisions < <(git ls-remote --refs origin "$decision_ref")
            if [[ ${#decisions[@]} -ne 1 ]]; then
              echo "Canonical replay decision is missing or ambiguous" >&2
              exit 1
            fi
            read -r decision_sha resolved_ref <<<"${decisions[0]}"
            if [[ "$resolved_ref" != "$decision_ref" || ! "$decision_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Canonical replay decision identity is malformed" >&2
              exit 1
            fi
          fi

          # Preserve exact attempt framing before publication can fail. Python
          # owns recovery admission/proof and exact destination selection; this
          # workflow never supplies a verdict, test plan or publication truth.
          printf 'run_id=%s\ndecision_sha=%s\n' "$run_id" "$decision_sha" >> "$GITHUB_OUTPUT"

          # checkout(ref: main) supplies attached main and its upstream. Reject
          # missing/ambiguous authority instead of repairing or replacing it.
          if [[ "$(git symbolic-ref --quiet HEAD)" != "refs/heads/main" ]]; then
            echo "Publication control must be attached to canonical main" >&2
            exit 1
          fi
          mapfile -t upstream_remotes < <(git config --get-all branch.main.remote)
          mapfile -t upstream_refs < <(git config --get-all branch.main.merge)
          if [[ ${#upstream_remotes[@]} -ne 1 || ${#upstream_refs[@]} -ne 1 ||
                "${upstream_remotes[0]:-}" != "origin" ||
                "${upstream_refs[0]:-}" != "refs/heads/main" ||
                "$(git rev-parse --symbolic-full-name '@{upstream}')" != "refs/remotes/origin/main" ]]; then
            echo "Publication control requires exactly one upstream: origin/main" >&2
            exit 1
          fi
          mapfile -t origin_urls < <(git config --get-all remote.origin.url)
          mapfile -t fetch_urls < <(git remote get-url --all origin)
          mapfile -t push_urls < <(git remote get-url --push --all origin)
          if [[ ${#origin_urls[@]} -ne 1 || ${#fetch_urls[@]} -ne 1 || ${#push_urls[@]} -ne 1 ||
                "${origin_urls[0]%.git}" != "${AIOS_REPOSITORY_URL%.git}" ||
                "${fetch_urls[0]%.git}" != "${AIOS_REPOSITORY_URL%.git}" ||
                "${push_urls[0]%.git}" != "${AIOS_REPOSITORY_URL%.git}" ]]; then
            echo "Publication origin must retain the canonical repository fetch/push URL" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Publication control requires a clean main checkout" >&2
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          # This immutable object identity remains independent of the branch
          # name. Only a native fast-forward may align the attached checkout.
          control_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          readonly control_sha
          git merge --ff-only "$control_sha"
          if [[ "$(git rev-parse HEAD)" != "$control_sha" ||
                "$(git rev-parse '@{upstream}')" != "$control_sha" ||
                -n "$(git status --porcelain)" ]]; then
            echo "Publication main and its upstream must equal the exact fetched control SHA" >&2
            exit 1
          fi
          # Runtime still rechecks live main/decision refs, eligibility and CAS.
          python -m aios_renew.publication \
            --repo . \
            --remote origin \
            --run-id "$run_id" \
            --decision-sha "$decision_sha" \
            --control-sha "$control_sha" \
            --recover-clean > "$AIOS_PUBLICATION_REPORT"

      - name: Project canonical review and exact publication attempt
        id: attention-source
        if: always() && steps.publication.outputs.run_id != '' && steps.publication.outputs.decision_sha != ''
        env:
          PYTHONPATH: src
          AIOS_RUN_ID: ${{ steps.publication.outputs.run_id }}
          AIOS_DECISION_SHA: ${{ steps.publication.outputs.decision_sha }}
          AIOS_PUBLICATION_REPORT: ${{ runner.temp }}/aios-publication-report.json
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
        # The shared projector emits only terminal/actionable outcomes;
        # historical INTEGRATION_REQUIRED progress produces no doorbell.
        run: >-
          python -m aios_renew.brain_attention publication
          --run-id "$AIOS_RUN_ID" --decision-sha "$AIOS_DECISION_SHA"
          --report "$AIOS_PUBLICATION_REPORT" --source "$AIOS_ATTENTION_SOURCE_PATH"
          --output "$GITHUB_OUTPUT"

      - name: Export bounded publication attention observations
        id: attention-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-publication-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-publication/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Project one exact identity from the exported publication source
        id: attention
        # Projection/upload failures leave no doorbell, even if publication ran.
        if: >-
          always() &&
          steps.attention-source.outcome == 'success' &&
          steps.attention-source.outputs.source_digest != '' &&
          steps.attention-artifact.outcome == 'success' &&
          steps.attention-artifact.outputs.artifact-id != ''
        env:
          PYTHONPATH: src
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
          AIOS_SOURCE_RUN: ${{ github.run_id }}
          AIOS_SOURCE_ATTEMPT: ${{ github.run_attempt }}
          AIOS_SOURCE_ARTIFACT: ${{ steps.attention-artifact.outputs.artifact-id }}
          AIOS_SOURCE_DIGEST: ${{ steps.attention-source.outputs.source_digest }}
          AIOS_SOURCE_REPOSITORY: ${{ github.repository }}
        run: >-
          python -m aios_renew.brain_attention publication-event
          --source "$AIOS_ATTENTION_SOURCE_PATH" --workflow-run-id "$AIOS_SOURCE_RUN"
          --attempt "$AIOS_SOURCE_ATTEMPT" --artifact-id "$AIOS_SOURCE_ARTIFACT"
          --source-digest "$AIOS_SOURCE_DIGEST" --repository "$AIOS_SOURCE_REPOSITORY"
          --output "$GITHUB_OUTPUT"

      - name: Report Publisher outcome and separate chat delivery
        id: publication-status
        if: always()
        continue-on-error: true
        env:
          AIOS_PUBLICATION_REPORT: ${{ runner.temp }}/aios-publication-report.json
          AIOS_PUBLICATION_STEP_OUTCOME: ${{ steps.publication.outcome }}
          AIOS_CHAT_WAKE_ENABLED: ${{ vars.AIOS_LOCAL_CHAT_WAKE_ENABLED }}
          AIOS_REPOSITORY: ${{ github.repository }}
          AIOS_SERVER_URL: ${{ github.server_url }}
        shell: bash
        # The existing local-chat-wake workflow_run listener reconstructs the
        # exported source after this run completes, including failed attempts.
        # Delivery has its own workflow status and cannot change Publisher's.
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["AIOS_PUBLICATION_REPORT"]).read_text(encoding="utf-8"))
          except (OSError, ValueError):
              report = {}
          outcomes = {"PUBLISHED", "ALREADY_PUBLISHED", "ALREADY_INCLUDED", "AWAITING_REVIEW",
                      "FAILED", "RECOVERY_BLOCKED", "RECOVERY_REVIEW_REQUIRED"}
          outcome = report.get("outcome") if isinstance(report, dict) else None
          outcome = outcome if isinstance(outcome, str) and outcome in outcomes else "UNAVAILABLE"
          lines = [f"Publisher step: **{os.environ['AIOS_PUBLICATION_STEP_OUTCOME']}**.",
                   f"Runtime publication outcome: **{outcome}**."]
          if os.environ["AIOS_CHAT_WAKE_ENABLED"] == "true" and os.environ["AIOS_REPOSITORY"] == "trung-via/AIOS-renew":
              url = (os.environ["AIOS_SERVER_URL"] + "/" + os.environ["AIOS_REPOSITORY"]
                     + "/actions/workflows/aios-local-chat-wake.yml")
              lines.append(f"Local chat wake: asynchronous; see the [separate delivery workflow]({url}). "
                           "Delivery status does not change the Publisher outcome.")
          else:
              lines.append("Local chat wake: disabled by the existing repository/Human gate.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n\n".join(lines) + "\n")
          PY
