name: AIOS auto-publish reviewed candidate

on:
  push:
    branches:
      - "aios/review-decision/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: Canonical RUN identity whose existing review decision is published or replayed
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aios-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      event_id: ${{ steps.attention.outputs.event_id }}
    steps:
      - name: Check out current canonical publication control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish or replay exact canonical review decision
        id: publication
        env:
          AIOS_EVENT_NAME: ${{ github.event_name }}
          AIOS_DECISION_REF: ${{ github.ref }}
          AIOS_DECISION_SHA: ${{ github.sha }}
          AIOS_REPLAY_RUN_ID: ${{ inputs.run_id }}
          PYTHONPATH: src
          AIOS_PUBLICATION_REPORT: ${{ runner.temp }}/aios-publication-report.json
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
        shell: bash
        run: |
          set -euo pipefail
          prefix="refs/heads/aios/review-decision/"
          if [[ "$AIOS_EVENT_NAME" == "push" ]]; then
            if [[ "$AIOS_DECISION_REF" != "$prefix"* ]]; then
              echo "Unexpected publication ref: $AIOS_DECISION_REF" >&2
              exit 1
            fi
            run_id="${AIOS_DECISION_REF#"$prefix"}"
            decision_sha="$AIOS_DECISION_SHA"
          else
            run_id="$AIOS_REPLAY_RUN_ID"
            if [[ ! "$run_id" =~ ^RUN-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid replay RUN identity" >&2
              exit 1
            fi
            decision_ref="${prefix}${run_id}"
            mapfile -t decisions < <(git ls-remote --refs origin "$decision_ref")
            if [[ ${#decisions[@]} -ne 1 ]]; then
              echo "Canonical replay decision is missing or ambiguous" >&2
              exit 1
            fi
            read -r decision_sha resolved_ref <<<"${decisions[0]}"
            if [[ "$resolved_ref" != "$decision_ref" || ! "$decision_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Canonical replay decision identity is malformed" >&2
              exit 1
            fi
          fi

          # Preserve exact attempt framing before publication can fail.
          printf 'run_id=%s\ndecision_sha=%s\n' "$run_id" "$decision_sha" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin refs/heads/main
          control_sha="$(git rev-parse FETCH_HEAD)"
          git checkout --detach "$control_sha"
          python -m aios_renew.publication \
            --repo . \
            --remote origin \
            --run-id "$run_id" \
            --decision-sha "$decision_sha" \
            --control-sha "$control_sha" > "$AIOS_PUBLICATION_REPORT"

      - name: Project canonical review and exact publication attempt
        id: attention-source
        if: always() && steps.publication.outputs.run_id != '' && steps.publication.outputs.decision_sha != ''
        env:
          PYTHONPATH: src
          AIOS_RUN_ID: ${{ steps.publication.outputs.run_id }}
          AIOS_DECISION_SHA: ${{ steps.publication.outputs.decision_sha }}
          AIOS_PUBLICATION_REPORT: ${{ runner.temp }}/aios-publication-report.json
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
        run: >-
          python -m aios_renew.brain_attention publication
          --run-id "$AIOS_RUN_ID" --decision-sha "$AIOS_DECISION_SHA"
          --report "$AIOS_PUBLICATION_REPORT" --source "$AIOS_ATTENTION_SOURCE_PATH"
          --output "$GITHUB_OUTPUT"

      - name: Export bounded publication attention observations
        id: attention-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-publication-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-publication/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Project one exact identity from the exported publication source
        id: attention
        # Projection/upload failures leave no doorbell, even if publication ran.
        if: >-
          always() &&
          steps.attention-source.outcome == 'success' &&
          steps.attention-source.outputs.source_digest != '' &&
          steps.attention-artifact.outcome == 'success' &&
          steps.attention-artifact.outputs.artifact-id != ''
        env:
          PYTHONPATH: src
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-publication/source.json
          AIOS_SOURCE_RUN: ${{ github.run_id }}
          AIOS_SOURCE_ATTEMPT: ${{ github.run_attempt }}
          AIOS_SOURCE_ARTIFACT: ${{ steps.attention-artifact.outputs.artifact-id }}
          AIOS_SOURCE_DIGEST: ${{ steps.attention-source.outputs.source_digest }}
          AIOS_SOURCE_REPOSITORY: ${{ github.repository }}
        run: >-
          python -m aios_renew.brain_attention publication-event
          --source "$AIOS_ATTENTION_SOURCE_PATH" --workflow-run-id "$AIOS_SOURCE_RUN"
          --attempt "$AIOS_SOURCE_ATTEMPT" --artifact-id "$AIOS_SOURCE_ARTIFACT"
          --source-digest "$AIOS_SOURCE_DIGEST" --repository "$AIOS_SOURCE_REPOSITORY"
          --output "$GITHUB_OUTPUT"

  local-chat-wake:
    needs: publish
    # Eligible failure/conflict observations survive a failed publication job.
    if: >-
      always() &&
      needs.publish.outputs.event_id != '' &&
      github.repository == 'trung-via/AIOS-renew' &&
      vars.AIOS_LOCAL_CHAT_WAKE_ENABLED == 'true'
    uses: ./.github/workflows/aios-local-chat-wake.yml
    permissions:
      contents: read
    with:
      event_id: ${{ needs.publish.outputs.event_id }}
      repository: trung-via/AIOS-renew
