name: AIOS self-hosted primary wakeup

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Canonical TASK id to execute"
        required: true
        type: string
      executor:
        description: "Explicit coding Executor"
        required: true
        type: choice
        options:
          - codex
          - antigravity

permissions:
  contents: read

concurrency:
  group: aios-self-hosted-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on: [self-hosted, windows, x64, aios-renew]
    env:
      AIOS_REPO_ROOT: ${{ vars.AIOS_REPO_ROOT }}
    steps:
      - name: Preflight persistent environment
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIOS_REPO_ROOT)) {
            Write-Error "AIOS_REPO_ROOT repository variable is not set or empty."
            exit 1
          }
          if (-not (Test-Path -Path $env:AIOS_REPO_ROOT -PathType Container)) {
            Write-Error "AIOS_REPO_ROOT directory does not exist: $env:AIOS_REPO_ROOT"
            exit 1
          }
          git -C $env:AIOS_REPO_ROOT rev-parse --is-inside-work-tree
          if ($LASTEXITCODE -ne 0) {
            Write-Error "AIOS_REPO_ROOT is not a valid Git repository: $env:AIOS_REPO_ROOT"
            exit 1
          }
          if (-not (Get-Command aios -ErrorAction SilentlyContinue)) {
            Write-Error "aios executable was not found on PATH."
            exit 1
          }

      - name: Execute canonical AIOS primary run
        env:
          AIOS_TASK_ID: ${{ inputs.task_id }}
          AIOS_EXECUTOR: ${{ inputs.executor }}
        shell: powershell
        run: |
          if ($env:AIOS_TASK_ID -notmatch '^TASK-[A-Za-z0-9_-]+$') {
            Write-Error "Invalid task_id format: $env:AIOS_TASK_ID"
            exit 1
          }
          aios run $env:AIOS_TASK_ID --executor $env:AIOS_EXECUTOR --repo $env:AIOS_REPO_ROOT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
