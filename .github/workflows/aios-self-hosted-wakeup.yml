name: AIOS self-hosted primary wakeup

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Stable delivery identity (reuse unchanged for re-delivery)"
        required: true
        type: string
      task_id:
        description: "Canonical TASK id to execute"
        required: true
        type: string
      task_revision:
        description: "Authorized canonical TASK revision"
        required: true
        type: number
      task_blob_sha:
        description: "Authorized TASK Git blob SHA"
        required: true
        type: string
      task_commit_sha:
        description: "Canonical provenance commit containing the TASK blob"
        required: true
        type: string
      executor:
        description: "Explicit coding Executor"
        required: true
        type: choice
        options:
          - codex
          - antigravity

permissions:
  contents: read

concurrency:
  group: aios-self-hosted-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on: [self-hosted, windows, x64, aios-renew]
    env:
      AIOS_REPO_ROOT: ${{ vars.AIOS_REPO_ROOT }}
      AIOS_CONTROL_ROOT: ${{ runner.temp }}/aios-control-${{ github.run_id }}-${{ github.run_attempt }}
      AIOS_CONTROL_SHA: ${{ github.sha }}
      AIOS_CONTROL_REF: ${{ github.ref }}
      AIOS_DISPATCH_ID: ${{ inputs.dispatch_id }}
      AIOS_TASK_ID: ${{ inputs.task_id }}
      AIOS_TASK_REVISION: ${{ inputs.task_revision }}
      AIOS_TASK_BLOB_SHA: ${{ inputs.task_blob_sha }}
      AIOS_TASK_COMMIT_SHA: ${{ inputs.task_commit_sha }}
      AIOS_EXECUTOR: ${{ inputs.executor }}
    steps:
      - name: Prepare exact transient control source
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-primary-operational-receipt-v2.json
          AIOS_CONTROL_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          function Write-OperationalFailure([string]$Reason) {
            if ([string]::IsNullOrWhiteSpace($env:AIOS_OPERATIONAL_RECEIPT_PATH)) { return }
            if ($env:AIOS_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') { return }
            $selectors = @{}
            if ($env:AIOS_TASK_ID -match '^TASK-[A-Za-z0-9_-]+$') { $selectors.task_id = $env:AIOS_TASK_ID }
            if ($env:AIOS_TASK_REVISION -match '^[1-9][0-9]*$') { $selectors.task_revision = [int]$env:AIOS_TASK_REVISION }
            if ($env:AIOS_TASK_BLOB_SHA -match '^[0-9a-f]{40}$') { $selectors.task_blob_sha = $env:AIOS_TASK_BLOB_SHA }
            if ($env:AIOS_TASK_COMMIT_SHA -match '^[0-9a-f]{40}$') { $selectors.task_commit_sha = $env:AIOS_TASK_COMMIT_SHA }
            if ($env:AIOS_EXECUTOR -in @('codex', 'antigravity')) { $selectors.executor = $env:AIOS_EXECUTOR }
            $receipt = [ordered]@{format='AIOS_OPERATIONAL_RECEIPT';version=2;kind='OPERATIONAL_RECEIPT';family='PRIMARY';delivery=@{kind='dispatch_id';id=$env:AIOS_DISPATCH_ID};boundary='OPERATIONAL_FAILED';selectors=$selectors;run_created=$false;executor_invoked=$false;cause=@{authority='WORKFLOW';phase='PRE_AIOS';reason_code=$Reason}}
            if ($env:AIOS_CONTROL_SHA -match '^[0-9a-f]{40}$') { $receipt.control_sha = $env:AIOS_CONTROL_SHA }
            Set-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Value ($receipt | ConvertTo-Json -Compress -Depth 5) -Encoding utf8
          }
          if ([string]::IsNullOrWhiteSpace($env:AIOS_REPO_ROOT)) {
            Write-OperationalFailure 'AIOS_REPO_ROOT_NOT_CONFIGURED'
            Write-Error "AIOS_REPO_ROOT repository variable is not set or empty."
            exit 1
          }
          if (-not (Test-Path -Path $env:AIOS_REPO_ROOT -PathType Container)) {
            Write-OperationalFailure 'CONFIGURED_REPOSITORY_UNAVAILABLE'
            Write-Error "AIOS_REPO_ROOT directory does not exist: $env:AIOS_REPO_ROOT"
            exit 1
          }
          git -C $env:AIOS_REPO_ROOT rev-parse --is-inside-work-tree
          if ($LASTEXITCODE -ne 0) {
            Write-OperationalFailure 'CONFIGURED_REPOSITORY_INVALID'
            Write-Error "AIOS_REPO_ROOT is not a valid Git repository: $env:AIOS_REPO_ROOT"
            exit 1
          }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-OperationalFailure 'AIOS_COMMAND_UNAVAILABLE'
            Write-Error "Python is unavailable for the bounded AIOS control entry."
            exit 1
          }
          if ($env:GITHUB_REPOSITORY -ne 'trung-via/AIOS-renew') {
            Write-OperationalFailure 'UNEXPECTED_REPOSITORY_IDENTITY'
            Write-Error "Unexpected repository identity."
            exit 1
          }
          if ($env:AIOS_CONTROL_REF -ne 'refs/heads/main' -or $env:AIOS_CONTROL_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-OperationalFailure 'NONCANONICAL_WORKFLOW_REF'
            Write-Error "Control source must be bound to an exact canonical main invocation."
            exit 1
          }
          if (Test-Path -LiteralPath $env:AIOS_CONTROL_ROOT) {
            Write-OperationalFailure 'CONTROL_SOURCE_PATH_OCCUPIED'
            Write-Error "Transient control source path is already occupied."
            exit 1
          }
          $persistentRoot = (Resolve-Path -LiteralPath $env:AIOS_REPO_ROOT).Path
          $controlCandidate = [IO.Path]::GetFullPath($env:AIOS_CONTROL_ROOT)
          $persistentPrefix = $persistentRoot.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
          if ($controlCandidate -eq $persistentRoot -or $controlCandidate.StartsWith($persistentPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            Write-OperationalFailure 'CONTROL_SOURCE_NOT_DISTINCT'
            Write-Error "Control source must be outside AIOS_REPO_ROOT."
            exit 1
          }
          New-Item -ItemType Directory -Path $env:AIOS_CONTROL_ROOT | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'AIOS_CONTROL_PREPARED=1' -Encoding utf8
          $controlRoot = (Resolve-Path -LiteralPath $env:AIOS_CONTROL_ROOT).Path
          git -C $controlRoot init --quiet
          if ($LASTEXITCODE -ne 0) { Write-OperationalFailure 'CONTROL_SOURCE_MATERIALIZATION_FAILED'; exit 1 }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:AIOS_CONTROL_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          try {
            git -C $controlRoot fetch --quiet --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" $env:AIOS_CONTROL_SHA
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
            $basic = $null
          }
          if ($LASTEXITCODE -ne 0) { Write-OperationalFailure 'CONTROL_SOURCE_MATERIALIZATION_FAILED'; exit 1 }
          git -C $controlRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { Write-OperationalFailure 'CONTROL_SOURCE_MATERIALIZATION_FAILED'; exit 1 }
          $actualSha = git -C $controlRoot rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:AIOS_CONTROL_SHA) {
            Write-OperationalFailure 'CONTROL_SOURCE_SHA_MISMATCH'
            Write-Error "Transient control source does not match the workflow commit."
            exit 1
          }
          $controlStatus = @(git -C $controlRoot status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $controlStatus.Count -ne 0) {
            Write-OperationalFailure 'CONTROL_SOURCE_DIRTY'
            Write-Error "Transient control source is not clean."
            exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $controlRoot 'scripts/aios_control_entry.py') -PathType Leaf)) {
            Write-OperationalFailure 'CONTROL_ENTRY_UNAVAILABLE'
            Write-Error "Trusted control entry is unavailable."
            exit 1
          }

      - name: Execute idempotent AIOS primary wakeup
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-primary-operational-receipt-v2.json
          AIOS_DISPATCH_ID: ${{ inputs.dispatch_id }}
          AIOS_TASK_ID: ${{ inputs.task_id }}
          AIOS_TASK_REVISION: ${{ inputs.task_revision }}
          AIOS_TASK_BLOB_SHA: ${{ inputs.task_blob_sha }}
          AIOS_TASK_COMMIT_SHA: ${{ inputs.task_commit_sha }}
          AIOS_EXECUTOR: ${{ inputs.executor }}
        shell: powershell
        run: |
          function Write-OperationalState([string]$Boundary, [string]$Reason) {
            if ([string]::IsNullOrWhiteSpace($env:AIOS_OPERATIONAL_RECEIPT_PATH)) { return }
            if ($env:AIOS_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') { return }
            $selectors = @{}
            if ($env:AIOS_TASK_ID -match '^TASK-[A-Za-z0-9_-]+$') { $selectors.task_id = $env:AIOS_TASK_ID }
            if ($env:AIOS_TASK_REVISION -match '^[1-9][0-9]*$') { $selectors.task_revision = [int]$env:AIOS_TASK_REVISION }
            if ($env:AIOS_TASK_BLOB_SHA -match '^[0-9a-f]{40}$') { $selectors.task_blob_sha = $env:AIOS_TASK_BLOB_SHA }
            if ($env:AIOS_TASK_COMMIT_SHA -match '^[0-9a-f]{40}$') { $selectors.task_commit_sha = $env:AIOS_TASK_COMMIT_SHA }
            if ($env:AIOS_EXECUTOR -in @('codex', 'antigravity')) { $selectors.executor = $env:AIOS_EXECUTOR }
            $receipt = [ordered]@{format='AIOS_OPERATIONAL_RECEIPT';version=2;kind='OPERATIONAL_RECEIPT';family='PRIMARY';delivery=@{kind='dispatch_id';id=$env:AIOS_DISPATCH_ID};boundary=$Boundary;selectors=$selectors;run_created=$false;executor_invoked=$false}
            if ($env:AIOS_CONTROL_SHA -match '^[0-9a-f]{40}$') { $receipt.control_sha = $env:AIOS_CONTROL_SHA }
            if ($Reason) { $receipt.cause = @{authority='WORKFLOW';phase='PRE_AIOS';reason_code=$Reason} }
            Set-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Value ($receipt | ConvertTo-Json -Compress -Depth 5) -Encoding utf8
          }
          if ($env:AIOS_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid dispatch_id format."
            exit 1
          }
          if ($env:AIOS_TASK_ID -notmatch '^TASK-[A-Za-z0-9_-]+$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid task_id format: $env:AIOS_TASK_ID"
            exit 1
          }
          if ($env:AIOS_TASK_REVISION -notmatch '^[1-9][0-9]*$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid task_revision format."
            exit 1
          }
          if ($env:AIOS_TASK_BLOB_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid task_blob_sha format."
            exit 1
          }
          if ($env:AIOS_TASK_COMMIT_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-OperationalState 'OPERATIONAL_FAILED' 'INVALID_BOUNDED_INPUT'
            Write-Error "Invalid task_commit_sha format."
            exit 1
          }
          Write-OperationalState 'AIOS_INVOKED' ''
          $controlSource = $env:AIOS_CONTROL_ROOT
          $entry = Join-Path $controlSource 'scripts/aios_control_entry.py'
          Remove-Item Env:AIOS_CONTROL_ROOT, Env:AIOS_CONTROL_REF, Env:AIOS_CONTROL_PREPARED -ErrorAction SilentlyContinue
          python $entry $controlSource wakeup $env:AIOS_DISPATCH_ID $env:AIOS_TASK_ID --task-revision $env:AIOS_TASK_REVISION --task-blob-sha $env:AIOS_TASK_BLOB_SHA --task-commit-sha $env:AIOS_TASK_COMMIT_SHA --executor $env:AIOS_EXECUTOR --repo $env:AIOS_REPO_ROOT
          $aiosExitCode = $LASTEXITCODE
          if ($aiosExitCode -ne 0) {
            exit $aiosExitCode
          }

      - name: Expose bounded Operational Receipt v2
        if: always()
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-primary-operational-receipt-v2.json
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -PathType Leaf) {
            $receipt = Get-Content -LiteralPath $env:AIOS_OPERATIONAL_RECEIPT_PATH -Raw
            Write-Output "AIOS_OPERATIONAL_RECEIPT_V2=$receipt"
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $receipt -Encoding utf8
            }
          }

      - name: Persist bounded Operational Receipt v2
        if: always()
        uses: actions/upload-artifact@v4
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-primary-operational-receipt-v2.json
        with:
          name: aios-operational-receipt-v2
          path: ${{ env.AIOS_OPERATIONAL_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient control source
        if: always()
        continue-on-error: true
        env:
          AIOS_OPERATIONAL_RECEIPT_PATH: ${{ runner.temp }}/aios-primary-operational-receipt-v2.json
        shell: powershell
        run: |
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
          if ($env:AIOS_CONTROL_PREPARED -eq '1' -and (Test-Path -LiteralPath $env:AIOS_CONTROL_ROOT)) {
            $controlRoot = (Resolve-Path -LiteralPath $env:AIOS_CONTROL_ROOT).Path
            if ((Split-Path -Parent $controlRoot) -eq $runnerTemp -and (Split-Path -Leaf $controlRoot) -match '^aios-control-[0-9]+-[0-9]+$') {
              Remove-Item -LiteralPath $controlRoot -Recurse -Force
            }
          }
