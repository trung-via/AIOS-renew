name: AIOS Brain PRIMARY Wakeup Carrier

on:
  workflow_call:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: aios-brain-wakeup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admit-and-dispatch:
    if: github.event.issue.title == '[AIOS BRAIN WAKEUP]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact carrier invocation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewed repository package
        run: python -m pip install --disable-pip-version-check .

      - name: Admit and sanitize one wakeup request
        id: admission
        continue-on-error: true
        env:
          AIOS_PROFILE_POLICY: ${{ github.workspace }}/.ai/executor-profiles.yaml
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-wakeup-receipt.txt
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-primary/source.json
        run: >-
          python -m aios_renew.github_issue_wakeup
          --event "$GITHUB_EVENT_PATH"
          --policy .ai/brain-wakeup-carriers.yaml
          --profile-policy "$AIOS_PROFILE_POLICY"
          --output "$GITHUB_OUTPUT"
          --receipt "$AIOS_RECEIPT_PATH"

      - name: Dispatch the fixed A1 workflow once
        id: dispatch
        if: steps.admission.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AIOS_DISPATCH_ID: ${{ steps.admission.outputs.dispatch_id }}
          AIOS_TASK_ID: ${{ steps.admission.outputs.task_id }}
          AIOS_TASK_REVISION: ${{ steps.admission.outputs.task_revision }}
          AIOS_TASK_BLOB_SHA: ${{ steps.admission.outputs.task_blob_sha }}
          AIOS_TASK_COMMIT_SHA: ${{ steps.admission.outputs.task_commit_sha }}
          AIOS_EXECUTOR: ${{ steps.admission.outputs.executor }}
          AIOS_MODEL: ${{ steps.admission.outputs.model }}
          AIOS_REASONING_EFFORT: ${{ steps.admission.outputs.reasoning_effort }}
          AIOS_MODEL_SOURCE: ${{ steps.admission.outputs.model_source }}
          AIOS_EFFORT_SOURCE: ${{ steps.admission.outputs.effort_source }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'trung-via',
              repo: 'AIOS-renew',
              workflow_id: 'aios-self-hosted-wakeup.yml',
              ref: 'main',
              inputs: {
                dispatch_id: process.env.AIOS_DISPATCH_ID,
                task_id: process.env.AIOS_TASK_ID,
                task_revision: process.env.AIOS_TASK_REVISION,
                task_blob_sha: process.env.AIOS_TASK_BLOB_SHA,
                task_commit_sha: process.env.AIOS_TASK_COMMIT_SHA,
                executor: process.env.AIOS_EXECUTOR,
                model: process.env.AIOS_MODEL,
                reasoning_effort: process.env.AIOS_REASONING_EFFORT,
                model_source: process.env.AIOS_MODEL_SOURCE,
                effort_source: process.env.AIOS_EFFORT_SOURCE,
              },
            });

      - name: Observe rejected PRIMARY dispatch
        if: always() && steps.admission.outcome == 'success' && steps.dispatch.outcome == 'failure'
        env:
          AIOS_DELIVERY_ID: ${{ steps.admission.outputs.dispatch_id }}
          AIOS_TASK_ID: ${{ steps.admission.outputs.task_id }}
          AIOS_TASK_COMMIT_SHA: ${{ steps.admission.outputs.task_commit_sha }}
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-primary/source.json
        run: >-
          python -m aios_renew.brain_attention dispatch --operation PRIMARY
          --delivery-id "$AIOS_DELIVERY_ID" --subject-id "$AIOS_TASK_ID"
          --subject-sha "$AIOS_TASK_COMMIT_SHA" --source "$AIOS_ATTENTION_SOURCE_PATH"

      - name: Export bounded PRIMARY attention observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-primary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-primary/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Post bounded carrier receipt
        if: always()
        id: wake_source
        uses: actions/github-script@v7
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-wakeup-receipt.txt
          AIOS_ADMISSION_OUTCOME: ${{ steps.admission.outcome }}
          AIOS_DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          AIOS_DISPATCH_ID: ${{ steps.admission.outputs.dispatch_id }}
          AIOS_TASK_ID: ${{ steps.admission.outputs.task_id }}
          AIOS_TASK_REVISION: ${{ steps.admission.outputs.task_revision }}
          AIOS_TASK_BLOB_SHA: ${{ steps.admission.outputs.task_blob_sha }}
          AIOS_TASK_COMMIT_SHA: ${{ steps.admission.outputs.task_commit_sha }}
          AIOS_EXECUTOR: ${{ steps.admission.outputs.executor }}
          AIOS_MODEL: ${{ steps.admission.outputs.model }}
          AIOS_REASONING_EFFORT: ${{ steps.admission.outputs.reasoning_effort }}
          AIOS_MODEL_SOURCE: ${{ steps.admission.outputs.model_source }}
          AIOS_EFFORT_SOURCE: ${{ steps.admission.outputs.effort_source }}
        with:
          script: |
            const fs = require('fs');
            const accepted = process.env.AIOS_ADMISSION_OUTCOME === 'success'
              && process.env.AIOS_DISPATCH_OUTCOME === 'success';
            let receipt;
            if (accepted) {
              const operationalReceipt = JSON.stringify({
                format: 'AIOS_OPERATIONAL_RECEIPT', version: 2, kind: 'OPERATIONAL_RECEIPT',
                family: 'PRIMARY',
                delivery: {kind: 'dispatch_id', id: process.env.AIOS_DISPATCH_ID},
                boundary: 'DISPATCH_REQUEST_ACCEPTED',
                selectors: {task_id: process.env.AIOS_TASK_ID, task_revision: Number(process.env.AIOS_TASK_REVISION), task_blob_sha: process.env.AIOS_TASK_BLOB_SHA, task_commit_sha: process.env.AIOS_TASK_COMMIT_SHA, executor: process.env.AIOS_EXECUTOR, model: process.env.AIOS_MODEL, reasoning_effort: process.env.AIOS_REASONING_EFFORT, model_source: process.env.AIOS_MODEL_SOURCE, effort_source: process.env.AIOS_EFFORT_SOURCE},
              });
              receipt = [
                'AIOS BRAIN WAKEUP RECEIPT',
                'status: DISPATCH_ACCEPTED',
                'dispatch_accepted: true',
                'execution_outcome: not_observed',
                `dispatch_id: ${process.env.AIOS_DISPATCH_ID}`,
                `task_id: ${process.env.AIOS_TASK_ID}`,
                `task_revision: ${process.env.AIOS_TASK_REVISION}`,
                `task_blob_sha: ${process.env.AIOS_TASK_BLOB_SHA}`,
                `task_commit_sha: ${process.env.AIOS_TASK_COMMIT_SHA}`,
                `executor: ${process.env.AIOS_EXECUTOR}`,
                `model: ${process.env.AIOS_MODEL}`,
                `reasoning_effort: ${process.env.AIOS_REASONING_EFFORT}`,
                `model_source: ${process.env.AIOS_MODEL_SOURCE}`,
                `effort_source: ${process.env.AIOS_EFFORT_SOURCE}`,
                'detail: GitHub accepted one fixed A1 workflow dispatch; this is not RUN, verification, review, or publication success.',
                `AIOS_OPERATIONAL_RECEIPT_V2=${operationalReceipt}`,
              ].join('\n');
            } else if (process.env.AIOS_ADMISSION_OUTCOME === 'success') {
              const operationalReceipt = JSON.stringify({
                format: 'AIOS_OPERATIONAL_RECEIPT', version: 2, kind: 'OPERATIONAL_RECEIPT',
                family: 'PRIMARY',
                delivery: {kind: 'dispatch_id', id: process.env.AIOS_DISPATCH_ID},
                boundary: 'CARRIER_ADMITTED',
                selectors: {task_id: process.env.AIOS_TASK_ID, task_revision: Number(process.env.AIOS_TASK_REVISION), task_blob_sha: process.env.AIOS_TASK_BLOB_SHA, task_commit_sha: process.env.AIOS_TASK_COMMIT_SHA, executor: process.env.AIOS_EXECUTOR, model: process.env.AIOS_MODEL, reasoning_effort: process.env.AIOS_REASONING_EFFORT, model_source: process.env.AIOS_MODEL_SOURCE, effort_source: process.env.AIOS_EFFORT_SOURCE},
              });
              receipt = [
                'AIOS BRAIN WAKEUP RECEIPT',
                'status: REJECTED',
                'dispatch_accepted: false',
                'execution_outcome: not_observed',
                'reason: GitHub did not accept the fixed A1 workflow dispatch.',
                `AIOS_OPERATIONAL_RECEIPT_V2=${operationalReceipt}`,
              ].join('\n');
            } else {
              receipt = 'AIOS BRAIN WAKEUP RECEIPT\nstatus: REJECTED\ndispatch_accepted: false\nexecution_outcome: not_observed\nreason: carrier produced no receipt';
              try {
                receipt = fs.readFileSync(process.env.AIOS_RECEIPT_PATH, 'utf8');
              } catch (_) {}
            }
            receipt = receipt.replaceAll('\0', '?').slice(0, 3500);
            const source = await github.rest.issues.createComment({
              owner: 'trung-via',
              repo: 'AIOS-renew',
              issue_number: context.issue.number,
              body: receipt,
            });
            core.setOutput('issue_id', String(context.payload.issue.id));
            core.setOutput('issue_number', String(context.issue.number));
            core.setOutput('comment_id', String(source.data.id));
            if (accepted) {
              await github.rest.issues.update({
                owner: 'trung-via',
                repo: 'AIOS-renew',
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Preserve rejected carrier outcome
        if: always() && (steps.admission.outcome != 'success' || steps.dispatch.outcome != 'success')
        run: exit 1

      - name: Write exact wake source selectors
        id: wake_pointer
        if: always() && steps.wake_source.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          AIOS_ISSUE_ID: ${{ steps.wake_source.outputs.issue_id }}
          AIOS_ISSUE_NUMBER: ${{ steps.wake_source.outputs.issue_number }}
          AIOS_COMMENT_ID: ${{ steps.wake_source.outputs.comment_id }}
          AIOS_WAKE_SOURCE_PATH: ${{ runner.temp }}/aios-wake-source/source.json
        with:
          script: |
            const fs = require('fs');
            const pointer = {version: 1, source_kind: 'comment', issue_id: Number(process.env.AIOS_ISSUE_ID),
              issue_number: Number(process.env.AIOS_ISSUE_NUMBER), comment_id: Number(process.env.AIOS_COMMENT_ID)};
            if (![pointer.issue_id, pointer.issue_number, pointer.comment_id].every(n => Number.isSafeInteger(n) && n > 0)) {
              throw new Error('Invalid exact wake source selector');
            }
            fs.mkdirSync(require('path').dirname(process.env.AIOS_WAKE_SOURCE_PATH), {recursive: true});
            fs.writeFileSync(process.env.AIOS_WAKE_SOURCE_PATH, JSON.stringify(pointer), 'utf8');
            core.setOutput('ready', 'true');

      - name: Export bounded wake source selectors
        if: always() && steps.wake_pointer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aios-wake-source-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-wake-source/source.json
          if-no-files-found: error
          retention-days: 1
