name: AIOS Brain REPAIR wakeup carrier

on:
  workflow_call:

permissions:
  contents: read
  issues: write

concurrency:
  group: aios-brain-repair-wakeup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admit:
    if: github.event.issue.title == '[AIOS REPAIR WAKEUP]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repair_dispatch_id: ${{ steps.admission.outputs.repair_dispatch_id }}
      failed_run_id: ${{ steps.admission.outputs.failed_run_id }}
      repair_sha: ${{ steps.admission.outputs.repair_sha }}
      executor: ${{ steps.admission.outputs.executor }}
      model: ${{ steps.admission.outputs.model }}
      reasoning_effort: ${{ steps.admission.outputs.reasoning_effort }}
      model_source: ${{ steps.admission.outputs.model_source }}
      effort_source: ${{ steps.admission.outputs.effort_source }}
    steps:
      - name: Check out exact carrier invocation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewed repository package
        run: python -m pip install --disable-pip-version-check .

      - name: Admit and sanitize one REPAIR wakeup
        id: admission
        env:
          AIOS_PROFILE_POLICY: ${{ github.workspace }}/.ai/executor-profiles.yaml
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-wakeup-receipt.txt
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-repair/source.json
        run: >-
          python -m aios_renew.github_issue_repair_wakeup
          --event "$GITHUB_EVENT_PATH"
          --policy .ai/brain-repair-wakeup-carriers.yaml
          --profile-policy "$AIOS_PROFILE_POLICY"
          --output "$GITHUB_OUTPUT"
          --receipt "$AIOS_RECEIPT_PATH"

      - name: Publish pending REPAIR workflow identity on the origin Issue
        id: repair_observation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_REPAIR_DISPATCH_ID: ${{ steps.admission.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ steps.admission.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ steps.admission.outputs.repair_sha }}
        run: >-
          python -m aios_renew.github_issue_repair_wakeup --mode workflow-receipt
          --receipt "$RUNNER_TEMP/aios-repair-observation.txt" --phase waiting
          --route HUMAN_AUTHENTICATED --route-reason READY

      - name: Export bounded REPAIR carrier attention observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-repair-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-repair/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Expose bounded admission reason
        if: always()
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-repair-wakeup-receipt.txt
        run: |
          if [ -f "$AIOS_RECEIPT_PATH" ]; then cat "$AIOS_RECEIPT_PATH" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Write exact wake source selectors
        id: wake_pointer
        if: always() && steps.repair_observation.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          AIOS_ISSUE_ID: ${{ steps.repair_observation.outputs.issue_id }}
          AIOS_ISSUE_NUMBER: ${{ steps.repair_observation.outputs.issue_number }}
          AIOS_COMMENT_ID: ${{ steps.repair_observation.outputs.comment_id }}
          AIOS_WAKE_SOURCE_PATH: ${{ runner.temp }}/aios-wake-source/source.json
        with:
          script: |
            const fs = require('fs');
            const pointer = {version: 1, source_kind: 'comment', issue_id: Number(process.env.AIOS_ISSUE_ID),
              issue_number: Number(process.env.AIOS_ISSUE_NUMBER), comment_id: Number(process.env.AIOS_COMMENT_ID)};
            if (![pointer.issue_id, pointer.issue_number, pointer.comment_id].every(n => Number.isSafeInteger(n) && n > 0)) {
              throw new Error('Invalid exact wake source selector');
            }
            fs.mkdirSync(require('path').dirname(process.env.AIOS_WAKE_SOURCE_PATH), {recursive: true});
            fs.writeFileSync(process.env.AIOS_WAKE_SOURCE_PATH, JSON.stringify(pointer), 'utf8');
            core.setOutput('ready', 'true');

      - name: Export bounded wake source selectors
        if: always() && steps.wake_pointer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aios-wake-source-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-wake-source/source.json
          if-no-files-found: error
          retention-days: 90

  dispatch:
    needs: admit
    uses: ./.github/workflows/aios-self-hosted-repair-wakeup.yml
    with:
      repair_dispatch_id: ${{ needs.admit.outputs.repair_dispatch_id }}
      failed_run_id: ${{ needs.admit.outputs.failed_run_id }}
      repair_sha: ${{ needs.admit.outputs.repair_sha }}
      executor: ${{ needs.admit.outputs.executor }}
      model: ${{ needs.admit.outputs.model }}
      reasoning_effort: ${{ needs.admit.outputs.reasoning_effort }}
      model_source: ${{ needs.admit.outputs.model_source }}
      effort_source: ${{ needs.admit.outputs.effort_source }}

  receipt:
    if: always() && github.event.issue.title == '[AIOS REPAIR WAKEUP]'
    needs: [admit, dispatch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check .
      - name: Update exact Human REPAIR Issue with actual workflow job outcome
        id: repair_observation
        if: needs.admit.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_REPAIR_DISPATCH_ID: ${{ needs.admit.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ needs.admit.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ needs.admit.outputs.repair_sha }}
          AIOS_DOWNSTREAM_RESULT: ${{ needs.dispatch.result }}
        run: >-
          python -m aios_renew.github_issue_repair_wakeup --mode workflow-receipt
          --receipt "$RUNNER_TEMP/aios-repair-observation.txt" --phase completed
          --route HUMAN_AUTHENTICATED --route-reason READY --downstream-result "$AIOS_DOWNSTREAM_RESULT" --output "$GITHUB_OUTPUT"

      - name: Post bounded carrier receipt
        id: wake_source
        if: always() && needs.admit.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const source = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: 'AIOS REPAIR WAKEUP CARRIER RECEIPT\nstatus: REJECTED\nreason: GitHub rejected the repository-owned carrier admission.\nrun_created: false\nexecutor_invoked: false',
            });
            core.setOutput('issue_id', String(context.payload.issue.id));
            core.setOutput('issue_number', String(context.issue.number));
            core.setOutput('comment_id', String(source.data.id));

      - name: Preserve rejected carrier outcome
        if: needs.admit.result != 'success' || needs.dispatch.result != 'success'
        run: exit 1

      - name: Write exact wake source selectors
        id: wake_pointer
        if: always() && needs.admit.result != 'success' && steps.wake_source.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          AIOS_ISSUE_ID: ${{ steps.repair_observation.outputs.issue_id || steps.wake_source.outputs.issue_id }}
          AIOS_ISSUE_NUMBER: ${{ steps.repair_observation.outputs.issue_number || steps.wake_source.outputs.issue_number }}
          AIOS_COMMENT_ID: ${{ steps.repair_observation.outputs.comment_id || steps.wake_source.outputs.comment_id }}
          AIOS_WAKE_SOURCE_PATH: ${{ runner.temp }}/aios-wake-source/source.json
        with:
          script: |
            const fs = require('fs');
            const pointer = {version: 1, source_kind: 'comment', issue_id: Number(process.env.AIOS_ISSUE_ID),
              issue_number: Number(process.env.AIOS_ISSUE_NUMBER), comment_id: Number(process.env.AIOS_COMMENT_ID)};
            if (![pointer.issue_id, pointer.issue_number, pointer.comment_id].every(n => Number.isSafeInteger(n) && n > 0)) {
              throw new Error('Invalid exact wake source selector');
            }
            fs.mkdirSync(require('path').dirname(process.env.AIOS_WAKE_SOURCE_PATH), {recursive: true});
            fs.writeFileSync(process.env.AIOS_WAKE_SOURCE_PATH, JSON.stringify(pointer), 'utf8');
            core.setOutput('ready', 'true');

      - name: Export bounded wake source selectors
        if: always() && needs.admit.result != 'success' && steps.wake_pointer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aios-wake-source-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-wake-source/source.json
          if-no-files-found: error
          retention-days: 90
