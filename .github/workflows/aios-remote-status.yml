name: AIOS bounded remote status

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Existing stable A2 dispatch identity"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aios-remote-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, windows, x64, aios-renew]
    env:
      AIOS_REPO_ROOT: ${{ vars.AIOS_REPO_ROOT }}
    steps:
      - name: Preflight persistent environment
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIOS_REPO_ROOT)) {
            Write-Error "AIOS_REPO_ROOT repository variable is not configured."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:AIOS_REPO_ROOT -PathType Container)) {
            Write-Error "The configured persistent repository is unavailable."
            exit 1
          }
          git -C $env:AIOS_REPO_ROOT rev-parse --is-inside-work-tree
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The configured persistent repository is invalid."
            exit 1
          }
          if (-not (Get-Command aios -ErrorAction SilentlyContinue)) {
            Write-Error "The bounded AIOS command is unavailable."
            exit 1
          }

      - name: Read bounded dispatch status
        env:
          AIOS_DISPATCH_ID: ${{ inputs.dispatch_id }}
        shell: powershell
        run: |
          if ($env:AIOS_DISPATCH_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$') {
            Write-Error "Invalid dispatch identity."
            exit 1
          }
          aios remote-status $env:AIOS_DISPATCH_ID --repo $env:AIOS_REPO_ROOT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
