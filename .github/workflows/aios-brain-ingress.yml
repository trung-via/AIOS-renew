name: AIOS Brain Issue Ingress

on:
  workflow_call:
    secrets:
      AIOS_ORIGIN_ADMISSION_KEY:
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: aios-brain-ingress-${{ github.repository }}
  cancel-in-progress: false

jobs:
  origin_request:
    if: github.event.issue.title == '[AIOS BRAIN INGRESS]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      required: ${{ steps.frame.outputs.origin_proof_required }}
    steps:
      - name: Check out reviewed origin framing code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check .
      - name: Frame origin request without canonical mutation
        id: frame
        run: >-
          python -m aios_renew.github_issue_ingress --mode frame
          --event "$GITHUB_EVENT_PATH" --policy .ai/brain-ingress-carriers.yaml
          --output "$GITHUB_OUTPUT"

  origin_provenance:
    needs: origin_request
    if: needs.origin_request.outputs.required == 'true'
    runs-on: [self-hosted, windows, x64, aios-renew]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out reviewed provenance admission code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: powershell
        run: python -m pip install --disable-pip-version-check .
      - name: Admit exact attempt against machine-local H4C0 state
        shell: powershell
        env:
          AIOS_ORIGIN_ADMISSION_KEY: ${{ secrets.AIOS_ORIGIN_ADMISSION_KEY }}
          AIOS_ORIGIN_ADMISSION_PATH: ${{ runner.temp }}/aios-origin-admission-${{ github.run_attempt }}/admission.json
        run: |
          python -m aios_renew.github_issue_ingress --mode admit-origin --event "$env:GITHUB_EVENT_PATH" --policy .ai/brain-ingress-carriers.yaml --origin-admission "$env:AIOS_ORIGIN_ADMISSION_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export bounded authenticated origin admission
        uses: actions/upload-artifact@v4
        with:
          name: aios-origin-admission-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-origin-admission-${{ github.run_attempt }}/admission.json
          if-no-files-found: error
          retention-days: 1

  deliver:
    needs: [origin_request, origin_provenance]
    if: always() && github.event.issue.title == '[AIOS BRAIN INGRESS]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repair_dispatch_id: ${{ steps.ingress.outputs.repair_dispatch_id }}
      failed_run_id: ${{ steps.ingress.outputs.failed_run_id }}
      repair_sha: ${{ steps.ingress.outputs.repair_sha }}
      repair_route: ${{ steps.ingress.outputs.repair_route }}
      repair_route_reason: ${{ steps.ingress.outputs.repair_route_reason }}
      repair_receipt: ${{ steps.repair_observation.outcome }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewed repository package
        run: python -m pip install --disable-pip-version-check .

      - name: Import only this carrier attempt's origin admission
        if: needs.origin_provenance.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aios-origin-admission-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-origin-admission-${{ github.run_attempt }}

      - name: Deliver immutable Issue event once
        id: ingress
        continue-on-error: true
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-ingress/source.json
          AIOS_ORIGIN_ADMISSION_KEY: ${{ secrets.AIOS_ORIGIN_ADMISSION_KEY }}
          AIOS_ORIGIN_ADMISSION_PATH: ${{ runner.temp }}/aios-origin-admission-${{ github.run_attempt }}/admission.json
        run: |
          python -m aios_renew.github_issue_ingress --event "$GITHUB_EVENT_PATH" --policy .ai/brain-ingress-carriers.yaml --repo . --origin-admission "$AIOS_ORIGIN_ADMISSION_PATH" --output "$GITHUB_OUTPUT" > "$AIOS_RECEIPT_PATH"

      - name: Dispatch safe publication once
        id: dispatch
        if: steps.ingress.outcome == 'success' && steps.ingress.outputs.publication_run_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AIOS_RUN_ID: ${{ steps.ingress.outputs.publication_run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aios-auto-publish.yml',
              ref: 'main',
              inputs: {
                run_id: process.env.AIOS_RUN_ID,
              },
            });

      # Initial and recovered-source PASS use this same transport continuation.
      # Ingress/Python bind exact RUN, candidate and provenance; dispatch does
      # not infer review, recovery admission, evidence or publication success.
      - name: Observe rejected publication dispatch
        if: always() && steps.ingress.outcome == 'success' && steps.ingress.outputs.publication_run_id != '' && steps.dispatch.outcome == 'failure'
        env:
          AIOS_PUBLICATION_RUN_ID: ${{ steps.ingress.outputs.publication_run_id }}
          AIOS_ATTENTION_SOURCE_PATH: ${{ runner.temp }}/aios-attention-dispatch/source.json
        run: >-
          python -m aios_renew.brain_attention dispatch --operation PUBLICATION
          --run-id "$AIOS_PUBLICATION_RUN_ID" --source "$AIOS_ATTENTION_SOURCE_PATH"

      - name: Export bounded ingress attention observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-ingress-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-ingress/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Export bounded dispatch attention observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-attention-source-v1-dispatch-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-attention-dispatch/source.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Post bounded REPAIR workflow observation
        id: repair_observation
        if: always() && steps.ingress.outcome == 'success' && steps.ingress.outputs.repair_sha != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_REPAIR_DISPATCH_ID: ${{ steps.ingress.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ steps.ingress.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ steps.ingress.outputs.repair_sha }}
          AIOS_REPAIR_ROUTE: ${{ steps.ingress.outputs.repair_route }}
          AIOS_REPAIR_ROUTE_REASON: ${{ steps.ingress.outputs.repair_route_reason }}
        run: >-
          python -m aios_renew.github_issue_repair_wakeup --mode workflow-receipt
          --receipt "$RUNNER_TEMP/aios-repair-observation.txt" --phase waiting
          --route "$AIOS_REPAIR_ROUTE" --route-reason "$AIOS_REPAIR_ROUTE_REASON"
          --output "$GITHUB_OUTPUT"

      - name: Post bounded transport receipt
        if: always() && steps.ingress.outputs.repair_sha == ''
        id: wake_source
        uses: actions/github-script@v7
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
          AIOS_INGRESS_OUTCOME: ${{ steps.ingress.outcome }}
          AIOS_DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          AIOS_PUBLICATION_RUN_ID: ${{ steps.ingress.outputs.publication_run_id }}
        with:
          script: |
            const fs = require('fs');
            const ingressOutcome = process.env.AIOS_INGRESS_OUTCOME;
            const dispatchOutcome = process.env.AIOS_DISPATCH_OUTCOME;
            const publicationRunId = process.env.AIOS_PUBLICATION_RUN_ID || '';
            const publicationRequested = Boolean(publicationRunId);
            const dispatchAccepted = dispatchOutcome === 'success';

            const fullySuccessful = ingressOutcome === 'success'
              && (!publicationRequested || dispatchAccepted);

            let receipt = 'AIOS BRAIN INGRESS RECEIPT\nstatus: FAIL\nreason: carrier produced no receipt';
            try {
              receipt = fs.readFileSync(process.env.AIOS_RECEIPT_PATH, 'utf8').trimEnd();
            } catch (_) {}

            if (ingressOutcome === 'success' && publicationRequested) {
              if (dispatchAccepted) {
                receipt += [
                  '',
                  '',
                  'publication_dispatch: ACCEPTED',
                  'dispatch_accepted: true',
                  `publication_run_id: ${publicationRunId}`,
                  'detail: GitHub accepted safe publication dispatch; this is not publication success or verdict.',
                ].join('\n');
              } else {
                receipt += [
                  '',
                  '',
                  'publication_dispatch: REJECTED',
                  'dispatch_accepted: false',
                  `publication_run_id: ${publicationRunId}`,
                  'reason: GitHub did not accept safe publication dispatch.',
                ].join('\n');
              }
            }

            receipt = receipt.replaceAll('\0', '?').slice(0, 3500);
            const source = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: receipt,
            });
            core.setOutput('issue_id', String(context.payload.issue.id));
            core.setOutput('issue_number', String(context.issue.number));
            core.setOutput('comment_id', String(source.data.id));
            if (fullySuccessful) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Preserve failed delivery outcome
        if: always() && (steps.ingress.outcome != 'success' || (steps.ingress.outputs.publication_run_id != '' && steps.dispatch.outcome != 'success'))
        run: exit 1

      - name: Write exact wake source selectors
        id: wake_pointer
        if: always() && (steps.repair_observation.outputs.comment_id != '' || steps.wake_source.outputs.comment_id != '')
        uses: actions/github-script@v7
        env:
          AIOS_ISSUE_ID: ${{ steps.repair_observation.outputs.issue_id || steps.wake_source.outputs.issue_id }}
          AIOS_ISSUE_NUMBER: ${{ steps.repair_observation.outputs.issue_number || steps.wake_source.outputs.issue_number }}
          AIOS_COMMENT_ID: ${{ steps.repair_observation.outputs.comment_id || steps.wake_source.outputs.comment_id }}
          AIOS_WAKE_SOURCE_PATH: ${{ runner.temp }}/aios-wake-source/source.json
        with:
          script: |
            const fs = require('fs');
            const pointer = {version: 1, source_kind: 'comment', issue_id: Number(process.env.AIOS_ISSUE_ID),
              issue_number: Number(process.env.AIOS_ISSUE_NUMBER), comment_id: Number(process.env.AIOS_COMMENT_ID)};
            if (![pointer.issue_id, pointer.issue_number, pointer.comment_id].every(n => Number.isSafeInteger(n) && n > 0)) {
              throw new Error('Invalid exact wake source selector');
            }
            fs.mkdirSync(require('path').dirname(process.env.AIOS_WAKE_SOURCE_PATH), {recursive: true});
            fs.writeFileSync(process.env.AIOS_WAKE_SOURCE_PATH, JSON.stringify(pointer), 'utf8');
            core.setOutput('ready', 'true');

      - name: Export bounded wake source selectors
        if: always() && steps.wake_pointer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aios-wake-source-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-wake-source/source.json
          if-no-files-found: error
          retention-days: 90

  # One existing executorless transport, inside the originating GitHub attempt.
  # Runtime independently checks exact current authority and its delivery journal.
  repair_dispatch:
    needs: deliver
    if: needs.deliver.outputs.repair_route == 'EXECUTORLESS_READY' && needs.deliver.outputs.repair_receipt == 'success'
    uses: ./.github/workflows/aios-self-hosted-repair-wakeup.yml
    with:
      repair_dispatch_id: ${{ needs.deliver.outputs.repair_dispatch_id }}
      failed_run_id: ${{ needs.deliver.outputs.failed_run_id }}
      repair_sha: ${{ needs.deliver.outputs.repair_sha }}
      executor: ''

  repair_receipt:
    needs: [deliver, repair_dispatch]
    if: always() && needs.deliver.outputs.repair_sha != '' && needs.deliver.outputs.repair_route == 'EXECUTORLESS_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check .
      - name: Update originating Issue with actual REPAIR job outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_REPAIR_DISPATCH_ID: ${{ needs.deliver.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ needs.deliver.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ needs.deliver.outputs.repair_sha }}
          AIOS_DOWNSTREAM_RESULT: ${{ needs.repair_dispatch.result }}
        run: >-
          python -m aios_renew.github_issue_repair_wakeup --mode workflow-receipt
          --receipt "$RUNNER_TEMP/aios-repair-observation.txt" --phase completed
          --route EXECUTORLESS_READY --route-reason READY --downstream-result "$AIOS_DOWNSTREAM_RESULT"
      - name: Preserve failed REPAIR delivery outcome
        if: always() && needs.repair_dispatch.result != 'success'
        run: exit 1
