name: AIOS Brain Issue Ingress

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: aios-brain-ingress-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event.issue.title == '[AIOS BRAIN INGRESS]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewed repository package
        run: python -m pip install --disable-pip-version-check .

      - name: Deliver immutable Issue event once
        id: ingress
        continue-on-error: true
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
        run: |
          python -m aios_renew.github_issue_ingress --event "$GITHUB_EVENT_PATH" --policy .ai/brain-ingress-carriers.yaml --repo . --output "$GITHUB_OUTPUT" > "$AIOS_RECEIPT_PATH"

      - name: Dispatch safe publication once
        id: dispatch
        if: steps.ingress.outcome == 'success' && steps.ingress.outputs.publication_run_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AIOS_RUN_ID: ${{ steps.ingress.outputs.publication_run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aios-auto-publish.yml',
              ref: 'main',
              inputs: {
                run_id: process.env.AIOS_RUN_ID,
              },
            });

      - name: Dispatch safe REPAIR wakeup once
        id: repair_dispatch
        if: steps.ingress.outcome == 'success' && steps.ingress.outputs.repair_sha != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AIOS_REPAIR_DISPATCH_ID: ${{ steps.ingress.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ steps.ingress.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ steps.ingress.outputs.repair_sha }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aios-self-hosted-repair-wakeup.yml',
              ref: 'main',
              inputs: {
                repair_dispatch_id: process.env.AIOS_REPAIR_DISPATCH_ID,
                failed_run_id: process.env.AIOS_FAILED_RUN_ID,
                repair_sha: process.env.AIOS_REPAIR_SHA,
                executor: '',
              },
            });

      - name: Post bounded transport receipt
        if: always()
        uses: actions/github-script@v7
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
          AIOS_INGRESS_OUTCOME: ${{ steps.ingress.outcome }}
          AIOS_DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          AIOS_PUBLICATION_RUN_ID: ${{ steps.ingress.outputs.publication_run_id }}
          AIOS_REPAIR_DISPATCH_OUTCOME: ${{ steps.repair_dispatch.outcome }}
          AIOS_REPAIR_DISPATCH_ID: ${{ steps.ingress.outputs.repair_dispatch_id }}
          AIOS_FAILED_RUN_ID: ${{ steps.ingress.outputs.failed_run_id }}
          AIOS_REPAIR_SHA: ${{ steps.ingress.outputs.repair_sha }}
        with:
          script: |
            const fs = require('fs');
            const ingressOutcome = process.env.AIOS_INGRESS_OUTCOME;
            const dispatchOutcome = process.env.AIOS_DISPATCH_OUTCOME;
            const publicationRunId = process.env.AIOS_PUBLICATION_RUN_ID || '';
            const publicationRequested = Boolean(publicationRunId);
            const dispatchAccepted = dispatchOutcome === 'success';

            const repairDispatchOutcome = process.env.AIOS_REPAIR_DISPATCH_OUTCOME;
            const repairDispatchId = process.env.AIOS_REPAIR_DISPATCH_ID || '';
            const failedRunId = process.env.AIOS_FAILED_RUN_ID || '';
            const repairSha = process.env.AIOS_REPAIR_SHA || '';
            const repairRequested = Boolean(repairSha);
            const repairAccepted = repairDispatchOutcome === 'success';
            const fullySuccessful = ingressOutcome === 'success'
              && (!publicationRequested || dispatchAccepted)
              && (!repairRequested || repairAccepted);

            let receipt = 'AIOS BRAIN INGRESS RECEIPT\nstatus: FAIL\nreason: carrier produced no receipt';
            try {
              receipt = fs.readFileSync(process.env.AIOS_RECEIPT_PATH, 'utf8').trimEnd();
            } catch (_) {}

            if (ingressOutcome === 'success' && publicationRequested) {
              if (dispatchAccepted) {
                receipt += [
                  '',
                  '',
                  'publication_dispatch: ACCEPTED',
                  'dispatch_accepted: true',
                  `publication_run_id: ${publicationRunId}`,
                  'detail: GitHub accepted safe publication dispatch; this is not publication success or verdict.',
                ].join('\n');
              } else {
                receipt += [
                  '',
                  '',
                  'publication_dispatch: REJECTED',
                  'dispatch_accepted: false',
                  `publication_run_id: ${publicationRunId}`,
                  'reason: GitHub did not accept safe publication dispatch.',
                ].join('\n');
              }
            }

            if (ingressOutcome === 'success' && repairRequested) {
              if (repairAccepted) {
                receipt += [
                  '',
                  '',
                  'repair_dispatch: ACCEPTED',
                  'dispatch_accepted: true',
                  `repair_dispatch_id: ${repairDispatchId}`,
                  `failed_run_id: ${failedRunId}`,
                  `repair_sha: ${repairSha}`,
                  'detail: GitHub accepted safe REPAIR dispatch; this is not repair execution, verification, semantic review, publication, or TASK resolution.',
                ].join('\n');
              } else {
                receipt += [
                  '',
                  '',
                  'repair_dispatch: REJECTED',
                  'dispatch_accepted: false',
                  `repair_dispatch_id: ${repairDispatchId}`,
                  `failed_run_id: ${failedRunId}`,
                  `repair_sha: ${repairSha}`,
                  'reason: GitHub did not accept safe REPAIR dispatch.',
                ].join('\n');
              }
            }

            receipt = receipt.replaceAll('\0', '?').slice(0, 3500);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: receipt,
            });
            if (fullySuccessful) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Preserve failed delivery outcome
        if: always() && (steps.ingress.outcome != 'success' || (steps.ingress.outputs.publication_run_id != '' && steps.dispatch.outcome != 'success') || (steps.ingress.outputs.repair_sha != '' && steps.repair_dispatch.outcome != 'success'))
        run: exit 1
